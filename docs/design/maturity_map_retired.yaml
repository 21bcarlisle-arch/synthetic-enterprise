# THE MATURITY MAP'S RETIREMENT REGISTER — why an atom that was in the map is not in it now.
#
# THE MAP IS TWO FILES AND THIS IS NOT A THIRD. `maturity_map.yaml` (atoms with somewhere to go)
# and `maturity_map_closed.yaml` (atoms at or above their own target) TOGETHER are the map;
# `tools/maturity_map_store.load_atoms()` returns their union and nothing here is an atom. This
# file is a plain MAPPING of `atom_id: reason`, deliberately a different YAML shape from either
# half, so no reader that line-scans for `- id:` or concatenates the halves can mistake it for
# part of the map.
#
# WHY IT EXISTS. Every control over the map is written `for atom in atoms` — the five facet
# checks, the level gate, the draw, the coherence gate. A control shaped that way has the
# REGISTER as its subject set, so an atom in neither the map nor anything that names it is the
# subject of nothing. Measured 2026-09-05: delete a leaf atom (175 of 314 are named by nothing in
# `depends_on`/`couples_with`/`blocked_on`) and every check returned zero violations. The map's
# protection was the ACCIDENT of an atom being referenced, which is not a control.
#
# AND IT HAD ALREADY FALLEN. Over the map's 1,023 committed revisions the union of both halves
# shrank in exactly three commits, losing 22 atoms — every id below. Twenty of those are argued at
# length in the commit that removed them. Two are not mentioned anywhere at all. Nothing in the
# map, and no reader of it, could tell the difference.
#
# HOW THE GATE USES IT. `tools/level_promotion_gate.py` compares the map's atom-id set at HEAD
# against the staged one. An id that has gone needs a row HERE naming what took it out; without
# one the commit is REFUSED. There is deliberately NO exception for "the work no longer exists" —
# an atom genuinely abolished and a map quietly losing a row are the same observation from the map
# alone, and only an authored sentence separates them.
#
# THIS FILE IS APPEND-ONLY, with exactly one way to remove a row: the atom came BACK. A row may be
# deleted only in a commit whose staged map contains that id again. That terminates what would
# otherwise be a regress (a retirement reason for retiring a retirement reason) without granting a
# free pass: there is no other honest reason to erase the record that an atom existed.
#
# THE ROWS BELOW ARE HISTORICAL and inert to the gate — the gate's baseline is HEAD, and none of
# these are in HEAD's map. They are here because the record of why they went lives only in a git
# commit message, which no reader of the map consults. Recovered 2026-09-05 by walking every
# revision of both halves.

# ── 7d01fffba, 2026-08-08 ────────────────────────────────────────────────────────────────────
# NO REASON WAS EVER RECORDED. The commit is titled "C15: floor derive_supply_start at the
# account's own first observable" and its message does not mention either atom. Two atoms left
# the map as an unremarked side-effect of a commit about something else, and this is the case the
# gate above exists to make impossible. The sentence is not invented here: what is recorded is
# that nothing was recorded.
D6a_ageing_gap_metric_reshape: >-
  Removed by 7d01fffba (2026-08-08) with NO stated reason — the commit was about
  derive_supply_start and does not mention this atom. Recovered into this register 2026-09-05;
  why it went is not established, and no plausible reason is supplied in its place.
D6b_ambiguous_remittance_misdating: >-
  Removed by 7d01fffba (2026-08-08) with NO stated reason — same commit, same silence. Recovered
