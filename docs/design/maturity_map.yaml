  # that name this atom sit under `tests/tools/`, outside it.
  file_scope: [site, tests/tools/test_site1_proof_citations_resolve.py,
    tests/tools/test_site1_proof_crawlability.py]
  simplifications_count: 15
  expert_hour: {status: attempted_finding_open, last: '2026-07-29 cold-eyes skeptic-veteran pass (25-yr UK energy retail persona: settlement, credit & collections, regulatory reporting), priors-committed-before-pixels, run against the LIVE site not the source. VERDICT: FAIL -- does NOT pass a genuine expert inspection. Reviewer summary: fails on PRESENTATION, not substance -- the machinery underneath is better than the shop window, and it is ~2 days from passing. Single most damaging finding = BLOCKER-1 (see findings). Level HELD at 2; no L3 self-certification, because the atom''s own DoD is a genuine Expert Hour across all doors and that Hour returned FAIL. A second cold-eyes pass (forensic numbers auditor, cross-surface reconciliation) was dispatched in the same tick.', findings: ['BLOCKER-1 segment-mix undisclosed: the /company/ finance panel LEADS with ''Net margin / customer GBP 26,909.56'' and ''Revenue / customer GBP 67,578.98'', correctly clock-labelled (2025 / billed) and correctly divided by 19 -- over a book that is 98.75pct I&C revenue (VERIFIED independently from the live /data/dashboard.json segment_annual: i&c_electricity 85.68pct + i&c_gas 13.06pct = 98.75pct, from 5 of 19 accounts; residential = 0.88pct from 14 accounts). Every narrative surface is residential (front door 0 occurrences of I&C, /world/ 0, /proof/ 0). Read cold, the site promises a household carbon business and reports ~GBP 26.9k net margin per household, ~450-1000x real domestic figures. The clock is labelled on every figure and the SEGMENT on none. Smallest fix: split per-customer tiles by segment (cost_to_serve.by_segment ALREADY carries resi n=14 / ic n=5) and state the revenue mix before the mission claim.', 'BLOCKER-2 benchmark-shopping: /data/world.json anchors rate ''Churn rate (long-run)'' sim 5.5pct vs benchmark 13.6pct (Ofgem) ratio 0.4 as GREEN, justified by note ''SIM portfolio is predominantly I&C (B2B contract churn) vs Ofgem residential switching'' -- i.e. the book declares itself I&C exactly where a residential benchmark is missed by 2.5x, while the mission/score/personalisation thesis and the drill-down all require it to be residential. The single disclosure of true composition sits in a note field where it functions as an excuse. Classification must be picked once and held everywhere.', 'MAJOR-3 the predictions ledger cannot record a miss (R15 breach on a published surface): /data/proof.json predictions -- renewal graded 0, inconclusive 4 (all four the SAME cid C9 prediction logged on consecutive days, each excused ''not counted as a miss''); hedge graded 1 of 26 with all 26 recommendations the identical string INCREASE and 25 excused ''ungraded -- market data has not advanced''; retention logged 0. On the door billed as the page an expert checks first, no prediction can ever be wrong. Also pads log_entry_count by counting one prediction 4x.', 'MAJOR-4 bad debt published twice, 129.6x apart, and a negative rate rated AMBER (VERIFIED independently from live dashboard.json): SUM(financial.annual[].bad_debt_gbp) = 3,491.86 (0.018pct of revenue) vs financial.ledger.bad_debt_gbp = 452,575.76 (2.40pct) -- both feed the same doors with no bridge, while net margin DOES get a bridge. Annual series carries negative bad debt in 2020 (-18.26), 2024 (-36.68), 2025 (-0.0), and world.json anchors rate ''Bad debt rate (2025)'' sim ''-0.0pct'' as AMBER. A non-positive bad-debt rate is a broken figure, not a calibration nudge; rating it AMBER treats a sign error as a near-miss.', 'MAJOR-5 implausible net margins with no plausibility band, and margin absent from the anchors register (VERIFIED: annual net_margin_pct 2018 = 16.94, 2019 = 14.24, 2024 = 11.48; segment_annual 2018 i&c_electricity = 24.17). Ofgem''s default tariff cap allowed ~1.9-2.4pct EBIT and real domestic supply margins ran -2 to +4pct; I&C supply is thinner still, so a 24.17pct net margin on an I&C electricity book is the least believable ratio on the site. The anchors register benchmarks churn, bad debt, complaints and arrears -- but NOT margin, i.e. the one metric where R12''s plausibility band matters most is the one with no anchor.', 'MAJOR-6 2025 is a 5.2-month stub rendered as an annual figure: world.json sim_window is ''2015-11-07 to 2025-06-07'' and that string renders on NO page. The 2025 annual row (revenue 1,284,000.63 vs 2024''s 2,994,378, bills_count 66 vs 153-205) reads as a 57pct collapse, and /company/ renders a full-year ''Corp. tax 2025'' of GBP 127,820 on 5.2 months of trading. No page carries ''part year'' / ''partial'' / ''to June 2025''. The clock is labelled meticulously; the PERIOD is not, and for annual accounts the period is half the basis.', 'MAJOR-7 evidence citations that are inert by construction (VERIFIED independently): the /proof/ rule/correction timeline renders sources as <a class=evlink href=# onclick=return false> -- 10 such anchors in the served HTML, using the SAME class as genuinely live evidence links. The cited paths are not published: /docs/review_gates/done/HEDGE_VOLATILITY_LOOKBACK_FORESIGHT_BUG.md -> 404, and that is the source for COR-1, the flagship retraction. On a page whose proposition is ''walk any figure to its evidence'', styling a dead citation as a link trains a reader to distrust the real ones. FIXED THIS PASS (partial): the latent ./data/margin_bridge.json -> ../data/ path defect.', 'MAJOR-8 provenance that can never disagree (FIXED THIS PASS): 6 published JSONs (company, proof, world, method, capabilities, saas_coverage) carried the literal git_commit ''latest'', derived from parsing the run FILENAME run_output_latest.json. Textbook fail-open -- satisfies any presence check forever, can never contradict a claim, breaking the audit chain at its root. Separately still open: fidelity.json (the strongest artefact on the site, and the only file with a real SHA) is 10 days stale (generated_at 2026-07-19T13:10:58Z) and decisions.json likewise feeds /company/ and /director/ at 10 days old, with no rendered age disclosure.', 'MINOR-9 all evidentiary content is JS-only with no <noscript> fallback; /glossary/ is 305 rendered chars from 8,696 B (its whole body is two Loading... nodes). The reviewer correctly verified this is NOT a real gap -- all 17 JSON endpoints return 200 with real payloads -- but sitemap.xml 404s while robots.txt invites normal indexing, so a non-JS crawler indexes ''Loading...'' as the content of the evidence pages.', 'MINOR-10 the claim-status vocabulary cannot say ''we chose this number'': /proof/ renders VERIFIED / PROVISIONAL / PLANNED / RETRACTED -- missing chosen-not-derived and external-benchmark, both of which SITE_CONSTITUTION rule 6 names. Yet the site is full of chosen constants (renewal_tolerance_pct 0.02, var_limit_pct_of_term_revenue 0.15, the 154-row assumption library sim_value column, DCA 20pct recovery / 15pct commission). A constant someone typed and a live measurement still settling are not the same epistemic object.', 'MINOR-11 (reviewer-labelled INFERRED, not observed) the time-expiring honesty claims in proof.json not_proven carry fixed prose with no numeric binding, unlike neighbouring blocks which carry counters/sources -- so if authored rather than computed they go silently false the first time a contact is recorded. SITE_CONSTITUTION rule 7 requires exactly these to be data-driven. Needs a source-side check, not a fetch.', 'MINOR-12 (interpretation INFERRED) company.json trading_risk.wholesale: collateral_held_gbp 0.0 against margin_outstanding_gbp 1,392,351.10, margin_calls 7, bilateral_count 58, distinct_counterparties 12. Direction of margin_outstanding is unstated; if owed BY the company, no counterparty runs 58 bilaterals with a 19-customer supplier without CSAs/parent guarantees/LCs/prepayment. Either model credit support or register its absence as a named simplification.', 'CREDITED AS GENUINELY STRONG (so the verdict is calibrated, not reflexive): R14 is really implemented -- every KPI tile carries its clock at render time. A real settled-vs-billed bridge exists (gap 4,903,163.73, gap_ratio 4.22x, dominant_item named, unexplained_remainder 0.0, VAT excluded from both sides and said so, evidence link live 200) -- most real suppliers cannot produce this internally. The N=19 book-size caveat is already published verbatim INCLUDING the director''s own objection against itself. fidelity.json publishes its own model''s worst failures as critical (negative-price frequency 0.013pct model vs 2.241pct real = 172x, n=157,106, with a technically correct structural cause) -- the most credible artefact on the site. Three dated retractions with was/now. not_proven includes ''Any real tonne of CO2 has been abated -- not proven''. /director/ is honest that it is NOT auth-gated (noindex + off-nav, and it says a client-side PIN would be theatre) -- the brief''s premise that it is gated was WRONG and the page itself says so. Units checked and cleared (0.1451 renders as 14.5pct).']}
  real_world_twin: "an energy supplier's public trust/transparency portal an expert or regulator would actually audit"
