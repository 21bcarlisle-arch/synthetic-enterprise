- id: D22_ageing_ordinal_is_one_directional
  name: "The W2_11<->D5 triad's AGEING dimension publishes an ORDINAL headline -- `mean_bucket_displacement`, the term that exists so the dimension can ''distinguish off-by-one from stone-blind, which an error rate cannot'' -- taken over the TRULY-OVERDUE population alone, so no amount of OVER-ageing can move it. Measured 2026-08-10 (H27 Expert Hour #6, n=4000, seeds 7/11/23): a company that dates every truly-overdue invoice perfectly and dumps its ENTIRE truly-current book into `90+` scores 0.000000 -- bit-identical to a company that dates every invoice right, with 10,758 cases changed -- and so does one that over-ages every current invoice by exactly ONE bucket. The over-ageing direction is not invisible to the DIMENSION (`overstated_arrears_rate` counts it) but it is invisible to the ORDINAL term, which is the whole of what this dimension adds over a rate; in that direction the measure degrades to the error rate it was built to replace, and the distinction between a 30-60 and a 90+ wrongful ageing -- different collections paths in a real supplier -- is unavailable. NOT COVERED BY A SIBLING: D16 measured that detection's false_flag_rate is a different quantity over a different population, so nothing in this instrument sees over-ageing SEVERITY. THIS ATOM IS THE RESHAPE (a headline covering both directions), which moves a published number on every pair calling `ageing_gap` and is therefore a mint rather than a fix on sight. Already landed under H27's Hour: the class control HEADLINE_DIRECTION_COVERAGE (every published dimension's own indiscriminate degenerate, scored through its own shipped scorer, keyset DERIVED from what is published so the detection-keying that let this class escape twice is gone), and the mirrored term `mean_overstatement_displacement` + `ordinal_direction_caveat` stamped AT SOURCE in gap_metric so every caller gets the severity the headline cannot express."
  lane: D_billing_metering
