- id: D19_belief_gap_is_distribution_only
  name: "The W2_11<->D5 triad's BELIEF dimension is a total-variation distance between two population severity DISTRIBUTIONS, so it is blind to which account holds which belief: permuting the company's per-case arrears-severity labels among cases takes per-case agreement 0.9287 -> 0.6432 and moves the published gap 0.0713 -> 0.0713, identical to machine precision (4000 customers, seed 7; seeds 11/23 agree at n=600). The degenerate strategy that scores what the real company scores is 'get the population MIX right and every INDIVIDUAL wrong' -- the same dual-degenerate class D11/D12/D14/D15 closed across the four DETECTION dimensions, which their register could not sweep because it is keyed to detection scorers. It hid because on a book whose belief errors run ONE WAY (this company under-calls severity: normal 443->485, watch 114->87, high 36->25) TV is ARITHMETICALLY EQUAL to the per-case disagreement rate -- 0.0700/0.0700, 0.1033/0.1033, 0.0733/0.0733 at seeds 7/11/23 -- so the number reads as a per-case error rate and numerically is one, while being a quantity a permutation leaves untouched. Give the dimension a per-case shape, or declare in the published note that the aggregate is all a reader may take from it. NOT fixed on sight: it moves a published number on all three pairs that call belief_gap (W2_11<->D5, W2_4<->C6, couple_cohort). Acceptance is already measurable: the AGGREGATE_SCORING_CONTRACT permutation sweep must come out MOVED for this dimension, and the shape is known twice over (copy the detection dimension's set-membership scoring, or D7's per-case denominators)."
