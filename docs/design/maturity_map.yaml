  # 20 passed (d), tests/simulation/test_opening_book_subset.py 29 passed. Authorised by the
  # EXISTING ledger row -- no new authority was minted for this; `gate_authorizations.jsonl` has
  # carried a valid `level: 2` self-certification for this atom since 2026-08-25.
  # THE LESSON, because it cost three ticks: a back-out comment states a cause, and a cause can be
  # CURED by a lane that never reads the comment. This note went stale the moment the C1b branch
  # landed, and every draw of PB3 after that re-derived a wedge that no longer existed. A blocker
