  build_note: "BUILT 2026-08-09 (worker tick), L0->L2. THE MINT SAID THIS WAS TWO JOBS WANTING DIFFERENT WORK, AND IT WAS RIGHT -- job (1) built, job (2) refused a build and given the DISCOVER it asked for. (1) THE CELL GRID IS TWO-DIRECTIONAL. `score_detection_by_partition` and `detection_cell_measurements` now score via `detection_measures`, both directions on their own PER-CELL denominators. NO DENOMINATOR WAS INVENTED, which is the whole reason this half was buildable and the other was not: the negative population is the SAME `never_flaggable` set the D11 headline uses (cash arrived on or within the reconciliation grace), and because that is a per-RECORD property, splitting it by regime is arithmetic rather than a modelling choice. `_detection_sets_by_partition` now returns universe + negatives per partition alongside truth + flagged. (2) THE BAND WAS RE-DERIVED IN THE SAME CHANGE, as the origin_note required, and this is where the real defect was. The lit cell moved 0.1031 -> 0.0584 (seed 3; 0.0861 -> 0.0485 seed 7) with NO change in company behaviour -- a 43% apparent fidelity improvement that is purely the new measure, because the balanced headline averages a 0.1031 miss rate with a 0.0136 wrongful-dunning rate. The G1 gate is STRUCTURAL (provenance / ablation / negative-cell), not a numeric threshold, so nothing flipped red-to-green; the actual hazard was the G2 LEDGER, a TIME SERIES the Proof door reads in which `detection_gap` is one field name that has now carried two different measures. Every record therefore names its own `detection_measure` (`recall_only` vs `both_directions`), and a record declaring the two-directional measure while omitting the two directions RAISES. The recall-only label stays the DEFAULT deliberately -- the single-cell collapse path did not change and relabelling it would be the cheapest way to make the register look paid. Both direction rates plus D10's `n_excluded`/`exclusion_reason` now travel into the ledger with the headline instead of dying in a docstring. (3) THE REGISTER: `score_detection_by_partition` flips to counts_both_error_directions=True with debt_atom None; the two self-rationing entries keep their recall-only declaration and re-point to the newly-minted D13. R15, mutating the source: flag-EVERYTHING through the REAL entry point (not a re-implementation) now scores every cell > 0 with false_flag_rate == 1.0 where it used to score a perfect 0.0; collapsing the excluded cases back into the negatives -- D11's tenfold error -- must move the measured rate 5x or the exclusion is a no-op; a cell with no never-flaggable cases goes DARK rather than fail-open to the recall half; the manual-reconstruction independence test now rebuilds the NEGATIVE set by hand and asserts it is a strict subset of universe-minus-truth, so it would fail against a scorer that made D11's error. The lie-detector test now picks its recall-only example from the register AT RUNTIME -- it had hardcoded the very entry this atom fixed, which would have turned a fixed dimension into a broken control. R12: nothing was tuned; the number moved because the measure was wrong, and the move is published rather than banked. Tests: 48 in tests/tools/test_couple_w2_11_d5.py, 18 in tests/test_live_fidelity_evidence.py; 128 green across the gap/fidelity/triad suites."
  harden_note: "REGISTERED, NOT ANSWERED: the balanced cell headline inherits D11's open question -- `missed_failure_rate` is structurally 0 on every population this repo scores (reconciliation catches every true failure at due+grace), so the cell gap is currently carried by the wrongful-dunning direction alone. The two directions are now visible separately in the ledger, which is what makes that readable instead of hidden, but a reader treating the balanced cell number as symmetric evidence would be wrong today. The world that would move the miss direction is a WORLD atom, and building one to make the metric look busier is the goal-seeking R12 forbids. ALSO: only ONE cell (A1_G1) lights on the current fixture -- the scenario's due dates sit in the calm regime -- so the two-directional cell grid is proven on one lit cell plus hand-built fixtures, not yet on a live multi-regime run."
