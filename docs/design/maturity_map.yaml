thout probing the draw (tautology) kills 2; a skipped probe failing open kills 1; clock_invisible->[] kills 1; the vacuity floor removed kills 1; unmutated passes 26. R12: --check returns 0 on a 100% harness share (test_a_lopsided_dial_is_reported_and_passes) -- measurability gates, the number never does. Tests: tests/background/test_blocked_atom_visibility.py 26 passed. Stops at L2 (mechanically real, happy path): nothing calls it on a schedule, so the dial moves only when the CLI is run -- digest/pre-commit wiring is L3."]
