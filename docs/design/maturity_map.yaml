h `false_flag_measures` ON ITS OWN WORLD (customer-years, not the triad's payment records) -- flag-EVERYTHING and flag-NOBODY both score 0.5 under all three bases where the retired recall-only metric gave flag-everything a perfect 0.0. Three of four published detection dimensions now count both directions; the one survivor (couple_w2_8_c10, D14) is VACUOUS rather than unchosen, which is D13's finding paying off. (5) FOUND AND FIXED AT BIRTH, NOT AFTER A READER WAS MISLED: `gap_metric.format_detection_summary` hardcoded the payment triad's nouns, so this pair's first render published 'the wrongful-dunning exposure' for a life-event distress rate -- the exact one-name-two-numbers class D16 had just closed one instrument over. The two nouns are now parameters DEFAULTING to the triad's wording (every pre-existing render byte-identical, asserted) and this pair names what it measured. (6) R15, 20 controls, every one a differential: the complement mutation raises, the no-match mutation raises, membership is re-derived from `simulation.life_events` rather than from the sets under test, folding NEITHER back moves the rate 0.0576->0.1661, a company flagging ONE carried-distress year scores 0 false flags while one flagging ONE settled LOW/LOW year scores 1 (and the naive basis cannot tell them apart), an unexplained exclusion raises, and the vacuity guards fire on empty populations. 145 tests green across the pair, the triad, the live path and gap_metric; 857 green across the wider detection/gap/coupled selection. SIZE RATCHET PAID BY LOGGED OVERRIDE, NOT BY TRIMMING (H32's rule): 241->511 lines is the second direction plus three named exclusions; same remedy as the sibling coupler's existing override. L3 NOT claimed: no Expert-Hour pass on the published instrument, and the director has not yet answered the R13 call the atom exists to put to him."

