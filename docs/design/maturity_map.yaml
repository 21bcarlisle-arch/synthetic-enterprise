  title: "The ceiling-before-programme discipline reached R1 and stopped there: R3 and R4 would be built with no bound on what they could possibly be worth"
  gain: "DIRECTOR_CANON_RERANKING_THE_ARC_2026-09-04, WORK THIS CREATES item 5: 'The ceiling-before-programme discipline from EP13 applied to R1-R4 before building', and §3: 'EP13's ceiling measurement was good work and the pattern it demonstrated -- measure the ceiling before the programme rather than after six passes -- should be applied to everything in R1-R4.' MINTED BECAUSE THE COVERAGE IS PARTIAL AND THE UNCOVERED HALF IS THE EXPENSIVE HALF. R1 has its ceiling (tools/r1_inference_ceiling.py, held-out per-cell mean against a max/48 null -- the best possible function of the coordinate, so no estimator can beat it) and R2's bound follows from R1's result rather than needing its own instrument, both recorded in SEAT_FINDING_R1S_INFERENCE_CEILING_IS_AT_THE_NULL_AND_R2_CANNOT_PAY_UNTIL_R1_LANDS_2026-09-04. R3 (the score -- PS/tCO2e, E5) and R4 (products beyond price -- advice, tariff fit, efficiency, solar, heat pumps, time-shifting) have NOTHING: grep over tools/ returns six ceiling instruments, five of them EP13's and one R1's, and none touching either. THE COST OF NOT DOING THIS IS MEASURED, NOT ASSERTED -- it is EP13's own record. That atom ran TWELVE passes without moving off L2; the ceiling discipline arrived at pass seven and RETIRED FIVE CANDIDATE PROGRAMMES (the outage model, the within-day axis, a publishable within-day CCGT proxy, biomass dispatch, and the daily-gas-level rung left undecided rather than falsely retired) -- each of which would otherwise have been built first and measured afterwards. R4 is the larger exposure of the two: it is the biggest unbuilt programme on the map and the mission is unreachable without it (§2 R4), so a programme-sized build with no prior bound is exactly the shape EP13 paid twelve passes to learn. WHAT DONE MEANS: a ceiling instrument per side, each answering 'what is the most this programme could be worth if it worked perfectly' against a stated null, with the honest end published whichever way it falls -- and, per EP13's hardest-won lesson, each one stating whether it is a true CEILING (perfect knowledge of the quantity a real method would approximate, so a negative retires the candidate outright) or a handicapped FLOOR (bounds from below, so a negative retires nothing). Conflating those two is the error EP13's tenth pass made and its eleventh corrected. NOT A NEW RANKING SYSTEM and not machinery about machinery (DIRECTOR_CANON_PRODUCT_AND_MACHINERY §4): the instruments measure the WORLD and the BOOK, which is product work in the canon's own test."
