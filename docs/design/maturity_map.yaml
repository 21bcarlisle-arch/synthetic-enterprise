# DIRECTOR PROGRAMME "Architected out, organic in" (ratified 2026-08-05,
# docs/staging/DIRECTOR_PROGRAMME_ARCHITECTED_OUT_2026-08-05.md). Absorbed into
# the map 2026-08-08 -- the programme had sat 3 days CONSUMED (staged, read) but
# not ABSORBED (no atom, so not drawable): the R17 defect the ruling itself warns
# about. Order MAP -> NET -> KNIFE -> RHYTHM is RULED and strict; it is carried
# here by depends_on, not by prose, so the draw cannot take a KNIFE pass before
# the NET that protects it. Titles/gain follow the plain-words naming law
# (DIRECTOR_RULING_H_LANE_CUT_AND_PLAIN_NAMING_2026-08-05 Ruling 2).
# Several of these belong to the ruled OPS lane, which does not exist on the map
# yet; filed H_harness with pending_lane_move, as H27 does.
# ---------------------------------------------------------------------------
- id: AO1_capability_index
  title: "The list of what we already have"
  gain: "A builder can find an existing capability in seconds, so the cheapest move stops being 'write it again'."
  name: "MAP step 1 -- the reuse surface: one DERIVED row per capability (plain words, status, evidence, empty rows visible) covering the code that exists, per ADVISOR_PROPOSAL_CAPABILITY_INDEX_AND_DEMO_2026-08-04. Derived, never hand-maintained: a hand-written index rots into a second thing to keep in sync and would itself be the duplication the programme exists to kill."
  lane: H_harness
  value_stream: close_to_learn
  epoch: 3
  level_current: 2
  level_target: 2
  loop_stage: build
  dial_inherited: 3
  provenance: director_programme
  depends_on: []
  couples_with: []
  evidence: ['docs/staging/DIRECTOR_PROGRAMME_ARCHITECTED_OUT_2026-08-05.md', 'docs/staging/ADVISOR_PROPOSAL_CAPABILITY_INDEX_AND_DEMO_2026-08-04.md', 'docs/staging/ADVISOR_ADDENDUM_ARCHITECTED_OUT_EDGE_INTEGRITY_2026-08-06.md', 'tools/capability_index.py', 'tests/tools/test_capability_index.py', 'docs/design/CAPABILITY_INDEX.md']
  build_note: "L0->L2 2026-08-08. 837 rows derived from source in ~3s; 24 tests. A1 answered BY CONSTRUCTION -- the index never reads maturity_map.yaml, so it cannot inherit the degraded file_scope/depends_on fields, and no 185-atom field sweep was needed. A3 answered by --orphans (268 orphans, 260 of them in company/, corroborating the July KNIFE target from an independent derivation). R15: five source mutations run, each proving its own guard fires -- vacuity floor, tautology (coverage oracle is `git ls-files`, NOT the walk the rows come from), unparsed-not-skipped, fail-silent oracle. The floor mutation initially left all 23 tests GREEN because the test asserted a VACUITY tag the per-root guard also emits: union-metric blindness INSIDE an R15 test, found only by mutating the source, now witnessed alone. Two real defects the first run exposed and fixed: `--find 'working day'` returned 0 rows for company/compliance/working_days.py (the fail-open that CAUSES the duplicate), and a path-invoked live dispatcher read as an orphan (the false-orphan reading that gets a working mechanism retired)."
  file_scope: ['tools/capability_index.py', 'tests/tools/test_capability_index.py', 'docs/design/CAPABILITY_INDEX.md']
  origin_note: "Programme step MAP, the lowest-risk step and the safety condition for every later one (derived artefact, no behaviour change). R15 IS THE HARD PART, not the derivation: an index is a textbook FAIL-OPEN control -- it passes silently when it under-reports, and an index that misses a capability actively CAUSES the duplicate build it exists to prevent. It therefore needs a vacuity guard (an index that resolves to zero/near-zero rows must FAIL, not read 'nothing to reuse') and a mutation proving a KNOWN-EXISTING capability going missing makes it fire. The edge-integrity addendum (2026-08-06) is filed as this atom's precondition by its own author -- read it before designing the derivation, not after. Do not let this become a demo: the index's SECOND job (the write-time gate, AO2) is the one the director named as the point."
- id: AO2_write_time_reuse_gate
  title: "Check before you build"
  gain: "New code gets written only when nothing existing fits -- and the reason is on the record either way."
  name: "MAP step 2 -- the write-time gate: before a new module/function, consult the index and either extend what exists or RECORD IN THE COMMIT why not. Asks TWO questions, not one -- 'do we already have this?' (the index) and 'does the ecosystem already have this?' under the three ruled part classes: CATALOGUE parts (calendars, timezones, money arithmetic, statistical fitting, solvers) always taken from mature libraries; CUSTOM tooling (GB market mechanics, licence conditions, behavioural archetypes, the wall, the harness) always built, because it is the product; SUBSYSTEMS (dispatch, ledgers) may be custom only with a recorded build-vs-buy note naming the library evaluated and why rejected -- silence is a gap."
  lane: H_harness
  value_stream: close_to_learn
  epoch: 3
  level_current: 2
  level_target: 2
  loop_stage: build
  dial_inherited: 3
  provenance: director_programme
  depends_on: [AO1_capability_index]
  couples_with: []
  evidence: ['docs/staging/DIRECTOR_PROGRAMME_ARCHITECTED_OUT_2026-08-05.md', 'tools/write_time_gate.py', 'tools/git-hooks/commit-msg', 'tests/tools/test_write_time_gate.py', 'docs/design/WRITE_TIME_GATE.md']
  file_scope: ['tools/write_time_gate.py', 'tests/tools/test_write_time_gate.py', 'tools/git-hooks/commit-msg', 'docs/design/WRITE_TIME_GATE.md']
  build_note: "L0->L2 2026-08-08. LIVE, not merely committed (R2): wired at tools/git-hooks/commit-msg, which core.hooksPath already points at -- and commit-msg, NOT pre-commit, because the message does not exist when pre-commit runs, so a pre-commit reading the record would read the PREVIOUS commit's message and pass. That is the fail-open this atom would most plausibly have shipped with. 41 tests; 8 SOURCE mutations, each breaking one guard alone: G1 missing record, G2 class validity, G3 catalogue-without-library, G4 subsystem build-vs-buy, G5 index terms, G6 index-contradiction -- plus TWO on the DETECTOR rather than the guards, since a gate whose detector never fires passes every test while checking nothing (code-root blindness, and the test-file false-positive direction that gets a gate routed around, H19's class). The director's WALL is a TEST, not a comment: test_the_wall_holds gives the same new module and the same index two honest records -- 'extended it' and 'kept it separate, different purposes' -- and requires BOTH to pass, so the gate can never start deciding. G6 is the only guard with an independent source: it puts the record's 'nothing exists' claim back through the live index and refuses a claim the index contradicts, firing on the FALSE-EMPTINESS direction only. Fail-closed four ways (unreadable message, unbuildable index, unknown/unreadable mode word, unreadable git state); absent mode file means gate, so it cannot be disabled by deleting something. SCOPE STATED not silent: modules only, function granularity deferred with reasons in docs/design/WRITE_TIME_GATE.md. Self-proof: this atom's own landing commit carries its own REUSE record and is the first commit the gate checked."
  origin_note: "The ONLY immediate behaviour change in the whole programme (director, section 5) -- so it is the step that actually pays, and the index without it is a demo. Director's own words carry a WALL the mechanism must respect: 'know, then choose -- FORCED REUSE THAT COUPLES TWO PURPOSES IS THE MIRROR ERROR OF DUPLICATION AND IS EQUALLY A DEFECT.' A gate that mechanically refuses a new module is therefore WRONG; the gate must compel the LOOK and the RECORD, never the reuse decision itself. Evidence class for the ecosystem question, named by the director: the from-scratch working-day calculator of 2026-08-03 built while `holidays`/`workalendar` exist, and the BST/UTC settlement block the same day. Extends DIRECTOR_RULING_SHARED_PRIMITIVES_AND_CODE_STANDARDS_2026-07-28 from primitives to all capability. Dependency discipline: deterministic decade replays mean every new library is pinned and its determinism stated."
