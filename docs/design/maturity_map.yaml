- id: D18_confounder_observable_channel
  name: "W2_8's new drop confounders (D14) are ANSWER KEY: the company cannot see that a household MOVED OUT, that a property stood empty, or that its own ECO scheme insulated the home -- so it false-flags 0.0560 of the settled negative with no way to explain any of it away. A real supplier holds several of those records itself: a change-of-tenancy registration on the account, a void notification, its own install file. Detection here is therefore strictly HARDER than reality and the published false-flag rate is an UPPER bound. Give the C10 detector an OBSERVABLE confounder channel -- with realistic DISCOVERY LATENCY, since the CoT scope brief's point is that nobody is told for weeks or months -- and measure the gap between what a supplier could explain away and what it actually does."
