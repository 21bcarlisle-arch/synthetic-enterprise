- id: D20_belief_truth_rule_is_an_unmeasured_mirror
  name: "The W2_11<->D5 triad's BELIEF dimension publishes its two sides as 'same threshold shape, different-coverage inputs' -- the clause that makes the number a measure of the WALL rather than of two different rules -- and until 2026-08-10 nothing measured it: the truth-side rule (couple_w2_11_d5::_severity_label) is a HAND-COPY of the company organ's own thresholds (_arrears_risk_belief) and no test mentioned it. Three organ-only drifts moved the published headline by up to 2.9x with the world and the truth-side rule untouched; exactly one test fired each time and none named the divergence (two blamed a weak permutation probe or an epistemic-wall leak). CLOSED IN THE SAME TICK by equalising the coverage instead of comparing the rules: on an all-DD counterfactual the company observes every failure, so the surviving residual IS the rule divergence and needs no copy of either rule. Residual 0.000000 at HEAD on seeds 7/11/23, four vacuity witnesses asserted (the healthy reading is a zero), class control sweeping the published text, R15-proven both ways."
