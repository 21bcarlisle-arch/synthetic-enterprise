- id: D21_ageing_truth_side_is_the_organs_own_rule
  name: "The W2_11<->D5 triad's AGEING dimension -- the one whose whole subject is debt DATING -- computed its TRUTH side with the company organ's own function: `from company.billing.arrears_engine import age_bucket as company_age_bucket`, applied to a days-overdue the scenario constructs to be the organ's own integer (world `issue = due - 14`; organ `due = issue_date + 14`). Same rule, same input, so the two sides could not disagree about the bucket of an invoice they both held open: `wrong_bucket` measured 0 at every seed and under every drift tried, by CONSTRUCTION rather than by luck, and an edit to `age_bucket` moved the harness's ground truth with it -- R15's TAUTOLOGY pattern in the direction nobody checks (harness -> company, not company -> sim). Worse than D20's hand-copy, which could at least drift apart and be caught. It hid under a COVERAGE_ONLY_CLAIM_CONTRACT exemption reading ''two different rules, not one rule over two coverages'' while the module's own docstring said ''Both sides use the IDENTICAL bucket function'' -- the control believed the exemption, so the one mechanism able to catch the D20 class was switched off for the dimension with the strongest mirror of the three. CLOSED IN THE SAME TICK: the rule is harness-owned (`_ageing_bucket`), resolved through a TRUTH_SIDE_RULE_OWNERSHIP register that is the CALL PATH rather than a declaration, with a class control refusing any truth-side labelling rule owned by `company.*`; ageing enrolled in the coverage-only control (residual 0.000000 at HEAD on seeds 7/11/23, non-vacuous; an organ-only 60->75 dating drift takes it to 0.3627/0.3194/0.3333). R12: no published number moved, and the mutation that reinstates the defect moves none either -- which is exactly why ownership, not a value, is what the control checks."
