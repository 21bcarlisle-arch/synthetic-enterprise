    random.Random(seed) OUTSIDE the bill loop and iterate bills sorted by (customer_id, period_end),
    so the draws any customer receives depend on how many draws every alphabetically-earlier customer
    consumed. C-S2 requires each subsystem to draw from its OWN named seeded substream precisely so
    "a new draw never shifts another's outputs"; this predates the SME atom (I&C already draws from
    the shared stream) and was not introduced by it.
