- id: D23_organ_query_grid_cannot_resolve_latency
  name: "The W2_11<->D5 triad's DETECTION_LATENCY dimension -- the one whose whole subject is HOW LATE the company learns a payment failed -- reads its reconciliation first-knowledge date by asking the company's organ on a grid of candidate dates the HARNESS builds from the organ's own rule (`candidates = {due_date + reconciliation_grace_days}`, one per period). Its docstring claims the opposite in as many words: 'asked of the organ itself, never re-derived here (R15 independence -- a harness re-implementation of `due + grace` would be a tautology that could not fail if the organ's rule changed)'. The organ IS asked; it is asked at exactly one date per period, and that date is the harness's re-derivation. Independent in FORM, tautologous in VALUE. Measured 2026-08-10 (H27 Expert Hour #7, n=300/600, seeds 7/11/23, via the declared organ_reconciliation_drift_days counterfactual -- world and every truth-side rule untouched): `recon_lag_days` is the CONSTANT 5 for all 204 dated cases, which is `reconciliation_grace_days`, a harness input parameter echoed back. IMPROVEMENT IS INVISIBLE WITHOUT BOUND -- an instant reconciler, and one that flags an invoice a fortnight BEFORE it is due, both publish 5.0, so `mean_lag_days_without_dd_channel` (the counterfactual arm the docstring calls 'the whole point of the dimension') is not a reading of the company at all and `dd_channel_days_earlier` is that constant minus the DD lag; not one test in the repository fires on any improvement drift. DEGRADATION IS QUANTISED TO 21 DAYS (`PERIOD_SPACING_DAYS`) -- a one-day-later detector misses its only candidate and is next dated at the NEXT period's, so +1d is published as +21.0d and +1/+7/+21 are bit-identical; the last period has no later candidate and its cases leave the population entirely (undated 0 -> 59). Seven tests fire on a +1d organ mutation and NOT ONE names latency. THIS ATOM IS THE RESHAPE (a candidate grid with a real resolution), which moves a published number on every pair calling the scorer and is therefore a mint rather than a fix on sight. Already landed under H27's Hour: the class control ORGAN_QUERY_GRID + measure/check_organ_query_grid_resolution (each grid reading declares which company drifts it can and cannot see, re-measured every run and in the CLI, differential across a date reading and a set-membership reading, R15-proven on an inert probe, a repaired grid and an unowned declaration), the declared organ_reconciliation_drift_days counterfactual, and the resolution caveat + step stamped AT SOURCE in detection_latency_gap so all three coupled pairs carry it."
  lane: D_billing_metering
  value_stream: meter_to_cash
