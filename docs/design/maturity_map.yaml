  simplifications_count: 0
  evidence: [simulation/sme_distress.py, simulation/segment_debt_obligation.py, tools/segment_case_guard.py]
  notes: >-
    Queued per SELF-INTERRUPT DISCIPLINE from the W2_sme_segment_case_normalisation build
    (2026-08-08), NOT fixed on sight -- out of that atom's file_scope and needs its own analysis.
    LATENT, not live: every current caller passes a canonical spelling, so nothing is mis-billed
    today. Three findings. (1) simulation/sme_distress.py:112 BUSINESS_SEGMENTS = ("SME","I&C") is
    compared case-SENSITIVELY at :212, and :351 RAISES on a non-match -- so a lower-case "sme"
    would crash the twin rather than mis-route it. tools/segment_case_guard.py CANNOT catch this
    shape: the literals are canonical, so there is nothing non-canonical to flag; the defect is in
    the comparison, which needs dataflow the AST scan does not do. Say so rather than let the
    guard's green read as coverage it does not have. (2) simulation/segment_debt_obligation.py
    keeps its own case-insensitive label sets (_norm lower-cases first, so it is correct by
    construction and deliberately exempt) and EMITS 'resi'/'sme'/'iandc' as the company's OBSERVED
    vocabulary. (3) 'iandc' is not an alias in segment_vocabulary._ALIASES, so normalise_segment
    raises on it -- fine while the two vocabularies stay apart, a silent trap the moment anyone
    pipes one into the other. The DISCOVER question is whether these are one vocabulary or three,
    and the honest answer may be three (world-true / company-observed / cohort) that must never be
    coerced -- in which case the work is a named seam, not a merge.
