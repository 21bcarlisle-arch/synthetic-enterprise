  # BACKED OUT FROM 2 TO 0 ON 2026-08-31, AND THE LEVEL IS NOT THE THING THAT WAS WRONG. The `2`
  # sat STAGED in the shared index for 17.9 hours and refused seventeen consecutive publish
  # commits under §0's recorded-but-unbuilt predicate. The refusal is correct and must stay: this
  # atom's `file_scope` names `simulation/run_phase2b.py`, which another lane holds 160
  # uncommitted lines of (the C1b SVT-departure branch), so the level declared a program no
  # commit contained. What makes it a WEDGE rather than one bad commit is that the publisher is
  # the process that carries this file, and the publisher can never carry source -- so no draw
  # priority, however high, could ever clear it. Landing that source instead was measured and
  # refused: `run_phase2b.py` imports `DEPARTURE_OCCASION_SVT_SEGMENT` and
