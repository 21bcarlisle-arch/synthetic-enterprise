- id: D39_a_render_need_not_be_text
  title: "A scaled render, predicted from the carrier and held to the pixel"
  gain: "A sweep searching unscaled literals cannot find a bar whose WIDTH is the figure, and cannot say at what precision it renders -- so a scaled surface stays unexpressed and the door is credited with no site. `_check_scaled_render` does not widen the sweep: it makes the declaration state the scaling, then holds the declaration to the artefact. The predicted literal must be the rendered one on every book, and the precision the scaling implies must be COARSER than the finest precision the same door renders that figure at, or a reader can separate two companies the epsilon calls identical. (Raised Hour #21, answered Hour #27.)"
