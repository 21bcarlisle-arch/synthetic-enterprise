    Mechanism: `test_worker_env_forgery_is_structurally_impossible` scrubs the env, reloads
    background.ntfy_utils to re-read WAKE_HMAC_KEY, then reloads again in `finally` to "restore
    module state for other tests" -- but pytest restores monkeypatched env AFTER the function
    returns, so that second reload re-reads the SCRUBBED env and pins WAKE_HMAC_KEY=None
    process-wide. Same class as the 2026-07 finally-reload/monkeypatch-teardown ordering defect,
    recurring at a new site, which suggests the CLASS closure (an autouse fixture or a
    reload-safe accessor) rather than another instance fix. Nothing to do with H30's change; the
    four failures reproduce with H30's files uninvolved.

    L0->L2 2026-08-08. CLOSED AT THE CLASS as the notes above demanded, not at the instance.
    Instance: `monkeypatch.undo()` before the restoring reload. Class: a new AST-DERIVED registry
    (tests/background/env_constant_sync.py) scans background/*.py for every top-level assignment
    whose RHS is directly an env read, and a `pytest_runtest_teardown(trylast=True)` hook in
    tests/background/conftest.py checks all of them after each test -- failing the CULPRIT by name
    and REPAIRING the constant so victims stop depending on collection order. Derived, not
    enumerated, so a constant added tomorrow is covered without anyone remembering this file.
    Ordering claim VERIFIED empirically in a scratch dir outside the repo (trylast teardown runs
    after monkeypatch's finalizer), not assumed.
    R15 both directions on the LIVE hook, by mutation: reintroduce the finally-reload ->
    "ERROR at teardown of test_worker_env_forgery_is_structurally_impossible" + STALE ENV CONSTANT
    payload, and 33 passed (the four victims now GREEN because of the repair -- previously the
    victims failed and the culprit passed, the misdirection that made this read as "import order").
    Restore the fix -> 33 passed, guard silent. Vacuity guarded: the registry is asserted non-empty
    AND to contain background.ntfy_utils.WAKE_HMAC_KEY, plus an independent grep-vs-AST
    cross-check, so a scanner that quietly matched nothing cannot pass.
    The class guard found a SECOND leaked constant the original report never named
    (background.ntfy_utils.NTFY_TOPIC) -- evidence the class closure was the right shape.
    SELF-CAUGHT during the mutation run: the first draft printed the live SE_NTFY_TOPIC VALUE into
    pytest output -- a guard over the wake-key scrub that would itself leak the signing key into
    CI logs. Values are now redacted to `<str len=N #sha8>` (distinct values stay distinct), pinned
    by test_describe_never_prints_the_secret_it_guards.
    NOT above L2: no HARDEN/Expert-Hour pass, and the scan is deliberately narrow -- it registers
    only DIRECT env reads with literal defaults, so a wrapped read (Path(os.environ.get(...)))
    remains unguarded by design (broad-and-noisy guards get silenced). Widening it is the L3 work.

