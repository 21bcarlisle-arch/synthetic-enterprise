  notes: >-
    BUILT 2026-08-08, L0->L2. `arrears_engine.bill_substream(seed, customer_id, period_end, commodity)`
    is the new contract: a bill's payment outcome is a pure function of its own identity, so it cannot
    depend on iteration order, on how many bills precede it, or on how many draws any other bill or
    subsystem consumes. All FOUR consumers migrated -- compute_emergent_bad_debt, compute_debt_recovery,
    tools.generate_billing_ledger, and simulation.dd_collection_book (the 4th replica, NOT in the
    original file_scope; it was found during the build because it hand-maintained the lockstep
    obligation in a comment, and leaving it on the shared stream would have broken its documented
    agreement with ground truth -- file_scope extended rather than the defect half-fixed).
    THE DEFECT WAS WORSE THAN "FRAGILE" -- it was already BROKEN, which the atom had not established.
    Lockstep was an obligation each consumer had to hand-maintain, and generate_billing_ledger does
    not: it skips the outcome draw entirely for credit invoices (amount <= 0). The real run has 24,
    the first at sorted index 138 of 1557, so the ledger and the P&L drew from offset streams across
    the remaining 91% of bills and DISAGREED ON THE FAILED/DISPUTE DECISION FOR 42 OF THEM. The module
    docstring's central claim ("the ledger and the P&L bad debt figure are now provably the same source
    of truth") was false; it is now true by construction. Post-fix the same measurement gives 0
    disagreements, 0 outcomes changed under shuffled iteration, and 0 outcomes changed when C5/C6 are
    removed entirely (the atom's own named defect, in miniature).
    R15 -- six new controls, each mutation-proven to FAIL on its own named defect: restoring the shared
    stream kills the order-independence, cross-customer-isolation and ledger/P&L-agreement tests;
    dropping period_end from the key kills the distinctness test; concatenating key parts without a
    separator kills the collision test; swapping sha256 for hash() kills the cross-process replay test.
    The pre-existing acceptance test could NOT catch this: faithfully replayed against its own fixture,
    the historical code gives 0 disagreements (no credit invoice, no held bill), versus 13 once one
    real-shaped credit invoice is added -- so a new test carries that exemplar.
    commodity is a REQUIRED key component with no default. It is redundant today (gas is its own
    account, C1g beside C1, so (customer_id, period_end) is unique across all 1557 real bills) but a
    defaulted value would silently collapse an account's two fuels onto one stream the moment dual-fuel
    billing lands -- the same silent coupling this atom removes.
    BASELINE MOVED, as expected for an RNG re-keying (R13: an isolation/architecture fix decided blind
    to company P&L, never tuned toward an outcome). vs committed HEAD: 73 of 1557 invoice payment
    statuses changed, arrears cases 40 -> 41. Three tests rested on the old draws and were repaired,
    not weakened: test_churned_arrears_written_off had gone VACUOUS (its assertion sat behind
    `if arrears_case_count > 0`, which the new draw made 0) and was additionally hiding a stale
    assertion that WRITTEN_OFF be the LAST stage, untrue since the DCA branch landed; the I&C dispute
    fixture was 500 copies of ONE bill, which correctly resolves 500 identical ways now, so it is 500
    distinct bills; the customer-door credit-framing test asserted the LIVE C1 happened to be in
    credit (-63.49 -> 0.00) and now sets the balance explicitly, mirroring its own sign-following
    sibling (R11 live-value coverage is retained by test_money_kpis_render_live_billed_banked_balance).
    CROSS-WORKER FLAG RESOLVED: the untracked test_credit_balance_control.py survives -- C7's longest
    undischarged credit moves 1224 -> 608 days (floor -201.96 -> -202.27), still the material
    multi-year hold its `days > 365` exemplar asserts. That control remains fragile by nature (it
    reads a regenerated ledger), which its own docstring already concedes; not rewritten here, as it
    belongs to another worker's in-flight file.
    ORIGINAL QUEUEING NOTE FOLLOWS.
    Queued 2026-08-08 from the W2_sme_segment_case_normalisation build, with a CONTROLLED measurement
    rather than a suspicion. compute_emergent_bad_debt/compute_debt_recovery create one
    random.Random(seed) OUTSIDE the bill loop and iterate bills sorted by (customer_id, period_end),
    so the draws any customer receives depend on how many draws every alphabetically-earlier customer
    consumed. C-S2 requires each subsystem to draw from its OWN named seeded substream precisely so
    "a new draw never shifts another's outputs"; this predates the SME atom (I&C already draws from
    the shared stream) and was not introduced by it.
    MEASURED, by regenerating the ledger twice in-process with ONLY the SME routing swapped:
    with the fix, resi C7's longest undischarged credit is 32 days / -109.19; without it, 1224 days /
    -202.27. C5/C6 (SME) sort before C7, so their changed draw-count shifted C7. Nothing about C7 is
    wrong -- it is a different valid draw -- but a baseline that moves whenever an unrelated segment
    improves is one no control can rest on.
    CROSS-WORKER IMPACT, flagged not swallowed: the untracked
    tests/company/billing/test_credit_balance_control.py asserts C7 holds a MULTI-YEAR credit
    (days > 365) as the real-world exemplar its R15 control fires on. That premise dies at the next
    ledger regeneration. The committed ledger still has 1224 days, so the test passes at HEAD today;
    it will go red the first time a publish regenerates docs/state/billing_ledger.json. That control
    needs either a synthetic fixture for its exemplar or a different named account.
    Fix shape: give sme_payment_outcome (and ultimately the I&C and resi arms) a per-(customer, bill)
    substream so a bill's outcome depends only on that bill, making non-SME customers byte-identical
    across segment-model changes. Needs a bill discriminator threaded to payment_outcome -- every
    call site already has period_end/period_index in scope.
