  build_note: "BUILT 2026-08-09 (worker tick), L0->L2. Both defects closed AT THE MEASURE, not caveated. (a) POPULATION: `score_triad` now sweeps the company's OWN reconciliation organ at every invoice's due+grace date and unions everything it ever reported, so `flagged_set` is EVER-FLAGGED rather than believed-at-`as_of`. The acceptance criterion the mint named is met and MEASURED, not asserted: sweeping as_of +0/+7/+14/+30/+60/+90 on seed 7 leaves gap, missed_failure_rate and false_flag_rate bit-identical at every date (the old figure walked 0.0725 -> 0.1232), and DIMENSION_AS_OF_CONTRACT['detection'] now declares invariance which its own sweep control measures. (b) DIRECTION: new `background.gap_metric.detection_measures` -- balanced error, the mean of missed_failure_rate (over the truly-failed) and false_flag_rate (over the never-flaggable), each on its own denominator per D7. Flag-nobody and flag-EVERYTHING now both score exactly g0 = 0.5; a perfect detector still scores 0.0; perfectly-wrong scores 1.0. THE SHARED FUNCTION'S CONTRACT WAS LEFT ALONE as this note's origin_note advised: `detection_gap` is untouched, so W2_5<->C7, W2_8<->C10 and the regime CELL grid publish exactly the numbers they did yesterday, and their recall-only shape is REGISTERED as named debt in DETECTION_DIRECTION_CONTRACT with atom D12 rather than left implicit. THE DENOMINATOR WAS THE REAL WORK, and this build got it wrong first: `universe - truth_set` charges the company for flagging invoices that genuinely WERE unpaid past grace and merely got paid later, which inflated the measured wrongful-dunning rate 0.0269 -> 0.2834 (10x). A late-past-grace success, an unresolved dispute, and any record with no `days_late` truth are now EXCLUDED from both populations, counted in `n_excluded`, and the reason travels in the components (D10's published-not-silent rule, mechanised: an unexplained exclusion RAISES). WHAT THE RESHAPED NUMBER SAYS, and it is a different story from the old one: seed 7 balanced error 0.0134 = missed_failure_rate 0.0000 (reconciliation catches every true failure at due+grace, consistent with D10's n_undetected == 0) + false_flag_rate 0.0269 (21 of 782 never-flaggable invoices wrongly flagged -- Clayton's-Case misallocation, atom D8, surfacing as wrongful dunning). ALSO FIXED IN PASSING: a DD failure whose bank-feed report date fell AFTER `as_of` was counted as a detection, crediting the company with knowledge its own bank feed had not delivered -- the detection dimension's own small point-in-time breach. R10 CLASS CLOSURE: DETECTION_DIRECTION_CONTRACT enumerates every published detection-style dimension in the repo and its control MEASURES each declaration by scoring the flag-EVERYTHING degenerate through that entry's own scorer -- two-directional must not score 0, recall-only must, and an unregistered dimension fails. R15, mutating the source both ways: the as_of declaration is now falsifiable in BOTH directions (claiming a clean dimension is dirty fails too, which it could not before); flagging everything through the new measure is proven not to score 0 while the retired one is proven to; collapsing the excluded population back into the negatives must move the score 5x or the exclusion is a no-op; the miss direction is proven able to fire by deleting the reconciliation channel (it is 0 on every population this repo scores, so observation alone would be a control that cannot fail); and every incoherent population -- flag outside the universe, S/N overlap, unexplained exclusion, empty universe -- RAISES. R12: nothing was tuned; the number moved because the measure was wrong, not because it looked wrong. Tests: 42 in tests/tools/test_couple_w2_11_d5.py, 7 in tests/background/test_live_payment_triad.py, 36 in tests/test_gap_metric.py; 2207 green across tests/tools + the fidelity and gap suites. NOT TAKEN TO L3 here: L3 wants the Expert-Hour pass on this reshaped instrument, and the promoter of H27 should run it -- see H27's own note."
  harden_note: "OPEN QUESTION FOR WHOEVER TAKES THIS FURTHER, registered rather than answered: `missed_failure_rate` is 0.0000 on every population this repo currently scores, because expected-collection reconciliation catches every truly-failed invoice at due+grace. That is a real property of this world, not a broken measure -- it is proven able to fire by mutation -- but a direction that is structurally 0 contributes nothing to the headline day to day, so the balanced error is currently HALF a measurement. The world that would make it non-zero is one where a failed invoice can be covered by an earlier ambiguous allocation BEFORE its own grace date. That is a WORLD atom (a payment-timing/allocation depth question), not a metric one, and inventing it to make the metric look busier would be exactly the goal-seeking R12 forbids."
