  # `svt_product.py` (both dirty, both OUTSIDE this file_scope), so landing it alone is an
  # ImportError at HEAD in a module 200+ files import -- the whole suite, not a selection.
  # RE-DECLARE THIS AS 2 IN THE SAME SEAT COMMIT THAT CARRIES ITS SOURCE. The L2 work itself was
  # never in question and nothing about it is retracted here.
  #
  # RE-DECLARED 2 ON 2026-09-03, AND THE BACK-OUT'S OWN CONDITION IS WHAT CLEARED IT. The
  # instruction above says "in the same seat commit that carries its source"; the source landed
  # in ANOTHER lane's commit instead, which satisfies the intent -- the level no longer declares
  # a program no commit contains -- so this commit carries the map alone. Re-measured at HEAD
