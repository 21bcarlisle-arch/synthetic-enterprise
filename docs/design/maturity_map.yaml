that is now recorded in the register rather than left as the comfortable reading: `belief_side_is_as_of_dependent: True` narrows what the exemption excuses to the truth side. (3) THE RESIDUAL IS MEASURED, NOT ASSERTED: ageing's numerator is a STRICT SUBSET of detection's at seeds 7/11/23 and both grace windows (7 of 21, 16 of 31, 5 of 13) -- every case the report still overstates was chased, and 14/15/8 more were chased and then dropped before as_of. R15, and the register was REWRITTEN rather than loosened: the pre-D16 declaration was deliberately exact so this atom would break it, and it did. The new one is exact too (identical sets AND strict subset) and is proven falsifiable on THREE register lies (declare the populations divergent; declare the numerators identical; declare the subset in the wrong direction), plus a vacuity guard so an empty ageing numerator cannot satisfy the subset for free. The band itself is mutation-proven both ways the atom demanded: fold it back into the denominator and the rate MUST move (0.0090 -> 0.0951), and a record whose `days_late` truth is blanked must LEAVE the scored population rather than be assumed paid on time. The phrase sweep learned the lesson its own predecessor was written about: a bare substring counted the honest sentence 'NOT the wrongful-dunning exposure' as publishing it (it did, on this build's first run -- the AO2 `none` shape), so the disclaimer's FORM is registered and doublespeak is proven not to buy an exemption. THE SIBLING HALF WAS NOT LEFT BEHIND THIS TIME: `background/live_payment_triad.py` labelled the same rate 'the WRONGFUL-DUNNING exposure' in both its attributed-measures register and its rendered summary, one file over, and both are corrected under a test that the LIVE ageing dimension carries the band. FOUND AND QUEUED, NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE): `D17_d8_counterfactual_has_no_unattributed_residual` -- the D8 remittance counterfactual's anti-rubber-stamp guard rested on a residual composed entirely of the cases D16 excludes, so every measure it publishes is now 100% attributed and the guard guards nothing. The refuted test is REPLACED (never repaired) and names D17 in its own docstring so it cannot decay into an assumption. 694 tests green across every file touching gap_metric, the triad, or the live path. L3 NOT claimed: no Expert-Hour pass on the corrected instrument, and the tick that renames a published quantity is not the tick to certify it."

- id: D18_confounder_observable_channel
  name: "W2_8's new drop confounders (D14) are ANSWER KEY: the company cannot see that a household MOVED OUT, that a property stood empty, or that its own ECO scheme insulated the home -- so it false-flags 0.0560 of the settled negative with no way to explain any of it away. A real supplier holds several of those records itself: a change-of-tenancy registration on the account, a void notification, its own install file. Detection here is therefore strictly HARDER than reality and the published false-flag rate is an UPPER bound. Give the C10 detector an OBSERVABLE confounder channel -- with realistic DISCOVERY LATENCY, since the CoT scope brief's point is that nobody is told for weeks or months -- and measure the gap between what a supplier could explain away and what it actually does."
