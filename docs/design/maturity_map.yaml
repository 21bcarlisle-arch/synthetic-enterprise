- id: D13_self_rationing_negative_population_discover
  name: "The W2_5<->C7 and W2_8<->C10 self-rationing detection dimensions are still RECALL ONLY -- a company that flagged EVERY household scores each a perfect 0.0. They cannot be fixed the way D12 fixed the payment cell grid, because `detection_measures` needs the cases a flag would be WRONG on and 'a household that is not self-rationing' is a continuum the harness labels by THRESHOLD, so that denominator is a modelling choice rather than a set already in hand. DISCOVER whether a settled-fact negative population exists for self-rationing at all -- and accept 'no second direction is publishable here' as a legitimate finding."
