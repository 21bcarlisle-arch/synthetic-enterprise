e left its arrears view by as_of, and 0 of 347 in the counterfactual -- a real arrears case disappearing from the view that would have pursued it, 100% attributable. Filed as its own finding (docs/staging/WORKER_FINDING_EVER_FLAGGED_IS_BLIND_TO_UN_KNOWING_2026-08-09.md). R15, FIVE mutations each proven to fire on its own named defect: shadow carries the ambiguous reference (every attributed figure collapses to exactly 0.0 -- the construct's own death, a counterfactual that stopped differing would publish 'costs nothing' with total confidence); shadow scored over a different population (RAISES on the SAME-WORLD guard -- the most flattering possible error and undetectable in the published figure); shadow balance moved by 1p (fail-CLOSED, every figure blanked with premise_violated, NOT fail-loud: it runs inside run_phase2b and a diagnostic may not kill the run it measures); all-DD population (undefined, never 0.0 -- an unexercised channel is not a harmless one, the D7 vacuity rule); and a field-by-field seam comparison proving the second emission moves no clearing date, no ARUDD lag draw, nothing but bank_reference. Published twice (the D6 lesson -- both live callers replace `note`): interpolated into the ledger note AND as structure in components -> coupled_gap_ledger.json -> the Proof door. 119 tests green across every file touching the triad or gap_metric; ruff 3 -> 2 on the touched files vs a pristine HEAD extract (nothing added to the ratchet). R12 CLEAN: no published number was moved -- this adds a diagnostic beside them. L3 NOT claimed: no Expert-Hour pass, and the counterfactual is measured on the OFFLINE-shaped live wiring only; the mechanism's cash-value (statutory interest, provisioning) is named, not yet costed."

