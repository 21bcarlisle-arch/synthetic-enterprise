  family: event_fuel_consistency
  statement: A gas account priced on an electricity-scale unit rate (or the reverse) is a crossed fuel; caught by the per-fuel unit-rate bands.
  predicate: 'for svt terms: commodity == gas => unit_rate within INV_UNIT_RATE_SVT_GAS row; commodity == electricity => above INV_UNIT_RATE_SVT_ELEC lower (outside EPG windows, every electricity floor
