- id: INV_READ_DUTY_ANNUAL
  family: read_duty
  statement: For every credit-meter customer the supplier takes all reasonable steps to obtain a meter reading at least once every year (SLC 21B.4); a customer's own read or a smart meter's transmitted
    read counts.
  applies_to:
    commodity: electricity and gas
    segment: domestic (the condition is in the domestic/customer licence text; applied to all credit meters here)
    excludes: prepayment accounts (21B.4 'does not apply to prepayment meters'); identify by any 'prepayment top-up' payment
  basis: days between consecutive reads whose read_type is actual or customer (and from supply start to the first such read)
  lower: 0
  upper: 365
  lower_source: logic
  upper_source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md '21B.4 ... at least once every year' (in force from 31 Dec 2014, 21B.3); corroborated docs/market_research/read_access_and_theft_duties.md
    §2.1 [H]
  tolerance:
    upper_days: 1
    reason: a leap-year span is 366 days
  severity:
    above_upper: 'flag, not breach: 21B.4 is a duty of EFFORT (''all reasonable steps''), not a guarantee of a read. An unread interval over a year is evidence to be explained, and it costs the supplier
      under 21BA (''not reading is not a 21BA exception'', docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md ''How the two conditions meet'').'
  correction_to_brief: The brief's 'at least once every two years' is the old two-yearly INSPECTION duty, repealed from 1 April 2016 in both fuels (Ofgem decision 4 Feb 2016, docs/market_research/read_access_and_theft_duties.md
    §2.1 [H]). For the whole 2016-2025 window the read duty is ANNUAL.
  export_fields:
  - read_date
  - read_type
  - register_id
  - payment_method
  - period_start
  checkable: true
  gap: smart-meter status not in the export (a smart read should arrive as read_type actual; if exported otherwise the check under-counts)
  source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md
- id: INV_SETTLEMENT_ACTUAL_SHARE_ELEC
  family: read_duty
  statement: At least 97% of a supplier's non-half-hourly electricity is settled on actual metered data by the final reconciliation run (about 14 months after the settlement date).
  applies_to:
    commodity: electricity
    level: book
  basis: share of book electricity kWh, for consumption dated at least 14 months before the export end, that lies on or before each account's latest actual/customer read (i.e. bounded by actual reads rather
    than estimate-to-estimate). Approximation of BSC Section S Annex S-1.
  lower: 0.97
  upper: 1.0
  lower_source: 'docs/market_research/read_access_and_theft_duties.md §2.1: BSC ''requires that at least 97% of non-half hourly electricity is settled on the basis of actual metered data by the time of
    Elexon''s final volume allocation run (i.e. within 14 months)'' [H for Ofgem''s statement; the BSC annex itself not read, M]'
  upper_source: logic
  severity:
    below_lower: flag (a settlement performance standard, charged, not a licence breach)
  export_fields:
  - read_date
  - read_type
  - consumption_kwh
  - period_start
  - period_end
  checkable: true
  gap: the export's periods are billing periods, not settlement periods; the share is an approximation; HH-settled accounts cannot be identified
  source: docs/market_research/read_access_and_theft_duties.md
- id: INV_BILL_AT_LEAST_TWICE_YEARLY
  family: read_duty
  statement: A credit-meter customer is sent a bill or statement at least twice a year (SLC 21B.5), so no billing period on a non-prepayment, non-smart account exceeds about six months.
  applies_to:
    segment: domestic
    excludes: prepayment, smart and unmetered supply (21B.5 carve-out)
  basis: days_in_period per period
  lower: 1
  upper: 184
  lower_source: logic
  upper_source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md '21B.5 ... at least twice yearly'; 184 = the longest half-year (Jul-Dec)
  severity:
    above_upper: flag (smart accounts are exempt and the export does not mark smart)
  export_fields:
  - days_in_period
  - payment_method
  checkable: true
  gap: smart-meter flag absent, so cannot separate exempt accounts
  source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md
- id: INV_OPENING_READ
  family: read_duty
  statement: 'Every supply span opens on a read that is actual or deemed, dated at the supply start date (electricity CoS: within SSD ±5 days, deemed by SSD+8; gas: estimated opening read within 10 days).'
  applies_to:
    commodity: electricity and gas
    segment: all
  basis: days from the account's first period_start to its first read_date
  rows:
  - commodity: electricity
    lower: -5
    upper: 8
    lower_source: 'docs/market_research/unbilled_energy_and_revenue_assurance.md ''The opening read at a change of tenancy'': BSCP504 §4.4.1 ''within the SSD ±5 days'' [H]'
    upper_source: 'same: ''the new data collector deems one by SSD+8'' [H]'
  - commodity: gas
    lower: -5
    upper: 10
    lower_source: 'belief: mirror of electricity window'
    upper_source: 'same section: ''an estimated opening read within 10 days (UNC 0427S ...)'' [M]'
  severity:
    outside: flag (at a change of tenancy with the same supplier no industry process sets the read; 'an opening read always exists, and it is either actual or deemed')
  export_fields:
  - period_start
  - read_date
  - read_type
  checkable: true
  gap: CoS vs CoT not distinguishable in the export
  source: docs/market_research/unbilled_energy_and_revenue_assurance.md
- id: INV_PAYMENT_PPM_AND_DD_NOT_CONCURRENT
  family: payment_method_consistency
  statement: 'An account does not pay by prepayment top-up and by direct debit at the same time: a prepayment meter is paid in advance at the meter.'
  applies_to:
    segment: all
  predicate: For each account and calendar month, NOT (any payment_method == 'prepayment top-up' AND any payment_method == 'direct debit'). One change-over month is lawful (a method change); two or more
    consecutive months with both = breach.
  lower: null
  upper: null
  source: docs/domain_artefact_library/regulatory/pricing_differentiation_permissions.md (SLC 27.1 payment methods incl. 'payment in advance through a Prepayment Meter'); docs/market_research/payments_and_direct_debit_2026-10-25.md
  severity:
    one_month: flag
    two_plus_consecutive_months: breach
  export_fields:
  - payment_date
  - payment_method
  checkable: true
  gap: the 'two months' tolerance is a reading, not a sourced number
- id: INV_PAYMENT_AMOUNT_SIGN
  family: payment_method_consistency
  statement: A direct-debit collection and a prepayment top-up are positive amounts; refunds travel as adjustments or credit transfers, not as negative DDs or negative top-ups.
  predicate: payment_method in {direct debit, prepayment top-up} => payment_amount_gbp > 0
  lower: 0.0
  upper: null
  lower_source: logic (a DD collects; a Direct Debit Guarantee refund is the payer's bank's indemnity claim, docs/market_research/payments_and_direct_debit_2026-10-25.md §3 DDICA)
  upper_source: null
  export_fields:
  - payment_amount_gbp
  - payment_method
  checkable: true
  gap: how the export encodes DD returns/indemnity claims is not stated; if as negative DD payments, the runner should report them separately rather than as breaches
  source: docs/market_research/payments_and_direct_debit_2026-10-25.md
- id: INV_DD_CADENCE
  family: payment_method_consistency
  statement: A fixed direct debit is a regular fixed amount, collected at most once per scheduled interval (monthly), with at most one re-presentation of a failed collection.
  predicate: count(payment_method == 'direct debit') per account per calendar month <= 2
  lower: 0
  upper: 2
  lower_source: logic
  upper_source: SLC 27.15 'the fixed amount of the regular direct debit payment' (docs/market_research/payments_and_direct_debit_2026-10-25.md §2); the +1 for a re-presentation is a belief
  severity:
    above_upper: flag
  export_fields:
  - payment_date
  - payment_method
  checkable: true
  gap: variable (bill-paying) DD customers exist (£725m of balances, §2) and pay per bill; they also satisfy <= 2 per month
  source: docs/market_research/payments_and_direct_debit_2026-10-25.md
- id: INV_DD_STEP_CHANGE
  family: payment_method_consistency
  statement: A regular direct debit that more than doubles from one collection to the next is the case Ofgem required suppliers to re-review in 2022.
  predicate: 'for consecutive regular DD collections a, b: b.payment_amount_gbp / a.payment_amount_gbp <= 2.0'
  lower: null
  upper: 2.0
  upper_source: docs/market_research/what_a_supplier_holds_to_size_a_direct_debit.md §1 'The only published numeric cut is Ofgem's 100% threshold from the 2022 Direct Debit Market Compliance Review ...
    an enforcement instrument, not a licence threshold'; docs/market_research/payments_and_direct_debit_2026-10-25.md §2 (8% of DD increases Feb-Apr 2022 were >100%)
  severity:
    above_upper: 'flag (not a licence breach: SLC 27.15 names no numeric trigger)'
  export_fields:
  - payment_amount_gbp
  - payment_date
  - payment_method
  checkable: true
  gap: no licence numeric threshold for DD adequacy; Ofgem expects a DD to fall when the customer is in credit but gives no number
  source: docs/market_research/payments_and_direct_debit_2026-10-25.md
- id: INV_PPM_NOT_CREDIT_BILLED
  family: payment_method_consistency
  statement: 'A prepayment customer is not sent credit bills or estimated credit bills: 21B.4 and 21B.5 do not apply to prepayment, and consumption is paid at the meter.'
  lower: null
  upper: null
  export_fields: []
  checkable: false
  gap: 'UNCHECKABLE: the export carries no bill/statement record, bill type or meter type. Periods exist for every account (they are consumption periods), so a period on a prepayment account is not evidence
    of a credit bill. Needs a bill-issued record with its type.'
  source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md (21B.4, 21B.5 carve-outs)
