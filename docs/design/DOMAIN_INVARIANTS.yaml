    (1.5x/0.79x), MARKET_SAVINGS_BY_YEAR; world churn constants 0.20/0.10; the world''s back-derived pre-cap per-fuel SVT ranges (svt_rates §1 table, incl. the withdrawn 2017 gas ''~2.1-3.5'' and its 2.80p
