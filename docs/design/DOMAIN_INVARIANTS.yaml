    if the export adds the EPG discount per period or states the rate''s basis.'
  source: docs/domain_artefact_library/regulatory/ofgem_default_tariff_cap_windows.json#epg_note, windows[].elec_epg/gas_epg; docs/market_research/ofgem_cap_windows.md §4
- id: INV_STANDING_CHARGE_SVT_ELEC
  family: standing_charge
  grades: ledger
  statement: A domestic electricity default-tariff standing charge is non-negative and at or below the cap's nil-consumption allowance for the window and payment method.
  applies_to:
    commodity: electricity
    segment: domestic
    tariff: svt/deemed
    meter: single-register (multi-register SC is within 0.1p/day of single-rate, docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md)
  basis: GBP/day EX-VAT (export unit) = p/day /100; Ofgem cap model nil-consumption Total row /365, median of 15 rows; DD = `upper`
  evaluation: 'Evaluate the term against EVERY cap window its [tariff_effective_from, tariff_effective_to or account end] overlaps; the term must satisfy each overlapped window''s row. A term starting before
    2019-01-01 is graded against the pre-cap rows for that part of its life. Payment method for the window = from the account''s payments dated inside the window: any ''prepayment top-up'' -> prepayment
    column; else all ''direct debit'' -> DD column (`upper`); else (card/cash only) -> standard-credit column. No payments in the window -> use the maximum of the three columns.'
  rows:
  - from: '2016-01-01'
    to: '2018-12-31'
    lower: 0.0
