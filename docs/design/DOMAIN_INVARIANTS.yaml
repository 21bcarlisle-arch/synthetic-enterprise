- id: INV_DEFAULT_TARIFF_TWO_REGISTER_INVOICE_WITHIN_MULTI_REGISTER_CAP
  family: unit_rate
  grades: invoice
  twin_of: INV_UNIT_RATE_SVT_ELEC_MULTI_REGISTER
  source: docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md (SLC 28AD.4, .34, .36(a)); docs/domain_artefact_library/regulatory/ofgem_cap_multi_register_unit_rates.json
  statement: A default-tariff (SVT or deemed) domestic electricity bill that prints a Day and a Night register has an all-in unit rate, weighted at SLC 28AD.36(a)'s Assumed Consumption Split for an Economy
    7 Tariff (58% Day/peak, 42% Night/off-peak), at or below the multi-register cap unit rate for the cap window its period falls in. Standing charge excluded, ex-VAT. From 1 Jan 2019 to 31 Dec 2025.
  applies_to:
    commodity: electricity
    segment: domestic
    tariff: 'term_tariff_type in {svt, deemed}. Not fixed: a fixed term the household chose is outside 28AD (slc_28ad_multi_register_cap_test.md ''What the text settles'' 4); see gaps for 28AD Default Fixed
      Term Contracts.'
    meter: 'the bill prints exactly two registers, labelled Day and Night (an Economy 7 Tariff: ''two separate Unit Rates'', 17 day/normal hours and 7 night/low hours, SLC definitions). A bill printing
      Peak/Off-peak or any other multi-register label is a Multi-Register Tariff other than E7, whose split is the supplier''s notified one (28AD.36(b), .37) and is not visible on the page: not graded here.'
  law: 'SLC 28AD.2 (aggregate Charges for Supply Activities at any consumption level x kWh <= Relevant Maximum Charge); 28AD.4 (a Multi-Register Tariff is assessed on the Multi-Register benchmark); 28AD.34
    (consumption in different periods is weighted using an Assumed Consumption Split); 28AD.36(a) verbatim: ''in respect of each Economy 7 Tariff, off-peak and peak consumption levels of 42% and 58%, respectively,
    shall be the Assumed Consumption Split''. Paragraph and split VERIFIED against the licence text in the commons; the brief''s citation (28AD.36(a), 58% day / 42% night) is correct. Because the Relevant
    Maximum Charge is a nil-consumption part plus a per-kWh slope and 28AD.2 binds at every x, the unit-rate part must be at or below the cap slope on its own (slc_28ad_multi_register_cap_test.md ''What
    the text settles'' 3).'
  basis: p/kWh EX-VAT, all-in unit rate (energy + unit-rate-borne non-energy), standing charge excluded, VAT excluded. The ceiling is the cap model's multi-register DIRECT DEBIT unit rate, the median over
    the model's 15 Total rows (14 regions + GB), (benchmark - nil) / 4,200 kWh (docs/domain_artefact_library/regulatory/ofgem_cap_multi_register_unit_rates.json#basis.method, .multi_register_benchmark_kwh).
    Same basis as the export rows, so no VAT conversion is needed.
  quantity:
    energy_part_p_per_kwh: 'E = 0.58 x Day.unit_rate_p_per_kwh + 0.42 x Night.unit_rate_p_per_kwh (each register''s printed rate, energy only, ex-VAT). Weighted on the ASSUMED split, never on the bill''s
      own Day/Night kWh: 28AD.34 grades the tariff, not the household.'
    non_energy_part_p_per_kwh: N = 100 x non_commodity_amount_gbp / consumption_kwh (the unit-rate-borne non-energy charge per kWh billed, ex-VAT). The bill prints it as one total, not per register, so
      it is taken as uniform across registers; see gaps.
    graded_rate_p_per_kwh: R = E + N
    excluded: standing_charge_gbp (the nil-consumption part, graded by INV_STANDING_CHARGE_SVT_ELEC); vat_gbp.
  evaluation: 'Unit: one printed bill. Preconditions, else NOT GRADED with the reason printed (never a pass): commodity == electricity; term_tariff_type in {svt, deemed}; exactly two registers labelled
    Day and Night, each with a unit_rate_p_per_kwh; consumption_kwh > 0; the registers'' amount_gbp sum to commodity_amount_gbp within 1p per register (otherwise the printed register rates are not the whole
    energy charge and E is not this bill''s rate: ''cannot tell''); period wholly inside 2019-01-01..2025-12-31. Window: if [period_start, period_end] lies inside one row, C = that row''s upper. If it straddles
    a row boundary, the bill prints one rate per register for the whole period and its kWh are not split by window, so: BREACH if R exceeds the HIGHEST overlapped row''s upper_with_tolerance + 0.5 / consumption_kwh;
    FLAG if it exceeds the day-weighted mean of the overlapped rows'' upper x 1.015. Grade: BREACH if R > C x 1.015 + 0.5 / consumption_kwh. Report R, C and (R - C) beside every breach. EPG windows (2022-10-01..2023-06-30):
    grade against the multi-register cap only. The cap stayed in force under 28AD throughout; the EPG lowered what the household paid and the Treasury paid the supplier the gap, so whichever of the two
    rates the printed register rates carry (household-charged or the supplier''s tariff), each is at or below the supplier''s tariff, which 28AD bounds by the cap. The household-side EPG bound is null (GAP,
    below): an E7 bill is NOT graded against the single-rate EPG 34.0p, because the published text says suppliers set the E7 rates'' discounts individually. Vacuity control: report the count of bills graded,
    not graded (by reason) and in each window; zero breaches over zero graded bills is not a pass.'
