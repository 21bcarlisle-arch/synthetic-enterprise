  family: unit_rate
  grades: ledger
  statement: A domestic single-rate electricity default (SVT/deemed) unit rate sits between the cap's commodity allowance for that window and the cap's unit rate for the payment method, from 1 Jan 2019.
  applies_to:
    commodity: electricity
    segment: domestic
    tariff: svt (default/evergreen and deemed)
    meter: single-register (exactly one distinct register_id among the periods that carry the term; corrected 2026-10-27 from the account proxy, SLC 28AD grades by tariff)
  basis: p/kWh, EX-VAT, GB median of Ofgem's 15 cap-model Total rows (14 regions + GB), single-rate, per payment method (DD column is `upper`). Compare against unit_rate_p_per_kwh (all-in, ex-VAT).
  evaluation: 'Evaluate the term against EVERY cap window its [tariff_effective_from, tariff_effective_to or account end] overlaps; the term must satisfy each overlapped window''s row. A term starting before
    2019-01-01 is graded against the pre-cap rows for that part of its life. Payment method for the window = from the account''s payments dated inside the window: any ''prepayment top-up'' -> prepayment
    column; else all ''direct debit'' -> DD column (`upper`); else (card/cash only) -> standard-credit column. No payments in the window -> use the maximum of the three columns.'
