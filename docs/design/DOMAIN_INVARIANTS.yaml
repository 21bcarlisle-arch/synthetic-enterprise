  family: event_fuel_consistency
  statement: An EV adoption (or heat pump, PV) touches the electricity account only; an electricity-only household has no gas reads, terms or bills.
  lower: null
  upper: null
  export_fields: []
  checkable: false
  gap: 'UNCHECKABLE: the export carries no event stream (adoption events, asset changes). The ''electricity-only household has no gas records'' half is checkable only as INV_FUEL_IDENTIFIER, because every
