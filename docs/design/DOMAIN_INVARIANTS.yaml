  evaluation: 'Evaluate the term against EVERY back-cast window its [tariff_effective_from, tariff_effective_to or account end] overlaps, clipped to 2016-01-01..2018-12-31; the term must satisfy each overlapped
    window''s row. Rows are keyed on Ofgem''s back-cast half-years; the October 2018 - March 2019 row is cut at 2018-12-31 because the cap (INV_UNIT_RATE_SVT_*) governs from 2019-01-01. Compare unit_rate_p_per_kwh
