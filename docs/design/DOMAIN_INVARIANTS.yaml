- id: INV_PAGE_CAP_BREACH_NOTE_AGREES_WITH_THE_MULTI_REGISTER_GRADE
  family: unit_rate
  grades: page
  twin_of: INV_DEFAULT_TARIFF_TWO_REGISTER_INVOICE_WITHIN_MULTI_REGISTER_CAP
  source: docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md (SLC 28AD.4); the twin row's sources
  statement: On a two-register (Day/Night) electricity bill, the household page prints a note that the bill broke a published rule by exceeding the default-tariff ceiling only when Row INV_DEFAULT_TARIFF_TWO_REGISTER_INVOICE_WITHIN_MULTI_REGISTER_CAP
    grades that bill over its ceiling, and the excess it prints is measured against the MULTI-REGISTER ceiling, not the single-rate one.
  applies_to:
    commodity: electricity
    segment: domestic
    meter: bills printing exactly two registers labelled Day and Night
    tariff: every term_tariff_type (a note on a bill Row A does not cover is itself graded)
  predicate: 'Let x = the bill''s printed default_tariff_excess_p_per_kwh (null or 0 = no note). Let A = Row A''s outcome on the same bill: OVER (R > C x 1.015 + 0.5/kWh), WITHIN_TOLERANCE (C < R <= that),
    WITHIN (R <= C), or NOT_GRADED with its reason; R, C as Row A defines them; C_1R = the window''s single_rate_ceiling_for_row_b_diagnosis. (a) BREACH: x > 0 and A == WITHIN. The page says a published
    rule was broken where the multi-register ceiling was met. If additionally |x - (R - C_1R)| is within the agreement tolerance, name the cause: the note used the single-rate ceiling. (b) BREACH: x > 0
    and the bill''s period lies wholly before 2019-01-01 (no default-tariff cap existed). (c) BREACH: x > 0, A == OVER, and |x - (R - C)| > agreement tolerance. The printed excess is not the multi-register
    excess; name the single-rate cause as in (a) where it fits. (d) FLAG: x > 0 and A == WITHIN_TOLERANCE (the exceedance is inside the ceiling''s own derivation error, so neither the note nor its absence
    is established). (e) FLAG: x > 0 and term_tariff_type == fixed (28AD binds a chosen fix not at all, but a 28AD Default Fixed Term Contract is not distinguishable on the page). (f) FLAG: x is null or
    0 and A == OVER (the page omits a breach Row A found; Row A already carries the breach, so this row only flags the silence). (g) NOT GRADED: A == NOT_GRADED for any reason other than pre-2019 or fixed
    (2026+, EPG household side, straddle-only flag, cannot-tell), reported with the reason. Agreement tolerance = C x 0.015 + 0.5 / consumption_kwh + half the last printed digit of x: the page and Row A
    must agree to within the ceiling''s own uncertainty, nothing more.'
  evaluation: 'Unit: one printed two-register bill. Vacuity control, over the whole partition: report how many bills fall in each of (a)-(g) and in ''x > 0 and A == OVER and agreeing'' and ''x null/0 and
    A in {WITHIN, WITHIN_TOLERANCE}''. A run where no bill reaches the agreeing-note branch AND no bill reaches the no-note-within branch has not exercised the row; say so rather than report zero breaches.'
  lower: null
  upper: null
  severity:
    violation: breach ((a), (b), (c))
    flag: (d), (e), (f)
  export_fields:
  - printed bills[].default_tariff_excess_p_per_kwh
  - 'and every Row A field: period_start, period_end, term_tariff_type, commodity, consumption_kwh, commodity_amount_gbp, non_commodity_amount_gbp, registers[].label, registers[].unit_rate_p_per_kwh, registers[].amount_gbp'
  checkable: true
  sources:
  - 'Row INV_DEFAULT_TARIFF_TWO_REGISTER_INVOICE_WITHIN_MULTI_REGISTER_CAP and its sources (SLC 28AD.4: a Multi-Register Tariff is assessed on the Multi-Register benchmark, never the single-rate one)'
  - 'docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md (''What the text settles'' 1 and the levels table: the multi-register unit rate is 0.4-8% below single-rate, so a note keyed
    to the single-rate ceiling under-reports, and a note keyed to it on a within-cap bill is impossible while one keyed to MR on a bill under single-rate is real)'
