- id: INV_PERIODS_CONTIGUOUS
  family: billing_interval
  statement: An account's billing periods run consecutively from supply start to supply end with no gap and no overlap, and each period's day count matches its dates.
  predicate: 'sort periods by period_start; for consecutive p, q: q.period_start == p.period_end + 1 day (inclusive-end convention) OR q.period_start == p.period_end (exclusive-end) -- one convention, used
    consistently across the whole export; days_in_period == (period_end - period_start) [+1 if inclusive]; days_in_period >= 1'
  lower: 0
  upper: 0
  lower_source: logic
  upper_source: 'logic: gap/overlap days must be 0'
  severity:
    gap_or_overlap: breach
    day_count_mismatch: breach
  export_fields:
  - period_start
  - period_end
  - days_in_period
  checkable: true
  gap: null
  source: logic of a meter-point account ledger
- id: INV_BACK_BILLING_12M
  family: back_billing
  statement: From 1 May 2018 (domestic; microbusiness from 1 Nov 2018) a supplier may recover only energy reasonably considered consumed in the 12 months before the charge recovery action, absent customer
    obstruction.
  applies_to:
    segment: domestic from 2018-05-01; microbusiness from 2018-11-01
  basis: days between the start of the energy charged and the charge recovery action
  lower: 0
  upper: 365
  lower_source: logic
  upper_source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md '21BA.1 ... consumed within the 12 months preceding the date the charge recovery action was taken'; in force
    docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md 'In force'
  checkable_part: 'PROXY (flag): the demand date is taken as period_end (a bill cannot predate its period). (a) any period with days_in_period > 365 whose kWh were not already demanded is a flag; (b) catch-up:
    where an actual read follows a run of estimated/deemed reads whose last actual read is more than 365 days before the catching-up period''s period_end, and that period''s consumption_kwh exceeds its
    days x the account''s prior daily average, the excess is energy older than 12 months unless a negative adjustment of matching size follows -> flag. Non-reading is NOT obstruction (Ofgem 2018: ''We do
    not consider a consumer to be obstructive ... when he or she does not supply a meter reading'').'
  uncheckable_part: A definitive breach needs the bill issue (demand) date and the link between a catch-up charge and the consumption window it recovers; the export has neither. Money already collected
    by DD that covered the energy is not barred (Ombudsman Scenario B, docs/market_research/back_billing_and_liability.md §1), which needs a running balance the runner would have to reconstruct.
  severity:
    flag: proxy hits
  export_fields:
  - period_start
  - period_end
  - days_in_period
  - consumption_kwh
  - read_date
  - read_type
  - adjustment_date
  - adjustment_amount_gbp
  - adjustment_reason
  - segment
  checkable: true
  gap: bill issue date and charge-to-period link absent (definitive check UNCHECKABLE; proxy checkable)
  source: docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md; docs/market_research/back_billing_and_liability.md
- id: INV_PERIOD_CONSUMPTION_NON_NEGATIVE
  family: meter_physics
  statement: Import consumption in a period is never negative.
  lower: 0.0
  upper: null
  lower_source: physics
  upper_source: see INV_ANNUAL_USE_ELEC_ACCOUNT physics_per_period for electricity
  predicate: consumption_kwh >= 0 (exclude registers whose register_label marks EXPORT generation)
  export_fields:
  - consumption_kwh
  - register_label
  checkable: true
  gap: null
  source: physics
  severity:
    violation: breach
- id: INV_READ_MONOTONIC
  family: meter_physics
  statement: On one meter and register, an actual read is never lower than an earlier actual read (a read does not go backwards), except at a meter exchange or a register roll-over.
  predicate: 'for consecutive reads r1 < r2 by read_date on the same (meter_serial, register_id) with read_type in {actual}: r2.read_kwh >= r1.read_kwh, unless r2.read_kwh + 10^d - r1.read_kwh (d = digits
    of r1) is an advance within the period''s physics bound (roll-over). Customer reads: same test, severity flag (customer reads can be mis-keyed and are rejected in practice). Estimated/deemed reads:
    excluded (an estimate later corrected downward by an actual is normal).'
  lower: 0.0
  upper: null
  lower_source: 'physics: an accumulating register'
  upper_source: null
  severity:
    actual_to_actual: breach
    customer_involved: flag
  export_fields:
  - read_date
  - register_id
  - read_kwh
  - read_type
  - meter_serial
  checkable: true
  gap: meter exchange visible only if meter_serial changes on the account
  source: physics
- id: INV_PERIOD_MATCHES_READS
  family: meter_physics
  statement: A period billed on reads bills exactly the advance between its opening and closing reads, summed over registers.
  predicate: volume_basis == 'reads' and reads exist at period_start and period_end on every register => |consumption_kwh - sum_registers(read_end - read_start)| <= 1 kWh x registers
  lower: -1
  upper: 1
  lower_source: rounding of read_kwh to 1 kWh (belief)
  upper_source: same
  export_fields:
  - consumption_kwh
  - volume_basis
  - read_date
  - read_kwh
  - register_id
  - period_start
  - period_end
  checkable: true
  gap: gas reads are volumetric at the meter and converted to kWh with a calorific value; the export carries read_kwh, so the conversion is assumed already applied
  source: logic
  severity:
    violation: breach
- id: INV_VAT_RATE
  family: vat
  statement: Domestic electricity and gas carry the reduced 5% VAT rate, except domestic electricity in GB from 1 Oct 2026 to 31 Mar 2027 at 0%; business supply is 5% at or under the de minimis daily average
    and 20% above it.
  basis: vat_rate as a fraction
