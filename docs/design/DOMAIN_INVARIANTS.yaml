- id: INV_METER_SERIAL_ONE_SUPPLY_POINT
  family: meter_identity
  grades: ledger
  counts:
    numerator: invoice/read records whose (commodity, meter_serial) sits, over an overlapping period, on a supply point other than the record's own, or on a supply point in a different distribution region with no recorded meter exchange between them
    denominator: every invoice/read record carrying a non-null meter_serial
    unit graded: one invoice/read record (a (commodity, meter_serial, supply point, period) tuple)
  statement: A meter serial names one physical meter. On a supplier's record one meter serial is never on two different supply points (MPAN for electricity, MPRN for gas) over overlapping periods, and never on supply points in two different distribution regions unless a meter exchange (removal from one, installation at the other) is recorded between the two periods. Successive occupiers of one property are NOT an exception to be excused but the normal case the rule permits - they share the supply point and the meter, so the serial stays on one MPAN/MPRN across several account ids. Several accounts on one (serial, supply point) is lawful; one serial on several supply points at once is not.
  predicate: 'Key every record by k = (commodity, meter_serial); sp = mpan if commodity == electricity else mprn; periods are half-open [period_start, period_end). (a) Simultaneity: for any two records r1, r2 with the same k and r1.sp != r2.sp, the periods do not overlap: r1.period_end <= r2.period_start or r2.period_end <= r1.period_start (a shared boundary day, the closing read of one being the opening read of the next, is not an overlap). (b) Region: for electricity, region(sp) = the MPAN core''s first two digits (the Distributor ID); for any two records with the same k and region(r1.sp) != region(r2.sp), a meter exchange record exists on k dated between the earlier period_end and the later period_start. (c) Sequential move within a region: same k, different sp, no overlap, no exchange record -> flag (crossed-meter or mis-keyed serial suspect), not breach. Account id is NOT part of the key: a change of account on the same (k, sp) is a change of occupier and is never graded here.'
  lower: 1
  upper: 1
  lower_source: 'physics: a meter is one physical object at one place at a time'
  upper_source: 'physics: a meter is one physical object at one place at a time'
  source: 'physics (one object, one place) plus belief (strong logic) on the identifiers: docs/market_research/home_moves.md, "What a gas supply is, at a move": "A supply belongs to a meter point, not to a household: an MPAN for electricity, an MPRN for gas ... Nothing ''moves'' with a household", and design choice 6 "The incoming occupier''s account names the account it succeeded at the same meter point" (successive occupiers share the supply point); docs/market_research/unbilled_energy_and_revenue_assurance.md K5 "two premises'' MPANs/MPRNs swapped (''crossed'')" and the Ofgem SPAA CP10/190 definition "a customer billed for a meter point (MPRN) that is not measuring consumption at their premises" (the defect the flag leg catches); same file, smart roll-out section: "A meter exchange is a fact the supplier holds about its own supply point. The meter''s details are on the national metering record and arrive in the industry flows" (so an exchange is recordable and its absence is gradable); docs/domain_artefact_library/regulatory/mpan_core_structure_and_check_digit.md, "Distributor ID": the core "consists of a two-digit Distributor ID" with the fourteen DNO areas 10 to 23 and IDNOs from 24 upward [S] (the electricity region key); docs/market_research/a_tou_tariff_needs_the_households_choice_not_its_meter.md Item 7: a tariff change "is not a meter exchange, and it issues no new serial" and "one register is one register for the life of the serial"'
  severity:
    simultaneous_two_supply_points: breach
    two_regions_no_exchange: breach
    sequential_same_region_no_exchange: flag
  export_fields:
  - account_id
  - commodity
  - meter_serial
  - mpan
  - mprn
  - period_start
  - period_end
  checkable: true
  gap: 'Graded by tools/domain_invariant_runner.ev_meter_serial_one_supply_point since 2026-10-30. On the 3dc5a92948 ledger it breaches 45,049 of 52,927 bill periods (322 serials over 1,293 supply points) and flags 1,906; with the serial minted per supply point (company/crm/customer_registry.meter_serial) it reads 0 of 52,927 (fifth cold read, N10; the row written blind by an agent that read only docs/market_research, docs/domain_artefact_library and site/data/knowledge_topics.json). GAP (1): no file read gives the national format or the uniqueness scope of a meter serial number (whether a serial is unique across manufacturers, and whether an electricity and a gas meter can carry the same serial string); the rule therefore keys on (commodity, meter_serial), which is the narrower, safe reading, and a cross-manufacturer collision would show as a false breach. GAP (2): whether a removed meter may be refurbished and reinstalled at a different supply point is not established in any file read; leg (c) is a flag, not a breach, for that reason. GAP (3): the gas region key: no file read gives how an MPRN encodes its Local Distribution Zone (13 LDZs are named only as a count in how_many_weather_cells_britain_needs_and_why_the_answer_is_a_curve.md), so leg (b) is checkable for electricity only and gas region is NOT graded until a commons page carries the MPRN structure. GAP (4): the MPAN Distributor ID list is secondary [S] only (mpan_core_structure_and_check_digit.md), and IDNO IDs above 23 are "citation needed". GAP (5): meter_exchange is not in the export fields because a bill/read record does not plainly carry it; it is visible only as a change of meter_serial on one supply point, so leg (b) can be graded only as "a serial change on the earlier supply point and a serial change on the later one, both between the two periods", which is the proxy, not the exchange record itself. The 1/1 bounds are a count of supply points per (serial, instant), not a tolerance.'
- id: INV_GAS_READ_IS_A_VOLUME_CONVERTED_AT_CV_AND_CF
  family: meter_physics
  grades: ledger
  counts:
    numerator: gas read/bill records that hold the register in kWh with no volume advance and no conversion, or whose billed kWh differs from volume x correction factor x CV / 3.6 by more than the print tolerance
    denominator: every gas read/bill record with an energy line (commodity == gas and billed_kwh not null)
    unit graded: one gas read/bill record (one register advance billed on one invoice)
  statement: A GB gas meter registers volume - cubic metres on a metric meter, hundreds of cubic feet on an imperial meter - not energy. A gas bill derives kWh from the volume advance using the calorific value and the volume correction factor, so every gas read or bill record carries a read unit (m3 or hcf), a volume advance, an imperial flag (or a unit that implies it), the CV applied and the correction factor applied, and its kWh equals the metric volume x correction factor x CV / 3.6 within print tolerance. A record that holds a gas register in kWh, with no volume and no conversion, is not a GB gas read.
  predicate: 'commodity == gas => (a) read_unit in {m3, hcf} and read_unit != kWh; (b) volume_advance not null, calorific_value not null, correction_factor not null; (c) imperial_flag == (read_unit == hcf); (d) V_m3 = volume_advance if read_unit == m3 else volume_advance x K_hcf (K_hcf = cubic metres per hundred cubic feet: GAP, see gap); (e) |billed_kwh - V_m3 x correction_factor x calorific_value / 3.6| <= tol, where 3.6 is MJ per kWh and calorific_value is in MJ/m3; tol is derived from print precision only: tol = 0.5 x 10^(-d_kwh) + computed_kwh x (0.5 x 10^(-d_cv) / calorific_value + 0.5 x 10^(-d_cf) / correction_factor), with d_x the number of decimal places the record prints for x (volume advance is a difference of whole register digits, so it adds no rounding when the register is read to its last digit). (f) Optional range leg on calorific_value: GAP, not graded.'
  lower: 0.0
  upper: 0.0
  lower_source: 'tolerance from print precision (leg e); the equality itself is physics (1 kWh = 3.6 MJ, by definition of the units)'
  upper_source: 'tolerance from print precision (leg e)'
  source: 'physics for the unit identity (1 kWh = 3,600,000 J = 3.6 MJ) and belief (strong logic) for the record shape. What the files read establish: docs/market_research/household_carbon_and_the_measures_that_save_it.md, "Gas factor" paragraph: "GB gas meters are billed in kWh converted at the gross calorific value"; docs/domain_artefact_library/regulatory/desnz_natural_gas_conversion_factor.json, basis.units: "GB gas is billed in kWh converted at gross CV" (this artefact is the DESNZ CARBON factor, kgCO2e per kWh gross CV, NOT the volume-to-energy conversion; it confirms only that the billed kWh is on a gross-CV basis); docs/market_research/unbilled_energy_and_revenue_assurance.md K5: "a wrong multiplier or correction factor" listed as a meter-fault class, and the Xoserve/AUG finding "incorrect correction factors 40" (a correction factor exists per supply point and can be wrong, so it is a field the record carries); docs/domain_artefact_library/scope_briefs/ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md: gas traded "in pence per therm, roughly 29.3 kWh, which is a real conversion the model must get right rather than assume" (the commons'' stance on gas unit conversion); docs/market_research/a_tou_tariff_needs_the_households_choice_not_its_meter.md Item 6: SLC 31H.1 bills "sufficient to enable that Domestic Customer to understand and manage the costs", 31H.12(b) "how any charges ... are calculated" (electricity licence text, quoted there; its gas mirror was not read)'
  severity:
    gas_register_held_in_kwh_no_volume: breach
    kwh_not_equal_to_converted_volume: breach
    conversion_fields_missing_with_volume_present: flag
  export_fields:
  - commodity
  - meter_serial
  - mprn
  - read_unit
  - imperial_flag
  - volume_advance
  - correction_factor
  - calorific_value
  - billed_kwh
  - period_start
  - period_end
  checkable: true
  gap: 'CHECKABLE from 2026-10-30, on a book whose ledger carries the gas build (C1-C3 of docs/market_research/a_gas_read_is_a_volume_and_the_bill_converts_it.md): the world''s gas meter registers volume, an actual read carries it, and the supplier converts it (company/billing/gas_volume_conversion.py). Every book before that build holds a kWh register and breaches on every gas period, which is the finding this row was written for (fifth cold read, N11). Of the blind writer''s six GAPs, the page closes (1) the regulations and which CV applies (R2, R3, R5), (3) the correction factor at 1.02264 [S], and (4) the imperial factor, 100 x 0.3048^3 m3 per hundred cubic feet, a unit identity; it narrows (2) the CV range to 38-41 MJ/m3 [S] and (6) smart meters to R9 [S]. (5), what a gas bill must print about the conversion, stays open as the page''s G3. Leg (e) adds the volume read''s own print rounding (3dp at each end), which the predicate said was nil for a register read to its last digit. What this row does NOT grade: the CV is a fixed stand-in until the daily charging-area series lands (G1), and a fixed CV is not compliant (R6); the record says so in calorific_value_basis, and a row grading that field is owed with G1. Leg (e) is graded on the kWh the two readings span (closing less opening), not on billed_kwh: after an estimated run the readings span the month plus the run''s catch-up (back_billing_and_liability.md section 13), which is what the volume advance converts to, so billed_kwh alone would breach every catch-up bill (reader A#4, 2 Nov). Severities as the row states them (2 Nov): no volume, or an imperial flag that disagrees with the unit, breaches; a volume without its CV or factor flags; the printed flag is the account''s metering record, not the read unit.'
- id: INV_TWO_RATE_BILL_PRINTS_ONE_READ_PAIR_PER_REGISTER
  family: bill_presentation
  grades: page
  counts:
    numerator: printed electricity bills charging k >= 2 registers whose "Meter reads behind it" panel does not print exactly one opening/closing read pair per charged register under that register's usage-line
      label, or prints a read pair whose advance equals the SUM of two or more charged lines' kWh in place of the per-register pairs
    denominator: every printed electricity bill whose usage section charges two or more registers on separate lines (Day/Night, Economy 7, profile class 2, or any other multi-register tariff)
    unit graded: one printed bill page (one invoice as the customer sees it)
  statement: 'A two-rate (Economy 7 / profile class 2) electricity meter has one register per rate, and each register is read on its own. A bill that charges Day and Night (or Rate 1 and Rate 2) on separate
    lines must, where it prints the reads behind the charge, print one opening and one closing read for EACH charged register, labelled as that register''s usage line is labelled. A single opening/closing
    pair equal to the sum of the Day and Night reads is not a read: on a legacy clock- or teleswitch-switched two-rate meter no register holds that sum, so no display can show it. On a smart (SMETS2) meter
    a total Active Import Register does exist and does equal the band sum; it may be printed only as an extra, separately labelled total, alongside the per-band pairs, never instead of them and never as
    the read the band charges are billed from.'
  predicate: 'For a printed bill with charged usage lines L = {l_1..l_k}, k >= 2, each carrying a register label lab(l_i) and kWh(l_i); let P = the read pairs printed in the read panel, each with label
    lab(p), opening o(p), closing c(p). (a) Coverage: for every l_i there is exactly one p in P with lab(p) == lab(l_i) (bijection between charged lines and band read pairs; labels compared after case/whitespace
    normalisation, so "Day"/"day" match, but "Day"/"Rate 1" do not unless the page itself equates them). (b) No summed read in place of registers: P does not consist of a single pair (|P| == 1) while k
    >= 2, and no unlabelled or generically labelled pair ("Meter", "Reading", "Electricity") appears as the only pair on a k >= 2 bill. (c) No sum disguised as a read: for no p in P that is not explicitly
    labelled as a total import register does c(p) - o(p) equal sum_{i in S} kWh(l_i) for some S with |S| >= 2 while no per-band pairs are printed (tolerance: the page''s own kWh print precision, 0.5 x 10^-d).
    (d) Total register (smart only): a pair labelled as total import is permitted only when meter_type is smart AND (a) holds for the band pairs; then o(total) == sum o(band) and c(total) == sum c(band)
    within print tolerance. On a legacy (non-smart) two-rate meter any pair labelled or behaving as a total is a breach. (e) Scope: a page that prints NO read panel is not graded here (whether reads must
    be printed is a GAP, below); single-register bills (k == 1) are not graded here.'
  lower: 1
  upper: 1
  lower_source: 'physics: one cumulative register per rate on a two-rate meter; read pairs per charged register = 1'
  upper_source: 'physics: one cumulative register per rate on a two-rate meter; read pairs per charged register = 1'
  source: 'Meter physics plus belief (strong logic) on what a bill prints. What the files read establish: docs/market_research/a_multi_register_meters_bands_add_up_to_its_total.md section 2: "A legacy two-rate
    (Economy 7) meter is the other case. Its registers are switched by a clock or teleswitch, so both keep advancing whatever the tariff" (two registers, no total register on a legacy E7 meter); same file
    section 1, quoting DECC SMETS2 v1.58 5.5.8.1 "ESME shall be capable of recording Consumption according to Time-of-use Bands in one of forty-eight Tariff Registers" and 5.5.9.1 "cumulative Active Energy
    Imported in the Active Import Register", with the page''s conclusion "Over any window, the Tariff Registers'' advances sum to the total''s advance" (so on a smart meter a total register exists and equals
    the band sum, which is why leg (d) is carved out); same file section 2, Shell Energy: "The meter reading that''s used for your billing is TOU Rate 1 for single-rate tariffs, and both TOU Rate 1 and
    TOU Rate 2 for two-rate tariffs" and National Grid (search summary only) "Imp R1" plus "Imp R2" for two-rate (a two-rate bill is billed from both band registers, not from a sum); docs/market_research/a_tou_tariff_needs_the_households_choice_not_its_meter.md
    item 6: SLC 22A.3 "each of the following are separately identified from each other and any other charges: (a) the Standing Charge(s); (b) the Unit Rate(s) or, where applicable, Time of Use Rates", SLC
    31H.1 bills "sufficient to enable that Domestic Customer to understand and manage the costs associated with their Tariff", 31H.12(b) "how any charges ... are calculated"; same file, "GAP: per-register
    reads": "A two-register meter has a read per register"; item 7: "one register is one register for the life of the serial"; docs/market_research/a_storage_heated_homes_default_tariff_is_two_rate.md R5:
    "An E7 bill prints a day and a night register, each with its rate", and R1: PC2 is "Domestic Economy 7 Customers" (Elexon, via that page); docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md:
    ''Multi-Register Metering Arrangement'' "means using one or more Electricity Meters for the purpose of ... registers" (the regulatory object is per-register).'
  severity:
    single_summed_pair_on_two_rate_bill: breach
    band_pair_missing_or_extra: breach
    total_pair_on_legacy_meter: breach
    band_label_differs_from_usage_line_label: flag
    smart_total_printed_without_band_pairs: breach
  export_fields:
  - invoice_id
  - meter_serial
  - meter_type
  - tariff_type
  - usage_line_label
  - usage_line_kwh
  - printed_read_label
  - printed_opening_read
  - printed_closing_read
  - printed_read_type
  checkable: false
  gap: 'NOT YET GRADED (2026-11-03): no evaluator in tools/domain_invariant_runner. Written blind, from docs/market_research and site/data/knowledge_topics.json only, for the sixth cold read''s N12 (docs/staging/records/SEAT_READING_THE_SIXTH_COLD_READ_ON_THE_85B044BE54_BOOK_2026-11-03.md).
    On the 85b044be54 pages the seat counts 1,731 two-register bills on 39 PC2 pages whose read panel prints one summed pair (PROS-2017-0233 INV12356: 3,622.7 = Day 1,978.5 + Night 1,644.2). GAP (1): no
    file read quotes a licence condition that REQUIRES a domestic bill to print meter reads at all, or per register: SLC 31H.4''s fixed list (as quoted in a_tou_tariff_needs_the_households_choice_not_its_meter.md)
    has "None of them ... per-register"; the per-register read rests on meter physics plus 31H.1/31H.12(b) (understand and check how charges are calculated) and is a belief, which is why a page with no
    read panel is out of scope (leg e) rather than a breach. GAP (2): no file read gives what a legacy Economy 7 meter''s own display labels its registers (e.g. "Normal"/"Low", "Rate 1"/"Rate 2", R1/R2);
    the Shell and National Grid labels quoted are for smart meters. Labels are therefore matched to the bill''s own usage-line labels, not to a meter vocabulary. GAP (3): which band a supplier calls "Rate
    1" (Day or Night) is unestablished (a_multi_register_meters_bands_add_up_to_its_total.md section 4, "GAP"); a Rate-1/Rate-2 page is graded only for internal label consistency. GAP (4): the legacy-versus-smart
    split in leg (d) needs meter_type on the page or export; where it is absent, a printed total is graded as legacy (flagged as unresolvable rather than passed). Correction to the brief''s plain-words
    claim "No display on a two-register meter shows such a sum": true for a legacy E7 meter, NOT for a SMETS2 meter, whose Active Import Register is that sum; the row grades the sum printed INSTEAD OF the
    band reads, which is wrong on both meter types.'
- id: INV_GAS_MONTHLY_USE_DOES_NOT_REPEAT_LAST_YEAR
  family: weather_driven_demand
  grades: ledger
  counts:
    numerator: (upper side) calendar-month pairs (m, m minus 12 months) on one gas leg where both months' kWh rest on actual or prepayment-meter reads and |kWh(m) - kWh(m-12)| <= tol; (lower side) gas legs
      whose winter month-pairs show a median year-on-year relative change below the dispersion floor
    denominator: (upper side) every calendar-month pair on a gas leg with both months measured (read_type in {actual, prepayment}), both months' kWh above the zero-use floor; (lower side) every gas leg
      with at least 3 such winter (Nov-Mar) month-pairs
    unit graded: one gas leg (one account x MPRN x meter serial, across its supply period); month-pairs are counted within it
  statement: 'Domestic gas use is mostly space heating, and space heating follows outdoor temperature, so a home''s measured gas use in a calendar month moves from one year to the next with that month''s
    heating degree days, with behaviour, and (in 2022) with price. Two measured monthly totals matching to 0.1 kWh a year apart is a coincidence of order a few in a thousand per month-pair; a gas leg that
    repeats more than about one month in its life, and especially winter months and months straddling the 2022 crisis, is not carrying measured use. It is carrying a seasonal-normal shape (an AQ spread
    by a profile, which repeats by construction) labelled as measured. The other side: a leg whose winter months barely move at all year on year is equally not weather-driven.'
  predicate: 'For each gas leg g, let M_g = months whose kWh is held on reads with read_type in {actual, prepayment} at BOTH the opening and closing read bounding that month (a month whose kWh was apportioned
    from a longer actual advance by a profile is tagged apportioned and excluded; estimated, deemed and customer-unverified months excluded), and kWh >= z (zero-use floor, below). For each month m in M_g
    with m-12 in M_g: repeat(m) = |kWh(m) - kWh(m-12)| <= tol, tol = 0.5 x 10^-d (d = decimal places the record holds for monthly kWh; 0.05 kWh at one decimal). (A, upper side) R_g = count of repeat(m)
    over the leg. R_g <= 1 passes; R_g == 2 flag; R_g >= 3 breach; any repeat in a winter month (Nov-Mar) that is part of a run of >= 2 consecutive years (m, m-12, m-24 all equal within tol) breach regardless
    of R_g. Book level: sum R_g / sum pairs <= 0.01 (belief, see source). (B, lower side) For legs with >= 3 winter month-pairs: median over winter pairs of |kWh(m)/kWh(m-12) - 1| >= f, f = 0.01 (belief,
    range 0.01-0.03; the grader uses the lenient end). Below f: flag. z = the leg''s own July-August median measured month x 0.5, floor 1 kWh (excludes vacant/off months, where a repeat of ~0 is credible;
    z is a definitional exclusion, not a domain constant).'
  lower: 0
  upper: 1
  lower_source: 'count side: a count cannot be negative and the expected count under weather-driven demand is ~0; dispersion side (leg B): belief f = 0.01, range 0.01-0.03, reasoning in source'
  upper_source: 'belief (stated, with reasoning in source): expected repeats per leg well under 1 at tol = 0.05 kWh; 1 allowed for coincidence, 2 flagged, 3 or more breach; no file read gives this number'
  source: 'Belief derived from the knowledge layer; no file read gives a repeat count. Physics of the driver: site/data/knowledge_topics.json, fabric topic "How it works": "A home''s space-heating demand
    is, to a good approximation, its heat-loss coefficient ... multiplied by how cold it has been over the season, less the heat the sun and the occupants supply for free"; docs/market_research/gas_demand_what_drives_it_and_the_term_the_model_is_missing.md
    "Controls and end-use split": "Domestic gas end use is roughly 75% space heating (DESNZ 2024), with hot water 12-25% and cooking 5-10%"; docs/market_research/gas_demand_cumulative_hdd_cwv.md, National
    Grid Gas Demand Forecasting Methodology 2020: "Effective temperature takes into account the previous day''s temperature due to consumer behaviour" (demand is regressed on weather). Year-to-year variation
    in the driver: docs/market_research/other_market_germany_2026-10-25.md (and other_market_japan): "UK HDD 2,710-2,961 over 2018-2025 (2024: 2,812)" (Eurostat nrg_chdd_a) - an annual spread of about 9%,
    and a single month averages fewer days than a year so its HDD varies at least as much (strong logic); docs/market_research/how_a_supplier_shapes_an_estimate_for_an_unread_month.md section 4: "January
    2025 ran markedly colder than January 2023-2024, visible in the per-year shares", and January carries "17.05%" of domestic gas against July "2.33%" (DESNZ Energy Trends 4.2). Weather plus price in the
    record: docs/market_research/how_much_a_same_households_use_moves_year_on_year_and_in_2022.md section 2B, DESNZ ECUK Table C9, domestic gas 2021 to 2022 "-11.6%" temperature-corrected and "-19.2%" unadjusted
    (weather alone about 7.6 points of annual use in one year); section 2A SERL: gas "10.8% lower than the previous winter (accounting for weather)", IQR "(1.19%, 22.44%)"; section 1: "some households continued
    to use up to around 1 kWh of electricity per day or 15-20% more than predicted throughout 2021/22, others decreased by similar levels" (individual households swing by much more than the sample median).
    Why a repeat signals a shape, not a meter: how_a_supplier_shapes_an_estimate_for_an_unread_month.md section 3, Xoserve: AQ is "An estimate of the amount of gas (in kWh) that a supply meter point will
    use in the coming year under ''seasonal normal'' weather conditions", spread monthly by the Annual Load Profile; a fixed AQ times a fixed seasonal-normal profile repeats month for month. Reasoning for
    the bounds (belief): on a ~1,400 kWh January, weather alone (annual ~5-9%, monthly more) and behaviour put the same-month year-on-year difference at a spread of tens of kWh; the chance that a difference
    with that spread lands inside a 0.1 kWh window is of order 0.1/50, about 0.2% per winter pair; summer months (~2-3% of annual use, smaller spread) perhaps nearer 1%. A leg of 2016-2025 has at most ~108
    pairs, so the expected count is below 1, and 3 or more (or a winter run across 2022) is not credible. Leg B: weather alone moved national annual gas ~7.6 points in 2021-22 and individual households
    swing 15-20%, so a median winter year-on-year change below 1% across a leg is not a weather-driven home; the 1% floor is the lenient end of a 1-3% belief range (F11, erring against the thesis that the
    record is defective).'
  severity:
    repeats_above_upper_on_one_leg: breach
    winter_repeat_run_two_years_or_more: breach
    exactly_two_repeats_on_one_leg: flag
    book_repeat_share_above_one_percent: breach
    winter_dispersion_below_floor: flag
  export_fields:
  - account_id
  - mprn
  - meter_serial
  - commodity
  - month
  - month_kwh
  - opening_read_type
  - closing_read_type
  - opening_read_date
  - closing_read_date
  - apportioned_flag
  checkable: false
  gap: 'NOT YET GRADED (2026-11-03): no evaluator in tools/domain_invariant_runner. Written blind, from docs/market_research and site/data/knowledge_topics.json only, for the sixth cold read''s N13 (docs/staging/records/SEAT_READING_THE_SIXTH_COLD_READ_ON_THE_85B044BE54_BOOK_2026-11-03.md).
    On the 85b044be54 pages the seat counts 1,635 of 4,413 gas month-pairs read A or M at both ends repeating to 0.1 kWh, 114 of 383 legs repeating on 10% or more of their pairs. GAP (1): no file read gives
    monthly GB heating-degree-day series or their year-to-year spread by calendar month; the Eurostat figure is annual UK (2,710-2,961, 2018-2025), and the monthly spread is inferred as at least the annual
    one (strong logic, not a number read). The 0.2%/1% per-pair coincidence figures, the R_g thresholds 1/2/3, the book share 1%, and the dispersion floor f (1-3%) are stated beliefs with the reasoning
    above, not sourced constants. GAP (2): no GB study publishes a same-household, weather-corrected, ordinary-year distribution of year-on-year change (how_much_a_same_households_use_moves_year_on_year_and_in_2022.md
    section 1, "That is a GAP"); individual-household monthly spread is therefore bounded from the SERL 15-20% remark and the 2022/23 IQR, not measured. GAP (3): whether a supplier''s record holds a CALENDAR-month
    kWh on actual reads at all depends on read frequency: a quarterly- or annually-read credit meter has no actual read at month ends, so its monthly kWh is apportioned; the row excludes apportioned months,
    and if the record cannot distinguish apportioned from read-bounded months the row is ungradable for that leg (reported as such, not passed). Smart gas meters (daily/monthly reads) and prepayment meters
    are where read-bounded calendar months exist; no file read establishes the read frequency of either in 2016-2025. GAP (4): prepayment gas months are included as measured per the brief, but no file read
    establishes how a prepayment record''s monthly kWh is formed (meter vend/credit data versus reads); if it is derived from vends or an AQ, leg A grades the derivation, not the meter. GAP (5): an AQ-driven
    ESTIMATE that repeats last year is lawful and expected (Xoserve seasonal-normal AQ); the defect graded here is a repeat carried on months labelled actual, and the row cannot by itself tell a mislabelled
    estimate from a mis-sourced measured value.'
- id: INV_BACK_BILLING_ON_RECEIPT_FROM_ISSUE
  family: back_billing
  grades: ledger
  counts:
    numerator: undercharge catch-ups on a credit bill paid on receipt whose stated window starts more than 12 calendar months before the bill's issue date, where the bill bars (writes off) nothing and the
      days share of the catch-up before that date is at least a penny
    denominator: every undercharge catch-up on a credit bill paid on receipt (every payment posted against it by a way other than direct debit, scheme credits aside), issued on or after 1 May 2018 (domestic)
      or 1 Nov 2018 (non-domestic)
    unit graded: one catch-up bill (one account, one fuel, one invoice)
  statement: For a household that pays each bill on receipt, the bill is the charge recovery action, so a catch-up on it may recover only energy consumed in the 12 months before the bill's ISSUE date
    (not its period end). A catch-up that recovers older energy and bars none of it is a breach, not a flag. This row supersedes INV_BACK_BILLING_12M's proxy flag for this case; that row stays for the
    rest (direct debit, statements, periods over a year).
  predicate: 'for each credit bill b with catchup_adjustment_gbp > 0, issue_date >= 2018-05-01 (domestic) / 2018-11-01 (non-domestic), paid on receipt: let B = issue_date less 12 calendar months, W = [catchup_period_start,
    catchup_period_end]. If start(W) < B: share = catchup_raw_delta_gbp x days(W before B) / days(W), to the penny; breach if catchup_written_off_gbp == 0 and share >= 0.01; flag if 0 < catchup_written_off_gbp
    < share - 0.01.'
  applies_to:
    segment: domestic from 2018-05-01; non-domestic from 2018-11-01 (21BA Part B; every non-domestic account is read as a microbusiness, F11)
  lower: 0
  upper: 12 calendar months before the issue date
  source: 'docs/market_research/back_billing_and_liability.md §1: the supplier "must only do so in respect of units … which could reasonably be considered to have been consumed within the 12 months preceding
    the date the charge recovery action was taken" (SLC 21BA.1); "The 12 months run back from the date of the demand, not from the read and not from when the error was found"; "For a customer who pays
    each bill on receipt, that comes to the same thing as the under-estimate." §16: "for an account that pays each bill on receipt, the bill is the demand and 21BA.1 bars energy more than 12 months before
    it. So the question is not ''how did the account first pay us'' but how it pays the catch-up bill itself." §2: "From 1 May 2018 for domestic customers, and 1 November 2018 for microbusinesses". Commons:
    docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md.'
  severity:
    nothing_barred: breach
    barred_less_than_the_days_share: flag
  export_fields:
  - bill_record.invoices.issue_date
  - bill_record.invoices.catchup_period_start
  - bill_record.invoices.catchup_period_end
  - bill_record.invoices.catchup_adjustment_gbp
  - bill_record.invoices.catchup_raw_delta_gbp
  - bill_record.invoices.catchup_written_off_gbp
  - bill_record.payments.method
  checkable: true
  reading: >-
    Graded from 2026-11-04 (ev_back_billing_on_receipt) on the bill's own record, read from the ledger by named fields
    (domain_invariant_runner.bill_record): the raw export carries no issue date, no window a catch-up recovers and no invoice a
    payment settles. "12 months" is read as calendar months, as 21BA.1 words it, so energy on the day a year before issue is inside
    the window. A bill with no payment posted against it is unbounded (how it was paid is not on the record); a bill collected by
    direct debit is Scenario B's case and not graded here. The barred amount is the bill's written-off figure, graded as the act it is.
    Not a bound: the days share. 21BA asks for units "reasonably considered" consumed in the window and a profile apportionment can
    move it (§5, code gap 3), so a bill that bars something but less than the days share is a flag. GAP (§16): whether a window part on
    direct debit and part on receipt is Scenario B for its DD months is not published; the row grades the whole window as demanded on
    the bill, the over-barring direction §16 names.
- id: INV_PLAN_REOFFER_FOLLOWS_A_MISSED_BILL
  family: collections_sequence
  grades: ledger
  counts:
    numerator: re-offers of the repayment plan ("a further bill missed") where no bill of the household fell due between the journey's previous plan offer or re-offer and the re-offer, both inclusive,
      or every bill that did was paid in its window
    denominator: every re-offer of the repayment plan, once per household journey
    unit graded: one repayment_plan_reoffer event on one billing account's collections journey
  statement: The desk's re-offer says "a further bill missed once the plan was offered". It is accurate only if a bill fell due since the previous offer and was not paid in its window. A re-offer
    after every such bill was paid in full is a contact telling a household it missed a bill it paid.
  predicate: 'for each repayment_plan_reoffer on date E in a journey whose previous repayment_plan_offer or repayment_plan_reoffer is on P: breach unless some credit bill of the billing account (both fuel
    legs) with P <= due_date <= E is missed. A bill is missed when what landed on its own leg on days issue_date..due_date inclusive, from payment records posted against this invoice_number or against none
    (payments received, scheme credits carried and account credit netted, each on a payment whose outcome put money on the account, and the paid part of a failed collection), is short of total_amount_gbp
    by more than half a penny. The bill''s own credit_applied_gbp is not read.'
  lower: 1 missed bill since the previous offer
  upper: null
  source: 'docs/market_research/company_debt_management.md, "A further bill missed means the bill was not paid, not that a balance stood (2026-11-03)": "A bill counts as newly missed for the re-offer
    only when the cash that landed on the account between its issue and its due date, both inclusive, is short of the bill." "Telling a household that paid a bill in full on its due date that it missed
    that bill is not accurate." "What triggers a fresh 27.6 offer is fresh evidence of difficulty ... A newly missed bill is such a reason. A bill paid in full and on time is not." Accuracy: SLC 0, "complete,
    accurate and not misleading". The same page, "Paid means what the bill asked (2026-11-04)": "The export''s `credit_applied_gbp` on a failed bill is that later credit, not money that landed in the
    window"; "the window held a late payment for the previous bill, with its £67 EBSS ... and the bill itself was paid 37 days late." Attribution: account_hierarchy_payment_allocation.md s.1, a payment
    allocates to the invoices its remittance names, else oldest-first.'
  severity:
    violation: breach
  export_fields:
  - events.collections_journeys
  - bill_record.invoices.issue_date
  - bill_record.invoices.due_date
  - bill_record.invoices.total_amount_gbp
  - bill_record.invoices.invoice_number
  - bill_record.payments
  checkable: true
  reading: >-
    Graded from 2026-11-04 (ev_reoffer_follows_a_missed_bill). "Further" is read as a bill the previous offer did not answer, so the
    window opens on the previous plan offer or re-offer, not at the start of the account: read from the start, one missed bill early in
    a journey licenses every later re-offer (23 breaches on the 0a6391d186 book against 4,610 read this way). The window is inclusive at
    both ends, the lenient reading. Cash is the leg's own, as the knowledge page's measurement reads it ("each bill judged on its own
    leg's cash"). Two tightenings from 2026-11-04, each on the b3ce2a4e73 book (11 breaches to 7). (1) Credit counts only where a
    payment record against the bill carries it, dated in the window: on that book every bill with credit_applied_gbp whose collection
    went through has such a record (605 in the window, 25 after it), and none of the 67 whose collection was returned does, because
    there the figure is a credit bill 4 to 9 months later that settled the debt (SYN-2016-066, -380). A bill not paid by its due date
    is missed; credit applied later does not un-miss it. (2) Cash is the bill's own: a payment posted against an older invoice pays
    that one, so it does not count, and neither does a scheme credit riding on it (PROS-2020-0016: the April bill's late £19.37 and
    its £67 EBSS fell in the May bill's window, and the May bill was paid 37 days late). This is stricter than the page's design
    choice ("Cash for an older debt in the same window counts towards the bill"), which was the desk's test for a balance with no
    earmark. The ledger's payments name their bill, and oldest-first gives the older bill's money to the older bill too. A payment
    naming no bill still counts towards any bill whose window holds it (none on that book). SYN-2016-306 fell to either rule. GAP A6
    (the page): no published source says how a supplier tests "this bill was paid" on a balance-based account.
- id: INV_CAST_TARIFF_LABEL_IS_THE_BILLED_TERM
  family: tariff_terms
  grades: page
  counts:
    numerator: Explore cast moments x fuel leg whose printed tariff label names a kind other than the term the leg's bills record on that date, or a fixed term from a day other than its start
    denominator: every Explore cast moment that prints a tariff label, once per fuel leg the label speaks for, dated within the leg's supply (a moment after the leg's last supplied day is graded against
      the term it ended on)
    unit graded: one moment (one dated entry of a cast slot's `moments`) on one fuel leg; the moment's two labels (supplier panel "Tariff" and portal `tariff`) are graded together
  statement: A tariff label Explore prints ("Fixed from 24 Jan 2024", "Standard variable since 1 Feb 2020") must be the tariff term the household's bill records for the moment's date, per fuel.
  predicate: 'for each moment m and leg l the label names (an unprefixed label names every leg; "Electricity: ...; Gas: ..." names each): term t = the contracted term on l''s bills holding date(m). Breach if
    the printed kind (Fixed -> fixed, Standard variable -> svt) != t.tariff_type, or the kind is fixed and the printed "from" date != t.tariff_effective_from. Flag if the kind is svt and the printed "since"
    date != the first day of the unbroken run of svt terms holding t; flag if the moment is dated the day t starts and the printed kind is the kind of the term ending the day before; flag if the label
    cannot be read.'
  lower: null
  upper: null
  source: 'site/knowledge/tariffs-and-the-default-tariff (site/data/knowledge_topics.json): "A fixed deal locks the unit rate and standing charge for 12, 18 or 24 months ... and ends with a renewal letter
    42-49 days before it expires." "A GB household that does nothing at the end of a fixed deal moves to its supplier''s default tariff". So a household''s tariff on a date is one term, fixed or default,
    and the bill records it. Accuracy of what the household is shown: docs/market_research/back_billing_and_liability.md §12, SLC 0, communications must be "complete, accurate and not misleading".'
  severity:
    kind: breach
    fixed_start: breach
    svt_since: flag
    term_boundary: flag
    label_not_read: flag
  export_fields:
  - periods.contracted_terms
  - cast_tariffs
  checkable: true
  reading: >-
    Graded from 2026-11-04 (ev_cast_tariff_label) on the Explore cast (explore_cast.json beside --printed, or --cast) against the
    raw export's contracted terms. The cast names its household by base account; both legs of a dual-fuel household share it as their
    billing account. A book graded without a cast reads NOT_IN_EXPORT, never clean. The printed rate ("Fixed at 267.0 £/MWh") is not
    graded: what that figure includes is not stated on the page. tools.domain_invariant_runner.grade_cast_tariff_labels grades one cast
    file against one book.
