- id: INV_NON_COMMODITY_WITHIN_ALL_IN
  family: tariff_structure
  statement: The non-commodity part of an all-in unit rate is non-negative and no larger than the all-in rate itself.
  predicate: 0 <= non_commodity_rate_gbp_per_mwh <= unit_rate_p_per_kwh x 10
  lower: 0.0
  upper: unit_rate_p_per_kwh x 10 (GBP/MWh)
  lower_source: logic
  upper_source: 'logic: the unit rate is all-in, so it contains the non-commodity part (docs/market_research/default_tariff_cap_and_epg_on_the_bill.md ''its unit rate already contains every non-commodity
    cost'')'
  export_fields:
  - non_commodity_rate_gbp_per_mwh
  - unit_rate_p_per_kwh
  checkable: true
  gap: null
  source: logic
  severity:
    violation: breach
