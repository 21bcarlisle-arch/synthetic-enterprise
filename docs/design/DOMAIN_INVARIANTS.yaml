  - tariff_effective_from
  - tariff_effective_to
  - tariff kind
  - register_id
  - payment_method
  - payment_date
  - segment
  - commodity
  checkable: true
  gap: regional spread of the unit rate (see regional_caveat)
  source: docs/domain_artefact_library/regulatory/ofgem_cap_unit_rate_composition.json (by_payment_method.*.periods); docs/domain_artefact_library/regulatory/ofgem_default_tariff_cap_windows.json (cross-check,
    EPG); docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md
