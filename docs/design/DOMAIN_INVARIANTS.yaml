- id: INV_DEFAULT_DUAL_FUEL_COST_FOLLOWS_THE_PUBLISHED_DEFAULT_BILL
  family: bill_level
  grades: ledger
  statement: 'At benchmark consumption, the supplier''s annual default (SVT) dual-fuel cost moves year on year in the same direction as Ofgem''s published default bill: the large-legacy-supplier average
    SVT (RMI) for 2016-2018, the cap level from 2019.'
  applies_to:
    commodity: dual fuel (electricity single-rate + gas)
    segment: domestic
    tariff: svt (default/evergreen)
    payment: direct debit (the published series is DD only)
  basis: 'Ratio cost(year)/cost(year-1). cost(year) = the supplier''s own DD default tariff priced at 3,100 kWh electricity + 12,000 kWh gas, standing charges included, day-weighted over the calendar year
    across its default price windows. VAT-invariant (5% domestic throughout 2016-2019, svt_rates §1a), so inc- or ex-VAT gives the same ratio. Benchmark: 3,100 / 12,000 kWh is the cap launch TDCV (tariffs_and_the_default_tariff_2026-10-25.md
    §4: ''Typical consumption values: 3,100 kWh a year electricity and 12,000 kWh gas'') and the cap model''s pre-2026 basis (ofgem_cap_unit_rate_composition.json basis.benchmark_consumption; gas_benchmark_consumption_kwh_per_year).
    The cheapest_fix note §1 grades the pre-Apr-2020 TDCV at M; svt_rates §1a gives gas as ''12,000-12,500'' for Ofgem''s 2016/2017 SVT publications.'
  evaluation: 'For each row, compute the ratio over the default price windows the supplier actually published in each calendar year; breach if ratio <= lower (the sign differs from the published move).
    Holding consumption fixed for both years is deliberate: the published series is a price index at TDCV, so household-use changes must not enter. A year with no default price window for the full year
    is graded on the days it has, and says so.'
  band: 'Same sign as the published change; NO dead-band. Reasoning: every published move here is clear of zero (+4.30%, +5.19%, +2.6%). The dead-band a professional would want is the spread of a single
    supplier''s annual move around the large-legacy average, and no source read publishes it: GAP. The one in-evidence candidate, the ±5% spread of 2017 Big Six gas price actions (svt_rates §1b), is a per-fuel
    LEVEL spread, not a dual-fuel change spread; adopting it would swallow the 2016->2017 test entirely (+4.3% inside ±5%), which errs FOR the world, not against it (F11), so it is not adopted. Magnitude
    (upper) is GAP for the same reason. Severity is flag, not fail: pre-cap SVTs were supplier discretion and one supplier can lawfully diverge, but a world whose default falls while every published default
    rose needs a stated reason.'
  rows:
  - from: '2017-01-01'
    to: '2017-12-31'
    pair: 2016 -> 2017
    published_change: +4.30% (1,117 / 1,071)
    lower: 1.0
    upper: null
    lower_source: 'docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md §2 table: ''2016 (annual avg, n=12mo) | 1,071'' and ''2017 (annual avg) | 1,117'', both ESTABLISHED, default
      = ''large-legacy SVT average (no cap existed)''; series = Ofgem RMI ''Retail price comparison by company and tariff type: Domestic (GB)'', ''typical domestic dual fuel customer paying by direct debit''
      (§0). Also svt_rates §1b: ''The default dual-fuel bill rose. Ofgem RMI ... £1,071 (2016), £1,117 (2017), £1,175 (2018)''.'
    upper_source: 'GAP: no published single-supplier dispersion of annual SVT moves'
    note: 'Supporting supplier actions (svt_rates §1b): 2017 rises were mostly electricity (BG +12.5% elec, gas unchanged; EDF elec +8.4%, gas -5.2%; ScottishPower elec +10.8%); the gas cuts came in Feb-Mar
      2016. If the 2016 RMI reading used 12,500 kWh gas and 2017 used 12,000 (svt_rates §1a ''12,000-12,500'', which date not established), the constant-basis rise is LARGER than +4.3%, so the sign holds
      either way (derived, M).'
  - from: '2018-01-01'
    to: '2018-12-31'
    pair: 2017 -> 2018
    published_change: +5.19% (1,175 / 1,117)
    lower: 1.0
    upper: null
    lower_source: 'docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md §2 table: ''2017 (annual avg) | 1,117'' and ''2018 (annual avg) | 1,175'', ESTABLISHED, large-legacy SVT average,
      DD, dual fuel.'
    upper_source: 'GAP: as above'
  - from: '2019-01-01'
    to: '2019-12-31'
    pair: 2018 -> 2019 (regime boundary, pre-cap to cap)
    published_change: '+2.6% (derived: 2019 month-weighted cap level ~1,206 against 1,175)'
    lower: 1.0
    upper: null
    lower_source: 'docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md §2: 2018 annual avg 1,175 (large-legacy SVT); 2019 cap levels Jan 1,137, Apr 1,254, Oct 1,179 (the same RMI
      series'' ''Default tariff cap level'' column; also svt_rates §1 post-cap table). 2019 annual = (3x1,137 + 6x1,254 + 3x1,179)/12 = 1,206 (DERIVED, month-weighted). Same series and DD dual-fuel TDCV
      basis across the switch, per docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md §2 (''2016-2018 default is the large-legacy SVT average (no cap existed); from Jan 2019 it
      is the published cap level'').'
    upper_source: GAP
    note: The one pair crossing the regime switch; the 2019 default is also bounded by INV_UNIT_RATE_SVT_*, so this row mostly tests the 2018 level. Drop it if the suite keeps this invariant strictly pre-cap.
  gap_rows:
  - from: '2016-01-01'
    to: '2016-12-31'
    pair: 2015 -> 2016
    lower: null
    upper: null
    lower_source: 'GAP: no 2015 annual RMI default level appears in any note read (docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md §2 starts at 2016; tariffs_and_the_default_tariff
      §3 gives only the 2015 gap to the cheapest, not the level).'
    upper_source: GAP
