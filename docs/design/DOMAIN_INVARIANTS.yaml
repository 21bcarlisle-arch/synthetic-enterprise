meta:
  written_by: blind agent, 2026-10-26, read only site/knowledge, docs/market_research, docs/domain_artefact_library
  conventions:
    unit_rate: p/kWh EX-VAT all-in (export unit_rate_p_per_kwh)
    standing_charge: GBP/day EX-VAT (export standing_charge_gbp_per_day)
    row_dates: from/to inclusive
    null_bound: null = GAP, never 0
    grades: 'The record a row reads, named because a green row over a record the customer never sees proves nothing about what the customer was shown (second cold read, N1, 2026-10-28). ledger = the billing ledger, read through the raw export (company/billing/raw_account_export: raw_account and account_events). invoice = the bill as the customer page renders it (site/data/customers/<id>.json `invoices`). page = a figure the page itself prints beside the bill (that file''s `ledger` balances and its `reaction_chain` collections steps). A row about what the customer is shown needs a twin graded on the invoice or the page.'
  blindfold_disclosure: Several market_research notes quote code paths and constants from company/ and simulation/ (e.g. a ±5% DD review threshold, a 15,000 kWh electricity envelope, 'the world bills at
    GB average', 'the world has no Economy 7 homes'). They were seen incidentally while reading the notes; no bound here is taken from them.
