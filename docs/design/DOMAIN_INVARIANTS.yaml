- id: INV_UNIT_RATE_EPG_HOUSEHOLD
  family: unit_rate
  grades: ledger
  statement: From 1 Oct 2022 to 30 Jun 2023 the unit rate a domestic household was CHARGED did not exceed the Energy Price Guarantee rate.
  applies_to:
    commodity: electricity and gas
    segment: domestic
    tariff: 'svt (fixed: see note)'
  basis: p/kWh ex-VAT; EPG 34.0p/kWh elec and 10.3p/kWh gas inc VAT, DD (340.0 / 103.2 GBP/MWh)
  rows:
  - from: '2022-10-01'
    to: '2023-06-30'
    commodity: electricity
    lower: null
    upper: 32.381
    upper_source: docs/domain_artefact_library/regulatory/ofgem_default_tariff_cap_windows.json#windows[from=2022-10-01..2023-04-01].elec_epg = 340.0 GBP/MWh inc VAT; /10/1.05 = 32.381
  - from: '2022-10-01'
    to: '2023-06-30'
    commodity: gas
    lower: null
    upper: 9.829
    upper_source: docs/domain_artefact_library/regulatory/ofgem_default_tariff_cap_windows.json#windows[].gas_epg = 103.2 GBP/MWh inc VAT; /10/1.05 = 9.829
  note: The EPG also reached fixed tariffs, but the commons and the K8 page carry no scheme text for how (docs/market_research/default_tariff_cap_and_epg_on_the_bill.md GAPs). Standing charges were NOT
    changed by the EPG (docs/market_research/tariffs_and_the_default_tariff_2026-10-25.md §4).
  export_fields:
  - unit_rate_p_per_kwh
  - non_commodity_rate_gbp_per_mwh
  - contracted_terms.tariff_type
  reading: >-
    Graded from 2026-10-30 (ev_unit_rate_epg_household). The export now states the rate's basis (raw_account_export FIELDS): a period's
    unit_rate_p_per_kwh is the energy line the household was charged over its kWh, after the Treasury's EPG share and before network and policy
    costs, so the household's all-in ex-VAT rate is unit_rate_p_per_kwh + non_commodity_rate_gbp_per_mwh / 10. Measured before relying on it,
    on the 9553d403b7 book: on EPG-window SVT bills the contracted term rate less the Treasury's share per kWh lands on 32.38 (electricity)
    and 9.829 (gas). Unit: a domestic period on one SVT term wholly inside a row's window, with kWh and a single rate. Tolerance is the print's
    own, not chosen: half a penny over the period's kWh, half the printed rate's last digit, half this file's last digit.
  source: docs/domain_artefact_library/regulatory/ofgem_default_tariff_cap_windows.json#epg_note, windows[].elec_epg/gas_epg; docs/market_research/ofgem_cap_windows.md §4
- id: INV_STANDING_CHARGE_SVT_ELEC
  family: standing_charge
  grades: ledger
  statement: A domestic electricity default-tariff standing charge is non-negative and at or below the cap's nil-consumption allowance for the window and payment method.
  applies_to:
    commodity: electricity
    segment: domestic
    tariff: svt/deemed
