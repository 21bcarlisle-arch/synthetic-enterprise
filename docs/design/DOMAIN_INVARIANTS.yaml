    INV_OVERDUE_WITHIN_PAGE_BALANCE, the last three rows) for format
  blindfold_disclosure: 'Seen incidentally inside the knowledge pages, no bound taken from any: company/regulatory/epg_reconciliation_register.py, simulation.price_cap_enforcement.*, simulation.svt_product.*,
