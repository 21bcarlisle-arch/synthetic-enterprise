    it would pass through, in the CHEAPEST region. The artefact''s own reading (basis.cost_floor.what_is_left_out): ''A default rate between this floor and the cap is a commercial choice; a rate under it
    is under the energy, network and policy cost the cap passes through.'' A pre-cap default under the cheapest region''s pass-through has no ordinary commercial reading: CMA (2016) found SVTs priced ABOVE
    what costs justified, not below (docs/market_research/what_a_renewal_decision_is_for_a_gb_domestic_customer.md, ''Which book...''). Lowest region, not median: a single GB-wide floor must hold for a
    household in any region, so the region minimum is the honest floor; it is loose for high-cost regions by design.'
  upper_gap: 'GAP. (1) No statute: the Tariff Cap Act 2018 took effect 1 Jan 2019 (docs/market_research/tariffs_and_the_default_tariff_2026-10-25.md §4). (2) Ofgem''s back-cast cap level (unit_rate_p_per_kwh_ex_vat
    in the same rows) is NOT a ceiling: the cap was introduced because SVTs sat above competitive cost. CMA EMI: the six large suppliers earned ~12% more per unit on SVT than fixed for electricity and ~13%
    for gas, 2011-14, with SVT prices above what cost differences justify (what_a_renewal_decision_is_for_a_gb_domestic_customer.md); detriment about GBP 1.4bn a year 2012-15, almost GBP 2bn in 2015, ~9%
    of a dual-fuel bill (tariffs_and_the_default_tariff_2026-10-25.md V3 and §3). Reading the back-cast cap as an upper bound would flag the historically normal case. (3) The only published pre-cap default
    level is the large-legacy AVERAGE dual-fuel bill (Ofgem RMI), never per fuel or as a unit rate (svt_rates_active_passive_2016_2025.md §1a); an average across suppliers cannot bound one supplier from
    above, and no published per-supplier dispersion is in the evidence read. The world''s own back-derived per-fuel ranges (svt_rates §1 table, ±15%) are not used. Would close this: Ofgem''s per-supplier
    SVT comparison (28 Nov 2016) and ''SVTs: latest trends'' (Sep 2017) figures, named in svt_rates §1a but not tabulated in the notes.'
