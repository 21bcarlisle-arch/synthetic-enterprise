- id: INV_STANDING_CHARGE_FIXED
  family: standing_charge
  grades: ledger
  statement: A chosen fixed tariff's standing charge is non-negative; no regulatory ceiling applies.
  applies_to:
    commodity: electricity and gas
    segment: domestic
    tariff: fixed
  basis: GBP/day ex-VAT
  lower: 0.0
  upper: null
  lower_source: logic
  upper_source: 'GAP: outside SLC 28AD (docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md item 4)'
  export_fields:
  - standing_charge_gbp_per_day
  checkable: true
  gap: no ceiling exists for a chosen fix
  source: docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md
- id: INV_ANNUAL_USE_ELEC_ACCOUNT
  family: annual_use
  grades: ledger
  statement: A domestic electricity account's annual consumption is non-negative and physically deliverable; above the published p99 of its class it is a premise to confirm, not an impossibility.
  applies_to:
    commodity: electricity
    segment: domestic
  basis: 'kWh per year = sum of consumption_kwh over a run of consecutive periods covering 365 days (no scaling of partial years: use only complete 365-day runs; electricity in NEED is NOT weather-corrected;
    NEED electricity year Feb 2024 - Jan 2025)'
  lower: 0.0
  upper: 201480
  lower_source: 'logic: import consumption cannot be negative'
  upper_source: 'physics belief: a single-phase supply at 100 A is about 23 kVA (docs/market_research/network_limits_on_home_electrification_2026-10-25.md line 92 ''100 A ≈ 23 kVA [derived]''; ''SSEN treats
    ≤100 A per phase as typical''). 23 kW x 8,760 h = 201,480 kWh/yr if run flat out all year. Three-phase domestic supplies exist, so this is a belief bound for single-phase homes; above it, breach.'
  flag_bands:
  - class: all domestic
    flag_lower: 500
    flag_upper_p99: 14300
    median: 2600
    p95: 8600
    share_above_25000: 0.0034
  - class: 'gas-heated (proxy: same customer_id also holds a gas account)'
    flag_upper_p99: 12200
    median: 2500
    p95: 7300
    share_above_25000: 0.0017
  - class: 'gas not main heating fuel (proxy: customer_id holds no gas account)'
    flag_upper_p99: 18200
    median: 3200
    p95: 12100
    share_above_25000: 0.011
  flag_source: 'docs/market_research/need_domestic_electricity_high_tail.md ''Measurement — 2024 electricity year'' table; flag_lower 500 = NEED metadata ''removed due to being ... too small (under 500
    kWh)'' (a statistics filter: voids and second homes are real)'
  not_a_ceiling: '25,000 kWh is DESNZ''s suppression threshold, NOT a domestic ceiling: 0.34% of all domestic and 1 in 17 large pre-1930 detached homes without mains gas exceed it (docs/market_research/need_domestic_electricity_high_tail.md
    ''THE CENSORING FACT'').'
  book_level: Share of the book's complete account-years above the class p99 should be about 1%. Flag if it exceeds the one-sided 99.9% binomial upper bound for p = 0.01 at the book's n (the 99.9% is a
    method choice, not a sourced number). E&W 2024 percentiles applied to all years is a stated simplification.
  physics_per_period:
    upper_kwh_per_day: 552
    rule: consumption_kwh / days_in_period <= 552 (23 kW x 24 h, same single-phase 100 A belief)
  export_fields:
  - consumption_kwh
  - period_start
  - period_end
  - days_in_period
  - customer_id
  - commodity
  - volume_basis
  checkable: true
  gap: no published P1 (lower tail below the 500 kWh filter is unmeasured); direct-electric class tail is heavier than the 'gas not main heating' row shows
  source: docs/market_research/need_domestic_electricity_high_tail.md
- id: INV_ANNUAL_USE_GAS_ACCOUNT
  family: annual_use
  grades: ledger
  statement: A domestic gas account's annual consumption is non-negative; above 50,000 kWh (DESNZ's own 'too large' cut) or the class p99 it is a premise to confirm.
  applies_to:
    commodity: gas
    segment: domestic
  basis: kWh per year over a complete 365-day run of consecutive periods. NEED gas is WEATHER-CORRECTED (2024 gas year); an actual-weather year (e.g. a cold 2018 or 2010-type winter) can sit above it.
  lower: 0.0
  upper: null
  lower_source: logic
  upper_source: 'GAP: no physical domestic gas ceiling (meter capacity) is in the allowed sources'
  flag_bands:
