  gaps:
  - 'GAP (EPG): no published multi-register / Economy 7 EPG unit rate exists in the commons or the knowledge layer. ofgem_default_tariff_cap_windows.json carries elec_epg 340.0 GBP/MWh (single-rate typical
    household); ofgem_cap_multi_register_unit_rates.json basis.epg says its multi-register level is not carried; the GOV.UK EPG regional-rates page (quoted in a_storage_heated_homes_default_tariff_is_two_rate.md
    R4) says suppliers set the discounts on the individual E7 rates and publishes single-rate figures only. The household-side E7 ceiling in 2022-10..2023-06 is therefore null; only the cap is graded. Deriving
    one (for example the multi-register cap less the single-rate cap-minus-EPG discount) would be a constructed number, not a published one, and is not done. Closing it needs the EPG scheme text or the
    government''s per-supplier E7 discount rule.'
  - 'GAP (non-energy per register): non_commodity_amount_gbp is printed as one bill total. N is taken as uniform per kWh across Day and Night. If the supplier''s non-energy charge differs by register (e.g.
    time-banded network charges), N at the bill''s realised split differs from N at the 58/42 assumed split, and the grade is off by (realised - assumed share) x (difference in per-register non-energy rate).
    Not visible on the bill.'
  - 'GAP (2026+): the multi-register benchmark kWh changed from P15b and again from P16b and the new values are not witnessed in the commons; not graded from 2026-01-01.'
  - 'GAP (pre-2019): no statutory ceiling existed; not graded (honestly null, not zero).'
  - 'GAP (28AD Default Fixed Term Contracts): 28AD also covers a default fixed term; a printed term_tariff_type ''fixed'' cannot be told apart from a chosen fix, so fixed bills are not graded.'
  - 'GAP (multi-register DD column uncorroborated beyond one point): only Q1 2019 is checked against a published figure (15.4p inc VAT). Every other window rests on the cap model derivation.'
  - 'GAP (regional, payment method): see regional_caveat and payment_method_caveat.'
  - 'Disagreement noted: slc_28ad_multi_register_cap_test.md quotes 28AD.34 referring to ''28A.4'' and ''28A.21'' (the consolidation''s own drafting carried from the prepayment cap); the artefact flags
    this itself. The licence''s split paragraph is 28AD.36(a); the knowledge pages (a_storage_heated_homes_default_tariff_is_two_rate.md R3) cite it correctly. No page-versus-licence disagreement on the
    split was found.'
