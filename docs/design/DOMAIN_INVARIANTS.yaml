  tolerance:
    upper_relative: 0.015
    upper_absolute_p_per_kwh: 0.5 / consumption_kwh (half a penny of the printed non_commodity_amount_gbp spread over the bill's kWh; N is derived from a rounded amount)
    reason: 'The ceilings are GB MEDIANS of the model''s 15 Total rows, not a published GB-average level and not the household''s regional level, so they carry the derivation''s own error. For the single-rate
      column built the same way, the worst disagreement with the published cap over 21 periods is 1.34% (docs/domain_artefact_library/regulatory/ofgem_cap_unit_rate_composition.json#cross_check_against_published_cap_levels.worst_relative_error
      = 0.0134; computed here against ofgem_default_tariff_cap_windows.json elec/10/1.05 the model sits BELOW the published level in 15 of 21 windows, worst Oct 2020 at -1.34%, so the derivation errs toward
      false breaches). The multi-register column has no published series to cross-check (docs/domain_artefact_library/regulatory/ofgem_cap_multi_register_unit_rates.json#basis.corroboration), but ONE published
      point exists: Ofgem''s 2018 decision overview gives the Q1 2019 multi-register level as 15.4p/kWh inc VAT (docs/market_research/tariffs_and_the_default_tariff_2026-10-25.md §4 ''Electricity multi-register:
      23p/day and 15.4p/kWh''; the same list''s single-rate 16.5p = 15.723 x 1.05, so the list is inc-VAT); 14.63 x 1.05 = 15.36, inside that figure''s own 0.05p rounding. 1.5% is the single-rate tolerance,
      carried because the column is built identically and the one corroborating point agrees to 0.3%. It does NOT absorb a regional spread: see regional_caveat.'
  regional_caveat: 'What GB-median levels force: the row is exact only for a supplier that prices every household at the GB-average level. The cap is set per region (14) (docs/market_research/default_tariff_cap_and_epg_on_the_bill.md
    ''Regional level''; tariffs_and_the_default_tariff_2026-10-25.md §4: network allowance £234-£298 typical dual fuel), and a household in a high-network region may lawfully be charged above the GB median.
    The regional spread of the multi-register unit rate is NOT in the commons, so no regional margin is added: report (R - C) beside every breach so a reader can judge it. The bill carries no region. The
    page default_tariff_cap_and_epg_on_the_bill.md says the world bills every household at the GB average; that is a claim about the code, not established here, and if it stops being true this row false-fires
    in high-cost regions.'
  payment_method_caveat: The commons' multi-register column is DIRECT DEBIT only (docs/domain_artefact_library/regulatory/ofgem_cap_multi_register_unit_rates.json#what_this_is) and the printed bill carries
    no payment method. Graded at DD for every bill. For single-rate, standard credit sits at least 1.053x DD and prepayment 0.965-0.992x DD (default_tariff_cap_and_epg_on_the_bill.md 'Payment method', read
    off ofgem_cap_unit_rate_composition.json by_payment_method). So the DD grade can false-fire on a standard-credit E7 bill by up to about 5%, and is lenient on a prepayment one. If the evaluator can see
    from the same page that the account paid by standard credit in the window, a breach whose R/C sits within that window's single-rate standard-credit/DD unit-rate ratio is printed as FLAG, not breach,
    with the ratio named as a BELIEF (carried across meter types, not published for multi-register).
  severity:
    above_upper: breach (SLC 28AD.2, .4, .34, .36(a))
    straddling_bill_above_day_weighted_ceiling_only: flag
    not_graded: reported with its reason, never counted as a pass
