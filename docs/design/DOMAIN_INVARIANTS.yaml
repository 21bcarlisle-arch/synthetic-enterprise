  tolerance:
    upper_relative: 0.015
    reason: 'The upper bound is Ofgem''s model derivation; its worst disagreement with the published cap levels across 21 periods is 1.34% (docs/domain_artefact_library/regulatory/ofgem_cap_unit_rate_composition.json#cross_check_against_published_cap_levels.worst_relative_error
      = 0.0134). 1.5% absorbs that and publication rounding, nothing else. Lower bound has no tolerance: it already uses the regional MINIMUM commodity share (conservative).'
  regional_caveat: 'GAP: both bounds are GB medians. The cap is set per region (14 regions) and the export carries no region. The regional spread of the electricity UNIT RATE is not in the commons (only
    the commodity share''s regional min/max is). Report the exceedance size beside any upper breach so a reader can judge it; do not widen the bound by an invented regional margin.'
  epg_note: '1 Oct 2022 - 30 Jun 2023: the Energy Price Guarantee held the household-charged rate at 34.0p/kWh inc VAT (= 32.381 ex VAT) while the supplier''s tariff could sit at the cap (Treasury paid
    the gap). The export does not say which of the two unit_rate_p_per_kwh holds, so the EPG rows accept both: lower = min(commodity floor, EPG ex-VAT), upper = cap. The household-side check is INV_UNIT_RATE_EPG_HOUSEHOLD.'
  prepayment_note: Prepayment sat under the CMA prepayment cap (Apr 2017 - end 2020) and joined the default cap from 1 Apr 2021 (docs/market_research/tariffs_and_the_default_tariff_2026-10-25.md V4). Whether
    the model's prepayment column for 2019-01..2021-03 equals the CMA cap then in force is NOT established; treat upper_prepayment in those rows as a belief.
  floor_meaning: 'The floor is Ofgem''s DIRECT FUEL + CAPACITY MARKET allowance (the commodity components DF, CM of the cap model), i.e. the regulator''s efficient wholesale cost for that delivery window.
    An SVT below it is selling below the cap''s own wholesale cost: lawful but a flag a professional would ask about, so severity is ''flag'' below and ''breach'' above.'
  severity:
    below_lower: flag
    above_upper: 'breach (SLC 28AD.2, at any consumption level: unit rate must be at or below the cap slope, docs/domain_artefact_library/regulatory/slc_28ad_multi_register_cap_test.md ''What the text settles''
      item 3)'
