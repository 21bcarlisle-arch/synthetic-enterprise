  checkable_part: 'Graded by tools/domain_invariant_runner.ev_statute_barred_write_off from 2026-10-27, as a necessary condition: at a write-off under the limitation rule on W, some bill fell due by W - 6 years, was not collected by W, and no payment on the household''s account is dated after W - 6 years.'
  uncheckable_part: 'That EVERY bill in the sum is barred needs the write-off to name its bills, and the company''s collections record posts a sum.'
  gap: 'Per-bill form ungradeable: the write-off does not name its bills. The book-wide count of early write-offs is in docs/staging/SEAT_FINDING_A_STATUTE_BARRED_WRITE_OFF_LANDS_BEFORE_SIX_YEARS_AND_REPEATS_MONTHLY_2026-10-26.md (24 of 602); this row adds the per-bill form. The household''s jurisdiction is not exported, so the Scottish five years cannot be applied (GAP).'
- id: INV_MPAN_CORE_FORMAT
  family: event_fuel_consistency
  grades: ledger
  statement: An electricity supply point's MPAN core is 13 digits. The first two are the distributor ID (10-23 for the fourteen DNO licence areas, 24 upward for independent distribution network operators, IDNOs), and the last is a check digit over the first twelve. Its region is the distributor's.
  predicate: commodity == electricity => mpan core matches ^[1-9][0-9][0-9]{11}$ (distributor ID 10-23 DNO, 24 upward IDNO) and the check digit is valid
  lower: null
  upper: null
  source: 'Structure of the GB MPAN core under the MRA, now the REC (Elexon / Retail Energy Code). The reader cited it with high confidence, and it is NOT in the commons: a GAP until a commons page carries it. Cold-read objection O31: OCC-f6813bf9f05e prints "Supply point 19494047720" (11 digits), and the record''s mpan bottom_line is 19494047720.'
  severity:
    violation: breach
  export_fields:
  - mpan
  checkable: true
  gap: 'Graded by tools/domain_invariant_runner.ev_mpan_core_format from 2026-10-27. The commons page is now docs/domain_artefact_library/regulatory/mpan_core_structure_and_check_digit.md, read in a secondary source; the primary text of the check digit is still a GAP. Restated 2026-10-27: that page gives DNO IDs 10-23 and IDNO IDs from 24 upward with NO upper bound (its table runs 24 to 52 with gaps, tagged citation needed; the current list is a GAP). The regex therefore accepts any two-digit ID from 10 to 99, the width the 13-digit core allows; it does not check that an ID above 23 is allocated. No book draws an IDNO core yet.'
- id: INV_EBSS_CREDIT_ON_THE_BILL
  family: government_scheme
  grades: invoice
  twin_of: INV_EBSS_CREDIT_EACH_MONTH_OCT22_MAR23
  statement: The bill a domestic electricity household reads for each month from October 2022 to March 2023 that it held the account at 00:00 on the 1st shows that month's Energy Bills Support Scheme credit (£66 in Oct and Nov 2022, £67 from Dec 2022 to Mar 2023). A gas bill shows none.
  predicate: for each bill on the page whose period covers the 1st of one or more months m in [2022-10, 2023-03] that a domestic electricity account held at 00:00 on that 1st, the scheme credit it prints lies in [sum credit(m) - 1, sum credit(m) + 1]; a qualifying month no page bill covers is a breach (nothing was shown); a gas bill prints no scheme credit
  lower: null
  upper: null
  source: 'docs/market_research/energy_bills_support_scheme_delivery.md: "How it reached the account, by payment route", pay on receipt "credited to the account, shown on the bill" (ii.co.uk summary of the consumer guidance, a secondary source); "A bill the credit covered in part", pay on receipt, "The bill that followed showed it. The household paid the balance, so it paid the bill less the credit"; "An occupier''s deemed account", BEIS guidance 5.4 and 5.8 for who is owed which month, and Annex C, the supplier credits the Owner/Occupier account "on the bill". Second cold read N1 (2026-10-28): PROS-2019-0246''s ledger holds all six credits, GBP 400, and the page printed "The electricity bill for December 2022 was £598.04" with no credit line.'
  severity:
    violation: breach
  export_fields:
  - printed invoices.scheme_credit_gbp
  - printed invoices.period_end
  - commodity
  - segment
  checkable: true
  gap: 'Written 2026-10-28 from the knowledge page, not the code: the twin of the ledger row on the record the customer reads. Graded per bill, not per credit date, because the bill for a month is where that month''s credit is shown, by tools/domain_invariant_runner.ev_ebss_credit_on_the_bill on a book read with --printed (the published site/data/customers files); without them it reads NOT_IN_EXPORT, never clean. The page shows only what the bill printed, so the same prepayment GAP as the ledger row applies: a traditional meter''s voucher is not on the bill, and the export cannot tell smart from traditional. For direct debit the page says practice varied (some suppliers refunded the credit to the bank); this row asks only that the bill shows it, which every route the page names did except prepayment (GAP: no source fetched shows a DD bill that omitted it).'
- id: INV_OVERDUE_WITHIN_PAGE_BALANCE
  family: account_arithmetic
  grades: page
  twin_of: INV_OVERDUE_WITHIN_BALANCE
  statement: Every overdue amount the customer page prints on a collections step is part of what the same page says the account owes on that day, so 0 <= overdue <= balance owed.
  predicate: for each collections step the page prints with an overdue amount on date d, 0 <= overdue_gbp <= the page ledger's balance owed at the end of day d (its last running balance dated on or before d; nothing before its first entry), to the penny
  lower: 0
  upper: balance_owed_gbp
  source: 'Logic of an account ledger: an overdue sum is a subset of the balance (INV_OVERDUE_WITHIN_BALANCE''s source). Cold-read objections O10, O16 and O18: SYN-2016-356 shows "£23.88 owed" beside "GBP71.73 overdue", and "£59.77 owed" beside "GBP147.56 overdue". The second cold read, N1: the same shape behind O4 and O14.'
  severity:
    violation: breach
  export_fields:
  - printed ledger.entries.running_balance_gbp
  - printed reaction_chain.collections_*.amount_gbp
  checkable: true
  gap: 'Written 2026-10-28: the ledger row''s first leg, which the raw export cannot carry (two sums the company worked out), graded where the page prints both. Graded by tools/domain_invariant_runner.ev_overdue_within_page_balance on a book read with --printed. A cure and a write-off print no overdue figure and are not graded. The desk''s journey is the billing account''s, both fuels, so owed is the sum of the household''s fuel pages'' balances on that day and a step both pages print is graded once.'
- id: INV_BILLED_EX_VAT_RECONCILES_TO_REVENUE
  family: account_arithmetic
  grades: page
  counts: >-
    Per account (one household, one fuel), over its life to ledger.as_of_date. R = lifetime_revenue_gbp, "Revenue, before VAT": the energy the account was supplied, valued at its tariff (unit rate x kWh
    delivered + standing charge x days supplied), before VAT. B = the account's own bills before VAT: sum over invoices of (amount_gbp - vat_gbp), excluding any bill to a deemed occupier/owner account
    (ledger.total_deemed_gbp is not this household's), with any scheme credit netted off a bill added back (a scheme credit is the government paying part of the bill, not a lower price). E = the Energy Price Guarantee
    support the government paid the supplier for the account's energy, 1 Oct 2022 to 30 Jun 2023, before VAT, on the settled
    volume (each bill's epg_support_gbp): the household was billed the guaranteed rate, so E is in R and in no bill. Unit graded:
    per account. On the household page, both sums are taken over the same fuels.
  statement: >-
    What a supplier bills before VAT and what it supplied at its tariff are the same energy priced the same way. Over an account's life they differ only by energy not yet billed (the tail since the last
    bill), by an estimated run no actual read has yet corrected (either sign), and by energy the supplier may not bill under the 12-month back-billing limit (SLC 21BA). VAT, credits and write-offs are not
    part of the gap: VAT sits above both figures, a write-off is billed money left uncollected, and a refund or credit transfer moves cash, not price.
  applies_to:
    segment: resi and sme
    commodity: electricity and gas
  evaluation: >-
    Let T = R x max(0, end - last_period_end) / supply_days, where end = the account's supply end or ledger.as_of_date, last_period_end = the latest invoice period_end, and supply_days = days from the first
    period_start to end (the unbilled tail at the average daily value). Let U = the before-VAT amount of every bill after the account's last bill on an actual read (A): the open or closing estimated run.
    Let W = the part of ledger.total_written_off_gross_gbp written off under the back-billing limit, before VAT (zero when none is identified). Breach unless
    R - T - U - W - 0.01 R <= B + E <= R + U + 0.01 R. Ex-VAT B is taken from vat_gbp, not by dividing by 1.05, so an sme bill at 20% grades on its own VAT. The VAT rate itself is INV_VAT_RATE's, not this row's.
    Not graded when R is 0 or absent.
  lower: R - T - U - W - 0.01 R
  upper: R + U + 0.01 R
  lower_source: >-
    docs/market_research/unbilled_energy_and_revenue_assurance.md §1 table: K1 'billed < consumed, temporarily, by timing' (T), K2 'billed != consumed, until the next actual read' (U), K3 'legally capped
    at 12 months (SLC 21BA), so beyond 12 months the gap is the supplier's loss' (W); 'An estimated final bill closes its run' (U on a closed account). The 1% is a BELIEF (rounding and day-apportionment
    of standing charges across bill boundaries), set wide.
  upper_source: same §1 table, K2 (an over-estimate not yet corrected is billed > consumed); logic otherwise (a supplier cannot bill energy it did not supply beyond an open estimate).
  severity:
    outside: breach
  source:
  - docs/market_research/unbilled_energy_and_revenue_assurance.md
  - docs/domain_artefact_library/regulatory/uk_vat_rates.json ('reduced' 5%, 'home energy')
  - docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md
  - 'docs/market_research/default_tariff_cap_and_epg_on_the_bill.md, "How the supplier was paid, and on which volume": the EPG was reimbursed "based on electricity and gas settlement data" (GOV.UK) and reconciled to RF (Elexon), so E is on settled kWh, not billed kWh. Term added 2026-10-28 (residual R2), from that page, by a writer who had read the code.'
  - 'Cold read N2: a household supplied 2016-2019 (no scheme credit possible) shows Revenue, before VAT £2,277.10 against Billed, VAT included £1,998.82, i.e. about £1,903.64 before VAT, 16% below revenue on a closed account.'
  gap: >-
    Whether R nets a goodwill or compensation credit (credit_applied) is not established; the row excludes credit_applied and refund_debit from both sides and a goodwill credit could legitimately sit in the
    gap (GAP). The page does not mark which write-off is a back-billing one, so W may be unidentifiable; the runner should then report W as unknown and grade with W = 0 only as a flag. The 1% is a belief.
- id: INV_PAYMENT_RECORD_RECONCILES_TO_COLLECTIONS_DUE
  family: payment_record
  grades: page
  counts: >-
    Per account, per collection due: one scheduled collection is one bill's amount due on standard credit, or one month's direct-debit instalment on DD. A PAYMENT is a collection due that was paid in full
    within its window. A RETURNED payment is one DD presentation the bank returned unpaid (ARUDD) or a collection refused because the mandate was cancelled (ADDACS): an attempt, so one collection can carry
    up to three. A MISSED payment is a collection due that was not paid in full by its due date (DD: the presentation date), counted from the day after it. Amended 2026-10-29 from 'by the end of its window
    (Bacs 30 days; standard credit 30 days, a belief)': the 30 days is when a returned DD may be presented again, not when it counts as missed, and the desk opens its journey the day after the due date
    (debt_and_collections.md s.7.5). Prepayment has no collection due and is not counted. Extra one-off payments are not collections and count as neither. Unit graded: per account.
  statement: >-
    The household summary "N payments, R returned, M missed" counts collections, not ledger rows or reminder events. Every collection due whose window has closed by ledger.as_of_date is either paid or missed,
    never both and never neither. A return is an attempt on a collection, so returns never exceed three per collection, and every missed DD collection carries at least one return or a cancelled mandate.
  applies_to:
    segment: resi and sme
    payment_method: direct_debit and standard_credit
  evaluation: >-
    Let D = the collections due on the account whose due date fell before ledger.as_of_date. Breach unless N + M = |D|, N <= |D|, M <= |D|, R <= 3 x |D_dd| (D_dd the DD collections in D), and
    M_dd <= R (every missed DD collection has a returned presentation or a mandate cancellation). On a bill-paying account |D| is the count of invoices with status issued (not held, not to a deemed
    account) whose due date has passed. On fixed monthly DD, |D| is the count of instalments scheduled. Second leg, flag: a DD mandate that is presented again after two consecutive collections each ended missed,
    with no new instruction from the payer between them.
  lower: N + M = |D|
  upper: R <= 3 x |D_dd|
  lower_source: >-
    logic of a collection (each due collection resolves to exactly one outcome); docs/market_research/gb_domestic_bill_payment_failure_and_arrears_prevalence.md 'What each quantity IS' items 1 and 2: a DD
    return is a collection EVENT and a standard-credit bill unpaid by its due date is a different EVENT, 'late' defined against the bill's own due date.
  upper_source: >-
    docs/market_research/how_a_gb_supplier_decides_to_write_off_a_failed_payment.md (a): 'A returned DD may be re-presented up to twice (three attempts in all), within 30 days of the original
    presentation' (bureau statements of the Bacs rules; the rulebook itself members-only).
  severity:
    reconciliation: breach
    dd_kept_after_repeated_failure: >-
      flag, not breach: no licence condition sets when a supplier stops a DD. Published practice is British Gas, 'When a payment is not received, we will try again 14 calendar days later', and on a second
      failure 'we'll have to cancel your Direct Debit and send you a bill instead', moving the customer 'over to another payment option' (payments_and_direct_debit_2026-10-25.md 'Off direct debit and back
      on'; write-off note (a)). Power NI asks for the missed DD 'within 5 working days to remain on Direct Debit'. The licence's duty on the balance is SLC 27: identify payment difficulty, offer an
      ability-to-pay arrangement, escalate only after (write-off note (a)). A returned DD is not a write-off.
  source:
  - docs/market_research/how_a_gb_supplier_decides_to_write_off_a_failed_payment.md
  - docs/market_research/payments_and_direct_debit_2026-10-25.md (§3 ARUDD, ADDACS codes; 'Off direct debit and back on')
  - docs/market_research/gb_domestic_bill_payment_failure_and_arrears_prevalence.md
  - 'Cold read N3: "34 payments, 4 returned, 42 missed" on a 50-bill account (34 + 42 = 76 > 50); "6 payments, 4 returned, 0 missed"; a DD kept after 4 of 6 collections returned.'
  gap: >-
    No licence condition defines a missed payment (Ofgem's arrears bar is 91 days, SLC 14's objection gate 28; neither is a 'missed' definition). The due date is read from the payment event's own date
    (a DD return, a pay-on-receipt bill past due) and published practice (British Gas acts on a return when it happens and re-collects 14-30 days later); debt_and_collections.md s.7.5. How a part-paid collection should count is not published; the row counts it missed. The page does not carry a DD instalment schedule, so on fixed DD |D| must come from
    the ledger's invoice_raised and payment entries by month (one instalment per month, INV_DD_CADENCE). Which ARUDD reasons forbid re-presentation ('no instruction') is not on the page.
- id: INV_CARBON_PANEL_KWH_MATCHES_USAGE_PANEL
  family: carbon_reporting
  grades: page
  counts: >-
    Per account (one fuel), per calendar year Y: K_c = the carbon panel's kwh for that fuel and year; K_u = the sum of consumption.monthly[].kwh over the months of Y. Both are meant to count the energy the
    account used in Y (CO1: the panel's job is 'to show customers what they've saved and could save in CO2', which is emissions of energy used, not of energy billed). Unit graded: per account-year.
  statement: >-
    One quantity on one page has one value. The carbon panel and the usage panel agree on the kWh an account used in a year within rounding, and the carbon panel counts the same months the usage panel
    shows. If the carbon panel counts BILLED kWh (bills dated in Y, catch-ups included), it is a different quantity: it must say so, and it is then not the basis for a saving. A part year carries no
    annual figure.
  applies_to:
    segment: resi
    commodity: electricity and gas
  evaluation: >-
    Leg 1 (agreement): for each (account, fuel, Y) present on both panels, |K_c - K_u| <= max(12 kWh, 0.01 x K_u). Breach outside. Leg 2 (months): months_billed equals the number of months of Y with a
    usage-panel entry for that fuel. Leg 3 (part year): full_year is true only if the fuel was supplied on at least 328 of the days in Y (365 less 37), and when full_year is false the panel prints no
    annual co2e_kg figure (null, with a status naming the reason, e.g. part year, joined or left). A published co2e_kg beside full_year false, or beside months_billed < 11, is a breach.
  lower: -max(12 kWh, 0.01 x K_u)
  upper: +max(12 kWh, 0.01 x K_u)
  lower_source: >-
    BELIEF: the two figures should come from the same reads, so only rounding separates them: twelve monthly figures each rounded to the nearest kWh, plus 1% for day-apportionment of a bill that straddles
    a month end. Set wide on purpose.
  upper_source: same belief
  part_year_source: >-
    The house method (as quoted by the cold read): a part year 'has no figure'. The 328-day floor is CalTRACK's billing-method baseline, 'a 365-day baseline ... with no more than 37 missing days (10%)'
    (docs/market_research/proving_and_showing_household_savings_2026-10-25.md, CalTRACK section). Leg 2's 11-month cut is the same 10% read in months.
  severity:
    outside: breach
  source:
  - docs/market_research/proving_and_showing_household_savings_2026-10-25.md (CalTRACK)
  - docs/market_research/household_carbon_and_the_measures_that_save_it.md (DESNZ gas factor about 0.184 kgCO2e/kWh gross CV; 7,303 x 0.184 = 1,344 kg, so the panel's co2e follows its own kWh and the fault is the kWh)
  - 'Cold read N5: SYN-2016-371, 2017, carbon panel "Gas 1,345 kg 7,303 kWh billed over 8 month(s)" against a usage panel summing to 6,180 kWh for 2017; a part-year figure published.'
  gap: >-
    Whether the usage panel is apportioned consumption or the bills' own kWh by period_end month is not stated on the page; if the two panels use different bases, the row's first finding is that one
    quantity has two definitions, and the fix is to give both one (consumption). The 12 kWh / 1% tolerance is a belief, not sourced. Whether a part-year figure may be shown labelled as such (rather than
    none) is a design choice the house method has already made; the row grades that choice.
- id: INV_SMART_METER_BILLED_ON_ITS_OWN_READS
  family: read_duty
  grades: invoice
  counts: >-
    Per book, per fuel, per year: the share of bills on accounts whose meter_type is Smart that carry read_type E. Numerator: Smart bills with read_type E. Denominator: all Smart bills in the year (A, E and
    M; M is in the denominator only, because its meaning is not published to this reader). Unit graded: per fuel-year of the book, with a per-account flag.
  statement: >-
    A smart meter in smart mode sends its supplier the reads the supplier needs to bill, without consent: monthly data was never consent-gated, and since 3 November 2022 SLC 47 makes daily (Old System) or
    half-hourly (New System) the default, with monthly the floor a customer may opt out to. So a Smart account is billed on its own reads unless the meter has lost communications (traditional mode). Its
    estimated bills are bounded by the published smart-mode failure rate. The page copy 'read frequency is the customer's consent to give' is wrong and must be corrected: only data finer than the billing
    read is the customer's to give or refuse.
  applies_to:
    segment: resi
    commodity: electricity and gas
    meter_type: Smart
  evaluation: >-
    Book leg: for each fuel f and year Y, s = (Smart bills with read_type E) / (all Smart bills). Breach if s > upper(f); flag if s < lower. Account leg, flag: a Smart account with more than 6 consecutive
    monthly bills on read_type E (the Citizens Advice standard expects a smart customer to have a bill on a read within 6 months). The first bill after an account's supply start is excluded (a gaining
    supplier may not yet have enrolled the meter).
  lower: 0.01
  upper:
    electricity: 0.15
    gas: 0.25
  lower_source: >-
    BELIEF: BEIS data cited by Ofgem (2018), '6% of smart meter customers still receive estimated bills' (unbilled_energy_and_revenue_assurance.md K2). A book where no smart bill is ever estimated is
    not modelling communications failure; 0.01 is set far below the 6% so a small book cannot breach by sampling.
  upper_source: >-
    BELIEF from DESNZ Q4 2024: smart meters not in smart mode are 6.8% (electricity) and 14.2% (gas) of smart meters (unbilled_energy_and_revenue_assurance.md K7, 'each fuel at its own share';
    meter_read_latency_estimation_2026.md §1, 'When a smart meter loses smart functionality and needs to be read manually it is in traditional mode'). The bound is about twice each stock, to allow for
    transient failures, a meter not yet enrolled after a switch (SMETS1 '70% ... lost smart mode functionality' on switching, smart_meters_and_half_hourly_settlement_2026-10-25.md §1), and the year's
    flow over the year-end stock.
  account_leg_source: >-
    unbilled_energy_and_revenue_assurance.md K2: Citizens Advice star rating counts a bill on a read 'in the last 6 months (smart) or 12 months (traditional)' [M, search summary].
  consent_source: >-
    smart_meters_and_half_hourly_settlement_2026-10-25.md §4: DECC 2012 Data Access and Privacy Framework, 'Monthly data: no consent needed, for billing'; daily usable 'with clear opportunity for the
    customer to opt out'; half-hourly 'explicit (opt-in) consent'. SLC 47 as modified (Ofgem decision 7 Sep 2022, effective 3 Nov 2022): New System HH by default with opt-out to daily; Old System daily
    by default, opt-in to HH or opt-out to monthly. smart_meter_hh_data_consent_2026.md: billing reads 'flow to the supplier by default, not opt-in gated'.
  correction_to_brief: >-
    The cold reader's ladder (monthly no consent, daily opt-out, HH opt-in) is the 2012 framework and right for 2016 to 2 November 2022. From 3 November 2022 HH is the default for New System customers,
    with opt-out. Neither regime lets a customer refuse the billing read short of the meter leaving smart mode.
  severity:
    above_upper: breach
    below_lower: flag
    account_run_over_6: 'flag: a single meter may lawfully sit in traditional mode for a year; the book share is what grades the supplier'
  source:
  - docs/market_research/smart_meters_and_half_hourly_settlement_2026-10-25.md
  - docs/market_research/smart_meter_hh_data_consent_2026.md
  - docs/market_research/unbilled_energy_and_revenue_assurance.md (K2, K7)
  - docs/market_research/meter_read_latency_estimation_2026.md
  - 'Cold read N6: the page says of smart homes without half-hourly data that "read frequency is the customer''s consent to give".'
  gap: >-
    THE COMMONS DOES NOT HOLD THE DATA ACCESS AND PRIVACY FRAMEWORK OR SLC 47 (electricity) / its gas counterpart (believed SLC 41): checked docs/domain_artefact_library/INDEX.md,
    docs/domain_artefact_library/regulatory/ (23 files, none on smart data access) and scope_briefs/ (only ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY mentions the DCC). Both are read here only through
    market_research summaries; the licence text is owed to the commons. The gas condition number is the brief's belief, not verified. Bounds are beliefs: DESNZ publishes a year-end stock, not the flow
    of estimated smart bills, and no split of estimated bills by meter type is published (smart_meters... named gap 7). Whether M means a smart-transmitted read is not on the page.
- id: INV_ESTIMATE_FOLLOWS_THE_LATEST_ACTUAL_READS
  family: read_history
  grades: invoice
  counts: >-
    Per estimated bill (read_type E) on one meter_serial: e = consumption_kwh / days_in_period, the estimate's daily use. It is compared with what the supplier knew at issue, from its own actual reads (A)
    on the same meter_serial dated on or before the estimated bill's period_start. ref_short = the daily advance between the last two actual reads (closing_read_kwh difference over the days between them).
    The rung is the supplier's declared estimation policy for the account (declared_policy below), read from the page: QUOTE until the latest actual read on the meter_serial before period_start is
    switch_days or more after the change-of-supply day (the first bill's period_start less one day), READS after. On the quote rung: a = e / (mean daily share over the estimate's days), the annual figure the
    estimate implies. On the reads rung: ref_long = the daily advance over each window of at least 182 days, and at most 1,095 (36 months), that ends at the last actual read and starts at an actual read or at the change-of-supply opening
    read (the first bill's opening_read_kwh, dated the day before its period_start). Each reference is reshaped to the estimate's days by the published monthly shape: ref x (mean daily share over the estimate's days) / (mean daily share over the reference's days). Unit graded: per estimated bill.
  statement: >-
    An estimate follows the estimation policy its supplier declares for the account, not one method chosen in advance (the director's ruling of 2026-10-30). Under the baseline policy a new account is
    estimated from the consumption used in the quote, one annual figure spread by the shape, until its own reads span an advance; after that the estimate is built from the account's own actual reads, and a read the supplier holds moves it. After a read confirms a step change (an EV, a heat pump, a new occupant) the next estimate lies between
    what the latest advance says and what a longer annualised advance says, never below both or above both by more than the shape error.
  applies_to:
    segment: resi and sme
    commodity: electricity and gas
  declared_policy:
    rung_one: quote
    switch_days: 182
    quote_q: 0.05
    source: >-
      The company's own declaration (how_a_supplier_shapes_an_estimate_for_an_unread_month.md §7 and §10; company/billing/unread_month_estimate.MIN_ADVANCE_DAYS, held equal by
      tests/tools/test_the_domain_invariant_runner_reads_only_the_raw_export_and_every_evaluator_can_fire.py). A policy the supplier changes in an experiment is re-declared here, and the row grades the new one.
      quote_q is a BELIEF: the quote rung prints one figure, so only rounding and the figure in force moving should spread a; on the 209c3350ab book p99.9 |a/median - 1| is 0.46% and the largest 3.2%
      (SYN-2016-582 electricity, Aug and Sep 2017, after a first read; not traced).
  evaluation: >-
    Quote rung: on each meter_serial with two or more quote-rung E bills, breach unless (1 - quote_q) x median(a) <= a <= (1 + quote_q) x median(a); one quote-rung bill alone is not graded.
    Reads rung: for each E bill with at least two actual reads on its meter_serial before its period_start (otherwise not graded: the estimate rests on a registry EAC/AQ the page does not show), with the shaped
    references s_short and every s_long (none if no 182-day window exists): breach unless (1 - t) x min(s_short, every s_long) <= e <= (1 + t) x max(s_short, every s_long), with
    t = 0.30 electricity and 0.40 gas. For the flag only, s_long is the longest window of 182 to 365 days from an actual read (s_short if none). Flag when s_short > s_long (a read-confirmed rise) and e < 0.9 x s_long, or s_short < s_long (a confirmed fall) and e > 1.1 x s_long: the estimate went the wrong way.
    Use reads, not consumption_kwh, for the references, so a catch-up bill does not count as use. Shape: DESNZ Energy Trends Table 5.5 domestic electricity and Table 4.2 domestic gas monthly shares
    (2023-2025 averages), each month's share divided by its days.
  lower: 'reads rung: (1 - t) x min(s_short, every s_long); quote rung: (1 - quote_q) x median(a)'
  upper: 'reads rung: (1 + t) x max(s_short, every s_long); quote rung: (1 + quote_q) x median(a)'
  lower_source: >-
    Method: docs/market_research/how_a_supplier_shapes_an_estimate_for_an_unread_month.md §1 (the AA 'based on consumption recorded between two meter readings at least 6 months apart'; DESNZ booklet §3.1.3)
    and §3 (gas AQ from reads 9-36 months apart) give ref_long; site/data/knowledge_metering_and_reads.json ('EAC should converge ... moves toward the truth as reads arrive, then drifts as the household
    changes -- a new occupant, an EV, a heat pump') and Citizens Advice 'estimate ... based on your past usage' (meter_read_latency_estimation_2026.md §2) give ref_short. Shapes: the same note §2 and §4.
    The window's ends are the methods' own: at least 6 months (the AA), at most 36 months (the AQ's 9-36). The row first stopped at 365 days and at actual reads; neither end is in either source, and
    the two together breached 90 bills on the 209c3350ab book whose estimate followed a 183- to 547-day advance or one opening on the change-of-supply read (corrected 2026-10-29, the seat, having read
    the estimator: the correction takes its ends from the cited page only, and the next blind pass should re-derive them). The change-of-supply read is the agreed read both suppliers settle and bill
    from (read_access_and_theft_duties.md; the shaping note §7 counts the span from it); whether it was actual or deemed is not on the page.
    t is a BELIEF: the national shape is a proxy for one home (gas per-day share runs from 0.55% in January to 0.074% in August, a factor of 7, so gas gets the wider t).
  upper_source: same
  severity:
    outside: breach
    wrong_direction: 'flag: which reference a bill estimate uses is not published, so moving toward the older level is lawful; moving past it is what the flag catches'
  source:
  - docs/market_research/how_a_supplier_shapes_an_estimate_for_an_unread_month.md
  - docs/market_research/meter_read_latency_estimation_2026.md
  - "docs/market_research/how_far_a_settled_eac_sits_from_next_years_use.md (NEED year-on-year median |r-1| 0.143 gas-heated, p75 0.29: the scale t is set against)"
  - site/data/knowledge_metering_and_reads.json
  - 'Cold read N7: an EV home, a read-confirmed rise to 398 kWh/month from about 157, then an estimate of 136 kWh for the next month (below both levels; with a summer month and a year-long ref_long it may sit inside the breach band and then grades as the wrong-direction flag).'
  gap: >-
    The duty-level rules sit on their own rows (INV_READ_DUTY_ANNUAL, INV_BACK_BILLING_12M), so this row grades policy only. Whether the quote's figure is right is not this row's: the world draws no
    declared use (annual_consumption_estimate.CUSTOMER_DECLARED), and the billing-to-settlement gap is not yet measured (§10 GAP). What a supplier's bill estimate is built from (the EAC/AQ spread by profile, EAC/12, or recent reads) is not published (shaping note §5, GAP); the band accepts either. Exact PC1 and EUC01B profiles are
    gated, so the DESNZ shapes are proxies, and the 2023-2025 averages carry those years' weather. t is a belief. How a customer read is coded (A or M) is not stated on the page.
- id: INV_ESTIMATED_RUN_CONSISTENT_WITH_THE_METER
  family: read_history
  grades: invoice
  counts: >-
    Per run: a run is two or more consecutive bills on one meter_serial with read_type E, with an actual read (A) closing the bill before it and an actual read closing the bill after it, and no change of
    meter_serial between. r = e_run / m, where e_run = the run's estimated kWh over its days (sum consumption_kwh / sum days_in_period over the run's E bills) and m = the meter's own daily use from the
    actual read before the run to the actual read after it (closing_read_kwh difference over the days between them), reshaped to the run's days by the published monthly shape as in
    INV_ESTIMATE_FOLLOWS_THE_LATEST_ACTUAL_READS. Unit graded: per run of estimated bills bounded by actual reads.
  statement: >-
    An estimated run is judged afterwards against what the meter later showed. A good estimate from the account's own history misses the truth by about as much as a household's use changes from one
    year to the next. A run that bills several times what the meter recorded, or a small fraction of it, is an estimate the account's reads did not support.
  applies_to:
    segment: resi and sme
    commodity: electricity and gas
  evaluation: >-
    For each run as defined, compute r. Flag if r < 0.5 or r > 2.0. Breach if r < 1/3 or r > 3.0. A single-bill E between two actual reads is not graded here (one month's shape error is too large; it is
    graded by INV_ESTIMATE_FOLLOWS_THE_LATEST_ACTUAL_READS). Use reads, not the closing bill's consumption_kwh, for m, because that bill carries the catch-up. Where the run's estimates resume high after the
    closing read, the next run is graded on its own, and the first estimate after the read is INV_ESTIMATE_FOLLOWS_THE_LATEST_ACTUAL_READS's case (a read the supplier then held).
  lower:
    flag: 0.5
    breach: 0.333
  upper:
    flag: 2.0
    breach: 3.0
  lower_source: >-
    BELIEF set on docs/market_research/how_far_a_settled_eac_sits_from_next_years_use.md §1 (NEED 2026, 330,884 consecutive-year pairs of the industry annual figure for one meter: p10 r 0.667, p90 r
    1.419; p95 |r-1| 0.842; share |r-1| > 0.5 is 0.123). That spread bundles household change, change of occupier and EAC/AA transitions, so it is wider than an honest estimate's error. The flag band
    [0.5, 2.0] sits outside the NEED p10-p90; the breach band [1/3, 3] outside its p95. Erring against finding a defect.
  upper_source: same
  severity:
    outside_flag_band: 'flag: a real household change inside the run (a move-in, an EV, a long absence) can do this lawfully'
    outside_breach_band: breach
  source:
  - docs/market_research/how_far_a_settled_eac_sits_from_next_years_use.md
  - docs/market_research/how_a_supplier_shapes_an_estimate_for_an_unread_month.md (shapes)
  - "docs/market_research/unbilled_energy_and_revenue_assurance.md (K2: 'a run of under-estimates resolves as one large charge; over-estimates resolve as a credit')"
  - 'Cold read: monthly estimates of 1,250 to 2,007 kWh for a year, then an actual read showing far lower use (a £1,471.52 credit, then 144 kWh in a month), then estimates straight back to 933 kWh.'
  gap: >-
    No published distribution of a GB bill estimate's error against later reads exists (K2 GAP: 'the size distribution of a true-up'); the bands are beliefs from the NEED annual spread. Runs shorter than
    a season carry more shape error than the annual figures the bands come from. A customer-provided read's code on the page is not stated, so a run bounded by one may be missed.

- id: INV_METER_TYPE_ONE_VALUE_PER_SUPPLY_POINT
  family: read_duty
  grades: page
  counts: >-
    Per household page, per supply point (one MPAN for electricity, one MPRN for gas; a household with both fuels has two supply points and may lawfully hold two different types), as at the page's
    as-at date (the date of the latest bill the page shows). Numerator: supply points where two or more of the printed meter-type renderings disagree (header 'Meter' row, cast truth row 'Smart meter',
    sample-record smart_meter, day-clock sentence), or where the printed type disagrees with the meter type carried on the supply point's own bills. Denominator: supply points on pages that print
    at least one meter-type rendering. A supply point with no recorded type is in the denominator and passes only if every rendering says so. Unit graded: per supply point per page, with the failing
    panel pair named.
  statement: >-
    Meter type is a fact about a supply point at a date, not about a household. Whatever panel prints it, a supply point has one value as at the page's date, and that value is the one on the bills
    the supplier issued. Smart is a meter generation and capability, not a communications state: a smart meter that has lost communications (traditional mode) is still a smart meter, and its bills
    show estimated reads, not a changed type. So traditional mode never turns a Smart into a Traditional on any panel; it shows only in read types. A type changes only by an exchange or an
    enrolment, with a date, and the page uses the type as at its own date. 'Not recorded' is a state the supplier may truly be in (the dash, 'Not recorded', and a null smart_meter are one state)
    and is never rendered as Traditional or as No: omission is not neutrality. Header 'HH' for an I&C supply point is a settlement class and does not by itself say smart or not.
  applies_to:
    segment: resi and I&C
    commodity: electricity and gas, each supply point separately
  evaluation: >-
    Leg 1 (cross-panel agreement, breach): map each rendering to {Smart, Traditional, NotRecorded, HH}. Header Smart = cast Yes = smart_meter true; header Traditional = cast No = smart_meter false;
    header dash = cast 'Not recorded' = smart_meter null. HH is compared only on its own axis: an HH header must not sit beside cast 'Yes' or 'No' unless the record says which, and is otherwise
    expected beside 'Not recorded'. Any other pairing for one supply point and date is a breach, naming the panels. A page that prints one unlabelled type for a household with two fuels whose types
    differ is a breach; a page that prints the type per fuel, labelled, passes. Leg 2 (agreement with the bills, breach for a contradiction, flag for an implausibility): the printed type equals the
    meter_type on the supply point's latest bill. Across the supply point's bills the type may change only on an exchange or enrolment: Traditional -> Smart is permitted with a date; Smart ->
    Traditional is a flag (a lawful exchange to a non-smart meter is not shown to occur in the record read, so it is not treated as impossible); any change in the type with no exchange or enrolment
    date on the record is a breach. A Smart supply point with a run of estimated reads is NOT a type disagreement and must not be printed Traditional (the read-pattern grade belongs to
    INV_SMART_METER_BILLED_ON_ITS_OWN_READS). What the bill record cannot see: it carries read types (actual, estimated, customer) and dates, not the operating mode, not SMETS1 versus SMETS2, not
    daily or half-hourly data flows. So a read pattern can contradict a type only weakly: a Traditional supply point with actual reads at a monthly cadence for a long stretch is a flag, not a breach,
    since customer reads are a lawful route between the annual supplier read. Leg 3 (day clock, breach): the half-hourly 'day clock' panel's sentence follows the printed type. A supply point printed
    Traditional or NotRecorded must not print a sentence saying half-hourly data was received or used. A Smart one may print a half-hourly sentence only if it makes the supplier's access conditional
    on the customer's consent or the regime in force at the date: before 3 Nov 2022 half-hourly data needed explicit opt-in, and from 3 Nov 2022 it is the default for New System customers with opt-out.
    The panel may never say or imply that a smart meter's billing read needs the customer's consent. Severities: legs 1 and 3 breach; leg 2 breach for an undated change or a printed type that differs
    from the latest bill, flag for Smart -> Traditional with a date and for the read-pattern implausibility.
  lower: none
  upper: none
  threshold_source: >-
    None on purpose. This is an equality grade over a named fact, and a rate bound would accept the defect up to the bound. The only candidate number, a cadence for 'a long stretch' of customer reads
    on a Traditional meter, is not established: SLC 21B asks the supplier for 'all reasonable steps' to read at least annually, and no page gives a customer-read frequency. The flag therefore carries
    no cadence number and is graded by presence of the pattern, not by a threshold.
  source:
  - docs/market_research/smart_meters_and_half_hourly_settlement_2026-10-25.md (section 1, non-communicating meters: SMETS1 lost smart mode on switching before DCC enrolment; section 4, consent ladder and SLC 47; section 5, SLC 21B annual read duty, 'No split by meter type is published')
  - docs/market_research/meter_read_latency_estimation_2026.md (section 1, 'When a smart meter loses smart functionality and needs to be read manually it is in traditional mode'; fuel-separate stocks, electricity 29.9m domestic meters and gas 24.3m with different smart and traditional-mode shares, so the two fuels' types are separate facts; section 2, read cadence)
  - docs/market_research/smart_meter_hh_data_consent_2026.md (billing reads flow by default, settlement half-hourly data is a separate regime)
  - docs/market_research/unbilled_energy_and_revenue_assurance.md (K2 and the K8 design-choice paragraph: the meter type is 'the meter type the supplier holds for the supply point (a national metering record fact, not use)', 'A bill with no meter type on record is unknown, never guessed'; K5 on MPAN/MPRN as the unit of a meter point)
  gap: >-
    GAP: no page establishes how often a lawful smart-to-traditional exchange occurs, so Smart -> Traditional is a dated flag, not a ruling. GAP: whether a supplier's record distinguishes a SMETS1
    meter awaiting enrolment after a switch from a settled smart meter is not established, and the bills cannot show it. GAP: no split of estimated bills by meter type is published (the
    advisor pack, gap 7), so leg 2 cannot be given a published read-pattern bound by type and uses presence only. GAP: the cast row for an I&C HH supply point (whether HH implies smart, as many HH
    meters are, or only a settlement class) is not established on any page read, so HH is graded on its own axis. GAP: the as-at date convention (latest bill versus page generation date) is a design
    choice here, not a published rule. GAP: no page was found stating how a supplier learns the type at a gain (registration data versus the first read), so the first bill after a supply start may
    carry NotRecorded lawfully.

- id: INV_COMMITTED_PRICE_IS_THE_TARIFFS_PRICE_PER_FUEL_AT_A_DATE
  family: price_disclosure
  grades: page, with its invoice twin (the committed panel is graded against the usage lines of the bills issued under the same tariff term)
  counts: >-
    Per household page, per fuel (one committed price per supply point and tariff term; a dual-fuel household has two, and they are separate facts), as at the panel's as-at date (the date the
    panel says the commitment applies to; failing that, the latest bill date the page shows). Numerator: fuel-panels where any leg below fails: the printed 'Unit rate, all-in before VAT' differs
    from the unit rate the tariff term's bills charged on kWh consumed at that date; or the panel prints 0.00 or a blank where the term's bills charge a non-zero rate; or the printed stack's
    unit-rate components do not add up to the printed all-in rate; or the printed standing charge differs from the standing charge per day on the same bills; or the tariff name's fuel differs
    from the fuel of the rates printed beside it. Denominator: fuel-panels on pages that print a committed unit rate or a committed standing charge. A fuel-panel whose term has no bill with
    kWh > 0 yet is in the denominator and is graded on legs 1, 3, 4 and 5 only; it is never graded as passing leg 2 by default. Unit graded: one panel, one fuel, one as-at date, with the failing
    leg and the bill id compared named. 'Bills' here counts invoices, not periods: a bill whose period crosses a price change contributes one rate per side of the change.
  statement: >-
    The price a supplier commits to is a property of the tariff at a date, per fuel: a Unit Rate (or one rate per register or time-of-use band) and a Standing Charge per day, fixed by the
    contract or, for a variable tariff, by the last price notified under it. It does not depend on what any one bill contained. A bill applies that price to the kWh in its period; it does not
    define it. So the committed unit rate printed for a fuel equals the rate the bills under that term charged per kWh consumed while it was in force, and it is the same number whether the
    first bill held 0 kWh, a part-period, or a year. A 0 kWh bill carries no evidence about the unit rate: the rate on it is undefined, never 0.00, and a committed rate derived as charge / kWh
    from such a bill is a derivation error, not a price. All charges for supply are inside the Standing Charge(s) and the Unit Rate(s), and each is identified separately wherever charges are
    displayed (SLC 22A.2, 22A.3). So the all-in rate is the sum of its unit-rate components (energy plus network, policy and levies), and a standing charge spread over use is a different
    quantity: it is (standing charge x days) / kWh, it depends on consumption, it is undefined at 0 kWh, and if printed it must be labelled as an effective figure at a stated kWh basis and kept
    out of the all-in unit rate. For a default tariff (SVT, deemed contract, default fixed term) the committed unit rate and standing charge sit at or below the cap for that fuel, window and
    payment method (SLC 28AD), and during 1 Oct 2022 - 30 Jun 2023 the unit rate the household is charged sits at or below the EPG rate. 'Before VAT' means ex-VAT: domestic gas is 5% VAT
    throughout; domestic electricity is 5% except 0% from 2026-10-01 to 2027-03-31, so an inc-VAT bill rate converts at the bill's own VAT rate, never by a fixed 1.05.
  applies_to:
    segment: domestic (the cap legs apply to default tariffs only; the equality legs apply to every tariff)
    commodity: electricity and gas, each fuel's supply point and tariff term separately
  evaluation: >-
    Leg 1 (non-zero where charged, breach): if any bill under the term charges a non-zero unit rate on kWh > 0, the panel must not print 0.00 or blank for that fuel's unit rate, nor 0.00 for
    every stack component. Control over the partition: the grader must be shown able to reach each of the three outcomes (pass, breach, not-yet-graded for a term with no kWh > 0 bill) before
    its pass count is read. Leg 2 (equality with the bills, breach): for the bill(s) whose period contains the as-at date, take the per-register usage line(s) with kWh > 0 under this term;
    convert each line's rate to ex-VAT at that bill's VAT rate; the panel's all-in unit rate must equal it within print tolerance (half a unit of the last digit printed on each side, plus, where
    the bill's rate is fitted from a penny-rounded charge, 0.5p / the line's kWh). A bill that crosses a price change is compared on the line for the side containing the as-at date; a blended
    single rate on such a bill is itself non-conformant to 22A.3 and is not used as evidence. Bills with 0 kWh are skipped, never compared as 0.00. The panel's standing charge must equal the
    bill's standing charge per day ex-VAT under the same tolerance. Leg 3 (the stack adds up, breach): energy + network/policy/levies printed as unit-rate components sum to the printed all-in
    unit rate within tolerance. A 'standing charge spread over use' component is either absent, or printed apart from that sum with its kWh basis stated; at 0 kWh it is printed as undefined
    ('n/a', '-'), never 0.00p. Leg 4 (per fuel, breach): the tariff name, unit rate and standing charge printed together belong to one fuel; a gas tariff name beside electricity rates, or one
    unlabelled rate for a dual-fuel household whose two fuels' rates differ, is a breach. Leg 5 (cap and EPG, default tariffs only): ex-VAT committed unit rate <= the cap unit rate for the
    fuel, window containing the as-at date and payment method, within 0.5% (the published rows' rounding to 0.1 GBP/MWh and the penny); in the EPG windows the rate the bills charge the
    household <= EPG ex-VAT (gas 103.2 / 1.05 = 98.3 GBP/MWh, electricity 340.0 / 1.05 = 323.8 GBP/MWh); committed standing charge <= the cap standing charge ex-VAT for the window, within a
    penny over the bill period. Breach above the cap. Below the cap model's lowest-region pass-through (DF+CM+NC+PC) for that window and method is a flag, not a breach: it is under the cost
    the cap passes through, and no rule forbids it. Severities: legs 1-4 breach; leg 5 breach above, flag below.
  lower: >-
    Equality legs: none (an equality grade; a band would accept the defect inside it). Default tariffs, leg 5 flag floor: ofgem_cap_unit_rate_composition.json
    `pass_through_p_per_kwh_ex_vat_min` for the fuel, window and payment method (gas, direct debit, e.g. 4.4857p/kWh Jul-Sep 2024, 5.0029p Apr-Jun 2024, 12.9624p Oct-Dec 2022). Any tariff
    charging a non-zero rate on its bills: strictly > 0 on the panel (leg 1).
  upper: >-
    Default tariffs only: the cap per fuel, window and payment method, ex-VAT. Unit rate: ofgem_cap_unit_rate_composition.json `unit_rate_p_per_kwh_ex_vat` (gas DD e.g. 5.193p Jul-Sep 2024,
    5.728p Apr-Jun 2024, 6.564p Oct-Dec 2023), and for the household's charge in 2022-10-01..2023-06-30 min(cap, EPG ex-VAT). Standing charge: ofgem_cap_standing_charges.json
    `p_per_day_ex_vat` (gas DD e.g. 28.408p Jul-Sep 2024, 28.376p Apr-Jun 2024, 28.209p Oct-Dec 2023). Fixed terms the household chose: none (outside SLC 28AD; GAP).
  threshold_source: >-
    The equality legs carry no number on purpose: the committed price is a named fact and must equal the charged price. Their only tolerance is print and penny rounding, derived from the
    printed precision, not chosen. Leg 5's ceiling is the published law: SLC 28AD's maximum charge, per fuel (Ofgem sets caps 'for each fuel separately'), per region and payment method, read
    through the commons' cap-model artefacts at their own ex-VAT basis; its 0.5% tolerance is the commons rows' own stated rounding. The EPG levels are the commons' published inc-VAT unit
    rates, converted at 5% because both EPG windows predate the 2026 electricity zero rate. The floor is Ofgem's own pass-through construction in the same model, and is graded as a flag because
    nothing published makes it a legal floor.
  source:
  - docs/market_research/tariffs_and_the_default_tariff_2026-10-25.md ('A bill across a price change': SLC 22A.3 charges separately identified; SLC 31H.1 and 31H.12(b) understand and manage the costs, how charges are calculated; 31H.12(d) price change and date on the bill; 31H.8 estimates flagged; Ofgem 2011 'Apportioning price increases' letter, old rate before the change and new rate after; GAP on the gas licence; section 4, the cap is per fuel and per payment method, nil-consumption part plus a per-kWh part; section 2, SLC 22C.7 rollover to the default tariff)
  - docs/market_research/a_tou_tariff_needs_the_households_choice_not_its_meter.md (rules block: SLC 1 definition of Time of Use Tariff; SLC 22A.2(b) all Charges for Supply Activities incorporated within Standing Charge(s) and Unit/ToU Rates; 22A.3; 31H.4 the 'About Your Tariff' label; GAP 'the printed rate is not the contracted Unit Rate', a breakdown by EU 2016/1952 components may not replace the all-in rate)
  - docs/market_research/default_tariff_cap_and_epg_on_the_bill.md (SLC 28AD.2 aggregate charges at any consumption level; who is covered; two parts both capped; VAT basis and the 2026-10 electricity zero rate; the EPG table, household pays min(cap, EPG); payment-method columns; the floor under a default rate; standing-charge penny rounding; 0.5% tolerance)
  - docs/market_research/company_customer_comms.md (section 1: 30-day notice of a variable tariff change under SLC 23 carries the new unit rate and standing charge; principal terms in the welcome pack; annual statement)
  - docs/domain_artefact_library/regulatory/ofgem_default_tariff_cap_windows.json (windows, inc-VAT unit rates, elec_epg 340.0 and gas_epg 103.2 GBP/MWh, basis.vat, standing charge excluded)
  - docs/domain_artefact_library/regulatory/ofgem_cap_unit_rate_composition.json (gas_by_payment_method and by_payment_method: unit_rate_p_per_kwh_ex_vat, standing_charge_p_per_day_ex_vat, pass_through_p_per_kwh_ex_vat_min; basis.vat)
  - docs/domain_artefact_library/regulatory/ofgem_cap_standing_charges.json (gas and electricity p_per_day_ex_vat per cap period; nil-consumption allowance is the standing charge)
  - docs/domain_artefact_library/regulatory/uk_vat_rates.json (reduced rate 5% for home energy; dated exception, domestic electricity zero-rated 2026-10-01..2027-03-31, gas stays 5%; NOT_ESTABLISHED dates for pre-2026 rates)
  - site/data/knowledge_topics.json, page the-price-a-household-is-shown (a fixed rate is a commitment for the term; a variable rate is today's rate and is not committed beyond the next change)
  checkable: false
  gap: >-
    UNCHECKABLE BY THE RUNNER, by design rather than for want of a field: the committed panel is computed in the page's own JavaScript
    (stagePriced), so the row is graded where that code runs, over a named book's rebuilt pages: EXPLORE_PAGES_DIR=<the book's pages> pytest
    site/explore/test_the_committed_price_is_the_tariffs_not_one_bills.py. A Python copy of the panel in the runner would grade a second
    derivation, not what the reader sees (2026-10-30). The runner reads only the raw export, and this row grades what the page prints
    (fourth cold read, N9, 2026-10-29; written blind by an agent that read only docs/market_research, docs/domain_artefact_library and site/data/knowledge_topics.json).
    Legs 1-4 are graded over the page's own stagePriced() render by site/explore/test_the_committed_price_is_the_tariffs_not_one_bills.py (EXPLORE_PAGES_DIR names
    the book): the rebuilt 209c3350ab pages breach on 44 of 1,293 at origin 58abe075eb and 0 of 1,293 after the fix; leg 5 stays with the price rows over the bills.
    GAP: no published rule found says what a supplier's 'committed price' panel must show, or names that quantity; the row reads it as the tariff's contracted Unit Rate and Standing Charge
    (22A.2) as notified (SLC 23), which is a design reading, not a published definition. GAP: the gas supply licence's equivalents of 22A and 31H were not read; the row assumes they mirror
    electricity. GAP: SLC 31A/31B (annual statement, Tariff Information Label) text was not read at primary in the files read here, so no TIL field is cited as the source of the 'all-in' figure.
    GAP: no rule found prescribes how a 'standing charge spread over use' figure may be shown, or forbids it; leg 3's labelling requirement rests on 22A.3's separate identification. GAP: the
    commons holds GB-median cap levels, not the 14 regional ones; a region's own cap can sit above the median, so leg 5 can false-fire for an expensive region until the regional tables are
    held. GAP: no cap or published bound exists for a fixed term the household chose, so leg 5 does not apply to it. GAP: the CMA prepayment charge restriction (2017-2020) levels are not in
    the commons, so a prepayment default tariff before 2019 has no ceiling here. GAP: the EPG standing charges (about 46p and 28p a day, inc-VAT, secondary) are not a commons row, so the
    EPG leg grades the unit rate only. GAP: the VAT rates before 2026 rest on an unchecked assumption of stability noted in uk_vat_rates.json. GAP: the as-at date convention for the panel
    (panel date versus latest bill date) is a design choice, not a published rule. GAP: whether a lawful default tariff can carry a 0p unit rate is not stated anywhere read; leg 1 is graded
    against the term's own bills, not against a legal floor, for that reason.
- id: INV_METER_SERIAL_ONE_SUPPLY_POINT
  family: meter_identity
  grades: ledger
  counts:
    numerator: invoice/read records whose (commodity, meter_serial) sits, over an overlapping period, on a supply point other than the record's own, or on a supply point in a different distribution region with no recorded meter exchange between them
    denominator: every invoice/read record carrying a non-null meter_serial
    unit graded: one invoice/read record (a (commodity, meter_serial, supply point, period) tuple)
  statement: A meter serial names one physical meter. On a supplier's record one meter serial is never on two different supply points (MPAN for electricity, MPRN for gas) over overlapping periods, and never on supply points in two different distribution regions unless a meter exchange (removal from one, installation at the other) is recorded between the two periods. Successive occupiers of one property are NOT an exception to be excused but the normal case the rule permits - they share the supply point and the meter, so the serial stays on one MPAN/MPRN across several account ids. Several accounts on one (serial, supply point) is lawful; one serial on several supply points at once is not.
  predicate: 'Key every record by k = (commodity, meter_serial); sp = mpan if commodity == electricity else mprn; periods are half-open [period_start, period_end). (a) Simultaneity: for any two records r1, r2 with the same k and r1.sp != r2.sp, the periods do not overlap: r1.period_end <= r2.period_start or r2.period_end <= r1.period_start (a shared boundary day, the closing read of one being the opening read of the next, is not an overlap). (b) Region: for electricity, region(sp) = the MPAN core''s first two digits (the Distributor ID); for any two records with the same k and region(r1.sp) != region(r2.sp), a meter exchange record exists on k dated between the earlier period_end and the later period_start. (c) Sequential move within a region: same k, different sp, no overlap, no exchange record -> flag (crossed-meter or mis-keyed serial suspect), not breach. Account id is NOT part of the key: a change of account on the same (k, sp) is a change of occupier and is never graded here.'
  lower: 1
  upper: 1
  lower_source: 'physics: a meter is one physical object at one place at a time'
  upper_source: 'physics: a meter is one physical object at one place at a time'
  source: 'physics (one object, one place) plus belief (strong logic) on the identifiers: docs/market_research/home_moves.md, "What a gas supply is, at a move": "A supply belongs to a meter point, not to a household: an MPAN for electricity, an MPRN for gas ... Nothing ''moves'' with a household", and design choice 6 "The incoming occupier''s account names the account it succeeded at the same meter point" (successive occupiers share the supply point); docs/market_research/unbilled_energy_and_revenue_assurance.md K5 "two premises'' MPANs/MPRNs swapped (''crossed'')" and the Ofgem SPAA CP10/190 definition "a customer billed for a meter point (MPRN) that is not measuring consumption at their premises" (the defect the flag leg catches); same file, smart roll-out section: "A meter exchange is a fact the supplier holds about its own supply point. The meter''s details are on the national metering record and arrive in the industry flows" (so an exchange is recordable and its absence is gradable); docs/domain_artefact_library/regulatory/mpan_core_structure_and_check_digit.md, "Distributor ID": the core "consists of a two-digit Distributor ID" with the fourteen DNO areas 10 to 23 and IDNOs from 24 upward [S] (the electricity region key); docs/market_research/a_tou_tariff_needs_the_households_choice_not_its_meter.md Item 7: a tariff change "is not a meter exchange, and it issues no new serial" and "one register is one register for the life of the serial"'
  severity:
    simultaneous_two_supply_points: breach
    two_regions_no_exchange: breach
    sequential_same_region_no_exchange: flag
  export_fields:
  - account_id
  - commodity
  - meter_serial
  - mpan
  - mprn
  - period_start
  - period_end
  checkable: true
  gap: 'Graded by tools/domain_invariant_runner.ev_meter_serial_one_supply_point since 2026-10-30. On the 3dc5a92948 ledger it breaches 45,049 of 52,927 bill periods (322 serials over 1,293 supply points) and flags 1,906; with the serial minted per supply point (company/crm/customer_registry.meter_serial) it reads 0 of 52,927 (fifth cold read, N10; the row written blind by an agent that read only docs/market_research, docs/domain_artefact_library and site/data/knowledge_topics.json). GAP (1): no file read gives the national format or the uniqueness scope of a meter serial number (whether a serial is unique across manufacturers, and whether an electricity and a gas meter can carry the same serial string); the rule therefore keys on (commodity, meter_serial), which is the narrower, safe reading, and a cross-manufacturer collision would show as a false breach. GAP (2): whether a removed meter may be refurbished and reinstalled at a different supply point is not established in any file read; leg (c) is a flag, not a breach, for that reason. GAP (3): the gas region key: no file read gives how an MPRN encodes its Local Distribution Zone (13 LDZs are named only as a count in how_many_weather_cells_britain_needs_and_why_the_answer_is_a_curve.md), so leg (b) is checkable for electricity only and gas region is NOT graded until a commons page carries the MPRN structure. GAP (4): the MPAN Distributor ID list is secondary [S] only (mpan_core_structure_and_check_digit.md), and IDNO IDs above 23 are "citation needed". GAP (5): meter_exchange is not in the export fields because a bill/read record does not plainly carry it; it is visible only as a change of meter_serial on one supply point, so leg (b) can be graded only as "a serial change on the earlier supply point and a serial change on the later one, both between the two periods", which is the proxy, not the exchange record itself. The 1/1 bounds are a count of supply points per (serial, instant), not a tolerance.'
- id: INV_GAS_READ_IS_A_VOLUME_CONVERTED_AT_CV_AND_CF
  family: meter_physics
  grades: ledger
  counts:
    numerator: gas read/bill records that hold the register in kWh with no volume advance and no conversion, or whose billed kWh differs from volume x correction factor x CV / 3.6 by more than the print tolerance
    denominator: every gas read/bill record with an energy line (commodity == gas and billed_kwh not null)
    unit graded: one gas read/bill record (one register advance billed on one invoice)
  statement: A GB gas meter registers volume - cubic metres on a metric meter, hundreds of cubic feet on an imperial meter - not energy. A gas bill derives kWh from the volume advance using the calorific value and the volume correction factor, so every gas read or bill record carries a read unit (m3 or hcf), a volume advance, an imperial flag (or a unit that implies it), the CV applied and the correction factor applied, and its kWh equals the metric volume x correction factor x CV / 3.6 within print tolerance. A record that holds a gas register in kWh, with no volume and no conversion, is not a GB gas read.
  predicate: 'commodity == gas => (a) read_unit in {m3, hcf} and read_unit != kWh; (b) volume_advance not null, calorific_value not null, correction_factor not null; (c) imperial_flag == (read_unit == hcf); (d) V_m3 = volume_advance if read_unit == m3 else volume_advance x K_hcf (K_hcf = cubic metres per hundred cubic feet: GAP, see gap); (e) |billed_kwh - V_m3 x correction_factor x calorific_value / 3.6| <= tol, where 3.6 is MJ per kWh and calorific_value is in MJ/m3; tol is derived from print precision only: tol = 0.5 x 10^(-d_kwh) + computed_kwh x (0.5 x 10^(-d_cv) / calorific_value + 0.5 x 10^(-d_cf) / correction_factor), with d_x the number of decimal places the record prints for x (volume advance is a difference of whole register digits, so it adds no rounding when the register is read to its last digit). (f) Optional range leg on calorific_value: GAP, not graded.'
  lower: 0.0
  upper: 0.0
  lower_source: 'tolerance from print precision (leg e); the equality itself is physics (1 kWh = 3.6 MJ, by definition of the units)'
  upper_source: 'tolerance from print precision (leg e)'
  source: 'physics for the unit identity (1 kWh = 3,600,000 J = 3.6 MJ) and belief (strong logic) for the record shape. What the files read establish: docs/market_research/household_carbon_and_the_measures_that_save_it.md, "Gas factor" paragraph: "GB gas meters are billed in kWh converted at the gross calorific value"; docs/domain_artefact_library/regulatory/desnz_natural_gas_conversion_factor.json, basis.units: "GB gas is billed in kWh converted at gross CV" (this artefact is the DESNZ CARBON factor, kgCO2e per kWh gross CV, NOT the volume-to-energy conversion; it confirms only that the billed kWh is on a gross-CV basis); docs/market_research/unbilled_energy_and_revenue_assurance.md K5: "a wrong multiplier or correction factor" listed as a meter-fault class, and the Xoserve/AUG finding "incorrect correction factors 40" (a correction factor exists per supply point and can be wrong, so it is a field the record carries); docs/domain_artefact_library/scope_briefs/ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md: gas traded "in pence per therm, roughly 29.3 kWh, which is a real conversion the model must get right rather than assume" (the commons'' stance on gas unit conversion); docs/market_research/a_tou_tariff_needs_the_households_choice_not_its_meter.md Item 6: SLC 31H.1 bills "sufficient to enable that Domestic Customer to understand and manage the costs", 31H.12(b) "how any charges ... are calculated" (electricity licence text, quoted there; its gas mirror was not read)'
  severity:
    gas_register_held_in_kwh_no_volume: breach
    kwh_not_equal_to_converted_volume: breach
    conversion_fields_missing_with_volume_present: flag
  export_fields:
  - commodity
  - meter_serial
  - mprn
  - read_unit
  - imperial_flag
  - volume_advance
  - correction_factor
  - calorific_value
  - billed_kwh
  - period_start
  - period_end
  checkable: false
  gap: 'UNCHECKABLE (2026-10-30): no gas read on the export carries a volume, a CV or a CF, so every gas read would breach and nothing would be graded. All 23,816 gas invoices on the 3dc5a92948 pages hold a kWh register (fifth cold read, N11, written blind as for N10). The K8 page on the GB gas read is owed first. The blind writer set checkable true. GAP (1): the Gas (Calculation of Thermal Energy) Regulations are NOT in the commons; no file read quotes them, so the formula kWh = V x CF x CV / 3.6 is stated here from the unit identity and the "converted at the gross calorific value" lines, not from the statutory text, and whether the CV to apply is a daily, charging-area, or period-average figure is unestablished. GAP (2): no CV range (MJ/m3) appears in any file read, so the range leg (f) is not graded. GAP (3): the standard volume correction factor value (the figure used for domestic meters without their own correction) is not in any file read; the rule therefore uses the correction factor the record itself carries and does not assert a value. GAP (4): the imperial conversion K_hcf (cubic metres per hundred cubic feet) is not in any file read; imperial records cannot be graded on leg (e) until a commons page carries it (it is a fixed unit identity, so the remedy is a citation, not a judgement). GAP (5): what a gas bill must print about the conversion (volume, CF, CV, the formula) is not established: the only bill-content text read is electricity SLC 31H as quoted in a_tou_tariff_needs_the_households_choice_not_its_meter.md, and the gas licence mirror was not read. checkable is set true because a GB gas bill and read record carry these fields in practice (practitioner knowledge, belief), but no file read establishes that they must. GAP (6): smart (SMETS) gas meters were not covered by any file read on this point; the rule assumes they too register volume and are converted at billing, which is a belief, not a quoted rule.'
