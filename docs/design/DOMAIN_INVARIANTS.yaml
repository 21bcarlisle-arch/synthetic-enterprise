  caveats:
  - The commons states the rates as of 2026 and declares their dates of change NOT ESTABLISHED (uk_vat_rates.json#NOT_ESTABLISHED_declared_rather_than_assumed); 5% domestic fuel throughout 2016-2025 is
    a belief (stated as 'domestic VAT 5% throughout' in docs/market_research/svt_rates_active_passive_2016_2025.md §1a, and VATA 1994 Sch 7A Group 1 in docs/market_research/default_tariff_cap_and_epg_on_the_bill.md).
  - A period spanning 2026-10-01 may be split by consumption date (HMRC); a single vat_rate on such a period is a flag, not a breach.
  - The de minimis averaging rule (period, month, rolling) is not established; using the period average is a reading.
