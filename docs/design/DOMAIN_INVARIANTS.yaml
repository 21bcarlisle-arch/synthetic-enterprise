    median: 10000
    p90: 19500
    p95: 23500
    flag_upper_p99: 34300
    share_above_50000: 0.0057
  - class: detached any age
    median: 13600
    flag_upper_p99: 41100
    share_above_50000: 0.0158
  hard_flag:
    upper: 50000
    source: 'docs/market_research/need_domestic_gas_high_tail.md ''THE CENSORING FACT'': NEED metadata ''removed due to being too large (over 50,000 kWh)''; 0.57% of gas-heated E&W homes exceed it, so it
      is a strong flag, not a breach'
  flag_source: docs/market_research/need_domestic_gas_high_tail.md 'Measurement 2' table; flag_lower 1000 = NEED 'too small (under 1,000 kWh)'
  book_level: 'As for electricity: share above class p99 about 1%, binomial upper bound at the book''s n.'
  export_fields:
  - consumption_kwh
  - period_start
  - period_end
  - days_in_period
  - commodity
