  HEADLINE (observed-with-evidence, computed by EXECUTING the shipped code this tick, not by reading
  literals): the atom''s gain says the ledger gets ground truth "instead of a factor table" -- THERE ARE
  THREE, they disagree by 19.6%-55.6%, all three cite DESNZ, and the one an adapter would naturally feed
  is the one nothing reads. (a) saas/reporting/annual_report.py:5414 _UK_FUEL_MIX, ten FuelMixRecords
  declared INSIDE the function body of _section_carbon_emissions, blended via carbon_emissions.FuelMixRecord.emission_intensity_g_per_kwh
  -- this is the PUBLISHED one, rendered at docs/reports/ANNUAL_REPORT.md:2159 as a Grid Intensity column
  315g/kWh (2016) -> 175g/kWh (2025) plus a derived Elec CO2 (t) column; (b) company/billing/carbon_footprint.py:14
  _ELECTRICITY_INTENSITY_G_CO2E_PER_KWH, the LOWEST series (266->115), whose only non-test importer
  company/portal/app.py:35 imports estimate_carbon and NEVER CALLS IT (one occurrence, the import line)
  -- nothing renders it; (c) company/sustainability/carbon_intensity_register.py:57 _GRID_AVERAGE_INTENSITY,
  the HIGHEST series (350->165), ZERO non-test importers -- and this is the module the atom title points at.
  Spread WIDENS over time (19.6% in 2019 -> 55.6% in 2024), so not a transcription slip. Plus a fourth
  partly-redundant artefact: company/billing/fuel_mix.py::get_fuel_mix returns a five-bucket mix the
  annual report does not use, declaring its own eight-bucket copy instead. CONSEQUENCE FOR THE ATOM: the
  first EP13 move is NOT "fetch", it is "choose which consumer you are replacing" -- wiring a half-hourly
  feed into carbon_intensity_register changes no published number at all (the EP10 sect-1 twelfth-module-in-a-stack-of-eleven
  shape). STAGED, not fixed: WORKER_FINDING_THREE_LIVE_GRID_INTENSITY_SERIES_DISAGREE_BY_HALF_2026-08-14.md
  (BLOCKING, F_risk_compliance -- graded on the ruling''s own definition "a published figure may be wrong";
  softening it to LATENT to keep the lane open is the anti-pattern finding_severity.py names in its own
  docstring). No claim made about WHICH series is correct: no network this tick, so naming a true value
  would be fabricating one. SECOND FINDING, in the atom''s own text: name: says "regional intensity
  multiplied by half-hourly usage is the abatement ledger''s ground truth" -- that product is EMISSIONS,
  not abatement. ADVISOR_SCOPE_BRIEF_CARBON sect-A: of emissions/abatement/PS-per-tonne "only the first
  is observable"; abatement is a counterfactual. EP13 can supply ground truth to the EMISSIONS ledger and
  cannot in principle supply it to the ABATEMENT ledger -- the difference between an achievable L3 and an
  exit criterion that can never be met. THIRD: supplying the AVERAGE series alone DECIDES a director
  values-call by omission. The API publishes average (generation-only, already loss-corrected -- do NOT
  re-apply a loss adjustment, scope brief sect-B); "grid marginal vs average" is on E5''s open list of six
  director values-calls, surfaced 2026-07-20 and 2026-07-29 and decided neither time; and the world can
  already produce the other side nearly free -- sim/merit_order_reconstruction.py carries
  EF_GAS_TCO2_PER_MWH_E_BY_YEAR (line 134) + EF_COAL_TCO2_PER_MWH_E_BY_YEAR (line 138) and computes the
  marginal plant per settlement period. The two answer DIFFERENT questions: average = what this household''s
  use represented (emissions ledger); marginal = what moving a kWh from 18:00 to 03:00 avoids (the entire
  justification for time-shifting advice). R13 shape -- the agent sits on both sides of the wall, so EP13
  must emit rows carrying `basis` and must never be the sole supplier of a basis. FOURTH -- THE JOIN KEY
  EXISTS, IN THE RIGHT VOCABULARY, ON THE WRONG SIDE OF THE WALL: simulation/adoption_geography.py:360
  _GB_REGIONS is commented verbatim "14 GB GSP/DNO areas" and names them (north_scotland ... south_west_england)
  = the API''s regional geography [verify-at-BUILD: confirm regionid ordering + the national/England/Scotland/Wales
  extras]; but it is world-side (importers: simulation/population_draw.py + its own test, nothing under
  company/, and nothing under company/ may import it). The company''s own field is DECLARED AND NEVER
  WRITTEN -- company/billing/meter_points.py:42 `gsp_group: str | None = None  # GSP group code e.g. "_A"
  to "_P"`, and grep for gsp_group repo-wide returns THAT ONE LINE and nothing else (no producer, no
  consumer; meter_points itself has no non-test importers per the EP10 pass). So national intensity is the
  only joinable series today. The fix is small and wall-LEGAL: a real supplier does know each supply
  point''s GSP group (supply-point record, derivable from the MPAN) -- it is an observable, not an internal,
  so the world may publish it; what is forbidden is company/ reading _GB_REGIONS. FIFTH -- THE MULTIPLICAND
  IS TWO DAYS OF THREE CUSTOMERS: docs/market_data/consumption_feed.json measured this tick = 288 records
  = 3 customers (C7/C8/C9) x 2 dates (2025-06-06/07) x 48 periods. Everything else is annual --
  carbon_footprint.estimate_carbon(eac_kwh, commodity, year) takes an EAC. An annual kWh multiplied by a
  half-hourly intensity is not a valid product, so the half-hourly feed buys fidelity only where a
  half-hourly multiplicand exists. THIS is the binding constraint on EP13''s value -- not API access, not
  EP6, not the values-calls. FRAME -- THE ADAPTER''S UNIT IS (period, as_of), NOT (period): the atom''s
  advertised prize (forecast vs outturn) is genuinely better than EP10''s, because EP10''s gap had NO TRUTH
  SIDE (the world produced no gas residue) whereas EP13''s truth side is published by the counterparty and
  needs no world change. But the same endpoint serves the forecast, the outturn, and later a REVISED
  outturn, so under the Point-in-Time Blindfold a signature intensity(period) is a leak. The existing
  OPEN-NOW adapters are no guide and it is worth naming why: sim/generation_demand_history.py and
  sim/system_prices_history.py are range fetchers with NO as-of dimension, legal precisely because they
  sit in sim/ on the world side; EP13''s output is a COMPANY observable so it needs the dimension they lack.
  Row shape: (period, as_of) -> {value_g_co2_per_kwh, basis: forecast|outturn, region, vintage, source},
  a revision is a NEW ROW never an overwrite -- the same triple R14 forces on money and the E5 FRAME already
  specified for carbon (CLOCK x BASIS x PROVENANCE). EP13 is where that triple ORIGINATES, so it should
  emit it rather than have it retrofitted (the E5 FRAME already found three_ledger_view() drops basis at
  aggregation; a feed that never carried one guarantees that outcome). COVERAGE: [verify-at-BUILD, no
  network] the API series is understood to start some years after the sim window, which
  sim/generation_demand_history.py names as 2016-01-01 -- if so the early years still need a table and
  EP13 is a PARTIAL replacement, making the SEAM the design problem (the anachronistic-factor risk the E5
  FRAME already named against the 2.1x swing in _GRID_AVERAGE_INTENSITY). NO SILENT FALLBACK: an uncovered
  period reads no_source and propagates as such, never a factor-table value dressed as a feed (E5''s
  specified control C1; the fail-open family CARBON_NOT_A_TARGET''s mechanisation section names). SMALLEST
  CLOSED LOOP, in order: (1) reconcile the three series to one [the BLOCKING finding, F_risk_compliance,
  NOT EP13 work and not doable by EP13 -- until there is one consumer there is nothing for a feed to
  replace]; (2) publish GSP group per supply point as an observable + write the already-declared
  meter_points.gsp_group [independent of the API]; (3) the adapter, national first, no_source rather than
  a substitute, regional behind (2); (4) wire it to step (1)''s survivor so the move changes a RENDERED
  number (R11) -- the ONLY step that can move a level, and it is gated on (1); (5) the gap published as a
  DISTRIBUTION not a mean (a mean error over a series whose whole point is intraday variation hides exactly
  the periods the advice targets); (6) only then marginal intensity from merit_order_reconstruction as a
  SECOND series, which is the director values-call above -- surfaced, not taken. WHAT DOES NOT BLOCK:
  API access (free, no key, OPEN NOW); EP6_wall_protocol_typing, which the atom lists as depends_on but
  which is NOT load-bearing (one scalar per period per region crosses the existing sim_interface seam
  without a typed protocol); and the six open values-calls, provided each row carries its own basis. R12
  GETS SHARPER, NOT LOOSER: EP13 creates the FIRST legitimate case of a carbon number a decision surface
  MUST read -- shifting advice is worthless without the forecast intensity. The line: FORECAST INTENSITY
  (gCO2/kWh) is a MARKET INPUT, same category as a price, legal for a decision surface; the LEDGER FIGURE
  (tCO2e abated, PS/tCO2e) is the diagnostic and stays unreadable. tests/company/test_carbon_not_a_target.py''s
  detector (_imports_company_carbon, lines 25-41) keys on the IMPORT PATH (company.carbon.*, or any module
  whose last segment is carbon_ledger) and CANNOT express that line: land the adapter under company.carbon
  and shifting advice becomes illegal-or-untestable; land it elsewhere (company/sustainability/) and the
  guard does not reach whatever ledger-shaped thing later joins it there = the wrong-subject failure filed
  repeatedly here. The subject should be the QUANTITY (a tCO2e- or PS-per-tonne-typed value), not the
  import path. Recorded as an EP13 design requirement, NOT fixed (SELF_INTERRUPT -- the guard is green
  against its current subject and nothing is blocked on it). The origin_note''s warning is CONFIRMED not
  softened: a real half-hourly feed makes a carbon number cheap to publish and cheap to optimise toward;
  the counter-design is step (5) -- a forecast-vs-outturn DISTRIBUTION widens under tuning, where a scalar
  improves under it. OBSERVED IN PASSING, recorded not drawn (SELF_INTERRUPT): the same published report
  section derives electricity volume as elec_mwh = rev / 150_000.0 (annual_report.py:5445), a hardcoded
  PS150/MWh divisor giving 0-28 MWh a year for the whole book and ~30.8 tCO2 over the decade -- the
  intensity column is the SMALLER of the two errors in that table.'
