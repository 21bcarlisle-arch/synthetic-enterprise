simplifications:
- '2026-08-14 DISCOVER + FRAME (worker tick, LANE 3 doc-only; no BUILD code, nothing touched under company/ saas/ sim/ simulation/; EPOCH_GATING Rule 1). DOC: docs/design/EP13_CARBON_INTENSITY_DISCOVER_FRAME.md. LEVEL HELD AT 0 -- EP13''s deliverable is an ADAPTER, so the EP10_adapter_uk_link_xoserve call applies (a doc ABOUT the thing is not the thing), not the EP19 register call where the doc WAS the deliverable; the map also carried another lane''s staged level_current hunk in the shared index, so no map edit either. EVIDENCE REPAIRED: two of the three cited paths (docs/staging/ADVISOR_RESEARCH_COUNTERPARTY_APIS_EPOCH3, docs/staging/ADVISOR_SCOPE_BRIEF_CARBON) no longer exist -- both were archived to docs/design/refs/ and docs/domain_artefact_library/scope_briefs/ respectively; live paths APPENDED alongside the dead ones, never rewritten (append-only store; the class is WORKER_FINDING_EIGHTY_ATOMS_CITE_EVIDENCE_AT_A_PATH_THAT_MOVED). HEADLINE (observed-with-evidence, computed by EXECUTING the shipped code this tick, not by reading literals): the atom''s gain says the ledger gets ground truth "instead of a factor table" -- THERE ARE THREE, they disagree by 19.6%-55.6%, all three cite DESNZ, and the one an adapter would naturally feed is the one nothing reads. (a) saas/reporting/annual_report.py:5414 _UK_FUEL_MIX, ten FuelMixRecords declared INSIDE the function body of _section_carbon_emissions, blended via carbon_emissions.FuelMixRecord.emission_intensity_g_per_kwh -- this is the PUBLISHED one, rendered at docs/reports/ANNUAL_REPORT.md:2159 as a Grid Intensity column 315g/kWh (2016) -> 175g/kWh (2025) plus a derived Elec CO2 (t) column; (b) company/billing/carbon_footprint.py:14 _ELECTRICITY_INTENSITY_G_CO2E_PER_KWH, the LOWEST series (266->115), whose only non-test importer company/portal/app.py:35 imports estimate_carbon and NEVER CALLS IT (one occurrence, the import line) -- nothing renders it; (c) company/sustainability/carbon_intensity_register.py:57 _GRID_AVERAGE_INTENSITY, the HIGHEST series (350->165), ZERO non-test importers -- and this is the module the atom title points at. Spread WIDENS over time (19.6% in 2019 -> 55.6% in 2024), so not a transcription slip. Plus a fourth partly-redundant artefact: company/billing/fuel_mix.py::get_fuel_mix returns a five-bucket mix the annual report does not use, declaring its own eight-bucket copy instead. CONSEQUENCE FOR THE ATOM: the first EP13 move is NOT "fetch", it is "choose which consumer you are replacing" -- wiring a half-hourly feed into carbon_intensity_register changes no published number at all (the EP10 sect-1 twelfth-module-in-a-stack-of-eleven shape). STAGED, not fixed: WORKER_FINDING_THREE_LIVE_GRID_INTENSITY_SERIES_DISAGREE_BY_HALF_2026-08-14.md (BLOCKING, F_risk_compliance -- graded on the ruling''s own definition "a published figure may be wrong"; softening it to LATENT to keep the lane open is the anti-pattern finding_severity.py names in its own docstring). No claim made about WHICH series is correct: no network this tick, so naming a true value would be fabricating one. SECOND FINDING, in the atom''s own text: name: says "regional intensity multiplied by half-hourly usage is the abatement ledger''s ground truth" -- that product is EMISSIONS, not abatement. ADVISOR_SCOPE_BRIEF_CARBON sect-A: of emissions/abatement/PS-per-tonne "only the first is observable"; abatement is a counterfactual. EP13 can supply ground truth to the EMISSIONS ledger and cannot in principle supply it to the ABATEMENT ledger -- the difference between an achievable L3 and an exit criterion that can never be met. THIRD: supplying the AVERAGE series alone DECIDES a director values-call by omission. The API publishes average (generation-only, already loss-corrected -- do NOT re-apply a loss adjustment, scope brief sect-B); "grid marginal vs average" is on E5''s open list of six director values-calls, surfaced 2026-07-20 and 2026-07-29 and decided neither time; and the world can already produce the other side nearly free -- sim/merit_order_reconstruction.py carries EF_GAS_TCO2_PER_MWH_E_BY_YEAR (line 134) + EF_COAL_TCO2_PER_MWH_E_BY_YEAR (line 138) and computes the marginal plant per settlement period. The two answer DIFFERENT questions: average = what this household''s use represented (emissions ledger); marginal = what moving a kWh from 18:00 to 03:00 avoids (the entire justification for time-shifting advice). R13 shape -- the agent sits on both sides of the wall, so EP13 must emit rows carrying `basis` and must never be the sole supplier of a basis. FOURTH -- THE JOIN KEY EXISTS, IN THE RIGHT VOCABULARY, ON THE WRONG SIDE OF THE WALL: simulation/adoption_geography.py:360 _GB_REGIONS is commented verbatim "14 GB GSP/DNO areas" and names them (north_scotland ... south_west_england) = the API''s regional geography [verify-at-BUILD: confirm regionid ordering + the national/England/Scotland/Wales extras]; but it is world-side (importers: simulation/population_draw.py + its own test, nothing under company/, and nothing under company/ may import it). The company''s own field is DECLARED AND NEVER WRITTEN -- company/billing/meter_points.py:42 `gsp_group: str | None = None  # GSP group code e.g. "_A" to "_P"`, and grep for gsp_group repo-wide returns THAT ONE LINE and nothing else (no producer, no consumer; meter_points itself has no non-test importers per the EP10 pass). So national intensity is the only joinable series today. The fix is small and wall-LEGAL: a real supplier does know each supply point''s GSP group (supply-point record, derivable from the MPAN) -- it is an observable, not an internal, so the world may publish it; what is forbidden is company/ reading _GB_REGIONS. FIFTH -- THE MULTIPLICAND IS TWO DAYS OF THREE CUSTOMERS: docs/market_data/consumption_feed.json measured this tick = 288 records = 3 customers (C7/C8/C9) x 2 dates (2025-06-06/07) x 48 periods. Everything else is annual -- carbon_footprint.estimate_carbon(eac_kwh, commodity, year) takes an EAC. An annual kWh multiplied by a half-hourly intensity is not a valid product, so the half-hourly feed buys fidelity only where a half-hourly multiplicand exists. THIS is the binding constraint on EP13''s value -- not API access, not EP6, not the values-calls. FRAME -- THE ADAPTER''S UNIT IS (period, as_of), NOT (period): the atom''s advertised prize (forecast vs outturn) is genuinely better than EP10''s, because EP10''s gap had NO TRUTH SIDE (the world produced no gas residue) whereas EP13''s truth side is published by the counterparty and needs no world change. But the same endpoint serves the forecast, the outturn, and later a REVISED outturn, so under the Point-in-Time Blindfold a signature intensity(period) is a leak. The existing OPEN-NOW adapters are no guide and it is worth naming why: sim/generation_demand_history.py and sim/system_prices_history.py are range fetchers with NO as-of dimension, legal precisely because they sit in sim/ on the world side; EP13''s output is a COMPANY observable so it needs the dimension they lack. Row shape: (period, as_of) -> {value_g_co2_per_kwh, basis: forecast|outturn, region, vintage, source}, a revision is a NEW ROW never an overwrite -- the same triple R14 forces on money and the E5 FRAME already specified for carbon (CLOCK x BASIS x PROVENANCE). EP13 is where that triple ORIGINATES, so it should emit it rather than have it retrofitted (the E5 FRAME already found three_ledger_view() drops basis at aggregation; a feed that never carried one guarantees that outcome). COVERAGE: [verify-at-BUILD, no network] the API series is understood to start some years after the sim window, which sim/generation_demand_history.py names as 2016-01-01 -- if so the early years still need a table and EP13 is a PARTIAL replacement, making the SEAM the design problem (the anachronistic-factor risk the E5 FRAME already named against the 2.1x swing in _GRID_AVERAGE_INTENSITY). NO SILENT FALLBACK: an uncovered period reads no_source and propagates as such, never a factor-table value dressed as a feed (E5''s specified control C1; the fail-open family CARBON_NOT_A_TARGET''s mechanisation section names). SMALLEST CLOSED LOOP, in order: (1) reconcile the three series to one [the BLOCKING finding, F_risk_compliance, NOT EP13 work and not doable by EP13 -- until there is one consumer there is nothing for a feed to replace]; (2) publish GSP group per supply point as an observable + write the already-declared meter_points.gsp_group [independent of the API]; (3) the adapter, national first, no_source rather than a substitute, regional behind (2); (4) wire it to step (1)''s survivor so the move changes a RENDERED number (R11) -- the ONLY step that can move a level, and it is gated on (1); (5) the gap published as a DISTRIBUTION not a mean (a mean error over a series whose whole point is intraday variation hides exactly the periods the advice targets); (6) only then marginal intensity from merit_order_reconstruction as a SECOND series, which is the director values-call above -- surfaced, not taken. WHAT DOES NOT BLOCK: API access (free, no key, OPEN NOW); EP6_wall_protocol_typing, which the atom lists as depends_on but which is NOT load-bearing (one scalar per period per region crosses the existing sim_interface seam without a typed protocol); and the six open values-calls, provided each row carries its own basis. R12 GETS SHARPER, NOT LOOSER: EP13 creates the FIRST legitimate case of a carbon number a decision surface MUST read -- shifting advice is worthless without the forecast intensity. The line: FORECAST INTENSITY (gCO2/kWh) is a MARKET INPUT, same category as a price, legal for a decision surface; the LEDGER FIGURE (tCO2e abated, PS/tCO2e) is the diagnostic and stays unreadable. tests/company/test_carbon_not_a_target.py''s detector (_imports_company_carbon, lines 25-41) keys on the IMPORT PATH (company.carbon.*, or any module whose last segment is carbon_ledger) and CANNOT express that line: land the adapter under company.carbon and shifting advice becomes illegal-or-untestable; land it elsewhere (company/sustainability/) and the guard does not reach whatever ledger-shaped thing later joins it there = the wrong-subject failure filed repeatedly here. The subject should be the QUANTITY (a tCO2e- or PS-per-tonne-typed value), not the import path. Recorded as an EP13 design requirement, NOT fixed (SELF_INTERRUPT -- the guard is green against its current subject and nothing is blocked on it). The origin_note''s warning is CONFIRMED not softened: a real half-hourly feed makes a carbon number cheap to publish and cheap to optimise toward; the counter-design is step (5) -- a forecast-vs-outturn DISTRIBUTION widens under tuning, where a scalar improves under it. OBSERVED IN PASSING, recorded not drawn (SELF_INTERRUPT): the same published report section derives electricity volume as elec_mwh = rev / 150_000.0 (annual_report.py:5445), a hardcoded PS150/MWh divisor giving 0-28 MWh a year for the whole book and ~30.8 tCO2 over the decade -- the intensity column is the SMALLER of the two errors in that table.'
- '2026-08-25 HARDEN -- THE EXPERT HOUR, and it did not pass. Drawn as EP13 level 2->3 on a worker tick; the atom''s own map entry named the one remaining gate (''STILL OPEN -- no Expert Hour has been taken''), so this pass took it. Technique: .claude/skills/cold-eyes-walk -- a fresh fork given ONLY the rendered carbon panel text (no repo, no diff, no tools), priors committed in writing before viewing, persona = 25-year GB carbon-reporting/assurance veteran, then every finding verified post-hoc against a Playwright render of the live page, site/data/explore_carbon.json as served, and the generating modules. independence: FALSE -- same model family as the builder, so this is BLINDNESS, not independence, and the verdict is worth exactly that much. 10 findings, 5 MAJOR, filed to docs/observability/sanity_adjudication_ledger.json (90 -> 100 entries) with one blind finding adjudicated FALSE POSITIVE and recorded so it does not re-raise (the ''THE CUSTOMER CAN SEE THIS'' tag is the site-wide SIDE_LABEL wall marker enforced by tools/explore_wall_sides.py, not a leaked internal annotation). VERDICT: NOT ''this is real''. THE LEVEL DOES NOT MOVE AND STAYS AT 2. The drawn plan said 2->3; LAW A -- the plan is a diagnostic and never a target, and where a date and a test conflict the date is wrong. THREE MAJOR FINDINGS REPAIRED IN THIS SAME PASS, each with a mutation-proven control, because all three were WRONG ON A LIVE CUSTOMER-FACING SURFACE rather than merely untidy: (1) THE CORRECTION INSTRUCTION WAS WRONG FOR EVERY MEASURED HOUSEHOLD. The panel told the reader to ''read the timing figures above as an upper bound by about that factor'' (3.2x). Measured per household in the generator''s own data: C7 1.09x, C8 1.73x, C_IC4 1.25x, C_IC3 7.0x, and on C9''s 2021 summer day THE SIGN REVERSES (sign_differs -- company believes the home drew at dirtier-than-average times, NESO''s published series says cleaner). Not one household is near 3.2x; a reader following the instruction on the panel''s own C7 example gets 10.6% where the measured answer is 31.1%, wrong by 3x in the safe-sounding direction. A year-level range ratio cannot be applied to one household''s day. REPAIRED: the magnitude instruction is deleted and the DIRECTION kept (it is measured); the magnitude now belongs to the per-household paragraph that already computed it. (2) THE CORRECTION MIXED TWO STATISTICS. The panel prints a p95/p5 spread (''the dirtiest 5% ran 5.1x the cleanest 5%'') and corrected it with `spread_overstated_by`, which is the mean of six max/min ratios -- two single half hours out of seventeen thousand on each side, which generate_grid_intensity_feed.year_stats'' OWN docstring already refuses to rest a claim on (''one reading of one meter''). Two statistics under one word. REPAIRED: neso.compare_shapes now returns reconstructed_p95_over_p5 / published_p95_over_p5, versus_published publishes `p95_spread_overstated_by`, and the page quotes THAT. Measured, the two factors differ -- max/min 3.16x, p95/p5 2.87x -- so the mismatch was not cosmetic. Both are published: dropping max/min to tidy the page would be choosing the flattering statistic after seeing both, which is what R12 exists to stop. (3) THE STATED ERROR DIRECTION CONTRADICTED ITS OWN MODULE''S GAP LIST, TWENTY LINES APART, AND IT IS THE SENTENCE THAT REACHES THE PAGE. ERROR_DIRECTION said no coal and no interconnector imports ''BOTH make quiet half hours look cleaner''. NAMED_GAPS says the opposite on both limbs: coal omission is a DIRTY-end error, and omitting interconnector imports makes half hours read DIRTIER (GB is a net importer of French nuclear and Norwegian hydro, and NESO''s consumption basis counts them at the exporting country''s intensity). The two gaps push in OPPOSITE directions, so only their NET effect is knowable. The CONCLUSION survives -- measured, our clean end sits near 0.06 of average against NESO''s 0.19 -- but the REASON was asserted, and this is the SAME sentence found earlier the same day to have been a recollection in the grammar of a measurement. REPAIRED: the sentence now states the measured conclusion and names the opposing directions instead of a tidy story. CONTROLS, ALL THREE MUTATION-PROVEN THIS PASS (R15, in-memory mutations, nothing written): test_the_feed_publishes_the_correction_ON_THE_STATISTIC_THE_PAGE_PRINTS (fired on the pre-regeneration feed that carried no p95 factor); test_the_stated_ERROR_DIRECTION_does_not_contradict_the_NAMED_GAPS_beside_it (fired when the old ''both ... cleaner'' sentence was restored); test_the_two_percentile_implementations_cannot_drift_apart (fired at n=13, p=0.05 when one side was switched to an interpolated rule) -- that last one guards the repair to (2) at a grain no page reader could ever see: the page''s spread and its correction factor are only like-for-like while both percentile implementations round the same way. TWO MAJOR FINDINGS NOT FIXED, QUEUED (SELF_INTERRUPT -- the supply is infinite, and neither blocks anything): (4) ''7 of 263 MEASURED'' and ''at three measured households'' render on ONE panel, the second a hardcoded literal at tools/generate_explore_carbon.py:407 -- R10 class, the derived-vs-typed pair this file already has a control for on the OTHER sentence; (5) the headline kg CO2e is unauditable where displayed (no kWh, no gCO2e/kWh beside it). Back-solved, the intensities are fine (325/243 g/kWh) and the CONSUMPTION is the outlier -- 89.2 kWh in one day on an account labelled ''resi, electricity'' (C8 87.0, C9 82.1, against their own summer days at 9.9/14.5). That is a population question for the book, not a carbon one, and it is the more interesting of the two. WHAT ACTUALLY HOLDS L3, and it is not the finding count. The atom''s shape does not yet FAIL LIKE REALITY, which is the L3 definition rather than a matter of polish. Measured this pass, our p95/p5 spread runs 3.27 (2019) -> 18.42 (2024) where NESO''s published series runs 2.78 -> 5.06: the divergence WIDENS by year and is 3.6x by 2024. Closing it means dispatching coal and modelling interconnector imports -- build work this atom has not done and did not do here. A second Expert Hour after that build is what L3 needs, and it should be taken by something that is not this model family if that is ever available, because independence: false is the honest label on this one.'
map_notes:
  origin_note: 'CARBON_NOT_A_TARGET_CONSTRAINT already governs this lane and binds here: an intensity feed makes a carbon number cheap to publish and therefore cheap to optimise toward, which is exactly what that constraint forbids (R12). The forecast/actual split is the fidelity prize -- the company acts on the FORECAST and is settled against the ACTUAL, which is a belief-vs-truth gap available for free from a public API.'
  name: 'Adapter for the NESO Carbon Intensity API (carbonintensity.org.uk): free, no key, national and regional actual and forecast gCO2/kWh. Access class OPEN NOW. Regional intensity multiplied by half-hourly usage is the abatement ledger''s ground truth. Feeds E5_carbon_three_ledger, which today has no real feed behind it.'
