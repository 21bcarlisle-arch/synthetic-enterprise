- '2026-08-25 HARDEN -- THE EXPERT HOUR, and it did not pass. Drawn as EP13 level 2->3 on a worker tick; the atom''s own map entry named the one remaining gate (''STILL OPEN -- no Expert Hour has been taken''), so this pass took it. Technique: .claude/skills/cold-eyes-walk -- a fresh fork given ONLY the rendered carbon panel text (no repo, no diff, no tools), priors committed in writing before viewing, persona = 25-year GB carbon-reporting/assurance veteran, then every finding verified post-hoc against a Playwright render of the live page, site/data/explore_carbon.json as served, and the generating modules. independence: FALSE -- same model family as the builder, so this is BLINDNESS, not independence, and the verdict is worth exactly that much. 10 findings, 5 MAJOR, filed to docs/observability/sanity_adjudication_ledger.json (90 -> 100 entries) with one blind finding adjudicated FALSE POSITIVE and recorded so it does not re-raise (the ''THE CUSTOMER CAN SEE THIS'' tag is the site-wide SIDE_LABEL wall marker enforced by tools/explore_wall_sides.py, not a leaked internal annotation). VERDICT: NOT ''this is real''. THE LEVEL DOES NOT MOVE AND STAYS AT 2. The drawn plan said 2->3; LAW A -- the plan is a diagnostic and never a target, and where a date and a test conflict the date is wrong. THREE MAJOR FINDINGS REPAIRED IN THIS SAME PASS, each with a mutation-proven control, because all three were WRONG ON A LIVE CUSTOMER-FACING SURFACE rather than merely untidy: (1) THE CORRECTION INSTRUCTION WAS WRONG FOR EVERY MEASURED HOUSEHOLD. The panel told the reader to ''read the timing figures above as an upper bound by about that factor'' (3.2x). Measured per household in the generator''s own data: C7 1.09x, C8 1.73x, C_IC4 1.25x, C_IC3 7.0x, and on C9''s 2021 summer day THE SIGN REVERSES (sign_differs -- company believes the home drew at dirtier-than-average times, NESO''s published series says cleaner). Not one household is near 3.2x; a reader following the instruction on the panel''s own C7 example gets 10.6% where the measured answer is 31.1%, wrong by 3x in the safe-sounding direction. A year-level range ratio cannot be applied to one household''s day. REPAIRED: the magnitude instruction is deleted and the DIRECTION kept (it is measured); the magnitude now belongs to the per-household paragraph that already computed it. (2) THE CORRECTION MIXED TWO STATISTICS. The panel prints a p95/p5 spread (''the dirtiest 5% ran 5.1x the cleanest 5%'') and corrected it with `spread_overstated_by`, which is the mean of six max/min ratios -- two single half hours out of seventeen thousand on each side, which generate_grid_intensity_feed.year_stats'' OWN docstring already refuses to rest a claim on (''one reading of one meter''). Two statistics under one word. REPAIRED: neso.compare_shapes now returns reconstructed_p95_over_p5 / published_p95_over_p5, versus_published publishes `p95_spread_overstated_by`, and the page quotes THAT. Measured, the two factors differ -- max/min 3.16x, p95/p5 2.87x -- so the mismatch was not cosmetic. Both are published: dropping max/min to tidy the page would be choosing the flattering statistic after seeing both, which is what R12 exists to stop. (3) THE STATED ERROR DIRECTION CONTRADICTED ITS OWN MODULE''S GAP LIST, TWENTY LINES APART, AND IT IS THE SENTENCE THAT REACHES THE PAGE. ERROR_DIRECTION said no coal and no interconnector imports ''BOTH make quiet half hours look cleaner''. NAMED_GAPS says the opposite on both limbs: coal omission is a DIRTY-end error, and omitting interconnector imports makes half hours read DIRTIER (GB is a net importer of French nuclear and Norwegian hydro, and NESO''s consumption basis counts them at the exporting country''s intensity). The two gaps push in OPPOSITE directions, so only their NET effect is knowable. The CONCLUSION survives -- measured, our clean end sits near 0.06 of average against NESO''s 0.19 -- but the REASON was asserted, and this is the SAME sentence found earlier the same day to have been a recollection in the grammar of a measurement. REPAIRED: the sentence now states the measured conclusion and names the opposing directions instead of a tidy story. CONTROLS, ALL THREE MUTATION-PROVEN THIS PASS (R15, in-memory mutations, nothing written): test_the_feed_publishes_the_correction_ON_THE_STATISTIC_THE_PAGE_PRINTS (fired on the pre-regeneration feed that carried no p95 factor); test_the_stated_ERROR_DIRECTION_does_not_contradict_the_NAMED_GAPS_beside_it (fired when the old ''both ... cleaner'' sentence was restored); test_the_two_percentile_implementations_cannot_drift_apart (fired at n=13, p=0.05 when one side was switched to an interpolated rule) -- that last one guards the repair to (2) at a grain no page reader could ever see: the page''s spread and its correction factor are only like-for-like while both percentile implementations round the same way. TWO MAJOR FINDINGS NOT FIXED, QUEUED (SELF_INTERRUPT -- the supply is infinite, and neither blocks anything): (4) ''7 of 263 MEASURED'' and ''at three measured households'' render on ONE panel, the second a hardcoded literal at tools/generate_explore_carbon.py:407 -- R10 class, the derived-vs-typed pair this file already has a control for on the OTHER sentence; (5) the headline kg CO2e is unauditable where displayed (no kWh, no gCO2e/kWh beside it). Back-solved, the intensities are fine (325/243 g/kWh) and the CONSUMPTION is the outlier -- 89.2 kWh in one day on an account labelled ''resi, electricity'' (C8 87.0, C9 82.1, against their own summer days at 9.9/14.5). That is a population question for the book, not a carbon one, and it is the more interesting of the two. WHAT ACTUALLY HOLDS L3, and it is not the finding count. The atom''s shape does not yet FAIL LIKE REALITY, which is the L3 definition rather than a matter of polish. Measured this pass, our p95/p5 spread runs 3.27 (2019) -> 18.42 (2024) where NESO''s published series runs 2.78 -> 5.06: the divergence WIDENS by year and is 3.6x by 2024. Closing it means dispatching coal and modelling interconnector imports -- build work this atom has not done and did not do here. A second Expert Hour after that build is what L3 needs, and it should be taken by something that is not this model family if that is ever available, because independence: false is the honest label on this one.'
- '2026-08-25 BUILD, the third of the day, and it closes the gap the previous two named as what held L3 -- THE THERMAL STACK REACHING EXACTLY ZERO. It does not reach L3 either, and the reason has CHANGED rather than survived, which is the part worth reading. WHAT WAS WRONG: `grid_carbon_intensity.emissions_rate_t_per_mwh` dispatched `residual - must_run` and let the result reach zero. GB''s thermal fleet never does -- gas runs for inertia, reserve and voltage whatever the residual says -- and the model dispatched NO thermal plant at all in 16.1% of 2024''s half hours and 30.8% of 2025''s, a share that grows with renewables. Those are exactly the half hours a time-shifting recommendation points a customer at, so the error sat where it did the most damage. WHAT WAS BUILT: `elexon_fuel_outturn.thermal_floor_by_year`, the CCGT+OCGT fleet''s DEMONSTRATED ANNUAL MINIMUM output measured out of the same published FUELHH outturn the coal capacity comes from (350,470 rows fetched this tick; 1,835 MW in 2016 falling to 303 MW in 2024). THE BOUNDARY IS THE SAME ONE COAL IS HELD BEHIND and it is tested, not asserted: only the per-YEAR scalar crosses into the reconstruction. A dispatch model handed the metered gas output of each half hour is not a second route to NESO''s number, it is NESO''s arithmetic with a different cache, and the coupled-triad gap would measure nothing while still producing a figure (`test_the_reconstruction_is_handed_no_half_hourly_gas`). THE ONE CHOICE THAT COULD HAVE BEEN GOAL-SEEKING, NAMED: the raw annual MINIMUM is fragile where a maximum is not -- one dropped half hour sets it -- and the robust answer, the 1st percentile, is also HIGHER (1,720 MW against 303 MW in 2024), which means a dirtier clean end, a narrower modelled swing and a BETTER score against the series this model is graded on. Choosing the robust statistic here is indistinguishable from choosing the flattering one, so the minimum is consumed and p1 is PUBLISHED BESIDE IT as a diagnostic (R12). Where the minimum is wrong it understates the floor, erring back toward the known-wrong behaviour rather than past it. MEASURED BEFORE AND AFTER IN ONE PROCESS AGAINST IDENTICAL CACHES, floor as the only variable -- the previous note''s table compared two separate runs and the PUBLISHED series'' own figures moved between them, which is a confound, not a result. p95/p5 overstatement 1.90x -> 1.36x; max/min 2.44x -> 1.04x; mean absolute error fell in EVERY year. THREE THINGS THAT ARE NOT A CLEAN WIN AND ARE REPORTED BECAUSE THEY HAPPENED. (1) The clean end now OVERSHOOTS in two years of six -- 2020 reads 0.314 against a published 0.244 and 2021 reads 0.233 against 0.195, dirtier than GB was, not cleaner. The published ERROR_DIRECTION sentence claimed the clean end is optimistic FULL STOP; that is now contradicted by this module''s own measurement in two years, so the sentence was rewritten to claim the RANGE and to say plainly that the clean end is mixed. (2) CORRELATION DID NOT MOVE by more than 0.004 in any year and is still 0.726 in 2024. That is the most useful line in the table and it RE-DIAGNOSES the atom: the floor fixed a LEVEL error at the clean end and left the TIMING error untouched. This shape now knows how clean a quiet half hour is and still does not know WHICH half hours were the quiet ones. (3) A CONTROL WENT RED FOR THE RIGHT REASON AND WAS NOT SILENCED. `test_the_headline_says_we_OVERSTATE_and_by_how_much` required `spread_overstated_by > 1.5`, justified by "it dispatches no coal and no interconnector imports" -- a premise that died this morning -- and the floor carried max/min to 1.04x. Lowering 1.5 until it passed would be the goal-seeking R12 exists to stop, so the guard was rewritten to check what it NAMES: degeneracy (correlation of exactly 0.0 or 1.0, zero error, identical spreads), which does not expire when the model improves, plus one surviving fidelity claim on the statistic the page actually prints (p95/p5 > 1.0). Proven by comparing the published series against itself: 19 assertions fire. R15: SIX new controls, every one mutation-proven this pass in a scratch copy outside the repo (never the shared tree -- the live producer reads it each cycle), each firing on its own defect and nothing else -- floor:=p1, missing-fuel-summed-as-zero, zero-reading-kept, floor-dropped, floor-added-instead-of-bounded, cap-removed. LEVEL STAYS AT 2. The named blocker is closed and measured; what holds it now is the correlation line -- an instrument at 0.73 against the published series would still point a customer at the wrong half hours, and getting the LEVEL of the clean end right does not fix that. The second Expert Hour the previous pass called for is also still untaken, and should not be taken by this model family. LAW A: the drawn plan said 2->3 and a plan is a diagnostic, never a target.'
- '2026-08-25 BUILD/HARDEN, the fourth EP13 pass of the day, drawn again as level 2->3. IT DOES NOT REACH L3 AND THE LEVEL STAYS AT 2 (LAW A: the drawn plan is a diagnostic, never a target). What this pass produced is a MEASUREMENT that re-diagnoses the atom and one repair to a live customer-facing sentence, plus one orphaned record landed. FIRST, A HYPOTHESIS OF MINE, TESTED AND REFUTED, which is why it is reported first. The module''s own NAMED GAPS flag the two interconnectors with no published NESO factor (North Sea Link, Viking Link) as the gap that IS GROWING -- 0% of imported MWh in 2019-20 rising to 34% in 2024 -- and their flow is currently modelled as GB gas, which is both wrong and growing at the same rate as the correlation defect. That looked like the timing driver. IT IS NOT. Counterfactual run over 2019-2024 with the uncovered flow imputed at the MW-weighted mean rate of the cables NESO does publish, in the same half hour (an imputation, not a fabricated factor): correlation moved 0.726->0.737 in 2024, 0.843->0.843 in 2022, and the WRONG WAY in 2023 (0.793->0.779). A growing gap that happens to grow alongside a growing defect is a coincidence until it is measured, and this one was a coincidence. The imputation was NOT adopted -- it buys ~0.01 and costs a stated assumption about cables nobody has published a number for. SECOND, WHAT THE ERROR ACTUALLY IS, and it changes what the page tells customers. The published headline corrects the model''s range by 1.36x (p95/p5 vs NESO''s). That factor BLENDS TWO AXES THAT POINT OPPOSITE WAYS. Decomposed day by day over the six years both series cover: the BETWEEN-day swing matches the published series to within 7% in EVERY year (0.93-1.00x, mean 0.96 -- if anything slightly under-swung), and the WITHIN-day swing is too wide in EVERY year (1.41-1.58x, mean 1.48). The whole of the exaggeration is intra-day. That is the only axis a customer can act on -- a household can move the washing from 6pm to 2am and cannot move it to a windier Tuesday in March -- so the correction printed on the panel UNDER-corrects the very claim it is printed to correct, by about a tenth. REPAIRED: compare_shapes now returns the four sds and the two factors, the feed carries them per year, and ERROR_DIRECTION (the sentence that reaches the page) states the split with its measured numbers. THIRD, THE RE-DIAGNOSIS. Correlation is 0.726 in 2024 and the previous pass left it there. The decomposition localises it: day MEANS track well (day-mean correlation 0.931 in 2019 falling to 0.761 in 2024); the within-day ORDERING does not. Against every candidate in the gap list the error correlates most with RENEWABLE SHARE (-0.49 in 2024, the largest of seven tested; uncovered imports +0.19, settlement period +0.11, weekend +0.00). The structural reading: this shape''s correlation with renewable share is -0.84 where the PUBLISHED series'' is only -0.53, and that divergence has widened every year since 2019 (-0.878 vs -0.738 in 2019). A dispatch model handed demand, wind and solar can only ever be a function of residual demand; GB''s real intensity increasingly is not. So what holds L3 is not a missing correction of the kind the last three passes each supplied -- it is that the inputs crossing the wall cannot express the remaining variance, and widening them (half-hourly metered gas, biomass, storage) is exactly what test_the_reconstruction_is_handed_no_half_hourly_gas exists to forbid, because it would make this NESO''s arithmetic with a different cache and the coupled-triad gap would measure nothing. That is a REAL trade the next pass has to take a position on, not a defect to patch. R15 -- SIX new controls, every one mutation-proven this pass in a throwaway namespace outside the repo (the live producer reads the working tree each cycle, so nothing was mutated in place), and TWO OF THEM ONLY EXIST BECAUSE A MUTATION SURVIVED THE FIRST DRAFT. (a) The between-day term was first written with each day''s mean weighted equally. THE PANEL IS NOT BALANCED -- 2019 shares 16,923 half hours over 359 days, not the 17,232 a full day each would give -- so equal weighting breaks the variance identity by 4.2% on an unbalanced fixture while passing every balanced one. The 48-period controls could not see it: the mutation SURVIVED all four, which is what sent the statistic back to be weighted by half hours carried. Now within^2+between^2==total^2 exactly on any panel, proven by test_the_decomposition_recombines_on_an_UNBALANCED_panel. (b) The derived-vs-typed control on ERROR_DIRECTION first asserted that the measurement fell INSIDE the quoted range. A one-sided containment check on a published range is FAIL-OPEN by construction: the loosest claim always survives it, so widening the sentence to ''1.41-1.90x'' against a measured 1.41-1.58x -- simply a false sentence to a reader -- passed. Both ends are now pinned to the measurement at the rounding the sentence prints, and all five mutations are caught. The other four: day-mean->series-mean (68.3% identity break), grand-mean-of-day-means, NaN-instead-of-None for an undefined ratio, and the within-day factor computed as a correlation. THE NULL CONTROL that matters here: correlation is SCALE-INVARIANT, so a model swinging 3x too hard at exactly the right times scores 1.0. The swing factors and the correlation therefore answer different questions and neither is evidence for the other -- test_a_pure_rescaling_moves_the_swing_factors_and_never_the_correlation pins that, which is the only reason publishing both is not redundancy. ALSO LANDED THIS PASS (ee316bb62): the PREVIOUS pass''s own record. Its code -- elexon_fuel_outturn.thermal_floor_by_year and six controls -- was committed at HEAD while its simplification note sat uncommitted in the working tree, so the atom''s only account of what moved and why was one power cut from gone. Found by reading git status against HEAD rather than by trusting the note in the tree. EVIDENCE: 135 tests pass across the atom''s file_scope (tests/sim/test_neso_carbon_intensity.py 36, test_grid_carbon_intensity.py, test_elexon_fuel_outturn.py, tests/company/carbon/test_half_hourly_footprint.py, tests/tools/test_grid_intensity_feed_and_explore_carbon.py 33); epistemic verifier PASS; feed regenerated (157,125 half hours, 10 years) and the new per-year keys are in docs/market_data/grid_intensity_feed.json, which is what the ERROR_DIRECTION control reads. CHECKABLE CLAIMS, so the next pass can refute these without trusting the prose. LANDED: `_split` in `sim/neso_carbon_intensity.py` -- the within/between variance decomposition, weighted by half hours carried. LANDED: `test_the_decomposition_recombines_on_an_UNBALANCED_panel` in `tests/sim/test_neso_carbon_intensity.py` -- the control whose mutation survived the balanced-panel drafts. LANDED: `test_the_WITHIN_DAY_FIGURES_QUOTED_in_ERROR_DIRECTION_are_the_MEASURED_ones` in `tests/tools/test_grid_intensity_feed_and_explore_carbon.py` -- the derived-vs-typed pair on the published sentence, both ends pinned. LANDED: `ERROR_DIRECTION` in `tools/generate_grid_intensity_feed.py` -- the page-facing sentence now states the two-axis split. NOT LANDED, DELIBERATELY: the uncovered-import imputation of the refuted hypothesis above. It exists in no commit and should not be looked for.'
- '2026-08-26 BUILD, the fifth EP13 pass, drawn again as level 2->3. IT DOES NOT REACH L3 AND THE LEVEL STAYS AT 2 (LAW A). WHAT WAS BUILT: the must-run block had been a FLAT 8,000 MW since this module was written -- 2,400 MW biomass, 5,600 MW nuclear+hydro -- and GB''s is not flat. `sim/elexon_fuel_outturn.py` now ingests Elexon''s published half-hourly NUCLEAR and NPSHYD outturn (FUELHH, key-free, the same dataset coal and the cables already come from) into a third reduced cache, and the dispatch serves the zero-carbon half of the block from the fleet GB actually ran. Measured over 175,212 half hours that block runs 544 MW to 9,831 MW, mean 6,013 MW: every megawatt of that movement was previously made up by the gas stack on a schedule of the model''s own invention, which is a TIMING error by construction -- and timing is the axis the thermal floor left untouched at correlation 0.726. WHY A HALF-HOURLY SERIES MAY CROSS THE WALL HERE when half-hourly gas and coal may not, stated as two conditions that are TESTED rather than argued: (1) NESO''s own published factor for both fuels is EXACTLY ZERO, so nothing of the answer crosses -- what is handed over changes the RESIDUAL the merit order serves, never its verdict; (2) the published outturn is NEVER NEGATIVE, which is what separates an availability from a dispatch decision. Condition 2 is the load-bearing one and condition 1 alone is fail-open: NESO publishes PUMPED STORAGE at zero too, and pumped storage is pure arbitrage wearing a zero factor -- it gives itself away by going negative when it pumps. Measured on the real published series: 0 negative half hours in 175,212. MEASURED BEFORE/AFTER IN ONE PROCESS against identical caches with that series as the ONLY variable, and the enabling refactor was first proven to change no number at all when the argument is defaulted (max abs difference 0.0 over 20,000 random half hours). corr 2019 0.863->0.883, 2020 0.849->0.869, 2021 0.883->0.909, 2022 0.843->0.871, 2023 0.793->0.795, 2024 0.726->0.746. CORRELATION AND MEAN ABSOLUTE ERROR IMPROVED IN ALL SIX YEARS -- the first correction on this atom that reached the timing axis at all (the thermal floor moved correlation by <0.004 in every year; coal+cables moved it but LOST 2021). Within-day overstatement, the only axis a household can act on, fell 1.484x -> 1.450x mean and 1.440x -> 1.352x in 2024. NOT A CLEAN WIN, AND THE HEADLINE WENT THE WRONG WAY: p95/p5 overstatement ROSE 1.362x -> 1.378x, worse in four years of six, while max/min overstatement FELL 1.044x -> 1.007x. Two statistics under the one word ''spread'', moving in opposite directions, so neither is quoted alone -- quoting whichever improved would be choosing the flattering statistic, which is the trap `thermal_floor_by_year` already names. Within-day also got WORSE in 2019 and 2020. Both halves reach the feed and the page. R15: 10 named mutations RUN, each confirmed RED then restored GREEN. ONE CONTROL FAILED ITS OWN MUTATION AND WAS REBUILT: `test_the_MEASURED_series_is_multiplied_by_no_emission_factor` SURVIVED pricing the handed-over series at the blended must-run rate, because at the FALLBACK 5,600 MW the correct and mispriced arithmetic are identical (8,000 x 0.036 == 2,400 x 0.12) and its fixture varied only quantities that stayed monotone. Rebuilt to isolate the must-run term in a half hour with no thermal dispatch and assert its tonnage is EXACTLY the biomass block at values away from the fallback; it now fires. WHY STILL L2: correlation 0.746 in 2024 is real movement in the right direction in every year and is still an instrument that would point a customer at some of the wrong half hours. L3 means the thing FAILS LIKE REALITY. The second Expert Hour is also still untaken. NEXT GAP, NAMED AND SIZED: BIOMASS is still a flat 2,400 MW and may NOT be handed over the same way -- it carries 120 gCO2/kWh on NESO''s own table, so its metered output is an emissions term and condition 1 refuses it. 2024''s outturn averages nearer 2.7 GW and swings 1.0-3.0 GW. Closing it means MODELLING biomass dispatch, not reading it: a harder build than this one, and the honest next step rather than a fourth availability series. REMEDIATION ON TOUCH: `main()` never parsed the --thermal flag its own loader error message has told readers to run since the day it was written; that command exited 2. Fixed, and --zero-carbon-must-run added beside it.'
- '2026-08-26 BUILD, the sixth EP13 pass, drawn again as level 2->3. IT DOES NOT REACH L3, THE LEVEL STAYS AT 2, AND THE CORRECTION THIS PASS BUILT IS DELIBERATELY NOT WIRED INTO THE PUBLISHED SERIES -- because it was measured and it makes the series WORSE. WHAT WAS BUILT: the last pass named its own next step, BIOMASS, still a flat 2,400 MW while the other half of the same must-run block had been replaced with measured outturn. It is built: a fourth reduced cache from Elexon FUELHH (143,057 rows, 2017-2025), an ANNUAL ENVELOPE per year (demonstrated minimum and maximum, with p1/p99/mean published beside them as diagnostics), and a dispatch that clamps the fleet between those ends against the residual this model computes for itself. WHY THE GRAIN IS ANNUAL AND NOT HALF-HOURLY, which is the opposite ruling to the one the last pass made one fuel over: biomass FAILS condition 1 outright -- NESO prices it at 120 gCO2/kWh on its own table, so its metered output IS an emissions term -- so it crosses at COAL''S grain, two scalars a year, and where inside them the fleet sits is decided here. Proven by consequence rather than by inspection: perturbing p1_mw, p99_mw, mean_mw or half_hours moves the published shape by exactly nothing, and perturbing either end moves it. NULL CONTROL FIRST, against HEAD''s own module in one process: max absolute difference 0.0 over 20,000 random half hours both when the argument is defaulted AND when it is handed a deliberately flat 2,400 MW envelope -- two different paths through the clamp, so the measurement isolates one variable. MEASURED BEFORE AND AFTER, identical caches, envelope as the only variable, 2019-2024: correlation 0.8453 -> 0.8466 mean (up in four years of six, 2024 0.746 -> 0.753) and EVERYTHING ELSE WENT BACKWARDS -- mean absolute error 0.1617 -> 0.1679, within-day overstatement 1.4496 -> 1.5047, p95/p5 5.32 -> 6.33, max/min 11.83 -> 25.41, and 2024''s max/min alone 24.5 -> 83.3. THE MECHANISM OF THE LOSS, measured rather than guessed, and it is the part worth keeping: the residual sits ABOVE the demonstrated capacity in 96.4% of 2019''s half hours and 83.6% of 2024''s, so in almost every half hour the change did not ramp anything -- it raised a flat 2,400 MW block to a flat ~3,300 MW one -- and in the remaining tenth it dropped the fleet to a demonstrated minimum of 73 MW. That cliff lands exactly on the quiet half hours the clean end is measured over, which is the whole of the spread blow-up. AND THE MODELLING PREMISE IS REFUTED, which is why the answer is not a different statistic: correlation between the residual and the published biomass outturn runs 0.16 to 0.58 across 2018-2025, so 2.6% to 33.5% of the fleet''s variance is all a residual-driven model could ever explain. Biomass under a CfD is paid a strike price on metered output; it runs when it is AVAILABLE, and its low readings are OUTAGES, not price responses. Availability is not derivable from the residual, so closing this needs an outage model. THE STATISTIC THAT WOULD HAVE HIDDEN ALL OF THAT, and why it was refused: swapping the raw minimum for p1_mw scores better (2024''s p1 is 550 MW against a 73 MW minimum, which lifts the clean end and narrows the swing). Choosing a statistic because of what it does to this model''s grade is what R12 and R13 forbid, and it would have bought a better number by burying a refuted premise. thermal_floor_by_year takes the raw minimum for the OPPOSITE reason and the asymmetry is worth carrying: for gas a lower floor errs BACK toward the known-wrong baseline, and for biomass -- the only carbon-carrying term in the must-run block -- a lower floor errs PAST it, into a cleaner clean end. R15: 17 named mutations RUN, each confirmed RED then restored GREEN, and ONE CONTROL FAILED ITS OWN MUTATION TWICE AND WAS REBUILT BOTH TIMES. First, the saturation assertion was written as rate > rate_of(capacity), which a fleet that simply kept growing past its maximum satisfies, so removing the upper clamp SURVIVED; re-aimed at the UNCAPPED fleet''s rate, since the remainder must cost gas rather than 120 g. Second, the unwired-flag control asserted on build_shape''s parameter and not on the publishing call, so hard-coding None in generate() -- severing the flag from the only call site that publishes -- SURVIVED; it now checks the parsed call. THE FLAG IS A DECISION, NOT AN OMISSION: BIOMASS_DISPATCH_WIRED is False with the measurement in its docstring, the feed still REFUSES to publish without the envelope, SHAPE_BASIS still says the block is a constant 2,400 MW while it is off, and a test fails if the basis ever claims a dispatch the published series did not get. The envelope reaches the live feed as biomass_envelope_mw (9 years; 2024 reads 73 - 3,328 MW, mean 2,142 against the assumed 2,400) so a reader can size the named gap without taking this project''s word for it. ONE FINDING ABOUT COVERAGE RATHER THAN ABOUT US: Elexon publishes no BIOMASS fuel type at all before 2017 and only 2,887 half hours of 2017, so those years have no envelope and fall back to the flat block by construction, not by failure.'
- '2026-08-26 BUILD, the seventh EP13 pass, drawn again as level 2->3. IT DOES NOT REACH L3 AND THE LEVEL STAYS AT 2 (LAW A). What this pass built is the step the FRAME wrote down on 2026-08-14 and six passes then walked past -- §7 STEP 5, THE FORECAST GAP -- and the reason it kept being walked past is worth naming first: every pass since has been about making THIS MODEL''S shape agree with NESO''s published outturn, and step 5 is not about this model at all. WHAT WAS BUILT: `neso_carbon_intensity.forecast_skill()`, which grades NESO''S OWN PUBLISHED FORECAST against NESO''S OWN PUBLISHED OUTTURN. Both sides were already on disk -- the cache fetched for the shape comparison on 2026-08-25 carries a forecast on all 104,454 half hours it carries an outturn on, and nothing had ever read the field. No fetch this tick. THE STATISTIC THAT MATTERS IS NOT AN ERROR IN GRAMS: per day, rank the half hours BY FORECAST, take the cleanest six (three hours -- a wash plus a dryer, or an overnight EV top-up), and ask what fraction of that day''s ACHIEVABLE within-day saving the pick actually delivered when scored on OUTTURN, where achievable is the same window chosen with hindsight. MEASURED 2019-2024: mean 0.858, median 0.909, p5 0.554, and on 7 days of 2,165 the forecast''s pick was DIRTIER than not shifting at all (2019''s worst day scores -1.20). Published as a DISTRIBUTION and never a mean, which is what §7 step 5 actually required -- a mean over a series whose whole point is intraday variation averages the calm days that need no advice into the volatile ones the advice exists for. WHY THIS IS THE ATOM''S PRIZE AND NOT ANOTHER CORRECTION: it is a CEILING that compounds with the overstatement the last six passes have been shrinking, and unlike that overstatement NO IMPROVEMENT TO THE RECONSTRUCTION CAN RECOVER IT. It is a fact about what was knowable at the time. The page has been quoting a within-day spread and turning it into a saving, which silently assumes the customer knew which half hours were the clean ones; the honest reading is (this model''s overstatement) x (what a forecast could actually pick), and the second factor was missing from the sentence that reaches the reader. IT NOW REACHES THE READER: ERROR_DIRECTION carries it verbatim to `site/explore` via `g.error_direction`, and the two percentages it quotes are PINNED to the feed''s own measurement to within 2 points (`test_the_CEILING_PERCENTAGES_QUOTED_in_ERROR_DIRECTION_are_the_MEASURED_ones`) -- this module has twice been caught publishing a recollection written in the grammar of a measurement, and a number nobody checks is how that happens a third time. A FINDING ABOUT THE COUNTERPARTY, not about us: NESO''s published FORECAST field carries six half hours in 2019 that are not a grid -- 13,579, 9,612, 4,179 and 1,589 gCO2/kWh among them. Averaged in they move 2019''s timing dispersion from 15.1 g to 154.7 g and its level dispersion from 4.9 to 29.2, i.e. the whole of what looked like a bad forecasting year is six readings. REFUSED BY PHYSICS RATHER THAN BY PERCENTILE: the ceiling is the maximum of NESO''s OWN published per-fuel factor table (coal, 937 g/kWh -- the dirtiest grid GB could physically be), read from `elexon_fuel_outturn.NESO_PUBLISHED_FACTOR_G_CO2_PER_KWH` rather than written as a literal, so a correction to that table moves it. The bound is nowhere near the data -- the 99.99th percentile forecast is 434 and the highest reading below the ceiling is 447, with the nearest refused value at 1,589 -- so it is a refusal and not a trim, and it is applied to FORECAST AND OUTTURN ALIKE because a filter on one side of a comparison measures the filter. THE MODULE''S OWN STANDING REFUSAL WAS NARROWED RATHER THAN OVERRIDDEN, and the distinction is the load-bearing part. Its docstring said ''NO FORECAST-VS-OUTTURN GRADING... this module offers no helper that would make it convenient'', which conflated two acts: grading the COMPANY''s advice against outturn is a foresight leak and stays refused; grading the counterparty''s own forecast against its own outturn is a fact any real supplier could compute from the same key-free API. So `forecast_skill` returns ANNUAL AGGREGATES ONLY -- no key, no pair, nothing joinable back to a half hour -- and that is a CONTROL (`test_forecast_skill_hands_back_no_half_hour_pairing` asserts every returned value is a scalar and fires when a `pairs` list is added), not a paragraph. THE ONE DIAL IS PUBLISHED WITH ITS SWEEP: the six-half-hour window is a choice about how long a household runs an appliance, and any choice inside a headline is somewhere the headline improves without the world changing, so `window_sensitivity_capture_mean` publishes 2/4/6/8/12 beside it (0.814 -> 0.884, about four points across the whole sweep, so the choice is visibly not carrying the result). R15: 18 NAMED MUTATIONS RUN, each confirmed RED then restored GREEN -- 11 on the measurement, 4 on the feed block, 3 on the published sentence. The two that shape the design rather than merely guarding it: picking the window BY OUTTURN instead of by forecast makes the statistic 1.0 on every input by construction (hindsight grading hindsight), and it SURVIVES the perfect-forecast anchor test -- only a fixture whose forecast ranks the day backwards can see it; and scoring a flat day (achievable saving 0/0) as capture 1.0 is the fail-open substitution that would let a broken flat feed report the most flattering possible answer, so a degenerate day is excluded and COUNTED. WHAT THIS DOES NOT DO, stated because the temptation is obvious: it does not touch the correlation gap (0.746 in 2024) that has held the level since 2026-08-25, it publishes no regional series, and it does not grade any advice this company gives -- there is no advice yet, and when there is, grading it against outturn is still the foresight leak the module refuses. R12: the capture fraction is a DIAGNOSTIC and the temptation to move it is unusually strong because a high number flatters the mission''s own thesis. Nothing in this repository may be tuned toward it.'
map_notes:
  origin_note: 'CARBON_NOT_A_TARGET_CONSTRAINT already governs this lane and binds here: an intensity feed makes a carbon number cheap to publish and therefore cheap to optimise toward, which is exactly what that constraint forbids (R12). The forecast/actual split is the fidelity prize -- the company acts on the FORECAST and is settled against the ACTUAL, which is a belief-vs-truth gap available for free from a public API.'
  name: 'Adapter for the NESO Carbon Intensity API (carbonintensity.org.uk): free, no key, national and regional actual and forecast gCO2/kWh. Access class OPEN NOW. Regional intensity multiplied by half-hourly usage is the abatement ledger''s ground truth. Feeds E5_carbon_three_ledger, which today has no real feed behind it.'
  level_hold_note: "STILL L2 as of 2026-08-25, and one of the three original reasons is now closed. The note as\nwritten was: \"the shape dispatches no coal and no interconnector imports, so its clean end is\noptimistic against NESO's published series; no Expert Hour has been taken; and the\ncoupled-triad rung is unmet -- there is no independent truth series to measure the company's\nbelief against yet.\"\n  CLOSED -- the truth series exists. `sim/neso_carbon_intensity.py` is the adapter this atom\n  was actually named for (NESO Carbon Intensity API, key-free, from 2018-05-11), and it is\n  independent by construction: it imports nothing from the reconstruction, and a test walks\n  its AST to keep it that way rather than asserting it in prose.\n  QUANTIFIED, NOT CLOSED -- the clean-end optimism was \"direction known, size not\" and now\n  has a size: over 2019-2024 our floor is ~0.059 against NESO's ~0.189, and our shape swings\n  32x where NESO's swings 11.4x. Every abatement figure derived from this shape carries that\n  2.8x overstatement of the range. Fixing it means dispatching coal and modelling\n  interconnector imports, which is build work this atom has not done.\n  ALSO CORRECTED -- the reconstruction's docstring asserted this comparison (\"NESO ...\n  bottoming out nearer 0.16\") before any fetch had ever run. Measured, NESO's floor averages\n  0.189 and only 2024 is below 0.16, so the old sentence understated the gap it warned about.\n  The SAME sentence was cited as error-bar evidence in this atom's own L0->L2 ledger row.\n  That row stands unedited -- it is the record of what was certified and when, which is what\n  a ledger is for -- and the corrected figures live here, where the draw and GATE 15 read\n  them. A record that can be rewritten when it turns out to be wrong is not a record.\n  TAKEN 2026-08-25, AND IT DID NOT PASS -- the Expert Hour that this note called the remaining\n  gate on L3 was drawn and run the same day (cold-eyes-walk: blind fork, priors before pixels,\n  veteran persona, every finding then verified against the live render and the generating\n  modules). 10 findings, 5 MAJOR, in docs/observability/sanity_adjudication_ledger.json;\n  1 blind finding adjudicated a FALSE POSITIVE and recorded so it cannot re-raise.\n  independence: FALSE -- same model family as the builder, so this bought BLINDNESS, not\n  independence, and the verdict is worth exactly that much.\n  VERDICT: not \"this is real\". THREE of the MAJOR findings were wrong on a live customer-\n  facing surface and were repaired in the same pass, each with a mutation-proven control:\n  the panel's \"read the timing figures as an upper bound by about that factor\" instruction\n  (wrong for every measured household -- 1.09x to 7.0x where it said 3.2x, and on C9's day\n  the sign reverses); a p95/p5 spread corrected by a max/min-derived factor (two statistics\n  under one word -- 3.16x vs the like-for-like 2.87x); and ERROR_DIRECTION, the sentence that\n  REACHES THE PAGE, contradicting this same module's NAMED_GAPS on both limbs.\n  THE LEVEL STILL DOES NOT MOVE, and the finding count is not why. L3 means the thing FAILS\n  LIKE REALITY. Measured this pass, our p95/p5 spread runs 3.27 (2019) -> 18.42 (2024) where\n  NESO's published series runs 2.78 -> 5.06 -- the divergence WIDENS by year and reaches 3.6x.\n  That is the coal-and-interconnectors build named above, still not done. L3 needs that build\n  and then a SECOND Expert Hour. LAW A: the drawn plan said 2->3 and a plan is a diagnostic,\n  never a target.\n  THE BUILD IS NOW DONE, 2026-08-25, AND IT DID NOT REACH L3 EITHER. `sim/elexon_fuel_outturn.py`\n  ingests Elexon's published half-hourly generation-by-fuel-type outturn (FUELHH, key-free) and\n  supplies the two things the dispatch model structurally cannot know: cross-border flow, which\n  is set by FOREIGN prices and is therefore an observable, and coal AVAILABILITY, which is a\n  fleet fact. The line between them is load-bearing and tested: half-hourly coal outturn is\n  NOT handed over, because whether coal ran IS the merit-order question the reconstruction\n  exists to answer independently -- a model that reads the metered mix and applies published\n  factors is NESO's arithmetic with a different cache, and the coupled-triad gap would then\n  measure nothing while still producing a number. Import factors are NESO's OWN published ones\n  (methodology Table 1); the two cables that table predates get NO invented factor and their\n  share is MEASURED instead (84% of imported MWh priced over the series, 66% in 2024).\n  THE ZERO-THERMAL GAP IS CLOSED TOO, 2026-08-25 (third build of the day), AND L3 STILL DOES\n  NOT FOLLOW -- but the reason has CHANGED, which is the part to read. The stack is now floored\n  at the CCGT+OCGT fleet's DEMONSTRATED ANNUAL MINIMUM from the same FUELHH outturn (1,835 MW\n  in 2016 -> 303 MW in 2024), crossing the boundary as one scalar a year exactly as coal does.\n  Measured before/after IN ONE PROCESS against identical caches: p95/p5 overstatement 1.90x ->\n  1.36x, max/min 2.44x -> 1.04x, mean absolute error down in EVERY year. NOT A CLEAN WIN, and\n  both halves are published: the clean end now OVERSHOOTS in 2020 (0.314 vs 0.244) and 2021\n  (0.233 vs 0.195), so the \"clean end is optimistic\" sentence that reaches the page was wrong\n  in two years of six and now claims the RANGE instead. WHAT HOLDS L3 NOW is correlation, which\n  moved by less than 0.004 in every year and is still 0.726 in 2024: the floor fixed the LEVEL\n  of the clean end and left the TIMING untouched, so the shape knows how clean a quiet half\n  hour is and not which half hours were quiet. That is a different failure from this morning's\n  and a harder one. The second Expert Hour is also still untaken. LAW A.\n  MEASURED, AND NOT A CLEAN WIN: clean end 3.2x too clean -> 2.3x, p95/p5 2.88x -> 1.90x, but\n  2019 and 2021 got WORSE on spread and 2021 lost correlation (coal widens the dirty end in\n  the years it still had a fleet, with no offset). Named, not averaged; detail in §10-11.\n  THE MUST-RUN FLEET IS NOW MEASURED, 2026-08-26 (fifth pass), AND THIS IS THE FIRST\n  CORRECTION THAT MOVED THE AXIS HOLDING THE LEVEL -- and it still does not reach L3. The\n  block had been a FLAT 8,000 MW; Elexon publishes NUCLEAR and NPSHYD half-hourly in the same\n  FUELHH dataset coal and the cables come from, and that block actually runs 544-9,831 MW\n  (mean 6,013). Every megawatt of that was previously made up by the gas stack on a schedule\n  the model invented. WHY IT MAY CROSS when gas and coal may not, both TESTED: NESO's factor\n  for both is exactly ZERO so what crosses changes the RESIDUAL not the verdict, and neither\n  can go negative -- pumped storage carries a zero factor too and is refused on that alone.\n  Measured before/after IN ONE PROCESS on identical caches, the enabling refactor first proven\n  to change no number when defaulted (max abs diff 0.0 over 20,000 half hours): correlation\n  2024 0.726 -> 0.746, and CORRELATION AND MEAN ABSOLUTE ERROR IMPROVED IN ALL SIX YEARS --\n  where the thermal floor moved correlation by less than 0.004 in every year. Within-day\n  overstatement, the only axis a household can act on, 1.484x -> 1.450x mean, 1.440x -> 1.352x\n  in 2024. NOT A CLEAN WIN: p95/p5 overstatement ROSE 1.362x -> 1.378x (worse in four years of\n  six) while max/min FELL 1.044x -> 1.007x -- two statistics under one word, moving opposite\n  ways, so neither is quoted alone. R15: 10 mutations run; ONE CONTROL SURVIVED ITS OWN\n  MUTATION and was rebuilt (at the 5,600 MW fallback the correct and the mispriced arithmetic\n  are identical, so the fixture could not see the defect it named).\n  WHAT HOLDS L3 NOW is the same axis, smaller: 0.746 still points a customer at some of the\n  wrong half hours, and the second Expert Hour is still untaken. THE BIOMASS STEP WAS TAKEN\n  2026-08-26 AND ITS PREMISE WAS REFUTED, so it is no longer the next gap: the fleet's annual\n  envelope is measured and published (2024: 73-3,328 MW, mean 2,142 against the assumed\n  2,400) and the dispatch is built and R15-proven, but wiring it made the series worse on\n  four axes of five and it is OFF behind a tested flag. The residual explains only 2.6-33.5%\n  of biomass's variance -- a CfD plant runs on AVAILABILITY, so its low readings are outages.\n  THE OUTAGE MODEL IS RETIRED AS THE NEXT GAP, 2026-08-27, by measuring its CEILING before\n  building it: biomass pinned to its METERED half-hourly outturn -- an ORACLE, illegal to\n  publish, but a BOUND on every approximation to it. Perfect knowledge moves correlation the\n  WRONG way in four years of six (mean -0.0050; 2024 0.7456 -> 0.7255, undoing the must-run\n  pass's whole gain) because 70-86% of the fleet's variance is BETWEEN days and the axis\n  holding L3 is within-day. Both controls mutation-proven; honest ends both published.\n  THE WITHIN-DAY AXIS IS RETIRED AS A BUILD, 2026-08-27 (seventh pass), by measuring the\n  CEILING of the whole remaining programme instead of its next term. The BEST POSSIBLE\n  function of the model's own inputs -- which bounds every merit order, efficiency curve,\n  coal-availability and outage model at once -- beats the shipped model by at most +0.0295 in\n  sample in ANY year at ANY resolution, and in 2024, the year holding the level, it scores\n  BELOW it out of sample at every grid. Recalibrating the model's own output is capped harder\n  (+0.0037). A 21x grid refinement plateaus in-sample gain at +0.012 while held-out never\n  exceeds +0.002 -- which is what makes this a ceiling and not a coarse binning. L3 therefore\n  needs a NEW INPUT carrying within-day timing, not a better model of the inputs it has;\n  embedded generation is the hypothesis and is DISCOVER work, unmeasured. R15: 16 tests, 9\n  mutations RED then GREEN; one SURVIVED the first battery and the FIXTURE was the fault (a\n  baseline at correlation -1 made the bar meaningless). Record: §10-11. LAW A.\n  THE NINTH PASS FOUND THAT THE EIGHTH HAD NO VERDICT TO REPORT, 2026-08-28, and the\n  sentence above -- \"embedded generation is the hypothesis and is DISCOVER work,\n  unmeasured\" -- is still literally true. `tools/ep13_embedded_generation_bound.py` was\n  built to decide it and has produced exactly one output,\n  `docs/observability/ep13_embedded_generation_bound.json` of 06:30. That file is UNTRACKED\n  and is reproducible from no commit: it records `grid {u:16, v:4, w:3}` (192 cells) while\n  the tool committed at 49387e0ce carries `U_BINS, V_BINS, W_BINS = 12, 4, 3` (144 cells),\n  so it was written by a working-tree version 2h20m before the tool was first tracked.\n  THE INSTRUMENT'S OWN CONTROLS REFUSE IT, which is why no verdict may be quoted from it:\n  `instrument_can_see_within_day` is False in ALL SIX years -- `oracle_headroom_within_day`\n  runs -0.0006 (2022) to -0.0538 (2024), NEGATIVE, so perfect knowledge of embedded\n  generation scores BELOW the day-mean placebo out of sample -- and `cells_are_populations`\n  is False in four years of six on `occupancy_fallback_share` (0.1009-0.1260 against a\n  <0.10 bar). Control 5's own docstring names this state unreadable: a null result there\n  \"would be equally consistent with an uninformative input and with a blind instrument\".\n  The eighth pass bought an INSTRUMENT, not an ANSWER, and the hypothesis is untouched.\n  WHY IT HAS STAYED UNMEASURED, recorded because the cause is mechanical and not a\n  judgement: the measurement runs 85 minutes (measured: 23:38:13 to 01:03:10, rc=0), and every regeneration before this one was\n  launched from a bounded tick and killed by it. `ep13_regen_20260827.log` (15:18, pid\n  1063255) and `ep13_regen_20260827T233550.log` (23:35, pid 1590656) each wrote START and\n  no END, and BOTH show PGID==SESS==PID -- so both were correctly `setsid`-ed and\n  (those .log files are gitignored, so the pids and times quoted here are the durable\n  record of them, not the files)\n  detachment was not the fault. A job launched from a tick's tool call dies with that tool\n  call when it times out, and `setsid` does not save it; the harness-tracked background\n  route does, and it is what finally carried this one (`ep13_regen_20260827T233813.log`,\n  END rc=0).\n  THE HYPOTHESIS IS NOW MEASURED AND IT DID NOT SURVIVE, 2026-08-28, at the COMMITTED grid\n  (12,4,3). The occupancy defect that made the 06:30 file unreadable is GONE -- fallback\n  share 0.0513-0.0744 against the <0.10 bar, `cells_are_populations` Y in 6 years of 6 where\n  it was N in 4 -- so this run is readable where that one was not, and four of the five\n  controls pass in every year. EMBEDDED GENERATION DOES NOT CARRY THE WITHIN-DAY TIMING L3\n  NEEDS. The within-day gain is indistinguishable from nothing: mean -0.0086, range -0.0637\n  (2024) to +0.0136 (2022), negative in three years of six. THE CEILING IS THE FINDING, not\n  that gain: `oracle_headroom_within_day` -- an ORACLE holding the TRUE embedded series, the\n  bound on every model that could ever be built on this input -- is NEGATIVE IN ALL SIX\n  YEARS (-0.0040 in 2022 to -0.0912 in 2024), i.e. perfect knowledge of embedded generation\n  scores BELOW the day-mean placebo out of sample. AND IT IS NOT A BINNING ARTEFACT, which\n  is what the resolution sweep exists to answer: across 48, 144, 192, 400 and 600 cells --\n  12.5x -- the oracle headroom stays negative at EVERY resolution (-0.0262 to -0.0064) and\n  never approaches the 0.05 bar. This is the biomass result again one term over: perfect\n  knowledge moving the wrong way.\n  STATED HONESTLY, BECAUSE CONTROL 5 FORBIDS THE STRONGER CLAIM: with\n  `instrument_can_see_within_day` N in 6 of 6, a bare null here is by that control's own\n  docstring \"equally consistent with an uninformative input and with a blind instrument\",\n  so this is NOT written down as \"embedded generation is uninformative\". What IS established\n  is the ceiling: a NEGATIVE oracle bounds every dispatch model built on this input, so\n  building one cannot move the axis holding L3. One discriminator says the instrument is not\n  simply blind to a third coordinate -- `embedded_gain_over_cells` is POSITIVE in all six\n  years (+0.0093 to +0.0272), so the third coordinate DOES carry information; it is\n  specifically the WITHIN-DAY axis, measured against the day-mean placebo, where it fails.\n  Independence holds: `oracle_reaches_the_published_feed` is False.\n  EMBEDDED GENERATION IS THEREFORE RETIRED AS THE L3 CANDIDATE -- the FOURTH retired by\n  measuring its ceiling before building it, after the biomass outage model, the merit-order\n  programme and the within-day axis itself. L3 still needs a new input carrying within-day\n  timing, and this atom now knows one more thing that is not it. No level move. LAW A.\n  STILL L2 as of 2026-08-28, and the NINTH pass produced the atom's FIRST POSITIVE RESULT after\n  four consecutive negatives. Four candidates had been retired by measuring their ceiling before\n  building them -- the biomass outage model, the merit-order programme, post-hoc recalibration and\n  embedded generation -- and the comfortable reading was becoming \"the axis is measuring NESO's own\n  noise and no build can move it\". THAT READING IS NOW REFUTED. `tools/ep13_peer_bound.py` scores\n  NESO'S OWN PUBLISHED FORECAST against NESO'S OWN OUTTURN, on the same held-out even days through\n  the same `neso.compare_shapes`, and the publisher reproduces its own series at 0.9649-0.9790 in\n  every year where the shipped reconstruction reaches 0.7425-0.9075. IN 2024 -- the year that has\n  held this level for eight passes -- THE PEER CLEARS THE BASELINE BY 0.229. The within-day axis is\n  not noise, so the input ceiling of 2026-08-27 was a fact about the reconstruction's INPUTS\n  exactly as it said, and the diagnosis it wrote down (L3 needs a NEW INPUT carrying within-day\n  timing) is CONFIRMED rather than retired. It fits nothing and runs in seconds, where the ceiling\n  cost 85 minutes.\n  THE LADDER CUTS THE CLAIM DOWN, AND MAKES IT STRONGER. Carbon intensity is heavily autocorrelated,\n  so 0.97 means nothing until a copy of the recent past is priced beside it: the outturn lagged 1,\n  2, 4 and 48 half hours scores 0.993 / 0.978 / 0.931 / 0.60, and the peer interpolates to 1.99-2.40\n  half hours in every year. NESO's forecast is worth about a ONE-HOUR PERSISTENCE MODEL. The\n  information the reconstruction is missing is therefore not exotic -- a copy of the grid an hour\n  ago beats it by 0.24 in 2024.\n  WHAT THE BOUND IS NOT, because a high number invites over-reading: NOT an oracle (it holds no\n  truth and can be beaten) and NOT independent (NESO's `actual` is itself a model built from the\n  same factor table, embedded estimate and loss correction as its forecast, so common-mode cancels\n  and this OVERSTATES what an outside reconstruction can reach). The optimism runs in the SAFE\n  direction, which is why it was worth measuring: a LOW peer would have closed the programme\n  outright; a high one promises nothing about any build.\n  R15, EIGHT NAMED MUTATIONS AND ONE SURVIVED WITH THE CONTROL AT FAULT. `peer_beats_its_own_day_\n  mean` written as `peer > peer_day_mean` PASSED under its own defect, because the mutation makes\n  the two sides equal BY CONSTRUCTION and they differed by 1.1e-16 of floating point, which a strict\n  inequality reads as an advantage. A CONTROL COMPARING TWO QUANTITIES ITS OWN NAMED DEFECT MAKES\n  IDENTICAL IS FAIL-OPEN WITHOUT A MATERIALITY MARGIN. Fixed at MIN_WITHIN_DAY_ADVANTAGE = 0.01,\n  ten times below the measured 0.09-0.15 gap so the bar visibly does not carry the result. The\n  tautology guard is the one a reader should check first: a back-filled forecast field would make\n  this a series against itself and report ~1.0 by construction; measured, the two are bit-identical\n  on 4.1% of half hours and differ by a mean of 9.8 g.\n  A FINDING ABOUT THIS ATOM'S OWN EXIT AXIS, RECORDED AND DELIBERATELY NOT ACTED ON. A statistic a\n  lag-1 copy wins at 0.993 is a weak discriminator for a structural reconstruction, and this level\n  has been decided on it for eight passes. That observation arrives from the agent whose own score\n  on that axis is the thing being held, which is the shape R12 and R13 exist to refuse and the shape\n  of taking the robust statistic because it is the flattering one. Nothing follows from it here: the\n  exit axis is unchanged, level_target is unchanged, the level stays at 2, and the recommendation --\n  score a reconstruction on a statistic autocorrelation does not dominate, ALONGSIDE correlation and\n  not instead of it -- is the director's. Exit-test integrity is a WALL.\n  NEXT, named as a hypothesis and NOT built: NESO forecasts PER FUEL where this model reduces\n  everything to a residual. Elexon FUELHH half-hourly per-fuel outturn is already in `sim/cache` and\n  already read for coal, biomass and the must-run block, so an oracle rung on it would bound that\n  input. It would be NOT PUBLISHABLE, same class as the input ceiling, because it is NESO's\n  arithmetic -- its value is as a bound. Record: frame doc section 13. No level move. LAW A.\n  STILL L2 as of 2026-08-30, and the TENTH pass produced the atom's FIRST NAMED BUILD TARGET after\n  four retirements and one positive. THE WITHIN-DAY TIMING IS IN CCGT -- the one fuel the shipped\n  reconstruction never observes, because it infers gas from a residual. `tools/ep13_per_fuel_oracle\n  _bound.py` holds the TRUE half-hourly FUELHH mix through NESO's own factor table and reaches\n  0.9352 in 2024 against the shipped 0.7425 (+0.193), closing 84% of the distance to the peer\n  bound's 0.9711; every year 0.9352-0.9823. THE ABLATION LADDER IS THE FINDING, not that number:\n  flattening one fuel's within-day profile to its own day mean, gas costs 0.052-0.095 in all six\n  years where coal costs 0.001-0.014 and biomass 0.0003. AND IT EXPLAINS THE DECAY eight passes\n  read as the model getting worse: WIND's ablation cost collapses -0.031 -> ~0 across the window\n  while CCGT's grows to its largest, so the information MIGRATED into the fuel the model cannot\n  see. The reconstruction did not decay; the grid moved the answer out of its reach.\n  THIS IS NOT A CEILING AND EVERY PREVIOUS ORACLE HERE WAS. It is HANDICAPPED -- no embedded\n  generation, no interconnector term, no OIL or OTHER -- so it bounds from BELOW: an attainment\n  FLOOR, not a bound on the input. A negative from it would have retired nothing, which the\n  preregistration filed before the run got wrong and which is corrected beside that claim rather\n  than by revising it. The inversion makes the POSITIVE stronger: a handicapped model reaching\n  0.9352 proves the input carries the information.\n  FAIL-CLOSED ON AN ABSENT FUEL, the defect the first draft had. The four FUELHH caches do not\n  cover the same half hours (BIOMASS begins later than COAL), and summing an absent CCGT row as\n  zero gas deletes the largest carbon term on the system and publishes a clean grid. 28,813 half\n  hours refused, 99.6% in 2016-17, which is why the table starts at 2019.\n  R15: 17 tests. The load-bearing one is INVERTED from the previous four bounds -- they reported\n  negatives so their danger was an instrument that can only say \"no headroom\"; this reports a\n  positive so its danger is one that says \"big headroom\" whatever it is handed. THE COVERAGE\n  CONTROL IS THE ONE TO READ: 2022's generation/demand is 1.063 because GB was a net EXPORTER,\n  and the bar the preregistration predicted (cap at 1.00) would have gone RED BECAUSE THE WORLD\n  GOT MORE HONEST. Keyed to the property instead, 0.80-1.20, with a test pinning 1.063 open.\n  NOT PUBLISHABLE -- NESO's factor table on metered truth; `oracle_reaches_the_published_feed` is\n  False by AST walk. L3's build is a PUBLISHABLE PROXY FOR WITHIN-DAY CCGT DISPATCH. Record:\n  frame doc section 14. No level move. LAW A.\n"
