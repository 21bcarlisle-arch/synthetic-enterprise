atom_id: D40_the_population_is_the_rendered_elements
map_notes:
  gain: '''No element carries this class'' was being read as ''the door does not render this figure'', so a whole class of elements was invisible; and `basis`, a declared and searched region, is INERT across both published books, which the guard one level up cannot see because it tests for a region that came back EMPTY and a constant is not empty. `_DoorRowWalker` / `_door_row_surfaces` key the population by path with each element carrying the text it owns, so a wrapper is inert unless it prints something itself. NOT derived from the door -- that would make the subject its own population and every class the door emits true by construction, which is the fail-open direction of the same mistake, and is D40''s open question answered negatively. (Hour #27.)'
