map_notes:
  origin_note: 'Director, 2026-09-05: ''The consistency gate failed at 08:43Z, dashboard against exec-summary on a headline number. Under weekly publishing that sits in a file rather than on a page, so fix it before the next publish rather than now.'' TWO SURFACES DISAGREEING ABOUT ONE FIGURE is the class `_check_population_consistency` exists for -- its own docstring names it: ''two different populations rendered on one page, both called accounts/households, silently diverging''. THE DEADLINE IS THE POINT: weekly cadence converted this from a live wrong page into a wrong FILE, which buys days and removes urgency without removing the defect. It must be discharged BEFORE the next weekly publish or the cadence has done nothing but hide it. Reproduce the 08:43Z failure first rather than reasoning from the gate''s name -- this seat has twice this week published a cause derived from a control''s title instead of its output.'
