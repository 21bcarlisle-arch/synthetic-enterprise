atom_id: H46_the_consistency_gate_disagreement_before_the_next_publish
map_notes:
  gain: 'Director, 2026-09-05: ''The consistency gate failed at 08:43Z, dashboard against exec-summary on a headline number. Under weekly publishing that sits in a file rather than on a page, so fix it before the next publish rather than now.'' TWO SURFACES DISAGREEING ABOUT ONE FIGURE is the class `_check_population_consistency` exists for -- its own docstring names it: ''two different populations rendered on one page, both called accounts/households, silently diverging''. THE DEADLINE IS THE POINT: weekly cadence converted this from a live wrong page into a wrong FILE, which buys days and removes urgency without removing the defect. It must be discharged BEFORE the next weekly publish or the cadence has done nothing but hide it. Reproduce the 08:43Z failure first rather than reasoning from the gate''s name -- this seat has twice this week published a cause derived from a control''s title instead of its output. HELD AT L0, 2026-11-13: 03e45f29a built the alarm half (the 09-05 red was the population check, opex 69 != resi 90, and the alarm now names the check that fired), and the population gate has not fired since. L2 was refused by the OPS11 gate, rightly: SITE1''s 2026-11-11 Expert Hour BLOCKER-2 (book size 750 front / 752 /explore/ across four sources) and m12 (counts drift between doors) are THIS atom''s class, live on the doors. _check_population_consistency compares the front page with itself, so it cannot see a count that differs between doors. The next build is a cross-door count leg, after the definition of book size is settled under SITE1.'
