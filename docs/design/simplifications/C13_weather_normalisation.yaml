- '2026-07-27 HARDEN (drawn tick, Rule-0 dial-yield: no below-target work anywhere -- HARDEN drawn on this at-target atom; level_current HELD at 3, HARDEN is a verification pass, no source/level change). R1 re-verify: all 24 prior exit tests green. RED-TEAM = sibling-audit of a same-day-hardened class (the sibling W1_6 background/weather_price_triad.py was hardened 2026-07-27 for a FAIL-SILENT small-sample skip on its designated score cell; audited THIS half for the same class). FOUND + FIXED (R15 killer pattern #3, FAIL-SILENT): background/weather_demand_triad.py::measure() dropped ANY cell below 10 samples via a silent continue -- INCLUDING cold_windy_tail, the wind-blindness DEMONSTRATION cell this whole coupled triad exists to measure. Latent not live (n_tail=122 today), but a future milder-climatology / stricter-tail / data-window change dropping it below 10 would make measure() report a clean worst-cell score with the demonstration silently gone and build_gap_result''s tail_bias_mw silently None -- a measurement that passes precisely when the cell it exists to measure is unavailable. FIX: the demonstration cell is made FAIL-LOUD (DemonstrationCellUnavailableError) below _MIN_CELL_N; the incidental regime cells (cold/warm/shoulder/winter/summer) keep the small-sample skip. R15 mutation-proven BOTH ways: with a tiny-tail defect injected the guardless logic silently reports summer as worst with cold_windy_tail absent and tail_bias_mw None, while the guarded measure() RAISES on the same defect and stays silent on the real record (n_tail=122) -- teeth, not a tautology. 2 new controls (test_demonstration_cell_below_floor_fails_loud fires on the defect; test_demonstration_cell_present_on_the_real_record proves it does NOT fire on the real record); suite 24 -> 26 green, epistemic verifier PASS (527 files).'
