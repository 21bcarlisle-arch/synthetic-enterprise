simplifications:
- '2026-07-13 REGISTERED (WEATHER_PHYSICS_HIERARCHY.md, director P1, QUEUE -- DISCOVER/FRAME workable now, BUILD gated to Epoch 3 with W1_2_generate_futures). COUPLED-TRIAD company-side twin of the weather physics (director: ''register the company-side twin and measure the gap''). WALL: the company CAN see published national+regional forecasts/outturns, wholesale prices, its own meter reads; it CANNOT see each property''s true thermal characteristics, how its book actually responds, or the counterfactual. THEREFORE the gap: it must infer book weather-sensitivity (weather-normalisation) from CONFOUNDED meter data -- genuinely hard, genuinely done badly in industry, allowed to be wrong. GAP = predicted vs actual demand under a weather outturn, normalised to a no-skill baseline (per A6). Creates the REAL trade-off (make both extremes bite): GB has NO regional forward market, so hedge-to-national leaves a regionally-skewed book exposed when its region deviates, while protecting regionally means basis risk + illiquidity + cost -- where the company sits on that frontier is strategy and must be visible (couples to B_commercial hedging). NOTE: extend background/coupled_triad.py::_AUTHORITATIVE_COUPLING with W1_5<->C13 when this twin opens for BUILD. loop_stage idle: FRAME design authored this session (docs/design/WEATHER_PHYSICS_HIERARCHY_DESIGN.md); BUILD opens in Epoch 3. Anchoring rule (anti-marking-own-homework): GENERATOR anchors (real historical weather/demand) and VALIDATOR anchors (independent published sub-national consumption stats / regional degree-days / published system demand) MUST be different sources; the company never validates against SIM ground truth.'
- '2026-07-16 DISCOVER pass (docs/design/C13_WEATHER_NORMALISATION_DISCOVER.md, doc-only, no BUILD): repo-audited for overlap -- no existing company-side weather-normalisation code found; sim/weather_hdd.py is SIM-side ground truth (reads per-customer weather CSVs directly) and must NOT be reused company-side. Confirmed via company/interfaces/point_in_time_view.py''s own docstring that weather/generation/demand crossing the wall is a known, already-logged ''later pass'' gap, not newly discovered. Grounded the company-side model in real UK methods: HDD/CDD degree-day regression, Composite Weather Variable (CWV, gas NDM allocation practice), NESO seasonal-normal comparison, AQ weather correction -- all named as real methods with exact current parameters flagged uncertain, left for BUILD to confirm against a real published source. Extended FRAME''s gap formula (WEATHER_PHYSICS_HIERARCHY_DESIGN.md Sec6) with concrete seam mechanics: SimInterface has NO weather-observable method today (a confirmed BUILD-time gap), and background/coupled_triad.py::_AUTHORITATIVE_COUPLING still lacks W1_5<->C13 (matches the map''s own note, not yet fixed). Named open questions: no-skill baseline choice (flat national HDD vs TDCV bands), electric-heating base temperature unfitted, CWV wind-chill term deferral, refit-cadence policy. level_current NOT changed (DISCOVER only).'
- '2026-07-16 FRAME (H17 Lane-3, doc-only, no BUILD/no map edit): authored the canonical per-atom FRAME (docs/design/frame/C13_weather_normalisation_FRAME.md), consolidating the previously-scattered FRAME-depth thinking (WEATHER_PHYSICS_HIERARCHY_DESIGN.md §6 wall/gap/hedging-frontier + C13_WEATHER_NORMALISATION_DISCOVER.md method/seam-gap) into C13''s own terminus with its single BUILD-unblock gate stated. Consequence: the intrinsic frame-saturation guard now reads C13 as saturated (computed from disk, MAKE_IT_STICK), so the idle draw stops re-offering it and yields to genuinely-un-FRAMEd work. Level HELD at 0 (proposal atom; FRAME complete != built; BUILD-gated on W1_5 L-usable + A6 + Epoch-3 BUILD-open, coupled with W1_5, EPOCH_GATING Rule 1).'
- '2026-07-21 BUILD L1: company weather-normalisation is a temperature-only HDD/CDD degree-day OLS on observed (metered demand, published temperature). WIND-CHILL (CWV) term and REGIONAL-DISPERSION discrimination are named L1->L2 refinements (R10), not defects -- they are the measured belief-vs-truth gap vs the W1_5 truth.'
- '2026-07-21 BUILD L1: gap truth = the real national Elexon INDO demand outturn (the W1_5-consistent aggregate; premise demand reconciles TO national). Per-book demand series is an L1->L2 refinement pending statistical power (DISCOVER s4: real weather CSVs back only 4 locations).'
- '2026-07-21 BUILD L1: g0 baseline = climatological-mean no-skill (matches W1_6 prediction_gap convention); FRAME open-Q1''s flat-national-degree-day alternative registered as an L2 refinement. Coupled-triad binding rule: C13 cannot reach L3 alone, and W1_5 cannot reach L3 until this gap is measured (now measured).'
- '2026-07-21 BUILD L2 PROPOSED (level_current HELD at 0 per R16 -- levels are proposals, this fork does not self-promote): both named L1->L2 refinements built. (1) WIND-CHILL (CWV) TERM -- fit_weather_normalisation_belief gains an optional wind_speed_ms 4th OLS regressor (windchill_DD = HDD * excess-wind-above-4m-s-calm-reference, R10 conventional threshold, coefficient FITTED not fabricated); ADDITIVE + regression-safe by construction (wind_speed_ms=None reproduces the L1 3-parameter fit byte-for-byte, proven by test_wind_none_reproduces_l1_exactly). predict() FAIL-LOUD (MissingWindObservableError) if a wind-fitted belief is asked to predict without wind (no silent FAIL-OPEN degrade). (2) REGIONAL-DISPERSION (book-weighted temperature) -- book_weighted_temperature() combines PUBLISHED per-region weather (genuinely public) with the company''s OWN book regional weights (genuinely company-knowable, its own customer register) into a book-weighted temperature series that flows through the SAME fit/predict pipeline; an INPUT transform, not a new model form. MEASURED HONESTLY (R12) on the real Elexon record via background/weather_demand_triad.py, which now fits L1 and L2 side by side every run: population gap barely moves (0.6618->0.6606, L2 marginally better); the WORST cell (summer, cooling season) is UNCHANGED by the CWV term (gap 1.0395->1.0393, as expected -- CWV addresses heating-season wind chill, unrelated to the cooling worst cell); on the cold_windy_tail cell the CWV term actually WORSENS the bias magnitude (bias -211MW L1 -> -449MW L2, gap 0.9246->0.9387) -- the real-record fitted b_windchill came out NEGATIVE (-23.1), the opposite sign of the synthetic-truth unit-test assumption, an honest finding (GB cold spells are typically anticyclonic/still per weather_demand_chain.py''s own docstring, so real cold-and-windy days are a different, less-extreme regime than the synthetic wind-chill truth assumed -- not tuned toward any target, reported as measured). REGIONAL-DISPERSION REMAINDER (named, not hidden): book_weighted_temperature is built and unit-proven against SYNTHETIC truth (test_regional_dispersion_belief_beats_national_only_on_a_skewed_book) but NOT wired into the real-record coupled-triad measurement -- no per-book regional demand truth exists inside this atom''s file_scope to measure it against (needs W1_4''s regional field to cross via a typed sim_interface.py observable, out-of-scope BUILD per the FRAME''s own pre-BUILD action items). Ledger updated (docs/observability/coupled_gap_ledger.json#W1_5_premise_demand_shape) with L1 vs L2 comparison in components. 24 tests green (15 company/test_weather_normalisation_belief.py + 9 test_weather_demand_triad.py, up from 4+6), epistemic verifier PASS (487 files scanned). file_scope widened (sole-map-writer) to the built code+test paths; level_current NOT moved.'
