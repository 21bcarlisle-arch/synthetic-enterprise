atom_id: W2_34_the_company_has_one_piece_of_advice_that_costs_the_customer_nothing
simplifications:
- 'TARGET LOWERED 3->2 (2026-10-06, delivery item the-triad-gate-s-three-excluded-atoms-get-their-company-twins). This row is a COMPANY capability (company/pricing/fabric_intervention.py) filed under a W2 id, so the coupled-triad gate reads it as a world mechanism and excluded it from every BUILD draw for want of a company twin. No company capability is tested against it, because it is the capability. Its own belief-vs-truth grade already exists: background/fabric_gap_ledger runs fabric_intervention.decide in both arms against W1_11''s fabric truth (twin C14). C34 (next best action) was the suggested twin and is a name match only: company/crm/next_best_action.py never calls fabric_intervention. Restoring L3 means re-filing this row under a company id, not registering a twin.'
map_notes:
  map_comment_note: '# MINTED 2026-09-08 from SEAT_FINDING_EVERY_PIECE_OF_ADVICE_THE_COMPANY_CAN_GIVE_COSTS_THE_CUSTOMER_MONEY

    # (LATENT, atom `unminted`). The finding''s own measurement: OFFER_BOOK held insulate £6,000,

    # heat_pump £12,000, solar_pv £7,000, time_shift £300 and nothing else, against a mission that

    # names ADVICE as one of three mechanisms. Every route the company had to a customer''s bill ran

    # through the customer''s capital.

    #

    # L2 2026-09-21: THE BAND ARRIVES AND THE MEASURE IS LIVE. `EpcCertificate.efficiency_band`

    # carries the register''s A-G band, `couple_fabric` passes the drawn one where a certificate

    # exists, and on a 40-premise draw 13 of 39 households are offered a turn-down by the production

    # rule. L1 sat on REACHABILITY, not the controls: 9 green legs while `epc_band` defaulted to

    # `None` and every real call hit the fail-closed branch.

    #

    # NO MONEY FIGURE MOVED, MEASURED NOT ASSUMED. `turn_down` only ever wins the ranking where every

    # capital measure destroys value; elsewhere it is surfaced in `zero_capital_measure`, which the

    # gap ledger does not read. Both ledger arms get the SAME band on purpose -- a one-sided floor

    # would book a refusal that protects cold households as money the company''s ignorance cost them.

    #

    # THE DESIGN THE FINDING ASKED FOR WAS SUPERSEDED, DELIBERATELY. The finding''s step 2 said "with

    # a stated comfort cost". Comfort is FLOORED here instead, on the director''s refusal of the

    # priced design (2026-09-08): a comfort cost makes warmth a willingness-to-pay question, and the

    # households that would accept the trade are the ones who can least afford to refuse it. A floor

    # cannot be bought off by a large enough saving; a price can.

    #

    # CONTROL: tests/company/test_turn_down_respects_the_health_floor.py, and specifically

    # `test_NO_SAVING_HOWEVER_LARGE_BUYS_A_TURN_DOWN_BELOW_THE_FLOOR` -- it drives the unit rate to

    # 10,000 p/kWh and asserts an EPC F household is STILL not offered the measure. It is the leg

    # that reds if a well-meaning refactor turns the floor back into a term, which is the only way

    # this defect comes back.

    #

    # EXIT to L3: FLOW TEMPERATURE in the book. It is the measure that actually answers the finding

    # -- zero capital, and it does not make the home one degree colder, so it never meets this floor

    # at all. STILL BLOCKED ON A SOURCE, and the only figure in this repo is `docs/market_research/

    # gas_demand_what_drives_it...md`''s 6-10%, which is the DIRECTOR''S OWN REMARK rather than a

    # citation. It is also a BOILER EFFICIENCY loss, not a demand reduction -- a different quantity

    # that shares a number with `TURN_DOWN_DEMAND_REDUCTION`, and reading them as one is how this

    # gets built wrong. The flow-temp measure also needs its own gate, not this floor: it applies

    # only to a condensing wet system, so a heat pump or a non-condensing boiler must be refused.'
