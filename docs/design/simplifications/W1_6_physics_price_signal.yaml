simplifications:
- '2026-07-13 REGISTERED (WEATHER_PHYSICS_HIERARCHY.md, director P1, QUEUE -- DISCOVER/FRAME workable now, BUILD gated to Epoch 3 with W1_2_generate_futures). L4, closes the physics chain. Renewable output (wind/solar) is itself a function of the L1 weather, so a cold-still day = high heating demand AND low wind output AND tight margin AND price spike, all from ONE coherent weather draw. Price is an OUTPUT; drawing it independently breaks the chain. Ties into the existing merit-order/SSP machinery. This is why a naive sim under-prices winter risk. loop_stage idle: FRAME design authored this session (docs/design/WEATHER_PHYSICS_HIERARCHY_DESIGN.md); BUILD opens in Epoch 3. Anchoring rule (anti-marking-own-homework): GENERATOR anchors (real historical weather/demand) and VALIDATOR anchors (independent published sub-national consumption stats / regional degree-days / published system demand) MUST be different sources; the company never validates against SIM ground truth.'
- '2026-07-16 DISCOVER pass (docs/design/W1_6_PHYSICS_PRICE_SIGNAL_DISCOVER.md, doc-only, no BUILD code). Repo-audited for overlap: sim/price_engine.py (Phase 3b merit-order engine -- gas_floor_price/system_margin_price/wind_power_output_fraction) already exists and is the exact engine the WEATHER_PHYSICS_HIERARCHY_DESIGN.md FRAME pass names for reuse at L4, but docs/calibration/price-engine.md records that its raw demand/renewable ratio form ALREADY FAILED calibration against real 2019/2022 SSP (~10x overestimate, correlation 0.20-0.24 at every gamma in the spec''d [1.5,2.5] range) and was formally superseded 2026-06-11 by a statistical OLS regression as the active Phase 3b/Regime 2 deliverable -- a fact the FRAME doc''s own reuse table/open-questions section does not carry forward. Confirmed the FRAME doc''s residual-demand-over-dispatchable-margin form (RD = D_national - G_wind - G_solar) is DIFFERENT from and has NOT itself been calibrated -- only the older raw-ratio form was tested and failed; this is the calibration gate''s real next step, not yet done. Found a genuine unflagged gap via grep audit (zero hits across sim/, simulation/, docs/design/, docs/market_research/): no carbon price / UK ETS / emissions-factor term exists anywhere -- gas_floor_price() computes SRMC from gas price alone, omitting the real carbon-cost component of GB gas-plant marginal cost. Confirmed W1_3''s own prior DISCOVER finding (sim/weather_engine.py::fit_national_macro_model''s regime trigger is wind-residual-only, not joint cold-and-still) is inherited as a hard blocker here: W1_6''s cold-and-still price-spike demonstration has no mechanistic guarantee until that lands, matching the existing depends_on. Identified THREE independently-built, uncoordinated price-adjustment mechanisms coexisting in the repo (sim/price_engine.py physics, sim/scenario/bimodal_generator.py distribution-fitted Dunkelflaute/negative-price/crisis-spike model, sim/weather_price_sensitivity.py backward-looking HDD-lookback multiplier) with no reconciliation argued anywhere -- flagged as an open BUILD-time design question (retire/merge/keep-as-CURRICULUM), not resolved here. Confirmed via direct read of company/interfaces/sim_interface.py::get_forward_price that the company-facing price observable reads only real historical Elexon SSP/NBP through 2025-06-07 with no branch for synthetic-future dates -- the concrete seam gap this atom (jointly with W1_2) must eventually close. Grounded the merit-order structure in real GB price formation (marginal-cost dispatch/N2EX/EPEX/BM clearing, gas-plant SRMC''s fuel+carbon two-term real cost, renewables'' near-zero-SRMC residual-demand role, interconnector/BM/CfD/Capacity-Market items correctly out of this atom''s scope) -- all structural claims flagged [UNVERIFIED, no network this session] where a specific figure would be needed, no numbers fabricated. level_current NOT changed (DISCOVER only).'
- '2026-07-16 H17 Lane-3 FRAME (doc-only, BUILD epoch-gated per EPOCH_GATING Rule 1): decision-layer FRAME that RESOLVES the six open questions the DISCOVER pass explicitly deferred (ratio form -> residual-demand/dispatchable-margin recalibration-gated not gamma-retuned R12; carbon term -> add at BUILD from a real source or name it C-S5/R10; negative pricing -> out-of-L3 named simplification not faked; three-mechanism split -> R13 baseline(price_engine)/curriculum(bimodal_generator, director-owned one-way door)/company-heuristic; W1_3 joint-regime -> hard depends_on, xfail(strict) not skip; weather_price_sensitivity -> BUILD reads in full first). Level HELD at 0: the map rubric reserves L1 for ''been BUILT in any form'', a FRAME is not a build. Inherited load-bearing finding carried forward honestly: sim/price_engine.py already FAILED its own Phase-3b calibration gate (~10x SSP overestimate at every spec''d gamma) and was superseded 2026-06-11 -- BUILD''s first honest step is a calibration run (may fail again = the finding, not a retune cue). Wall preserved: price formation is SIM-side, company observes only published SSP. Evidence appended only; no maturity_map.yaml line edited by this fork.'
- '2026-07-20 BUILD (coupled-triad built, L3 PROPOSED, level_current HELD at 1). Closed the physics chain the FRAME specified: sim/weather_price_chain.py composes weather -> demand (degree-day OLS on real INDO/Open-Meteo, R2 0.55) + renewable (wind via the price_engine power curve mean-matched to real AGWS wind, corr 0.61; solar seasonal x cloud proxy, corr 0.76) -> residual demand -> the EXISTING recalibrated price_engine merit-order form -> DERIVED price. price_engine unchanged (R13 baseline, R12 anti-goal-seek: chain-vs-real-SSP MAE reported as a DIAGNOSTIC not a target; chain mean 81 vs real 78). SHOW THE TAIL delivered: the cold-and-still winter corner produces a mechanistic price spike 157 vs 72 GBP/MWh (2.2x) from ONE weather draw, via a tight residual demand 35466 vs 21113 MW -- R15-proven to come from the weather->residual couplings (cutting demand-temp AND wind collapses the spike ratio 2.18->1.23; the remainder is gas seasonality, not the physics tail). COMPANY twin (company/pricing/weather_price_belief.py, wall-clean, observables-only linear price~gas+temp+wind, epistemic_verifier PASS): it nails the comfortable middle (population gap 0.246) but under-predicts the convex cold-still spike by a signed -17.4 GBP/MWh on the tail -- the tail that kills suppliers, structurally invisible to a linear belief through the wall. HARNESS (background/weather_price_triad.py, background.gap_metric.prediction_gap) measures the belief-vs-truth GAP per cell; SCORE = the WORST cell not the average (fidelity steer): cold_still_tail gap 0.397. Written to coupled_gap_ledger.json (twin C13_weather_normalisation, the nearest registered company-weather twin -- this is the PRICE-belief facet; a dedicated company price-belief C-atom is a proposed follow-on, and _AUTHORITATIVE_COUPLING wiring is left for the director when that atom opens). R10 SIMPLIFICATIONS: solar is a seasonal+cloud proxy not a fitted PV model; demand is temperature-only (no working-day term); wind fleet is a single mean-matched scalar (the ~doubling 2016-25 is W1_7); carbon term at engine default 0.0; smooth price (no discrete stack). L3 REMAINDER (director-gated): director Expert-Hour + the L3 ratification itself (levels are proposals; blocked_on director_level_up, build draw stops). Not self-promoted.'
