atom_id: D32_the_latency_headline_cannot_attribute_its_two_knobs
simplifications:
- "2026-08-19 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD\ncode written and nothing in `file_scope` touched: this atom is `loop_stage: idle`, and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 1 makes DISCOVER/FRAME available on a parked atom\nwhile BUILD is not. Output is this record.\n\nFIRST, WHAT IS ALREADY LANDED -- READ OFF HEAD, NOT OFF THE ATOM'S PROSE. The atom `name`\nwas written as a spin-out of H27 Expert Hour #14 and describes both a caveat repair and a\nreshape. Checked at HEAD, the caveat half is SHIPPED, under this atom's own id:\n`predict_published_latency_step_days` (line 2828), `latency_terms_resolution_caveat`\n(4116), the corrected `organ_query_grid_caveat` (2857) and `PUBLISHED_FIGURE_CAVEAT_\nCONTRACT` (4179) all exist and are stamped into `detection_latency_gap`'s components\n(700-870). So the parked atom is NOT unstarted, and designing it as if it were would\nrebuild shipped work. What remains is EXACTLY the part Hour #14 declined to do on the\npromoter's behalf: the RESHAPE -- a latency measure that can tell a supplier holding the\nwrong payment terms from one whose detector fires late.\n\nTHE CLAIM, REPRODUCED ON THE SHIPPED SCORER AT A DRAW SIZE IT WAS NOT AUTHORED ON.\n`observed-with-evidence`, n_customers=60 (the `name`'s figures are n=300), seeds 7/11/23,\n`score_triad` called twice per drift -- once with `organ_terms_drift_days=k`, once with\n`organ_reconciliation_drift_days=k`. Published `mean_lag_days`:\n\n    k    seed 7 TERMS  seed 7 RECON | seed 11 T/R   | seed 23 T/R    bit-identical\n   -3      1.666667      1.666667   | 1.25   1.25   | 1.625  1.625        yes\n   -1      2.619048      2.619048   | 1.85   1.85   | 2.375  2.375        yes\n    0      3.095238      3.095238   | 2.15   2.15   | 2.75   2.75         yes\n    1      3.571429      3.571429   | 2.45   2.45   | 3.125  3.125        yes\n    3      4.523810      4.523810   | 3.05   3.05   | 3.875  3.875        yes\n    5      5.476190      5.476190   | 3.65   3.65   | 4.625  4.625        yes\n\nBit-identical at every drift on every seed, at a second draw size. Note what this does and\ndoes not say: the headline RESOLVES either knob perfectly well (the step, 0.3-0.48 days\nper drift day, is ~60-95x the reader's own epsilon of 0.005 from `published_reading_\nepsilon('detection_latency')`). It cannot ATTRIBUTE. That is the atom, stated precisely.\n\nAND IT IS NOT A PROPERTY OF THE BOOK -- IT IS ONE LINE.\n\n    # tools/couple_w2_11_d5.py:10953, inside score_triad's organ sweep\n    recon_lag_days[(cid, p)] = (cand - due_by_period[p]).days\n\n`due_by_period` is the WORLD's `PeriodRecord.due_date`. Both counterfactual companies move\n`cand` -- the terms knob by shifting the organ's own due date, the recon knob by shifting\nits grace -- and neither moves the subtrahend. Two different company errors are therefore\nadded to one reading by construction, not by coincidence of this population.\n\nTHE SEPARATING READING EXISTS AND IS ONE FIELD AWAY, ON AN OBJECT THIS LOOP ALREADY HOLDS.\n`ExpectedCollectionMiss.due_date` (company/billing/payment_observation_consumer.py:296) is\nthe company's BELIEVED due date: `age_open_items` builds it as `oi.issue_date +\npayment_terms_days` off the company's OWN ledger (company/billing/arrears_engine.py:138).\nReading it is ASKING THE ORGAN, which is the independence discipline\n`detection_latency_gap`'s docstring already demands and which a harness re-derivation of\n`due + terms` would break. Prototyped this tick against the real consumer (no scenario\nbuilt, no register touched), same book, same seeds -- mean recon-arm first-knowledge lag\nmeasured BOTH ways:\n\n    drift k        -3    -1     0     1     3     5\n    TERMS knob:  from TRUE due   2.0   4.0   5.0   6.0   8.0  10.0   <- moves day for day\n                 from BELIEVED   5.0   5.0   5.0   5.0   5.0   5.0   <- INVARIANT\n    RECON knob:  from TRUE due   2.0   4.0   5.0   6.0   8.0  10.0\n                 from BELIEVED   2.0   4.0   5.0   6.0   8.0  10.0   <- moves day for day\n\nIdentical on seeds 7/11/23. The pair is rank 2, and two estimators fall out that were\nmeasured EXACT rather than fitted:\n\n    terms_error_days   = mean(lag from TRUE due) - mean(lag from BELIEVED due)\n                       -> exactly k under the terms knob, exactly 0 under the recon knob\n    detector_lateness  = mean(lag from BELIEVED due) - reconciliation_grace_days\n                       -> exactly k under the recon knob, exactly 0 under the terms knob\n\nThat is the reshape, specified, and its ingredient is already in the room.\n\nFOUR TRAPS ANY EXIT TEST FOR IT MUST SURVIVE. Each is measured, not anticipated.\n\n (1) THE FLOOR INVERTS THE PAIR. Below k = -19 the issue-date floor binds -- and -19 is\n     not a new constant, it is `ORGAN_QUERY_GRID['recon_lag_days']['saturates_below']`,\n     already declared as `-(PAYMENT_TERMS_DAYS + DEFAULT_RECONCILIATION_GRACE_DAYS)`.\n     Measured, seed 7, terms knob:\n\n         k          -10   -14   -17   -18   -19   -20   -22   -25   -30\n         TRUE due   -5.0  -9.0 -12.0 -13.0 -14.0 -14.0 -14.0 -14.0 -14.0   saturates\n         BELIEVED    5.0   5.0   5.0   5.0   5.0   6.0   8.0  11.0  16.0   starts MOVING\n         n at floor   0/21  0/21  0/21  0/21 21/21 21/21 21/21 21/21 21/21\n\n     Outside the declared band the two readings SWAP ROLES: the invariant one becomes the\n     contaminated one and the estimators above invert their meaning. The reshape inherits\n     the saturation caveat the existing reading already carries, and an exit test that\n     probes only inside -19 cannot see the failure it is for.\n\n (2) WRONG SUBJECT, AGAIN -- THE FIX'S OWN VERSION OF THE DEFECT IT CLOSES. A believed due\n     date exists only for the RECON arm; the DD arm's first-knowledge date is the bank\n     feed's `observed_at` and has no believed due, so it is invariant under BOTH knobs. The\n     published headline is a mean of `min(recon, dd)`, so its whole response to either knob\n     is the recon arm's, diluted by the DD-earliest share. Measured, and it reproduces\n     `predict_published_latency_step_days` from outside:\n\n         seed 7:  (21-11)/21 = 0.476190   seed 11: (20-14)/20 = 0.300\n         seed 23: (24-15)/24 = 0.375\n\n     against 0.3235/0.3646/0.2655 recorded at n=300 in this atom's `name`. The step is a\n     property of the BOOK AND OF THE DRAW SIZE. So an attribution published in days must\n     state which population its days belong to; stamping a recon-arm estimator onto the\n     published headline would re-commit, on the fix, exactly the defect this atom was\n     spun out to record. (The shipped predictor already reads `n_latency_population` and\n     `n_earliest_via_dd_channel` off the book, so it tracks this correctly -- it is the\n     RESHAPE's new numbers that would need the same treatment.)\n\n (3) R15 INDEPENDENCE IS REAL HERE BUT CURRENTLY UNEXERCISED. Reading `m.due_date` is\n     asking the organ; computing `world_due + terms_drift` is a harness copy of the\n     organ's rule. Measured: at every k the two produce the SAME number, because the\n     harness's `issue = due - PAYMENT_TERMS_DAYS` (line 591) and the ledger's `due =\n     issue + payment_terms_days` are the same arithmetic on the same date -- at k=0 the\n     believed and true readings coincide exactly on all three seeds. So NO VALUE TEST CAN\n     TELL THE HONEST IMPLEMENTATION FROM THE TAUTOLOGY, and a control that only compares\n     numbers is the FAIL-OPEN pattern. It must be structural -- the AST-assertion shape\n     this module already uses for the population-side predictors -- or it must perturb the\n     company's ledger issue date away from the harness's `PeriodRecord.issue_date`.\n\n (4) NOT A BIT-EQUALITY TEST. Checking the shipped predictor against the sweep on seed 7\n     gives 0.47619047619047616 predicted against 0.476190375 swept -- a 1.0e-7 disagreement\n     that is `_mean`'s own `round(..., 6)` divided by the 8-day span, not a predictor\n     error (seeds 11 and 23 agree exactly, which is what makes seed 7 legible). An exit\n     test comparing predicted to swept with `==` would fail on a rounding artefact. This is\n     atom D33's subject -- the collapse predicate is bit-equality -- arriving inside D32's\n     own evidence, one atom upstream of where it is filed.\n\nWHAT THIS ADDS TO THE CHAIN. D33's FRAME pass found `recon_lag_days` and\n`flagged_via_reconciliation` have no `PUBLISHED_GAP_CONSUMERS` entry (re-confirmed this\ntick: both REFUSED by `published_reading_epsilon`, `detection_latency` answers 0.005), and\nconcluded that for those 23 of 34 declared edges bit-equality may be the only predicate\nwith a defined meaning. `recon_lag_days` is the register key for the very reading D32's\nreshape would move and publish. `inferred`, not observed: if the reshape lands and the\nrecon-arm reading acquires a reader, that dimension acquires a reader precision, and\nD33's larger half changes status rather than staying unanswerable. Which is the order\n`depends_on: [D32]` on D33 already declares -- this pass gives that edge a reason.\n\nR12/R13. No published figure moved and none could: nothing in `file_scope` was written.\nBoth knobs build a second COMPANY over one unchanged world (R13); the estimators above are\ndiagnostics in days, never targets.\n\nSTATUS: FRAME only. `level_current` unchanged at 0, `loop_stage` unchanged at `idle`,\n`provenance` unchanged at `proposal`. The reshape moves a published number and remains a\nBUILD-gated mint, not a fix on sight."
map_notes:
  name: 'SPUN OUT OF H27 EXPERT HOUR #14 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT DISCIPLINE). Hour #13''s lead 1, taken: D31''s route proved every counterfactual knob is SWEPT on a book-derived grid and reaches the one saturation rule, and NOTHING asked whether the resolution those sweeps measure ever reaches the READER of the number. It did not, twice over, in the same dimension. (1) WRONG SUBJECT. `ORGAN_QUERY_GRID[''recon_lag_days'']` names `mean_lag_days_without_dd_channel` in its own `headline_key` -- the DD-channel-DELETED sub-reading -- and resolves it day for day, which is TRUE of that reading. `organ_query_grid_caveat` reported that 1.0 as what ''is published'', stamped on `detection_latency`, whose published figure is `mean_lag_days`. MEASURED n=300, seeds 7/11/23: the published headline moves 0.3235/0.3646/0.2655 days per day of detector drift, so a reader converting a movement into days of company error with the stamped 1.0 UNDERSTATES it about threefold -- and the ratio is not a constant, it is the recon arm''s share of the latency population, a property of the book''s payment-method mix. (2) MISSING KNOB. The TERMS knob is declared `in_causal_path: True` for this dimension in DIMENSION_DRIFT_RESOLUTION and its band measured since D28, and it was stamped on NOTHING: both of the figure''s caveats were about the reconciliation detector. Measured, the two knobs are BIT-IDENTICAL in this headline at every drift on every seed (-3/-1/+1/+3/+5), so a reader given only the recon caveat attributes the whole reading to a detector fault it may have no part in. THIS ATOM IS THE RESHAPE, which is the part Hour #14 declined to do on the promoter''s behalf: a latency measure that can SEPARATE a supplier holding the wrong payment terms from one whose detector fires late -- today the headline is a lag from the TRUE due date and both errors enter it identically, so the dimension whose whole subject is ''how late does the company learn'' cannot say which company error made it late. It moves a published number and is therefore a mint, not a fix on sight. R12: no published figure moved in Hour #14''s commit -- the detection gap, the latency mean and both belief figures are bit-identical; what moved is what the instrument admits about itself. ALREADY LANDED UNDER H27''s HOUR: PUBLISHED_FIGURE_CAVEAT_CONTRACT, whose keyset is DERIVED both ways (`published_dimensions` x `counterfactual_knobs`) so an undeclared cell RAISES rather than reading like an inert one -- 3 knobs x 5 dimensions, seven cells MEASURED to move and nine measured inert, each moving cell owing a caveat component that a real `score_triad` must actually RENDER (naming one is not stamping one), and any cell declaring a step checked against the PUBLISHED headline''s own measured step rather than the register''s sentence; `predict_published_latency_step_days`, which derives that step from this book''s own coverage witnesses with no sweep, no seed and no re-scoring (the D25/D30 population-side-predictor pattern, AST-asserted to read neither scorer nor register) and AGREES with the sweep on all three seeds; the corrected caveat, which now states BOTH numbers and which reading each belongs to; and `latency_terms_resolution_caveat`, the terms limit this figure never carried. R15 both ways: the control fires on the pre-Hour step (1.0 republished), on a moving cell with no caveat, on a caveat the consumer never renders, on a moving cell declared inert AND an inert cell declared moving, on an undeclared cell (raises), on a missing/orphan dimension (raises), and it has a vacuity guard proven on a probe inside the saturated band that moves nothing.'
