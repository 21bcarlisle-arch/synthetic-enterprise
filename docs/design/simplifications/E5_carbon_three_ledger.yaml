simplifications:
- '2026-07-20 DISCOVER: emissions-factor register authored (docs/design/E5_EMISSIONS_FACTOR_REGISTER_DISCOVER.md) -- the R10-anchored candidate factors the SPENT ledger needs (compute kWh x grid intensity, token energy, people), each labelled cited-source or [verify-at-BUILD] (no network; names the source + shape, never a fabricated number). FRAMES the director values-calls (grid marginal-vs-average, scope boundary, ToU resolution, token-energy source) without deciding them. Last workable DISCOVER item -- E5 DISCOVER now COMPLETE (rung-1 data model + counterfactual comparison + factor register); BUILD remains values-call-gated (SPENT) + trajectory-gated (SAVED).'
- '2026-07-20 AUTHORED (proposal) from PURPOSE_PITCH_V4.md section-9 + SITE_SURFACE_AUDIT_2026-07-19 (the largest new build the ratified v4 purpose implies -- carbon abatement through personalisation, measured £/tCO2e). Note on Claims section states plainly this does NOT exist today: no carbon ledger, no per-household cost-and-carbon trajectory, no £/tCO2e computation -- it is designed, not built. DoD (three ledgers, all reported): (a) customer carbon SAVED per household from a counterfactual (CRN once vs not -- the same isolate-what-caused-what discipline as the fidelity ablation); (b) operational carbon SPENT serving them (headcount + compute + tokens -- ties to the near-zero-marginal-cost claim + the token sensor, RESOURCE_AWARE_SCHEDULING); (c) NET, always reported (a carbon claim that counts one side is not a claim). BINDING CONSTRAINT -- must cite CARBON_NOT_A_TARGET_CONSTRAINT.md: £/tCO2e and every derived metric is a DIAGNOSTIC only, READ-ONLY to decision surfaces (never the fitness function, the draw, the risk committee, or a pricing/personalisation reward path -- enforced by a grep-guard test in the raw-send-keys shape); FAIL-OPEN (unavailable/zero carbon reads LOUD, never great); the £273/tCO2e (2025) government appraisal value is an external-benchmark sanity band (R12), never a target. C-S: event-arrival tolerant, idempotent/replayable, persistence behind the event-log interface. loop_stage idle: DISCOVER/FRAME workable NOW (data model, counterfactual method, the read-only wall); BUILD is DIRECTOR-PRIORITISED (blocked_on director_build_open) -- it is the mission core + values-adjacent (Epoch-4 fitness inclusion is a director values-call, cat-6), and depends on the personalisation cost-and-carbon trajectory (also unbuilt). No level claimed.'
- '2026-07-20 DISCOVER pass: docs/design/CARBON_THREE_LEDGER_DISCOVER.md -- the three-ledger data model (append-only carbon_event stream, derived views not stored scalars), the read-only-wall test shape (CARBON_NOT_A_TARGET), and the counterfactual-method comparison (A same-household CRN A/B [recommended for the SIM] / B baseline-trajectory / C matched-control) with the DIRECTOR VALUES-CALLS surfaced not decided: which counterfactual defines abated, the emissions-factor set (grid marginal vs average, ToU, boundary), persistence decay. BUILD still director-prioritised + trajectory-gated. No level move (doc-only DISCOVER).'
- '2026-07-20 RUNG 1 BUILT (BUILD-OPEN by director console 2026-07-20 "keep building E5"): the carbon three-ledger DATA MODEL + the CARBON_NOT_A_TARGET guard. company/carbon/carbon_ledger.py -- append-only CarbonEvent stream, DERIVED SAVED/SPENT/NET + PS-per-tCO2e views (never stored scalars; C-S2 idempotent + C-S1 arrival-order-independent), FAIL-LOUD cost_per_tonne on net<=0 (never reads as free/great). tests/company/test_carbon_not_a_target.py is the grep-guard (AST): NO decision surface (draw / risk committee / pricing / fitness register) imports company.carbon -- R15 self-tested BOTH directions (detector fires on a synthetic import, quiet on clean). 58 tests green, epistemic PASS (wall intact: the ledger records events, reads no sim). FACTOR-AGNOSTIC rung: tCO2e values are handed in, so the emissions-factor set + the counterfactual method stay DIRECTOR VALUES-CALLS (surfaced in the DISCOVER doc, not decided). L0->L1 PROPOSED (level_current NOT moved, section 0). L1->L2 REMAINING: live SAVED feed via the per-household cost-and-carbon trajectory (unbuilt) + counterfactual method A CRN + the belief-vs-truth gap. Stays build-drawable.'
- '2026-07-29 DISCOVER + FRAME for the B9-WIDENED scope (Lane-3 fork, doc-only, no BUILD code, no file touched under company/ saas/ sim/ simulation/ background/; EPOCH_GATING Rule 1). FRAME DOC: docs/design/E5_CARBON_THREE_LEDGER_FRAME.md -- the two items the director''s re-open named as genuinely un-FRAMEd are now framed: (1) the per-household cost-and-carbon trajectory derived FROM OBSERVABLES ONLY (permitted-input table incl. the WALL rows -- green_stance/segment labels and the method-A CRN counterfactual never cross; three named layers observed/normalised/projected, reusing C13''s HDD/CDD normaliser AND inheriting its measured summer failure, gap 1.040); and (2) the R14 analogue for carbon -- a carbon figure needs a TRIPLE not a single clock: CLOCK (metered/estimated/reconciled) x BASIS (grid_average|grid_marginal|activity_based + scope boundary + factor vintage) x PROVENANCE (estimated_from_data|assumed|asserted), plus the plain-language working whose test of honesty is that it must contain statements AGAINST interest. DISCOVER (verified against disk, R9-labelled): (a) REUSE -- G11_activity_cost_utilisation (L3) ALREADY provides the operational denominators: site/data/activity_cost.json time_attribution.by_class_seconds (4,385,104 attributed s over 6,587 commits) + token_attribution.total_tokens (1,760,127) across the 7-class taxonomy; E5''s SPENT must CONSUME these, never re-instrument -- but inherits G11''s open self-flattering holes (fork-churn blindness 07-18, harden-domain-split #2, same-level-arrow #3) and its coverage limit n_parsed 7 / n_unparsed 18 of 25 sessions, an UNDERSTATEMENT of SPENT that INFLATES NET. (b) REUSE -- company/sustainability/carbon_intensity_register.py already ships per-fuel factors (lines 44-56) AND a per-year 2016->2025 UK grid-average table _GRID_AVERAGE_INTENSITY (lines 57-68, 350->165 gCO2/kWh, a 2.1x swing = the anachronistic-factor risk is real); no new register needs inventing, it needs effective_from/effective_to dating. (c) REUSE -- run_output_latest.json per_customer_lifetime.<id>.cost_to_serve_gbp is REAL per-customer (C1 274.94 ... C_IC1 4218.12) = the first half of the PS/tCO2e numerator already exists; 3 of the metric''s 5 inputs do NOT. (d) REUSE -- docs/market_data/consumption_feed.json carries per-customer HALF-HOURLY kWh (288 records, customer_id/date/period/kwh) = the SAVED-side baseline observable. MATERIAL CORRECTION (R9, observed-with-evidence): the prior FRAME (frame/E5_..._FRAME.md lines 61/102/137) and the 2026-07-20 map note both cite a RESOURCE_AWARE_SCHEDULING token/compute sensor as an available observable -- grep -rn RESOURCE_AWARE --include=*.py over the whole tree returns ZERO hits; it exists ONLY as a proposal doc. There is NO token sensor and NO compute-kWh meter (nearest real thing is ntfy_responder.py::_gpu_summary lines 291-305, a point-in-time nvidia-smi string for a digest, not integrated, not logged). A BUILD wired to that premise yields zero SPENT events -> net()==saved() -> the mission metric reads its BEST value BECAUSE the feed is missing: the classic fail-open, reached through a stale premise. Compute kWh is therefore ASSUMED (nameplate-TDP model), never measured, and local-model/Ollama inference is UNMEASURED = a declared omission that flatters NET. LIVE DEFECT FOUND AND PROVEN BY EXECUTION (not inferred): carbon_ledger.py:89 guards `tco2e < 0` but NaN < 0 is False and NaN is a float, so NaN AND inf are both ACCEPTED; NaN propagates through _sum() so net() returns nan, `net <= 0` is False, the FAIL-LOUD guard at line 148 is BYPASSED and cost_per_tonne_abated RETURNS nan instead of raising. Ran directly against the shipped module this turn. This is the project''s own comparison_guards_are_nan_blind class landing inside the one control that exists to stop a carbon number reading as free/great. QUEUED not fixed (SELF_INTERRUPT + idle atom = BUILD-gated); it is the CHEAPEST genuinely-unblocked increment when BUILD opens -- factor-agnostic and values-call-free. ALSO FOUND: three_ledger_view() (lines 164-166) returns bare floats, so the per-event basis/provenance/ as_of -- which carbon_ledger ALREADY makes mandatory and fail-closed at line 93 -- does NOT survive aggregation; and no carbon key sits in generate_dashboard_data.py::_BASIS_REQUIRED_PORTFOLIO_KEYS (line 1691), so a published carbon figure would pass the R14 basis gate BY NEVER BEING CHECKED (fail-silent). The whole R14 mechanisation is therefore small and reuses the existing gate: make the basis survive aggregation + add the carbon keys to that tuple. R12 UN-GOAL-SEEKABILITY designed structurally, not exhorted: (a) the AST import wall (a metric a decision surface cannot import cannot be optimised -- a REACHABILITY property), (b) numerator owner separated from denominator owner with the FACTOR SET director-authored (same architecture as R13''s baseline/curriculum split, and for the same reason -- the agent sits on both sides of the wall), (c) fail-loud exactly where a tune would hide, (d) mandatory NET + caveats that point AGAINST us. Plus an explicit DETECTION design (usually the missing half): factor changes are a diff in a file the agent does not own; provenance-mix + omitted_terms are published and trendable; the PS273/tCO2e anchor is EXTERNAL so convergence toward it with no mechanism change is itself the alarm (triggers R4, never a tune); and the coupled-triad gap WIDENS under tuning -- the one signal independent of the company''s own accounting, which is why the triad is the L3 gate not optional polish. Honest residual stated: this prevents AUTOMATED goal-seeking and makes DELIBERATE goal-seeking leave evidence; it cannot stop a human picking a flattering factor set -- which is exactly why that choice is director-reserved. ATTRIBUTION stated honestly (R10): method B (own weather-normalised pre-intervention trajectory) is the company''s ONLY wall-legal baseline and is a NAMED SIMPLIFICATION -- it credits the intervention with everything that changed (autonomous behaviour change, price response, appliance replacement, mean reversion), so it is an UPPER BOUND whose bias direction is OVER-CLAIMING; method C (matched control) is strictly better on attribution and wall-legal but needs population the company does not have (N~19), so it is registered as the intended UPGRADE PATH, not today''s method; method A (CRN A/B) is HARNESS TRUTH and never enters company/carbon. R15 CONTROL SET SPECIFIED for BUILD -- 9 controls, each with its named defect AND the concrete mutation that must go RED, FAIL-OPEN family first: C1 absent-feed zero (status ok/no_source/insufficient_data, never 0.0), C2 partial-feed coverage floor, C3 omitted-term declaration, C4 the R14 publish gate, C5 non-finite rejection (the live defect above), C6 independent-recompute vs stored-value tautology, C7 factor time-index validity, C8 the grep-guard''s own resolve-check (an unresolvable surface is a FAILED check not a skip), C9 the wall guard. NEW VALUES-CALL SURFACED for the director (not decided): whether a knowingly-UPPER-BOUND method-B abatement headline should be published with its caveat at all, or withheld until method C is viable -- a question about what the company is willing to CLAIM, not a technical one. The six existing values-calls (marginal-vs-average, scope boundary, ToU resolution, token-energy source, which counterfactual + persistence decay, Epoch-4 fitness inclusion) are UNCHANGED and NOT widened. LEVEL HELD AT 0 (R16, no self-bump): rung 1 is genuinely built and L1-QUALITY, but grep of docs/observability/gate_authorizations.jsonl returns NO entry for E5_carbon_three_ledger, and the ledger is the sole authority -- L1 stays PROPOSED pending ratification. Analysis alone certainly does not reach L2 (that bar is mechanically-real AND mutation-tested). H29_import_time_env_capture_test_isolation precedent followed exactly: hold the cell, close saturation via the marker. frame_saturated -> true: both director-named FRAME items are now delivered and the ONLY remaining path is BUILD (values-calls + the trajectory build + the coupled-triad twin), so further FRAME output would be the treadmill H23 exists to stop; this auto-clears when loop_stage flips off idle and the atom re-enters via the BUILD draw. Both FRAME docs added to evidence -- the pre-existing canonical docs/design/frame/E5_carbon_three_ledger_FRAME.md was NEVER in evidence, which by itself made _atom_has_frame_doc false-negative and re-hand this atom every tick regardless of the flag.'
- '2026-08-19 BUILD (rung 2a, factor-agnostic and values-call-free -- the increment the 2026-07-29 FRAME named as cheapest-genuinely-unblocked, built rather than re-investigated per the director''s 2026-08-19 console instruction that the cheapest lawful path must not be the one producing nothing). TWO LIVE DEFECTS FOUND ON DISK AND FIXED, both in the class "a control that is green because the thing it checks was thrown away". (1) THE ABSENT-FEED FAIL-OPEN (FRAME control C1), the material one: with no SPENT events net() is saved()-0.0 == saved(), so the mission metric reported its BEST POSSIBLE value exactly WHEN the operational-carbon feed was missing -- and the FRAME had already established that feed IS unbuilt (grep for a token sensor or a compute-kWh meter returns zero), so this was the ledger''s LIVE behaviour, not a hypothetical. Arithmetic cannot distinguish "we emitted nothing" from "we did not measure what we emitted", so a new net_status() carries what the number cannot (ok / no_source / one_sided) and cost_per_tonne_abated now REFUSES a one-sided net: an estimate that counts abatement but no operational emissions is not conservative, it is unbounded. NET is still always REPORTED (the module''s own rule), just never PRICED against half a ledger. (2) THE LABELS DID NOT SURVIVE AGGREGATION (the R14 analogue for carbon, FRAME section 2): CarbonEvent spends four fail-closed guards making basis, provenance and as_of MANDATORY on every event, and three_ledger_view() then returned three bare floats -- destroying all three at the one method whose output is the publishable headline. The labels were never missing; aggregation dropped them, so the fix cost no new data collection at all. Rows now carry basis as a TUPLE (a grid-marginal tonne and a grid-average tonne are not the same unit, so a scalar label on a mixed aggregate would be a false claim about a real number), a provenance mix weighted by TONNAGE not event count (the reader''s question is how much of this number is assumed, and one large assumed event among many small estimated ones is exactly what count-weighting hides), the as_of span, and the event count. Deliberately NO unlabelled variant of the method exists -- a second accessor returning bare floats would be the escape hatch a publisher reaches for, which is how the labels became optional the first time. R15: THREE MUTATIONS RUN AND ALL RED (C1 guard deleted via net_status always-ok; three_ledger_view restored to bare floats -> 12 red; provenance re-weighted by event count), with the un-mutated null control GREEN -- run in memory via a pytest plugin, never by editing the shared module, because concurrent writers share this tree. 84 carbon tests green, 14,048 company tests green, epistemic verifier PASS (pure accounting, reads no sim). L0->L1 SELF-CERTIFIED (2026-08-03 PROPOSE-RECORD-ACT; the 2026-07-29 note held the cell at 0 "pending ratification", which is exactly the permission machinery since deleted -- the ledger is the RECORD, not a permission). L1 is the HONEST ceiling and L2 is NOT claimed: L2 is "mechanically real, genuine artefacts", and every tonnage here is still handed in. WHAT REMAINS FOR L2, unchanged: the live SAVED feed via the per-household cost-and-carbon trajectory (unbuilt), the counterfactual method, and the emissions-factor SET -- the latter two still DIRECTOR VALUES-CALLS, not touched here. DEBT REGISTERED, NOT SILENTLY SKIPPED: the FRAME''s control C4 (no carbon key sits in generate_dashboard_data.py _BASIS_REQUIRED_PORTFOLIO_KEYS, so a published carbon figure would pass the R14 basis gate BY NEVER BEING CHECKED -- fail-silent) is CONFIRMED still live on disk at line 2004 and NOT fixed here, because tools/ is outside this atom''s file_scope. It is now also the smaller half: the labels it needs to gate finally survive aggregation. Filed as a finding rather than scope-crept, and the fix should extend the gate''s subject set rather than append two keys (R10 -- the tuple is a hand-maintained allowlist, so EVERY new headline figure is born unchecked; that is the class, and the carbon key is one instance).'
- '2026-08-22 BUILD (FRAME control C4, the debt the 2026-08-19 pass registered rather than scope-crept, and taken here as the CLASS its own note said it was: "the fix should extend the gate''s subject set rather than append two keys (R10 -- the tuple is a hand-maintained allowlist, so EVERY new headline figure is born unchecked)"). THE ALLOWLIST WAS THE DEFECT. tools/generate_dashboard_data.py held _BASIS_REQUIRED_PORTFOLIO_KEYS = ("net_margin_gbp", "enterprise_value_gbp") and _check_basis_labels_present iterated it, so R14 -- "every published financial figure carries its clock" -- was enforced only over figures somebody had remembered to name. A figure is checked because it is on the list, not because it is published: that is R15''s FAIL-SILENT pattern sitting inside the one control that exists to stop an unlabelled number reaching the front door, and it is why a carbon tonnage would have passed a gate it was never the subject of. MEASURED BEFORE CHANGED, and the measurement is what promoted this from instance to class: running the candidate derived rule over the REAL extract_portfolio found SEVEN keys carrying a published-money suffix and only TWO named -- gross_margin_gbp, treasury_start_gbp, treasury_end_gbp, cost_to_serve_gbp and net_after_cts_gbp have been publishing with no clock at all, invisible to the gate for as long as they have existed. The carbon key was never the problem; it was the fifth-and-sixth instance of a class already live on disk. THE FIX: the subject set is now DERIVED from the portfolio being published (_basis_required_portfolio_keys -- any key whose name ends in a published-quantity suffix, _gbp or _tco2e, is a subject), so deny-by-default and a figure added tomorrow is checked with nobody editing a list. The five that predate the rule are neither silently grandfathered NOR given invented labels -- asserting a clock nobody has established is exactly the false claim R14 exists to prevent -- but DECLARED by name with a written reason in _BASIS_DECLARED_UNLABELLED, printed to stderr on every publish cycle as BASIS-LABEL DEBT. That makes the debt enumerable and, the actual point, NON-GROWABLE. R15, SIX MUTATIONS RUN AND ALL RED against their named test, null control GREEN (13 tests): M1 restore the superseded allowlist -> the three "figure added tomorrow" cases red, including net_carbon_tco2e and cost_per_tco2e, which is C4 stated as a live falsifier instead of a comment; M2 empty the register -> the NULL CONTROL itself reds, which is the load-bearing one because it proves the five figures really do lack clocks on disk and the register is an admission rather than decoration; M3 a declaration for a figure the portfolio no longer emits -> stale-excuse direction reds; M4 a declaration for a figure that HAS acquired a basis entry -> the repair-not-recorded direction reds (without it a figure ends up checked by neither the label nor the gate); M5 swallow the debt line -> reds; M6 blank reason -> reds. Every mutation was applied to the imported module OBJECT via a scratch pytest plugin and reverted, never to a file, because a full pytest run (PID 4003393) had held this shared tree since 05:49. Tests: 13 new + 129 existing consumers (test_website_integrity_fix, test_control_mutation) + 79 stem-selected, all green. HONEST LIMITS, three of them. (1) The gate sits in REPORTED_NOT_BLOCKING under the director''s 2026-08-20 rule that a surface no reader can reach must not block publishing, so this changes what the cycle PRINTS, not what it refuses -- a test pins that so no future reader takes these controls for stronger than they are. (2) The five declared figures still publish without clocks; the debt is now visible and bounded, not paid. (3) The derived rule keys on NAME SUFFIX, so a money figure named without one would still escape -- a weaker rule than typing the portfolio, and the honest reason to prefer it today is that it needs no change to how figures are produced. E5''s OWN LEVEL IS UNMOVED AT 1 and must be: this is the publish gate''s subject set, not a tonnage, and L2 ("mechanically real, genuine artefacts") still waits on the live SAVED feed, the counterfactual method and the emissions-factor set -- the latter two still DIRECTOR VALUES-CALLS, untouched. file_scope NOT widened to claim tools/generate_dashboard_data.py: the file belongs to the publishing lane, E5 only surfaced the defect in it, and E5''s scope is a DIAL that orders work rather than a wall that zeroes it (Rule 0). C4 is now DISCHARGED and off E5''s remaining list.'
map_notes:
