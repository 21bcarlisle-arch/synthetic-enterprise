atom_id: H_draw_excludes_external_blocked_atoms
simplifications:
- 'REGISTERED FINDING (2026-07-17, diagnosed over ~5 idle turns by the worker seat, SELF_INTERRUPT_DISCIPLINE: register, do not fix-on-sight). DEFECT: the idle-DISCOVER draw (_idle_discover_frame_draw_concurrent) excludes STALLED atoms, but when the ONLY below-target idle candidates are stalled it FALLS BACK to drawing them anyway (better-than-nothing) -- so a WORKER-COMPLETE atom whose only remaining gap is a DIRECTOR ACT (e.g. OPS1_operational_layer_rebuild awaiting the systemd deploy, OPS1_governance_refusal_mutation_test awaiting the director-watched live run) is re-DISCOVER-drawn every cycle, indefinitely, with nothing genuine to do -> a treadmill that either wastes turns or tempts theatre notes (which reset the stall fingerprint and perpetuate it). ROOT CAUSE: the map has no way to say worker-done-but-blocked-on-an-external/director-act -- level_current<target models this as remaining WORKER work, which it is not. FIX (build): add a `blocked_on` atom field (e.g. blocked_on: director_deploy | director_live_run); the draw (both _maturity_map_draw_concurrent BUILD tier and the idle-DISCOVER tier, including the all-stalled fallback) EXCLUDES any atom with a non-empty blocked_on, so it is never surfaced as drawable work until unblocked; set OPS1_operational_layer_rebuild + OPS1_governance_refusal_mutation_test blocked_on accordingly (honest: they ARE blocked on the director, not on worker work); mutation-test that a blocked_on atom is never drawn and that clearing blocked_on re-admits it. This is a designed schema addition (represent external-block), not an accretion patch. When it lands, the loop returns empty (genuine idle) instead of treadmilling, and the two OPS1 atoms stop being handed to the worker.'
- '2026-07-17 BUILT (0->3). background/supervisor.py: `_is_externally_blocked(a)` = bool(a.blocked_on); every draw (single + concurrent BUILD via _maturity_map_draw_concurrent, single + concurrent idle-DISCOVER) filters `candidates` through it right after building them and BEFORE any stall/saturation fallback, so a blocked atom is never surfaced -- and when the only candidates are blocked the draw returns EMPTY (genuine idle) instead of re-handing done work. Set OPS1_operational_layer_rebuild blocked_on: director_systemd_deploy and OPS1_governance_refusal_mutation_test blocked_on: director_live_run (honest: their gap to L3 IS a director act). 6 R15 mutation tests (tests/background/test_draw_external_block.py: blocked excluded at max dial; only-blocked -> empty not fallback-redraw; open atom still drawn; clearing blocked_on re-admits) + 152 supervisor tests pass; epistemic PASS. LIVE-verified against the real map: build draw now returns only this atom, idle-DISCOVER empty, the two OPS1 atoms excluded. Clearing an atom blocked_on re-admits it -- so when the director deploys / runs the governance test, removing the field re-opens L3 work.'
