atom_id: SITE15_each_front_door_band_opens_into_one_l2_sheet
map_notes:
  gain: 'Minted 2026-10-09 from DIRECTOR_RULING_FRONT_DOOR_STAYS_SIMPLE_AND_EXPLORATION_GOES_DEEPER_2026-10-09.md, which arrived without a WORK THIS CREATES block. Item 1 (no statistic joins the door) is held by site/test_the_front_door_diagram_carries_no_statistics.py and is not this atom. This atom is items 2 and 3: each band of the diagram opens into one L2 sheet, picture first, same palette, glyphs and wall rendering as the door, showing flows a lay reader can follow (world: regime, weather, demand and renewables together, residual, price; wall: what crosses in, what crosses out, what never crosses). No statistics on a sheet. Any built/not-built mark or stage word on a sheet DERIVES from the maturity map through site/moap_stage.py exactly as the door''s words do, and a control reds when a sheet hand-types one (moap_render is the model). Order is the seat''s: the wall first, because the module-graph door (224e4af02, /harness/module-graph/) already measures what crosses it; the world band last, after the stage-1 world rebuild settles, so its sheet does not churn weekly. L1 = one sheet live and linked from its band with the derivation control; L2 = every band. The director has no preference between in-page expand and linked pages.'
