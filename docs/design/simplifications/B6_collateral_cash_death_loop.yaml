- '2026-07-29 DISCOVER (L0->L1) + FRAME (L1->L2 design only), lane-3 fork, verified AGAINST DISK with file:line, nothing recalled. FULL WRITE-UP: docs/design/B6_COLLATERAL_CASH_DEATH_LOOP_FRAME.md (this atom''s OWN FRAME doc, now in evidence -- an inline FRAME in this list is a YAML string and does NOT saturate per supervisor._atom_has_frame_doc:814, so the artefact is the saturation, not this note). THE ATOM DESCRIPTION IS MATERIALLY STALE IN BOTH DIRECTIONS. (a) SUBSTANTIAL COLLATERAL MACHINERY ALREADY EXISTS AND IS LIVE: company/finance/margin_call_book.py::build_margin_calls_from_mtm is called in the production run at simulation/run_phase2b.py:2533 and derives real variation margin from ISDA-netted MtM (variation_margin = max(0, -netted_mtm), :194); company/finance/margin_call_book.py:68 book_scaled_credit_facility_gbp sizes a committed facility off the book''s own gross marked exposure (MC-2 §3 director ruling, FACILITY_COVERAGE_MULTIPLE=1.5/FACILITY_MIN_GBP=250k at :64-65); company/risk/collateral_death_test.py::breaking_strain_sweep (MC-2) runs live at run_phase2b.py:2562 and already distinguishes collateral_while_solvent from collateral_insolvent (:186-189). The published run docs/reports/run_output_latest.json carries a real margin book: total_outstanding_gbp 1,392,351.10 against credit_facility_gbp 2,537,361.39, final_treasury_gbp 3,898,728.86, administration_event null. A BUILD starting from "level 0 = absent" would rebuild all of this. (b) BUT THE ONE THING B6 EXISTS FOR IS ARITHMETICALLY IMPOSSIBLE TODAY, and this is the load-bearing finding: simulation/run_phase2b.py:1923 does `treasury += rec["net_margin_gbp"]` -- the field named treasury_cash_balance_gbp (:1924) IS the running cumulative sum of ACCOUNTING NET MARGIN, and the only mortality path in the simulation, run_phase2b.py:1938 is_administration_triggered(treasury) -> sim/risk_engine.py:180-187 `treasury_balance_gbp <= 0`, is taken off that same number. CASH AND P&L ARE ONE VARIABLE, so "dead on cash, solvent on paper" cannot be represented at all. B6''s deliverable is therefore NOT a margin calculator (that exists) but A SECOND BALANCE ON A DIFFERENT CLOCK plus the seam between them. MARGIN NEVER TOUCHES CASH, three independent confirmations: _margin_call_summary is used at exactly one place beyond its assignment (run_phase2b.py:2635, the report dict -- sweep returns only 2440/2536/2635); MarginCallBook.settle_call (margin_call_book.py:102) has ZERO production callers so calls are raised and never paid or returned; and the published run shows GBP1.39m outstanding beside a GBP3.90m treasury the margin never touches. MC-2 IS POST-HOC AND TWO-POINT, NOT A PATH: it runs after the settlement loop (call site :2562 is past the death check at :1938 so it cannot affect the run''s own life), marks ONE book at exactly TWO dates (origination_date = min term_start, :664; stressed_date 2021-12-31, :652-655) with linear dose interpolation, and passes available_cash_gbp=0.0 (default :625, never overridden at :2562) so the run''s own treasury is not even supplied. C-S3 IS VIOLATED AT SOURCE: run_phase2b.py:696 passes settlement_deadline=stressed_date -- CALL DATE == PAYMENT DEADLINE, zero latency, so the timing asymmetry that IS the death loop cannot exist. FIVE MODULES EXIST BUT ARE DEAD (test-only, zero production callers, ~800 lines): company/trading/otc_margin_book.py (full CSA VM incl. CALL/RETURN direction and T+1 overdue at :57-69), company/trading/initial_margin_register.py (its docstring :14-19 names the CCP-raises-IM channel), company/risk/liquidity_stress_test.py (initial_margin_shock_pct :41), company/risk/capital_adequacy.py, plus company/finance/working_capital.py (a daily cash model WITH CREDIT_FACILITY_DRAWDOWN, :15-16) and company/finance/treasury.py. B6 is not short of components, it is short of a spine connecting them to cash. THE ONE DEATH MEASUREMENT IS DROPPED BEFORE PUBLICATION: run_phase2b.py:2638 emits "mc2_collateral_death_test" but grep -c on saas/reporting/annual_report.py::extract_report_data returns 0 (it forwards margin_call_book at :655 and nothing MC-2), and run_output_latest.json has no such key -- a fail-silent R11 orphan, so if it ever fired collateral_while_solvent no surface would show it. NO SURVIVAL LEDGER AND NO SCORE: background/run_manifest.py:147-168 defines RunOutcomes with survived/death_cause/liquidity_headroom_min_gbp/collateral_cover_min and LEDGER_PATH docs/observability/run_ledger.jsonl (:60), but THAT FILE DOES NOT EXIST and no caller constructs a RunManifest; the blended survival SCORE is explicitly director-session gated (collateral_death_test.py:28-34). So B6''s DoD clause "the mortality is recorded by the survival score" has neither the row nor the score behind it, and the score''s weighting is a values decision (one-way door 6). NO BANKED CLOCK ON THE RUN PATH (R14): the project owns the vocabulary elsewhere (bad_debt_reconciliation.py:101-102 billed/settled, css_statement.py:525-528 banked, generate_dashboard_data.py:259 clock settled) but treasury_cash_balance_gbp is a SETTLED-clock accumulation carrying a BANKED-clock name, and an insolvency test is a banked-clock question answered on the settled clock. INITIAL MARGIN IS IDENTICALLY ZERO (margin_call_book.py:175-178 and :203), so the direction-agnostic volatility-driven drain cannot exist and the model can only ever kill on a price FALL -- which is exactly why collateral_death_test.py:23-26 correctly observes a pure long book posts no VM on a spike. R15 FAIL-OPEN FOUND AND DEMONSTRATED BY EXECUTION, NOT INFERENCE: a single NaN mark walks through the live path and returns survived=True. Ran this pass: max(0.0, -nan)=0.0 so margin_call_book.py:194 silently yields ZERO margin and :195 then skips the counterparty; max(250000.0, 1.5*nan)=250000.0 so book_scaled_credit_facility_gbp:87 silently floors the facility; nan < 0.0 is False so collateral_death_test.py:160 reads DEAD as ALIVE. build_margin_calls_from_mtm with a NaN netted_mtm -> 0 calls, and breaking_strain_sweep -> survived=True, death_cause=None, any_name_posted_margin=False -- and that last flag is the MISDIAGNOSIS: the module''s own docstring (:23-26) tells the reader to read it as the benign "hedge cover masking the exposure" §4 finding, so a CORRUPTED MARK IS INDISTINGUISHABLE FROM A HEALTHY LONG BOOK. Same class as the E5 carbon-ledger nan-as-a-rate incident (git 83ccb913c) and the D5 ledger non-finite hardening; a margin calculation is a chain of subtractions on marked prices and is exactly that shape. REGISTERED, NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE: queue by default; nothing is blocked and all four defects fall inside B6''s own future BUILD scope, so patching under an idle gate would be BUILD). Four registered: the NaN fail-open (3 lines); the reducer drop; two bare `except Exception` swallows around the collateral machinery (run_phase2b.py:2537-2540 and :2570-2573 -- an unavailable check reported as a warning is a FAILED check, R15 fail-silent); and the false basis on treasury_cash_balance_gbp. CONSISTENT WITH SPINE_3 (commit 52fc590bb) AND ASSUMES NO SCRIPTED CRISIS: the 2021/22 inversion is REPLAYED REAL HISTORY in sim/gas_data/nbp_sap.csv, and the one hardcoded path sim/scenario/curriculum/crisis_2021_22.yaml is unratified, out of rotation and read by no generator -- so this FRAME hangs its margin calls on a replayed real price path plus SPINE_3''s single exogenous pipeline-supply term, never on a script. FRAME SUMMARY (design only, nothing built): the death loop in three sentences -- the company is naturally LONG forward (it buys ahead to cover fixed-price retail), so when the forward FALLS its netted MtM goes negative and counterparties call variation margin equal to the WHOLE remaining tenor''s loss payable in cash at T+1; that cash leaves as a STEP on the BANKED clock while the offsetting benefit (cheaper energy for the rest of the customers'' terms) accrues as a RAMP on the SETTLED clock and only becomes cash later still after billing and DD collection; and because the hedge is held against a matched forecast supply obligation the MtM loss does not hit accounting P&L, so the company reaches Cash + Facility_undrawn < VM_due while P&L is positive and rising. R14 CLOCKS NAMED PER QUANTITY: MtM_t and VM_called on the MARK clock; VM_paid at t+delta and IM_t and Cash_t on the BANKED clock; wholesale cost and accounting net margin on the SETTLED clock; R_billed on the BILLED clock and R_banked on the BANKED clock at bill+collection lag. THE ARITHMETIC OF THE ASYMMETRY: cash OUT is Q*|dF| in ONE payment at t+delta; cash IN is the same total spread over the tenor T and delayed by lambda_bill+lambda_collect; so the peak cash deficit is of order Q*|dF|*(1 - (lambda_bill+lambda_collect)/T) EVEN WHEN THE TRADE IS PERFECTLY HEDGED AND P&L-NEUTRAL -- and collapsing any of delta, lambda_bill, lambda_collect or T to zero deletes the mechanism silently with a green suite. TWO CHANNELS, BOTH NEEDED: (A) VM on a FALLING forward, direction-specific, whose killer sequence is SPINE_3 §1.7c 2022-08 GBP186.54 -> 2022-10 GBP55.47 = -70.3% in two months against a book bought at the peak (SPINE_3 acceptance leg D, <= -50%, is therefore NOT optional for B6); (B) INITIAL margin re-called on rising VOLATILITY, direction-agnostic, which drains cash on the SPIKE too -- without (B), B6 can only kill on the collapse leg and a run window ending before 2022-08 can never be killed. MINIMUM MECHANISM, five pieces, four of them CONNECTIONS between things that already exist (SIMPLICITY GUARD): 1 split the balance (rename treasury_cash_balance_gbp -> cumulative_net_margin_gbp, meaning unchanged, and introduce a separate cash_banked_gbp fed only by banked events; move is_administration_triggered onto cash+undrawn facility -- NOTHING ELSE WORKS UNTIL THIS LANDS); 2 a daily mark path replacing the single terminal snapshot, using the EXISTING observable resolver at run_phase2b.py:2553-2560, no new price source; 3 a call->payment lifecycle with real latency (C-S3), giving settle_call the caller it has never had; 4 initial margin as a live term sized off an observable volatility proxy; 5 revenue-to-cash conversion with lambda_bill+lambda_collect hung on the payment machinery already on the run path at run_phase2b.py:1907. C-S5: the lags are day-indexed so TIME-SCALE INVARIANCE MUST BE DECLARED FALSE and registered as a named simplification. WALL: the company sees its own blotter, its own MARGIN CALLS (the purest observable here -- it learns the size of its problem by being TOLD TO PAY), its own bank balance, bills, DD collections and committed facility, and published market data; it may NEVER see SPINE_3''s storage state, the shock parameters, its counterparties'' internal IM models, or any future mark (run_phase2b.py:642-644 already sets the correct pattern -- the resolver reads only history BEFORE the mark date and raises on insufficient history, and B6 must preserve that failure mode rather than paper over it). THE COMPANY IS ALLOWED TO BE WRONG AND ALLOWED TO DIE: sim/forward_curve.py:88 GAS_MONTH_SEASONAL_MULTIPLIER is a static dict that CANNOT CHANGE SIGN (SPINE_3 §1.5), so the company will be structurally wrong in a mechanical, predictable way, exactly as real suppliers were; a B6 that quietly grants enough foresight to survive has destroyed the finding. COUPLED TRIAD: SIM (SPINE_3 + B4) owes a DAILY PER-TENOR forward mark (spot alone gives B6 nothing to mark against), the COLLAPSE leg not only the spike, SPEED as a first-class quantity (the death is driven by dF/dt, not F), a daily cadence with the payment lag owned by B6, and parameterisability to a milder shock -- so SPINE_3 alone is NECESSARY BUT NOT SUFFICIENT and B4_traded_product_ladder is a real co-dependency (SPINE_3 §3 Q4 asks the same ordering question from the other side and it is still open). COMPANY discovers the crisis through the observables above and must choose unhedge / draw / fail. HARNESS measures three gaps into coupled_gap_ledger.json, the headline being THE CLOCK-DIVERGENCE GAP: P&L_t (settled) minus Cash_t (banked) tracked daily through the crisis window -- oscillating near zero in a healthy world, fanning out in the death world; THAT SERIES IS THE B6 SCORE, not a proxy for it. Plus liquidity-runway belief gap (how LATE the company sees it coming) and margin-anticipation gap (VM provisioned vs VM called). DEFEAT DEFINED NUMERICALLY, as the triad law requires: on the SAME run (a) min_t (Cash_t + Facility_undrawn_t) < 0 on the BANKED clock, AND (b) P&L_t > 0 at that same t on the SETTLED clock, AND (c) the killing call arose from a PRICE MOVE ALONE with no injected loss at the cash line, AND (d) death_cause == collateral_while_solvent, never collateral_insolvent -- the (d) distinction already exists and is already correct at collateral_death_test.py:186-189, so B6 does not reinvent it, it makes it reachable from a LIVE RUN rather than a post-hoc sweep. And per B6''s own DoD BOTH DIRECTIONS must be proven: a milder shock must yield survival with min_t(Cash+Facility) > 0, because a world that always kills is as useless as one that never does. R13 SPLIT -- BASELINE (agent-buildable, fidelity-to-reality, decided blind to company P&L): CSA variation-margin mechanics (OTM party posts, per-master netting, VM returned when the mark moves back), the T+1 settlement convention, initial-margin convention (posted at inception, sized to a ~5-day stressed holding period, re-called when the CCP raises the multiple, returned at maturity), haircuts and eligible-collateral rules, cleared-vs-bilateral treatment (partly present already at wholesale_credit_exposure.py:60 _CLEARED_EXPOSURE_HAIRCUT=0.10), billing and DD collection lags calibrated to real UK practice, THE FACILITY SIZING RULE (already director-ruled at MC-2 §3 and NOT to be re-opened by B6 -- shrinking the facility to force a death is an R12 breach), and the gap-measurement/oracle/mutation machinery. CURRICULUM (DIRECTOR-RESERVED, the agent must NOT set): which crisis the company lives through (SPINE_3''s shock magnitude/onset/ramp/persistence); the STARTING CASH and committed facility AS A DIFFICULTY SETTING -- note the fine line, the facility SIZING RULE is baseline but a hand-chosen opening balance picked to make the company die is curriculum, and a BUILD that finds itself choosing one has crossed; whether the company gets a lagged published storage feed (SPINE_3 §3 Q3, which directly sets survivability); THE SURVIVAL SCORE''S WEIGHTING (how mortality-by-collateral weighs against other outcomes is a values decision about what the company is FOR, one-way door 6 -- B6 supplies the raw fields and must NOT blend them into a scalar); and whether the company may unhedge under duress or is capped on facility drawdown (a board decision, a world-fact about governance). THE MECHANISM OF DYING IS BASELINE; THE SEVERITY OF THE WORLD AND THE SCORING OF THE DEATH ARE THE DIRECTOR''S -- this FRAME chooses no severity. R15 AT BUILD: the TAUTOLOGY trap here is specific -- Cash_t and P&L_t MUST be computed from independent event streams, because if Cash_t is derived as P&L_t plus adjustments then "cash diverged from P&L" re-asserts the adjustment term and CANNOT FAIL WHILE THE CODE COMPILES (SPINE_3''s T2 shape); enforced by a test that the cash accumulator takes banked-clock events only and that its module does not import the P&L module, and by an EXTERNAL oracle built from sim/gas_data/nbp_sap.csv (a file the margin code neither reads nor writes) rather than from the generator''s own series. FAIL-OPEN guards, each a FAILED check never a silent pass: reject NON-FINITE FIRST before any comparison (max/min/< are all NaN-blind -- §1.10 proves the live path fails open at three lines today); empty or single-point mark path; delta/lambda_bill/lambda_collect/T equal to zero must be LOUD, not a default, because a zero lag deletes the mechanism; a zero facility, or available_cash_gbp=0.0 silently meaning "cash is zero" when it means "cash is unknown"; and a missing clock label on any published B6 figure (R14 gate). FAIL-SILENT: the two bare except-Exception swallows must go (an unavailable death test is a FAILED death test), and the reducer drop must be closed with a published-surface assertion (R11, verify to the rendered value). NINE NAMED MUTATIONS each of which must go RED: B1 cash still fed from net_margin_gbp (the split is cosmetic); B2 delta=0; B3 lambda_bill=lambda_collect=0; B4 mark path reduced to a single terminal snapshot (today''s behaviour); B5 calls raised but never settled (today''s behaviour); B6 IM identically 0 (today''s behaviour); B7 one injected NaN mark, which must FAIL rather than return survived=True as it does today; B8 BIDIRECTIONALITY -- run against baseline history_replay and a milder shock, where the test must PASS/survive, because a test that kills in every world is not a control; B9 drop the B6 fields from the report reducer (today''s behaviour) against a published-surface assertion. WHERE R15 DOES NOT REACH, stated rather than papered over: the hedge-accounting deferral (WHY the MtM loss does not hit P&L) is a modelling assumption about accounting treatment, not a mechanism a mutation can falsify -- it must be a named R10 simplification with its real-world basis cited, and its alternative (full fair-value through P&L, under which cash and P&L move together and the divergence shrinks) recorded as the thing that would falsify it. OPEN QUESTIONS blocking BUILD only: Q1 ordering with B4 (B6 needs a per-tenor mark; SPINE_3 §3 Q4 is the same ruling from the other side, so TWO atoms now wait on ONE decision); Q2 does B6 own the survival ledger or inherit it (run_ledger.jsonl has never been written; the scalar score is director-reserved either way); Q3 does the MC-2 post-hoc sweep survive B6 or is it superseded (recommend keeping it as a BREAKING-STRAIN diagnostic, its stated purpose, and letting the live run own MORTALITY -- but deleting a director-ruled artefact is not the agent''s call); Q4 the storage feed (inherited from SPINE_3 Q3); Q5 FILE_SCOPE IS WRONG -- this atom declares saas/treasury and tests/saas/test_collateral_death_loop.py and NEITHER EXISTS (ls saas/ has no treasury entry), while the real surface is simulation/run_phase2b.py, company/finance/margin_call_book.py, company/finance/treasury.py, company/trading/otc_margin_book.py, company/trading/initial_margin_register.py and company/risk/collateral_death_test.py; a BUILD on the declared scope would create a SECOND duplicate treasury in the wrong layer, and since file_scope is what the multi-atom disjointness gate reads, correcting it is a concurrency matter proposed here and left to the orchestrator/sole map writer rather than edited by a DISCOVER fork. REAL-WORLD FIGURES BUILD MUST FETCH, NOT ASSUME (unsourced today): published UK-supplier RCF-to-book ratios (already registered as forward-discovery at margin_call_book.py:55-58), real CSA VM settlement conventions and eligible-collateral haircuts for GB energy OTC, the actual IM multiples ICE/EEX applied to gas and power futures through 2021-22, and typical UK domestic billing and DD collection lags. LEVEL PROPOSED 0 -> 1 (Skeletal), CELL NOT MOVED. Why L1 and not 0: the L1 bar is "Exists, simplified past realism / been BUILT in any form" (MATURITY_MAP.md:50) and this atom''s headline capability -- a hedge book that posts variation margin against a moving forward -- IS built in skeletal form and IS live in the production run (real VM from real netted MtM at real observable forwards, a book-scaled committed facility, a breaking-strain sweep with the correct solvent/insolvent split, GBP1.39m outstanding in the published output); holding at 0 mis-states the tree as empty and would send a BUILD fork to rebuild it. Why emphatically NOT L2: the L2 bar is "Mechanically real -- genuine artefacts, happy path", and the margin never moves cash, the defining divergence is arithmetically impossible, the sole death measurement is dropped before publication, and one NaN returns survived=True. The cell is HELD at 0 by this pass: tools/level_promotion_gate.py refuses any unauthorized level_current increase at commit time, MATURITY_MAP.md §0 says the agent proposes and never moves a cell, MATURITY_MAP.md:138 makes L1->L2 the advisor''s ratification and L3+ the director''s, and R16 forbids --no-verify on a level_current change. Precedent followed: SPINE_3_gas_storage_crisis_regime and H29_import_time_env_capture_test_isolation both completed DISCOVER+FRAME, HELD level_current, and closed their re-draw treadmill by promoting the FRAME to a real artefact rather than by bumping a level. SATURATION: docs/design/B6_COLLATERAL_CASH_DEATH_LOOP_FRAME.md is now in evidence and is owned by exactly THIS atom -- no sibling FRAME is cited (that fail-silent false positive was found and fixed on this atom earlier the same day), and per supervisor._atom_has_frame_doc:814 only a real non-empty docs/design/*FRAME*.md in evidence saturates, so the atom leaves the idle DISCOVER/FRAME pool and re-enters via the BUILD draw when loop_stage flips off idle. No orphan transition, no permanent hold. NO BUILD CODE WRITTEN: nothing under company/, sim/, saas/, simulation/ or background/ was created or modified by this pass.'
