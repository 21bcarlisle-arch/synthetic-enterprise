map_notes:
  gain: 'DIRECTOR RULING 2026-09-05 section 3, docs/staging/DIRECTOR_RULING_JULY_STEERS_RECONCILED_AND_PARKED_AUDIT_2026-09-05.md. Director verbatim: ''I do not want to ignore prior steers or stages that are out of date.'' Three documents sampled at random were stale in THREE DIFFERENT WAYS -- done-but-not-moved, parked-on-a-condition-met-weeks-ago, and half-superseded -- which is the idle-hole class this harness has already named twice: a CORRECT park with no mechanism to notice its condition changing. 121 documents at that hit rate is not a filing problem, it is live work nobody can see. Five dispositions, each carrying an EVIDENCE LINE rather than the document''s own header, because a document closed on its own header is a document nobody opened. The DIRECTOR bucket batches into ONE plain-English list, never 121 messages. Sequenced AFTER the HadUK pull, which has now landed, so this is unblocked.'
