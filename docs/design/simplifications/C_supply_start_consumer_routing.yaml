- '2026-08-03 MINTED (worker tick, sole-map-writer) as the explicitly-named residual (a) of C_supply_start_semantic_separation, which closed the CRM/definitional half and the R10 class guard but deliberately did NOT touch the live consumers -- they sit outside that atom''s file_scope and changing them moves published numbers. QUEUED not fixed-on-sight per SELF-INTERRUPT DISCIPLINE. THE DAMAGE IS LIVE TODAY, enumerated with file:line in docs/design/SUPPLY_START_SEMANTIC_SEPARATION_DISCOVER.md: 7 LIVE-wrong sites for C1_2 -- churn-estimate tenure (simulation/customer_events.py:148, run_phase2b.py:1175), per-customer tenure_years (annual_report.py:4503), acquisition-cohort bucket (annual_report.py:380,6725), and the rendered "Customer since 2016-01-01" / "acquired" strings (site/customers/index.html:574,189, site/company/index.html:659) -- plus 6 generator conduits that publish the wrong value. C1_2''s real relationship began 2020-12-30 (observable acquisition event, channel home-move-win), so the site currently shows ~9 years tenure against a real ~5.'
- '2026-08-03 MINT -- THE HARD PART IS NOT THE ROUTING, IT IS THE UNKNOWNS AND THE REPUBLICATION. (1) The separated field is legitimately NULL for a successor with no activation observable, so every consumer needs a stated behaviour for UNKNOWN tenure -- and "treat UNKNOWN as zero/as the anchor" is forbidden, since that silently restores the phantom this class exists to remove. A cohort bucket, a CLV payback and a churn hazard each need an honest answer for "we do not know", and an absent value must be visible as absent on the rendered surface rather than filled in. (2) R14: the published tenure-derived figures WILL move, and they must be republished as an explicit before/after carrying the basis clock -- these diffs are the fix landing, not regressions, and R12 applies (the moved figure is a diagnostic, never tuned back toward the old number). (3) R11 is a wall here, unlike its parent atom: this one IS user-visible, so done means fetching the live poesys.net C1_2 surface and asserting the rendered "Customer since" reads the real activation date. (4) Every semantic-A consumer (~20 sites: settlement, renewals, contract_end, renewal cadence) must stay on the anchor -- an R15 mutation that re-points one of them at supply_start must FIRE, because breaking the term grid is the real risk of this atom.'
