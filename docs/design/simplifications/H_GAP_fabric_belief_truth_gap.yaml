- '2026-08-11 SIXTH EXPERT HOUR (worker tick, L2->L3 draw) on the opener the fifth Hour named -- IT FOUND SOMETHING, SO THE LEVEL STAYS 2. CONFIRMED: `MIRROR_FIDELITY_BAND` gated a FAULT (register infidelity, kW/K) AND the yardstick disclosure on the mirror WORKING -- two subjects OPPOSITE IN POLARITY on one number, the FOURTH Hour''s `VERDICT_MATERIALITY` class one level down. THE HOUR''S OWN HYPOTHESIS WAS REFUTED BY THE EXISTING SUITE: reading the drawn row''s silence as a fail-open and gating on attribution alone fired on the nothing-to-caveat fixture, because under a level-preserving reflection the attribution is 100% BY ALGEBRA whenever the gaps differ, making the caveat unconditional on the common path -- 1.87% of the larger figure is too small to mislead, so that silence was right for a SIZE reason. R10 CLASS: A SIZE MEASURE AND AN ATTRIBUTION MEASURE ARE BOTH REAL AND NEITHER ANSWERS THE OTHER. THE DEFECT THAT SURVIVED IS A FALSE PUBLISHED CLAIM: the gate read the DRIFT (size) while its sentence claims ATTRIBUTION ("the difference between them is not an accuracy change") -- they agree under the level reflection and part in the LOG FALLBACK, where over 300 panels the old gate fired on 101 whose difference was MAJORITY genuine, worst 68.6% of an 18.2% difference. MECHANISED: `panel_mirror_gap_difference_real`, `panel_mirror_yardstick_share` (BOUNDED -- the first cut read 283% where the contributions oppose), `panel_mirror_gap_difference_relative`, `YARDSTICK_SHARE_BAND` + `YARDSTICK_MATERIAL_DIFFERENCE` as a FOURTH and FIFTH constant, `GAP_RENDER_DP` vacuity on the DIFFERENCE not the pair. R15 SEVEN source mutations each firing its own named test, md5 byte-clean; THREE OF THE FIRST FOUR CONTROLS WERE THEATRE AND THE SWEEP SAID SO (bit-identical vacuity panel; a silent fixture whose contributions AGREED IN SIGN, making the shipped and discarded statistics identical; a fires test on a panel where the old gate fires too) -- each repaired by SEARCHING for the separating population. RESIDUAL NAMED: the `<=` boundary needs |yardstick| == |real| to the bit, a knife-edge no population sits on. NO PUBLISHED FIGURE OR CAVEAT MOVED. TWO OPENERS FOR THE NEXT HOUR: (1) the `weight_null` money totals are still published with no interval, and `panel_mirror_weight_artefact` -- a ratio of differences of two GBP SUMS, 0.6893 authored / 0.9043 drawn -- is what puts BOTH populations on MIRROR INCONCLUSIVE today; (2) THIS STORE FILE IS AT ITS CAP (98,386 B of 102,400 at HEAD before this entry, and the last nine entries average 5.4 KB), so the next Hour cannot record itself -- see WORKER_FINDING_THE_ATOMS_OWN_RECORD_STORE_IS_ONE_ENTRY_FROM_ITS_CAP_2026-08-11.md. FULL TEXT: docs/staging/WORKER_FINDING_A_SIZE_MEASURE_WAS_ANSWERING_AN_ATTRIBUTION_QUESTION_2026-08-11.md.'
- '2026-08-11 THE SEVENTH HOUR COULD NOT BE WRITTEN DOWN, so this tick built the thing that lets it be (worker tick, L2->L3 draw). NO SUBSTANCE FINDING AND NO LEVEL MOVE: the sixth Hour''s opener (the `weight_null` money totals published with no interval, and `panel_mirror_weight_artefact` putting both populations on MIRROR INCONCLUSIVE) is UNTOUCHED and is still the next Hour''s question. What was in the way is the sixth Hour''s OTHER opener: this store file was at 101,324 B of its 102,400 B cap with entries averaging 5,400 B -- 1,076 B of headroom, i.e. the next Hour on this atom would have red-gated tests/design/test_simplifications_store.py::test_every_file_within_size_bound merely by recording itself. ELEVENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT, and this time the thing was its own record.

  THE CLASS, which is why this was not fixed as an instance (R10): A BOUNDED CONTROL OVER A MONOTONIC APPEND-ONLY RECORD WEDGES THE LANE THAT KEEPS THE RECORD. Every drain in this store''s history moved a STOCK and left the FLOW running, so the same wedge came back one level down each time -- map `simplifications` -> this store (FM-1); map `*_note` -> the `map_notes` tenant (H32, back over the ratchet in 24h); map `evidence`/`expert_hour_findings` -> the `map_records` tenant (H41, and H27 wedged publishing on the per-atom cap a day later). At the wedge only two moves exist -- raise the number or launder the history -- and this project has refused both three times each. The third move is a ROLL.

  MECHANISED, not exhorted: the live file is kept under `ROLL_WATERMARK` (64 KiB) and older entries move VERBATIM AND IN ORDER into numbered per-atom chunks under `archive/`. It runs INSIDE `_write_tenants`, the sole write path, so no tick has to remember to drain. It takes from whichever unbounded list is largest -- `simplifications` AND the `map_records` lists -- because bounding one list and not its siblings is precisely H41''s defect re-run. Chunks are PACKED AGAINST THE SAME 100 KB BOUND and measured by the same check: an archive exempt from the ceiling would be the same defect wearing a new directory name, and `glob(''*.yaml'')` would have silently skipped a subdirectory -- a control going blind on the population it was widened for. Readers concatenate archive-then-live, so the register, its order and `simplifications_count` are identical either side of a roll; writers read the LIVE tenant only, because a writer reading the concatenated view re-inlines the archive on its next append and undoes the roll.

  WRITE ORDER IS CHOSEN: chunks before live, so an interruption can only DUPLICATE an entry, never lose one -- and `check_no_duplicate_entries` detects duplication, which is what makes that trade honest rather than a claim nobody can check. A record store fails toward keeping the record.

  MEASURED: this file 101,324 -> 63,341 B (22 entries archived, register still 31); H27_payment_belief_gap, which was ALSO past the watermark at 94,474 B and is the atom that actually wedged publishing on 2026-08-10, 94,474 -> 64,980 B (13 archived, register still 19). Verbatim proof: this atom''s simplifications, map_records and map_notes tenants all hash-identical to HEAD after the roll; H27''s register is HEAD verbatim as a prefix plus one entry an earlier uncommitted tick appended. Consumer proof: site/data/simplified.json regenerates payload-identical (timestamp only). 160 tests green across the store and all eight of its consumers.

  R15 -- NINE new controls, each firing on its own named defect: oversized ARCHIVE chunk (the fail-open the subdirectory creates); an entry in BOTH places, separately for the simplifications and the record tenant; an atom existing ONLY in the archive (a dead atom must not be able to hide there); the roll preserving the register verbatim while bounding every file; the roll draining the RECORD tenant; never emptying a tenant and never rolling PROSE; a second roll appending a new chunk rather than rewriting one; an append not re-inlining the archive; a single entry over the bound still RAISING (the roll must not become a way to absorb an entry that cannot be stored). Plus a TENTH standing control that is the point of the repair -- `test_the_live_store_has_roll_headroom` fires at the WATERMARK, not at the cap, because the ceiling test passed at 101,324 of 102,400 on the day the next Hour could not be written down. It landed RED on both real files and was cleared by draining them, not by moving the line: MAX_FILE_BYTES is still 100 KB, unraised, for the fourth time in this control''s history.

  OPENER FOR THE SEVENTH HOUR, unchanged: the `weight_null` money totals still carry no interval, and `panel_mirror_weight_artefact` (0.6893 authored / 0.9043 drawn) is what puts BOTH populations on MIRROR INCONCLUSIVE today.'
- '2026-08-11 THE SEVENTH EXPERT HOUR RAN ON THE QUESTION THE SIXTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DEFECT: the money channel''s fidelity term -- the one half of `panel_mirror_is_attributable` that actually fires on both published populations -- was a DIFFERENCE OF TWO POPULATION TOTALS standing in for an attribution the verdict it guards has made PER PREMISE since the fifth Hour. This is the THIRD Hour''s own repair (`_register_mad`, "an aggregate of differences, never a difference of aggregates") left undone in the money channel that the same Hour created, which is why it is filed as a CLASS and not an instance: a paired verdict acquires a fidelity gate, and the gate inherits the retired statistic because nobody re-asks what the new verdict is denominated in.

  OBSERVED, WITH EVIDENCE, BY RUNNING IT (twelfth time on this atom). The mirror moves the deciding margin in BOTH directions -- 1 premise up and 3 down of the 4 it moves at all on the authored panel, 10 up and 8 down of 18 on the drawn one -- so the sums cancel: 21.4% of the mirror''s per-premise movement is invisible to its own total on the authored panel and 39.6% on the drawn one, while the NULL''s cancels by a different 32.6% / 25.3%. The ratio of two differently-attenuated sums is not the attribution, and it errs in both directions: 68.9% published where the truth is 80.4% (authored), 90.4% where it is 73.1% (drawn). The failure is not academic: on 7 of 200 real 20-home subpanels drawn from this atom''s own published population the old shape PASSES the 50% band (32.9%, 41.7%, 44.7%, 47.7%, 49.3%, 49.996%, 44.7%) where the per-premise shape FAILS it (up to 65.1%) -- and a pass there means the row certifies the mirror and publishes ''no composition effect'' as a finding.

  THE SAME DEFECT AT THE OTHER END, which is why the sixth Hour''s two openers close as one mechanism: the sentence that justifies refusing the money verdict quoted the weight null''s two population totals (''GBP 29,722 epc / 12,835 inferred'') with no interval -- the aggregate rule the verdict stopped using two Hours earlier, offered as the ground for distrusting the per-premise one.

  MECHANISED, not exhorted. `_paired_margin_moves` measures both channels premise-by-premise across three panels (base, mirror, weight null), guarded on premise order and on non-finite movement, and the pairs are carried on the verdict as `margin_moves` so the point estimate and its interval are two readings of ONE measurement. The band is UNTOUCHED at 0.50 (R12 -- the statistic was wrong, not the threshold; MIRROR_WEIGHT_ARTEFACT_BAND has never been moved). The old answer is kept as `panel_mirror_weight_artefact_aggregate` alongside `panel_mirror_margin_cancellation` and `weight_null_margin_cancellation` -- TWO cancellation numbers, not one, because either channel cancelling on its own moves the ratio and on the suite''s passing fixture it is the NULL''s that does it (0.0% mirror / 31.4% null, 29.9% against 43.6%). The share now carries a 95% percentile-bootstrap interval on a THIRD named C-S2 substream, computed through the same `_artefact_share` function the gate reads, and `_bootstrap_mean_ci` is generalised to `_bootstrap_statistic_ci` so three published intervals share one resampling implementation rather than three copies that drift.

  R15 -- FIVE source mutations, each firing its own named test and nothing else: (1) the term reverted to the aggregate shape -- the per-premise test AND the zero-corner test fire; (2) the interval computed from a different expression than the gate reads -- the one-statistic test fires; (3) the sentence quoting the two totals again -- the disclosure test fires; (4) `_mean_abs` returning 0.0 on an empty panel instead of raising (the fail-open shape: ''the instrument disturbed nothing'' and ''nothing was measured'' are opposite readings) -- fires; (5) the premise-order guard removed -- fires. 234 tests green in `tests/harness/test_premise_two_level.py`, 79 across `test_couple_fabric.py`, `test_gap_ledger_reconciler.py` and `test_lcl_household_anchors.py`.

  NO PUBLISHED FIGURE MOVED: both gap headlines are unchanged (0.4269 epc / 0.4042 inferred), both populations were INCONCLUSIVE before and remain so, and what changed is the number the row gives as its reason (80% per premise, interval [73%, 122%], across the 4 of 15 premises the mirror moved) and the fact that it now says what the old rule said and why the two differ.

  OPENER FOR THE EIGHTH HOUR, and it is this Hour''s own deliberate non-move: the gate compares a POINT ESTIMATE to the band while the interval around it straddles the band on the suite''s own passing fixture (0.4364, 95% [0.219, 0.792]) -- a mirror certified attributable on evidence that cannot resolve which side it is on, which is the fourth and fifth Hours'' finding one level up from the verdict and applied to nothing yet. Moving a live gate onto an interval in the same Hour that repaired its statistic would change what is published for two reasons at once and neither could be attributed afterwards.

  ALSO OBSERVED, NOT FIXED HERE (queued, per SELF-INTERRUPT DISCIPLINE): `gap_ledger_reconciler` reports both fabric rows STALE on HEAD -- 3 commits touched `background/fabric_gap_ledger.py` / `tools/couple_fabric.py` since 442ecbd02, i.e. the previous three Hours each re-measured nothing. This tick re-runs the drawn population with `--write-ledger` AFTER landing the code, which is the only ordering under which the row can come out `current`.'
- "2026-08-11 THE EIGHTH EXPERT HOUR RAN ON THE QUESTION THE SEVENTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DEFECT: `panel_mirror_is_attributable` compared a POINT ESTIMATE to its band with no statement of whether the panel could resolve which side of it the artefact share sat on. THIRTEENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT -- every figure below came out of the tool on this atom's own published population.\n\n  MEASURED, ON REAL SUBPANELS OF THE POPULATION THE LEDGER PUBLISHES. That population's own share is 0.7307, comfortably above the 0.50 band, so every honest answer on a subpanel drawn from it is `unattributable` or `unresolved`. The point rule returned `attributable` on 50% / 37% / 30% / 15% of panels at n=20 / 30 / 50 / 100. On the worst of them the share was estimated from FOUR moved homes and its 95% interval was [0.000, 1.000] -- the whole of the range the band divides -- and the gate certified the mirror anyway. At n=100, 14 of 120 certified while carrying a DECISIVE money verdict, which is the case that costs a reader something: a certified mirror that does not flip publishes 'no composition effect' as a finding. THE SIGNATURE IS NOT THE FOURTH HOUR'S 'FLAT IN N' -- the point rule's error rate does fall with N. It is that the point rule NEVER LEARNS IT CANNOT RESOLVE: at n=100 the interval reading certifies 0 of 120 panels while the point rule still certifies 14.\n\n  MECHANISED AS THREE STATES, NOT TWO. `panel_mirror_weight_artefact_resolution` reads the interval (hi <= band -> attributable, lo > band -> unattributable, else unresolved); `panel_mirror_attribution` combines it with the register channel worst-first; `panel_mirror_is_attributable` is now `== 'attributable'`, so an unresolved panel never certifies. Collapsing `unresolved` into `unattributable` would publish 'the artefact is above the band' as a MEASUREMENT on a panel that measured no such thing -- one is a finding about the instrument, the other a statement about the evidence, and a reader acts differently on them (this mirror is the wrong instrument for this panel / get more homes). FAIL-CLOSED ON A MISSING INTERVAL, because an unavailable check is a FAILED check and a four-home panel is where a point estimate is worth least, not most -- with ONE exception, the exact zero corner where the mirror moved the margin on no premise and the share is a reading rather than an estimate. THE REPAIR IS ONE-DIRECTIONAL BY CONSTRUCTION: it can only take certification away, never grant it, so no verdict this gate released before is newly released now.\n\n  THE ALWAYS-RED CHECK WAS THE REAL RISK, AND IT WAS SEARCHED RATHER THAN ASSUMED. The suite's own proof that this gate can pass -- `test_the_WEIGHT_ARTEFACT_GATE_CAN_PASS_so_it_is_not_an_ALWAYS_RED_DETECTOR` -- rested on a panel reading 0.4711 on a 95% interval of [0.414, 0.561]: inside the band by 0.029, spanning it. So the demonstration that this control is not always-red was itself a panel that could not resolve the band. A resolved pass had to be found or the repair would have BEEN the defect: 700 draws of the flipping family, 13 flip a resolvable verdict into a different resolvable one, 8 of those are resolved-faithful, and `_flipping_population` now defaults to the tightest (60 homes, share 0.1690 on [0.123, 0.230] wholly under the band, largest premise 26% / 6%). The 2x2's flipped+faithful cell -- the one the whole mechanism exists to protect -- had been pinned on a panel that could not resolve the fidelity it asserts.\n\n  R15, SIX SOURCE MUTATIONS, md5 byte-clean restore (2ab549446cbef0b86e3ebe9f34d6444a), 9 green on the same selection unmutated: gate reads the point estimate again (the exact defect reinstated) / unresolved counts as a pass / a missing interval falls back to the point estimate / the disclosure keyed back to the point estimate / the exact zero corner forced through the interval / unresolved collapsed into unattributable. ONE SURVIVED THE FIRST SWEEP AND IT IS THE REUSABLE PART: the disclosure mutation -- which is the defect this Hour caught in its OWN repair an hour after landing it, a clause left on `share > band` while the gate had moved onto the interval, printing 'above the 50% band' and 'cannot resolve which side of the 50% band' in one sentence joined by 'and'. It survived because BOTH fixtures agreed between the two rules (one under the band and unresolved, one over it and resolved). A CONTROL SET WITH NO POPULATION WHERE THE CONTROLLED THING VARIES IS A CONTROL THAT CANNOT FAIL -- the sixth Hour's own finding, arriving inside the test written to pin the eighth's. The separating panel is not exotic: over the band point-wise, unresolved by interval, which is the shape of the row this atom ACTUALLY PUBLISHES (0.7307 on [0.359, 0.902]).\n\n  NO PUBLISHED FIGURE MOVED, CHECKED NOT ASSERTED. Both rows re-taken on their own declared population (--seed 17 --unit-rate 7.4 --population 200 --population-seed 17, read back off the row per the refresh_args mechanism) AFTER the code landed, which is the only ordering under which the row comes out current: gap 0.4269 / 0.4042, forgone GBP 548,919 / 451,832, misranked 11, declined 89 / 73, two-level still RED on L2.4_scale_spread_p90_p10 (the birth condition holding, not a regression). Both rows read attributable=False before and after. The whole ledger diff is measured_at, run_git_commit, the two new attribution fields, and the one caveat sentence whose CLAIM changed -- it said the artefact was measured above the band; it now says the panel cannot resolve which side of the band it sits on. W2_11 re-stamped itself concurrently via its own live writer and is not this tick's change. Suites: 238 in the atom's own file, 317 across it and its three siblings; epistemic_verifier PASS 553 files.\n\n  OPENER FOR THE NINTH HOUR, and it is what this Hour deliberately did not take. The REGISTER channel of the gate still has no interval at all: `panel_mirror_register_infidelity` is compared to its band as a bare point, exactly as the money channel was until today. It reads 0.000e+00 by algebra under the level-preserving reflection, so the question is not whether it is wrong but whether a term that is zero by construction on every branch either published population takes can carry half a gate -- the third Hour's own note that measuring an algebraically-zero quantity does not make it failable, never followed up. ALSO NAMED, NOT TOUCHED: `panel_mirror_weight_artefact` is called a SHARE and is not bounded by 1 (the authored row reads 80% on [73%, 122%]), because the sign flip can oppose the re-composition per premise -- readings over 1 are real and informative and the word 'share' does not admit them."
- "2026-08-11 THE NINTH EXPERT HOUR RAN ON THE QUESTION THE EIGHTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION was whether the REGISTER half of the gate, a bare point comparison that is zero by algebra on the branch both published populations take, can carry half a gate. THE EXPECTED ANSWER -- copy the eighth Hour's interval onto it -- IS REFUTED BY MEASUREMENT: that channel's fallback-branch statistic is a weighted mean to which EVERY premise contributes, so it concentrates fast (unresolved on 3 of 22 subpanels at n=20, 0 of 46 by n=50, against the money share's routine unresolution at n=100). Copying the mechanism would have been cargo. THE DEFECT IS ONE LEVEL UP FROM THE INTERVAL: THE TERM IS A MEAN AND THE PROMISE IT AUDITS IS UNIVERSAL. `_reflect_level` promises 'same ABSOLUTE error, opposite sign' about EVERY premise, so on that branch the honest value is exactly zero and a breach anywhere is a breached promise -- and it was audited by a panel mean against a 5% band, which reads 'the average home may move 5%' and on two hundred homes means 'nine homes may move completely'. The THIRD Hour closed the CANCELLATION in this term and left the DILUTION: an aggregate of differences is still an aggregate.\n\n  OBSERVED BY RUNNING IT, FOURTEENTH TIME ON THIS ATOM, with the defect injected at the reflection call inside `panel_mirror` rather than hand-built. PARTIAL FALLBACK (the confound the whole-panel rule exists to forbid): 9 of the drawn 200 premises and 4 of the authored 15 can be reflected by the WRONG RULE with the gate under its band and the mirror certified. WRONG PIVOT (the inferred prior instead of the register prior, a one-identifier bug): 65 of 200 (32.5%), worst home moving its own error by 1,825%, gate reading 4.50% and certifying. AND THE SIGNATURE, which makes it a class: hold the defect FIXED at one wrongly-reflected home and grow the panel -- mean 0.0022 / 0.0013 / 0.0008 / 0.0003 / 0.0002 at n=15/30/50/100/200 while the worst per-premise breach is 15.4% at every one. SENSITIVITY FALLS WITH N. The fourth Hour found a rule FLAT in N and the fifth one DECOUPLED from it; this is the third sibling and the worst-behaved, monotone in the WRONG direction -- the control gets blinder exactly as the population it guards gets better.\n\n  MECHANISED: `_register_breaches` (per premise, never averaged, carried on the verdict); `panel_mirror_register_worst_breach` (a promise is audited at its WORST violation, and its reading does not fall with N); `panel_mirror_register_breaching_premises` (a COUNT, because one wildly-moved home and forty mildly-moved ones are different events a share renders identically); `panel_mirror_register_channel` SPLIT BY BRANCH -- level uses the worst breach against a new SIXTH constant `REGISTER_PRESERVATION_TOLERANCE = 1e-9`, fallback keeps the mean against `MIRROR_FIDELITY_BAND` unchanged, because no absolute-error promise is made there and the worst-case shape would be always-red on an instrument behaving as designed. A PROMISE IS AUDITED AT ITS WORST VIOLATION; A CHARACTERISTIC IS SUMMARISED AT ITS MEAN. The tolerance is a NOISE FLOOR, not a tolerance for disturbance, calibrated with six orders of headroom either side (clean reflection's worst per-premise disturbance on the published rows 1.788e-15; smallest injected defect 15.4%). The DISCLOSURE is keyed to the channel and names the promise the branch makes, printing the mean as the thing that HID the breach and never as the ground for the refusal -- the eighth Hour's class applied before it could happen. ONE-DIRECTIONAL BY CONSTRUCTION: the worst breach is never below the mean, so this can only take certification away.\n\n  R15 SEVEN source mutations each firing its own named test, md5 byte-clean restore (745b02f2385887d7a81f829003dd6b43), 9 green unmutated: the level branch gated on the mean again (the exact defect, 5 tests) / the tolerance widened to the fidelity band / the FALLBACK branch put on the worst-case shape / an empty panel reading as 'disturbed nothing' / the premise-order guard removed / the zero-error corner made faithful-by-default / the disclosure keyed back to the mean. NOT ALWAYS-RED ON EITHER BRANCH, and the fallback half was SEARCHED rather than assumed: an 80-home panel with a register accurate to 1% and one rogue certificate forcing the fallback certifies at a mean of 0.0306 while its worst breach is 0.600 -- exactly the panel the worst-case shape would have wrongly refused. AND THE SUITE CAUGHT THE REPAIR'S OWN INHERITED CHECK WITHIN THE HOUR: the existing zero-corner test forced the gate red through `panel_mirror_register_mad`, and after the move it asserted nothing about the live gate while still passing -- the eighth Hour's class landing in the SUITE rather than in a sentence. Re-pointed, with the old assertion kept and inverted so the file records that the mean has no gate to fail on that branch any more.\n\n  NO PUBLISHED FIGURE MOVED, CHECKED NOT ASSERTED. Both rows re-taken on their own declared population (--seed 17 --unit-rate 7.4 --population 200 --population-seed 17, read back off the row per the refresh_args mechanism) AFTER the code landed: gap 0.4269 / 0.4042, forgone GBP 548,919 / 451,832, misranked 10/11, declined 89/73, two-level still RED on L2.4_scale_spread_p90_p10 (the birth condition holding, not a regression). Both rows read the register channel `attributable` and `attributable=False` before and after -- the money channel is still what refuses them. The whole ledger diff is measured_at, run_git_commit and the three new fields; W2_11 re-stamped itself concurrently via its own live writer. Suites: 325 passed 2 xfailed across the atom's file and its three siblings; epistemic_verifier PASS 553 files. R10 CLASSES: a universal per-premise promise cannot be audited by a panel mean (signature: sensitivity falls with N); a tolerance band on an EXACT claim is the wrong shape of thing, not a loose setting. OPENER FOR THE TENTH HOUR: `panel_mirror_weight_artefact` is called a SHARE and is not bounded by 1 (authored row 80% on [73%, 122%]) -- the eighth Hour named it, nobody has taken it, and it is now the oldest untouched item on this atom. ALSO NAMED: this atom now publishes THREE retained-but-superseded fidelity statistics whose only defence against being misread is their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_A_PER_PREMISE_PROMISE_AUDITED_BY_THE_PANEL_MEAN_2026-08-11.md."
- "2026-08-12 THE TENTH EXPERT HOUR RAN ON THE QUESTION THE NINTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- `panel_mirror_weight_artefact` is called a SHARE and is not bounded by 1 (authored row 80% on [73%, 122%]) -- IS REFUTED AS A DEFECT IN THE STATISTIC, AND CHASING WHERE THAT 122% CAME FROM FOUND THE REAL ONE. FIFTEENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT.\n\n  THE REFUTATION FIRST, MEASURED. The eighth Hour's reading was right: the ratio exceeds one where the null moves the deciding margin FURTHER than the mirror does, i.e. the sign flip opposes its own re-weighting, and those readings are real. Against the obvious replacement -- the sixth Hour's own bounded shape for `panel_mirror_yardstick_share`, |null| over (|null| + |mirror - null|) per premise -- the two are BIT-IDENTICAL on the drawn population and on all 800 real subpanels of it at n=20/30/50/100 (max delta 0.0000), and differ by 0.0367 on the authored one, crossing the band on neither. The algebra says why: where the channels share a sign and |null| <= |mirror| the two shapes are the same number identically. The bounded shape is also ALWAYS <= the shipped one by the triangle inequality, so adopting it could only GRANT certification. The statistic is left alone; the WORD was wrong, and \"reproduced\" does not admit 122%.\n\n  THE DEFECT: THE RESAMPLE GUARD COUNTED THE PANEL AND THE STATISTIC IS CARRIED BY A SUBSET OF IT. `panel_mirror_weight_artefact_interval` withheld itself on `len(margin_moves)` -- the panel's ROW COUNT -- while the share is mean|null| over mean|mirror| and a premise NEITHER channel moved contributes exactly zero to both sums. So a 200-home panel in which the mirror moved ONE home was, to the guard written to refuse an un-resamplable panel, a 200-home panel. THE AUTHORED PUBLISHED ROW IS BELOW THIS FILE'S OWN MINIMUM AND ITS GUARD PASSED: 15 rows, FOUR movers, MIN_HOMES_FOR_DIVERSITY = 5, and it published [73%, 122%].\n\n  MEASURED ON 1,200 REAL SUBPANELS of the drawn population, whose own share is 0.7307 -- above the band, so every certification granted on a subpanel of it is wrong by construction. 93 certified. 92 of the 93 (99%) came from panels with fewer than five movers, 83 (89%) from fewer than three, and 59 (63%) from a SINGLE moved home. At six movers and above, across 373 panels, none did. THE GUARD FIRED ON NONE OF THE 1,200, because every panel had 20-100 rows. AND THE WORST POINT IS DEGENERATE, WHICH IS WHY THE EIGHTH HOUR'S REPAIR COULD NOT STOP IT: where one premise carries the statistic, every resample containing it reads the same ratio and every resample missing it reads the 0/0 corner, so the percentile interval COLLAPSES TO ZERO WIDTH -- one mover of 20 rows gives [0.000, 0.100], four identical movers give [0.100, 0.100] -- and certifies wearing maximum confidence. The eighth Hour made this gate read the interval precisely so an unresolvable panel could not certify, and cited a four-mover [0.000, 1.000] as the pathology it was closing. Wide intervals get caught; narrow ones off four homes do not.\n\n  R10 CLASS: A GUARD SIZED ON THE PANEL CANNOT PROTECT A STATISTIC CARRIED BY A SUBSET OF IT. Signature: THE GUARD'S SUBJECT GROWS WITH N WHILE ITS EVIDENCE DOES NOT -- it gets more confident of its own sufficiency exactly as the panel grows and the moved fraction stays flat. Fourth sibling of the fourth Hour's FLAT-IN-N, the fifth's DECOUPLED-FROM-N and the ninth's SENSITIVITY-FALLS-WITH-N, and the first about a GUARD rather than a statistic. SIBLING, already this atom's: a repair applied to the verdict and not to the instrument that certifies it -- the fifth Hour built `largest_premise_share` because a money verdict can be one house; the seventh built this instrument's interval an Hour later with no equivalent and the eighth gated on it.\n\n  MECHANISED: `panel_mirror_artefact_evidence_premises` (premises where EITHER channel moved -- deliberately not `panel_mirror_moved_premises`, the mirror's movers only, which was the nearest thing to hand and undercounts exactly the premises that make the ratio explode); the guard reads it; THE CONSTANT IS UNTOUCHED (R12 and the ninth Hour's rule -- MIN_HOMES_FOR_DIVERSITY was already the right number for the right question and is the same subject its seven other uses give it, so this is NOT the sixth Hour's one-constant-two-subjects class, and calibrating a new constant off the table above would have been tuning a threshold to this population's outcomes, R13); ONE-DIRECTIONAL BY CONSTRUCTION (a withheld interval resolves `unresolved`, never a pass); the withheld-interval SENTENCE names the population that was counted, the eighth Hour's disclosure class applied BEFORE it could happen rather than an hour after; an over-100% clause closing the eighth Hour's named item; and the diluted per-premise figures now say what they are -- the sentence printed \"GBP 230 of 314 per premise ... across the 18 of 200 premises the mirror moved\" while both means are over all 200 and the figure per premise the mirror ACTUALLY moved is GBP 3,494, 11.1x on the drawn row and 3.7x on the authored one, with the sentence itself supplying the count a reader would multiply by. The evidence count rides in the ledger row, because the guard counting the wrong population was invisible for three Hours precisely because nothing printed the right one.\n\n  R15 SIX SOURCE MUTATIONS each firing its own named test, md5 byte-clean restore (a5973d0834791eec882188be2956e40f), 8 green on the same selection unmutated: guard counts panel rows again (the exact defect, 4 tests) / evidence count counts the mirror's movers only / the withheld-interval sentence keyed back to the panel / the over-100% explanation dropped / a withheld interval falls back to the point estimate (the fail-open shape, 4 tests) / the diluted figures presented as the movers' own again. NOT ALWAYS-RED, CHECKED NOT ASSUMED: the eighth Hour's own searched not-always-red population `_flipping_population` carries 29 movers and still certifies -- had it carried four, this repair would have deleted the demonstration that the control it guards can pass.\n\n  NO PUBLISHED FIGURE MOVED, CHECKED NOT ASSERTED. Both rows re-taken on their own declared population (--seed 17 --unit-rate 7.4 --population 200 --population-seed 17, read back off the row per the refresh_args mechanism) AFTER the code landed: gap 0.4269 / 0.4042, forgone GBP 548,919 / 451,832, misranked 10/11, declined 89/73, two-level still RED on L2.4_scale_spread_p90_p10 (the birth condition holding). The drawn rows carry 18 movers so their interval [36%, 90%] and resolution `unresolved` are unchanged; the whole ledger diff is measured_at, run_git_commit, the one new field and the one clause naming its denominator. W2_11 re-stamped itself concurrently via its own live writer. ONE CLAIM DID CHANGE, on the AUTHORED panel: it said \"95% interval [73%, 122%]\" and \"above the 50% band\" and now says \"too few premises carry it to resample (4 moved either channel, under 5)\" and \"cannot resolve which side\" -- attributable False before and after, but the row no longer claims to have MEASURED what it estimated off four homes. Suites: 252 passed 2 xfailed in the atom's own file, 79 across its three siblings; epistemic_verifier PASS 555 files.\n\n  OPENER FOR THE ELEVENTH HOUR: the REGISTER channel's own evidence count has never been asked for. The ninth Hour put its level branch on a WORST-CASE over premises, which needs no resample and so escaped this Hour; its FALLBACK branch is still a panel mean against MIRROR_FIDELITY_BAND with no interval and no statement of how many premises carry it, and the ninth Hour's own subpanel measurement of it was taken on a branch neither published population enters -- a term measured only where it never runs is the third Hour's algebraically-zero note in a new place. ALSO NAMED: this atom now publishes FOUR retained-but-superseded fidelity statistics whose only defence against being misread is their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_THE_RESAMPLE_GUARD_COUNTED_THE_PANEL_NOT_THE_EVIDENCE_2026-08-12.md."
