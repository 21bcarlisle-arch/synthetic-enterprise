- '2026-08-12 THE TWELFTH EXPERT HOUR RAN ON THE QUESTION THE ELEVENTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- what is the RIGHT BAND for `panel_mirror_register_infidelity` now that it is known to be a reading of the stock rather than of the mirror -- IS THE WRONG QUESTION, AND NO THRESHOLD WOULD HAVE FIXED IT. SEVENTEENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT. THE DEFECT, IN THE BRANCH''S ENTRY CONDITION. `_level_reflection_is_feasible` fails exactly when `2*epc <= actual`, i.e. when that home''s relative register error is at least 0.5 -- TEN TIMES the band the fallback branch''s bluntness gate compared its mean to. So the branch only ever runs on a panel containing such a home, no panel on it can be free of one, and the eleventh Hour''s identity says the gate is a mean of relative errors WEIGHTED BY ABSOLUTE ERROR, so that home is inside the reading and cannot be outside it. MEASURED, on the SAME rogue home 60% out in every panel, ten homes each: it carries 95.0% of the gate''s weight beside neighbours certified to 0.1% (gate 0.5701), 65.6% beside 1% (0.3969), 16.0% beside 10% (0.1800) and 8.7% beside 20% (0.2348) -- where it is not even the heaviest home, a larger house that is LESS wrong outweighing it. And holding the composition rule fixed while growing the panel: 0.5701 at n=10, 0.3503 at 40, 0.1142 at 100, 0.0344 at 200 -- crossing its band -- while the median home''s error is 0.0010 at every one of them. The reading is neither the worst home nor the typical one; it is how wrong the home you would land on is, if you sampled homes in proportion to their error. THE COST. Twelve stocks on this branch (register 30% under to 30% over, one rogue each): the branch''s own promise kept to 1.1e-16--2.2e-16 on ALL TWELVE, the retired rule refusing ALL TWELVE, while the MONEY channel underneath -- the one denominated in the unit the verdict is published in -- had already resolved `attributable` on FIVE of them with an artefact share of exactly 0.0000. This is the THIRD Hour''s law read in the other direction: a term denominated in kW/K cannot CERTIFY a GBP verdict (that Hour''s repair) and cannot REFUSE one either (left standing for nine Hours). MECHANISED. `panel_mirror_register_refusal` is now empty-or-fault and says one thing in one unit on both branches (each branch''s own exact per-premise promise at its worst breach, against the float-noise floor). `panel_mirror_register_bluntness` carries the retired reading, DISCLOSED, published on the fallback branch only and None on the branch that does not produce it. `_bluntness_caveat` moves the sentence OUT of `_why_unattributable` -- where it could only be read by someone already being told the mirror had failed (the second Hour''s own COMPOSITION-DECIDED finding, one level down) -- so it prints on rows the mirror CERTIFIED, says ''disclosure, not a refusal'' in its first clause, and keeps the raw MAE pair. Band and constants UNTOUCHED: re-calibrating a statistic that answers the wrong question is the shape this Hour is about. THIS HOUR GRANTS CERTIFICATION, which no previous Hour did, and it is counted: five of twelve certified and they are exactly the five the money channel had resolved at 0.0000; the other seven still refused in GBP (four unresolved, three unattributable). FIVE TESTS REWRITTEN, NONE DELETED -- three asserted blunt-means-unattributable directly and two pinned a controlled comparison on a mirror ''unfaithful'' only in the blunt sense; both of the latter now pin it on a genuinely BROKEN mirror injected at the reflection call, which is a stronger control than they were. R15: eight source mutations each firing its own named test (gate reads bluntness again; fault stops gating on the fallback; disclosure dropped; bluntness keyed to the noise floor; bluntness published on the wrong branch; disclosure drops its raw pair; disclosure loses its not-a-refusal marker; bluntness can never fire), md5 byte-clean ce4df81304cf77627b5fe6374ba4ca69. Not always-on, searched: an 80-home panel accurate to 1% with one rogue discloses nothing. 265 passed / 2 xfailed (was 259), 79 across siblings, 15 in site/proof, epistemic PASS 555 files. No published figure moved: gap 0.4269/0.4042 unchanged, whole-ledger diff is two added null keys plus measured_at and run_git_commit. R10 CLASSES. (1) A GATE MAY NOT BE COMPUTED FROM ITS OWN BRANCH''S ENTRY CONDITION -- where the condition selecting a branch also determines the statistic that branch is judged by, the population the control is allowed to see has been filtered on the quantity it reads; signature: the reading has a floor set by the selection rule and moves with the size of the panel around it rather than with the property it names. Fourth in this atom''s denominator/unit run after SENSITIVITY-FALLS-WITH-N (ninth), GUARD''S-SUBJECT-GROWS-WITH-N (tenth) and A-BRANCH''S-GATE-MUST-AUDIT-ITS-OWN-PROMISE (eleventh). (2) A REPAIR MADE IN ONE POLARITY IS NOT MADE: when a rule is established about what a control may CONCLUDE, it must be re-asked of the opposite conclusion in the same pass. OPENER FOR THE THIRTEENTH HOUR: both branches now gate on a worst-breach test, and nothing has ever asked what happens when a panel the level reflection is feasible for on 199 of 200 premises falls WHOLLY to the log form on the strength of one home -- the instrument the other 199 are judged by changes because of a home that is not them, and the whole-panel rule''s two-instrument defence has never been measured against that cost. Also still open: FOUR retained-but-superseded fidelity statistics defended only by their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_THE_GATE_WAS_THE_BRANCHS_OWN_ADMISSION_TICKET_2026-08-12.md.'
- '2026-08-12 THE THIRTEENTH EXPERT HOUR RAN ON THE QUESTION THE TWELFTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- what happens when a panel the level reflection is feasible for on 199 of 200 premises falls WHOLLY to the log form on the strength of one home -- IS ANSWERED YES, THE COST IS REAL AND WAS NEVER MEASURED. THE DEFECT: `_level_reflection_is_feasible` is a THRESHOLD, so `panel_mirror`''s instrument is a STEP FUNCTION OF THE WORST CERTIFICATE IN THE PANEL. MEASURED on the drawn 200 by walking its worst home across `2*epc == actual` and moving nothing else -- a TWO-PARTS-PER-MILLION change in one register: premises breaching the level promise 0 -> 175 of 200, worst breach 1.79e-15 -> 4.26 (426% of a home''s own error), register MAE 0.044774 -> 0.074085 kW/K, mirror money +296 -> +341 GBP per premise. None of the other 199 homes moved. Holding the population fixed and switching only the instrument: drawn 200 +15.4% on the mirror''s money reading (yardstick share 1.0 -> 0.377), authored 15 +42.9% -- and the direction is not consistent, the fallback flattering the mirror on one published population (gap-difference-relative 0.124 -> 0.030) and damning it on the other (0.019 -> 0.206). NOT HYPOTHETICAL: the published draw''s worst register ratio is 1.7371 against a cliff at 2.0, and five seeds under identical drawing rules read 1.7371 / 1.7371 / 1.8585 / 1.8585 / 2.0828 -- the fifth genuinely takes the branch, one home of 200 forcing it, switch cost GBP 56 per premise. WHAT THE ROW COULD NOT SAY: `panel_mirror_reflection` has always NAMED the instrument and nothing said what the naming was worth; the counterfactual is a second pass over the same homes and both existing channels are computed on the branch taken. THE ALTERNATIVE THE DOCSTRING NEVER NAMED is EXCLUDE-AND-DECLARE, and it is REFUTED by measurement rather than argument: excluding the forcing home moves the BASE money reading by GBP 138 per premise (27%) because the excluded home is by construction the most-wrong home, against the instrument switch''s GBP 45 -- both roads cost, the fallback''s is the smaller one and was the unmeasured one, so the rule stands and its price is published. MECHANISED: `instrument_switch` prices the switch on the premises that did NOT force it, BOTH READINGS ON THE SAME ROWS so the difference is the instrument and not the population; `panel_mirror_switch_*` (borne_by, cost, published, counterfactual, error bar, counterfactual INTERVAL, favours) and `panel_mirror_instrument_channel` in the ledger row; `_switch_cost_caveat` printing on rows the mirror CERTIFIED as well as refused (the twelfth Hour''s rule applied on the way IN); the channel a THIRD input to `panel_mirror_attribution`, refusing on two grounds both in GBP and neither against a new constant -- different arms, or cost past the published reading''s own 95% error bar -- with an unmeasurable cost `unresolved`, never clean. THE FIRST ANSWER WAS WRONG AND THAT IS THE SECOND FINDING: searched on 4,600 REAL subpanels of the drawn population each carrying a forcing home, cost/error-bar never exceeded 0.332 and the arms never differed, so the gate was written off as unfirable and demoted to a bare disclosure -- and it fires at 2.46x on the suite''s OWN searched flipping population with one forcing home, whose register understates UNIFORMLY so the distortion is systematic and does not cancel, while the drawn population''s errors are mixed in direction (74 of 200 over-state) and largely do. The gate is restored. Where the instruments DO disagree (130 of 1,500 synthetic, 3 of 3,000 real) it is ALWAYS a RESOLUTION crossing and NEVER two different resolved arms, which is why the counterfactual''s interval is published beside its point. R15: NINE source mutations each firing its own named test, all red, md5 byte-clean (93dc9265b2b998478ce74f457ca6ffe1 pre-interval-change). ONE SURVIVED THE FIRST PASS AND THE SURVIVAL IS THE LESSON: the shared-substream mutation, because a bootstrap POINT estimate is the sample mean and does not move with the seed, so the cost was identical under either wiring and the C-S2 justification written in the source was FALSE AS BUILT -- fixed by publishing the counterfactual''s INTERVAL, the only observable place, and not its half-width, which coincides to the bit across those two streams. NOT ALWAYS RED on synthetic AND real data: 97 of 600 randomised fallback draws certify non-degenerate, the real seed-21 population at 0.222. NO PUBLISHED FIGURE MOVED: 0.4269 / 0.4042 unchanged, whole-ledger diff is eight added keys (all None on the level branch bar `panel_mirror_instrument_channel: attributable`) plus measured_at and run_git_commit. 274 passed / 2 xfailed (was 265), 353 across the atom and its three siblings, ruff clean, epistemic PASS 555 files. R10 CLASSES. (1) A THRESHOLD THAT SELECTS AN INSTRUMENT MAKES THE READING DISCONTINUOUS IN THE SELECTING VARIABLE, and a field naming which instrument produced a reading is a LABEL, not a disclosure -- signature: an epsilon change in one member of the population changes every other member''s measurement. (2) A NOT-ALWAYS-RED SEARCH RUN ON ONE POPULATION''S SUBPANELS ANSWERS A QUESTION ABOUT THAT POPULATION -- subpanels share the structure that makes the control quiet, and it nearly cost this Hour its own gate. (3) A C-S2 SUBSTREAM CLAIM IS ONLY A DISCIPLINE IF SOMETHING PUBLISHED MOVES WITH IT. OPENER FOR THE FOURTEENTH HOUR: the instrument channel refuses when the two readings name different arms, and every disagreement measured is a RESOLUTION crossing in which one side says `neither` -- so the gate refuses a row for having had LESS evidence under an instrument it did not use, and in 31 of 130 measured cases the direction runs the other way. Whether a resolution crossing should refuse at all, and whether its two directions are the same finding, has not been asked. Also still open, now the oldest item on this atom: FOUR retained-but-superseded fidelity statistics defended only by their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_ONE_HOMES_CERTIFICATE_CHANGED_THE_INSTRUMENT_FOR_THE_OTHER_199_2026-08-12.md.'
- '2026-08-12 THE FOURTEENTH EXPERT HOUR RAN ON THE QUESTION THE THIRTEENTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- should a RESOLUTION CROSSING refuse at all, and are its two directions the same finding -- IS ANSWERED YES AND ONE-FINDING-TWO-CLAIMS, BUT IT COULD NOT BE ANSWERED AS POSED, because on the panels it was asked about the crossing was not a disagreement between instruments at all. THE DEFECT: `InstrumentSwitch.resolution`''s direction half says ''the two instruments name DIFFERENT ARMS ... which needs no threshold to read'', and the threshold it was reading is the MOVER COUNT. `favours` is `neither` iff the 95% bootstrap interval contains zero; a paired money advantage is EXACTLY 0.0 on every premise both arms forgo the same money on; so for m movers in n rows P(a resample draws none) is (1-m/n)**n -> e**-m = 36.6/13.2/4.7% at m=1/2/3 against a 2.5% tail, and 1.65% at m=4. MEASURED WITH GBP 1,000,000 ON EVERY MOVER: three movers read GBP -37,975 per premise and name `neither`; four name `epc`. BELOW FOUR MOVERS A PAIRED MONEY VERDICT CANNOT NAME AN ARM HOWEVER MUCH MONEY IS ON IT, and no panel size repairs it -- the limit does not depend on n (0.0388 at n=20, 0.0496 at n=1,000), so a BIGGER panel makes a three-mover verdict LESS resolvable and a guard sized on the panel has the sign of its own protection backwards. THE GATE''S OWN FIXTURE FOR THAT HALF WAS ONE OF THESE: `_disagreeing_forced_population`, searched for and shipped by the thirteenth Hour, carries FOUR movers on the published reading and THREE on the counterfactual of 79 borne homes, the counterfactual''s interval ending at exactly 0.0 -- the ''different arms'' is the count crossing 3->4, on a money difference of GBP 38 against an error bar of GBP 171. HOW MUCH OF THE GATE THIS WAS, 5,000 fresh fallback draws: 1,003 disagreements, ZERO of them two different resolved arms (reconfirming the thirteenth Hour on an independent sample), and only FIFTEEN with both readings carried by MIN_HOMES_FOR_DIVERSITY or more -- 98.5% of what the direction half fired on was the mover count. AND THE FAIL-OPEN IS THE LARGER HALF: of 3,000 draws, 2,373 rows have a reading carried by under five movers and 1,930 of them CERTIFIED, 1,682 off a reading carried by one home or none; in its purest form, where both arms forgo identical money everywhere, both readings are exactly GBP 0.00 with a zero-width interval and the magnitude half asked `0.0 > 0.0` and said `attributable` -- R15''s second killer pattern by name. THAT REACHES THE TWELFTH HOUR''S RELEASE: all five stocks it certified and counted have carried_by == (0,0), so they were released into a GBP channel with no GBP in it; its own claim (no row refused by a kW/K reading, its channel still saying either word across the twelve) is untouched, ten of the twelve now stop at `unresolved`, and the two whose register OVER-states, six carrying homes each, still certify. THE ANSWER TO THE DIRECTED QUESTION, AND IT INVERTS: among all 1,003 crossings the reading the row USED is the one that names an arm, 935 to 68; among the fifteen carriable ones it is 1 to 14 -- the instrument the row actually used made it LESS decisive, not more. The thirteenth Hour flagged that minority direction as unexamined; once the artefact is removed it is almost the whole population, which is why the refusal sentence now NAMES its direction instead of asserting the majority one. MECHANISED: `carried_by` (the movers behind each reading, off the two MoneyVerdicts already computed -- no new bootstrap, no new constant); `resolution` returning `unresolved` when either reading is carried by under MIN_HOMES_FOR_DIVERSITY movers, CHECKED BEFORE BOTH EXISTING HALVES so a thin panel is never told a real mechanism decided it; `panel_mirror_switch_carried_by` in the ledger row; the carriage printed in `_switch_cost_caveat` (on certified rows too, the twelfth Hour''s rule) and in `_why_unattributable`''s new clause; `_disagreeing_forced_population` RE-SEARCHED onto one of the fifteen carriable crossings (79 borne, 8 and 9 movers, cost GBP 48 inside a bar of GBP 123, still firing the arms half WITHOUT the magnitude half) with the old one KEPT as `_thin_disagreeing_forced_population` and pinned as the defect; the stock-coarseness disclosure test repointed off a carried_by==(0,0) row onto one with 11 and 7 carrying homes. ONE-DIRECTIONAL BY CONSTRUCTION (`unresolved` is not a pass), proven over a searched family rather than asserted. NOT ALWAYS RED on synthetic OR real data: 627 of 3,000 draws are carriable on both readings, 445 certifying and 182 refusing. NO PUBLISHED FIGURE MOVED, measured end-to-end by A/B of tools/couple_fabric.py against committed HEAD on BOTH published populations: one added key (`panel_mirror_switch_carried_by: null`, both on the level branch where the quantity does not exist) and ZERO moved values; gaps 0.4269/0.4042 and 0.2184/0.2624 unchanged. R15: NINE source mutations -- guard counts the panel / clause deleted / reads `max` / checked after the arms half / off by two / zero-carriage reads clean / sentence loses its direction / carriage clause reports one reading twice / disclosure drops the carriage -- each firing its own named test, all RED, md5 byte-clean (993754f85490764fd7fd8080ddf73a44). 284 passed / 2 xfailed on the atom (was 274/2), 397 passed / 2 xfailed across it and its four sibling suites, ruff clean, epistemic PASS 557 files. R10 CLASSES. (1) A LABEL COMPARED TO A LABEL INHERITS THE THRESHOLD THAT MADE THEM -- ''needs no threshold to read'' was true of the comparison and false of its operands; signature: a gate fired on a difference in CLASSIFICATION that no difference in QUANTITY supports. (2) A GUARD SIZED ON THE PANEL CANNOT PROTECT A STATISTIC CARRIED BY A SUBSET -- the TENTH Hour''s class recurring verbatim in a channel built three Hours after it was closed on a different statistic; the eleventh Hour ASKED it of its own term and correctly found it did not reach, the thirteenth built a new resampled statistic and did not ask. (3) A CONTROL THAT COMPARES CAN PASS ON TWO ZEROES: `0.0 > 0.0` is False and False reads as clean. OPENER FOR THE FIFTEENTH HOUR: the guard uses MIN_HOMES_FOR_DIVERSITY on the movers while the algebraic floor for naming an arm at all is FOUR, so a five-mover reading is certified with one home of headroom and nothing measures how close to that floor a certified reading sat; nor whether `borne_by` should be published beside it as a RATIO (nine movers of 59 is a different object from nine of nine). Also still open, now the oldest item on this atom: FOUR retained-but-superseded fidelity statistics defended only by their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_THE_ARMS_HALF_OF_A_GATE_WAS_READING_THE_MOVER_COUNT_2026-08-12.md.'
- '2026-08-12 THE FIFTEENTH EXPERT HOUR RAN ON THE QUESTION THE FOURTEENTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- the guard reads MIN_HOMES_FOR_DIVERSITY on the movers while the algebraic floor is FOUR, nothing measures how close to it a certified reading sat, and should `borne_by` be published as a RATIO -- IS ANSWERED YES ON BOTH HALVES, AND THE SHARPEST THING THE HOUR FOUND IS THAT ITS OWN FIRST EVIDENCE WAS IN THE WRONG UNIT. EIGHTEENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT.    HALF ONE, MEASURED. `MIN_HOMES_FOR_DIVERSITY` is an input sufficiency floor on a PANEL -- what `between_home_correlation` and `timing_diversity` refuse to judge below -- and is five; the movers a paired percentile bootstrap needs before `favours` can exclude zero is the smallest m with e**-m under the 2.5% tail, m > ln(2/alpha) = 3.689, therefore FOUR. Two subjects, one constant, adjacent by coincidence (the sixth Hour''s class). Of 164 rows certified across 1,200 randomised fallback draws, 23 are carried by exactly five movers and 37 by six -- 14% ON the floor, 37% within one home of it -- and the row never said so.    HALF TWO, AND THE MEASUREMENT IS THE ARGUMENT. Appending 200 homes BOTH ARMS TREAT IDENTICALLY to this atom''s own certifying fixture (inferred belief equal to the register, same interval, same basis, paired advantage exactly 0.0, carrying neither reading) changes nothing about the instrument comparison and moves the published per-premise cost from GBP 292 to GBP 66 -- a factor of 4.4 -- while the ratio the gate actually reads moves 0.4523 to 0.4291, 5.1%. The number the reader sees is not the number the gate reads, and only one of the two is dilution-invariant.    THE CONCENTRATION GUARD WAS NOT BUILT, AND WHY IS THE FINDING. `carried_by` is a COUNT guarding a weighted MEAN, so the eleventh Hour''s Kish effective sample size was the obvious next move, and the concern is REAL: over 500 draws 24% of certified rows have effective carriage below the guard''s own number and 1.5% below the algebraic floor, the searched worst case certified at carried_by == (8,5) with an effective carriage of 3.11. THE EVIDENCE FOR BUILDING IT WAS ASSEMBLED IN THE WRONG UNIT. Asked as ''does the CHANNEL''S RESOLUTION change when the heaviest carrying home is removed'', it is 94% of low-carriage certified rows against 14% of the rest -- enough to ship a guard on. Asked in GBP -- does either arm change, or the cost move past its own 95% error bar -- it is 6% against 2%, SAME ROWS SAME REMOVALS; on the fixture, both arms stay epc/epc and the cost moves GBP 51 against a bar of GBP 544. The 94% was the raw-count guard tripping on the row it already gates: any row at margin 0 unresolves when a mover goes, whatever the money does. R15''s first killer pattern with the guard as its own evidence, and the THIRD Hour''s law (judge a verdict in the unit it is published in) in a new place. Pinned as a refutation so the sixteenth Hour does not re-derive it.    MECHANISED: `_mover_floor_for_a_named_arm(alpha)` DERIVED from `MONEY_VERDICT_ALPHA` (MOVER_FLOOR_FOR_A_NAMED_ARM 4, CARRIAGE_MARGIN_HOMES 1, CARRIAGE_FLOOR 5 -- SAME NUMBER as the constant it replaces so no verdict moved, different SUBJECT so a panel floor re-tuned for its own reasons can no longer reach the money guard, proven by mutating MIN_HOMES_FOR_DIVERSITY and not by reading its value); `carriage_margin`, `cost_ratio` and `carriage_share` on the switch and `panel_mirror_switch_carriage_margin` / `panel_mirror_switch_cost_ratio` in the ledger row; a zero margin printed IN WORDS (''AT -- one home of these becoming a tie unresolves this comparison without any money moving'') because a zero in a list of counts is the easiest thing to skim past and the only one that changes what the certification means; `cost_ratio` None and ''unformable'' on a zero error bar, never 0.00x; both sentences carrying it, the disclosure on CERTIFIED rows too (the twelfth Hour''s rule).    R15 TEN source mutations each firing its own named test, all RED, md5 byte-clean da3ae4ece4858ac7710df85384b83060 -- margin folded to zero / floor off by one / floor written as a literal / the guard reads the panel constant again / margin measured from the wrong floor / an unavailable margin reads as ample / a zero bar fails open to 0.0 / the reading published as a DIFFERENCE / a zero margin printed as a bare integer / the disclosure drops the ratio. ONE SURVIVED THE FIRST PASS AND THE SURVIVAL IS A SECOND LESSON: the difference mutation passed because the dilution test divided a relative move by a SIGNED base, and a negative base passes every comparison -- both denominators are now absolute and the test compares the two moves (77% against 5.1%) rather than a tolerance somebody picked. NOT ALWAYS RED, searched: the certifying fixture still certifies at margin 2, 50 of 66 certified rows sit at or above the floor''s effective equivalent. NO PUBLISHED FIGURE MOVED, A/B of tools/couple_fabric.py --json against committed HEAD in TWO CLEAN CHECKOUTS (a dirty tree is not a baseline): on both published populations exactly two added keys, both null on the level branch, and ZERO moved values; gaps 0.4269/0.4042 and 0.2184/0.2624 unchanged. 293 passed / 2 xfailed on the atom (was 284/2), 372 passed / 2 xfailed across it and its siblings, ruff clean, epistemic PASS 557 files.    R10 CLASSES. (1) A LEAVE-ONE-OUT JUDGED BY THE GATE''S OWN VERDICT MEASURES THE GUARD, NOT THE READING -- signature: a sensitivity study whose outcome variable is the classification the control produces rather than the quantity it is about; it reports the threshold''s own discontinuity as evidence for the threshold, at any threshold. (2) A CONSTANT BORROWED FROM AN ADJACENT SUBJECT HIDES BEHIND AGREEING BY COINCIDENCE: four and five are one apart, so nothing ever read wrong and the coupling is invisible until the other subject moves. (3) A CONTROL''S INVARIANCE CAN HIDE BEHIND A PUBLISHED FIGURE THAT IS NOT INVARIANT -- the gate read a scale-free ratio and the row published a scale-dependent point.    OPENER FOR THE SIXTEENTH HOUR: the margin is published and the resolution it describes still steps at zero, so the row now DISCLOSES a discontinuity it does not otherwise treat -- nothing has asked whether a row at margin 0 should be certified with a qualifier rather than cleanly, nor whether the two readings'' margins should be published separately (3 and 0 on the searched fixture, only the minimum reported). Also still open, now the oldest item on this atom: FOUR retained-but-superseded fidelity statistics defended only by their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_A_LEAVE_ONE_OUT_JUDGED_BY_THE_GATES_OWN_VERDICT_MEASURES_THE_GUARD_2026-08-12.md.'
- '2026-08-13 THE SIXTEENTH DRAW ASKED THE QUESTION THE FIFTEEN BEFORE IT NEVER DID -- NOT ''IS THE CRITERION MET'' BUT ''CAN ANY FUTURE DRAW MEET IT'' -- AND THE ANSWER IS NO, SO THE LEVEL MOVES 2->3 WITH THE RESIDUAL CLOSED AS UNPAYABLE-HERE (worker tick, L2->L3 draw). NINETEENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT, and the thing run this time was the atom''s own record.    THE MEASUREMENT THAT IS THE FINDING. Fifteen Expert Hours have run on this atom. Every one found something real, mechanised it, and closed with ''THE LEVEL STAYS 2''. The level has never moved. Hours 3 through 15 are an UNBROKEN CHAIN in which each Hour''s directed question is authored verbatim by the previous Hour''s closing paragraph -- ''THE QUESTION THE Nth LEFT'' -- and every one of those thirteen questions is inside the `panel_mirror_*` attribution machinery, not inside the fabric two-level test or the gap metrics this atom is named for. An Hour whose protocol requires it to leave an opener cannot be the thing that closes an atom; the exit criterion regenerates itself, and fifteen consecutive draws is the evidence rather than the argument.    THE OTHER TWO CRITERIA ARE ONE ACQUISITION, AND AN ACQUISITION IS NOT A BUILD. Residual (a) L1.4 MAGNITUDE and residual (b) L1.2h heating-shape repeatability were carried as separate open items for four ticks. They are not separate: both `Band.anchor_source` strings in `fabric_gap_ledger` name the SAME blocker in the same words -- a metered panel with PER-DAY half-hourly readings, SERL or the LCL trial''s raw partitioned archive. Verified from the file and not from the string that describes it: `data/lake/lcl_household_load_shapes_2013/household_shapes_and_archetype_2013.csv` holds 304 households and EXACTLY {LCLid, stdorToU, mean_daily_kwh, archetype_k2} + wd_0..47 + we_0..47 -- annual means, zero columns beyond that set, no date or day key. There is no network in autonomous runs and SERL is an application, not a fetch. No BUILD draw on this box closes either band, which is the empty-feasible-set defect Rule 0 names.    WHAT IS NOT A RESIDUAL, AND SAYING SO IS HALF THE CLOSE. Residual (c), L2.4 scale spread RED, is DELIVERY. The atom''s own name asks for a standing failable control LANDED RED AGAINST THE CURRENT GENERATOR; a red L2.4 is that control working, and the question it asks is a GENERATOR question owned by W1_12_premise_trace_generator, which is already L3/harden with `background/fabric_gap_ledger.py` in its own file_scope. Carrying another atom''s red as your own open exit criterion is how an atom inherits a blocker it cannot spend against.    MECHANISED, AND KEYED TO A LIVE PREDICATE RATHER THAN A SENTENCE. The reason the two bands cannot be anchored is a claim about a FILE, and a later tick can change that file -- a written-down ''unpayable here'' would then be false with nobody re-reading it, which is the prose-only rule CLAUDE.md says evaporates. So: `lcl_household_anchors.per_day_half_hourly_panel_is_available` derives the answer from the panel''s own header every time it is asked, `unpayable_here_bands` returns the blocked pair or `()`, and the map carries `infeasible_here` with the predicate''s IMPORT PATH so a reader can run it instead of believing it. The forcing function is `test_the_map_and_the_live_predicate_agree_about_what_this_box_cannot_pay_for`: the day a per-day panel lands the predicate returns `()`, the map still claims two blocked bands, and the disagreement REDS. That red IS the re-open, and the test says so in its own docstring rather than leaving a future reader to infer it. THE PRIOR ART WAS A TEST, NOT A PREDICATE: `test_the_panel_STILL_CANNOT_close_L1_4s_magnitude_question` already re-derived this and is deliberately LEFT ALONE re-deriving it inline, because that file''s whole discipline is that a re-derivation sharing the code it checks asserts nothing -- what was missing was a READABLE predicate outside the test, which is exactly the OPS2 shape (`PHASE_CEILING_IS_SUFFICIENT` existed and nothing outside its own module read it).    FAIL-CLOSED IN THE DIRECTION THAT COSTS, NAMED. The expensive error here is reporting UNPAYABLE when the work is in fact available, because that is what excuses the atom from the BUILD queue. So a missing, empty, unreadable or short-column panel RAISES through `load_panel` and never takes the unpayable branch by default: ''the data never came'' and ''I could not look'' are the same silence and opposite facts.    R15 SEVEN SOURCE MUTATIONS, each firing its own named test, ALL RED, no survivors, md5 byte-clean restore (lcl_household_anchors.py 5fbebfca3e72dcbdb30662cfc71b79e8, maturity_map.yaml fcc1793bf4a20a1d9c68eb9b37217fa7, fabric_gap_ledger.py 13f943d9dde8d8bfefc9e2555005022f): unpayable_here_bands fails open to () / the predicate can never say AVAILABLE / an unreadable panel degrades to UNPAYABLE instead of raising / one band dropped from the blocked tuple / the map points at a DIFFERENT predicate / the map under-claims what is blocked / a cited band quietly gains a threshold. THE FOURTH AND SEVENTH ARE THE CITATION-ROT MUTATIONS and they are the point: a band that gained an anchor would otherwise go on being cited as a reason this atom cannot close, which is this project''s own filed class of a citation outliving the thing it cites. NOT ALWAYS-RED: 17 passed unmutated, and the predicate is proven to say AVAILABLE on a real day-level file written to disk, not merely to say UNAVAILABLE on ours.    NO PUBLISHED FIGURE MOVED AND NO BAND CHANGED. This tick adds a predicate, four controls and a map record; it touches no statistic, no threshold and no reflection. The atom''s own suites were re-run first, BEFORE anything was written, to establish the level rests on a green tree: 386 passed / 2 xfailed across test_premise_two_level, test_lcl_household_anchors, test_couple_fabric and test_gap_ledger_reconciler.    THE R10 CLASS: AN EXIT CRITERION CAN OUTLIVE THE BOX''S ABILITY TO MEET IT, AND EVERY MECHANISM THAT WATCHES ASKS WHETHER IT IS MET, NEVER WHETHER IT CAN BE. CORRECTED MID-TICK BY LOOKING: the first draft of this note said the stall was invisible, borrowing OPS2''s words. IT IS NOT INVISIBLE -- it is MEASURED, PUBLISHED AND INERT, which is worse and is the sharper finding. `supervisor._record_atom_draw_and_check_stall` had this atom at `stalled: True` with `consecutive_unchanged` 346 against an `ATOM_STALL_THRESHOLD` of 2 -- 173x past its own trigger -- and the figure is RENDERED on the public map projection (`site/data/maturity_map.json`). Its entire consequence is three `_is_atom_stalled` filters of the shape `non_stalled = [...]; if non_stalled: candidates = non_stalled`: a PREFERENCE that falls back to drawing the stalled atom anyway when its rung holds nothing else, which is exactly the case a 346-deep stall produces. A soft deprioritisation is not a stop, and no count of consecutive unchanged draws is the same question as ''can this ever close''. Signature -- an atom that is drawable, does genuine work every draw, whose level does not move, and whose own stall counter is both correct and powerless. TWO SUB-CLASSES NOW SEEN: the criterion the HARDWARE cannot pay (OPS2, 13 draws) and the criterion that REGENERATES ITSELF (this atom''s Hour chain, 15 draws). The general fix -- an `infeasible_here` draw exclusion in supervisor.py and a digest category -- is NOT built here and stays queued in docs/staging/WORKER_FINDING_AN_EXIT_CRITERION_CAN_OUTLIVE_THE_BOXS_ABILITY_TO_MEET_IT_2026-08-12.md; this tick builds the instance''s live predicate and the map field it would read. SECOND CLASS: two open criteria that name the same blocker in their own words are ONE item, and counting them as two makes a queue look like it has depth it does not have.    WHAT L3 MEANS HERE, STATED SO IT CANNOT BE READ AS A DISCOUNT. The map''s own L3 definition says the veteran''s deep-tenure findings are ''not pretended away: they live in the simplifications register, visible and honest'' -- which is precisely this register, 42 entries deep. What is certified is the harness LEG: the two-level test stands as a standing failable control, red on L2.4 by design; the EPC-vs-actual and inferred-vs-actual gap metrics and their money consequence are published and reconciled; fifteen Hours of instrument hardening are landed and green. What is NOT certified, and is recorded as UNPAYABLE-HERE in those words rather than as met, is the pair of magnitude bands that need an acquisition. An exit test is not renegotiated to fit what got done -- it is closed as unpayable, with the predicate that will re-open it.'
