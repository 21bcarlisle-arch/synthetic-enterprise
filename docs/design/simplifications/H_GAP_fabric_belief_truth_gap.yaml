  - 'CLOSED 2026-08-11: the refresh command could not reproduce the row it refreshed. The row now declares the args that reproduce it (safe_refresh_args whitelist, R15 both ways on 4 source mutations).'
  - 'CLOSED 2026-08-11 as a MECHANISM: both gap headlines were diluted by rows where the two arms are identical (7/15 authored, 166/200 drawn). arm_agreement conditions the headline on the company''s own BASIS, never on float equality of the arms (that would be a tautology), carries the tie fraction and BOTH figures into the ledger row, RAISES rather than publishing a diluted inference headline, and is proven by two populations differing only in EPC lodgement coverage over EXCHANGEABLE covered sets: published figure doubles, conditioned figure invariant to 1e-12.'
