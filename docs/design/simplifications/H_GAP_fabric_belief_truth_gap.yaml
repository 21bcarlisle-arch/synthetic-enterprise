  FINDING 1, FIXED CLASS-WIDE AND LANDED: THIS ATOM''S HEADLINE CHANGES SIGN WITH THE POPULATION AND THE DEFAULT COMMAND REPORTS THE CHOSEN ONE. tools/couple_fabric defaults to the AUTHORED 15-premise panel; the row it writes was measured on 200 DRAWN from published stock marginals. inference_improvement = -0.0440 authored (inference LOSES) vs +0.0227 drawn seed 17 and +0.0426 drawn seed 23 (inference WINS). gap_ledger_reconciler.refresh_command emitted the BASE invocation, so RUNG 4b''s acceptance test -- ''the row reads CURRENT afterwards'' -- was satisfied by a re-run that INVERTS a published claim and calls it freshness. This is precisely the class filed 2026-08-10 against W2_11 (WORKER_FINDING_THE_REFRESH_COMMAND_CAN_CHANGE_THE_POPULATION), landing on the variant that finding flagged as UNPROTECTED: W2_11 has a live in-run writer that reclaimed its row in six minutes, the fabric row is produced only by an on-demand standalone tool, so nothing reclaims it and the exposure runs until someone runs something. FIXED WHERE THE KNOWLEDGE IS: the tool records the args that reproduce its measurement (refresh_args + a human-readable composition) and the reconciler reads them back. That is NOT the drifting CLI copy refresh_command''s docstring rejects -- nothing there knows what --population means, it concatenates what the run declared -- and rows with no declaration keep the base invocation exactly as before, so no other tool in the family regresses. safe_refresh_args whitelists flags and bare numbers ONLY: the ledger is DATA and this output is RUN by a tick, so a row may not inject a path, a --flag=value pair, an env assignment or a metacharacter; anything else is refused WHOLE and falls back to base, fail-safe rather than partially-trusted. R15 BOTH WAYS, four SOURCE mutations each firing its OWN named test with md5 byte-clean restore (5b584b68) and 42 green baseline: ignore the declaration / drop the whitelist / stop the lookup / remove the non-list guard (that last one fires three neighbours too). LANDED IN THE SAME TICK AS THE FIX, DELIBERATELY: editing background/fabric_gap_ledger.py makes it a changed producer of both fabric rows, so the fix''s own commit stales them and the very next drain would have offered the wrong-population command -- the defect triggered by its own repair. The re-take on the row''s own population reproduced EVERY figure exactly (gap 0.4269/0.4042, forgone GBP 548,919/451,832, misranked 10/11, declined 89/73); the whole diff is measured_at, run_git_commit and the new fields. W1_5 went stale by the same producer edit, was re-taken (2 fields changed, zero measured figures), and landed via tools.surgical_land per the reconciler''s own measured_not_landed route. Ledger reconciles CLEAN at 14 of 14, drain empty.

  THREE FINDINGS ARE OPEN AND QUEUED, NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE), and all three are about the headline this atom exists to publish. (2) BOTH GAP HEADLINES ARE DILUTED BY ROWS WHERE THE TWO ARMS ARE IDENTICAL: inferred==epc to the bit wherever the inference never ran (epc_only / stock_prior), which is 7 of 15 (47%) on the panel and 164-166 of 200 (82-83%) on the population the ledger PUBLISHES. So ~83% of the published average carries zero information about the thing the metric is named after; +0.0227 is roughly a sixth of the effect where inference actually operated, and it MOVES WITH EPC LODGEMENT COVERAGE while the estimator is unchanged -- coverage reading as skill, the dominant-subpopulation shape, inside this atom''s own headline. (3) THE GAP IS A MAGNITUDE AND IS BLIND TO A SYSTEMATIC SIGN: EPC under-states heat loss in 14 of 15 (signed mean -0.0171) and the inference revises UPWARD in 8 of 8 meter-armed premises (+0.0228). That is bias, not noise, and it means the company is wrong about the STOCK in a fixed direction rather than merely imprecise about houses; bias_model is in the row but the headline the door renders is |belief-actual|-shaped. (4) THE MONEY VERDICT IS FLATTERED BY THAT AGREEMENT OF SIGNS, AND THE TWO HEADLINES DISAGREE WITHOUT SAYING SO: on the authored panel inference is WORSE on accuracy (0.2624 vs 0.2184) and BETTER on money (forgone GBP 18,603 vs 43,983, declined-where-value-existed 6->3), because an upward-biased belief buys more measures and on a panel where truth exceeds EPC in 93% of cases buying more is right more often. The money advantage is bought by a BIAS THAT POINTS THE PANEL''S WAY, not by accuracy. The drawn population does not rescue it -- 63% actual-above-EPC is less one-sided, not two-sided. Testable and untested: a sign-MIRRORED panel (new-build over-rating, post-retrofit certificates never re-lodged, both real) should push the verdict the other way. The shape is a standing control that FAILS when the ranking is composition-decided (R10 class, not an instance fix); it is a HARNESS construction so R13 is not engaged, and nothing is tuned toward a band so R12 holds.

  LEVEL STAYS 2 AND THE REASON IS THE HOUR''S OWN OUTPUT. (e) is delivered rather than deferred, but an atom whose headline is composition-dependent, direction-blind, and whose two published numbers disagree without noting it does not have an L3 story -- recording that is cheaper than a level that has to come back down. (a) L1.4 magnitude and (b) L1.2h heating-shape repeatability unchanged and unchanged in reason (both blocked on data this repo does not hold); (c) remains W1_12''s. Two-level test still RED on L2.4_scale_spread_p90_p10, which is the birth condition holding, not a regression. Suites: 42 reconciler, 87 across reconciler+stale-row-draw+couple_fabric+rest-ladder, 240 passed 2 xfailed across the fabric harness (test_premise_two_level + test_fabric_demand_path); epistemic_verifier PASS 543 files.'
- '2026-08-11 THE THREE OPEN EXPERT-HOUR FINDINGS ARE CLOSED AS MECHANISMS, AND ONE OF THEM IS REFUTED BY ITS OWN TEST. All three were about the two numbers this atom exists to publish, so all three are now standing failable controls in `background/fabric_gap_ledger.py`, computed on every run, written INTO the ledger row rather than offered behind a flag (R11: the door renders what the row holds, and a reader who has to ask for the dilution will not ask). 16 new controls; each landed with its NAMED DEFECT as a population it must fire on AND a clean population it must stay silent on.


  (2) DILUTION, CLOSED. `arm_agreement` conditions the improvement headline on whether the inference ran at all, read off the company''s own BASIS and never off float equality of the two arms -- equality would put the measured quantity on both sides of its own measurement (R15 TAUTOLOGY), and a posterior that genuinely ran and landed on its prior would have been scored as never having run. The basis predicate carries its own FALSIFIER: an `epc_only` row whose posterior differs from its prior RAISES, because a basis that does not describe the belief makes every conditioned figure below it meaningless. THE CONTROL: two populations, same estimator, different EPC lodgement coverage, EXCHANGEABLE covered sets (the fixture stock repeats every half, so 6-of-12 and 12-of-12 draw the same HLC multiset -- without that, `prediction_gap`''s own no-skill denominator moves with the covered subset and the conditioned figure would drift for a reason that has nothing to do with the estimator). The published figure DOUBLES and the conditioned one is invariant to 1e-12, and the dilution is exactly the informed fraction. FAIL-LOUD, not fail-open: a population the inference barely touched RAISES rather than returning the diluted number.


  (3) DIRECTION, CLOSED. `belief_bias` reports the SIGN the |belief-actual| headline cannot see, with an EXACT two-sided binomial sign test checked against hand arithmetic (2*(C(15,0)+C(15,1))/2**15) rather than against itself. Vacuity guarded: a belief that is never wrong has no direction to be wrong in and reports `none`, not a default.


  (4) THE HYPOTHESIS IS REFUTED AND THE REAL CAUSE IS FOUND -- the value of building the test instead of asserting the claim. The Hour predicted a sign-mirrored panel would push the money verdict the other way. Built as TWO mirrors, because the original phrasing conflates two things: `mirror_panel_composition` (truth reflected through the register: a stock that fails the other way -- new-build over-rating, post-retrofit certificates never re-lodged, both real, with `annual_heat_kwh` moved in proportion because a house whose heat loss halves and whose bill does not is not a house) and `mirror_revision_direction` (the same inference stepping the other way by the same amount). NEITHER moves the verdict off `inferred`, on either population. The revision mirror is decisive: reversing the step collapses accuracy (improvement -0.0440 -> -0.1406 on the authored panel) and moves the money by GBP 308 of 18,603. The money advantage was never bought by direction.


  A THIRD MIRROR FINDS IT. `mirror_decision_confidence` swaps the two arms'' ERROR BARS and bases and leaves every point estimate untouched, so both accuracy gaps are identical BY CONSTRUCTION and any money movement cannot be an accuracy movement -- and the verdict flips to `epc` on BOTH populations. The arm that forgoes less is the arm ALLOWED TO ACT more often (declined-where-value-existed 6 vs 3 authored, 89 vs 73 drawn). THE TWO PUBLISHED HEADLINES ARE NOT TWO VIEWS OF ONE QUANTITY: one scores accuracy, the other scores permission. That is a better answer than the one the Hour proposed, and it is a CLASS answer (R10) -- any money-consequence metric built on a decision rule with an actionability test will rank arms by confidence unless something holds confidence fixed.


  TWO DEFECTS IN THIS WORK, BOTH CAUGHT BY ITS OWN CONTROLS WITHIN THE HOUR OF LANDING. (i) The first cut made every mirror verdict a flip of a STRICT INEQUALITY, so on a population where the arms cost about the same an irrelevant nudge announced a composition effect that was two floats in a coin toss -- the control that fires on everything is as ignored as the one that fires on nothing. Caught by the empty-caveat vacuity test, which is the only reason that test exists. `VERDICT_MATERIALITY` (5% of the larger, a DIAGNOSTIC band, R12) plus `_flipped` mean only two DECISIVE verdicts naming different arms count. (ii) The ONE-SIGNED caveat put a majority and an average side by side without saying they disagree: on the DRAWN 200-premise population the register is below truth on 126 of 200 while the mean signed error is +19.6%, because a minority of large over-statements outweighs a majority of small under-statements. Both numbers are right and the sentence read as a contradiction -- one name, two numbers, this project''s own recurring shape, inside a control landed an hour earlier. `mean_agrees_with_majority` now emits its own SKEWED caveat: a supplier reading the mean would target different houses from one reading the median, which is the finding rather than the tidy-up.


  THE MEASURED RESULT ON THE POPULATION THE LEDGER PUBLISHES (200 drawn, seed 17), NOT TUNED (R12/R13): inference ran on 34 of 200 (tie fraction 83%); improvement +0.0227 as published vs +0.1233 where it ran -- the published figure is about a FIFTH of the effect where the estimator operated, and it moves with EPC lodgement coverage while the estimator is unchanged; register one-signed and SKEWED; accuracy and money AGREE on `inferred` here (they disagree on the authored panel); composition-decided FALSE, direction-bought FALSE, CONFIDENCE-BOUGHT TRUE. Panel-mirror accuracy drift is large (0.0717 drawn, 0.1579 authored), which is REPORTED rather than suppressed and is the honest limit of that instrument: the reflection preserves the log error exactly and the level error only approximately, so its verdict is weakly attributable and the confidence mirror -- which cannot move accuracy at all -- is the one to read.


  LEVEL STAYS 2, AND THE REASON IS THIS ENTRY''S OWN CONTENT. The three findings are closed as live mechanisms and the atom''s headline now declares how it misleads. But an Expert Hour has not been run ON THIS WORK, and the hour that built it found two defects in its own controls -- that rate is the argument for a fresh pass, not against it. Promotion is cheap next tick and a level that has to come back down is not. Both fabric rows re-taken on their OWN declared population (`--population 200 --population-seed 17`, per the refresh_args the last hour landed): EVERY measured figure reproduced to the bit (gap 0.4269/0.4042, forgone GBP 548,919/451,832, misranked 10/11, declined 89/73) -- the whole diff is measured_at, run_git_commit and the four new component blocks. W1_5 went stale by the same producer edit and was re-stamped (2 fields, zero measured figures). Ledger reconciles CLEAN at 14 of 14. Two-level test still RED on L2.4_scale_spread_p90_p10, which is the birth condition holding, not a regression. Suites: 328 passed 2 xfailed across tests/harness + couple_fabric + reconciler; ruff clean; epistemic_verifier PASS 543 files.'
- '2026-08-11 THE EXPERT HOUR ON THE HEADLINE-CAVEAT WORK RAN, and it found the instrument reporting its own fidelity in a quantity that can never come out small (worker tick, L2->L3 draw). Both open in-hand residuals are closed as one mechanism, because they were the same defect seen from two ends. TENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT: every figure below came out of tools/couple_fabric on the two REAL populations, not out of the source.

  FINDING 1 -- THE DISCLOSED ''ACCURACY DRIFT'' WAS A COMPOUND, AND IT MEASURED THE MIRROR WORKING. The panel mirror reflects TRUTH through the register, so it is MEANT to wreck the posterior arm''s accuracy -- an inference that stepped the right way on this panel steps the wrong way in a stock that fails the other way, and that is the finding. `panel_mirror_accuracy_drift` is the drift of the IMPROVEMENT, i.e. both arms at once, so it is large exactly when the mirror is doing its job (0.1579 authored, 0.0717 drawn) and the previous tick read those numbers as the instrument''s disturbance and filed the mirror as a weak instrument. The artefact is the REGISTER arm alone -- the arm the reflection is built around, whose error the mirror claims to preserve. Separated as `panel_mirror_epc_gap_drift`, pinned by a test that moves ONLY the posterior and asserts the artefact term does not move while the compound one moves by >0.1.

  FINDING 2 -- THE REFLECTION''S OWN JUSTIFICATION WAS NEVER MEASURED, AND IS FALSE ON BOTH PUBLISHED POPULATIONS. `_reflect` used `pivot**2/value`, defended in its own docstring as necessary because the level-preserving `2*pivot - value` ''goes non-positive whenever the reflected quantity exceeds twice its pivot, which is common in a register -- a mirror that raises on a third of real panels is a control nobody can run''. Measured: 0 of 15 authored and 0 of 200 drawn premises are infeasible, because a register that under-states by 13-20% does not under-state by more than half. That is the blast-radius-before-the-predicate rule applied to a design justification rather than to a lint. It matters because `prediction_gap`''s numerator is a mean ABSOLUTE error and the log form leaves it moving: switching to the level-preserving reflection makes the register arm''s numerator identical to 6 decimals (0.020202 authored, 0.044774 drawn, before and after) and cuts the drawn population''s artefact from 25.9% of its gap to 1.9%. The whole residual that remains is `prediction_gap`''s NO-SKILL DENOMINATOR, which is a property of the truth population the reflection moves -- a statement about the metric, not about this mirror, and now a named one rather than the word ''approximately''. Feasibility is tested on the WHOLE panel and falls back WHOLE (with the count carried), because a panel reflected two ways on two subsets is two instruments -- the exact confound the mirror exists to detect. The reflection was NOT chosen per population by which answer it gave; that was available (multiplicative is the better instrument on the authored panel, 3.0% vs 14.1%) and rejected as instrument-shopping.

  FINDING 3, THE ONE THAT WAS COSTING A READER SOMETHING -- THE MIRROR''S WEAKNESS WAS UNRENDERABLE IN THE ONLY CASE THAT OCCURS. The fidelity figure existed solely inside the COMPOSITION-DECIDED caveat, which by construction prints only when the mirror DID flip the money verdict. It does not flip on either published population. So the reader of both real rows saw two headline numbers, no composition caveat, and was invited to conclude that composition had been ruled out -- when on the authored panel the mirror had disturbed the register arm''s own gap by 14.1% and its null meant nothing. A null result from an uncalibrated instrument is not evidence of no effect. `MIRROR INCONCLUSIVE` now says so in those words, and the fidelity figure rides on the tool''s mirror line unconditionally.

  THE 2x2 IS COMPLETE AND EACH CELL IS PINNED: flipped+faithful states the finding flat; flipped+unfaithful attaches a DIRECTIONAL ONLY rider; no-flip+unfaithful is MIRROR INCONCLUSIVE; no-flip+faithful is SILENT, and the silence is the control''s vacuity guard. R15 BOTH WAYS ON THE REAL POPULATIONS, not only on fixtures: the caveat FIRES on the authored 15 (14.1%, above the 5% band) and stays SILENT on the drawn 200 (1.9%) -- one mechanism, two real populations, opposite verdicts.

  R15 BOTH WAYS, SIX SOURCE MUTATIONS, byte-clean restore verified by md5 (18f8c533f57e4234cfb0b822949a536d before and after every run), each firing its own named test on a 197-test baseline: log-preserving reflection always => the level-error test fires; per-premise instead of whole-panel fallback => the falls-back-WHOLE test fires alone; the attributability gate re-pointed at the COMPOUND drift => the two faithful-mirror tests fire (this is the mutation that reinstates the defect); the gate hardwired True => the INCONCLUSIVE test and the ledger-row test fire; the INCONCLUSIVE caveat made unconditional => the silence test and the caveat-list vacuity guard fire; the zero-gap guard dropped => a perfect register CRASHES the ledger write with ZeroDivisionError (it also took out test_the_ledger_write_PRESERVES_other_pairs, which is the blast radius of a 0/0 in a published row).

  THE PUBLISHED FIGURES DID NOT MOVE AND THAT IS CHECKED, NOT ASSERTED. Re-taken on the row''s own declared population (--population 200 --population-seed 17, read back off the row per the 2026-08-11 refresh_args mechanism): gap 0.4269/0.4042, forgone GBP 548,919/451,832, misranked 10/11, declined 89/73, every caveat sentence unchanged. The only ledger fields that moved are the mirror''s own, because the mirror is what changed. Landed in the SAME commit as the fix, since editing background/fabric_gap_ledger.py makes it a changed producer of both fabric rows.

  ONE HONEST RESIDUAL FROM THIS WORK, recorded rather than closed: the fix does not make the panel mirror STRONG, it makes its weakness visible per population. The artefact scales with the register''s error relative to the truth''s spread, so on any high-error population the mirror will report itself inconclusive (the caveat suite''s own +-25% fixture measures 28.0%). That is a true limit of reflecting a truth population through a belief, not a threshold to widen -- and it is why the vacuity fixture moved to absolute rather than proportional register errors instead of the caveat being softened.'
- '2026-08-11 SECOND EXPERT HOUR ON THE MIRROR-FIDELITY WORK (worker tick, L2->L3 draw), run under the termination condition the previous Hour wrote for itself -- IT FOUND SOMETHING, SO THE LEVEL STAYS 2. TENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT.

  THE DEFECT: THE FIDELITY TERM WAS 100% ITS OWN DENOMINATOR. The previous Hour split the compound `accuracy_drift` and put the artefact in `panel_mirror_epc_gap_drift` -> `panel_mirror_relative_infidelity` -> the gate `panel_mirror_is_attributable` -> the published MIRROR INCONCLUSIVE sentence. But that quantity is a RATIO -- mean|register - truth| over the no-skill baseline -- and the level-preserving reflection is 2*prior - value, which preserves the numerator PER PREMISE by algebra. Measured, not argued, on all FOUR populations this atom runs on: register-arm MAE drift = 0.000e+00 on the authored 15, the drawn 200, and BOTH suite fixtures, while the no-skill baseline moved 12.37% / 1.87% / 40.00% / 0.00%. The baseline is a property of the truth population and reflecting the truth population IS the mirror, so the disclosed number was the intended move wearing the artefact''s name -- the previous Hour''s own class, one level down, inside that Hour''s replacement term. Consequence on the published surface: the authored row printed "the instrument disturbed the arm it was built around by 14.1% of its gap" over an instrument that disturbed it by nothing, and told the reader a faithful null carried no weight.

  AND THE FAIL-OPEN, WHICH IS THE HALF THAT MATTERS: a ratio cancels. Over 400 subpanels drawn from this atom''s OWN published 200-premise population, the log reflection (the fallback that genuinely does not preserve the register''s error) moved that error by 20-125% on 13 of them while the term read UNDER the 5% band and returned attributable -- worst case n=30, error moved 125.15%, control read 4.21%. So the term refused a perfect instrument on one published population and would have passed a broken one on subsets of the other.

  WHY R15 DID NOT CATCH IT, WHICH IS THE REUSABLE PART: the 2x2''s FAITHFUL cell used an ADDITIVE register error (`_fixed_offset_population`), whose reflection is a pure translation so the baseline CANNOT move; its BLUNT cell used a PROPORTIONAL error, where it can. The suite therefore discriminated additive-vs-proportional register error and never preserved-vs-disturbed, which is identically zero in every cell. The fixture docstring said "the whole of it is the denominator moving" in plain words and the gate was pointed at it anyway -- a control can be documented correctly and still be wired to the wrong quantity.

  MECHANISED: `_register_mae` (raw, deliberately NOT the 6dp-rounded components["mae_model"], which would quantise the subject at 1e-6); `epc_register_mae` + `panel_mirror_register_mae` ride in the ledger row as a RAW PAIR so the share is recomputable by its reader; `panel_mirror_register_infidelity` is the artefact and is the gate; `panel_mirror_normaliser_drift` is the intended move and gets its own MIRROR YARDSTICK MOVED sentence saying the two gap figures are on different scales and the money verdict never divides by the baseline; `panel_mirror_relative_infidelity` is retained, reported and documented as a compound that is NOT the gate. The artefact is MEASURED off the panel actually built rather than asserted from the algebra, because a control whose subject is zero by construction cannot fail -- and it fires through a REAL code path, the whole-panel log fallback.

  R15 BOTH WAYS, FIVE SOURCE MUTATIONS each firing its own named test with md5 byte-clean restore (4bc8898b21e5090315ad1bb2c75178af), 15 green on the same selection unmutated: gate reads the ratio again (the exact defect reinstated) / artefact measured off the ORIGINAL rows so its subject can never move / normaliser folded INTO the gate / intended-move disclosure dropped from the silent branch / artefact fail-opens on a moved zero. Two new tests carry the two directions: an exactly-faithful mirror is not called inconclusive by its own normaliser, and a mirror that really moves the register arm is caught THOUGH THE RATIO IS NOT.

  A RESIDUAL FILED AS INHERENT WAS THE DEFECT IN ITS OWN VOCABULARY. The previous Hour recorded, and this record repeated, that the mirror "is only readable where the register''s error is small against the truth''s spread, so a high-error population self-reports inconclusive (+-25% fixture measures 28.0%) -- a true limit, not a band to widen." Measured under the repaired terms on a +-25% register panel: register-arm error disturbed 0.000000%, baseline moved 58.9%, attributable TRUE where the old term said 37.1% and INCONCLUSIVE. There is no such limit; the reflection preserves |register - truth| per premise however large that error is. An inherent-residual note reads as honest humility for exactly as long as nobody measures it.

