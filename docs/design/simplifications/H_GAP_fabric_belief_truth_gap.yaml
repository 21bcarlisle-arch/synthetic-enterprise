 of _favours.'
  - 'SETTLED 2026-08-11 BY THE FIFTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The money headline was a 5%-of-the-larger band on the difference of two GBP SUMS, with no error bar -- the fourth Hour''s own NOT-DONE item, filed there as probably-something-else because "its decisiveness DOES improve with N". Over 120 random subpanels of the drawn population the old rule named an arm on 75/87/98/100% at n=25/50/100/150 while the paired per-premise evidence resolved 13/59/100/100%, so 62% of 25-home panels published a verdict the homes could not support; signature DECISIVENESS DECOUPLED FROM N. The authored panel is in that regime: aggregate margin 57.7% of the larger, 80.6% of it ONE HOUSE, paired interval [+GBP 3, +GBP 4,736]. `panel_mirror_normaliser_drift`, the other half of the directed question, was examined and REFUTED as a defect. MECHANISED: `_paired_money_verdict` on ALL FOUR money verdicts (R10 class), one `_premise_forgone` definition, three new disclosures, `ONE_HOUSE_SHARE`. R15 nine source mutations each firing their own named test, md5 clean; one initially survived because no fixture had the two rules disagreeing. No figure moved (0.4269/0.4042). NOT CLOSED: `MIRROR_FIDELITY_BAND` serves two subjects -- the next Hour''s opener. Full text docs/staging/WORKER_FINDING_THE_MONEY_VERDICT_WAS_A_SUM_AND_A_SUM_HAS_NO_ERROR_BAR_2026-08-11.md.'
