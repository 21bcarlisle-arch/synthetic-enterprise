  test fire. AND THE OTHER DIRECTION, which a red-on-arrival band needs most: test_the_L2_4_BAND_CAN_PASS_and_is_not_a_control_that_can_only_fail
  stretches the model''s OWN homes about their median until they span what real households span and asserts
  the band PASSES -- a band nobody has ever seen pass is indistinguishable from one that cannot, and a
  control that can only fail wedges whatever it gates. The panel-clears-its-own-floor check is labelled
  a SANITY check and not evidence, because the floor is that panel''s own bootstrap quantile and the comparison
  is true by construction. Independence: tests/harness/test_lcl_household_anchors.py re-derives every
  exported constant from the raw CSV with its own inline quantile and its own resampling loop rather than
  calling the module''s helpers -- a re-derivation sharing the code it checks asserts nothing.'
