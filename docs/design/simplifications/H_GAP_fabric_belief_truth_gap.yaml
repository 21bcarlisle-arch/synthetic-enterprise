  - 'SETTLED 2026-08-11 BY THE SEVENTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question the sixth Hour left -- the `weight_null` money totals carry no interval, and `panel_mirror_weight_artefact` (0.6893 authored / 0.9043 drawn) is what puts BOTH populations on MIRROR INCONCLUSIVE -- answers as ONE defect seen from two ends, and it is the THIRD Hour''s own repair left undone in the channel that same Hour created. THE DEFECT: THE MONEY FIDELITY TERM WAS A DIFFERENCE OF AGGREGATES. `panel_mirror_weight_artefact` was |d(inferred_total - epc_total)| for the null over the same for the mirror -- two population sums -- while the verdict it certifies has been decided PER PREMISE with a paired bootstrap since the FIFTH Hour. `_register_mad`''s own docstring states the principle it violates ("an aggregate of differences, never a difference of aggregates"); it was applied to the kW/K channel and not to the GBP one. MEASURED BY RUNNING IT, TWELFTH TIME ON THIS ATOM: the mirror moves the deciding margin in BOTH directions (1 up / 3 down of 4 moved premises authored, 10 up / 8 down of 18 drawn), so summing first destroys 21.4% (authored) and 39.6% (drawn) of the mirror''s per-premise movement and a DIFFERENT 32.6% / 25.3% of the null''s -- and the ratio therefore moves BOTH WAYS: 68.9% published against a true 80.4% authored, 90.4% against 73.1% drawn. Neither published row changes hands (both fail the band under both shapes, so no published figure moved: 0.4269 / 0.4042 unchanged), but on 7 of 200 real 20-home subpanels of this atom''s own drawn population the OLD shape PASSES the 50% band -- as low as 32.9% -- where the per-premise shape fails it at up to 65.1%. On those the row certifies the mirror as attributable and publishes its null as a finding, over a mirror whose movement is mostly re-composition premise by premise. THE SECOND END, same defect: the sentence justifying INCONCLUSIVE quoted the weight null''s two population TOTALS ("GBP 29,722 epc / 12,835 inferred") -- the aggregate rule the verdict itself stopped using at the fifth Hour -- as the stated ground, with no interval on either. MECHANISED: `_paired_margin_moves` (three panels, premise-by-premise, order-checked, non-finite-checked) carried on the verdict as `margin_moves`; the term is now mean|null move| over mean|mirror move|, band UNTOUCHED at 0.50 (the STATISTIC was repaired, R12); the old answer survives as `panel_mirror_weight_artefact_aggregate` beside `panel_mirror_margin_cancellation` and `weight_null_margin_cancellation`, which are the mechanism of the finding on the row; a 95% percentile-bootstrap interval on its own named C-S2 substream (WEIGHT_ARTEFACT_SEED, a THIRD seed -- an instrument whose error bar shares resampling noise with the verdict it tests is not independent), computed through the SAME `_artefact_share` the gate reads; `_bootstrap_mean_ci` generalised to `_bootstrap_statistic_ci` so three published intervals share ONE resampling implementation. R15 FIVE source mutations, each firing its own named test: the aggregate shape restored (2 tests), the interval computed by a different expression, the sentence quoting the two totals again, `_mean_abs` failing open on an empty panel, the reordering guard removed. 234 tests green in the atom''s own file plus 79 across its three siblings. OPENER FOR THE EIGHTH HOUR, and it is this Hour''s own deliberate non-move: `panel_mirror_is_attributable` still compares a POINT ESTIMATE to the band, and on the suite''s own passing fixture the interval straddles it (0.4364, 95% [0.219, 0.792]) -- the mirror is certified attributable on evidence that cannot resolve which side of the band it sits. The authored panel reads 80% [73%, 122%], so the share is not bounded by 1 either. Moving a live gate onto an interval in the same Hour that repaired its statistic would change what is published for two reasons at once, so it was disclosed and not taken.'
  - 'SETTLED 2026-08-11 BY THE EIGHTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- `panel_mirror_is_attributable` compares a POINT ESTIMATE to the band while the interval around it straddles it -- confirms on the LIVE rows, not only on the fixture the seventh Hour cited. Measured on real subpanels of this atom''s published 200-premise population (own share 0.7307, above the band, so no subpanel of it has an honest pass): the point rule certified 50/37/30/15% at n=20/30/50/100, worst case off FOUR moved homes with a 95% interval of [0.000, 1.000], and at n=100 fourteen of one hundred and twenty certified while carrying a DECISIVE money verdict -- where a certified mirror publishes ''no composition effect'' as a finding. Signature is NOT flat-in-N: the error falls with N, but the rule never learns it cannot resolve (n=100: interval certifies 0 of 120, point rule still 14). MECHANISED as three states -- `panel_mirror_weight_artefact_resolution` reads the interval, `panel_mirror_attribution` combines both channels, only a RESOLVED pass certifies, fail-closed on a missing interval except at the exact zero corner. One-directional by construction: it can only withdraw certification. THE ALWAYS-RED RISK WAS SEARCHED, NOT ASSUMED -- the suite''s own not-always-red proof rested on a panel reading 0.4711 on [0.414, 0.561], so a resolved pass had to be found (700 draws, 13 resolvable flips, 8 resolved-faithful; `_flipping_population` redefaulted to 60 homes at 0.1690 on [0.123, 0.230]). R15 six source mutations, md5 byte-clean; ONE SURVIVED the first sweep -- the disclosure keyed back to the point estimate, this Hour''s own defect in its own repair -- because both fixtures AGREED between the two rules. R10 CLASS: a control set with no population where the controlled thing varies is a control that cannot fail; SIBLING: when a gate moves onto a new statistic, its DISCLOSURE inherits the retired one unless someone re-asks what the sentence is keyed to. No published figure moved (0.4269 / 0.4042 re-taken; both rows attributable=False before and after; the only claim that changed is ''measured above the band'' -> ''this panel cannot resolve which side''). OPENER FOR THE NINTH HOUR: the REGISTER half of the gate is still a bare point comparison, and it is zero by algebra on every branch either published population takes -- whether a term that cannot move can carry half a gate is the third Hour''s own unfollowed note. ALSO NAMED: the weight artefact is called a SHARE and is not bounded by 1 (authored row 80% on [73%, 122%]).'
  - 'SETTLED 2026-08-11 BY THE NINTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- can the register half of the gate, zero by algebra on the branch both published populations take, carry half a gate -- answers YES, but not for the reason the question expected, and the expected repair is REFUTED: the fallback-branch statistic concentrates fast (unresolved on 3 of 22 subpanels at n=20, 0 of 46 by n=50) so copying the eighth Hour''s interval onto it would have been cargo. THE DEFECT IS ONE LEVEL UP: the term is a MEAN and the promise is UNIVERSAL. `_reflect_level` promises every premise its absolute error back, so the honest level-branch value is exactly zero and any breach is a breach -- audited by a panel mean against a 5% band, which on 200 homes reads ''nine homes may move completely''. The third Hour closed the CANCELLATION in this term and left the DILUTION. MEASURED BY INJECTING THE DEFECT AT THE REFLECTION CALL: 9 of the drawn 200 and 4 of the authored 15 reflected by the WRONG RULE certify; 65 of 200 (32.5%) through the WRONG PIVOT certify, worst home moved 1,825%, gate reading 4.50%. SIGNATURE, and why it is a class: one fixed defective home reads 0.0022 at n=15 and 0.0002 at n=200 while the worst per-premise breach is 15.4% at every size -- SENSITIVITY FALLS WITH N, the third sibling of the fourth Hour''s FLAT-IN-N and the fifth''s DECOUPLED-FROM-N and the worst-behaved, monotone in the wrong direction. MECHANISED: `_register_breaches` per premise; `panel_mirror_register_worst_breach` (a promise is audited at its WORST violation); a COUNT beside it; the gate SPLIT BY BRANCH -- level on the worst breach against a sixth constant `REGISTER_PRESERVATION_TOLERANCE` (a NOISE FLOOR, six orders of headroom either side of 1.788e-15 and 15.4%), fallback keeping the mean because no absolute-error promise is made there and the worst-case shape would be always-red on an instrument working as designed. A PROMISE IS AUDITED AT ITS WORST VIOLATION; A CHARACTERISTIC IS SUMMARISED AT ITS MEAN. One-directional by construction. R15 seven source mutations, md5 byte-clean, not always-red on either branch with the fallback half SEARCHED (an 80-home 1%-accurate register with one rogue certificate certifies at 0.0306 while its worst breach is 0.600). The suite caught the repair''s own inherited check within the hour -- the zero-corner test went on passing while asserting nothing about the live gate. No published figure moved (0.4269 / 0.4042 re-taken after the code landed; both rows'' register channel attributable before and after). R10 CLASSES: a universal per-premise promise cannot be audited by a panel mean; a tolerance band on an EXACT claim is the wrong shape of thing, not a loose setting. OPENER FOR THE TENTH HOUR: `panel_mirror_weight_artefact` is called a SHARE and is not bounded by 1 (authored row 80% on [73%, 122%]) -- named by the eighth Hour, untaken since, now the oldest open item on this atom.'
  - 'SETTLED 2026-08-12 BY THE TENTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- the artefact term is called a SHARE and is not bounded by 1 -- is REFUTED as a defect in the statistic: the sixth Hour''s bounded shape is BIT-IDENTICAL on the drawn population and on all 800 subpanels of it, differs by 0.0367 on the authored one, crosses the band on neither, and is always <= the shipped ratio, so adopting it could only GRANT certification. Readings over 1 are real (the sign flip opposing its own re-weighting); the word "reproduced" was what could not admit 122%. CHASING WHERE THAT 122% CAME FROM FOUND THE REAL DEFECT: it is a bootstrap over FOUR HOMES, and the guard that withholds an interval read `len(margin_moves)` -- the panel''s ROW COUNT -- while a premise neither channel moved contributes exactly zero to both sums the share is built from. The authored published row is below this file''s own MIN_HOMES_FOR_DIVERSITY and its guard passed on fifteen rows. MEASURED on 1,200 real subpanels of the drawn population (own share 0.7307, so every certification on a subpanel of it is wrong): 93 certified, 92 of them off fewer than five movers, 83 off fewer than three, 59 off ONE home; the guard fired on none of the 1,200; at six movers and above, none certified. The worst point is DEGENERATE and is why the eighth Hour''s interval rule could not stop it -- one carrier makes every resample read the same ratio, so the interval collapses to ZERO WIDTH and certifies wearing maximum confidence. MECHANISED: `panel_mirror_artefact_evidence_premises` (either channel, not the mirror''s movers), the guard reads it, the constant is UNTOUCHED (R12; same subject, only the counting was wrong -- not the sixth Hour''s one-constant-two-subjects class), one-directional by construction, the withheld-interval sentence re-keyed to the population actually counted, an over-100% clause, and the diluted per-premise figures labelled (GBP 314 per PANEL premise against GBP