- '2026-08-09 L1.4 REBUILT AS L1.4n AND THE HALF THAT CLOSED IS THE STATISTIC, NOT THE THRESHOLD (worker
  tick, L2->L3 draw; ADOPTED not rebuilt -- the mechanism was already complete and green in the working
  tree from the immediately preceding tick, which ended before committing it, so it was audited and taken
  across per "adopt, don''t rebuild" rather than re-implemented). THE DEFECT BEING REPAIRED IS THIS ATOM''S
  OWN, recorded here that morning: the raw L1.4 distance is between two SUBSETS of one home''s days, so
  at the coupled run''s 120-day window (85 weekday / 35 weekend) it is bounded away from zero by sampling
  noise alone, and the LCL floor under it was cleared by a day-type-RANDOMISED population with a 1.4x
  margin. L1.4n compares each home with ITSELF under 99 random relabellings of its own day-type calendar,
  counts held fixed, and judges the ratio of the real separation to the 95th percentile of that null --
  a one-sided permutation test at alpha = 0.05, so the decision point 1.0 is a property of the CONSTRUCTION
  and there is nothing to tune (AnchorStatus.STRUCTURAL, not a borrowed anchor). IT FIRES ON THE MUTATION
  THE RAW CELL COULD NOT SEE: on the randomised calendar the same population reads a median ratio 0.75
  and violates on 58 homes of 60, against 1.45 with 1 of 60 on the real labelling. R15 BOTH WAYS, six
  tests: fires on the randomised calendar; CAN pass (a control nobody has seen pass is indistinguishable
  from one that cannot); the null is window-stable where the RAW null is not; fails CLOSED on too few
  days / non-finite / a degenerate null rather than returning an infinite ratio that would read as a spectacular
  pass; a degenerate home scores as a VIOLATION, not a pass; deterministic, so the threshold cannot be
  moved by quietly reseeding. THE POPULATION TOLERANCE (0.50) IS NOT THE IMPOSSIBILITY BOUND THE OTHER
  STRUCTURAL RATES USE and the reason is stated where it lives: a significance test at alpha = 0.05 does
  not give a perfect generator a clean sheet -- a home with genuine but weak structure lands under its
  own null by chance, at a rate that is a POWER question shrinking with the window -- so a zero tolerance
  would fail a correct generator for being watched 60 days instead of 120. Both ends measured on both
  populations at 60/90/120 days (twelve readings), tightest pair (0.295, 0.860), band set at its geometric
  midpoint.'
