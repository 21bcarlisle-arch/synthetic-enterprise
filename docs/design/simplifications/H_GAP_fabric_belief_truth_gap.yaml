- '2026-08-09 THE ANCHOR THAT WAS TAKEN BACK OUT, and it is the finding worth carrying. L1.4 (weekday/weekend
  separation) was anchored from the SAME panel by the SAME rule on the SAME day -- per-home total-variation
  distance, panel median 0.0724, bootstrap floor 0.0262 -- and was REMOVED within the hour because its
  own named R15 mutation could not make it fire. THE MEASUREMENT: relabelling the day-type calendar at
  random while keeping the same 85/35 counts destroys every trace of real weekday/weekend structure, and
  over 600 home-permutation samples on the drawn population NOT ONE value fell below the floor -- null
  median 0.0715, null MINIMUM 0.0378, against a floor of 0.0262. The statistic is strongly biased upward
  at the coupled run''s 120-day window: with 35 weekend days against 85 weekday days, two arbitrary subsets
  of the SAME home differ by about as much as a real household''s weekday differs from its weekend over
  a full year. A band that a day-type-randomised population clears with a 1.4x margin is fail-open, and
  a fail-open band is worse than an honest blank. THE CLASS, which is why this is pinned as a test and
  not written in a comment: AN ANCHOR IS A NUMBER AND A WINDOW. Both bands came off one panel by one rule
  on one day; L2.4''s statistic is a ratio BETWEEN homes and does not care how long each was watched,
  L1.4''s is a distance between two subsets of ONE home''s days and cares enormously. Nothing in an anchor''s
  provenance says which kind you have -- only the mutation does. The derivation is KEPT, un-wired, because
  the fix is to null-correct the STATISTIC (separation minus the median of k randomised relabellings)
  and this number is half of what that build needs. Pinned by test_the_L1_4_ANCHOR_DOES_NOT_TRANSFER_to_a_120_day_window,
  which also asserts the band is still blank, so a later tick that re-wires the anchor without null-correcting
  fails there.'
- '2026-08-09 R15 BOTH WAYS, by SOURCE mutation with byte-clean restore (md5 verified after each). (1)
  Drop the non-finite/non-positive guard in panel_daily_kwh => the two fail-closed anchor tests fire and
