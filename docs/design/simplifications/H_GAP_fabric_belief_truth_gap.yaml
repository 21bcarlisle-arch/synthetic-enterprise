- '2026-08-03 MINTED (worker tick) from docs/staging/ADVISOR_DISCOVERY_PREMISE_FABRIC_PHYSICS_2026-08-03.md
  deliverable 3. FULL SPEC: docs/design/PREMISE_TWO_LEVEL_TEST_HARNESS_SPEC.md. loop_stage: idle because
  that doc authorises DISCOVER+FRAME only. WHY IT IS NEEDED -- the control SET had a hole exactly the
  shape of the defect: the existing premise-demand controls (simulation/premise_demand.py reconciliation_residual,
  aggregate_reconciles, noise_is_unbiased) are genuine and R15-failable and are ALL level-and-sum controls,
  blind to texture, timing, trough behaviour and diversity. W1_5_premise_demand_shape therefore sits at
  L3 while failing BOTH levels of a test the director applied by eye in an afternoon (2026-08-03 house-usage
  review). Recorded plainly rather than softened: a level was earned against the controls that existed,
  and the world could still be defeated -- which is the coupled triad''s own definition of the gap. W1_5
  is NOT demoted; its aggregation work is correct and stays (and is retained as regression guard L2.5,
  so added realism may not cost aggregation consistency).'
- '2026-08-03 FRAME -- THE BIRTH CONDITION IS THE WHOLE POINT: this suite MUST be landed RED against the
  current generator. A control introduced already-passing has demonstrated nothing (R15). Every threshold
  in the spec is stated alongside the currently-observed value so the first run''s failure is predicted,
  specific and checkable: expected to FAIL L1.1 texture (median period-to-period change 1.5pct of mean),
  L1.2 day-to-day shape correlation (0.97), L1.3 troughs (no half-hour below 0.05 kWh in ten years, zero
  away-days -- an empty house is not representable), L1.5 repeating rescaled fractions, L2.1 smoothing
  curve (aggregate peak/mean 5.9 at N=3 vs 5.7 at N=1 -- aggregation smooths NOTHING), L2.2 between-home
  correlation (C8-C9 = 0.95, near-clones), L2.3 timing diversity, L2.4 scale spread (annual totals within
  8pct of each other); and to PASS L2.5 reconciliation and G.2 seasonal ratio. IF ANY STATISTIC UNEXPECTEDLY
  PASSES ON THE CURRENT GENERATOR, THE STATISTIC IS MIS-SPECIFIED -- fix the statistic, do not celebrate
  the pass.'
- '2026-08-03 FRAME -- R15 MUTATION SET (each control''s named defect, in the spec section 4): smooth
  the trace with its own 7-day rolling mean (L1.1); replay one day''s shape all year rescaled (L1.2);
  floor every period at a small positive value, removing the empty house (L1.3); shuffle day-types (L1.4);
  clone one home N times (L2.1, L2.2); collapse all heating-start times to one value i.e. reinstate HEATING_PERIOD_WEIGHTS
  (L2.3); set every annual total to the population mean (L2.4). L1.5 IS ITS OWN MUTATION TEST -- the current
  shipped generator IS the defect it detects. THREE FAIL-OPEN PATTERNS DEFENDED EXPLICITLY because a statistical
  suite is unusually exposed to all three: (1) FAIL-OPEN on empty input -- a statistic over zero homes,
  zero days or a short/missing trace must FAIL, never pass vacuously, so every statistic asserts its own
  input sufficiency first; (2) NaN-BLINDNESS -- reject non-finite values BEFORE any threshold comparison
  (a known class in this codebase); (3) TAUTOLOGY -- this is why PC1 moves from generator INPUT to validation
  TARGET: as an input it made the large-N check tautological (it would pass even if every home were physically
  absurd), as an output-only anchor it is independent, and any future change reintroducing PC1 as a per-home
  input silently re-tautologises L2.1.'
- '2026-08-03 FRAME -- ANTI-GOAL-SEEK (R12), and this suite is unusually EASY to goal-seek because injecting
  noise moves L1.1 without making anything more real. Every threshold is a DIAGNOSTIC BAND, never a target;
  drift toward a band edge triggers R4 (diagnose the mechanism), never a tuning pass. L1.5 is the structural
  guard against exactly that: it fails a noise-injected fake even when L1.1 passes, so L1.1-pass-with-L1.5-fail
  reads as "someone tuned the number" and the suite should say so in those words. Report WORST-CELL, never
  average -- an average across homes would hide the exact clone-cluster the test exists to find. Bands
  calibrated blind to company P&L (R13). Output lands in the coupled-gap ledger beside the other coupled-triad
  gap metrics. THE MONEY CONSEQUENCE is the metric that matters commercially and is the mission link:
  how much worse is a fabric-targeted intervention decision (insulate / heat-pump / PV / time-shift) made
  on EPC beliefs than the same decision made on ground truth -- which homes gain from which measure is
  HLC x weather x occupant arithmetic, and cost per tonne CO2e falls out of it. Savings count only from
  reduced or time-shifted usage, never from discounting.'
