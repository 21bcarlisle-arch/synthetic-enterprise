  - 'SETTLED 2026-08-11 BY THE SEVENTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question the sixth Hour left -- the `weight_null` money totals carry no interval, and `panel_mirror_weight_artefact` (0.6893 authored / 0.9043 drawn) is what puts BOTH populations on MIRROR INCONCLUSIVE -- answers as ONE defect seen from two ends, and it is the THIRD Hour''s own repair left undone in the channel that same Hour created. THE DEFECT: THE MONEY FIDELITY TERM WAS A DIFFERENCE OF AGGREGATES. `panel_mirror_weight_artefact` was |d(inferred_total - epc_total)| for the null over the same for the mirror -- two population sums -- while the verdict it certifies has been decided PER PREMISE with a paired bootstrap since the FIFTH Hour. `_register_mad`''s own docstring states the principle it violates ("an aggregate of differences, never a difference of aggregates"); it was applied to the kW/K channel and not to the GBP one. MEASURED BY RUNNING IT, TWELFTH TIME ON THIS ATOM: the mirror moves the deciding margin in BOTH directions (1 up / 3 down of 4 moved premises authored, 10 up / 8 down of 18 drawn), so summing first destroys 21.4% (authored) and 39.6% (drawn) of the mirror''s per-premise movement and a DIFFERENT 32.6% / 25.3% of the null''s -- and the ratio therefore moves BOTH WAYS: 68.9% published against a true 80.4% authored, 90.4% against 73.1% drawn. Neither published row changes hands (both fail the band under both shapes, so no published figure moved: 0.4269 / 0.4042 unchanged), but on 7 of 200 real 20-home subpanels of this atom''s own drawn population the OLD shape PASSES the 50% band -- as low as 32.9% -- where the per-premise shape fails it at up to 65.1%. On those the row certifies the mirror as attributable and publishes its null as a finding, over a mirror whose movement is mostly re-composition premise by premise. THE SECOND END, same defect: the sentence justifying INCONCLUSIVE quoted the weight null''s two population TOTALS ("GBP 29,722 epc /