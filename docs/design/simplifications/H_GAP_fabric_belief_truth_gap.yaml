  - 'CLOSED 2026-08-11, AND IT WAS NEVER INHERENT -- it was the defect above, described in its own terms. This entry recorded that "the panel mirror is only readable on populations whose register error is small against the truth''s spread, so a high-error population self-reports inconclusive (+-25% fixture measures 28.0%)" and filed it as a true limit of reflecting a truth through a belief, not a band to widen. It was neither: that figure was the no-skill baseline moving. Measured on a +-25% register panel under the repaired terms -- register-arm error disturbed 0.000000%, baseline moved 58.9%, attributable TRUE where the old term said 37.1% and INCONCLUSIVE. A high-error population does not blunt this mirror at all; the level-preserving reflection preserves |register - truth| per premise regardless of how large that error is. LESSON, worth more than the entry: a residual recorded as INHERENT can be the defect stated in the defect''s own vocabulary, and it will read as honest humility for as long as nobody measures it.'
  - 'SETTLED 2026-08-11 BY THE THIRD HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- what is panel_mirror_register_infidelity a ratio OF -- answers itself: a difference of two AGGREGATES over one of them, wrong three ways. (1) Its numerator is preserved BY ALGEBRA on the only branch either population takes (0.000e+00 / 1.4e-18; 0 of 15 and 0 of 200 infeasible, so the log fallback never fires) -- a constant PASS, and measuring an algebraically-zero quantity instead of assuming it does not make it failable. (2) A difference of means is bounded above by the mean of differences, equal only when every breach shares a sign; both populations are mixed-direction (register over-states on 1 of 15, 74 of 200), so on a real 20-premise subpanel the term read 4.36% INSIDE the band over a mirror that moved the register error 44.51% per premise -- 10.2x, in the passing direction. (3) THE ONE THAT MATTERS: the gate is denominated in kW/K and guards a verdict denominated in GBP. The mirror rescales annual_heat_kwh 0.151x-9.518x (62.9x spread) and money_consequence is built on it, so a WEIGHT-ONLY NULL (mirrored heat, original truth, both beliefs untouched, no sign flip in it) reproduces +13.8%/+19.6% of the mirror''s +14.1%/+19.9% -- about 98% of the published mirror''s money movement is re-composition, while the gate read attributable=True at 0.0000%. No published RANKING was wrong; the ATTRIBUTABILITY claim was. MECHANISED: _register_mad (per- premise) is the numerator; weight_null_panel is the null; panel_mirror_weight_artefact is the money artefact and the gate''s second half, zero corner SPLIT (nothing-moved = 0.0; a net zero from two large opposing channels = inf -- a first cut returned inf for both and refused a faithful identity mirror, caught by the suite); _why_unattributable names EVERY reason that fired and RAISES if the gate is red with none; INCONCLUSIVE fires only where a DECISIVE money headline exists to protect. R15 six source mutations ea