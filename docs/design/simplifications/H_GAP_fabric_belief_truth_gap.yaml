  - 'REFUTED 2026-08-11 BY ITS OWN TEST, and the real cause found. The Hour predicted a sign-mirrored panel would flip the money verdict. Built as TWO mirrors (a stock that fails the other way; the same inference stepping the other way) and NEITHER moves it, on either population: reversing the revision collapses accuracy and moves the money by GBP 308 of 18,603. A THIRD mirror finds it. Swap the two arms'' ERROR BARS and bases with every point estimate untouched, so both accuracy gaps are identical BY CONSTRUCTION, and the verdict flips to epc on BOTH populations. The arm that forgoes less is the arm ALLOWED TO ACT more often (declines 6v3 authored, 89v73 drawn). The two published headlines are not two views of one quantity: one scores accuracy, the other scores permission. R10 CLASS: any money metric built on a decision rule with an actionability test ranks arms by confidence unless something holds confidence fixed.'
  - 'CLOSED 2026-08-11 as a MECHANISM, and the finding itself was half wrong. The quantity called accuracy drift (0.0717 drawn, 0.1579 authored) is the drift of the IMPROVEMENT, i.e. BOTH arms: reflecting the truth is MEANT to wreck the posterior arm, so that number is large exactly when the mirror works and can never read as fidelity. The artefact is the REGISTER arm alone (panel_mirror_epc_gap_drift), pinned by a test that moves only the posterior and asserts the artefact term does not move. The level-preserving reflection did land: the docstring claim that 2*pivot-value "goes non-positive on a third of real panels" was never measured and is false on both published populations (0 of 15, 0 of 200), and switching cuts the drawn artefact from 25.9% of its gap to 1.9% with the register arm''s MAE numerator identical to 6 decimals. Whole-panel fallback, never per premise.'
  - 'CLOSED 2026-08-11: the Hour ran on the caveat machinery and found the disclosure orphaned in the case that actually occurs -- the fidelity figure lived only inside the COMPOSITION-DECIDED sentence, which prints only when the mirror FLIPS, and it flips on neither published population. So a reader saw two headlines, no composition caveat, and an invitation to conclude composition was ruled out while the authored panel''s mirror had disturbed the register arm by 14.1%. MIRROR INCONCLUSIVE now says so; the 2x2 of flip x fidelity is complete and each cell is pinned; R15 both ways on the two REAL populations (fires on authored, silent on drawn) plus 6 source mutations.'
  - 'SETTLED 2026-08-11 BY THE SECOND HOUR ON THIS MACHINERY, WHICH FOUND SOMETHING, SO THE LEVEL STAYED 2. panel_mirror_relative_infidelity''s fidelity term was 100% its own DENOMINATOR: the gap is a ratio and the level-preserving reflection preserves its numerator by algebra (register-arm MAE drift exactly 0.000e+00 on all four populations) while the no-skill baseline, a property of the truth population the mirror exists to reflect, moved 12.4%/1.9%/40.0%/0.0%. So the authored row published the instrument disturbed the arm it was built around by 14.1% over an instrument that had disturbed it by nothing -- and because a ratio cancels, the term ALSO passed genuinely broken mirrors (over 400 subpanels of the drawn population, the log fallback moved the register arm''s error 20-125% on 13 of them while the term read UNDER the 5% band). The 2x2 R15 fixtures could not have caught it: their faithful cell was an ADDITIVE register error and their blunt cell a PROPORTIONAL one, so the suite discriminated additive-vs-proportional and never preserved-vs-disturbed. MECHANISED: the raw MAE pair rides in the row, panel_mirror_register_infidelity became the artefact and the gate, panel_mirror_normaliser_drift the intended move with its own MIRROR YARDSTICK MOVED sentence, and panel_mirror_relative_infidelity is kept and documented as a compound that is NOT the gate. R15 five source mutations, md5 byte-clean restore, no published figure moved. NOTE: the replacement gate was itself repaired by the THIRD Hour below -- it was a difference of aggregates, and denominated in the wrong unit. Full text docs/staging/WORKER_FINDING_A_FIDELITY_TERM_THAT_IS_ALL_DENOMINATOR_2026-08-11.md.'
  - 'CLOSED 2026-08-11, AND IT WAS NEVER INHERENT -- it was the defect above, described in its own terms. This entry recorded that "the panel mirror is only readable on populations whose register error is small against the truth''s spread, so a high-error population self-reports inconclusive (+-25% fixture measures 28.0%)" and filed it as a true limit of reflecting a truth through a belief, not a band to widen. It was neither: that figure was the no-skill baseline moving. Measured on a +-25% register panel under the repaired terms -- register-arm error disturbed 0.000000%, baseline moved 58.9%, attributable TRUE where the old term said 37.1% and INCONCLUSIVE. A high-error population does not blunt this mirror at all; the level-preserving reflection preserves |register - truth| per premise regardless of how large that error is. LESSON, worth more than the entry: a residual recorded as INHERENT can be the defect stated in the defect''s own vocabulary, and it will read as honest humility for as long as nobody measures it.'
  - 'SETTLED 2026-08-11 BY THE THIRD HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- what is panel_mirror_register_infidelity a ratio OF -- answers itself: a difference of two AGGREGATES over one of them, wrong three ways. (1) Its numerator is preserved BY ALGEBRA on the only branch either population takes (0.000e+00 / 1.4e-18; 0 of 15 and 0 of 200 infeasible, so the log fallback never fires) -- a constant PASS, and measuring an algebraically-zero quantity instead of assuming it does not make it failable. (2) A difference of means is bounded above by the mean of differences, equal only when every breach shares a sign; both populations are mixed-direction (register over-states on 1 of 15, 74 of 200), so on a real 20-premise subpanel the term read 4.36% INSIDE the band over a mirror that moved the register error 44.51% per premise -- 10.2x, in the passing direction. (3) THE ONE THAT MATTERS: the gate is denominated in kW/K and guards a verdict denominated in GBP. The mirror rescales annual_heat_kwh 0.151x-9.518x (62.9x spread) and money_consequence is built on it, so a WEIGHT-ONLY NULL (mirrored heat, original truth, both beliefs untouched, no sign flip in it) reproduces +13.8%/+19.6% of the mirror''s +14.1%/+19.9% -- about 98% of the published mirror''s money movement is re-composition, while the gate read attributable=True at 0.0000%. No published RANKING was wrong; the ATTRIBUTABILITY claim was. MECHANISED: _register_mad (per- premise) is the numerator; weight_null_panel is the null; panel_mirror_weight_artefact is the money artefact and the gate''s second half, zero corner SPLIT (nothing-moved = 0.0; a net zero from two large opposing channels = inf -- a first cut returned inf for both and refused a faithful identity mirror, caught by the suite); _why_unattributable names EVERY reason that fired and RAISES if the gate is red with none; INCONCLUSIVE fires only where a DECISIVE money headline exists to protect. R15 six source mutations each firing their own named test, md5 byte-clean restore, and proven to PASS where the sign flip does the work (not always-red). No figure moved (0.4269/0.4042 re-taken; W1_11/W1_12 ledger rows refreshed). R10 CLASS: a fidelity term must be denominated in the unit its consumer''s verdict is; SIBLING: a promise made PER ELEMENT cannot be audited by a difference of aggregates. Full text docs/staging/WORKER_FINDING_THE_FIDELITY_GATE_WAS_DENOMINATED_IN_THE_WRONG_UNIT_2026-08-11.md. TERMINATION CONDITION unchanged: an Hour finding nothing NEW moves the level. THREE consecutive Hours have found the same FAMILY (a disclosed number that is not the quantity it names), so the next starts on panel_mirror_normaliser_drift and VERDICT_MATERIALITY -- which decides neither, and so whether this machinery speaks at all, and has never been measured.'
  - 'SETTLED 2026-08-11 BY THE FOURTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- has VERDICT_MATERIALITY, which decides "neither" and so whether this machinery speaks at all, ever been measured -- answers NO, and measured it lands at the MEDIAN of the distribution it discriminates. accuracy_favours was a 5%-of-the-larger band on the difference of two AGGREGATE population gaps. Over 120 random subpanels of the drawn population it read "neither" on 54%/46%/46%/38% at n=25/50/100/150 -- FLAT IN N, against a median relative difference of 0.0469/0.0404/0.0518/0.0534. A verdict rule whose decisiveness does not improve with evidence is a coin toss over which homes were drawn. It survived four Hours because the DIRECTION was never wrong (0 of 249 decisive subpanels named the register): it silenced a TRUE and unanimous direction on half the drawable panels, and "neither" reads as caution. The published drawn row cleared the band by 0.0032 (5.32% vs 5.00%), so a move to 0.055 for a MONEY reason erased a published ACCURACY verdict -- exactly the firewall VERDICT_MATERIALITY''s own comment claimed to be. THREE defects, only the third about the constant: (1) a per-premise claim audited by a difference of aggregates -- the sibling class the THIRD Hour named and then fixed on ONE term only, leaving the headline verdict on the aggregate form (R10: an instance fix does not close a class); (2) no uncertainty at all; (3) one constant, two subjects. REFUTED IN THE HOUR BY MEASUREMENT: sign instability (249/249 agree); dilution of a relative band on an extensive quantity (money_rel GROWS with N, 0.078 -> 0.177, "neither" 47% -> 0%); and a sign test as the replacement (166 of 200 premises are exact ties, so it runs on 34 rows at p=0.12 -- keeps the pairing, discards the magnitude). MECHANISED: _paired_accuracy_verdict takes the per-premise advantage |register-truth| - |inference-truth| with a percentile bootstrap CI on a C-S2 named substream, "neither" on