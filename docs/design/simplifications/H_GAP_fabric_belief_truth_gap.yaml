  - 'SETTLED 2026-08-12 BY THE FOURTEENTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- should a RESOLUTION CROSSING refuse at all, and are its two directions the same finding -- is answered YES and ONE-FINDING-TWO-CLAIMS, but could not be answered as posed: on the panels it was asked about the crossing was not a disagreement between instruments at all. THE DEFECT: the direction half claims it ''needs no threshold to read'', and the threshold it reads is the MOVER COUNT. `favours` is `neither` iff the 95% bootstrap interval contains zero, and a paired money advantage is exactly 0.0 on every premise both arms forgo the same money on, so P(a resample draws no mover) is (1-m/n)**n -> e**-m = 4.7% at three movers against a 2.5% tail and 1.65% at four -- measured with GBP 1,000,000 on every mover, three movers read GBP -37,975 per premise and name `neither`, and a BIGGER panel makes it worse (0.0388 at n=20, 0.0496 at n=1,000). The gate''s own fixture for that half was four movers against three of 79 borne homes. Across 5,000 fresh draws, 1,003 crossings, ZERO two-resolved-arms (reconfirming the thirteenth Hour independently), only FIFTEEN carriable -- 98.5% of what the half fired on was the mover count. THE FAIL-OPEN TWIN IS LARGER: 1,930 of 2,373 thin rows CERTIFIED, at its purest by evaluating `0.0 > 0.0`, which reaches the twelfth Hour''s five released stocks (all carried_by == (0,0)). THE ANSWER INVERTS: the reading the row USED names the arm 935 to 68 raw, 1 to 14 among the carriable, so the refusal sentence now names its direction. MECHANISED as `carried_by` + an `unresolved` before both existing halves, one-directional, R15 nine mutations all red, no published figure moved. FULL TEXT: docs/staging/WORKER_FINDING_THE_ARMS_HALF_OF_A_GATE_WAS_READING_THE_MOVER_COUNT_2026-08-12.md.'
