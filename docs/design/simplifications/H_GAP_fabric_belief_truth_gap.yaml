- '2026-08-03 THE MEASURED RESULT, RECORDED AND DELIBERATELY NOT TUNED (R12/R13). On the 10-premise panel
  (real Open-Meteo archive, 2022-01-01..04-30, mixed meter cadence 1/7/30d, one premise with NO certificate):
  EPC-vs-actual gap 0.2049, inferred-vs-actual gap 0.2397 -- i.e. C14''s posterior is a WORSE POINT ESTIMATE
  than the register prior it started from (improvement -0.0349). On the SAME panel the money consequence
  runs the OTHER WAY: deciding a fabric measure on the EPC belief misranks 10pct of premises (GBP 162
  forgone, 2,314 kg CO2e/yr), on the inferred belief it misranks NONE. THE TWO DISAGREE BECAUSE THEY ASK
  DIFFERENT QUESTIONS: prediction_gap is a LEVEL statistic (normalised squared error), the decision is
  an ORDERING one; the EPC register UNDERSTATES heat loss on every premise in the panel (asserted, not
  observed in passing), C14 corrects every premise upward toward truth and overshoots on some, which costs
  level accuracy and buys rank accuracy. THIS IS THE ATOM''S OWN FOUNDING LESSON ONE LEVEL UP -- the control
  SET had a hole shaped like the defect: a level-and-sum gap metric read ALONE would have reported the
  company''s inference as a REGRESSION while hiding that it strictly improved every decision anyone would
  take on it. Neither number is wrong; reporting only one of them would be. Both are now written to the
  ledger and both are pinned by test_INFERENCE_CAN_MAKE_THE_POINT_ESTIMATE_WORSE_WHILE_MAKING_THE_DECISION_BETTER,
  which re-derives rather than re-states if the sign flips.'
- '2026-08-03 R15 BOTH WAYS -- FIVE REAL SOURCE MUTATIONS, each firing its own named test with the others
  staying green (independence), baseline restored byte-clean (md5 78cbc4a4 verified after every run):
  drop the NaN rejection in _finite_series => the 3 non-finite tests fire and NOTHING else (74 green);
  drop the input-sufficiency raise in _require_homes => the 3 fail-open-1 cases + the too-few-premises
  gap test fire (73 green); blind pc1_is_an_input_to to return False => the 2 tautology tests fire (75
  green); silence the goal-seek warning => test_the_goal_seek_warning_says_someone_tuned_the_number fires.
  AND THE ONE THAT MATTERED: replacing the WORST-CELL selection in evaluate_two_level with an average
  left the suite GREEN -- because test_the_verdict_is_WORST_CELL_not_an_average was ITSELF A TAUTOLOGY,
  ending "assert generated_worst(textures) == approx(min(textures))" with generated_worst = min defined
  three lines below, i.e. min(x) == min(x), which cannot fail, and which never called evaluate_two_level
  at all. That is the R15 TAUTOLOGY pattern (checked value derived from the same source it checks) sitting
  INSIDE the test named for the rule, in a suite whose own docstring defends against tautology -- and
  only mutating the SOURCE found it; reading the file did not, twice. Rewritten to poison a population
  with one smoothed home and assert the reported L1.1 cell is that home''s value (with a fixture guard
  that the worst is materially below the mean, so the test proves something) and that the cell NAMES it;
  the mutation now fires it. WORTH CARRYING: a test that asserts a helper against the same helper passes
  forever, and the suite''s green count never blinks.'
