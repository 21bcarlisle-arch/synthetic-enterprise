  - 'CLOSED 2026-08-11: the refresh command could not reproduce the row it refreshed. The row now declares the args that reproduce it (safe_refresh_args whitelist, R15 both ways on 4 source mutations).'
  - 'CLOSED 2026-08-11 as a MECHANISM: both gap headlines were diluted by rows where the two arms are identical (7/15 authored, 166/200 drawn). arm_agreement conditions the headline on the company''s own BASIS, never on float equality of the arms (that would be a tautology), carries the tie fraction and BOTH figures into the ledger row, RAISES rather than publishing a diluted inference headline, and is proven by two populations differing only in EPC lodgement coverage over EXCHANGEABLE covered sets: published figure doubles, conditioned figure invariant to 1e-12.'
  - 'CLOSED 2026-08-11 as a MECHANISM: the gap was magnitude-shaped and blind to a SYSTEMATIC sign. belief_bias carries the signed error and an EXACT two-sided binomial sign test (checked against hand arithmetic, not against itself) for both arms into the row. The register is one-signed on both populations (p=0.0010 authored, p=0.0003 drawn), and where the majority and the mean point opposite ways a SKEWED caveat says so rather than printing both as if they agreed.'
  - 'REFUTED 2026-08-11 BY ITS OWN TEST, and the real cause found. The Hour predicted a sign-mirrored panel would flip the money verdict. Built as TWO mirrors (a stock that fails the other way; the same inference stepping the other way) and NEITHER moves it, on either population: reversing the revision collapses accuracy and moves the money by GBP 308 of 18,603. A THIRD mirror finds it. Swap the two arms'' ERROR BARS and bases with every point estimate untouched, so both accuracy gaps are identical BY CONSTRUCTION, and the verdict flips to epc on BOTH populations. The arm that forgoes less is the arm ALLOWED TO ACT more often (declines 6v3 authored, 89v73 drawn). The two published headlines are not two views of one quantity: one scores accuracy, the other scores permission. R10 CLASS: any money metric built on a decision rule with an actionability test ranks arms by confidence unless something holds confidence fixed.'
  - 'CLOSED 2026-08-11 as a MECHANISM, and the finding itself was half wrong. The quantity called accuracy drift (0.0717 drawn, 0.1579 authored) is the drift of the IMPROVEMENT, i.e. BOTH arms: reflecting the truth is MEANT to wreck the posterior arm, so that number is large exactly when the mirror works and can never read as fidelity. The artefact is the REGISTER arm alone (panel_mirror_epc_gap_drift), pinned by a test that moves only the posterior and asserts the artefact term does not move. The level-preserving reflection did land: the docstring claim that 2*pivot-value "goes non-positive on a third of real panels" was never measured and is false on both published populations (0 of 15, 0 of 200), and switching cuts the drawn artefact from 25.9% of its gap to 1.9% with the register arm''s MAE numerator identical to 6 decimals. Whole-panel fallback, never per premise.'
  - 'CLOSED 2026-08-11: the Hour ran on the caveat machinery and found the disclosure orphaned in the case that actually occurs -- the fidelity figure lived only inside the COMPOSITION-DECIDED sentence, which prints only when the mirror FLIPS, and it flips on neither published population. So a reader saw two headlines, no composition caveat, and an invitation to conclude composition was ruled out while the authored panel''s mirror had disturbed the register arm by 14.1%. MIRROR INCONCLUSIVE now says so; the 2x2 of flip x fidelity is complete and each cell is pinned; R15 both ways on the two REAL populations (fires on authored, silent on drawn) plus 6 source mutations.'
  - 'SETTLED 2026-08-11 BY THE SECOND HOUR ON THIS MACHINERY, WHICH FOUND SOMETHING, SO THE LEVEL STAYED 2. panel_mirror_relative_infidelity''s fidelity term was 100% its own DENOMINATOR: the gap is a ratio and the level-preserving reflection preserves its numerator by algebra (register-arm MAE drift exactly 0.000e+00 on all four populations) while the no-skill baseline, a property of the truth population the mirror exists to reflect, moved 12.4%/1.9%/40.0%/0.0%. So the authored row published the instrument disturbed the arm it was built around by 14.1% over an instrument that had disturbed it by nothing -- and because a ratio cancels, the term ALSO passed genuinely broken mirrors (over 400 subpanels of the drawn population, the log fallback moved the register arm''s error 20-125% on 13 of them while the term read UNDER the 5% band). The 2x2 R15 fixtures could not have caught it: their faithful cell was an ADDITIVE register error and their blunt cell a PROPORTIONAL one, so the suite discriminated additive-vs-proportional and never preserved-vs-disturbed. MECHANISED: the raw MAE pair rides in the row, panel_mirror_register_infidelity became the artefact and the gate, panel_mirror_normaliser_drift the intended move with its own MIRROR YARDSTICK MOVED sentence, and panel_mirror_relative_infidelity is kept and documented as a compound that is NOT the gate. R15 five source mutations, md5 byte-clean restore, no published figure moved. NOTE: the replacement gate was itself repaired by the THIRD Hour below -- it was a difference of aggregates, and denominated in the wrong unit. Full text docs/staging/WORKER_FINDING_A_FIDELITY_TERM_THAT_IS_ALL_DENOMINATOR_2026-08-11.md.'
  - 'CLOSED 2026-08-11, AND IT WAS NEVER INHERENT -- it was the defect above, described in its own terms. This entry recorded that "the panel mirror is only readable on populations whose register error is small against the truth''s spread, so a high-error population self-reports inconclusive (+-25% fixture measures 28.0%)" and filed it as a true limit of reflecting a truth through a belief, not a band to widen. It was neither: that figure was the no-skill baseline moving. Measured on a +-25% register panel under the repaired terms -- register-arm error disturbed 0.000000%, baseline moved 58.9%, attributable TRUE where the old term said 37.1% and INCONCLUSIVE. A high-error population does not blunt this mirror at all; the level-preserving reflection preserves |register - truth| per premise regardless of how large that error is. LESSON, worth more than the entry: a residual recorded as INHERENT can be the defect stated in the defect''s own vocabulary, and it will read as honest humility for as long as nobody measures it.'
  - 'SETTLED 2026-08-11 BY THE THIRD HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- what is panel_mirror_register_infidelity a ratio OF -- answers itself: a difference of two AGGREGATES over one of them, wrong three ways. (1) Its numerator is preserved BY ALGEBRA on the only branch either population takes (0.000e+00 / 1.4e-18; 0 of 15 and 0 of 200 infeasible, so the log fallback never fires) -- a constant PASS, and measuring an algebraically-zero quantity instead of assuming it does not make it failable. (2) A difference of means is bounded above by the mean of differences, equal only when every breach shares a sign; both populations are mixed-direction (register over-states on 1 of 15, 74 of 200), so on a real 20-premise subpanel the term read 4.36% INSIDE the band over a mirror that moved the register error 44.51% per premise -- 10.2x, in the passing direction. (3) THE ONE THAT MATTERS: the gate is denominated in kW/K and guards a verdict denominated in GBP. The mirror rescales annual_heat_kwh 0.151x-9.518x (62.9x spread) and money_consequence is built on it, so a WEIGHT-ONLY NULL (mirrored heat, original truth, both beliefs untouched, no sign flip in it) reproduces +13.8%/+19.6% of the mirror''s +14.1%/+19.9% -- about 98% of the published mirror''s money movement is re-composition, while the gate read attributable=True at 0.0000%. No published RANKING was wrong; the ATTRIBUTABILITY claim was. MECHANISED: _register_mad (per- premise) is the numerator; weight_null_panel is the null; panel_mirror_weight_artefact is the money artefact and the gate''s second half, zero corner SPLIT (nothing-moved = 0.0; a net zero from two large opposing channels = inf -- a first cut returned inf for both and refused a faithful identity mirror, caught by the suite); _why_unattributable names EVERY reason that fired and RAISES if the gate is red with none; INCONCLUSIVE fires only where a DECISIVE money headline exists to protect. R15 six source mutations each firing their own named test, md5 byte-clean restore, and proven to PASS where the sign flip does the work (not always-red). No figure moved (0.4269/0.4042 re-taken; W1_11/W1_12 ledger rows refreshed). R10 CLASS: a fidelity term must be denominated in the unit its consumer''s verdict is; SIBLING: a promise made PER ELEMENT cannot be audited by a difference of aggregates. Full text docs/staging/WORKER_FINDING_THE_FIDELITY_GATE_WAS_DENOMINATED_IN_THE_WRONG_UNIT_2026-08-11.md. TERMINATION CONDITION unchanged: an Hour finding nothing NEW moves the level. THREE consecutive Hours have found the same FAMILY (a disclosed number that is not the quantity it names), so the next starts on panel_mirror_normaliser_drift and VERDICT_MATERIALITY -- which decides neither, and so whether this machinery speaks at all, and has never been measured.'
  - 'SETTLED 2026-08-11 BY THE FOURTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- has VERDICT_MATERIALITY, which decides "neither" and so whether this machinery speaks at all, ever been measured -- answers NO, and measured it lands at the MEDIAN of the distribution it discriminates. accuracy_favours was a 5%-of-the-larger band on the difference of two AGGREGATE population gaps. Over 120 random subpanels of the drawn population it read "neither" on 54%/46%/46%/38% at n=25/50/100/150 -- FLAT IN N, against a median relative difference of 0.0469/0.0404/0.0518/0.0534. A verdict rule whose decisiveness does not improve with evidence is a coin toss over which homes were drawn. It survived four Hours because the DIRECTION was never wrong (0 of 249 decisive subpanels named the register): it silenced a TRUE and unanimous direction on half the drawable panels, and "neither" reads as caution. The published drawn row cleared the band by 0.0032 (5.32% vs 5.00%), so a move to 0.055 for a MONEY reason erased a published ACCURACY verdict -- exactly the firewall VERDICT_MATERIALITY''s own comment claimed to be. THREE defects, only the third about the constant: (1) a per-premise claim audited by a difference of aggregates -- the sibling class the THIRD Hour named and then fixed on ONE term only, leaving the headline verdict on the aggregate form (R10: an instance fix does not close a class); (2) no uncertainty at all; (3) one constant, two subjects. REFUTED IN THE HOUR BY MEASUREMENT: sign instability (249/249 agree); dilution of a relative band on an extensive quantity (money_rel GROWS with N, 0.078 -> 0.177, "neither" 47% -> 0%); and a sign test as the replacement (166 of 200 premises are exact ties, so it runs on 34 rows at p=0.12 -- keeps the pairing, discards the magnitude). MECHANISED: _paired_accuracy_verdict takes the per-premise advantage |register-truth| - |inference-truth| with a percentile bootstrap CI on a C-S2 named substream, "neither" only where the interval straddles zero; decisiveness now behaves like evidence (55/60, 46/60, 35/60, 18/60 unresolved as n grows). The STATISTIC was repaired, not the band (R12/R13). ACCURACY VERDICT UNRESOLVED protects the disclosure the repair would otherwise have deleted: on the authored panel the old rule said epc while money said inferred, so verdicts_agree was False; the repaired verdict is unresolvable there (15 premises, 7 ties, CI [-0.0162,+0.0075]), which flips verdicts_agree True and would have silently retired a caveat. R15 SEVEN source mutations each firing their own named test, md5 byte-clean restore, proven neither one-directional nor always-red -- and one mutation was initially SILENT, which is the point: the determinism test, written on a 12-premise fixture with two distinct advantage values, passed an unseeding mutation because the bootstrap percentiles land on the same discrete points whatever the seed; rewritten on a continuous fixture, caught by the mutation run and not by review. No figure moved (0.4269/0.4042 re-taken on the row''s own declared refresh_args; drawn verdict stays "inferred", now earned at +0.0024 kW/K CI [+0.0005,+0.0047], 166/200 ties). R10 CLASS: a verdict band must be measured against the DISTRIBUTION of the quantity it bands -- failure signature, decisiveness FLAT IN N. NOT DONE AND NOT IMPLIED: panel_mirror_normaliser_drift was named in the directed question and was NOT examined; the MONEY half of _favours is still a band on two aggregate GBP sums with no error bar (its decisiveness DOES improve with N, so it is not obviously the same defect, but the confidence mirror already flips it). Full text docs/staging/WORKER_FINDING_THE_ACCURACY_VERDICT_HAD_NO_ERROR_BAR_2026-08-11.md. TERMINATION CONDITION unchanged: an Hour finding nothing NEW moves the level. FOUR consecutive Hours have found the same FAMILY (a published number that is not the quantity it names), so the next starts on panel_mirror_normaliser_drift and the MONEY half of _favours.'
  - 'SETTLED 2026-08-11 BY THE FIFTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The money headline was a 5%-of-the-larger band on the difference of two GBP SUMS, with no error bar -- the fourth Hour''s own NOT-DONE item, filed there as probably-something-else because "its decisiveness DOES improve with N". Over 120 random subpanels of the drawn population the old rule named an arm on 75/87/98/100% at n=25/50/100/150 while the paired per-premise evidence resolved 13/59/100/100%, so 62% of 25-home panels published a verdict the homes could not support; signature DECISIVENESS DECOUPLED FROM N. The authored panel is in that regime: aggregate margin 57.7% of the larger, 80.6% of it ONE HOUSE, paired interval [+GBP 3, +GBP 4,736]. `panel_mirror_normaliser_drift`, the other half of the directed question, was examined and REFUTED as a defect. MECHANISED: `_paired_money_verdict` on ALL FOUR money verdicts (R10 class), one `_premise_forgone` definition, three new disclosures, `ONE_HOUSE_SHARE`. R15 nine source mutations each firing their own named test, md5 clean; one initially survived because no fixture had the two rules disagreeing. No figure moved (0.4269/0.4042). NOT CLOSED: `MIRROR_FIDELITY_BAND` serves two subjects -- the next Hour''s opener. Full text docs/staging/WORKER_FINDING_THE_MONEY_VERDICT_WAS_A_SUM_AND_A_SUM_HAS_NO_ERROR_BAR_2026-08-11.md.'
  - 'OPEN, blocked on data this repo does not hold: (a) L1.4 day-type magnitude and (b) L1.2h heating-shape repeatability, both unchanged and unchanged in reason; (c) remains W1_12''s.'
  - 'SETTLED 2026-08-11 BY THE SEVENTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question the sixth Hour left -- the `weight_null` money totals carry no interval, and `panel_mirror_weight_artefact` (0.6893 authored / 0.9043 drawn) is what puts BOTH populations on MIRROR INCONCLUSIVE -- answers as ONE defect seen from two ends, and it is the THIRD Hour''s own repair left undone in the channel that same Hour created. THE DEFECT: THE MONEY FIDELITY TERM WAS A DIFFERENCE OF AGGREGATES. `panel_mirror_weight_artefact` was |d(inferred_total - epc_total)| for the null over the same for the mirror -- two population sums -- while the verdict it certifies has been decided PER PREMISE with a paired bootstrap since the FIFTH Hour. `_register_mad`''s own docstring states the principle it violates ("an aggregate of differences, never a difference of aggregates"); it was applied to the kW/K channel and not to the GBP one. MEASURED BY RUNNING IT, TWELFTH TIME ON THIS ATOM: the mirror moves the deciding margin in BOTH directions (1 up / 3 down of 4 moved premises authored, 10 up / 8 down of 18 drawn), so summing first destroys 21.4% (authored) and 39.6% (drawn) of the mirror''s per-premise movement and a DIFFERENT 32.6% / 25.3% of the null''s -- and the ratio therefore moves BOTH WAYS: 68.9% published against a true 80.4% authored, 90.4% against 73.1% drawn. Neither published row changes hands (both fail the band under both shapes, so no published figure moved: 0.4269 / 0.4042 unchanged), but on 7 of 200 real 20-home subpanels of this atom''s own drawn population the OLD shape PASSES the 50% band -- as low as 32.9% -- where the per-premise shape fails it at up to 65.1%. On those the row certifies the mirror as attributable and publishes its null as a finding, over a mirror whose movement is mostly re-composition premise by premise. THE SECOND END, same defect: the sentence justifying INCONCLUSIVE quoted the weight null''s two population TOTALS ("GBP 29,722 epc / 12,835 inferred") -- the aggregate rule the verdict itself stopped using at the fifth Hour -- as the stated ground, with no interval on either. MECHANISED: `_paired_margin_moves` (three panels, premise-by-premise, order-checked, non-finite-checked) carried on the verdict as `margin_moves`; the term is now mean|null move| over mean|mirror move|, band UNTOUCHED at 0.50 (the STATISTIC was repaired, R12); the old answer survives as `panel_mirror_weight_artefact_aggregate` beside `panel_mirror_margin_cancellation` and `weight_null_margin_cancellation`, which are the mechanism of the finding on the row; a 95% percentile-bootstrap interval on its own named C-S2 substream (WEIGHT_ARTEFACT_SEED, a THIRD seed -- an instrument whose error bar shares resampling noise with the verdict it tests is not independent), computed through the SAME `_artefact_share` the gate reads; `_bootstrap_mean_ci` generalised to `_bootstrap_statistic_ci` so three published intervals share ONE resampling implementation. R15 FIVE source mutations, each firing its own named test: the aggregate shape restored (2 tests), the interval computed by a different expression, the sentence quoting the two totals again, `_mean_abs` failing open on an empty panel, the reordering guard removed. 234 tests green in the atom''s own file plus 79 across its three siblings. OPENER FOR THE EIGHTH HOUR, and it is this Hour''s own deliberate non-move: `panel_mirror_is_attributable` still compares a POINT ESTIMATE to the band, and on the suite''s own passing fixture the interval straddles it (0.4364, 95% [0.219, 0.792]) -- the mirror is certified attributable on evidence that cannot resolve which side of the band it sits. The authored panel reads 80% [73%, 122%], so the share is not bounded by 1 either. Moving a live gate onto an interval in the same Hour that repaired its statistic would change what is published for two reasons at once, so it was disclosed and not taken.'
  - 'SETTLED 2026-08-11 BY THE EIGHTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- `panel_mirror_is_attributable` compares a POINT ESTIMATE to the band while the interval around it straddles it -- confirms on the LIVE rows, not only on the fixture the seventh Hour cited. Measured on real subpanels of this atom''s published 200-premise population (own share 0.7307, above the band, so no subpanel of it has an honest pass): the point rule certified 50/37/30/15% at n=20/30/50/100, worst case off FOUR moved homes with a 95% interval of [0.000, 1.000], and at n=100 fourteen of one hundred and twenty certified while carrying a DECISIVE money verdict -- where a certified mirror publishes ''no composition effect'' as a finding. Signature is NOT flat-in-N: the error falls with N, but the rule never learns it cannot resolve (n=100: interval certifies 0 of 120, point rule still 14). MECHANISED as three states -- `panel_mirror_weight_artefact_resolution` reads the interval, `panel_mirror_attribution` combines both channels, only a RESOLVED pass certifies, fail-closed on a missing interval except at the exact zero corner. One-directional by construction: it can only withdraw certification. THE ALWAYS-RED RISK WAS SEARCHED, NOT ASSUMED -- the suite''s own not-always-red proof rested on a panel reading 0.4711 on [0.414, 0.561], so a resolved pass had to be found (700 draws, 13 resolvable flips, 8 resolved-faithful; `_flipping_population` redefaulted to 60 homes at 0.1690 on [0.123, 0.230]). R15 six source mutations, md5 byte-clean; ONE SURVIVED the first sweep -- the disclosure keyed back to the point estimate, this Hour''s own defect in its own repair -- because both fixtures AGREED between the two rules. R10 CLASS: a control set with no population where the controlled thing varies is a control that cannot fail; SIBLING: when a gate moves onto a new statistic, its DISCLOSURE inherits the retired one unless someone re-asks what the sentence is keyed to. No published figure moved (0.4269 / 0.4042 re-taken; both rows attributable=False before and after; the only claim that changed is ''measured above the band'' -> ''this panel cannot resolve which side''). OPENER FOR THE NINTH HOUR: the REGISTER half of the gate is still a bare point comparison, and it is zero by algebra on every branch either published population takes -- whether a term that cannot move can carry half a gate is the third Hour''s own unfollowed note. ALSO NAMED: the weight artefact is called a SHARE and is not bounded by 1 (authored row 80% on [73%, 122%]).'
  - 'SETTLED 2026-08-11 BY THE NINTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- can the register half of the gate, zero by algebra on the branch both published populations take, carry half a gate -- answers YES, but not for the reason the question expected, and the expected repair is REFUTED: the fallback-branch statistic concentrates fast (unresolved on 3 of 22 subpanels at n=20, 0 of 46 by n=50) so copying the eighth Hour''s interval onto it would have been cargo. THE DEFECT IS ONE LEVEL UP: the term is a MEAN and the promise is UNIVERSAL. `_reflect_level` promises every premise its absolute error back, so the honest level-branch value is exactly zero and any breach is a breach -- audited by a panel mean against a 5% band, which on 200 homes reads ''nine homes may move completely''. The third Hour closed the CANCELLATION in this term and left the DILUTION. MEASURED BY INJECTING THE DEFECT AT THE REFLECTION CALL: 9 of the drawn 200 and 4 of the authored 15 reflected by the WRONG RULE certify; 65 of 200 (32.5%) through the WRONG PIVOT certify, worst home moved 1,825%, gate reading 4.50%. SIGNATURE, and why it is a class: one fixed defective home reads 0.0022 at n=15 and 0.0002 at n=200 while the worst per-premise breach is 15.4% at every size -- SENSITIVITY FALLS WITH N, the third sibling of the fourth Hour''s FLAT-IN-N and the fifth''s DECOUPLED-FROM-N and the worst-behaved, monotone in the wrong direction. MECHANISED: `_register_breaches` per premise; `panel_mirror_register_worst_breach` (a promise is audited at its WORST violation); a COUNT beside it; the gate SPLIT BY BRANCH -- level on the worst breach against a sixth constant `REGISTER_PRESERVATION_TOLERANCE` (a NOISE FLOOR, six orders of headroom either side of 1.788e-15 and 15.4%), fallback keeping the mean because no absolute-error promise is made there and the worst-case shape would be always-red on an instrument working as designed. A PROMISE IS AUDITED AT ITS WORST VIOLATION; A CHARACTERISTIC IS SUMMARISED AT ITS MEAN. One-directional by construction. R15 seven source mutations, md5 byte-clean, not always-red on either branch with the fallback half SEARCHED (an 80-home 1%-accurate register with one rogue certificate certifies at 0.0306 while its worst breach is 0.600). The suite caught the repair''s own inherited check within the hour -- the zero-corner test went on passing while asserting nothing about the live gate. No published figure moved (0.4269 / 0.4042 re-taken after the code landed; both rows'' register channel attributable before and after). R10 CLASSES: a universal per-premise promise cannot be audited by a panel mean; a tolerance band on an EXACT claim is the wrong shape of thing, not a loose setting. OPENER FOR THE TENTH HOUR: `panel_mirror_weight_artefact` is called a SHARE and is not bounded by 1 (authored row 80% on [73%, 122%]) -- named by the eighth Hour, untaken since, now the oldest open item on this atom.'
  - 'SETTLED 2026-08-12 BY THE TENTH HOUR, WHICH FOUND SOMETHING, SO THE LEVEL STAYS 2. The directed question -- the artefact term is called a SHARE and is not bounded by 1 -- is REFUTED as a defect in the statistic: the sixth Hour''s bounded shape is BIT-IDENTICAL on the drawn population and on all 800 subpanels of it, differs by 0.0367 on the authored one, crosses the band on neither, and is always <= the shipped ratio, so adopting it could only GRANT certification. Readings over 1 are real (the sign flip opposing its own re-weighting); the word "reproduced" was what could not admit 122%. CHASING WHERE THAT 122% CAME FROM FOUND THE REAL DEFECT: it is a bootstrap over FOUR HOMES, and the guard that withholds an interval read `len(margin_moves)` -- the panel''s ROW COUNT -- while a premise neither channel moved contributes exactly zero to both sums the share is built from. The authored published row is below this file''s own MIN_HOMES_FOR_DIVERSITY and its guard passed on fifteen rows. MEASURED on 1,200 real subpanels of the drawn population (own share 0.7307, so every certification on a subpanel of it is wrong): 93 certified, 92 of them off fewer than five movers, 83 off fewer than three, 59 off ONE home; the guard fired on none of the 1,200; at six movers and above, none certified. The worst point is DEGENERATE and is why the eighth Hour''s interval rule could not stop it -- one carrier makes every resample read the same ratio, so the interval collapses to ZERO WIDTH and certifies wearing maximum confidence. MECHANISED: `panel_mirror_artefact_evidence_premises` (either channel, not the mirror''s movers), the guard reads it, the constant is UNTOUCHED (R12; same subject, only the counting was wrong -- not the sixth Hour''s one-constant-two-subjects class), one-directional by construction, the withheld-interval sentence re-keyed to the population actually counted, an over-100% clause, and the diluted per-premise figures labelled (GBP 314 per PANEL premise against GBP