atom_id: W2_13_occupancy_consumption_volume_shape
simplifications:
- '2026-07-23 AUTHORED as a DISCOVER atom by director verdict (DIRECTOR_SEGMENTS_REVIEW_VERDICTS_2026-07-23.md section 3, item 2). provenance: proposal / loop_stage: discover -- non-blocking, the loop self-draws it. Scope: occupancy archetypes currently drive COMPLAINT propensity only -- two extra people in a house changes how OFTEN they call, not WHAT they use. The atom wires occupancy (people count, adults vs children where anchorable) into demand VOLUME and SHAPE, alongside the director causal sketch -- hours-at-home, cooking fuel, overnight device load -- as candidate shape drivers. NATURAL HOME (director: fold, do not duplicate): the held HH load-shape clustering lane -- concretely simulation/demand_model.py::build_demand_shape and simulation/premise_demand.py (W1_5_premise_demand_shape), which ALREADY consume an occupancy_multiplier for shape; this atom deepens that from a scalar multiplier into a people-count/composition-driven volume+shape response. DISCOVER first: confirm exactly where occupancy enters the demand path today and what an anchorable people-count response would add; couples_with W1_5. BUILD stays gated (EPOCH_GATING).'
- '2026-07-23 DISCOVER COMPLETE (docs/design/W2_13_OCCUPANCY_CONSUMPTION_VOLUME_SHAPE_DISCOVER.md). SEAM NAMED = simulation/demand_model.py::build_demand_shape at the occupancy_multiplier call site (line ~174-175) + occupancy_multiplier (line 93): occupancy TODAY is a 3-category SHAPE-only multiplier (0.75-1.4, near-1.0 so it redistributes but does NOT scale total volume) keyed on a categorical occupancy_pattern string from saas/property_model.py -- no people-count, no adults-vs-children, no volume gradient. FOLD not fork: deepen the one call site -- (1) add a per-household VOLUME factor on the base level following the NEED per-adult SUBLINEAR curve (elec +43.8/+15.7/+13.6/+9.5pp for the 2nd-5th adult, DESNZ NEED 2023, ANCHORED H); (2) deepen occupancy_multiplier so the DAYTIME window (09:00-17:00) ONLY responds to composition (EFUS 2017: ~30pp daytime at-home swing by size/pensioner/employment; evening 88% / overnight 94% near-universal -> unchanged, ANCHORED H); category returns become the no-people-count fallback. STAYS R10 (sample, do not point-estimate): child-vs-adult marginal increment (NEED is adults-only), the occupancy-rate->kWh-shape-weight conversion, cooking-fuel/overnight-device load (unfetched lead: efus-light-appliances-smart-tech.pdf). couples_with W1_5: volume factor is deterministic and distinct from W1_5 idiosyncratic noise; gap measured against W1_5. Level-1 PROPOSED; level_current held at 0 (cell move is the director per the level gate, R16). BUILD stays EPOCH-gated.'
- '2026-07-29 blocked_on CLEARED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 1+2): director_build_open/director_level_up are abolished as BLOCK TYPES -- there is no such thing as needing a build opened, and levels are proposed+recorded (ledger-backed, self-certification via background.gate_authorization.record_level_up_self_certified now suffices, R16), never gated. Prior blocked_on/block_reason preserved above/below for the record; this atom re-enters the normal draw for whichever lane/loop_stage it already carries.'
- '2026-07-29 BUILD COMPLETE + L1 SELF-CERTIFIED (commit b29231dc1; ledger LEVEL_UP_SELF_CERTIFIED atom=W2_13 level=1 channel=self). The prior block_reason (''the level move awaits director ratification (R16)'') is superseded by DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md item 2 and preserved for the record. FOLD NOT FORK, at the ONE call site DISCOVER named (simulation/demand_model.py::build_demand_shape): occupancy WAS a 3-category shape-only multiplier (0.75-1.4, near-1.0, so it redistributed load across the day but did NOT scale total volume) keyed on a categorical occupancy_pattern string from saas/property_model.py -- no people-count, no adults-vs-children, no volume gradient. Two extra people in a house changed how OFTEN they called, not WHAT they used. Now: (1) VOLUME -- a per-household factor on the base level following the DESNZ NEED 2023 per-adult SUBLINEAR curve (elec +43.8/+15.7/+13.6/+9.5pp for the 2nd-5th adult, ANCHORED H), normalised so a 1-adult household is not silently re-baselined; (2) SHAPE -- occupancy_multiplier deepened so the DAYTIME window (09:00-17:00) responds to COMPOSITION only, anchored to EFUS 2017''s ~30pp daytime at-home swing by household size. R12 HELD: both moves are fidelity-to-reality, anchored to external sources, decided blind to company P&L -- no output metric was targeted. R13 respected: BASELINE fidelity only, no curriculum content touched. EVIDENCE: 36 new tests green (30 shape/volume + 6 property people-count), R15 mutation-proven -- the two classic ways this control could have been theatre both FIRE: dropping the normaliser (anchoring on a 1-adult household) and a 5pct across-the-board lift (a silent scale masquerading as a composition response); 124 regression tests green. SIMPLIFICATIONS REGISTERED: children are modelled only via the adults-vs-children split feeding the daytime composition response -- there is no age-banded child load (a toddler at home all day and a teenager at school are the same input today); the per-adult curve is a national NEED average with no regional, tenure or fuel-poverty interaction; and cooking fuel + overnight device load, named in the director''s causal sketch as candidate shape drivers, are NOT yet separate inputs -- they are absorbed into the aggregate daytime/evening response rather than modelled as their own drivers. couples_with W1_5_premise_demand_shape. Remaining VERIFY leg: population-level statistical check that the new volume gradient shows up in the generated book''s kWh distribution, plus 0b deployed-surface evidence.'
