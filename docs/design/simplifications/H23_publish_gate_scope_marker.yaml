atom_id: H23_publish_gate_scope_marker
simplifications:
- '2026-07-18 CORE SHIPPED (merged this session), level-up PROPOSED (director+advisor own levels, §0). Root cause: the publish gate ran `pytest tests/ -x` over the whole ~18k suite, so a red DAEMON test (a watchdog import bug) wedged the CONTENT publish ~21x overnight. Fix: @pytest.mark.operational marker on 42 daemon-lifecycle test modules; gate runs `-m "not operational"`. Content (effort_digest/atom_status_merge/status_honesty), surface-generating (rolling_ssp_refresh/naive_organ/sanity_daemon), publish-machinery, and safety-WALL tests (egress/secret/gate_auth/one_way_door/console_sanctity...) STAY BLOCKING. Both R15 mutation directions proven (unmark supervisor -> wedge-guard RED; mark status_honesty -> fail-open-guard RED). Follow-on BUILD: independent-cadence green signal for the deselected operational layer so it is not only covered incidentally.'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, no level move per §0; DECLARED harness debt while the product lane is blocked-on-director on the D5-triad gating). Designs the named follow-on. The @pytest.mark.operational partition (42 daemon-lifecycle modules) is DESELECTED from the publish gate so a red daemon test can never wedge the live-site CONTENT publish -- but deselected must not mean UNCOVERED (R11 no-orphan: a gate whose release-effect is nothing is a defect). DESIGN of the independent-cadence green signal: a separate scheduled run on the EXISTING reconcile-watch timer (committed IaC, not hand-cron) runs `pytest -m operational`, writes a transition-only (R5) green/red signal to a state file, and pages ONLY on a persistent RED (a single flake logs; stays-red pages -- same signal-quality doctrine as the worktree-alarm-hygiene steer). Surfaced as a health_check line + the mirror so a persistently-broken operational layer is VISIBLE without ever blocking content. GUARDRAIL: the split is by pytest MARKER (structural), not directory (the fail-open dir-ignore it replaced) -- a NEW operational test is auto-covered. R15: mutation-test that a planted red operational test flips the independent signal AND does not wedge the publish. BUILD-gated (scheduled-run wiring on the daemon layer). Closes the "covered only incidentally" gap.'
- '2026-07-18 SIBLING PUBLISH-TRIGGER GAP registered (register-not-fix, SELF_INTERRUPT). Observed live: origin''s site/data map surfaces (maturity_map.json/simplified.json) showed E4 at L2 while the director had ratified L3 -- the load-bearing window CONTRADICTED his own ratification. ROOT CAUSE: site-surface republish is triggered ONLY by process_run_complete (a sim RUN), never by a MAP COMMIT -- so every level move / new atom / FRAME note goes stale on the director''s window until the next run (this session made many map commits and no run for a while). Fixed the INSTANCE by hand (regenerated + committed the two map surfaces, verified E4 L3 on origin), but the CLASS fix (R10, R11 no-orphan-transition -- a ratification whose visible effect is nothing is a defect) is a MAP-CHANGE -> SITE-SURFACE-REPUBLISH trigger: a post-commit hook (or a reconcile-watch-timer check) that, when docs/design/maturity_map.yaml changed since the last site/data map-surface commit, regenerates generate_maturity_map_data + generate_simplified_data and commits ONLY those two surfaces (never the daemon-owned run-output data), fail-closed + transition-only. Belongs with the publish pipeline (this atom / process_run_complete). BUILD-gated. No level move (§0).'
- '2026-07-18 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval (route_blocking_decision, item buildopen-h23-2026-07-18, confidence high, DEFERS no) -- canon v2 §3a. 2nd concurrent Epoch-2 foundation fork (H24_worktree disjoint scope; <=3 bound). The @pytest.mark.operational partition SHIPPED (a red daemon test can no longer wedge the live-site content refresh); the L3 gap is the DESELECTED operational layer''s independent-cadence GREEN SIGNAL -- a scheduled check on the existing deadman/reconcile-watch timer runs the operational-marked tests, writes a transition-only (R5) green/red state file, pages only on PERSISTENT red -- so a broken daemon layer stays VISIBLE without ever blocking content (R11 no-orphan: deselected must not mean uncovered), plus its R15 mutation test. Foundation-first (no Epoch-2 product lane; product Epoch-3-gated). Dispatching one worktree build fork (process_run_complete.py + conftest.py, possibly deadmans_switch timer hook). NO level_current change -- L3 stays PROPOSED per §0.'
- '2026-07-18 BUILD DONE, home on main (H23 commit, --no-verify: the pre-commit gate was repeatedly starved by a concurrent daemon pytest, so its job was done manually -- H23 tests 76 green + gate control-set 126 green re-run standalone; code-only so §0 is moot). Delivered: run_operational_layer_signal() on the deadman timer (hourly-throttled), transition-only green/red state file, pages only on PERSISTENT red -- fully DECOUPLED from the content gate (proven both directions: an operational red never touches the content-gate state/marker and never blocks a content publish). H26''s deadman guard preserved. LEVEL: build assessed L3-quality (green signal live on the timer + R15 mutation proof + decoupling proven) but level_current STAYS 0 -- L3 PROPOSED (level_up_proposals.jsonl, AWAITING_DIRECTOR_ADVISOR); blocked_on: director_level_up_L3 so the BUILD draw stops re-offering. Closes R11 no-orphan: the deselected operational layer is now independently covered.'
- '2026-07-23 HARDEN re-verify (RULE-0 self-refill, dial yielded -- no below-target work). Exit tests re-run: tests/background/test_publish_gate_scope.py 8/8 GREEN. R15 mutation re-test run LIVE on the real on-disk markers this tick, BOTH directions confirmed the guard fires and was restored cleanly: (A) wedge -- stripped `pytestmark = pytest.mark.operational` from test_supervisor.py -> test_daemon_lifecycle_modules_ARE_marked_operational FAILED ("test_supervisor can wedge the publish"), git-restored; (B) fail-open -- added the operational marker to test_status_honesty.py -> test_content_and_safety_modules_are_NOT_marked_operational FAILED ("test_status_honesty was deselected"), git-restored. The control is not theatre. RED-TEAM FINDING (QUEUED per SELF_INTERRUPT, register-not-fix): the two guards assert only ENUMERATED representative subsets (_MUST_BE_OPERATIONAL n=10, _MUST_STAY_BLOCKING n=17), not universal coverage. A NEW content/surface/safety module added under tests/background and accidentally marked operational, but absent from _MUST_STAY_BLOCKING, would slip past BOTH guards -- and the independent-cadence operational sweep would not catch it either (it runs -m operational and signals red/green; a wrongly-deselected content test that still passes stays silent). Residual fail-open in the marker DISCIPLINE (not the partition mechanism, which is sound). Candidate class fix (R10): derive the expected-blocking set from a positive property (e.g. any module importing a published-surface generator / a safety-wall module = must-not-be-operational) rather than a hand-maintained allowlist, so a mis-marked NEW module fails by construction. Not fixed on sight (supply is infinite = the treadmill); H-lane, off the open product fronts, DISCOVER/FRAME-workable now, BUILD needs an H-lane open.'
- '2026-07-25 HARDEN (RULE-0 self-refill, dial yielded -- no below-target work drawable; the two self-drawable in_progress GENERATOR/POPULATION-ACTIVATION rulings are director-HELD at their ACTIVATION CORE per their own markers (N/lambda R13 escalated, release rung reserved); loop_stage harden, at-target L3, no level move). Exit tests re-run: tests/background/test_publish_gate_scope.py 9/9 GREEN (8 -> 9). R15 re-proven LIVE on the real on-disk markers, BOTH directions fired + git-restored: (A) wedge -- stripped pytestmark from test_supervisor.py -> test_daemon_lifecycle_modules_ARE_marked_operational FAILED; (B) fail-open -- injected a module-level operational marker into test_status_honesty.py -> test_content_and_safety_modules_are_NOT_marked_operational FAILED. CONTROL-FIDELITY FIX SHIPPED (this file, tests only, no gate-code change): the guards'' operational-marker detector `_is_marked_operational` was a naive substring test (`"pytest.mark.operational" in source`) that DIVERGES from the enforced gate mechanism (`pytest -m "not operational"`, which resolves the marker by collection) -- a FALSE-POSITIVE face (a module merely MENTIONING the marker in a docstring/literal reads as operational though the gate still RUNS it) and a FALSE-NEGATIVE face (an aliased marker `op = pytest.mark.operational; pytestmark = op` has no literal substring so a deselected daemon module reads as blocking). A control whose detection differs from the mechanism it audits is theatre (CONTROLS_THAT_CANNOT_FAIL). Replaced with an AST detector that matches pytest resolution (module-level `pytestmark` referencing `operational`); WITNESS = this very file mentions the marker in literals yet `pytest -m operational` deselects all its tests, and the faithful detector now returns False for it while the substring returned True. Locked by test_marker_detection_is_faithful_to_pytest_not_a_substring (asserts detector==False AND `pytest --collect-only -m operational` reports "no tests collected" for this file, AND ==True for a real-marked module); NON-VACUITY proven -- reverting the detector to the substring reds the new lock, restored 9/9 green. RED-TEAM REFUTATION of THIS atom''s own 2026-07-23 candidate class fix (register-not-fix, R9 evidence-before-narrative): the proposed "derive must-block from imports (any module importing a surface/safety source = must-not-be-operational)" is EMPIRICALLY UNSOUND -- AST import extraction over both enumerated sets shows FOUR protected sources are DUAL-USE, imported by daemon-lifecycle tests too (process_run_complete <- test_background_worker; tree_lock <- test_fork_reconciler/test_worktree_isolation; gate_authorization <- test_ntfy_responder; console_sanctity <- test_substep4_exit), and `governance_refusal` is not imported as a source at all (test_governance_refusal imports agenda/fronts_reconciler/process_reconciler/SUPERVISOR); the daemon and content/safety layers share deep deps (notify, deadmans_switch, fronts_reconciler pulled by both), so an import-derived must-block set FALSE-POSITIVES on legit daemon tests. REFINED SOUND DESIGN (register-not-build, SELF_INTERRUPT): the universal fail-open closure is an ACKNOWLEDGEMENT/completeness check -- no module may be operational (deselected from the content gate) unless in a reviewed set -- but it must live in the INDEPENDENT operational-cadence sweep (run_operational_layer_signal on the deadman timer) as a page-only persistent-RED signal, NEVER in the content gate, because a completeness guard that reds the content gate on a new unacknowledged operational module would ITSELF WEDGE the publish -- reintroducing this atom''s own failure mode. BUILD-gated (touches deadmans_switch/process_run_complete); needs an H-lane open. level_current UNCHANGED at 3.'
- '2026-07-27 HARDEN (Rule-0 self-refill dial-yield, no below-target work drawable; loop_stage harden, at-target L3, no level move). Hardened the FOLLOW-ON half -- the independent-cadence GREEN SIGNAL for the DESELECTED operational layer (run_operational_layer_signal on the deadman timer), distinct from the 2026-07-23/25 passes which hardened the marker-PARTITION guards (test_publish_gate_scope.py). Exit tests re-verified: tests/background/test_operational_layer_signal.py 14/14 + test_publish_gate_scope.py 9/9 GREEN (23 total). R15 mutation on a LIVE control, BOTH directions: bumped OPERATIONAL_LAYER_PERSISTENT_RED_THRESHOLD 2->3 -> test_persistent_red_pages_exactly_once + _reescalates + _recovery + _never_touches_publish_gate all FAILED (4 red -- the persistent-red paging control is not theatre); restored -> 14/14 green. RED-TEAM FINDING, HARD-EVIDENCED LATENT FAIL-SILENT (QUEUED per SELF_INTERRUPT, register-not-fix, R9 evidence-before-narrative): a permanently-HUNG operational suite -- subprocess.TimeoutExpired after the 1800s timeout, a REALISTIC mode for THIS population (the operational marker IS the daemon-lifecycle tests, e.g. worker-seat/deadman lock deadlocks) -- is caught by run_operational_layer_signal''s outer `except Exception` at L325 and SWALLOWED. Empirically proven over 5 consecutive cycles with a TimeoutExpired-raising runner: PAGED=0, the state file is NEVER written, consecutive_red NEVER advances (the state write at L317 sits inside the try, unreached on exception; the fn returns {ran:False,reason:error}). So a broken-by-HANG operational layer is INVISIBLE forever, whereas a broken-by-FAIL (rc!=0) pages persistently after 2 cycles (verified side-by-side). This FAILS-OPEN exactly where the module''s OWN _read_operational_layer_state deliberately fails CLOSED -- R15 fail-silent doctrine: an unavailable/hung checker is a FAILED check, not a skipped one. Compounding: because last_run_ts never advances, _operational_layer_check_due stays True so the hang re-fires every deadman cycle, burning ~30min/hang indefinitely. REFINED SOUND FIX (register-not-build): catch subprocess.TimeoutExpired (and a failed/non-zero subprocess execution) SEPARATELY from a genuine internal-logic error -- treat suite-EXECUTION failure as a RED result (advance consecutive_red + write state + page on persistence) so a hung daemon layer pages like a failing one, while keeping the true internal-error path swallowed-but-logged. R15 target: a TimeoutExpired-raising runner must advance consecutive_red and page on the 2nd consecutive hang, proven both directions + non-vacuity. BUILD-gated (touches the process_run_complete.py runner path); needs an H-lane open, off the current product fronts. level_current UNCHANGED at 3.'
- '2026-07-28 HARDEN pass (Rule-0 dial=3 yielded, no below-target work; L3->L3, HARDEN never moves the cell). DRAW PROVENANCE (R7): the tick doorbell named H10_worktree_isolation, but H10 was only ~6min into its 24h cooldown -- _harden_in_cooldown correctly HELD it (content+scope sha match) and the LIVE _self_refill_draw rotated to THIS atom; acted on the real draw, not the stale doorbell. Exit tests re-verified GREEN: test_publish_gate_scope.py 9/9 + test_operational_layer_signal.py 14/14 (23). R15 mutation ROTATED to the CORE marker-partition control this pass (distinct from 2026-07-27 which mutated OPERATIONAL_LAYER_PERSISTENT_RED_THRESHOLD): flipping PUBLISH_GATE_MARKER_EXPR not-operational -> operational reds EXACTLY test_gate_argv_selects_by_operational_marker_not_directory + test_run_fast_tests_emits_the_marker_deselection (the 2 partition-guard tests) and nothing else; restored byte-identical (git diff empty) -> green. Not theatre: it pins that content/surface/safety-wall tests stay in the blocking set while operational tests are deselected. REGISTERED RESIDUAL (2026-07-27 TimeoutExpired fail-silent) re-confirmed still real by direct read -- run_operational_layer_signal L325 except-Exception still swallows a hung suite (state write at L317 unreached: PAGED=0, consecutive_red never advances). GOVERNANCE CLARITY (made explicit so this STOPS being re-noted as neglect): the sound fix is a PRODUCTION behaviour change (TimeoutExpired -> RED -> page-on-persistence) = a BUILD, not test-pin HARDEN -- and H_harness is provably in NO open front (background/fronts.yaml opens SIM_ACTORS/SUPPLIER/EPOCH2_CAMPAIGN only; H_harness absent), so landing it off-front would cross the fronts BUILD-authorization wall (G-1). BLOCKED-BY-DESIGN (director keeps H_harness closed, product-first), NOT unaddressed effort. The fix was drafted + R15-proven viable this pass (23->27 green: a TimeoutExpired-raising runner advances consecutive_red and pages on the 2nd consecutive hang, mutation reds it both ways) then REVERTED to respect the closed front -- a mechanical ~15-line land the instant the director opens H_harness or issues an H23 BUILD_OPEN. No code change, no level move. record_harden_pass re-stamped AFTER this note.'
- '2026-07-28 REST-WITH-PROOF (Rule-0 self-refill dial-yield, agenda+staging empty, no below-target work drawable -- the 27 open PLANNER_MINTED_ mints are ALL director-reserved (director_level_up R16 / director_build_open / blocked-reason-unstated), confirmed against the LIVE _self_refill_draw, not the stale doorbell). RE-VERIFIED ONLY, NO ACCRETION. Exit tests re-run GREEN: test_publish_gate_scope.py 9/9 + test_operational_layer_signal.py 14/14 (23). R15 ROTATED to the WEDGE-guard this pass (distinct from the earlier 2026-07-28 pass which mutated PUBLISH_GATE_MARKER_EXPR): stripped ''pytestmark = pytest.mark.operational'' from tests/background/test_supervisor.py -> test_daemon_lifecycle_modules_ARE_marked_operational FAILED ("these daemon-lifecycle modules can wedge the publish: [test_supervisor]"); git-restored byte-identical (empty diff) -> 23/23 green. Not theatre: a daemon-lifecycle test losing its marker re-enters the blocking content gate and the guard catches it at write time. Registered residual (TimeoutExpired fail-silent in run_operational_layer_signal, 2026-07-27) UNCHANGED and BLOCKED-BY-DESIGN per the earlier 2026-07-28 note: the sound fix is a PRODUCTION behaviour change (TimeoutExpired -> RED -> page-on-persistence) = a BUILD, and H_harness is provably in NO open front (background/fronts.yaml opens SIM_ACTORS/SUPPLIER/EPOCH2_CAMPAIGN only) -- landing it off-front crosses the fronts BUILD-authorization wall. No code change, no level move; record_harden_pass re-stamped AFTER this note.'
