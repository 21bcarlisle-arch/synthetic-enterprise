atom_id: W2_32_the_billing_and_commercial_axes_are_measured_against_the_demand_sample
map_notes:
  map_comment_note: '# EXECUTABLE CONTROL, not a directory. The census is runnable and the control is a pytest file,

    # because a `file_scope` naming `docs/` cannot be asserted past by anything.

    # ITEM 4 of DIRECTOR_CANON_WHAT_THE_SYNTHETIC_BOOK_IS_2026-09-07, section 4, verbatim: "a sample

    # sized against the demand vector may not be sized against billing complexity... Whether the

    # demand sample spans that is an OPEN MEASUREMENT, NOT AN ASSUMPTION."

    #

    # THE ANSWER MAY BE "NO", AND "NO" IS THE DELIVERABLE. This row is not "make the sample span

    # billing"; it is "find out, and publish which". The canon offers both outcomes as acceptable --

    # spanned, or NAMED AS AN UNCOUNTED DIMENSION -- and the failure mode is neither of those: it is

    # the sample being sized on demand and read as if it were sized on billing. That is the

    # undeclared-reduction shape W2_28''s control exists to refuse, one seam further out.

    #

    # THE AXES ARE NAMED BY THE CANON AND ARE NOT FOR THIS ROW TO INVENT: meter type and read

    # pattern, payment method, tariff with its dates, move history, credit position. A quantity this

    # row needs that the book does not carry is a GAP TO FILE, never a value to pick.

    #

    # SECOND HALF, AND IT IS THE HALF THAT ROTS IF LEFT OUT: the canon also rules that the demand

    # sample "must not be built in a way that forecloses adding those axes". A measurement taken once

    # and left as prose goes stale beside the next change to the draw, so the exit below asks for a

    # control, not a document.

    #

    # EXIT: (1) a runnable census reporting, per named billing/commercial axis, whether the drawn

    # book spans it, with the population figure it is measured against and the N the answer earns;

    # (2) every axis that is NOT spanned published as an uncounted dimension on a reader-facing

    # surface rather than in a footnote; (3) a control that reds when an axis is added to the canon''s

    # list and not to the census.

    #

    # ANSWERED 2026-09-09, AND THE ANSWER IS "NO" ON ALL FIVE -- which the canon offers as an

    # acceptable outcome and which this row was written to be able to return. `tools/

    # billing_axis_coverage.py --measure`: 0 spanned, 1 carried-but-not-spanned, 4 absent. Meter type

    # and read pattern, tariff and its dates, move history and credit position have NO FIELD in the

    # drawn sample, so no larger sample produces a figure about them. Payment method is carried and

    # still not spanned for two independent reasons -- two categories where the published record

    # establishes three, and a margin the sample DRAWS from the very constant it would be scored

    # against, so agreement there is arithmetic. That second reason is the one a reader of the output

    # could not have caught, and `test_AN_AGREEMENT_THE_SAMPLE_WAS_BUILT_TO_PRODUCE_IS_NOT_SCORED_AS_

    # FIDELITY` is what stops it being published as fidelity.

    #

    # WHAT IS AT L2 AND WHAT IS NOT. Exit (1) and (3) are the census and its controls; exit (2) is

    # the `how-many-synthetic-households` knowledge page''s evidence rung, proven to reach a reader by

    # `site/test_the_sampling_page_reaches_the_reader.py::test_EVERY_UNCOUNTED_BILLING_AXIS_REACHES_

    # THE_READER_ON_THE_RENDERED_PAGE` (red under a poisoned page). The census is re-asked daily

    # through `background/daily_self_note.py`, because the answer changes the moment the draw gains a

    # field or the canon gains an axis and neither arrives announcing itself. NOT done here, and not

    # this row''s: giving the sample any of the four absent axes. That is a build, it belongs where the

    # draw is, and this row''s job was to find out and publish which -- not to close the gap.'
