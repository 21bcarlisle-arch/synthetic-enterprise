atom_id: H37_the_away_signature_reads_a_heat_pump_as_an_empty_house
map_notes:
  origin_note: 'MINTED FROM the L1.3 disposition in the H35 section of docs/design/BAND_NULL_SWEEP.md (2026-08-09). `away_signature` is mean active-window consumption over mean base-load consumption, and a day below 1.30 is counted as "demonstrably empty" (L1.3, at_least 1.0 away day per year). A heat pump runs THROUGH the base-load window, so its base load is not a base load. OBSERVED-WITH-EVIDENCE at the applied window (couple_fabric PANEL, 15 homes x 120d): H11 is flagged away on 104 of 120 days and H12 on 72, on the REAL trace, with the household occupied every day; under the flat-day null every day becomes the home''s own mean profile, whose active/base ratio for those two homes is below 1.30, so all 120 days are flagged and the null reads 120 away-days-per-home against a floor of 1.0 -- L1.3 is INSIDE its own null (margin -119) and cannot fail on absence of the structure it certifies. It read clean at ten homes only because the panel had no electrically-heated home to say otherwise. INFERRED: the same holds for any continuously-heated electric home, including a correctly-modelled storage heater, whose overnight charge block would make it worse -- so this must be repaired BEFORE the W1_12 storage-heater work lands, not after. EXIT: (1) the away signature is computed on a stream in which the space-heating machine cannot masquerade as occupancy -- the netting L1.2h already applies (score the behavioural stream, not the meter total) is a CANDIDATE, not the answer, and whichever is chosen is justified against the physics rather than against the resulting number; (2) the statistic is re-read on the live panel and an occupied heat-pump home is no longer flagged away on most days -- with the count recorded, not merely improved; (3) re-swept: L1.3 is not inside its null at 40/60/90/120d, or the residual is named; (4) R15 both ways -- a genuinely empty home in EVERY regime is still detected (the fail-closed direction, which the obvious netting could break), and a generator with no absences at all still fails; (5) R12: the 1.30 signature threshold and the 1.0 away-day floor are not moved to obtain any of the above.'
