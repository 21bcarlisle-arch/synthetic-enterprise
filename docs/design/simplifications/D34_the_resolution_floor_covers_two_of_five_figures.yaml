atom_id: D34_the_resolution_floor_covers_two_of_five_figures
simplifications:
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD\ncode written and nothing in `file_scope` touched: this atom is `loop_stage: idle`, and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom\nwhile BUILD is not. All measurements at HEAD d0c0f2160, with `tools/couple_w2_11_d5.py`,\n`tests/tools/test_couple_w2_11_d5.py` and `background/gap_metric.py` all CLEAN in the\nworking tree this tick -- stated because the sibling D33 frame of 2026-08-12 had to\ndiscount a desk count a third too big for exactly this reason.\n\nWHAT IS ALREADY LANDED, READ OFF HEAD RATHER THAN OFF THE ATOM'S PROSE. The `name` was\nwritten as a spin-out of Expert Hour #16 and describes its own fixes in the past tense;\nthey are really there. `PUBLISHED_GAP_CONSUMERS` is per dimension with the keyset derived\nfrom `published_dimensions` both ways, `published_reading_epsilon` refuses an unnamed\ncaller, and `published_reading_decimals` returns 4/4/4/3/2 for belief / belief_population_mix\n/ detection / ageing / detection_latency -- the 100x spread the global `PUBLISHED_GAP_DECIMALS\n= 4` had been flattening. So the residue is only what the `name` files as remaining: the\nper-figure resolution floors for `detection`, `detection_latency` and `ageing`.\n\nTHE RESIDUE AS FILED IS NOT BUILDABLE, AND THE REASON IS NOT PRECISION. The atom says\nthose three floors are \"now ANSWERABLE (each figure has a measured precision)\". A measured\nprecision is necessary and it is not sufficient, because `measure_published_resolution_floor`\ncarries TWO belief-shaped defaults, and only one of them is the epsilon:\n\n    BELIEF_FLOOR_KNOB       = \"organ_failure_window_drift_days\"\n    BELIEF_FLOOR_DIMENSIONS = (\"belief\", \"belief_population_mix\")\n\nRun at HEAD over all five published dimensions, n=300, seeds 7/11/23, on the function's own\nbook-derived grid (65 points, -308 .. -372), 63s, `observed-with-evidence`:\n\n    dimension                  epsilon   floor_days   bit_equality_floor_days   per_seed\n    belief                     5e-05     310          310                       310/310/309\n    belief_population_mix      5e-05     314          312                       310/314/312\n    detection                  5e-05     None         None                      None/None/None\n    detection_latency          0.005     None         None                      None/None/None\n    ageing                     0.0005    None         None                      None/None/None\n\nNot even the EXACT predicate finds a difference on the three: `bit_equality_floor_days` is\nNone too, across 65 grid points x 3 seeds. The memory knob is inert on them -- which\nindependently reproduces, on the shipped scorer, what `PUBLISHED_FIGURE_CAVEAT_CONTRACT`\nalready measures as `moves: False` for all three of those cells. And the GRID is belief's as\nwell: it is derived from `measure_belief_window_resolution` (this book: 102 observed failure\nevents, oldest 92d, window 400d, headroom 309d, saturated), a bound on the memory window\nthat means nothing to a figure which does not read that window.\n\nSo the filed reshape -- widen `BELIEF_FLOOR_DIMENSIONS` to five -- publishes three `None`s,\nand this module's own control already calls that a violation: `_check_rendered_floor` says a\npublished `None` floor is \"a figure whose resolution is unmeasured must say so in the\nsentence, not hand the reader a blank where a number goes\". The reshape as written would\ntrip the instrument it is meant to extend.\n\nWHAT THE THREE ACTUALLY RESOLVE, MEASURED AT THEIR OWN READER'S STEP. Their moving knobs are\nTERMS (all three) and RECON (detection, detection_latency). At the smallest counterfactual\nthis instrument can construct -- one day of terms drift -- on seeds 7/11/23, comparing\n|gap(k) - gap(0)| against THAT figure's own `published_reading_epsilon`, and rendering both\nsides at THAT figure's own declared precision:\n\n    dimension          k    delta (min..max over seeds)   epsilon   delta/eps      rendered\n    detection          -1   0.00261 .. 0.00427            5e-05     52x .. 85x     0.0145 -> 0.0188\n    detection          +1   0.0 (bit-identical)           5e-05     --             0.0145 -> 0.0145\n    ageing             -1   0.00442 .. 0.01471            0.0005    8.8x .. 29x    0.113  -> 0.128\n    ageing             +1   0.00442 .. 0.02941            0.0005    8.8x .. 59x    0.113  -> 0.142\n    detection_latency  -1   0.26549 .. 0.36458            0.005     53x .. 73x     2.34   -> 2.02\n    detection_latency  +1   0.26549 .. 0.36458            0.005     53x .. 73x     2.34   -> 2.67\n\nEvery drift `DIMENSION_DRIFT_RESOLUTION` declares VISIBLE on these three clears its own\nreader's step by between 8.8x and 85x AND changes the rendered string; the one drift it\ndeclares INVISIBLE (`detection` at +1) is bit-identical, so the declaration is right there\ntoo. No declared edge on the three coarse figures is resting on a difference its reader\ncannot see. That reproduces the atom's own LEAD-1 claim independently, on the smallest and\ntherefore load-bearing case.\n\nWHICH MEANS THESE FIGURES ARE NOT FLOOR-SHAPED, and that is the frame this atom was missing.\nA floor exists for the belief pair because the belief pair is SATURATED on this book: nothing\nis readable until 310/314 days of forgetting, so \"the smallest company error this figure\nresolves\" is a real number with a real distance to it. The three coarse figures are readable\nat the smallest step the harness can build, with one to two orders of magnitude of headroom\nover their reader. Their floor is \"at most one day\", and what bounds it is the KNOB'S INTEGER\nDAY QUANTUM, not the figure's sensitivity. Publishing \"<=1d\" as this figure's resolution\nfloor would be a property of the harness's grid wearing the figure's name -- atom D32's\nwrong-subject defect, committed by the control built to prevent it.\n\nSO WHERE IS THE REAL TWO-OF-FIVE? IN THE SENTENCE, NOT IN THE SWEEP. Asked of a real\n`score_triad` (n=300, seed 7) -- which published caveat states the precision at which its own\nword \"readable\" was decided:\n\n    dimension              caveat component              states its own precision?\n    belief                 belief_resolution_caveat      YES -- `_own_floor_clause` interpolates\n    belief_population_mix  (the same sentence)                `published_reading_decimals(dimension)`:\n                                                              \"at the 4dp THIS figure's own consumer\n                                                              renders IT at -- atom D34\"\n    detection              drift_resolution_caveat       NO -- 1311 chars, no precision word at all\n    detection              recon_saturation_caveat       NO -- \"movement in these headlines is not\n                                                              READABLE as days of company error\n                                                              outside the declared runs\"\n    ageing                 drift_resolution_caveat       NO -- \"A movement smaller than that is not\n                                                              READABLE as days\"\n    detection_latency      terms_resolution_caveat       NO -- \"moves this headline BIT-IDENTICALLY\n                                                              to the reconciliation drift above\"\n    detection_latency      organ_query_grid_caveat       NO -- 1875 chars, no precision word at all\n\nFour sentences rest their whole claim on a predicate -- \"readable\", \"bit-identically\" -- and\nnone of them says at what precision readability was decided. Two of five figures' resolution\nsentences state their own predicate. That IS this atom's title, and it is the version of it\nthat survives measurement: the gap is in what the published TEXT admits, not in\n`measure_published_resolution_floor`'s dimension list.\n\nAND IT IS BUILDABLE, WHICH THE FILED VERSION IS NOT. The number to interpolate already exists\nper figure (`published_reading_decimals`); the headroom to state beside it is measured above;\nand the shape to copy is `_own_floor_clause`, including its REFUSAL of an unnamed caller.\nThe blast radius is the three caveat sentences, and it is text only.\n\nR12/R13. No published number moved and none was tuned. At seed 7, HEAD, all five figures are\nbit-identical to the values this atom's own record quotes: ageing 0.11296259117981663, belief\n0.1518987341772152, mix 0.07999999999999997, detection 0.014505119453924915, latency 2.343137.\nWhat this pass changed is what the instrument admits about itself.\n\nA SMALLER FINDING, RECORDED AND NOT FIXED (SELF-INTERRUPT DISCIPLINE -- the supply is\ninfinite). `_ROUNDING_SLACK = 1e-5` is ONE global tolerance, used at both\n`measure_published_figure_caveat_coverage`'s day-linearity test and its declared-vs-measured\nstep check, across the same five figures whose reader steps span 5e-05 to 0.005. That is\nD34's own class, one register over, and its comment defends it the pre-Hour way -- \"FAR below\nthe defect this control exists to catch\" -- rather than by naming whose step it is. THE\nHONEST DIRECTION, because it changes the priority: 1e-05 is FINER than every one of the five\nreader steps, so the constant is STRICTER than a per-figure epsilon would be. It can flag a\ndifference no reader could see; it cannot miss one. A wrong-unit constant in the conservative\ndirection is debt, not a fail-open, and belongs at the next real touch of that function.\n\nWHAT AN EXIT TEST MUST NOT BE, from the traps above:\n  * not \"the floor sweep returns a number for all five dimensions\" -- three are structurally\n    None, on a knob measured inert and a grid derived from a bound they do not read, and a\n    test that forces a number there manufactures the wrong subject;\n  * not one precision quoted across the three sentences -- a register handing every figure\n    the same number is the `PUBLISHED_GAP_DECIMALS` constant wearing a dict, which is the\n    vacuity guard Hour #16 already had to build once;\n  * R15 both ways on the sentences: a figure whose renderer moves off its declared precision\n    must FAIL, and a caveat stating a SIBLING's precision must FAIL -- the `_own_floor_clause`\n    refusal, generalised from the belief pair to the other three.\n\nSTATUS: DISCOVER/FRAME only. `level_current` unchanged at 0, `loop_stage` unchanged at\n`idle`, `provenance` unchanged at `proposal`. Nothing in `file_scope` was written. The map's\n`simplifications_count` is left to the integrator's `tools.merge_atom_status` rather than\nedited here, because the map carries two other lanes' uncommitted hunks this tick -- the same\nshape as commit 21ad5aeea, which landed the sibling D33 note alone."
- "2026-08-14 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). Second\nframe on this atom, and it exists because the FIRST one's load-bearing premise does not\nsurvive measurement. No BUILD code written and nothing in `file_scope` touched: the atom is\n`loop_stage: idle`, so EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME\navailable and BUILD not. Level held at 0 rather than moved, on the EP10 precedent and not\nEP19's: this atom's deliverable is CODE (`file_scope` is `tools/couple_w2_11_d5.py` and its\ntest), and MATURITY_MAP L1 is \"been BUILT in any form\", so a doc cannot earn it.\n\nTREE STATE, STATED BECAUSE THE LAST FRAME'S TABLE DEPENDS ON IT. Measurements at HEAD\n43bd4a72a. `tools/couple_w2_11_d5.py` and `tests/tools/test_couple_w2_11_d5.py` are DIRTY\nthis tick -- a concurrent Hour #28 (atom D44) in flight. Read: +1 import, +9 lines of\n`normalisation` / `raw_gap_is` DECLARATION fields on `detection_latency_gap`'s returned\n`GapResult`, and a `_DOOR_ROW_SURFACES` `why_inert` rewrite. No arithmetic; `gap=mean_with`\nis untouched. Confirmed rather than assumed: all five figures scored in the dirty tree are\nbit-identical to the values this atom's own record quotes (below), so the dirt did not move\na number this frame reads.\n\nTHE FIRST FRAME'S PREMISE IS FALSE, AND IT IS FALSE IN THIS ATOM'S OWN SHAPE. That frame\nrecorded `published_reading_decimals` as \"4/4/4/3/2 for belief / belief_population_mix /\ndetection / ageing / detection_latency\" and built its whole residue design on the sentence\n\"each figure has a measured precision\". Read off the register's MEASURED site fields\n(`reader_renders`, `component_renders`, `also_rendered_at`) rather than off that one\naccessor, at HEAD, `observed-with-evidence`:\n\n    dimension              declared   MEASURED reader precisions\n    belief                 4dp        [4]\n    belief_population_mix  4dp        [4]\n    detection              4dp        [3, 4]   <-- TWO\n    detection_latency      2dp        [2]\n    ageing                 3dp        [3]\n\n`detection` meets a reader at 3dp on the Proof door's headline\n(`door:coupled-gaps#gap-val`, `fmtGap()` in `site/proof/index.html`) and at 4dp in the note\nand its own renderer. `published_reading_decimals` returns the FINEST of a figure's sites --\nthe module's own CLI already prints it as \"4dp finest\" -- which is the RIGHT subject for the\nepsilon (a difference is readable if the finest reader can see it) and the WRONG subject for\na sentence saying at what precision readability was DECIDED for the reader.\n\nAND IT WAS ALREADY THERE. `(\"door:coupled-gaps#gap-val\", 3)` is in `PUBLISHED_GAP_CONSUMERS`\nat d0c0f2160 -- the exact HEAD the first frame measured at (`git show`, checked, not\ninferred) -- landed by Hour #21 (a46e00cb9). It is published in `docs/status/LATEST.md`\ntoo: \"detection `gap-val`@3 **and** `note`@4\". The first frame did not measure a stale tree;\nit asked one accessor a question whose answer is a set, and got the max back as a scalar.\nThat is `PUBLISHED_GAP_DECIMALS = {2, 4} != a precision`, Hour #16's own finding, one level\ndown and inside the fix.\n\nSO THE RESIDUE IS STILL BUILDABLE AND ITS SHAPE CHANGES. The filed reshape -- copy\n`_own_floor_clause` onto the three coarse figures, interpolating\n`published_reading_decimals(dimension)` -- would publish to `detection`'s reader \"at the 4dp\nTHIS figure's own consumer renders IT at\". Singular, about a figure with two reader\nsurfaces, quoting the one the door-headline reader is NOT given. A caveat that covers some\nof a figure's readers, declared as all of them, is this atom's title with `detection` in\nplace of `belief`.\n\nNO DECLARED EDGE BREAKS AT THE COARSEST READER, WHICH IS WHY THIS IS TEXT AND NOT A\nRE-DECLARATION. Every drift `DIMENSION_DRIFT_RESOLUTION` declares on the three terms-knob\nfigures, re-scored at HEAD, n=300, seeds 7/11/23, rendered at EVERY measured reader\nprecision that figure has (not just its finest):\n\n    dimension          k    declared    rendered 3dp (door)   rendered 4dp (note)   seeds\n    detection          -1   VISIBLE     0.015->0.019          0.0145->0.0188        7\n                                        0.022->0.025          0.0218->0.0252        11\n                                        0.010->0.012          0.0096->0.0122        23\n    detection          +1   INVISIBLE   SAME                  SAME                  7/11/23\n    ageing             -8   VISIBLE     0.113->0.227 / 0.192->0.285 / 0.119->0.212  7/11/23\n    ageing             -1   VISIBLE     0.113->0.128 / 0.192->0.197 / 0.119->0.124  7/11/23\n    ageing             +1   VISIBLE     0.113->0.142 / 0.192->0.212 / 0.119->0.124  7/11/23\n    ageing            +12   VISIBLE     0.113->0.297 / 0.192->0.395 / 0.119->0.285  7/11/23\n    detection_latency  -1   VISIBLE     2.34->2.02 / 2.48->2.11 / 2.08->1.81 (2dp)  7/11/23\n    detection_latency  +1   VISIBLE     2.34->2.67 / 2.48->2.84 / 2.08->2.35 (2dp)  7/11/23\n\nEvery VISIBLE declaration changes the rendered string at the COARSEST site as well as the\nfinest -- `detection` at -1 survives the 3dp door headline on all three seeds, worst case\n0.010->0.012 -- and the one INVISIBLE declaration is bit-identical, so it is SAME at both.\nThe declarations hold for both of `detection`'s readers. What does not hold is the sentence\nthat would be written beside them.\n\nWHAT THE EXIT TEST MUST BE, now that the traps are named on both frames. The first frame\nwrote what it must NOT be (a floor forced onto three structurally-None dimensions; one\nprecision quoted across three sentences; R15 both ways on renderer-drift and\nsibling-precision). This frame adds the one that fails the filed design:\n\n  * the sentence's precision must come from the figure's MEASURED reader sites, never from\n    `published_reading_decimals` alone -- and where a figure has more than one, it must\n    state the SPREAD and name the COARSEST, because the coarsest bounds what that figure's\n    reader can actually be shown;\n  * R15, and this is the mutation that kills the filed version: give a one-precision figure\n    a second, coarser reader site and a sentence that still states one precision must FAIL.\n    `detection` is the live instance, so the test has a real subject and not a fixture's;\n  * VACUITY: a template that renders identically for a one-precision figure and a\n    two-precision figure has not read the register -- the `PUBLISHED_GAP_DECIMALS`-wearing-a-\n    dict guard, applied to the sentence rather than to the number.\n\nR12/R13. No published number moved and none was tuned. At seed 7, HEAD, dirty tree, all five\nfigures are bit-identical to this atom's own recorded values: ageing 0.11296259117981663,\nbelief 0.1518987341772152, mix 0.07999999999999997, detection 0.014505119453924915, latency\n2.343137. What moved is what the instrument admits about itself.\n\nA SMALLER FINDING, RECORDED AND NOT FIXED (SELF-INTERRUPT DISCIPLINE). `ageing`'s carrier is\nnot its gap at full width: `balanced_bucket_displacement` is 0.112963 where `ageing.gap` is\n0.11296259117981663 -- the component the reader is handed is quantised at 6dp before any\nrenderer sees it. That is measured and declared machinery (`carrier_quantum_decimals`), not\na defect, and it is recorded here only because it caught this frame out once: a\nbit-equality check against the atom's recorded value reads MOVED if it is asked of the\ncarrier and BIT-IDENTICAL if asked of the gap. Any future R12 check on this atom must say\nwhich of the two it is reading.\n\nSTATUS: DISCOVER/FRAME only. `level_current` unchanged at 0, `loop_stage` unchanged at\n`idle`, `provenance` unchanged at `proposal`. Nothing in `file_scope` was written. The map's\n`simplifications_count` is left to `tools.merge_atom_status` rather than edited here,\nbecause the map carries another lane's uncommitted `simplifications_count` hunk this tick --\nthe same shape, and the same reason, as the note above."
