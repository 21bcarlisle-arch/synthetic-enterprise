map_notes:
  name: 'SPUN OUT OF H27 EXPERT HOUR #16 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT DISCIPLINE). Hour #15''s leads 1 and 2, taken together because they need one number: WHAT PRECISION IS THE READER ACTUALLY GIVEN? Hour #15 had installed exactly that number one Hour earlier -- `PUBLISHED_GAP_DECIMALS = 4`, ''the precision every consumer renders these gaps at'', with an independence re-read so that ''a consumer that starts publishing 6dp fails the control instead of leaving the epsilon stale''. It was neither. (1) IT COULD NOT FAIL ON THE CHANGE IT WAS BUILT FOR: the re-read collected EVERY `.Nf` in the anchored function and asked only whether 4 was among them, and `format_belief_summary` renders three other RATES at `.4f` and the mean steps at `.2f`, so it already returned {2, 4} -- a set, not a precision. Mutated live on a copy of the tree, moving the BELIEF GAP''s own render to `.6f` leaves {2, 4, 6} and the shipped check still passes. A membership test over every number in a function is not a check on the one number the figure is. (2) IT WAS THE BELIEF READER''S PRECISION, DECLARED AS EVERY READER''S: the keyset was two hand-typed consumer sites, both BELIEF, while FIVE dimensions are published. Read off the shipped renderers by AST -- `detection` and both belief figures 4dp, `ageing` 3dp (`format_ageing_summary` publishes `balanced_bucket_displacement` and never renders `.gap` at all) and `detection_latency` 2dp (`f"{mean:.2f} days mean"`, reached through a local alias). One global constant, TEN times too fine for one published figure and a HUNDRED times too fine for another -- and `_own_floor_clause` was publishing ''at the 4dp every consumer renders these gaps at'' to the reader of both belief numbers, which is false of two of the five. THIS ATOM IS THE RESHAPE Hour #16 declined to do on the promoter''s behalf: THE FLOOR ITSELF COVERS TWO OF FIVE FIGURES. `measure_published_resolution_floor` has only ever been asked of the belief pair; lead 2''s remaining half -- per-figure resolution floors for `detection`, `detection_latency` and `ageing` at their own coarser reader steps -- is now ANSWERABLE (each figure has a measured precision) but stating them moves published caveat text on three dimensions, which is a reshape with real blast radius rather than a fix on sight. LEAD 1 ANSWERED AND IT BOUNDS D33: re-derived at each dimension''s OWN reader precision on the dense book-derived grids (n=300, seeds 7/11/23, both knobs), every declared band, edge and collapse run in DIMENSION_DRIFT_RESOLUTION and ORGAN_QUERY_GRID reproduces EXACTLY -- so the bit-equality divergence D33 owns is confined to the belief cells. R12: no published number moved -- all five figures bit-identical (ageing 0.11296259117981663, belief 0.1518987341772152, mix 0.07999999999999997, detection 0.014505119453924915, latency 2.343137 at seed 7); what moved is what the instrument admits about itself, and one caveat sentence that was false. ALREADY LANDED UNDER H27''s HOUR: PUBLISHED_GAP_CONSUMERS, per dimension, keyset DERIVED from `published_dimensions` BOTH WAYS (a published figure with no entry RAISES -- the fallback IS the defect -- and an entry for a figure nobody publishes RAISES); `measure_published_reading_precision`, which reads the number off THE FORMAT SPEC THAT RENDERS THAT DIMENSION''S GAP, through one level of local alias, through the COMPONENT where the gap reaches the reader as one, and through a Subscript key so one shared renderer (the live writer''s `measure_and_write`) cannot lend a sibling''s precision to this figure; the component carrier checked NUMERICALLY against a real scoring (delta 4.1e-7 inside that figure''s own 5e-4 step) rather than believed by name, with an unchecked carrier a violation; RAISES on an absent consumer file, an absent renderer, or a gap with no fixed-point render (the pre-Hour version returned an empty tuple for a missing file and its caller read that as agreement); `published_reading_epsilon()` REFUSING a caller that names no figure, on the `_own_floor_clause` precedent; the floor taking its epsilon per figure; and the caveat sentence now stating THIS figure''s consumer''s precision. R15 both ways on eleven mutations: the gap render moved off its declared precision (the pre-Hour defect, on `belief`, and on both figures the constant was wrong about), one gap rendered at TWO precisions, the consumer file absent (fail-silent), the renderer renamed away, a gap with no fixed-point render (fail-open), a published dimension dropped (raises), an entry for a figure nobody publishes (raises), a component carrier that is not the gap, a component carrier nothing checked, a bare epsilon call, and a VACUITY guard pinning the 2-4dp spread itself -- a register giving every figure the same number would be the pre-Hour constant wearing a dict.'
