ection_latency      2dp        [2]\n    ageing                 3dp        [3]\n\n`detection` meets a reader at 3dp on the Proof door's headline\n(`door:coupled-gaps#gap-val`, `fmtGap()` in `site/proof/index.html`) and at 4dp in the note\nand its own renderer. `published_reading_decimals` returns the FINEST of a figure's sites --\nthe module's own CLI already prints it as \"4dp finest\" -- which is the RIGHT subject for the\nepsilon (a difference is readable if the finest reader can see it) and the WRONG subject for\na sentence saying at what precision readability was DECIDED for the reader.\n\nAND IT WAS ALREADY THERE. `(\"door:coupled-gaps#gap-val\", 3)` is in `PUBLISHED_GAP_CONSUMERS`\nat d0c0f2160 -- the exact HEAD the first frame measured at (`git show`, checked, not\ninferred) -- landed by Hour #21 (a46e00cb9). It is published in `docs/status/LATEST.md`\ntoo: \"detection `gap-val`@3 **and** `note`@4\". The first frame did not measure a stale tree;\nit asked one accessor a question whose answer is a set, and got the max back as a scalar.\nThat is `PUBLISHED_GAP_DECIMALS = {2, 4} != a precision`, Hour #16's own finding, one level\ndown and inside the fix.\n\nSO THE RESIDUE IS STILL BUILDABLE AND ITS SHAPE CHANGES. The filed reshape -- copy\n`_own_floor_clause` onto the three coarse figures, interpolating\n`published_reading_decimals(dimension)` -- would publish to `detection`'s reader \"at the 4dp\nTHIS figure's own consumer renders IT at\". Singular, about a figure with two reader\nsurfaces, quoting the one the door-headline reader is NOT given. A caveat that covers some\nof a figure's readers, declared as all of them, is this atom's title with `detection` in\nplace of `belief`.\n\nNO DECLARED EDGE BREAKS AT THE COARSEST READER, WHICH IS WHY THIS IS TEXT AND NOT A\nRE-DECLARATION. Every drift `DIMENSION_DRIFT_RESOLUTION` declares on the three terms-knob\nfigures, re-scored at HEAD, n=300, seeds 7/11/23, rendered at EVERY measured reader\nprecision that figure has (not just its finest):\n\n    dimension          k    declared    rendered 3dp (door)   rendered 4dp (note)   seeds\n    detection          -1   VISIBLE     0.015->0.019          0.0145->0.0188        7\n                                        0.022->0.025          0.0218->0.0252        11\n                                        0.010->0.012          0.0096->0.0122        23\n    detection          +1   INVISIBLE   SAME                  SAME                  7/11/23\n    ageing             -8   VISIBLE     0.113->0.227 / 0.192->0.285 / 0.119->0.212  7/11/23\n    ageing             -1   VISIBLE     0.113->0.128 / 0.192->0.197 / 0.119->0.124  7/11/23\n    ageing             +1   VISIBLE     0.113->0.142 / 0.192->0.212 / 0.119->0.124  7/11/23\n    ageing            +12   VISIBLE     0.113->0.297 / 0.192->0.395 / 0.119->0.285  7/11/23\n    detection_latency  -1   VISIBLE     2.34->2.02 / 2.48->2.11 / 2.08->1.81 (2dp)  7/11/23\n    detection_latency  +1   VISIBLE     2.34->2.67 / 2.48->2.84 / 2.08->2.35 (2dp)  7/11/23\n\nEvery VISIBLE declaration changes the rendered string at the COARSEST site as well as the\nfinest -- `detection` at -1 survives the 3dp door headline on all three seeds, worst case\n0.010->0.012 -- and the one INVISIBLE declaration is bit-identical, so it is SAME at both.\nThe declarations hold for both of `detection`'s readers. What does not hold is the sentence\nthat would be written beside them.\n\nWHAT THE EXIT TEST MUST BE, now that the traps are named on both frames. The first frame\nwrote what it must NOT be (a floor forced onto three structurally-None dimensions; one\nprecision quoted across three sentences; R15 both ways on renderer-drift and\nsibling-precision). This frame adds the one that fails the filed design:\n\n  * the sentence's precision must come from the figure's MEASURED reader sites, never from\n    `published_reading_decimals` alone -- and where a figure has more than one, it must\n    state the SPREAD and name the COARSEST, because the coarsest bounds what that figure's\n    reader can actually be shown;\n  * R15, and this is the mutation that kills the filed version: give a one-precision figure\n    a second, coarser reader site and a sentence that still states one precision must FAIL.\n    `detection` is the live instance, so the test has a real subject and not a fixture's;\n  * VACUITY: a template that renders identically for a one-precision figure and a\n    two-precision figure has not read the register -- the `PUBLISHED_GAP_DECIMALS`-wearing-a-\n    dict guard, applied to the sentence rather than to the number.\n\nR12/R13. No published number moved and none was tuned. At seed 7, HEAD, dirty tree, all five\nfigures are bit-identical to this atom's own recorded values: ageing 0.11296259117981663,\nbelief 0.1518987341772152, mix 0.07999999999999997, detection 0.014505119453924915, latency\n2.343137. What moved is what the instrument admits about itself.\n\nA SMALLER FINDING, RECORDED AND NOT FIXED (SELF-INTERRUPT DISCIPLINE). `ageing`'s carrier is\nnot its gap at full width: `balanced_bucket_displacement` is 0.112963 where `ageing.gap` is\n0.11296259117981663 -- the component the reader is handed is quantised at 6dp before any\nrenderer sees it. That is measured and declared machinery (`carrier_quantum_decimals`), not\na defect, and it is recorded here only because it caught this frame out once: a\nbit-equality check against the atom's recorded value reads MOVED if it is asked of the\ncarrier and BIT-IDENTICAL if asked of the gap. Any future R12 check on this atom must say\nwhich of the two it is reading.\n\nSTATUS: DISCOVER/FRAME only. `level_current` unchanged at 0, `loop_stage` unchanged at\n`idle`, `provenance` unchanged at `proposal`. Nothing in `file_scope` was written. The map's\n`simplifications_count` is left to `tools.merge_atom_status` rather than edited here,\nbecause the map carries another lane's uncommitted `simplifications_count` hunk this tick --\nthe same shape, and the same reason, as the note above."
