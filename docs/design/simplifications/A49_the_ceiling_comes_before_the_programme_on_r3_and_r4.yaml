atom_id: A49_the_ceiling_comes_before_the_programme_on_r3_and_r4
map_notes:
  origin_note: 'DIRECTOR_CANON_RERANKING_THE_ARC_2026-09-04, WORK THIS CREATES item 5: ''The ceiling-before-programme discipline from EP13 applied to R1-R4 before building'', and §3: ''EP13''s ceiling measurement was good work and the pattern it demonstrated -- measure the ceiling before the programme rather than after six passes -- should be applied to everything in R1-R4.'' MINTED BECAUSE THE COVERAGE IS PARTIAL AND THE UNCOVERED HALF IS THE EXPENSIVE HALF. R1 has its ceiling (tools/r1_inference_ceiling.py, held-out per-cell mean -- the best possible function of the coordinate, so no estimator can beat it) and R2''s bound follows from R1''s result rather than needing its own instrument, both recorded in SEAT_FINDING_R1S_INFERENCE_CEILING_IS_AT_THE_NULL_AND_R2_CANNOT_PAY_UNTIL_R1_LANDS_2026-09-04. NULL DESCRIPTION CORRECTED 2026-09-06 (06fc90189, and the loose end that finding named): this note said ''against a max/48 null'', which described the defect rather than the design -- the pair rung ranks 45 candidates and graded the winner against a null drawn for THAT PAIR ALONE, which accepted a book of pure noise 9 times in 10. The null is now SELECTION-CORRECTED: one draw shuffles the household->trait assignment across the whole book and re-scores every candidate, 200 draws give the distribution of the maximum actually reported. THIS BEARS ON A49''S OWN PREMISE, which is why it is corrected here and not only on the map: the corrected verdict crosses 0.05 on a difference of two households -- p=0.0746 at n=71 and p=0.0249 at n=69, two runs of the SAME population differing only in which households happened to carry both features of a pair -- and A49''S OWN GATE LANGUAGE FOLLOWS FROM THAT: a number that flips on two households is not a gate, so R1''s ceiling is NOT a bound the R3/R4 programme can be gated on, and this atom must not be read as holding one. What it does bound is the instrument''s power: at n=69 only a ceiling above roughly +0.55 is distinguishable from a 45-way search of noise at all, so what closes this is COVERAGE (the pair fields populated on every household), not a re-run. THAT CAUSE IS REFUTED and the correction is at the end of this note -- the coverage arrived on 2026-09-06 and closed nothing, because the cause was wrong rather than merely stale. The sentence is kept where it was written so the correction sits beside the claim. The live record is SEAT_FINDING_R1S_CEILING_WAS_A_SELECTED_MAXIMUM_AND_THE_CORRECTED_VERDICT_FLIPS_ON_TWO_HOUSEHOLDS_2026-09-06. AND THE MAGNITUDE IS A SECOND DEFECT THE CORRECTED NULL DOES NOT TOUCH (2026-09-06, lane 0). That null grades WHETHER the ceiling is real; it cannot say the ceiling IS +0.6127, because that figure is max(abs(held_out)) over 45 candidates ranked on the very held-out half that scored them, so it is biased UP as an estimate even when it clears -- and A49 gates R3 and R4 on the magnitude, not on the verdict. tools/r1_inference_ceiling.py now computes the unbiased form (three folds: one fits the cell means, one ranks the candidates, one neither step saw scores the winner, over 40 random partitions) and it REFUSES on the pair rung: the winner carries about 56 households, a three-way split leaves about 6.7 per fit cell against the 8 the instrument already requires, and only 8 of 40 partitions clear it -- it would take about 72 households carrying both fields of a pair. Run below that floor it returns +0.1039, published as not-an-estimate so a refusal cannot read as a hidden answer. THE FULL-COVERAGE RUNG DOES HAVE ONE, and it is +0.0641 with a 5th-95th band of -0.3174 to +0.2350 and 14 of 40 partitions at or below zero. So the figure this atom was minted on is not merely un-gateable for flipping on two households: the only rung with an honest magnitude puts it near zero with a band straddling it, and the rung carrying +0.6127 has no honest magnitude at all. Both are on /harness/ beside the maximum. WHAT CLOSES IT IS NOT COVERAGE (corrected 2026-09-07, by the instrument''s own artefact). The coverage arrived on 2026-09-06 -- four observables went from 69 households to 164 when `account_state_log` landed, and the book IS 164 -- and the all-candidate pair rung still refuses. It always will: that rung''s population is set by whichever pair WINS, and the winner reaches through `perceived_bill_saving_gbp`, whose declared scope is `decision_only`, so it collapses to the renewing subset however large the book grows. More coverage on the other fields cannot move it. AND THE GATING DECISION IS NOW MADE, EXPLICITLY AND IN VIEW (2026-09-07, delivery seat; recorded in SEAT_DECISION_A49_GATES_R3_AND_R4_ON_THE_WHOLE_BOOK_RUNG_2026-09-07). A49 GATES R3 AND R4 ON THE WHOLE-BOOK PAIR RUNG -- the same pair search restricted to the observables the company holds for every account on supply -- and reads its DE-BIASED THREE-WAY MAGNITUDE, never its selected maximum. THE ARGUMENT IS ABOUT POPULATIONS AND IS PRIOR TO EVERY READING: R3 and R4 are delivered to every account on supply, so the bound that gates them must be over that population; the all-candidate rung bounds only what could be recovered about the accounts that reached a priced renewal, which is R2''s population and has no route to the rest of the book. Its denominator is not the programme''s denominator. It would be the SAME decision with the readings the other way up, and A49''s honest answer would then be "we cannot tell" -- which is a result and belongs on the page. The decision is a constant in the instrument (`A49_GATING_RUNG`, declared beside `OBSERVABLE_FIELD_SCOPE` and above every run, so no reading can reach it), it is published on /harness/ with its reason and its falsifier beside it, and four mutation-proven controls hold it -- the load-bearing one inverts the two rungs'' readings and asserts the gate does not move. WHAT THE GATE READS TODAY: +0.2513 over all 164 households against a noise floor of +0.1628 at p=0.01, carried together with the SAME rung''s selected-maximum verdict, which does NOT clear (p=0.4726). Different statistics against different nulls -- removing the selection is what buys the power -- and the magnitude published without that beside it would read as a bound this rung has not earned. THE CONSEQUENCE, and it is two-sided: R3 and R4 are NOT RETIRED by R1, because there is household variation recoverable from what the company holds on every account; and they are NOT LICENSED either, because R1 bounds INFERENCE and says nothing about what a carbon score or an advice product is worth. WHAT WOULD MOVE THE GATE is a change of SCOPE -- a `decision_only` field honestly reclassified to `account_state`, which would collapse the two rungs onto one population, or R3/R4 redefined as renewal-window programmes -- and never a change of reading. WHAT CLOSES THIS ATOM is therefore unchanged from what it was minted for and is not this decision: a ceiling instrument per side for R3 and R4. R3 (the score -- PS/tCO2e, E5) and R4 (products beyond price -- advice, tariff fit, efficiency, solar, heat pumps, time-shifting) have NOTHING: grep over tools/ returns six ceiling instruments, five of them EP13''s and one R1''s, and none touching either. THE COST OF NOT DOING THIS IS MEASURED, NOT ASSERTED -- it is EP13''s own record. That atom ran TWELVE passes without moving off L2; the ceiling discipline arrived at pass seven and RETIRED FIVE CANDIDATE PROGRAMMES (the outage model, the within-day axis, a publishable within-day CCGT proxy, biomass dispatch, and the daily-gas-level rung left undecided rather than falsely retired) -- each of which would otherwise have been built first and measured afterwards. R4 is the larger exposure of the two: it is the biggest unbuilt programme on the map and the mission is unreachable without it (§2 R4), so a programme-sized build with no prior bound is exactly the shape EP13 paid twelve passes to learn. WHAT DONE MEANS: a ceiling instrument per side, each answering ''what is the most this programme could be worth if it worked perfectly'' against a stated null, with the honest end published whichever way it falls -- and, per EP13''s hardest-won lesson, each one stating whether it is a true CEILING (perfect knowledge of the quantity a real method would approximate, so a negative retires the candidate outright) or a handicapped FLOOR (bounds from below, so a negative retires nothing). Conflating those two is the error EP13''s tenth pass made and its eleventh corrected. NOT A NEW RANKING SYSTEM and not machinery about machinery (DIRECTOR_CANON_PRODUCT_AND_MACHINERY §4): the instruments measure the WORLD and the BOOK, which is product work in the canon''s own test.'
