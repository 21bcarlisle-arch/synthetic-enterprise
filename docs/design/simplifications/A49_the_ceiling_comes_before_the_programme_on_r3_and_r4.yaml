atom_id: A49_the_ceiling_comes_before_the_programme_on_r3_and_r4
map_notes:
  origin_note: 'DIRECTOR_CANON_RERANKING_THE_ARC_2026-09-04, WORK THIS CREATES item 5: ''The ceiling-before-programme discipline from EP13 applied to R1-R4 before building'', and §3: ''EP13''s ceiling measurement was good work and the pattern it demonstrated -- measure the ceiling before the programme rather than after six passes -- should be applied to everything in R1-R4.'' MINTED BECAUSE THE COVERAGE IS PARTIAL AND THE UNCOVERED HALF IS THE EXPENSIVE HALF. R1 has its ceiling (tools/r1_inference_ceiling.py, held-out per-cell mean -- the best possible function of the coordinate, so no estimator can beat it) and R2''s bound follows from R1''s result rather than needing its own instrument, both recorded in SEAT_FINDING_R1S_INFERENCE_CEILING_IS_AT_THE_NULL_AND_R2_CANNOT_PAY_UNTIL_R1_LANDS_2026-09-04. NULL DESCRIPTION CORRECTED 2026-09-06 (06fc90189, and the loose end that finding named): this note said ''against a max/48 null'', which described the defect rather than the design -- the pair rung ranks 45 candidates and graded the winner against a null drawn for THAT PAIR ALONE, which accepted a book of pure noise 9 times in 10. The null is now SELECTION-CORRECTED: one draw shuffles the household->trait assignment across the whole book and re-scores every candidate, 200 draws give the distribution of the maximum actually reported. THIS BEARS ON A49''S OWN PREMISE, which is why it is corrected here and not only on the map: the corrected verdict crosses 0.05 on a difference of two households -- p=0.0746 at n=71 and p=0.0249 at n=69, two runs of the SAME population differing only in which households happened to carry both features of a pair -- and A49''S OWN GATE LANGUAGE FOLLOWS FROM THAT: a number that flips on two households is not a gate, so R1''s ceiling is NOT a bound the R3/R4 programme can be gated on, and this atom must not be read as holding one. What it does bound is the instrument''s power: at n=69 only a ceiling above roughly +0.55 is distinguishable from a 45-way search of noise at all, so what closes this is COVERAGE (the pair fields populated on every household), not a re-run. The live record is SEAT_FINDING_R1S_CEILING_WAS_A_SELECTED_MAXIMUM_AND_THE_CORRECTED_VERDICT_FLIPS_ON_TWO_HOUSEHOLDS_2026-09-06. R3 (the score -- PS/tCO2e, E5) and R4 (products beyond price -- advice, tariff fit, efficiency, solar, heat pumps, time-shifting) have NOTHING: grep over tools/ returns six ceiling instruments, five of them EP13''s and one R1''s, and none touching either. THE COST OF NOT DOING THIS IS MEASURED, NOT ASSERTED -- it is EP13''s own record. That atom ran TWELVE passes without moving off L2; the ceiling discipline arrived at pass seven and RETIRED FIVE CANDIDATE PROGRAMMES (the outage model, the within-day axis, a publishable within-day CCGT proxy, biomass dispatch, and the daily-gas-level rung left undecided rather than falsely retired) -- each of which would otherwise have been built first and measured afterwards. R4 is the larger exposure of the two: it is the biggest unbuilt programme on the map and the mission is unreachable without it (§2 R4), so a programme-sized build with no prior bound is exactly the shape EP13 paid twelve passes to learn. WHAT DONE MEANS: a ceiling instrument per side, each answering ''what is the most this programme could be worth if it worked perfectly'' against a stated null, with the honest end published whichever way it falls -- and, per EP13''s hardest-won lesson, each one stating whether it is a true CEILING (perfect knowledge of the quantity a real method would approximate, so a negative retires the candidate outright) or a handicapped FLOOR (bounds from below, so a negative retires nothing). Conflating those two is the error EP13''s tenth pass made and its eleventh corrected. NOT A NEW RANKING SYSTEM and not machinery about machinery (DIRECTOR_CANON_PRODUCT_AND_MACHINERY §4): the instruments measure the WORLD and the BOOK, which is product work in the canon''s own test. AND THE MAGNITUDE IS A SEPARATE CLAIM FROM THE VERDICT, corrected here 2026-09-06 because A49''s gate is keyed to the magnitude and was reading the verdict''s number. The corrected null above grades WHETHER the ceiling is real and answers it (p=0.0299 on the current book). It cannot grade HOW BIG: the reported figure is max(abs(held_out)) over 45 candidates RANKED ON THE VERY FOLD IT IS THEN REPORTED FROM, and a maximum overshoots whatever it is the maximum of, whether or not it clears. A three-way split now measures that -- fit on a third of the book, choose the winner on a second, score it on a third neither has touched -- and the result is that the pair rung has NO unbiased point estimate on this book: `magnitude_three_way_split.estimate` is None, because 69 households give 5.00 per cell on a three-way fit fold against the 8 the instrument requires. Holding the fit fold at the same size and separating only the choosing from the reporting moves the figure from +0.3630 to -0.1164, so +0.4793 of the published +0.6308 is the search and nothing else; the full-coverage rung, which CAN carry the split, returns -0.1136 inside its own noise floor of +0.1487. THIS ATOM''S GATE MUST READ `magnitude_three_way_split.estimate` AND NOT `best_pair.held_out`: the first is None and refuses, the second is a selected maximum whose de-biased reading is at the floor. This does not weaken the coverage conclusion above, it reaches it from the other side and more strongly -- the figure is not merely unstable across two households, its magnitude is unestablished. The live record is SEAT_FINDING_R1S_CEILING_CLEARS_ITS_NULL_AND_ITS_MAGNITUDE_IS_ENTIRELY_THE_SEARCH_2026-09-06, pre-registered before it was run.'
