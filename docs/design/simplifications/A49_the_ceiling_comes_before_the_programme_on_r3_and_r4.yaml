atom_id: A49_the_ceiling_comes_before_the_programme_on_r3_and_r4
map_notes:
  origin_note: 'DIRECTOR_CANON_RERANKING_THE_ARC_2026-09-04, WORK THIS CREATES item 5: ''The ceiling-before-programme discipline from EP13 applied to R1-R4 before building'', and §3: ''EP13''s ceiling measurement was good work and the pattern it demonstrated -- measure the ceiling before the programme rather than after six passes -- should be applied to everything in R1-R4.'' MINTED BECAUSE THE COVERAGE IS PARTIAL AND THE UNCOVERED HALF IS THE EXPENSIVE HALF. R1 has its ceiling (tools/r1_inference_ceiling.py, held-out per-cell mean -- the best possible function of the coordinate, so no estimator can beat it) and R2''s bound follows from R1''s result rather than needing its own instrument, both recorded in SEAT_FINDING_R1S_INFERENCE_CEILING_IS_AT_THE_NULL_AND_R2_CANNOT_PAY_UNTIL_R1_LANDS_2026-09-04. NULL DESCRIPTION CORRECTED 2026-09-06 (06fc90189, and the loose end that finding named): this note said ''against a max/48 null'', which described the defect rather than the design -- the pair rung ranks 45 candidates and graded the winner against a null drawn for THAT PAIR ALONE, which accepted a book of pure noise 9 times in 10. The null is now SELECTION-CORRECTED: one draw shuffles the household->trait assignment across the whole book and re-scores every candidate, 200 draws give the distribution of the maximum actually reported. THIS BEARS ON A49''S OWN PREMISE, which is why it is corrected here and not only on the map: the corrected verdict crosses 0.05 on a difference of two households -- p=0.0746 at n=71 and p=0.0249 at n=69, two runs of the SAME population differing only in which households happened to carry both features of a pair -- and A49''S OWN GATE LANGUAGE FOLLOWS FROM THAT: a number that flips on two households is not a gate, so R1''s ceiling is NOT a bound the R3/R4 programme can be gated on, and this atom must not be read as holding one. What it does bound is the instrument''s power: at n=69 only a ceiling above roughly +0.55 is distinguishable from a 45-way search of noise at all, so what closes this is COVERAGE (the pair fields populated on every household), not a re-run. The live record is SEAT_FINDING_R1S_CEILING_WAS_A_SELECTED_MAXIMUM_AND_THE_CORRECTED_VERDICT_FLIPS_ON_TWO_HOUSEHOLDS_2026-09-06. R3 (the score -- PS/tCO2e, E5) and R4 (products beyond price -- advice, tariff fit, efficiency, solar, heat pumps, time-shifting) have NOTHING: grep over tools/ returns six ceiling instruments, five of them EP13''s and one R1''s, and none touching either. THE COST OF NOT DOING THIS IS MEASURED, NOT ASSERTED -- it is EP13''s own record. That atom ran TWELVE passes without moving off L2; the ceiling discipline arrived at pass seven and RETIRED FIVE CANDIDATE PROGRAMMES (the outage model, the within-day axis, a publishable within-day CCGT proxy, biomass dispatch, and the daily-gas-level rung left undecided rather than falsely retired) -- each of which would otherwise have been built first and measured afterwards. R4 is the larger exposure of the two: it is the biggest unbuilt programme on the map and the mission is unreachable without it (§2 R4), so a programme-sized build with no prior bound is exactly the shape EP13 paid twelve passes to learn. WHAT DONE MEANS: a ceiling instrument per side, each answering ''what is the most this programme could be worth if it worked perfectly'' against a stated null, with the honest end published whichever way it falls -- and, per EP13''s hardest-won lesson, each one stating whether it is a true CEILING (perfect knowledge of the quantity a real method would approximate, so a negative retires the candidate outright) or a handicapped FLOOR (bounds from below, so a negative retires nothing). Conflating those two is the error EP13''s tenth pass made and its eleventh corrected. NOT A NEW RANKING SYSTEM and not machinery about machinery (DIRECTOR_CANON_PRODUCT_AND_MACHINERY §4): the instruments measure the WORLD and the BOOK, which is product work in the canon''s own test. AND THE MAGNITUDE IS A SEPARATE CLAIM FROM THE VERDICT, corrected here 2026-09-06 because A49''s gate is keyed to the magnitude and was reading the verdict''s number. The corrected null above grades WHETHER the ceiling is real and answers it (p=0.0299 on the current book). It cannot grade HOW BIG: the reported figure is max(abs(held_out)) over 45 candidates RANKED ON THE VERY FOLD IT IS THEN REPORTED FROM, and a maximum overshoots whatever it is the maximum of, whether or not it clears. A three-way split now measures that -- fit on a third of the book, choose the winner on a second, score it on a third neither has touched -- and the result is that the pair rung has NO unbiased point estimate on this book: `magnitude_three_way_split.estimate` is None, because 69 households give 5.00 per cell on a three-way fit fold against the 8 the instrument requires. Holding the fit fold at the same size and separating only the choosing from the reporting moves the figure from +0.3630 to -0.1164, so +0.4793 of the published +0.6308 is the search and nothing else; the full-coverage rung, which CAN carry the split, returns -0.1136 inside its own noise floor of +0.1487. THIS ATOM''S GATE MUST READ `magnitude_three_way_split.estimate` AND NOT `best_pair.held_out`: the first is None and refuses, the second is a selected maximum whose de-biased reading is at the floor. This does not weaken the coverage conclusion above, it reaches it from the other side and more strongly -- the figure is not merely unstable across two households, its magnitude is unestablished. The live record is SEAT_FINDING_R1S_CEILING_CLEARS_ITS_NULL_AND_ITS_MAGNITUDE_IS_ENTIRELY_THE_SEARCH_2026-09-06, pre-registered before it was run. THE COVERAGE LANDED AND IT REFUTED THE CLEARANCE THIS NOTE PUBLISHED (2026-09-06, lane 0; mechanism at 9b373b96c -- LANDED: `portfolio_position` in `company/pricing/renewal_rate_chain.py` and LANDED: `_account_state_svt_rate` in `simulation/run_phase2b.py` -- measured on run_output_5a256cd6d_20260906T213845Z.json). Everything above stands as written and is corrected here rather than revised, because the figure it reasoned about was resting on the missing coverage. Two of the three fields lane 0''s direction named were genuinely under-covered and both for one reason -- a continuously-held reading written down only where an event fired: mean_recent_margin_rate/portfolio_premium_pct at 149 of 164 (decide_renewal_rate recorded them only where the premium moved a rate), and svt_rate_gbp_per_mwh/rate_vs_svt_pct at 146 (the account-state writer answered None for a gas leg while the Ofgem cap has always covered both fuels and the regulation commons has carried the gas leg per window since W3_1b). All four now stand at 164 of 164 and all 449 gas rows carry the cap. THE ATTRIBUTION IS ONE-VARIABLE AND EXACT: the same run output was ablated back to the pre-fix coverage and reproduced every previously published figure exactly -- 146, 149, +0.6308, p=0.0299, whole-book +0.1492, full coverage -0.0651 over 26 of 40 partitions -- so what follows is the coverage and nothing else. AND IT POINTS BOTH WAYS. The headline pair rung reads +0.5760 at p=0.0647 on full coverage and DOES NOT CLEAR, so the clearance recorded above is refuted by its own instrument: ''clears, marginally'' was a property of four short observables and not of the book. But R1 has an honest positive magnitude for the first time. The full-coverage rung moves from -0.0651 (computable on 26 of 40 partitions, 17 at or below zero) to +0.2936 on 40 of 40 with 3 at or below zero and a 5th-95th band of -0.0552 to +0.4526; the whole-book pair rung -- what the company holds for EVERY account on supply -- gives +0.2463 on 40 of 40, 3 at or below zero, band -0.0314 to +0.4344. NEITHER CLEARS ITS OWN SELECTION-CORRECTED NULL (the whole-book rung''s best pair, rate_vs_svt_pct x mean_recent_margin_rate, is +0.1963 at p=0.4726), so A49 now has a magnitude and no clearance to hang it on, and both belong on the page together. THE PAIR RUNG''S MAGNITUDE REFUSAL IS PERMANENT AND NO FURTHER COVERAGE LIFTS IT: the reported winner is built on perceived_bill_saving_gbp, which is decision_only in the instrument''s own scope table -- what THIS renewal appears to save against the rate it replaced -- and most of this book is on indexed products that never renew, so its 69 households are the truth about the field and not a writer''s firing pattern. Lane 0''s direction predicted that full coverage would give the three-way split ''~55 per fold and ~14 per cell''; that prediction is WRONG and is left standing here beside the result, because lifting the refusal means writing a renewal-window quantity for accounts that never renewed. SO THE GATE READING CHANGES AGAIN: the honest magnitude for A49 is the whole-book rung''s +0.2463, or the full-coverage rung''s +0.2936, on 164 households from fields a supplier holds continuously -- NOT a repaired version of the headline, which is capped at 69 by the definition of its own winner, and NOT best_pair.held_out on either rung. THE FIELD NAME DEPENDS ON WHICH COPY THE TREE CARRIES and that is not settled: tools/r1_inference_ceiling.py is held by two lanes, HEAD''s copy publishing magnitude_three_way_split and the working-tree copy publishing honest_point_estimate / whole_book_pair_rung / full_power_honest_point_estimate, and the figures in this paragraph are the second''s (SEAT_FINDING_TWO_LANES_EACH_BUILT_R1S_UNBIASED_MAGNITUDE_ESTIMATOR_AND_A_PATHSPEC_LAND_DELETES_NINE_OF_HEADS_SYMBOLS_2026-09-06). Both refuse on the pair rung, so the gate''s ANSWER does not depend on the collision; its field name does. STILL OPEN AND NAMED RATHER THAN QUIETLY FIXED: site/data/delivery.json was generated at 2026-09-06T20:28Z from the pre-coverage artefact and /harness/ therefore still publishes +0.6308 clearing at p=0.0299. The corrected artefact is in the tree; the page''s whole chain (instrument, generator, page, door test) is the contested one above, so landing it by pathspec would delete the other lane''s symbols and it is left for the reconciliation rather than swept. The live record is SEAT_FINDING_THE_COVERAGE_BOUGHT_R1_A_POSITIVE_MAGNITUDE_AND_TOOK_AWAY_THE_CEILINGS_CLEARANCE_2026-09-06, answering all four clauses of a prediction filed before the run finished (SEAT_PREDICTION_WHAT_THE_ACCOUNT_STATE_COVERAGE_FIX_WILL_AND_WILL_NOT_MOVE_2026-09-06).'
