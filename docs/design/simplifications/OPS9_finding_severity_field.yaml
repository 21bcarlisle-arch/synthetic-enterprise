atom_id: OPS9_finding_severity_field
map_notes:
  name: 'MINTED FROM deliverable 1 of the WORK THIS CREATES block in DIRECTOR_RULING_FINDING_SEVERITY_AND_INTERLEAVE_2026-08-12 -- ''the severity field, applied across the existing staging root, one pass, every finding classified''. Clause 2 defines three values: BLOCKING (a control or instrument in this area is untrustworthy, or a published figure may be wrong), LATENT (real defect, invalidates nothing published), RECORDED (known limitation, accepted, no work owed). EXIT: (1) a parser reads a severity header off a finding doc and returns the value PLUS the affected lane, since clause 2''s refusal is lane-scoped and a severity without a lane cannot be acted on; (2) the pass is complete when the parser reports ZERO unclassified docs in the staging root, counted from the filesystem, never from a hand-kept list; (3) FAIL-CLOSED on the missing case -- an absent or unparseable header reads as UNCLASSIFIED and is surfaced, never silently defaulted to LATENT, which is exactly the fail-open shape R15 names and exactly the anti-pattern clause 2 forbids (deciding one''s own finding is not BLOCKING to keep a lane open); (4) the by-construction rule is checkable, not merely written: a finding whose own text says an instrument, a control or a published figure is wrong, classified anything but BLOCKING, is named by a check; (5) R15 both ways -- a mutation making UNCLASSIFIED read as LATENT, and one dropping the lane from the parse, each kill a NAMED test, and the clean input passes.'
map_records:
  exit_evidence: '2026-08-12 OPS9 L0->2 (worker tick). LANDED: background/finding_severity.py + tests/background/test_finding_severity.py (19 named tests). EXIT (1) the parser returns the severity AND the affected lane, because clause 2 of DIRECTOR_RULING_FINDING_SEVERITY_AND_INTERLEAVE_2026-08-12 is lane-scoped and a lane-less severity cannot be acted on. (2) THE PASS IS COMPLETE: `python3 -m background.finding_severity` reports 122 documents COUNTED FROM THE FILESYSTEM (glob, never a hand-kept list) and 0 UNCLASSIFIED -- 35 BLOCKING / 73 LATENT / 14 RECORDED; blockers by lane C_customer_ops 2, D_billing_metering 1, E_finance_treasury 1, H_harness 29, W2_customer_generator 1, W4_the_wall 1. Machine doorbells (run_complete_/run_pending_/from_rich_) are excluded by EXACT prefix and named as a population boundary: they are written and archived by the machine on every sim run, so requiring a severity on them would make the zero-unclassified control flap red on ordinary operation. (3) FAIL-CLOSED on every missing case -- absent header, prose `**Severity:**` sentence, severity-without-lane, unknown lane and unreadable file all read UNCLASSIFIED and are surfaced, never defaulted to LATENT; a well-formed header further down does NOT rescue a malformed first one, since scanning past it is how the parser would fail open on exactly the documents most likely to be mis-headered. (4) THE BY-CONSTRUCTION RULE IS CHECKABLE: --by-construction names any non-BLOCKING document whose own text says an instrument, a control or a published figure is wrong; it reports 0 after this pass (the one it named, WORKER_REPORT_D19, was answered by stating in its header block that the report IS the repair). It stands down only on clause 2 own two discharges (repaired, or recorded-and-accepted) and only when the word sits in the HEADER BLOCK the next reader meets, never in a retrospective paragraph forty lines down. (5) R15 BOTH WAYS, each mutation loaded from a COPY of the module under a fresh name (editing source mid-pytest corrupts inspect.getsource; a same-length mutation can survive its own restoration via the .pyc cache -- both are filed findings here): mutation A (missing header returns LATENT) kills test_a_missing_header_reads_unclassified_never_latent; mutation B (lane dropped from the successful parse) kills test_the_parse_returns_the_lane_beside_the_severity; the clean input passes under BOTH, and the loader asserts its own anchor is unique so a no-op mutation cannot pass for the wrong reason. NOT DONE, deliberately: nothing REFUSES anything yet -- OPS11 (lane-scoped level refusal) and OPS12 (blockers ahead of the disposition queue) are the consumers of this parse and both depend on this atom. Report: docs/staging/WORKER_REPORT_OPS9_EVERY_FINDING_NOW_CARRIES_A_MACHINE_READABLE_SEVERITY_2026-08-12.md'
