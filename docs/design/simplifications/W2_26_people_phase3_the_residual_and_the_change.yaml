atom_id: W2_26_people_phase3_the_residual_and_the_change
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05, docs/staging/DIRECTOR_RULING_PEOPLE_MONEY_AND_WHO_THEY_ARE_PHASE1_2026-09-05.md section 2 item 1, AS RE-SCOPED by DIRECTOR_RULING_AMENDMENT_MERIT_ORDER_PEOPLE_PHASES_AND_PRACTICE_BOOKS the same day, which governs.


    AMENDED SCOPE, verbatim: ''Phase 3 -- change. Life events and income shocks (extending the existing stream), children arriving and leaving, unprompted device purchases, and the value-add term: willingness to buy kit or services, kept DISTINCT from willingness to appreciate being saved money and carbon.''


    TWO THINGS LEFT THIS PHASE and must not be re-claimed here: moves and change of tenancy went FORWARD to phase 1 (the amendment''s rung 2, because renters churn by moving rather than switching and the SIM emits no move event at all), and the presence residuals -- working hours, holidays, shift patterns, working from home -- went to PHASE 2.


    THE DISTINCTION THE DIRECTOR DREW IS THE HARD PART, AND IT IS A DEFINITION RATHER THAN A NUMBER. Willingness to BUY and willingness to APPRECIATE are two different quantities, they correlate, and measuring one figure across two populations is this project''s most expensive recurring failure -- average unit rate, net margin and bill shock are all the same shape. Differencing them before defining them would be that shape again, and the cause split must follow from the definition rather than the definition from the split.


    AND THE UNPROMPTED DEVICE PURCHASE IS THE PEOPLE-SIDE TWIN of the housing timeline (W2_24): a world where kit only ever arrives because we sold it cannot tell value created from value claimed.'
