- "2026-08-18 DISCOVER/FRAME, fourth draw. LEVEL STAYS 0. The 2026-08-15 pass declined to\nre-run the analysis and was right to; this pass re-runs NOTHING it settled and instead asks the\none question D28's landing on 2026-08-18 put on the table. Everything below is\n`observed-with-evidence` at HEAD `0ec7a7763`, measured in a detached worktree\n(`git worktree add --detach`), both `file_scope` paths CLEAN at HEAD this tick. n_customers is\nthe swept axis; seeds 7/11/23 throughout; shipped `build_scenario`,\n`measure_belief_window_resolution`, `measure_scenario_constant_census`,\n`predict_event_age_span_from_constants`. No `score_triad` call anywhere in this pass.\n\nWHY THIS PASS EXISTS AND THE PREVIOUS ONE'S 'NOTHING DISTURBS IT' NO LONGER HOLDS. Six commits\nlanded on this module since note 2's HEAD `0a9c969f5`, two of them D28 BUILD (`f1233bc29`,\n`0ec7a7763`) closing WORKER_FINDING_THE_SATURATION_EDGE_IS_A_PROPERTY_OF_THE_DRAW_SIZE. Its\nsubject: `ORGAN_QUERY_GRID`'s declared saturation edge was a literal measured on one n=300 book\nand stamped onto every book the scorer runs over, and the control meant to falsify it defaulted\nto n=300 -- 'the only population it could fail on was the one that produced the declaration'.\nD28 repaired the DETECTION register. THE SIBLING HALF OF THAT CLASS IS THIS ATOM'S OWN EDGES,\nand nobody had looked. Note 2 was checking whether D30's ANSWER had moved; what moved was the\nQUESTION the repo had just learned to ask.\n\nFINDING 1 -- BOTH BELIEF EDGES MOVE WITH THE DRAW SIZE, AND THE REGISTER DECLARES ONE PAIR WITH\nNO SCOPE. Swept over n = 12, 24, 40, 60, 120, 200, 300, 600, 1200 x seeds 7/11/23, one book\nshape throughout, read off the shipped `measure_belief_window_resolution`:\n\n    n     seed  n_events  youngest  oldest  headroom  sat_below  sat_above\n     12      7         4        31      72       328       -370       -328\n     12     11         2        59      80       320       -342       -320\n     12     23         4        31      67       333       -370       -333\n     24     11         5        59      92       308       -342       -308\n     40      7        11        30      87       313       -371       -313\n     60      7        21        30      91       309       -371       -309\n    300      7       102        30      91       309       -371       -309\n    300     11        96        30      92       308       -371       -308\n   1200   7/11/23   375-405     30      92       308       -371       -308\n\nSIX distinct values of `own_saturates_above` (-333..-308) and FIVE of `own_saturates_below`\n(-371..-342): 25 and 29 days of movement on the draw size alone. The register declares\n-371/-308 on both belief entries and carries no `..._scope` field for either. Only TWO scope\nfields exist in the whole module (`collapsed_runs_scope`, `saturates_above_scope`, lines 2315\nand 2386) and both are D28's, on the detection side -- so the fourth of D28's own six R15 cases,\n'an upper edge declared with no scope', is the state this register is in today.\n\nFINDING 2 -- AND THE CONTROLS OVER THOSE DECLARATIONS ARE PINNED AT THE DRAW SIZE THEY WERE\nAUTHORED AT. `measure_dimension_drift_resolution(n_customers=300)` (line 12033) and\n`measure_own_drift_resolution(n_customers=300)` (line 12100), hard literals at their sole call\nsite, in a `main()` whose own `--customers` defaults to 4000. D28's sentence transfers word for\nword. The census call site is capped harder still -- `build_scenario(min(args.customers, 300))`\nat line 12173 -- so an operator who runs the publishing command at 4000 is shown a census of a\n300-account book.\n\nFINDING 3 -- THE CROSS-CHECK READS A DIFFERENT POPULATION FROM THE ONE THAT SETS THE EDGE, AND\nTHAT IS A FAIL-OPEN, NOT A GAP. `measure_scenario_constant_census` ages every record\n(`for r in records`, line 6549); the edge is set by observed failures only\n(`for r in records if r.result == 'failed'`, line 6261). The invoice span is dense by\nconstruction -- every account draws every period -- and reads [30, 92] at every n from 24 up.\nThe failure span needs a failure to LAND on the extreme invoice, which is a draw. So:\n\n    n    seed  invoice span  describes_this_book  census violations  failure-side edge  declared\n    24      7      [30, 92]        True                   0                -328           -308\n    40      7      [30, 92]        True                   0                -313           -308\n    60      7      [30, 92]        True                   0                -309           -308\n   300      7      [30, 92]        True                   0                -309           -308\n\nZero violations, `describes_this_book` True, on books where the declared edge is twenty days\nwrong. R15 FAIL-OPEN: the control passes on precisely the books where the claim it guards is\nfalse. And it is THIS ATOM'S OWN control -- the map note cites `check_scenario_constant_census`\nunder 'ALREADY LANDED UNDER H27's HOUR' as the rule that stops an edge rotting unnoticed.\n`describes_this_book` is not decorative either: its own comment (line 6558) calls it 'the\nswitch', the thing that decides whether this scenario's band may be quoted over somebody else's\npopulation.\n\nNULL CONTROL, and this pass does not stand without it. Over the identical sweep the two\nquantities that must NOT move do not: `predict_event_age_span_from_constants` returns\n{youngest 30, oldest 92} at every single point (it reads no draw, asserted against its own AST),\nand the census's invoice-side span is [30, 92] at every n from 24 up. The sweep moves the\nSAMPLE, not the law -- so the failure-side movement is a property of the realisation and not an\nartefact of the perturbation.\n\nFINDING 4 -- THIS CORRECTS THIS ATOM'S OWN HEADLINE, IN THE EXACT SHAPE D30 USED ON D29. The map\nnote says the band 'is not a sensitivity of the instrument but ARITHMETIC OVER FOUR HARNESS\nCONSTANTS'. Measured: that arithmetic gives the INVOICE span, and it is exact from n=24 up. The\nband the two belief dimensions actually RESOLVE over is the FAILURE span, which equals it only\nfrom about n=600 and reads [59, 80] at n=12. D30 told D29 that 'the company's memory outruns the\nbook' was a restatement rather than an attribution; 'arithmetic over four constants' is an\nattribution to the wrong population, one draw axis over. The four constants set an UPPER BOUND\non the resolution band. They do not set the band.\n\nFINDING 5 -- THE LIVE PUBLISHER IS A THIRD COMPANY THIS ATOM HAS NEVER COUNTED, AND THE\n2026-08-14 RECOMMENDATION DOES NOT REACH IT. `background/live_payment_triad.py` scores through\nthe SAME `score_triad` (line 678) on its own accumulated records, and constructs its consumer\nwith `_RUN_SPANNING_WINDOW_DAYS = 6000` (line 119) over a run covering ~2016-2025, ~3650 days --\nsaturated by construction and by declared intent, its comment saying so in as many words ('a\ncomfortable ceiling keeps the belief severity count on the same all-time basis'). So the repo\nruns THREE companies on the one parameter these dimensions read: the shipped default 90\n(`company/billing/payment_observation_consumer.py:386`), the fixture's 400, and the live\npublisher's 6000. The atom reasons entirely about the 400. Note 1's recommendation -- publish\nthe shipped-company reading at the organ's own 90 alongside the channel-isolated one -- would\nrepair the FIXTURE and leave the reading that writes `docs/observability/coupled_gap_ledger.json`\nand the board door at 6000, undeclared. That is not an argument against the recommendation; it\nis a second site the recommendation has to name, and it was invisible while the atom's evidence\nstopped at the offline scenario. Same lesson D28's own BUILD recorded when it measured the live\nshape and found its literal seventeen times too small: THE OFFLINE BOOK IS NOT THE PUBLISHING\nBOOK, and every claim this pair makes needs asking twice.\n\nWHAT THIS PASS DOES NOT CLAIM, stated because the findings above read worse than the situation\nis. The CAVEAT is safe. `score_triad` re-derives `belief_resolution_caveat` and the census\ncaveat from the scored book on every call (lines 10685-10693), never from the register, so the\nsentence riding a live belief figure states THAT book's own headroom and is correct at any draw\nsize and any spine length. The defect is confined to the register's literals and the controls\nover them. A reader of the number is being told the truth; a reader of the REGISTER is being\ntold a 300-account book's number without being told that is what it is.\n\nWHAT AN EXIT TEST FOR THIS ATOM MUST SHOW -- a fifth item, added to note 1's four, which are\nundisturbed:\n\n  5. The declared belief edges derived from the book actually scored or scoped to the draw size\n     they were measured at, with a population axis that CAN fail (D28's sibling sweeps 25 books\n     in ~3s with no scorer call; the belief edges need no scorer call either), and the census\n     cross-check reading the population that sets the edge -- or saying in its own verdict that\n     it does not. A green verdict that reads as though it covered the edge is the fail-open.\n\nQUEUED, NOT FIXED ON SIGHT (SELF-INTERRUPT DISCIPLINE): this draw is DISCOVER/FRAME only and the\nrepair is BUILD on a file this atom is parked for. Filed as\nWORKER_FINDING_THE_BELIEF_BAND_CENSUS_IS_BLIND_TO_THE_POPULATION_THAT_SETS_THE_EDGE_2026-08-18,\nBLOCKING, lane D_billing_metering, classed `controls_that_cannot_fail` and its class document\nre-rendered in this same commit.\n\nSTATUS: DISCOVER/FRAME only. `level_current` unchanged at 0, `loop_stage` unchanged at `idle`,\n`provenance` unchanged at `proposal` -- `MATURITY_MAP.md` para 3 defines L1 as 'been BUILT in any\nform', this atom is a RESHAPE, nothing has been built, and the map entry carries no\n`origin_note`/`gain` making the document itself the deliverable. THE MAP IS NOT TOUCHED and the\nreason is this tick's, not note 1's stale ratchet: `docs/design/maturity_map.yaml` is `MM` in the\nworking tree -- another lane holds STAGED hunks in it -- so a `simplifications_count` edit here\nwould sweep that lane's work into this commit. It re-syncs on the next `tools.merge_atom_status`\nfold.\n\nR12: no published number was tuned, read into an artefact, or written anywhere. Every figure\nabove was measured in a throwaway worktree to find out whether a declaration this atom rests on\nsurvives a population it was never asked about. It does not.\n"
map_notes:
  name: 'SPUN OUT OF H27 EXPERT HOUR #12 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT DISCIPLINE). Hour #11''s lead 2, taken: the census of confounder-removing harness constants. D27 found `DD_FAILURE_WINDOW_DAYS = 400` by tripping over it and D29 found `AS_OF_BUFFER_DAYS = 30` by tripping over it; both comments say the constant was chosen to REMOVE A CONFOUNDER (''generous on purpose'', ''comfortably past'') and both reasons are sound, but each is also a silent RESOLUTION decision and nobody could say how many were left. MEASURED 2026-08-11, n=300, seeds 7/11/23, every run identical on all three: the two BELIEF dimensions resolve a company memory error ONLY between the youngest and oldest invoice age this book presents at `as_of` -- [30d, 92d], a band 62 DAYS WIDE -- and that interval is not a sensitivity of the instrument but ARITHMETIC OVER FOUR HARNESS CONSTANTS (youngest = AS_OF_BUFFER_DAYS; oldest = AS_OF_BUFFER_DAYS + PERIOD_SPACING_DAYS x (N_PERIODS - 1) + BILLING_CYCLE_SPREAD_DAYS - 1). D29 attributed the LOWER edge to AS_OF_BUFFER_DAYS and left the UPPER one owned by ''the company''s memory outruns the book'' -- a restatement, not an attribution: the book stops at 92 days because N_PERIODS is 3 and PERIOD_SPACING_DAYS is 21, two constants no Hour had asked, so the harness''s own calendar was attributed to the company being graded. The arithmetic was even written out in the register''s own `own_why` two lines below the owner field and no rule was ever built from it -- Hour #11''s ''a lead is not a control'', one register field over. AND THE INSTRUMENT CANNOT RESOLVE THE COMPANY IT SCORES: the scored company holds DD_FAILURE_WINDOW_DAYS = 400 days of memory against a band topping out at 92, so every published `belief` and `belief_population_mix` figure is read 308 days INSIDE the saturated tail, at a point where the one company parameter those dimensions depend on is inert by construction. THIS ATOM IS THE RESHAPE -- giving the scored population a book whose invoice ages actually straddle a memory a real supplier might hold (more periods, a longer spine, or an `as_of` that does not start 30 days past the last event), which moves every published belief figure on this pair and is therefore a mint rather than a fix on sight. R12: no published number moved in Hour #12''s commit; what moved is what the instrument admits about itself. ALREADY LANDED UNDER H27''s HOUR: `SCENARIO_CONSTANT_CENSUS` with its keyset DERIVED from `build_scenario`''s own AST (`scenario_constants`, asserted never to read the census), so a ninth scenario constant left uncensused RAISES instead of waiting for an Hour to trip over it; `predict_event_age_span_from_constants`, which reads constants and no draw (asserted against its AST) and is cross-checked against the BUILT book on every seed; `bounds_resolution` and the edge each constant sets MEASURED by perturbing the predictor rather than read from the declaration, both directions; `_check_edge_owners_are_censused`, which fails a saturation edge owned by an atom the census does not put on that edge -- the defect this Hour found, now a rule; the upper-edge owner moved D27 -> D30 on both belief entries; and the band, its owning constants and the scored company''s 308d of headroom stamped into both dimensions'' note AND components, with a live-population guard so this scenario''s [30, 92] is never quoted over a `run_phase2b` book the constants do not describe.'
