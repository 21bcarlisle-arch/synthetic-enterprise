atom_id: C2_discovery_through_interfaces
simplifications:
- director-confirmed known gap, queued behind W1
- '2026-07-11 M3 DISCOVER+FRAME (docs/design/M3_DISCOVER_FRAME.md): confirmed Q4/Q5/Q6 gaps still live (portal still reads saas.customers.CUSTOMERS directly; property_model.py generator still unanchored; CUSTOMERS still a fixed 31-entry list, single fixed payment-rng seed, zero population-draw code found). New finding: two company-side onboarding/acquisition-journey trackers (company/crm/acquisition_journey.py, company/crm/onboarding_journey.py) are real, SLC-anchored, but completely unwired (zero non-test callers) -- same ''paper compliance'' class M2 found in payments. BUILD deferred on all three M3 sub-components pending director/advisor sequencing; one low-risk item flagged as independently actionable (onboarding_journey.py SLC-deadline wiring).'
- '2026-07-12 RE-VERIFIED, STILL OPEN (self-refill draw, no BUILD code): re-checked directly rather than assuming the 2026-07-11 finding was stale -- company/crm/onboarding_journey.py has zero non-test callers today, over a day after being flagged as independently-actionable, low-risk, ready-to-wire (SLC welcome-pack/first-bill-deadline tracking, no epistemic-wall risk, no ground-truth dependency). depends_on: [W1_reveal_over_time] genuinely covers the BELIEF-LAYER sub-component (portal discovering property truth through interfaces, C2''s own core scope), not this specific onboarding-wiring item, which the FRAME doc itself distinguishes as separable. Not built this pass: this doorbell''s own dispatch (dial-weighted, loop_stage=idle) classified this whole atom DISCOVER/FRAME-only, and the onboarding-wiring sub-item is not (yet) reflected in this atom''s own file_scope -- rather than silently code around the edge of an existing registration, flagging it here prominently, unresolved, so it doesn''t sit invisible for a further day: this is real, ready, low-risk BUILD work a future BUILD-tier draw or explicit pickup should action, not a repeat DISCOVER target.'
- '2026-07-13 FRAME pass on the atom''s own CORE scope, not the already-covered onboarding tangent (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). The prior two passes both examined the onboarding-wiring sub-item; this pass instead traced the atom''s literal subject -- property-truth discovery -- and found the real scaffolding already exists, entirely unwired: company/crm/property_model.py (a company-side Property dataclass), company/crm/household_profile.py, company/crm/energy_profile.py (CustomerEnergyProfile wrapping both), and company/crm/home_registry.py (a HomeRegistry keyed by account_id) form a complete would-be ''company belief layer'' cluster -- confirmed via grep: ALL FOUR have zero non-test callers anywhere in the codebase (home_registry.py and energy_profile.py have none at all; household_profile.py''s only caller is energy_profile.py itself, which is itself unwired). This is the SAME orphaned-module class already logged in PRIORITIES.md for other atoms this session, now confirmed for C2''s own literal subject matter, not adjacent to it. Critically, this pass also found the deeper reason it may have stayed unwired rather than being a simple oversight: checked whether the company-side Property dataclass (company/crm/property_model.py) has any confidence/source/as-of-date/discovery-mechanism field distinguishing it from ground truth -- it does NOT; its fields (epc_rating, floor_area_m2, bedrooms, tenure, etc.) are a structural MIRROR of saas/property_model.py''s own ground-truth Property, with no notion of partial/uncertain knowledge at all. Naively wiring HomeRegistry.register() to read straight from saas/property_model.py would be a literal, direct epistemic-wall violation, not a subtle one -- which is plausibly exactly why nobody wired it. Checked company/interfaces/sim_interface.py (the real seam) for an existing ''observable/uncertain attribute'' pattern to reuse: none exists yet for property attributes specifically (only meter-read-shaped stubs). FRAME conclusion: C2''s real BUILD scope is therefore not ''connect A to B'' (the onboarding item''s shape) but genuinely design a discovery mechanism first -- e.g. self-disclosed-at-signup attributes (bedrooms, property_type) carry immediate but uncorrected belief; EPC rating is only known once a real EPC-certificate-lookup event fires (a plausible new observable event type, mirroring the register''s own existing ''reveal via event'' pattern from W1); electric_vehicle/has_solar_pv become known when the customer registers for an EV/export tariff (already-modelled trigger points); floor_area/occupants may need periodic correction via a meter-engineer-visit event. This is real new design work, not decided here -- named as the next concrete FRAME/BUILD scoping question: whether to add a confidence/as_of/source field directly to company/crm/property_model.py''s Property, or wrap it in a new BeliefState-style envelope (mirroring the sim/company split already used for W1''s bitemporal spine) -- the ''one architecture, not two'' question this session has asked of several other atoms.'
- 2026-07-13 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval -- the director delegated BUILD-within-the-open-epoch to the twin in-console (DIRECTOR_CANON.md v2 section 3a); ask_twin returned APPROVED, confidence high, for all six ranked Epoch-2 candidates (director_twin_log.jsonl entry 2026-07-13T07:33:20). Now BUILD-eligible for the supervisor's BUILD-tier draw. W1 built first; the rest concurrent where file_scopes are disjoint.
- '2026-07-13 BUILD, level 0->1 (L2 NOT yet reached, honestly held back -- see below). Resolved the FRAME''s ''one architecture, not two'' question: added fields DIRECTLY to company/crm/property_model.py''s Property (no separate BeliefState wrapper) -- a single `provenance: dict[attribute -> {source, confidence, as_of}]` field (excluded from eq/hash via `compare=False`, so two beliefs describing the same physical facts still compare equal regardless of how/when discovered), plus `confidence_for()/source_for()/as_of_for()/is_discovered()/overall_confidence` reader methods and a UNCONFIRMED_DEFAULT_SOURCE constant + TRACKED_BELIEF_FIELDS tuple (the 8 physical attributes this belief layer covers; has_gas excluded as customer-stated-by-construction). New company/crm/property_discovery.py implements the FRAME''s four named discovery events as pure functions, none reading saas/property_model.py ground truth: open_belief_from_signup() (self-disclosed bedrooms/property_type/tenure/occupants at moderate 0.6 confidence; EPC/floor-area/solar/EV ALWAYS start as population-average ''unconfirmed_default'' assumptions at 0.1 confidence, never inferable from signup disclosure alone, matching the FRAME''s own observation that no customer states an EPC rating unprompted), apply_epc_lookup() (0.95 confidence, the only observable route to a real EPC rating), apply_tariff_registration() (0.9 confidence, an EV/export-tariff opt-in), apply_engineer_visit() (0.98 confidence, a physical survey -- the closest the company ever gets to truth, still not 1.0/an oracle read). HomeRegistry (company/crm/home_registry.py) gained register_from_signup/record_epc_lookup/record_tariff_registration/record_engineer_visit wired straight onto these functions, plus a belief_confidence(account_id) query surfacing per-attribute source/confidence/as-of + the overall gauge; the pre-existing upgrade_epc() now delegates to record_epc_lookup() so it too stamps real provenance instead of silently mutating. Tests (54 new, all new + full pre-existing tests/company/crm/ suite, 1955 total) assert: source/confidence/as-of are recorded and readable; a discovered attribute reflects the DISCLOSED/OBSERVED value (which may legitimately differ from any specific real home -- test_signup_belief_may_diverge_from_any_real_home / test_belief_may_differ_from_a_hypothetical_ground_truth_home make this explicit); undisclosed attributes stay honestly low-confidence; overall_confidence rises monotonically as more discovery events fire and stays bounded [0,1]; property_discovery.py''s own source contains no saas/sim import (test_property_discovery_never_imports_saas_ground_truth). epistemic_verifier PASS (3 files scanned at --diff time after staging, 0 violations) -- no sim/simulation import anywhere in the new code, confirmed both by the tool and by direct inspection. Full tests/company + tests/saas suite (13502 tests) re-run clean, nothing else broken. LEVEL HELD AT 1, NOT 2, PER THIS ATOM''S OWN BUILD BRIEF: the mechanism exists and is tested end-to-end in isolation, but nothing outside company/crm/ actually CALLS register_from_signup/record_epc_lookup/etc -- confirmed via grep, zero non-test callers remain (same as before this pass, now true of the NEW methods too, not just the old ones). This build''s own file_scope (company/crm/ only, per its dispatch instructions) structurally cannot wire a live consumer -- the natural candidates (a real onboarding-flow entry point, or company/portal/''s own signup handling) live outside company/crm/. PRECISE L2 next step, named not vague: find or build the real signup/onboarding call site (likely company/crm/onboarding_journey.py -- itself already flagged elsewhere in this atom''s history as unwired and independently actionable -- or a company/portal/ entry point) and have it call HomeRegistry.register_from_signup() as part of a real onboarding flow, then have a real downstream decision (e.g. decarb_recommender.py''s measure recommendations, or a future portal property-details page) read HomeRegistry.get_profile()/belief_confidence() instead of any placeholder ground-truth construction. Until that live call graph exists, this remains L1: mechanism-built-and-tested, not yet wired.'
- '2026-07-13 BUILT L1->L2, target REACHED (saas-engineer fork, commit c458c264 pushed; orchestrator-verified per R1: full epistemic_verifier PASS 498 files, tests/company/crm/test_c2_discovery_wired.py green, grep-confirmed zero saas imports in the two wired files). Executed exactly the atom''s own named L2 next step -- a PURE WIRING pass, no new mechanism built: (REAL CALLER) company/crm/onboarding_journey.py::OnboardingJourneyTracker.start_journey (an existing, SLC-anchored, previously belief-unwired onboarding entry point) now calls HomeRegistry.register_from_signup() so a customer''s property beliefs are OPENED from signup disclosure as the first observable discovery event, plus record_epc_lookup modelling a later EPC-register event arriving over time (C-S1/C-S3 event-over-time, not batch-at-signup); (REAL CONSUMER) company/crm/decarb_recommender.py::recommend_from_registry(home_registry, account_id) reads the belief ONLY (get_profile/belief_confidence), never saas ground truth, and carries belief_confidence onto DecarbonisationPlan so a weakly-known home yields is_provisional_on_weak_belief -- the company acts on what it has OBSERVED, at the confidence it holds, which is the whole point of the epistemic wall. Test-exercised end to end: a customer flows onboarding -> belief opened -> EPC-lookup-over-time -> recommendation at held confidence. 12 new tests (9 in the named file), 1964 crm tests pass. HONEST L2 not L3: the wiring is opt-in via constructor injection (home_registry=None default preserves backward compat), so no LIVE sim/run pipeline yet constructs an OnboardingJourneyTracker(home_registry=...) to drive real customers through it habitually -- the call graph is genuine and test-exercised but not yet always-on in a running pipeline. L3 (habitual/pervasive) would need: an always-on production invocation site in the live run; a second genuine consumer (the portal company/portal/app.py has no property-details reader on the belief layer yet); and heating_system promoted to a real tracked belief attribute with an engineer-visit observable (currently coarsely inferred from has_gas). Target was 2 and is met -- loop_stage set to idle; level_target NOT inflated to 3 (that would be a re-rank, not this pass''s call).'
