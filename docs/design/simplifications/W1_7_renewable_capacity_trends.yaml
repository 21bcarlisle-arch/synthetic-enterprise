- '2026-08-03 LEVEL 1 -> 2 SELF-CERTIFIED (worker tick, sole-map-writer; recorded in gate_authorizations.jsonl per R16). THE BLOCK_REASON ABOVE IS NOW DISCHARGED AND HAS BEEN CLEARED. It said the FRAME Section-4 L2 bar (commissioning-date smoothing + coal->gas->wind marginal-plant re-stacking in sim/price_engine.py) could not be closed because that file was outside the atoms committed file_scope, and it explicitly refused to redefine the bar to fit the work already done -- correctly, that would have been the R12/R10 self-serving pattern. The orchestrator WIDENED file_scope to include sim/price_engine.py this tick and dispatched the bar as literally written; file_scope now records that widening. BOTH SUB-BARS CLOSED ON REAL DATA: (a) commissioning smoothing -- linear interpolation between real DUKES year-end capacity snapshots cuts the A5 reconciliation mean error from ~4.17% to ~0.16% across 27 technology-year cells, worst cell offshore 2017 from 14.08% to 0.25%; that worst cell is the exact one the previous pass had MEASURED and named as the smoothing gap, so the fix closes the defect its own evidence trail identified rather than a convenient neighbour. (b) re-stacking -- a THIRD independent DESNZ table, DUKES 5.7 coal/gas/nuclear capacity 2016-2025, fetched live this fork (assets.publishing.service.gov.uk/media/6a6a3622cceb23e8678976bf/DUKES_5.7.xlsx, HTTP 200), shows the dispatchable fleet shrinking ~56.2GW (2016) to ~42.4GW (2025) as coal exits entirely; that REPLACES the flat DISPATCHABLE_CAPACITY_MW=35000 constant via an optional year= kwarg on system_margin_price/synthetic_price, threaded end-to-end through weather_price_chain.py. THE DEFAULT PATH IS BYTE-IDENTICAL: year=None on every pre-existing caller, so the SSP merit-order calibration gate is NOT re-opened (R12/S8) and no output was tuned. R15 EVIDENCE, four controls mutation-proven: check_commissioning_smoothing_reduces_reconciliation_gap FIRES when real_capacity_smoothed is patched back to the raw year-end value; check_dispatchable_capacity_declines_2016_2025 FIRES on a fixture where the fleet grows; check_no_coal_after_retirement is now exercised on the REAL DUKES coal series (previously only a synthetic fixture existed, per this modules own honesty note) and FIRES on an injected post-retirement survival; DispatchableCapacitySourceUnavailableError FIRES rather than silently falling back to the flat constant when the DUKES 5.7 source is missing or incomplete -- the fail-open that would have made the whole re-stacking cosmetic. Tests +27 (107 passed / 1 xfailed in the three touched files); full tests/sim on MAIN after merge 897 passed / 3 xfailed; epistemic verifier PASS (528 files). L3 IS NOT CLAIMED AND IS STILL WALLED BY A6: the coupled-triad gate needs a COMPANY mix-belief twin plus a measured belief-vs-truth gap, and grep re-confirms no such capability exists in company/ or saas/ or coupled_triad.py; company/** is another lanes file_scope. THE THREE CANDIDATE ATOMS RAISED BY EARLIER PASSES REMAIN UNFIXED and are not silently dropped: the AGWS onshore/offshore split discarded at ingestion; the Jan-Jun-only 2025 cache; and the worktree cache-isolation gap (sim/cache/*.json absent from fresh worktrees), which this fork hit for the FOURTH recorded time and again worked around by read-only copying from the main tree rather than committing anything into the cache.'
- '2026-07-13 REGISTERED (WEATHER_PHYSICS_HIERARCHY.md, director P1, QUEUE -- DISCOVER/FRAME workable now, BUILD gated to Epoch 3 with W1_2_generate_futures). FOLLOW-ON, explicitly LATER per director sequencing (''Physics first'' -- do NOT build now; registered so the sequence is visible). Renewable capacity + generation-mix evolution over time. loop_stage idle: FRAME design authored this session (docs/design/WEATHER_PHYSICS_HIERARCHY_DESIGN.md); BUILD opens in Epoch 3. Anchoring rule (anti-marking-own-homework): GENERATOR anchors (real historical weather/demand) and VALIDATOR anchors (independent published sub-national consumption stats / regional degree-days / published system demand) MUST be different sources; the company never validates against SIM ground truth.'
- '2026-07-16 FRAME LANDED (Lane-3 H17 DISCOVER/FRAME, doc-only, NO LEVEL MOVE, L0 -- Epoch-3 BUILD-gated). docs/design/frame/W1_7_renewable_capacity_trends_FRAME.md. Genuine first FRAME for this atom (previously only the shared WEATHER_PHYSICS_HIERARCHY_DESIGN.md registration note, which explicitly leaves W1_7 ''noted, not designed''). Owns the gap that sim/price_engine.py''s L4 merit-order treats installed wind/solar capacity as a CALIBRATED CONSTANT (design doc S8, verbatim) whereas GB''s renewable fleet ~tripled 2016->2025 and the coal->gas->wind mix shift restacked the marginal plant -- so W1_7 makes capacity_k(tau) TIME-VARYING (a slow calendar clock tau separate from the half-hourly weather clock t, C-S5 exception named), layered ON TOP of the merit order without re-opening its gamma calibration (R12/S8). Generator anchored to real DUKES Ch.6 / NESO installed-capacity + coal-retirement record + Elexon AGWS actual outturn (already ingested via sim/generation_demand_history.py); VALIDATOR anchored to a DIFFERENT source (DESNZ Energy Trends Table 6 mix-share) per the atom''s anti-marking-own-homework rule. Four R15 mutation-testable invariants named (A1 offshore monotone-where-real, A2 outturn-consistency with TAUTOLOGY guard, A3 mix-share validator FAIL-OPEN/SILENT forbidden, A4 no-coal-after-retirement). R13 wall load-bearing: historical capacity is BASELINE (fidelity-only, blind to P&L); forward capacity is CURRICULUM (director-authored buildout scenario, never agent-tuned) -- BUILD delivers the mechanism, the named forward scenario is the director''s instrument (same split as W1_2). depends_on W1_6_physics_price_signal is physically correct (trend layers on the price physics). Coupled-triad twin = company''s belief about the shifting generation mix in hedging/pricing; W1_7 does not reach L3 until that gap is measured (register W1_7 <-> company-mix-belief in coupled_triad.py at BUILD). BUILD figures (offshore ~5->15GW, onshore ~9->14GW, solar ~10->16GW) are UNVERIFIED this fork (no network) -- flagged for a discovery-agent pass before any calibration leans on them. Ordered 7-step BUILD task list + proposed disjoint file_scope [sim/renewable_capacity_trend.py, sim/price_engine.py, tests/sim]. Level HELD at 0; DISCOVER/FRAME does not move an idle BUILD-gated atom''s level. Drawn as a Rule-0 dial-yield: the H17 draw that spawned this turn was a STALE in-flight artifact listing 6 FRAME-saturated atoms (W1_9/W1_2/B4/B5/W4_2/W1_3, each already carrying its own docs/design/frame/<id>_FRAME.md); the live _self_refill_draw guard (H23) correctly excludes all 6 and offers genuinely-unframed idle atoms instead, of which W1_7 is one -- so this turn did real first-pass FRAME work rather than churning a 7th saturated-atom doc (SELF_INTERRUPT_DISCIPLINE, the treadmill H23 exists to stop).'
- '2026-07-20 L1 BUILD LANDED (worker tick), level HELD at 0 -> L1 PROPOSED (map unchanged: no LEVEL_UP for W1_7 in the ledger). Mechanism: sim/renewable_capacity_trend.py makes the renewable fleet TIME-VARYING via a per-year mean-match (capacity_k(tau), the slow calendar clock tau separate from the half-hourly weather clock t, C-S5). Wired ADDITIVELY into sim/weather_price_chain.py: wind_output_from_speed/solar_output_from_weather/derive_price/residual_demand gain an optional year= param; year=None keeps the whole-window scalar BYTE-IDENTICAL (45 existing chain/price tests green -> SSP calibration gate NOT re-opened, R12). Now derive_price(year=2016) != derive_price(year=2025) for the same windy draw (10 new tests green, epistemic PASS). HONESTY (R15/FRAME S10): the per-year mean-match is an EFFECTIVE fleet (capacity growth + residual load-factor), NOT pure installed capacity; A2 outturn-consistency + A3 mix-share are NOT claimed (tautological vs same-year data; independent sources DUKES Ch.6 + DESNZ Energy Trends Table 6 are network-blocked, discovery-agent pass = L2). Invariants tested WITHOUT network + mutation-proven: TREND (grows across window), NON-DEGENERACY (2016!=2025), DETERMINISM (C-S2), COVERAGE-FAIL-CLOSED. R13: historical = BASELINE (fit blind to P&L); forward = piecewise-constant flat tails (hold-2025 default), curriculum scenario is the director''s. FILE_SCOPE EXPANSION REQUESTED (sole-map-writer): committed file_scope is [docs/design]; L1 code landed in sim/renewable_capacity_trend.py + sim/weather_price_chain.py + tests/sim -- please widen file_scope to include these. Reconciler stayed QUIET (no map delta this fork). REMAINING to L2/L3: (a) discovery-agent network pass for DUKES capacity + DESNZ mix-share (separates capacity from load-factor; enables non-tautological A1-strict/A2/A3), (b) flip derive_price default to year-aware after re-running the SSP calibration gate, (c) coupled-triad L3 gate -- register W1_7 <-> company mix-belief once that company twin exists.'
