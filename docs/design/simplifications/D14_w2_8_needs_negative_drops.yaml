atom_id: D14_w2_8_needs_negative_drops
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). WORLD FIRST, AS THE ATOM DEMANDED -- the fix is a missing phenomenon, not a denominator edit. (1) THE WORLD CAN NOW BE WRONG: `simulation.self_rationing.DropConfounder` emits non-budget consumption drops -- HOUSE_MOVE 0.100/yr (0.20-0.70 cut), VOLUNTARY_CUT 0.060 (0.15-0.35), VACANCY 0.020 (0.50-0.90), EFFICIENCY_RETROFIT 0.010 (0.10-0.30) -- each anchored in the module docstring and tagged [L] where the incidence is a curriculum shape rather than a measured rate. At the reference n=4000: 695 of 3752 non-rationers now really drop, where the D13 DISCOVER measured 0. (2) R13 ORDER OF OPERATIONS, NOT JUST R13 WORDS: incidences and bands were fixed from the anchors and committed BEFORE the resulting rate was measured, and nothing was touched after. The false-flag rate moved 0.0000 -> 0.0560 on the settled negative; recall barely moved (0.6927 -> 0.6878), so the change bought the company nothing on the direction it was already scored on. TWO CONSEQUENCES NOT GLOSSED: the truth set MOVED 192 -> 205 (confounders push some above-floor rationers below it, crossing NEITHER into is_silent_hardship), and harm on a rationer who also drew a confounder includes the confounder''s share -- both stated in docs/design/D14_W2_8_DROP_CONFOUNDERS.md rather than left for a reader to discover. (3) THE DENOMINATOR DEFECT THE DISCOVER FOUND IN SHIPPED CODE IS FIXED IN THE SAME CHANGE: the 43 households that ARE rationing but sit above the floor are EXCLUDED (a flag on them is CORRECT -- the D11 rule), the exclusion reason travels in the ledger components (D10: published, not silent), and `NEGATIVE_BASES` scores BOTH the settled and the naive denominator every run (0.0560 vs 0.0553) so the defect cannot return quietly. Unlike D15''s three-way R13 call this is NOT a curriculum choice -- the naive basis is simply wrong and travels only to show what it is worth. (4) THE REGISTER DEBT IS CLOSED, MEASURED NOT DECLARED: `DETECTION_DIRECTION_CONTRACT[''couple_w2_8_c10.detection'']` flips to two-directional on `detection_measures`, and `_flag_everything_score` routes it through this pair''s OWN `false_flag_measures` on its OWN world (households, not the triad''s payment records). The published pair gap changes MEANING -- harm-weighted miss 0.3094 -> mean of both directions 0.1787, g0 0.5 -- and the old figure is not restated as if it were the same measurement. All four published detection dimensions now count both directions. (5) A CONTROL THAT COULD ONLY PASS WHILE DEBT EXISTED, FOUND BY PAYING THE LAST ONE: the register control''s vacuity guard asserted that SOME entry was still recall-only, and its lying-declaration sibling picked that entry at runtime -- both would have failed on the day the register got clean, the one day they must work. The recall-only side of the differential is now scored from `detection_gap` DIRECTLY (`_reference_recall_only_score`), independent of any unpaid liability. (6) R15 BOTH WAYS: `test_mutation_disabling_confounders_restores_the_vacuous_world` is the MUST-FIRE half -- confounders off returns the world to 0 hard negatives and observed == healthy for every household, exactly as D13 measured -- and `test_mutation_the_published_measure_never_runs_with_confounders_off` proves the off-switch is unreachable from the published path (where it WOULD read 0.0000 again). Plus: no drop is ever unexplained (severity, confounder, or both -- the confounder cannot mask a generator bug as noise); the confounder draw is independent of the label in both directions (same household, same confounder, whatever its budget does) and is proven to land on rationers too; all four mechanisms are reachable; a rationer who also moves out cuts further while `rationing_severity` keeps naming only the budget part. 176 tests green across the pair, the sim atom, the register, gap_metric, the coupled-triad gate and the proof door. THE OLD ASSERTION THAT HAD TO GO, NAMED: tests/test_c10_self_rationing_detection.py asserted `false_positive_rate < 0.05` and PASSED at 0.0000 -- on a world where no non-rationer could drop, so no drop-based detector could ever have failed it. It is replaced by a structural claim (the rate can move; hard negatives exist), never a target band. FOUND AND QUEUED, NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE): `D18_confounder_observable_channel` -- the confounder cause is ANSWER KEY, so the company cannot explain away a house move it would really have registered; detection is therefore strictly HARDER than reality and 0.0560 is an UPPER bound, registered rather than hidden. NOTE ON THE MAP RATCHET: maturity_map.yaml is RED on HEAD already (481560 > 409600, owned by H32) and this note adds to it; H32''s own terms forbid paying that warning by trimming the record. L3 NOT claimed: no Expert-Hour pass on the changed world, and the tick that adds a phenomenon is not the tick to certify its calibration.'
  origin_note: 'Minted 2026-08-09 by the D13 DISCOVER, which overturned its own mint''s premise. The blocker on this pair is NOT the one D12 predicted -- the negative population is settled and unambiguous (RationingLabel.NOT_RATIONING is a Bernoulli outcome, not a threshold). The blocker is VACUITY: measured at n=4000, the settled negative gives 0/3752 and the naive one 0/3808, both exactly 0.0000, and probing why shows the world never presents a non-rationer with a drop. A confounder that produces drops WITHOUT budget stress is the missing world depth; it is also the thing that would make the C10 detector''s job real, since today the drop signal is a perfect separator by construction. R12/R13 WALL: adding drop-confounders is a FIDELITY change to the baseline world, decided blind to what it does to the measured gap -- it will RAISE the false-flag rate off zero and that is the point, never a number to tune back down. R15: the new confounders need a mutation proving the false-flag rate moves off 0.0000 when they fire. Falsifier already holds meanwhile: flag-EVERYTHING scores 1.0000 on the settled negative, and the register entry stays recall-only with its debt_atom repointed here.'
