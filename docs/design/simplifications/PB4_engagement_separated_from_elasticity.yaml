    EXPERT HOUR RUN 2026-10-06 (worker, direction slice pb4-expert-hour-run-as-a-slice). Blind packet through `tools/blind_review.py` (plain words RESTATED, persona: veteran of UK domestic retail pricing, retention and customer analytics), one fresh fork, 16 questions, recorded in `docs/observability/blind_review_ledger.jsonl` (audit: blindfold intact, independence false). VERDICT: FAIL, held at L2, and NOT parked under the director''s independence row, because independence is not the only open disqualifier -- the reviewer did not raise it at all. Seven disqualifiers, each graded against the tree:

    D1 OPEN, MEASURED -- the split at a fixed-term end. At real inputs: mean P(active) over the live roster''s 172 resi households is 0.351 (DD 0.378 n=129, SC 0.329 n=22, PPM 0.206 n=21); P(leave | active) on the live run''s reached decisions 2017-2021 is 13/101. So the world sends about 65% to the default, 31% to a re-fix with us, 4.5% out. [CORRECTED 2026-10-07: 13/101 was the electricity leg''s term-boundary rows, 39 of them `svt_conversion` with no roll; rolled decisions, both legs, are 18/62 in the live run AND the capture, row-for-row. So the split is about 68% default / 21.5% re-fix / 10.2% out -- re-fix ~1.5x EFTC''s, not 2x. Reconciliation: `SEAT_FINDING_PB4_EXPERT_HOUR_RETAKE_FAILS_AND_THE_DISENGAGED_ELASTICITY_IS_ALMOST_NEVER_CONSULTED_2026-10-07.md`.] Ofgem''s End of Fixed Term trial control arm (2019, one supplier, six weeks, `first_renewal_departure_rate_small_gb_supplier.md`) has 81% / 14% / 6%. External is close; the INTERNAL re-fix is about twice the published one, because the 35% active anchor and the trial''s 19% acting are not the same quantity and nothing has reconciled them. The reviewer''s own prior (40-60% active) sits above both; the published RCT wins over the prior. This is a world-fidelity question about the active-share anchor, not about the separation, and it is the one disqualifier with a number already in hand.

    D2 CLOSED IN THE TREE -- 2022. Engagement is not constant through the crisis: `renewal_engagement.FTC_WITHDRAWAL_WINDOW` (to 2023-06-30, Ofgem''s own re-emergence date) forces the boundary passive when there was no deal to take, and each year''s departure level is the published record''s (C2, `fit_whole_book`; DESNZ QEP 15.57% -> 3.06% across 2022). The live run''s reached decisions agree: none in 2022.

    D3 CLOSED IN THE TREE -- the curve the weight multiplies. `churn_position_multiplier` is a function of the household''s own annual saving in pounds from its own billed history (Ofgem/BMG 2024: savings valued in absolute terms), and the elasticity weight scales the felt differential into it.

    D4 OPEN, BUILDABLE -- does the separated model reproduce the observed pattern that low-engagement groups switch less on a given saving. By construction it must (P(leave) = P(engage) x P(exit | engaged, saving)), and the page''s rho -0.04 and 11/25 are, as the reviewer says and the page already says, not that evidence. The build that closes it: publish P(leave | saving band) by archetype from the world beside the published group gap, so the EMERGED correlation is on the page rather than the built-in one. No published by-group conditional is on file yet; that half is a knowledge pass.

    D5 CLOSED, AND THE ANSWER IS THE OTHER WAY ROUND FROM THE FEAR -- the bill-shock refusal leaves 0% of household-months unpriced, because no world caller passes `bill_shock=True` to the engagement gate (`run_phase2b` hands its shock flag to the company''s desk, not the world''s gate). The shock''s effect on engagement is therefore ABSENT in every year, 2022 included, and the page says so in reader words. That absence is the director''s open practitioner question (NTFY 9kuLLifpjEiV, 2026-09-29), not a build.

    D6 OPEN, A STATEMENT OWED -- the payment-method factor is CIM w6''s completed six-month switching, which is engagement times conversion, and all of it is attributed to engagement. There is no double count (elasticity carries no payment-method part), but the attribution is an assumption the code does not state. The build that closes it is that sentence, beside the constant, with its direction of bias. CLOSED IN THE SAME COMMIT: the statement now sits on `CIM_SWITCH_RATE_BY_CHANNEL` -- the split is assumed, it bites on prepayment alone, and it overstates how much less a prepayment household looks.

    D7 CLOSED IN THE TREE, ONE NAMED RESIDUAL -- `simulation/debt_objection.py` applies the SLC 14 objection as a structural block on an indebted CREDIT household (0.283 of indebted attempts, Ofgem 2016), separate from engagement. Residual: it treats every prepayment household as unblocked under the Debt Assignment Protocol, but the DAP covers debt below GBP500 only (same source, row 19); a prepayment household above that can be objected to. Small, named, not the separation claim.

    SUPPORTING questions, briefly: types barely differ (passive 0.24 vs disengaged 0.20) -- true, and the module''s own notes say the three shares are a director ruling over an RMI proxy, so this is a known identification limit; DD ~ SC against CMA -- the CIM w6 wave says so in its own table, and the live roster''s SC mean sits below DD only through archetype noise at n=22; small book -- the page''s intervals are on elasticity, not on engagement by channel, and at n=21-22 the channel split is not resolvable; persistence, term lengths, SoLR, and whether supplier levers wake a household (`how_households_respond_to_supplier_contact.md`) are not graded in this pass.

    NEXT, in order: D4 (the emerged-pattern table on the page), D1 (reconcile the active-share anchor against the EFTC trial -- world-side, may belong to a W2 world atom rather than here). Re-take the Expert Hour when those two are closed.


    D1 AND D4 WORKED 2026-10-07 (seat, Lane 0, claim pb4-closes-the-fixed-term-end-refix-share; `docs/staging/SEAT_FINDING_PB4_THE_EFTC_ARM_IS_NOT_THE_TERM_END_COMPARATOR_AND_THE_EMERGED_SAVING_GAP_2026-10-07.md`).

    D1 FILED, NOT THE COMPARATOR, NO RE-FIT. The EFTC control arm is re-fixing among households that had NOT yet re-fixed a few days before term end (report 3.4 excludes those who had already switched tariff; 5.3: many on the same tariffs had already acted). It is a lower bound on the term-end re-fix share, at one large incumbent chosen for above-average roll-over, 17-year mean tenure, six weeks, no prepayment. Fig 4.6 control: 20% at tenure under 5 years against 8% over 20. Re-fitting 31% to 14% would fit the world to an inert incumbent residue. The unconditional small-supplier split is unpublished: the director third-side question already filed in `first_renewal_departure_rate_small_gb_supplier.md`.

    D4 ON THE PAGE, AND THE PATTERN IS NOT REPRODUCED. `tools/engagement_separation.emerged` reads one committed world capture (`docs/reports/pb4_departure_factors.json`, bebf42253) and `#engagement-separation` renders it with both routes per archetype. Expected departures per household over the run, from the world own probabilities: active 0.61, passive 0.48, disengaged 0.60. Engagement gates only who reaches the renewal roll (55/56 active, 5/25 disengaged); `departure_risks.svt_inertia_hazard` has no engagement term, so every archetype drifts off the default tariff at 0.023-0.027 per cap period, and that route carries most departures. Counted departures (0.55 / 0.57 / 0.36) look like the published pattern and are dice. The saving gradient among lookers is unreadable on one run (52 of 71 at no saving). Controls: `tests/tools/test_engagement_separation.py` (bands, thin-cell refusal, both routes, absence), `site/test_engagement_separated_from_elasticity_reaches_the_reader.py::test_the_emerged_pattern_reaches_the_reader_and_a_thin_cell_is_not_a_rate`.

    LEVEL NOT RECORDED, held at 2. Remaining blocker: the SVT drift is engagement-blind, and a sourced gradient for it (how much less a long-default, never-switched household drifts than a recently lapsed fixer) is a knowledge pass before any multiplier. Then re-take the Expert Hour.


    EXPERT HOUR RE-TAKEN 2026-10-07 on the drift-gradient world (seat, Lane 0, claim pb4-retake-the-expert-hour-on-the-drift-gradient-world). FAIL, held at 2. Fresh blind fork, restated packet, 16 questions, 9 disqualifying, in the ledger. The three earlier blockers are closed or filed; the new ones are graded in `docs/staging/SEAT_FINDING_PB4_EXPERT_HOUR_RETAKE_FAILS_AND_THE_DISENGAGED_ELASTICITY_IS_ALMOST_NEVER_CONSULTED_2026-10-07.md`. The one that goes to the claim: the SVT drift has no saving term, so a disengaged household''s elasticity reaches behaviour only on the renewal roll (5 decisions across 25 households over the run). R5, closed by arithmetic: the disengaged spend 2.03x as long on SVT at 0.48x the hazard, so drift departures per household come out equal and the whole 0.61 comes from the renewal gate. CORRECTION beside the packet: its 65/31/4.5 split was D1''s live-run figure; the current capture has 29% of choosers leaving in 2017-21 (about 65/25/10). NEXT: R6 (the woken share for SVT stock between boundaries), then R1+R5 on the page.'
