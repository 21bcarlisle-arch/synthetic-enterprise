atom_id: PB4_engagement_separated_from_elasticity
map_notes:
  origin_note: 'Director, 2026-08-28 (P4): ''A large share of GB households have never switched at any price -- an engagement fact, not an elasticity one -- and a disengaged household can be highly price-sensitive once a bill shock makes it look, which is exactly why bill shocks are predictive. Modelling one on the other''s shape builds a world where never-switchers are also price-insensitive, and the company will learn a relationship that does not exist.'' The current world has ONE axis: simulation/customer_events.py weights a single price differential by a single per-household elasticity drawn from price_sensitivity, so a household that never switches is expressed as one with a low elasticity, and the two facts are inseparable by construction. Two gates, not one weight: an ENGAGEMENT gate (does this household look at all this period, and what makes it look -- a bill shock, a renewal letter, a price rise past a threshold) and, conditional on looking, an ELASTICITY (how far the gap moves it). BUILD SO THAT P1 CHANGES ITS ANSWERS, NOT ITS STRUCTURE (the guidance''s one genuine cul-de-sac): the gate takes a comparison offer as an argument, so a competitor that responds changes what is on offer without changing the shape of the decision.'
