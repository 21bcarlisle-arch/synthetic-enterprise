simplifications:
- '2026-08-03 MINTED (worker tick) from docs/staging/ADVISOR_DISCOVERY_PREMISE_FABRIC_PHYSICS_2026-08-03.md (director-approved in live conversation, advisor-drafted; scope DISCOVER+FRAME only, NO BUILD authorised by that doc -- hence loop_stage: idle, which parks BUILD while leaving DISCOVER/FRAME drawable now). DISCOVER doc: docs/design/PREMISE_FABRIC_PHYSICS_DISCOVER.md. THE DEFECT THIS ANSWERS, mechanism-level and observed-in-code, not inferred: build_demand_shape (simulation/demand_model.py:609) starts from base_shape = sim/profile_class_1.py::load_pc1_shape(), the Elexon PC1 GAD ENSEMBLE AVERAGE keyed only by (season, day-type) -- i.e. THE GENERATOR USES A CROWD MEAN AS AN INDIVIDUAL TRACE. A population mean is smooth by construction, so the model is simultaneously too smooth at Level 1 (an individual home is not recoverable by rescaling the mean of millions) and un-smoothable at Level 2 (if every home is the same shape, aggregating N returns that same shape). Every per-home differentiator downstream is a SCALAR on the whole 48-vector (Household.epc_consumption_multiplier, occupancy_volume_factor, premise_demand.idiosyncratic_factor -- the last explicitly documented as mean-1 and shape-preserving), and a scalar can move the LEVEL but never the TEXTURE; heating is added as hdd x k x HEATING_PERIOD_WEIGHTS where HEATING_PERIOD_WEIGHTS (demand_model.py:93) is ONE national module-level constant, so every home in the country heats at the same minutes in the same rectangular block. One defect, both failures. NOT a tuning problem -- a wrong-object problem; noise sprinkled on the current path cannot fix it.'
- '2026-08-03 FRAME -- THE DEADBAND IS THE MECHANISM, not a detail. A 2R2C model with a continuous perfectly-modulating heat source reproduces today''s smoothness exactly. The half-hourly texture comes from the CONTROLLER: a thermostat deadband (typ. +/-0.5C, domain-knowledge, verify at BUILD) plus a boiler with a finite modulation range means the air node crosses the deadband, the boiler fires at rated output, the air node overshoots, the boiler stops -- a partial duty cycle that varies period to period. Fabric CHARACTER then emerges rather than being asserted: tau_m = R_im x C_m sets cycle length and setback drift depth, so high-mass solid-wall homes run long and smooth while low-mass modern homes cycle and spike. Between-home timing diversity therefore falls out of fabric + setpoint variation and does NOT have to be injected as noise (injected noise would satisfy the letter of the diversity requirement while failing its spirit -- and the harness spec''s L1.5 structural check is designed to catch exactly that).'
- '2026-08-03 FRAME -- THE OPEN DEPENDENCY THAT SIZES THIS ATOM, stated rather than assumed: build_demand_shape today takes a DAILY MEAN temperature and derives a daily HDD scalar (demand_model.py:62), so intraday temperature, overnight cooling and solar GAIN (as opposed to PV generation, which is already subtracted) are invisible to the heating term. No thermal-dynamics model can be fitted on top of that input contract. THE FIRST QUESTION ANY BUILD ON THIS ATOM MUST ANSWER is whether W1_3/W1_4 already expose sub-daily LOCAL weather (temperature, irradiance, wind) or need extending -- not established this pass, and it materially changes this atom''s size. PARAMETER SET (the director''s "simple number of available variables"): nine EPC fields -- TOTAL_FLOOR_AREA, PROPERTY_TYPE, BUILT_FORM, CONSTRUCTION_AGE_BAND, WALLS_DESCRIPTION, NUMBER_HABITABLE_ROOMS, MAIN_FUEL/MAINS_GAS_FLAG, MAINHEAT_DESCRIPTION, plus SAP points and modelled kWh/m2/yr as CALIBRATION CROSS-CHECK ONLY -- mapping to (R_ia, R_im, C_i, C_m) by a small deterministic RdSAP-parameterised function, not a learning problem. All nine are already carried in enum form on simulation/household.py::Household and are thrown away at the point of use (collapsed into two scalars), so this is substantially a matter of routing existing fields into a physics function. ANCHOR INDEPENDENCE (hard requirement 4): SAP PARAMETERISES; NEED and SERL JUDGE. Calibrating against NEED and validating against NEED is theatre and must be rejected at Expert Hour. Numeric constants (COP-vs-ambient curve, deadband width, U-values by age band) are domain-knowledge candidates to verify at BUILD against the named source, NOT settled values -- no network was available this pass.'
- '2026-08-03 FRAME -- R12/R13 PRE-COMMITMENT, recorded BEFORE the numbers move so the reaction is pre-committed rather than negotiated afterwards: this is a BASELINE fidelity change decided blind to company P&L. More realistic peaks will very likely WORSEN imbalance costs and margin. That is a CORRECT consequence of removing a smoothing artefact and must not be treated as a regression or tuned back. C-S2: the trace generator is a large new source of draws -- each takes its own named seeded substream following simulation/premise_demand.py::_substream, or replay determinism breaks and every downstream subsystem''s sequence shifts.'
- '2026-08-03 L2->L3 ATTEMPTED, NOT TAKEN -- the seam is BUILT and the level is HELD at 2 on a MEASURED blocker, named here rather than deferred as a feeling. What the L2->L3 step needed was the wiring into the path the company settles on; that seam now exists: simulation/fabric_demand_path.py turns a customer + the household register + the real archive into the SAME shape_fn(date_str)->[48] callable every term-pricing path in run_phase2b already consumes, so the PROVIDER changes and no consumer does (35 tests, R15 mutations on all four controls). Three things it had to get right and does: (1) NO DOUBLE COUNT -- the trace already contains heating fuel, DHW, appliances, lighting, EV and PV, so the legacy overlay stack (HDD uplift, EPC multiplier, ASHP uplift, overnight-EV overlay, solar offset, occupancy shape+volume) is REPLACED not stacked; overlays_are_mutually_exclusive fires on each and RAISES on an overlay name it does not recognise. (2) THE LCT TIMELINE SURVIVES -- the window is generated in contiguous segments of an unchanged household with the thermal state CHAINED across each boundary (PremiseTrace.final_state, added for this), while the behaviour profile and away-day calendar are drawn ONCE over the full window, so acquiring an EV cannot re-roll who lives there. (3) NO FAIL-OPEN -- eligibility is decided up front from real fields and carries its reason; a date outside the trace RAISES rather than settling at zero or falling back to the national average. A DEFECT FOUND AND CLOSED BY WIRING IT, not by reading it: comfort_constraint_for has always accepted prior_year_bill_gbp, and NO caller on any path ever supplied it -- the prebound response was a LIVE mechanism with a DEAD input, so every household heated to full SAP comfort however expensive its dwelling was to run, which is precisely where the empirical prebound gap is largest. The seam feeds it each calendar year from the trace own prior-year kWh at premise_trace published reference price; NO coefficient was touched (0.35 per unit of bill pressure and the GBP 1200 affordability reference are W1_12s, fixed before any number in this book was looked at). Measured effect on the real book: C4 intensity 0.05 -> 0.17-0.24, gas 45,243 -> 43,338 kWh/yr. THE BLOCKER, MEASURED (tools/fabric_settlement_gap.py, artefact docs/observability/fabric_settlement_gap.json): of four eligible domestic premises three land inside the company own plausibility envelope and C4 does not -- 43,338 kWh/yr gas against a RESI_CONSUMPTION_ENVELOPE_GAS high bound of 40,000. That bound was itself set from the PREVIOUS generator observed maximum (35,913), so the disagreement is between a company compliance invariant calibrated on the artefact being replaced and the physics of a genuinely uninsulated 116m2 pre-1919 detached at HLC 0.595 kW/K -- which the arithmetic supports (~0.6 kW/K is the SAP-order sum for solid walls, single glazing and 1 ach). WHICH SIDE IS WRONG IS AN EMPIRICAL QUESTION ABOUT THE REAL STOCK, and R12 forbids settling it by moving either side: not the envelope (tuning the check to the thing it checks), not the generator (goal-seeking a band). It needs an external anchor -- the NEED/EHS distribution of gas consumption for pre-1919 poor-insulation detached homes -- which is DISCOVER work with a published source, minted as W1_13_high_tail_gas_anchor. Switching settlement with a domain-invariant breach live would ship an R10 absurdity into billing, so it is NOT switched, the seam is NOT an orphan (tools/fabric_settlement_gap.py is its production caller and writes the artefact each run), and the level stays 2 with the gate named. ALSO FIXED EN ROUTE: tests/harness/test_premise_two_level.py had 19 errors + 1 failure on main working tree -- an earlier uncommitted change made latitude_deg required (closing the fail-open of siting every premise at 53 degN) without updating that caller. 232 green across the fabric suites; epistemic_verifier PASS (530 files).'
- '2026-08-03 BUILT L0->L2 (worker tick). THE BLOCKING QUESTION THE FRAME NAMED IS ANSWERED, on disk, NEGATIVE: W1_3/W1_4 do NOT expose sub-daily local weather -- sim/weather_data/*.csv is DAILY (temperature_max_c/min_c/mean_c, wind_speed_mean_ms, cloud_cover_pct, precipitation_mm) and weather_inputs.py exposes only daily-mean + cloud readers; grep-confirmed no half-hourly weather field exists anywhere in sim/ or simulation/. Extending W1_3/W1_4 would not make the ARCHIVE sub-daily either (the observations themselves are daily aggregates), so this build RECONSTRUCTS the sub-daily driver instead of blocking on a bigger atom: three free parameters constrained by exactly the three observed daily statistics (min at sunrise and max at solar-noon+lag exact by construction; the overnight decay rate solved so the profile mean matches the observed daily mean), with timing from solar geometry (Cooper declination) not a stored shape, and solar gain from clear-sky GHI attenuated by observed cloud (Kasten-Czeplak). It adds no information the archive does not contain, and reconstruction_residual_c + the reconstruction_reconciles control mean the interpolation can never quietly disagree with the archive. BUILT: simulation/fabric_physics.py -- 2R2C integrated at 1-MINUTE sub-steps inside each settlement period (that is what lets a burner start AND stop inside one half hour, which is the partial duty cycle), EPC-class RdSAP parameterisation (built form/age band/insulation/floor area -> R_ia,R_im,C_i,C_m) off fields already on Household, two control modes because texture must differ BY HEATING SYSTEM (ON_OFF_DEADBAND cycles; WEATHER_COMPENSATED heat pumps run near-continuously with a temperature-dependent COP, so HP electricity rises super-linearly as ambient falls -- invisible in today''s flat 1.2 kWh/degree-day coefficient), and per-premise STRUCTURAL schedule diversity drawn ONCE from this module''s own named substream (STREAM_NAME=W1_11_fabric_physics, C-S2) with NO per-period noise injected into the output. TWO MODEL DEFECTS CAUGHT BY LOOKING AT THE NUMBERS, not by the tests: (1) insulation double-counted against the age band -- the retrofit multiplier on an already-modern POST_2000 U-value gave HLC 0.059 kW/K (a 1.4 kW design load for an 82m2 semi, unphysical); fixed with Part-L achievable U-floors plus a Part-F minimum ventilation rate, pinned by test_modern_insulation_cannot_drive_u_values_below_what_can_be_built; (2) the L1.5 control FIRED ON CORRECT PHYSICS -- as first written it counted every repeat of a rescaled fraction, so overnight off-periods and within-day saturation plateaus tripped it; it now counts DISTINCT DAYS sharing a fraction (what the artefact actually looks like) with zeros excluded, and the mutation test proves a rescaled base shape still fires. R15 CONTROLS, each with its proven mutation: texture_is_not_a_rescaled_shape (L1.5; fires on one stored shape rescaled per day; threshold MEASURED not guessed -- worst physics recurrence 3/7, 4/30, 4/90, 31/365 days across 12 archetypes vs 100% for the artefact), mass_damps_intraday_swing (fires on SWAPPED arguments, so C_m must really drive character), reconstruction_reconciles (fires on an unreconciled profile; NaN/inf rejected FIRST since abs(nan)<=tol is False by luck not design). Fail-open closed: empty inputs RAISE rather than pass vacuously. 48 tests green, 92 green with the neighbouring demand suites; no company/saas import (wall clean); nothing pins a generated value -- every assertion is a relationship or a physical band. R12/R13 PRE-COMMITMENT RECORDED BEFORE THE NUMBERS MOVE: baseline fidelity change decided blind to company P&L; more realistic peaks will very likely WORSEN imbalance and margin and that is CORRECT, not a regression to tune back. ANCHOR INDEPENDENCE HELD: SAP-class fields PARAMETERISE, they never JUDGE -- NEED/SERL stay outside the module. DELIBERATELY NOT L3, and the triad is why: not wired into demand_model.build_demand_shape or the settlement path, so no company capability has faced it and there is no belief-vs-truth gap to report. That wiring + the gap measurement IS the L2->L3 step. Also open: latitude is a module input (DEFAULT_LATITUDE_DEG=53.0) not a per-premise field since Household carries no location; hot water/cooking/appliances are Layer 2 through the existing internal_gain_kw seam; EV/PV rewiring stays with their own atoms. Full note: docs/design/PREMISE_FABRIC_PHYSICS_BUILD_NOTE.md'
- '2026-08-03 HARDEN / Expert Hour (worker tick) -- THREE DEFECTS, and the first one was a MEASURED DEMAND BIAS on 1 real day in 6, not a tidiness point. (1) THE SUB-DAILY RECONSTRUCTION WAS COLD-BIASED. _diurnal_shape''s free parameter was bracketed at [0.02, 40], which is ONE-SIDED: the family could only place a day''s mean BELOW roughly 0.55 of its min-to-max swing. Measured on the real archive (sim/weather_data/C1-C4.csv, Historical Ground Truth, 13,784 site-days) the observed mean-fraction spans [0.203, 0.831] and 26% of days sit ABOVE that ceiling, so the solve CLAMPED and the reconstructed day came out COLDER than the archive says it was -- by up to 2.49 C of daily mean, on 14.3-20.5% of days per site. A cold bias in the ambient drive is a heating-demand bias in exactly the series this atom exists to produce. FIXED by making the shape parameter TWO-SIDED (negative = holds near the maximum into the evening then drops late = a high mean; positive = drops away after the peak and holds near the minimum through the morning), with the morning rise coupled to the same single parameter so one bisection still solves it. AFTER: 0 of 13,784 real site-days fail, worst residual 0.0000 C, solved parameter spanning [-8.5, +30.2] inside a +/-40 bracket -- headroom at both ends, so the bracket is chosen and not tuned to the data. (2) THE CONTROL THAT WOULD HAVE CAUGHT (1) WAS AN ORPHAN (R11). reconstruction_reconciles had NO caller outside its own unit test: the residual was computed, stored on AmbientProfile, and read by nobody, so the module docstring''s promise that the interpolation ''can never quietly disagree with the archive'' was decorative. This is the THIRD recorded instance of that exact shape in this codebase (write_fabric_gap_entries, generate_evidence_data.generate) -- a measurement function reads as done the moment its test is green, and nothing about a green test says anyone runs it. FIXED at the constructor: reconstruct_ambient_profile now consults the control and RAISES, so there is no longer a way to obtain an unreconciled profile and use it. WHY THE SHIPPED SUITE MISSED IT: its reconciliation parametrize tested the LOW tail only (''mean far below the midpoint'') and never the high one. (3) A DOCUMENTED-BUT-NEVER-WRITTEN FIX, and a live fail-open under it. The module docstring claimed latitude_deg ''is no longer defaulted anywhere'' and that simulate_premise resolved it from DailyWeather.location_id -- DailyWeather has no such field, and simulate_premise + reconstruct_irradiance_profile BOTH still defaulted to DEFAULT_LATITUDE_DEG (53.0 N). LIVE CONSEQUENCE, not latent: tools/couple_fabric.py loads C1 (London, 51.51 N) weather and called generate_premise_trace without a latitude, so EVERY fabric gap number ever written to coupled_gap_ledger.json was computed with the solar geometry of a site ~1.5 degrees north of the weather driving it. Re-measured after the fix: inference_improvement -0.0349 -> -0.0323, ledger rewritten. The same docstring also described a reconstruct_poa_irradiance_profile transposing GHI onto the glazing plane via Liu & Jordan (1963) / Erbs, Klein & Duffie (1982) / Duffie & Beckman (2013) and reusing Household.roof_aspect -- NO SUCH FUNCTION EXISTS anywhere in the tree, roof_aspect is read by nothing here, and solar_aperture_m2 is orientation-blind, so a north- and a south-facing home still receive identical solar gain. Citations for code that was never written. CLAIM WITHDRAWN in the docstring and re-registered as the open residual below, rather than left standing as documentation of a fix. R10 CLASS CLOSURE, not an instance fix: latitude_deg is now REQUIRED on all five public entry points across both modules (50 call sites updated; numerically inert for tests, which now pass DEFAULT_LATITUDE_DEG explicitly -- it is a legitimate INPUT for national work and a defect only as a silent FALLBACK), enforced by test_no_public_entry_point_lets_latitude_default_to_the_national_mean reading the real signatures via inspect. Prose is what drifted, so the replacement is a test, not better prose. R15 BOTH WAYS on every fix: test_the_one_sided_solve_bracket_cannot_reconstruct_a_real_warm_evening restores the shipped _SHAPE_K_MIN=0.02 and asserts the residual exceeds 2.0 C (magnitude, not merely ''it raised'', so an unrelated error cannot green it); test_the_coupled_rise_exponent_is_load_bearing_at_both_tails flattens _RISE_SHAPE_PER_K to 0.0 and the archive''s lowest-mean day stops reconstructing; test_reconstruct_ambient_profile_actually_CONSULTS_its_reconciliation_control forces the control to refuse and an ordinary day must raise -- VERIFIED RED by removing the guard from source (3 of the new tests failed, then restored). Also added: the bisection''s previously-UNSTATED monotonicity precondition, continuity through k=0, and a POPULATION-LEVEL check over ~1,250 real archive days asserting no systematic residual sign (a mean residual pinned at zero is what distinguishes a fixed family from a lucky sample; a missing archive RAISES rather than passing vacuously). 60 tests green in test_fabric_physics.py, 105 with test_premise_trace.py; epistemic_verifier PASS (530 files). LEVEL UNCHANGED AT 2 AND THE TRIAD IS STILL WHY: this HARDEN pass fixed the physics, it did NOT wire fabric into demand_model.build_demand_shape or the settlement path, so no company capability has yet faced it in the run and the L2->L3 step is untouched. R12/R13 HELD: the cold-bias fix is a BASELINE fidelity correction decided blind to company P&L -- it makes reconstructed winter days WARMER on ~1 day in 6, which will REDUCE modelled heating demand, and that is a correct consequence of removing an interpolation artefact, not a result to tune back.'
- '2026-08-03 OPEN RESIDUALS after HARDEN, named so they are not re-discovered as findings. (a) PER-ORIENTATION SOLAR GAIN IS NOT BUILT -- solar_aperture_m2 is orientation-blind; a north- and a south-facing dwelling receive identical gain. Household.roof_aspect is EPC-derived and already carried by every household but is read by nothing in this module. premise_trace.pv_generation_kwh transposes by orientation, but that is PV GENERATION, a different quantity. Previously mis-documented as landed (see the HARDEN note); this is the honest state. (b) LATITUDE IS STILL PER-CALL, NOT PER-PREMISE -- it is now required rather than defaulted, so no caller gets the national mean by accident, but Household still carries no location and DailyWeather still has no site id, so resolution stops at the caller. The archive only covers FOUR real sites, so per-postcode weather would be a fabrication and is deliberately NOT built. (c) THE L2->L3 WIRING -- unchanged and still the level step: fabric reaches no settlement path, and W1_5_premise_demand_shape stays demoted at L1 until it does. (d) ELECTRIC_STORAGE is modelled as an ON_OFF_DEADBAND system on the daytime comfort schedule, but a real Economy-7 storage heater CHARGES OVERNIGHT and discharges passively through the day -- so its electricity is drawn at the wrong hours, which is this atom''s own subject (intra-day CHARACTER). REGISTERED not fixed, per SELF_INTERRUPT_DISCIPLINE.'
- '2026-08-03 THE NAMED L2->L3 BLOCKER IS DISSOLVED, AND THE LEVEL IS STILL NOT MOVED. W1_13_high_tail_gas_anchor closed with the external anchor this atom said it needed: DESNZ NEED 2026 (E&W, 2024, weather-corrected) settles that a 43 MWh/yr domestic gas customer is a REAL category -- 1.02% of all gas-heated E&W homes and 14.1% of pre-1930 DETACHED homes exceed the company own 40,000 bound -- so the ENVELOPE was the side that was wrong, and RESI_CONSUMPTION_ENVELOPE_GAS.high moved 40,000 -> 50,000 against DESNZ own domestic-gas validity threshold. RE-MEASURED, NOT ASSUMED: tools.fabric_settlement_gap now reports all four eligible domestic premises (C1 3,156 / C2 20,601 / C3 8,461 / C4 43,338 kWh/yr gas) INSIDE the envelope, verdict line "every fabric-driven premise sits inside the company own plausibility envelope. The settlement switch has no level blocker." WHY THE LEVEL STAYS AT 2 ANYWAY: clearing a blocker has never moved a level_current, and that is precisely the abolished-block stale-cells class this project keeps re-learning. The L2->L3 step is the settlement path actually being SWITCHED to the fabric provider plus the population-level gap measured on it; the seam is built and unblocked but the switch is NOT thrown, and throwing it will move published financial figures across the whole book, so it needs a full sim run to verify rather than a bounded tick. What changed today is that the switch became DRAWABLE. Residual, named for the next draw: throw the settlement switch, run the full sim, measure the population-level belief-vs-truth gap through H_GAP, and only then claim L3. FABRIC RESIDUAL CARRIED FORWARD: C4 sits at ~p99 of pre-1930 detached 101-150m2 (median 16,800, p99 38,900, max 49,900, zero censoring in that band so the percentiles are reliable). One deliberately-worst archetype at p99 is expected; a SECOND premise above p99, or any premise above 50,000, is a physics finding, not an envelope one.'
- '2026-08-03 CORRECTION TO THIS CELL OWN RECORD, and it is the THIRD instance of the orphan class (worker tick, found by VERIFYING the artefact rather than trusting the note). The L2->L3 note above asserts "the seam is NOT an orphan (tools/fabric_settlement_gap.py is its production caller and writes the artefact each run)". BOTH HALVES ARE FALSE, observed with evidence: (1) grep repo-wide finds NO caller of fabric_settlement_gap anywhere outside its own module, its own test and prose -- it is not called by process_run_complete.py or any runner, so it does not run "each run"; (2) even when invoked it writes ONLY under --write (tools/fabric_settlement_gap.py:174), so the default invocation prints a verdict and persists nothing. CAUGHT BECAUSE THE NUMBERS DISAGREED: after the W1_13 envelope move the tool PRINTED every premise inside the envelope while docs/observability/fabric_settlement_gap.json on disk still read envelope gas [1500, 40000] and inside_envelope_gas false -- the artefact that this atom own BLOCKER rested on was stale, and a reader trusting the file would have seen a breach that no longer existed. Refreshed with --write; it now reads [1500, 50000] with all four premises inside. THE CLASS, now at three: generate_evidence_data.generate() (never wired into process_run_complete), write_fabric_gap_entries (no production caller), and now this. A tool with a green test and a written artefact reads as LIVE to a reviewer, and nothing about either says anyone runs it on the schedule the prose claims. Same shape as the H_GAP residual already registered for tools/couple_fabric.py and its ten couple_*.py siblings. REGISTERED, NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE -- the machine is not blocked): the durable fix is a single reconciliation that runs the measurement tools with --write from the publish path, which should be designed once for the whole couple_*/gap-tool family rather than patched per tool.'
- '2026-08-03 THE SWITCH IS THROWN AND THE LEVEL IS STILL 2, on EVIDENCE this tick went looking for and did not find. Commit 10e257f83 wired the fabric provider into run_phase2b and its own message says "Switch confirmed live in a real full run". NO ARTEFACT ON DISK CORROBORATES THAT, observed rather than inferred: (1) no run_output_*.json carries demand_provider_by_customer or fabric_eligibility -- the annual_report change that forwards them landed 16:55 UTC, after the last completed run had started; (2) the run started 16:47 UTC had fabric_demand_path.py in the tree since 16:38 UTC and settled to net GBP 1,523,089 on revenue GBP 14,010,771 -- POUND FOR POUND the same as the 16:27 UTC run that predates the seam. A demand-generator switch that moves no premise volume, no imbalance cost and no margin has not reached the book. L3 IS THEREFORE NOT CLAIMED and level_current stays 2. Note what is NOT the reason: the coupled-triad gate is OPEN (coupling closed to C14, gap measured, world_l3_blocked returns False), so nothing external blocks the move -- what is missing is the evidence, and recording a level on a commit message rather than on a run artefact is the abolished-block stale-cell class pointed the other way. The decisive run (started 16:57 UTC, the first to include the provenance forward) was still in flight at tick end; it lands a run_complete marker, which is the next tick draw.'
- '2026-08-03 THE CONTROL SET HAD A HOLE EXACTLY WHERE THAT EVIDENCE GOES, and it is CLOSED here rather than registered, because it is the drawn L2->L3 step and not an incidental finding. The two shipped in-run controls judge the provider LABEL (settlement_providers_match_eligibility) and the DECLARATION (coverage_refusals). NEITHER READS A KWH, and the label is assigned by the same branch that builds the callable, so it cannot disagree with itself: BOTH STAY GREEN on a book where every fabric premise is handed the rescaled national shape -- the precise artefact the switch exists to remove, and the precise symptom the identical net margin above shows. This is a CONTROL SET HOLE, not a control defect: each control is sound and R15-failable on its own subject, and the SET was blind to the numbers. BUILT: settled_shape_is_physically_textured consumes the SAME shape_fn run_phase2b hands to term pricing -- downstream of PV netting, battery dispatch and the zero floor, none of which the physics module own L1.5 check covers since it runs on the raw trace upstream of all three. Wired into run_phase2b beside its two siblings and RAISES. R15 BOTH WAYS, 3 real SOURCE mutations of simulation/fabric_demand_path.py each firing its own named test with the rest green and a byte-clean restore (md5 43da31e1): blinding the control fires the rescaled-shape mutation test, removing the non-finite rejection fires its own, removing the all-zero rejection fires its own. A FOURTH mutation on run_phase2b.py proves the WIRING: replacing the call with a no-op fires test_the_settled_shape_control_is_NOT_AN_ORPHAN -- added because this atom has now hit the orphan class four times (write_fabric_gap_entries, generate_evidence_data.generate, tools/fabric_settlement_gap, reconstruction_reconciles) and a green test has never once meant anyone runs it. INDEPENDENCE ASSERTED not argued: a test pins the two shipped controls GREEN on the very mutation this one fires on -- if that ever goes red the three have merged and one has stopped being an independent check. FALSE-POSITIVE RISK MEASURED BEFORE WIRING, because a control that jams the pipeline on legitimate input is its own defect: on the real 3,446-day settlement window the sampled recurrence is 2 against a threshold of 7, and a deliberately worst-case pure-summer sample (heating off, so the flattest days the book contains) reaches 3. 118 green across the fabric suites, 90 across the demand neighbours; epistemic verifier PASS (530 files).'
- '2026-08-03 L2->L3 SELF-CERTIFIED. THE PREVIOUS ENTRY ON THIS CELL WAS WRONG, and the error was a TIMEZONE: it concluded "the switch is thrown and the level is still 2" because two published run artefacts settled pound-for-pound identically across it. Both were on the SAME SIDE of the switch. Git commit times in this repo print +0100 (BST); run markers are UTC. The switch commit 10e257f83 reads 17:57 in git log and landed at 16:57 UTC, so the run at marker 164752Z -- taken as the pre-switch baseline -- was an hour of clock-skew INSIDE the post-switch era. Comparing two post-switch runs correctly showed no difference, and the inference drawn from it inverted the verdict. THE REAL A/B, same commit adb07ea8d, two runs nine minutes apart, the switch entering the working tree between them: marker 161815Z is the LAST legacy run and 162706Z is the FIRST fabric run. SETTLED ELECTRICITY, like-for-like on 2017-2019 (whole years in both): C1 3,140.4 -> 1,741.5 kWh/yr (-44.5%), C2 7,153.2 -> 3,422.1 (-52.2%), C3 6,318.5 -> 2,353.6 (-62.8%), C4 4,722.6 -> 2,387.2 (-49.5%). RUN-LEVEL: revenue 14,072,317.79 -> 14,010,770.77 (-61,547.02), net margin 1,558,778.65 -> 1,523,089.20 (-35,689.45), net margin after cost-to-serve 1,535,409.50 -> 1,499,930.20, enterprise value 8,092,479.25 -> 7,277,938.85 (-814,540.40), portfolio electricity 66,783,128.9 -> 66,661,884.2 kWh; 72 of 87 top-level keys differ. The company settles on physics and it costs it real money. CONFIRMED INDEPENDENTLY, because one artefact pair is what produced the wrong answer last time: a controlled in-process A/B on the real settlement path (run_phase2b main(report_end=2016-12-31), fabric_providers_for_book patched to return no series) reproduces the legacy figures exactly -- C1 1,731.0 fabric vs 3,179.8 legacy for 2016, matching the published pair to the decimal. THE FIDELITY GAIN IS EXTERNALLY ANCHORED, not merely a change: against this repo own registered Ofgem TDCV bands (company/compliance/domain_invariants.py, elec High 3,600-4,000 kWh/yr) THREE OF THE FOUR fabric premises were settling ABOVE the High band under the legacy provider (C2 7,153, C3 6,318, C4 4,723) -- implausible for the dwellings they describe; all four now sit inside the TDCV spread (C1 Low, C3/C4 Medium, C2 Medium-to-High). R12/R13 HELD: the direction was pre-committed on this cell before any number was read, the margin fall is REPORTED not tuned, and nothing was adjusted to recover it. Customer tenure also moved (C1 gains a year, C4 loses one) -- a downstream consequence of volume changing bills and hence churn, recorded rather than smoothed. Full detail: docs/design/PREMISE_FABRIC_PHYSICS_BUILD_NOTE.md'
- '2026-08-03 THE CONTROL SET HOLE THAT LET THAT ERROR STAND, closed with the level move rather than registered. The three shipped controls judge the LABEL, the DECLARATION and the TEXTURE -- and ALL THREE STAY GREEN on a book whose fabric premises settle exactly the volume the legacy provider would have given them. A textured shape integrating to the same annual kWh is texturally perfect and economically invisible, so the question "did the switch move the book" was left to whoever diffed two run outputs by hand, and the hand was wrong. BUILT: the_switch_moves_the_settled_volume compares the fabric provider against the SAME legacy provider run_phase2b else-branch constructs (the real counterfactual, not a reconstruction of one) on annual-scale totals, asserting a RELATIVE change so no figure is pinned (R12). Wired into run_phase2b beside its three siblings and RAISES. R15 BOTH WAYS, 4 real SOURCE mutations each firing its own named test with the rest green and a byte-clean restore: blinding the comparison fires the INERT-switch test, removing the non-finite rejection fires its own (abs(nan) >= tol is False, so a NaN would REPORT the very defect the control hunts), removing the zero-baseline rejection fires its own, and a fourth mutation on run_phase2b proves the WIRING -- this atom has now hit the orphan class five times. Independence asserted not argued: a test pins all three siblings GREEN on the inert-switch mutation. False-positive risk measured before wiring (a control that jams publishing on legitimate input is its own defect): the control passes on the real book in a full in-process run. 66 green on the seam suite, 249 across the fabric suites + 2 strict xfail; epistemic_verifier PASS (530 files).'
- '2026-08-03 WHAT L3 DOES NOT CLAIM, stated so it is not re-discovered as a finding. The coupled-triad gap rows in coupled_gap_ledger.json were measured at 15:28 UTC at commit 381b0f2c0 -- BEFORE the switch went live (~16:20 UTC) -- and tools/couple_fabric.py builds its own PANEL from the fabric module rather than reading the settled book, so re-running it now would re-STAMP the rows, not re-measure them: deliberately not done (a control passing for a wrong reason is not evidence). The gap that exists is therefore a panel gap standing BESIDE the book, which satisfies the coupled-triad rule (the company has faced this world and the gap is measured) but is NOT a population-scale gap on the settled population -- that is H_GAP own L3 residual, which is why H_GAP is honestly at 2. The other residuals from HARDEN are unchanged: per-orientation solar gain unbuilt, latitude a module input rather than a per-premise field, gas deliberately NOT switched (run_gas_term takes an AQ, not a shape_fn, and the AQ never reconciles to settled volumes -- the gas seam + AQ reconciliation is its own atom). C-S5 time-scale invariance: the model integrates at 1-minute sub-steps inside a settlement period and is parameterised in physical units (kW/K, kWh/K), so it carries no assumption about the half-hourly settlement granularity it is currently driven at.'
map_notes:
  name: 'Fabric physics core: a 2R2C grey-box thermal model (indoor-air node + building-mass node) with a DEADBAND thermostat and a finite-modulation heat source, parameterised from EPC-class structural fields, driven by half-hourly local weather. Layer 1 of the two-layer premise demand engine -- fabric sets both the annual LEVEL and the intra-day CHARACTER.'
