map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05 section 2 item 2, docs/staging/DIRECTOR_RULING_WEATHER_CELLS_HEAT_LOAD_SEGMENTATION_PHASE1_2026-09-05.md, verbatim: ''Phase 2 (decided, not authorised to start; opens when phase 1 lands): cold-water / ground temperature (hot-water load), day length (lighting load and evening shape), summer temperature (cooling and appliance load; the futures engine needs it).''


    REGISTERED BECAUSE THE RULING''S OWN WORK BLOCK NAMES REGISTRATION AS A DELIVERABLE. A phase decided in the director''s words and held only in a staged document is a decision no queue, no draw and no orientation can see -- this project''s parked-atom class exactly, and the same shape H48 was minted for. The row exists so the decision is legible and the opening condition is CHECKABLE; it is not authorisation.


    WHAT PHASE 1 IS NOT: W1_14 clusters on heat-load drivers only. A cell set that is right for heating is unvalidated for hot water, lighting and cooling, and the phase-2 question is whether the SAME cells carry those loads or whether each needs its own cut. That question cannot be asked before the phase-1 coverage curve exists, which is why the block is real rather than ceremonial. The phase-2 knowledge STUBS (hot water and inlet temperature; lighting and daylight; summer load) are minted by W1_14''s own deliverable 1, not by this row -- if they are ever minted here that is duplication, not progress.


    NUMBERING: minted as W1_15 and renumbered to W1_23 within the same turn, because a concurrent lane landed W1_15-W1_18 (later W1_19-W1_22) into the shared tree while this row was being written. Recorded because the collision is the evidence, not the inconvenience.'
