- '2026-07-13 REGISTERED (WEATHER_PHYSICS_HIERARCHY.md, director P1, QUEUE -- DISCOVER/FRAME workable now, BUILD gated to Epoch 3 with W1_2_generate_futures). FOLLOW-ON, explicitly LATER per director sequencing (''Physics first'' -- do NOT build now; registered so the sequence is visible). Demand-side response / flexibility markets. loop_stage idle: FRAME design authored this session (docs/design/WEATHER_PHYSICS_HIERARCHY_DESIGN.md); BUILD opens in Epoch 3. Anchoring rule (anti-marking-own-homework): GENERATOR anchors (real historical weather/demand) and VALIDATOR anchors (independent published sub-national consumption stats / regional degree-days / published system demand) MUST be different sources; the company never validates against SIM ground truth.'
- '2026-07-16 DISCOVER pass (governed-discovery fork, docs/design/ scope only, no code changed). Found EXTENSIVE built-but-uncredited company-side DSR/flexibility revenue accounting -- nine modules in company/market/ (capacity_market.py, capacity_market_register.py, dsr_book.py, dsr_portfolio.py, flexibility_potential.py, flexibility_revenue_book.py, ic_flexibility_revenue.py, dso_flexibility_tender_register.py, flexible_asset.py), ~1,300 lines, fourteen matching test files, wired into a live run path (simulation/run_phase2b.py) and dashboard reporting -- same built-but-uncredited shape as W1_3''s 2026-07-15 finding. HOWEVER the real gap against this atom''s OWN lane (W1_market_weather, a world/SIM capability) is genuine and distinct from that accounting build: every rate/event-count/dispatch-cadence in those nine modules is a hardcoded constant (e.g. _DFS_RATE_GBP_PER_MWH=4.5, _DISPATCH_EVENTS_PER_YR=20, fixed CM clearing-price table) supplied by the caller, not discovered through company/interfaces/sim_interface.py (confirmed zero flex/DSR mentions there) or derived from any SIM-side system-stress signal -- it is handed to the company, not discovered by it, which is the actual epistemic-wall gap. depends_on: [W1_6_physics_price_signal] is physically correct: real DFS/BM dispatch frequency and price are driven by system tightness (the same cold-and-still low-margin conditions W1_3/W1_6 model), not a flat calendar rate -- building this atom''s stress-linkage before W1_6 exists would hardcode the exact assumption the physics-hierarchy work is meant to replace. Grounded in real UK market structure: Balancing Mechanism (NESO, BOAs, BMUs, Elexon Insights Solution settlement data), Capacity Market (EMR 2014, T-4/T-1 auctions, DSR de-rating), NESO Demand Flexibility Service (launched winter 2022/23, continuation year-to-year is a live policy question -- NOT a settled indefinite scheme, code currently bakes in ''20 events/year forever''), DNO/DSO locational flexibility tenders (Open Networks Programme, per-GSP not national pricing), the aggregator route (Ofgem independent-aggregator access reforms ~2018+), and triad avoidance''s declining value under Ofgem''s Targeted Charging Review. Numeric figures already embedded in code (DFS £4.5/MWh + 20 events/yr, CM clearing-price table by year, 20% aggregator fee) are UNVERIFIED this session (no network access in this fork) -- flagged for a discovery-agent pass against NESO/Elexon/Ofgem primary sources before any BUILD leans on them for calibration. Concrete remaining SIM-side scope named (none built): (A) a system-stress observable through the sim_interface seam driving dispatch probability instead of a flat constant, (B) locational grounding of DSO tenders against a regional weather/demand field (ties to W1_4), (C) stress-responsive price formation, (D) time-indexed DFS scheme lifecycle (effective_from/effective_to) rather than assumed-indefinite. Open question raised, not resolved: whether the existing accounting modules already satisfy L1/L2 with L3 reserved for the discovered-vs-handed gap, or whether ''discovered not handed'' is itself the bar for any level above 0 here -- re-level is the orchestrator/director''s call, not self-fixed (sole-map-writer discipline; maturity_map.yaml not edited by this pass). No level_current change -- DISCOVER does not move levels.'
- '2026-07-16 DISCOVER/FRAME (Lane-3, H17 draw): framing artifact written; BUILD remains gated on W1_6_physics_price_signal. Level unchanged (0); DISCOVER does not move BUILD level.'
- '2026-07-20 L1 BUILD LANDED (worker tick, committed b146d9acc, pushed; director BUILD_OPEN ts=1784556965 cleared the schema_sim_structure gate + file_scope expansion). Typed observables-only flex seam interface/contracts/flex_observable_seam.py (FORBIDDEN_TRUTH_FIELDS guard) + SIM residual-scarcity dispatch sim/flex_dispatch.py (system-stress truth hidden behind the wall) + company price-proxy participation company/market/flex_participation.py + enrol_flex/get_flex_settlement_lines added to company/interfaces/sim_interface.py (closes the zero-flex-mention gap named in the 2026-07-16 pass, scope item A) + revenue-gap harness background/flex_dispatch_triad.py. Coupled-triad L1 gap ~=0.46 (company over-forecasts because high price does not equal high residual -- gas moves price), R15 mutation-proven both ways; 17 new tests green, epistemic verifier PASS, sim_interface regression 60/60. Level held at L0, L1 PROPOSED (level is director-ratified; blocked_on: director_level_up set to stop a wasteful build redraw of already-built-to-L1 work). L2+ stays benchmark-gated: every GBP/MWh, GBP/kW/yr, and baseline-window figure needs NESO/Elexon/Ofgem sourcing (no network in this tick) -- no figure fabricated, utilisation price IS the observed W1_6 outturn. Scope items B/C/D (locational DSO grounding, stress-responsive price formation, time-indexed DFS lifecycle) deferred to L2/L3.'
- '2026-07-21 L2 BUILD LANDED (worker tick; W1_9 is a member of the OPEN SIM_ACTORS front, lane W1_market_weather, epoch_ceiling 3, W1_9 epoch 3 -- authorized, no gated path touched; director ratified W1_9 -> L1 and cleared blocked_on in 945a4377b). Built the STRUCTURAL core of L2 (FRAME S3): stochastic portfolio delivery + baseline-methodology exposure, no fabricated benchmark figure. SIM (sim/flex_dispatch.py): DeliveryModel makes the realised reduction a FRACTION of the instructed volume (rebound / non-response) drawn from the named flex_delivery RNG substream (C-S2, stable sha256 seed, deterministic replay) -- delivery=None keeps L1 PERFECT delivery BYTE-IDENTICAL (regression-safe by construction, no SSP gate re-opened). The true per-event delivery ratio + true baseline are SIM-INTERNAL; only the metered delivery crosses the seam (interface/ untouched -- gated path). COMPANY (company/market/flex_participation.py): form_participation_belief_l2 learns a delivery DE-RATING from its OWN settlement observables (metered / instructed) and estimates its counterfactual baseline with a possibly-biased methodology it cannot validate -- observables-only, epistemic verifier PASS, no-sim-import test added. HARNESS (background/flex_dispatch_triad.py): measure_l2 scores TWO gaps -- delivery_learning_gain (L2 de-rating narrows the gap vs the L1 perfect-delivery belief, ~0 under perfect delivery so NOT fail-open) and baseline-methodology exposure (baseline_error_frac + payment_at_risk_gbp, 0 iff unbiased so it FIRES on its own defect, R15). 22 flex tests green (was 8; +new tests/company/test_flex_participation.py which the L1 module docstring referenced but was MISSING), epistemic PASS. Level HELD at 1, L2 PROPOSED (levels are proposals -- fronts_reconciler reverts any agent level_current bump; director ratifies) + blocked_on: director_level_up SET to stop the wasteful build-redraw of landed L2 work (same dial-defect fix as W1_5/W1_7/W1_10). file_scope expanded to the code+test paths (sole-map-writer). HONEST REMAINING (R9/R10, benchmark/level-gated, none autonomously doable): (a) a SOURCED mean delivery ratio (NESO DFS delivery reports / Elexon BM performance -- no network in this tick; the MECHANISM is built, the calibrated ratio stays a benchmark gate so the score cannot move on a fabricated figure), (b) the CM availability second venue (avail vs utilisation split, stress-event delivery + non-delivery penalty, needs sourced GBP/kW/yr), (c) settlement history is IN-SAMPLE (steady-state participant) -- a point-in-time train/forecast split is an L2 refinement, (d) L3 multi-venue stacking + coupled_gap_ledger wiring for the W1_9<->flex_participation pair (un-wired ledger entry reds its consumer; the gap is asserted by the triad test meanwhile).'
- '2026-07-29 blocked_on CLEARED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 1+2): director_build_open/director_level_up are abolished as BLOCK TYPES -- there is no such thing as needing a build opened, and levels are proposed+recorded (ledger-backed, self-certification via background.gate_authorization.record_level_up_self_certified now suffices, R16), never gated. Prior blocked_on/block_reason preserved above/below for the record; this atom re-enters the normal draw for whichever lane/loop_stage it already carries.'
- '2026-07-30 L3 STACKING LANDED + the missing THIRD LOOP written (worker tick). This tick RESCUED a dead fork''s uncommitted 1,035-line stacked build (the owning agent died without committing; 2,689 lines were at risk across three dead worktrees) and then found the build was NOT what it appeared: 1,024 lines of new SIM+COMPANY code with ZERO tests (the 31 existing flex tests referenced none of the new symbols), and background/flex_dispatch_triad.py IMPORTED the stacked API but never CALLED it -- so the HARNESS half of the coupled triad did not exist and the stacking gap had never been measured. Merging that as L3 would have been a false completion (COUPLED TRIAD: no SIM atom reaches L3 until the company has been tested against it and the gap measured). Written this tick: measure_l3 + build_gap_summary_l3 + _default_venues, and 54 tests (tests/sim/test_flex_dispatch_stacked.py 28, tests/company/market/test_flex_participation_stacked.py 18, 8 L3 triad tests). MEASURED GAP: a contention-blind party over-claims 76.5pct more PHYSICAL MWh than the portfolio can physically deliver; a party learning contention from its OWN instruction feed narrows that to -1.2pct (contention_learning_gain 0.776, gap 0.66 learned vs 0.99 blind -- never 0, because a zero gap would mean observables leaked the SIM-internal allocation). R15 BOTH WAYS: assert_mw_conservation proven to FIRE by breaking _allocate_by_priority so every called venue takes its full offer (the sell-the-same-MW-twice bug), plus NaN/inf (a NaN compares False against the cap and would pass silently), wrong-type, empty-input, negative and missing-key legs; the over-claim metric is 0.0 on an UNCONTENDED book, so a positive reading proves real contention rather than an always-on number; assert_point_in_time proven INDEPENDENT of past_only (a guard derived from its own filter could never fire) and refuses as_of=None. Headline is PHYSICAL MWh carrying no price, and the default book OMITS the Capacity Market venue entirely unless a sourced price is passed, so no un-sourced GBP/kW can move the score (R12/R13). 81 flex tests green, epistemic verifier PASS. Level 0->3 SELF-CERTIFIED to the ledger (R16, 2026-07-29 ruling item 2) -- L1/L2 had landed 07-20/07-21 but level_current was never bumped under the now-abolished director_level_up gate. HONEST REMAINING (unchanged, benchmark-gated): a SOURCED mean delivery ratio (NESO DFS delivery reports / Elexon BM performance) and a SOURCED CM availability clearing price (NESO / EMR Delivery Body) -- the STRUCTURE is built, the magnitudes stay gated; coupled_gap_ledger wiring for the W1_9<->flex_participation pair still deferred (an un-wired entry reds its consumer''s tests).'
