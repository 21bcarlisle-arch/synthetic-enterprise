atom_id: H16_idle_detection_stability_gate
simplifications:
- '2026-07-13 IMPLEMENTED + DIRECTOR-CONFIRMED (DEFECT_TMUX_PANE_INJECTION REOPENED, R3). The byte-stability gate this atom described is now LIVE in background/tmux_relay.py::_safe_to_inject (re-capture; inject only if UNCHANGED -- a processing pane mutates because the spinner timer ticks, format-proof) alongside an input-box-occupancy guard (accumulation impossible). Zero injections across a >=30min busy window + director confirmation. Retro: docs/retrospectives/2026-07-13-tmux-injection-two-strikes.md. || 2026-07-13 REGISTERED (DEFECT_TMUX_PANE_INJECTION.md residual, SELF_INTERRUPT QUEUE). The tmux idle-detector is_session_idle() is single-capture + fail-OPEN: it declares idle unless a KNOWN busy glyph matches. Broadened _is_busy_content (commit a4061c980) closed the states seen in the wild (Waiting-for-background-agent, Levitating, esc-to-interrupt anywhere), cutting the storm from multi-daemon bursts to single-source. RESIDUAL: the supervisor still injects a turn-grant in the BRIEF idle-looking window between an interactive session''s tool calls (pane shows a bare prompt for a beat), which the pattern list cannot catch. FIX (the robust catch-all): a BYTE-STABILITY gate -- re-capture the pane after ~0.6s and only declare idle if UNCHANGED (a processing session is never static). Deferred here because it adds a second capture to is_session_idle, which the 4 send_keys_when_idle flow tests mock as an exact capture SEQUENCE -- they must be reworked around the extra capture. Mutation-test: a pane that mutates between captures reads busy; a static idle prompt reads idle. Diagnosability already shipped: docs/observability/injection-log.jsonl logs every send-keys (source script, ts, payload hash) -- this residual was PROVEN with it in seconds. || 2026-07-18 REAL INCIDENT + CLASS FIX (director-caught): the seat declared ''agenda+staging empty, holding at the wall'' for many consecutive turns while ORIGIN had an unprocessed advisor steer (ADVISOR_STEER_NTFY_TAXONOMY) AND a publish gate WEDGED 12x in an hour -- a FALSE WALL declared on STALE LOCAL state. Two roots: (1) R7 VIOLATION -- trusted the doorbell ''agenda+staging empty'' text instead of verifying disk-vs-origin; after the periodic checks I lapsed into echoing the doorbell without re-fetching, so local drifted 1 commit behind origin and I never saw the steer. (2) NARROW LIVENESS -- the periodic health check covered only the pull-loop TRANSPORT (HEALTHY_DREW), NOT the PUBLISH pipeline, a SEPARATE surface which was wedged (process_run_complete rc=1 on a value_stream-hygiene test my own H27_phone_act_channel registration broke -- the same wedge that kept the site/LATEST.md stale while I hand-patched them, a symptom I misread). CLASS FIX (the rule a loop must obey): a HOLD/wall declaration is valid ONLY after verifying against origin -- git fetch + scan docs/staging for new files + check publish-gate health (.publish_gate_state.json consecutive-failure count) -- never on doorbell text or unfetched local; a wall without an origin-verify is a DEFECT that hides real work. MECHANISM (MAKE_IT_STICK, BUILD-gated): the pull-loop ''staging empty'' computation should fetch+compare origin before emitting, and the liveness/health check must include the publish pipeline, not just the transport; until built, applied as discipline -- every pre-hold turn fetches origin + checks staging + publish-gate health. Remediated this turn: synced local, unwedged the gate (classified H27_phone_act_channel value_stream), processed the NTFY-taxonomy steer, cleared the wrongly-director-paged publish_gate action-needed.'
