atom_id: SITE8_home_reordered_and_link_labels
map_notes:
  gain: 'Six identical `Evidence behind this stage ->` labels on the homepage -- exactly six, word for word, confirmed against the committed source. No label tells a reader where it goes. The brief''s §7 control #3 (a label used more than twice on a page fails) lands with this step, per §9.3''s rule that controls arrive with the thing they govern. The model-on-one-page diagram is a good artefact in the wrong position: it moves to the foot as the payoff, not the greeting. Watch `site/test_home_door.py` (6 tests) -- it asserts the home nav and evidence links structurally and encodes prior migration decisions, so it is read before it is edited. REVISION 2026-08-18 (brief revised after this atom was minted, and this is the atom it changes most): Home''s CLAIM IS REPLACED, not reordered. The live headline states the SIMULATED COMPANY''s mission (''an energy company built and run by AI, to find the cheapest tonne of carbon left''); the brief now rules that is the mission of the thing being grown, not the experiment being run, and a reader currently meets the exhibit without being told what it is an exhibit of. Home must instead open with the PROJECT''s claim in a ruled six-part order -- the question (can software be grown rather than written, can a system produce and maintain itself), the name and thesis (autopoiesis, Maturana and Varela, contrasted with allopoiesis), the experiment, why energy (the fitness function is the cheapest tonne abated and the domain punishes faking), what is measured, and the honest frame (a proof of concept for learning, not a product and not a pitch). Plus two structural claims stated as evidence: SELF-PRODUCTION (the system builds the controls that judge its own work, finds them unable to fail, rebuilds them, and mints the law that prevents the next instance) and SELF-MAINTAINED BOUNDARY (the epistemic wall, enforced by the system on itself, crossings measured and driven down -- a structural correspondence, explicitly NOT an analogy). CONTRADICTION TO RESOLVE BEFORE DRAWING, and it is in the revised text itself: the new paragraph says Home carries ''a route into Knowledge as the next step for a patient reader'' while the retained bullet directly below still says ''One hero route into Explore -- a named household''. Both are written as THE hero route. §3 ruled Knowledge second precisely for the patient reader, so Knowledge is the likelier intent, but this is the director''s editorial call and it is not the worker''s to silently pick.'
