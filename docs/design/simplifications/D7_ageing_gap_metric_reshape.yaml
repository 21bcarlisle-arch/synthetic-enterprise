atom_id: D7_ageing_gap_metric_reshape
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-08. `background.gap_metric.ageing_gap` replaces misapplication_gap on the ageing dimension of score_triad; misapplication_gap is UNCHANGED and keeps its remaining legitimate caller (W2_9<->C11). Three measures, each on the denominator it is about: understated_arrears_rate = misses/n_truly_overdue, overstated_arrears_rate = false_ageings/n_truly_current (the wrongful-dunning exposure), mean_bucket_displacement over the truly-overdue, ABSOLUTE and with no divisor at all. ORACLE, same rows both criteria (the D6 oracle now prints old above new): C (finds 100% of arrears at 1.5% FP) went 1.5000-worse-than-no-skill -> understated 0.0000 / overstated 0.0150 / displacement 0.0000; off-by-one vs stone-blind went 1.0000==1.0000 -> 1.0 vs 3.0 buckets; the prevalence sweep went 3.00->0.15 (twentyfold, company FIXED) -> exactly flat on all three. LIVE (400 customers, seed 7): the retired scalar reads 0.8043; the reshape reads understated 0.0725 (10 of 138 truly-overdue), overstated 0.0951 (101 of 1062 truly-current), displacement 0.123 buckets -- and immediately says what the scalar could not, that this company''s WRONGFUL-DUNNING exposure exceeds its miss rate. R15, FOUR named mutants in tests/tools/test_d7_ageing_measures.py, each required to FAIL the assertion that passes on the real measures: _MUTANT_ordinal_over_no_skill (the trap the D6 DISCOVER caught in its own draft), _MUTANT_displacement_over_whole_population, _MUTANT_understated_over_population, _MUTANT_hamming_not_ordinal. Plus fail-loud on an unrankable bucket label (the fail-open alternative would read a vocabulary drift as perfect dating) and vacuity reported as None, never 0.0. The headline cannot be misread as a normalised score: g0 is 0.0, `baseline` says NONE in words, components carry headline_units/normalisation into the ledger and on to proof.json, and format_ageing_summary is used at all three print sites so no consumer emits a bare scalar. Anti-decay on the class register: tools/couple_w2_11_d5.py is STRUCK from KNOWN_CALL_SITES (a subset check can never fail on a departed entry) and test_6_a_departed_call_site_has_not_come_back holds it out, with a vacuity guard on the path still existing. 535 tests green across every file touching gap_metric/the triad; ruff unchanged at 16 for the touched files (measured against a pristine HEAD extract with the repo config -- zero added to the standing ratchet). L3 NOT claimed: no Expert-Hour pass, and Defect 3 is fixed on SHAPE grounds while still latent in live populations (wrong_bucket == 0 on the 400-customer run). Not claimed either: the live 1.1538 is still not reproduced in detail -- the reshape did not need it and does not explain it.'
  origin_note: 'Minted 2026-08-08 by the D6 DISCOVER rather than fixed on sight (SELF_INTERRUPT_DISCIPLINE -- the machine is not blocked and a metric reshape deserves its own build). R15: each new measure needs its own mutation test. R12 WALL: the reshape may not be chosen for producing a nicer number -- prevalence-invariance under a FIXED company is the acceptance criterion, and it is already measurable via tools/d6_ageing_metric_oracle.py. The existing characterization tests are EXPECTED to fail when this lands; replace them, never repair them.'
