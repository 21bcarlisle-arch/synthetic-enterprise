atom_id: SITE11_proof_dissolved
map_notes:
  gain: 'The dangerous one, and the correction the director accepted back up the chain in his own words (''my instruction would have broken five live redirects''). The brief''s §3 says proof is ''deleted, not moved''. /proof/ is where method, project, simplified, tours and wip-flow were re-homed by two prior IA migrations (Campaign A 2026-07-18, SITE_V5 2026-07-23), and it renders their absorbed content at #method-anchor, #project-anchor, #simplified-anchor, #economics-anchor, #timeline-anchor. Deleting it points five live 301s at a 404 and destroys the only rendered copy of five retired areas'' content. Instead: /proof/ becomes a redirect SOURCE like the five before it (/proof -> /harness/ 301), the five existing 301s are re-pointed to their new homes IN THE SAME COMMIT, the anchor content moves BEFORE the redirect lands, and nothing leaves the tree -- which is the convention site/_redirects already states in its own comments, and satisfies §9.1 (''nothing is deleted until its replacement is live'') more literally than deletion does. Must be last: it re-points at homes that have to already exist. Six pages carry in-page links to /proof/#*-anchor today.'
