atom_id: D13_self_rationing_negative_population_discover
map_notes:
  discover_note: 'DISCOVER CLOSED 2026-08-09, verdict THE MINT''S PREMISE IS FALSE and the two pairs are NOT one problem (docs/design/D13_SELF_RATIONING_NEGATIVE_POPULATION_DISCOVER.md). The mint said ''not self-rationing'' is a continuum the harness labels by THRESHOLD. It is not, in either pair: W2_8 draws rationing onset as a BERNOULLI and stamps RationingLabel.NOT_RATIONING (the propensity is continuous, the LABEL is not), and W2_5 runs a discrete income_stress state machine over LOW/MODERATE/HIGH. Both negatives are as settled as the payment pair''s ''the cash arrived''; the TDCV floor is a threshold but it selects the TRUTH set, never the negative. The pairs then diverge and that divergence is the finding. W2_8: three populations measured at n=4000 -- 192 must-flag, 56 NEITHER (truly rationing but ABOVE floor, so a flag is NOT wrong), 3752 must-not-flag; denominator choice moves NOTHING (0/3752 vs 0/3808, both 0.0000) because 0 of 3752 non-rationers have ANY drop (the not-onset branch returns observed == healthy exactly) and 0 are flaggable under ANY of the five weather factors. So the second direction here is available but VACUOUS -- a structural property of the WORLD, and publishing 0.0000 would read as detector precision (R12 breach in the making). W2_5: the D11 shape REPRODUCED -- naive 0.1661 / exclude-carried-HIGH 0.1491 / LOW-at-both-ends 0.0576, a x2.88 swing with company behaviour literally fixed, flat under scale (x2.80 at 5k, x2.88 at 20k, x2.89 at 50k instances), driven by income_stress PERSISTENCE (a 2019 job loss keeps payment_timing emitting LATE/DD_FAILED into 2020, so 2772 instances = 14.7% of the naive denominator are flags that are CORRECT). But the choice is DISCRETE and enumerable (three values, not a continuum), so it CAN face the director as an R13 curriculum call instead of being unmeasurable. DEFECT FOUND, recorded not patched: couple_w2_8_c10.py''s false_positive_rate divides by n_customers - len(truth_set), sweeping the 56 real rationers into the negatives -- the D11 denominator defect is in shipped code today; it moves no number (both 0.0000) and is D14''s to fix with the world change. R12: nothing tuned, every rate is a measurement of code as it stands. Level 0->1: the DISCOVER answers the question; D14/D15 build the answer, one per pair, because the two debts are NOT the same debt. Falsifier confirmed still live: flag-EVERYTHING scores 1.0000 on W2_8''s settled negative.'
  origin_note: 'Minted 2026-08-09 by the D12 build, which took the half that was buildable and REFUSED the half that was not. D12''s own mint had already separated them; building it confirmed the separation from the inside -- the payment cell grid needed no new denominator at all (the never-flaggable set is a per-record property, so partitioning it is arithmetic), while these two have no equivalent settled fact. THE NUMBER THAT MAKES THIS A DISCOVER: D11 ran this experiment by accident and the denominator choice moved the measured wrongful-dunning rate 0.0269 -> 0.2834, a factor of TEN, on a dimension where the negative population was at least anchored to ''did the cash arrive''. Here it would be anchored to a threshold on a continuum. D12 re-confirmed the direction of the risk -- reshaping the payment cells moved a published cell 0.1031 -> 0.0584 with no change in company behaviour. A measure change moves a published figure hard; that is survivable when the new denominator is a FACT and is not when it is a choice made to close an atom. DO NOT open this as a build. Its acceptance is a finding about what is MEASURABLE, up to and including ''not measurable here, and this is why'', kept as permanent registered debt with that reason. Any candidate negative population must be sensitivity-tested across its plausible threshold range BEFORE commitment; if the rate swings the way D11''s did, the threshold IS the measure and faces the director as a curriculum-shaped call (R13), never chosen by the agent that benefits from the atom closing. Remember the standing shape: THREE populations, not two -- must-flag, must-not-flag, and NEITHER; deriving the second as the complement of the first asserts no third exists. THE FALSIFIER ALREADY EXISTS and holds without this DISCOVER finishing: test_every_published_detection_dimension_declares_its_error_directions scores flag-EVERYTHING through each register entry''s own scorer, and both entries point their debt_atom here.'
