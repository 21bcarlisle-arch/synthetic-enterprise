atom_id: H39_the_texture_floor_sits_inside_the_spread_of_its_own_null
simplifications:
- '2026-08-10 LANDED AT 317a7b62f, ADOPTED NOT REBUILT -- and the honest headline is that the RECORD HAD OUTRUN THE CODE ONE COMMIT AFTER A COMMIT WHOSE WHOLE SUBJECT WAS THAT CLASS. The map at HEAD already carried this atom at level_current 2 with measured gain text (''L1.1n reads that generator at exactly 1.0 and fails it 15 of 15'', ''CORRECTED 2026-08-10: the mint''s inferred cause is REFUTED at r=-0.05''), and this store already carried the build_note -- while nothing in the repo could produce those numbers. The build was complete and green in the working tree from a tick that ended before committing. Per ''adopt, don''t rebuild'' it was AUDITED and taken across, not re-implemented: tests/harness/test_premise_two_level.py 174 passed 2 xfailed, tests/harness/test_band_null_sweep.py 34 passed, run BEFORE the commit rather than after it. The immediately preceding commit f0493363b was titled ''the map declared four notes that were never written, and H38 was the second pass to land uncommitted'' -- so this is the THIRD instance in the same family and the second in two commits. Recorded as the recurrence it is rather than filed as a fresh finding: the class is known, and what it wants is a mechanism (a gate that refuses a map level_current whose file_scope has uncommitted changes), not another note.

  FIRST REAL READING, taken the same tick by tools/couple_fabric.py --population 200: L1.1n PASSES on the drawn 200 and the two-level test stays RED on [''L2.4_scale_spread_p90_p10''] alone. Reported as a measurement. It confirms the can-pass test on a population nobody chose for it, and it does NOT say the generator is textured -- the 0.15 floor keeps the MAGNITUDE question and did not move in either direction (R12).'
map_notes:
  origin_note: 'MINTED FROM the second of the two findings in the H36 section of docs/design/BAND_NULL_SWEEP.md (2026-08-10). THE READING: the surviving band clears its null by 0.0334 against a null spread of 0.0763 -- separated by the draw, not by construction. INFERRED (labelled, not observed): the flat-day null preserves each home''s mean diurnal profile, and the statistic then reads that profile''s own roughness, which is a property of the HOME rather than of the generator''s honesty -- so the null''s spread across homes is large and the p95 is set by whichever home has the peakiest mean profile (E13 at 0.1334 against a population median near 0.06). DISPOSITION: REPAIR THE STATISTIC, with the L1.4 -> L1.4n / L2.3 -> L2.3n own-null-ratio pattern named as the CANDIDATE and explicitly NOT as the answer. NEVER a threshold move in either direction: raising the floor until it clears its null is fitting the threshold to the population, which is R12 read backwards. RESTATED 2026-08-10 after H38 landed: the numbers moved to margin 0.0550 against spread 0.0558 (margin-to-spread 0.44 -> 0.99) by taking the water heater out of the load set, but the band is still INSIDE its own null spread and the defect is unchanged in kind -- H38 moved this atom''s numbers, it did not close it.'
  build_note: 'BUILT 2026-08-10, L0 -> L2. WHAT LANDED: fabric_gap_ledger.flatten_to_mean_profile (the flat counterfactual, moved out of band_null_sweep._flatten_home so the measured null and the judged null are ONE function), half_hourly_texture_vs_own_null, band + rate band L1.1n_half_hourly_texture_null_ratio (at_least 1.0 + 1e-9, STRUCTURAL, rate 0.0), and an L1.1n cell in evaluate_two_level read on the same behavioural load set as the floor. THE REPAIR: each home''s texture over the SAME home flattened to its own mean behavioural profile at each day''s own total -- idempotent, so a structureless population reads EXACTLY 1.0 and the decision point needs no external figure. The 1e-9 is FLOAT ERROR and is load-bearing: on the panel''s own flat null 5 of 15 homes land above 1.0 by up to 2.4e-15, so `at_least 1.0` would have passed a third of a smooth-by-construction population. THE FLOOR DID NOT MOVE (R12, both directions): 0.15 is still judged, still every home, and keeps the MAGNITUDE question it has a domain anchor for; L1.1n takes the SIGNIFICANCE question. Two cells, for the reason L1.4/L1.4n are two. THE MINT''S STATED CAUSE WAS REFUTED and the correction is recorded: peak-to-mean explains the null at r = -0.052, and sharpening a profile''s peak from 2.24 to 5.42 peak-to-mean LOWERS the reading 0.0402 -> 0.0163. The driver is the mean profile''s period-to-period roughness. WINDOW EVIDENCE (40/60/90/120 d): the null does not shrink with the window, it wanders (0.1138/0.1124/0.0846/0.0950) and the verdict flips to separated at 90 d and back at 120 while the observed value never moves -- so it is a per-home constant, not a sampling term, and repair-the-window was never available. R15 BOTH WAYS: 10 new tests in tests/harness/test_premise_two_level.py §9b plus the widened one-floor guard, and FOUR mutations each run and each shown firing (tolerance -> 0.0; flattening keeps 1% of the real day; flatten-the-meter-then-net, which is H36''s defect back in through the null; the sweep inlining its own copy of the flattening -- caught by an AST check, since a substring match passed the copy). WHAT THIS DOES NOT DO: the L1.1 row in the sweep is still SAME_ORDER and no honest build could change it -- L1.1n''s threshold IS its null, so sweeping it would ask whether 1.0 >= 1.0 (excluded as STRUCTURAL, the same door L1.4n and L2.3n go through). The MAGNITUDE question stays NEED with its route back named. 266 tests green across the three affected files; docs/observability/band_null_sweep.json regenerated (it was stale at H38''s pre-repair numbers).'
