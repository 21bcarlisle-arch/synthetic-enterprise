atom_id: EP8_adapter_dcc_duis
simplifications:
- "2026-08-15 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, no adapter, no schema, nothing in `file_scope` touched --\nthis atom is epoch-3 BUILD-gated on director-reserved curriculum sequencing (R13), and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` deliberately NOT edited: nothing in the map moves for this\npass (this atom carries no `simplifications_count` key to bump), and another lane holds an\nunstaged hunk in that file at draw time (`git diff --stat`: 2 insertions, 2 deletions -- a\n`simplifications_count` bump and an `expert_hour` status on `W2_11`, NO level move). Output\nis this record plus one queued finding. Everything below is `observed-with-evidence` unless\nlabelled `inferred` (R9).\n\nMEASURED AT: HEAD 0f2fab3c5. Live published artefacts read directly and parsed in full, not\nsampled: `docs/reports/run_output_latest.json` (mtime 2026-08-14 23:37:37, 4,155,614 bytes)\nand `site/data/dashboard.json`. Shipped modules read as they sit on disk; the one RNG replay\nbelow re-executes the shipped expression, nothing monkeypatched, nothing regenerated. This\natom's single cited evidence path was DEAD (the known moved-path class) and is repaired\nabove: the counterparty-API research had moved to `docs/design/refs/`. Six paths added --\nthe ones a reader of this atom actually needs.\n\n==========================================================================================\nFINDING 1 -- THE ORIGIN NOTE'S OWN REMEDY IS NOT AVAILABLE AS WRITTEN. \"One message model\nwith two transports\" cannot be built on the only message model this seam has, because\n29.31% of what that model carries is a value NO transport can return -- and the atom's\npromise that the swap is \"transport-only\" is therefore false of the seam as it stands.\n==========================================================================================\n\nThe origin note prescribes: \"build them as one message model with two transports, or the\nmock has no oracle.\" Read against the tree, the model that exists cannot be that model.\n\n`tools/meter_read_port.py::MeterReadMessage` (field-identical to\n`simulation/meter_reads.py::MeterReadEvent`, by design -- the port's docstring calls itself\n\"a SHAPE change to already-correct data\"):\n\n    customer_id, period_end, meter_type, delay_days, status,\n    estimated_consumption_kwh, true_consumption_kwh,\n    consecutive_estimated_count, forced_catch_up\n\nFour of those nine are SUPPLIER BOOKKEEPING, not counterparty data: `status`\n(\"actual\"|\"estimated\"), `estimated_consumption_kwh`, `consecutive_estimated_count` and\n`forced_catch_up` (the 12-month back-billing cap). A DUIS service-request response returns a\nregister value; an n3rgy pull returns a midnight index read plus a half-hourly usage file\n(advisor research, verified 2026-08-05). NEITHER COUNTERPARTY CAN RETURN \"ESTIMATED\" -- an\nestimate is what a supplier does when a counterparty returns nothing.\n\nHOW MUCH OF THE SEAM THAT IS, on the live artefact: 469 of 1,600 messages (29.31%) carry\n`status: \"estimated\"`, every one of them with a non-null `estimated_consumption_kwh`. Split\nby meter type: 326 traditional, 143 smart.\n\nAND THE ESTIMATE IS COMPUTED WORLD-SIDE. `simulation/meter_reads.py::simulate_read` builds\nit as `statistics.mean(trailing_actuals_kwh[-3:])` (`ESTIMATE_TRAILING_WINDOW = 3`) and\nreturns it inside the event. The company does not compute it: `company/billing/\nmonthly_bill_assembly.py:406` threads its own trailing actuals INTO the world call and line\n484 reads `event.estimated_consumption_kwh` straight back out. \"Average of your last N\nperiods\" is the supplier's own commercial technique -- a real supplier is free to change it\nwithout telling anyone -- and it currently lives in world code.\n\nTHE CONSEQUENCE FOR THIS ATOM, stated plainly because it inverts the atom's own promise: at\naccession a real DUIS adapter has NO estimate to return, so the estimation must move\ncompany-side. That is a computation relocating across the wall -- not a transport swap. The\n`name:` field's \"the eventual swap is transport-only\" is not achievable from here, and would\nbecome achievable only if the message model were re-cut FIRST.\n\nRECOMMENDATION, acted on by recording it rather than asking (NEVER_ASK_WITHOUT_RECOMMENDING):\nEP8's first BUILD task is the CUT, not the adapter -- separate (a) what the transport\nreturns (a register/index read, or an error) from (b) what the supplier's billing engine\nconcludes (actual vs estimated, the estimate itself, the consecutive-run and back-billing\nstate). The origin note's \"one message model\" instinct is right; the model it must be one of\nis the COUNTERPARTY'S, and today's is the supplier's.\n\n==========================================================================================\nFINDING 2 -- BLOCKING, QUEUED NOT FIXED. The seam is computed TWICE per run, the two halves\nwere believed to agree by seed, and 3 published rows disagree today -- 100% of the times\nthe divergent mechanism fired. The control named for their agreement measures cardinality.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_MATCHING_BILLS_CONTROL_MEASURES_CARDINALITY_AND_\nTHREE_PUBLISHED_ROWS_DISAGREE_2026-08-15.md` (BLOCKING, lane D_billing_metering -- the lane\nof the untrustworthy instrument and the wrong published record, not this atom's W4 lane).\nSummary of the measurement, recorded here because it is EP8 that inherits its consequence:\n\n    site 1  simulation/run_phase4c_on_phase2b.py:236 -> generate_meter_read_log\n            -> the published `meter_read_log` (1,600 rows)\n    site 2  company/billing/monthly_bill_assembly.py:406 -> SimulatedReadFeed.read_for\n            -> the bills customers are charged on (1,600 rows)\n\n`monthly_bill_assembly.py:381-388` states the premise itself: \"computed here a second time\non purpose ... the identical seed means the two always agree.\" The seed is\n`random.Random(f\"meterread_{customer_id}_{period_end}\")`.\n\nIt is already false. Site 2 carries an override site 1 does not\n(`monthly_bill_assembly.py:412-424`): a churned account's final bill is forced onto\n`final_read_for(...)`, status \"actual\", under SLC 21B. Joined on `(customer_id, period_end)`\nover the live artefact -- 1,600 keys, all distinct, zero unmatched on either side:\n\n    billing_basis   log status    rows\n    actual          actual       1,131\n    estimated       estimated      466\n    actual          estimated        3      <- the divergence\n\n    C5 2020-12-29   est 1,961.88 kWh   billed 2,015.82   -GBP 788.97   consec_est 11\n    C6 2024-03-29   est 2,342.48 kWh   billed 2,346.81   +GBP 1,484.80  consec_est  4\n    C3 2020-06-29   est   202.82 kWh   billed   191.21   +GBP 37.44     consec_est  9\n\nAll three are a churned account's final bill. The run has 5 churned billing accounts; the\nother 2 already resolved \"actual\" and needed no override. So the rate is not 3-in-1,600 --\nit is 3 OF 3, every override that fired, and it scales with churn.\n\n`site/data/dashboard.json` publishes this stream at `customers.meter_read_log` (1,600\nentries), so the diverging copy is in published data. No site template renders it (grep of\n`site/**` `.js/.html/.jsx/.ts` for `meter_read_log`: nothing), so it is published-but-\nunrendered, which is why this went unseen.\n\nWHY NOTHING FIRED. `tests/simulation/test_run_phase4c_on_phase2b.py:180` is named\n`test_main_produces_meter_read_log_matching_bills` and asserts, in full: equal LENGTH, that\n`status` is within {\"actual\",\"estimated\"}, and `delay_days >= 0`. Cardinality and value\ndomains. Nothing joins the two streams; nothing compares `billing_basis` to `status`. The\nname asserts a per-row agreement, the subject is a count of one side -- so any divergence of\nequal length passes, which is every divergence this mechanism can produce.\n\nWHY BLOCKING, both legs stated separately so neither carries the verdict alone: an\ninstrument in this area cannot fail on the defect its own name describes; and three rows of\na published 1,600-row artefact assert a read status the published bill for the same\ncustomer-period contradicts.\n\nTHE CONSEQUENCE FOR THIS ATOM, which is why it is recorded here and not only in billing: a\nreal DUIS or n3rgy transport answers a request ONCE. There is no seed to recompute from. The\nmoment either call site is served by a real adapter the other has nothing to re-derive the\nsame answer with, and the 3-row divergence becomes unbounded. THE DUAL COMPUTATION MUST\nCOLLAPSE TO ONE BEFORE THIS ATOM'S DELIVERABLE IS EVEN COHERENT -- that is a prerequisite,\nand it belongs in EP8's exit criteria rather than being discovered by the first adapter.\n\n==========================================================================================\nFINDING 3 -- GRANULARITY AND UNIT. The seam is one message per customer per BILLING PERIOD;\nboth named counterparties are per METER per DAY, and one returns an INDEX rather than a\nconsumption. The failure surface EP9's record calls \"the valuable part\" has nowhere to live.\n==========================================================================================\n\nLive: 1,600 messages over 19 customers and 119 distinct `period_end` values, spanning\n2016-01-31 to 2025-06-07 (3,416 days). The n3rgy contract the advisor verified is ONCE DAILY\nPER METER, which over the same customers and the same span is 64,904 pulls -- 40.6x the\nmessages this seam carries. That is not a volume quibble; it is where the physics lives:\n\n- \"MISSING DAYS STAY MISSING UNLESS RE-REQUESTED\" -- named in EP9's own record as the\n  fidelity gold and \"the part most likely to be smoothed away\" -- IS NOT REPRESENTABLE. A\n  monthly message has no day to be missing. The only latency carrier on the seam is\n  `delay_days`, one scalar per customer-period (live range 0..68).\n- A DUIS billing-register read returns a cumulative REGISTER INDEX at an instant; this\n  message carries a PERIOD CONSUMPTION. Consumption has to be derived from index deltas,\n  and the whole class of defects that lives in that derivation -- register rollover,\n  meter exchange, index regression, a read pair straddling a tariff change -- is not\n  merely unimplemented here, it is unrepresentable in the current field set.\n\nSo the atom's honest granularity target is per-meter-per-day index reads, and the billing\nperiod becomes a thing the SUPPLIER derives. That is the same cut finding 1 arrives at from\nthe other direction, which is worth noting: two independent routes reach the same\nprerequisite.\n\n==========================================================================================\nFINDING 4 -- THE COMMS FAILURE IS MODELLED AS A CHANGE OF METER TYPE, NOT AS A RESPONSE.\nDUIS's entire failure surface is response codes, and there is no field anywhere on this\nseam to put one in. 129 live smart-meter comms failures are invisible in the artefact.\n==========================================================================================\n\n`simulation/meter_reads.py`: `communicating = meter_type == \"smart\" and rng.random() >=\nSMART_METER_NOT_COMMUNICATING_RATE` (0.10, anchored to DESNZ Q4 2024). When that is False,\nthe smart meter is then sampled with `TRADITIONAL_DELAY_MEAN_DAYS` (9.0) and\n`TRADITIONAL_ACTUAL_READ_PROBABILITY` (1/6 per month) -- it BECOMES the traditional path.\n\nReplayed the live log's own seeds (the shipped expression, same seed string, deterministic,\nnothing patched): 129 of 1,227 smart entries were non-communicating -- 10.51%, matching the\n0.10 anchor -- and 118 of those 129 resolved as `estimated`.\n\nTHE PUBLISHED MESSAGE STILL SAYS `meter_type: \"smart\"` FOR ALL 129. The comms failure leaves\nno trace in the artefact at all; it is recoverable only by re-running the SIM's RNG, which\nis a simulation internal the company may not read. So no company-side control could ever\ncount DCC comms failures, and the company cannot be wrong about them -- there is nothing to\nbe wrong about. (Same tautology shape as the filed `the world's churn ceiling was the\ncompany's belief` class, arrived at from the opposite direction: here the world does not\neven publish the quantity.)\n\nThere is no error channel: grep for error/response-code/reason-code across\n`simulation/meter_reads.py` and `tools/meter_read_port.py` returns zero hits on the data\npath. A DUIS adapter's response codes are precisely the thing this mock exists to be shaped\nlike, and an adapter returning a DUIS error would have to encode it as \"this smart meter is\nnow behaving like a traditional one\" -- which is not what happens to a real one. The real\nbehaviour is: the meter stays smart, the service request fails, and the supplier retries.\n\n==========================================================================================\nFINDING 5 -- FRAME. Three things the opening draw will find already in place, and one\ntarget mismatch that should be settled before any adapter is written.\n==========================================================================================\n\n(a) THE COMPANY-SIDE CONSUMER ALREADY EXISTS AND IS WIRED. `company/billing/\nsmart_meter_reconciliation.py`'s own docstring says its inputs are \"estimated AQ from own\nbilling records, actual reads from DCC/smart meter API\" -- i.e. it is written against the\nadapter this atom would build. Non-test importers: 1 (`company/billing/\nmonthly_bill_assembly.py`), verified this pass. Worth stating because the usual class here\nis the opposite (`a class's remedy may already exist, UNWIRED`): this one is live. EP8's\nbuild is adapter -> existing wired consumer, not greenfield, and the risk is changing the\nshape under a live consumer rather than lacking one.\n\n(b) THE SEAM CARRIES NO COUNTERPARTY IDENTIFIER. Grep of `simulation/meter_reads.py`,\n`tools/meter_read_port.py` and `company/billing/**` on the read path for\nmpan/mprn/device_id/MAC/CIN: nothing on this seam (the one `export_mpan` hit is\n`company/billing/fit_legacy_register.py`, a different flow). The key is `customer_id`. Both\nnamed counterparties address by MPAN/MPRN (advisor research, verified 2026-08-05), so the\nmock cannot even be ADDRESSED the way the real one is, and the supply book\n(`company/interfaces/supply_book.py`) -- which does think in registered meter points -- is\nnot the thing this seam is keyed on.\n\n(c) TARGET MISMATCH, recorded not resolved. `tools/meter_read_port.py::MeterReadPort`'s own\ndocstring names the go-live swap as \"a DTC/Elexon D0010 feed adapter\". D0010 is a settlement\nDATA FLOW of register readings pushed over the DTN; EP8's target is DUIS SERVICE REQUESTS to\na device. Both are real, and they are neither the same counterparty nor the same shape (push\nvs request/response; settlement flow vs device service). The one port on this seam therefore\npoints at a different swap from the one this atom promises. Which is EP8's target is a BUILD\ndecision and is NOT taken here -- recorded so the opening draw does not assume the port is\nthis atom's ancestor and inherit the wrong shape. (Note EP6's own DISCOVER already found\nthis port family is same-step with no correlation id, i.e. Family B, so it is not the\nprotocol ancestor either.)\n\n(d) THE ORACLE. The origin note's whole defence against the fail-open mock is that sibling\nEP9 \"CAN be exercised for real\". Against the source: n3rgy auth is by IHD MAC/CIN and\nregistration by MPAN/MPRN -- a physical in-home display's credentials for a real household's\nconsented data. So the oracle is not a repo-local capability; it needs a real premise and a\nreal person's consent, which sits adjacent to reserved class 2 (`inferred` -- not decided\nhere, and no such access is proposed by this pass). RECOMMENDATION, recorded: EP8's schema\noracle should be the PUBLISHED DUIS MESSAGE SPECIFICATION, not a live sibling call, so the\nexit criterion the origin note asks for (schema-shaped, \"a DUIS message the real interface\nwould accept\") stays exercisable inside this repo and in an offline lane. The sibling's\nvalue to EP8 is its CADENCE AND FAILURE CONTRACT (finding 3), which is documentary and\nalready captured; its live transport is not the oracle it was hoped to be.\n\n------------------------------------------------------------------------------------------\nWHAT THIS PASS DID NOT DO, so the next draw is not misled: no adapter, no message re-cut, no\nDUIS schema fetched or transcribed (this lane has no network, and no DUIS specification text\nexists in the repo -- checked); the gas/MPRN side untouched; `EP9_adapter_n3rgy_consented_\nmetering`'s own record NOT amended (its dead evidence path is the same one and remains\nunrepaired -- a one-line repair belonging to that atom's own draw); the D0010-vs-DUIS target\nquestion (5c) left open; and whether any downstream consumer of `meter_read_log`\n(`company/compliance/population_sanity.py`, `saas/reporting/annual_report.py`,\n`saas/reporting/css_statement.py`) produces a wrong figure from finding 2's 3 rows NOT\nmeasured. Finding 2 was QUEUED, not fixed -- SELF_INTERRUPT_DISCIPLINE queues a worker's own\nfindings by default, and repairing it is a BUILD change to a live billing path, which a\nLANE 3 doc-only draw does not carry.\n"
- "2026-08-17 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code, no adapter, no schema written into the tree, nothing under\ncompany/sim/simulation/saas/tools/background touched -- this atom is epoch-3 BUILD-gated on\ndirector-reserved curriculum sequencing (R13), and EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 1\nmakes DISCOVER/FRAME available while BUILD is not. `docs/design/maturity_map.yaml` is touched\nfor EXACTLY ONE bookkeeping line and no other: `simplifications_count: 1 -> 2` on this atom.\nNOT a level move, not a stage move, not a block-reason edit. The store append and that count\nare ONE ATOMIC WRITE (`tests/design/test_simplifications_store.py::test_counts_match_file_\ncontents` reds otherwise). Checked before editing: the map carried NO staged and NO unstaged\nhunk from any other lane at draw time, so this commit strands no half of anyone else's write.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD a8d6f14c6. Live artefact `docs/reports/run_output_latest.json` (mtime\n2026-08-17 19:56, 4,154,361 bytes) parsed in FULL, not sampled; shipped modules read as they\nsit on disk. EXTERNAL SOURCES FETCHED THIS PASS (the previous pass could not -- see below):\n\n  S1  DUIS v5.3, 18 Mar 2025 = SEC Appendix AD, 543pp\n      https://www.smartdcc.co.uk/media/d5kh4khf/dcc-user-interface-specification-v53-18-mar-2025.pdf\n      Fetched, extracted with `pdftotext -layout` (28,245 lines), read at clause level.\n  S2  DUIS XML Schema v5.1 (schema version 5.01), published as a .docx\n      https://www.smartdcc.co.uk/media/6490/duis-xml-schema-v51.docx\n      Fetched; the FULL XSD TEXT is inside it. Extracted and parsed (see FINDING 4).\n  S3  Smart DCC testing services page (SREPT / UEPT / EUCT / DUST named)\n      https://www.smartdcc.co.uk/our-smart-network/network-products-services/testing-services/\n  S4  SEC security-assessment process (User CIO = Competent Independent Organisation)\n      https://smartenergycodecompany.co.uk/assessment-process/  (via search summary; the SEC\n      site returns 403 to direct fetch from this lane -- `inferred` where marked)\n  S5  Smart DCC \"DCC Boxed\"\n      https://www.smartdcc.co.uk/our-smart-network/network-products-services/dcc-boxed/\n  S6  SmartDCCInnovation GPLv3 tooling: github.com/SmartDCCInnovation/duis-parser and\n      /dccboxed-signing-tool\n\n==========================================================================================\nPASS 0 -- WHAT THE 2026-08-15 PASS OWED, AND WHAT SURVIVED THE RECHECK AT THIS HEAD.\n==========================================================================================\n\nThat pass closed with: \"no DUIS schema fetched or transcribed (this lane has no network, and\nno DUIS specification text exists in the repo -- checked)\". THE LANE HAS NETWORK. That was\nthe single largest hole in this atom's record and it is now paid: everything in FINDING 1-4\nbelow is read off the published specification, not off memory. `observed-with-evidence`.\n\nRe-verified the four standing findings against HEAD rather than restating them:\n\n  F1 (message model is the SUPPLIER'S, not a counterparty's)   STANDS. `tools/meter_read_\n     port.py::MeterReadMessage` is unchanged: `status`, `estimated_consumption_kwh`,\n     `consecutive_estimated_count`, `forced_catch_up` are still on the wire. Re-measured on\n     today's artefact: 466 of 1,600 rows (29.12%) carry `status: \"estimated\"` (was 29.31%).\n  F2 (the seam computed twice; 3 published rows disagreed)     DISCHARGED, not by me. The\n     repair landed at `60fc315da` (`docs/staging/done/WORKER_REPORT_THE_READ_SEAM_IS_ONE_\n     STREAM_AND_ITS_CONTROL_NOW_JOINS_2026-08-15.md`, D3 note 8). Verified at HEAD:\n     `meter_read_log_from_events` present in `simulation/meter_reads.py` (2 hits),\n     `generate_meter_read_log` GONE from `simulation/run_phase4c_on_phase2b.py` (0 hits),\n     and today's status split is 1,134 actual / 466 estimated -- the 3 divergent rows are\n     gone. THE PREREQUISITE THAT PASS NAMED FOR THIS ATOM IS THEREFORE MET.\n  F3 (granularity: per-customer-per-billing-period, not per-meter-per-day) STANDS, and\n     FINDING 1 below makes it sharper than the prior pass could: DUIS has three DIFFERENT\n     SRV families for what this atom's brief calls \"read billing registers\".\n  F4 (no error channel; comms failure modelled as a change of meter type) STANDS and is now\n     quantified against the real spec: grep for response/error/reason code across\n     `simulation/meter_reads.py` and `tools/meter_read_port.py` -> ZERO hits, against a\n     published DUIS ResponseCode enumeration of 189 values (counted, FINDING 1).\n  F5b (the seam carries no counterparty identifier) STANDS -- re-grepped, still `customer_id`;\n     the real addressing is EUI-64 Device IDs (FINDING 1).\n\n==========================================================================================\nFINDING 1 -- THE REAL DUIS SHAPE, READ OFF THE SPECIFICATION. Three structural facts the\natom's own brief does not contain, each of which changes what \"mocked AS the real format\"\ncan mean.\n==========================================================================================\n\n(a) THE MESSAGE. `observed-with-evidence` (S1 clause 3.4.1 + S2 XSD).\n\n    Request  = Header + Body + ds:Signature      (a mandated 3-part sequence)\n    Header   = RequestID, [FirstInSequence], [PrecedingServiceRequestID],\n               CommandVariant, ServiceReference, ServiceReferenceVariant\n    RequestID = BusinessOriginatorID \":\" BusinessTargetID \":\" OriginatorCounter,\n               where the two IDs are EUI-64 values and the counter is 0..2^64-1\n    Response = Header + Body + [ds:Signature]\n    Header   = [RequestID], [ResponseID], ResponseCode, ResponseDateTime\n    Body     = choice of ResponseMessage | DeviceAlertMessage | DCCAlertMessage |\n               SMETS1ResponseMessage\n\n    Counted directly off the parsed XSD (v5.01), so these are falsifiable numbers, not\n    impressions: ServiceReference 95 enumerated values, ServiceReferenceVariant 129,\n    CommandVariant 9, ResponseCode 189, and the Request Body is an `xs:choice` of 130\n    elements -- one per service request type.\n\n    AND THE ONE THAT MATTERS MOST TO THE SIBLING ATOM: `schemaVersion` is an\n    `xs:attribute ... use=\"required\"` on BOTH `Request` and `Response`. The real\n    counterparty makes it structurally impossible to omit the version from the wire. That is\n    the exact defect EP6's 2026-08-13 finding 2 registered against channel D\n    (`to_log_entry(include_schema_version=False)` defaults it OFF; today's artefact has zero\n    `schema_version` keys on 1,600 rows -- re-verified this pass). The published contract of\n    the counterparty this atom mocks REFUTES the local default. That is not a new defect --\n    it is external evidence for an already-queued one.\n\n(b) THE TRIAD IS NOT A PAIR, AND THE USER IS A SERVER. `observed-with-evidence` (S1 §2.4).\n    DCC exposes THREE web services (HTTP POST of XML): Transform (synchronous), Non-Device\n    (synchronous), Send Command (ASYNCHRONOUS). The User must itself operate a **Receive\n    Response Service** -- its own inbound HTTP endpoint -- to receive Service Responses,\n    Device Alerts and DCC Alerts, and must synchronously acknowledge each one. So the\n    exchange for a non-critical read is:\n\n      1. User POSTs the Service Request to Send Command Service -> synchronous ACKNOWLEDGEMENT\n      2. ... arbitrary later ... DCC POSTs the Service Response to the USER'S endpoint\n      3. independently and unsolicited: Device Alerts / DCC Alerts arrive at the same endpoint\n         (RequestID is N/A on these -- ResponseID only)\n\n    S1 §2.4 states in terms: \"Due to possible retries, the User may receive DUPLICATE Service\n    Responses, Device Alerts and DCC Alerts from the DCC.\" At-least-once delivery is the\n    published contract, not an inference. C-S2 is therefore not a design nicety here; it is\n    the counterparty's stated behaviour.\n\n(c) THE PAYLOAD IS OPAQUE AT THE DUIS LAYER. `observed-with-evidence` (S2 XSD, complexType\n    `ResponseMessage`). ResponseMessage = ServiceReference + ServiceReferenceVariant + a\n    choice that includes `<xs:element name=\"GBCSPayload\" type=\"xs:base64Binary\"/>`. The\n    register value a supplier bills on is INSIDE that base64 blob. DUIS does not define it;\n    GBCS does, and the mapping from the blob to a readable output format is the Message\n    Mapping Catalogue (SEC Appendix AF), which the DUIS schema imports as a separate\n    namespace `http://www.dccinterface.co.uk/ResponseAndAlert` with\n    `schemaLocation=\"MMC Schema V5.x.xsd\"` -- a file NOT contained in S2.\n\n    CONSEQUENCE, stated because it is this atom's fidelity ceiling: a mock can be EXACTLY\n    right at the DUIS layer and still have invented, wholesale, every number the company\n    actually bills on. \"Mocked AS the real DUIS request/response message formats\" buys the\n    envelope, the addressing, the response codes and the asynchrony. It does not buy the\n    reading. Getting the reading right is an MMC-shaped problem, and it is a SECOND\n    specification.\n\n(d) \"READ BILLING REGISTERS\" IS NOT ONE REQUEST -- IT IS AT LEAST THREE FAMILIES.\n    `observed-with-evidence` (S1 clause 3.1 matrix + 3.8.17/3.8.23-26; each SRV value\n    confirmed present in the S2 enumeration):\n\n      SRV 4.1.1  ReadInstantaneousImportRegisters -- a register value NOW\n      SRV 4.4.2  RetrieveCoMOrTariffTriggeredBillingDataLog\n      SRV 4.4.3  RetrieveBillingCalendarTriggeredBillingDataLog   <- the billing-cycle one\n      SRV 4.4.4  RetrieveBillingDataLog(PaymentBasedDebtPayments)\n      SRV 4.4.5  RetrieveBillingDataLog(PrepaymentCredits)\n      SRV 4.6.1  RetrieveImportDailyReadLog       -- the daily index reads\n      SRV 4.8.1  ReadActiveImportProfileData      -- the half-hourly profile\n\n    The atom brief's parenthetical \"(e.g. read billing registers)\" therefore names a CHOICE\n    the BUILD has to make, not a request it can implement. Full detail for the simplest one,\n    since it is the natural first mock: SRV 4.1.1, Service Reference 4.1, Security\n    Classification **Non Critical**, On Demand yes, future-datable at DSP, eligible User\n    Roles IS/GS/ED/GT (+MDR for SMETS1 only), target Device Types ESME/GSME/GPF, Command\n    Variants 1/2/3, GBCS MessageCode 0x0027 (electricity) / 0x0074 (gas), GBCS Use Case\n    ECS17b / GCS13a.\n\n    NON-CRITICAL IS THE LUCKY PART AND SHOULD BE SAID OUT LOUD. A Critical Service Request\n    must first go to the Transform Service, which returns a **Pre-Command** that the User\n    signs and returns as a **Signed Pre-Command** -- a four-leg dance with a device-directed\n    signature in the middle. Register reads skip all of it. This atom's own worked example is\n    the cheapest request in the whole specification, which is an argument FOR it as the first\n    mock and an argument AGAINST generalising from it.\n\n==========================================================================================\nFINDING 2 -- THE ACCESS-CLASS REALITY CHECK. The atom's own access sentence names three\ngates; ONE of the three is not a gate, and the register that carries it already flagged it\n`~` (unverified) and asked for exactly this check.\n==========================================================================================\n\n`docs/design/EP19_COUNTERPARTY_QUALIFICATION_REGISTER.md` row B1 states the chain \"SEC\naccession -> SMKI -> CIO/UIT\" with a `~` marker, and its own §\"two consequences\" says B1 \"is\nthe one most likely to set the go-live date -- **if** the ~ marker on it survives\nverification\". It does not survive intact. What the sources say:\n\n  SEC ACCESSION -- REAL AND FIRST. `observed-with-evidence` (S3, S5). You must be a SEC Party\n  before anything else, including before you may buy the test kit (S5: \"As a SEC party you\n  are eligible to purchase DCC Boxed\").\n\n  SMKI -- REAL, AND IT IS NOT MERELY A GATE, IT IS A MANDATORY MESSAGE FIELD.\n  `observed-with-evidence` (S1 clause 3.4.1.4, Table 25): every Service Request must carry a\n  `ds:Signature` computed with \"the Private Key associated with the User Role under which the\n  Service Request is being requested\", from the User's SMKI Organisational Certificate.\n  Qualification route: **SMKI and Repository Entry Process Tests (SREPT)**, 60 days notice,\n  after which a SMKI Certificate is issued for live use (S3).\n\n  UEPT -- REAL, MANDATORY, AND MISSING FROM THE ATOM'S SENTENCE. `observed-with-evidence`\n  (S3): **User Entry Process Tests** confirm the party can execute the required Service\n  Requests over the User Gateway in a dedicated test environment. 60 days notice.\n\n  \"CIO/UIT TESTING\" -- NEITHER HALF IS A TEST STAGE. `observed-with-evidence` for the first,\n  `inferred` for the second. **CIO = Competent Independent Organisation** (the \"User CIO\",\n  currently Deloitte), appointed by the SEC Panel to run the **User Security Assessment**\n  (SEC §H1.10, against §G3-G6) and the **Full User Privacy Assessment**, approved by the\n  Security Sub-Committee -- an ASSESSOR OF THE ORGANISATION, on a three-year cycle, not an\n  interface test (S4). \"UIT\" appears in DCC's own material as the name of an ENVIRONMENT\n  (\"the UIT Environment\") rather than a named test stage; DCC's testing-services page lists\n  SREPT, UEPT, EUCT, Pre-UEPT, DUST, MDUST, SRT, PPCT and Remote Test Lab, and does not list\n  a stage called UIT (`inferred` from the page's list being complete for that purpose).\n\n  SO THE CORRECTED CHAIN IS FOUR THINGS, NOT THREE, AND ONE OF THEM IS AN ORGANISATIONAL\n  AUDIT RATHER THAN AN INTEGRATION TEST:\n      SEC accession -> SREPT (+ SMKI certificate issue) -> UEPT -> User Security Assessment\n      + Full User Privacy Assessment by the User CIO, approved by the SSC -> live access.\n\n  NOT REPAIRED HERE. That correction belongs to `EP19_counterparty_qualification_paths`'s own\n  record and to its register document; editing another atom's deliverable from this draw is\n  the scope creep the prior pass declined for EP9's dead path, and I decline it for the same\n  reason. RECOMMENDATION, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): EP19's next\n  draw replaces B1's `~` with the four-step chain above and the `✓` it has now earned.\n\nWHAT IS NOT OBTAINABLE WITHOUT ACCESSION -- the mock's fidelity ceiling, stated:\n  * A valid `ds:Signature`. No SMKI Organisation Certificate, no signature; a mock request is\n    structurally complete and cryptographically void. The go-live swap therefore adds a\n    SIGNING step and a certificate store -- it is NOT transport-only in the strict sense.\n  * Any real Device ID. Addressing is EUI-64 Device IDs against real installed meters.\n  * Any real GBCS payload. The blob is constructed by/for a real device under keys the\n    company will never hold pre-accession.\n  * Live DCC behaviour: real Target Response Times (defined in SEC Appendix E, not DUIS --\n    S1 §3.7 defines only the measurement points), real Anomaly Detection thresholds, real\n    retry timing, real Alert incidence.\n  * DCC BOXED IS A SANDBOX, BUT IT IS NOT A PUBLIC ONE. `observed-with-evidence` (S5): it\n    emulates the network and DCC sells it -- to SEC Parties. Pricing is disclosed to DCC\n    Users only (`inferred` from the page). So the atom brief's \"no public sandbox\" holds in\n    effect, and the reason is worth stating precisely: acquiring one is gated on SEC Party\n    status AND is a purchase, i.e. reserved class 1 (real money) as well as class 2.\n  * WHAT *IS* FREELY AVAILABLE, and is the honest substitute: the specification itself (S1),\n    the schema (S2), and Smart DCC's own GPLv3 client tooling (S6 -- `duis-parser`,\n    `dccboxed-signing-tool`). Note `duis-parser`'s README states \"XML schema validation and\n    digital signatures are out of scope of this tool\", so it is a SHAPE reference, not an\n    oracle.\n\n==========================================================================================\nFINDING 3 -- SIMPLICITY GUARD READING. Do NOT build a new envelope. The existing wall\nenvelope already models three of DUIS's four hard properties; the gap is ONE shape, and it\nis a small one.\n==========================================================================================\n\nRead `interface/contracts/wall_envelope.py` against DUIS clause by clause this pass. The fit\nis much better than \"reuse it because reuse is good\" -- it is close enough to be checked:\n\n  DUIS reality                                      wall_envelope today\n  ------------------------------------------------  ---------------------------------------\n  RequestID (originator:target:counter) links the    `correlation_id`, documented as BOTH\n  async Response to its Request                      idempotency key and the ONLY link  MATCH\n  retries produce DUPLICATE responses (§2.4)         C-S2 idempotency is the stated\n                                                     purpose of correlation_id          MATCH\n  request and response are separate events           WallResponse is a separate event    MATCH\n  ResponseCode carries the failure (189 values)      `WallStatus.ERROR` + `ErrorDetail\n                                                     (code, message)`                   MATCH\n  synchronous ACKNOWLEDGEMENT precedes the answer    `WallStatus.NOT_KNOWABLE_YET` -- an\n                                                     accepted request whose answer is not\n                                                     yet knowable. FITS, UNUSED.\n  schemaVersion REQUIRED on the wire                 `schema_version: int`, REQUIRED, no\n                                                     default                            MATCH\n  DEVICE ALERTS / DCC ALERTS are UNSOLICITED --      NO SHAPE. `WallResponse` requires a\n  RequestID is N/A, ResponseID only                  `correlation_id`, i.e. a request that\n                                                     was never made.                     GAP\n\nRECOMMENDATION, recorded not asked: **EP8 rides the existing envelope. It does not get its\nown.** Concretely -- (i) a DUIS Service Request becomes `WallRequest[DuisServiceRequest]`\nwith `correlation_id` = the DUIS RequestID string, verbatim, in its real\n`originator:target:counter` form so the eventual swap does not have to re-key anything;\n(ii) the Acknowledgement is `WallResponse(status=NOT_KNOWABLE_YET)` -- this is the piece of\nthe design that already existed and has never been used for the thing it was built for, and\nDUIS is its first real justification; (iii) the Service Response is a LATER\n`WallResponse(status=OK, payload=...)` on the same correlation_id, which is precisely the\n`respond_over_wall` pattern already proven on the conversation seam; (iv) the ONE genuine\naddition the envelope needs is an UNSOLICITED-INBOUND shape for Device/DCC Alerts. That is\none dataclass, not a protocol layer, and it is demanded by a real published behaviour rather\nthan by a future adapter -- which is exactly the line the SIMPLICITY GUARD draws.\n\nAND THE GUARD CUTS THE OTHER WAY TOO, so it is not just permission to build: do NOT model the\nGBCS byte layer, do NOT build a certificate/signing abstraction for a signature that cannot be\nvalid, and do NOT implement all 130 request types. Model ONE SRV end to end (4.1.1), plus the\nAlert path, and mark the base64 GBCS blob as an explicit unmodelled placeholder rather than\ninventing bytes. A mock that lies about GBCS is worse than one that declares the hole.\n\n==========================================================================================\nFINDING 4 -- THE FALSIFIABLE TEST OF \"MOCKED AS THE REAL FORMAT\", AND WHETHER THE ARTEFACT\nFOR IT EXISTS. It does. I obtained it this pass and parsed it. There are three caveats and\nthey are all statable.\n==========================================================================================\n\nTHE CHECK, stated so it can fail: every mock DUIS payload the adapter emits or consumes is\nvalidated against the published DUIS XSD; the test reds if any mock message fails validation,\nand the MUTATION PROOF is an injected message with a `ServiceReferenceVariant` outside the\nenumeration (or a Header field out of the mandated order), which must red the suite. This is\nfalsifiable in the R15 sense because the checked value (the mock) and the checker (the\npublished schema) have INDEPENDENT sources -- no tautology, unlike a mock checked against a\nlocally-written schema derived from the same mock.\n\nIS THE ARTEFACT OBTAINABLE TODAY? **YES.** `observed-with-evidence`, done, not assumed:\n  1. S2 (`duis-xml-schema-v51.docx`, 97.6 KB, free, no key) CONTAINS THE FULL XSD AS TEXT.\n  2. It is a TRACKED-CHANGES REDLINE -- 84 `w:ins` and 7 `w:del`/`w:delText` runs, counted.\n     A naive text extract merges deleted with inserted tokens and yields corrupt strings\n     (\"FebruarySeptember 2021\", \"5.0a71.6\"). Strip the `w:del` runs first.\n  3. Doing that yields 237,166 bytes of schema which **parses as well-formed XML**\n     (`xml.etree.ElementTree.fromstring` -> no error), `targetNamespace=\n     \"http://www.dccinterface.co.uk/ServiceUserGateway\"`, top-level elements `Request` and\n     `Response`. Every number quoted in FINDING 1 was counted off this parse.\n\nTHREE CAVEATS, each of which the BUILD must handle rather than discover:\n  (a) VERSION SKEW. The obtainable schema is v5.1 / schema version 5.01. The specification I\n      read is v5.3 (18 Mar 2025) and SEC lists an Appendix AD v5.4 dated 6 Nov 2025\n      (`inferred` -- from a search result listing, not fetched). Annex A of the v5.3 PDF says\n      the schema \"is enclosed in the embedded document below\" -- and `pdfdetach -list` on the\n      freely-downloaded v5.3 PDF reports **0 embedded files** (`observed-with-evidence`). So\n      the CURRENT schema is not in the public PDF; the version I have is one to three\n      revisions behind. Validating a mock against v5.01 is still a real, failing-capable\n      control; it is just dated, and the date must be stamped on the fixture.\n  (b) UNRESOLVED IMPORTS. The schema `xs:import`s two others: `xmldsig-core-schema.xsd` (W3C,\n      freely available) and the MMC schema (SEC Appendix AF, namespace\n      `.../ResponseAndAlert`). Full compilation needs both resolved. Until the MMC schema is\n      obtained, the honest scope of the control is: validate the DUIS-layer envelope, and\n      declare the payload layer unvalidated.\n  (c) NO VALIDATOR IS INSTALLED. `xmllint` is absent from this machine and `lxml` does not\n      import (`observed-with-evidence`, both checked). Python's stdlib `ElementTree` parses\n      XML but does not do XSD validation. So the BUILD adds a dependency. That is a small,\n      knowable cost -- and it is worth naming now, because \"we'll validate against the XSD\"\n      quietly assumes a validator that this repo does not currently have.\n\nDELIBERATELY NOT DONE: the extracted XSD was NOT written into the repo. It is a third-party\ndocument under DCC/SEC terms this pass has not read, and adding a 237 KB vendored schema is a\nBUILD act on a BUILD-gated atom. The extraction is 12 lines and is described above precisely\nenough to reproduce; that is the deliverable a DISCOVER pass owes.\n\n==========================================================================================\nSIX OPEN QUESTIONS THE BUILD MUST ANSWER, each with what would resolve it.\n==========================================================================================\n\nQ1. WHICH SRV IS THE ADAPTER'S SUBJECT? 4.1.1 (instantaneous register), 4.4.3 (billing-\n    calendar-triggered billing data log) or 4.6.1 (daily read log)? The seam bills MONTHLY\n    from a period consumption; 4.1.1 returns a cumulative index at an instant, so consumption\n    becomes a supplier-derived DELTA and register rollover / meter exchange / index\n    regression become representable defects for the first time. RESOLVED BY: deciding whether\n    EP8's fidelity claim is about the REQUEST (then 4.1.1, cheapest, non-critical) or about\n    the BILLING CYCLE (then 4.4.3). Not decided here -- it is a BUILD-shape decision and it\n    changes the message model.\n\nQ2. DOES THE MOCK MODEL THE MMC OUTPUT FORMAT, OR STOP AT THE BASE64 GBCS BLOB? Stopping is\n    honest but leaves the number the company bills on unspecified by any external source.\n    RESOLVED BY: obtaining SEC Appendix AF (Message Mapping Catalogue) and judging whether\n    its output format is extractable the way S2 was. NOT ATTEMPTED THIS PASS.\n\nQ3. WHO OPERATES THE RECEIVE RESPONSE SERVICE IN THE SIM? DUIS makes the User an inbound HTTP\n    SERVER, acknowledging each delivery. In-process that is a callback the SIM invokes on the\n    company. RESOLVED BY: EP6's channel-D async design -- this is the same question EP6 must\n    answer for every adapter, and EP8 should not answer it privately.\n\nQ4. WHERE DOES THE ESTIMATE GO? The 2026-08-15 F1 stands: a real DUIS response has no\n    \"estimated\" to return, so estimation must move company-side before any adapter is\n    coherent. RESOLVED BY: the message re-cut that pass recommended -- separating what the\n    transport returns from what the billing engine concludes. STILL OWED, and it is the\n    single largest piece of work behind this atom.\n\nQ5. HOW IS ADDRESSING BRIDGED? The seam is keyed on `customer_id`; DUIS addresses EUI-64\n    Device IDs, and `company/interfaces/supply_book.py` thinks in registered meter points.\n    RESOLVED BY: deciding whether the adapter owns a customer->device map or the supply book\n    grows one. A real supplier's does not live in the metering adapter.\n\nQ6. DOES THE MOCK EMIT ALERTS AT ALL? Device/DCC Alerts are unsolicited, are the natural home\n    for the 129 comms failures the seam currently models as a change of meter type (F4), and\n    have NO representable shape in the envelope today (FINDING 3). RESOLVED BY: building the\n    unsolicited-inbound shape -- which is the one envelope change this pass recommends.\n\n==========================================================================================\nEP6 DEPENDENCY, IN ONE SENTENCE AS ASKED.\n==========================================================================================\n\nEP8 cannot start until EP6 has landed the CHANNEL-D ASYNCHRONOUS CONTRACT -- a request that\nis acknowledged now and answered later on the same correlation id, plus a shape for an\nunsolicited inbound message -- because that, and not the census or the report-key provenance\nwork, is the only part of EP6 that DUIS's published three-leg exchange actually requires;\nEP6's own 2026-08-17 pass reached the same conclusion from the other side, naming channel D\nas \"the one place the guard does NOT counsel restraint\" and citing this atom by name.\n\n------------------------------------------------------------------------------------------\nWHAT THIS PASS DID NOT DO, so the next draw is not misled: no adapter, no message re-cut, no\nschema vendored into the repo, no XSD validator installed, no MMC (SEC Appendix AF) obtained,\nno GBCS specification read; SEC Appendix E's Target Response Time VALUES not obtained (S1\ndefines only the measurement points, and inventing latency numbers would be worse than the\n`delay_days` scalar already there); the SEC website's own pages not fetched directly (403 to\nthis lane -- SEC-sourced claims above are marked `inferred` where they rest on search\nsummaries); `docs/design/EP19_COUNTERPARTY_QUALIFICATION_REGISTER.md` NOT edited despite\nFINDING 2 correcting its B1 row, because it is another atom's deliverable; and the 2026-08-15\nF1/F3/F4/F5 findings re-verified but NOT repaired -- they are BUILD changes to live billing\nand world code, which a LANE 3 doc-only draw does not carry.\n\nNO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE). Nothing above is a new defect against\na control: FINDING 1(a)'s schemaVersion observation is external evidence FOR an\nalready-queued finding (`docs/staging/WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_\nSHAPED_2026-08-13.md`, which stays QUEUED), FINDING 2's register correction is a documentation\nrepair owed to EP19's own draw, and the rest is measurement and framing.\n"
map_notes:
  origin_note: 'An atom whose honest target is a MOCK invites the fail-open shape: a mock that passes because nothing checks it against the real message schema. The exit criterion must therefore be schema-shaped (a DUIS message the real interface would accept), not behaviour-shaped. Its sibling EP9_adapter_n3rgy_consented_metering is the pre-accession route that CAN be exercised for real -- build them as one message model with two transports, or the mock has no oracle.'
  name: 'Adapter for DCC smart-metering service requests in DUIS shapes (e.g. read billing registers). Access class GATED: direct access requires SEC accession, SMKI certification and CIO/UIT testing, with no public sandbox. This adapter stays MOCKED until accession -- the deliverable is that it is mocked AS the real DUIS request/response message formats, so the eventual swap is transport-only.'
