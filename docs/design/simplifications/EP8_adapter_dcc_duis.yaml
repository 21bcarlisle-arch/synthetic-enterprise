atom_id: EP8_adapter_dcc_duis
map_notes:
  origin_note: 'An atom whose honest target is a MOCK invites the fail-open shape: a mock that passes
    because nothing checks it against the real message schema. The exit criterion must therefore be schema-shaped
    (a DUIS message the real interface would accept), not behaviour-shaped. Its sibling EP9_adapter_n3rgy_consented_metering
    is the pre-accession route that CAN be exercised for real -- build them as one message model with
    two transports, or the mock has no oracle.'
  name: 'Adapter for DCC smart-metering service requests in DUIS shapes (e.g. read billing registers).
    Access class GATED: direct access requires SEC accession, SMKI certification and CIO/UIT testing,
    with no public sandbox. This adapter stays MOCKED until accession -- the deliverable is that it is
    mocked AS the real DUIS request/response message formats, so the eventual swap is transport-only.'
