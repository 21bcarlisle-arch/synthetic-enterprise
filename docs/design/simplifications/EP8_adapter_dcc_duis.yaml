simplifications:
- "2026-08-15 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw).\
  \ No BUILD code written, no adapter, no schema, nothing in `file_scope` touched --\nthis atom is epoch-3\
  \ BUILD-gated on director-reserved curriculum sequencing (R13), and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP\
  \ rule 7 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` deliberately\
  \ NOT edited: nothing in the map moves for this\npass (this atom carries no `simplifications_count`\
  \ key to bump), and another lane holds an\nunstaged hunk in that file at draw time (`git diff --stat`:\
  \ 2 insertions, 2 deletions -- a\n`simplifications_count` bump and an `expert_hour` status on `W2_11`,\
  \ NO level move). Output\nis this record plus one queued finding. Everything below is `observed-with-evidence`\
  \ unless\nlabelled `inferred` (R9).\n\nMEASURED AT: HEAD 0f2fab3c5. Live published artefacts read directly\
  \ and parsed in full, not\nsampled: `docs/reports/run_output_latest.json` (mtime 2026-08-14 23:37:37,\
  \ 4,155,614 bytes)\nand `site/data/dashboard.json`. Shipped modules read as they sit on disk; the one\
  \ RNG replay\nbelow re-executes the shipped expression, nothing monkeypatched, nothing regenerated.\
  \ This\natom's single cited evidence path was DEAD (the known moved-path class) and is repaired\nabove:\
  \ the counterparty-API research had moved to `docs/design/refs/`. Six paths added --\nthe ones a reader\
  \ of this atom actually needs.\n\n==========================================================================================\n\
  FINDING 1 -- THE ORIGIN NOTE'S OWN REMEDY IS NOT AVAILABLE AS WRITTEN. \"One message model\nwith two\
  \ transports\" cannot be built on the only message model this seam has, because\n29.31% of what that\
  \ model carries is a value NO transport can return -- and the atom's\npromise that the swap is \"transport-only\"\
  \ is therefore false of the seam as it stands.\n==========================================================================================\n\
  \nThe origin note prescribes: \"build them as one message model with two transports, or the\nmock has\
  \ no oracle.\" Read against the tree, the model that exists cannot be that model.\n\n`tools/meter_read_port.py::MeterReadMessage`\
  \ (field-identical to\n`simulation/meter_reads.py::MeterReadEvent`, by design -- the port's docstring\
  \ calls itself\n\"a SHAPE change to already-correct data\"):\n\n    customer_id, period_end, meter_type,\
  \ delay_days, status,\n    estimated_consumption_kwh, true_consumption_kwh,\n    consecutive_estimated_count,\
  \ forced_catch_up\n\nFour of those nine are SUPPLIER BOOKKEEPING, not counterparty data: `status`\n\
  (\"actual\"|\"estimated\"), `estimated_consumption_kwh`, `consecutive_estimated_count` and\n`forced_catch_up`\
  \ (the 12-month back-billing cap). A DUIS service-request response returns a\nregister value; an n3rgy\
  \ pull returns a midnight index read plus a half-hourly usage file\n(advisor research, verified 2026-08-05).\
  \ NEITHER COUNTERPARTY CAN RETURN \"ESTIMATED\" -- an\nestimate is what a supplier does when a counterparty\
  \ returns nothing.\n\nHOW MUCH OF THE SEAM THAT IS, on the live artefact: 469 of 1,600 messages (29.31%)\
  \ carry\n`status: \"estimated\"`, every one of them with a non-null `estimated_consumption_kwh`. Split\n\
  by meter type: 326 traditional, 143 smart.\n\nAND THE ESTIMATE IS COMPUTED WORLD-SIDE. `simulation/meter_reads.py::simulate_read`\
  \ builds\nit as `statistics.mean(trailing_actuals_kwh[-3:])` (`ESTIMATE_TRAILING_WINDOW = 3`) and\n\
  returns it inside the event. The company does not compute it: `company/billing/\nmonthly_bill_assembly.py:406`\
  \ threads its own trailing actuals INTO the world call and line\n484 reads `event.estimated_consumption_kwh`\
  \ straight back out. \"Average of your last N\nperiods\" is the supplier's own commercial technique\
  \ -- a real supplier is free to change it\nwithout telling anyone -- and it currently lives in world\
  \ code.\n\nTHE CONSEQUENCE FOR THIS ATOM, stated plainly because it inverts the atom's own promise:\
  \ at\naccession a real DUIS adapter has NO estimate to return, so the estimation must move\ncompany-side.\
  \ That is a computation relocating across the wall -- not a transport swap. The\n`name:` field's \"\
  the eventual swap is transport-only\" is not achievable from here, and would\nbecome achievable only\
  \ if the message model were re-cut FIRST.\n\nRECOMMENDATION, acted on by recording it rather than asking\
  \ (NEVER_ASK_WITHOUT_RECOMMENDING):\nEP8's first BUILD task is the CUT, not the adapter -- separate\
  \ (a) what the transport\nreturns (a register/index read, or an error) from (b) what the supplier's\
  \ billing engine\nconcludes (actual vs estimated, the estimate itself, the consecutive-run and back-billing\n\
  state). The origin note's \"one message model\" instinct is right; the model it must be one of\nis the\
  \ COUNTERPARTY'S, and today's is the supplier's.\n\n==========================================================================================\n\
  FINDING 2 -- BLOCKING, QUEUED NOT FIXED. The seam is computed TWICE per run, the two halves\nwere believed\
  \ to agree by seed, and 3 published rows disagree today -- 100% of the times\nthe divergent mechanism\
  \ fired. The control named for their agreement measures cardinality.\n==========================================================================================\n\
  \nFiled as `docs/staging/WORKER_FINDING_THE_MATCHING_BILLS_CONTROL_MEASURES_CARDINALITY_AND_\nTHREE_PUBLISHED_ROWS_DISAGREE_2026-08-15.md`\
  \ (BLOCKING, lane D_billing_metering -- the lane\nof the untrustworthy instrument and the wrong published\
  \ record, not this atom's W4 lane).\nSummary of the measurement, recorded here because it is EP8 that\
  \ inherits its consequence:\n\n    site 1  simulation/run_phase4c_on_phase2b.py:236 -> generate_meter_read_log\n\
  \            -> the published `meter_read_log` (1,600 rows)\n    site 2  company/billing/monthly_bill_assembly.py:406\
  \ -> SimulatedReadFeed.read_for\n            -> the bills customers are charged on (1,600 rows)\n\n\
  `monthly_bill_assembly.py:381-388` states the premise itself: \"computed here a second time\non purpose\
  \ ... the identical seed means the two always agree.\" The seed is\n`random.Random(f\"meterread_{customer_id}_{period_end}\"\
  )`.\n\nIt is already false. Site 2 carries an override site 1 does not\n(`monthly_bill_assembly.py:412-424`):\
  \ a churned account's final bill is forced onto\n`final_read_for(...)`, status \"actual\", under SLC\
  \ 21B. Joined on `(customer_id, period_end)`\nover the live artefact -- 1,600 keys, all distinct, zero\
  \ unmatched on either side:\n\n    billing_basis   log status    rows\n    actual          actual  \
  \     1,131\n    estimated       estimated      466\n    actual          estimated        3      <-\
  \ the divergence\n\n    C5 2020-12-29   est 1,961.88 kWh   billed 2,015.82   -GBP 788.97   consec_est\
  \ 11\n    C6 2024-03-29   est 2,342.48 kWh   billed 2,346.81   +GBP 1,484.80  consec_est  4\n    C3\
  \ 2020-06-29   est   202.82 kWh   billed   191.21   +GBP 37.44     consec_est  9\n\nAll three are a\
  \ churned account's final bill. The run has 5 churned billing accounts; the\nother 2 already resolved\
  \ \"actual\" and needed no override. So the rate is not 3-in-1,600 --\nit is 3 OF 3, every override\
  \ that fired, and it scales with churn.\n\n`site/data/dashboard.json` publishes this stream at `customers.meter_read_log`\
  \ (1,600\nentries), so the diverging copy is in published data. No site template renders it (grep of\n\
  `site/**` `.js/.html/.jsx/.ts` for `meter_read_log`: nothing), so it is published-but-\nunrendered,\
  \ which is why this went unseen.\n\nWHY NOTHING FIRED. `tests/simulation/test_run_phase4c_on_phase2b.py:180`\
  \ is named\n`test_main_produces_meter_read_log_matching_bills` and asserts, in full: equal LENGTH, that\n\
  `status` is within {\"actual\",\"estimated\"}, and `delay_days >= 0`. Cardinality and value\ndomains.\
  \ Nothing joins the two streams; nothing compares `billing_basis` to `status`. The\nname asserts a per-row\
  \ agreement, the subject is a count of one side -- so any divergence of\nequal length passes, which\
  \ is every divergence this mechanism can produce.\n\nWHY BLOCKING, both legs stated separately so neither\
  \ carries the verdict alone: an\ninstrument in this area cannot fail on the defect its own name describes;\
  \ and three rows of\na published 1,600-row artefact assert a read status the published bill for the\
  \ same\ncustomer-period contradicts.\n\nTHE CONSEQUENCE FOR THIS ATOM, which is why it is recorded here\
  \ and not only in billing: a\nreal DUIS or n3rgy transport answers a request ONCE. There is no seed\
  \ to recompute from. The\nmoment either call site is served by a real adapter the other has nothing\
  \ to re-derive the\nsame answer with, and the 3-row divergence becomes unbounded. THE DUAL COMPUTATION\
  \ MUST\nCOLLAPSE TO ONE BEFORE THIS ATOM'S DELIVERABLE IS EVEN COHERENT -- that is a prerequisite,\n\
  and it belongs in EP8's exit criteria rather than being discovered by the first adapter.\n\n==========================================================================================\n\
  FINDING 3 -- GRANULARITY AND UNIT. The seam is one message per customer per BILLING PERIOD;\nboth named\
  \ counterparties are per METER per DAY, and one returns an INDEX rather than a\nconsumption. The failure\
  \ surface EP9's record calls \"the valuable part\" has nowhere to live.\n==========================================================================================\n\
  \nLive: 1,600 messages over 19 customers and 119 distinct `period_end` values, spanning\n2016-01-31\
  \ to 2025-06-07 (3,416 days). The n3rgy contract the advisor verified is ONCE DAILY\nPER METER, which\
  \ over the same customers and the same span is 64,904 pulls -- 40.6x the\nmessages this seam carries.\
  \ That is not a volume quibble; it is where the physics lives:\n\n- \"MISSING DAYS STAY MISSING UNLESS\
  \ RE-REQUESTED\" -- named in EP9's own record as the\n  fidelity gold and \"the part most likely to\
  \ be smoothed away\" -- IS NOT REPRESENTABLE. A\n  monthly message has no day to be missing. The only\
  \ latency carrier on the seam is\n  `delay_days`, one scalar per customer-period (live range 0..68).\n\
  - A DUIS billing-register read returns a cumulative REGISTER INDEX at an instant; this\n  message carries\
  \ a PERIOD CONSUMPTION. Consumption has to be derived from index deltas,\n  and the whole class of defects\
  \ that lives in that derivation -- register rollover,\n  meter exchange, index regression, a read pair\
  \ straddling a tariff change -- is not\n  merely unimplemented here, it is unrepresentable in the current\
  \ field set.\n\nSo the atom's honest granularity target is per-meter-per-day index reads, and the billing\n\
  period becomes a thing the SUPPLIER derives. That is the same cut finding 1 arrives at from\nthe other\
  \ direction, which is worth noting: two independent routes reach the same\nprerequisite.\n\n==========================================================================================\n\
  FINDING 4 -- THE COMMS FAILURE IS MODELLED AS A CHANGE OF METER TYPE, NOT AS A RESPONSE.\nDUIS's entire\
  \ failure surface is response codes, and there is no field anywhere on this\nseam to put one in. 129\
  \ live smart-meter comms failures are invisible in the artefact.\n==========================================================================================\n\
  \n`simulation/meter_reads.py`: `communicating = meter_type == \"smart\" and rng.random() >=\nSMART_METER_NOT_COMMUNICATING_RATE`\
  \ (0.10, anchored to DESNZ Q4 2024). When that is False,\nthe smart meter is then sampled with `TRADITIONAL_DELAY_MEAN_DAYS`\
  \ (9.0) and\n`TRADITIONAL_ACTUAL_READ_PROBABILITY` (1/6 per month) -- it BECOMES the traditional path.\n\
  \nReplayed the live log's own seeds (the shipped expression, same seed string, deterministic,\nnothing\
  \ patched): 129 of 1,227 smart entries were non-communicating -- 10.51%, matching the\n0.10 anchor --\
  \ and 118 of those 129 resolved as `estimated`.\n\nTHE PUBLISHED MESSAGE STILL SAYS `meter_type: \"\
  smart\"` FOR ALL 129. The comms failure leaves\nno trace in the artefact at all; it is recoverable only\
  \ by re-running the SIM's RNG, which\nis a simulation internal the company may not read. So no company-side\
  \ control could ever\ncount DCC comms failures, and the company cannot be wrong about them -- there\
  \ is nothing to\nbe wrong about. (Same tautology shape as the filed `the world's churn ceiling was the\n\
  company's belief` class, arrived at from the opposite direction: here the world does not\neven publish\
  \ the quantity.)\n\nThere is no error channel: grep for error/response-code/reason-code across\n`simulation/meter_reads.py`\
  \ and `tools/meter_read_port.py` returns zero hits on the data\npath. A DUIS adapter's response codes\
  \ are precisely the thing this mock exists to be shaped\nlike, and an adapter returning a DUIS error\
  \ would have to encode it as \"this smart meter is\nnow behaving like a traditional one\" -- which is\
  \ not what happens to a real one. The real\nbehaviour is: the meter stays smart, the service request\
  \ fails, and the supplier retries.\n\n==========================================================================================\n\
  FINDING 5 -- FRAME. Three things the opening draw will find already in place, and one\ntarget mismatch\
  \ that should be settled before any adapter is written.\n==========================================================================================\n\
  \n(a) THE COMPANY-SIDE CONSUMER ALREADY EXISTS AND IS WIRED. `company/billing/\nsmart_meter_reconciliation.py`'s\
  \ own docstring says its inputs are \"estimated AQ from own\nbilling records, actual reads from DCC/smart\
  \ meter API\" -- i.e. it is written against the\nadapter this atom would build. Non-test importers:\
  \ 1 (`company/billing/\nmonthly_bill_assembly.py`), verified this pass. Worth stating because the usual\
  \ class here\nis the opposite (`a class's remedy may already exist, UNWIRED`): this one is live. EP8's\n\
  build is adapter -> existing wired consumer, not greenfield, and the risk is changing the\nshape under\
  \ a live consumer rather than lacking one.\n\n(b) THE SEAM CARRIES NO COUNTERPARTY IDENTIFIER. Grep\
  \ of `simulation/meter_reads.py`,\n`tools/meter_read_port.py` and `company/billing/**` on the read path\
  \ for\nmpan/mprn/device_id/MAC/CIN: nothing on this seam (the one `export_mpan` hit is\n`company/billing/fit_legacy_register.py`,\
  \ a different flow). The key is `customer_id`. Both\nnamed counterparties address by MPAN/MPRN (advisor\
  \ research, verified 2026-08-05), so the\nmock cannot even be ADDRESSED the way the real one is, and\
  \ the supply book\n(`company/interfaces/supply_book.py`) -- which does think in registered meter points\
  \ -- is\nnot the thing this seam is keyed on.\n\n(c) TARGET MISMATCH, recorded not resolved. `tools/meter_read_port.py::MeterReadPort`'s\
  \ own\ndocstring names the go-live swap as \"a DTC/Elexon D0010 feed adapter\". D0010 is a settlement\n\
  DATA FLOW of register readings pushed over the DTN; EP8's target is DUIS SERVICE REQUESTS to\na device.\
  \ Both are real, and they are neither the same counterparty nor the same shape (push\nvs request/response;\
  \ settlement flow vs device service). The one port on this seam therefore\npoints at a different swap\
  \ from the one this atom promises. Which is EP8's target is a BUILD\ndecision and is NOT taken here\
  \ -- recorded so the opening draw does not assume the port is\nthis atom's ancestor and inherit the\
  \ wrong shape. (Note EP6's own DISCOVER already found\nthis port family is same-step with no correlation\
  \ id, i.e. Family B, so it is not the\nprotocol ancestor either.)\n\n(d) THE ORACLE. The origin note's\
  \ whole defence against the fail-open mock is that sibling\nEP9 \"CAN be exercised for real\". Against\
  \ the source: n3rgy auth is by IHD MAC/CIN and\nregistration by MPAN/MPRN -- a physical in-home display's\
  \ credentials for a real household's\nconsented data. So the oracle is not a repo-local capability;\
  \ it needs a real premise and a\nreal person's consent, which sits adjacent to reserved class 2 (`inferred`\
  \ -- not decided\nhere, and no such access is proposed by this pass). RECOMMENDATION, recorded: EP8's\
  \ schema\noracle should be the PUBLISHED DUIS MESSAGE SPECIFICATION, not a live sibling call, so the\n\
  exit criterion the origin note asks for (schema-shaped, \"a DUIS message the real interface\nwould accept\"\
  ) stays exercisable inside this repo and in an offline lane. The sibling's\nvalue to EP8 is its CADENCE\
  \ AND FAILURE CONTRACT (finding 3), which is documentary and\nalready captured; its live transport is\
  \ not the oracle it was hoped to be.\n\n------------------------------------------------------------------------------------------\n\
  WHAT THIS PASS DID NOT DO, so the next draw is not misled: no adapter, no message re-cut, no\nDUIS schema\
  \ fetched or transcribed (this lane has no network, and no DUIS specification text\nexists in the repo\
  \ -- checked); the gas/MPRN side untouched; `EP9_adapter_n3rgy_consented_\nmetering`'s own record NOT\
  \ amended (its dead evidence path is the same one and remains\nunrepaired -- a one-line repair belonging\
  \ to that atom's own draw); the D0010-vs-DUIS target\nquestion (5c) left open; and whether any downstream\
  \ consumer of `meter_read_log`\n(`company/compliance/population_sanity.py`, `saas/reporting/annual_report.py`,\n\
  `saas/reporting/css_statement.py`) produces a wrong figure from finding 2's 3 rows NOT\nmeasured. Finding\
  \ 2 was QUEUED, not fixed -- SELF_INTERRUPT_DISCIPLINE queues a worker's own\nfindings by default, and\
  \ repairing it is a BUILD change to a live billing path, which a\nLANE 3 doc-only draw does not carry.\n"
