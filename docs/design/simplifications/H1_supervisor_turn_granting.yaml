simplifications:
- 'v1 wiring lands 2026-07-10 -- this very atom is the one being closed by that wiring. 2026-07-10 HARDEN pass (this atom drew ITSELF, fittingly): adversarially reviewed _maturity_map_draw() before a 4th live incident found the next gap rather than after. Found a real crash risk -- a malformed atom (a hand-editing typo like a quoted level_current string, or an explicit dial_inherited: null) would raise TypeError uncaught, aborting find_work() before it reaches the backlog-prose fallback -- silently reintroducing the exact idle-hole class of bug this mechanism was built to eliminate, specifically during agenda+staging-empty periods (self-refill''s own use case). Fixed: per-atom validation now isolates a malformed atom to ''excluded from this draw'', not ''the whole draw stops working forever''. Known, accepted lower-severity gap not fixed (self-defeating, not crash-causing): an atom listing itself in its own depends_on would permanently self-exclude rather than crash -- an obvious typo, visually apparent on review, left undefended rather than adding more complexity for a safe-side failure mode. 3 new tests, 452/452 background tests pass, epistemic PASS, live supervisor restarted.'
- '2026-07-12 R3 REDESIGN, real regression found and fixed (P0, 9th idle variant, R3_WORK_GRANTING_REDESIGN.md, director-caught from the live console -- ''the director is hand-typing self-refill next atom -- he is manually performing the supervisor''s core function''): find_work()''s ''unprocessed staging'' check included run_complete_*.md (the auto-process daemon''s own routine marker, needing no granted turn to be handled at all) in the SAME list used to decide ''real work exists on the instruction channel'' -- so as long as that marker sat in docs/staging/ (nearly continuously), find_work() returned early and NEVER reached this atom''s own self-refill draw. ~35 open map atoms sat idle while this repeated every ~2 minutes; a live session correctly identifying the daemon marker as ''not mine to act on'' individually was collectively the exact failure. Fixed: daemon markers excluded from the instruction-channel check entirely (_real_staged_instructions()/_is_daemon_marker()); the self-refill draw is now UNCONDITIONAL (runs and gets appended to the reason even when a real doorbell already fired, not only as a fallback reached when nothing else exists); find_work() now returns (reason, map_exhausted) so a genuine CANNOT-draw (every atom blocked/complete) can be escalated distinctly from an ordinary didn''t-draw-this-cycle; an idle-turn counter instruments the ''nothing to do'' state directly (target zero, no longer silent). 16 new tests, 92 total in tests/background/test_supervisor.py pass, epistemic verifier PASS. Level held at 3 (already at target) -- this is a same-mechanism regression fix, not a new capability, but registered honestly per this project''s own R10 discipline (an absurdity-class defect closes by extending the invariant/test coverage, not a silent instance fix).'
- '2026-07-18 HARDEN red-team (orchestrator, L3->L3 held, observed-with-evidence R9 across ~20 consecutive at-target draws this session). FINDING: the Rule-0 self-refill AT-TARGET HARDEN draw has NO cooldown / rotation memory -- it re-offers the SAME at-target atoms within a few turns (directly observed re-offers this session: SITE1_expert_doors, H7_skills_and_rules, W3_1_price_cap_binding, W3_2_settlement_timetable, ARCH1_internal_seams, G5_effort_sizing_discipline, H10_worktree_isolation), so an agent CHURNS re-verifying atoms it verified minutes ago. This is the at-target analogue of the idle-DISCOVER treadmill that H23_frame_saturation_draw_marker fixed -- but at-target HARDEN has no equivalent damper. Unlike FRAME (which genuinely saturates), HARDEN is legitimately periodic (atoms CAN regress), so the fix is a COOLDOWN not a saturation flag: skip an atom HARDEN-verified in the last N hours (track a per-atom last_hardened_at, or derive from git -- last commit touching its file_scope vs last HARDEN note), so the draw ROTATES through the at-target pool instead of re-handing recent ones; re-offer sooner iff the atom CHANGED (a commit in its file_scope since last HARDEN). SECONDARY (minor): the doorbell instructs ''NTFY the director this dial was yielded'' on EVERY dial-yield draw, but R5 is transition-only -- the dial-yield is ONE transition (below-target exhausted); firing the NTFY per-draw would spam. Correct behaviour (done this session): send it ONCE on the transition into caught-up, ignore the per-draw repeats. CLASS FIX (R10, at H1 BUILD): the dial-yield NTFY should be gated by a transition latch (like the reconcile-watch drift signature), not re-emitted every draw. Level held (HARDEN never moves the cell); registered not fixed (SELF_INTERRUPT).'
- '2026-07-25 HARDEN pass (H1 drew ITSELF again via the Rule-0 dial-yield): BUILT the at-target HARDEN COOLDOWN / rotation memory the 2026-07-18 red-team of THIS atom registered-not-fixed (SELF_INTERRUPT). The finding: _rule0_harden_draw had no cooldown, so it re-offered the same at-target atoms within a few turns and an agent churned re-verifying atoms it verified minutes ago -- the at-target analogue of the idle-DISCOVER treadmill H23 fixed, with no damper. FIX (background/supervisor.py): a per-atom rotation marker (docs/observability/.harden_cooldown.json = {atom_id: {at, sha}}); _rule0_harden_draw now SOFT-skips an atom hardened within HARDEN_COOLDOWN_HOURS=6 AND unchanged since (content-sha match) so the draw ROTATES the at-target pool -- but re-offers immediately iff the atom CHANGED (sha mismatch = a commit may have regressed it) OR the window elapsed. Chosen a COOLDOWN not a saturation flag precisely because HARDEN is legitimately PERIODIC (a shipped atom CAN regress) unlike FRAME which saturates -- matching the real_world_twin (an on-call auto-page rotation backs off a still-open alert but re-pages a CHANGED one at once). SOFT DIAL (Rule 0): if every at-target atom is in fresh cooldown the draw falls back to the full pool so it is never empty (a genuinely-empty HARDEN draw would false-trip the LOOP_BROKEN transport alarm). R15 BOTH WAYS in test_supervisor.py (7 new tests): fresh+unchanged suppresses; expired re-offers; changed-sha re-offers; no-record re-offers; malformed marker fails-open; soft fallback keeps the draw non-empty; record_harden_pass merges + ignores phantom ids. Mutation-proven: neutering the filter (pool = pool) reds EXACTLY the 3 rotation/expiry/change tests and nothing else. INDEPENDENCE: keyed on each atom actual serialised content sha, never a constant. Fixture-isolated (HARDEN_COOLDOWN_PATH added to test_supervisor.py::_isolate). Dogfooded: record_harden_pass(H1_supervisor_turn_granting) stamped so the NEXT tick rotates PAST this atom. SECONDARY finding (dial-yield NTFY per-draw spam) addressed by routing the yield page through notify() transition_key so R5/G-N1 dedup latches it once per transition. Level held at 3 (HARDEN never moves the cell); registered per R10 (same-mechanism capability-add, not a silent instance fix).'
- '2026-07-27 HARDEN pass (H1 drew ITSELF again via the Rule-0 dial-yield; exit tests re-verified, 173->176). RED-TEAM FINDING + FIX: the 2026-07-25 at-target HARDEN COOLDOWN keyed its ''changed since'' re-offer signal on _atom_content_sha -- the atom''s OWN maturity-map note ONLY -- while its own docstring claimed to re-offer when ''a commit touched its file_scope''. But 5+ harness atoms SHARE background/supervisor.py in file_scope (H1, H19, H_forward_discovery_draw, OPS1, A6), so a commit hardening a SIBLING atom moves the shared code and appends its note to the SIBLING''s entry, leaving H1''s yaml -- and thus its cooldown sha -- UNCHANGED: H1 stayed suppressed in cooldown for up to HARDEN_COOLDOWN_HOURS=6 while code under its own control changed and could have regressed (the audit-the-sibling-half-of-a-hardened-class pattern). FIX (background/supervisor.py): added _file_scope_sha (a hash of the file_scope SOURCE-file contents) as a SECOND change signal stored in the rotation marker (scope_sha); _harden_in_cooldown now ALSO re-offers when a scoped file changed since the stamp, guarded ''is not None'' so a legacy pre-scope_sha record stays back-compatible, and FAIL-OPEN to '''' when file_scope is absent or no scoped file exists (an empty signal never spuriously suppresses -- falls back to the atom-content + time behaviour). record_harden_pass now stamps scope_sha too. R15 BOTH WAYS (3 new tests): a scoped-file change flips the sha and re-offers; unchanged suppresses; a legacy record stays back-compatible; _file_scope_sha fails open on missing files; the killer mutation (drop the scope re-offer) reds EXACTLY test_harden_cooldown_reoffers_when_shared_file_scope_changes and nothing else (176 total pass in tests/background/test_supervisor.py). Level held at 3 (HARDEN never moves the cell); registered per R10 (same-mechanism fidelity widening, not a silent instance fix).'
- '2026-07-27 HARDEN re-verify (H1 drew ITSELF via Rule-0 dial-yield; NO defect found -- an honest no-change pass). WHY H1 was re-offered is itself the finding: a LIVE PRODUCTION OUTCOME-TEST of the 2026-07-27 scope_sha control (R15 outcome-clause -- a control firing on a REAL, non-synthetic defect condition is the strongest evidence it works). Concretely this tick: H1''s own maturity-map note was UNCHANGED (content sha af161b1ff8df37d3 matched its 07:48 stamp) but the shared background/supervisor.py had MOVED (scope_sha ed9762ab7687fcde -> 9f78b3d0c9ef3bcf) because sibling atom H23_frame_saturation_draw_marker''s commit f06467748 hardened _atom_has_frame_doc in the same file AFTER H1''s stamp -- so _harden_in_cooldown correctly returned False and RE-OFFERED H1. Under the pre-2026-07-27 content-only cooldown H1 would have been WRONGLY SUPPRESSED for up to 6h while code under its own control changed: the exact blind spot the scope_sha signal closed, now confirmed firing in the wild, not just in a unit test. Re-verify actions this pass: (a) full exit suite GREEN (176/176 in tests/background/test_supervisor.py); (b) inspected H23''s diff -- its change is confined to _atom_has_frame_doc (a FRAME-draw helper), structurally independent of H1''s turn-granting/cooldown logic, so the sibling move did NOT regress any H1 invariant; (c) MUTATION re-test of the scope_sha control repeated (neuter ''scope_sha != _file_scope_sha(a)'' re-offer) -- reds EXACTLY test_harden_cooldown_reoffers_when_shared_file_scope_changes and nothing else, then restored green. Level held at 3.'
