- '2026-07-27 HARDEN red-team (H1 drew ITSELF via Rule-0 dial-yield; a REAL fix this pass, not a no-change re-verify). FINDING + FIX: _has_harden_surface -- the G10 harden-ability SOFT-preference predicate this atom owns -- identified a test FILE via a loose ''test in s.lower() and s.endswith(.py)'' SUBSTRING check, so non-test .py files whose NAME merely CONTAINS the letters (latest.py, contest_pricing.py, protest_handler.py, greatest_hits.py) FALSE-QUALIFIED as harden-able (proven: all returned True). Same word-boundary false-positive class as the E2E->E2 commit-parser fix earlier today (audit-the-sibling-half pattern applied to a NEW predicate, not the churned cooldown control). LATENT: 0 live at-target evidence entries trip it now, so purely preventive + fully safe-side (SOFT preference, never a gate -- a false positive only mis-PREFERS, never mis-draws), but a tighter predicate spends idle HARDEN effort truer. FIX (background/supervisor.py): word-boundaried regex (?:^|[/_])tests?(?:[_./]|$) over the lowercased .py path -- accepts test_*.py / *_test.py / a/b/test_x.py, rejects the substring impostors. R15 BOTH WAYS (new test_has_harden_surface_rejects_substring_test_false_positives in test_harden_ability_gate.py): 5 impostors reject + 3 genuine conventions accept; the killer mutation (revert the guard to the loose substring) reds EXACTLY that one test and nothing else (1 failed / 7 passed), green restored. All pre-existing _has_harden_surface assertions unchanged; 193 pass across test_supervisor.py + test_harden_ability_gate.py. Level held at 3 (HARDEN never moves the cell); registered per R10 (invariant-tightening, not a silent instance fix).'
