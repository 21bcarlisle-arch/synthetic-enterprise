atom_id: D4_loyalty_incentive_billing
simplifications:
- '2026-07-11 REGISTERED (P3, advisor-staged, director-decided -- ADOPTION_JOURNEY_REGISTER.md, do not start): ToU/EV loyalty mechanics (points, rewards, free hours, half-price hours, miles, prizes) are becoming standard industry practice and are bill-visible artefacts (statement lines, reward balances, discounted-window tariff structures) -- NOT marketing copy. They touch the billing lane and the bill artefact standard directly, and their cost is a real P&L line. Where flexibility value per customer sits below the bother threshold (see C4_adoption_physics), engagement/loyalty mechanics carry the persuasion load, and the company must DISCOVER that rather than assume rational £-response. Advisor placement decision: loyalty economics live INSIDE the billing + marketing lanes -- explicitly no new lane created for this. PLACEMENT: Epoch 4, same dependency block as C4/C5 -- do not build ahead of the adoption-physics/conversion-window mechanics this depends on for who gets offered what, when.'
- '2026-07-12 DISCOVER pass (self-refill draw, no BUILD code): confirmed ''becoming standard industry practice'' with real, current (2026), NAMED examples across multiple major UK suppliers, not an unsourced assertion. Octopus Energy''s Octoplus programme (Saving Sessions, ''Power-ups'' free-electricity windows, Octoplus Points redeemable as bill credit, partner-brand Perks) delivered customers ~GBP300/year of rewards on average -- ~17% of a typical annual bill, a real, material, quantified P&L-relevant figure, not a marketing rounding error. EDF''s Sunday Saver Challenge grants 4-16 hours/week of free electricity for weekday peak-avoidance. British Gas''s PeakSave Sundays and Scottish Power''s Power Saver both give automatic (no weekly opt-in) half-price electricity on weekend windows (11am-4pm). These four real, concurrent, named schemes across four major suppliers give this atom''s eventual build a genuine reference set of real mechanic SHAPES (automatic discount windows vs. opt-in points vs. announced free-power events) to anchor against rather than inventing generic ''loyalty mechanics''. No BUILD code, no level change -- epoch 4 gating and the director''s ''do not start'' instruction both still apply.'
- '2026-07-16 FRAME (H17 Lane-3): canonical per-atom FRAME terminus authored (mechanic-shape taxonomy from four real UK schemes → bill-visible artefacts; coupled-gap to C4 bother-threshold/reward-responsiveness; epistemic wall on reward-response discovery); BUILD deferred (Epoch-4-gated, director ''do not start'', plus unmet prerequisite C4_adoption_physics at 0/2). No BUILD code, no map edit (F1).'
