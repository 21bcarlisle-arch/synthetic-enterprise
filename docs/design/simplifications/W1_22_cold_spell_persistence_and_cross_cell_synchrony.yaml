atom_id: W1_22_cold_spell_persistence_and_cross_cell_synchrony
map_notes:
  origin_note: 'The ruling''s decision 4 puts BOTH of these in phase 1 rather than deferring them, and gives the reason: ''a five-day cold snap costs more than the same degree-days spread thin'', and ''when Glasgow is cold, is London? -- this is what turns household weather into PORTFOLIO RISK''. They are the shape half of the director''s question and the hierarchy''s own aggregation-consistency requirement. THE DATA IS ALREADY ON DISK: 210 daily tas files were pulled for exactly this and nothing else needs them. Synchrony is the term that makes the cells worth having to a hedger -- independent cells would diversify, correlated ones do not, and the crisis-year tail in the CLV reference is a synchrony event. Feeds use case 3.1 (hedging by physics), which is STAGE 3 and not built here; this produces the truth it will later be scored against.'
  gain: 'The SHAPE half the ruling keeps in phase 1: how long cold spells last in a cell, and whether cells go cold together -- synchrony is what turns household weather into portfolio risk.'
