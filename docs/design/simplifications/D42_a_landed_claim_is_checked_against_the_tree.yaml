atom_id: D42_a_landed_claim_is_checked_against_the_tree
map_notes:
  gain: 'Two questions over the PAIR of trees, because one reader asked twice cannot see a difference between them: `UNLANDED_HOUR_WORK` (a tracked code file carries `<atom> Expert Hour #N` in the working tree and its HEAD version does not) and `UNLANDED_HOUR_RECORD` (the atom''s record file holds an Hour entry HEAD does not). HEAD side from `git show`, tree side from the filesystem. A RECORD IS NOT A LANDING: docs and site data repeat these labels verbatim, and counting them reports an Hour as landed on the strength of the register that was wrong about it -- record against record one level down. Its own exit code 3, deliberately OUTSIDE the shared repo-wide refusal, because its subject is the working tree and folding a working-tree predicate into the integrity findings would wedge every lane the moment any Hour is mid-flight, which is the state this check exists to REPORT. (Hour #25.)'
