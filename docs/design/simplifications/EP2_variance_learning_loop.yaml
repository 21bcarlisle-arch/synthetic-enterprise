atom_id: EP2_variance_learning_loop
map_notes:
  origin_note: 'The R13 wall is the danger: a learning loop that closes over BOTH sides -- adjusting the company''s belief AND the world it is measured against -- is a goal-seek wearing a feedback loop. The loop may only move COMPANY belief. R12: variance is a diagnostic; shrinking it is not the objective, explaining it is. Depends on true-ups because a variance loop with nothing late to learn from is vacuous.'
