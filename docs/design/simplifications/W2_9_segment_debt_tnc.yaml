- '2026-07-13 -> L3 (BUILD_THE_BACKLOG P0, fork). WORLD-side segment debt-obligation ground truth (LPCDCA 1998 statutory business interest = BoE base + 8pt, real 2016-25 rate history; domestic late-charge exclusion; payment-conditioned eligibility). Closes W2_9<->C11 (C11 already L2): gap 0.229 -- 2.30pct wrong-segment T&C, 8200 domestic accounts wrongly charged statutory interest (unlawful direction), 3300 wrongly withheld. Independence (R15): world scores TRUE segment, C11 acts on OBSERVED (misclassifiable) segment -- real, not tautology. Added misapplication_gap family to gap_metric. Epistemic PASS. || 2026-07-12 REGISTERED, NOT BUILT (AFFORDABILITY_AS_SIM_PHYSICS.md director addendum item 8). Late-payment interest is STATUTORY for business (Late Payment of Commercial Debts (Interest) Act 1998 / LPCDCA, 8%+base) and effectively EXCLUDED for domestic; late-payment CHARGES are largely regulated out of domestic T&Cs. Tariff ELIGIBILITY conditioned on payment behaviour is real commercial policy (DD-discount tariffs; good-payer gating) -- model as company-side POLICY OBJECTS with fairness/oracle constraints, not as free-floating parameters. Anchors: LPCDCA (business); Ofgem SLC / Consumer Duty (domestic charge restrictions). Build in M3.'
- '2026-07-12 DISCOVER addendum (self-refill draw, no BUILD code). Business-side statutory rate reconfirmed current: 11.75% (base 3.75% + 8pts, mid-2026) -- consistent with sibling atom W2_6''s own finding, same real anchor, cross-checked not duplicated blind. Also found a live, current (2026) regulatory constraint directly relevant to this atom''s own ''DD-discount tariffs / good-payer gating -- model as policy objects with fairness constraints'' framing: Ofgem''s Direct Debit Market Compliance Review is an ACTIVE enforcement effort (a real 2026 action sought improvements from 12 suppliers) requiring suppliers to set DD amounts off realistic consumption/tariff/seasonality estimates, avoid unnecessary large credit build-up, and actively return in-credit accounts toward a near-zero balance within 12 months. Implication for this atom''s eventual build: a ''good-payer gating/DD-discount'' policy object cannot be modelled as simply rewarding reliable payers with a discount in isolation -- real suppliers are simultaneously under an active regulatory obligation NOT to over-collect/over-hold credit from those same good payers, i.e. the fairness-constraint side of this atom''s own ''policy objects with fairness/oracle constraints'' phrase has a real, current, named regulatory anchor (this DD compliance review), not just an abstract fairness principle. No BUILD code; no level change.'
- '2026-07-13 FRAME pass (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Checked whether real prior art already exists under a different name before assuming greenfield (the recurring mis-registration pattern found elsewhere this session) -- confirmed genuinely NOT: grepped company/billing/*.py (60+ modules) and company/compliance/*.py for statutory/8pts/11.75/late-payment-interest/segment-conditioned-rate logic, zero hits. The blank registration is honest; this is real greenfield, not another orphaned-module case. Found the right architecture to build it in, though: company/compliance/domain_invariants.py already has an EXACT working template for this atom''s own shape -- vat_by_segment (VAT_RESIDENTIAL/VAT_SME as separate RateInvariant instances, a vat_rate_for_segment(segment) dispatcher, a check_vat(segment, actual_rate) checker, wired into a real consumer at company/billing/pre_bill_validation.py). This atom''s own three named sub-scopes map onto the identical shape: (1) statutory business late-payment interest -- a RateInvariant per segment (business=11.75% current, resi=0/excluded) exactly mirroring VAT_RESIDENTIAL/VAT_SME; (2) domestic late-charge exclusion -- a boolean-style invariant (has direct precedent in this library''s existing non-rate checks); (3) payment-conditioned tariff eligibility (DD-discount/good-payer gating) -- needs its own new shape (not a rate, a policy predicate), but should still live in this same module for the same reason W2_6''s late-payment findings already anchor here (segment_debt_tnc and sme_distress_twin are named siblings). FRAME decision: extend domain_invariants.py (not a new standalone file) -- ''one architecture, not two,'' matching the principle already applied to D2/G2/W3_2 this session. file_scope should be set to company/compliance/domain_invariants.py + company/billing/pre_bill_validation.py (the real wiring point, same as VAT) when this atom is BUILD-eligible. Next BUILD question (not decided