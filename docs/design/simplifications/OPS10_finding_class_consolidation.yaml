atom_id: OPS10_finding_class_consolidation
map_notes:
  name: 'MINTED FROM deliverable 2 of the WORK THIS CREATES block in DIRECTOR_RULING_FINDING_SEVERITY_AND_INTERLEAVE_2026-08-12 -- ''class consolidation for the five named families, with instance lists and cumulative cost''. The five are named in the ruling as measured, not to be re-derived: publish-gate/wedge (~18), controls that cannot fail -- vacuous, fail-open, blind (~9), measurements that mirror the thing they measure (~7), uncommitted/orphaned work (~7), no-caller/never-runs (~5). EXIT: (1) five class documents, each naming EVERY instance it supersedes by filename; (2) superseded individuals ARCHIVED, never deleted (the ruling''s own word), and the archive is verified to HOLD -- the resurrection class in WORKER_FINDING_ARCHIVED_STAGING_PATHS_ARE_RESURRECTED_ON_THE_SHARED_TREE_2026-08-10 is this exact move''s known failure mode on this shared tree; (3) membership is DERIVED and re-checkable, so a family that grows a sixteenth instance next week does not silently stop being consolidated -- a check maps every staging finding to at most one class or to unclassed; (4) the cumulative cost line is MEASURED from artefacts (wedge episodes, hours, published figures affected), never estimated prose, since a cost that cannot be traced is the mirror class this very consolidation lists; (5) the count printed in each class doc equals its instance-list length -- the one-name-one-number class, which has already been filed once against this project''s own registers.'
