  - '2026-08-09 LEVEL CORRECTION 3->2, loop_stage harden->build (ledger action LEVEL_CORRECTION_SELF_CERTIFIED). THE EXIT TEST NAMED IN THE PROMOTION ABOVE STOPPED REPRODUCING. That promotion rests, in its own words, on ''failed_levels [] in docs/observability/coupled_gap_ledger.json'' -- measured on the AUTHORED 10-home panel. Re-measured this tick on the DRAWN population (tools/couple_fabric.py --population 200 --write-ledger, population_seed=17, same real Open-Meteo archive 2022-01-01..2022-04-30, same generator, same seed): is_red true, failed_levels [''L1''], failing L1.2_day_to_day_shape_correlation (2/200 homes outside their own band, worst P0197 = 0.8868 vs at_most 0.85) and L1.5_max_multiplicity_share (7/200, worst P0108 = 0.15). WHY THIS IS NOT THE SAMPLE-SIZE ARTEFACT, checked before demoting: the worst-of-N defect that the original panel/population disagreement raised was FIXED FIRST -- every L1 cell now reports a population VIOLATION RATE with its rule-of-three resolution instead of an extremum, so the same generator scores the same at n=25 and n=200 -- and the suite is red under the RESTATED statistic at both n=60 and n=200. The panel could not have found this: it has no resistive-electric home, and the drawn population has 9 in 200, roughly England''s share. NO BAND WAS MOVED and no cell was marked UNVALIDATED to reach the verdict (R12). REVERSIBLE: fix the generator, or show the population measurement wrong, then re-certify 2->3 with a fresh LEVEL_UP_SELF_CERTIFIED row. OPEN SUSPICION, queued not fixed: L1.2''s 0.85 band may itself be regime-blind in the same way L1.1''s was -- a storage-heater home charging on a fixed overnight timer has a legitimately repeatable daily shape -- see docs/staging/WORKER_FINDING_L1_2_BAND_MAY_BE_REGIME_BLIND_2026-08-09.md. That is a reason to re-derive the band from physics, never to widen it.'
  - '2026-08-09 THE L1.5 HALF OF THE EXIT TEST IS CLOSED, BY FIXING THE GENERATOR AND NOT THE BAND -- AND THE LEVEL DELIBERATELY DOES NOT MOVE. The demotion above named one exit test, ''must pass the two-level test'', and named two red cells on the DRAWN population: L1.2_day_to_day_shape_correlation and L1.5_max_multiplicity_share. L1.5 IS NOW GREEN AT 0/200 AND 0/60. L1.2 IS STILL RED AT 2/200 AND 1/60, so the exit test is not met, the level stays 2 and loop_stage stays build. Half an exit test is not a level. THE MECHANISM WAS MEASURED, NOT INFERRED (R9): for all 7 of the n=200 violators, EVERY occurrence of the most-repeated normalised fraction landed on an AWAY DAY -- 7 of 7, not a majority. Recomputing the identical statistic with away days excluded dropped all seven from 0.108-0.150 to 0.043-0.061, against an untouched 0.10 band. On P0108 the away-day total was 2.031360 kWh on all five of its away days, identical to six decimal places. WHY: every stochastic component in the generator is gated on occupancy -- appliance events, DHW events, EV charging, and the switched lighting/electronics banks all draw nothing when the house is empty -- which is correct individually and, taken together, left an away day as a constant standby plus a compressor square wave that depended on nothing. The empty house was a byte-identical clone of itself, which is precisely the artefact class L1.5 exists to detect. It was detecting it. THE FIX IS PHYSICS THE MODEL ALREADY HAD THE INPUTS FOR, WITH NO NEW UNANCHORED CONSTANT. A cold appliance is a thermostatic device: heat leaks into the cabinet in proportion to (room - cabinet) and the compressor must remove exactly that, so its DUTY is proportional to (room - cabinet) -- the same conductance argument W1_11 makes for the dwelling, one level down, and the linear-in-ambient form IEC 62552-3 itself relies on when it interpolates a declared annual consumption between two test ambients. Cabinet temperature is PUBLISHED REGULATION, not chosen: -18 C, the frozen-compartment target in EU Reg. 2019/2016 / IEC 62552-2, used for both specs because both have a frozen compartment and a domestic fridge-freezer''s single compressor works against a freezer-temperature evaporator. Reading the fresh-food target (+5 C) instead would make the sensitivity ~3x steeper, so -18 C is the CONSERVATIVE reading of the same regulation -- the right bias for a coupling introduced to remove an artefact (R12: the point is the mechanism, never the size of its effect on the statistic). THE REFERENCE AMBIENT IS NOT A CONSTANT EITHER: it is the premise''s OWN comfort setpoint, a value the model already holds per home, on the argument that ''0.32 duty'' describes a fridge in a normally-heated home and this home''s normal temperature is the one it heats itself to. A home sitting at its setpoint therefore draws EXACTLY what it drew before the coupling existed, and away days differ from each other because the weather does. The room is LAGGED ONE DAY and that is structural, not a shortcut: today''s cold-appliance energy is an input to today''s internal gain, which is an input to today''s thermal solve, so today''s indoor temperature cannot be read before it. R13 CLEAN: a baseline-fidelity change decided against a structural artefact detector, blind to company P&L; no company-layer file is touched and the new field is not on the seam. WHAT THE FIX COST, AND IT IS NOT NOTHING: the coupling means the FABRIC now moves an electricity stream, so `fabric_only_moves_level_and_character` -- the separability law -- went red, correctly. It was NOT silenced. The cold-appliance stream is now carried in its own field (`PremiseDayTrace.cold_appliance_kwh`) and the law compares behavioural electricity NET of it, on the argument that a fridge is a thermostatic device and not a behaviour. THE EXEMPTION IS PAID FOR RATHER THAN ASSERTED: `cold_appliance_load_tracks_the_room` states the coupling as a SIGNED claim (the colder home must use strictly less), RAISES on traces passed in the wrong order rather than silently inverting, and RAISES rather than passing vacuously when the two homes differ by under 0.5 C of mean indoor air. The mutation proving the separability law still has teeth perturbs the BEHAVIOURAL stream and leaves the cold stream alone, so it survives the netting. The netting introduced a 1e-12 kWh arithmetic bound ((x+c)-c is not bit-identical to x); it sits five orders above float noise and ten below the 0.01 kWh mutation, and that separation is itself asserted in the test. R15 BOTH WAYS, WITH THE REAL STATISTIC ON THE REAL BAND: test_the_L1_5_STRUCTURAL_CELL_fires_when_the_coupling_is_REMOVED monkeypatches `duty_at_room_temperature` back to the ambient-invariant constant, regenerates, and watches the actual max-multiplicity share go back over the actual 0.10 threshold at more than 3x the live value -- so the pass is a property of the generator, not of the statistic. Also proven to fire: a reference at the cabinet raises rather than dividing; the duty clamps to [0,1]; `cold_appliance_kwh` REFUSES to default the room (a default would be the fail-open shape -- a caller who forgot would silently get the defect back). ONE CONTROL LOST ITS LIVE VEHICLE AND THAT IS RECORDED, NOT PAPERED OVER: test_the_goal_seek_warning_needs_a_PREVALENCE_not_a_single_home used the population''s real 1/60 L1.5 breach as its low-prevalence arm. That breach is now fixed, so both arms are synthetic (`dataclasses.replace` on the same result object -- every field the warning reads is set explicitly and the warning is not stubbed). The witness that the generator can still produce a low-prevalence breach at all moved to the monkeypatch test above, and the docstring says so. WHAT L3 STILL NEEDS, unchanged and unclaimed: L1.2. Its 2/200 violators are electric_storage homes (P0197 0.8868, P0033 0.8595) and the cause is NOT away days -- excluding away days the correlation goes UP, 0.8868 to 0.9197, which rules the mechanism out rather than leaving it open. It is a separate question about whether a 0.85 band whose anchor text reasons from meals and showers can be applied to a home where a timer-controlled heating block dominates the meter, i.e. plausibly the 2026-08-08 gas-shaped-band class one cell over. No band was moved and no cell was marked UNVALIDATED; either would have turned the suite green in one edit, which is why neither was the move. Tests: 61 in tests/simulation/test_premise_trace.py (10 new), 131 in tests/harness/test_premise_two_level.py; epistemic_verifier PASS (535 files); size ratchet rc=0. Finding queued, not fixed on sight (SELF_INTERRUPT_DISCIPLINE): docs/staging/WORKER_FINDING_THE_ARTEFACT_HIDES_IN_THE_OFF_STATE_2026-08-09.md -- the class is that a generator''s determinism artefact hides in its OFF STATE, because every diversity mechanism is gated on some condition and where they all go false at once the skeleton is what is left.'
