  - '2026-08-09 THE RECORD HAD OUTRUN THE CODE, AND THIS TICK LANDED THE CODE. The evidence entry above describes the cold-appliance coupling in the past tense and is COMMITTED; the coupling itself was not. At the previous HEAD, simulation/premise_trace.py had no cold_appliance_kwh field, no duty_at_room_temperature and no room argument -- the whole fix sat UNCOMMITTED in the shared working tree, so the map asserted a mechanism that git did not contain and any reader reconstructing from the repo alone would have got the defect back. ADOPTED, NOT REBUILT (the standing rule when the draw guard flags unmerged work): the in-tree version was verified rather than re-derived, and it reproduces the entry''s own numbers exactly -- 192 passed, 2 xfailed across tests/simulation/test_premise_trace.py (61) and tests/harness/test_premise_two_level.py (131), which is the 61+131 the entry above claims. LANDING IT COST ONE CONTROL, MEASURED RATHER THAN GUESSED: tests/tools/test_couple_fabric.py::test_the_LAST_RED_CELL_closed_by_the_BAND_being_conditioned_not_moved went red, because it pinned worst_value == approx(0.1804) and the coupling moved D7 to 0.1782. ATTRIBUTION WAS MEASURED (R9), AND IT CORRECTS THE STAGED FINDING: docs/staging/WORKER_FINDING_FABRIC_WORST_VALUE_PIN_DRIFTED_2026-08-09.md reasoned ''no fabric source file is dirty in the working tree, so the failure reproduces at HEAD'' and guessed commit 25d317076. Both are wrong -- premise_trace.py WAS dirty, and restoring HEAD''s copy of that one file turns the test green again (1 passed) while the working copy turns it red, which is the direct measurement neither the finding nor its guess had. THE FIX IS THE CLASS FIX THE FINDING ASKED FOR, NOT A RE-PIN: the literal is GONE rather than retyped to 0.1782 (retyping is the R12 reflex -- moving the expected number to match the produced one, which would have discharged the test''s real claim with a number nobody re-checked). What the test is NAMED for is pinned instead -- the band is a FLOOR at an UNMOVED 0.15, its direction is asserted rather than assumed, and the worst home clears it on its own. R15 BOTH WAYS so the reshape is not a fail-open: the band-moved arm monkeypatches the REAL gas band down to 0.10, re-runs the REAL measurement and watches the ''not moved'' assertion reject it; the regression arm hands the REAL measured cell, with its worst value pushed under its own real floor, to the SAME expression the closure test depends on (extracted as _worst_cell_clears_its_own_floor so the mutation exercises the control rather than a re-typed copy beside it) and requires it to raise, with an unmutated call first so a control that raises on everything cannot pass. Asserting 0.14 < 0.15 in a test of my own writing was written and then DELETED -- it proves only that Python compares floats, the tautology shape this project keeps finding inside its own R15 evidence. NOT A SELF-INTERRUPT: this control was red under the change being landed, so fixing it was the cost of committing, not a finding acted on out of queue order. THE LEVEL STILL DOES NOT MOVE -- L1.2 is untouched and still red, so the exit test is still unmet, level stays 2 and loop_stage stays build. Tests at commit: 427 passed, 4 xfailed across the full consumer set (premise_trace, premise_two_level, couple_fabric, fabric_demand_path, fabric_physics, thermal_inference, fabric_intervention, gate_authorization); epistemic_verifier PASS (535 files); size ratchet rc=0.'
  - '2026-08-09 L2->L3 SELF-CERTIFIED. THE EXIT TEST IS MET ON THE DRAWN POPULATION, AND THE LAST RED CELL WAS THE CONTROL''S DEFECT, NOT THE GENERATOR''S. Exit test: ''must pass the two-level test''. tools/couple_fabric.py --population 200 --write-ledger, population_seed=17, same real Open-Meteo archive 2022-01-01..2022-04-30: is_red FALSE, failed [], inconclusive [], homes 200, every anchored L1 cell at 0 violations, in docs/observability/coupled_gap_ledger.json. Also green at n=60 on the suite''s own independent draw (trace seed 7). THE DEMOTION THIS REVERSES named two cells; L1.5 closed on 2026-08-09 by fixing the generator, and L1.2 closes here. THE MECHANISM WAS MEASURED, NOT INFERRED (R9). L1.2''s two n=200 violators (P0197 0.8836, P0033 0.8628, both electric_storage) were decomposed stream by stream. Day-to-day shape correlation of the HEATING stream, by regime: gas combi 0.9197 and gas system 0.9080 -- ON THE GAS METER, where L1.2 never sees it -- against electric storage 0.9133 ON THE ELECTRICITY METER, which it does. Behaviour, every regime: 0.21-0.32. The generator makes heat equally repeatable and behaviour equally diverse in EVERY regime; the only thing separating a home that breached L1.2 from one that did not is WHICH METER ITS HEAT LANDS ON, a fact about plumbing. That is the 2026-08-08 gas-shaped-band class one cell over, now confirmed rather than suspected (docs/staging/WORKER_FINDING_L1_2_BAND_MAY_BE_REGIME_BLIND_2026-08-09.md, whose own hypothesis -- a fixed overnight timer -- is REFUTED here: this model''s storage heater is a deadband thermostat, see below). THE FIX MOVES NO NUMBER AT ALL. The 0.85 threshold is untouched; what changed is WHAT IT IS APPLIED TO. Its anchor text describes a HOUSEHOLD (''meals, showers and departures move by tens of minutes''), so it is judged on the meter NET OF SPACE HEAT for every home (background/fabric_gap_ledger.py::meter_net_of_space_heat) -- the same load set a gas home''s electricity meter already carried. WHY NET RATHER THAN RE-DERIVE THE BAND, as L1.1 did: L1.1 is a ratio to the home''s own mean, so its regime band follows from published consumption shares by arithmetic; a correlation needs the heating stream''s OWN repeatability, for which no published figure exists, so any regime-specific L1.2 threshold would have been a number I chose. NO HOME WAS EXCLUDED TO GET GREEN, and that distinction is the whole point: all 200 are still judged, homes_unjudged 0. The netted homes'' behaviour scores 0.016-0.259 against a population median of 0.221 -- INSIDE the gas distribution, several of them at the diverse end -- and the worst L1.2 home in the population is now P0170, a gas home, at less than half the band. The netting is a BIT-IDENTICAL no-op for the 190 of 200 homes heated off the electricity meter (measured: max delta 0.000e+00). WHAT WAS REMOVED IS REPORTED, NOT DROPPED: the new cell L1.2h_heating_shape_repeatability measures the netted-out stream on exactly the homes it came from and is UNVALIDATED with a NEED anchor -- 0.9635 worst, P0197, i.e. the very home that used to fail L1.2, on the wire in the ledger. A published day-to-day shape correlation for a space-heating load would anchor it; the repo''s LCL extract cannot, holding only annual mean shapes. R15 BOTH WAYS, and the arm that matters is that leniency did not buy immunity: replaying one day''s shape through the netting on the rescued electrically-heated home takes the cell to exactly 1.0 and FAILS it, with that home named as worst. FAIL-CLOSED proven by removing the fact: the same population with the space-heat split stripped is judged on the whole meter and goes RED again on the same homes -- which is also the direct attribution that the pass is a property of the netting and of nothing else that moved this week. The guard REFUSES a stream that is not a component of the meter (larger than the meter over the window, negative, non-finite, misaligned), with an unmutated call first so a guard that raises on everything cannot pass. A vacuity guard asserts the drawn population contains homes of BOTH kinds, since the authored panel -- all gas -- would have passed whatever the netting did. REGISTERED, NOT HIDDEN (simplification 8): this model''s electric_storage home has no storage heater in it. ELECTRIC_STORAGE maps to ControlMode.ON_OFF_DEADBAND, and premise_trace.py contains no charge window, thermal store or Economy-7 calendar, against the repo''s own real-data archetype B (51.0% of daily energy in 00:00-06:00, LCL n=304). Queued, not fixed on sight: docs/staging/WORKER_FINDING_THE_MODELS_STORAGE_HEATER_IS_NOT_ONE_2026-08-09.md. It does not undercut this closure -- a real charge clock would make the heating stream MORE repeatable, not less. STOPS AT L3: Expert Hour not_attempted, and L1.2/L1.2h both still rest on domain knowledge rather than a metered anchor. Tests: 139 passed 1 xfailed (test_premise_two_level, the shipped-path pin correctly still red); 308 passed 2 xfailed across the consumer set (premise_trace, couple_fabric, fabric_demand_path, fabric_physics, thermal_inference, fabric_intervention).'
