  - '2026-08-09 L2->L3. EXIT TEST: ''must pass the two-level test''. It now does -- 7 anchored cells PASS, 2 UNVALIDATED (L1.4, L2.4, unchanged NEED), failed_levels [] in docs/observability/coupled_gap_ledger.json at this HEAD. THE LAST RED CELL WAS THE BAND, NOT THE GENERATOR. L1.1 texture (median|delta|/mean) was 0.1248 vs a 0.15 floor, worst home H10, the panel''s only heat-pump home; the 2026-08-08 finding decomposed the WHOLE of that deficit to the DENOMINATOR (heat pump = 49% of H10''s electricity, contributing ~no period-to-period movement) and the floor''s own anchor text reasons from a gas premise (''a kettle is 2.8 kW for three minutes on a ~0.7 kWh half-hour''). NOT DONE: the 0.15 floor is untouched and no cell was marked UNVALIDATED to duck a judgement -- either would have turned the suite green in one edit, which is why neither was the move (R12). DONE: L1.1 is conditioned on heating system, and the electrically-heated band is DERIVED from three published sources fetched this tick, not chosen -- Ofgem TDCV from 1 Jul 2026 (elec 2,500 / gas 9,500 kWh/yr), the EST/DECC in-situ condensing-boiler trial (mean measured COMBI efficiency 82.5%, sd 4.0%, vs SEDBUK 90.4%), and the DESNZ/ESC Electrification of Heat demonstration project (median ASHP SPFH4 2.78, IQR [2.55,3.05], n=428). 9500*0.825/2.78 = 2,819 kWh of heat-pump electricity against a 2,500 kWh behavioural baseline = 53.0% of the mean, so the band is 0.15*0.470 = 0.0705. Joint-corner envelope across both published spreads: 0.0655-0.0758. Anchors filed in docs/market_research/ASSUMPTIONS.md. R15 PROVEN, and proven with a NEW mutation because the old one was invalid here: _smooth RAISES texture on a heat-pump home (0.1069->0.1430) while lowering it on a gas home (0.2471->0.1539), so the proof uses _flatten_blend (monotone, daily-total-preserving). MATCHED-PAIR ANSWER TO ''YOU LOWERED A THRESHOLD'': on two homes identical but for the heating system, the electric band fires at 0.349 of the way to a flat day and the gas band at 0.396 -- the new band is the STRICTER of the two against the same defect. Fail-closed (a missing register fact lands on the 0.15 band), tautology-guarded (the flag is household.is_gas_heated, a register fact, never inferred from the series), misalignment refused. THE TELL: the worst L1.1 cell is no longer the heat-pump home at all -- it is D7, a GAS home at 0.1804 judged by the UNCHANGED 0.15 band. Tests: 155 passed, 1 xfailed (test_premise_two_level 89, test_couple_fabric, test_premise_trace); the shipped path''s strict-xfail pin still XFAILs. Stops at L3: Expert Hour not_attempted, and no published band exists for the texture statistic itself in EITHER fuel -- both bands remain a domain-knowledge floor and an arithmetic rescaling of it, stated as such in each anchor_source.'
  - docs/staging/WORKER_FINDING_L1_TEXTURE_BAND_IS_GAS_SHAPED_2026-08-08.md
