atom_id: W1_12_premise_trace_generator
simplifications:
- '2026-08-03 MINTED (worker tick) from docs/staging/ADVISOR_DISCOVERY_PREMISE_FABRIC_PHYSICS_2026-08-03.md. DISCOVER doc: docs/design/PREMISE_FABRIC_PHYSICS_DISCOVER.md; exit test: docs/design/PREMISE_TWO_LEVEL_TEST_HARNESS_SPEC.md. loop_stage: idle because that doc authorises DISCOVER+FRAME only. THE SEPARABILITY CONTRACT IS THE HARD REQUIREMENT (staged doc req 1): Layer 1 is a pure function of (fabric, weather, assets, setpoint schedule) and knows nothing of segments, engagement, psychology or tariffs; Layer 2''s ENTIRE influence on Layer 1 is three arguments -- setpoint schedule, gain profile Phi_p (which is also the hook for the appliance event stream supplying non-heating electricity texture), and the income/comfort constraint. Testable, not a convention: hold Layer 2 fixed and vary fabric -> only level+character move; hold fabric fixed and vary Layer 2 -> only timing+volume move. THE PREBOUND EFFECT MOVES HOME: it is today a hard-coded constant buried in Household.epc_consumption_multiplier''s docstring ("adjusted 50% toward 1.0 for prebound effect, Firth et al. 2013"); as a Layer 2 behavioural response to income stress and price it becomes a LIVE mechanism plugging into the existing IncomeStress enum and the self-rationing detector.'
- '2026-08-03 PREBOUND CHANNEL FED (worker tick, from W1_11 L2->L3 attempt). comfort_constraint_for has always accepted prior_year_bill_gbp and NO caller ever supplied it: the LIVE mechanism this atom FRAME promised ("the prebound effect moves home") had a DEAD input on every path, so a household in an expensive-to-heat dwelling heated to full SAP comfort forever. simulation/fabric_demand_path.py now threads it -- each calendar year constraint built from the trace own prior-year kWh at this module published reference price -- with NO coefficient touched. Two simplifications REGISTERED, not hidden: the reference price is FIXED (so no response to the 2021-22 crisis prices the household actually paid; closing that needs the tariff the company charged, i.e. a demand<->price coupling that belongs to THIS atom, not to the seam), and the bill is priced at a GAS reference rate so an electrically heated premise bill is understated and its response correspondingly weak (the whole book is gas-heated today). PremiseTrace gained final_state so a caller can generate the window in segments and CHAIN the thermal state across a life event; without it every boundary reset the walls to setback and injected a heating spike the premise never had.'
- '2026-08-03 FRAME -- POPULATION COHERENCE (hard requirement 6, "reconcile with, do not layer over"): fabric enters the EXISTING population fusion/joint-structure machinery (docs/market_research/POPULATION_COVERAGE_*.md) as a dimension with its own marginal AND its own joint constraints, NEVER as a bolt-on attribute sampled independently. Fabric correlates with tenure, income and region; independent sampling would break the fuel-poverty joint and produce a population in which nobody is both poor and in a leaky home -- the single most important cell for the mission. Fabric is ORTHOGONAL to the existing archetype dimensions (which are behavioural/commercial), so it is added as a CROSS-PRODUCT dimension joined at the premise, never merged into the archetype enum: collapsing it would destroy exactly the mission-relevant cases (fuel-poor solid-wall = the ECO/insulation target; affluent leaky detached = the heat-pump target). The segmentation/engagement/psychology work attaches UNCHANGED via the existing occupancy fields -- no segmentation rework is implied, and that is a deliberate design goal (the fabric layer must not fork the segmentation programme).'
- '2026-08-03 FRAME -- GAS: half-hourly BY CONSTRUCTION, daily BY EVIDENCE. The 2R2C model produces Phi_h at the simulation step regardless, so a half-hourly gas trace is free once W1_11 exists and truncating to daily would discard information the model already has. What is NOT free is evidence: public anchor data for half-hourly DOMESTIC gas texture is far weaker than for electricity, so the harness holds gas to DAILY validation targets (annual level and spread vs NEED, seasonal ratio -- currently ~4.6x and already good, per-home HDD-response gradient which today is one national constant GAS_HEATING_KWH_PER_DEGREE_DAY=8.0, day-to-day variability) and REGISTERS half-hourly gas texture as an explicitly UNVALIDATED SIMPLIFICATION. That is a deliberate recorded refusal to claim fidelity without an anchor, not an oversight -- claiming it would be unfalsifiable, which is what R15 exists to prevent.'
- '2026-08-03 FRAME -- SIZING QUESTION CARRIED FORWARD, not answered this pass: the computational cost of a per-premise 2R2C simulation across the full book at half-hourly resolution over ten years is not estimated. It is plausibly the BINDING constraint on this atom''s design and may force an archetype-and-perturb approach rather than true per-premise simulation. Answer it at this atom''s FRAME close before any BUILD shape is fixed.'
- '2026-08-03 BUILT L0->L2 (worker tick) BY ADOPTION of dead fork worktree-agent-a06fadd8d0c455a5c, NOT by a fresh build. The unmerged-work guard flagged simulation/premise_trace.py (1,683 lines) on a salvage commit; per "adopt, don''t rebuild" the branch was audited rather than re-implemented. DO NOT MERGE THAT BRANCH -- it is based on an OLD main, so a merge would revert ~18.6k lines; only the single file was taken across, and the branch remains unreaped. THE FORK DIED MID-WIRING AND LEFT TWO COUPLED DEFECTS, both fixed here and neither cosmetic: (1) NameError -- `BASE_LOAD_KW` was referenced in the period loop and defined nowhere, so generate_premise_trace RAISED on every call; the module had never once been executed. (2) The cold-appliance duty-cycle model (COLD_APPLIANCES, cold_appliance_phases, cold_appliance_kwh, _square_wave_on_hours) was fully written and NEVER CALLED -- dead code. These are one defect, not two: the module''s own note on _STANDBY_KW says a flat base load "would reproduce exactly the artefact this atom exists to remove (a smooth series), and adding noise instead would fail L1.5", so the fix was to wire the cycling model, never to define the missing flat constant. Cold-appliance energy now also enters internal gains at heat_fraction 1.0 (a compressor moves heat from its box to the room and its motor dissipates there), so premise electricity and premise internal gain cannot drift apart. MEASURED ON REAL WEATHER (sim/weather_data/C1.csv, 2022, Historical Ground Truth), the defect this atom exists to fix is closed: per-home HDD gradient spans 0.91-14.35 kWh/HDD across six fabric archetypes (spread 15.7x) against the shipped SINGLE NATIONAL CONSTANT GAS_HEATING_KWH_PER_DEGREE_DAY=8.0; annual gas 2,794-29,007 kWh against the demoted generator''s "annuals within 8%". THE SEPARABILITY CONTRACT (the atom''s hard requirement) IS PROVEN BOTH WAYS, not asserted: fabric varied with Layer 2 pinned moves heat 5,639->604 kWh while leaving the behavioural-electricity series and setpoint schedule bit-identical; Layer 2 varied with fabric pinned leaves free-running thermal character at 1.2803 vs 1.2818 C (tol 0.02). 46 tests green in 5.7s -- the fork wrote NO tests, so tests/simulation/test_premise_trace.py is new work this tick, and the module docstring''s own claim that each control "has a named mutation in tests/simulation/test_premise_trace.py that makes it fire" was FALSE-until-now (the file did not exist). R15 BOTH WAYS on every control: fabric_only (fires on a fabric leak into the appliance stream AND on a cloned home), behaviour_only (fires when behaviour moves the fabric AND when the seam is dead), away_days_are_representable (fires on the MEASURED shipped defect -- flooring the series to never drop below 0.05 kWh), hdd_response_varies_between_homes (fires on one national constant), annual_level_spread_is_material (fires on a population set to its own mean), daily_variability (fires on a smooth series), seasonal_gas_ratio (fires out of band), heat_pump_cop_falls_with_cold (fires on a flattened COP = today''s constant 1.2), prebound_response_is_live (fires on the shipped hard-coded constant AND on a non-monotone response). Fail-open closed: empty weather / missing archive / non-residential premise / non-finite temperature all RAISE, and NaN is rejected FIRST since band checks pass on NaN by luck not design. R12/R13 PRE-COMMITMENT: this is a BASELINE fidelity change decided blind to company P&L -- a 15.7x spread in per-home weather response will move imbalance and margin, and that is CORRECT, not a regression to tune back. DELIBERATELY L2, NOT THE L3 TARGET, and the COUPLED TRIAD is why: nothing is wired into demand_model.build_demand_shape or the settlement path, and the company twin C14_thermal_parameter_inference is still L0, so no company capability has faced these traces and there is NO belief-vs-truth gap to report. That wiring + the gap measurement IS the L2->L3 step, and W1_5_premise_demand_shape stays at its demoted L1 until it happens. Still open: gas half-hourly texture remains an explicitly UNVALIDATED SIMPLIFICATION per this atom''s own FRAME (no public anchor for domestic sub-daily gas); latitude is still a module default not a per-premise field; PV orientation and EV are wired but unanchored against a published source.'
