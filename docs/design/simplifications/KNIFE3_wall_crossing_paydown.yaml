  exit_evidence: 'STEP 24 (A_composition_lift, THE RENEWAL RATE CHAIN -- EVERY WRITER THAT MOVES THE NUMBER, IN ORDER),
    2026-08-13 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 3 EDGES CUT, 19 ->
    16 LIVE (17 -> 14 direct; the 2 indirect deliberately UNMOVED for the ELEVENTH consecutive step, which
    is again the proof that a bridge route was not silently taken instead). 91 ruled: cut 75, owed 16 (12 to
    A_composition_lift, 4 to B2 -- COUNTED FROM THE REGISTER''S OWN ROWS, not carried forward, because a
    step that subtracts from the previous one gets the split wrong; A''s 12 are
    company.policy.decision_policy, the saas.* set of 8, the 2 indirect and run_phase4c_on_phase2b ->
    company.billing.dd_review_runner), grandfathered 0 -- verified by tools/wall_crossing_dispositions.py
    rc=0 against THE WORKING TREE, not asserted. LEVEL DELIBERATELY STILL 0: 16 of 91 remain live, and
    booking the target at four-fifths-paid is the false-completion class this project names explicitly; do
    not bump level_target progress until owed=0. WHAT WAS CUT: the pricing/regulatory group on run_phase2b
    -- company.pricing.tariff_engine, company.pricing.margin_feedback, company.pricing.ofgem_price_cap.
    Every step from 17 onward named this group as standing. THE GROUP TEST PASSED, and the total is the most
    literal one yet: the unit rate the renewal is CONTRACTED at. The term is struck at a rate off the
    supplier''s own forward view, the portfolio premium multiplies it, the recovery surcharge multiplies
    that, the unprofitability uplift (behind its own door since step 22) adds to that, the cap clamps the
    result. Five writers, one number, and the arithmetic is a CHAIN -- reorder any two and the answer
    changes, a property three separate doors could not have. WHAT THE WORLD WAS DOING THAT IS NOT THE
    WORLD''S: slicing the supplier''s own margin history to the supplier''s own lookback depth
    (_portfolio_rates[-PORTFOLIO_PREMIUM_LOOKBACK:]); the recovery decision gated on term_index >= 1 typed
    at two separate sites; and sharpest, the supplier''s READING of who the price cap binds (cid in
    _RESI_CUSTOMER_IDS and term_tariff_type == fixed) -- the cap''s TEXT is a published commons both sides
    may read under the regulation-commons doctrine, but WHICH of its own products a supplier believes the
    cap binds is its own compliance reading and a real supplier gets fined for reading it wrong; the ORDER
    of the four writers, four separate blocks in a 2,800-line function with nothing asserting the sequence;
    the four publication records assembled inline; and _build_gas_renewal_schedule''s private
    CompanyTariffEngine() running get_forward_price for gas while quote_renewal ran the IDENTICAL sequence
    for electricity behind the B7 door. ONE DOOR FOR THE CHAIN AND A SECOND NARROWER ONE FOR THE FORWARD
    ESTIMATE: company/interfaces/renewal_rate_chain.py takes the renewal and returns the contracted rate
    with its decomposed spans; the gas forward estimate is answered by request_company_forward_estimate on
    the EXISTING company/interfaces/renewal_offer.py, because the gas schedule builds the term itself and
    needs only the one number that is the company''s -- routing it through request_renewal_offer would have
    made the world accept an electricity-shaped offer object it does not use, which is how a door starts
    lying about what crosses it. Both sides now call ONE estimate_forward_price in
    company/pricing/renewal_desk.py; the engine is a module-level singleton where the world held a per-call
    instance, and CompanyTariffEngine declares no __init__ and no instance state, so sharing it changes no
    answer -- CHECKED, not assumed, because a stateful engine shared across customers would have been a leak
    between them. NO NUMBER MOVES, MEASURED NOT ASSERTED: _drive_pre_cut is the term loop transcribed from
    simulation/run_phase2b.py as it stood at 42a37c640 -- the world file BEFORE the cut -- never from the
    module under test, which would be a mirror (R15 tautology). The comparison is the WHOLE result (rate,
    spans, all four log records, keys and order included) over the reference renewal AND over nine excluded
    cases: no locked rate, first term, non-domestic, pass-through, empty margin history, no prior term, gas,
    no settled book, and a term outside every cap window. Identity is claimed for the renewals that DO NOT
    fire as well as the one that does, because an eligibility rule copied slightly wrong shows up nowhere
    else. THE DEFECT THIS CUT REMOVES -- THE ORDER WAS INVISIBLE AND IS NOW A SIGNATURE: the cap is the last
    writer and the only one that can move a rate DOWN, and the uplift adds 5 GBP/MWh immediately before it.
    Nothing in the pre-cut code said so and nothing could have caught the two being swapped -- a supplier
    adding to a domestic fixed renewal AFTER clamping it is charging above the cap. The control performs
    exactly that reorder on a copy of the desk (a pure move of the uplift block, no expression changed) and
    asserts both that the answer moves AND that the reordered chain BREACHES the published cap, so it fails
    on the consequence rather than merely on a different number. THE DEFECT THIS CUT INVITES, for the FIFTH
    step running: four eligibility rules the caller can no longer see, each asserted against a case
    containing the thing excluded and mutation-proven by deleting the guard on a copy of the desk -- the
    cap''s domestic-AND-fixed test, the first-term guard shared by the premium and the surcharge, the no-
    locked-rate case, and None-versus-0.0 for a prior term (absence of a completed term is not a term that
    broke even; the call site passes prev_term_margin.get(cid) where the pre-cut code tested membership, and
    the two agree because every value written to that dict is a float at one site). THREE CONTROLS HAD THIS
    MODULE AS THEIR SUBJECT AND MOVED WITH IT, relocated not deleted: test_customer_profitability_seam''s
    control 3 followed the uplift CALL SITE into company/pricing/renewal_rate_chain.py (left pointing at
    run_phase2b.py it would have failed OPEN on an absent call, caught only by its own vacuity guard);
    test_intra_year_cap_window''s class control now names renewal_rate_chain.py as the clamp site (dropping
    it would have shrunk the class silently); and test_hedge_desk_seam''s control-3 mutation used a
    POSITIONAL source.replace(commodity=gas, ..., 1) whose subject is the file''s line order rather than the
    call it names -- step 24''s gas ask sits above the hedge call, so the mutation silently landed on an
    unrelated call and the control could no longer fire. It is now anchored on the decide-call''s own
    indentation with an assertion that the anchor is unique. THE CONTROLS:
    tests/company/interfaces/test_renewal_rate_chain_seam.py, 24 tests of which 4 are MUTATIONS THAT PERFORM
    the named defect (a lazy world import on a COPY of the source overlaid on sys.path, never a repo file
    edited mid-pytest-run; the chain reordered so the uplift escapes the cap; the cap eligibility rule
    widened; the first-term guard dropped). The read-direction control is BEHAVIOURAL -- a clean interpreter
