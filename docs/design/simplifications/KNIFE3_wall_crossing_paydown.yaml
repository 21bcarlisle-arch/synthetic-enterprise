  exit_evidence: "STEP 17 (A_composition_lift, THE STATUTORY RETURN IS THE SUPPLIER'S OWN ACCOUNTING), 2026-08-11 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 3 EDGES CUT, 39 -> 36 LIVE (37 -> 34 direct; the 2 indirect deliberately UNMOVED for the FOURTH consecutive step, which is again the proof that a bridge route was not silently taken instead). THIS IS THE FIRST CUT ON run_phase2b, the file every prior step deferred. LEVEL DELIBERATELY STILL 0: 36 of 91 remain live. WHAT WAS CUT: main() computed the supplier's whole annual statutory return itself -- Phase OG (Renewables Obligation), Phase OH (FiT levelisation levy), Phase OI (Climate Change Levy), three contiguous blocks reaching company.regulatory.roc_ledger, .fit_book and .ccl_ledger. It was not merely calling three company ledgers: it imported three PRIVATE rate tables across the wall (_ROC_OBLIGATION_LEVEL, _ROC_BUY_OUT_PRICE_GBP, _FIT_LEVELISATION_RATE_PER_MWH) to build the per-year figures, and the obligation level and buy-out price are the two numbers that DEFINE the supplier's RO liability -- the same shape of inversion as B2's, scaled down to constants. Working out what you owe under the RO, the FiT levelisation mechanism and the CCL off your own supply volumes is licensed-supplier statutory accounting, and getting it wrong is what Ofgem and HMRC fine suppliers for; it is not world physics. Now company/regulatory/statutory_obligations.py behind company/interfaces/statutory_obligations.py returning a StatutoryObligations; the world hands over the settled records and its own two I&C rosters as DATA. Register section 3l. THE GROUP ARGUMENT IS GENUINE HERE, which is worth saying because step 16's was not and said so: RO and FiT are computed off ONE shared accumulator -- annual electricity volume supplied (_elec_mwh_by_year in the code this replaced). Cutting them separately would have left the world holding that intermediate and threading it into both doors, which is a seam that publishes a PULL: half a cut. CCL joins them because it is the same process on the same input at the same point in the report -- one annual statutory return -- and it is the only one of the three that needs the segmentation. THE DEFECT THIS CUT INTRODUCES, and the control that fires on it: before the cut, CCL read ELEC_CUSTOMERS and GAS_CUSTOMERS at the point of use, so the elec roster could not arrive where the gas roster belonged. Now both are built at the call site and passed into one signature, and a swap -- or a dropped segment == 'I&C' filter -- would change every CCL figure while every test exercising the impl module directly stayed green, because the impl would be given exactly what the caller chose to give it. Control 3 is an AST check over the REAL call site in run_phase2b.py with a vacuity guard on the number of calls examined (zero calls -> every finding list is empty for free), plus two mutations that perform the swap and the dropped filter. Control 1 is the behavioural lazy-import detector, and its mutation is performed on a COPY of the real source so no repo file is edited mid-pytest-run (which would corrupt inspect.getsource for the rest of the session). Control 2 is identity against the PRE-CUT inlined sequence transcribed from run_phase2b.py as it stood at 57cb9d872 -- not from the module under test, which would be a mirror -- with a mutation that drops the RO commodity filter. The fixture years are 2017/2018 because the RO level, the FiT rate and BOTH CCL rates are non-zero there and the two fuel rates DIFFER (0.568 vs 0.198 p/kWh in 2017); a 2020 fixture would have a zero FiT rate and control 2 would pass with the FiT block deleted, and equal fuel rates would make control 3's swap undetectable. Both properties are asserted by the fixture's own vacuity test rather than left to the reader. THE RESIDUAL THIS STEP DECLINES TO FIX, named rather than quietly carried: FITBook.levelisation_charge_gbp(year, total_mwh_supplied) is called with _mwh_fit * 1000.0 and divides by 1000 internally, so the parameter named MWh is handed kWh and the two errors cancel -- the arithmetic is right and the naming is wrong. Found while transcribing, NOT repaired here: B7's rule is that a wall pass never moves a number in the same commit as an import, and this is one careless edit away from moving several. Logged as NAMING debt on company/regulatory/fit_book.py, not as a wall crossing, because it is not one. WHAT REMAINS: 31 direct + 2 indirect on run_phase2b, and they are FOUR groups rather than thirty-one items -- the trading desk (forward_book, hedge_decision, wholesale_credit_exposure, hedge_policy, collateral_death_test, margin_call_book), the CRM builders (churn_model, complaints, customer_profitability, enriched_churn_estimate, nps_tracker, payment_behaviour_analytics, satisfaction_accumulator, tpi_book, churn_accuracy_report), the pricing/regulatory group (tariff_engine, margin_feedback, ofgem_price_cap, decision_policy) and the saas.* set (cost_to_serve, customer_reaction, demand_response, growth_mandate, ledger, property_model, smart_meter_rollout, tariff_pricing). Plus B2's four customer_events edges (a coupled-triad build, which that design block explicitly forbids attempting as a mechanical move) and run_phase4c_on_phase2b's dd_review_runner routing residual. A FINDING ABOUT THE RECORD ITSELF, filed rather than propagated: step 16's exit_evidence CONTRADICTS ITSELF. Its headline reads '2 EDGES CUT, 41 -> 39 LIVE' while its EVIDENCE paragraph, evidently carried over from an earlier step, reports '45 live crossings (43 direct, 2 indirect); 91 ruled (cut 46, owed 45)'. Both cannot be true of one tree. The code was right throughout -- the live count is never maintained by hand where it matters, because tools/wall_crossing_dispositions.py prints it from the walker on every run -- but a record stating two counts for one tree is the 'one name, two numbers' class, and a reader re-deriving this atom's progress from its own store would have got the wrong number. EVIDENCE: tests/architecture/test_epistemic_wall_ratchet.py + test_epistemic_wall_indirect_ratchet.py + test_epistemic_wall_single_source.py 47 passed WITH the three LEGACY_SIM_READS_COMPANY tuples DELETED -- a stale allowlist entry fails this suite, so green here is the walker confirming the three edges are gone rather than a claim that they are; tests/company/interfaces/test_statutory_obligations_seam.py 9 passed, 3 of them mutations; tests/company/test_phase_og_roc_obligations.py + test_phase_oh_fit_levy.py + test_phase_oi_ccl_levy.py + tests/company/regulatory/ + tests/company/billing/test_phase_hg_fit_register.py 1628 passed; python3 -m tools.epistemic_verifier PASS over 551 company/ + saas/ files; tools/wall_crossing_dispositions.py rc 0 reporting '36 live crossings (34 direct, 2 indirect via a bridge package); 91 ruled (cut 55, owed 36, grandfathered 0)'; tools/knife_hotspot_measure.py wall_crossings 36 edges, KNIFE LEDGER OK. THE RUFF RATCHET RED IS NOT THIS STEP'S, and that is measured rather than asserted. tests/architecture/test_static_quality_ratchet.py's two census tests fail on the working tree -- and they fail IDENTICALLY on a clean `git archive HEAD` export (I001 1390 vs baseline 1384, E402 194 vs 193), so the breach predates this work. Per-file attribution against that same export: this step's ONLY I001 movement is simulation/run_phase2b.py 7 -> 4, i.e. MINUS three (three function-local import blocks deleted with the code); E402 is unchanged at 194; and the +1 F841 comes from tools/scale_probe_10k.py, another lane's UNCOMMITTED file. Under the repo's own ruff.toml run_phase2b goes 13 -> 10 findings, so this step is a net improvement on the very control that is red. The ratchet is not in the pre-commit gate's CONTROL_TESTS and tests_for() maps it to no path in this commit, so it does not gate this landing. Filed as a finding rather than fixed on sight (SELF_INTERRUPT_DISCIPLINE): the ratchet's own words forbid raising the baseline, and hunting the six pre-existing I001s across other lanes' committed files is a separate atom, not this pass's scope. level_current stays 0: 36 of 91 are still live, and booking the target at two-thirds-paid is the false-completion class."
