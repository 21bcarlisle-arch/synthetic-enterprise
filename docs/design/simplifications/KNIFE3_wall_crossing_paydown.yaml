ved.py, 11 tests, R15 BOTH DIRECTIONS -- mutating _SYN_MODAL_EPC_RATING or the company''s DEFAULT_EPC_RATING leaves the world''s dwelling unmoved, swapping the PUBLISHED C and F band shares MOVES it (so the world reads the anchor and not a third hardcoded letter), and test_the_suppliers_modal_band_is_still_reachable_without_the_worlds_dwelling is the vacuity guard proving the mutation is reachable at all. The no-fail-open control walks the AST of every non-test call site (not a text grep, which would count docstrings and then get muted) and fails if a consumer omits the world''s dwelling. WHAT WAS NOT DONE, NAMED: the edge simulation.run_phase2b -> saas.property_model is STILL OWED and still uncut, because the FILING is wrong and the module is immovable on step 30''s own re-measurement; and the AUTHORED cohort''s dwelling is still a hand-written fixture, so premise_population''s objection (the population was composed by whoever wrote the fixture) now survives in exactly one place, the seven authored homes. Live state: docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md section 3z. || STEP 30 (B12_the_dwelling_is_the_worlds_and_the_company_only_discovers_it, THE DWELLING A DRAWN HOUSEHOLD LIVES IN), 2026-08-17 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. NO EDGE CUT; 8 LIVE, UNCHANGED (6 direct + 2 indirect; the 2 indirect now deliberately UNMOVED for the SEVENTEENTH consecutive step). 91 ruled: cut 83, owed 8, grandfathered 0 -- verified by tools/wall_crossing_dispositions.py rc=0 against THE WORKING TREE. THE OWED SPLIT CHANGED WITHOUT THE TOTAL MOVING: 4 to A_composition_lift (company.policy.decision_policy, the 2 indirect, and run_phase4c_on_phase2b -> company.billing.dd_review_runner), 1 to the NEW block B12, 3 to B2 -- COUNTED FROM THE REGISTER''S OWN OWED ROWS, never carried forward by subtraction. LEVEL DELIBERATELY STILL 0. THIS STEP IS A RE-RULING AND CUTS NOTHING, which §3w and §3x both established is legitimate when the re-ruling is the work -- and here it is load-bearing, because the cheap cut available would have killed the edge while BANKING the defect that makes the edge matter. WHAT WAS RE-RULED: simulation.run_phase2b -> saas.property_model, which §3v asked the next step to re-rule on its OWN evidence rather than inherit §3u''s move ruling or §3v''s door ruling. It is NOT a composition -- a dwelling''s type/EPC/bedrooms/occupancy/people/heating/assets is not a supplier decision, and company/crm/property_discovery.py already calls this module ''the sim-side ground truth'' on ''the far side of the epistemic wall''. THE FILING IS WRONG AND THE MODULE IS IMMOVABLE: both B1 safety measurements were RE-TAKEN by AST walk and BOTH FAIL -- FOUR company-side importers, not zero (saas/home_move_win_rate.py:40 takes _epc_rating_of; saas/customers.py takes ASSET_PROFILE_BY_CUSTOMER at 318, get_smart_meter_status at 490, _derive_syn_property_fields/_home_type_of at 507), so a git mv creates class-(a) company -> simulation edges; and the module is NOT stdlib-only (saas.smart_meter_rollout deferred at line 282), so it creates a sim -> company edge in the other direction. The five company/crm/* hits that look like importers are NOT -- they import company.crm.property_model, the company''s own belief-side module, same basename and opposite side of the wall. THE REASON THE CHEAP CUT IS REFUSED, and it is a finding in its own right: build_properties() fills a DRAWN (SYN-*) household''s dwelling by calling _derive_syn_property_fields(), whose own docstring says it returns ''saas-side approximations'' of the observable consumption_band -- so the world''s ground truth for a drawn home IS the supplier''s guess about it. That is B2''s inversion applied to dwelling physics, and it was MEASURED rather than argued: the company''s zero-knowledge fallback (company/crm/property_discovery.py DEFAULT_EPC_RATING = EPCRating.D at DEFAULT_ASSUMPTION_CONFIDENCE 0.1) is correct for 2/2 = 100% of the DRAWN cohort and 3/7 