  exit_evidence: "STEP 20 (A_composition_lift, THE CHURN BELIEF IS THE SUPPLIER'S AND THE DICE ROLL NEVER WAS), 2026-08-12 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 3 EDGES CUT, 31 -> 28 LIVE (29 -> 26 direct; the 2 indirect deliberately UNMOVED for the SEVENTH consecutive step, which is again the proof that a bridge route was not silently taken instead). 91 ruled: cut 63, owed 28, grandfathered 0. LEVEL DELIBERATELY STILL 0: 28 of 91 remain live, and booking the target at two-thirds-paid is the false-completion class. THIS RECORD IS BEING UPDATED IN THE SAME CHANGE SET AS THE CODE, which is the remedy step 19 stated procedurally after steps 18 and 19 both landed code + register without touching this file: a KNIFE step is not done at green, it is done at LANDED-AND-RECORDED. WHAT WAS CUT: run_phase2b.py::main() chose between the company's two churn estimators itself, assembled their keyword arguments itself, knew the industry base rate to fall back on when an account had no rate history, knew how many renewals the company thinks a post-crisis hangover lasts, computed the gas leg's monitoring estimate, and ran the company's own calibration report at the end of the run. Three crossings: company.crm.churn_model, company.crm.enriched_churn_estimate, company.analytics.churn_accuracy_report. Now company/crm/churn_desk.py takes one RenewalObservation behind company/interfaces/churn_estimation.py and returns a probability. Forming a view on who is about to leave is a supplier's own commercial judgement and it is ALLOWED TO BE WRONG -- that wrongness is the quantity the COUPLED TRIAD scores. Register section 3o. THE HALF THAT MAKES IT A CUT RATHER THAN A RE-EXPORT GOES THE OTHER WAY, and it is the finding of this step: two of the symbols run_phase2b imported from company/crm/churn_model.py were NEVER the company's. is_active_renewal ROLLS THE DICE on whether a household actually shops at renewal -- a supplier does not roll that dice, it OBSERVES the outcome off its own books (did this account take a new fixed deal or roll onto SVT), and event['is_active_renewal'] is how the observation reaches the company. PASSIVE_CHURN_CAP is labelled '# SIM ground-truth cap for passive churn rolls' IN THE COMPANY MODULE'S OWN SOURCE and was passed straight into roll_lifecycle_event(passive_churn_cap=...) to clamp the customer's REAL churn probability. Both now live in simulation/renewal_engagement.py on the world's side. This is B3_world_needs_its_own_cap_physics' shape for the THIRD time (register 3a for the price-cap schedule, 3g for the churn ceiling, 3o here) and the recurrence is the point: the misfiling is SYSTEMATIC, not incidental -- world physics keeps ending up in company/crm/ because that is where the churn VOCABULARY lives, and a name is not a wall. A remaining group under this design may therefore need a cut in the OTHER direction before its door is honest; check for that before assuming the rest are pure composition lifts. THE COMPANY KEEPS ITS OWN CAP AND NOTHING PINS THE TWO EQUAL: company.crm.churn_model.PASSIVE_CHURN_CAP stays exactly where it is as the company's ESTIMATE of the cap. It is NOT a donated residual -- estimate_passive_churn_probability reads it -- and test_the_same_mutation_does_move_the_companys_own_answer proves that liveness rather than assuming it, which is the vacuity guard 3g's independence test would otherwise be missing. No test asserts the two constants are equal: that would restore in the suite precisely the coupling the cut removes from the code (the refusal recorded for B3, B7 and 3g, for the fourth time). Drift is a finding for the harness to report, never something the suite pins shut (R12). NO NUMBER MOVES, MEASURED NOT ASSERTED: rolls_active_renewal reproduces is_active_renewal's draw exactly -- same seed string, same comparison, same crisis-year short-circuit -- checked against the sequence TRANSCRIBED FROM 7a199defe (that commit confirmed to EXIST and to CONTAIN the block by its own test, per [[feedback_a_mint_sources_cited_design_anchor_has_never_existed]]), over 400 seeds x 4 years and again with threaded per-customer probabilities. Both caps are 0.10; both estimators are called with the same arguments in the same order at the same rounding. THE DEFECT THIS CUT INVITES -- THE BRANCH BECAME A FIELD: before the cut, active-versus-passive was a BRANCH at the point of use (if not active_renewal and segment_for_churn != 'I&C'), so a caller could not estimate a passive roller as an active shopper without deleting a visible if. It is now one boolean on a dataclass DEFAULTING TO True. A caller that hardcodes it, or drops the field, silently switches ~65% of resi renewals onto the wrong estimator and EVERY test exercising the desk directly stays green, because the desk gets exactly what the caller chose to give it. Control 3 is therefore an AST check over the REAL call site in run_phase2b.py with a vacuity guard on the number of constructions examined, and two mutations performing the defect (the hardcoded flag; the old/new rate swap). Control 4 covers the mirror-image defect INSIDE the desk -- the two estimators collapsing into one -- by asserting the passive arm is genuinely inert relative to the active arm, with a mutation that builds the collapsed shape and shows the assertion failing on it. A FINDING THE CONTROL SURFACED, KEPT RATHER THAN TUNED AWAY: control 2's per-keyword sensitivity sweep FAILED on its first run -- on the ACTIVE arm, bill_shock_count, behaviour_score and satisfaction_score move the estimate by exactly nothing. Not a defect in the cut: both estimators combine as max(rate_estimate, payment_estimate), and at a +33% rate rise the rate arm dominates, so the entire payment/experience signal is MASKED. It is live on the PASSIVE arm, whose rate sensitivity is deliberately near-inert -- the whole reason Phase QK extended the enriched estimate to passive rollers. The control was split per-arm with the reason written into it, rather than the fixture being reshaped until the assertion passed; a fixture chosen to make an assertion pass is not evidence. The masking itself is a fidelity question the company's model owns and is NOT repaired here (B7: a wall pass never moves a number in the same commit as an import). A SECOND FINDING, NOT MINE AND FIXED ANYWAY: the ruff ratchet was RED AT PRISTINE HEAD on F401 (281 vs the frozen 279) -- the class test_static_quality_ratchet.py's own line ~197 already records. Proven pre-existing rather than assumed: the per-file F401 census of this working tree is BIT-IDENTICAL to a clean `git archive HEAD` extract, and the two offenders (tools/orphan_ratchet.py unused `ast`, site/customers/test_wall_exhibit.py unused `tempfile`) landed in the preceding six commits from other lanes. FIXED rather than baselined, which is that ratchet's own stated remedy. This step also SHRANK I001 1380 -> 1379 as a side effect (run_phase2b lost one un-sorted import block), and the baseline was lowered accordingly -- a stale entry left unlowered is how the floor stops holding. WHAT DID NOT FALL: run_phase2b keeps 21 direct + 2 indirect -- measured, not carried forward. THE CRM GROUP IS NOT ONE GROUP BUT THREE PROCESSES, and this step took the first. What remains of it is the customer-experience record (satisfaction_accumulator, nps_tracker, complaints, payment_behaviour_analytics -- four stateful books opened at setup, fed through the loop, read at the end) and the commercial pair (customer_profitability, tpi_book). Register 3l named the nine as one group because they share a PACKAGE; the step template's rule is a group sharing one INTERMEDIATE, which is a process, and company.crm is not one. Deviation from the design block's own sequencing, logged with its reason (LAW A) in 3o and in the design block itself. Beyond the CRM builders: the trading desk (forward_book, hedge_decision, hedge_policy), the pricing/regulatory group (tariff_engine, margin_feedback, ofgem_price_cap, decision_policy) and the saas.* set (8) -- 6 + 3 + 4 + 8 = 21, arithmetic written out. Beyond this module: simulation.customer_events' four edges (B2, a coupled-triad build, which that design block explicitly forbids attempting as a mechanical move) and run_phase4c_on_phase2b's dd_review_runner routing residual (register 3h). STEP 17'S NAMED RESIDUAL IS STILL OPEN and is repeated rather than dropped: FITBook.levelisation_charge_gbp(year, total_mwh_supplied) is handed kWh and divides by 1000 internally -- arithmetic right, naming wrong. NAMING debt on company/regulatory/fit_book.py, not a wall crossing."
