  origin_note: 'COORDINATION WALL, director-stated: the Epoch-3 adapter programme is the BOUNDARY half of this knife and is NOT duplicated here -- CHECK IT BEFORE STARTING, or two lanes cut the same seam. This pass CONTAINS passes 1 and 2 by file set (33 files including all 3 of pass 1''s and all 16 of pass 2''s), which is why depends_on chains it behind both: drawn earlier it would re-cut edges another pass owns. Its own file_scope is deliberately narrow -- the SIM-side files it touches are whatever survives, enumerated at draw time by tools/knife_hotspot_measure.py, because freezing them today would be a lie by the time this is drawn.'
  name: 'KNIFE pass 3 of 4 (AO5), LAST of the three wall passes. Cut the crossings that survive passes 1 and 2. STALE-DOORBELL NOTICE (REWRITTEN 2026-08-19, step 51). THIS FIELD ASSERTS NO LANDING, AND THAT IS DELIBERATE: every version since step 36 claimed one and fourteen were false, for a structural reason -- it is written by the step about to fail the check it describes, so a landing claim here is unfalsifiable at write time. Steps 36-50 spend it as a mechanism; it survives ONLY as a pointer to the tool. THE FIRST STEP DESCRIBED BELOW IS DONE: build_edges/company_reads_sim/sim_reads_company live in tools/epistemic_wall.py as the one shared definition, enforced by tests/architecture/test_epistemic_wall_single_source.py. PARTIALLY BUILT: 51 steps. DO NOT REDRAW AS IF FROM ZERO. RUN THE TOOL, DO NOT READ COUNTS HERE -- AND KNOW WHICH INSTRUMENT YOU ARE HOLDING, because step 51 found every previous step misreading one of them. `python3 -m tools.wall_crossing_dispositions` measures the WORKING TREE. `--at-head` is ASYMMETRIC BY DESIGN: it reads the WORKING-TREE REGISTER against HEAD''s CODE, because the register is the CLAIM and HEAD is what must honour it -- so the `cut 86, owed 5` in its output IS THE DESK''S CLAIM AND NOT HEAD''S COUNT, so step 45''s headline inference (HEAD moved to cut 86, the re-ruling landed, the cut''s two halves got separated) IS FALSE. Step 51 read HEAD''s row table directly: `git cat-file -p HEAD:<register>` rules that edge `disposition=owed`. NEITHER half landed; there is no separation to explain, there is one commit never made. `--at-tree HEAD` is the SYMMETRIC instrument (both sides from one tree) and no step had used it to state HEAD -- it reports HEAD self-consistent, a live edge ruled `owed`, which is exactly why no in-tree control has ever been red (3aj). RUN --at-head BEFORE PLANNING AND BEFORE CLOSING: it is the only thing that has ever caught this, now 14 for 14. BUILT is not LANDED, and a step whose whole deliverable is a landing has not STARTED until `git cat-file` finds it. BUILD THE COMMIT''S TREE AND TEST IN IT -- a real `git worktree`, NOT a `git archive` extract: an extract has no .git, so the committed-store/discharge controls fail on the technique, not the change (3ao lost 18 tests that way). A DIRTY SHARED TREE IS NOT A CHANGE SET, and a pathspec built from a diff lists what you CHANGED, never what your change NEEDS. THE RUFF RATCHET IS RED AT HEAD AND THIS LANE DOES NOT OWN IT. Step 51 measured a pristine HEAD worktree: F401 276 vs baseline 278 and I001 1369 vs 1373 (both DOWN), but F541 28 vs 27 and E741 110 vs 108 are UP -- so 3ap''s claim that every rule moves DOWN is false of two, and this field''s own previous census (I001 1365) was wrong too. The KNIFE change set reproduces those four figures BYTE-IDENTICALLY, i.e. it is ratchet-NEUTRAL, so tests/architecture/test_static_quality_ratchet.py and tools/revenue_sanity_check.py are OUT of the pathspec -- they do not fix the redness, the gate selects by filename stem and does not name them, and WORKER_FINDING_THE_RUFF_RATCHET_IS_RED_AT_HEAD_2026-08-14 owns that repair. THE REPLACEMENT CONTROL IS STILL BLOCKED -- DO NOT QUEUE IT A SEVENTH TIME (3ai, 3aj, 3ak already did). It is a supervisor DRAW RUNG comparing the walker at HEAD against the working tree (WORKER_FINDING_A_LANDING_STEP_CAN_ONLY_BE_CAUGHT_BY_A_TREE_IT_DOES_NOT_CONTROL_2026-08-18); background/supervisor.py carries another lane''s uncommitted 308-line change AND is live to the tick, so the rung lands only after that lane does. 3aj states why NO in-tree test can ever be that control. LIVE STATE per the register''s own owed rows (never by subtraction): 91 ruled, 5 owed -- 3 to B2_company_brain_decides_the_world, 2 to B14_the_run_does_not_measure_itself, matching knife_hotspot_measure.py''s live 5 (3 direct + 2 indirect). A_composition_lift and B12 are both EXECUTED and their design blocks have MOVED TO 3a -- do not plan against either. ONLY TWO DESIGNS REMAIN AND NEITHER IS MECHANICAL. B2 is the coupled-triad build: simulation.customer_events imports the company''s churn model, churn-risk model and home-move win rates to decide WHO ACTUALLY CHURNS, so the company''s belief cannot be wrong about churn because it IS churn -- its block says in as many words it must NOT be attempted as a mechanical move, and twice now an edge parked here turned out to be B3''s cheap constant instead, so CHECK IT ACTUALLY DECIDES WHO CHURNS before treating it as B2. B14''s cut is written in 3 with its one measured cost stated up front: scoring outside the run means PERSISTING the hidden payment truth, so a step taking it must say where that artefact lives and why the company cannot read it; its 2 rows are INDIRECT, and an indirect row prints `hops=` (the SHORTEST bridge chain) while `entries` names EVERY first-hop bridge -- QUOTE `entries`, NEVER `hops` (step 32 named a cut off hops alone; step 33 measured it and it cut NOTHING). level_current is DELIBERATELY still 0 at 5/91 remaining -- booking the target at ninety-five-percent-paid is the false-completion class this project names explicitly; do not bump level_target progress until owed=0. Original text preserved below for provenance. || ORIGINAL: FIRST STEP, BEFORE ANY CUT: lift build_edges / company_reads_sim / sim_reads_company out of tests/architecture/test_epistemic_wall_ratchet.py into a shared module so the ratchet, the KNIFE ledger and this pass read ONE definition of ''a crossing''. That extraction is deliberately deferred to here rather than done while planning, because moving the net while planning the cuts is the error the MAP->NET->KNIFE sequence exists to prevent. EXIT: stated when the pass is drawn, against the count that survives passes 1 and 2 -- NOT against today''s 107, which will be stale.'
