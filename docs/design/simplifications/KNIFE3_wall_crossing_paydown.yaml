  exit_evidence: "STEP 19 (A_composition_lift, THE CREDIT AND COLLATERAL DESK IS THE SUPPLIER'S OWN TREASURY), 2026-08-12 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 3 EDGES CUT, 34 -> 31 LIVE (32 -> 29 direct; the 2 indirect deliberately UNMOVED for the SIXTH consecutive step, which is again the proof that a bridge route was not silently taken instead). LEVEL DELIBERATELY STILL 0: 31 of 91 remain live. READ THIS FIRST, IT IS A FINDING ABOUT THIS RECORD, not about the code: STEPS 18 AND 19 EACH LANDED THEIR CODE AND THEIR REGISTER SECTION WITHOUT UPDATING THIS FILE. Step 18 (9ef7d5d6e, flexibility revenue, register 3m, 36 -> 34) and step 19's build were both complete and green, and this record still read STEP 17 / '36 of 91 live' -- so an atom two steps further on than its own store said. Worse, step 19's whole change set (3 new files, 2 modified, the register section) was sitting UNCOMMITTED on the shared tree when this tick drew the atom: the code, the ratchet allowlist and the register all AGREED with each other, so every control was green in the working tree and nothing anywhere was red. Nothing would have caught it -- the class is 'the code outran the record', the mirror of the recorded one, and on a shared tree with concurrent writers the orphan was one sweeping commit away from being landed under another lane's message or lost with a pruned worktree. The remedy applied here is procedural and stated so it is not mistaken for a mechanism: a KNIFE step is not done at green, it is done at LANDED-AND-RECORDED. WHAT WAS CUT (step 19): run_phase2b.py::main() ran the supplier's whole treasury close itself -- it marked the company's own trading book at an end-of-run observable forward snapshot, built the wholesale credit register, sampled the retained book semi-annually to find the peak exposure a single end-of-run mark misses, derived the variation margin the company owes where it is out-of-the-money, and ran the MC-2 breaking-strain sweep against the real 2021-22 replay. Three crossings: company.trading.wholesale_credit_exposure, company.finance.margin_call_book, company.risk.collateral_death_test. Now company/risk/counterparty_collateral_desk.py behind company/interfaces/counterparty_collateral.py returning a CounterpartyCollateral; the world hands over the book it holds, its customer register's commodity column and the two PUBLIC spot histories as DATA through one signature. Marking your own open positions, sizing a counterparty line, working out the variation margin you owe under a CSA and asking at what price move your facility breaks are the treasury and credit-risk functions of a licensed supplier; they are not physics, and the company is allowed to be wrong about all four -- a supplier that misjudges exactly this is a supplier that fails in a spike. Register section 3n. THE IMPORT COUNT UNDERSTATES WHAT MOVED, again: main() was couriering a company intermediate between two company computations -- peak_sample_date is produced inside the credit block's semi-annual sampling loop, threaded out into a local and passed back into the death test to choose its stressed date. That thread is now internal to the desk that owns both ends of it. THE GROUP ARGUMENT IS GENUINE HERE, which is worth saying because step 16's was not and said so: all three read ONE shared intermediate, exposure_by_counterparty -- the ISDA-netted per-counterparty MtM at the mark. The credit register is its long side, the margin book is its exact sign-complement, and the death test re-marks the same live book at a second date. Cut separately, the world would have been left holding both _exposure and peak_sample_date and threading them into three doors: a seam that publishes a PULL, which is half a cut. THE DEFECT THIS CUT COULD HAVE INTRODUCED, and the control on it: before the cut, fuel was paired to record list in an inline tuple at the point of use, so elec_records could not arrive where gas_records belonged. That pairing now spans a signature, and a swap moves every forward mark and therefore every credit and margin figure in the run -- while every test exercising the impl module directly stays green, because the impl is given exactly what the caller chose to give it. Two things answer it: the parameters are keyword-only and separately named (elec_spot_records / gas_spot_records), so the swap has to be written out in full; and control 3 is an AST check over the REAL call site in run_phase2b.py with a vacuity guard on the number of calls examined (zero calls -> the finding list is empty for free), a mutation performing the swap, and a SECOND mutation proving the swap is a real defect rather than a cosmetic one (the peak exposure moves). THE DEFECT THE DOOR ITSELF INVITES -- two failure domains, one try/except: the pre-cut code was two independent try/except blocks with a stated property, that a failure in the credit feed must not kill the death test and a partially-built credit summary is not discarded when the margin half fails. One door invites one try/except and NOTHING WOULD EVER NOTICE, because on a healthy run both succeed -- the collapse is invisible until the day something breaks, which is the day it matters. So the isolation lives inside the desk and the two exceptions are returned ON the result (credit_feed_error, death_test_error) for main() to print exactly the two warnings it printed before. Control 4 injects a book that raises on the credit path only and asserts the death test still produced its summary, then the mirror, then a mutation that builds the collapsed single-try shape and shows control 4's assertion failing on it. VACUITY, and why the fixture is what it is -- three properties asserted rather than left to the reader: DAILY spot history rather than sampled, because CompanyTariffEngine.get_forward_price refuses a mark on fewer than 30 records in its lookback window and a refused mark empties the credit register, so every control below would pass on nothing; FOUR different counterparties, because the obvious customer ids all hash to ICE_CLEAR_EUROPE where ISDA netting collapses the in- and out-of-the-money legs into one net position (zero credit exposure, zero margin, both sides of the book invisible); and TWO FUELS MARKED FAR APART (~GBP95 and ~GBP28/MWh), because on equal spot histories control 3's swap produces identical marks and cannot fail. CONTROL 2 IS NOT A MIRROR, and that was checked rather than asserted: the pre-cut sequence is transcribed from run_phase2b.py as it stood at 7237c67a9 -- that commit was confirmed to exist and to contain the inlined block, per [[feedback_a_mint_sources_cited_design_anchor_has_never_existed]] -- and the transcription was diffed against the real pre-cut source, not taken on trust. Its mutation drops the June marks from the sampling loop and shows the identity comparison failing. WHAT DID NOT FALL: run_phase2b keeps 24 direct + 2 indirect -- measured, not carried forward -- in four groups: the trading desk that OPENS the positions (forward_book, hedge_decision, hedge_policy; a different cut, living in the per-customer term loop rather than the close), the CRM builders (churn_model, complaints, customer_profitability, enriched_churn_estimate, nps_tracker, payment_behaviour_analytics, satisfaction_accumulator, tpi_book, churn_accuracy_report), the pricing/regulatory group (tariff_engine, margin_feedback, ofgem_price_cap, decision_policy) and the saas.* set (cost_to_serve, customer_reaction, demand_response, growth_mandate, ledger, property_model, smart_meter_rollout, tariff_pricing) -- 3 + 9 + 4 + 8 = 24, arithmetic written out. Beyond this module: simulation.customer_events' four edges (B2, a coupled-triad build, which that design block explicitly forbids attempting as a mechanical move) and run_phase4c_on_phase2b's dd_review_runner routing residual (register 3h). STEP 17'S NAMED RESIDUAL IS STILL OPEN and is repeated rather than dropped: FITBook.levelisation_charge_gbp(year, total_mwh_supplied) is handed kWh and divides by 1000 internally, so the arithmetic is right and the naming is wrong. NAMING debt on company/regulatory/fit_book.py, not a wall crossing. EVIDENCE (measured on the landed tree, commit f3de95f94, surgical_land receipt consistent: tree d3c964b46, 6 paths, gate-rc 0): tests/company/interfaces/test_counterparty_collateral_seam.py 14 passed, 5 of them mutations; tests/architecture/test_epistemic_wall_ratchet.py + test_epistemic_wall_single_source.py + tests/tools/test_wall_crossing_dispositions.py + the seam test 92 passed WITH the three LEGACY_SIM_READS_COMPANY tuples DELETED -- a stale allowlist entry fails this suite, so green here is the walker confirming the three edges are gone rather than a claim that they are; tests/company/risk + tests/company/trading + tests/company/finance 1781 passed; python3 -m tools.epistemic_verifier PASS over 555 company/ + saas/ files; tools/wall_crossing_dispositions.py rc 0 reporting '31 live crossings (29 direct, 2 indirect via a bridge package); 91 ruled (cut 60, owed 31, grandfathered 0)'; tools/knife_hotspot_measure.py wall_crossings 3 files / 31 edges, KNIFE LEDGER OK; simulation.run_phase2b and the desk both import clean and no reference to the moved symbols survives in run_phase2b.py. level_current stays 0: 31 of 91 are still live, and booking the target at two-thirds-paid is the false-completion class."
