  exit_evidence: 'STEP 6 (THE CUT CONTINUES), 13 of 88 crossings CUT as of 2026-08-10 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. LEVEL DELIBERATELY STILL 0: 75 crossings remain `owed`, so booking the target level at 15 percent paid would be the false-completion class this project keeps a rule for. THIS TICK CUT B7 (4 edges: simulation.renewals -> company.governance.approval_interface, company.governance.decision_rights, company.pricing.tariff_engine, saas.tariff_pricing) -- the design the register itself named as the right place to prove the composition template before the ten big shape-A harnesses. COORDINATION WALL RE-CHECKED FIRST as the origin_note requires, not inherited from the prior step: EP7-EP14 all read level 0 / loop_stage idle / file_scope [] at this draw. THE CUT, AND THE SPLIT IS THE WHOLE OF IT: what stays in simulation/renewals.py is the renewal EVENT -- the term calendar, the contiguity rule, the 42-day statutory notice period, the deemed gap, the world own forward estimate and the published levy/network schedules. What left is the renewal OFFER, decided in a new company-side module company/pricing/renewal_desk.py and asked for through a new door company/interfaces/renewal_offer.py, which returns FOUR NUMBERS: the rate quoted, the forward the company priced off, and the two cost components it chose to lock. Which forward it used, what it locks for which product, how it priced, and whether the move needed an approval are no longer readable from the world. THE DESK IS DELIBERATELY NOT IN company/interfaces/: the seam package is meant to read as a list of doors, and letting a pricing-and-governance organ live there would make it the second place company decisions are made, which is how a chokepoint stops being one. Both packages are WALKED by tools/epistemic_wall.py byte for byte -- the ratchet own published SEAM_PACKAGE remedy, the same reasoning as B5 and B8 and the opposite of the tools/ relocation section 2b refused. TWO CONSTANTS CHANGED HANDS, which is the point of the cut rather than a side effect: the naked fraction now comes from company.risk.hedge_policy.COMPANY_MIN_HEDGE_FLOOR (0.85) instead of sim.hedging_strategy.MIN_HEDGE_FLOOR (0.85) -- the company own mandate, whose module docstring already claimed ownership of the hedging decision from Phase 2b and which simulation/run_phase2b.py already prefers; and the escalation threshold is now the desk own constant CALIBRATED to the same 0.20 the world bill-shock tracker counts, rather than an import of simulation.bill_shock_tracker.BILL_SHOCK_THRESHOLD. Both were numerically identical before and after; what changed is WHOSE number it is. Reading sim.hedging_strategy from the desk would have been a class-(a) crossing, the direction the ratchet holds at ZERO. THE DIVERGENCE IS NOT PINNED BY A TEST and that is deliberate: a test asserting the two threshold readings equal would restore in the suite exactly the coupling the cut removes from the code, which is the trap B3 design block already recorded. BEHAVIOUR IDENTITY MEASURED, NOT ASSERTED: 876 combinations of (price shape x tariff type x segment x EAC x deemed gap x weather function x term window) covering 3,504 terms and 1,896 governance events, canonicalised schedules AND decision log, hash to the SAME value 225f5d13cfeed4f2746d1f575dec2003f85ec18637b2f49306d1d550732fe471 before and after -- ZERO mismatches. VACUITY GUARDED ON BOTH BRANCHES THAT MATTER: 144 of the events are non-routine (the pending->resolved approval pair) and 12 calls exercise the cold-start fallback; a grid landing only on routine warm-start fixed terms would have passed against a stub. R15 PROVEN BOTH WAYS ON THE REAL TREE: re-introducing a company.pricing.tariff_engine import into simulation/renewals.py reds the ratchet naming simulation/renewals.py:32 AND reds tools/wall_crossing_dispositions.py with `ruled `cut` but the import IS STILL IN THE TREE`; the mutation was restored and the restoration VERIFIED byte-equal against a backup (cmp), not assumed. NEW R15 CONTROL: tests/company/interfaces/test_renewal_offer_seam.py, 12 tests, policing three properties the cut rests on that NO other instrument sees. (a) THE DOOR COULD BE WIDENED WITHOUT MOVING A SINGLE WALL EDGE -- re-exporting price_fixed_tariff, or re-exporting the desk own quote_renewal so a caller can step past the door narrow signature, or adding an engine=/desk= convenience default, all restore the removed dependency while the ratchet stays green, because the SIM import still terminates on the exempt seam package. This is why request_renewal_offer imports quote_renewal INSIDE the function body rather than at module level; the walker descends into function bodies (ast.walk) so nothing about the measurement changes, but the door namespace holds only the two exported names. (b) THE GOVERNANCE ROUTING COULD GO QUIET FOR A WHOLE PRODUCT -- a desk that skipped routing for pass-through terms would move no rate, break no schedule, and turn a governed decision into an ungoverned one while every test that does not read the decision log stayed green (FAIL-SILENT); the control counts events against the OFFER rather than against a list of product names, so a fourth tariff type cannot slip through ungoverned. (c) THE COLD-START FALLBACK COULD BE DROPPED, mispricing exactly the customers whose first term opens at the start of history; the control forces an empty lookback window and carries a VACUITY GUARD asserting the engine really raised. All three mutations PERFORM the defect on the real source file; the mutant is loaded as a THROWAWAY module under a fresh name rather than by importlib.reload, because reload updates a namespace in place and never removes names -- a re-export mutation would survive its own restoration and change the identity of RenewalOffer under every other test in the file, which is a mutation harness that damages the suite it protects. Restoration verified byte-equal inside the context manager exit. THE FOUR ALLOWLIST TUPLES ARE DELETED from the ratchet, so the floor moved down with the code and the edges cannot return silently. HONEST RESIDUAL, NAMED NOT IMPLIED: quote_renewal takes fallback_forward_price_gbp_per_mwh -- on a first term the company notice-date lookback window can be empty, its engine raises, and the pre-cut code fell back to the SIM own forward estimate. That is a real leak (a supplier cold-start rule should be its own) and it is PRESERVED rather than repaired because repairing it moves priced rates, and a wall pass that moves a price in the same commit as an import has given up the only thing that makes the move reviewable. The parameter is NAMED for what it is so the next reader sees the leak instead of inheriting it invisibly. Unlike B5 residual this one is NOT structurally blocked -- it is a company-side design question a later pass can answer alone. UNLIKE B5 THIS IS NOT HALF A DESIGN: B7 as written asks for the world to receive the offer THROUGH THE SEAM, so a request answered at the door IS the shape, not a substitute for a push that could not be built. REGISTER UPDATED: the 4 rows move owed->cut each carrying a substantive reason=, the B7 design block moves OUT of the WALL-CROSSING-DESIGN markers into section 3a because the tool rules that a design no owed row references is a plan for nothing, and the prose header was corrected from 79/NINE to 75/THIRTEEN rather than left to rot beside a tool-printed number. MEASURED: 79 -> 75 live crossings, 18 -> 17 files (tools/knife_hotspot_measure.py and tools/wall_crossing_dispositions.py agree, both OK). tools/epistemic_wall.py NOT EDITED in this cutting commit, which is the wall the pass set for itself. Suites: tests/architecture/ + the two ledger suites + tests/company/interfaces/ 283 passed; static quality ratchet 13 passed after the new module I001 was fixed AT SOURCE (never by raising the count), so the isort floor is unmoved at 1385; epistemic_verifier PASS over 537 files. STILL OWED: 75 edges across 4 designs -- B2 (the worst inversion, a coupled-triad build), B3 (put back down at step 4, blocked on three design questions), B4 (4 edges, billing mechanics reached directly -- the next small one, and the pattern it will hit is B5 push-vs-pull), and A_composition_lift (65 edges, 10 harnesses). PRIOR RECORD FOLLOWS. STEP 5 (THE CUT CONTINUES), 9 of 88 crossings CUT as of 2026-08-10 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. LEVEL DELIBERATELY STILL 0: 79 crossings remain `owed`, so booking the target level at 10 percent paid would be the false-completion class this project keeps a rule for. THIS TICK CUT B5 (1 edge, simulation.arrears_engine -> company.policy.decision_policy). COORDINATION WALL RE-CHECKED FIRST as the origin_note requires, not inherited from the prior step: EP7-EP14 all read level 0 / loop_stage idle / file_scope [] at this draw. THE CUT: a new seam module company/interfaces/collections_communication.py publishes ONE string per (customer, period) -- the tone of the dunning letter that arrived -- while DecisionPolicy, its tone_mode and its A/B split stay unreachable from the SIM. The applicability guard (which bills involve a dunning letter at all) stayed SIM-side on purpose: that is a fact about how this world bills people, not a company decision, and moving it would have widened the door for nothing. Same walked-destination reasoning as B8, applied not assumed: company/interfaces/ IS walked by tools/epistemic_wall.py byte for byte, so this is the ratchet''s own published SEAM_PACKAGE remedy and not the tools/ relocation section 2b refused. HALF THE DESIGN, AND THE MISSING HALF IS NAMED RATHER THAN IMPLIED: B5 asks for a PUSH (tone stamped on an emitted collections-action event); what landed is a PULL through a named door. The blocker is structural and was MEASURED, not assumed -- the bill dicts all four consumers read are built by simulation/run_phase4c_on_phase2b.py::build_monthly_bills, a SIM composition root carrying 14 owed edges of its own, so there is no company-side emitter to stamp onto. Stamping anyway would have meant the SIM writing a value it had just pulled from the company and reading its own stamp back: the shape of a push with the substance of a pull, and a worse artefact than an honest pull because the next reader would believe the event contract existed. Residual recorded as owed to A_composition_lift in the register''s section 3a, not left to be rediscovered. BEHAVIOUR IDENTITY MEASURED, NOT ASSERTED: 27,090 (method, customer_id, period_end) combinations compared between the new path and the pre-cut expression -- ZERO mismatches, with both cohort arms and the None guard branch exercised, so no payment outcome, no written-off GBP and no board figure moves. R15 PROVEN BOTH WAYS ON THE REAL TREE: re-introducing the import reds the ratchet naming simulation/arrears_engine.py:362 AND reds tools/wall_crossing_dispositions.py with `ruled `cut` but the import IS STILL IN THE TREE`; the mutation was restored and the restoration VERIFIED byte-equal against a backup (cmp), not assumed. NEW R15 CONTROL: tests/company/interfaces/test_collections_communication_seam.py, 12 tests, policing the two properties the CUT rests on that NO other instrument sees -- (a) the seam must not hand back the policy object, because a `policy: DecisionPolicy = CURRENT_POLICY` convenience argument or a widened __all__ would restore the removed dependency WITHOUT creating a single wall edge (the import would still terminate on the exempt seam package, so the ratchet is blind to it by construction); and (b) the tone VALUES must be unchanged, since four consumers resolve payment outcomes from a shared per-bill RNG substream and a changed tone would move written-off GBP while every test that does not compute a payment outcome stayed green -- FAIL-SILENT. Both mutation proofs perform the defect rather than asserting it impossible, and the identity check carries a VACUITY GUARD asserting its sample covers both cohort arms (a sample landing on one arm would pass against a constant-returning seam). The __all__ mutation runs on the module''s SOURCE TEXT rather than the imported object, so no restoration step can be forgotten and leave the tree dirty. THE ALLOWLIST TUPLE IS DELETED from the ratchet, so the floor moved down with the code and the edge cannot return silently. tools/epistemic_wall.py NOT EDITED in this cutting commit, which is the wall the pass set for itself. REGISTER UPDATED: the B5 row moves owed->cut carrying a substantive reason, its design block moves OUT of the WALL-CROSSING-DESIGN markers into section 3a because the tool rules that a design no owed row references is a plan for nothing; the stale prose header (`81 still live`, `Seven have since been CUT`) was corrected to 79/NINE rather than left to rot beside a tool-printed number. MEASURED: 80 -> 79 live crossings, 19 -> 18 files (tools/knife_hotspot_measure.py and tools/wall_crossing_dispositions.py agree, both `OK`). Suites: tests/architecture/ + the two ledger suites 114 passed; the consumer behaviour suites (arrears_engine, dd_collection_book, company/interfaces, company/policy) 245 passed; static quality ratchet 13 passed, so the new module did NOT perturb the isort floor; epistemic_verifier PASS over 535 files. ONE FINDING QUEUED NOT FIXED (SELF_INTERRUPT_DISCIPLINE): the tone resolves against the LIVE CURRENT_POLICY, which is pre-existing and preserved byte for byte -- but tools/run_frozen_baseline.py runs a NAIVE arm whose tone_mode is `firm_toned` rather than `ab_test`, and that arm''s arrears tone never switches with it, so the published counterfactual is not the naive company. Filed as docs/staging/WORKER_FINDING_THE_NAIVE_ARM_KEEPS_THE_LIVE_TONE_2026-08-10.md with the R10 class version (framing_mode is a live candidate for the identical bug). Fixing it inside a wall pass would have moved a simulated payment outcome in the same commit that moved an import. STILL OWED: 79 edges across 5 designs -- B2 (the worst inversion, a coupled-triad build), B3 (put back down at step 4, blocked on three design questions), B4, B7, and A_composition_lift (65 edges, 10 harnesses). PRIOR RECORD FOLLOWS. STEP 3 (THE CUT) IS UNDER WAY, 7 of 88 crossings CUT as of 2026-08-09 — this atom is PARTIALLY built and must NOT be re-drawn as if from zero (see finding 1 below for what that failure looks like). LEVEL DELIBERATELY STILL 0: 81 crossings remain `owed` with their killing designs named, and a paydown atom that books its target level at 8 percent paid would be the false-completion class this project keeps a rule for. THIS TICK CUT B1 AND B8, the two the register named cheapest-and-genuine. B1 (6 edges): reputation_index, resentment_ledger and activation_energy moved from company/core/ to simulation/ — world physics that was filed company-side, so six SIM modules were reaching across the wall to read their own physics. Safe by MEASUREMENT taken immediately before the move, not by the ruling: zero company-side importers (so no company-reads-sim edge could be created) AND stdlib-only imports in all three (so no sim-reads-company edge could be created either — the second half the ruling had not checked). The one non-test reference in company/billing/dd_review_runner.py is a docstring path, verified as prose not an import. B8 (1 edge): publish_feed moved to company/interfaces/market_feed_publication.py so the LEGITIMATE world-publishes-prices crossing lands on the walked seam and is exempt by the published SEAM rule; company/market/price_feed.py keeps PriceFeed and its two company-side consumers and deliberately does NOT re-export the moved function, since a re-export would leave the non-seam import path alive. NEITHER MOVE IS LAUNDERING and the distinction was applied, not assumed: both destinations are WALKED by tools/epistemic_wall.py, unlike the tools/ relocation this pass refused in writing at step 2. R15, PROVEN BOTH WAYS ON THE REAL TREE: re-introducing the B8 import reds the ratchet naming simulation/publish_market_feed.py:21 AND reds tools/wall_crossing_dispositions.py with `ruled `cut` but the import IS STILL IN THE TREE`; re-introducing a B1 import reds the ratchet naming simulation/churn_journey.py:35. Both mutations restored and the restoration VERIFIED byte-equal against backups, not assumed. THE SEVEN ALLOWLIST TUPLES ARE DELETED from the ratchet, so the floor moved down with the code and the edges cannot return silently. TWO CONTROLS NEEDED REPAIR, both of the same class this pass has now hit three times — a control that dies when the codebase reaches its goal state: (a) tests/tools/test_wall_crossing_dispositions.py::test_the_live_register_examines_every_live_crossing asserted rows == live crossings, which holds only while ZERO edges have been cut; repaired at the STATISTIC to the partition rows == live + cut (a cut row is KEPT, because deleting it is how a re-entry becomes invisible), extracted as partition_gap() so it could be mutation-proven on fixtures rather than only against today tree state, plus a vacuity twin proving it passes on a fixture that CONTAINS a cut. (b) the ruff I001 floor: renaming an import changed its alphabetical position, so three moved unit-test modules sorted dirty at the new path; fixed at source per the ratchet own remedy (never by raising a count), which landed the census at 1385 rather than back at 1386 because one of the three was already an offender under its old name — floor and RUFF_BASELINE_TOTAL both shrunk with the reason recorded in the shrink log. REGISTER UPDATED: the 7 rows move owed->cut, each carrying a substantive reason= saying how it died; the B1 and B8 design blocks move OUT of the WALL-CROSSING-DESIGN markers into a new section 3a (Cuts EXECUTED), because the tool rules that a design no owed row references is a plan for nothing — the rationale is kept, the plan is not. COORDINATION WALL RE-CHECKED FIRST as the origin_note requires, not inherited from step 2: EP7-EP14 all read level 0 / loop_stage idle / file_scope [] at this draw. MEASURED: 88 -> 81 live crossings (tools/knife_hotspot_measure.py and tools/wall_crossing_dispositions.py agree); tools/epistemic_wall.py NOT EDITED in this cutting commit (git status clean on it), which is the wall the pass set for itself. Suites: tests/architecture/ + tests/tools/test_wall_crossing_dispositions.py + tests/tools/test_knife_hotspot_measure.py 114 passed; the 8 touched behaviour suites 141 passed; epistemic_verifier PASS. STILL OWED: 81 edges across 7 designs — B2 (the worst inversion, a coupled-triad build, NOT a mechanical move), B3-B7, and A_composition_lift (65 edges, 10 harnesses). PRIOR RECORD FOLLOWS. Coordination wall CHECKED FIRST, as the wall specifies: EP7-EP14 are all level 0 / loop_stage idle / file_scope [], so no lane is cutting this seam. Measured count this pass is scored against: 88 class-(b) edges across 23 files (`python3 tools/knife_hotspot_measure.py`), class (a) at zero. THE EXTRACTION: build_edges/company_reads_sim/sim_reads_company + perimeter + seam now live once in tools/epistemic_wall.py; the ratchet (gate), tools/knife_hotspot_measure.py (ledger) and tools/epistemic_verifier.py (phase-close scanner) all import it. The dated ALLOWLISTS deliberately stayed in the ratchet — definition shared, policy baseline not — and are byte-unchanged across this commit, so the ratchet''s floor is provably unmoved by the extraction (the origin_note wall against moving the instrument and the measured thing together). R15 CONTROL: tests/architecture/test_epistemic_wall_single_source.py, 15 tests, asserting OBJECT IDENTITY not equal answers (two identical copies of the walker compare EQUAL on today''s tree and are exactly the defect). Both mutation proofs run and restored: re-adding a private build_edges to the ratchet reds 2 tests; restoring APPROVED_ORCHESTRATION reds 3. FOUR FINDINGS. (1) THE CONTROL FAILED ON ITS FIRST RUN AND NAMED ITS OWN AUTHOR: tools/epistemic_wall.py ALREADY EXISTED, untracked, in no commit, imported by nothing — an earlier attempt at this identical extraction that died before wiring. Disposition per the standing unmerged-work rule: ADOPT, DO NOT REBUILD — the found file is the survivor, this pass''s copy was deleted, and the pass''s additions (is_sim_module/is_company_module, the wiring, the control) went on top; provenance recorded in the module docstring. (2) The stale APPROVED_ORCHESTRATION carve-out is DELETED, closing pass 1''s queued finding: it exempted exactly the two class-(a) edges pass 1 cut, i.e. a pre-authorised re-entry — and it was PINNED GREEN by two assertions in tests/controls/test_control_mutation.py, which are now inverted with the reason in place. (3) A second, undocumented escape hatch went with it: APPROVED_SEAM was matched as a SUBSTRING OF THE OFFENDING LINE, so a trailing `# company/interfaces/sim_interface` comment cleared a real crossing in the regex fallback. Deleted; EXEMPT_PATHS is now DERIVED from the shared SEAM_PACKAGE, closing the file-vs-package divergence pass 2 recorded as this extraction''s second referent. (4) TWO OF THE LEDGER''S OWN MUTATION PROOFS WERE RED AT HEAD, caused by pass 2: they pinned whichever real overlap the tree carried, pass 2 cut the last sixteen, and the guards died — a control whose fixture needs a LIVE instance of the defect dies exactly when the codebase reaches its goal state, and total disjointness IS the goal state. Repaired at the STATISTIC: the overlap is manufactured on the measured side, plus a vacuity twin proving silence without it. EXIT NOW STATED, as conditions not a number (R12/LAW A, following pass 4''s withdrawal of ''the count falls''): every one of the 88 crossings carries a disposition (cut with its allowlist tuple deleted, or explicitly grandfathered with a reason) — no edge survives UNEXAMINED; nothing routed through a package the walker does not walk; the walker never edited in a cutting commit; wall 4 stated as having no byte-comparable artefact. THE CUT IS DECOMPOSED AND IT IS NOT ONE SHAPE: (A) 67 edges / 10 simulation/run_phase*.py modules that are COMPOSITION ROOTS, not the world — scenario harnesses running a world and a company together, run_phase2b.py alone 2,954 lines and 34 edges; cut by pass 1''s template (composition belongs above both layers). (B) 21 edges / 13 modules of genuine world-physics-reads-company-brain; cut by pass 2''s template (a designed seam per population). B is the smaller count and the harder work — each is a wall-DESIGN question, not a mechanical move. Suites green: tests/architecture/ 66 passed (ratchet 12/12 including both mutation proofs), tests/tools/test_knife_hotspot_measure.py 26 passed, tests/controls/test_control_mutation.py green. Verifier PASS over the same 501 company/+saas/ files before and after; ledger numbers identical before and after (88 edges / 23 files) — the extraction is behaviour-preserving, measured on both sides. Ruff I001 fixed at source rather than by raising the frozen baseline.'
