  exit_evidence: 'STEP 32 (RE-RULE ALL FOUR PROVISIONAL A ROWS, THEN CUT THE ONE THE RE-RULING FREED), 2026-08-17 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. ONE EDGE CUT: 8 -> 7 LIVE (6 -> 5 direct; the 2 indirect untouched). 91 ruled: cut 84, owed 7 (3 A_composition_lift, 1 B12, 3 B2), grandfathered 0 -- verified by tools/wall_crossing_dispositions.py rc=0 against THE WORKING TREE. LEVEL DELIBERATELY STILL 0. simulation/run_phase4c_on_phase2b.py now has ZERO live crossings. WHAT WAS ASKED: 3y closed by telling the next step to treat A''s four remaining rows as PROVISIONAL because steps 28/29/30 each found a mis-ruling there. All four were re-ruled and register 3aa records each, including the two where the answer was THE RULING STANDS -- a re-ruling that only reports the rows it wants to move is a search, not an audit. THE MIS-RULING, AND IT IS A NEW SHAPE: run_phase4c_on_phase2b -> company.billing.dd_review_runner was owed to a design that had EXCUSED ITSELF FROM CUTTING IT IN WRITING, TWICE -- the run module''s own docstring ("no further composition lift removes it") and company/interfaces/billing_experience.py''s ("it is the one this design was never going to cut"). Both sentences were TRUE; what was wrong is that the row then sat owed to that design for seven more steps. An owed row whose named design has publicly declared the edge out of scope is a DECORATIVE NOMINATION, and it is the one shape wall_crossing_dispositions.py cannot catch: its DECORATIVE set holds "later"/"tbd", and this design= field named a real block that really exists. THE RE-RULING: there being no process to lift does not make an edge uncuttable -- it makes the remedy a DOOR rather than a lift, and a door is a COMPLETE remedy for a routing residual. What the edge carried was REACHABILITY: importing the runner handed the world review() (the supplier''s SLC 27B +/-5% variance reading), DDAction, DDReviewBook and LARGE_INCREASE_THRESHOLD_PCT (its own 15% bill-shock cut). Minted as B13_the_annual_dd_review_is_the_suppliers_own_desk and executed in the same step on the B10/B11 precedent. AS BUILT: company/interfaces/dd_review.py -- the world hands over its own issued bills and takes back the SERIALISED review, so NO COMPANY TYPE CROSSES AT ALL, stronger than the four sibling doors on this module which each return a view object; free here only because the single call site already called .serialise() on the next line. NO NUMBER MOVES BY CONSTRUCTION (the door''s body IS the pre-cut expression) -- which is exactly why the R15 suite contains NO before/after comparison: re-running the same expression and comparing is R15''s TAUTOLOGY pattern and would pass whatever the desk did. THE DOOR''S FIRST DRAFT LEAKED AND ITS OWN CONTROL CAUGHT IT: written with a module-scope import it bound run_annual_reviews into the seam''s namespace, so a SIM caller could have written `from company.interfaces.dd_review import run_annual_reviews` and obtained the desk''s object-returning entry point through a path THE RATCHET EXEMPTS (it terminates under SEAM_PACKAGE) -- the cut defeated invisibly, by an import the ratchet is designed not to complain about. The import is now function-scope and the control is written against REACHABILITY rather than __all__, which is why it fired. This generalises to every door in this register. CONTROLS: tests/company/interfaces/test_dd_review_seam.py, 13 tests -- control 1 the door widening (reachability, plus the return value carrying no company type), control 2 the values hand-computed from the PUBLISHED ADDR rule and never imported from the desk, control 3 an AST census over simulation/ at EVERY scope catching the function-scope import the ratchet cannot see; 5 mutations each performing its own named defect, vacuity guards on the census (parsed>50) and on branch coverage (all three of increase/decrease/maintain must fire). The ratchet allowlist entry was DELETED, not edited -- tests/architecture/test_epistemic_wall_ratchet.py, 697 passed across architecture + the interfaces suite. THE OTHER THREE ROWS: decision_policy STANDS (everything DecisionPolicy holds is a supplier decision; no B1/B3/B10/B11/B12 shape applies) but is SHARPENED -- it is TWO processes, the retention offer (1348/1362/1370) and the hedge decision (1849/1980), and neither alone kills the edge, so a step taking one group and reporting the edge as falling will be wrong; the framing half is B5''s subject in a second channel and collections_communication.py already cut the sibling. The 2 INDIRECT rows via background.live_payment_triad are CONTESTED and deliberately NOT MOVED: their stated cut is the file move 2b REFUSED for this exact file, and what crosses is HARNESS code (background/ is the one place documented as permitted to hold hidden SIM truth and company belief side by side) rather than a supplier routine the world composes -- the candidate cut needs measuring because the triad supplies the run''s canonical payment events at 2067, and minting a design on an unmeasured hypothesis is what 3y''s DISCOVER filing was for. Do not cite them as owed to A without reading 3aa. || STEP 31 (B12 BUILD HALF -- THE WORLD DREW THE HOME IT HAD BEEN LETTING THE SUPPLIER IMAGINE), 2026-08-17 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. NO EDGE CUT; 8 LIVE, UNCHANGED (6 direct + 2 indirect). 91 ruled: cut 83, owed 8 (4 A_composition_lift, 1 B12, 3 B2), grandfathered 0 -- verified by tools/wall_crossing_dispositions.py rc=0 against THE WORKING TREE. LEVEL DELIBERATELY STILL 0. THIS STEP IS A DEFECT REPAIR, NOT A DISPOSITION: it discharges the BLOCKING finding this pass filed at step 30 (docs/staging/done/WORKER_FINDING_THE_WORLDS_DWELLING_FOR_A_DRAWN_HOME_IS_THE_COMPANYS_OWN_ESTIMATE_2026-08-17.md, lane W4_the_wall, drawn ahead of the queue under OPS12 clause 3). THE BLOCK DIED ON A GREP, WHICH IS THE LESSON: step 30 filed a DISCOVER half because "that anchor is not in the tree", and the anchor had