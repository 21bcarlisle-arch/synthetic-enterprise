  exit_evidence: 'STEP 29 (B11_default_incidence_is_the_worlds, THE BAD DEBT THE SUPPLIER PROVIDED FOR WAS THE BAD DEBT THAT HAPPENED), 2026-08-14 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 1 EDGE CUT, 9 -> 8 LIVE (7 -> 6 direct; the 2 indirect deliberately UNMOVED for the SIXTEENTH consecutive step, which is again the proof that a bridge route was not silently taken instead of a cut). 91 ruled: cut 83, owed 8 (5 to A_composition_lift, 3 to B2 -- COUNTED FROM THE REGISTER''S OWN OWED ROWS, not carried forward, because a step that subtracts from the previous one gets the split wrong; A''s 5 are company.policy.decision_policy, saas.property_model, the 2 indirect and run_phase4c_on_phase2b -> company.billing.dd_review_runner), grandfathered 0 -- verified by tools/wall_crossing_dispositions.py rc=0 against THE WORKING TREE, not asserted, and cross-checked against tools/knife_hotspot_measure.py''s independent 8. LEVEL DELIBERATELY STILL 0: 8 of 91 remain live; booking the target at eleven-twelfths-paid is the false-completion class this project names explicitly. WHAT WAS CUT: saas.cost_to_serve on run_phase2b, which was ruled A_composition_lift and is the SECOND consecutive step to find a mis-ruling there -- A is the default home for everything on that file and a default home is where mis-rulings accumulate, so its 5 remaining rows should be read as PROVISIONAL. Nothing here was composed: the settlement loop accrued bad_debt_gbp at get_bad_debt_rate(), THE SUPPLIER''S PROVISIONING TABLE, so the fraction of revenue this supplier PROVIDED FOR was the fraction that actually went bad. THE CROSSING WAS WRITTEN DOWN IN THE SUPPLIER''S OWN DOCSTRING and read past for four months -- saas/cost_to_serve.py said BAD_DEBT_RATE/get_bad_debt_rate() ''remain in this module only because simulation/run_phase2b.py still uses them''. Worth keeping as a class: a module explaining why a name survives is naming its only consumer, and if that consumer is across the wall the docstring is an unfiled crossing report. WHY IT MATTERS: this project has already MEASURED the provision wrong, by ~30x, when Phase QD replaced it with the emergent arrears model -- so the one quantity here with a known quantified error had no way to express it, and the COUPLED TRIAD''s score for it was a guaranteed zero. Worse, bad_debt_gbp reduces net_margin_gbp, which accumulates into treasury, which is read by is_administration_triggered(treasury): the supplier''s own provisioning assumption decided whether the supplier went bust mid-run. HALF THE PHYSICS WAS ALREADY HOME, which is what made the edge easy to miss -- the multiplier beside it, simulation.payment_timing.stress_bad_debt_multiplier, is world-side and always has been. The world owned how much HARDER a stressed household finds it to pay and borrowed only the level it multiplied. NOT A DOOR AND NOT A MODULE MOVE, the third shape again (B3''s shape applied to an INCIDENCE): a door would launder a dependency the world does not legitimately need, because whether a customer pays is not a supplier decision; and saas/cost_to_serve.py is correctly filed, its subject being the supplier''s per-account overhead. The world gets its own table -- simulation/bad_debt_incidence.py, importing nothing. The supplier keeps BAD_DEBT_RATE/get_bad_debt_rate() UNCHANGED as its provision, free to be wrong. THE TRANSIENCE IS STATED because it is the obvious objection: on a full run run_phase4c_on_phase2b''s apply_emergent_bad_debt() overwrites every value written here. That is an argument about ONE CALLER, not about the module -- run_phase2b is a legitimate entry point on its own and inside it the number is live all the way to the administration trigger, so deleting the accrual would have been a behaviour change dressed as a cut. BEHAVIOUR PINNED PRE-CUT, never re-recorded from the post-cut tree: get_bad_debt_rate was run BEFORE the call site was switched and the answers transcribed as LITERALS -- three segment baselines, the full 2016-2024 grid including the 2021-22 crisis surge, both fallback edges (2010, 2030) and the unrecognised-segment fallback at every year. ONE PIN IS A FINDING RATHER THAN A CONFIRMATION: the run window is 2016-01-01 to 2025-06-07 and the table stops at 2024, so the last five months of every full run accrue at the ordinary-year baseline. Pinned deliberately (2025 -> baseline) so the gap is visible rather than discovered again later; it predates this step, it is a fidelity question about the world''s own calibration, and closing it is not part of a wall cut. THERE IS NO ASSERTION ANYWHERE THAT THE TWO TABLES AGREE, deliberately -- pinning them equal was the natural test to write and would have destroyed the cut (B3''s, B7''s and B10''s recorded refusal, section 3g). MUTATION-PROVEN BOTH WAYS, 57 green unmutated, 6 mutations, each against the module SOURCE and restored from a copy: re-adding `from saas.cost_to_serve import get_bad_debt_rate` to run_phase2b gave EXACTLY 1 red and nothing else anywhere -- THE MUTATION THAT MATTERS MOST, because every pinned value still agrees (the two tables still agree) and a control built only from values would have passed with the defect fully restored; world_bad_debt_incidence collapsed to `return 0.02` gave 30 red including the fail-open guard; the accrual deleted from the loop (_bd_rate = 0.0) gave 1 red, the fail-silent guard, which is the cheapest way to green every other test in the file and the one shape a pure import-sweep cut cannot see; the unrecognised-segment fallback 0.02 -> 0.0 gave 14 red; 2022 residential 0.08 -> 0.06 gave 1 red, the single cell; and the INDEPENDENCE mutation run the other way -- the SUPPLIER''S BAD_DEBT_RATE[''resi''] zeroed AT SOURCE -- left all 57 GREEN here while tests/saas/test_bad_debt.py went red (1 failed, 13 passed), so the world did not move and the supplier did, which is the vacuity guard done as a measurement rather than asserted. THE CONTROL: tests/architecture/test_default_incidence_is_the_worlds.py, 57 tests. LANDED WITH STEP 28, WHICH HAD NEVER BEEN COMMITTED -- its control file was untracked and its edits to household.py, customer_events.py, run_phase2b.py, the ratchet and the register were all working-tree only. Found by `git ls-tree HEAD` on the modules this step''s code calls, not by reading the register''s own claim that step 28 was executed. Same class as section 3s''s finding about step 23, and the second occurrence, so the register''s ''EXECUTED'' wording is now known to outrun the tree more than once. RUFF: this step adds zero violations (the four touched/new files pass clean). The static-quality ratchet is red at HEAD on I001 by +1, NOT MINE and NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE) -- re-measured this tick by A/B-ing the step-29 import swap in and out (I001 1376 either way) and by removing step 28''s household import (run_phase2b''s own count unchanged at 3 I001). Already filed: docs/staging/WORKER_FINDING_THE_RUFF_RATCHET_IS_RED_AT_HEAD_AND_ONLY_SOME_COMMITS_CAN_SEE_IT_2026-08-14.md, whose stated repair route (a bisect) is more expensive than it needs to be: ruff reports LOCATIONS, so diffing the I001 site set between the baseline-date commit and HEAD finds it in two runs. WHAT DID NOT FALL: saas.property_model and company.policy.decision_policy stay live on run_phase2b, as do the 2 indirect edges and run_phase4c_on_phase2b -> company.billing.dd_review_runner; B2 keeps its THREE edges out of customer_events and its warning stands. saas.property_model is still the re-ruling section 3v asked for and this step again did not do it, but section 3w''s measurement was RE-TAKEN here by AST rather than inherited and it holds -- saas/customers.py and saas/home_move_win_rate.py carry four import statements against it between them, none of them the four names run_phase2b uses, so a module move stays off the table. get_bad_debt_rate() now has NO PRODUCTION CALLER, test-only: recorded rather than treated as a retirement signal, per knife_hotspot_measure.py''s company_orphans ruling that no-caller is not dead-code here, and because the provision is what the harness scores the world''s incidence against. STEP 17''S NAMED RESIDUAL IS STILL OPEN (FITBook.levelisation_charge_gbp is handed kWh and divides by 1000 internally -- naming debt on company/regulatory/fit_book.py, not a wall crossing). STEP 20''S MASKING FINDING IS ALSO STILL OPEN. Live state: docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md section 3x. || PRIOR STEP: STEP 28 (B10_household_identity_is_the_worlds, WHICH SUPPLY POINTS ARE ONE HOUSEHOLD), 2026-08-14 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 2 EDGES CUT, 11 -> 9 LIVE (9 -> 7 direct; the 2 indirect deliberately UNMOVED for the FIFTEENTH consecutive step, which is again the proof that a bridge route was not silently taken instead of a cut). 91 ruled: cut 82, owed 9 (6 to A_composition_lift, 3 to B2 -- COUNTED FROM THE REGISTER''S OWN OWED ROWS, not carried forward, because a step that subtracts from the previous one gets the split wrong; A''s 6 are company.policy.decision_policy, saas.cost_to_serve, saas.property_model, the 2 indirect and run_phase4c_on_phase2b -> company.billing.dd_review_runner), grandfathered 0 -- verified by tools/wall_crossing_dispositions.py rc=0 against THE WORKING TREE, not asserted, and cross-checked against tools/knife_hotspot_measure.py''s independent 9. LEVEL DELIBERATELY STILL 0: 9 of 91 remain live; booking the target at nine-tenths-paid is the false-completion class this project names explicitly. WHAT WAS CUT: both remaining edges to saas.customer_reaction -- from run_phase2b (was ruled A_composition_lift) and from customer_events (was ruled B2). THE RULING IS A RE-RULING AND THAT IS MOST OF THE WORK: both edges carried exactly ONE name, the PRIVATE `_billing_account_id`, and neither design fitted. B2''s subject is WHO ACTUALLY CHURNS and its own block says that build must not be attempted as a mechanical move -- true, and the reason B2''s other three edges are still owed after this step; but this edge decides which supply points are ONE CUSTOMER once somebody has churned, so parking it there left a one-line question waiting on a build nobody could start (the SECOND time that has happened to a B2 edge -- step 12''s ceiling was the first, and B2''s block now carries it as a rule rather than a coincidence). A_composition_lift did not fit either, for a simpler reason: nothing was composed -- the world asked the supplier a question ABOUT THE WORLD. NOT A DOOR AND NOT A MODULE MOVE, the third shape: a door would launder a dependency the world does not legitimately need, and saas/customer_reaction.py is correctly filed with FOUR company-side importers (saas.churn_model, saas.clv_model, saas.enterprise_value, saas.reporting.annual_report) plus five tools/ entry points, measured by AST because a grep over the name returns twice as many files as import it, so B1''s move ruling is off the table. The world simply gets its OWN answer -- simulation.household.household_of(), beside the physical household record it is about, importing nothing, deriving identity from the id grammar of the supply book the world is ALREADY published (C1/C1g, C_IC3/C_IC3g). This is B3''s shape applied to an IDENTITY rather than to a constant. WHY IT MATTERS: whether two supply points are one household is a fact about a physical property; whether they are one BILLING ACCOUNT is a supplier decision that real suppliers get wrong routinely, and while the world took the second as the first, that mistake was structurally impossible. Two consequences and the second is worse -- run_phase2b decided which points STOP when an account churns (so a supplier admin error would have rewritten physical reality), and customer_events used the value as its LIFECYCLE RNG SEED (so the supplier''s back-office grouping selected which random life a household led). BEHAVIOUR PINNED PRE-CUT, never re-recorded from the post-cut tree: _billing_account_id was run over the live published book BEFORE either call site was switched and the answers transcribed as LITERALS -- 24 registered/successor points, the 2 drawn SYN-* points, and four edge cases. Two are load-bearing beyond the obvious: C1_2 (a successor registration after a home-move win) must NOT fold back into C1, because the previous occupants left and merging them would make a home move look like a customer who never churned; and the bare string "g" must map to itself, the only input distinguishing the guarded implementation from an unguarded one. THERE IS NO ASSERTION ANYWHERE THAT THE TWO AGREE, deliberately -- pinning household_of(x) == _billing_account_id(x) was the natural test to write and would have destroyed the cut (B3''s and B7''s recorded refusal, §3g). MUTATION-PROVEN BOTH WAYS, 35 green unmutated, 5 mutations, each against the module SOURCE and restored from a copy: household_of stops stripping the suffix 7 red; GAS_LEG_ID_SUFFIX g->G 8 red (one more, because the vacuity guard is keyed on the same constant and correctly reports it can no longer find a gas leg); the len>1 guard removed 1 red, the bare "g" case; re-adding `from saas.customer_reaction import _billing_account_id` to customer_events EXACTLY 1 red and nothing else anywhere -- THE MUTATION THAT MATTERS MOST, because every pinned value still agrees and a control built only from values would have passed with the defect fully restored; and the INDEPENDENCE mutation run the other way -- saas.customer_reaction._billing_account_id replaced at SOURCE by the identity function (the supplier stops linking dual fuel) left all 65 tests across the control and the two world suites GREEN, while the supplier''s own answer really did change (the name customer_events imported at HEAD returned "C1g" for "C1g"), which on the pre-cut tree is the world''s grouping, its event customer_id and its RNG seed all moving with a billing-system change. THE CONTROL: tests/architecture/test_household_identity_is_the_worlds.py, 35 tests. ONE TEST SWITCHED WITH THE CODE, recorded rather than left silent: tests/simulation/test_home_move_undeliverable_win.py built its own accounts-without-successor population from the supplier''s mapper, and until it moved to household_of the independence mutation reported a red that was the FIXTURE''S, not the world''s -- the honest shape of a false positive, mutation working, subject wrong. RUFF: zero drift, measured by A/B-ing each touched file against its HEAD blob (9 findings before, 9 after, same codes). WHAT DID NOT FALL: saas.cost_to_serve, saas.property_model and company.policy.decision_policy stay live on run_phase2b; B2 keeps its THREE real edges and its warning stands unchanged -- those are the churn brain and this step''s one-line shape is no precedent for them. saas.property_model is still the re-ruling §3v asked for and this step deliberately did not do it, but one measurement taken here says a MOVE is off the table for it whatever the ruling: saas/customers.py and saas/home_move_win_rate.py both import it, so relocating would create class-(a) edges. NAMING RESIDUE, NAMED: run_phase2b''s local is still `billing_account` and the run record still publishes "churned_billing_accounts" -- ~60 uses and two consumed output keys, so a rename is a behaviour change to a published artefact and not this step''s; the VALUE no longer comes from a company module, which is the crossing. STEP 17''S NAMED RESIDUAL IS STILL OPEN (FITBook.levelisation_charge_gbp is handed kWh and divides by 1000 internally -- naming debt on company/regulatory/fit_book.py, not a wall crossing). STEP 20''S MASKING FINDING IS ALSO STILL OPEN. Live state: docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md section 3w. || PRIOR STEP: STEP 27 (A_composition_lift, THE GROWTH MANDATE AND THE MONEY IT BOOKS), 2026-08-14 -- this atom is PARTIALLY built and must NOT be re-drawn as if from zero. 2 EDGES CUT, 13 -> 11 LIVE (11 -> 9 direct; the 2 indirect deliberately UNMOVED for the FOURTEENTH consecutive step, which is again the proof that a bridge route was not silently taken instead of a cut). 91 ruled: cut 80, owed 11 (7 to A_composition_lift, 4 to B2 -- COUNTED FROM THE REGISTER''S OWN OWED ROWS, not carried forward, because a step that subtracts from the previous one gets the split wrong; A''s 7 are company.policy.decision_policy, saas.cost_to_serve, saas.customer_reaction, saas.property_model, the 2 indirect and run_phase4c_on_phase2b -> company.billing.dd_review_runner), grandfathered 0 -- verified by tools/wall_crossing_dispositions.py rc=0 against THE WORKING TREE, not asserted, and cross-checked against tools/knife_hotspot_measure.py''s independent 11. LEVEL DELIBERATELY STILL 0: 11 of 91 remain live; booking the target at seven-eighths-paid is the false-completion class this project names explicitly. WHAT WAS CUT: saas.growth_mandate and saas.ledger on run_phase2b. The world held the supplier''s standing growth mandate, its per-segment replacement-cost table (read at TWO call sites -- the acquisition budget AND the acq_cost_saved credit inside the supplier''s own retention guard), its cap-aware acquisition gate and the refusal string, its GBP50/month overhead figure, and the SHAPE OF ITS LEDGER ROWS including one zero-amount acquisition_gate_event built as an inline dict literal with no constructor at all. Every one is a commercial judgement a real supplier makes and is ALLOWED TO GET WRONG, which is the belief-vs-truth gap the COUPLED TRIAD scores; none is physics. A DOOR AND NOT STEP 26''S MODULE MOVE, and section 3u said so in advance: both saas modules are on the CORRECT side of the wall already and carry five other company-side consumers (annual_report, run_segments, accounting_close, double_entry, pnl), so nothing is misfiled -- what was wrong was the world reaching THROUGH them. TWO DOORS, because section 3m''s group test answers NO: the budget, the gate and the retention credit are one number seen from three sides (the guard''s acq_cost_saved IS the acquisition cost avoided) and became company/interfaces/growth_desk.py, while the monthly overhead accrues on the calendar against no supply point and lands in a different account, so it became company/interfaces/fixed_overhead.py -- which takes A MONTH AND NOTHING ELSE, so the overhead AMOUNT no longer crosses and no expression under simulation/ can read it. THE INTERESTING HALF IS THE elif: `elif MANDATE != "shrink"` could have become `elif growth_mandate_label() != "shrink"` and the ratchet would have gone green while the world still branched on a supplier stance -- the crossing paid off as an import and kept as a comparison. The door answers the QUESTION (mandate_permits_replacement()) instead; growth_mandate_label() survives only for the run record''s output field and is documented reporting-only. AcquisitionDecision therefore has NO mandate_permits field: one combined question would force the world to look the customer up before it is entitled to, and one combined flag would lose which of the two suppressed an attempt (a forbidding mandate books nothing; a gate refusal books the visible zero-amount row). BEHAVIOUR PINNED PRE-CUT, never re-recorded from the post-cut tree: the mandate label, all three segment budgets including the unknown-segment default, the full gate grid over 2 commodities x 4 dates x 2 forwards with the refusal STRINGS pinned rather than just the booleans, and all four ledger rows with their transaction_ids and signs -- including the gate row''s ABSENCE of a transaction_id, which its two siblings both carry and which moving it inside a door is exactly the moment to ''tidy up'' by accident. MUTATION-PROVEN BOTH WAYS, 28 green unmutated, 7 mutations: MANDATE->shrink 2 red; COST_PER_ACQUISITION resi 150->200 2 red (budget AND retention credit, which is why both call sites are pinned); FIXED_COST_MONTHLY 50->60 1 red; gate `cap < fwd` -> `cap > fwd` 2 red including an ungated same-year cheap-forward ce