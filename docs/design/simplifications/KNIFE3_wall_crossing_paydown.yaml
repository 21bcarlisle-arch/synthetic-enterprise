  exit_evidence: 'STEP 8 (THE INSTRUMENT, NOT A CUT), 2026-08-10 -- this atom is PARTIALLY built and must
    NOT be re-drawn as if from zero; 16 of 88 direct crossings CUT, LEVEL DELIBERATELY STILL 0. THIS TICK
    CUT NOTHING ON PURPOSE AND THE COUNT WENT UP, 72 -> 75. The shared walker''s own docstring had named
    the hazard since step 1 -- ''routing a dependency through a package the walker does not walk (tools/)
    moves the measurement rather than the dependency'' -- and nobody had asked whether the tree ALREADY
    contained such a route. It did: THREE, all class (b), all leaving simulation/run_phase2b.py:95, reaching
    company/billing/{account_ledger,arrears_engine,payment_observation_consumer} through background.live_payment_triad
    and tools.couple_w2_11_d5. Invisible to the ratchet, to the KNIFE ledger, and to the register that
    claims to examine every crossing. A hazard named in prose and left unmeasured is R15''s third killer
    pattern. WHY IT LANDED BEFORE A_composition_lift AND IN A COMMIT THAT CUTS NOTHING: the A cut moves
    thin scenario harnesses out of simulation/ and above both layers, which in this repo means into tools/;
    that is a CUT only if nothing walked still reaches the company through the moved file, otherwise it
    is the laundering section 2b refuses in writing. The pass could not honestly make that move while
    tools/ was an unmeasured channel -- so the instrument lands first, in its own commit, with the direct
    allowlists byte-unchanged. Step 1''s rule applied to its own consequence. BUILT: tools/epistemic_wall.py
    gains BRIDGE_PACKAGES (a CENSUS -- every top-level name imported by walled code was counted; exactly
    three resolve to in-repo non-wall dirs: tools, background, interface), module_names(), IndirectEdge
    and indirect_crossings()/live_indirect_crossings()/indirect_crossings_at_head(). build_edges gained
    ONE flag (submodule_targets, default OFF) rather than a second walker, so the frozen direct census
    is byte-unchanged and a test proves both halves of that. All three consumers now share the wider perimeter:
    the ratchet gate (tests/architecture/test_epistemic_wall_indirect_ratchet.py, 20 tests, own dated
    shrink-only allowlist), the register (91 rows / 75 live -- the three ruled owed to A_composition_lift,
    since the same cut kills them with run_phase2b''s other 32), and the KNIFE ledger (75 edges, reported
    ''72 direct + 3 indirect''). R15 PROVEN ON THE REAL TREE, NOT A FIXTURE: a laundered route injected
    into simulation/settlement.py via a throwaway tools/ module reds exactly three tests in the new module
    (new-crossing, frozen census, and the per-bridge verdict for `tools` -- background and interface stay
    green) WHILE test_epistemic_wall_ratchet.py passes 12/12 on the same injected route. That green direct
    ratchet is the measurement, not the argument, for what was missing. Second mutation: dropping `background`
    from the census reds the census-coverage test. THREE FINDINGS THE BUILD ITSELF TURNED UP. (1) THE
    SHORTEST CHAIN IS A REDUNDANT-CHANNEL TRAP -- every one of the three is carried by BOTH bridges, so
    cutting the one route the checker first printed removes nothing and reads as a failed cut; IndirectEdge.entries
    now names every entry point, with one test pinning the property and a second pinning today''s concrete
    redundancy so its disappearance is a visible event. (2) THE UNION HID A FAIL-OPEN THE MOMENT IT WAS
    INTRODUCED -- measure_crossings with an empty direct walker still returned 3, so ''ZERO crossings
    is a failure'' stopped firing on it; neither source may be refused for being zero alone (an empty
    indirect set is this pass''s GOAL state), so the guard stays on the total and the BREAKDOWN is printed,
    making a silent source visible rather than inferred. Caught by the existing suite going red. (3) A
    MUTATION POINT HAD DRIFTED OFF THE LIVE PATH -- test_main_returns_nonzero_when_an_edge_is_unexamined
    patched measure_crossings while main had moved to measure_crossings_split; it failed loudly rather
    than passing green against a ghost it was no longer injecting, and now patches the path main takes.
    CLASS (a) VIA A BRIDGE IS AT ZERO -- measured here for the first time, not inherited; KNIFE pass 1
    drove the DIRECT forbidden direction to zero and nobody had asked the indirect question. interface/
    is in the census despite the ratchet''s standing claim that it ''cannot host a wall edge nor launder
    one'' -- that claim was about DIRECT edges and had never been tested for indirect ones; it holds,
    by measurement now, and each bridge gets a named verdict so a clean one is explicit rather than silent.
    A_composition_lift IS NOW UNBLOCKED and its per-file measurement is taken: NINE of the ten shape-A
