atom_id: H38_full_suite_pollution_bisect
map_notes:
  origin_note: 'MINTED FROM deliverable 3 of the WORK THIS CREATES block in DIRECTOR_RULING_HOOK_BYPASS_AND_SURGICAL_LANDING_2026-08-09: "the bisect executed; the polluting module named; the class fix drawn on its own priority" — granted per the acting seat''s filed recommendation, R10 shape (no instance-fixes on a moving target), and MEMORY-AWARE per the resource-headroom flag: the sim runner is stopped for full-suite runs, and a collision is deferred rather than run alongside. THE PROBLEM: tests that pass in isolation and fail in the full suite, which has been patched at the instance level more than once. An instance fix on a target that moves is how the same afternoon gets spent twice. EXIT: (1) the bisect is EXECUTED and the polluting module is NAMED with the evidence (the ordered pair that reproduces, not a suspicion); (2) the MECHANISM of the pollution is stated — module-level state, a monkeypatch that outlives its test, an env constant, a shared file — since the class fix depends on which it is; (3) the class fix is drawn as its own atom at its own priority rather than folded in here, so the diagnosis is not held hostage to the repair; (4) the record says what was tried and did NOT reproduce, because a bisect that only reports its hit teaches nothing about the next one; (5) memory discipline stated in the record: what was stopped, what was deferred, and what the run cost — the headroom governor exists because a full-suite run has previously taken the machine down with it.'
