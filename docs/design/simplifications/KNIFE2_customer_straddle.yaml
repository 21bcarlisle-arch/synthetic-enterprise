  exit_evidence: 'LANDED 2026-08-09, both EXIT clauses measured. (1) All 16 (''simulation.*'',''saas.customers'') tuples deleted from LEGACY_SIM_READS_COMPANY. (2) Class (b) 104 -> 88, the exact number the EXIT predicted. Independent re-measure `python3 tools/knife_hotspot_measure.py`: customer_straddle 17 files/16 edges -> 1 file/0 edges, wall_crossings 88 edges / 23 files, ''KNIFE LEDGER: OK -- every hotspot measured; every declared overlap matches the tree.'' Ratchet suite 12/12 green INCLUDING both mutation proofs; the walker was NOT edited (allowlist tuples + comments only), per the origin_note wall. THE CUT: a NEW seam module company/interfaces/supply_book.py -- ''the supply book'', i.e. which meter points this supplier has REGISTERED. Deliberately not an extension of sim_interface.py: that file is the company->SIM direction (the company asking the world) and this is SIM->company (the world learning what the supplier registered); merging them would put two directions behind one name. Real-world referent: a GB supplier registers against an MPAN and the industry LEARNS the point is on its book, so the world knowing the registered population is real -- 16 modules reaching into the CRM to find it out was not. Six names now cross as registered_supply_points/successor_supply_points/acquired_supply_points/registered_point/settlement_input/register_acquired_point. NOT A COPY INTO THE SIM (origin_note wall): no customer state was duplicated -- the accessors return the LIVE roster objects. WHY THIS IS NOT PASS 1''S REFUSED MOVE: pass 1 declined to route via tools/ because tools/ is outside WALL_DIRS and the walker never looks there; company/interfaces/** IS walked, byte for byte, and its exemption is the ratchet''s own published SEAM_PACKAGE rule whose doctrine string names this exact remedy. Falsifiable, and tested: re-adding `from saas.customers import CUSTOMERS` to any SIM module now reds test_no_new_sim_reads_company with NO grandfathered tuple left to hide behind. R15: the seam''s identity contract gets its own control (tests/company/interfaces/test_supply_book_seam.py, 10 tests) because a defensive copy in an accessor is the FAIL-SILENT defect here -- run_phase2b appends each acquisition to ACQUIRED_CUSTOMERS and teardown clears it in place, so a copy would leave a green suite and a wrong world. Both mutation proofs VACUITY-CHECKED: neutering the injected defect reds them (2 failed, 8 passed), so they are not tautologies. WALL 4 (byte-identical output): NO comparable artefact -- stated, not substituted with a weaker check. This pass changes no rendering path and the artefact would need the ~100-minute Phase 2b run; the is-identity assertion is the stronger check for this change, since a copy is the only way the refactor could alter behaviour and identity refutes it directly. THE WATCH HELD: run_phase2b''s non-customer edges untouched, still allowlisted, and the 88 survivors are KNIFE3''s. Two pre-existing defects surfaced and QUEUED not fixed (SELF_INTERRUPT_DISCIPLINE): simulation/run_phase2a.py and run_phase2a_repriced.py do not import at all (module-scope sum() over eac_kwh where 12 of 18 roster entries are None) -- confirmed pre-existing by evaluating the same expression over the same shared list object, and nothing in the tree imports either module; and KNIFE1''s paydown half was UNCOMMITTED at HEAD while its doc said LANDED (committed ahead of this pass). Sequencing consequence recorded in KNIFE_HOTSPOT_PASSES.md section 3b: every hotspot is now disjoint from every other, so the serial wall over passes 1-3 is fully discharged.'
