atom_id: PB3_book_growth_as_earned_outcome
simplifications:
- '2026-08-17 SIMPLIFICATION REGISTERED AT DESIGN TIME, before the build, at the director''s instruction (console: "acquisition and churn aren''t driven by one shared elasticity ... name it as a known simplification rather than leaving it implicit"). No BUILD code written this tick; level stays 0, loop_stage still idle, file_scope still empty.


  THE SIMPLIFICATION. The approved ADD-path design makes ONE function serve both directions: `simulation/market_switching_propensity.py`''s savings-elasticity decides both which households leave this book and which in-play households join it. That is deliberate and it is what makes this atom''s amended exit criterion (b) testable -- "a world in which the book GROWS and one in which it SHRINKS, from the SAME mechanism" -- and it is the mechanism of the director''s anti-goal-seeking guard (2026-08-17): a shared constant cannot be tuned toward book growth without equally moving the loss leg, so R12 goal-seeking on book size is structurally unavailable rather than merely forbidden.


  WHY IT IS NOT FAITHFUL, `observed-with-evidence` at HEAD. The module''s own docstring calls its output a "market-level switching propensity multiplier", calibrated from the DESNZ switching series 2015-2025. A market-level switching series states HOW MANY households move in a year; it says nothing about WHICH SUPPLIER WINS THEM. Pointing it at the inbound direction therefore assumes, silently, that this supplier takes a share of the switching flow modulated by its own price position and by nothing else.


  IN REAL GB RETAIL (director, 2026-08-17) the two sides have different drivers: acquisition responds to price position PLUS channel and marketing; churn responds to price PLUS service quality and inertia. Neither list reduces to the other, and the shared constant collapses both onto the savings differential alone.


  THE ASYMMETRY IS ALREADY IN THE TREE, and it cuts against the word "shared". On the LOSS side the elasticity is not used bare: the module is "applied in simulation/customer_events.py before income_stress and satisfaction modifiers", so churn already carries something service-quality-shaped and something inertia-shaped on top. The ADD path as designed would carry the bare multiplier and no equivalents. So the two legs share a CONSTANT, not a model, and the loss leg is the richer of the two from day one.


  WHAT THIS MASKS, and it is a real capability and not a rounding error. Under this simplification the company cannot win a customer by being better -- only by being cheaper. Service quality, brand and channel mix become inert with respect to book growth, which makes `company/crm/channel_roi.py` (present at HEAD) decorative on the one outcome it exists to inform. Any finding of the form "acquisition spend does not pay back" measured on this build is an artefact of this entry, not a result.


  WHAT WOULD CLOSE IT: separate inbound and outbound response functions with their own anchors -- outbound keeps savings-elasticity plus satisfaction plus inertia; inbound needs a SHARE-OF-SWITCHERS model in which price position is one term beside channel and marketing. `inferred`, not observed: whether a per-supplier switching-share series exists in the Ofgem or DESNZ publications is NOT established here, and if none does then the inbound side must ship as an explicitly unanchored curriculum instrument under R13 rather than as a fitted one.


  THE CONSTRAINT ON WHOEVER CLOSES IT. Splitting the legs REMOVES the structural guarantee described above, because two independent constants can be tuned in opposite directions. So the split may not land without carrying the guard forward by other means: a mutation test proving that no admissible parameter change makes the book monotonically non-decreasing, i.e. that growth is still LOSABLE. Registering that here so the property is inherited by the fix rather than lost with the simplification -- the R11 no-orphan-transitions rule applied to a simplification''s own release.'
- '2026-08-24 PB3 ADD-PATH BUILT, and this entry is the cost of the way it was built. `net_new_acquisition.homes_in_market` now sizes each year''s in-play market from the real DESNZ-calibrated switching series (`market_switching_propensity.market_switching_multiplier`) instead of the flat PROSPECTS_PER_YEAR constant, so 2022''s crisis (0.44x) and 2016''s peak competition (2.17x) are different worlds to acquire in. That is exit (a)''s ADD leg wired, and it is the SAME constant the LOSS leg reads in `customer_events` -- which is the director''s 2026-08-17 anti-goal-seek guard made structural: opening the market to win more customers opens it equally for the ones already on the book.


  THE SIMPLIFICATION, `observed-with-evidence`: the multiplier can only THIN the market, never widen it. It is capped at `prospects_per_year`, so ABOVE 1.0 IT IS INERT and every year from 2016-2020 sizes identically to 2024 despite the series saying the market was up to 2.17x more open. In a peak-competition year this model therefore UNDERSTATES how winnable the market was, and any read of ''the company failed to grow in 2016'' inherits that understatement rather than measuring it.


  WHY IT IS CAPPED rather than left free. Prospects are drawn `iter_prospects(year, n=prospects_per_year)` out of a stock partition PB2 splits with the Profile-B trickle -- campaign takes the head, trickle the tail. An uncapped 2.17x asks for 869 homes from a 400-home partition and does not get them: measured before the cap, 2016 reported 600 quotes_issued against 400 actual wins on an ALWAYS-WIN funnel, i.e. a published growth figure claiming quotes the run never issued and never billed. Uncapping would also make the campaign''s slice depend on the year''s multiplier, which is exactly the boundary PB2 fixed to make ''won, never assigned'' measurable.


  WHAT WOULD CLOSE IT: widen the stock partition itself so a peak year has more homes to draw, which is a PB2-boundary change (campaign/trickle split) and not a number to move from inside this module. Until then the honest reading of the growth curve is that thin years are modelled and rich years are clipped. Guarded by `test_the_market_can_only_be_THINNED_never_widened_past_the_stock_partition` and, end-to-end, by `test_every_quote_the_run_REPORTS_is_a_quote_it_actually_BILLED`, which fails on the exact 600-vs-400 defect above.


  NOT CLAIMED: exit (b) is NOT discharged by this. ''A world in which the book GROWS and one in which it SHRINKS, from the same mechanism'' needs the net of wins against churn at the population level; this atom''s half is the ADD leg being real and market-driven. The level is not moved on the strength of this entry.'
- '2026-08-25 SIMPLIFICATION REGISTERED WITH THE BUILD IT IS PART OF, exit criterion (b1) (the win side now reads the company''s own price position: `simulation/market_switching_propensity.py::offer_position_multiplier`, consumed by `simulation/acquisition_funnel.py::_quote_to_application_rate`).



  THE SIMPLIFICATION. The response to being DEARER than the market average is modelled as the exact reciprocal of the response to being cheaper by the same margin: pricing 10% above the market costs precisely what pricing 10% below it gains. `offer_position_multiplier(d) * offer_position_multiplier(-d) == 1.0` for every d, asserted in `tests/simulation/test_net_new_acquisition.py::test_b1_the_win_side_reads_the_SAME_elasticity_the_loss_side_does`.



  WHY THE CURVE COULD NOT SIMPLY BE READ ON BOTH SIDES, `observed-with-evidence`, and it is the reason this entry exists rather than a straight reuse. The shared elasticity `_savings_to_rate` is calibrated on the DESNZ 2015-2025 switching series and returns the flat `_CRISIS_FLOOR_RATE` (0.03) for NEGATIVE savings. That branch encodes 2022''s "nowhere cheaper to go" effect -- a statement about the WHOLE MARKET holding no cheaper alternative. For a single supplier priced above the average the premise is false by construction: a cheaper alternative exists and it is the average. Reading the branch straight was measured on the first draft of this build and collapsed every dearer position onto one value -- 1% above the market cost exactly what 20% above cost -- i.e. a supplier that could raise prices without limit at no cost to its win rate, which is the same defect one direction over from the one this atom exists to remove. The measurement is preserved as a control: `test_MUTATION_b1_the_market_crisis_floor_on_the_dearer_side_flattens_it` restores the straight read and asserts it still reproduces the flat collapse, so this entry cannot go stale silently.



  WHY IT IS NOT FAITHFUL. Real GB retail is not symmetric about parity. Loss aversion and incumbency inertia both say a dearer offer is punished harder than an equally cheaper one is rewarded, and the switching literature the module already cites is one-sided about it. Symmetry understates the penalty for pricing above the market and therefore, on this leg alone, flatters a dear supplier''s growth.



  WHY IT WAS TAKEN ANYWAY. Nothing available can settle the asymmetry. A market-level switching COUNT never observed this supplier''s own quote book, so the series cannot say how a household chose between our number and the average -- which is the same limitation already registered on this atom on 2026-08-17 for the shared-elasticity decision, seen from the win side. Symmetry is the assumption that invents least, it is monotone (the property the model actually needs, and the one the crisis-floor read destroyed), and it makes the anti-goal-seek guarantee EXACT rather than approximate: there is no price position at which both legs improve.



  WHAT WOULD DISCHARGE IT. An asymmetric slope pair sourced from a real acquisition/retention study, or -- better, and it is B10_competitor_switching_response''s own subject -- a competitor field that answers a price cut, at which point the response stops being a curve read off our own differential at all. Until then the symmetry is visible here rather than implicit in a single sign test.



  SCALE CONSTANT, named in the same breath because it is the other thing a reader should distrust. `CALIBRATION_ANNUAL_BILL_GBP = 1700.0` exists ONLY to put a fraction onto the GBP scale the elasticity is calibrated in; no customer''s bill is computed from it anywhere (`simulation/price_cap_enforcement.py` owns what a bill may be and is untouched). Getting it wrong stretches or compresses how sharply the win side responds to a given price position and cannot move anybody''s money. Its consistency test is that the calibration year''s £150 market saving against it puts the best deal ~8.8% below the average, which is a plausible 2024 best-vs-average spread.'
map_notes:
  name: 'Deliverable 3: growth from the opening book is GRADUAL AND EARNED -- won and lost against the market through the acquisition physics already built, never incremented. EXIT: (a) the mechanisms named and wired, not gestured at: churn, acquisition cost, and the competitor field (W2_3_competitor_field and B4_competitor_field are the existing world/company organs; B10_competitor_switching_response is the switching response) -- this atom is the loop that makes book size THEIR outcome; (b) the falsifier IS the exit test, because the ruling states the property directly -- a growth curve that cannot be lost is not a growth curve. AMENDED 2026-08-15 (DISCOVER, worker tick) because the original wording was vacuous: it asked only that a world configuration in which the book SHRINKS be demonstrated, and at HEAD the book can ONLY shrink -- acquisition is replacement-only and can fail, so book size is monotonically non-increasing -- which means that test passes on unbuilt code, an R15 fail-open. BOTH legs are now required, from the SAME mechanism and neither bolted on: a world configuration in which the book GROWS and one in which it SHRINKS, each demonstrated, not argued; RE-AMENDED 2026-08-18 (DISCOVER, worker tick) because that wording was fail-open in the direction it ADDED: at HEAD the book already both grows (curriculum arrivals -- five staggered static I&C dates 2017-2020 plus the activated SYN-* Poisson trickle) and shrinks (churn), so it passes on unbuilt code, the identical R15 fail-open one direction over. The DIRECTION OF THE CURVE is not the test; the IDENTITY OF THE MECHANISM is -- "won and lost against the market" is not satisfied by a book that goes up and down, only by a book whose up and whose down are the SAME contest. Both legs must therefore come from the same contested mechanism, proven by a NULL CONTROL: (b1) with the arrival stream held FIXED, a change to the company''s own market position alone must move book size in BOTH directions; and (b2) with the arrival stream EMPTIED, the book must still be able to grow. (b1) without (b2) is satisfiable by the curriculum; (b2) without (b1) is satisfiable by a growth curve that cannot be lost; (c) no step change in book size that is not a modelled acquisition or loss event -- RED AT HEAD 2026-08-18 with SEVEN named instances, none of which passes a funnel, costs a penny, or can fail: C_IC1 (2017-01-01), C_IC2 (2018-01-01), C_IC3 and C_IC3g (2019-01-01), C_IC4 (2020-01-01) from the static roster''s hand-authored acquisition_dates, plus SYN-2021-001 and SYN-2025-001 from the activated population draw; (d) the company''s own belief about its book and the world''s truth are measured against each other and the gap reported, per the coupled-triad rule that the gap is the score.'
  discover_note: "2026-08-14 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code written; file_scope is empty and stays empty -- this atom is loop_stage: idle and EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom while BUILD is not.\n\nWHAT IS ALREADY WIRED, READ OFF HEAD. The LOSS half of this loop is real and calibrated: W2_3_competitor_field (level 1, harden) is `simulation/market_switching_propensity.py`, a savings-elasticity churn multiplier fit to real DESNZ/Ofgem switching series 2015-2025 (the 2022 'nowhere cheaper to go' collapse is in the calibration, not asserted from theory). Customers leaving THIS book to a competitor is therefore a modelled event with an external anchor, not a step change -- the property clause (c) of this atom's exit criterion already asks for.\n\nWHAT IS NOT WIRED, READ OFF HEAD. The GAIN half has no symmetric mechanism yet. B4_competitor_field (level 0, idle, file_scope empty) -- the company-OBSERVABLE side of the competitor field the epistemic wall would require before pricing/CRM could react to it -- is unbuilt. B10_competitor_switching_response (level 0, provenance: proposal) names `sim/competitor_field.py` in its own file_scope; that file does not exist (`ls sim/competitor_field.py` -> No such file or directory) -- the response side of switching-IN is a proposal, not code. And PB3's own `depends_on`, PB2_opening_book_won_not_assigned, is ITSELF level 0/idle -- the atom that establishes the company's OPENING book as won-not-assigned has not been built, so PB3's exit criterion (c), 'no step change in book size that is not a modelled acquisition or loss event', currently has no acquisition event to point at even for the starting book.\n\nSO THE LOOP AS SPECIFIED IS ONE-SIDED TODAY: losses are a modelled, externally-anchored event (W2_3); gains are not -- there is no competitor-switching-IN event, and the company-side observable that a switching-in response would react to (B4) is also unbuilt. A book that can currently only shrink through modelled events and can only grow through whatever unmodelled path company/crm/acquisition_strategy_book.py and acquisition_cohort.py already provide (present at HEAD, not audited by this tick) is not yet the two-sided 'won and lost against the market' loop this atom's gain statement asks for.\n\nFRAME -- THE RECOMMENDATION, IN DEPENDENCY ORDER. (1) PB2 first: PB3 depends_on it and it is the atom that makes the OPENING book a won event rather than an assigned number -- building PB3 ahead of PB2 would wire the ONGOING loop onto a starting condition that is still a step change. (2) B4_competitor_field next, or in parallel if file_scope proves disjoint: PB3's exit criterion explicitly names it as one of the mechanisms this atom must wire, not gesture at. (3) THEN this atom's own build: a switching-IN event modelled with the same discipline as W2_3's switching-OUT (savings-elasticity, externally anchored where a real benchmark exists), so the falsifier the ruling asks for -- a world configuration in which the book SHRINKS -- is a property of the SAME mechanism that lets it grow, not a separately-bolted failure mode.\n\nNOT MEASURED THIS TICK, SAID PLAINLY: whether company/crm/acquisition_strategy_book.py / acquisition_cohort.py already model an acquisition EVENT in the sense clause (c) asks for, or whether the opening/current book size is presently just a target number the sim draws to. That audit is the natural next DISCOVER step and is not done here -- `inferred`, not observed, not asserted as fact above.\n\n\n2026-08-15 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code; file_scope is empty and stays empty. This tick closes the one question the 2026-08-14 note left open and labelled `inferred` -- whether company/crm/acquisition_strategy_book.py / acquisition_cohort.py already model an acquisition EVENT in the sense clause (c) asks for, or whether book size is just a target number the sim draws to. ANSWER, `observed-with-evidence` at HEAD 035ec77ba, by census of the live run path.\n\nNEITHER, AND THE TRUE ANSWER IS SHARPER THAN BOTH. Book size is not a target the sim draws to -- there is no target-seeking on book size anywhere in the run. The acquisition event is real, well-built, and REPLACEMENT-ONLY. The census, every acquisition entry point in `simulation/run_phase2b.py`: (i) `make_acquired_customer` is called EXACTLY ONCE, line 1700, inside `if acq_won:` inside `elif mandate_permits_replacement():`, which sits inside the lifecycle/churn arm keyed on `billing_account` -- the DEPARTING account; (ii) `sim_interface.notify_acquisition` has EXACTLY TWO call sites, 1610 (`channel=\"home-move-win\"`, the successor supply point of an account that is moving) and 1708 (`channel=\"market-acquisition\"`, the replacement above), and BOTH pass `predecessor_id=billing_account`. The interfaces say it in their own docstrings: `company/interfaces/growth_desk.py::mandate_permits_replacement` -- \"May the supplier go to market at all to replace a loss?\"; `decide_acquisition` -- \"Ask the supplier whether to go to market to replace a lost supply point.\" There is no code path by which this book gains an account without first losing one.\n\nCONSEQUENCE 1 -- CLAUSE (c) IS ALREADY HALF-MET, AND THE HALF IT MEETS IS THE LOSS HALF. Every book-size change in the live run is already a modelled event with real machinery behind it: `simulation/acquisition_funnel.py` walks quote -> application -> credit_check -> onboarding -> cooling_off with per-stage leakage, per-stage cost, real calendar spacing and a hard-anchored statutory 14-day cooling-off constant, and the loss side is W2_3's externally-calibrated switching propensity. There is no step change to remove. What clause (c) is missing is not discipline -- it is an ADD path.\n\nCONSEQUENCE 2 -- NET GROWTH IS STRUCTURALLY IMPOSSIBLE TODAY. This is arithmetic, not judgement: one lost account authorises at most one replacement attempt (`suffix = _acquisition_counter.get(billing_account, 3)`, one `new_cid` per win), and that attempt can FAIL (the `else:` branch logs `[ACQUIRE] Fresh acquisition failed`). Book size is therefore monotonically NON-INCREASING from the opening book. This atom's own `gain` line -- \"book size becomes an outcome the company can fail at\" -- is already true in one direction and unreachable in the other.\n\nCONSEQUENCE 3 -- THIS ATOM'S OWN FALSIFIER WAS VACUOUS, AND I HAVE AMENDED IT (see criterion (b) above, amended this tick). It asked for \"a world configuration in which the book SHRINKS\". Given Consequence 2 the book can only shrink, so that test passes on unmodified HEAD, before this atom is built at all -- it cannot fail on the defect it names, the R15 fail-open pattern. Criterion (b) now demands BOTH legs out of the SAME mechanism, which is what the ruling's \"won and lost against the market\" actually says, and which is red at HEAD today. The DIRECTOR'S property is untouched; only the worker's rendering of the test changed, and the mint receipt (PLANNER_MINTED_population_and_book_growth_2026-08-11.md) makes the test wording the worker's.\n\nA FOURTH FINDING, outside the exit criteria, offered to whoever builds this. THE \"FRESH MARKET\" ACQUISITION IS A CLONE AT THE SAME ADDRESS. `saas/customers.py::make_acquired_customer` stamps `acquisition_type: \"fresh_market\"` and `successor_of: <predecessor>`, then copies `location`, `home_type`, `bedrooms`, `epc_rating`, `eac_kwh`, `contract_type` and `segment` straight off the departing customer. So the company can never acquire a household unlike one it already had, nor at an address it did not already serve: the acquired book carries the opening book's distribution by construction. Any PB3 build that adds an ADD path must draw the incoming customer from the WORLD's population -- through the wall, arriving by onboarding/interface events as the ruling requires -- and not clone the outgoing one, or book GROWTH will simply inherit this degeneracy at larger scale.\n\nSEQUENCING UNCHANGED from the 2026-08-14 note (PB2, then B4, then this atom's build), and now better supported: PB2 makes the OPENING book a won event, and since Consequence 2 makes the opening book the book's permanent CEILING, PB2's number is currently the only thing that sets the company's scale at all.\n\nNOT MEASURED THIS TICK, said plainly: the home-move leg (line 1610) was read for its call shape and predecessor argument only -- whether a home-move win can ever be NET positive for book size was not traced through `won_successor_activations`, and no claim either way is made here. That is the next DISCOVER step if one is wanted before PB2.\n\n\n\n2026-08-18 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code; file_scope is empty and stays empty. This tick answers the one question the 2026-08-15 note left open and labelled unmeasured -- whether a home-move win can ever be NET positive for book size -- and in answering it FALSIFIES that same note's Consequence 2. Both results are `observed-with-evidence`. The correction is written HERE rather than filed as a separate finding because the claim being corrected is this atom's own record, and a correction parked elsewhere would leave the false claim standing where the next reader meets it.\n\nTHE OPEN QUESTION, ANSWERED: A HOME-MOVE WIN IS NEVER NET POSITIVE, AND USUALLY NET NEGATIVE. Structurally, at HEAD. The successor roster is FIXED at import and electricity-only -- `saas.customers.SUCCESSOR_CUSTOMERS` is exactly six points (C1_2..C6_2, every one `commodity: electricity`), one per predecessor C1..C6, each activatable once and only when its predecessor churns: `run_phase2b.py:1184` gates a successor's terms on `won_successor_activations`, and that dict is written at exactly one site (line 1630) inside `if event[\"event_type\"] == \"churned\"`. Churn is at HOUSEHOLD level -- `churned_billing_accounts.add(billing_account)` where `billing_account = household_of(cid)` -- and `household_of('C1g') == 'C1'` by the gas-leg suffix grammar, so the guard at line 1174 skips the predecessor's GAS leg from the same instant. C1..C4 are dual fuel (C1g..C4g at 12,000 / 15,000 / 14,000 / 22,000 kWh AQ). A home-move win on C1 therefore removes TWO supply points and adds ONE: net -1. On C5/C6 (SME, electricity-only, and the only other successor-bearing households) it is net 0. There is no configuration in which it is positive.\n\nAND THE MARKET LEG IS THE SAME SHAPE, by its own docstring: `saas/customers.py::make_acquired_customer` -- \"Electricity only (no gas leg in Phase 8a)\", and it is called once per win with one `new_cid`. So NEITHER contested win channel can replace a gas leg. GAS AQ IS A ONE-WAY RATCHET AT HEAD: every path that can lose a domestic gas leg exists, and no path that can regain one does. 63,000 kWh of domestic AQ sits on C1g..C4g behind that ratchet. (The volume is measured; its margin is not, and no monetary claim is made here.)\n\nCONSEQUENCE 2 OF THE 2026-08-15 NOTE IS FALSE, AND THE PUBLISHED RUN IS THE FALSIFIER. That note concluded, in capitals, \"NET GROWTH IS STRUCTURALLY IMPOSSIBLE TODAY ... Book size is therefore monotonically NON-INCREASING from the opening book.\" Billing-year census of `docs/reports/run_output_latest.json` (run at 19b56a53e), counting DISTINCT supply points that produced a bill in each year:\n\n    2016: 13   2017: 14   2018: 15   2019: 17   2020: 18   2021: 16   2022: 14   2023: 14   2024: 14   2025: 11\n\nThe book RISES by five supply points across 2017-2020 and takes a sixth in 2021. It is not monotone and it never was. The 2026-08-15 census was not careless: it enumerated every acquisition entry point in `run_phase2b.py` and each one really IS replacement-only, exactly as recorded. It missed the ADD path because the ADD path is not in the run loop -- IT IS IN THE BOOK CONSTRUCTOR. The run iterates a book it never enumerated, and a census of the loop cannot see it. That is the transferable lesson, and it is the reason this correction is worth more than the fact it corrects.\n\nWHERE THE GROWTH ACTUALLY COMES FROM -- SEVEN SUPPLY POINTS, NOT ONE OF THEM WON. (i) FIVE from the STATIC ROSTER'S STAGGERED DATES: `saas.customers.CUSTOMERS` hand-authors `acquisition_date` 2017-01-01 (C_IC1), 2018-01-01 (C_IC2), 2019-01-01 (C_IC3 and C_IC3g), 2020-01-01 (C_IC4) -- one I&C site a year, each on New Year's Day, as literals in a committed list. (ii) TWO from the CURRICULUM DRAW: `simulation/live_population.py::live_population()` returns `list(CUSTOMERS) + drawn` when the population draw is enabled, and it IS enabled in the published run -- `docs/design/curriculum/population_draw_activation.json` carries `activated.value: true` on the director's console word of 2026-08-13, and at base seed 20260724 the Profile-B lambda=1.0 trickle realises as SYN-2021-001 (2021-12-23) and SYN-2025-001 (2025-11-28).\n\nNONE OF THE SEVEN PASSES A FUNNEL, COSTS A PENNY, CONTESTS A COMPETITOR, OR CAN FAIL. The run's own totals close the arithmetic with nothing left over: `total_acquisition_spend_gbp` is 862.50, which is exactly the four funnel entries (150.00 + 300.00 + 300.00 + 112.50), all four on C3/C4/C5/C6 replacements, all four `won: false`; `acquired_customers` is `[]`; `won_successor_activations` is `{}`. Meanwhile the CONTESTED channels fired ten times in ten years -- five home-move rolls (one at each churn: C3 2020-06-30, C5 2020-12-30, C1 2021-12-30, C6 2024-03-30, C4 2024-09-29, every one `home_move_won: false`), four funnel attempts, and one further attempt suppressed at the acquisition gate -- and won ZERO. EVERY SUPPLY POINT THIS COMPANY GAINED IN TEN YEARS WAS GRANTED; EVERY ONE IT CONTESTED, IT LOST. That sentence is the atom's gain statement read back off the live run, and it is the case for building it.\n\nCONSEQUENCE -- CRITERION (c) IS RED AT HEAD WITH SEVEN NAMED INSTANCES, and the 2026-08-15 note's \"There is no step change to remove\" is the same error in its other half. Criterion (c) forbids \"a step change in book size that is not a modelled acquisition or loss event\". Seven are live in the published run and five of them have been committed since the roster was written. Criterion (c) is amended above to NAME them, so that no future pass can read it as already met.\n\nCONSEQUENCE -- THE 2026-08-15 AMENDMENT CLOSED ONE FAIL-OPEN AND OPENED ANOTHER, AND I HAVE RE-AMENDED CRITERION (b) ABOVE. That amendment replaced \"demonstrate a world in which the book SHRINKS\" (vacuous, because on its reading the book could only shrink) with \"a world in which it GROWS and one in which it SHRINKS\". On the evidence above BOTH directions are already demonstrable on unmodified HEAD, so the amended test passes before the atom is built -- the identical R15 fail-open, one direction over. The defect in both drafts is one defect: THE CRITERION TESTED THE SHAPE OF THE CURVE WHEN THE RULING IS ABOUT THE IDENTITY OF THE MECHANISM. Criterion (b) now demands both legs from the same contested mechanism and carries a NULL CONTROL that moves the sample and not the law -- (b1) arrival stream held FIXED, company market position alone must move the book in both directions; (b2) arrival stream EMPTIED, the book must still be able to grow. Neither half suffices alone: (b1) is satisfiable by the curriculum, (b2) by a growth curve that cannot be lost. The DIRECTOR'S property is untouched at both amendments; only the worker's rendering of the test changed, twice, and both changes are recorded here rather than quietly applied -- the mint receipt (PLANNER_MINTED_population_and_book_growth_2026-08-11.md) makes the test wording the worker's to render.\n\nA NOTE ON MAGNITUDE, because it changes what \"growth\" is being asked for. SYN-2025-001 arrives 2025-11-28, thirty-three days before the report window closes, and produced NO bill -- it is in the book and absent from `per_customer_lifetime`. So the activation record's \"TWO customers\" realises as ONE billing customer in the published window, set against seven supply points lost. The company ends 2025 serving 11 supply points, having started 2016 with 13 and peaked at 18, and having won none of the difference. Whatever PB3 builds is not a refinement to a growing book; it is the first mechanism by which this book can grow on purpose.\n\nSEQUENCING -- THE ORDER HOLDS, THE REASON HAS CHANGED, THE URGENCY HAS RISEN. The 2026-08-14/15 notes ordered PB2, then B4, then this atom's build. That order stands. Its stated reason does not: \"the opening book is the book's permanent CEILING, so PB2's number is the only thing that sets the company's scale at all\" died with Consequence 2. The live reason is stronger. PB2 (the opening book won, not assigned) and PB3's criterion (c) are now THE SAME QUESTION, because five of the seven step changes ARE the opening roster's staggered dates and the remaining two are the curriculum's. Whoever builds PB2 has to decide what an I&C site arriving on 2017-01-01 IS; PB3 cannot answer that separately, and a PB3 built first would wire a contested ongoing loop on top of six or seven uncontested arrivals and measure a gap that is mostly them.\n\nNOT MEASURED THIS TICK, SAID PLAINLY. (1) Whether the 2017-2020 I&C arrivals were ever INTENDED as won events: no mint, ruling or design doc was read for them this tick, and nothing here claims they are a defect rather than a deliberate opening-book construction. Criterion (c) is called RED against its own words, not against an author's intent. (2) Whether a run with `SE_DRAW_POPULATION` off would change the census: the five static step changes are flag-independent by construction (they are literals in `CUSTOMERS`), but no such run was executed here and the claim is `inferred` for that configuration. (3) The home-move DOUBLE-COUNT question -- the LATENT finding of 2026-08-14, that `effective_p_retain` may fold the win probability in and then roll it again -- was NOT re-opened by this tick; it bears on how OFTEN the home-move leg fires, not on the net-book-size answer above, which holds for any firing rate."
