atom_id: PB3_book_growth_as_earned_outcome
map_notes:
  name: 'Deliverable 3: growth from the opening book is GRADUAL AND EARNED -- won and lost against the market through the acquisition physics already built, never incremented. EXIT: (a) the mechanisms named and wired, not gestured at: churn, acquisition cost, and the competitor field (W2_3_competitor_field and B4_competitor_field are the existing world/company organs; B10_competitor_switching_response is the switching response) -- this atom is the loop that makes book size THEIR outcome; (b) the falsifier IS the exit test, because the ruling states the property directly -- a growth curve that cannot be lost is not a growth curve, so a world configuration in which the book SHRINKS must be demonstrated, not argued; (c) no step change in book size that is not a modelled acquisition or loss event; (d) the company''s own belief about its book and the world''s truth are measured against each other and the gap reported, per the coupled-triad rule that the gap is the score.'
  discover_note: '2026-08-14 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code written; file_scope is empty and stays empty -- this atom is loop_stage: idle and EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom while BUILD is not.


    WHAT IS ALREADY WIRED, READ OFF HEAD. The LOSS half of this loop is real and calibrated: W2_3_competitor_field (level 1, harden) is `simulation/market_switching_propensity.py`, a savings-elasticity churn multiplier fit to real DESNZ/Ofgem switching series 2015-2025 (the 2022 ''nowhere cheaper to go'' collapse is in the calibration, not asserted from theory). Customers leaving THIS book to a competitor is therefore a modelled event with an external anchor, not a step change -- the property clause (c) of this atom''s exit criterion already asks for.


    WHAT IS NOT WIRED, READ OFF HEAD. The GAIN half has no symmetric mechanism yet. B4_competitor_field (level 0, idle, file_scope empty) -- the company-OBSERVABLE side of the competitor field the epistemic wall would require before pricing/CRM could react to it -- is unbuilt. B10_competitor_switching_response (level 0, provenance: proposal) names `sim/competitor_field.py` in its own file_scope; that file does not exist (`ls sim/competitor_field.py` -> No such file or directory) -- the response side of switching-IN is a proposal, not code. And PB3''s own `depends_on`, PB2_opening_book_won_not_assigned, is ITSELF level 0/idle -- the atom that establishes the company''s OPENING book as won-not-assigned has not been built, so PB3''s exit criterion (c), ''no step change in book size that is not a modelled acquisition or loss event'', currently has no acquisition event to point at even for the starting book.


    SO THE LOOP AS SPECIFIED IS ONE-SIDED TODAY: losses are a modelled, externally-anchored event (W2_3); gains are not -- there is no competitor-switching-IN event, and the company-side observable that a switching-in response would react to (B4) is also unbuilt. A book that can currently only shrink through modelled events and can only grow through whatever unmodelled path company/crm/acquisition_strategy_book.py and acquisition_cohort.py already provide (present at HEAD, not audited by this tick) is not yet the two-sided ''won and lost against the market'' loop this atom''s gain statement asks for.


    FRAME -- THE RECOMMENDATION, IN DEPENDENCY ORDER. (1) PB2 first: PB3 depends_on it and it is the atom that makes the OPENING book a won event rather than an assigned number -- building PB3 ahead of PB2 would wire the ONGOING loop onto a starting condition that is still a step change. (2) B4_competitor_field next, or in parallel if file_scope proves disjoint: PB3''s exit criterion explicitly names it as one of the mechanisms this atom must wire, not gesture at. (3) THEN this atom''s own build: a switching-IN event modelled with the same discipline as W2_3''s switching-OUT (savings-elasticity, externally anchored where a real benchmark exists), so the falsifier the ruling asks for -- a world configuration in which the book SHRINKS -- is a property of the SAME mechanism that lets it grow, not a separately-bolted failure mode.


    NOT MEASURED THIS TICK, SAID PLAINLY: whether company/crm/acquisition_strategy_book.py / acquisition_cohort.py already model an acquisition EVENT in the sense clause (c) asks for, or whether the opening/current book size is presently just a target number the sim draws to. That audit is the natural next DISCOVER step and is not done here -- `inferred`, not observed, not asserted as fact above.'
