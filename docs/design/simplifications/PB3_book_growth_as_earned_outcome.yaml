atom_id: PB3_book_growth_as_earned_outcome
map_notes:
  name: 'Deliverable 3: growth from the opening book is GRADUAL AND EARNED -- won and lost against the market through the acquisition physics already built, never incremented. EXIT: (a) the mechanisms named and wired, not gestured at: churn, acquisition cost, and the competitor field (W2_3_competitor_field and B4_competitor_field are the existing world/company organs; B10_competitor_switching_response is the switching response) -- this atom is the loop that makes book size THEIR outcome; (b) the falsifier IS the exit test, because the ruling states the property directly -- a growth curve that cannot be lost is not a growth curve. AMENDED 2026-08-15 (DISCOVER, worker tick) because the original wording was vacuous: it asked only that a world configuration in which the book SHRINKS be demonstrated, and at HEAD the book can ONLY shrink -- acquisition is replacement-only and can fail, so book size is monotonically non-increasing -- which means that test passes on unbuilt code, an R15 fail-open. BOTH legs are now required, from the SAME mechanism and neither bolted on: a world configuration in which the book GROWS and one in which it SHRINKS, each demonstrated, not argued; (c) no step change in book size that is not a modelled acquisition or loss event; (d) the company''s own belief about its book and the world''s truth are measured against each other and the gap reported, per the coupled-triad rule that the gap is the score.'
  discover_note: '2026-08-14 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code written; file_scope is empty and stays empty -- this atom is loop_stage: idle and EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom while BUILD is not.


    WHAT IS ALREADY WIRED, READ OFF HEAD. The LOSS half of this loop is real and calibrated: W2_3_competitor_field (level 1, harden) is `simulation/market_switching_propensity.py`, a savings-elasticity churn multiplier fit to real DESNZ/Ofgem switching series 2015-2025 (the 2022 ''nowhere cheaper to go'' collapse is in the calibration, not asserted from theory). Customers leaving THIS book to a competitor is therefore a modelled event with an external anchor, not a step change -- the property clause (c) of this atom''s exit criterion already asks for.


    WHAT IS NOT WIRED, READ OFF HEAD. The GAIN half has no symmetric mechanism yet. B4_competitor_field (level 0, idle, file_scope empty) -- the company-OBSERVABLE side of the competitor field the epistemic wall would require before pricing/CRM could react to it -- is unbuilt. B10_competitor_switching_response (level 0, provenance: proposal) names `sim/competitor_field.py` in its own file_scope; that file does not exist (`ls sim/competitor_field.py` -> No such file or directory) -- the response side of switching-IN is a proposal, not code. And PB3''s own `depends_on`, PB2_opening_book_won_not_assigned, is ITSELF level 0/idle -- the atom that establishes the company''s OPENING book as won-not-assigned has not been built, so PB3''s exit criterion (c), ''no step change in book size that is not a modelled acquisition or loss event'', currently has no acquisition event to point at even for the starting book.


    SO THE LOOP AS SPECIFIED IS ONE-SIDED TODAY: losses are a modelled, externally-anchored event (W2_3); gains are not -- there is no competitor-switching-IN event, and the company-side observable that a switching-in response would react to (B4) is also unbuilt. A book that can currently only shrink through modelled events and can only grow through whatever unmodelled path company/crm/acquisition_strategy_book.py and acquisition_cohort.py already provide (present at HEAD, not audited by this tick) is not yet the two-sided ''won and lost against the market'' loop this atom''s gain statement asks for.


    FRAME -- THE RECOMMENDATION, IN DEPENDENCY ORDER. (1) PB2 first: PB3 depends_on it and it is the atom that makes the OPENING book a won event rather than an assigned number -- building PB3 ahead of PB2 would wire the ONGOING loop onto a starting condition that is still a step change. (2) B4_competitor_field next, or in parallel if file_scope proves disjoint: PB3''s exit criterion explicitly names it as one of the mechanisms this atom must wire, not gesture at. (3) THEN this atom''s own build: a switching-IN event modelled with the same discipline as W2_3''s switching-OUT (savings-elasticity, externally anchored where a real benchmark exists), so the falsifier the ruling asks for -- a world configuration in which the book SHRINKS -- is a property of the SAME mechanism that lets it grow, not a separately-bolted failure mode.


    NOT MEASURED THIS TICK, SAID PLAINLY: whether company/crm/acquisition_strategy_book.py / acquisition_cohort.py already model an acquisition EVENT in the sense clause (c) asks for, or whether the opening/current book size is presently just a target number the sim draws to. That audit is the natural next DISCOVER step and is not done here -- `inferred`, not observed, not asserted as fact above.



    2026-08-15 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code; file_scope is empty and stays empty. This tick closes the one question the 2026-08-14 note left open and labelled `inferred` -- whether company/crm/acquisition_strategy_book.py / acquisition_cohort.py already model an acquisition EVENT in the sense clause (c) asks for, or whether book size is just a target number the sim draws to. ANSWER, `observed-with-evidence` at HEAD 035ec77ba, by census of the live run path.


    NEITHER, AND THE TRUE ANSWER IS SHARPER THAN BOTH. Book size is not a target the sim draws to -- there is no target-seeking on book size anywhere in the run. The acquisition event is real, well-built, and REPLACEMENT-ONLY. The census, every acquisition entry point in `simulation/run_phase2b.py`: (i) `make_acquired_customer` is called EXACTLY ONCE, line 1700, inside `if acq_won:` inside `elif mandate_permits_replacement():`, which sits inside the lifecycle/churn arm keyed on `billing_account` -- the DEPARTING account; (ii) `sim_interface.notify_acquisition` has EXACTLY TWO call sites, 1610 (`channel="home-move-win"`, the successor supply point of an account that is moving) and 1708 (`channel="market-acquisition"`, the replacement above), and BOTH pass `predecessor_id=billing_account`. The interfaces say it in their own docstrings: `company/interfaces/growth_desk.py::mandate_permits_replacement` -- "May the supplier go to market at all to replace a loss?"; `decide_acquisition` -- "Ask the supplier whether to go to market to replace a lost supply point." There is no code path by which this book gains an account without first losing one.


    CONSEQUENCE 1 -- CLAUSE (c) IS ALREADY HALF-MET, AND THE HALF IT MEETS IS THE LOSS HALF. Every book-size change in the live run is already a modelled event with real machinery behind it: `simulation/acquisition_funnel.py` walks quote -> application -> credit_check -> onboarding -> cooling_off with per-stage leakage, per-stage cost, real calendar spacing and a hard-anchored statutory 14-day cooling-off constant, and the loss side is W2_3''s externally-calibrated switching propensity. There is no step change to remove. What clause (c) is missing is not discipline -- it is an ADD path.


    CONSEQUENCE 2 -- NET GROWTH IS STRUCTURALLY IMPOSSIBLE TODAY. This is arithmetic, not judgement: one lost account authorises at most one replacement attempt (`suffix = _acquisition_counter.get(billing_account, 3)`, one `new_cid` per win), and that attempt can FAIL (the `else:` branch logs `[ACQUIRE] Fresh acquisition failed`). Book size is therefore monotonically NON-INCREASING from the opening book. This atom''s own `gain` line -- "book size becomes an outcome the company can fail at" -- is already true in one direction and unreachable in the other.


    CONSEQUENCE 3 -- THIS ATOM''S OWN FALSIFIER WAS VACUOUS, AND I HAVE AMENDED IT (see criterion (b) above, amended this tick). It asked for "a world configuration in which the book SHRINKS". Given Consequence 2 the book can only shrink, so that test passes on unmodified HEAD, before this atom is built at all -- it cannot fail on the defect it names, the R15 fail-open pattern. Criterion (b) now demands BOTH legs out of the SAME mechanism, which is what the ruling''s "won and lost against the market" actually says, and which is red at HEAD today. The DIRECTOR''S property is untouched; only the worker''s rendering of the test changed, and the mint receipt (PLANNER_MINTED_population_and_book_growth_2026-08-11.md) makes the test wording the worker''s.


    A FOURTH FINDING, outside the exit criteria, offered to whoever builds this. THE "FRESH MARKET" ACQUISITION IS A CLONE AT THE SAME ADDRESS. `saas/customers.py::make_acquired_customer` stamps `acquisition_type: "fresh_market"` and `successor_of: <predecessor>`, then copies `location`, `home_type`, `bedrooms`, `epc_rating`, `eac_kwh`, `contract_type` and `segment` straight off the departing customer. So the company can never acquire a household unlike one it already had, nor at an address it did not already serve: the acquired book carries the opening book''s distribution by construction. Any PB3 build that adds an ADD path must draw the incoming customer from the WORLD''s population -- through the wall, arriving by onboarding/interface events as the ruling requires -- and not clone the outgoing one, or book GROWTH will simply inherit this degeneracy at larger scale.


    SEQUENCING UNCHANGED from the 2026-08-14 note (PB2, then B4, then this atom''s build), and now better supported: PB2 makes the OPENING book a won event, and since Consequence 2 makes the opening book the book''s permanent CEILING, PB2''s number is currently the only thing that sets the company''s scale at all.


    NOT MEASURED THIS TICK, said plainly: the home-move leg (line 1610) was read for its call shape and predecessor argument only -- whether a home-move win can ever be NET positive for book size was not traced through `won_successor_activations`, and no claim either way is made here. That is the next DISCOVER step if one is wanted before PB2.'
