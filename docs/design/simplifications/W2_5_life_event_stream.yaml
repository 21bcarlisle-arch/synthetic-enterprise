simplifications:
- '2026-07-13 -> L3 (binding rule satisfied: twin C7_life_event_detection built + belief-vs-truth gap 0.0081 measured; coupled_triad L3 gate UNBLOCKED). QUEUED DEFECT (W2_6 fork caught, SELF_INTERRUPT queue, fix at next touch): generate_life_events() fires RESIDENTIAL demographic events (new_baby/retirement/etc) for SME/I&C customers too -- an R10 absurdity (an SME has no new baby). Fix = gate residential demographic events to the residential segment in life_events.py. W2_6 already guards its side (ValueError on resi). || 2026-07-13 SUBSTREAM DISCIPLINE BUILT (BUILD_THE_BACKLOG P0, fork, resumed+landed post-crash): each emitted event type draws from its OWN named seeded substream (_LIFE_EVENT_SUBSTREAMS), so a new event type can NEVER shift another subsystem RNG -- the structural fix for the real 01:09Z incident. Stable-hash seeds => deterministic replay across processes. 15 isolation tests, epistemic PASS, 276 dependents green. HELD at L2: per the coupled-triad binding rule, W2_5->L3 is gated on its twin C7_life_event_detection existing with a measured belief-vs-truth gap (C7 not yet built). || 2026-07-12 REGISTERED, NOT BUILT (AFFORDABILITY_AS_SIM_PHYSICS.md item 2, director-decided). ONE event generator serving BOTH the payment-difficulty triggers (this cluster) AND the adoption journey''s key-moment conversion windows (C5_key_moment_conversion, registered 2026-07-11). Do NOT build two -- ''one substrate, two consumers'', same principle as the reveal-over-time spine. Anchor event incidences to real UK population statistics (ONS life-events / labour-market flows / demographic rates) [L] where magnitudes are uncertain. Build in M3 with the population draw.'
- '2026-07-12 DISCOVER pass (self-refill draw, no BUILD code). Real, current (2026) anchors found for each named event: unemployment 4.9% (1.76M people, Feb-Apr 2026) is a REAL, DISTINCT UK statistical category from economic inactivity due to long-term sickness (9.14M inactive, 21.0% rate, with its own ONS-tracked sickness breakdown) -- supports keeping job-loss and illness as genuinely separate hidden-state events, not merged. Divorce: 102,678 in England & Wales (2023, ''return to pre-pandemic levels''). New child: total fertility rate 1.41 children/woman (2024), the THIRD consecutive UK record-low year -- a real, ongoing decline, not a stable constant, flagged for the baseline/curriculum split (R13). Retirement: ONS confirmed to publish real State Pension age flow data, but the dataset surfaced in this pass only covers up to 2021 -- a genuine gap, not filled by assumption. Shared-generator design reinforced (not just re-asserted): real UK statistical practice already treats these as genuinely distinct, separately-measured, independently-trending categories -- supports one event-bus substrate with many named event types over a single blended distress score. Honest gaps named: no per-household annual hazard rate derived for any event (raw ONS figures are economy-wide stocks/flows or absolute annual counts, not yet converted to a per-customer probability -- real unstarted FRAME/BUILD work); no direct quantified UK link found between these life events and ENERGY-BILL payment difficulty specifically (asserted by this atom''s own registration and real-world plausibility, not independently sourced with a number here). No BUILD code, no level change. Full findings: docs/market_research/life_event_stream_w2_5.md.'
- '2026-07-13 DISCOVER addendum, closes the retirement-flow gap named above (self-refill draw, no BUILD code). Real, current (2025/26) figures found: 13.2 million state pensioners in Great Britain 2025/26; 13.1 million receiving the State Pension at Feb 2025, up 210,000 year-on-year -- a real, current annual net-flow anchor (not the exact prior dataset''s 2021 cutoff). Separately, 4.7 million on the post-2016-reform ''new State Pension'' (nSP), up 720,000 y/y -- a second real, current flow-adjacent figure. Live, in-motion policy fact directly relevant to this event''s own timing distribution: State Pension age rises to 67 starting April 2026, completing March 2028 -- retirement timing is not a stable historical constant over the atom''s own eventual simulation horizon, reinforcing the same baseline/curriculum caution (R13) already flagged for the fertility-rate finding above. All five named life events now have a real, current (not merely historical) anchor.'
- '2026-07-13 MIS-REGISTRATION CORRECTED, level 0->2 on decisive existing evidence, no new code (self-refill draw, same correction class already applied this session to D2/G2/W2_3/D3 -- an atom''s own code got built as a byproduct of a different phase''s work and was never credited here). Registration said ''Build in M3 with the population draw'' implying zero prior art; checked internal code directly and found this is substantially stale. simulation/life_events.py (''Phase B -- Life events engine'') is REAL, LIVE, ONS-calibrated infrastructure already covering 3 of this atom''s 5 named events: job_loss (2.2%/year, ONS Labour Market Statistics), income_recovery (50%/year conditional, median UK unemployment spell ~6 months), new_baby (1.1%/year, ONS Birth Summary Tables), retirement_starts (era-calibrated by build cohort, ONS Labour Force Survey). Confirmed genuinely wired, not dead code: simulation/household_demand.py imports and calls generate_life_events(), and household_demand is itself imported by simulation/run_phase2b.py, the real production entry point -- the resulting income_stress state is consumed downstream by simulation/switching_propensity.py for real churn-probability effects (confirmed via the earlier PRIORITIES.md Gap-3-dimension-3 record: ''switching_propensity.py wires income_stress into roll_lifecycle_event''). 88 passing tests across 4 real test files. CRITICALLY, this SAME event stream ALSO already generates C5_key_moment_conversion''s own named key moments (solar_install, ev_acquired, smart_meter_installed, boiler_replaced, insulation_upgraded) from the identical generate_life_events() call -- the registration''s own ''ONE event generator serving BOTH the payment-difficulty triggers AND the adoption journey''s key-moment conversion windows'' requirement is not just satisfied in principle, it is ALREADY BUILT this way, confirmed by reading the actual code rather than assumed from the architecture note. HONEST REMAINING GAP, not glossed over: illness and divorce (2 of the 5 named events) are NOT present anywhere in simulation/life_events.py''s own EventType literal -- genuinely unbuilt on the SIM side. A separate, broader COMPANY-side taxonomy (company/crm/life_events.py::LifeEventType, including DIVORCE/SERIOUS_ILLNESS/MARRIAGE/DEATH/MOVE_IN/MOVE_OUT/BENEFIT_CHANGE, plus company/crm/life_event_impact.py''s severity/impact-score/recommended-action mappings) exists and is real, well-structured code -- but confirmed via grep: ZERO non-test callers anywhere, the SAME orphaned-capability class already registered cross-cuttingly in PRIORITIES.md (added as a new instance there). Precise remaining scope for this atom''s own L3: (a) extend simulation/life_events.py to also generate illness/divorce events (real ONS anchors for both already found in this atom''s own earlier DISCOVER passes), (b) wire company/crm/life_events.py''s broader taxonomy to a real detection/inference consumer instead of leaving it orphaned. level_current 0->2 (L2: exists, wired, tested, proven correct in a real production pathway) -- not yet L3 (2 of 5 named events missing, company-side consumer orphaned, no Expert-Hour pass). loop_stage idle->harden (genuine remaining work identified, matching this session''s convention for atoms with real but incomplete evidence).'
- '2026-07-13 EXPERT HOUR RUN, PASS (fresh-context phase-close-evaluator agent, no memory of the build, dispatched specifically to adversarially check the just-made L2 claim before trusting it further). Verdict: PASS with one minor correction. The L2 claim''s own text overstated smart_meter_installed as one of the events ''generated from the identical generate_life_events() call'' -- verified FALSE: smart_meter_installed exists in the EventType literal and in apply_events() (simulation/life_events.py:432) but is NEVER actually emitted by the generator loop itself, only consumed. The ''one shared generator'' claim still holds on the other ten real event types, so the verdict/level is unaffected -- but this specific event must not be carried forward as evidence of the shared-substrate claim. All 7 adversarial checks independently re-verified against real code, not the claim: production wiring reaches run_phase2b.py genuinely (confirmed the ONLY non-test importer of household_demand); ONS-cited probabilities have sensible real magnitudes, not placeholders; income_stress genuinely flows into a real churn multiplier, not dead state; 88 tests exercise genuine state transitions; the illness/divorce gap and the company/crm orphan-pair were both independently re-confirmed (including ruling out vulnerability_register.py''s own separate SERIOUS_ILLNESS enum as a coincidental non-match, not a hidden consumer); epistemic wall confirmed clean. SEPARATE STALE-DEPENDENCY CORRECTION found and fixed same pass (same class as D2/D3/E3/B1 this session): depends_on:[W2_2_population_draw] was cleared -- simulation/life_events.py already operates correctly on the CURRENT fixed CUSTOMERS cast today (W2_2 itself is still level 0, unbuilt), so this atom''s real, wired L2 mechanism was never actually blocked on the population draw; the dependency was set at registration time on the whole-atom abstraction and never revisited. loop_stage stays harden (target L3 requires the illness/divorce extension + wiring the orphaned company-side taxonomy, both real remaining BUILD work, not further HARDEN investigation).'
- '2026-07-13 REAL BUILD, illness + divorce added (self-refill draw, loop_stage=harden with no DISCOVER-only caveat -- genuine BUILD authorization, matching the pattern already used for B1/E3 this session). Closed the first of the two named L3 blockers: extended simulation/life_events.py with the two remaining named events, both real, ONS/health-data-anchored, not guessed. illness (income_stress -> HIGH, shares job_loss''s own HIGH-stress gate and income_recovery''s own recovery transition rather than inventing a second recovery path, since income_stress is a single state variable not tracked per-cause): no direct UK annual new-onset incidence rate was found in two real search attempts (registered honestly in-code, not hidden) -- used ONS/Health Foundation disability PREVALENCE growth (~0.9 percentage points/year, 2019-2023) as an explicitly-caveated proxy, noting in the code comment that this likely UNDERSTATES true gross onset since it is a net figure. divorce (income_stress LOW->MODERATE, same gate as new_baby/retirement): 102,678 divorces in England & Wales 2023 (ONS) / 28.4 million UK households 2023 (ONS Families and Households) =~ 0.36%/household/year, applied to all households the same simplification level as new_baby''s own not-fertile-age-conditioned rate. Verified: 9 new tests (LifeEvent construction, apply_events state transitions incl. non-lowering of HIGH stress, probability-constant sanity bounds, and a 200-seed sweep proving generate_life_events() genuinely reaches both new branches, not just apply_events() in isolation) -- full related suite 97/97 pass (was 88), epistemic verifier PASS, no other code in the codebase pattern-matches LifeEvent.event_type exhaustively (grepped, only life_events.py itself does). Module docstring updated to list all now-real event types, including an honest note that smart_meter_installed (per the just-run Expert Hour finding) is consumed but never generated. Remaining L3 blocker: company/crm/life_events.py''s broader taxonomy is still orphaned -- wiring it to a real detection/inference consumer is a separate, larger BUILD task, not attempted this pass, and a fresh Expert Hour on this new code is needed before an L3 claim. level_current stays 2 (this closes one of two named blockers, not the whole bar) -- loop_stage stays harden pending that fresh review.'
- '2026-07-13 R1/R11 LIVE VERIFICATION, real downstream confound found and fixed (self-refill draw). The next real sim run built on the illness/divorce BUILD hit a real test failure before publishing (correctly caught by process_run_complete.py''s own gate, not silently pushed through): tests/tools/test_year_spotlight.py::test_crisis_year_2022_worse_than_2020 failed (organic_bill_shock_count 2022=55 < 2020=60). Diagnosed directly (R4), not assumed: adding illness/divorce draws to the shared econ_rng stream legitimately shifted per-customer churn timing (expected PRNG behaviour, same class already anticipated by this atom''s own file_scope), which changed ACTIVE ACCOUNT COUNTS per year (18 in 2020 vs 13 in 2022 in this run) independent of real market severity -- a second, different population-composition confound from the one D3''s own 2026-07-12 Expert Hour already fixed (closure-timing). Normalizing to organic shocks PER ACTIVE ACCOUNT restored the real crisis-year relationship (2020 rate 3.33, 2022 rate 4.23) -- fixed as a class-level correction (R10: rate-based comparison, robust to population-composition differences between years), not a loosened threshold. Verified: 14/14 tests pass, epistemic verifier PASS. The underlying sim run then published successfully (net margin GBP1,505,286, a real, modest, legitimate shift from GBP1,524,058 -- expected per R13, baseline changes for fidelity reasons may shift historical figures).'
- '2026-07-13 FRAME pass on the remaining L3 blocker (self-refill draw, no BUILD code -- deliberately sizing before attempting, not rushing a design decision). Investigated what wiring company/crm/life_events.py''s orphaned taxonomy to a real detection consumer would actually require. Checked for an existing detection-pattern precedent to reuse rather than invent one: found NONE -- company/crm/vulnerability_register.py''s own VulnerabilityFlag enum (the closest structurally-similar mechanism, real severity weights + recommended actions) is ALSO entirely orphaned, zero external callers anywhere in the codebase (grepped directly). This means wiring the life-event taxonomy is NOT a small ''connect existing signal to existing taxonomy'' task -- it requires DESIGNING a genuinely new detection heuristic from scratch: what OBSERVABLE company-side signals (payment-behaviour changes, contact/complaint patterns, address changes) could legitimately proxy for illness/divorce/serious-illness without reading SIM ground truth directly (the epistemic wall applies here as much as anywhere), and there is no existing real-world-anchored research in this project on which observable signals correlate with which life events at what confidence. This is a materially bigger, genuinely greenfield design question than the SIM-side illness/divorce addition was -- correctly NOT attempted this pass. Honest conclusion: this atom has reached a solid, real, twice-Expert-Hour-verified, live-run-verified L2 state; the remaining L3 work needs its own dedicated DISCOVER pass (real-world research on observable vulnerability-detection signals, likely overlapping with W2_7_willingness_classification''s own classify-under-uncertainty scope) before any BUILD attempt, not an incremental wiring task.'
- '2026-07-13 DISCOVER pass on the dedicated question just named above (self-refill draw, no BUILD code). Real, current UK anchors found for observable vulnerability-detection signals: real energy-sector practice names ''a series of missed bills, reduced engagement, changed usage patterns'' as the genuine observable proxies suppliers use -- i.e. payment-pattern change, contact/engagement drop-off, and consumption anomaly, all epistemic-wall-compliant (none require reading SIM ground truth). [L] Ofgem''s own PSR framework confirms the regulatory OBLIGATION side: suppliers ''must take all reasonable steps to identify customers in vulnerable situations'' from day-to-day interactions, not wait for self-disclosure -- ''customers rarely flag vulnerability proactively'', reinforcing this atom''s own C/F framing that detection is a genuine company-side inference task, not a lookup. [L] Real, current, quantified stakes anchor: Ovo Energy was required to pay GBP11.5m over failings in support for vulnerable customers -- a real, named, current enforcement precedent for exactly the ''missed detection is a harm event'' framing this atom''s own registration already asserts, not a hypothetical. Real primary source named for the eventual FRAME/BUILD pass to consult directly (not yet read in full this pass): Energy UK''s 2025 Vulnerability Commitment Good Practice Guide. Honest gap, not resolved here: no specific quantified confidence/threshold mapping (e.g. ''N consecutive missed payments implies X% probability of illness vs divorce vs simple hardship'') was found -- the real anchors ground WHICH signals are legitimate, not HOW to combine them into a detector; that remains real FRAME/BUILD work, correctly deferred.'
- '2026-07-13 IDLE-HOLE FIX, loop_stage harden->idle (self-refill drew this exact atom 15+ turns running, confirmed by direct inspection: recomputed the real harden-tier candidate pool and found this atom was THE ONLY valid candidate, matching the exact H7_skills_and_rules idle-hole class fixed earlier this session -- guaranteed reselection, not landing on it by chance). Root cause here is a NEW variant of the same structural class: not a stale dependency, not a session-lifecycle block, but a genuinely correct atom whose only remaining step (designing a vulnerability-detection heuristic from real, now well-anchored signals) is a substantial, deliberate BUILD/design effort this project''s own discipline says should not be rushed into on a single self-refill draw -- three consecutive DISCOVER/FRAME passes have already thoroughly grounded the real anchors (signals, regulatory obligation, enforcement stakes); repeating a fourth would be pure repetition, not new evidence. loop_stage set to idle -- not an epoch-parked state in the usual sense, but the honest way to say ''real work identified and well-anchored, awaiting a deliberate BUILD session or director steer on scope/sequencing, not further self-refill investigation.'' Reset to harden the moment a genuine BUILD attempt (or a director decision on this atom''s own sequencing) is made -- not automatically, and not by this atom re-investigating itself again with no new evidence to offer.'
- '2026-07-16 HARDEN/red-team pass (H17 Rule-0 self-refill, dial yielded -- no below-target work; W2_5 at-target L3). Closed the atom''s own QUEUED DEFECT (''generate_life_events() fires residential demographic events for SME/I&C too'') as an R10 CLASS-LEVEL closure, not an instance fix. Finding first (evidence, not narrative): the defect is NOT currently live -- swept all 18 real roster customers x 200 seeds, ZERO SME/I&C accounts receive any demographic event (job_loss/income_recovery/new_baby/retirement_starts/illness/divorce); the pre-existing `if household.is_residential:` gate (present since 2026-07-01, commit f9f7f5b3d) already excludes them. The residual was a LATENT proxy hole: the gate keys on property_type (is_residential), used as a proxy for segment==''resi'' because Household carries no `segment` field -- correct for the authored roster (every SME/I&C maps to a commercial/industrial property_type) but a semantic proxy that could silently diverge if a future roster placed a business in a residential dwelling (a real sole-trader case). Hardened WITHIN file_scope (simulation/life_events.py only; household.py out of scope, so no segment field added): (1) made the contract EXPLICIT -- named constant _RESIDENTIAL_ONLY_DEMOGRAPHIC_EVENTS (the six demographic types) + documented the property_type-as-segment-proxy and the invariant that locks it; (2) added CLASS-LEVEL control tests (R10): no business-property household emits any demographic event across all 5 business property_types x 300 seeds, business households emit only physical-adoption events, and a real-roster invariant asserting every SME/I&C-segment customer maps to a non-residential property_type AND leaks zero demographic events (fails loudly the moment a future roster breaks the proxy alignment); (3) proved the control is LOAD-BEARING and can FAIL on its named defect (R15 mutation test): with the is_residential gate disabled, SME C5 receives a ''divorce'' event and all three business-exclusion controls fail; restored -> green. Verified: 137/137 related tests pass (was 111), epistemic verifier PASS (510 files), no runtime behaviour change (gate logic byte-identical; additions are a constant + comments + tests). Level stays L3 (HARDEN, no promotion); the W2_6 QUEUED-DEFECT note is now discharged as a tested class-level invariant rather than an open queue item.'
- '2026-07-24 HARDEN/red-team pass (Rule-0 self-refill, dial yielded -- no below-target work; W2_5 at-target L3). Exit tests re-verified green (110 -> 111 pass; epistemic-neutral, test-only change). NEW DEFECT CAUGHT, QUEUED not fixed (observed-with-evidence, R9): the ==LOW-gated demographic events (new_baby, divorce) are gated on income_stress in the generator FIXED per-year PROCESSING order (income_recovery is processed before the bump events), but each event date is an INDEPENDENT per-substream draw and apply_events -- the ONLY income_stress any consumer sees (household_demand.income_stress_at_date -> the churn multiplier + bad-debt multiplier in run_phase2b) -- replays in DATE order. So when a same-year income_recovery is dated AFTER a new_baby/divorce it enabled, the canonical date-ordered timeline places the LOW-gated event while the household is still HIGH-stress -- violating the very gate the event was emitted under (a divorce-only-when-stable event landing on a HIGH-stress household) and silently dropping its stress bump. INCIDENCE: 0 at production seed 42 (NOT live -- a latent hole, same class as the residential-gate finding); 4/286 = 1.4 percent of new_baby+divorce events on the real 18-customer roster across a 200-seed sweep; grows as the book expands (W2_2). ROOT CAUSE (R4): emission gated in processing order vs reconstruction in date order. FIX SIZING: date-order the within-year demographic gate evaluation -- a BUILD (it shifts every household event stream, needs a full sim run + downstream triage + fresh Expert Hour; precedent = the prior income_stress change that broke the 2022-vs-2020 crisis-year test), NOT a bounded HARDEN patch, so QUEUED per SELF_INTERRUPT_DISCIPLINE. MECHANISED (MAKE_IT_STICK, R10 class-level detection): two controls in test_phase_b_life_events.py -- test_lowgated_demographic_events_hold_on_real_roster_seed42 (GREEN, proves not-live in production) and test_lowgated_demographic_gate_holds_in_canonical_timeline (xfail strict; R15 can-fail: proven to FIRE on the live defect over seeds 0-999, and auto-alarms XPASS -> strict-failure the day the generator is fixed, forcing this note closed). Level stays L3 (HARDEN, no promotion). SECONDARY OBSERVATION (milder fidelity simplification, noted not fixed): MODERATE income_stress has no self-recovery path -- 0 MODERATE->LOW transitions over 4000 households x 10yr, 2955/4000 starting MODERATE stay MODERATE, so a new_baby/divorce stress bump is effectively permanent unless the household transits HIGH then income_recovery; in reality these ease over time. A separate design/DISCOVER question (recovery rate needs an ONS anchor + R13 curriculum consideration).'
- '2026-07-27 HARDEN/red-team pass (Rule-0 self-refill, dial yielded -- no below-target work; W2_5 at-target L3). Exit tests re-verified green. Audited the SIBLING HALF of the 2026-07-24 emission/reconstruction defect above (audit-the-sibling-half-of-a-hardened-class, proven G5): the HIGH-gated demographic events job_loss/illness (gate income_stress!=HIGH, ''only when not already in crisis'') share the IDENTICAL root cause as the LOW-gated new_baby/divorce -- within-year gates evaluated in PROCESSING order, apply_events replays in DATE order. Finding (observed-with-evidence, R9): illness lands while the canonical timeline is already HIGH when a same-year income_recovery is dated AFTER it -- 0 violations at production seed 42 (NOT live, latent, same status as the LOW-gated half), 7 violations over a 2000-seed sweep on a HIGH-start household. job_loss cannot violate today (it and income_recovery are mutually exclusive per year via the if/elif) but is named in the contract for a future restructure. HARM DIFFERS, ROOT CAUSE IDENTICAL (honest scoping): apply_events sets income_stress=HIGH unconditionally for job_loss/illness so the reconstructed STATE value is not corrupted (unlike the LOW-gated silent no-op), but the emission precondition is still violated; the SAME BUILD fix (date-order the within-year gate evaluation) closes BOTH halves. MECHANISED (MAKE_IT_STICK, R10 class-level): two controls in test_phase_b_life_events.py mirroring the LOW-gated pair -- test_highgated_demographic_events_hold_on_real_roster_seed42 (GREEN, proves not-live in production) and test_highgated_demographic_gate_holds_in_canonical_timeline (xfail strict; R15 can-fail, proven to FIRE on the HIGH-start household over seeds 0-999, auto-alarms XPASS -> strict-failure the day the generator is fixed -- so the eventual BUILD is proven to close the WHOLE class, not one branch). 47 pass + 2 xfail in the file (was 46 pass + 1 xfail), epistemic-neutral (test-only). Level stays L3 (HARDEN, no promotion).'
- '2026-07-28 HARDEN/red-team pass (Rule-0 self-refill, dial yielded -- no below-target work; W2_5 at-target L3). Exit tests re-verified green (62 -> 64 pass, 2 xfail unchanged). NEW ANGLE, a DISTINCT concern from the generator emission/reconstruction defect above (which is the GENERATOR within-year gate ordering): the RECONSTRUCTION primitive apply_events() had NO ordering guard and replayed events in raw LIST order, while the canonical point-in-time state is DATE-ordered by definition. The income_stress state machine is order-sensitive (conditional LOW->MODERATE bumps + last-write-wins physical-adoption fields), so an out-of-order event list silently corrupts the reconstruction -- verified: [income_recovery@2020-03, divorce@2020-06] -> MODERATE, the same two reversed -> LOW, no error raised. NOT live today (the sole production caller household_demand -> household_at_date is handed a date-sorted list by generate_life_events), a LATENT FAIL-OPEN under C-S1 (event-arrival-tolerance: logic must be correct if events arrive singly/late/out of order, batch completeness may not be assumed). FIX (within file_scope, simulation/life_events.py only): apply_events now stable-sorts by event_date -- a no-op for the already-sorted production path, order-tolerant for any future accumulating consumer; downstream household_demand + C7 detection suites unchanged green, epistemic PASS. MECHANISED (R10 class-level, R15 can-fail): two controls in test_phase_b_life_events.py -- test_apply_events_income_stress_order_invariant_concrete and test_apply_events_permutation_invariant_full_state (200 seeds x 5 shuffles each) -- both proven to FIRE with the sort removed and pass restored. Level stays L3 (HARDEN, no promotion).'
