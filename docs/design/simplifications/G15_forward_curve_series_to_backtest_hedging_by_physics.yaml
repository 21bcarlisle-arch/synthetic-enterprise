atom_id: G15_forward_curve_series_to_backtest_hedging_by_physics
map_notes:
  gain: 'AUTHORISED 2026-09-06 by the use-case register ruling section 3.2, the second of the two pulls, and the register''s own fidelity table marks it as the gap standing between use case 3.1 (hedging by physics) and any test of it: ''cell weather with synchrony; gradient distribution; HEDGE COST MODEL AND FORWARD CURVES''. It is also the held-batch forward-curve backtesting item, so this is a parked thing being unparked rather than new ground -- look for that batch before pulling. RANKED BELOW STAGE 1: 3.1 is stage 3 and the director has ruled no use case is built until the world and billing are done, so this buys the ability to TEST later, not to build now. WHAT MAKES IT HARD IS NOT THE PULL: a forward curve is a price for a delivery period as of a trade date, so it is bitemporal by nature, and a series stored without its as-of date is unusable for backtesting -- it would let the company hedge on prices it could not have seen, which is the point-in-time wall in its purest form.'
