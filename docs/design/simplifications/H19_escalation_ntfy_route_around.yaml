- '2026-07-28 RULE-0 AT-TARGET HARDEN #2 (L2->L2 held; dial=3 yielded, no below-target work -- to-do list never empty). NEW DEFECT FOUND + FIXED (red-team of this atoms OWN core invariant, a blocked atom blocks only itself / the loop keeps drawing OTHER atoms): the escalated branch in run_loop reset consecutive_failures=0 -- a FAIL-OPEN of the R3 repeated-failure HALT net. A wedged atom whose turn ALTERNATES failed/escalated on the SAME wall paged the director exactly ONCE (fire-once gate), then the reset pinned consecutive_failures below the two-strike threshold forever, so the wedged-detection safety net was SILENTLY DISARMED and the loop burned real per-cycle turn-spend on a broken atom -- the silent-stall class this atom exists to kill, relocated into a backoff loop. Reproduced empirically FIRST (R9): 50 failures interleaved with escalations on the same wall -> 0 halts, 1 page, stopped only by max_cycles. FIX (in file_scope, background/executor_governor.py): an escalation neither arms nor disarms R3 -- ONLY a real success clears the streak; a pure-escalation stream keeps cf=0 and never halts (correct), while genuine no-progress wedging still trips the halt. R15: new test test_escalation_does_not_disarm_the_repeated_failure_halt FAILS on the reverted mechanism (restore consecutive_failures=0 -> stop_reason=max_cycles not repeated_failure) and passes on the fix; suite 31->32. Blast radius GREEN (116 across executor_governor/action_needed/build_executor/executor_daemon/publish_gate_alert). KNOWN residual gap still NOT re-filed (SELF_INTERRUPT): draw-layer open-escalation exclusion pending H9_map_write_serialisation. Level held (HARDEN never moves the cell).'
