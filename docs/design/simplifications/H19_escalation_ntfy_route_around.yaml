- '2026-07-18 NTFY TAXONOMY absorbed (director [STEER] ADVISOR_STEER_NTFY_TAXONOMY, "Are these messages the right ones?"). The channel-RECIPIENT rule (who each message is FOR): [ACT] -> director PHONE (only when his authority is required, pre-framed to a tap/word); [FYI] -> director phone SPARINGLY (major transitions only, R5: loop live/paused, a level banked on his ratification, a front opened, fault+recovery -- one line); [STEER] -> the ADVISOR not the director (advisory Q + your default, proceed; the advisor reads the mirror + answers via staging; the director sees these in the mirror, not as pages); OPERATIONAL ALARMS (publish-gate class) -> YOURSELF or the advisor, NEVER the director (the publish_gate [ACTION NEEDED] telling the director to check logs + run suites was the WRONG recipient -- self-handle, page the advisor via mirror if stuck, the director only if it becomes a genuine [ACT]); ADVISOR-STAGING RECEIPTS -> mirror only; EVERYTHING ELSE -> mirror only, silent to the phone. THE BAR: the director''s phone gets [ACT] + rare [FYI], nothing else; all detail lives in the mirror the advisor reads. Generalises the worktree-ping hygiene (H24_worktree_dir_autoreap) to the whole channel. MECHANISM (BUILD-gated): background/notify.py routes by RECIPIENT (director-phone vs advisor-mirror vs self) per this taxonomy, replacing recipient-blind kind-only routing; discipline applied now -- demonstrated this turn by SELF-HANDLING the publish-gate wedge (fixed + cleared its action-needed) instead of paging the director.'
- '2026-07-25 RULE-0 AT-TARGET HARDEN (L2->L2, red-team of this atoms OWN core invariant "a blocked atom blocks only itself / the loop keeps drawing OTHER atoms"). EXIT TESTS RE-VERIFIED GREEN (tests/background/test_executor_governor.py, 30 passed). FINDING -- the route-around is HALF-mechanised: it lives ONLY in executor_governor.run_loop (the escalated_reasons SET -> NTFY-once + idle-backoff); the DRAW layer does NOT exclude an atom with an OPEN escalation. A below-target BUILD atom (level_current<level_target, loop_stage=build, open front, no blocked_on) that hits a one-way door is RE-SELECTED by supervisor._self_refill_draw every cycle -- nothing in background/*.py writes blocked_on after an escalation, and _build_in_progress_ids only drops LIVE-fork-owned atoms while the escalated turn has already RETURNED. So run_loop degenerates to indefinite backoff on the SAME wall and the other ~87 atoms / SITE / HARDEN are never drawn: the "keeps drawing OTHER atoms" guarantee FAILS in production -- the silent-stall merely RELOCATED from the interactive window to a backoff loop. The current exit test test_run_loop_escalation_ntfys_and_keeps_drawing SCRIPTS run_once_fn=iter(["escalated","success","success"]) and so ASSUMES the draw serves a different atom next -- it never exercises the real draw (a TAUTOLOGY-class R15 gap: it proves the NTFY/backoff bookkeeping, not the actual route-around). NOT FIXED HERE (named later BUILD slice / harness debt): mechanise draw-layer exclusion of open-escalation atoms so the loop routes to OTHER work -- cleanest via the EXISTING _is_externally_blocked exclusion, with the ORCHESTRATOR (sole map writer until H9_map_write_serialisation) setting blocked_on:director_wall_<key> on the escalated atom (cleared when the director answers), NOT a fragile draw-time sha1(atom_reason) rematch. file_scope [background/supervisor.py, background/build_executor.py, background/executor_governor.py, tests]; depends on the map-write-serialisation seam, logged as harness debt until then.'
