simplifications:
- '2026-07-12 REGISTERED (GOVERNED_COMPANY_AND_THREE_LANES.md Part 1 item 2, Epoch 2/3 boundary), not built -- requests-awaiting-decision as events + a surface/API a human can actually operate (the Director console door already in the site constitution hosts it). Approval LATENCY is real physics: a pricing window that closes while a request waits is a genuine governance cost, to be modelled not wished away. Two honesty disciplines this atom''s eventual build MUST satisfy, recorded verbatim from the staged instruction: (1) the sim-approver''s policy is DIRECTOR-AUTHORED CURRICULUM -- written, versioned, his -- never learned/tuned by the agent from outcomes; (2) the approver sits OUTSIDE the company''s wall like a real board: it sees the submitted context pack, not SIM ground truth, not company internals beyond what is submitted -- a board that can grep the codebase is not a board. Context packs are LINKS not prose (Part 1b item 4): every approval request carries links to the exact website surfaces/data needed to decide, plus the company''s recommendation -- makes the Expert-Hour legibility standard a testable property of the site itself. loop_stage idle: sequencing is the director''s own re-rank per the staged instruction''s own text, not a self-answerable FRAME/BUILD task this pass.'
- '2026-07-13 FRAME pass (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Checked the atom''s own dependency (A2_decision_rights_register) directly rather than assuming it was ready: loop_stage=idle, genuinely met per the map''s own dependency rule, and real code exists (company/governance/decision_rights.py -- DecisionClass/DecisionClassDefinition/DecisionEvent/log_decision_event(), on a real BitemporalEventLog, with two wired real call sites: simulation/renewals.py, saas/ledger.py). But read log_decision_event()''s actual signature closely and found a real, precise architectural gap this atom''s own build must resolve: DecisionEvent only models a COMPLETED decision -- request/context/decision/rationale are all supplied together, at one transaction_time, in one call. There is no PENDING/awaiting-decision state anywhere in A2''s schema at all -- no ''submitted, not yet decided'' event, no way to represent a request sitting in a queue. This directly matters for A3''s own registered claim that ''approval LATENCY is real physics... to be modelled not wished away'': the current log_decision_event() call shape cannot represent latency at all, since request and decision arrive in the same call. FRAME conclusion: A3''s real build needs a genuine new event shape (e.g. a request submitted at time T1 with decision/rationale left None, later revised at T2 when a real decision lands) -- this is exactly the bitemporal ''revise a fact over known, later, discrete points in time'' shape this project has already used for W1/D2/D3, so ''one architecture, not two'' again applies: extend DecisionEvent (or add a sibling ApprovalRequest record on the SAME BitemporalEventLog A2 already built) rather than inventing a parallel queue mechanism. Also checked the atom''s own named eventual host surface: docs/design/SITE_CONSTITUTION.md''s Door 7 (''DIRECTOR (auth-gated) -- action-needed queue, dials UI, comments history, digest archive, curriculum rack'') is the real destination -- confirmed via directory listing that no site/director/ (or equivalent) surface exists yet, so this is genuinely unbuilt, matching level_current=0 honestly, not a mis-registration. Next BUILD question (not decided here, epoch-gated): whether the pending-state extension lives in company/governance/decision_rights.py directly (file_scope should include it) or a new sibling module, and what the real context-pack LINK format (Part 1b''s own ''links not prose'' requirement) should resolve to given Door 7 doesn''t exist yet to link into.'
- 2026-07-13 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval -- the director delegated BUILD-within-the-open-epoch to the twin in-console (DIRECTOR_CANON.md v2 section 3a); ask_twin returned APPROVED, confidence high, for all six ranked Epoch-2 candidates (director_twin_log.jsonl entry 2026-07-13T07:33:20). Now BUILD-eligible for the supervisor's BUILD-tier draw. W1 built first; the rest concurrent where file_scopes are disjoint.
- '2026-07-13 BUILT L0->L1 (saas-engineer fork, director''s explicit ''BUILD IT NOW'', commit b7a26938 pushed, epistemic PASS 498 files, 11 new tests, governance suite 35 passed / broader saas+governance 1557 passed). NEW company/governance/approval_interface.py: ApprovalRequestView + approval_queue_as_of() (the human-operable requests-awaiting-decision surface exposing decision class, link-shaped context pack + recommendation, submit time, and accrued pending LATENCY as-of a given time on the shared BitemporalEventLog); a link-shaped context-pack type (payload = {label, ref} links + recommendation, NOT prose, with a test asserting link-shape); and a real governance caller (propose_hedge_mandate_change -> request_governance_approval/record_governance_decision) exercising the full submit->pending(latency accrues)->resolve lifecycle end to end. Epistemic wall respected (no sim/simulation imports; approver sees only the submitted pack). HONESTLY HELD AT L1, not L2: (a) the workflow is NOT yet triggered by the live simulation run -- the underlying hedge-mandate-CHANGE execution does not exist (COMPANY_MIN_HEDGE_FLOOR is a constant, re-verified per this atom''s own FRAME), so no real run emits pending->resolved approval events yet; (b) Door 7 (the Director console surface that would render approval_queue_as_of) does not exist, so the surface is an API/dataclass, not an operable pixel (fails R11''s rendered-value bar). L2 REQUIRES either (i) a genuine live governed decision with true latency driving the workflow INSIDE a real run (A4 sim-approver landing would supply the in-run resolver for tournament runs), and/or (ii) Door 7 built to render the queue, verified to R11. A2 L3-unblock: submit/resolve now has a real caller AT MODULE LEVEL (was zero callers outside tests) but NOT at live-pipeline level -- weigh A2''s L3 on that precise distinction, do not round up. Carried-forward design note: record_governance_decision records the approver verdict as an input from outside the wall with NO resolved_by/role check against the register''s approver field -- that maker-checker/RBAC identity enforcement is deliberately out of scope here (a distinct future atom).'
- '2026-07-13 L2-PATH FRAME (Lane-3, main-session judgment tier, doc-only -- no code, run concurrently with the W3_2 build). The A3 L1 build named two L2 options, both awkward: (i) build the hedge-mandate-change EXECUTION mechanism (COMPANY_MIN_HEDGE_FLOOR is a constant -- materially bigger), or (ii) build Door 7 (a SITE build). Investigated a THIRD, smaller path by reading the already-live governed decisions directly: simulation/renewals.py:160 ALREADY logs a live PRICING_MOVE DecisionEvent for every fixed-rate renewal across the whole replay -- but as a COMPLETED, explicitly ROUTINE decision (''below any escalation threshold in this thin-start register'', renewals.py:178). A3''s approval workflow (submit->pending->resolve with latency) is precisely for decisions that EXCEED the escalation threshold. So A3''s L2 can wire the approval workflow onto the NON-ROUTINE subset of pricing moves (those above the pricing_move DecisionClassDefinition''s escalation threshold, e.g. a large rate change) in the ALREADY-LIVE renewals pricing path -- giving submit_decision_request/resolve_decision_request a genuine LIVE caller inside a real run, with real approval latency (the ''pricing window closes while a request waits'' cost A3 registered as real physics), WITHOUT needing the non-existent hedge-mandate mechanism or Door 7. SAFETY/SEQUENCING (learned from the W3_2 final-neutrality + W2_2 curriculum disciplines): the FIRST safe version must be OUTCOME-NEUTRAL -- route the non-routine pricing move through the approval workflow but record the approval as granted within the same effective window (an approval EVENT + latency recorded on the bitemporal log, giving A3 its live caller) WITHOUT yet letting approval latency change the tariff actually applied; the outcome-affecting version (a real pricing window closing while an approval waits, which WOULD change margin) is a distinct, larger, later increment to be flagged and reviewed, not bundled in. NOTE the seam subtlety: pricing_move is logged from simulation/renewals.py (a sim-side file that already imports company.governance.decision_rights.log_decision_event, verifier-accepted); an A3 build here must keep the epistemic verifier PASS and not widen that crossing. This FRAME does not build anything -- it identifies the smallest real L2 caller; A3 stays L1, loop_stage unchanged. Recommended over (i)/(ii) as the L2 path when A3 is next drawn for BUILD.'
- '2026-07-13 BUILT L1->L2, target REACHED (saas-engineer fork, commit 31765657 pushed; orchestrator-verified per R1 as a LIVE-path change: 58 tests pass incl. the byte-identical outcome-neutrality test, epistemic PASS 498 files, commit touched ONLY simulation/renewals.py + its new test -- approval_interface.py unchanged, decision_rights.py (director-owned register) NOT touched). Executed the FRAMEd path: simulation/renewals.py::_route_pricing_move routes the NON-ROUTINE subset of live pricing moves through request_governance_approval->record_governance_decision, giving submit/resolve their FIRST genuine LIVE-pipeline caller. OUTCOME-NEUTRALITY held (the core risk control): _route_pricing_move is a pure side-effect on the decision LOG, never mutates/returns unit_rate; non-routine move submitted at notice_date and resolved(approved) APPROVAL_LATENCY_DAYS=1 later, still ~41 days before term_start = inside the effective window, so no pricing window closes and no tariff is delayed/blocked/altered. Neutrality PROVEN byte-identically: test_outcome_neutral_tariff_identical_with_and_without_approval_wiring builds the same spiked schedule twice (once with the approval funcs monkeypatched to no-ops) and asserts the ENTIRE schedule incl. every unit_rate is identical, guarded against vacuous pass (fixture term-2 is +237%, genuinely non-routine); the test_run_phase3b financial-regression suite passed UNCHANGED (margin did not move). HONEST THRESHOLD DEVIATION (flagged, director-facing): the PRICING_MOVE DecisionClassDefinition has NO magnitude field (it declares the whole class routine/automated, sla_hours=0), so ''non-routine'' could NOT be read from it as the instruction''s letter asked. Rather than invent a number OR modify the director-owned register (R13/scope), the fork REUSED the company''s own existing domain-calibrated NON_ROUTINE_RATE_INCREASE_THRESHOLD = simulation.bill_shock_tracker.BILL_SHOCK_THRESHOLD (0.20): a fixed-rate renewal whose unit rate rises >20% vs the customer''s previous fixed term is non-routine (''one observable, not two''). DIRECTOR FOLLOW-UP (small, optional): if the escalation magnitude should live in the register as AUTHORED CURRICULUM, that is a schema addition + a director-set value -- deliberately left out to avoid the agent authoring curriculum. REAL BUG FOUND+FIXED BY INTEGRATION: during the real phase2b run over 2016-2025, a non-routine move fired for customer C3 at valid_time 2017-07-01, surfacing a shared-singleton replay collision the fork fixed with a C-S2 idempotency guard; all 100 integration tests pass after. A2 ADVANCE: this gives A2''s submit/resolve their first genuine LIVE-pipeline caller (previously module/test-level only per A2''s Expert Hour) -- substantially advances A2''s L3 condition (b); recorded as an advance, promotion is the grader''s call. A3''s OWN L3 still needs: (1) Door 7 rendering approval_queue_as_of to the R11 pixel bar (still API/dataclass); (2) the distinct larger OUTCOME-AFFECTING increment (a pricing window actually closing while approval waits -> would move margin, explicitly out of scope); (3) A4 sim-approver as in-run resolver instead of hardcoded in-window approved=True; (4) an independent Expert-Hour with execute-payload capability on the now-live mechanism. Target was 2 and is met -- loop_stage idle; level_target NOT inflated.'
