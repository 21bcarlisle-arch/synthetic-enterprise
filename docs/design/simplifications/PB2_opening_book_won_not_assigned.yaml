atom_id: PB2_opening_book_won_not_assigned
simplifications:
- '2026-08-13 DISCOVER (LANE 3 idle draw, no BUILD, level HELD at 0, loop_stage still idle, no file_scope path touched, no curriculum value moved). Full deliverable: docs/design/PB2_OPENING_BOOK_DISCOVER.md. (a) PROPOSED OPENING SIZE 3,217 accounts, DERIVED not chosen: N* = opening_capital / (MCR_per_account + cost_per_account_won) = 2,467,568.06 / (130 + 637.02). External anchor is Ofgem''s 26 July 2023 Minimum Capital Requirement decision -- Capital Floor GBP0, Capital Target GBP130 per dual-fuel-equivalent domestic customer (docs/market_research/ofgem_licence_readiness.md §2, already load-bearing as company/finance/treasury.py::MCR_PER_ACCOUNT and saas/capital/solvency.py::MCR_FLOOR_GBP_PER_CUSTOMER); opening capital read from site/data/dashboard.json portfolio.treasury_start_gbp at meta.git_commit dfc233094; cost-per-won computed from the shipped funnel constants (p(win|quote)=0.171456 pre-REC, 5.83 quotes per win, E[cost|quote]=GBP109.22). At N=3,217 the spend is GBP2,049,295.20 and the MCR holding GBP418,210, totalling GBP2,467,505.20 -- the whole opening treasury less GBP62.86, the residual left because 3,217 is the floor of the unrounded 3,217.08 and one more account costs GBP767.02 the balance sheet does not have. It closes to within a pound OF ONE ACCOUNT, not to the pound on the total (an earlier draft of this record claimed the latter), and that is what makes it a ceiling rather than a preference. The treasury figure was re-read at the current published stamp 1cf30581b as well as the cited dfc233094 and is unchanged. 247x today''s 13, 292x the 11 supply points the published book actually carries in 2025. Same equation post-REC gives 3,607. (b) AFFORDABILITY VERDICT: NOT AFFORDABLE, and the probe governs per the ruling. AO12 measured settlement_build dying at 465 customer-years under its 3,072MB ceiling; the 1,343 figure is a PROJECTION the probe''s own detail field calls under-stated, so fail-closed uses 465. 3,217 is 6.9x that, and its raw settlement working set is ~140GB over a 10-year window before a reduction whose cost the probe records as UNMEASURED. Recommended interim: the largest N completing a green full shipped run, measured by bisection, with 465 as the fail-closed cap until that measurement exists -- itself ~36x today''s book, so the director''s "materially larger than 13" is met by the interim. (c) CONTRIBUTION BACK TO PB1, and the reframing that matters: the expensive object is the BOOK, not the WORLD. A drawn premise costs ~860 bytes RSS; a WON one costs ~6.4MB per year -- ~7,400x. The population target is cheap; the book target is what the probe kills. PB1 also gains its first DERIVED floor: N_pop >= ceil(5.8324 x N_book) (one quote per premise) = 18,756 premises at the target, 2,712 at the interim (rounded UP because it is a floor), which also fixes the subset ratio as a funnel consequence (book/population <= 17.1%) rather than a chosen number. (d) EXIT (d) IS UNSATISFIABLE BY CONSTRUCTION TODAY, and this is the atom''s real blocker. Read simulation/live_population.py:161-177: every drawn SyntheticCustomer is rendered, appended and registered, so the drawn population IS the book. A subset test today asserts |book| == |population| and passes -- the tautology R15 names first. The unwon remainder does not exist, which is why no control covers it. The build must create it before the exit can mean anything. (e) EXIT (c) NEEDS NO NEW CONTROL. tests/architecture/test_epistemic_wall_ratchet.py is the static company<->sim ratchet with mutation tests BOTH ways; tests/simulation/test_live_population_seam.py carries the runtime half for hidden ground truth plus its own falsifier (test_the_company_import_guard_can_fail). PB2 supplies a new SUBJECT for the existing instruments -- the unwon remainder -- not a third instrument; the failure mode this repo actually suffers is an orphaned control, not an absent one. Because the remainder is DATA rather than an import, the static ratchet alone cannot see it: the runtime guard pattern must be extended to roster membership. (f) FORBIDDEN IMPLEMENTATION NAMED so a future build can be checked against it: scaling the opening book by raising lambda on the existing append-the-whole-cohort seam. Two appended customers is the director-signed Profile B trickle; three thousand appended is a grant, and the curriculum artefact says so in his own term (earned, never granted). The book must accumulate one won account at a time through should_attempt_acquisition -> simulation.acquisition_funnel -> company.crm.onboarding_journey -> supply_book.register_acquired_point, so book size is a MEASUREMENT of what the campaign won and never a parameter anywhere in the tree -- which is also what makes PB3 possible. (g) BLOCKERS FOUND for a future build, all with live evidence: the draw saturates silently above lambda~745 (batching below saturation is mandatory); the SYN key set diverges from the static roster and already cost seven consecutive failed runs on 2026-08-13, so entrypoint hardening is a PRECONDITION of any book increase, not a follow-up; the curriculum-JSON-arms-from-disk / code-arms-at-HEAD asymmetry is inherited intact by any Profile C edit. QUEUED, not fixed here (SELF_INTERRUPT_DISCIPLINE). (h) QUEUED FINDING, not this atom''s to fix: the sim''s GBP637 cost per won account is ~11x the sourced PCS commission of GBP25-30 per fuel switched (B2_CATEGORY6_CAC_ANCHORS.md). The two are documented as different cost lines, but at 3,217 accounts the difference is GBP1.9m of opening capital and it should not silently set the book size.'
- '2026-08-14 FRAME (LANE 3 idle draw, no BUILD, level HELD at 0, loop_stage still idle, no file_scope path touched, no curriculum value moved). Full deliverable: docs/design/PB2_UNWON_REMAINDER_FRAME.md. The 2026-08-13 DISCOVER pass ended on a blocker it stated but did not design out -- the drawn population IS the book, so exit (d) is a tautology. This pass designs the missing object and finds a second blocker under it. (a) SECOND STRUCTURAL BLOCKER, NEW HERE: THERE IS NO JOIN KEY. Even once a remainder exists, exit (d) cannot be evaluated, because subset is a relation over a shared key and the two id grammars share nothing: simulation/premise_population.py:654 mints `P{i:04d}`, simulation/population_draw.py mints `SYN-{year}-{i:03d}`, and SyntheticCustomer''s field list (customer_id, acquisition_date, segment, commodity, payment_method, consumption_band, eac_kwh, region, tariff_type, data_regime, acquisition_type, cohort) carries NO premise reference at all. The two shapes available to a build under pressure are exactly the two R15 names first -- compare COUNTS (|book| < |population| passes for two unrelated sets: wrong subject) or map one grammar onto the other by position (position generated both: tautology). Fix is a supply-point identity, not a new id -- the won account carries the premise_id it was won at, which is also the honest domain model (a UK supply point is identified by its metering point, which belongs to the property and survives the customer leaving) and is what makes the already-built, already-once-buggy home-move path coherent rather than coincidental. The 13 static CUSTOMERS predate the stock and have no premise: they are out of scope of the subset claim and the control must say so BY CONSTRUCTION, a declared and bounded exclusion rather than one that quietly greens the verdict. (b) THE DESIGN -- MOVE THE DRAW ONE STAGE UPSTREAM. Today iter_acquisition_events draws Poisson(lambda) ACQUISITIONS per year and yields an already-won SyntheticCustomer for each: there is no losing, and lambda IS the book size in the plainest sense. Framed: the SIM draws the STOCK, the company issues QUOTES against it, the funnel decides which become accounts, and the book is what comes out. Three exits fall out of the one inversion -- book size stops being a parameter anywhere in the tree and becomes a MEASUREMENT of what the campaign won (exit b, and the whole precondition for PB3, since a number that is an outcome can be lost); what the company chooses is CAMPAIGN VOLUME, a spend decision saas/growth_mandate.py:82:: should_attempt_acquisition already owns per acquisition_funnel.py''s own scope statement; the remainder exists by construction because quotes lose (at p(win|quote)=0.171456, ~5 in 6 quoted premises stay unwon), so exit (d) becomes measurable rather than tautological; and PB2''s derived floor N_pop >= ceil(5.8324 x N_book) becomes load-bearing -- it is the statement that the funnel must have somewhere to lose, which means nothing on today''s seam. (c) THE STOCK ALREADY EXISTS AND HAS THE PROPERTY THIS NEEDS. premise_population.draw_premise_population''s own docstring records it: ''Growing `n` APPENDS -- P0007 never changes'', each premise drawn from its own premise_id-keyed substream. Append-stability is exactly what a remainder requires -- the unwon set must grow without disturbing the book already won out of it, or every book-size measurement is taken against a different world than the one before it. It is also C-S2 substream discipline already satisfied rather than owed. What the stock lacks is a CONSUMER (PB1: read only by tools/couple_fabric.py, a research instrument no run touches); this frame gives it its first production consumer, which is the cheapest way to close PB1''s two-populations-disjoint finding because it needs no third population. (d) WHERE THE REMAINDER LIVES, AND THE LINE THAT WOULD REINTRODUCE THE GRANT. The remainder is SIM-side truth with NO company-side name -- a supplier does not hold a list of households it has not signed; the company''s only trace is the outcome of quotes it actually issued. live_population() currently ends register_drawn_points(drawn) then returns list(CUSTOMERS) + drawn (re-read at this pass''s HEAD, unchanged), registering the ENTIRE drawn cohort on the supply book at the seam. That call was added for a real reason (the home-move path needed registered_point() to resolve a drawn account) and under this frame it becomes the most dangerous line in the file: registering the stock IS granting the book. register_acquired_point must be reached ONLY on a funnel win, and register_drawn_points must lose its caller or have its subject narrowed to won accounts -- named here so a build cannot reintroduce the grant by inheriting a line nobody re-read. (e) THE PROSPECT SEAM, PROPOSED NOT SETTLED. A supplier does not quote blind, so the pre-quote observable set is a wall decision that must be argued: proposed observable = region, commodity, meter read cadence (industry-systems answers on switching enquiry) plus EPC band and property type, which are on a PUBLIC register in reality and so are readable text under the regulation-commons doctrine -- and premise_population already models partial coverage (EPC_COVERAGE_SHARE=0.60), the right shape: a certificate where one exists, nothing where none does. NEVER observable: Household.nssec, tenure, and the whole Cohort (green_stance, price_sensitivity, channel_pref), which the canonical wall ruling puts entirely behind the wall. This pass does NOT settle the set -- fidelity-oracle check owed before build. (f) THE CONTROLS -- ONE NEW SUBJECT, ONE NEW PAIR OF MUTATIONS, NO NEW INSTRUMENT. Exit (c) stands as the DISCOVER pass left it: test_epistemic_wall_ratchet.py (static, R15 both ways) + test_live_population_seam.py (runtime, with test_the_company_import_guard_can_fail). The new SUBJECT is ROSTER MEMBERSHIP, and the STATIC ratchet cannot see it -- the remainder is DATA, not an import, so a company module that never imports premise_population can still be HANDED the unwon set by a caller; the runtime guard is the half that must grow, R15 both ways. Exit (d)''s control must survive two mutations, both required: register an unwon premise on the book -> RED (without it the control tests only that two sets exist), and mint a book account whose premise_id is not in the stock -> RED (this is the one that catches the frame collapsing back to today''s mint-not-win seam). Plus a precondition that is not a mutation: |remainder| > 0 -- a control that passes on an empty remainder is the fail-open shape and would have passed every day of this atom''s life on a world where the property is definitionally false. (g) CORRECTION DISCHARGED, and it was load-bearing. PB1 (g) queued a wrong-subject read against PB2''s DISCOVER record and correctly did not edit another draw''s in-flight document; it is this atom''s, so this pass discharges it IN the document (both sites marked CORRECTED, not silently rewritten). The doc read AO12''s 860 B/unit figure correctly once (line 106, ''per customer'') and wrongly twice (line 113 ''per premise''; line 198 ''at 860 bytes RSS/premise, 18,756 premises cost ~16 MB to draw -- the world is affordable at the target book''s floor''). The stage''s own fields are unit=customer, units_completed=10258, per_unit.rss_bytes=859.6888282316241, detail=''drew 10258 customers via simulation.population_draw''; DrawnPremise is a different class with different fields and AO12 has NO stage for it. WITHDRAWN: the ~7,400x multiplier and the affordability verdict on the world -- an unmeasured stage is UNKNOWN, not zero (PB1 exit d). SURVIVES: the count floors (funnel arithmetic, never used the byte figure) and the reframing in KIND -- a won premise enters settlement_build, the stage measured dying at 465 customer-years, and an unwon one never does, which is structural and needs no per-unit number. The measurement that would restore a number is PB1 (f) prerequisite (1), an AO12 stage subjected to premise_population.draw_premise_population -- still owed, and deliberately NOT taken here, because taking it would produce a number with no instrument behind it, which is exactly what PB1 refused and refused for the right reason. (h) THE FRAME''S AFFORDABILITY CONTRIBUTION, stated so it cannot be over-read: under the inversion the STOCK can sit at PB1''s target while the BOOK sits at the interim, because the remainder never reaches the expensive stage -- the two numbers stop needing to be the same number. That is a claim about WHICH STAGE EACH OBJECT REACHES, NOT a claim that the stock is cheap, which (g) has just withdrawn. The governor is otherwise unchanged: 3,217 is 6.9x the measured 465 ceiling, so the target is unaffordable today and the interim is what a build aims at. BUILD ORDER inherited by a future draw: (1) the join key -- smallest and first, everything else is unmeasurable without it; (2) the prospect seam, oracle-checked; (3) the inversion; (4) the controls. Preconditions carried forward unchanged and still owed: silent draw saturation above lambda~745 (mandatory batching -- the probe''s own detail records 41 batches of 250 for this reason), SYN-key/static-roster divergence (entrypoint hardening is a PRECONDITION of any book increase, not a follow-up -- it cost seven consecutive failed runs on 2026-08-13), and the curriculum-arms-from-disk / code-arms-at-HEAD asymmetry.'
