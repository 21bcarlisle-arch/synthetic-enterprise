atom_id: H3_production_readiness_nfr_evidence
simplifications:
- '2026-07-11 REGISTERED (P2, advisor-staged, director-decided -- PRODUCTION_READINESS_BASELINE.md, background-lane, explicitly ''do not displace the spike queue''). No measured baseline currently exists for this business''s non-functional properties. Part A scope: recoverability (enumerate everything canonical existing ONLY on Skynet; test an actual restore of one representative artefact -- advisor amendment: to a SCRATCH location, never over live state; report measured RTO/RPO, not assumed), security posture (secrets inventory, exposed-surface inventory, dependency vulnerability scan -- advisor amendment: raw findings route to the PRIVATE ops repo ONLY, the public surface carries a sanitised summary never the map of weaknesses; absorb the harness sprint''s existing sandbox/Pattern-C recommendation as an input rather than re-deriving), performance/capacity (measured full-run wall time/memory/disk and scaling with customer count, identify the first resource breaking at 10x/100x population), availability (daemon-stack real uptime from existing logs, every current single point of failure). Non-negotiable: measure, don''t assert (R9). Immediate-action carve-out: any live-risk finding (unrecoverable canonical data, exposed credential) gets fixed under normal tiering NOW, not deferred -- the agent reviews and acts on such findings personally rather than delegating remediation, per this session''s own consequential-action discipline. Dispatched as a background-lane fork; findings pending.'
- '2026-07-11 PART A COMPLETE, level 0->1. No live risk found matching the imminent-danger tier (no exposed credential value, nothing about to be committed unsafely). Real findings, all measured not asserted: (1) Recoverability -- repo IS GitHub-mirrored (real off-machine copy for tracked content); company/data/*.db (4 SQLite files, largest 2.1MB, the company''s own operational financial/customer state) and both .env.* secret files were gitignored with NO upstream copy at all -- matches the ''unrecoverable canonical data'' carve-out criteria literally even though not imminent-danger; restore test performed for real (236-byte artefact, scratch location, byte-for-byte verified, ~22ms). ACTED ON per the carve-out: new background/backup_company_data.py backs up all 4 DB files to the private ops repo (verified via md5sum match), wired into process_run_complete.py''s cycle so it stays current, not a one-off. (2) Security -- 2/2 secret files confirmed gitignored/600-permissioned/never in git history; zero raw secret-shaped strings elsewhere; 1 medium finding (5 stale unauthenticated dev file-servers running ~2 days, not a data leak); 1 low finding (wide-open CORS on an otherwise-authenticated endpoint); pip-audit not installed, no automated CVE scan possible. Detailed findings routed to the PRIVATE ops repo per the security boundary; public summary sanitised. (3) Performance -- confirmed 19 customers/~470s-run/2.9MB output matches CLAUDE.md''s established figure; 2 real O(n²) patterns found by reading simulation/run_phase2b.py directly (per-customer full linear scans of all_records) -- ~100x cost at 10x population, ~10,000x at 100x for that specific pass, code-verified not load-tested; docs/observability/risk-committee-log.md found unbounded at 277MB. (4) Availability -- real crash history in session-watchdog-log.md (2 crash-loop episodes + one ~22min nvm-path outage in the last week); confirmed exactly 6 daemons share the NTFY-env-var SPOF; whole stack single-machine by design, no redundancy. 4 new tests (backup script), 520 background/ tests pass, epistemic PASS. H4_go_live_nfr_register can now carry a real ''current measured state'' column from this evidence.'
- '2026-07-13 DISCOVER/FRAME LANDED, Parts B/C (Lane-3 fork, doc-only, no level move, commit faf2751a): docs/design/PRODUCTION_READINESS_PARTS_BC.md. Part A covered 4 SRE areas; Part B = Operational and Resilience (availability/SLO, RTO/RPO/DR, observability/alerting, incident-response/runbooks, change-mgmt/rollback, capacity/scale -- cross-refs C-S1..C-S5 + the go-live seam async envelope as scale/idempotency/audit evidence); Part C = Security/Data-Protection/Compliance (authn/authz + SoD, secrets/key rotation, vuln mgmt, GDPR/encryption/retention, audit trail/non-repudiation, Ofgem operational-capability + financial-resilience licence NFRs). Central honesty move: every row tagged HARNESS / PLATFORM / COMPANY-SIM so a build-machine measurement can never be mis-scored as go-live met. Biggest genuine gap = data protection C4 (no privacy policy, no encryption-at-rest assessed, no retention/erasure -- masked only because data is synthetic today). Top go-live blocker = C6 Ofgem licence gate (Ofgem-decided go/no-go, ~6mo, ~GBP115-130/customer capital floor; DISCOVER done, BUILD correctly Epoch-5-gated). TWO FINDINGS QUEUED (not fixed on sight, self-interrupt discipline): (1) docs/observability/risk-committee-log.md is UNBOUNDED -- 302MB (277->316MB since Part A), bloating the repo; needs truncation/rotation (a real harness-hygiene atom to register); (2) pip-audit (C3 dependency-vuln scan) has NEVER run -- cheapest security quick-win. Epoch-5 BUILD stays gated; DISCOVER/FRAME complete for now.'
