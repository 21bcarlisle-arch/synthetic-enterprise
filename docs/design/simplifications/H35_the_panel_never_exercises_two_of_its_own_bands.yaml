atom_id: H35_the_panel_never_exercises_two_of_its_own_bands
map_notes:
  build_note: 'BUILT 2026-08-09, L0->L2. Full record, tables and dispositions: docs/design/BAND_NULL_SWEEP.md section "H35". (1) DONE, WITH ONE DELIBERATE DEVIATION: the panel went 10 -> 15 homes (9 gas, 3 heat pump, 3 resistive). It carries ELECTRIC_DIRECT panel-heater homes and NOT an electric_storage one, because the world layer does not model a storage heater -- _CONTROL_MODE gives ELECTRIC_STORAGE the same deadband thermostat as a gas combi and premise_trace.py has no charge window, thermal store or Economy-7 calendar (WORKER_FINDING_THE_MODELS_STORAGE_HEATER_IS_NOT_ONE, owner W1_12). A storage-labelled home would be a panel heater in disguise and would let L1.1r report as measured on a load set half of which is a mislabel; L1.1r''s own anchor covers "resistive (storage or panel)", so the band is now measured on the sub-regime the physics genuinely represents and the storage sub-regime stays OPENLY unexercised. Stock-representativeness restated in the PANEL comment rather than silently widened: 6 of 15 electric against ~9% of GB stock, and the panel is a SPAN -- representativeness lives in build_drawn_population. (2) DONE: L1.1r went 0 -> 3 homes judged and L1.1e 1 -> 3, so both nulls are measurable and L1.1e''s has a spread. Both are hits: L1.1r INSIDE_NULL (threshold 0.0363 vs null best 0.1228) and L1.1e SAME_ORDER (margin +0.0010 inside a null spread of 0.0302). A THIRD band, L1.3, was clean at ten gas homes and went INSIDE_NULL on the same widening -- the finding underneath all three is that two of this ledger''s statistics were only ever valid for a home whose heat is on the other meter. (3) DONE, both repair-the-statistic, neither a threshold move: MEASURED that every home clears the floor the band''s OWN arithmetic gives at that home''s own behavioural share (H11 by 25%), so the number that does not fit is the band''s assumed home -> H36. MEASURED that away_signature reads a heat pump as an empty house (H11 flagged away on 104 of 120 REAL days, the null on 120) -> H37. (4) DONE: UNMEASURABLE is now FATAL -- background.band_null_sweep.FATAL_VERDICTS + fatal(), read by the runner so exit code and report cannot drift; R15 pair in tests/harness/test_band_null_sweep.py section 7 (gas-only population -> fatal; one heat-pump home -> not fatal for that reason; a measured separated band -> fatal() empty, so the guard can return nothing). WHAT WAS NOT DONE, deliberately: the widened panel puts the live coupling run RED on L1.1 (worst home H11, 0.07037 vs the 0.07050 heat-pump floor) and the sweep exits 1. The floor was not moved, H11 was not removed from the panel and no cell was marked UNVALIDATED -- each would have gone green in one line while making the measurement worse (R12). tests/tools/test_couple_fabric.py now pins the breach BY IDENTITY (one home, H11, judged by L1.1e) so a second breach fails rather than being absorbed, and the closure control is asserted to still FIRE on it.'
  origin_note: 'MINTED FROM the L1.1r/L1.1e dispositions in docs/design/BAND_NULL_SWEEP.md (H33, 2026-08-09). MEASURED at the applied window (couple_fabric PANEL, 10 homes x 120d): L1.1r judges ZERO homes -- no electric_storage/electric_direct home is on the panel -- so its null cannot be measured on the load set it governs, and reading it off the 9 gas homes is the wrong-load-set defect. L1.1e judges ONE home, so its null has no estimable spread and its +0.0163 margin is a point estimate. NOTABLE: L1.1r was derived BECAUSE a storage-heater home breached L1.1, and none is ever judged by it. EXIT: (1) the panel carries an electric_storage home and enough heat-pump homes for L1.1e''s null to have a spread, stock-representativeness restated not silently widened; (2) both bands MEASURABLE on re-run; (3) re-measured verdicts dispositioned repair-the-statistic or repair-the-window, never lower-the-floor (R12); (4) a guard making a band that judges zero homes FAIL, not merely be reported.'
  name: MINTED FROM the L1.1r/L1.1e dispositions in docs/design/BAND_NULL_SWEEP.md (H33, 2026-08-09), whose H35 section carries the atom as minted, the re-measurement and every disposition in full. Two regime-conditioned texture bands judged ZERO and ONE home at the applied window, so one null was unmeasurable and the other a point estimate.
