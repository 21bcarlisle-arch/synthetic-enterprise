map_notes:
  build_note: 'BUILT 2026-08-10, L0->L2. (1) DONE: L2.3n_timing_diversity_null_ratio -- fgl.timing_diversity_vs_own_null scores the spread against the p95 of 99 re-deals of the population''s own days. The deal REUSE went the only direction that does not cycle: the primitive is fgl.deal_preserving_counts and band_null_sweep::_exchangeable_homes_null now CALLS it, so the measured null and the judged null are one implementation (test_L2_3n_and_the_SWEEPS_null_are_ONE_implementation). (2) DONE: 1.0 is the decision point BY CONSTRUCTION (a one-sided permutation test at alpha=0.05) -- nothing to tune, and the windows are stated on the band. (3) DONE at 40/60/90/120d on the applied 10-home panel: real ratio 1.66/1.84/2.11/2.12 (passes everywhere); a timing-less population clears the ratio 7/12/7/2% against the removed floor''s 65/57/15/2% -- the floor''s fail-open rate is a function of the WINDOW, the ratio''s is flat at its own alpha. The shipped defect (one national HEATING_PERIOD_WEIGHTS constant) makes the null itself degenerate, which RAISES and is scored 0.0 by the cell, never skipped. (4) NOT AS WORDED, and it cannot be honestly: SEPARATED asks whether the threshold clears the null''s p95, and this threshold IS that p95 -- sweeping it is R15''s tautology pattern, and an alpha=0.05 test passes a structureless population 1 in 20 by definition. DELIVERED INSTEAD, and it is stronger: L2.3''s floor came out (threshold=None, anchor=NEED, with the panel that would put a number back named on the cell), so the live sweep has NO inside_null and NO same_order row at any window, and the property the verdict proxied for is measured directly per window. Reasoning in docs/design/BAND_NULL_SWEEP.md. The removed floor''s finding is kept as a live test that RESTORES the band and re-measures it, so it must keep reproducing.'
