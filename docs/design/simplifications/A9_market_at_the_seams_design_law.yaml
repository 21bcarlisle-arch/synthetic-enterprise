atom_id: A9_market_at_the_seams_design_law
map_notes:
  origin_note: 'The register this atom leans on (docs/design/PORTABILITY_DEBT.md) was graduated 2026-07-22 as DOC-ONLY on an explicit director ruling: consolidate the debt, open no build. Nothing here reopens that -- remediation-on-touch still governs the 58 shipped sites and no sweep-rename is in scope. What the ruling left open is the other half: a register that only RECORDS grows monotonically and cannot stop the next breach, which is the ''a ratchet with no drain is a one-time cleanup, not a control'' shape this codebase has already been bitten by twice. So the law is enforced forward-only, and the register becomes the ALLOWLIST -- which is precisely what its own maintenance rule (''add a row here in the same change'') has always demanded and never been able to make true.


    R15 shapes to hunt if this is ever extended. (1) FAIL-OPEN BY OMISSION: the seam surface must stay DERIVED. A hand-listed surface silently exempts the next seam file, and the control passes by not looking -- hence the vacuity guard on the declared boundary anchor and the file floor. (2) SUBSET-REGISTER BLINDNESS: if exemptions only ever have to be >= reality, a remediated breach leaves a standing licence and the next breach lands inside it for free; the baseline is exact in BOTH directions for that reason, and the departed-entry case is mutation-proven. (3) FALSE POSITIVES ON PROSE: a control that reds on ''this seam carries what Elexon publishes'' gets bypassed within a week, which is why the scan is AST-based with docstrings excluded and identifiers split into words rather than substring-matched -- and why the prose/payload-key boundary is asserted in both directions rather than assumed.


    The known LIMIT, stated rather than papered over: the vocabulary is a curated word list, so a GB counterparty nobody thought to list crosses a seam unseen. That is a coverage hole in the control SET, not a defect in the control -- the honest answer is to add words when a market is actually picked (the analysis''s own verify-before-picking sweep), not to widen the predicate to something that misfires. Ambiguous three-letter GB acronyms (SSP/SBP/GSP) are deliberately OUT for that reason.'
  name: 'Minted 2026-08-10 under the backlog-triage Group A instruction (verify the market-at-the-seams design law has its atom; mint if not -- it did not). From docs/design/refs/ADVISOR_ANALYSIS_MARKET_PORTABILITY_2026-08-07.md: the analysis decomposes Poesys into INVARIANT (harness/method, the epistemic wall as law, the bitemporal spine, population + affordability machinery), PARAMETERISE (cost-stack line items, tariff structures, cap-analogues, calendars, loss factors, weather anchors -- tables not code), ADAPTER-SWAP (settlement body, metering/data infrastructure, switching registry, payment rails, market comms -- the SAME operation go-live already defines, with a different endpoint set), and REBUILD (compliance organs, consumer-protection surfaces, language layers, local credit/debt law). The DESIGN LAW this atom owns is the middle two: no counterparty identity hardcoded across a seam, and every market-varying quantity reachable as a table rather than a literal. Standing constraint, mechanised -- the existing PORTABILITY_DEBT.md register records breaches in shipped code (remediation-on-touch, never speculative retrofit) and this atom is what makes a NEW breach fail rather than get logged. NOT in scope: building a second market or segment; GB SME/I&C is the analysis''s recommended first extension and is a separate future draw.'
map_records:
  evidence:
  - 'docs/design/refs/ADVISOR_ANALYSIS_MARKET_PORTABILITY_2026-08-07.md (source: the INVARIANT / PARAMETERISE / ADAPTER-SWAP / REBUILD decomposition; this atom owns the middle two)'
  - 'tests/architecture/test_market_at_the_seams.py -- RULE 1 (no counterparty identity hardcoded across a seam) + RULE 2 (no market-varying quantity as a literal), 19 tests green. Seam surface DERIVED (18 files: the two boundary packages + the *seam*.py convention), never hand-listed.'
  - 'docs/design/PORTABILITY_DEBT.md -- new section plus the machine-read baseline block (13 keys / 58 sites) that makes the register the ALLOWLIST. The baseline is the live core of rows #1 (currency baked into field names) and #5 (GB-baked seam vocabulary), measured at the seam surface only -- which is why it is 58 and not row #1''s repo-wide 6,850.'
  - 'R15, FOUR LIVE MUTATIONS OF THE REAL REPO (each restored, `git diff --quiet` verified clean): (1) `ecoes_lookup(mprn)` appended to company/interfaces/sim_interface.py -> RULE 1 red, ''ecoes x1, mprn x3 (register allows 0)''; (2) `price_gbp / 48` appended -> RULE 2 red, ''48 x1, gbp x14''; (3) mpan -> supply_point_id remediation with the register row left standing -> drain red, ''register says 7, code has 0''; (4) baseline block deleted from the register -> 4 controls red, fail-CLOSED not fail-open.'
  - 'Fixture-level proof of the two boundaries that decide whether this control survives contact: docstring prose is NOT a breach while a payload key IS (both directions asserted), and an extra site inside an already-exempt file still fires (an exemption is not a per-file licence).'
  - 'NOT a tautology: truth side is an AST scan of real seam code, allowlist side is a hand-maintained markdown block -- no shared source, so a wrong register cannot make the scan agree with it.'
  - tests/architecture/ full suite 94 passed; ruff clean on the new module.
  - 'NOT IN SCOPE and NOT claimed: no second market or segment built (GB SME/I&C is the analysis''s recommended first extension and is a separate future draw); no sweep-rename of the 58 baseline sites; no scale-debt axis (C-S1..C-S5 stay at their own touch points); L3 not claimed (no HARDEN / Expert Hour).'
