atom_id: SP5_shared_primitive_ensuring_activity
simplifications:
- 2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_shared_primitive_ensuring_activity_2026-07-28.md, source ruling section 4. BUILD half parked behind director_build_open (abolished 2026-07-29, swept 2026-08-03); registered here per R17 consumed-not-absorbed.
- '2026-08-03 MINT -- THIS IS THE MAKE_IT_STICK TEST APPLIED TO THE OTHER FOUR SP ATOMS: SP2_1/SP2_2/SP3/SP4 each fix a duplication that ALREADY happened; without a standing ensuring activity the class simply re-grows and the fixes decay into the "prose-only rule" failure mode. The mechanism must therefore be the census wired as a GAP REGISTER (so an open duplication makes a rest/saturation claim impossible, the same shape as GAP1_gap_registers_as_mint_sources) plus a phase-close question, NOT an exhortation. Level target deliberately 2, not 3: this is ensuring/harness wiring whose L3 bar would require the census to have actually CAUGHT a real re-duplication in the wild, which cannot be claimed at build time. SOFT DEP: the AST clone-detection census must be re-runnable; if it is not, say so rather than wiring a register to a stale artefact.'
- '2026-08-03 BUILT, L0->L2 across two worker ticks. Tick 1 (commit 81a43bd9c, rescued from a fork that died dirty): the 583-line AST clone/duplication census (5.1) + phase-close items 0d/6d (5.2/5.3), WIRED as register 9 in background/gap_register_scan.py::_REGISTERS -- the wiring IS the atom, since a census nothing reads cannot make a rest claim impossible. Tick 2 (this one): 5.4, the part the design left as prose. Live reading is non-vacuous: 10 OPEN rows, incl. clone_count=267 over the 223 ceiling and working_day_calculator at 24 unmigrated callers, which independently corroborates SP2_1''s own known Pass-2 residual.'
- '2026-08-03 THE 5.4 DEVIATION, deliberate and load-bearing. The DISCOVER doc left 5.3/5.4 as a checklist instruction to hand the census diff to the fresh-context evaluator -- i.e. exactly the prose-only rule MAKE_IT_STICK says will evaporate, and standing_review_due() had NO production caller, only tests. Built instead as a RECORD: record_standing_review() stamps last_standing_review INTO the census artefact (the design''s own 5.3 step 4, "the register carries its own history"), and reader check (e) makes an unrun / stale-past-the-retro-threshold / malformed / needs_work review an OPEN register-9 row. So a skipped ensuring activity now shows up as WORK rather than as silence -- the MAKE_IT_STICK test applied to this atom''s own mechanism, not just to the four SP atoms it ensures.'
- '2026-08-03 INDEPENDENCE AT THE WRITE SEAM, not in the reader (TAUTOLOGY guard). A stamp the building session could write for itself would be the census certifying its own review, which is precisely the incentive problem section 5.4 exists to defeat ("the same context that wrote the 91 registers is the least able to see them as a problem"). record_standing_review therefore REFUSES unless a matching verdict already sits in background/trust_ledger.py, which independently whitelists fresh-context evaluators (INDEPENDENT_EVALUATORS) and is written by judge_validation.record_close_verdict -- so every standing review also charges back to that judge''s measured error rate (R15: no verdict-organ escapes measurement). Keeping the check at the WRITE seam leaves census_register_open a pure function of the census file plus now, which preserves the _REGISTERS fixture-isolation contract; putting it in the reader would have made every neutered-register test read live disk.'
- '2026-08-03 R15 BOTH WAYS, 2 mutations each firing exactly its own tests, baseline restored green (55 pass across tests/background/test_shared_primitive_census.py + test_gap_register_scan.py, was 45): (1) force the review stamp to always satisfy -> the 6 standing-review tests FIRE; (2) neuter the trust-ledger match in record_standing_review -> the 2 refusal tests FIRE. Both directions covered, not just error-vs-not: a never-recorded stamp opens, a null stamp opens (generate() carries forward null when no review ever ran, and a null must not read as "present therefore fine"), a stale stamp opens and a fresh one closes, a needs_work verdict keeps it open even when fresh, and generate() carries a real review forward with its OWN date while never fabricating one -- otherwise regenerating the census would silently close the row the review is meant to hold open. FIXTURE ISOLATION: the new rung is pinned in test_gap_register_scan.py::_empty_paths, the same class of miss that turned test_neuter_all_registers_reads_closed red when register 9 itself landed.'
- '2026-08-03 L2 NOT L3, and the residual is named. L3 requires the census to have caught a REAL re-duplication in the wild plus an Expert Hour; at build time it has only ever run against the standing backlog. TWO HONEST BOUNDS: (a) nothing self-schedules a standing review -- 5.3 rides the EXISTING retro cadence by design (no second timer), so a review fires when a session runs phase-close item 6/6d, and its absence is visible as register-9 residue rather than as an alarm; (b) --review-due currently reads NOT DUE (a retro landed inside the window) while the register still reads OPEN on standing_review_never_recorded, which is correct and not a contradiction: the cadence answers "is another one owed yet", the register answers "has one EVER happened", and the answer to the second is no. The clone ceiling is still the ruling''s own s0 number (223), to be reconciled when SP3 lands its detector rather than silently assumed equal.'
- '2026-08-03 STALE-DOC FIXES FOUND BY BUILDING, third consecutive instance of the class: phase-close item 6d pointed the evaluator at "GAP_REGISTER_MINT_SOURCE_CONTRACT.md row 9", which did not exist -- the contract table stopped at 8 and the DISCOVER doc''s own BUILD-half instruction to add the row had never been executed; row 9 is now written with all five OPEN conditions. gap_register_scan.py carried the register-9 comment block TWICE and its open_residue docstring still said "all eight registers". The DISCOVER doc''s header still declared the whole BUILD half blocked_on director_build_open, a park abolished 2026-07-29. None of these changed behaviour; all of them would have misdirected the next reader.'
