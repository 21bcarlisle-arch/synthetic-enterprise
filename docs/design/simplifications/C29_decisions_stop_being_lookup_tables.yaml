atom_id: C29_decisions_stop_being_lookup_tables
map_notes:
  gain: 'Director, 2026-08-28 (P6): ''Acquisition budget takes no customer id; dunning keys on segment and days overdue while capacity_to_pay and the breathing-space register go unread; retention is a fixed offer and fixed tiers. A rich, competitive world cannot be exploited through a segment table.'' DELIBERATELY IDLE AND NOT BUILD, which is the sequencing judgement rather than a shortage of will. A richer decision surface against a world that cannot react learns nothing: this seat has already measured that the decision surface the A/B actually has is NINE ACCOUNTS WIDE, and that the choosing is worth -£175 with an error bar 25x the estimate. Widening the surface before the world can reward the width would buy a better-instrumented null. depends_on the P1 atom and the two household atoms; it becomes the obvious next BUILD the moment they land, and everything before then is DISCOVER/FRAME work on it, which is available now (EPOCH_GATING_AND_ATOM_AUTHORSHIP: a parked atom is parked for BUILD only).'
