atom_id: F6_bill_integrity_structural
simplifications:
- '2026-07-13 REGISTERED (INVARIANT_LIBRARY_REDTEAM.md confirmed gaps 2-4+6). No arithmetic footing (a GBP999,999 total on an GBP88 bill passes -- line items are never asserted to sum to the total); no sign/non-negativity check AND the gate fails OPEN when subtotal<=0 (a zero/negative bill skips validation entirely); unguarded temporal impossibility (a reversed-date bill is silently clamped to 1 day instead of rejected); and the Qwen internal-audit backstop FAILS SILENT -- returns ''clean'' when Ollama is unreachable, i.e. on effectively every autonomous run (false assurance). FIX (class): add load-bearing structural invariants -- line-items-sum-to-total footing, non-negativity with FAIL-CLOSED on non-positive subtotal, start<=end temporal sanity that REJECTS not clamps; and make the audit backstop fail-CLOSED/flag when the model is unreachable. loop_stage idle: rank for BUILD.'
- '2026-07-16 F6 HARDEN (Rule-0 self-refill, dial yielded, L2->L2 at target). Two findings, both closed. (1) R15 kill-list gap: the three load-bearing Tier-1 STRUCTURAL controls (check_bill_foots / check_bill_line_items_non_negative / check_bill_period_sane) were F6 evidence at L2 but had firing tests ONLY in the atom''s own test files -- absent from the central mutation-test apparatus (tests/controls/test_control_mutation.py + control_registry.json), so the published kill-list count did not include them (an R15 honesty gap: ''no control counts unless a mutation test proves it fires'' applied unevenly). NOW registered + mutation-tested there; all three FIRE; cumulative kill list 29->32 tested / 28->31 fired / 1 theatre unchanged. (2) RED-TEAM FINDING + FIX: check_bill_period_sane -- the ''temporal sanity'' control -- checked start<=end ONLY, so an ORDERED-but-multi-decade service period (e.g. 2024-01-01 -> 2099-12-31) passed the very absurdity class it is named for (FAIL-OPEN). Fixed as a CLASS invariant (R10): a span > _MAX_BILL_PERIOD_DAYS (731; ~24x the 30-day observed real-data max; back-billing recovery windows use the SEPARATE catchup_period_* fields so no legitimate catch-up is touched) now also fails CLOSED. Verified outcome-safe: real bill-period max across all data is 30 days, annual-bill regression guard passes. NAMED RESIDUAL (R10, not built): a wholly-future normal-span period is not caught because the predicate is intentionally clock-free (C-S2 replay-safe, pure/deterministic) -- catching it needs a caller-supplied as-of/issue date; registered as follow-up rather than smuggling a wall-clock read into an invariant. Tests: tests/company/compliance/test_domain_invariants.py (unit: fires on absurd span, passes an annual bill), tests/company/billing/test_pre_bill_validation.py (gate: HELD on absurd span, annual passes), tests/controls/test_control_mutation.py (mutation, registered).'
- '2026-07-16 F6 HARDEN (Rule-0 self-refill, dial yielded, L2->L2 at target). Two findings, both closed. (1) R15 kill-list gap: the three load-bearing Tier-1 STRUCTURAL controls (check_bill_foots / check_bill_line_items_non_negative / check_bill_period_sane) were F6 evidence at L2 but had firing tests ONLY in the atom''s own test files -- absent from the central mutation-test apparatus (tests/controls/test_control_mutation.py + control_registry.json), so the published kill-list count did not include them (an R15 honesty gap). NOW registered + mutation-tested there; all three FIRE; cumulative kill list 29->32 tested / 28->31 fired / 1 theatre unchanged. (2) RED-TEAM FINDING + FIX: check_bill_period_sane -- the temporal-sanity control -- checked start<=end ONLY, so an ORDERED-but-multi-decade service period (e.g. 2024-01-01 -> 2099-12-31) passed the very absurdity class it is named for (FAIL-OPEN). Fixed as a CLASS invariant (R10): a span > _MAX_BILL_PERIOD_DAYS (731; ~24x the 30-day observed real-data max; back-billing recovery windows use the SEPARATE catchup_period_* fields) now also fails CLOSED. Verified outcome-safe: 1587 real bills, 0 newly HELD. NAMED RESIDUAL (R10, not built): a wholly-future normal-span period is not caught because the predicate is intentionally clock-free (C-S2 replay-safe) -- catching it needs a caller-supplied as-of date; registered as follow-up. Tests: tests/company/compliance/test_domain_invariants.py, tests/company/billing/test_pre_bill_validation.py, tests/controls/test_control_mutation.py.'
- '2026-07-27 F6 HARDEN (Rule-0 self-refill, dial yielded, L2->L2 at target). RED-TEAM FINDING + FIX (KL-9, R15 killer-pattern FAIL-OPEN): the two always-applicable structural bill controls let a non-finite (NaN/Inf) charge amount through -- numeric to float() yet structurally impossible. check_bill_line_items_non_negative passed it because `nan < -0.05` and `inf < -0.05` are both False (the sign check), and on a bill with NO declared total check_bill_foots is not-applicable (returns True) -- so a no-total bill carrying a NaN/Inf line item passed EVERY structural guard on the path to a customer. NaN/Infinity survive JSON round-trips (Python json emits them by default), so this was reachable, not theoretical. FIX (R10 class): finiteness now fails CLOSED and is checked BEFORE the credit-note exemption (finiteness is orthogonal to sign -- you can neither bill NOR credit a customer NaN/Inf); check_bill_foots rejects a non-finite total/component explicitly rather than relying on incidental nan/inf comparison arithmetic. Verified outcome-safe: 2086 company billing+compliance tests pass, epistemic PASS, 0 legitimate bill newly HELD, legitimate credit notes still pass. Both-ways proof captured (pre-fix these inputs returned True, post-fix they fire False). NO new controls added (same 3 structural controls); kill list fixed_cumulative 11->12, control count unchanged. Tests: tests/company/compliance/test_domain_invariants.py (fires on NaN/Inf with and without a total, and on a credit note), tests/controls/test_control_mutation.py (central apparatus), docs/design/control_registry.json (KL-9 + pass_7_note).'
- '2026-07-28 F6 HARDEN (Rule-0 self-refill, dial=1 yielded, L2->L2 at target) -> REST WITH PROOF, NO control accreted. Re-verified all F6 exit tests green (test_domain_invariants.py + test_pre_bill_validation.py + test_control_mutation.py: 197 passed / 1 xfailed) and re-proved the three structural controls both-ways on their own named defects live (foots: inflated/Inf total -> False, legit -> True; non-negative: NaN/negative charge -> False, legit + credit note -> True; period: reversed/absurd-span/missing -> False, legit annual -> True). RED-TEAM: probed the catchup_adjustment_gbp sign-exemption -- it is UNCHECKED by check_bill_line_items_non_negative (fifth footing component, legitimately negative on an overcharge credit), so a large negative catchup_adjustment could in principle foot a NON-credit bill to a negative TOTAL while passing all three controls. Confirmed NOT REACHABLE: generate_billing_ledger only ever sets catchup_adjustment_gbp when catchup_applied is True (else the key is absent -> 0.0 in footing), so no non-credit bill carries the field; guarding it would be a control against an input the pipeline cannot emit (accretion, not fidelity). HARDEN lane SATURATED within file_scope; the one named residual (future-dated normal-span bill) remains R10 follow-up needing a caller as-of date, out of this clock-free predicate''s scope. Level HELD 2->2.'
- '2026-07-28 F6 HARDEN re-verify #2 (Rule-0 self-refill, dial=1 yielded -- no below-target work anywhere; staging+origin verified empty/synced first; director NTFYd). REST WITH PROOF, NO control accreted (lane SATURATED within file_scope). (1) All F6 exit tests re-run green: test_domain_invariants.py + test_pre_bill_validation.py + test_control_mutation.py = 197 passed / 1 xfailed. (2) Re-proved the three structural controls BOTH WAYS on the LIVE predicates using the real footing/line-item field-name keys (not self-contained arrays): check_bill_foots (legit foots True; inflated 999999 total False; non-finite Inf total False); check_bill_line_items_non_negative (legit True; negative charge False; NaN charge False; legitimate overcharge credit note [catchup_applied + catchup_direction=overcharge] True; a NaN ON that credit note STILL False -- finiteness is checked BEFORE the sign exemption); check_bill_period_sane (legit annual True; reversed dates False; absurd 2024->2099 span False; missing period_end False). All three FIRE on their own named defect and pass legitimate input -- R15 both-ways holds live. (3) NO new guard added -- both named residuals already dispositioned: the future-dated normal-span bill is the R10 clock-free-predicate follow-up (needs a caller-supplied as-of date), and the catchup_adjustment_gbp sign-exemption was confirmed NOT REACHABLE by the 2026-07-28 pass (generate_billing_ledger only sets that field when catchup_applied). ROOT-CAUSE of the re-draw diagnosed live: the recorded harden-cooldown stamp sha (3f0ac8af, 2026-07-27T12:05) PREDATES the 2026-07-28 rest-note, so _harden_in_cooldown returned False every tick -- the stamp-before-note ordering defect the W1_4 pass flagged live for THIS same atom. FIX applied this tick: rest-note written + committed FIRST, THEN record_harden_pass stamps the post-note sha -> recorded == committed -> F6 genuinely rotates past for the cooldown window. Level HELD 2->2.'
