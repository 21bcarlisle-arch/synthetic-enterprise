- '2026-07-30 L2->L3 SELF-CERTIFIED (build tick; ledger LEVEL_UP_SELF_CERTIFIED, R16 -- the director_level_up block was ABOLISHED 07-29, the only reason level_current read 2 while L3-quality work sat on disk). THE SUBSTANTIVE FIND, and the reason this is not a re-stamp: the 2026-07-20 note in THIS LIST claimed ''D6 END-TO-END MEASURED ... 1.766'', but the COMMITTED CODE still carried D6 as a placeholder assumed_lift=2.0 in asserted_links() -- a measured-claim with no re-runnable artifact behind it, the narrative outrunning the evidence. D6 is now REALLY estimated: estimate_d6_end_to_end() gives 1.802, CI [0.779, 2.866], via the same winter-conditioning/corner-alignment convention already used by D1/D4 and DECLARED BEFORE COMPUTING so the driver definition could not be chosen post hoc to reproduce the old cited number (R12). Its CI honestly STRADDLES the independence null 1.0 -- unlike D1/D2/D4/D5, whose CIs all exclude it -- and that is reported, not buried. Register: 5-estimated/3-asserted -> 6-estimated/2-asserted; docs/observability/cascade_link_register.json REGENERATED by the orchestrator (write_register() is outside the fork''s file_scope, so the fork correctly flagged it stale rather than reaching for it). R15 HARDENING -- three real NaN-blind fail-opens found and fixed, each mutation-proven by revert-and-confirm-fail: (1) LiftEstimate accepted a non-finite lift at construction, so BOTH .coupled and .anti_coupled silently read False -- neither control could ever fire; (2) assert_coupling_present compared est.lift against a NaN min_lift floor, always False, silently misreporting a genuinely coupled link as COLLAPSED; (3) compounding_holds folded a NaN into the same False that a genuine ''chain thinned'' physics finding returns, masking a data-pipeline defect as an ordinary result. All three are the same NaN-blind-comparison class this project has hit before -- reject non-finite FIRST, before any comparison. NO TAUTOLOGY found: the CI comes from independent moving-block bootstrap resampling, never the same computation validated against itself. D3 (book delta-vol) and D7 (interconnector relief) were VERIFIED, not assumed, to have no honest in-repo estimation path -- company/market/interconnector_monitor.py is a COMPANY-RUN MODEL, so estimating D7 from it would breach anti-marking-own-homework -- and correctly remain asserted. compounding_holds is now wired into build_register() as a DIAGNOSTIC (R12, never a target): holds=False, product of D1xD2xD4xD5 ~= 79 against L_end ~= 1.80, i.e. the cascade PARTIALLY DECOUPLES end-to-end. Each link is individually real yet the chain does not compound -- a finding about the world (and a caution against reasoning about the cascade by multiplying its links), surfaced, not tuned. 32/32 tests green (was 24). KNOWN GAP, FLAGGED RATHER THAN SILENTLY DECIDED: no per-link cut-coupling mutation beyond D1''s, judged sufficient generalisation because D2/D4/D5 run through the same already-proven joint_tail_lift/cut_coupling primitives -- the project''s own ''audit the class, don''t re-guard the Nth instance'' standard. CANDIDATE ATOM RAISED: site/data/simplified.json still carries the 07-20 narrative saying D2-D7 are asserted, now stale against the code.'
