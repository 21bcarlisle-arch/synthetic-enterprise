atom_id: W2_2_population_draw
simplifications:
- '2026-07-13 BUILT to L2 (BUILD_THE_BACKLOG P0, fork, profile B). Re-scope: L2 = verified standalone draw (realised 0.992 acq/yr over 3000 seeds; own SHA-256 substream, siblings byte-identical; 23+110 tests, epistemic PASS). The earlier L2-director-reserved hold now applies to L3 (live-run wiring + C6 book-mix coupling), still unbuilt. || director-confirmed known gap'
- '2026-07-11 M3 DISCOVER+FRAME (docs/design/M3_DISCOVER_FRAME.md): population draw is genuinely greenfield -- CUSTOMERS is still a fixed list literal, _payment_rng is a single fixed seed (42+7919), zero draw_population/generate_population code found anywhere. Not currently a live epistemic violation (no seed exists yet for company code to read) but a real future risk if a draw module were placed carelessly (e.g. in saas/, which the portal already imports directly). BUILD deferred pending director/advisor sequencing.'
- '2026-07-12 DISCOVER addendum (self-refill draw, no BUILD code): confirmed directly what the current fixed CUSTOMERS literal''s real segment mix actually is (saas/customers.py) -- 15 resi / 4 SME / 5 I&C (24 total) -- the concrete marginal distribution any real per-run draw mechanism would need to preserve, not an abstract ''vary the population'' instruction. External research grounds the mechanism choice in an established statistical tradition (population synthesis/microsimulation, not invented for this project): Iterative Proportional Fitting (IPF, established since 1940) is the standard technique for drawing a synthetic population matching known marginal distributions (e.g. this project''s real segment/tariff proportions) while allowing genuine unit-level variation -- with known, real limitations directly relevant to sizing the eventual build: cloning-based IPF variants lose real heterogeneity (repeats existing customer shapes rather than generating genuinely new ones) and scale poorly as more attributes are matched jointly. A newer family (MCMC-based synthesis) is the alternative real practice where more attribute realism is needed. Named next FRAME question (not decided here): does this atom need IPF-grade marginal-matching rigour (defensible if segment/tariff proportions must exactly track the real book), or is a simpler weighted-bootstrap-with-replacement over the existing 24 real customer shapes sufficient for the stated goal (''vary the population run to run'') -- a real sizing/scope call for the next FRAME pass, not decided unilaterally here.'
- '2026-07-13 FRAME pass answers the named question above (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Read saas/customers.py directly rather than reasoning about IPF vs bootstrap in the abstract, and found a fact that reframes the whole question: CUSTOMERS is not a parametrically-generated table at all -- every one of the 24 entries is individually hand-authored with real narrative depth (named locations, specific tariff_type overrides for flex/pass-through mechanisms, specific write-off/vulnerability/life-event histories keyed to that exact customer_id). Confirmed via grep the real blast radius of touching this: 370 files under tests/company/saas/simulation reference specific customer_ids (C1, C3, C5, C_IC1, etc.) directly -- billing-tab tests, the year-spotlight dashboard''s named-customer panels (phase-close checklist 0b requires a real named customer per phase), W2_5_life_event_stream''s per-customer event stream, ledger write-off history, all keyed to these exact IDs surviving run to run. Neither IPF nor plain bootstrap-of-existing-rows was ever the right frame: IPF assumes an attribute-generation model to reweight, which doesn''t exist here (there is no generator, only hand-written literals), and a full per-run REPLACEMENT population (new synthetic customer_ids each run) would break all 370 dependent references -- a real, wide blast radius, not a hypothetical one. FRAME decision: the eventual BUILD should be ADDITIVE, not REPLACIVE -- keep the existing 24 hand-authored customers as a fixed narrative core (preserving every downstream reference), and draw a per-run SYNTHETIC population on top of it (new customer_ids, e.g. G-prefixed or similar, generated from segment-proportion-matched attribute distributions derived from the real 24''s own mix: 15/4/5 resi/SME/I&C) to deliver the atom''s real_world_twin goal (''book composition varies run to run'') without any one-way-door risk to already-built mechanisms. This also resolves the IPF-vs-bootstrap question as moot at this scale (N=24 core, small per-run addition) -- a straightforward weighted categorical draw over segment/tariff/region proportions is sufficient; IPF-grade joint-marginal matching would be over-engineering for a population this size. Next FRAME/BUILD question (not decided here, epoch-gated): what attribute distributions (consumption band, payment method, region) the synthetic add-on customers should draw from, and how many per run is realistic (a real supplier''s book grows/shrinks by a small fraction per period, not a full reshuffle).'
- '2026-07-13 FRAME pass answers the named next question with real anchors and a decisive internal finding (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Attribute distributions: docs/market_research/ASSUMPTIONS.md already anchors Direct Debit payment-method share (72% electricity / 75% gas, DESNZ Quarterly Energy Prices June 2026) and company/compliance/domain_invariants.py''s TDCV_ELEC/GAS_LOW/MEDIUM/HIGH RangeInvariants already anchor consumption bands -- both real, current, already-coded, reusable as-is for the synthetic add-on customers'' draw distributions. Region has no existing real population-level distribution in this codebase (an honest gap, not silently assumed). Sizing question (''how many per run''): checked saas/customers.py''s own real acquisition_date field for every one of the 24 hand-authored customers directly rather than assuming an even cadence -- 20 of 24 were acquired in 2016 (the founding cohort), a further 4 trickle in across 2017-2020 (one per year, 2019 has two), and ZERO new customer acquisitions exist anywhere from 2021 through 2025 -- the book has been completely static for the entire second half of the ten-year replay. This is a real, decisive, quantified finding that reframes the sizing question from an abstract ''how many'' into a concrete, scoped target: the synthetic per-run draw''s most valuable and clearly-bounded first job is filling this exact gap (continuing new-customer acquisitions through 2021-2025 at a plausible rate matching the hand-authored cast''s own established 2017-2020 trickle cadence), not an unscoped ''vary everything'' goal. This also gives the eventual BUILD a natural, falsifiable success criterion: does the post-build book show acquisitions continuing through 2025, not stopping dead in 2020.'
- 2026-07-13 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval -- the director delegated BUILD-within-the-open-epoch to the twin in-console (DIRECTOR_CANON.md v2 section 3a); ask_twin returned APPROVED, confidence high, for all six ranked Epoch-2 candidates (director_twin_log.jsonl entry 2026-07-13T07:33:20). Now BUILD-eligible for the supervisor's BUILD-tier draw. W1 built first; the rest concurrent where file_scopes are disjoint.
- '2026-07-13 BUILT L0->L1 (sim-engineer fork, commit 1debe9e7 pushed; orchestrator-verified per R1: 19/19 tests pass, epistemic_verifier PASS 498 files, grep-confirmed zero company/saas imports in the new module). New simulation/population_draw.py: an ADDITIVE per-run stochastic draw (per the atom''s own FRAME decision -- keeps the 24 hand-authored core untouched so all 370 dependent customer_id references survive, R13 no-baseline-edit) that draws a synthetic SYN-* cohort filling the FRAME-found gap (the book stops acquiring at 2020; zero acquisitions 2021-2025), continuing acquisitions through 2021-2025 at the cast''s own 2017-2020 trickle cadence. Architectural constraints all honoured and tested: own NAMED SEEDED substream (C-S2 -- SHA-256(stream+seed)->isolated Random, never touches global random, with a test proving a draw here cannot shift another subsystem''s sequence -- the direct 01:09Z-incident lesson); deterministic replay (same seed->identical population, tested); event-arrival tolerance (C-S1 -- acquisitions modelled as an ordered event stream). Epistemic wall respected WITHOUT importing company code: DD share (72/75) + TDCV consumption bands DUPLICATED with drift-guard tests vs ASSUMPTIONS.md / domain_invariants.py (the settlement_timetable.py pattern), not imported; region + segment/band weights are DOCUMENTED PLACEHOLDERS per R10 (honest gap, not fabricated anchors); data_regime=''synthetic''. HONESTLY HELD AT L1, not L2: the mechanism is built + tested but NOT yet wired into the live run pipeline -- an actual run''s customer book still stops at 2020. L2 REQUIRES integrating the draw into the live run so a real run''s book shows synthetic acquisitions continuing through 2025 (the FRAME-set falsifiable criterion), verified against live output -- a bigger, run-pipeline-touching step deliberately not taken this pass.'
- '2026-07-13 L2 ACTIVATION IS DIRECTOR-RESERVED CURRICULUM (twin ruling, director_twin_log.jsonl, confidence high, routed_to_director=False, answered from canon). The orchestrator routed the L2-activation question to DIRECTOR_TWIN (the standing scope/sequencing approver, canon v2 3a) rather than flipping it on autonomously. Twin ruling verbatim in effect: ''Wait for director framing -- this activation is the director''s to author.'' Rationale: R13 explicitly lists ''population draws'' among the CURRICULUM (which worlds the company lives through) -- the director''s own instrument, difficulty changes named/versioned/director-authored, never agent-adjusted. Building the L1 mechanism in isolation was legitimately agent-buildable, but WIRING IT INTO THE LIVE RUN changes which world the company faces every run = precisely the curriculum act R13/§5 reserves to the director. The twin''s standing BUILD-within-epoch approval covers scope/priority-within-dials but does NOT override a permanent rule (§3a defaults to APPROVE unless it violates the operating rules; §5 ''the director owns the curriculum'' is violated here). Not a one-way door, not the Epoch-4 fitness function, but reserved by R13. CONSEQUENCE: W2_2 HELD AT L1 by governance, not by missing capability -- the mechanism is complete and verified; its live activation awaits the director authoring that curriculum change. The agent may STAGE the integration but must not flip it on. Surfaced to the director as a ready-when-you-are curriculum decision (not a blocker -- ample other work).'
- '2026-07-21 SEGMENTATION GENERATOR STRUCTURE BUILT (director-opened console BUILD, docs/design/SEGMENTATION_GENERATOR_BUILD_PLAN.md, all 5 steps; SEGMENTATION_RECONCILIATION_FRAME.md §0 canonical wall ruling honoured throughout). Step 1: assign_cohort(customer_id, base_seed) added to population_draw.py -- a NEW named sha256 substream (COHORT_STREAM_NAME="W2_2_cohort_draw", per-axis salts), DEFAULT OFF (assign_cohorts=False on SyntheticCustomer/_draw_one/iter_acquisition_events/draw_population) so existing output is byte-identical (proven, test_cohort_draw_default_off_is_byte_identical). Samples the observed block (accommodation/cars/nssec) from a tenure-tilted joint reproducing the fusion register''s own evidenced Cramer''s V direction (tenure x fabric 0.273, tenure x cars 0.303, tenure x nssec 0.229 -- R10 documented SHAPE, no full conditional cross-tab published at this granularity); heating_fuel pinned to region (off-gas tail concentrated per the register''s Wales/London tail findings); green_stance/price_sensitivity/channel_pref drawn from the segmentation_curriculum_v1.json marginals (read live, never hardcoded -- proven, test_cohort_curriculum_values_are_read_not_hardcoded). TENURE RECONCILIATION (the BUILD_PLAN''s own flagged risk): cohort_tenure_for_customer() is a strict REFINEMENT of the existing household_segments.tenure_for_customer() (never a second independent draw) -- collapse_cohort_tenure() round-trips to the original 3-level TenureType for EVERY customer_id, proven for 500 synthetic ids AND the full 24-customer hand-authored roster. Step 2: low_carbon_adoption_eligibility_multiplier(cohort_tenure) reads tenure_adoption_gating_strength live from the curriculum; wired as a new OPTIONAL adoption_eligibility_multiplier=1.0 parameter on simulation/life_events.py::generate_life_events() (default byte-identical, proven), gating solar_install/ev_acquired/heat_pump_installed probability only -- measured 25->3 adoption events over 300 seeds at the curriculum''s 0.17 renter multiplier. Live-run WIRING (computing a household''s cohort tenure and passing a non-1.0 multiplier into the real run pipeline) is DELIBERATELY NOT done this pass -- same governance class already recorded on this atom''s own history above ("L2 ACTIVATION IS DIRECTOR-RESERVED CURRICULUM": wiring a population/curriculum mechanism into the live run changes which world the company faces every run, R13). Step 3: new company/analytics/cohort_discovery.py -- the company''s BELIEVED cohort from EPC/census public priors (region/tenure/heating_fuel, near-exact) + interaction observables (price_sensitivity from a churn-estimate proxy, channel_pref from observed contact channels); green_stance STRUCTURALLY EXCLUDED (always None, no observable, by design); accommodation/cars/nssec have NO discovery mechanism (honest gap) and stay at the flat national census prior regardless of known tenure. Imports NOTHING from simulation.*/sim.* (statically verified + epistemic_verifier PASS). Step 4: new tools/couple_cohort.py (couple_w2_4_c6.py template) -- per-(axis, true-tenure-cell) belief_gap, worst_cell_score = max gap among cells with support>=N_MIN=30 (R10: a SUPPORT-ONLY proxy for "clears the learning-value knee" -- the full build_learning_frontier.py re-derivation on the merged schema was NOT attempted, named simplification, not silently presented as the real knee test), worst3_mean_gap also reported. FIRST MEASURED RESULT (n=3000, seed=20260721, not yet written to the live ledger -- see below): worst cell = price_sensitivity::tenure=social_rent, gap=1.0345 (marginally worse than blind -- an honest, real finding: the noisy churn-estimate proxy + fixed thresholds barely beat guessing for this cell); the three no-discovery axes (accommodation/cars/nssec) sit at exactly gap=1.0 for every tenure cell (correctly diagnostic: zero learned skill where no mechanism exists, not a bug); channel_pref shows real partial learning (gap 0.12-0.26, well below blind). Step 5: tools/epistemic_verifier.py extended with _scan_seam_files_for_forbidden_symbols() -- a curated closed-symbol scan (green_stance/price_sensitivity/channel_pref/cohort_label/true_cohort/segment_label/assign_cohort/Cohort/nudge_susceptibility/co2_salience) of company/interfaces/sim_interface.py specifically (the ONE file the generic import-direction scan exempts, since it legitimately imports simulation internals) -- always runs inside scan() regardless of file-list scope. R15 MUTATION PROOF: 5 new tests in tests/controls/test_control_mutation.py -- fires on a planted green_stance leak, fires on a planted price_sensitivity leak, passes clean on the real shipped sim_interface.py, missing-file is correctly not a violation (vs an unreadable-existing-file IS), and scan() itself is proven to always include the guard. .claude/rules/epistemic-wall-company.md extended with the D-SEGMENT/cohort wall paragraph. LEDGER WRITE DELIBERATELY DEFERRED (blast-radius discipline, MAKE_IT_STICK.md precedent "writing an un-wired entry to a shared derived surface reds its consumer''s tests"): write_gap_entry() is built and tested against a TEMP ledger path (test_write_gap_entry_mechanism_against_temp_ledger) -- NOT invoked against the live docs/observability/coupled_gap_ledger.json this pass, because tests/tools/test_generate_proof_coupled_gaps.py::test_reflects_real_ledger_exactly hardcodes pair_count==10/measured==10 against today''s Proof-door panel; adding a live entry would need that count updated as a deliberate, reviewed change, not a side effect of this build. VERIFIED: 78 new/extended tests across tests/simulation/test_population_draw.py (18 new), tests/simulation/test_phase_b_life_events.py (5 new), tests/company/test_cohort_discovery.py (20 new), tests/tools/test_couple_cohort.py (11 new), tests/controls/test_control_mutation.py (5 new) -- all pass; epistemic_verifier PASS (522 files); default-off byte-identical regression proven directly. R16: level_current/level_target/loop_stage left UNCHANGED (proposals only, no gate_authorizations.jsonl write) -- this note proposes the generator STRUCTURE as real, tested, additive L1-shaped work sitting alongside this atom''s existing L2, not a level claim.'
