atom_id: OPS_run_marker_sweep_livelock
simplifications:
- '2026-08-03 REGISTERED by the worker tick that diagnosed it (SELF_INTERRUPT_DISCIPLINE: queued as an atom, NOT fixed on sight -- the machine is not blocked, so this is queue-by-default work). THE DEFECT is a genuine LIVELOCK, not a slow queue. background/sim_runner.py creates a run_complete marker roughly every 9 minutes and holds the process_run_complete run lock while it publishes its OWN marker inline. background_worker.py::process_leftover_run_markers() re-globs every marker in docs/staging/ at the top of every cycle and attempts each one -- and each attempt returns EXIT_LOCK_SKIPPED because the producer holds the lock. The sweep therefore logs "will retry next cycle" for all 404 markers, every cycle, forever, and has never once succeeded; the backlog grows ~150/day. NOT BLOCKING, which is exactly why it survived: publishing still works, because sim_runner publishes the marker it just created without going through the sweep. So the observable symptom is only an unbounded staging directory and a per-cycle burst of futile lock attempts. TWO THINGS TO FIX, and the second matters more: (1) the sweep must be able to make progress -- either acquire the lock with a wait/backoff rather than a non-blocking try, or have the producer release between markers, or drain the backlog in the lock-holder itself; (2) R15/FAIL-SILENT: the sweep currently reports a permanent total failure using the vocabulary of a transient retry. 404 x "will retry next cycle" reads like a healthy queue and is indistinguishable, in the log, from progress. A sweep that has processed ZERO markers across thousands of cycles must say so loudly -- the class-closing invariant is that a retry loop which has never succeeded is an ALARM, not a log line. R10: do not close this by deleting the backlog; closure is the sweep demonstrably draining markers plus an alarm that fires on a zero-progress retry loop.'
- '2026-08-03 BUILD NOTE, on the option NOT taken. The atom offered three routes to "the sweep must be able to make progress": a blocking/backoff lock acquire, the producer releasing between markers, or draining inside the lock-holder. ALL THREE WERE REJECTED, because they share a premise that turns out to be false -- that the 401 backlogged markers WANT publishing. They do not. A run_complete marker is a publish request for a POINT-IN-TIME snapshot, and re-running the pipeline on a 5-day-old marker regenerates ANNUAL_REPORT.md, LATEST.md and the whole site FROM THAT STALE SNAPSHOT, overwriting current figures with older ones. Every marker JSON was verified still present on disk (413/413), so this was not hypothetical: a "successful" drain would have been a live fidelity regression, silently winding back the clock R14 makes every figure carry. Winning the lock harder would have made the defect WORSE, faster. The real missing concept was a terminal state for a request that can no longer be satisfied, which is why the fix is a lifecycle change and not a locking change -- and why retirement deliberately needs no lock at all.'
- '2026-08-03 RESIDUAL, registered not fixed (SELF_INTERRUPT_DISCIPLINE): the 12 genuinely-pending markers still each spawn a full publish pipeline attempt per sweep, and in the steady state sim_runner produces one roughly every 9 minutes while holding the lock for 5-10 of them. So the pending set is bounded and self-clearing (each publish supersedes its predecessors) but is not guaranteed to be SMALL. If pending count is ever observed growing monotonically the zero-progress alarm now catches it; a stronger fix (attempt only the newest pending marker, since publishing it supersedes the rest by construction) was deliberately NOT taken here because it narrows the unconditional glob that tests/background/test_background_worker.py pins as the entire rescue net, and that narrowing deserves its own atom rather than riding along with this one.'
- '2026-08-03 TWO RIVAL IMPLEMENTATIONS EXIST, BOTH OFF-MAIN, NEITHER MERGED (worker tick fork audit, docs/staging/WORKER_FINDING_DEAD_FORK_RESCUE_AUDIT_2026-08-03.md). Both were UNCOMMITTED in dead fork worktrees and have been preserved as RESCUE commits on their own branches: worktree-agent-a5555b1e8256de0e4 (rescued 448c2dee5 -- background_worker.py +266, process_run_complete.py +27, tests/background/test_background_worker.py and test_process_run_complete.py +346) and worktree-agent-ad14ac1d4858a473f (rescued f50b4cc26 -- background_worker.py +277, process_run_complete.py +70, and a NEW 423-line tests/background/test_run_marker_sweep.py that exists nowhere else). NEITHER IS MERGED AND THAT IS DELIBERATE: two rivals for one atom is a RECONCILIATION, not a merge, and blind-merging either would silently pick a winner on no evidence -- the same rival-pair situation as SITE_EH1, where the audit showed the winner had landed and the loser still held one idea worth keeping. THE WORK IS: diff the two against each other and against main, decide which livelock fix is correct (the sweep can never acquire the run lock the producer holds, so it has logged "will retry next cycle" for 404 markers every cycle without ever succeeding -- a permanent total failure reported in the vocabulary of a transient retry), merge the winner through the real pre-commit gate, and graft anything the loser has that the winner lacks. R15: whichever lands must FIRE on the livelock it fixes -- a sweep that reports retry-forever must be distinguishable from a sweep that is genuinely waiting.'
map_records:
  evidence:
  - '2026-08-03 BUILT+PROVEN, L0->L1 self-certified into gate_authorizations.jsonl. The livelock is closed by giving a leftover marker a TERMINAL state other than "published": a marker overtaken by a strictly LATER run that already reached done/ is RETIRED by rename (no subprocess, so no run lock, so it can never be lock-skipped), with the superseding run stamped INTO the retired file. R10 honoured -- the backlog is retired with its reason recorded, NOT deleted, and the unconditional glob that is the whole rescue net is untouched: every marker with no later published run is STILL attempted every cycle. The fail-silent half is closed by background_worker._check_zero_progress: the oldest pending marker unchanged across 3 sweeps raises ONE alarm (R5 transition-only), so "will retry next cycle" can no longer impersonate a healthy queue.'
  - 'R15 MUTATION PROOF, 6/6 KILLED, 0 survivors (tests/background/test_background_worker.py): M1 supersession made non-strict (<=); M2 unparseable stamp treated as superseded; M3 retire with no publish frontier at all; M4 alarm never fires; M5 alarm latches even when the NTFY send FAILED (fail-silent); M6 the livelock itself restored (sweep everything, retire nothing). 24/24 in the module, 256 passed across the marker/staging/worker selection.'
  - 'DRAIN DEMONSTRATED ON REAL STATE 2026-08-03: docs/staging/ root 413 -> 12 leftover markers; 401/401 superseded retired to done/ carrying "## Superseded (not published)" + the superseding run stamp; the 12 left are genuinely pending (no later published run exists) and were deliberately left to the normal publish path rather than force-published from stale snapshots.'
  - docs/observability/background-worker-log.md 2026-08-03 05:12 UTC "Found 404 leftover run_complete marker(s) -- processing" followed by 404 consecutive "Lock-skipped ... (another instance holds the run lock) -- still pending, will retry next cycle"
  - 'measured 2026-08-03: docs/staging/ root held 404 run_complete_*.md spanning 2026-07-29..2026-08-03 (12/41/20/152/155/25 per day); only 6 archived to done/ since 2026-08-02 against 188 created in the same window'
  - background/process_run_complete.py::process (_run_lock, EXIT_LOCK_SKIPPED) and its own docstring, which explicitly delegates retry to background_worker.py::process_leftover_run_markers()
