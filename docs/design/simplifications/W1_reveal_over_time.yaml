rds across 2016-2025 and the resulting daily-mean bias not computed (raw records fetched live from Elexon per run, out of scope for an autonomous HARDEN turn). This is a fidelity correction (R13 baseline-for-fidelity, decided blind to P&L), NOT a margin/vol target (R12). Fix is BUILD code on a shipped historical-price basis (this atom''s own prose repeatedly warns such changes could silently corrupt years of data), so QUEUED for a real M-lane touch, not fixed on sight. level_current stays 3/3, loop_stage stays harden.'
