- '2026-07-13 BUILT to L3 (BUILD_THE_BACKLOG P0, fork, saas/channel_attribution.py). Company naive DD channel-attribution: delta_naive = observed non-DD arrears - DD arrears from OBSERVABLES only, credited wholly to DD; discovery hook FLAGS possible confound but never alters the headline (the trap must be fall-into-able). Closes W2_10: delta_naive 0.049 vs delta_true 0.024 (do-operator) => attribution gap 0.516 -- ~half the DD business case is SELECTION artefact. VERIFIED did-not-de-confound (delta_naive matches world observational demo exactly, differs from true). Not tuned (R12/R13), epistemic PASS, 14 tests. || 2026-07-13 REGISTERED as a COUPLED-TRIAD company-side twin (COUPLED_TRIAD_DESIGN.md, director P1 THE_COUPLED_TRIAD.md, provenance proposal). W2_10 DD attribution confound (first selection-bias trap). SIM holds the true migration/attribution; the company''s naive channel-attribution analytics must be capable of being WRONG (attributing a DD-migration effect to a channel). GAP = attribution error |delta_naive - delta_true| / |delta_naive| (fraction of the measured effect that is actually confound). This is the archetypal selection-bias-trap the company must discover it is falling into. Per the two binding rules (CLAUDE.md/A6): this company atom is not complete until it has faced the defeating world (W2_10_dd_attribution_confound) with a non-degenerate gap measured; and W2_10_dd_attribution_confound''s L3 blocks until this twin + gap exist. loop_stage idle: DISCOVER/FRAME workable now (the company-side capability design), BUILD ranks per dial. The gap metric + harm-cost weights (CURRICULUM, director-signed) are defined in A6_coupled_triad_gap_metric.'
