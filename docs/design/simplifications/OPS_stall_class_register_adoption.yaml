- '2026-08-03 MINT -- ADOPT, DO NOT REBUILD, BUT DO NOT MERGE BLIND EITHER. The work must go through the REAL pre-commit gate before landing: it was rescued with --no-verify onto its own branch precisely so that no untested code reached a shared surface, which means it has never faced the gate. Read it against what already exists (daily_self_note.py is in its file_scope and is live on main) rather than assuming a dead fork got the design right. R15 IS THE ACCEPTANCE, AND IT IS SHARP FOR THIS ONE: a register OF STALL CLASSES is itself a control, so it must FIRE on a real stall class and stay quiet otherwise -- a register that has only ever recorded stalls after they were already known has demonstrated nothing. Guard the three killer patterns explicitly: FAIL-OPEN (an unreadable or empty register must not read as "no stalls"), FAIL-SILENT (the register being unavailable is a FAILED check, not a clean one), TAUTOLOGY (it must not derive its stall list from the same source it is supposed to be auditing). R12: a count of stall classes is a DIAGNOSTIC, never a target to drive to zero.'
- '2026-08-03 DISCHARGED UNDER HX2_stall_set_coverage_verdict, which is the home atom this mint said it lacked -- the adoption and the verdict are the SAME work, so this cell records the adoption half and HX2 carries the evidence. The audit this mint demanded was performed and is the reason the adoption is trustworthy: every named detector re-resolved against main''s real code (7 resolve, 2 are declared holes), the two UNCOVERED claims re-verified against supervisor.py:1957/:3575 and action_needed.resolve_item rather than taken on the dead fork''s word, all 8 mutations re-run each firing exactly its own named test, and the detectors run against REAL git history where they recovered the 42h deadlock and the 4-day blackout unprompted. It did NOT merge on --no-verify: it went through the real pre-commit gate, which is the one thing the rescue commit could not do. The one thing the fork got wrong: coverage_line() cited docs/design/HX2_STALL_SET_COVERAGE_VERDICT.md, which DID NOT EXIST -- a live dangling reference in a published surface, now written. R12 held: the class count is a diagnostic, not a target driven to zero, and the 2 holes are left OPEN and named rather than closed to make the number look better.'
