map_notes:
  origin_note: 'This is the atom where an absurdity-class defect is most likely and most expensive: dunning a customer who has paid is a real-world harm with a real-world regulator behind it, and D7 already measured that exposure at ten times the miss rate. R10 therefore binds -- any defect found here is closed by extending the obligations register so the CLASS fails automatically, never by fixing the instance. Vulnerability handling is an obligation, not a feature flag.'
