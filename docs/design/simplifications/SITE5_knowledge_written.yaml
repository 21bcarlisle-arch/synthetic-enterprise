atom_id: SITE5_knowledge_written
map_notes:
  gain: '`site/knowledge/` is not a 5.7KB stub as the brief has it -- it is 324KB across eleven pages. **CORRECTED 2026-08-18, and the correction is this atom''s first real finding.** The mint claimed EIGHT pages render byte-identical visible text and that ''a reader clicking Price cap arrives at prose identical to Carbon price''. That was WRONG, and wrong by the exact method this project polices in others: the MD5 `2ad82c7405` was measured on the tag-stripped STATIC SOURCE, which is identical because all nine topics share ONE template (`knowledge/_stub/index.html`) that fetches its content from `site/data/knowledge_wholesale.json`, keyed on the directory name in `location.pathname`. RENDERED with that pathname, the pages are distinct: /price-cap/ reads ''The retail price cap'' with a 111-char blurb and a 381-char scope; /carbon-price/ reads ''The UK carbon price (UK ETS + CPS)'' with its own. They are honest stubs that say what a complete treatment will cover -- not duplicates. (The first re-check was ALSO wrong, in the other direction: the shared live harness stubs `location.pathname` as ''/'', so every topic rendered empty and appeared to confirm the original claim. Verified only on the third pass, with the pathname supplied.) WHAT SURVIVES THE CORRECTION, all re-measured: the nine topics are STUBS -- the explanations are not written, which is this atom''s actual work; `wholesale-price-formation` has a DIRECTORY but NO entry in the data, so it renders its own raw slug as its title with no blurb, no scope and no links -- a genuinely broken published page, and it is not linked from the Knowledge index either; and `electricity-wholesale`, the one topic linked from /world/, carries an empty `scope` so its own ''What this page will cover'' section reads ''Scope not yet stated.'' No Knowledge page carries a last-reviewed date in any form, so the brief''s review-due control starts from zero, not from a threshold change. This is the largest content piece in the programme after Explore, and it is a LIVE public defect today: an advertised area serving nine pages of identical boilerplate to a crawler and a reader. Knowledge is NOT put in the nav here.'
