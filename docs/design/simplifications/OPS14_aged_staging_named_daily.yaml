atom_id: OPS14_aged_staging_named_daily
map_notes:
  name: 'MINTED FROM clause 5 (appended 2026-08-12 on the director''s word) of DIRECTOR_RULING_FINDING_SEVERITY_AND_INTERLEAVE_2026-08-12. Any staging-root document untouched for 72 hours is named in the daily digest -- filename, age in days, and one line of what it asks for -- every day until dispositioned. VISIBILITY ONLY: it stops nothing, refuses nothing, grants no priority; the 48-hour auto-archive backstop is complementary and stays as-is (that one moves COMPLETED records out, this one names UNOPENED ones). EXIT, the ruling''s own test first: (1) a document staged and then deliberately ignored appears in the digest on day three with its CORRECT age and keeps appearing; (2) THE KNOWN FAIL-SILENT PATH IS CLOSED -- background/sanity_daemon.py::_maybe_send_daily_digest today fires at most once per UTC date AND skips the digest entirely when any new finding fired that cycle, so under the current code an aged-doc line can be dropped for the day; the ageing block must not be suppressible by that branch, and the ruling names a digest that can go quiet while old documents remain as the failure this clause exists to forbid; (3) the CLOCK IS DEFINED AND DEFENSIBLE -- filesystem mtime on this shared working tree is perturbed by concurrent daemon writers, so ''touched'' means a real disposition event (the last commit touching that path, or an explicit disposition record), and the choice is tested against a file a daemon rewrote without anyone opening it; (4) R15 both ways -- a mutation letting the digest go quiet with an aged document present, and one skewing the age computation, each kill a NAMED test; (5) the four documents that motivated the clause (the money-core characterisation, the CLAUDE.md decay audit, the seat cutover/DR proposal, and the fourth named in the ruling) appear in the first digest this produces, or the mechanism is looking at the wrong population.'
