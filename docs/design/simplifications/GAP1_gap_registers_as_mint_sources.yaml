simplifications:
- '2026-07-28 REGISTERED RETROACTIVELY 2026-07-29 -- this atom was BUILT before it was ever a map cell, which is itself the finding. It existed only as docs/staging/in_progress/PLANNER_MINTED_gap_registers_as_mint_sources_2026-07-28.md, blocked_on: director_level_up, so the very mechanism it implements (published registers are drawable work) was itself invisible to the map that decides what is drawable. Serves DIRECTOR_RULING_PUBLISHED_GAPS_ARE_THE_BACKLOG_2026-07-28 deliverables 1+2. Fidelity gained: none directly -- a draw-completeness / work-accounting fix closing the "saturation was a bookkeeping artifact" hole the director named.'
- '2026-07-28 BUILD LANDED (commit 2454e70, exit criteria (a)-(d) all met). (a) DISCOVER/design: the mint-source contract naming each register''s primary-state path + OPEN-marking field is at docs/design/GAP_REGISTER_MINT_SOURCE_CONTRACT.md. (b) BUILD: background/gap_register_scan.py emits the OPEN residue from PRIMARY state and imports NOTHING from supervisor (verified: only json/math/re/pathlib/typing) -- the LAW-C independent-reader pattern, so it cannot restate the tick''s own belief; a `gap_register` level is wired into background/supervisor.py::authorized_set_enumeration (via _gap_register_open). LIVE at registration: gap_register_open() = True with 8 residue rows, i.e. it is actively forbidding an illegitimate rest right now. (c) R15 BOTH WAYS (10 tests): neuter all registers => reads closed while open items demonstrably exist (the control FIRES), restore => open; a single open row flips the level to Y; the supervisor level is present AND killable via the .gap_register_level_disabled flag; the two corrected non-fail-open register keys (register 1 text-heuristic, register 6 state-keyed prefix-agnostic) each beat their superseded key. (d) FAIL-SAFE TOWARD WORK (Rule-0 direction -- ambiguity forbids rest): an unreadable register, a missing file, a non-finite at-weight, and a reader-side exception ALL read DRAWABLE. DIVISION OF LABOUR (deliberate, §3): GAP1 only ENUMERATES -- held SSP cells and un-triaged sanity rows appear in the residue and are never silently dropped; classification is GAP2''s ratified taxonomy, GAP3 the ranked list. R12 non-negotiable: the count of open/closed gaps is a DIAGNOSTIC on this line, never a score or a headline.'
- '2026-07-29 LEVEL 0->3 SELF-CERTIFIED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 2+6: "levels are proposed and recorded, never gated" and "gap_registers_as_mint_sources: build it. No further asking."). The BUILD was complete on 2026-07-28; the ONLY thing outstanding was the level cell, held by blocked_on: director_level_up -- a block type this ruling abolishes. Recorded in docs/observability/gate_authorizations.jsonl as action LEVEL_UP_SELF_CERTIFIED, authorized_by agent_self_certified, channel self (honestly stamped -- it never masquerades as a console/twin/phone act), provenance naming the evidence above. R16 is satisfied by the RECORD being ledger-backed and auditable, which was always its real requirement; the director-permission half is what the ruling deleted. Reversal cost: one map edit + one ledger line.'
