atom_id: D43_whose_atom_did_that_hour_build
map_notes:
  gain: '`file_scope` is the field every provenance control here reads as ''what this cell is about'', and `supervisor._file_scope_sha` decides from it whether the harden cooldown re-offers the atom -- so an off-scope Hour cannot be seen by its own atom''s clocks, AND the cell that does declare the file has its assertion silently staled by an Hour it has no record of. Measured at HEAD from the map''s own scopes and the labels the code carries: of 24 recorded H27 Hours, SIX left no trace in any file that cell declares. `hour_subject_findings` (HOUR_OFF_SCOPE, with a HOUR_BUILT_FOREIGN_SCOPE clause naming the cell that does own the path) plus `hours_on_subject`, on exit code 4 and report-only for D42''s reason: off-subject work is often the RIGHT work, and what is not optional is that somebody knows. Coverage is prefix-aware and attribution is exact-match only, because a directory-wide scope makes ownership unarbitrable. (Hour #26.)'
