simplifications:
- '2026-07-29 REGISTERED into the map (worker tick) from docs/design/BACKLOG.md item B8 on the director''s from_rich_20260729_173731 instruction (full quote + no-blocked_on rationale in B3''s note). SPLIT RECONCILED BEFORE MINTING: B8 has a WORLD half and a COMPANY half, and the world half is ALREADY REGISTERED as W2_14_continuous_behavioural_engagement_model (loop_stage: discover, L0/1 -- the latent distributed propensity replacing the three discrete bins). What was missing is this COMPANY half: the estimator that infers price-sensitivity from observed responses, the holdout that proves the treatment, and the misclassification cost. Registering only the missing half avoids the B9=E5 duplicate trap. THE WALL IS THE WHOLE POINT and is the R15-failable control: the company may read only what it observed (offer shown -> response, conversation -> outcome, price change -> switch) and may NEVER read W2_14''s latent propensity -- a mutation that reads the true latent must turn the wall test RED. DoD (BACKLOG B8): engagement is continuous; the company estimates price-sensitivity from observed responses only; a holdout group exists and measured uplift is reported so a treatment claim is proven, not asserted; misclassification cost is modelled. R12: measured uplift is a diagnostic; a treatment is not tuned to make uplift look better. No BUILD code, level_current 0.'
- '2026-07-29 DISCOVER (0->1) + FRAME (1->2) DONE on a lane-3 idle fork, no BUILD code, level HELD at 0. FRAME artefact: docs/design/B8_DISCOVERED_PRICE_SENSITIVITY_FRAME.md (evidence-listed, so the atom now reads FRAME-saturated to supervisor._atom_has_frame_doc and leaves the idle re-draw pool). DISCOVER, verified against disk this tick (R7), claims labelled observed/inferred (R9): (1) every price-sensitivity number the company holds today is an ASSERTED constant, never estimated -- company/pricing/price_elasticity.py:16-20 (_PRICE_ELASTICITY_BY_SEGMENT), company/crm/churn_model.py:50-57,80 (RATE_SENSITIVITY family), and saas/home_move_win_rate.py:47-55 where sensitivity is a pure lookup on the EPC band. The EPC table is NOT a wall breach (EPC is a public register and the module imports nothing from sim/) but it is sensitivity-by-tag, the exact shape this atom abolishes. (2) NO live wall breach found: no company/ or saas/ module imports simulation.nudge_physics / willingness_classification / conversation_response. The one seam-shaped risk is simulation/run_phase2b.py:1163-1172, where the SIM resolves engagement_level_for_customer and passes the derived float INTO company.crm.churn_model.is_active_renewal -- the company module stays import-clean, so a wall test that only checks IMPORTS is fail-open against this VALUE path; the FRAME therefore requires an identical-observations-identical-estimate leg to close it. (3) THE GAP, three parts: (a) company/analytics/nudge_discovery.py:42-68 measures lift between TWO TREATED arms (loss_framed vs gain_framed) because it skips every log entry whose outcome is not retained/churned_despite_offer -- there is no untreated arm, so the company can say WHICH framing is better and CANNOT say whether the campaign did anything at all; (b) simulation/run_phase2b.py:1453-1464 appends no_offer_churn_log only inside the CHURNED branch, so no-offer customers who STAYED are never recorded and an untreated denominator is not computable at all; (c) offers are gated on the churn estimate itself (run_phase2b.py:212-223 RETENTION_TIERS, :1146 below_threshold, :1301 uneconomical), so untreated == low predicted churn and any observational comparison is confounded by the very variable used to assign treatment -- which is WHY the fix must be a RANDOMISED holdout, not a smarter control. Consequence: company/analytics/counterfactual_retention.py:17 ASSUMED_EFFECTIVENESS_PER_DISCOUNT_POINT = 0.04 is the entire basis of the published value-of-retention and is checked against nothing measured; company/crm/customer_retention.py:78-81 books the full margin as saved (uplift assumed = 1.0), though CustomerRetentionBook currently has no non-test caller in the live tree. FRAME: observable-only path (the offer the company chose + the response + its own price move + PUBLIC attributes as PRIORS only) behind a new typed price_offer_seam modelled on interface/contracts/conversation_seam.py including a FORBIDDEN_TRUTH_FIELDS tuple; estimator = the proven company/comms/susceptibility_estimator.py pattern with PRICE as the lever, distribution-valued and shrunk toward a segment posterior because one renewal per customer per year is desperately thin data. HOLDOUT randomised WITHIN the eligible set AFTER the threshold (holding out before it reproduces defect (c)) from its own named seeded substream B8_holdout::assignment (C-S2, the population_draw.py:143 substream pattern), with the power arithmetic stated so BUILD cannot skip it -- roughly 250/arm for a 10pp effect, 1000/arm for 5pp, 6300/arm for 2pp, so a 2pp effect is NOT detectable in a single campaign and underpowered/no-claim must be a first-class verdict; the holdout cost is booked and published as deliberate lost margin, because the point is that the company can see what it paid for the knowledge. MISCLASSIFICATION COST is asymmetric and signed: false-sensitive = a discount given to someone who would have stayed anyway (high frequency, low severity, and INVISIBLE without a holdout because it looks like a retention success); false-insensitive = lost remaining CLV + reacquisition CAC (low frequency, high severity). R_B8 is derived from the company own CLV/CAC rather than declared, inferred to land around 5:1-15:1 -- the same order and the same structural reason as the C9 ability-axis 8:1 -- scored through background/gap_metric.py::harm_cost normalised to a no-skill baseline. A Consumer-Duty rider is MANDATORY not optional: insensitive correlates with disengaged correlates with vulnerable, so a model that learns do-not-discount-the-disengaged is learning to charge the vulnerable more (nudge_discovery.assess_framing_consumer_duty:71 is the existing precedent). TRIAD: SIM (W2_14) must supply a continuous, state-dependent latent that actually MOVES with price, behind the wall in its own substream, on no seam payload; COMPANY discovers it from observed responses only and is ALLOWED to be wrong; HARNESS = a new tools/couple_w2_14_b8.py in the W2_7/C9 family (in tools/ so the epistemic verifier does not scan it), reporting belief_gap (gap_metric.py:295), the R_B8-weighted misclassification harm, and uplift_honesty -- whether the company PUBLISHED uplift bracket contains the TRUE uplift, which only the harness can compute, so a confident number outside the true bracket scores badly even when it flatters the company. R15 for when BUILD opens, three controls each with its named defect and a concrete mutation that must go RED: WALL (mutation = read the true latent, including laundered through a caller-supplied float -- the identical-observations-identical-estimate leg must fire, since the import-only leg is fail-open against that path); HOLDOUT (mutations = assign before the eligibility threshold so the arm-balance check fires; set h=0 and still return an uplift so the empty-arm guard fires, the FAIL-OPEN killer pattern; swap the named substream for a shared/global RNG so the C-S2 isolation test fires); UPLIFT CLAIM (mutation = return the raw rate difference with ci_low/ci_high/n set to None, which must FIRE on missing rather than pass through, plus a TAUTOLOGY leg where the significance verdict is derived from the same difference it judges). R12 held throughout: measured uplift is a DIAGNOSTIC -- the treatment is never tuned to make uplift look better, the holdout fraction is never shrunk because the number came out badly, and no campaign is re-cut post-hoc to find a segment where the effect happens to be significant. R15 independence: the harness observable-generation model and the estimator must be parameterised independently or the gap is a tautology that measures nothing. LEVEL DELIBERATELY HELD AT 0: the L1 bar is built in any form and L2 is mechanically real AND mutation-tested (MATURITY_MAP.md:49-52), and NOTHING is built here (BUILD is epoch-gated and this fork wrote no code), so claiming a level for analysis alone would be unearned. Saturation via the FRAME artefact, not a level bump, is what correctly stops the re-draw -- the same disposition H29_import_time_env_capture_test_isolation took on 2026-07-29.'
- '2026-10-07 L1 (BUILD, the offer half). simulation/coin_drawn_decision_set.py draws households, asks the world each one''s P(stay) at the default and at the default minus a cut (the probe''s question), and flips a seeded coin per renewal on the frame''s substream B8_holdout::assignment; the company reads the allow-listed projection (sim_interface.holdout_decision_observations) and discovered_price_sensitivity.estimate_offer_effect. NAMED SIMPLIFICATIONS of the lean history, each thinner than settlement: electricity only and flat EAC/365 per day (no gas leg in the felt bill, no season); competitor ledger, wholesale forward, satisfaction, passive cap and debt objection held at the world''s neutral; wholesale_cost_gbp carried as 0.0 (a control proves it reaches no departure term). The offer is a RATE cut only; the run loop''s unsourced RETENTION_EFFECTIVENESS route is not used. L2 needs the effect learned per payment channel and a misclassification cost; record: docs/staging/records/WORKER_RESULT_B8_THE_COMPANY_LEARNS_A_RETENTION_OFFERS_EFFECT_FROM_A_COIN_DRAWN_HOLDOUT_2026-10-07.md'
- '2026-10-08 L2 (the company USES the estimate). discovered_price_sensitivity.retention_cut_decision offers the cut only where the holdout interval raises staying and the learned effect, priced at a NAMED margin share of the household''s own bills over 1+s/(1-s) years, pays for the cut on its billed kWh (billed_kwh now crosses the seam). Per-channel read only where the arm reaches the pooled effect''s 80%-power count, else pooled. Graded on fresh seeds against cut-for-all/cut-for-none at the two published margin ends (0.019 EBIT allowance, 0.14 gross): at GBP 7.5/MWh it cuts for nobody, equals none, beats all by GBP 9-11.5/decision; planted +0.10 cuts 93% at 0.14. NAMED SIMPLIFICATIONS: the margin share is a bracket, not a figure (how much opex leaves with a customer is a practitioner question); tenure is a constant held-out stay share, undiscounted, with no re-acquisition cost; the drawn population carries two channels (direct_debit, other), not three; no run-loop retention path reads the decision yet (L3). Record: docs/staging/SEAT_FINDING_B8_THE_LEARNED_OFFER_EFFECT_DECIDES_AND_AT_THIS_CUT_IT_PICKS_THE_RIGHT_FLAT_RULE_NOT_A_BETTER_ONE_2026-10-08.md'
- '2026-10-08 L2 over a CURVE of cut sizes (2.5, 5, 7.5, 15, 30 GBP/MWh): the learned decision cuts for nobody at every size and both margin ends. The world''s stay bought per GBP/MWh FALLS with the cut (0.00166 at 2.5 to 0.00123 at 30) while the cost is linear, so the best true/break-even ratio is at the smallest cut and is 0.27 at 0.14 margin: no uniform renewal cut pays in this world. An offer needs ~0.006 of P(stay) per GBP/MWh at 0.14. NAMED SIMPLIFICATION: every renewal is offered blind; a save offer to a household observed leaving (low p0) is not modelled, and is with the director. Record: docs/staging/records/SEAT_FINDING_B8_NO_CUT_SIZE_PAYS_IN_THIS_WORLD_BECAUSE_THE_STAY_BOUGHT_PER_POUND_FALLS_AS_THE_CUT_GROWS_2026-10-08.md'
