atom_id: H38_the_behavioural_stream_still_carries_the_water_heater
map_notes:
  origin_note: 'MINTED FROM the first of the two findings in the H36 section of docs/design/BAND_NULL_SWEEP.md (2026-08-10), which H36 named and deliberately did not fold in. OBSERVED-WITH-EVIDENCE on the live generator, on the drawn 60-home population the ledger''s judged verdict comes from (not the panel): one home in sixty sits under the floor, P0008 at 0.1423. Decomposed, whole meter / net of space heat / net of BOTH machines, with water heat as a share of what the cell then calls behaviour -- P0008 resistive 0.1382 / 0.1423 / 0.2048 (0.403); P0020 resistive 0.1228 / 0.1526 / 0.2177 (0.357); P0033 storage 0.0378 / 0.1653 / 0.2434 (0.387). THE CAUSE: the same wrong-load-set shape one level in. Taking the space heater out leaves the WATER heater, 36-40% of the remainder, and it is a MACHINE rather than an appliance event -- a large regular draw that lifts the MEAN while the MEDIAN step barely moves, which is exactly the numerator/denominator argument that forced the space-heat netting in the first place. DISPOSITION: REPAIR THE STATISTIC. The floor was NOT moved, P0008 was NOT excluded and no cell was marked UNVALIDATED -- each would go green in one edit while making the measurement worse. Until it lands the cell reports FAIL, which is the correct reading of a control asking a home about a machine. Held red by test_the_L1_1_BREACH_is_the_WATER_HEATER_in_the_denominator.'
  build_note: 'BUILT L0 -> L2 (2026-08-10). WHAT CHANGED: machine_draw composes space + water heat into the ONE stream the L1 cells net out; meter_net_of_space_heat -> meter_net_of_machines and the space_heat= kwarg -> machines=; PopulationTraces gains water_heat_grids, filled from the trace''s own dhw_fuel_kwh. THE FAIL-OPEN QUESTION CAME FIRST, because it changes what the repair must prove: it is NOT one. Replace a home''s behaviour with its own flat daily mean, leave both machines standing, and the cell fires under BOTH readings (texture 0.0000 either way) -- three 12-minute draws a day move six steps in 47 and this numerator is a MEDIAN. The water heater was never supplying texture, it was supplying DENOMINATOR: ~38% more mean, against a floor derived where it was absent. Absent where: the 0.15 anchor reasons from a gas-heated home''s ELECTRICITY meter, and a gas-heated home heats its water with gas, so the anchor population never carried this load at all. MEASURED in H36''s unit (how much of its own behaviour a home must lose before the cell fires), drawn 60, base_seed=17, real Open-Meteo 2022-01-01..2022-04-30, net of space heat -> net of BOTH: 57 gas homes median 0.3066 -> 0.3066 IDENTICAL; P0008 0.0000 -> 0.2721; P0020 0.0168 -> 0.3119; P0033 0.0914 -> 0.3892. An electrically heated home was firing at 1.7% breakage where a gas home needed 31% -- an 18x gap -- and P0008 was already under the floor with nothing done to it. THE GAS COLUMN IS THE CONTROL AND COULD NOT HAVE BEEN TUNED TOWARD: bit-for-bit identical under both readings, because a gas home''s cylinder is on the other meter; asserted both ways by test_the_WATER_HEATER_netting_is_a_LOAD_SET_repair_and_not_a_LOOSENING. HONEST ABOUT THE DIRECTION: unlike the space-heat netting this is NOT a strengthening -- every affected reading moves UP (0.1423 -> 0.2048) and the affected homes get easier to pass. The claim is parity with the population whose meters derived the floor, measured not argued. R12 holds: the floor is still 0.15. ALL THREE L1 CELLS, measured rather than assumed, because H36''s invariant is that the behavioural stream is computed ONCE -- L1.2 shape correlation 0.2104/0.4386/0 -> 0.2143/0.4386/0 (no material change); L1.3 away detection 849 detected / 8 false pos / recall 1.000 -> 849 / 0 / 1.000 (strictly better). L1.3 was the surprise and the mechanism is H37''s one machine over: the away signature DIVIDES BY the 00:00-06:00 base-load window and an early riser draws hot water inside it (day 68 on P0008: 1.674 kWh in the base window, 0.000 in the active window, ratio 4.17 -> 1.15 under the 1.30 threshold, on a day nobody left; all 8 false positives are that shape). Recall does not move because a water heater draws nothing on an away day. RESULT: L1.1 on the drawn 60 is 0 of 60 violating, verdict PASS, and the worst home is now P0036, a GAS home, at 0.1521 -- the tell that this was a load-set repair is that the marginal home afterwards is one the netting is the identity on. A PREDICTION PAID OFF ON A ROW H36 LEFT RED: H36 recorded ED1 the panel heater at 0.1313 and said its whole deficit was the water heater; ED1 now reads 0.2050. band_null_sweep.py still exits 0, L1.1 margin +0.0334 -> +0.0550 against a null spread 0.0763 -> 0.0558, margin-to-spread 0.44 -> 0.99, verdict still same_order. H39 IS NOT CLOSED by this -- the band still sits inside its own null''s spread; that is a separate defect with a separate repair and this only moved its numbers. NOT DONE: floor unmoved, nobody excluded, netting NOT claimed complete (EV charging is also on the judged meter of some homes and nothing here measured it -- the drawn 60 has no EV home under the floor, which is an absence of evidence and not a clearance). Also corrected: PremiseDayTrace.behavioural_electricity_kwh''s docstring claimed to include electric DHW and never did (P0008: meter 17.8475 = behavioural 9.8144 + dhw 6.2700 + space heat 1.7630, exactly). Full section: the H38 heading in docs/design/BAND_NULL_SWEEP.md.'
  name: MINTED FROM the first finding in the H36 section of docs/design/BAND_NULL_SWEEP.md (2026-08-10), which carries the per-home decomposition (P0008 0.1423 -> 0.2048, P0020 0.1526 -> 0.2177, P0033 0.1653 -> 0.2434) and the open FAIL it dispositions.
