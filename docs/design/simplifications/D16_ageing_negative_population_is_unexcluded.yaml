atom_id: D16_ageing_negative_population_is_unexcluded
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). THE ATOM OFFERED TWO REMEDIES -- carry D11''s exclusion across, OR declare in the published note which figure a reader should take -- and the honest answer needed BOTH, because doing only the first does not make the two numbers one number. (1) THE DENOMINATOR. `never_flaggable` is now built ONCE, above the scoring loop, and read by both dimensions; the ageing dimension takes it as an `excluded` mask exactly the way `detection_measures` takes its band, and `ageing_gap` RAISES if any case is excluded without an `exclusion_reason` (D10: published, not silent). MEASURED, not argued: the two denominators are now the IDENTICAL CASE SET, not merely the same size -- 782/782 at seed 7 (was 1062 vs 782), 776/776 at seed 11, 755/755 at seed 23, and at grace windows 5 and 12. R12: the ageing overstatement moved 0.0951 -> 0.0090 because the band moved, not because anything was fitted -- the detection figure is byte-identical at 0.0134 and no company behaviour changed. (2) THE OPEN QUESTION THE ATOM SAID NOT TO DODGE -- the belief sides differ (EVER-FLAGGED 439 vs the as_of snapshot 229) -- IS SETTLED AND THE ANSWER IS THAT THEY SHOULD: they are two questions. Wrongful dunning is an EVENT (a customer chased in month one was still chased when the report drops it in month three), so EVER-CHASED is right for it; the ageing report''s overstatement is a fact about the report TODAY, which is what a provision or a board pack is built from, so the `as_of` snapshot is right for that. Aligning the belief sides too would have destroyed one measure to manufacture agreement between two numbers -- the goal-seek R12 forbids. So the DENOMINATORS align and the NAME does not: `overstated_arrears_rate` is renamed at every site to the AGEING-REPORT OVERSTATEMENT, and the wrongful-dunning exposure has exactly one publisher. The `DIMENSION_AS_OF_CONTRACT` ageing exemption asked about in the origin_note IS broader than its justification, and that is now recorded in the register rather than left as the comfortable reading: `belief_side_is_as_of_dependent: True` narrows what the exemption excuses to the truth side. (3) THE RESIDUAL IS MEASURED, NOT ASSERTED: ageing''s numerator is a STRICT SUBSET of detection''s at seeds 7/11/23 and both grace windows (7 of 21, 16 of 31, 5 of 13) -- every case the report still overstates was chased, and 14/15/8 more were chased and then dropped before as_of. R15, and the register was REWRITTEN rather than loosened: the pre-D16 declaration was deliberately exact so this atom would break it, and it did. The new one is exact too (identical sets AND strict subset) and is proven falsifiable on THREE register lies (declare the populations divergent; declare the numerators identical; declare the subset in the wrong direction), plus a vacuity guard so an empty ageing numerator cannot satisfy the subset for free. The band itself is mutation-proven both ways the atom demanded: fold it back into the denominator and the rate MUST move (0.0090 -> 0.0951), and a record whose `days_late` truth is blanked must LEAVE the scored population rather than be assumed paid on time. The phrase sweep learned the lesson its own predecessor was written about: a bare substring counted the honest sentence ''NOT the wrongful-dunning exposure'' as publishing it (it did, on this build''s first run -- the AO2 `none` shape), so the disclaimer''s FORM is registered and doublespeak is proven not to buy an exemption. THE SIBLING HALF WAS NOT LEFT BEHIND THIS TIME: `background/live_payment_triad.py` labelled the same rate ''the WRONGFUL-DUNNING exposure'' in both its attributed-measures register and its rendered summary, one file over, and both are corrected under a test that the LIVE ageing dimension carries the band. FOUND AND QUEUED, NOT FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE): `D17_d8_counterfactual_has_no_unattributed_residual` -- the D8 remittance counterfactual''s anti-rubber-stamp guard rested on a residual composed entirely of the cases D16 excludes, so every measure it publishes is now 100% attributed and the guard guards nothing. The refuted test is REPLACED (never repaired) and names D17 in its own docstring so it cannot decay into an assumption. 694 tests green across every file touching gap_metric, the triad, or the live path. L3 NOT claimed: no Expert-Hour pass on the corrected instrument, and the tick that renames a published quantity is not the tick to certify it.'
  origin_note: 'Minted 2026-08-09 by the H27 Expert-Hour pass, NOT fixed on sight (SELF_INTERRUPT_DISCIPLINE + R12: aligning the populations MOVES a published number, 0.0951 -> something, and a tick that fixes a metric it has just been measuring is the goal-seek this repo keeps catching). It is now H27''s SOLE remaining reason for holding at L2, so it has an id the draw can see -- an unblockable reason living only in prose is how a hold outlives its cause (the lesson D10 was minted on, and D11 after it). WHAT IS ALREADY DONE AND MUST NOT BE REDONE: the false identity claim in `background/gap_metric.py` (''literally the same numerator'') is CORRECTED with the case-level decomposition; `SHARED_QUANTITY_CONTRACT` + its control in tests/tools/test_couple_w2_11_d5.py now MEASURE the declared relationship against a real scored run and sweep the rendered summaries so a third dimension printing the phrase unregistered fails. The containment is declared EXACT (ageing_denominator == detection_denominator + detection_n_excluded) precisely so THIS atom landing BREAKS the declaration and forces it to be rewritten -- that is intended, not a regression. THE SHAPE IS KNOWN, do not re-derive it: copy D11''s `never_flaggable` construction (success AND days_late <= reconciliation_grace), pass the excluded band to `ageing_gap` the way `detection_measures` takes it, count it, and make the reason travel in the components (D10''s published-not-silent rule). R12 WALL: the alignment may NOT be chosen for producing a nicer number -- it will lower the ageing figure, which is exactly why the criterion is the EXCLUSION RULE''s correctness and not the value. R15: the mutation must prove the new exclusion is not a no-op -- folding the excluded band back into the denominator must move the rate -- and must prove it cannot fail open on a record with no days_late truth. THE OPEN QUESTION IT MUST ANSWER, not dodge: the two belief sides also differ (detection is EVER-FLAGGED, 439 cases; ageing is the `as_of` snapshot, 229). Aligning only the denominators leaves the numerators measuring different companies. Ageing is EXEMPT in DIMENSION_AS_OF_CONTRACT for a stated reason -- ''an invoice really does age'' -- which justifies the TRUTH side moving and says nothing about the BELIEF side un-flagging; whether that exemption is broader than its justification is this atom''s to settle.'
  name: 'The W2_11<->D5 triad publishes ''the wrongful-dunning exposure'' TWICE, from two dimensions, as two numbers 3.5x apart: detection''s false_flag_rate 0.0269 (21 of 782) and ageing''s overstated_arrears_rate 0.0951 (101 of 1062), sharing SEVEN cases. D11 established that an invoice paid past its grace date genuinely WAS unpaid past grace, so a flag on it was CORRECT, and excluded those cases from the detection denominators -- and that rule was applied to the detection dimension ONLY. Ageing carries no exclusion band at all, so 94 of its 101 false ageings land on cases the sibling dimension of the same instrument holds the company was RIGHT about. Carry D11''s exclusion across to the ageing dimension, or declare in the published note which of the two a reader should take as the company''s exposure.'
