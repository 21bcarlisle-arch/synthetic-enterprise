map_notes:
  gain: 'Director, 2026-08-28 (P9): ''Book depth bounds every comparison. Only 37 accounts carry five or more renewals, so nothing can compound. Book age moves the P&L, which makes it curriculum and therefore the director''s -- flagged, not delegated.'' RETURNED, NOT DECIDED, as WORK THIS CREATES item 4 requires. This atom exists to carry the COST of each option to him and to hold the decision, not to take it: R13 is explicit that difficulty changes are named, versioned, director-authored artefacts and never adjusted by the agent in response to company outcomes, and the agent controls both sides of that wall. What the seat owes him is the priced menu -- how many renewals each option buys, what it costs in wall-clock against the 30-minute publish cadence that binds SETTLEMENT_CUSTOMER_YEAR_BUDGET, and which comparisons stay bounded until it lands.'
