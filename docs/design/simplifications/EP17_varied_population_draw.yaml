atom_id: EP17_varied_population_draw
map_notes:
  origin_note: 'C-S2 RNG substream discipline is load-bearing rather than advisory here: if the population draw shares a stream with anything else, adding one customer shifts every other subsystem''s outputs and cross-run comparison becomes meaningless -- which would silently destroy the tournament this atom exists to enable. The draw must be its own named seeded substream, and that must be tested, not assumed. Duplicate-risk check done at mint: W2_2_population_draw covers the single-run draw, not run-to-run variation.'
