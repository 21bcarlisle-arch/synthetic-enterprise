atom_id: D33_the_collapse_predicate_is_bit_equality
simplifications:
- "2026-08-12 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD\ncode written and nothing in `file_scope` touched: this atom is `loop_stage: idle`, and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom\nwhile BUILD is not. Output is this record.\n\nFIRST, WHAT IS ALREADY LANDED — READ OFF HEAD, NOT OFF THE ATOM'S PROSE. This atom's\n`name` was written as a spin-out of H27 Expert Hour #15 and describes a reshape in the\nfuture tense. Checked against HEAD, a substantial part of it is already shipped, and\nunder this atom's own id: `measure_published_resolution_floor`'s docstring opens \"THE\nSMALLEST COMPANY ERROR EACH PUBLISHED FIGURE ACTUALLY RESOLVES, per dimension, measured\nthrough its own shipped scorer (**atom D33**)\", and it already returns\n`bit_equality_floor_days` beside the readable `floor_days` — i.e. the divergence this\natom is named for is already MEASURED and already REPORTED. `own_readable_resolution_floor_days`\nis stamped at 310 (line 4146) and 314 (line 4254). Successor atoms D34/D36/D37 have since\ntaken the per-figure precision further. The parked atom is therefore NOT unstarted, and\ndesigning it as if it were would rebuild shipped work — the filed\n`a parked atom's work may be landed under an id the map never carried` class, here in its\nmilder form (the id matches; only the map's level does not).\n\nSO THE RESIDUE IS NARROWER THAN THE `name` SAYS, AND IT IS EXACTLY THE PREDICATE.\nWhat was fixed under Hour #15 is what the two BELIEF figures ADMIT about themselves. What\nwas not touched is the derivation that produces every declared edge in the first place:\n\n    # tools/couple_w2_11_d5.py::_measure_collapse_runs, line 4431\n    groups.setdefault(tuple(repr(reading(s, k)) for s in seeds), []).append(k)\n\n`repr()` on a float is exact. Two counterfactual companies are \"told apart\" whenever their\nreadings differ in the last representable bit, at a magnitude where that bit is nowhere\nnear anything a reader is shown.\n\nMEASURED THIS TICK, `observed-with-evidence`, by calling the real `_measure_collapse_runs`\n— no scenario built, no sweep run, no organ invoked:\n\n    base = 0.0123                 # a rate-shaped reading; ULP here is 1.7347e-18\n    alt  = base + 1.4e-17\n    repr(base) != repr(alt)   ->  True      <- what the predicate sees\n    f\"{base:.4f}\" != f\"{alt:.4f}\" ->  False <- what the reader sees\n    _measure_collapse_runs({7: {\"baseline\": base,\n                                \"by_drift\": {-1: alt, -2: base}}},\n                           [0, -1, -2], [7])[\"collapsed_runs\"]\n      ->  ((-2, 0),)\n\nDrifts 0 and -2 collapse; drift -1 is recorded as RESOLVED on a difference the published\nfigure cannot express. That is the atom's claim, reproduced on the shipped function.\n\nA CORRECTION TO THE FIRST ATTEMPT, recorded because it is the honest shape of the\nmeasurement: the same demonstration at `base = 0.5` shows NOTHING — 1.4e-17 is below the\nULP of 0.5 (1.11e-16), so the two floats are identical and the predicate correctly\ncollapses them. The defect is therefore MAGNITUDE-DEPENDENT: it appears only where the\nreading's own ULP is far finer than its reader's step. Any exit test for this atom that\nfixes a single magnitude will pass or fail for reasons unrelated to the predicate.\n\nTHE BLAST RADIUS, counted rather than estimated — every declared edge derived by this\npredicate, across both registers at HEAD:\n\n    register                     dims  collapsed_runs  collapsed_pairs  sat_below  sat_above  total\n    ORGAN_QUERY_GRID                2              17                3          2          1     23\n    DIMENSION_DRIFT_RESOLUTION      5               8                0          2          1     11\n    TOTAL                           7              25                3          4          2     34\n\n34 declared edges. R12/R13 note, carried forward from Hour #15 and still true: these are\nDECLARED EDGES, not published figures. Moving them changes what the instrument says about\nits own resolution; it does not move the detection gap, the latency mean or either belief\nfigure.\n\nTHE FRAME — AND THE THING THAT SPLITS THIS ATOM IN TWO. Re-deriving an edge \"at the\nprecision the reader is actually given\" requires knowing that precision. D34 already built\nthat lookup (`published_reading_epsilon`). Asked of all seven dimensions this tick:\n\n    ageing                       0.0005          (3dp reader)\n    detection                    5e-05\n    detection_latency            0.005           (2dp reader)\n    belief                       5e-05\n    belief_population_mix        5e-05\n    recon_lag_days               AssertionError — no entry in PUBLISHED_GAP_CONSUMERS\n    flagged_via_reconciliation   AssertionError — no entry in PUBLISHED_GAP_CONSUMERS\n\nTwo findings in one table.\n\n  * The five `DIMENSION_DRIFT_RESOLUTION` dimensions are READY NOW. Their epsilons vary by\n    100x (0.005 to 5e-05), which is itself the reason a single re-derivation pass cannot use\n    one tolerance — D34's own defect, one register over.\n  * The two `ORGAN_QUERY_GRID` dimensions are NOT, and they carry **23 of the 34 edges** —\n    the majority. `published_reading_epsilon` REFUSES them (correctly, fail-closed: an\n    unknown reader precision is not a default). So for two thirds of this atom's declared\n    edges, \"the precision the reader is actually given\" is currently UNKNOWABLE from the\n    repo, and the reshape cannot be specified, let alone tested.\n\nWHICH MAKES THE HONEST ANSWER TO PART OF THIS ATOM \"THE PREDICATE MAY ALREADY BE RIGHT\nTHERE\". If `recon_lag_days` and `flagged_via_reconciliation` have no published consumer at\nall, then they have no reader precision, and bit-equality is not a defect on them — it is\nthe only predicate with a defined meaning. Re-deriving those 23 edges at an invented\nprecision would be strictly worse than leaving them: it would replace an exact statement\nwith a tolerance nobody's reader corresponds to. This is the `fit the rate to the amount`\ndiscipline applied to a predicate.\n\nTHE DEPENDENCY THIS ADDS. The atom currently declares `depends_on:\n[D32_the_latency_headline_cannot_attribute_its_two_knobs]`. On the evidence above it also\ndepends, for its larger half, on the two ORGAN_QUERY_GRID dimensions acquiring a\n`PUBLISHED_GAP_CONSUMERS` entry — or on a recorded finding that they have no published\nconsumer, which resolves those 23 edges to \"bit-equality is correct here\" and shrinks the\natom to the 11 edges that are ready. That question is answerable by DISCOVER (a grep of the\nrender/door surfaces for these two dimensions) and is the cheapest next move on this atom.\nIt is NOT answered here: this tick's draw was the H_harness BLOCKING rung, and reading two\nmore render surfaces properly is its own pass.\n\nWHAT AN EXIT TEST MUST NOT BE, from the two traps above:\n  * not a single-magnitude fixture (the defect is magnitude-dependent; a fixture at 0.5\n    passes under the unfixed predicate);\n  * not one tolerance across dimensions (their epsilons differ by 100x, and a house default\n    is D34's own filed defect);\n  * and R15 both ways on the split: a dimension WITH a known reader precision whose edges\n    move must be shown to move, and a dimension WITHOUT one must be shown to be REFUSED\n    rather than silently re-derived at a default.\n\nSTATUS: FRAME only. `level_current` unchanged at 0, `loop_stage` unchanged at `idle`,\n`provenance` unchanged at `proposal`. Nothing in `file_scope` was written."
- "2026-08-13 DISCOVER ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched — `loop_stage: idle`, so\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 permits DISCOVER/FRAME and not BUILD. This pass\ntakes the CHEAPEST NEXT MOVE the 2026-08-12 frame nominated for itself and left open:\n*\"whether the two ORGAN_QUERY_GRID dimensions have a published consumer at all … a grep of\nthe render/door surfaces … is the cheapest next move on this atom. It is NOT answered\nhere.\"* It is answered here, and the answer INVERTS the previous frame's split.\n\nTHE PREVIOUS FRAME ASKED THE WRONG SUBJECT, and its own table records the refusal that\nshould have said so. It called `published_reading_epsilon(\"recon_lag_days\")` and\n`published_reading_epsilon(\"flagged_via_reconciliation\")`, got `AssertionError — no entry\nin PUBLISHED_GAP_CONSUMERS` for both, and read that as *\"for two thirds of this atom's\ndeclared edges the reader precision is UNKNOWABLE from the repo\"*. But those two strings\nare not dimension names — they are GRID KEYS, and `PUBLISHED_GAP_CONSUMERS` is keyed by\nPUBLISHED DIMENSION. The refusal was correct and fail-closed; the inference from it was\nnot. **The register already states the contract**, one field over:\n\n    # tools/couple_w2_11_d5.py::measure_organ_query_grid, `_read`\n    dim = result[str(entry[\"feeds\"])]\n    key = entry[\"headline_key\"]\n    return dim.gap if key is None else dim.components[str(key)]\n\n`feeds` names the published dimension the reading rides on, and `headline_key` says\nwhether the reading IS that dimension's own gap or a COMPONENT of it. Asked that way,\nmeasured at HEAD:\n\n    grid key                     feeds              headline_key                       edges  reader epsilon\n    flagged_via_reconciliation   detection          None -> the dimension's OWN gap        20  5e-05  (4dp)\n    recon_lag_days               detection_latency  mean_lag_days_without_dd_channel        3  NONE — see below\n\nSo 20 of the 23 ORGAN_QUERY_GRID edges — the \"unknowable\" majority — read a PUBLISHED\nfigure whose reader precision has been known since D34. They are READY NOW, on the same\nfooting as the DIMENSION_DRIFT_RESOLUTION entries. The previous frame's \"23 blocked, 11\nready\" is really **31 ready, 3 blocked**, and the dependency it proposed adding (both grid\ndimensions acquiring a `PUBLISHED_GAP_CONSUMERS` entry) is wrong for 20 of the 23: giving\n`flagged_via_reconciliation` its own entry would be a SECOND declaration of `detection`'s\nreader precision, which is the drift shape D34 was built to remove.\n\nTHE THREE THAT ARE GENUINELY BLOCKED, and the negative result is the finding.\n`recon_lag_days` reads `detection_latency.components[\"mean_lag_days_without_dd_channel\"]`\n— the DD-channel-deleted counterfactual arm, which is D32's whole subject. Searched at\nHEAD for any consumer that renders it: **zero** hits across `background/`, `saas/`,\n`company/`, `simulation/`, `sim/` and `site/` `.py`; the only occurrences anywhere in the\npublished site data (`site/data/proof.json`, `site/data/simplified.json`) are inside the\nPROSE of the atom records that discuss it — a figure quoted in a record about itself is\nnot a figure with a reader. `observed-with-evidence`.\n\nWHICH MAKES BIT-EQUALITY CORRECT ON THOSE THREE, not defective — the same conclusion the\nprevious frame reached for the wrong population. A reading no consumer renders has no\nreader step, so re-deriving its edges at an invented tolerance would replace an exact\nstatement with a precision nobody's reader corresponds to. The residue on those three is\ntherefore NOT \"re-derive at 2dp\"; it is one of: (a) leave them exact and SAY SO in the\nregister (an edge derived by bit-equality on an unpublished reading is a declared property\nof the instrument, not a defect), or (b) if D32's reshape gives the sub-reading a reader,\nit acquires a step then and the edges are re-derived with it. That is a decision for D32's\nBUILD, not a debt this atom can discharge alone.\n\nA MEASUREMENT-HYGIENE CORRECTION, recorded because this tick's other draw was exactly this\nclass. The counts above are AT HEAD (23 + 11 = 34 declared edges, matching the previous\nframe's table). Counted against the WORKING TREE the same script says 45, because\n`tools/couple_w2_11_d5.py` is modified-uncommitted by another lane and its\nDIMENSION_DRIFT_RESOLUTION register has grown 11 -> 22 edges that no commit contains. Any\nblast-radius number for this atom must name its tree; the desk one is a third too big.\n\nWHAT THIS CHANGES FOR THE ATOM'S SHAPE. The 2026-08-12 frame's two traps still hold (the\ndefect is magnitude-dependent, so no single-magnitude fixture; epsilons differ by 100x, so\nno one tolerance). What changes is the split and the sequencing: 31 of 34 edges can be\nre-derived at their own reader's step without waiting on anything, and the remaining 3 are\nblocked on a QUESTION (does the sub-reading ever reach a reader?) whose answer today is NO\nand whose owner is D32. The R15 both-ways requirement is unchanged and now has a concrete\npopulation on each side: a dimension WITH a known reader precision whose edges move must be\nshown to move, and the `recon_lag_days` entry — which has none — must be shown to be\nREFUSED rather than silently re-derived at a default.\n\nSTATUS: DISCOVER only. `level_current` unchanged at 0, `loop_stage` unchanged at `idle`,\n`provenance` unchanged at `proposal`. Nothing in `file_scope` was written; the map is\ntouched only by `tools.merge_atom_status` keeping `simplifications_count` in sync."
- "2026-08-17 DISCOVER ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched -- `loop_stage: idle`, so\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 permits DISCOVER/FRAME and not BUILD. All figures\nbelow are AT HEAD 95cc1be06, with `tools/couple_w2_11_d5.py` and its test file both clean\nin the working tree (checked first, because the previous pass's headline number was\nwrong for exactly that reason).\n\nTHIS PASS ASKS THE QUESTION BOTH PRIOR PASSES ASSUMED THE ANSWER TO. 2026-08-12 counted\nthe blast radius and split it; 2026-08-13 re-split it 31/3. Neither ever asked whether\nswapping the predicate CHANGES A SINGLE DECLARED EDGE. The atom's `name` asserts it does\n(\"a real reshape with real blast radius -- it moves declared edges\"), on ONE witness. That\nis now measured across the whole declared population, and the answer inverts the atom.\n\nFIRST, THE RECOUNT, because the previous pass predicted this and its own number is stale.\n2026-08-13 recorded 34 declared edges at HEAD and warned that the desk tree said 45\nbecause another lane's uncommitted `DIMENSION_DRIFT_RESOLUTION` growth (11 -> 22) was in\nthe tree and in no commit. That work has since landed. Counted at HEAD today:\n\n    register                     runs  collapsed_pairs  saturation edges  = declared edges\n    ORGAN_QUERY_GRID               17                3                 3               23\n    DIMENSION_DRIFT_RESOLUTION     18                0                 4               22\n    TOTAL                                                                              45\n\nThe warning was right and the number it warned about is now the real one. AND THE COUNT\nWAS NEVER THE WHOLE POPULATION: the same predicate also decides `moved`/`unmoved`, which\nis what every `visible_drifts` / `invisible_drifts` declaration is checked against, and\n`distinct_pairs`. That is 13 visible + 2 invisible + 2 distinct pairs = 17 more\ndeclarations neither prior pass counted. **62 declarations, not 34.**\n\nThe band declarations matter more than the edges, and in the opposite direction. A\ncollapse edge derived by bit-equality is too far OUT (under-collapsing). A\n`visible_drifts` entry derived by bit-equality is a FAIL-OPEN in the R15 sense: a claim\nthat the instrument can see a company error, green on a difference the reader cannot see.\n\nTHE MEASUREMENT, `observed-with-evidence`, both dense sweeps, n=300, seeds 7/11/23,\nreproducible by re-deriving every adjacent grid pair and comparing |delta| against that\nfigure's OWN reader step from `published_reading_epsilon` (D34's per-figure lookup, keyed\nthrough `feeds` for the grid register per the 2026-08-13 correction):\n\n    reading                          eps   cmp  zero  0<d<eps  min ratio to eps\n    -- DIMENSION_DRIFT_RESOLUTION (organ_terms_drift_days), 109-point grid --\n    ageing                        0.0005   324   108        0            7.06x\n    belief                         5e-05   324   324        0              n/a\n    belief_population_mix          5e-05   324   324        0              n/a\n    detection                      5e-05   324   216        0           16.81x\n    detection_latency              0.005   319    13        1            0.22x\n    -- ORGAN_QUERY_GRID (reconciliation knob), 110-point grid --\n    flagged_via_reconciliation     5e-05   327   219        0           16.81x\n    recon_lag_days                   none  322     6        0    (min |d| = 1.0 day)\n\n2,264 pairwise comparisons. **Not one pair is distinct under bit-equality and identical to\nits reader on every seed.** Every difference the predicate calls movement is 7x to 17x the\nreader's step; every non-difference is exactly zero, not nearly zero. The entire\nsub-epsilon population is ONE comparison, on ONE seed:\n\n    detection_latency, drifts 15 -> 16, seed 23: |d| = 1.116e-03 against a 5e-03 step\n    readings 6.061947 and 6.063063 -- both published as 6.06\n\nand because the predicate requires bit-identity on EVERY seed, that single comparison\nmoves no declared edge either.\n\nSO THE RESHAPE THIS ATOM IS NAMED FOR WOULD MOVE ZERO OF THE 45 EDGES AND ZERO OF THE 17\nBANDS, on this book at HEAD. R12 in the sharper form: the previous passes were right that\nno published figure moves, and wrong that the declared edges do.\n\nWHY, AND IT IS STRUCTURAL RATHER THAN LUCKY. These readings are means and rates over an\ninteger-counted population, so their own smallest nonzero step is a population step, not a\nfloat step: 3.5e-3 on `ageing`, 8.4e-4 on `detection`, a whole day on `recon_lag_days`.\nThere is nothing in this module reading at a granularity BETWEEN float noise (1e-17) and\nthe reader's step. The atom's premise -- \"a 1.4e-17 difference counts as one counterfactual\ncompany being told apart from another\" -- is TRUE of the memory knob and FALSE of both\ndrift knobs, for that reason.\n\nAND THE MEMORY KNOB, WHERE IT IS TRUE, IS THE ONE THAT IS ALREADY FIXED.\n`measure_published_resolution_floor` returns `bit_equality_floor_days` beside the readable\n`floor_days`, per dimension (310 and 314), under this atom's own id. The atom's single\nwitness lives in the only sweep that already publishes both predicates side by side.\n\nA CONSEQUENCE FOR THE 08-13 SPLIT: the 3 \"blocked\" `recon_lag_days` edges are not blocked,\nthey are moot. That reading's own granularity is 1.0 DAY. No reader step short of a whole\nday could ever disagree with bit-equality on it, so the answer does not depend on whether\nthe sub-reading ever acquires a consumer, and the D32 dependency the 08-12 pass proposed\nadding is not needed to resolve them. 45 of 45, not 42 of 45.\n\nWHAT THE PRIOR PASSES MIS-SCOPED, AND IT IS THE REAL DEFECT LEFT HERE: THE PREDICATE IS\nIMPLEMENTED EIGHT TIMES AND IS TWO DIFFERENT PREDICATES. Both prior passes named one site,\n`_measure_collapse_runs`'s `repr()` at line 4617. At HEAD the same comparison is also made\nat 2315, 2316, 2331-2332, 3696, 4514-4515, 4639 and 4844-4846 -- seven of them raw float\n`==`/`!=`, one of them `repr()`. Those are NOT the same predicate, and the module's two\ncollapse derivations disagree on both degenerate float values, in OPPOSITE directions.\nReproduced live on the shipped functions, no scenario built:\n\n    readings (0.0, -0.0):  _measure_collapse_runs -> no collapsed run  (repr differs)\n                           _collapse_state        -> collapsed: True   (== is True)\n    readings (nan, nan):   _measure_collapse_runs -> collapsed run     (repr is equal)\n                           _collapse_state        -> collapsed: False,\n                                                     distinct_from_baseline: True\n\nThe NaN row is the worse one, and it walks straight through this module's own fail-open\nguard. `_measure_collapse_runs` carries `undefined_readings` precisely so that \"an\ninstrument that has stopped reading at all\" is not counted as resolution -- the D28\nfail-open -- but it tests for `None`, and NaN is not None. A dimension publishing NaN is\ntherefore recorded by one derivation as two companies collapsing, and by the other as two\ncompanies DISTINCT FROM BASELINE: the D28 fail-open, reachable through the one value the\nguard does not name.\n\nREACHABILITY, LABELLED HONESTLY. `GapResult` accepts `gap=nan` under all three\nnormalisation kinds, including one where the DECLARED divisor relation is violated\n(`raw_gap=nan, g0=1.0, gap=0.5` constructs) -- so the D44 declaration control is fail-open\non NaN too, and nothing between a scorer and this predicate would stop one. Whether any\nlive scorer in `background/gap_metric.py` actually produces a NaN gap is NOT measured here\nand is `inferred`, not observed. That is a finding against `background/gap_metric.py`,\noutside this atom's `file_scope`; per SELF-INTERRUPT DISCIPLINE it is QUEUED as\nWORKER_FINDING_A_NAN_GAP_DEFEATS_THE_UNDEFINED_READING_GUARD_2026-08-17.md and not fixed\non sight.\n\nWHAT THIS DOES TO THE ATOM. Its BUILD is no longer \"re-derive 45 edges at the reader's\nstep\" -- that pass would be 45 no-ops on this book, and shipping a tolerance where none is\nneeded would replace an exact statement with an invented one (`fit the rate to the\namount`). What is left, and it is smaller and sharper:\n\n  1. RECONCILE THE TWO PREDICATES. One derivation, used by all eight sites, so `repr()`\n     and `==` cannot disagree about whether two counterfactual companies are one company.\n  2. CLOSE THE GUARD ON NaN, not just `None` -- an instrument publishing NaN is an\n     instrument that has stopped reading, in both derivations.\n  3. GUARD THE MARGIN RATHER THAN RE-DERIVE THE EDGES. The agreement measured above is a\n     PROPERTY OF THIS BOOK, and on `detection_latency` the margin is already 0.22x. A\n     control that re-measures the sub-epsilon population and fails when a declared edge\n     starts resting on a difference its reader cannot see is worth more than a one-off\n     re-derivation, because it keeps being true after the book changes.\n\nEXIT-TEST CONSTRAINTS. The two carried forward still hold (the defect is\nmagnitude-dependent, so no single-magnitude fixture; epsilons differ by 100x, so no one\ntolerance). Two more from this pass: the reconciliation test must use BOTH degenerate\nvalues, because a fixture at (0.0, -0.0) passes under a NaN-only repair and vice versa;\nand the margin control must be able to fail -- R15 both ways -- on a book where a declared\nedge IS sub-epsilon, and on an inert probe that measures nothing and reports agreement.\n\nSTATUS: DISCOVER only. `level_current` unchanged at 0 -- this atom's deliverable is a code\nreshape inside `file_scope`, not a register, so the doc is about the atom and is not the\natom (the `EP10` side of that discriminator, not the `EP19` side). `loop_stage` unchanged\nat `idle`, `provenance` unchanged at `proposal`. Nothing in `file_scope` was written; the\nmap is touched only by `tools.merge_atom_status` keeping `simplifications_count` in sync.\n"
map_notes:
  name: 'SPUN OUT OF H27 EXPERT HOUR #15 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT DISCIPLINE). Hour #14''s lead 2, taken: its caveat contract checks ONE cell''s number against the published figure -- `detection_latency`/recon, the only day-linear one -- and the other six moving cells carry caveats whose numbers are BANDS and EDGES that nothing compares with the figure they ride on. Asked of the two BELIEF cells, the number turned out to be neither figure''s. `belief_resolution_caveat` published `measure_belief_window_resolution`''s book bound (headroom + 1) in the sentence ''the smallest memory error IT can resolve at all'', BYTE-IDENTICALLY on both belief dimensions, because one function rendered one sentence for both. MEASURED through each organ, n=300, seeds 7/11/23: the bound is 310/309/309 while `belief` resolves 310/310/309 and `belief_population_mix` resolves 310/314/312 -- so the sentence is a day out on one figure and FIVE days out on the other, and two figures whose measured resolution differs by four days shared one number. The predictor''s own docstring was careful (shortening by more ''MAY be visible ... the organ''s business and not this predictor''s'') and nobody ever asked the organ; the mix entry''s own `own_why` had already NOTICED it was blunter and nothing turned that into the number the reader gets (Hour #11''s ''a lead is not a control'', one field over). THIS ATOM IS THE RESHAPE Hour #15 declined to do on the promoter''s behalf: THE MOVEMENT PREDICATE. Every collapse run and saturation edge in this module is derived with `repr()` BIT-EQUALITY, so a 1.4e-17 difference counts as one counterfactual company being told apart from another -- measured live, `belief_population_mix` at seed 11 ''moves'' at drifts -310..-313 by 1.4e-17, which is what put its declared ceiling at -309 where the 4dp its consumers render puts it at -313. Re-deriving every declared collapse run, saturation edge and band in ORGAN_QUERY_GRID and DIMENSION_DRIFT_RESOLUTION at the precision the reader is actually given is a real reshape with real blast radius (it moves declared edges, not published figures) and is therefore a mint, not a fix on sight. R12: no published number moved in Hour #15''s commit -- the detection gap, the latency mean and both belief figures are bit-identical; what moved is what the instrument admits about itself. ALREADY LANDED UNDER H27''s HOUR: per-dimension `own_readable_resolution_floor_days` (310d and 314d), MEASURED by `measure_published_resolution_floor` through each dimension''s own shipped scorer on a grid derived from the BOOK (one day inside its own provable bound, out by its own event span) at an epsilon that is HALF A STEP of the 4dp every consumer renders -- read back out of the consumers'' source, not chosen as a tolerance; `check_published_resolution_floor`, exact on the D25/D30 rule, with the bit-equality floor kept as a declared MEASURED witness and its owning atom required exactly where the divergence is real; the caveat corrected AT SOURCE so each figure states its OWN floor, names the sibling''s as the sibling''s, and states the book bound AS a bound on any figure here (and an unnamed caller gets an explicit refusal, never a default); and `number_source` on every moving cell of PUBLISHED_FIGURE_CAVEAT_CONTRACT, whose SUBJECT is checked -- a DIMENSION_DRIFT_RESOLUTION source must be keyed to THIS dimension, an ORGAN_QUERY_GRID source must feed it and owes a published-figure number if its `headline_key` names a sub-reading, and a BOOK source owes a per-figure floor. R15 both ways: the control fires on the pre-Hour caveat (the book bound republished as the figure''s resolution), on the sibling''s floor stamped on the mix figure, on a floor the SENTENCE never states, on a book-sourced cell with no floor, on a number sourced from another dimension''s register, on a sub-reading source with no published number, on a declared floor the sweep contradicts, on a predicate divergence with no owner AND an owner with no divergence, on an undeclared or unmeasured floor (raises), on a moving cell with no `number_source` (raises), on an absent floor sweep (an unavailable check is a failed one), and on an inert probe / a book with no bound (both raise).'
