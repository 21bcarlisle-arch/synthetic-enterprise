simplifications:
- '2026-07-13 REGISTERED as QUEUE, not actioned immediately (self-refill/staging disposition, STAGING_HAS_ONE_GEAR.md''s own new discipline applied live: this doc is real, director-raised, P1-labelled, but is a resilience-improvement design/build task with no live consequence right now -- not a live defect, safety issue, one-way door, or machine-blocker -- so it is QUEUE-dispositioned, registered here rather than interrupting in-progress map work). Real, precise scope from the staged doc: PRODUCTION_READINESS_EVIDENCE_PASS.md (H3''s own Part A) already confirmed company/data/*.db is backed up via the GitHub mirror, but the MACHINE that operates the company (daemons, hooks, .claude/settings.json, systemd/tmux topology, env files, launcher scripts, model routing) has never been reproduced from a clean state -- a real, named single point of failure, not hypothetical. Concrete DoD from the staged doc: (1) inventory everything the harness needs that is NOT in the repo (env files, secrets locations, systemd units, tmux layout, external services); (2) a real bootstrap path (script or documented sequence) reconstructing a working harness from the repo + a secrets file; (3) TESTED for real on a clean directory/container/second machine, not a thought experiment -- measured time-to-working recorded, not assumed; (4) secrets never enter the repo (Option 2 floor already established); (5) the measured RTO feeds H4_go_live_nfr_register''s recoverability entry. Depends on H4 existing to receive that feed (already at target, dependency met). Real next step (not decided here): the actual inventory pass (grep tmux session names, systemd user units, .env.* files, secrets_location.py''s resolved paths) plus designing the real clean-environment test -- neither attempted yet, genuinely greenfield, deliberately deferred per QUEUE disposition rather than rushed mid-turn.'
- '2026-07-16 FRAME (H17 Lane-3): canonical per-atom FRAME terminus authored (bootstrap inventory + DR scenarios); BUILD deferred (idle/epoch-gated, awaits H4).'
- '2026-08-18 staging triage (QUEUE, absorbed not built -- BUILD stays idle/epoch-5-gated, this atom already existed so no new atom was minted): ADVISOR_PROPOSAL_SEAT_CUTOVER_AND_DR_2026-08-07.md sharpens the 2026-07-16 FRAME with five concrete requirements the prior FRAME did not name -- R1 the seat must be standable FROM OFF the seat (versioned bootstrap + a secrets escrow held off-box by the director + a CACHE/MOVABLE/LOSABLE-WITH-EYES-OPEN census of seat-local state); R2 two written cut-over classes, graceful (old seat reachable) vs dead-box (this repo''s actual 2026-08-03..08 five-day outage, which had no sanctioned dead-box path); R3 an uncommitted-age alarm (the dead-man''s principle applied to unpushed local-ahead-of-origin state, since that is the only thing a dead-box cut-over can lose); R4 one seat on Earth (a second marker/heartbeat on origin should scream, extending the existing double-launch guard class); R5 the drill-or-fiction acceptance test (a timed dead-box rebirth on a scratch box, recorded, cadence per epoch boundary; a cold-standby landing zone at ~£0 as the mechanism). Filed as requirements, not mechanisms, per the proposal''s own scope; still BUILD-deferred behind H4/epoch-5, so nothing was built here. Advisor doc archived to docs/staging/done/ -- its content is now carried by this note, not left as a second, undiscoverable copy of the same requirements.'
