atom_id: D23_organ_query_grid_cannot_resolve_latency
map_notes:
  name: 'The W2_11<->D5 triad''s DETECTION_LATENCY dimension -- the one whose whole subject is HOW LATE the company learns a payment failed -- read its reconciliation first-knowledge date by asking the company''s organ on a grid of candidate dates the HARNESS built from the organ''s own rule (`candidates = {due_date + reconciliation_grace_days}`, one per period), while its docstring claimed the opposite in as many words (''asked of the organ itself, never re-derived here (R15 independence)''). The organ WAS asked; it was asked at exactly one date per period, and that date was the harness''s re-derivation. Independent in FORM, tautologous in VALUE: improvement was invisible WITHOUT BOUND (`recon_lag_days` the CONSTANT 5 for all 204 dated cases -- `reconciliation_grace_days`, a harness input parameter, echoed back, so an instant reconciler and one flagging a fortnight early both published 5.0) and degradation was QUANTISED TO 21 DAYS (`PERIOD_SPACING_DAYS`; +1/+7/+21 bit-identical, and the last period''s cases left the population entirely, undated 0 -> 59). RESHAPED 2026-08-10: the grid is DAILY from the invoice''s ISSUE date to `as_of` (`organ_query_dates`), so the reading tracks the company day for day in BOTH directions -- measured at seeds 7/11/23, baseline 5.0, -1d -> 4.0, +1d -> 6.0, +7d -> 12.0, and `n_recon_detected_undated` 0 everywhere (no case leaves the population for want of a candidate). The lower bound is now the COMPANY''s rather than the harness''s: a supplier cannot know an unissued bill went unpaid, and `n_recon_dated_at_issue_floor` counts the readings that are ''at or before'' rather than exact. The register that measured the defect SURVIVED its own repair by changing shape -- with no invisibility left on the date reading it would have been all-visible and unfailable, so it now declares COLLAPSED PAIRS (two companies that must read alike), and the two entries part company where the reshape put them: a +1d company moves the DATE reading by a day and leaves the SET reading untouched (a set is not a clock), while both collapse together at the organ''s zero-floor, which is what localises the residual to the organ and mints D24. COST, measured not waved at: 1.6s -> 40.6s on a live 24-account x 114-month run (~27x, ~40s on a 5-9 min sim run), written into `organ_query_dates` so the next person weighing a shorter grid weighs it against a number. R12: the published detection and latency figures moved because the measure was wrong, never fitted to a value.'
