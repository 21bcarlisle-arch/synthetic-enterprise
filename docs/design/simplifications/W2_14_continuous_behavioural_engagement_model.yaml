atom_id: W2_14_continuous_behavioural_engagement_model
simplifications:
- '2026-07-23 AUTHORED as a DISCOVER atom by director ratification (DIRECTOR_R13_ENGAGEMENT_MIX_RATIFICATION_2026-07-23.md section 3). provenance: proposal / loop_stage: discover -- non-blocking, self-drawn; MUST NOT delay or block the ratified static share edit (that landed 2026-07-22, commit 9542cdd1b). Director standing ask: the three discrete engagement bins (ACTIVE/PASSIVE/DISENGAGED in simulation/household_segments.py) are a BOUNDING SIMPLIFICATION. The future model should treat engagement as a LATENT, DISTRIBUTED PROPENSITY -- state-dependent, movable by life events, service episodes and price shocks (a household can BECOME disengaged), not a trait fixed for the whole tenure. Coupled per the registered fusion hypotheses: engagement x price_sensitivity, and a U-shape by affluence (fusion-register, DIRECTOR_SEGMENTS_REVIEW_VERDICTS_2026-07-23.md section 1). Q-B of the R13 ruling registered the sibling ''regime-timed engagement schedule'' as a NAMED candidate curriculum scenario (a future epoch-4-class director lever), distinct from THIS atom (the continuous within-household model). DISCOVER first: confirm exactly where the discrete engagement bin enters the churn/renewal path today (household_segments.py::engagement_level_for_customer -> _ACTIVE_RENEWAL_PROBABILITY_BY_ENGAGEMENT, consumed by company/crm/churn_model.py) and what a latent movable propensity would add; do not begin build without a granted turn. BUILD stays gated (EPOCH_GATING -- author now, BUILD when opened).'
- '2026-07-29 DISCOVER COMPLETE and L1 SELF-CERTIFIED -- the map catching up to code that already existed plus the small build the DISCOVER itself scoped. The DISCOVER doc landed in commit 9aea5ecdc but the map still read level 0 / loop_stage discover, so this atom kept re-drawing as unstarted DISCOVER work (same stale-map class as W2_12/W2_13 in 9b5d0b096). BUILT here: section 4 items 1-2 only -- engagement_propensity_for_customer (the latent, in [0,1), higher = more engaged) and engagement_level_from_propensity (the projection), with engagement_level_for_customer, its signature, its outputs and all three sibling consumers byte-for-byte UNCHANGED (golden-value test). R13 is preserved BY CONSTRUCTION, not by tolerance: the latent is anchored ON the existing coarse draw and only its position WITHIN the bin is drawn, from its own named C-S2 substream, so the refinement identity engagement_level_from_propensity(propensity(cid)) == engagement_level_for_customer(cid) holds for EVERY customer_id -- the same strict-refinement pattern population_draw.py:417-467 already uses for the 3-to-4-level tenure reconciliation. Bin boundaries are DERIVED from ENGAGEMENT_POPULATION_SHARE (one copy, moves only if the director moves the shares). WHAT L1 HONESTLY IS HERE, stated because it is easy to overclaim: with the R10 within-bin density assumed UNIFORM (no source gives one -- DISCOVER section 3.2 item 1) the population latent is exactly uniform[0,1), i.e. the propensity today is a household engagement PERCENTILE and carries no more information than the bin it projects to. It is the substrate movability will need, not yet a behavioural gain. NOT BUILT, deliberately: item 3, MOVABILITY -- the whole point of the director ask -- because (a) it is blocked on an R13 curriculum question only the director can answer (is 0.45/0.35/0.20 an ENTRY or a STEADY-STATE distribution? DISCOVER section 3.3; with an immovable trait the two were identical, a movable propensity forces the distinction, and the readings give materially different books), (b) the shift magnitudes are entirely unanchored (post-shock scarring, service-episode sign AND magnitude, per-life-event shifts, decay half-life -- section 3.2 items 3-5 and 8), and (c) the registered couplings need population_draw.py plus switching_propensity.py plus segmentation_curriculum_v1.json, a coordinated multi-file atom rather than an L1 increment. Recommendation carried to the director rather than a bare ask (NEVER_ASK_WITHOUT_RECOMMENDING): STEADY-STATE with a proven stationarity constraint, because it is the reading that cannot silently move a ratified number and because the evidence in section 2.2 (composition moves year to year then RECOVERS to its pre-crisis level after the largest shock in the market history) fits a stationary distribution with churn between states better than a drifting entry distribution. Nothing in this increment depends on the answer. RECORDED FINDING from the R15 pass, kept because it is a real limit of the control chosen: the refinement identity is INSENSITIVE to a consistent re-ordering of the bins (both the latent and the projection read the same order, so reversing it -- higher propensity meaning LESS engaged, the variable read backwards -- keeps the round-trip exact). An identity is the wrong instrument for a direction defect; the ascending-bounds partition assertion is the control proven to fire on it, and the mutation test asserts both halves so the identity is never later mistaken for a semantic guarantee. loop_stage set to verify, not harden: no deployed surface renders the propensity, no population-level distribution check runs in the sim harness yet, and per the COUPLED TRIAD the company half (estimating price-sensitivity from OBSERVED responses only, never reading this latent) is the separate B8 company atom -- so the belief-vs-truth gap for this capability is not yet measurable.'
