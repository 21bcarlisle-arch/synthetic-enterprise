atom_id: A47_the_score_has_no_household_side
map_notes:
  gain: 'Director, 2026-08-28, mission (verbatim): ''We are creating enterprise value by automating ways to find individual customers we can create value for, and SHARING in that value... Value is created and then shared, so every decision has two sides: good for the household and good for us. Charging someone the cap transfers value, it doesn''t create it, which is why the maximiser kept finding it.'' Observed: SURVIVE and EARN are the company''s by construction, and ABATE -- though it counts a household''s tonnes -- is instrumented as our GBP/tCO2e and is not yet instrumented at all. There is no household-side term in ANY currency. This re-reads a finding already on file: WORKER_FINDING_THE_CHURN_MODELS_CAP_MAKES_THE_PROFIT_MAXIMISING_PRICE_UNBOUNDED_2026-08-25 diagnosed a missing CEILING in the churn model, and that repair is real; but a ceiling repair cannot fix a score with a side missing, because the maximiser was optimising a one-sided objective CORRECTLY. A two-sided score makes cap-pricing unattractive on the merits rather than merely unreachable. Level 2 is the objective STATED and instrumented on one household currency (money saved vs counterfactual), not the whole six-cell table.'
