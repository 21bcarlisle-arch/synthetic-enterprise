atom_id: W2_11_payment_behaviour_source
simplifications:
- '2026-07-18 REGISTERED as DISCOVER proposal (director D5 ruling: decompose D5 into 4 correctly-homed atoms). The sim payment GENERATOR is BASELINE FIDELITY, buildable -- anchor to external real-world payment statistics (decided blind to P&L, R13 baseline/curriculum split); any DIFFICULTY DIAL on it is CURRICULUM and comes to the DIRECTOR (never agent-tuned from company outcomes). DISCOVER/FRAME workable now (research the external anchors); BUILD is director-opened. Coupled: the company (D5) consumes payment observables through the seam (W4_4) and the harness (H27) measures belief-vs-truth. See [[project_open_front_and_self_governance]].'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, no code, no level move per §0 -- L1 PROPOSED). Designs the SIM-SOURCE third of the D5 coupled triad (simulation/). BEHAVIOUR DIMENSIONS the generator produces (the TRUTH the company never sees directly): (1) payment TIMING -- early/on-time/late relative to due date; (2) DD collection SUCCESS/FAILURE with reason (insufficient-funds vs cancelled-mandate -- maps to the ARUDD/ADDACS observable at the W4_4 seam); (3) ARREARS/late-payment PATTERN -- transient vs chronic late-payer; (4) payment-METHOD mix -- DD / standing-order / card / prepayment. NOT A SEPARATE MECHANISM (reuse, like W2_8 self-rationing): payment behaviour CORRELATES with the household economic state W2_4 (budget/income_stress) already models -- a stressed household is likelier to fail a DD / pay late / fall into arrears -- so this branches on the SAME hardship substrate, it does not invent a new one. C-S2 RNG SUBSTREAM (binding, the 01:09Z lesson): W2_11 draws from its OWN named seeded substream so adding payment draws can NEVER shift another subsystem''s outputs. R13 BASELINE (fidelity, decided BLIND to company P&L): the behaviour SHAPE is calibrated to EXTERNAL real-world UK payment statistics -- DD failure/return rate, DD take-up %, payment-timing distribution (sources: Bacs/UK Finance published figures). HONEST ANCHOR GAP: the exact calibration VALUES must be SOURCED from real published stats -- NOT fabricated, NOT tuned to company results; sourcing them needs network/research (not available in the autonomous loop), so this FRAME names the anchor CATEGORIES + the calibration method and DEFERS the numbers to a research pass or director/advisor-provided data (a real anchor, never a made-up one -- the "local models confabulate" rule). R13 CURRICULUM (the director''s, NOT agent-tunable): difficulty scenarios (e.g. "DD-failure spike / payment-stress epoch") are named, versioned, director-authored artefacts, never silent parameter drift and never adjusted in response to company P&L. COUPLING (binding): fills the W4_4 seam''s sim adapter (emits the observable payment events); its truth is what H27_payment_belief_gap scores D5''s belief against; does NOT reach L3 until that gap is measured. BUILD director-gated (curriculum + baseline calibration are gated decisions); this FRAME is the generator structure.'
- '2026-07-18 BUILD DONE (generator), home on main (cherry-pick b65b0a866; verified L1: 44 tests + 668 tests/sim regression + C-S2 substream isolation proven byte-identical across population/life-events/household-budget/dd-attribution; epistemic PASS). REUSE not reinvent: wraps the already-calibrated simulation/arrears_engine.payment_outcome() + bacs_rails ARUDD/AUDDIS physics + household_segments DD-share (DESNZ/Ofgem-cited), adds only C-S2 substreams + DD-failure-reason + ageing/pattern classification + one new EARLY-payment dimension (labeled estimate, R10 gap). Difficulty dials NOT exposed (director R13 curriculum). LEVEL: L1 PROPOSED (level_current STAYS 0 per §0); blocked_on coupled_triad_gap -- L3 needs H27_payment_belief_gap measuring belief-vs-truth against D5, which needs W4_4 seam + D5 consumption (COUPLED_TRIAD binding). Calibration gaps flagged inline: standing-order/card split, DD-failure-reason exact %, arrears_engine stress-tier sourcing.'
- '2026-07-18 ADAPTER LANDED (coupled-triad closure, level stays 0 per §0). simulation/payment_seam_adapter.py on origin (25 tests): fills the W4_4 WallResponse from the generator -- success->RemittanceAdvice, DD failure->BacsArruddOutcome(reason CODE), non-DD failure->no-response (blind spot), dispute->NOT_KNOWABLE_YET; async observed_at>=value_date on the Bacs lag; C-S2 substreams. THE WALL (load-bearing test, mutation-strong): the many-to-one non-invertible collapse is proven via the REAL generator -- two customers of different true stress that draw the same dd_failure_reason emit the IDENTICAL BacsReasonCategory, and PaymentEvent structurally carries no stress/segment/pattern so leak is impossible by construction. Honest R10: ARUDD is return-only so no SUCCESS line fabricated; CANCELLED_OTHER->INSTRUCTION_CANCELLED kept single (no unsourced fan-out). Source+adapter now built; blocked_on coupled_triad_gap -- L3 awaits H27 measuring across it.'
