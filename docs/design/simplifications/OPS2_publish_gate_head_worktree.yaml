  OBSERVED. Both checkout phases were gated on `path.name != prc.REUSED_HEAD_CHECKOUT_NAME ->
  abort`, and since 444402ee0 that is true on every launch. So the harness could not complete,
  and it aborted with the pre-written cause "another publisher held the reuse lock" -- a cause
  that is not merely wrong but points the next diagnosis at a lock with nothing left to protect.
  The consumer is fail-CLOSED (`prc.measured_gate_timeout_floor`; a record that cannot answer
  REDS the gate), so an instrument that can never refresh its record is a control counting down.

  THE REPAIR IS A COLLAPSE, NOT A PATCH, and it follows the filed finding's own recommendation
  rather than re-deriving one. PHASE_ORDER is now `(throwaway_checkout, in_tree_baseline)` -- the
  two subjects that still exist -- and `ratio_throwaway_over_in_tree` measures THE TAX the
  elimination made permanent, which is the honest successor to superseded criterion 1. It is
