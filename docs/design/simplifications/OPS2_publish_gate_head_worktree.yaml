  it refuses with a reason that is true.

  THE PART THAT WOULD HAVE WEDGED PUBLISHING, and it was one line from happening. `_run_measurement`
  rewrites the record from `results["phases"]` BEFORE its first phase. `_load_banked_phases`
  filters on `name in PHASE_ORDER`, so collapsing the phase set would have dropped the banked
  `cold_checkout` at 1291.9s -- which is `measured_gate_timeout_floor`'s ENTIRE evidence -- at the
  instant this harness next launched, taking the floor to None and reddening a control that was
  working. RETIRED_PHASES are therefore carried: never in the ratio, never able to retire an owed
  phase, always in the floor (they are real timings of this suite on this box and can only push
  the bound UP), and named in `phases_from_a_retired_configuration` so no reader mistakes one for
  part of the comparison. `worst_legitimate_phase` is new for the same reason -- a bound resting
  on a dead subject should be visible, not inferred.

