atom_id: OPS2_publish_gate_head_worktree
map_notes:
  name: 'MINTED FROM DIRECTOR_RULING_PUBLISH_GATE_SUBJECT_2026-08-09 deliverable 2 (''the polished atom''); full scope in docs/staging/done/PLANNER_MINTED_publish_gate_head_checkout_polish_2026-08-09.md, which is this atom''s spec and must not be re-derived. The minimal version is LANDED and deployed (git archive HEAD -> mkdtemp + untracked-DATA symlink overlay) -- do NOT redo it. EXIT: (1) SUPERSEDED 2026-08-11 by the R3 ELIMINATION of the reused checkout (444402ee0, after it reset a shared tree under four live suites and left publishing down 41h): prc.REUSE_HEAD_CHECKOUT ships False, so warm bytecode is unavailable to this atom at any price and the 1.3x bound -- derived under warm bytecode -- has no subject left to bound. Do NOT re-enable reuse to chase it, and do NOT read this supersession as the criterion being met. Its honest successor is a REPORTED number, not a bound: the throwaway/in-tree ratio, i.e. what the cold subject costs EVERY publish cycle, the permanent tax the elimination made unavoidable -- measured both sides at one commit by tools/measure_publish_gate_subject_cost.py, which no longer emits meets_exit_criterion. STILL OWED: a completed in_tree_baseline phase, so that tax is reported rather than estimated -- but BLOCKED 2026-08-11 and a 4th relaunch is WASTE: that phase dies against its own 8192MB ceiling (kernel logs CONSTRAINT_MEMCG oom_memcg=<its own scope>), and was truncated 3 launches running (1302.4s/1867.6s/1425.1s) because the record misreported the ceiling kill as a plain SIGTERM -- a discriminator keyed to rc==-9 while the scope teardown leaves the parent on -15. Verdict is now kernel-derived (scope_oom_killed banked per phase, 3b957e5ae); the ceiling is now DERIVED from cgroup demand (not a chosen figure, and never a round number) and the ratchet reached its TERMINUS 2026-08-12: the phase banked a 10240MB demand floor, which needs 12800MB at 1.25x, and this box spares 11816MB with the publisher''s reserve intact -- so the phase is REFUSED before it starts and criterion 1 is NOT DELIVERABLE ON THIS BOX. Launch 15 buys nothing; ratio_unavailable_because now says so in the artefact. The tax stays estimated until there is a bigger box; (2) GATE_SUITE_TIMEOUT_SECONDS re-derived from the NEW measured runtime at >=2x, with test_the_gate_timeout_exceeds_the_suites_own_runtime''s constant moved with it -- the gate now fail-CLOSES on timeout, so an undersized bound wedges publishing; (3) crash-safe lifecycle (startup sweep of stale publish-gate-head-* dirs, or git worktree + prune) since rc=-9 is a known outcome and finally: does not run; (4) R15 both ways in its own module tests/background/test_publish_gate_subject_is_head.py -- cwd is the checkout not PROJECT_DIR (mutation: point it back, reds), a DIRTY working tree does not change the verdict (write a syntax error into a tracked source file, gate still passes -- this is THE property the ruling bought and nothing asserts it yet), an unavailable checkout BLOCKS (mutation: return True, reds), the dir is removed including on a raising run; (5) the LAST_TESTED_HASH_FILE contract stated in ONE place -- the supervisor''s RUNG-1 wedge draw uses it as its independence cross-check and infers the semantics from two call sites. CERTIFIED L0->L2 2026-08-12, thirteenth draw: criteria 2-5 are DELIVERED (181 green across the atom''s own module, the instrument''s, and the ledger''s; the four criterion-4 properties each carry their own mutation), and criterion 1 is closed as UNPAYABLE-HERE rather than left pending -- the terminus is not a recorded opinion but a predicate re-derived from the box on demand (MemTotal 15912MB -> 11816MB safe cap against the 12800MB the banked 10240MB demand floor needs at 1.25x), so no further draw of this atom can produce that number. RESIDUAL, NOT AN EXIT CRITERION: the throwaway/in-tree cost ratio stays ESTIMATED until a bigger box exists; re-open this atom at level_target 3 on that box and do NOT re-draw it here for the measurement, because the refusal is the correct outcome and a fourteenth relaunch buys nothing.'
  build_note: "2026-08-11. Criterion 1 is NOT met and the level does not move: `in_tree_baseline` has\nnever been timed, so there is no ratio. What landed this tick is the INSTRUMENT, which was\nlying about its own deaths.\n\nThe 2026-08-10 22:28Z launch was recorded (in a filed worker finding, as `observed`) as\nhaving died in the acquire poll. `journalctl -k` says otherwise: the OOM victim was pid\n3272589, a CHILD of the unit's python 3244117 -- the BASELINE phase's pytest at 12.9G anon\nRSS, `global_oom`. It had taken the lock and was in the suite. The finding's proposed repair\n(a memory guard in the acquire poll) would not have fired.\n\nCause of the misread, and the actual defect: the phase banner prints BEFORE the wait, there\nwas no log line for taking the lock or starting a suite, and `heartbeat` is called only from\nthe three wait loops -- so the artefact froze the instant work began and stayed frozen for\n~20 minutes. `_InFlight` now carries phase + stage + MemAvailable continuously and\ncheckpoints on every stage change; the next launch republishes a leftover marker as\n`previous_launch_died_in_flight`. R15 both ways, mutations RUN: no-op `stage()` reds 4\ntests; one literal for every stage reds the differential; a dropped `clear()` reds the\nchosen-ending test; the prior read moved below the first checkpoint reds the republish test.\n67 passed in tests/tools/test_measure_publish_gate_subject_cost.py.\n\nResidual, filed not fixed: the suite really does reach 12.9G, because `_argv_without_x`\nmakes the measured subject strictly larger than the gate's own `-x` run. See\ndocs/staging/WORKER_FINDING_THE_MEASUREMENTS_SUBJECT_IS_LARGER_THAN_THE_GATES_2026-08-11.md.\n\n2026-08-11, second tick. Criterion 1 is STILL NOT met and the level does not move:\n`in_tree_baseline` remains untimed, so there is still no ratio. What landed is the thing that\nhad killed three launches before they could produce one.\n\nMEASURED FIRST, as the refuted sibling taught. The box was already running both arms of the\nA/B the finding asked for -- the live publisher's gate (`-x`, pid 3756987) and an\n`enumerate_publish_gate_reds` sweep (no `-x`, pid 3768864), argv identical apart from that one\nflag, started a minute apart -- so the number cost an observer rather than a third 20-minute\nsuite. `tools/sample_gate_rss_premium.py` samples both trees' `VmHWM`. Partial at the time of\nwriting: `with_x` finished at an exact 3.15G peak; `without_x` passed 5.34G still climbing, so\nits figure is a LOWER BOUND and the record's verdict says `inconclusive` rather than quoting\nit. Directionally the finding's `inferred` `-x`-premium claim is holding.\n\nBUILT (option A): each phase's pytest runs inside `systemd-run --user --scope` with `MemoryMax`\nand `MemorySwapMax=0`, so an over-large phase dies alone instead of global-OOM killing a box on\nwhich the publisher is a candidate victim every time. A missing `systemd-run` raises `_Unbounded`\n-- BLOCKS the phase, records `blocked` in the artefact, exits non-zero -- deliberately not a\n`_Deferred`, because waiting does not grow a systemd-run. Every phase record now carries\n`memory_max_mb`, an `inferred`-labelled `hit_memory_ceiling`, and `subject_larger_than_the_gates`\n(consequence 2 of the finding: a reader re-deriving the timeout \"from the measured runtime\"\nwould not otherwise know the number carries an `-x` premium).\n\nTHE CONTROL CAUGHT ITSELF, and this is the part worth keeping. `MemoryMax` alone does not kill\n-- it reclaims into this box's 4G of swap: a 300MB allocation completed inside a 128MB ceiling,\nrc=0. So the first version of the bound was throttle-not-kill, i.e. a 12.9G suite would have\nthrashed the box rather than global-OOMed it, which is the same harm slower. Worse, dropping\n`MemorySwapMax=0` SURVIVED as a mutation, because the box was already 3G into swap and the\nchild died anyway -- ambient state was deciding the verdict. The property is therefore pinned\nby reading `memory.max` and `memory.swap.max` back from the scope's OWN cgroup, not by a\nbehaviour that only usually follows. R15 both ways, six mutations RUN: wrapper dropped, fail-open\non missing systemd-run, `MemorySwapMax=0` removed, `MemoryMax` removed, discriminator ignoring\nthe box, block exiting 0 -- all six red; source restored byte-identical after each.\n75 passed in tests/tools/test_measure_publish_gate_subject_cost.py.\n\nTHE MEASUREMENT COMPLETED within the tick. gate_x_premium_rss.json reads `complete: true`,\nverdict `supported`: `with_x` 3.15G, `without_x` 5.34G, ratio 1.69. Neither arm was OOM-killed\n(`journalctl -k` in the window shows only CONSTRAINT_MEMCG kills, and those are this tick's own\nR15 test scopes), so both are peaks of runs that ended on their own. Contended, and recorded as\nsuch -- sharing a box biases both DOWN through reclaim, so 5.34G if anything under-states.\n\nAnd the repair is confirmed BY THE KERNEL rather than by assertion. The original failure was\n`oom-kill:constraint=CONSTRAINT_NONE ... global_oom`; the same log now shows this tick's\nover-large child dying as `constraint=CONSTRAINT_MEMCG ... oom_memcg=.../ops2-bound-selftest\n.scope`. That is the exact discriminator the finding quoted, flipped.\n\nStill open, and the measurement SHARPENED it rather than closing it: 5.34G does not reconcile\nwith the 12.9G the measurement's own BASELINE phase reached before the global OOM. Same\n`-x`-less argv, same in-tree subject, a 7.5G gap. Two candidate causes, neither measured: the\nmeasurement sets SIM_FAST_MODE=1, and it redirects `--basetemp` into HEAD_CHECKOUT_ROOT on\n/tmp, which is a TMPFS on this box. So the `-x` premium is real and measured, but it is NOT the\nwhole account of the 12.9G and must not be read as one.\n\n`PHASE_MEMORY_MAX_MB` therefore STAYS at 8192 and is deliberately not tightened to the measured\npeak: 8G is 1.5x the measured 5.34G and well under the 12.9G lethal point, and tightening to\n~6G on a number whose 12.9G sibling is unexplained would wedge the measurement the bound exists\nto protect. What unblocks the derivation is a peak from an UNCONTENDED, completed phase;\n`resource.getrusage(RUSAGE_CHILDREN).ru_maxrss` around the phase's `subprocess.run` is the\ncheap exact way to get one, and it survives the scope teardown that hides `memory.peak`. Not\nbuilt. Parked in docs/staging/in_progress/ with that as its named blocking sub-item.\n\n2026-08-11, third tick. EXIT CRITERION 1 IS SUPERSEDED, NOT MET, AND IT CANNOT NOW BE MET.\nThe criterion asked for \"a REUSED checkout so __pycache__ survives between cycles, within 1.3x\nthe in-tree baseline\". Reuse was ELIMINATED this morning under R3 (444402ee0): the shared\ndirectory was reset under a live suite four separate times -- 18:25Z, 20:18Z, 20:47Z (twice\nAFTER the 19:08Z fix) and 08:10Z -- each producing a red that said nothing about any test, and\nthe last left publishing down 41 hours and 216 markers. `REUSE_HEAD_CHECKOUT` ships False.\nWarm bytecode is not available to this atom at any price it may pay, so the criterion is\nrecorded as superseded rather than carried as a permanent debt. Its honest successor is the\nRATIO IN THE OTHER DIRECTION -- what the cold subject costs per cycle -- which is still owed.\n\nWHAT THIS TICK FOUND AND FIXED, and it was live: the elimination flipped the mechanism and left\nthis atom's OWN R15 module pinning the mechanism it removed. Five tests red at HEAD inside the\ngate's `-x` scope -- `test_the_gate_runs_with_its_cwd_inside_the_checkout`,\n`..._is_reused_and_keeps_its_bytecode`, `..._second_publisher_never_shares...`,\n`..._corrupt_reused_checkout_is_rebuilt...`, `..._occupied_reused_checkout_is_not_refreshed...`\n-- so the commit that unwedged publishing re-wedged it one file over, on the first failure `-x`\nreached. That is the class worth keeping: AN ELIMINATION MUST MOVE THE CONTROLS THAT PIN THE\nELIMINATED MECHANISM, in the same commit; a switch flipped alone reds the gate at the one place\nthat was watching hardest.\n\nTHE REPAIR IS A SPLIT, NOT A DELETION. The reuse code survives behind a documented one-line\nswitch, so deleting its tests would make re-enabling a rediscovery of four incidents. The module\nis now two halves: the SHIPPED lifecycle (`test_the_shipped_default_gives_every_cycle_its_own_\ncheckout` -- own directory per cycle, gone at cycle end, next cycle differs, and the log names\nR3 as the reason it is cold) and the DORMANT one, reached through a `reuse_enabled` fixture.\nThe two halves' first tests are EACH OTHER'S MUTATION on the single line that decides it.\n`test_the_gate_runs_with_its_cwd_inside_the_checkout` now asserts the checkout ROOT and PREFIX\nrather than one directory name -- it red on a lifecycle change while the property it exists for\n(the gate does not run in the shared tree) still held, which is a control graded on the wrong\nsubject.\n\nR15 BOTH WAYS, MUTATIONS RUN, source restored byte-identical (`git diff` empty after each):\n(a) `REUSE_HEAD_CHECKOUT = True` -> the shipped-default test reds, 34 others pass, i.e. the\ndormant tests really do exercise the reuse path; (b) the same mutation with the test's\n`assert prc.REUSE_HEAD_CHECKOUT is False` guard DELETED -> it still reds, on the behavioural\nassertion (`'publish-gate-head-reused' != 'publish-gate-head-reused'`). (b) is the one that\nmatters: without it the control would be a constant echoing itself.\n35 passed in tests/background/test_publish_gate_subject_is_head.py; 158 passed across the whole\npublish-gate family (subject_is_head, scope, disk_preflight, publish_scope, head_checkout_is_a\n_repo, measure_publish_gate_subject_cost).\n\nLEVEL DOES NOT MOVE, and the blocker is now named rather than open-ended. Criteria 2-5 are\nlanded (2600s clears the measured floor of 2583s; the stale-checkout sweep and its both-ways\ntest; this module; LAST_TESTED_HASH_CONTRACT stated once and asserted). Criterion 2's EVIDENCE,\nhowever, can no longer be refreshed: `tools/measure_publish_gate_subject_cost.py` aborts both\ncheckout phases unless `_head_checkout()` returns the reused NAME, which it never will again --\nand it aborts with the pre-written cause \"another publisher held the reuse lock\", which is\nfalse. Worse, the 1291.9s the 2600s bound rests on was measured with `cwd:\n/tmp/publish-gate-head-reused` and the record's own `warm_cache_established_by` says the\nbytecode came from outside that run: the shipped subject is colder than the number, and 2600s\nhas 17s of slack over the floor it implies. Filed, not fixed:\ndocs/staging/WORKER_FINDING_THE_INSTRUMENT_STILL_REQUIRES_THE_DIRECTORY_THAT_WAS_ELIMINATED\n_2026-08-11.md. Recommendation stated there: collapse the phase set to `throwaway_checkout` vs\n`in_tree_baseline` so the surviving ratio measures the tax the elimination made permanent --\nthat measurement closes restated-criterion-1 and re-derives criterion 2 in one pass, and it is\nthe last thing between this atom and level 2.\n\n2026-08-11, fourth tick. LEVEL STILL DOES NOT MOVE, and the blocker is unchanged and singular:\n`in_tree_baseline` has never been timed across ten launches, so there is no ratio. What landed\nis the thing that made the ratio UNREACHABLE -- the instrument's precondition was the directory\nthe R3 elimination deleted.\n\nOBSERVED. Both checkout phases were gated on `path.name != prc.REUSED_HEAD_CHECKOUT_NAME ->\nabort`, and since 444402ee0 that is true on every launch. So the harness could not complete,\nand it aborted with the pre-written cause \"another publisher held the reuse lock\" -- a cause\nthat is not merely wrong but points the next diagnosis at a lock with nothing left to protect.\nThe consumer is fail-CLOSED (`prc.measured_gate_timeout_floor`; a record that cannot answer\nREDS the gate), so an instrument that can never refresh its record is a control counting down.\n\nTHE REPAIR IS A COLLAPSE, NOT A PATCH, and it follows the filed finding's own recommendation\nrather than re-deriving one. PHASE_ORDER is now `(throwaway_checkout, in_tree_baseline)` -- the\ntwo subjects that still exist -- and `ratio_throwaway_over_in_tree` measures THE TAX the\nelimination made permanent, which is the honest successor to superseded criterion 1. It is\nREPORTED, NOT GRADED: `meets_exit_criterion` and `exit_criterion_ratio_max` are deleted,\nbecause a verdict against a criterion whose subject was deleted is a pass nobody earned, and\n`superseded_exit_criterion` states the supersession in the ARTEFACT rather than only here. The\nname check is INVERTED rather than removed -- a shared directory can now only appear if someone\nre-enables reuse, and then the phase would time a warm subject and file it as a cold cost, so\nit refuses with a reason that is true.\n\nTHE PART THAT WOULD HAVE WEDGED PUBLISHING, and it was one line from happening. `_run_measurement`\nrewrites the record from `results[\"phases\"]` BEFORE its first phase. `_load_banked_phases`\nfilters on `name in PHASE_ORDER`, so collapsing the phase set would have dropped the banked\n`cold_checkout` at 1291.9s -- which is `measured_gate_timeout_floor`'s ENTIRE evidence -- at the\ninstant this harness next launched, taking the floor to None and reddening a control that was\nworking. RETIRED_PHASES are therefore carried: never in the ratio, never able to retire an owed\nphase, always in the floor (they are real timings of this suite on this box and can only push\nthe bound UP), and named in `phases_from_a_retired_configuration` so no reader mistakes one for\npart of the comparison. `worst_legitimate_phase` is new for the same reason -- a bound resting\non a dead subject should be visible, not inferred.\n\nR15 BOTH WAYS, SEVEN MUTATIONS RUN, source restored byte-identical (`diff` clean after each):\nthe dead precondition restored (2 tests red); the refusal branch deleted (1); `keepable =\nPHASE_ORDER` (5, incl. the floor going blind); `worst` over RATIO_PHASES only (floor 2583 -> 2);\nratio numerator = the worst phase (1); `meets_exit_criterion` re-added (1);\n`phases_from_a_retired_configuration` dropped (2). 80 passed in\ntests/tools/test_measure_publish_gate_subject_cost.py, 159 across the publish-gate family, 62\nin tests/background/test_process_run_complete.py, ruff clean.\n\nWHAT IS OWED IS NOW ONE THING. The measurement itself. Launch 11 went out on this tick's code.\nNote for whoever reads its record: the shipped subject is a genuinely cold throwaway every\ncycle, i.e. at or above the 1291.9s the 2600s bound rests on (and that phase ran in\n/tmp/publish-gate-head-reused with bytecode from outside the run), so the re-derivation may\nRAISE the bound past 2600 -- `test_the_timeout_clears_the_floor_the_measurement_implies` is the\ncontrol that will say so, and it reddening is the control working, not a regression.\n\nBOOKKEEPING OWED, deliberately not taken this tick: the map's `file_scope` for this atom still\nnames only `background/process_run_complete.py` + `tests/background/test_publish_gate_subject_\nis_head.py`, while the last three ticks' work has been in `tools/measure_publish_gate_subject_\ncost.py` and its tests. The widening was written and then REVERTED because another lane held a\ncoherent staged change (the D30 mint) in `maturity_map.yaml`, and a pathspec commit would have\nlanded their half-finished work under this atom's message. Low risk while forks are serial;\nthe next tick that legitimately writes the map should carry it.\n\n2026-08-11, fifth tick. THE MEASUREMENT COMPLETED AND THE BOUND MOVED. Criterion 2 is\nRE-DERIVED, criterion 1's successor is REFUSED rather than met, and the level still does not\nmove -- but the blocker is now one 22-minute run rather than a defect.\n\nCRITERION 2, LANDED: GATE_SUITE_TIMEOUT_SECONDS 2600 -> 2900. Launch 11 timed the SHIPPED\nsubject -- `throwaway_checkout`, a fresh cold extraction of HEAD, which is what every cycle has\npaid since the R3 elimination -- at 1411.2s (23,710 passed, rc=1, HEAD d1a5875b4). 1411.2 * 2 =\n2822 overtook the 2600s bound, which had been derived against the 1291.9s phase that ran in the\nsince-deleted shared directory with bytecode from outside its own run and was therefore never a\ntiming of the shipped subject. `test_the_timeout_clears_the_floor_the_measurement_implies` went\nred on its own, before anyone looked, exactly as the fourth tick predicted -- the control\nworking, not a regression. `test_the_gate_timeout_exceeds_the_suites_own_runtime`'s transcription\nmoved with it (1291.9 -> 1411.2) and the two now red TOGETHER on a reverted bound, which is what\nmakes the transcription a second witness rather than a copy of the claim.\n\nCRITERION 1'S SUCCESSOR IS WITHDRAWN, NOT MET, AND THAT IS THE FINDING OF THIS TICK. The record\npublished `ratio_throwaway_over_in_tree: 1.084` with `complete: true`. Its denominator,\n`in_tree_baseline`, carries `returncode: -15` and a summary of nine progress dots: SIGTERM,\nmid-suite, no summary line ever printed. So the atom's certifying number divided a completed run\nby a truncated one. The true in-tree runtime is >= 1302.4s, so 1.084 can only OVERSTATE the tax\n-- \"at most 8.4%\" is a different claim from \"8.4%\", and this atom does not certify on the second\nhaving measured the first. Full evidence, and the fact that this is a RECURRENCE of the class\nfiled one day earlier against `publish_gate_duration.jsonl` (ranked backlog because \"the control\nit degrades is a diagnostic, not a gate\" -- which is what let it reach a certifying number a day\nlater), in docs/staging/WORKER_FINDING_A_TRUNCATED_RUNS_DURATION_BECAME_THE_ATOMS_CERTIFYING_\nRATIO_2026-08-11.md.\n\nTHE PROSE WAS ALREADY RIGHT, which is the part worth keeping. `_time_suite`'s own field comment\nsaid \"a phase that hit its own bound is a phase whose SECONDS mean nothing, so a reader must not\naverage it into a ratio\" -- addressed to a READER, enforced nowhere, and covering only rc=-9.\nA reported state is not a control. And `complete` concealed it: the harness tells readers to\n\"read `complete`, not the file's existence\", while `_checkpoint` computed it from phases\nATTEMPTED, so the one trusted field certified a killed phase as an answer.\n\nTHE REPAIR IS AN ASYMMETRY, because the two consumers ask different questions of the same\nnumber. A truncated phase's seconds is a real LOWER BOUND, so the FLOOR admits it (a lower bound\ncan only push a fail-closed bound UP, the safe direction -- and dropping truncated phases would\nblank the floor's evidence, the fail-open shape the retired-phase rule exists to avoid) while\nthe RATIO refuses it and names the cause in the artefact. Eligibility is derived from the\nrecord's own `returncode`, not from the presence of the new `ran_to_completion` field, so a\nschema change cannot discard a sound 1411.2s measurement; fail-closed only where the record\ngenuinely cannot say. A truncated phase also loses the right to retire the phase it failed to\ntime -- otherwise the dead baseline is banked forever and the ratio it poisons can never become\nhonest.\n\nR15 BOTH WAYS, SEVEN MUTATIONS RUN, source restored byte-identical after each (`diff` clean):\nunconditional ratio (1 red); banking keyed on `seconds` again (2); truncated phases dropped,\nblanking the floor (1); rc<0 admitted as completion (5); `worst_is_a_lower_bound` hardcoded\nFalse (1); `complete` counting attempted phases (1); the bound reverted to 2600 (2 -- the live\nfloor control and its transcription together). 86 passed in\ntests/tools/test_measure_publish_gate_subject_cost.py, 274 across the publish-gate family\n(subject_is_head, scope, disk_preflight, head_checkout_is_a_repo, alert, blocking_payload,\nwedge_draw, process_run_complete, measure_publish_gate_subject_cost,\npublisher_deadline_exceeds_its_gate). Ruff: unchanged against HEAD on every touched file (the\nthree remaining hits are pre-existing and in untouched regions).\n\nWHAT IS OWED IS STILL ONE THING, and it is now a run rather than a repair: a completed\n`in_tree_baseline`. Under the new rule it is correctly OWED (verified against the live record:\nthrowaway eligible, baseline not, floor still 2822 from the completed phase). Launch 12 went out\non this tick's code. Note for whoever reads its record: the throwaway is banked at d1a5875b4, so\na launch at a different HEAD re-times BOTH phases by the comparability rule -- that is correct\nand costs ~45 minutes, not a defect. When the pair lands, the ratio becomes real, criterion 1's\nsuccessor is answered, and nothing else stands between this atom and level 2.\n\nBOOKKEEPING STILL OWED, and still for the same reason: the map's `file_scope` names only\n`background/process_run_complete.py` + `tests/background/test_publish_gate_subject_is_head.py`\nwhile four ticks of work have been in `tools/measure_publish_gate_subject_cost.py` and its\ntests. `maturity_map.yaml` is again dirty with another lane's staged change, so widening it here\nwould land their half-finished work under this atom's message.\n\nSAME TICK, CAUGHT BY LAUNCHING RATHER THAN BY REASONING. Launch 12 went out on the commit above\nand its first log lines exposed a gap the completion rule had left one function over:\n`_drop_incomparable_ratio_phases` short-circuits when both ratio phases are \"already banked\",\nand that test was `name in phases` -- so the TRUNCATED baseline counted as PRESENT there while\ncounting as OWED everywhere else. The unit duly skipped a throwaway banked at d1a5875b4 as \"not\nre-run\" and set about re-timing the baseline at 7ef696ea8: a ratio spanning two commits,\nreported as the cost of the checkout, which is the exact defect that function was written one\ntick earlier to prevent. Stopped before it banked anything (`systemctl --user stop`, the unit\nwas still in the lock wait), fixed to read the same eligibility as every other consumer, and\nR15'd both ways -- the truncated case drops BOTH phases, a genuinely complete pair at one\nearlier commit still survives (or every launch re-pays 40 minutes), and mutation 8 (presence\nagain) reds the first of those. 88 passed. THE CLASS: a new rule must be carried to every\nconsumer of the notion it changes, or the older control keeps answering the old question --\nand the thing that caught it was launching the job, not re-reading the diff.\n\n2026-08-11, sixth tick. CRITERION 5 WAS NOT MET AND NOW IS. The level still does not move;\nthe measurement launch 13 (pid 43239, HEAD a6f4a5bb1, both ratio phases correctly dropped for\ncomparability) is alive and heartbeating in the publisher-lock wait, so criterion 1's\nsuccessor is still the one thing owed and this tick did not touch it.\n\nWHAT WAS WRONG. Criterion 5 asked for the `.last_tested_hash` semantics to be stated in ONE\nplace \"rather than inferred from two call sites\". `LAST_TESTED_HASH_CONTRACT` was written and\nthe box was ticked -- but the supervisor went on paraphrasing the write rule in two of its own\nprose sites (\"rewritten only on a PASS\"), so the count went from two statements to three. And\nthe guarding test compared the two modules' PATH expressions and grepped the contract text for\nthe names of its writer and readers. Neither touches the property the contract exists for. Its\nown last paragraph warns that \"anything that stamps this file without a green suite collapses\n[the cross-check] into a tautology and blinds the wedge draw\" -- and nothing anywhere ran the\nWRITER (`_run_gate_in`) and the READER (`supervisor._publish_gate_wedge_active`, the RUNG-1\npriority-zero draw) against one file. A REPORTED STATE IS NOT A CONTROL: the collapse the\ncontract describes could have happened in full with the suite staying green.\n\nTHE REPAIR IS A COMPOSITION, not another assertion about the prose. Three tests drive both\nconsumers through one `.last_tested_hash`: a RED gate leaves the wedge draw ARMED (the\nnegative -- the ABSENCE of a stamp at HEAD -- which is the path that was silent for 2h17m on\nboth 2026-07-23 and 2026-07-24); a G