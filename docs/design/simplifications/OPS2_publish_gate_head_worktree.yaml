  WHAT WAS WRONG. Criterion 5 asked for the `.last_tested_hash` semantics to be stated in ONE
  place "rather than inferred from two call sites". `LAST_TESTED_HASH_CONTRACT` was written and
  the box was ticked -- but the supervisor went on paraphrasing the write rule in two of its own
  prose sites ("rewritten only on a PASS"), so the count went from two statements to three. And
  the guarding test compared the two modules' PATH expressions and grepped the contract text for
  the names of its writer and readers. Neither touches the property the contract exists for. Its
  own last paragraph warns that "anything that stamps this file without a green suite collapses
  [the cross-check] into a tautology and blinds the wedge draw" -- and nothing anywhere ran the
  WRITER (`_run_gate_in`) and the READER (`supervisor._publish_gate_wedge_active`, the RUNG-1
  priority-zero draw) against one file. A REPORTED STATE IS NOT A CONTROL: the collapse the
  contract describes could have happened in full with the suite staying green.

  THE REPAIR IS A COMPOSITION, not another assertion about the prose. Three tests drive both
  consumers through one `.last_tested_hash`: a RED gate leaves the wedge draw ARMED (the
  negative -- the ABSENCE of a stamp at HEAD -- which is the path that was silent for 2h17m on
  both 2026-07-23 and 2026-07-24); a GREEN gate at the same HEAD makes the identical wedged state
  read as STALE. Those two are each other's mutation on ONE variable, the suite's return code,
  with both sides driven by the real writer -- so the draw demonstrably tracks the gate's actual
  verdict rather than the presence of failures in a file, which is what makes it a cross-check
  and not a second reading of one source. The third stamps the hash after a genuinely failed run
  and the draw goes silent: the tautology, made to actually happen.

  THE DIVISION OF LABOUR IS PROVEN, not assumed, and that was worth the fourth mutation. R15
  BOTH WAYS, FOUR MUTATIONS RUN, source restored byte-identical after each (`git diff --stat`
  clean): the writer's `rc == 0` guard loosened reds the ARMED test (and two pre-existing writer
  tests with it); the reader's independence branch deleted reds the stale test and the tautology
  test; the supervisor's `LAST_TESTED_HASH_FILE` declaration pointed at a different filename reds
  only the OLD path-expression test. So the old control covers DIVERGENCE and the new ones cover
  SEMANTIC COLLAPSE, and neither was standing in for the other.

  The supervisor's two paraphrases are now citations of the contract, and a fourth mutation
  (renaming the contract out from under them) reds `test_the_supervisor_cites_the_contract_
  instead_of_restating_it`. That test states its own limits in its docstring rather than
  implying more: it catches the citation being deleted and the contract being renamed or removed
  (the name is resolved on the real module, not grepped), and it CANNOT detect a paraphrase
  drifting in meaning -- prose cannot be diffed against prose. Semantic drift is caught
  behaviourally by the three composition tests or not at all; the citation only guarantees one
  findable place to change.

