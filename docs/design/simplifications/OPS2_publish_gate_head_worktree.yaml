ned, quietly, for nine draws. An exit criterion is the only thing standing\nbetween an atom and a level; this one had no subject.\n\nTHE CLASS, filed here from a side this project has not had it from before: an elimination must\nmove the controls that pin it, and retiring a configuration must not starve the control that\nreads its evidence -- both were done, and neither covers the CRITERION THAT CONSUMES THE\nVERDICT, one level above any instrument. The instrument was made honest about a question the\nmap was still asking wrongly.\n\nCRITERION 1 RESTATED, and deliberately not weakened into something this atom can pass: it is\nmarked SUPERSEDED with its cause and commit, it says DO NOT re-enable reuse to chase the 1.3x,\nit says the supersession is not the criterion being met, and its successor is a REPORTED number\nrather than a bound -- the throwaway/in-tree ratio, i.e. what the cold subject costs every\npublish cycle, which is the permanent tax the elimination made unavoidable. The owed\n`in_tree_baseline` is carried INTO the restatement, so the atom still cannot certify on an\nestimate.\n\nR15 BOTH WAYS, MUTATIONS RUN, and the pin is a BICONDITIONAL because the other direction is the\nsame defect mirrored: a map declaring the criterion superseded while the code shipped reuse\nwould let a re-enablement land unread. `test_the_exit_criterion_agrees_with_the_checkout_\nmechanism_that_ships` grades the LIVE map against the LIVE switch -- so it can red mid-tick with\nno source change, which is wanted, the map being the evidence. MUTATION 1, on the live path:\n`prc.REUSE_HEAD_CHECKOUT = True` against the unchanged map REDS (\"the switch went back on and\nthe criterion nobody re-read now understates what the atom owes\"). MUTATION 2 feeds the\npredicate the REAL pre-elimination wording quoted from 88f851846 -- not a fixture invented to\nfail -- and it REDS against a shipped-False box while correctly PASSING against the shipped-True\nbox it was written for. Vacuity is answerable by something that cannot legitimately go empty:\nexactly one OPS2 entry must be found and it must carry an `EXIT:`.\n\nTHE FIVE-TICK BOOKKEEPING DEFERRAL IS DISCHARGED, and its cause was not forgetfulness.\n`file_scope` now also names `tests/background/test_process_run_complete.py`. It could not land\non ticks 4-8 because a pathspec commit takes the INDEX version of a file and\n`docs/design/maturity_map.yaml` was dirty each time with another lane's staged hunk. This tick\nthe collision was H27 Expert Hour #19's whole set, staged coherently at 21:04-21:06Z by a tick\nthat ended without committing -- so it was ADOPTED and landed under its own description first,\nrather than being swept into this atom's commit or deferred a sixth time.\n\n\n2026-08-11, tenth tick. THE LEVEL DOES NOT MOVE AND THE OWED ITEM IS UNCHANGED: a completed\n`in_tree_baseline`. Launch 14 (pid 318057, transient unit, session leader) is ALIVE and inside\nthat phase's suite at the time of writing, so it was not polled, not re-launched and not killed\n-- and this tick did the work that does not depend on it. What it found was that the number that\nrun is about to produce would have been labelled with a commit that did not exist when it was\nmeasured.\n\nOBSERVED, IN THE BANKED RECORD, WITH GIT AS THE SECOND WITNESS. Launch 14's throwaway phase is\nbanked `\"head_sha_at_run\": \"a322429d1\"` beside a field comment calling that \"the SHA THIS phase\nactually ran against\". The launch started 20:29:36Z, the next phase entered 21:33:51Z and the\nphase ran 1873.7s, so its suite STARTED at ~21:02:37Z -- and `git show -s --format=%cI\na322429d1` is 21:26:07Z. The label was made twenty-three minutes AFTER the suite it names had\nstarted, into a repo whose contents could not reach a `git archive` extraction that had already\nhappened. `head_sha_at_run` was `prc._head_sha()`, read in the LIVE repo AFTER the suite\nreturned, so it named whichever commit another lane landed during the ~31-minute run. For a\ncheckout it is the wrong REPO as well as the wrong MOMENT: a checkout is its own repo whose\n`.git/HEAD` is the extracted SHA (`_make_checkout_a_repo`), and nothing was asking it.\n\nWHY IT BIT THIS ATOM AND NOT SOME OTHER. That field is the ONLY input to the cross-commit\ncomparability guard -- the rule ticks 4 and 8 exist to enforce, that the ratio may not span two\ncommits. End-stamping makes that guard grade a label belonging to neither subject, and it fails\nBOTH ways. FAIL-OPEN, and likeliest in exactly the conditions this harness waits for: throwaway\nextracted at X, drifting to Z over 31 minutes; baseline starts at Z and the box stays quiet, so\nit ends at Z too; `spanned` sees ONE commit and the ratio is computed across X and Z and\npublished as the cost of the checkout. That is the defect the guard was written twice to\nprevent, arriving through the door it was watching -- and it needs a QUIET second phase, which\nis the state this harness blocks until it gets. FAIL-CLOSED the other way: an honest pair\nrefused because one unrelated commit landed during phase two, at ~40 minutes a time.\n\nTHE REPAIR IS TO ASK THE SUBJECT, not the repo thirty minutes later. `_subject_sha(cwd)` puts\nthe question to the tree the suite ran in, BEFORE it starts (`head_sha_at_run`) and again after\n(`head_sha_at_end`), with `subject_changed_during_run` and the phase's own `started_at`/\n`ended_at`. A checkout cannot move under itself, so on that phase the flag being True would\nitself be evidence of a bug; the working tree can and does.\n\nA MOVED SUBJECT IS REPORTED, NOT REFUSED (`ratio_subject_moved_during`), and the asymmetry\nagainst the SHA rule beside it is the judgement worth recording. A phase that took a small edit\npart-way through is ONE subject, not two; the in-tree phase runs in a shared tree other lanes\ncommit to every few minutes; so refusing on it would make this atom's owed number permanently\nunreachable -- the guard-that-waits-for-a-gap shape, which this project has already filed from\nthe other side. It is named in the artefact instead, so no reader takes the ratio for a\ncomparison of two frozen trees.\n\nR15 BOTH WAYS, EIGHT MUTATIONS RUN, source restored byte-identical after each (`cmp` against a\npre-mutation copy, not an eyeballed diff): stamp from the live repo -- the pre-repair behaviour\nexactly -- reds 3; stamp after the suite reds the relabel test; the mid-run flag hardcoded False\nreds it; `ratio_subject_moved_during` dropped reds 1; a moved subject made a REFUSAL reds the\nratio assertion (the starving direction is pinned too, or the fix would be free to become the\nnext wedge); the writer dropping `started_at` reds 2; and the postdating criterion made\nnever-firing and always-firing reds its oracle both ways. 101 passed in\ntests/tools/test_measure_publish_gate_subject_cost.py, 245 across the publish-gate family, ruff\nclean on both touched files.\n\nTHE NEW POPULATION CONTROL IS PUT ON TRIAL RATHER THAN ASSUMED, because it currently grades\nZERO. `test_no_banked_phase_stamps_a_commit_that_postdates_its_own_start` reads the live record\nand checks each phase's stamp against GIT'S OWN commit dates -- an independent source, and the\nthing that would have caught this from the repo alone with no timeline reconstructed by hand.\nNothing banked carries `started_at` yet, so its population is empty, and this module has already\nbeen taught what an empty population control is worth: the vacuity half is answered by the\nWRITER test (which cannot go empty), and the criterion's ability to FIRE is proven by an oracle\n-- a real repo and two records differing in one value either side of the stamped commit's own\ndate, one of which it must flag and one of which it must not.\n\nWHAT WAS DELIBERATELY NOT DONE. The mis-stamped banked phase is NOT relabelled: its true SHA is\nbounded (between 88f851846 and 3f8ec3169) but not known, and writing a plausible one would be\nfabricating evidence -- it must be re-timed, and no action is needed because its stamp already\ndiffers from HEAD and `_drop_incomparable_ratio_phases` drops it at the next launch. The live\nrecord was not edited at all: launch 14 owns that file and racing its checkpoint would cost the\nrun that answers the owed item.\n\nQUEUED WITH A NAMED RECOMMENDATION, not left open: PIN THE PAIR. The two phases will keep\nlanding at different SHAs by luck, because ~30 minutes of quiet is a gap this tree does not\ngive. The design that removes the luck is to run `in_tree_baseline` FIRST, take its start SHA S,\nand extract the throwaway from S rather than from live HEAD -- comparable by CONSTRUCTION rather\nthan by a quiet window. It needs an optional SHA parameter on `prc._head_checkout()`, which is\npublish-path code whose gate scope an undersized change wedges, so it is not taken beside a live\nmeasurement. Filed:\ndocs/staging/WORKER_FINDING_A_PHASE_WAS_STAMPED_WITH_A_COMMIT_MADE_AFTER_IT_STARTED_2026-08-11.md\n\nADOPTED, NOT REBUILT, AND IT IS THE THIRD TICK RUNNING THIS HAS BEEN NEEDED: the NINTH tick's\nown work was still dirty in the shared tree -- its 117 new lines in\ntests/background/test_publish_gate_subject_is_head.py\n(`test_the_exit_criterion_agrees_with_the_checkout_mechanism_that_ships` and its\npre-elimination-text mutation), plus the ninth-tick paragraphs in this file and in\ndocs/design/OPS2_PUBLISH_GATE_HEAD_CHECKOUT.md, with no process of that tick alive. Verified\nBEFORE adopting rather than after: they are green inside the 245-passing family run above and\ncarry no other lane's hunks. The map restatement that tick made HAD landed, so the criterion the\ndrawer reads is correct; only the controls pinning it were invisible to anyone but this tree.\n\n\n2026-08-12, thirteenth draw. THE LEVEL MOVES: 0 -> 2, self-certified into\ngate_authorizations.jsonl with the evidence. Twelve prior ticks each closed with \"THE LEVEL DOES\nNOT MOVE AND THE OWED ITEM IS UNCHANGED\", and each was right at the time, because the owed item\nwas a number that another launch might still produce. It no longer is, and that is the whole\ndifference this tick turns on.\n\nWHAT CHANGED IS THE MODALITY OF CRITERION 1, not anything about criteria 2-5. On 2026-08-12 the\nceiling ratchet reached its terminus: a phase killed against its 10240MB ceiling banks a 10240MB\ndemand floor, which needs 12800MB at the stated 1.25x headroom, and this box can spare 11816MB\nwith the publisher's 4096MB reserve intact -- so `_bounded_argv` REFUSES the phase before it\nstarts. \"Not yet measured\" became \"cannot be measured here\". An atom held at level 0 on a\nmeasurement its hardware is proven unable to take is the empty-feasible-set defect Rule 0 names,\nand the honest close is to certify what was built and carry the number as a RESIDUAL.\n\nVERIFIED INDEPENDENTLY OF THE RECORD THAT ASSERTS IT, because certifying on the artefact's own\n`ratio_unavailable_because` string would be reading a claim back to itself. The terminus was\nre-derived from the kernel this tick: /proc/meminfo MemTotal 16293956kB -> `_box_safe_cap_mb()`\n11816, against `PHASE_MEMORY_DEMAND_FLOOR_MB` 10240 x `CEILING_HEADROOM` 1.25 = 12800, so\n`PHASE_CEILING_IS_SUFFICIENT` is False. It is a PREDICATE over the live box and the live record,\nnot a figure someone wrote down -- which also means it self-corrects: on a bigger box it returns\nTrue and the phase runs, with no text to re-read.\n\nCRITERIA 2-5 WERE RE-RUN RATHER THAN INHERITED FROM THE PRIOR TICK'S NOTE. 47 passed in\ntests/background/test_publish_gate_subject_is_head.py; 181 passed across that module,\ntests/tools/test_measure_publish_gate_subject_cost.py and tests/background/test_gate_authorization.py\nin one run. Criterion 4's four properties were read at the source, not counted by name: each\ndrives the real `prc.run_fast_tests` and each carries its own mutation -- a not-even-parsing\nuncommitted edit to a tracked file leaves the verdict GREEN and stamps the hash, the same\nscenario with `_run_gate_in` pointed back at PROJECT_DIR REDS, the gate child asserts its OWN\n`os.getcwd()` under HEAD_CHECKOUT_ROOT (so a lost `cwd=` keyword cannot pass), an unmaterialisable\ncheckout blocks and leaves no hash while a permissive verdict publishes unverified, and the\nthrowaway dir is removed on a raising run. Criterion 2's bound clears a floor READ FROM THE LIVE\nBANKED RECORD (4500 vs implied_timeout_floor_2x 3752), not from a second transcription of itself.\n\nWHAT IS DELIBERATELY NOT CLAIMED. Criterion 1 is NOT met and the certification says so in those\nwords: the throwaway/in-tree tax stays ESTIMATED. It is carried in the map as a RESIDUAL rather\nthan an open exit criterion, with the instruction to re-open at level_target 3 on a bigger box\nand NOT to re-draw here for it -- the refusal is the correct outcome, and a fourteenth relaunch\nwould reproduce the kill that produced the floor, which is exactly what launches 12-14 each did.\n`expert_hour` stays `not_attempted`, which is the other reason this is 2 and not 3.\n\nTHE CLASS, filed because this atom is now the second instance and the first was read as\nbookkeeping: an exit criterion can outlive the ability of the box to satisfy it, and the failure\nmode is silent -- the atom stays drawable, every draw does real work, and the level never moves,\nso the queue never reports it as blocked. The distinguishing question is not \"is the criterion\nmet?\" but \"can any future draw meet it?\", and nothing in the draw machinery asks it. Here the\nanswer became NO through a mechanism that already existed (`PHASE_CEILING_IS_SUFFICIENT`) and\nthat nothing consulted at certification time.\n"
