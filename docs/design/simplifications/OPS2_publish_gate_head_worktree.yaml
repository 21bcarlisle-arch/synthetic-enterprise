build_note: |
  2026-08-11. Criterion 1 is NOT met and the level does not move: `in_tree_baseline` has
  never been timed, so there is no ratio. What landed this tick is the INSTRUMENT, which was
  lying about its own deaths.

  The 2026-08-10 22:28Z launch was recorded (in a filed worker finding, as `observed`) as
  having died in the acquire poll. `journalctl -k` says otherwise: the OOM victim was pid
  3272589, a CHILD of the unit's python 3244117 -- the BASELINE phase's pytest at 12.9G anon
  RSS, `global_oom`. It had taken the lock and was in the suite. The finding's proposed repair
  (a memory guard in the acquire poll) would not have fired.

  Cause of the misread, and the actual defect: the phase banner prints BEFORE the wait, there
  was no log line for taking the lock or starting a suite, and `heartbeat` is called only from
  the three wait loops -- so the artefact froze the instant work began and stayed frozen for
  ~20 minutes. `_InFlight` now carries phase + stage + MemAvailable continuously and
  checkpoints on every stage change; the next launch republishes a leftover marker as
  `previous_launch_died_in_flight`. R15 both ways, mutations RUN: no-op `stage()` reds 4
  tests; one literal for every stage reds the differential; a dropped `clear()` reds the
  chosen-ending test; the prior read moved below the first checkpoint reds the republish test.
  67 passed in tests/tools/test_measure_publish_gate_subject_cost.py.

  Residual, filed not fixed: the suite really does reach 12.9G, because `_argv_without_x`
  makes the measured subject strictly larger than the gate's own `-x` run. See
  docs/staging/WORKER_FINDING_THE_MEASUREMENTS_SUBJECT_IS_LARGER_THAN_THE_GATES_2026-08-11.md.

  2026-08-11, second tick. Criterion 1 is STILL NOT met and the level does not move:
  `in_tree_baseline` remains untimed, so there is still no ratio. What landed is the thing that
  had killed three launches before they could produce one.

  MEASURED FIRST, as the refuted sibling taught. The box was already running both arms of the
  A/B the finding asked for -- the live publisher's gate (`-x`, pid 3756987) and an
  `enumerate_publish_gate_reds` sweep (no `-x`, pid 3768864), argv identical apart from that one
  flag, started a minute apart -- so the number cost an observer rather than a third 20-minute
  suite. `tools/sample_gate_rss_premium.py` samples both trees' `VmHWM`. Partial at the time of
  writing: `with_x` finished at an exact 3.15G peak; `without_x` passed 5.34G still climbing, so
  its figure is a LOWER BOUND and the record's verdict says `inconclusive` rather than quoting
  it. Directionally the finding's `inferred` `-x`-premium claim is holding.

  BUILT (option A): each phase's pytest runs inside `systemd-run --user --scope` with `MemoryMax`
  and `MemorySwapMax=0`, so an over-large phase dies alone instead of global-OOM killing a box on
  which the publisher is a candidate victim every time. A missing `systemd-run` raises `_Unbounded`
  -- BLOCKS the phase, records `blocked` in the artefact, exits non-zero -- deliberately not a
  `_Deferred`, because waiting does not grow a systemd-run. Every phase record now carries
  `memory_max_mb`, an `inferred`-labelled `hit_memory_ceiling`, and `subject_larger_than_the_gates`
  (consequence 2 of the finding: a reader re-deriving the timeout "from the measured runtime"
  would not otherwise know the number carries an `-x` premium).

  THE CONTROL CAUGHT ITSELF, and this is the part worth keeping. `MemoryMax` alone does not kill
  -- it reclaims into this box's 4G of swap: a 300MB allocation completed inside a 128MB ceiling,
  rc=0. So the first version of the bound was throttle-not-kill, i.e. a 12.9G suite would have
  thrashed the box rather than global-OOMed it, which is the same harm slower. Worse, dropping
  `MemorySwapMax=0` SURVIVED as a mutation, because the box was already 3G into swap and the
  child died anyway -- ambient state was deciding the verdict. The property is therefore pinned
  by reading `memory.max` and `memory.swap.max` back from the scope's OWN cgroup, not by a
  behaviour that only usually follows. R15 both ways, six mutations RUN: wrapper dropped, fail-open
  on missing systemd-run, `MemorySwapMax=0` removed, `MemoryMax` removed, discriminator ignoring
  the box, block exiting 0 -- all six red; source restored byte-identical after each.
  75 passed in tests/tools/test_measure_publish_gate_subject_cost.py.

  THE MEASUREMENT COMPLETED within the tick. gate_x_premium_rss.json reads `complete: true`,
  verdict `supported`: `with_x` 3.15G, `without_x` 5.34G, ratio 1.69. Neither arm was OOM-killed
  (`journalctl -k` in the window shows only CONSTRAINT_MEMCG kills, and those are this tick's own
  R15 test scopes), so both are peaks of runs that ended on their own. Contended, and recorded as
  such -- sharing a box biases both DOWN through reclaim, so 5.34G if anything under-states.

  And the repair is confirmed BY THE KERNEL rather than by assertion. The original failure was
  `oom-kill:constraint=CONSTRAINT_NONE ... global_oom`; the same log now shows this tick's
  over-large child dying as `constraint=CONSTRAINT_MEMCG ... oom_memcg=.../ops2-bound-selftest
  .scope`. That is the exact discriminator the finding quoted, flipped.

  Still open, and the measurement SHARPENED it rather than closing it: 5.34G does not reconcile
  with the 12.9G the measurement's own BASELINE phase reached before the global OOM. Same
  `-x`-less argv, same in-tree subject, a 7.5G gap. Two candidate causes, neither measured: the
  measurement sets SIM_FAST_MODE=1, and it redirects `--basetemp` into HEAD_CHECKOUT_ROOT on
  /tmp, which is a TMPFS on this box. So the `-x` premium is real and measured, but it is NOT the
  whole account of the 12.9G and must not be read as one.

  `PHASE_MEMORY_MAX_MB` therefore STAYS at 8192 and is deliberately not tightened to the measured
  peak: 8G is 1.5x the measured 5.34G and well under the 12.9G lethal point, and tightening to
  ~6G on a number whose 12.9G sibling is unexplained would wedge the measurement the bound exists
  to protect. What unblocks the derivation is a peak from an UNCONTENDED, completed phase;
  `resource.getrusage(RUSAGE_CHILDREN).ru_maxrss` around the phase's `subprocess.run` is the
  cheap exact way to get one, and it survives the scope teardown that hides `memory.peak`. Not
  built. Parked in docs/staging/in_progress/ with that as its named blocking sub-item.
