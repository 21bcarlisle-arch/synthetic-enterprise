atom_id: SITE9_harness_tab_and_director_record
map_notes:
  origin_note: 'The tab that carries the two-seat model, the named failure classes, the honest count of what broke and why, and the known-limitations section re-homed from Proof. REVISION 2026-08-18 (brief revised after this atom was minted): it gains four things and stops being one tab''s worth of work -- (a) THE METHOD ITSELF, legible to an outsider: how work is chosen and sequenced, what the lanes and the work-item map are, how maturity levels are claimed and proven, and how a claim is REFUSED when its evidence is missing; (b) HOW DISCOVERY FEEDS KNOWLEDGE, the loop from finding to measurement to repair to a landed Knowledge page, with the link between the two tabs visible, because a self-producing system that also produces its own domain knowledge is a stronger claim than either alone; (c) OBSERVABILITY including the classes of blindness the system has found in its OWN instruments; (d) CODEBASE TRACKING for SIM and Company SEPARATELY -- modules, tests, coverage of what ships, wall crossings over time, orphaned work, and the split between built-new and repaired -- which the brief is explicit is not housekeeping but the direct measurement of the growth being claimed. Note (a) collides with §6.2''s no-internal-vocabulary rule, and the revision grants Harness its SINGLE named exception for exactly that reason. Hidden inside the brief''s §4 is a publication act it does not name: `/director/` is currently INTERNAL -- deployed, noindex, off-nav BY CHOICE, named in `INTERNAL_DOORS`. Folding it into an advertised tab publishes the director record to crawlers for the first time. The director accepted publishing it (proposal §6 Q3) AND attached the programme''s single condition.'
