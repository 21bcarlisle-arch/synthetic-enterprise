atom_id: EP16_anchored_generators
simplifications:
- '2026-08-17 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code written and nothing in `file_scope` touched (it is empty) -- this atom is `loop_stage: idle` and EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 1 makes DISCOVER/FRAME available while BUILD is not. Full pass: `docs/design/frame/EP16_ANCHORED_GENERATORS_FRAME.md`. Measured at HEAD 78d4f46f5, with the map, this store file and docs/design/frame/ all clean in the shared tree at draw time.


  THE DUPLICATE-RISK CHECK AGAINST W1_2 SURVIVES AND THE ATOM IS LARGER THAN ITS NAME. W1_2 is not merely ''curves'' -- regime-switching Markov elec generator + coupled gas generator, wired end-to-end through the full replay, with an R15-hardened six-moment block-bootstrap fidelity check. That is not re-opened. But of the four axes EP16 names -- weather, price, demand, population -- EXACTLY ONE IS GENERATED FORWARD.


  FINDING 1 -- THE FORWARD WORLD IS PRICES. `run_forward_scenario` extends two feeds only (`build_extended_price_feeds` -> elec HH SSP + daily NBP) and injects them by monkey-patching the two price loaders. `run_scenario.py` never imports the weather engine. Weather: generator EXISTS and is fitted to the real 2016-2025 panel (`fit_national_macro_model`/`simulate_national_macro`/`fit_regional_cholesky`) -- exactly the anchoring shape this atom asks for -- but its only non-test callers are a calibration study (run_phase3c_calibration) and a demonstration (weather_tail_demonstration). One caller short of the world. Demand: no generator, follows weather. Population: EP17''s subject.


  FINDING 2 -- THE FLEET IS SILENTLY FROZEN AT 2025. `renewable_capacity_trend.capacity_wind/solar` return the last fitted year''s value, byte-identical, for every future year: 2026 = 2029 = 2031 = 137740.7127 wind / 15417.4860 solar (2016: 97724.1792 / 13132.4091). No raise, no flag, no data_regime marker. The fleet grew ~41% across the fitted window and W1_7''s own header calls that growth ''the single biggest driver of the falling-baseload / rising-volatility regime the price engine tries to reproduce'' -- switched off in a generated 2031 while the price generator independently asserts a 2031 distribution only a different fleet could produce. Cheapest fix on the list, and it is a decision not an algorithm: RAISE past the fitted window (R15: an unavailable anchor is a failed anchor) or extrapolate against NESO FES / DESNZ.


  FINDING 3 -- NO WEATHER MEANS NO WINTER, AND THAT IS ~95% OF A COLD DAY''S DEMAND. `_weather_adjusted_shape_fn` falls back on `if mean_temp is None: shape = list(base_shape)` -- silent, no counter, no marker. THE BASELINE IS CLEAN (checked before asserting): REPORT_END 2025-06-07 is exactly the last row of the weather panel (C1..C4.csv 2016-01-01..2025-06-07, 3447 rows; weather_means_for_customer(C1) n=3446, last key 2025-06-07), so the run window is pinned to the data. The forward path removes the pin: a default 2026-2029 run covers 1668 days (2025-06-08 -> 2029-12-31) with mean_temp None -- 100% of the generated window. Measured through the real `build_demand_shape` on an 8.00 kWh base day: gas_boiler gas 7.25 (20C) / 38.75 (12C) / 101.75 (5C) / 164.75 (-2C); electric_storage elec 7.25 / 19.06 / 42.69 / 66.31. The fallback returns 8.00 on every one of those days -- under 5% of a -2C day''s gas. THE PRESETS ARE WEATHER-NAMED AND THE PARAMETER IS PRICE-ONLY: ScenarioParams'' 15 fields are all price (mode means/stds, negative-price frequency, dunkelflaute frequency/duration/multiplier, regime persistence), so `stress_dunkelflaute_2027` raises prices for a still, dark, cold spell while demand stays flat. The correlation that kills real suppliers -- volume peaking WHEN prices spike -- is structurally absent from every generated world, in the one preset built to simulate it. No gap is measurable on this coupled pair.


  FINDING 4 -- R13''S WALL IS ENFORCED OVER A ROTATION SET OF ZERO, AND THE WORLDS THAT RUN ARE A PYTHON DICT. Two disjoint world systems. WALLED AND EMPTY: spine.py implements the R13 ratification wall properly (frozen, no setter, rotation_set excludes unratified, select_for_rotation raises) over 4 curriculum YAMLs -- history_replay ratified:true but by its own comment ''not a rotation member'', and crisis_2021_22 / neso_central / supply_glut all ratified:false. Measured live: rotation_set() -> [], n=0. Its only non-test consumer, run_rotation.py, has zero non-test callers at HEAD (re-verified this pass, not inherited from the EP17 FRAME). UNWALLED AND LIVE: bimodal_generator.SCENARIOS + GAS_SCENARIOS are plain dicts of five named difficulty worlds x 15 numeric parameters -- what run_forward_scenario runs, what --scenario selects from, what scenario_comparison sweeps -- with no ratified field, no provenance, no ratification block, no version, no artefact, and no test asserting any of it. R13 says difficulty changes are ''named, versioned, director-authored artefacts, never silent parameter drift''; mechanically that is enforced for three worlds that can never run and waived for five that do. WRONG POPULATION, widest form -- the wall is real, tested, and pointed at an empty set. It has already produced a false statement in live code: intraday_shape.py''s header asserts per-scenario severity is ''already director-owned via bimodal_generator SCENARIOS'' and uses that as its reason to add no dial of its own. Nothing owns those values but the file they sit in. (Authorship is NOT evidence either way: the git author of the creating commit 64dc9b8c7 is Rich Carlisle, the identity shared by every commit in this repo including agent commits. The evidence is the absent apparatus next to four spine worlds that carry it.)


  FINDING 5 -- THE ANCHORING CONTROL COVERS ONE AXIS, RUNS ONLY IN THE SUITE, AND ITS LIVE VERDICT IS A DIVERGENCE. fidelity_check.py is the template and is good work: six moments vs a BLOCK BOOTSTRAP of real returns, each added after a named red-team beat the previous set, R15 fail-open on empty/constant/short/non-finite series and non-finite CIs. Three limits. (a) ONE AXIS: generated price returns vs real; nothing checks generated weather, demand, fleet, or the cross-axis correlation of finding 3 -- where the fidelity of a WORLD lives as distinct from a SERIES. (b) IT CAN ONLY JUDGE THE BASELINE: by construction it checks the preset expected to agree with history, so the four counterfactual presets have no reference and no machine-checkable tether -- their anchoring is a markdown file (price_distribution_high_renewables_2027.md, 15721 bytes, per-parameter H/M/L confidence) and NO TEST PINS ANY PRESET VALUE TO ANY SOURCED NUMBER (grep upper_mode_mean|lower_mode_fraction|dunkelflaute_events_per_year in tests/ returns only hand-built fixtures). THIS IS EP16''S ACTUAL SUBJECT -- what ''anchored'' means for a world that never happened; a moment-match cannot answer it, a sourced-parameter-provenance control can, and that is a different mechanism. (c) ONLY CALLERS ARE TESTS: reconcile_baseline_fidelity is invoked from test_run_scenario.py and nowhere else; run_forward_scenario does not call it, so no generated world is gated on it. And its recorded verdict is an OPEN divergence: baseline_2025 under-clusters volatility vs real (vol_clustering ~0.21 generated vs ~0.42-0.51 real, robust across every real window), tracked against W1_2. Correctly handled under R12 -- on the one axis where tether is measurable, the generator is measurably off and knows it.


  WHAT EP16 IS, RESTATED: (1) give the built weather generator a forward caller and route demand through it -- the item that makes stress_dunkelflaute_2027 mean its name and restores a measurable gap on this coupled pair; (2) stop the fleet freezing silently past 2025; (3) move the curriculum wall onto the population that actually runs, and correct intraday_shape.py''s false guarantee; (4) define what ''anchored'' means for a counterfactual world -- parameter provenance, EP16''s own build, covered by no existing mechanism. level_current stays 0 (the deliverable is a mechanism, not this doc). R12: no published number tuned, and verified LATENT not live -- run_output_latest.json carries no scenario_name and run_history.json has zero, so no forward-scenario run has ever been published. R13: no curriculum value authored, proposed or changed.'
map_notes:
  origin_note: 'R13 is the entire design constraint, not a side note: the BASELINE world may change only for fidelity-to-reality reasons decided BLIND to company P&L, and the CURRICULUM (which generated worlds the company actually lives through) is the director''s, named and versioned. This atom builds the generator; it may never choose the worlds. A generator whose parameters drift in response to company results is the goal-seek failure the whole rule exists to prevent, and the agent controls both sides of that wall.'
  name: 'Anchored generators: synthetic but externally-calibrated worlds (weather, price, demand, population) whose generating parameters stay tethered to real observed distributions, so a generated 2031 is a plausible world rather than an invented one. Named in the ruling §1 as an Epoch-4 floor item. W1_2_generate_futures (SATURATED) generates forward CURVES; this is the whole-world generator with its anchoring discipline.'
