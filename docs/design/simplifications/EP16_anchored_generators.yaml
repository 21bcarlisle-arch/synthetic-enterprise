  FINDING 15 -- THE SPLICE LEAVES A 207-DAY HOLE IN BOTH FEEDS, IN EVERY FORWARD RUN, AND NO ARGUMENT CLOSES IT. `run_scenario.py:155` is `scenario_actual_from = max(year_from, latest_hist_date.year + 1)` -- YEAR-GRANULAR. Real history ends 2025-06-07 on both feeds (elexon_ssp_full.json 168,026 rows, 2015-11-07..2025-06-07; NBP the same last day), so the generated half starts 2026-01-01 and NOTHING generates 2025-06-08..2025-12-31. Measured on the shipped function with real inputs and default arguments (central_2027, 2026-2029, seed s1): elec span 2015-11-07..2029-12-31, 4,962 days present, EXACTLY ONE GAP of 207 days; gas span 2016-01-01..2029-12-31, 4,907 days, THE SAME 207-day gap. That is 14.2% of the 1,461-day forward window the run exists to produce, sitting immediately before it. `year_from` is floored by the `max`, so year_from=2025 still yields 2026 -- the parameter that looks like it controls the splice cannot move it, and a caller who wants a contiguous world has no way to say so. Silent at every layer: no warning; the emitted records ARE correctly tagged data_regime synthetic (the epistemic-wall marker is present and right); and settlement.py''s own docstring states the join rule -- ''periods with no matching price record are skipped, not guessed''. Skipping is the honest response to ONE missing settlement period; applied to 207 consecutive days it silently deletes six and a half months of trading from the middle of the run.



  FINDING 16 -- THE TWO CONTROLS OVER THIS SEAM ARE A TAUTOLOGY AND A FIXTURE THAT ENDS ON THE ONE DAY OF THE YEAR THE RULE IS RIGHT ABOUT. (a) `test_build_extended_no_date_overlap` asserts `elec_dates == sorted(set(elec_dates))` where `elec_dates` was ITSELF produced by `sorted(set(...))` on the line above -- true for every possible input, verified directly on a list with five copies of one date and three of another. R15 killer pattern 1, INDEPENDENCE: the check tests the previous line, not the function. And its subject was OVERLAP anyway -- even a working version guards against the feed saying a day TWICE and is structurally blind to it not saying the day at all. (b) Both seam tests build `_hh_records(''2016-01-01'', ''2025-12-31'')`. A year-granular splice rule is exactly correct when history ends on 31 December and wrong by up to 364 days otherwise, so the fixture is the SINGLE DATE IN THE YEAR at which the defect cannot appear -- and `test_build_extended_scenario_dates_start_at_year_from`''s `assert scenario_dates[0] == ''2026-01-01''` is therefore not merely blind to the hole, it is the hole''s SPECIFICATION, written down and pinned. Not fail-open and not fail-silent: WRONG POPULATION -- a real control, correctly implemented, run against the one sample on which the rule it certifies is true. Same shape as pass 1''s finding 4 (the R13 wall enforced over a rotation set of zero), on a completely different mechanism.



  FINDING 17 -- THE CONSEQUENCE IS ASYMMETRIC BY COMMODITY, AND THE QUIET SIDE IS WORSE. The hole (207d) is wider than the pricing lookback (90d), so any renewal term whose window [start-90, start-1] lies inside it has no price records at all: term starts in 2025-09-06..2026-01-01, and the 365-day renewal cadence walks straight in. Measured by calling the SHIPPED renewal builders on the real spliced feed. A, spliced feed to 2029-12-31: 10 OF 15 ELECTRICITY CUSTOMERS RAISE ValueError, and 3 of 5 GAS schedules STOP EARLY (last term starts 2024-09-29 / 2024-12-29 / 2024-12-30). B, null control, history only to 2025-06-07: 0 of 15 fail. C, NULL CONTROL THAT MOVES THE SAMPLE AND NOT THE LAW -- same generator, same preset, same seed, same end date, same customers, the only change being that the 207 missing days are GENERATED instead of absent: 0 of 15 raise and 0 of 5 truncate, all reaching 2029. Every failure disappears; the mover is the hole, not the forward window, not the generator, not the customers. ELECTRICITY fails LOUD -- `renewals.py:129` calls generate_forward_price bare, no try, and `run_phase2b.main()` calls build_renewal_schedule unconditionally at line 998 with these exact arguments (elec_records = the spliced feed, effective_end = report_end = ''2029-12-31'') with no handler either. GAS fails SILENT -- `run_phase2b.py:503` wraps the same call in `except ValueError: if not schedule: bootstrap; else: break`; the catch was written for the cold start, so a schedule that hits the hole ENDS THERE AND RETURNS SUCCESSFULLY. C_IC3g 12 terms -> 7, C1g 15 -> 10, C4g 14 -> 9: THREE OF FIVE GAS CUSTOMERS HOLD NO CONTRACT AT ANY POINT IN THE GENERATED 2026-2029 WORLD, with no error, no log, and a gas book 40% smaller than the world was asked for. A generated future in which the company''s gas customers quietly cease to exist is not a curriculum the director chose. THIS CLOSES A CAVEAT PASSES 1-4 CARRIED AND COULD NOT EXPLAIN: every prior pass recorded, as an R12 latency check, that no forward-scenario run has ever been published. Re-verified from a second independent direction -- docs/observability/token-log.md holds 10,175 cache-access entries and ZERO carry phase=''36a_scenario'', the tag run_forward_scenario stamps on its own historical load. Passes 1-4 established that no such run reached an artefact; this pass supplies the reason: on default arguments the runner raises before it can produce one. LIMIT STATED RATHER THAN GLOSSED: run_forward_scenario was NOT executed end-to-end -- by finding 18 that costs ~3,500 live HTTP requests, the wrong spend for a bounded DISCOVER tick. What is observed is the shipped builders raising and truncating on the real spliced feed at the real call-site arguments; the production call also passes EFFECTIVE_EAC_KWH and a lookback_temps_fn, neither of which can prevent the raise, which occurs inside generate_forward_price on the empty window before either is read.



  FINDING 18 -- THE FORWARD RUNNER ASKS ITS OWN CACHE FOR A RANGE NO CACHE OF REAL DATA CAN EVER HOLD. `run_scenario.py:298` is `get_cached_prices(fetch_start, report_end)` with report_end=''2029-12-31'', and get_cached_prices returns None unless the cache covers the ENTIRE range (''no partial-cache serving'', correct policy) -- but the range requested ends in the GENERATED future. Measured: end 2025-06-07 HITS with 168,026 records; 2026-12-31, 2029-12-31 and 2031-12-31 all MISS. So the forward path takes the fallback EVERY TIME BY CONSTRUCTION: get_system_prices_range issues ONE HTTP REQUEST PER DAY over 3,502 days. Two consequences on EP16''s own subject. (1) The real half of every generated world is NOT PINNED -- it comes off the live API at run time rather than the committed cache, so the anchor of an ''anchored'' world is whatever Elexon serves that day, and settlement runs are revised (II->SF->R1->R2->R3->RF); a run is not reproducible from the repo alone. (2) The fetch is FAIL-OPEN by documented intent -- ''Days that return a non-200 response or no data are treated as zero records, not an error'' -- so an unreachable API yields an EMPTY historical anchor with no exception and build_extended_price_feeds then takes its no-history branch. R15: an unavailable anchor is a FAILED anchor, and this one reports success. Recorded precisely because the fix is nearly free: the runner already knows the real window, passing _REPORT_END to the fallback two lines later. (Inside main() the question does not arise -- the loader is monkey-patched at line 330 to return the pre-built feed.)



  FINDING 19 -- EVERY GENERATED DAY HAS 48 SETTLEMENT PERIODS; 23 DAYS IN THE SAME REAL CACHE DO NOT. Smaller, recorded because it is finding 16''s class -- a control pinning the defect -- on the CALENDAR rather than the join. `_expand_daily_to_hh` emits `range(1, 49)` unconditionally and test_expand_daily_to_hh_settlement_periods_1_to_48 pins it. Real histogram on the same cache: 48 x 3,468, 46 x 14, 50 x 9, 47 x 9, 45 x 1 -- the 46s and 50s being spring and autumn clock changes (2016-03-27, 2016-10-30, ...), 23 genuine 23- and 25-hour days. A generated world has none, so over 2026-2029 eight clock changes do not happen and any company logic keyed on the period count meets them in history and never again forward. The mirror-image defect is already live on the REAL half: settlement.py iterates range(1,49) against a 48-entry consumption shape, so on the nine real 50-period days periods 49-50 carry a price and no consumption and are dropped. SIZE NOT MEASURED -- filed as a fidelity gap in the world''s calendar, not as a quantified money finding.



  WHAT PASS 5 ADDS: an EIGHTH top-level item, and it goes to the front -- 8 MAKE THE SPLICE A JOIN (start the generated half the day after real history ends, not the next 1 January; make the year-granular floor a date; and assert contiguity across the seam in a test whose fixture history does NOT end on 31 December). Cheapest item on the list -- one expression and one fixture date -- and the only one currently STOPPING the runner rather than degrading it, with two riders: ask the cache for the range that exists (18), and decide whether a generated calendar carries clock changes (19). It also gives item 4c a third face: pass 3''s negative-price event is MIS-represented, pass 4''s intraday shape is NOT represented, and these 207 days are not represented AS ANYTHING -- an absence every downstream layer reads as ''nothing happened'' because each of them individually is right to skip a missing settlement period.



