atom_id: W2_24_housing_phase3_houses_change_on_their_own_timeline
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05 section 2 item 1, docs/staging/DIRECTOR_RULING_HOUSING_VALUE_CEILING_AND_SAMPLE_PHASE1_2026-09-05.md, verbatim: ''Phase 3: houses change -- the unprompted timeline (boiler replaced at end of life and returning condensing; PV and EV arriving on their own adoption curves; extensions; the physics and ceiling updating, the EPC falling behind).''


    THE WORD THAT CARRIES THE PHASE IS UNPROMPTED. A house that only ever changes because the company sold it something is a world that cannot refute the company: every improvement would be attributable to us BY CONSTRUCTION, and the counterfactual that the mission''s value-CREATED side depends on would not exist. Phase 3 is what makes ''we saved them money'' falsifiable, because some of the saving would have happened anyway. This is the same property the coupled-triad gate exists to protect, expressed on the housing axis.


    AND IT IS WHAT MAKES PHASE 2 BITE: the EPC ''falling behind'' is only a defect once the house moves underneath it, so the observation layer''s staleness is inert until this phase runs.


    STANDING EXCLUSION, and it is a ruling rather than an oversight: heat pump is out of all three phases until the director says otherwise (section 2 item 3), which is why the boiler timeline returns CONDENSING.'
