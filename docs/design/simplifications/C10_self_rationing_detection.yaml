atom_id: C10_self_rationing_detection
simplifications:
- '2026-07-13 BUILT to L3 (fork). Silent-hardship detector: discriminator = DROP-below-floor (never below-floor alone = the naive leak). Closes W2_8: detection gap 0.309, recall 0.69, ZERO false positives across 543 low-need confounds; the 59 misses are ENTIRELY the smart-meter/baseline-coverage blind spot (~63pct penetration -- a rationer with no prior baseline is indistinguishable from low-need; a DATA-COVERAGE gap, not model quality; not tuned). Raises PPM_SELF_DISCONNECTED + wires support response. epistemic PASS, 23 tests. || 2026-07-13 REGISTERED as a COUPLED-TRIAD company-side twin (COUPLED_TRIAD_DESIGN.md, director P1 THE_COUPLED_TRIAD.md, provenance proposal). W2_8 self-rationing. SIM knows who is heating-vs-eating (consumption collapses below plausible living levels despite a perfect payment record); the company must DETECT it through observables (consumption drop, no arrears signal) -- the hard case because the payment record looks healthy. GAP = harm-weighted fraction of detectable self-rationing harm MISSED (detection rate + false-negative harm). Wires the orphaned VulnerabilityFlag.PPM_SELF_DISCONNECTED taxonomy slot that has no detector today. Per the two binding rules (CLAUDE.md/A6): this company atom is not complete until it has faced the defeating world (W2_8_self_rationing) with a non-degenerate gap measured; and W2_8_self_rationing''s L3 blocks until this twin + gap exist. loop_stage idle: DISCOVER/FRAME workable now (the company-side capability design), BUILD ranks per dial. The gap metric + harm-cost weights (CURRICULUM, director-signed) are defined in A6_coupled_triad_gap_metric.'
- '2026-08-09 D18 OBSERVABLE CONFOUNDER CHANNEL (L0->L2). REGISTERED SIMPLIFICATIONS in the channel the company now reads: (a) COVERAGE and LATENCY are curriculum shapes [L] fixed from ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07 before any rate was measured -- CoT registered 0.55 at 7-240 days, void 0.35 at 14-150, own-scheme install 0.30 at 1-75, against a 60-day detection lag; no per-supplier or per-tenure variation is modelled. (b) At most ONE record per household, generated only where a confounder fired -- a CoT registration on an account whose consumption did NOT fall (the incoming occupier uses the same amount) is not modelled, which is harmless here because a record only bears on an observed drop, but it means record PREVALENCE in this world is not a supplier''s true CoT rate. (c) The install record carries a SCHEME-CONSTANT deemed saving (0.20), not a per-measure deemed score; the deemed-vs-actual performance gap is therefore present but not calibrated. (d) A record is trusted once received: no disputed move-in date, no evidence hierarchy, no erroneous/reversed CoT -- all real per the scope brief and all absent. (e) NOT simplified, and load-bearing: a VOLUNTARY_CUT leaves no record in any system ever, so the explainable CEILING is 0.4286 of false flags rather than 1.0; a CoT/void record invalidates the baseline rather than clearing the case; a record that has not ARRIVED explains nothing.'
