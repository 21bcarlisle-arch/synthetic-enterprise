atom_id: E2_revenue_reconciliation
simplifications:
- '2026-07-10 audit: fra_ratio_series was already correct (my prior note was an unverified assumption, corrected); generate_insights.py had a real live instance of the Step 1 bug, fixed. ROOT CAUSE TRACED (third draw, not deferred again): the years[]/ledger net-margin divergence traces to saas/bill_generator.py billing non-commodity cost via a single blended rate (saas/non_commodity.py) while simulation/hedged_settlement.py computes the same cost per-levy/per-period -- two independently-built, never-reconciled models, bidirectional/non-monotonic gap consistent with a real volume/timing mismatch, not a bug in either. Full numerical reconciliation re-scoped to D2_three_clocks (its natural home) rather than resolved here -- E2''s OWN scope (gauge/legibility) is now closed on its own terms. depends_on ADDED 2026-07-10 (twelfth draw): formalising what was already true in prose -- E2''s remaining gap to level 3 is full numerical reconciliation, which is D2_three_clocks''s job, not a further action E2 itself can take. D2 in turn depends on W1_reveal_over_time, now idle pending the just-opened Tier 1 gate (docs/review_gates/POINT_IN_TIME_SNAPSHOT_TIER1.md) -- so this whole chain is honestly, transitively blocked, and the existing depends_on mechanism (not loop_stage=idle) is the structurally correct way to express it, since E2''s own loop_stage genuinely IS frame-appropriate work if/when D2 unblocks.'
- '2026-07-12 loop_stage frame->idle (self-refill draw, stale-state finding): the FRAME-stage reasoning above for keeping loop_stage=frame rather than idle was ''E2''s own loop_stage genuinely IS frame-appropriate work if/when D2 unblocks'' -- i.e. writing this lane''s charter was real, legitimate FRAME work at the time. That charter (docs/design/charters/E_finance_treasury.md) was written the very next day (2026-07-11, SPIKE_WEEKEND DISCOVER/FRAME charter flood) and is complete -- mission, sub-capability tree, L2/L3/L4 definitions, named best-practice references, lane roadmap, simplifications register, and it already states explicitly for E2 itself: ''Genuinely blocked, not stalled: the actual numerical reconciliation is D2_three_clocks''s scope -- do not start it independently of that atom''s own sequencing.'' Re-read the charter directly this draw and confirmed no further FRAME output or independent BUILD action remains for this atom -- the reasoning that justified frame over idle no longer holds now that its own product (the charter) already exists. This is the SAME class background/health_check.py''s _check_stale_dependencies() was built to catch (idle-hole #8, D3_catchup_rebilling) -- confirmed live: the health check currently flags E2 as a stale-dependency candidate (its own docstring cited E2 as the canonical ''deliberate, not stale'' counter-example as of 2026-07-11; corrected there too, since that comment would otherwise now be misleading). depends_on: [D2_three_clocks] is left unchanged -- the dependency itself is still real and correct, only loop_stage was stale. When D2 eventually starts building, this atom''s own dial-weighted candidacy naturally resumes the moment there is real independent BUILD work to select (loop_stage would move back to build at that point, per the map''s own convention -- not pre-emptively now, since none exists yet).'
- '2026-07-12 DEPENDENCY RESOLVED, depends_on cleared, loop_stage idle->build (self-refill draw, DISCOVER only -- no propagation code written this pass, epoch-sequencing note below still applies to the actual fix). D2_three_clocks has since reached its own level_target (L2, loop_stage harden) and published a real, live, verified reconciliation bridge (tools/generate_margin_bridge.py -> site/data/margin_bridge.json, portfolio + one-real-bill worked example) -- the ''natural home'' this atom''s remaining gap was re-scoped to on 2026-07-10 has now genuinely delivered. Checked directly (not assumed) whether this atom''s own name -- ''single reconciled revenue definition ACROSS EVERY REPORTING SURFACE'' -- is actually met yet: grepped for basis-labelling/reconciliation UI across all four site pages that render a net-margin figure. Confirmed a real, precise, still-open gap: only site/index.html carries the reconciliation card + R14 basis labels (3 basisNote() call sites); site/customers/index.html (lifetime_net_gbp, per-year net_gbp), site/supplier/index.html (p.net_margin_gbp AND a SEPARATE fa.net_gbp/D.financial.ledger series), and site/project/index.html (D.financial.annual net_gbp totals) all render a net-margin figure with ZERO basisNote/basis_label/clock_basis references -- confirmed via grep, 0 matches on all three. The underlying DATA is already correctly clock-tagged at the generation layer (tools/generate_dashboard_data.py: financial.annual.net_gbp is the settlement clock, financial.ledger.net_margin_gbp is the billed/ledger clock, distinct keys, not conflated) -- this is a PRESENTATION gap, not a data-model gap: three of four surfaces show a real number with no indication of which clock it reads or that a quantified, real, non-trivial gap exists between the two clocks for that same figure. Precise next BUILD step (not vague): propagate the same basisNote()/reconciliation-link pattern site/index.html already uses to the customer/supplier/project pages'' net-margin displays. depends_on cleared (the D2 blocker this atom was waiting on has delivered); loop_stage build (real, independently-actionable, precisely-scoped work now exists) -- BUILD code deliberately NOT written this pass, per this draw''s own supervisor dispatch (DISCOVER/FRAME only).'
- '2026-07-12 PROPAGATION BUILT (self-refill draw, real BUILD dispatched this time -- loop_stage=build, epoch 1, not gated). site/supplier/index.html: new basisNote(key) function, same shape as site/index.html''s, reading the SAME D.portfolio.basis[key] object (real data, already fetched by this page, no new fetch added) -- wired into the Overview tab''s Net Margin and Enterprise Value cards'' sub-line. site/project/index.html: renderKpis()''s ''Net margin (all time)'' KPI gained a title tooltip sourced from D.portfolio.basis.net_margin_gbp (same object, page already fetches dashboard.json) -- reused the tile''s existing title-attribute mechanism (already used for the cumulative-tests-executed caveat) rather than adding new UI chrome. site/customers/index.html: lifetime_net_gbp comes from a DIFFERENT data file (customers.json, generated by tools/generate_customer_sample.py/generate_customer_data.py from the same underlying settlement clock net_gbp) which carries no basis object at all -- rather than adding a new dashboard.json fetch just for metadata, added a static usage-hint sentence (''Settlement clock (SIM-internal wholesale-cost accounting) -- see the front page''s reconciliation bridge...'') next to both Lifetime Net Margin displays (Overview and Accounts tabs), matching the phrasing style of this same file''s own pre-existing annual-table usage-hint at line ~424 -- an honest, lower-rigor treatment than the other two pages'' live-data-sourced note (registered here, not glossed over: a genuine future upgrade would carry the basis object into customers.json/generate_customer_sample.py directly). Verified before publishing: `node --check` on all three pages'' script blocks (syntax-valid), and basisNote()''s actual output rendered in isolation against the real live site/data/dashboard.json basis object -- ''settled clock · PROVISIONAL · see the reconciliation bridge on the front page'' for net_margin_gbp, ''settled clock · PROVISIONAL'' for enterprise_value_gbp (no bridge_available flag on that key, correctly omitted), empty string for an unrecognised key (graceful degradation, not a crash). level_current NOT yet bumped to 3 (R1/R11: verify to the rendered value) -- these are static template changes to be verified against the LIVE deployed poesys.net surface after the next Cloudflare Pages deploy triggers off this push, not claimed done on the local file edit alone.'
- '2026-07-12 L3 EARNED, level 2->3, LIVE-VERIFIED (R1/R11): confirmed the Cloudflare Pages deploy for this exact commit completed (`gh run list --workflow=deploy-pages.yml`, success, ~27s) then curl-fetched all three live pages -- poesys.net/supplier/, /project/, /customers/ (cache-busted query param, cf-cache-status: DYNAMIC on the customers fetch, i.e. not served from a stale cache) -- and confirmed the new code/text is genuinely present in the deployed source: basisNote(key)''s output string on supplier, the nmBasis variable on project, and the ''Settlement clock (SIM-internal...)'' usage-hint sentence on customers, all found verbatim. Also re-fetched live poesys.net/data/dashboard.json and confirmed portfolio.basis still carries the real net_margin_gbp/enterprise_value_gbp objects (clock/provisional/bridge_available) the new code reads. Honest limit of this verification method, stated not glossed over: curl fetches the served HTML+JS source, it does not execute the page''s client-side JS the way a browser would, so this confirms ''the correct code and data are live and would render the note'' rather than a literal screenshot of the rendered DOM -- the same class of evidence this project''s own D2_three_clocks atom accepted for its worked-example card (a local Node-stubbed-DOM render check, since no headless-browser tool is available here), applied here via a live-source fetch instead of a local stub since the actual concern was deploy propagation, not template logic (logic was already unit-verified in the prior BUILD entry). All four authored surfaces with a net-margin figure (index, supplier, project, customers) now carry a real, live, data-sourced (or, for customers, explicitly-flagged-as-lower-rigor-static) clock disclosure -- the lane charter''s L3 bar (''single reconciled revenue definition across every reporting surface'') is met. loop_stage build->harden (at target).'
- '2026-07-16 H17 HARDEN (Rule-0 self-refill, dial yielded -- no below-target work). Mechanised this atom''s core invariant, previously held only by a one-off manual grep (2026-07-12 simplifications entry against four hand-picked surfaces). Per MAKE_IT_STICK/R10 a prose-only invariant evaporates. New standing control tests/tools/test_e2_revenue_reconciliation_surfaces.py AUTO-DISCOVERS site/**/*.html (glob) and fails if any live surface rendering a net-margin figure (net_margin_gbp/lifetime_net_gbp/settled_/billed_net_margin_gbp) lacks its R14 clock/basis disclosure. RED-TEAM FINDING captured: a broad scan found net-margin figures on THREE surfaces beyond the registered four -- site/company/index.html (nav-linked, live; COMPLIES via kpi-basis lines + the settled->billed reconciliation bridge, but the four-surface hand-registry never listed it, so its compliance was luck not a guaranteed invariant -- now covered by auto-discovery and pinned by test_control_discovers_more_than_the_original_hand_registry); site/shadow/supplier/index.html (GENERATED debug mirror, generate_shadow_html.py, not nav-linked, no disclosure -- EXPLICITLY excluded with a stated reason, not silently); site/snapshots/DASHBOARD_*.html (frozen archive, correctly never retro-labelled). Exclusions declared in EXCLUDED_SUBPATHS with reason strings and asserted non-silent (test_exclusions_are_declared_not_silent) -- no silent cap. R15: the control can FAIL -- test_control_fires_on_stripped_disclosure mutates a real compliant surface (strips disclosure tokens, keeps the figure) and proves the check flags it; test_control_does_not_fail_open_on_new_undisclosed_surface proves a new undisclosed surface is caught. 6 tests, all green. Test-only addition (disjoint file_scope, no production code touched); level stays 3->3 (at target), loop_stage harden.'
- '2026-07-27 HARDEN/red-team (Rule-0 self-refill dial-yield, dial 3 yielded -- no below-target work anywhere; director NTFYd; level HELD 3->3, at target). (1) Re-verified all 6 exit tests in tests/tools/test_e2_revenue_reconciliation_surfaces.py green (0.06s). (2) R15 MUTATION-RE-TEST of the LIVE mechanism (not the tmp_path self-test): stripped all 10 clock/basis disclosure tokens from the real deployed site/company/index.html and ran the standing invariant test_all_live_net_margin_surfaces_carry_a_clock_disclosure against the LIVE tree -- it FIRED (flagged company/index.html), then restored clean (git checkout, file was git-clean, no fix wiped). The control is genuinely failable on its own named defect. (3) RED-TEAM FINDING, hard-evidenced, QUEUED not fixed (SELF_INTERRUPT_DISCIPLINE; LATENT -- all 3 current live surfaces comply figure-by-figure per a direct token audit: project 2 figures/all disclosed, customers 8 lifetime_net_gbp/disclosed, company 12 net-margin tokens across 4 clocks/disclosed, so NO published figure is currently wrong): the standing control is PAGE-level, not FIGURE-level. net_margin_surfaces_missing_disclosure() flags a page only when NET_MARGIN_KEY.search(text) is true AND DISCLOSURE.search(text) is false -- i.e. it guarantees only that a page carrying >=1 net-margin figure token also carries >=1 disclosure token SOMEWHERE on the page; it never verifies the disclosure is CO-LOCATED with (or even refers to) the figure. R14 is a per-FIGURE law (''every published financial figure carries its clock''); the shipped mechanism is a per-page any-token-anywhere approximation -- an R15 fail-open (pattern 2: passes on partial coverage). Hard-evidenced: constructed a realistic reports page with TWO net-margin figures -- a settled_net_margin_gbp block carrying basisNote + ''settled clock'' AND a SEPARATE lifetime_net_gbp block with NO disclosure -- and net_margin_surfaces_missing_disclosure() returned [] (PASS); the undisclosed second figure slipped. So a future multi-figure surface that discloses one figure and forgets another is invisible to this control. SECONDARY (lower severity, drift-not-defect): the module docstring (lines 36-39) claims a test named test_control_does_not_fail_open proves a missing/empty surface is treated as a violation, but (a) no test of that name exists (the real test is ..._on_new_undisclosed_surface, which exercises a NON-empty new figure surface) and (b) net_margin_surfaces_missing_disclosure() ''continue''s on empty text (lines 101-103), i.e. silently PASSES an empty surface rather than flagging it -- benign today (an empty file carries no figure token so cannot be a net-margin surface) but the docstring overstates the R15 fail-open coverage actually shipped. Minor: file_scope still lists site/supplier/index.html, retired in the v4 nav rebuild (the test file header itself notes the retirement) -- a stale DIAL, not a wall. NAMED FIX for a future BUILD (touches the atom''s DEFINING control, deserves a deliberate pass -- NOT done here): replace the page-level DISCLOSURE.search with a co-location check -- for each net-margin-figure occurrence, require a disclosure token within its enclosing DOM block/card (parse with html.parser, walk to nearest section/card ancestor) or minimally within a bounded character window -- and add the two-figures-one-disclosed page above as an R15 mutation the new control MUST fail on; optionally fix the docstring/empty-surface drift and refresh file_scope. level_current STAYS 3 (levels director-reserved; this is a HARDEN re-verify + R15 live-re-test + red-team registration, not a level move or a build).'
