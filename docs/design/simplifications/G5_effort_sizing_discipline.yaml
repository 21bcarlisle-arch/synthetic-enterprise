simplifications:
- '2026-07-15 AUTHORED AS PROPOSAL (EFFORT_SIZING_DISCIPLINE.md, director-raised, disposition QUEUE -- registered as a proposal atom, drawn in dial order, does NOT preempt the ARCH1 build or the loop work). The gap: the loop/timer/deadman machinery is RUNTIME TOLERANCE for unknown duration (coping), not PLANNING -- nothing estimates effort BEFORE work starts, and maturity levels (L0-L5) describe MATURITY not EFFORT (an L0->L2 atom could be 20min or 3 days). This is standard pre-discovery/discovery T-shirt sizing, missing. Fits THIS project unusually well because we have ACTUALS: every level transition is git-timestamped, so sizing can be CALIBRATED not argued. Three uses: (1) DECOMPOSITION TRIGGER -- XL is a signal to decompose BEFORE building, mechanised (several weekend stalls were one atom far too big: ARCH1, the executor); (2) honest REMAINING-EFFORT -- below-target counts atoms as if equal; sized, you get the number that actually forecasts, reported beside the count; (3) estimate-vs-actual as a LEARNING SIGNAL -- chronic underestimates in a lane mean that lane is poorly understood; also feeds loop throughput (accurate sizing + accurate map state KEEP THE LOOP FED, the --once finding). GUARDRAIL (non-negotiable, same law as every diagnostic here): sizing is a DIAL not a WALL -- informs decomposition/prioritisation, NEVER a target or completion gate; the moment ''estimated M'' becomes ''must finish in M'' it reintroduces the deadline pressure that manufactures self-certified L3s (anti-goal-seek R12 applied to effort). Requirements (mechanism is the builder''s): S/M/L/XL size field set at FRAME with a one-line basis; calibration computed from git-timestamped actuals (observed cost distribution per size per lane, surface when actual blows past band as a SIGNAL); XL->decompose soft-gate on size not time; remaining-effort in the digest; estimate-vs-actual tracked per lane; dial-not-gate guardrail recorded in CLAUDE.md. This is one instance of the broader METHOD LENS proposal (G6_method_lens_audit) -- sizing is one named process discipline; the lens finds the rest. loop_stage idle: DISCOVER/FRAME (design the size field, the calibration query over git actuals) workable NOW per epoch gating; BUILD gated pending director/twin rank.'
- '2026-07-16 BUILD CALIBRATION half only (L0->L1, honest partial per brief''s own guardrail): tools/effort_calibration.py mines git-timestamped level transitions from docs/design/maturity_map.yaml''s commit history (this repo''s own established ''<atom-id> -> L<n>'' commit-subject convention) and computes REAL observed cost distributions per lane -- run against this repo''s actual history: 51 transitions parsed, 16 durations computed across 5 lanes (e.g. H_harness n=6 mean=24.42h median=27.91h; W2_customer_generator n=6 mean=2.19h median=0.27h), reproducible via `python3 -m tools.effort_calibration --json`. calibration_by_size() is wired and tested but returns {status: no_size_data_yet} since no atom carries a `size` field yet -- activates automatically once FRAME starts setting it, no code change needed. docs/design/EFFORT_SIZING_DESIGN.md specifies the remaining SIZING half as a schema PROPOSAL (not applied here -- this fork''s file_scope excludes maturity_map.yaml, a MAP edit reserved for the orchestrator): the size:S/M/L/XL field + one-line size_basis, band anchors derived from the real calibration output above, the XL->decompose soft gate (fires at FRAME, on size not on time), and the dial-not-a-gate guardrail (R12 anti-goal-seek applied to effort -- an estimated M must never become ''must finish in M''). CLAUDE.md guardrail line NOT added in this fork (file at ~34,800/35,000 char hard limit; explicitly the orchestrator''s follow-on per task brief). 22 new tests (tests/tools/test_effort_calibration.py): pure-function commit-parsing coverage (short-code derivation, H1-vs-H10 boundary, bundled multi-atom commits like the real ''C9->L3+W2_7->L3, C10->L3+W2_8->L3'' pattern, embedded-from-level text), duration-computation edge cases (no-anchor first transition, same-commit/non-positive gaps dropped), lane/size aggregation, an end-to-end synthetic-git-repo test, and one live sanity check against this repo''s own real history. L2 remains open (honest): size field not yet live on real atoms, XL soft-gate not yet enforced, remaining-effort not yet in the digest, estimate-vs-actual not yet tracked, guardrail not yet in CLAUDE.md itself -- see EFFORT_SIZING_DESIGN.md section 6.'
- "2026-07-16 BUILD L2 MECHANISM half (the map-data half -- real `size:` values on real atoms -- is the orchestrator's, per brief; not done here). Four functions added to tools/effort_calibration.py, all additive and read-only (never mutate maturity_map.yaml, never block anything -- DIAL not a WALL, R12 anti-goal-seek): (1) expected_hours_for_atom() -- the honest fallback chain used by both functions below: a real per-size calibrated actual (once any atom has one) > the starting SIZE_BAND_ANCHOR_HOURS anchor (S=1h/M=12h/L=28h, derived from this repo's own real per-lane distribution) > a real per-lane calibrated actual (for atoms with no size yet) > unknown (never guessed as zero). XL never receives an hours figure (basis 'xl_decompose_signal') -- sizing it would reward leaving it undecomposed. (2) remaining_effort_report() -- sums expected hours over below-target atoms (level_current < level_target), reporting n_sized/n_unsized honestly alongside the total so \"0 sized yet\" degrades visibly rather than silently. (3) estimate_vs_actual_by_lane() -- pairs each lane's real calibrated actual against an estimate built from its size-tagged atoms' anchors, reporting delta_hours + direction (under/overestimated) per lane, or 'insufficient_data' rather than a fabricated delta when either side is empty. A LEARNING SIGNAL about the lane, never a stick against an atom (design doc section 5). (4) xl_decompose_flags() -- the XL -> decompose SOFT GATE: flags (never blocks) a BUILD-eligible atom sized XL that has neither a recorded child (another atom's depends_on pointing at it) nor an explicit size_basis exception. background/effort_digest.py (new, thin render layer only -- all computation stays in tools/effort_calibration.py) surfaces all three L2 views as an 'EFFORT SIZING' block in LATEST.md, wired into the live publish cycle via a new run_effort_digest_step() in background/process_run_complete.py (same block-managed-between-HTML- markers pattern, and same defensive try/except-log-and-swallow discipline, as the existing 'NAIVE ORGAN asks:' block/run_naive_organ_step() it sits beside) -- verified fully defensive (a synthetic render failure is logged and swallowed, never breaks publishing) and idempotent (re-render replaces the block in place, never duplicates it). CLI extended: `python3 -m tools.effort_calibration --remaining-effort / --estimate-vs-actual / --xl-flags`. Ran against the REAL live map (2026-07-16, no atom carries `size:` yet): remaining-effort correctly falls back to per-lane actuals for all 30 below-target atoms (14 sized via lane fallback, 16 unsized -- lanes with zero calibrated actuals, e.g. brand-new lanes), total ~234h; estimate-vs-actual correctly reports 'insufficient_data' for every lane (honest -- no atom has an estimate side yet); xl_decompose_flags() returns [] (no real atom is sized XL yet) and runs cleanly end-to-end without raising. 69 new tests: tests/tools/test_effort_calibration.py gains fallback-chain unit tests (real-size-calibration precedence, anchor fallback, lane fallback, unknown, XL-never-sized), remaining-effort aggregation (below-target inclusion/exclusion incl. missing level_target), per-lane estimate-vs-actual (delta/direction/insufficient-data/XL-exclusion), and the XL soft gate (fires/silent-when-idle/silent-when-decomposed/silent- with-exception-basis/never-fires-on-non-XL/sanity-against-the-real-live- map). tests/background/test_effort_digest.py (new) covers the digest render end-to-end against a synthetic git repo carrying FIXTURE atoms with `size`/`level_target`/`depends_on` (does NOT depend on real atoms being sized), the no-below-target-atoms degrade, the unreadable-map degrade, and the process_run_complete.py block-append/replace/never- raises wiring. Remaining for the orchestrator to close full L2 (per this fork's brief, outside its file_scope): apply real `size:`/`size_basis:` values to representative real atoms in maturity_map.yaml (~8-10 proposed below, with one-line bases) and confirm the full L2 DoD once real size data starts flowing through the (already-live) mechanisms above. Proposed S/M/L/XL sizes for the orchestrator to apply (one-line basis each, informed by this repo's own real per-lane calibration + each atom's actual file_scope/lane/history):\n  G5_effort_sizing_discipline: L -- multi-file (tools/ + background/ +\n    two test files), crosses the calibration-tool/digest seam, L0->L1\n    alone took the H_harness lane's real ~24-28h band.\n  G6_method_lens_audit: M -- doc-only DISCOVER pass (audit table +\n    proposal-atom generation), one lane, one clear DoD, no runtime code.\n  A6_coupled_triad_gap_metric: L -- crosses the SIM/company wall by\n    design (the one layer allowed to hold both theta and b), multiple\n    metric families, feeds a shared ledger other atoms gate on.\n  H11_naive_organ: L -- new subprocess-isolation mechanism (Opus\n    `--tools=` sandboxing), 7 SYSTEM detectors, 2 modes x 3 targets, a\n    log format + a digest sink -- the real precedent this atom's own\n    digest wiring copied.\n  H15_publish_gate_failure_alert: M -- one state file + a threshold/\n    cooldown/fail-closed mutation-tested control, single file_scope\n    (background/process_run_complete.py), narrow DoD.\n  W2_customer_generator (typical W2_* atom): S -- this repo's own real\n    calibration shows this lane's median duration is ~0.27h, the\n    fastest lane measured; narrow, well-precedented generator tweaks.\n  C_customer_ops (typical C* atom): M -- one real observed transition at\n    0.91h, but customer-ops atoms typically touch billing/compliance\n    invariants (R10-class), one lane, one DoD, not single-file trivial.\n  F5_vat_control_independent_signal / F5_ofgem_licence_readiness (the\n    real short-code-ambiguity pair this tool's own tests document): M\n    each -- single compliance-invariant addition apiece, one lane, but\n    genuinely coupled to the regulation-commons doctrine's time-indexed\n    invariant dataclasses (not a bare one-file fix).\n  A hypothetical undecomposed multi-seam atom (the XL worked example\n    this soft gate targets, e.g. the historical ARCH1/executor-shaped\n    atom named in this atom's own design doc): XL -- multi-file AND\n    multi-seam AND/OR scope not yet reducible to a one-line basis; the\n    gate's own reason for existing."
- '2026-07-27 HARDEN re-verify (Rule-0 dial yielded -- no below-target work anywhere; G5 drawn AT-target, L2->L2 held, not yet in the .harden_cooldown rotation marker so a legitimate fresh draw). Both exit suites re-ran GREEN (tests/tools/test_effort_calibration.py + tests/background/test_effort_digest.py, 51 pass). R15 MUTATION re-test of the never-over-count control in compute_durations: neutering the strict-rise filter (`cur.to_level <= prev.to_level` -> `False`, so demotions/reverts/same-level re-affirmations get counted as build effort) reds EXACTLY the 3 named tests (excludes_demotion_reverts, counts_rework_after_revert_but_not_the_revert, drops_same_level_reaffirmation) and NOTHING else -- proving the control that keeps the calibration distribution honest (it under-counts ambiguous non-progress, never over-counts -- the stated failure direction) provably fires on its own defect. Source restored by re-Edit (NOT git checkout -- mutation-restore-wipes-edit hazard when the file could hold an uncommitted fix), then suite re-run green + zero source diff confirmed. record_harden_pass(G5) stamped so the next tick rotates PAST this atom. Level held at 2 (HARDEN never moves the cell); registered per R10 (re-verification, not a silent instance fix).'
- '2026-07-28 18:17Z HARDEN re-verify (Rule-0 dial yielded -- no below-target work anywhere; G5 drawn AT-target, L2->L2 held). Both exit suites GREEN (tests/tools/test_effort_calibration.py + tests/background/test_effort_digest.py, 52 pass). MUTATION ROTATED to a control NOT exercised last pass (last pass hit compute_durations strict-rise never-over-count filter): the WORD-BOUNDARY INDEPENDENCE guard in _find_short_code_occurrences (anti-phantom-transition control -- rejects a short code glued to a trailing ALNUM so E2E never injects a phantom E2 transition, H10 never a phantom H1). Neutering it (after.isalnum() -> after.isdigit(), re-allowing a trailing LETTER) reds EXACTLY test_parse_does_not_false_match_code_glued_to_a_trailing_letter and nothing else (1 failed / 51 passed); restored byte-identical to HEAD (git diff --quiet clean, re-Edit not git-checkout per the mutation-restore-wipes-edit hazard). RED-TEAM (no defect, honest no-change): audited the prefix-collision class -- a short code that is a strict prefix of a longer sibling (W2 vs W2_10/W2_7) DOES word-boundary-match inside the longer token because underscore-after is deliberately allowed, but the bounded-window attribution in parse_transitions_from_message saves it structurally: the prefix and its longer sibling always start at the SAME index, so the prefix window_end == its own start (empty window) and it never captures an arrow -- traced across standalone/bundled/arrow-before cases. Left undefended by design (structurally safe; a longest-match filter would be complexity for a non-bug, SIMPLICITY GUARD). LIVE OUTCOME CHECK: --remaining-effort ran clean against the real map (49 below-target, 41 sized via fallback, 8 unsized, 0 malformed, ~484h), degrading honestly. record_harden_pass(G5) re-stamped so the next tick rotates PAST this atom. Level held at 2 (HARDEN never moves the cell); registered per R10 (re-verification, not a silent instance fix).'
- '2026-07-28 ~18:50Z HARDEN re-verify (Rule-0 dial yielded; G5 drawn AT-target L2->L2 as the Rule-0 FALLBACK, not fresh work -- the whole 33-atom at-target HARDEN pool is inside the 24h cooldown so rotated=[], and the draw falls back to pool per never-rest-at-a-wall). DISPOSITION: REST-WITH-PROOF, NO 3rd guard on G5 (its two controls -- compute_durations strict-rise + _find_short_code_occurrences word-boundary -- were rotated 07-27 and 18:17Z; a 3rd is the no-Nth-guard anti-pattern). Exit suites RE-RAN GREEN this tick (tests/tools/test_effort_calibration.py + tests/background/test_effort_digest.py, 52 pass); content_sha + scope_sha both unchanged since 18:18Z so no controlled code moved. REST PROVEN AT EVERY LEVEL: BUILD walled (candidates 2->1->0 after fronts/gates, the 1 is coupled-triad-gated W1_10), DISCOVER/FRAME 24-idle all FRAME-saturated, forward-discovery F1-F5 complete, propose-half NONE, blocked_mints 26 all-blocked / 0 self-drawable with planner rest-proof FRESH (18:28Z, within the 2h cap). RED-TEAM FINDING (registered-not-fixed, SELF-INTERRUPT QUEUE discipline): the shared cooldown control _file_scope_sha (background/supervisor.py) does read_bytes() on each file_scope entry, so a DIRECTORY entry raises IsADirectoryError and is silently skipped -- proven empirically that G5 scope_sha is BYTE-IDENTICAL to a CLAUDE.md-only hash, i.e. its real controlled code (tools/effort_calibration.py + background/effort_digest.py) is NOT tracked by the change-signal. Blast radius: 22 at-target atoms carry >=1 directory file_scope entry; 9 (H14/A7/G7/G8/G9/G10/G11/W2_11/W4_4) are file-entry-less so their scope-change re-offer signal is ENTIRELY dead -- the exact sibling-code-moved-under-a-shared-scope fail-open the function docstring says it exists to close. LOW severity (bounded by the 24h window: it delays a re-verify, never permanently suppresses, and fails toward the conservative side). Fix direction (a future H-lane cooldown HARDEN, not inline in a rest tick): os.walk directory entries in _file_scope_sha, or reject/warn on a directory-valued file_scope at record_harden_pass time. Filed in this HARDEN trail, NOT in DECLARED_DEFECTS_REGISTER (that register is fidelity-only and FORBIDS rest -- wrong home for a LOW-sev harness-hygiene nit). record_harden_pass(G5) re-stamped AFTER this note. Level held at 2 (HARDEN never moves the cell); R10 re-verification.'
- '2026-07-29 HARDEN pass = CLASS AUDIT, not an Nth guard (this atom''s own controls are saturated -- the Rule-0 draw re-offered it after cooldown fallback). G5''s class in one sentence: an effort/flow signal must INFORM and stay honest -- the absence of work must be visible, never read as a benign value. Audited every live consumer of the signal this atom produces: tools/effort_calibration.py''s git-mined transitions are consumed outside G5''s file_scope by tools/generate_wip_flow_data.py (the PUBLIC site/wip-flow door). Asked the class question of that consumer -- ''what does it conclude when the producer says nothing?'' -- and found a real fail-open: its trailing-window throughput was anchored on the last transition, so a stalled build published an unchanged healthy rate forever. Finding FILED UNDER G7_wip_cycle_time_dashboard (the owning atom, its file_scope), fixed and R15 mutation-proven there. G5''s own exit suites re-verified unchanged this pass: tests/tools/test_effort_calibration.py + tests/background/test_effort_digest.py, 52 pass. Confirms the doctrine: the CLASS is transferable, the guard is not -- a saturated atom is saturated precisely in the code someone already looked at.'
