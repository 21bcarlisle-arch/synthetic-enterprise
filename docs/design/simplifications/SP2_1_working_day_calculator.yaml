atom_id: SP2_1_working_day_calculator
simplifications:
- '2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_working_day_calculator_2026-07-28.md, source DIRECTOR_RULING_SHARED_PRIMITIVES_AND_CODE_STANDARDS_2026-07-28 section 2.1. WHY IT WAS INVISIBLE: its DISCOVER half closed 2026-07-28 (docs/design/WORKING_DAY_CALCULATOR_DISCOVER.md, 22 callers found vs ~17 estimated) and its BUILD half was parked behind blocked_on director_build_open -- an act ABOLISHED 2026-07-29 and swept 2026-08-03. It therefore sat as staging noise, re-flagged every supervisor tick and dispositioned as "archive me", never as drawable work. That is the R17 consumed-not-absorbed stall class, and registering it here is the fix. FIDELITY GAINED: regulatory deadline arithmetic (GSOP, SLC obligations, complaint clocks, Bacs) is specified in WORKING days, so the SIM currently cannot produce a deadline breach a real supplier would be fined for; closing this makes that whole breach class reachable.'
- '2026-08-03 MINT -- TWO-PASS BUILD SHAPE IS MANDATORY (ruling section 8 mitigation): pass (1) lands the calculator + the dated calendar + its second-definition guard with ALL CALL SITES UNCHANGED, verified in isolation; pass (2) migrates the ~17 callers separately verified. R15 BOTH WAYS: inject a second working-day definition => the guard REDS; remove it => passes. NEVER FABRICATE A BANK-HOLIDAY DATE -- the DISCOVER doc recommends the gov.uk/alphagov calendar source and marks 2016-18 TO-BE-SOURCED rather than invented; an invented date is a Historical Ground Truth breach, not a convenience. R14: any published financial or compliance figure that MOVES as a result is published as an explicit before/after WITH its basis clock -- baseline diffs here are EXPECTED and must not be read as regressions. The four-nations split is a materiality judgement to make and RECORD, not to skip silently.'
- '2026-08-03 PASS 1 BUILT, level 0->1 (worker tick, sole-map-writer). LANDED: company/compliance/working_days.py (Nation enum, is_working_day/add_working_days/working_days_between) + a committed England-&-Wales bank-holiday table 2012-2028, and tools/working_day_guard.py + its R15 test. ALL CALL SITES UNCHANGED per the mandatory two-pass shape -- the 25 pre-existing definitions sit in the guard BASELINE_ALLOWLIST, so a NEW second definition reds the build today while Pass 2 migration is still outstanding. CALENDAR NEVER FABRICATED: source of record is the ministryofjustice/govuk-bank-holidays GDS cache (on the egress allowlist, unlike gov.uk itself), and THREE GDS-derived sources were reconciled before any date was committed -- alphagov/calendars vs source of record 2015-2021 (56 events each, identical), the live gov.uk feed vs source of record 2019-2028 (83 each, identical), alphagov vs live 2019-2021 (24 each, identical). This closes the DISCOVER doc TO-BE-SOURCED 2016-2018 gap with government-published data rather than memory. TWO DISCOVER-DOC ERRORS FOUND AND CORRECTED IN THE DOC: (a) the census of 22 callers was an UNDERCOUNT -- the guard structural rule found 3 more the name-based grep could not see, two of them the same arithmetic renamed to _add_wd (the exact rename fail-open a name-only guard would pass) plus an inline loop mis-attributed to a helper that does not exist; real count 25. (b) section 4 specified working_days_between as half-open [start,end); the 4 shipped implementations increment BEFORE testing, so the real interval is (start,end] -- the two agree only when both endpoints are working days, and building to the doc would have silently moved every deadline. Shipped semantics kept, doc corrected, interval pinned by test. All 15 add-implementations were differential-tested against each other over 2016-2026 x n in {0,1,2,3,5,10,20,40} BEFORE the canonical semantics was chosen -- all agreed, so one definition is safe. FAIL-CLOSED by design (R15): a date outside the committed table raises OutsideCalendarCoverage rather than silently answering weekend-only, which would be the very defect this atom exists to fix, returned silently exactly when the data is missing. EVIDENCE: 29 calculator tests + 12 guard tests green; guard PASS over 609 files; epistemic PASS. R15 MUTATION-PROVED: neutering the guard rename-proof rule (by_shape=False) reds EXACTLY test_renamed_copy_is_STILL_flagged and nothing else (11 others stay green = independence), restored byte-clean. NOT DONE, and why the level is 1 not 2: Pass 2 (migrate the 25 callers, then shrink the allowlist to empty) is untouched, so NO deadline the company actually computes has moved yet -- the primitive is correct and guarded but not yet consumed. The moved-figure diffs are published in the tests (e.g. a 3-working-day deadline from Christmas Eve 2026 moves 29 Dec -> 31 Dec) so Pass 2 movement is expected baseline correction under R13, not regression.'
