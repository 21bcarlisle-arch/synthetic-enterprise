  - '2026-10-03 PASS 2, BILLING BATCH, level 1 -> 2 (the L1 entry above names the bar: "the primitive is correct and guarded but not yet consumed"). company/billing/credit_refund, dd_indemnity, deemed_contract and energy_theft_book drop their private weekend-only _working_days_between and import company.compliance.working_days.working_days_between; four allowlist entries deleted (25 -> 21). CONSUMED IN PRODUCTION: the SLC 14 credit-refund verdict the world logs goes through company/interfaces/credit_refund_requests.py -> CreditRefundRecord, so a deadline the company actually computes now counts bank holidays out. MOVED FIGURE, printed at real inputs before the tests were written: over every start date 2016-2025 x lag 0-30 calendar days, 1.58% of 10-working-day verdicts flip (credit refund, DD indemnity), 0.91% of 5-day (deemed notice), 0.40% of 2-day (theft DNO), and every flip is breach -> on time, never the reverse (the old loop counted holidays as working days, so it only ever ran fast). Worked case: refund asked Fri 20 Dec 2024, paid Tue 7 Jan 2025 was 12 working days and a breach; it is 9. Expectation updates, not regressions (R13): test_credit_refund_characterization pinned the weekend-only Easter count (3 -> 1), test_dd_indemnity pinned 16 May 2023 across the Coronation holiday (now 17 May), and the credit-refund seam test built paid dates with its own weekend-only copy. credit_refund.py::working_days_to_pay stays allowlisted as a NAME COLLISION only: it now delegates, and its name is the published key of the interface door. Control: tests/company/billing/test_billing_deadlines_count_bank_holidays.py, one pair per module (not late across the holiday, late a few working days on), with the holiday premise checked against the committed calendar; re-inserting a weekend-only loop into each module reds both that module''s case and the guard (4 of 4). L3 still owed: the 21 remaining callers (company/crm, company/market, company/regulatory, company/trading, and two in simulation/ that the world owns).'
