atom_id: W1_26_the_world_has_no_wind_term_and_the_belief_does
map_notes:
  gain: 'simulation/fabric_physics.py computes infiltration from build era and insulation and nothing else -- no wind factor anywhere in the demand path -- while company/pricing/weather_normalisation_belief.py carries an optional HDD x excess-wind regressor a caller can switch on. The company can therefore fit a household wind-chill coefficient against a world in which household wind chill does not exist, and the fit will look healthy: real regressor, real data, reported r-squared. The repair is the published SAP factor, one multiplication; the cost is that every historical demand figure in the tree moves, which is a fidelity decision with its own evidence bar and is why this is an atom rather than a patch.'
