atom_id: G1_test_progression_metrics
simplifications:
- '2026-07-29 HARDEN (R15, sibling-half red-team): the COMMITS half of this atom''s own guarantee had never been red-teamed -- the two test-count halves were hardened 2026-07-27. `_total_commits()` and `_commits_per_day_lines()` swallow EVERY exception and return None/[], and `generate()` runs inside the publish path (background/process_run_complete.py:872), so one git timeout or non-zero rc silently published `total_commits: null` / `commits_by_day: []` to the live Project page, where renderBuildStats() gates on `if(commits)` and the figure simply vanished -- FAIL-SILENT (an unavailable source reported as a successful publish) plus FAIL-OPEN (empty passes straight through a metric whose entire declared property is MONOTONIC growth), the same single-day-collapse class the director reported on the test-count series (16,358 -> 221), except all the way to zero. Closed by `_retained_commit_metrics()`: hold the last PUBLISHED figure when a fresh measurement is missing or has gone backwards, label it in a new `commits_source` field (measured / retained_previous / unavailable) so no surface can present a retained number as fresh, and publish nothing rather than invent one when there is no prior. Prior values are shape-validated (`_valid_commit_total`) because json.loads accepts a bare NaN literal and bool is an int subclass -- either would lose every `<` comparison and silently disarm the guard. `cumulative_commits_by_day` now counts only well-formed YYYY-MM-DD lines (a stray token became its own sorted bucket = a garbage x-axis point). Three mutation tests run and observed to FAIL on their own named defect (guard disarmed -> 5 failures incl. the end-to-end publish test; naive `is not None` -> NaN test fails; date filter dropped -> filter test fails). Known follow-on: this note itself changes the atom''s content sha once merged, so the harden-cooldown stamp written this turn is invalidated at merge and the atom may be offered once more -- a future draw should read this note as proof of a completed pass and rest, not repeat it.'
- '2026-07-29 HARDEN (R15, CLASS audit of the guard landed hours earlier the same day): the commits-retention guard was correct and mutation-proven, but it was keyed to 2 of the 6 monotonic metrics `generate()` publishes -- an instance fix wearing a class fix''s clothes. `generate()` swallows the PROJECT_OVERVIEW.md read exception and falls back to `text = ""`, so ONE unreadable or mid-write-truncated source file (CLAUDE.md documents concurrent writers on this tree) publishes total_phases 519->0, test_progression 17,214->[], phase_dates 468->0 and timeline->[] to the live Project page -- while `commits_source` still reads "measured" and the publish reports success. Observed directly by driving the real generate() with a non-existent PROJECT_OVERVIEW, not inferred. Same two R15 killer patterns as the commits half -- FAIL-SILENT (unavailable source reported as a clean publish) and FAIL-OPEN (empty passing through metrics whose entire declared property is monotonic growth) -- reached through a DIFFERENT source, on four MORE metrics, one of them (test_progression) the very series whose 16,358->221 collapse the director reported. Closed at the class, not the instance: a declarative `_GROWTH_METRICS` registry + one shared `_retained_value` primitive (the commits pair is now a caller of it rather than a second, driftable mechanism), holding any registered metric at its last PUBLISHED value when a fresh measurement is missing or has gone backwards, plus a `metrics_source` map labelling every metric measured/retained_previous/unavailable so no surface can present a retained figure as fresh. Companion fields derived from the same read (start_date, cumulative_tests_executed_since) are retained with their metric so the payload cannot self-contradict. Zero is treated as unmeasurable rather than as a measurement of nothing (consistent with the empty list, and true of every metric here), closing the first-ever-run case that would otherwise publish 0 labelled "measured". Four mutation tests run and OBSERVED to fail on their own named defect: sweep disarmed -> 5 failures; naive `is not None` -> 3; companion retention dropped -> 2; a metric left out of the registry -> 2, including `test_every_published_growth_metric_is_registered`, which asserts the registry against the REAL published keyset and is what makes this closure rather than a treadmill -- a cumulative metric added later and left unguarded fails automatically. 58 tests in tests/tools/test_generate_phases_json.py (52 -> 58); live payload re-generated unchanged in substance, every metric labelled "measured" on the honest path (the guard is not a freeze). Rest with proof: both halves of this atom''s guarantee, and now the class around them, are R15-proven -- a future draw should read this as a completed pass, not repeat it. KNOWN FOLLOW-ON (queued, not fixed on sight -- SITE lane, outside this atom''s file_scope; raised by the epistemic verifier on this diff, which returned PASS): `metrics_source` and `commits_source` are published in phases.json but not READ by site/project/index.html, so a retained figure is machine-labelled yet renders indistinguishably from a fresh one. The fetchable payload carries the truth; the pixel does not. R11/R14-flavoured surface-honesty gap for a SITE-lane atom.'
