atom_id: SITE_EH3_figure_reconciliation_and_periods
simplifications:
- '2026-07-29 MINTED from the cold-eyes Expert Hour (MAJOR-4/5/6), three defects of one class: a published figure whose own basis is not defensible. (a) BAD DEBT is published TWICE, 129.6x apart -- the annual series sums to 3,491.86 (0.018pct of revenue) while the ledger says 452,575.76 (2.40pct), both feeding the same doors with NO bridge, in a site that goes to real trouble to bridge net margin. The ledger figure is the plausible one. The annual series also carries NEGATIVE bad debt (2020, 2024, 2025), and the anchors register rates a "-0.0pct" bad-debt rate AMBER -- a sign error treated as a calibration nudge. Bad debt is the number that kills real suppliers; a non-positive rate must be a hard RED with a named cause. (b) MARGIN has no plausibility anchor: the register benchmarks churn, bad debt, complaints and arrears but NOT margin, so the one metric where R12s band matters most is the one with no band -- while publishing 16.94pct (2018), 14.24pct (2019) and a 24.17pct I&C-electricity net margin against a cap EBIT allowance of ~1.9-2.4pct and real supply margins of -2 to +4pct. Add the row and LET IT READ RED: an implausible figure that is flagged is credible, an unflagged one is not. R12 binds hard here -- the fix is the ANCHOR, never tuning the margin toward the benchmark. (c) PERIOD: world.jsons sim_window "2015-11-07 to 2025-06-07" renders on no page, so a 5.2-month 2025 stub is rendered as an annual row (revenue 1,284,000.63 vs 2024s 2,994,378 reads as a 57pct collapse; bills_count 66 vs 153-205) and /company/ shows a full-year "Corp. tax 2025" of GBP 127,820 on 5.2 months of trading. No page says "part year". R14 gave every figure its clock; this gives every figure its PERIOD, which for an annual series is half the basis. Class-closing per R10: the invariant is "a published series row states its period coverage, and a partial row is excluded from trend rendering", not three instance fixes.'
