simplifications:
- '2026-07-20 GAP 1 FIX BUILT + VALIDATED + SHIPPED (the season-conditioned covariance, now in sim/weather_engine.py). fit_national_macro_model fits the innovation covariance CONDITIONALLY on season (cold-season Dec-Feb cov carrying the +0.53 winter temp/wind coupling, warm-season cov otherwise); simulate_national_macro selects it by the day ACTUAL calendar season (not a Markov-random block). R13 BASELINE FIDELITY (blind to P&L). VALIDATED: simulated winter D1 decile lift 2.875, within the real CI [1.54,3.38] (was ~1.77); MARGINALS PRESERVED (temp mean 10.20 vs 10.15, wind std 1.54 vs 1.54 -- only the joint tail dependence changed); show-the-tail envelope reaches real (reach 12->32pct). ZERO downstream blast radius verified: engine 28 (incl. a new R15 fidelity+mutation test) + tail-demo 10 + demand_model 20 + weather-sensitive phases + tests/sim 767 + run_phase2b integration 20, all green; epistemic PASS. GAP 1 + GAP 2 (show-the-tail) now CLOSED. L3 PROPOSED: level_current NOT moved (section 0); blocked_on director_level_up -- the L3 remainder is NOT agent-buildable (gap-3 independent published validator anchor needs a network/data session; the coupled-triad company-vs-truth gap + the director Expert-Hour are director-gated). Removed the wind-magnitude regime + regime_threshold (no external consumers).'
- '2026-07-20 GAP 1 MECHANISM PINNED + FIX VALIDATED (FRAME cont., no engine code shipped). Beyond the refuted joint trigger: symmetric fat-tailed innovations ALSO refuted (honest MLE t-df on the real innovations = 30.6, near-Gaussian; forcing df~3 to hit the output metric would be goal-seek, R12). MECHANISM PINNED with evidence: the innovation temp/wind correlation is SEASON-DEPENDENT (+0.528 winter vs +0.178 non-winter; winter innovation lower-tail lift 3.149) -- the single-covariance engine carries ~the all-year corr and under-produces the winter joint tail. FIX VALIDATED: a SEASON-CONDITIONED innovation covariance gives simulated winter D1 lift 2.883, within the real block-bootstrap CI [1.54,3.38] (Gaussian was ~1.77). The real gap-1 fix is a season-conditioned covariance -- NOT a trigger, NOT symmetric fat tails. Left as a focused BUILD rung (regime-STRUCTURE change: calendar-season vs preserve-Markov-plus-seasonal-corr, + downstream golden-test re-baseline). DoD: sim D1 lift in the real CI AND show-the-tail envelope passes; mutation back to the single all-year cov drops it to ~1.77 and fails. See the FRAME doc UPDATE section. Level HELD.'
- '2026-07-20 GAP 1 HYPOTHESIS MEASURED + REFUTED (FRAME, no engine code shipped -- reverted). Built the director-steered joint cold-and-still regime trigger (regime = temp_resid<p30 AND wind_resid<p30; stressed-regime cov temp/wind corr +0.34); MEASURED the SIMULATED winter D1 lift vs the real 2.365 (cascade_link_register): OLD wind-only 1.903, NEW joint 1.650 -- the joint trigger made the robust fidelity metric WORSE, so REVERTED (R12: never ship toward intent when the evidence refutes it). THEORY (structural, not a tuning miss): a regime-switching GAUSSIAN has ZERO asymptotic tail dependence, so no trigger at any percentile can reproduce a 2.34x decile-tail lift from correlation alone -- gap-1 is an innovation TAIL-STRUCTURE problem, not a trigger problem. REDIRECT (the real gap-1 fix, next BUILD rung, now grounded): replace the Gaussian innovation draw in simulate_national_macro with a LOWER-TAIL-DEPENDENT copula (Clayton/t) on the (temp,wind) innovations, marginals unchanged, calibrated so the simulated D1 lift reaches the real 2.365 CI; DoD = the show-the-tail envelope + a sim-D1-lift-vs-real gate (already built, failable). Higher blast radius (innovation distribution -> re-baseline downstream golden tests) so it is its own focused rung. See docs/design/frame/W1_3_gap1_regime_trigger_REFUTED_FRAME.md. Level HELD.'
- '2026-07-20 GAP 2 BUILT (SHOW THE TAIL -- the director DoD deliverable). sim/weather_tail_demonstration.py + 10 R15 tests: joint cold-and-still (Dunkelflaute) severity = PRODUCT of cold-intensity x still-intensity per rolling 7-day WINTER window (co-occurrence, not two marginals; a cold-but-windy or still-but-mild week scores 0), thresholds = low-percentile of the REAL winter series applied to both real and synthetic. Real worst GB winter week identified = 2022-12-07..13 (the real Dec-2022 cold snap: mean -1.4C + 2.1 m/s over 7 days, severity 1.45). FAILABLE ENVELOPE GATE (director literal: milder-than-reality = physics wrong): over 25 seeded sims the engine must reach >= the real worst; healthy engine PASSES (envelope max 1.75 >= 1.45); a SMOOTHED engine (no stressed regime + no autocorrelation) collapses to 0 and assert_tail_not_smoothed FIRES (R15 both directions). DIAGNOSTIC reported NOT gated (R9/R12): reach_fraction = 12 percent -- a gap-1 SIGNAL the engine may under-produce the tail FREQUENCY (the FRAME wind-only-regime-trigger gap), but n=1 real cannot prove under-production so it is surfaced not asserted (gating a frequency floor would be goal-seek). Additive: NO engine-internals change; 27 engine tests + 10 new green, epistemic PASS. R10 SIMPLIFICATION (gap 3): the comparison anchor is the SAME real series the engine calibrates on (marking-own-homework); an independent published GB anchor (degree-days / NESO system-demand worst-week) needs network, deferred. L1->L2 INCREMENT (show-the-tail DoD delivered + engine passes the envelope); level_current NOT moved (section 0); L2 PROPOSED. L2->L3 REMAINING (director judgment): gap 1 = mechanistic JOINT cold+still regime trigger in sim/weather_engine.py (out of this file_scope -- a separate rung; the 12pct reach is the case FOR it) + gap 3 independent anchor + the coupled-triad company-vs-truth gap + Expert Hour.'
- '2026-07-13 REGISTERED (WEATHER_PHYSICS_HIERARCHY.md, director P1, QUEUE -- DISCOVER/FRAME workable now, BUILD gated to Epoch 3 with W1_2_generate_futures). the CORE physics primitive. Architectural steer (director: the mechanism is ours): model a latent BLOCKING-HIGH weather regime (hidden-Markov / persistence state) that jointly drives cold + low-wind + high-pressure, so COLD-AND-STILL arises MECHANISTICALLY, not from a fitted Gaussian correlation that under-weights tail dependence. Cold-and-still is THE single most important GB power correlation -- draw temp and wind independently and the supplier-killing winter tail never occurs and every hedge looks fine (a lie). Solar anti-correlated with heating demand seasonally+diurnally; wind droughts persist days. DoD: temporal autocorrelation present; the joint cold-still tail demonstrated (SHOW the tail); winter-tail report compared to a real GB worst week (if our worst week is milder than reality, physics still wrong). loop_stage idle: FRAME design authored this session (docs/design/WEATHER_PHYSICS_HIERARCHY_DESIGN.md); BUILD opens in Epoch 3. Anchoring rule (anti-marking-own-homework): GENERATOR anchors (real historical weather/demand) and VALIDATOR anchors (independent published sub-national consumption stats / regional degree-days / published system demand) MUST be different sources; the company never validates against SIM ground truth.'
