- '2026-07-28 HARDEN/red-team #2 (Rule-0 self-refill dial-yield, dial 3 yielded -- no below-target work anywhere; director NTFYd; level HELD at 3, director-ratified L3). RED-TEAM GAP CLOSED (in file_scope, tests-only): the atom CENTRAL THESIS (director verbatim, WEATHER_PHYSICS_HIERARCHY.md) -- "cold-and-still is THE single most important GB power correlation; draw temperature and wind INDEPENDENTLY and the supplier-killing winter tail never occurs" -- had NO isolating control. Every prior control kills PERSISTENCE (phi->0) or COMPOUNDS regime+cov+phi; NONE isolate the temp/wind CROSS-CORRELATION (the off-diagonal of the Cholesky innovation covariance), so the single most load-bearing invariant was left with no both-ways mutation test on its OWN named defect (R15 killer pattern 1). PROVEN the envelope gate is BLIND to it first: decoupling temp/wind drops the envelope max ~57pct (10.99->4.73) but STILL clears the n=1 real worst week (1.45), so a binary reach gate cannot catch independent draws -- the coupling signal lives in the severity DISTRIBUTION. New test_temp_wind_coupling_is_load_bearing (tests/sim/test_weather_tail_demonstration.py): zeros ONLY the covariance off-diagonals (temp/wind drawn independently) while preserving the diagonal variances AND phi AND the regime by construction (marginals + persistence unchanged -- asserted in-test), then measures the TYPICAL (median) worst winter week. Both-ways proven live: coupled median 1.14 vs decoupled 0.024 -- a ~98pct collapse (robust across 5 seeds, ratios 0.01-0.11), passes the conservative <0.5x gate; feeding a coupling-agnostic engine (decoupled==coupled, ratio 1.0) FIRES the control. RELATIVE contrast (coupled vs decoupled computed identically), never an absolute tuned target (R12/R13). 21 tests green (was 20), engine 28 green, epistemic PASS, ZERO engine blast radius (test-only), file_scope respected. level_current STAYS 3.'
