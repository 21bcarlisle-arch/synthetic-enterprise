atom_id: PB7_the_company_learns_what_it_can_now_see
map_notes:
  gain: 'PB6 let the company condition its churn belief on payment method, using Ofgem''s published CIM w6 rates as the coefficient. That is legitimate -- a regulator''s public survey is exactly what a real supplier reads -- but it is a PRIOR, not a discovery, and the D-SEGMENT wall ruling is explicit that the company ''discovers everything else exclusively through acquisition and ongoing interaction, scored on the belief-vs-truth gap''. A supplier with a book of its own does not keep quoting the national survey at its own customers: it measures ITS OWN switching rate by payment method and updates. Until it does, the company''s belief cannot be WRONG, so the belief-vs-truth gap this project scores itself on has nothing to bite on -- and the enterprise value is the METHOD of finding customers, which a hardcoded constant is not. The prior-and-update shape already exists one module away: `enriched_churn_estimate` does exactly this for competitive pressure, where the published year table is used as a prior and updated by the company''s own realised losses against what it predicted.'
map_records:
  expert_hour_findings:
  - 'EXPERT HOUR SHARED WITH PB6, recorded 2026-09-30. BUILT 2026-09-06 L0->L2: the CIM coefficient became the prior to a precision-weighted update on the company''s own leavers by channel, on the same ledger and update rule as the market-wide multiplier; 9 controls, 17-mutation battery all killed, epistemic verifier PASS. The 2026-09-29 blind pass filed under PB6 (docs/observability/blind_review_ledger.jsonl) graded THIS row''s code: EH-1 was `CompetitivePressureLedger.payment_method_engagement_reading` (a raw channel/book ratio; now O/E against the pre-factor belief, blend `prior x (ratio/prior) ** w`), and Q7/Q9 passed the precision weighting. A second blind pass on the same subject would re-ask the same battery. Open residuals and their releases are PB6''s, store record 11: EH-2 (planted/null recovery) cannot be graded on a book of 84-91 closed decisions, only near PB1 scale; EH-3 is PB8''s unpublished migration rate; EH-4 is the director''s two-sided objective. Parked, not closed: L3 needs EH-2 graded, and nothing a bounded tick can run does that.'
  evidence:
  - 'FRAME 2026-10-03 (worker, discover/frame draw, no build): the park names three residuals, all PB6''s. There is a fourth, and it is this row''s own: the learned channel factor does not reach the renewal PRICE. `value_based_renewal` (the `_score` closure) calls `enriched_churn_estimate` without `payment_method`, although `payment_method` is in scope two lines up and already prices bad debt there. The factor reaches only the retention-discount offer, through `churn_desk.estimate_renewal_churn` -> `run_phase2b` (`company_est_pre`). So L3 also needs that argument forwarded, plus a control showing that the value arm''s `p_leave` moves when the learned factor moves. Two bounds before anyone builds it: (1) the factor is one scalar per channel, so it cannot reorder accounts within direct debit, where the 10-01 anti-ranking (-0.383) lives. That anti-ranking is all in the rate term, which is B8''s (WORKER_FINDING_THE_RETENTION_BELIEFS_ANTI_RANKING_..._2026-10-01). Forwarding the argument makes the learning reachable but will not fix that ranking. (2) EH-3: PB8''s 10-03 frame splits migration, and a supplier-authored DD->credit move needs no rate. A channel the company itself changed is observable to it, so that half of EH-3 no longer waits on a source; the household-authored half still does. EH-2 is unchanged: PB1 is closed at L2 and the book is still 84-91 closed decisions.'
