- '2026-07-27 MINTED into the map as a DRAWABLE ATOM from DIRECTOR_RULING_HARNESS_INVESTMENT_AND_ITS_EVIDENCE_2026-07-27 (Problem One: the DD seasonal cash-flow FRAME was named in the 2026-07-25 director steer + the PLANNER_MINTED_dd_seasonal_cashflow_physics mint-doc but existed as NO atom in maturity_map.yaml -- grep-confirmed; requirement is a drawable atom with real exit criteria, decomposition mine). FRAME is DISCHARGED (the mint-doc holds the 7-dimension evidence-cited FRAME: live engine is Variable-DD / pay-on-bill, every level-DD ingredient is dead scaffolding). Propose-then-proceed window CLOSED 2026-07-27 with no director revision -> BUILD proceeds. This is fidelity NOT a difficulty knob (R12/R13): level (Fixed) DD is the UK domestic NORM, the Variable-DD-only engine is the simplification; Fixed and Variable coexist (portability: payment-method first-class). SCOPE + EXIT CRITERIA (each sub-part its own falsifiable acceptance; DISJOINT enough for L1-serial/worktree at build-draw): DD1 level-DD mandate whose monthly_amount actually SIZES the collection + staggered payment_day 1-28 (wire the dead field), collection on the customer''s own anniversary [L2]; DD2 per-customer rolling credit/debit balance carried tick-by-tick, non-zero opening balance from W2_12 (do NOT duplicate), deterministic idempotent replay + NAMED RNG substream (C-S2) [L3]; DD3 held customer credit booked as a LIABILITY in the double-entry chart (today only VAT Payable) -- treasury cash including held credit is money owed back [L2]; DD4 annual DD review as a first-class event at anniversary+12m, variance +/-5%, a large increase routes to the satisfaction/complaint/churn organ [L2]; DD5 SITE -- held-credit liability position beside billed/settled/banked, labelled a liability, R11 render-verified on the live surface so a treasury figure never stands alone [L2]; DD-H HARNESS gap organ (close_to_learn sibling, gap-only no write) -- the company''s BELIEF of solvency (cash on hand) vs the TRUTH (cash minus held customer credit owed back); that belief-vs-truth gap IS the score, new fidelity-ledger row + per-digest gap [L2]. Sequencing DD1->DD2->DD3->DD5, DD4 parallel, DD-H needs DD2/DD3. RESERVED (register only, do NOT build): the variable/seasonal-DD PRODUCT (growth/product session) + the growth-timing solvency/MC-2 analysis (reserved growth/leverage session). Level moves stay blocked_on director_level_up (R16 -- agent builds L3-quality, no self-bump). Splits into DD1-DD5+DD-H disjoint sub-atoms at build-draw; the mint-doc is the decomposition reference. C-S2 (deterministic replay + RNG substream), epistemic wall (all 7 dimensions are company-side observables), one-way doors none.'
- '2026-07-27 SITE PORTION DISCHARGED + de-scoped from the SITE lane (bounded SITE-tick, orchestrator map-write, no level_current change -- R16). The only SITE-renderable sub-parts -- DD5 (held customer credit booked as a LIABILITY beside EVERY treasury figure: cash-rich-but-insolvent tell) and the DD1 staggered-payment-day tell -- are BUILT and LIVE across all surfaces: company-door state KPIs + finance panel (66ea41401), shadow rail full-key-set closure (5530d11d3), customer-door seasonal credit-cycle panel (81e827309), Proof surface caveat (c9fcec759), DD1 payment-day surfaced-as-instrumented (5fe63884c) -- R11 pixel-verified at build, R15 mutation + fail-closed arms added. site/customers REMOVED from file_scope so the ungated SITE lane (supervisor._site_lane_draw_concurrent draws ANY site-scoped atom with a level gap REGARDLESS of loop_stage) stops re-offering already-complete SITE work every tick. This was a DRAW-GAP: the residual level 0->3 gap is ENTIRELY the gated non-SITE physics (DD2-DD4 double-entry/balance-carry) + harness (DD-H belief-vs-truth gap organ), which are BUILD-lane company/sim/harness work, NOT SITE work. This atom is now a pure BUILD-lane physics atom; DD5s built-at-L2 quality folds into the whole-atom L3 ratification (blocked_on director_level_up applies at that move -- no self-bump). Rendering a richer per-customer seasonal trajectory NOW would fabricate the un-instrumented DD2 balance physics (wall violation) -- correctly deferred to the gated BUILD lane, never faked on the site.'
- '2026-07-29 DD4a BUILT -- the annual DD review is now a first-class LIVE event (was dead code). company/billing/dd_review.py held complete review logic (Ofgem SLC 27B +/-5pct variance, recommended=actual/12) but had ZERO live callers; new company/billing/dd_review_runner.py::run_annual_reviews drives it over the portfolio at each customer''s own 12-month anniversary, emitting a DDReviewEvent per completed year in a year-on-year re-estimation chain (each year''s standing DD = the prior year''s recommendation), with a large_increase (INCREASE beyond +15pct variance) material-shock flag. Wired ADDITIVELY into run_phase4c_on_phase2b.py right after build_dd_collection_book and surfaced in run_output_latest.json via annual_report.extract_report_data (annual_dd_review key). Safe-by-construction, mirroring the dd_collection_book precedent EXACTLY: reads ONLY the company''s own issued bills (customer_id/period_end/total_amount_gbp -- company-observable, epistemic_verifier PASS), draws no RNG, mutates nothing, changes NO existing financial figure (purely additive read-only artefact); deterministic + order-insensitive idempotent (C-S2). CONSUMER-VERIFIED against a REAL full run (main() -> extract_report_data): 119 reviews (58 increase / 38 decrease / 23 maintain), 42 material shocks, avg variance 18.5pct; the year-on-year chain confirmed live (C1 year-2 current_dd 79 == year-1 recommended 79). 11 closed-loop tests (tests/company/billing/test_dd_review_runner.py) incl a fail-closed large_increase flag: a moderate +5..15pct INCREASE is NOT flagged and a large DECREASE is NEVER flagged (R15-style -- the shock flag is a real >threshold-AND-increase test, not fail-open). NEXT GATED STEP DD4b (the CONSEQUENCE half, deliberately NOT built here): route large_increase events into the LIVE churn/resentment engine (company/core/resentment_ledger.py::ChurnJourneyRegister.record_friction via the run_phase2b.py complaint-flow analogue ~L1329-1392, FrictionEventType.PRICE_INCREASE/BILL_SHOCK amplifier-scaled by variance). Deferred because it shifts ground-truth churn and therefore published financials, needing population-level run verification + RNG-substream care -- the same caution dd_collection_book applied in NOT touching the ground-truth arrears/bad-debt pipeline. The large_increase seam is already emitted, so DD4b is wire-ready. Level moves stay blocked_on director_level_up (R16 -- agent builds L2-quality, no self-bump); atom stays level_current 0 with DD1-sizes-collection / DD2 (behind W2_12) / DD3 / DD-H still drawable BUILD.'
- '2026-07-29 DD2 BUILT -- the per-customer level-DD seasonal credit/debit balance is now carried tick-by-tick and the portfolio HELD-CREDIT LIABILITY it aggregates to is instrumented (was NOT: the only prior held-credit figure was the DD5 SITE floor in generate_shadow_html._held_credit_floor, whose own docstring says explicitly NOT the full level-DD seasonal cycle, DD1-DD4 designed not instrumented). New simulation/dd_balance_book.py::build_dd_balance_book: for each direct_debit customer (SAME payment_method gate as dd_collection_book) it collects the fixed standing level DD each month (year 0 = first bill amount, each later year = dd_review._recommended_monthly(prior-year actual) -- the SAME year-on-year re-estimation chain dd_review_runner walks, so DD2 and DD4a stay mutually consistent) and subtracts the actual bill, carrying the running balance; a positive balance = money owed back = LIABILITY, aggregated portfolio-wide per month with forward-fill across active months. Wired ADDITIVELY into run_phase4c_on_phase2b.py right after run_annual_reviews and surfaced in run_output via annual_report.extract_report_data (dd_balance_book key). Safe-by-construction like the two siblings: reads ONLY company-observable bill fields, draws no RNG, mutates nothing, changes NO existing financial figure; deterministic + order-insensitive idempotent (C-S2), time-scale invariant (C-S5); epistemic_verifier PASS. CONSUMER-VERIFIED by building against the REAL latest-run bills (N=1588): 9 direct_debit customers, 8 ever in credit, peak held-credit liability GBP1,949.51 in 2020-10 -- an AUTUMN peak, exactly the cash-rich-but-insolvent tell (summer build, winter draw-down). 10 closed-loop tests (tests/simulation/test_dd_balance_book.py) incl the population gate, cumulative-balance physics, held-credit=positive-balances-only, DD-reset consistency with DD4a, order-insensitive replay, and an R15-style mutation guard that a sustained-credit customer must move held credit off zero (fail-open guard). OPENING balance is ZERO -- the non-zero prior-tenancy opening belongs to W2_12_change_of_tenancy_debt_physics (gated), deliberately NOT duplicated here. NEXT GATED STEPS: DD3 books this liability into the double-entry chart (today only VAT Payable); DD-H weighs believed cash-on-hand against this owed-back truth as the belief-vs-truth gap organ. Both consume this module and are deliberately NOT built here. Level moves stay blocked_on director_level_up (R16 -- agent builds L3-quality, no self-bump); atom stays level_current 0 with DD3 / DD-H / DD1-sizes-collection still drawable BUILD.'
- '2026-07-29 DD3 BUILT -- held customer credit is now booked as a LIABILITY in the double-entry chart (before this the ONLY liability was VAT Payable, account 2100; held level-DD credit sat implicitly inside treasury cash and therefore inflated equity, so the balance sheet read healthier than it was). New in company/finance/double_entry.py: account 2200 (Customer Credit Balances Held, type liability); held_credit_journal_entries() posts the balanced reclassification DR Retained Earnings (3900) / CR Customer Credit Held (2200) -- assets untouched (the cash is genuinely held), equity down by the held credit, liabilities up the same amount, equation intact; balance_sheet_with_held_credit() is a NEW insolvency-aware view exposing customer_credit_held_gbp, naive_total_equity_gbp, true_total_equity_gbp and the cash_rich_but_insolvent tell (naive equity positive AND held-credit-adjusted equity negative). balance_sheet() was also generalised to SUM ALL liability-type accounts (was hardcoded to VAT Payable only) so a new liability is reflected not silently omitted -- identical value for every pre-DD3 journal (only 2100 ever posted), so NO existing published figure changes. Wall-clean + dependency-free: the functions take the held-credit figure as a plain float (company/finance imports no SIM code); the caller sources it from DD2''s company-observable balance book. Surfaced ADDITIVELY in annual_report.extract_report_data (dd3_held_credit_balance_sheet key) via _compute_dd3_held_credit_balance_sheet, which books the SEASONAL PEAK held credit (not the ~zero winter close) against the balance sheet cumulative TO the peak month -- a point-in-time-consistent test of whether the supplier was technically insolvent at the moment it held the most of other people''s money; the naive management_accounts balance sheet is UNTOUCHED. epistemic_verifier PASS. CONSUMER-VERIFIED on the REAL latest run: peak held credit GBP1,949.51 (2020-10) against real published equity GBP4.24M -> cash_rich_but_insolvent correctly FALSE (a well-capitalised company is cash-rich AND solvent; the tell does NOT fire falsely), and the reclassification entry balances (DR 3900 -> CR 2200 GBP1,949.51). 15 closed-loop tests (tests/company/finance/test_dd3_held_credit.py) incl R15 both-ways: fail-CLOSED rejection of non-finite/negative held credit (a negative NET balance is not a held-credit liability, never coerced to zero), the tell firing ONLY when held credit exceeds equity and staying silent when equity covers it, and total_liabilities reflecting a directly-posted 2200 balance (guards the old hardcoded-2100 fail-open). NEXT GATED STEP: DD-H (the belief-vs-truth solvency gap organ) consumes this view -- the company''s BELIEF of cash-on-hand vs the TRUTH net of held credit owed back; deliberately NOT built here (needs DD2+DD3, now both landed). Level moves stay blocked_on director_level_up (R16 -- agent builds L2-quality, no self-bump); atom stays level_current 0 with DD-H / DD1-sizes-collection still drawable BUILD.'
- '2026-07-29 DD-H BUILT -- the solvency belief-vs-truth GAP organ is now live (the close_to_learn HARNESS sibling of the DD2/DD3 physics; background/dd_h_solvency_gap.py). It holds the company''s BELIEF of solvency (naive_total_equity_gbp -- equity treating held customer credit as its own money) and the TRUTH (true_total_equity_gbp -- equity net of held credit owed back) side by side and computes the gap: gap_gbp = belief - truth = the held customer credit; gap_normalised = gap_gbp / belief (fraction of believed equity that is actually other people''s money owed back; 0 = books honest, >=1 = the cash-rich-but-insolvent tell, firing at exactly true_equity<0). The gap IS the score (COUPLED_TRIAD doctrine). GAP-ONLY + wall-clean: it lives in background/ (the one layer permitted to hold belief + harness-truth together, like gap_metric.py / live_payment_triad.py -- epistemic_verifier PASS), READS only the already-published docs/reports/run_output_latest.json DD3 block (every field a company-observable book value from saas/reporting/annual_report.py::_compute_dd3_held_credit_balance_sheet, which itself names DD-H as its consumer) and WRITES nothing back into any company/saas financial -- the company never sees its own solvency score. R12/SEVERANCE: never imported by supervisor.py/find_work, no number feeds the draw; the gap is a DIAGNOSTIC never a target. Surfaced per-digest in daily_self_note.py (a read-only RED-on-fail line) with a dated history row appended to docs/observability/dd_h_solvency_gap_ledger.json (record_gap; determinism C-S2 -- the clock is passed IN, never called inside the organ). CONSUMER-VERIFIED end-to-end on REAL code: _compute_dd3_held_credit_balance_sheet emits exactly the field names DD-H reads (GBP120k held / GBP500k believed -> gap 0.240, tell correctly False), and on the REAL run_output_latest.json (which predates DD3) DD-H honestly reports NOT-MEASURABLE rather than a fabricated gap=0 -- the FAIL-SILENT guard proven on live disk. 28 closed-loop tests (tests/background/test_dd_h_solvency_gap.py) cover R15 BOTH-WAYS: FAIL-OPEN (held credit moves the gap off zero; non-finite belief/truth/held REJECTED not coerced to zero), FAIL-SILENT (absent DD3 block -> not-measurable row, never gap=0), TAUTOLOGY (belief-truth cross-checked against held_credit; an inconsistent block REFUSES to score; the tell recomputed from the equities not copied from the block), plus the insolvency tell firing at gap>=1 and the severance/no-clock guards. This discharges the DD-H (harness) sub-part; DD1-sizes-collection (wire the dead monthly_amount/payment_day fields so the level DD actually SIZES the collection) remains the residual drawable BUILD sub-part, and DD2''s non-zero opening balance stays behind W2_12. Level moves stay blocked_on director_level_up (R16 -- agent builds L2-quality, no self-bump); atom stays level_current 0.'
- '2026-07-29 DD1-sizes-collection BUILT -- the LEVEL (fixed) DD collection is now a first-class record whose SIZE is the standing monthly amount, not the bill (before this, both DD collection surfaces left the standing amount dead: dd_collection_book is Variable DD -- every DDPaymentAttempt sized by the raw bill, its own docstring calling monthly_amount "an estimated reference level that never sizes or gates a collection"; DD2''s dd_balance_book computed the fixed standing level DD only to carry a running balance, sizing no collection record). New simulation/dd_level_collection_book.py::build_dd_level_collection_book: CONSUMES DD2''s DDBalanceBook (reading each BalancePoint.collected_gbp -- the fixed standing level DD from the SAME year-on-year re-estimation chain dd_review_runner/DD2 walk) and emits a fixed-amount LevelCollection per billed month landing on the customer''s staggered payment_day (staggered_payment_day/next_collection_on_day, DD1''s already-wired day-of-month physics). Consistency is BY CONSTRUCTION not re-derivation -- the standing amount has a single source (DD2''s output), so DD1/DD2/DD4a cannot drift apart; copying the re-estimation chain into a third module would be exactly the silent divergence the atom warns against. Fixed and Variable DD now coexist (payment-method first-class): this is the Fixed-DD counterpart to dd_collection_book''s Variable-DD raw-bill collections. Wired ADDITIVELY into run_phase4c_on_phase2b.py right after build_dd_balance_book and surfaced in run_output via annual_report.extract_report_data (dd_level_collection_book key). Safe-by-construction like the siblings: reads only DD2''s book + a pure per-customer digest, draws no RNG, mutates nothing, changes NO existing financial figure; deterministic + order-insensitive idempotent (C-S2), time-scale invariant (C-S5); epistemic_verifier PASS. CONSUMER-VERIFIED on the REAL latest run (N=1588 bills): 9 direct_debit customers / 751 level collections (matching dd_collection_book''s own 9-mandate/751-attempt DD population), total level collected GBP119,876.56; a real customer''s collections FIXED at GBP92.21 while consumption swings (GBP92.21 -> GBP87.05 -> GBP90.01) on staggered day 14 -- the level-DD tell. 10 closed-loop tests (tests/simulation/test_dd_level_collection_book.py) with R15 BOTH-WAYS: FAIL-OPEN (a level collection must be FIXED within a year though the bills vary -- a bill-sized collection would fail it; the _windows_fixed guard flips False on a hand-built varying schedule, proving all_schedules_level_fixed is a real check not a fail-open True), the both-ways partner (a genuine re-estimate at a year boundary DOES move the fixed amount, not frozen forever), the by-construction consistency contract (each amount == DD2''s collected_gbp), the inherited DD population gate, staggered-day placement, and deterministic order-insensitive replay. This discharges the DD1-sizes-collection residual; DD2''s non-zero OPENING balance (behind W2_12, itself blocked_on director_level_up) and DD4b (the consequence half routing large_increase into the churn engine, deferred as it shifts ground-truth financials) remain the only unbuilt sub-parts. Level moves stay blocked_on director_level_up (R16 -- agent builds L2-quality, no self-bump); atom stays level_current 0.'
- '2026-07-29 DD4b DESIGN CORRECTED + BUILD held on a two-way door (R7/R9 finding on real code, evidence-cited line refs below; SELF_INTERRUPT_DISCIPLINE = QUEUE the corrected design, do NOT rush a headline-figure-shifting change into the main ground-truth loop in a bounded tick). Reading the LIVE churn path proves the recorded DD4b route is THEATRE: routing large_increase into ChurnJourneyRegister.record_friction (as this atom''s DD4a note AND company/billing/dd_review_runner.py:24-33 docstring both specify) would NOT shift ground-truth churn or financials -- the resentment/journey ledger is PARALLEL OBSERVABILITY (written to churn_journey_log at run_phase2b.py:1403, is_burned forces the journey to COMPARING but roll_lifecycle_event.record_decision is driven by the roll OUTCOME, never the reverse), never read by the decision. The ACTUAL ground-truth churn lever is roll_lifecycle_event(satisfaction_score=_nf_satisfaction) -> adjust_churn_for_satisfaction (customer_events.py:120-122), and _nf_satisfaction = sim_satisfaction_score(bill_shock_count=_nf_shock_count,...) (run_phase2b.py:1325) where _nf_shock_count = _elec_rate_shock_counts ONLY (run_phase2b.py:1312; sim_satisfaction.py applies _BILL_SHOCK_DELTA=-0.10 per shock -> lower satisfaction -> higher realized churn). So a large DD-review increase can shift churn ONLY by feeding a shock into the SIM GROUND-TRUTH satisfaction model -- which makes DD4b a SIM BASELINE-FIDELITY change (R13: decided BLIND to P&L; legitimate as real fidelity -- a household whose monthly DD jumps 15pct+ at annual review is genuinely less satisfied and likelier to churn -- explicitly NOT a P&L-tuning knob, R12). TWO-WAY-DOOR FILTER holds the BUILD on an unresolved upstream architecture question (C-S3 ordering): the annual DD review needs a full year of issued bills, but bills = build_monthly_bills(...) is computed in run_phase4c_on_phase2b.py:534 AFTER run_phase2b() has already resolved churn -- the review consequence cannot be recorded in the same pass that decides churn. Resolving it needs a DESIGNED choice (option A two-pass: run phase2b, derive large_increase reviews from its bills, re-run phase2b with a DEFAULT-EMPTY dd_review_shock map injected as-of each review date -- deterministic because churn RNG is ALREADY per-customer/per-term seeded random.Random("{cid}_{term_start}") at customer_events.py:98 so injecting X shock never shifts Y roll, C-S2 satisfied; VERSUS option B inline per-customer annual-bill accumulation in the term loop). Per DON''T ACCRETE / OPS1 that architecture is designed+ratified FIRST, never bolted into the most delicate file in the repo in a bounded tick. VERIFICATION PLAN when built: full-population run, published headline delta EXPLAINED not targeted (R12), epistemic_verifier PASS (SIM-side change), R15 BOTH-WAYS (a large DD INCREASE raises that customer bill_shock_count / lowers sim satisfaction -> higher realized churn probability; a maintain/decrease does NOT). This corrects the seam so DD4b is CORRECTLY specified rather than mis-specified-deferred; the BUILD remains the residual, honestly held on the C-S3 architecture decision + its R13 baseline-fidelity framing. DD2 non-zero OPENING stays walled behind W2_12; level moves stay blocked_on director_level_up (R16).'
- '2026-08-03 DD BUILD VERIFIED END-TO-END + level_current 0 -> 2 SELF-CERTIFIED (R16 record in gate_authorizations.jsonl). All six sub-parts are committed, live in the PUBLISHED run output, and measurable: docs/reports/run_output_latest.json carries dd_balance_book, dd3_held_credit_balance_sheet, annual_dd_review, dd_level_collection_book and dd_collection_book; background.dd_h_solvency_gap.measure_from_run_output() now returns measurable=True on the real artefact (belief equity 4,118,110.43, truth 4,116,298.23, held credit / gap 1,812.20, gap_normalised 0.00044, cash_rich_but_insolvent False, as_at 2020-10) where on 2026-07-29 it honestly reported NOT-MEASURABLE. The cell read level 0 with NO ledger entry at all while every sub-part was built and live -- the stale-cell class again; re-VERIFIED against artefacts, not re-stamped. Held at 2 and not 3 deliberately: expert_hour is not_attempted, DD4b is unbuilt, and the opening-DD sizing defect below is pinned OPEN.'
- '2026-08-03 C-S5 FAIL-OPEN FOUND AND FIXED in simulation/dd_balance_book.py. The module docstring claimed time-scale invariance -- "monthly, quarterly, or accelerated billing all carry the same way" -- and the claim was FALSE: the carry loop collected exactly ONE standing DD per BILL. A level DD is collected MONTHLY however often the customer is billed, so a quarterly-billed DD customer was modelled as paying 4 direct debits a year against 12 months of energy: a 3x under-collection that manufactures a debit balance out of the billing cadence alone, and would feed straight into DD3''s booked liability and DD-H''s gap. Now collects months_elapsed_since_previous_bill * standing (>=1). BalancePoint gains n_collections, and collected_gbp deliberately stays the PER-COLLECTION standing amount because DD1''s dd_level_collection_book sizes its fixed collections from that field -- folding the multiple in would make DD1 emit one treble-sized collection a quarter and silently flip its own all_schedules_level_fixed guard. R15 both ways: 3 real source mutations, each firing a named test, baseline restored green. NO published figure moves: the real book bills monthly with ZERO month-gaps, so the correction is byte-identical today and structural/future-facing -- honest bound, that gap check ran on the 6 serialised sample trajectories, not all 8 DD customers.'
- '2026-08-03 MEASURED DEFECT, PINNED NOT FIXED -- the opening standing level DD is sized from the customer''s FIRST BILL, i.e. one seasonal month annualised flat, so the DD a customer is put on is a function of the month they walked in. Measured on the real book (year-0 standing DD vs that customer''s own realised year-0 average): C2g gas April join +33.2%, C3g gas July join -46.3%, C4g gas October join -6.6%, against C1 +2.1% / C2 -1.0% / C3 +2.6% for the weakly-seasonal electricity accounts -- the error is a GAS error because gas is where the seasonality is. C2g''s mis-sizing alone builds 293.49 of spurious year-0 held credit and persists to a 411.77 later peak, against a portfolio peak of 1,812.20, so this is not cosmetic to the atom''s own headline figure, nor to DD3''s liability, nor to DD-H''s gap. A real supplier sizes the opening DD from the industry EAC/AQ handed over at registration or from a published seasonal profile, precisely so it does NOT depend on the join month. Pinned as a STRICT xfail (tests/simulation/test_dd_balance_book.py::test_opening_dd_size_must_not_depend_on_the_join_month) so an improvement FAILS and forces the claim to be corrected rather than the defect being silently outgrown -- proven live by mutating the source to annual/12, which XPASSes it. NOT fixed here because it needs a published monthly-shape source and no coefficient in this codebase may be fabricated; minted as atom D_opening_dd_seasonal_sizing. NOTE for that atom: tests/simulation/test_dd_level_collection_book.py::test_collection_is_fixed_within_year_though_bills_vary and ::test_re_estimation_moves_the_fixed_amount_between_years both PIN the first-bill sizing and go red on the fix -- they are expectation updates, not regressions.'
- '2026-08-03 THE DD2 OPENING-BALANCE RESIDUAL WAS WRONG IN BOTH HALVES, corrected in the module docstring; it is NOT drawable and must stop being carried here as though it were. (1) It is not the prior occupant''s debt: SLC 27 / SLC 12.2, and company/crm/change_of_tenancy_register.py''s own opening lines, put debt on the PERSON not the property -- an incoming occupant inherits nothing and cannot be refused supply over it. A real non-zero opening is the occupant''s OWN deemed-supply arrears between day 1 of possession (DeemedLeg.NEW_OCCUPANT) and their own DD mandate starting. (2) W2_12 reaching its level target does NOT unblock it: TenancyChangeCoupler has no production caller anywhere in the repo (grep-verified, only its own tests), and simulation/life_events.py emits no move event of any kind, so the SIM has no tenancy-change stream to couple and there is nothing live to open a balance from. Wiring an opening_balances argument now would be a live mechanism with a permanently dead input -- the recurring orphan-transition class. Registered as WIRING work on W2_12''s own cell, not as a DD residual that looks drawable and is not.'
