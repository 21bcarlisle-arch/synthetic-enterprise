  origin_note: 'MINTED FROM deliverable 2 of the WORK THIS CREATES block in DIRECTOR_RULING_HOOK_BYPASS_AND_SURGICAL_LANDING_2026-08-09: "the interim shape''s retirement note once it lands". THE SHAPE: commit d6f894b6e (2026-08-09) is the ONE retroactively sanctioned hook-bypass, valid only with all four conditions together — disclosed in the commit message in its own paragraph, both parents independently gated, docs-only (no code, no level move), and filed. The ruling states it expires when the surgical-landing tool lands. WHY IT IS A SEPARATE ATOM RATHER THAN A LINE IN OPS4: an expiry that lives only in the prose of the ruling that granted it is an orphan transition (R11) — the release triggers nothing, and a retro-sanctioned exception with no executed expiry becomes the rule by default. EXIT: (1) when OPS4 lands, docs/design/SURGICAL_LANDING.md carries the retirement note — the shape, the four conditions, the single commit it covered, and the date it ceased to be available; (2) CLAUDE.md and the memory record stop describing the four-condition shape as an available interim move and point at the tool instead; (3) a control asserts the retirement is real rather than declared — the same enumeration shape as test_the_permission_surface_is_gone, so a future re-introduction of the interim shape fails a test rather than depending on someone remembering; (4) nothing here weakens the WALL: the ruling stands regardless of whether the tool lands, and this atom must never be readable as making bypass available again while OPS4 is pending.'
