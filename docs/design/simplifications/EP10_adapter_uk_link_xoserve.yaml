  - '2026-08-13 EP10 DISCOVER+FRAME (LANE 3 worker tick). Level HELD at 0, no BUILD code -- the atom is epoch-gated per its own block_reason and EPOCH_GATING_AND_ATOM_AUTHORSHIP Rule 1 permits DISCOVER/FRAME only; no maturity_map.yaml edit either, because the shared index carries another lane staged level_current hunk (R16). THE ATOM IS FILED AS AN ADAPTER AND ITS GAIN IS NOT IN THE ADAPTER. (1) THE COMPANY HALF IS ALREADY BUILT AND ENTIRELY DEAD: eleven gas/industry-systems modules (uig_allocation_register, gas_network_ledger, shipper_code_register, gas_nomination_register, gas_nominations, gas_imbalance_ledger, gas_interruption, gas_otc_book, gas_storage, supply_point_register, meter_points), 1,393 lines, ZERO non-test importers by strict import check; uig_allocation_register alone carries 35 named tests across tests/company/market/test_uig_allocation_register.py (10) and test_phase_gn_uig_allocation.py (25) and has never been constructed by production code. The first BUILD move here is a WIRING decision, not a new-module decision -- a builder who reads the atom title and starts writing an adapter writes the twelfth module in a stack of eleven that nothing calls. (2) THE WORLD HAS NO RESIDUE TO BE WRONG ABOUT: grep -i uig over simulation/ and sim/ returns nothing; simulation/gas_settlement.py settles per gas day carrying gas_ccl_gbp, gas_policy_cost_gbp, gas_network_cost_gbp and gas_standing_charge_gbp and NO unallocated-gas term; no zone or LDZ concept exists anywhere in simulation/ or sim/ (the only Zone hits are TNUoS Triad zone 14 in simulation/triad.py, an electricity concept); company/interfaces/sim_interface.py exposes gas only as a fuel string for price lookup. Total gas in equals total gas metered BY CONSTRUCTION, so the advertised belief-vs-truth gap is structurally impossible today and the COUPLED TRIAD rule blocks L3 on an adapter alone. This is the world-X-is-the-company-estimate class. (3) THE BUILT REGISTER CANNOT EXPRESS ITS OWN SPEC ("per LDZ per gas day"): granularity is the calendar month (record_allocation coerces settlement_month to day 1); there is no LDZ field on UIGMonthlyRecord; the residue arrives as a CALLER-SUPPLIED ARGUMENT, so whoever calls decides the truth and nobody calls; and the module references gas_network_ledger only in its DOCSTRING, never an import, while two unconnected zone vocabularies (gas_network_ledger.GasTransporterZone, 8 GDN zones, and shipper_code_register.LDZ) sit beside it. Meter read classes 1-4 -- the causal story behind the residue, since annual-read supply points are estimated between reads -- have no implementation anywhere (read_class/ReadClass returns nothing across company/, simulation/, sim/). Related and already parked, not re-filed: tools/build_battery_register.py GAS-7 records that no gas-day 05:00 boundary exists in the tree. (4) THE ACCESS CLASS IS NOT WHAT BLOCKS THE FIDELITY. The Data Services Contract gates the TRANSPORT, not the physics. The smallest closed loop -- world generates a residue per LDZ per gas day (LDZ input minus metered offtakes it knows it delivered) -> company reads ONLY its monthly allocated scalar across the existing sim_interface seam -> wire the EXISTING register -> harness measures attributed-vs-generated per LDZ per month -- needs no gated Xoserve surface and no EP6 typed wall protocol. Sequencing if ever pulled forward: read classes -> world residue -> wall observable -> wire the register -> ADAPTER LAST. What genuinely holds EP10 is the epoch-3 curriculum sequencing in its own block_reason, unchanged by this pass. Full analysis: docs/design/EP10_UK_LINK_XOSERVE_DISCOVER_FRAME.md'
