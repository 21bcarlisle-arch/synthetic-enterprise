atom_id: H20_parallel_maintenance_lane
simplifications:
- '2026-07-16 REGISTERED from PARALLEL_MAINTENANCE_LANE.md (director-decided, P1, DIRECTOR-PRIORITISED to build SOON). Self-repair/housekeeping runs PARALLEL to product, not stolen from it: a maintenance worker draws its own work-type (bug-fixes, notification hygiene, stale-marker cleanup, cosmetic-defect burndown) concurrently with the BUILD forks, colliding only where file_scopes genuinely overlap (tree-lock as today; ARCH1 interfaces increasingly prevent overlap). First workload: (1) kill the archive-on-consumption defect properly (no .local-uncommitted-*.bak artifacts, clean done/ archival, no re-emission, the done/-guard holds); (2) make ALL notifications transition-only per R5 (retro-cadence transition-only fix already landed; sweep the rest). Guardrails: bounded by verification-throughput not worker count; same daemon governance (predicate-gated escalation, Rule 0, per-atom integration, kill flag); utilisation is a diagnostic never a target. This is the structural fix for why the machine does one thing at a time — once lanes-by-work-type exist, parallel is automatic. BUILD slice = a maintenance-lane worker under the existing walls (a new WORKER, not a new authority).'
- '2026-07-16 FRAME (first design doc): parallel maintenance-lane worker architecture, concurrency/file-scope collision model, governance inheritance, first-workload spec, L0->L3 DoD + BUILD-open questions. Doc-only, no BUILD code (EPOCH_GATING R1). Level HELD at 0 (BUILD-gated).'
