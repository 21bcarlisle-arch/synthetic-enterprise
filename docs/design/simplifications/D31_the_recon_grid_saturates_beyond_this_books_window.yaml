  name: 'SPUN OUT OF H27 EXPERT HOUR #13 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT DISCIPLINE). Hour #12''s lead 1, taken, and it found something larger than the missing field it went looking for. D29 built ONE saturation rule for two sweeps and said so in as many words -- `_check_saturation_and_collapse` exists ''so a saturation rule can no longer exist on one side of `in_causal_path` and not the other ... because there is only one of it''. There are THREE counterfactual-company knobs in this harness and the rule reached two: `organ_reconciliation_drift_days`, whose register is ORGAN_QUERY_GRID -- atom D23''s, the register that FOUND this class -- still built its sweep from its own declarations ({0,1} | invisible | visible | pairs) and had no notion of a collapsed RUN, a saturation EDGE or an UNDEFINED reading at all. Eighth escape of a register''s own keying, on the origin register. MEASURED 2026-08-11 on a book-derived grid (110 counterfactual companies, one integer per day from below the earliest issue-date crossing to above the last `as_of` crossing), n=300, seeds 7/11/23, every run identical on all three: the SET reading -- which IS the published `detection` gap -- has SIXTEEN groups of companies publishing one bit-identical figure, saturating BELOW -6d (sixteen companies, all on the no-skill 0.5, because every one of them has flagged every invoice by `as_of`) and ABOVE +82d, against TWO declared pairs; +7d, declared VISIBLE as this entry''s evidence of resolution, sits inside the collapsed run {+6,+7}; and the DATE reading publishes NO reading at +87/+88, where the latency population empties -- counted as MOVEMENT, i.e. an instrument that had stopped reading scored as resolution, the fail-open D28 closed for the other two knobs. THIS ATOM IS THE RESHAPE -- a scored book whose invoices do not all fall inside one `as_of` window, so the detection SET can still change beyond +82 and a supplier reconciling three months late is distinguishable from one reconciling four; it moves a published number and is therefore a mint rather than a fix on sight. R12: no published figure moved in Hour #13''s commit; what moved is what the instrument admits about itself. ALREADY LANDED UNDER H27''s HOUR: COUNTERFACTUAL_KNOB_ROUTE, whose keyset is DERIVED from `score_triad`/`build_scenario`''s own signatures so a knob with no book-derived grid and no checker RAISES, with each named checker AST-verified to REACH the shared rule transitively (naming it is not running it); `book_recon_drift_grid`, complete rather than dense and asserted against its own AST never to read a register, with `collapsed_runs`/`undefined_drifts` deliberately NOT unioned into the sweep; an undefined region admitted only as a WITNESSED bound (`reading is None` exactly where the population is empty -- D24''s bound-vs-debt distinction, generalised into the shared rule); the floor at -19d attributed to `PAYMENT_TERMS_DAYS + DEFAULT_RECONCILIATION_GRACE_DAYS` and PREDICTED from those constants alone, which is the census answer D30 pointed at without giving (its `why` discharged PAYMENT_TERMS_DAYS to ''registered there'' and this register named no constant at all; the grace window is not even in the census''s subject); and both edges stamped at source on the detection and latency dimensions'' note AND components.'
