atom_id: D31_the_recon_grid_saturates_beyond_this_books_window
simplifications:
- "2026-08-12 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD\ncode written and nothing in `file_scope` touched: this atom is `loop_stage: idle`, and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom\nwhile BUILD is not. Output is this record.\n\nWHAT IS ALREADY SHIPPED, READ OFF HEAD RATHER THAN OFF THE ATOM'S PROSE. The atom's `name`\nends with a list headed \"ALREADY LANDED UNDER H27's HOUR\". Checked against\n`git show HEAD:tools/couple_w2_11_d5.py`, that list is accurate -- `COUNTERFACTUAL_KNOB_ROUTE`,\n`book_recon_drift_grid`, `predict_recon_floor_from_constants`, `counterfactual_knobs` and\n`edge_constants` are all present at HEAD, and `_check_saturation_and_collapse` is now reached\nby all three knobs' checkers. So the INSTRUMENT half of Hour #13 is landed and this atom's\nown residue is the RESHAPE only: a scored book whose invoices do not all fall inside one\n`as_of` window.\n\nTHE BOOK'S WINDOW IS TWO ARITHMETIC IDENTITIES, AND ONLY ONE OF THEM IS OWNED.\n`book_recon_drift_grid` returns `range(lo, hi + 1)` with\n\n    lo = min(issue - due) - grace - 1\n    hi = max(as_of - due) - grace + 1\n\nBoth ends are constants of the harness, not properties of the world:\n\n  * `issue = due - PAYMENT_TERMS_DAYS` for EVERY invoice (`build_scenario`, one expression,\n    no per-customer term), so `min(issue - due)` is exactly `-14` and `lo` is exactly `-20`,\n    on every seed and every n. The floor edge `-(PAYMENT_TERMS_DAYS +\n    DEFAULT_RECONCILIATION_GRACE_DAYS) = -(14 + 5) = -19` sits one step inside it. This is\n    what `predict_recon_floor_from_constants` predicts, and it agrees.\n  * `as_of = FIRST_DUE_DATE + PERIOD_SPACING_DAYS x (N_PERIODS - 1) + BILLING_CYCLE_SPREAD_DAYS\n    - 1 + AS_OF_BUFFER_DAYS` = `21 x 2 + 21 - 1 + 30` = **+92** past `FIRST_DUE_DATE`, so where\n    the oldest invoice drawn sits ON `FIRST_DUE_DATE` the grid runs to `92 - 5 + 1 = +88` and\n    the last drift at which any invoice is still detected before `as_of` is **+87**. That is\n    the \"publishes NO reading at +87/+88\" the Hour measured, recovered from constants alone.\n\n**There is no ceiling predictor.** `grep -c \"predict_recon_ceiling\\|recon_ceiling_from_constants\"\ntools/couple_w2_11_d5.py` returns `0`. The census-class rule this module has applied five times\n-- a constant that bounds a resolution claim must be OWNED by the register whose claim it bounds\n-- was applied to the floor and not to the ceiling, and the ceiling is the edge this atom is about.\n\nAND THE CEILING IS THE EDGE THAT MOVES. Measured this tick, `observed-with-evidence`, by\nevaluating `_billing_cycle_offset`'s own hash (`sha256(\"h27_billing_cycle:\" + cid)[:8] % 21`)\ndirectly -- no scenario built, no sweep run, no seed drawn:\n\n    n     seed 7      seed 11     seed 23      <- grid hi (the +edge)\n    1       +74         +74         +76\n    2       +74         +84         +80\n    5       +83         +84         +84\n    10      +88         +84         +86\n    25      +88         +88         +88\n    300     +88         +88         +88\n\n`hi` is `max(as_of - r.due_date)` over the records ACTUALLY DRAWN, and the oldest invoice\ndrawn is `min(cycle_offset)` over the customers actually drawn. At small n no customer draws\noffset 0, the oldest invoice is younger, and the top of the grid walks in by up to fourteen\ndays. The floor cannot do this: `issue - due` is the same constant for every record, so `lo`\nis `-20` at n=1.\n\n**This is the population-dependence `as_of` was deliberately built to refuse, one function\naway.** `build_scenario`'s own comment on the line above says `as_of` is taken from the latest\ndue date the CYCLE can produce, \"not from the latest one this draw happened to produce\",\nbecause \"a population-dependent `as_of` would quietly shorten that for a small n and make the\nreading depend on how many customers were drawn\". `book_recon_drift_grid` then reintroduces\nexactly that dependence on the other end of the same interval.\n\nWHY NOTHING CAUGHT IT, WHICH IS THE R15 POINT. Every certification of this grid is at\n**n=300**, where all three seeds sit at `+88` and the dependence is bit-invisible. The Hour's\nown evidence -- \"n=300, seeds 7/11/23, every run identical on all three\" -- is true, and is\ntrue precisely because the sweep was never asked at an n where the answer changes. Seeds were\nvaried; the population size was not. A control certified only at the n at which its subject is\nstable has the same shape as a control certified only where it had already answered\n(`WORKER_FINDING_THE_REGISTER_WAS_ONLY_EVER_ASKED_WHERE_IT_HAD_ANSWERED_2026-08-11`), with n in\nplace of the key.\n\nR12: no published number moved. Nothing was tuned; nothing in `file_scope` was edited. The\ndetection gap and the latency mean are whatever HEAD already published.\n\nFRAME -- THE RECOMMENDATION. Two pieces, and the ORDER matters because only the second is the\nreshape this atom was minted for.\n\n  1. **FIRST, AND IT IS NOT THIS ATOM'S RESHAPE: own the ceiling the way the floor is owned.**\n     A `predict_recon_ceiling_from_constants` (PERIOD_SPACING_DAYS, N_PERIODS,\n     BILLING_CYCLE_SPREAD_DAYS, AS_OF_BUFFER_DAYS, DEFAULT_RECONCILIATION_GRACE_DAYS), declared\n     in `edge_constants` and cross-checked against the sweep exactly as the floor is, plus a\n     VACUITY-style guard that the grid's measured `hi` equals the predicted ceiling -- which is\n     the assertion that FAILS at small n and is therefore the one worth having. This is cheap,\n     moves no published figure, and is a candidate fix-on-sight for the next BUILD tick on this\n     module rather than a mint. It is recorded here and NOT done now because this atom is\n     parked and `file_scope` is closed to a DISCOVER draw.\n  2. **THEN the reshape, which is what D31 actually owes.** A book whose invoices do not all\n     fall inside one `as_of` window -- so that beyond `+87` the detection SET can still change\n     and a supplier reconciling three months late is distinguishable from one reconciling four.\n     Note what piece 1 establishes about it: the ceiling is `AS_OF_BUFFER_DAYS` plus the cycle's\n     own span, so the reshape is NOT \"raise N_PERIODS until the window is wide enough\" -- that\n     moves the published figure by changing the book every dimension reads, which is why this is\n     a mint. The design worth framing is a book with a STAGGERED `as_of` per cohort (or\n     equivalently a tail cohort whose invoices are old relative to a single `as_of`), so the\n     detection set keeps resolving past the current ceiling WITHOUT lengthening the book the\n     other four dimensions are certified against.\n\nBLAST RADIUS -- WHY PIECE 2 IS A MINT AND NOT A FIX ON SIGHT. The detection SET reading IS the\npublished `detection` gap. Any change to the book's shape moves it, and four other dimensions\n(ageing, both belief figures, detection_latency) are certified against that same book -- their\ndeclared bands, floors and collapse runs are all keyed to its span. Changing the window is\ntherefore a re-certification of five dimensions, not one. That is exactly the \"real blast\nradius\" the atom's own text names, and it is why this tick frames it rather than doing it.\n\nONE THING THIS TICK DID NOT MEASURE, SAID PLAINLY. The SET reading's upper saturation was\nmeasured by the Hour at **+82**, five days inside the `+87` the constants predict for the DATE\nreading. That five-day gap is NOT explained by the identity above, and this tick did not\ndetermine what sets it (the plausible reading -- that it is where the last invoice that can\nstill be flagged stops being flagged, which depends on the payment-method mix rather than on\nthe calendar -- is `inferred`, not observed, and is not asserted here). Piece 1's ceiling\npredictor as scoped above predicts the GRID edge and the DATE reading's edge; whether the SET's\nown ceiling is predictable from constants at all is open, and a predictor that quietly claimed\nboth would be a wrong-subject control of the kind this module has now filed nine times.\n\nWHY THE LEVEL DOES NOT MOVE. Level 2 for this atom means the reshaped book BUILT and\nmutation-proven both ways. A DISCOVER/FRAME tick on a parked atom may not write it, and an exit\ncriterion is not renegotiated to fit what a tick was allowed to do. `level_current` stays 0.\n\nLEADS FOR THE NEXT HOUR. (a) Piece 1 above -- the unowned ceiling -- is the cheapest real\ncontrol this module is currently missing. (b) The n-dependence found here is a question about\nevery book-derived grid in this module, not just this one: `book_memory_grid` and\n`dense_drift_grid` were certified at the same single n=300, and whether either of their edges\nmoves with the draw has not been asked. That census is not this atom's."
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched. This tick took the ONE THING the 2026-08-12 note\nsaid plainly it had not measured -- \"whether the SET's own ceiling is predictable from\nconstants at all is open\" -- and it turned out to answer a bigger question: the cause the\nregister PUBLISHES for that ceiling is false, and the true cause is not the book's window at\nall. The atom's own subject line (\"the recon grid saturates beyond this book's window\") is\ntherefore half right: the DATE reading's edge is the book's window; the SET reading's is not.\n\nWHAT IS PUBLISHED TODAY. `organ_query_grid_saturation_caveat` -- the caveat that travels with\nthe detection and latency numbers -- renders, verbatim at HEAD: the SET reading \"saturates\nBELOW -6d ... and ABOVE +82d, where nothing further is detected before `as_of`\". The register\nsays the same thing in as many words (`flagged_via_reconciliation`: \"ABOVE +82 nothing further\nis detected before `as_of`\").\n\nTHE NUMBER REPRODUCES; THE CAUSE DOES NOT. Measured this tick, `observed-with-evidence`,\nn=300, seeds 7/11/23, one `build_scenario` per seed and `score_triad` swept over\nk = +60..+88 of `organ_reconciliation_drift_days` (the shipped knob, no monkeypatching, sets\nread off `score_triad`'s own returned `sets`):\n\n  * The declared runs reproduce EXACTLY. The cross-seed grouping over +74..+88 gives\n    (76,77,78), (80,81), (82..88) -- three of `_RECON_SET_COLLAPSED_RUNS`' declared runs,\n    bit-for-bit, and `saturates_above=82` with them. Nothing about the shipped arithmetic is\n    wrong.\n  * But detection HAS NOT STOPPED at +82. The reconciliation detector is still flagging, and\n    the set of cases it flags is still CHANGING, on every seed:\n      seed  7:  k=+80 -> 12 recon flags, +82 -> 6, +84 -> 4, +86 -> 3, +87 -> 0\n      seed 11:  k=+80 ->  4,             +82 -> 3, +84 -> 2, +86 -> 2, +87 -> 0\n      seed 23:  k=+80 ->  9,             +82 -> 7, +84 -> 3, +86 -> 1, +87 -> 1, +88 -> 0\n    The drift at which recon detections actually cease is +87 (seeds 7, 11) / +88 (seed 23),\n    which is the CALENDAR edge the constants predict -- and it is the DATE reading's edge, five\n    to six days beyond the SET's. The caveat has stamped the sibling reading's cause on this\n    figure: D32's finding (`ORGAN_QUERY_GRID`'s own sub-reading number republished as the\n    published figure's), one field over, in the field D31 itself wrote.\n\nTHE TRUE CAUSE, TWO MECHANISMS, BOTH POPULATION-SIDE AND NEITHER A CALENDAR.\n  1. THE DD CHANNEL MASKS THE RECON DETECTOR. The published set is\n     `flagged_via_dd_channel | flagged_via_reconciliation`, so a case the bank feed already\n     reported stays in D no matter what the reconciliation detector does. Measured: the\n     RECON-ONLY population (`FR - FD`) is EMPTY at +82 and above on all three seeds, so every\n     case leaving the recon set above +82 leaves the union unchanged. Seed 23 is the extreme\n     witness -- |D| is a constant 83 from +75 to +88 while its recon set falls 15 -> 0.\n  2. THE EXCLUSION BAND ABSORBS THE LAST ONE. `gap_metric.detection_measures` scores\n     (|S\\D|/|S| + |D&N|/|N|)/2, and a case in U that is in neither S (truly failed) nor N\n     (never-flaggable) -- an invoice legitimately flagged and eventually PAID -- moves neither\n     rate. That band is 212/209/213 of 900 cases (seeds 7/11/23, against |S|=102/96/113,\n     |N|=586/595/574). Measured over all 14 steps of +74..+88 on all three seeds: EVERY drift\n     at which the gap moved had a leaver in S, and EVERY drift where |D| changed with no\n     leaver in S or N left the gap BIT-IDENTICAL. The cleanest single witness is seed 7 at\n     +81 -> +82: |D| falls 70 -> 69, one case leaves the union, and the published gap is\n     bit-identical 0.16176470588235295 either side. A set reading whose set changed and whose\n     figure did not.\n\nAND THE PREDICTOR IS EXACT, WHICH IS THE PART THE NEXT BUILD TICK CAN USE. Define k* as the\nlast drift at which a RECON-ONLY case in (S union N) is still flagged. Measured k* and the last\ndrift at which the published gap actually moved:\n\n    seed  7:  k* = 79   last gap movement = 80\n    seed 11:  k* = 81   last gap movement = 82\n    seed 23:  k* = 74   last gap movement = 75\n\n`last movement = k* + 1` on all three, exactly. So the SET reading's ceiling IS predictable --\nbut from the POPULATION (which cases are truly-failed, which are DD-visible, which are in the\npaid-late exclusion band), never from the constants. This is the D25/D30 population-side\npredictor shape rather than the D31 floor's constants-side one.\n\nWHICH BOUNDS LAST TICK'S PIECE 1, AND THE ANSWER IS NEGATIVE. The 2026-08-12 note recommended\na `predict_recon_ceiling_from_constants` and flagged the risk that \"a predictor that quietly\nclaimed both would be a wrong-subject control of the kind this module has now filed nine\ntimes\". Measured, that risk is real and now specific: the per-case last-flaggable drift is NOT\nthe calendar quantity `(as_of - due) - grace`, because `expected_collection_misses` reads OPEN\nitems -- a case's flag window closes when the invoice is PAID, not at `as_of`. Witness: at\nseed 7 a case whose calendar quantity is +84 left the union at +79. So piece 1 stands, with its\nSUBJECT pinned: a constants-side predictor may own the GRID edge (+88) and the DATE reading's\nedge (+87) and must NOT be pointed at the SET reading, whose edge owes the population-side\nidentity above instead.\n\nTHE DECLARED EDGE IS THE MOST OPTIMISTIC OF THREE BOOKS, WHICH IS A SECOND, SMALLER FINDING.\n`_measure_collapse_runs` groups a drift by the TUPLE of its readings across every seed, so a\nrun stays open while ANY ONE seed still moves. The per-book last movements are +80 / +82 / +75;\nthe published edge is +82, the maximum. A reader told \"resolution stops above +82d\" is told\nsomething two days optimistic on seed 7 and seven days optimistic on seed 23, whose instrument\nhas resolved nothing since +75. The grouping predicate is defensible (a coincidence on one seed\nis not a structural collapse -- its own docstring says so); what is not is publishing the\nunion's edge as the instrument's.\n\nA THIRD FINDING, ON THE SIBLING ENTRY, AND THE CONTROL IS INNOCENT. `recon_lag_days` declares\n`undefined_drifts: (87, 88)` and says \"Beyond +86 no failure is detected before `as_of` on\nEVERY seed, the latency population empties and the mean is None\". Measured at +87, seed 23:\n`n_latency_population` = 1 and the mean is 2.0 days -- it reads. `_measure_collapse_runs`\nderives `undefined` with `any(reading is None ...)`, which is the conservative and correct\nguard, and `_check_saturation_and_collapse`'s witness assertion is a per-seed IFF\n(`is_none == (pop == 0)`), which seed 23 satisfies with (False, 1) -- so the control passes and\nshould. The defect is entirely in what the register TELLS THE READER: an ANY region described\nwith an EVERY sentence, so a drift where one book of three still publishes a 2.0-day mean is\ndeclared a drift where the instrument does not read.\n\nWHAT THIS CHANGES ABOUT THE RESHAPE -- THE ONLY REASON THIS TICK MATTERS TO THE ATOM. Last\ntick's piece 2 proposed a book with a STAGGERED `as_of` per cohort (or an old tail cohort) so\nthe detection SET keeps resolving past the ceiling. Measured, that is NECESSARY AND NOT\nSUFFICIENT, and the three conditions on the tail cohort are now stated and none of them is a\ndate:\n  (i)  the tail invoices must be TRULY FAILED or NEVER-FLAGGABLE -- a tail of invoices that are\n       eventually paid lands in the exclusion band and moves the published figure by zero,\n       which is mechanism 2 above;\n  (ii) they must be RECON-ONLY -- not visible on the DD channel -- or the union never changes\n       however late the detector fires, which is mechanism 1;\n  (iii) they must still be OPEN at the new `as_of`, because the flag window closes at payment.\nA reshape satisfying only the calendar half would land, re-certify five dimensions, and move\nthe ceiling not at all. That is the concrete thing this DISCOVER tick bought.\n\nR12: no published number moved. Nothing was tuned, nothing in `file_scope` was edited, and the\ndetection gap and latency mean are whatever HEAD already publishes -- all measurement here was\nread-only, in a scratch script outside the repo, against the shipped scorer.\n\nWHY THE LEVEL DOES NOT MOVE. Level 2 means the reshaped book BUILT and mutation-proven both\nways. A DISCOVER/FRAME tick on a parked atom may not write it, and an exit criterion is not\nrenegotiated to fit what a tick was allowed to do. `level_current` stays 0.\n\nLEADS FOR THE NEXT HOUR, RE-RANKED BY WHAT THIS TICK FOUND. (a) THE PUBLISHED CAUSE IS WRONG\nand the caveat is one string: `organ_query_grid_saturation_caveat`'s \"where nothing further is\ndetected before `as_of`\" is false of the SET reading and true of the sibling. Correcting it\nmoves published caveat TEXT and no figure, and it is now the cheapest correct thing this module\ncan do -- ahead of last tick's piece 1, which is still owed. (b) The ANY/EVERY quantifier on\n`undefined_drifts`: declare per-seed, or say ANY in the sentence. (c) The per-seed-vs-union edge\nabove -- whether every declared edge in this module is the most optimistic seed's, which is a\nquestion about `DIMENSION_DRIFT_RESOLUTION` too and is a census rather than this atom's. (d)\nStill open from 2026-08-12 and untouched here: the n-dependence of `book_memory_grid` and\n`dense_drift_grid`."
- "2026-08-18 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw, third pass).\nNo BUILD code written and nothing in `file_scope` touched. Everything below is\n`observed-with-evidence` at HEAD `394bd6322`, measured in a detached worktree\n(`git worktree add --detach`) through the shipped `build_scenario`,\n`measure_belief_window_resolution`, `measure_belief_band_population_axis`,\n`check_belief_band_population_axis`, `book_memory_grid`, `book_recon_drift_grid` and\n`dense_drift_grid`. Seeds 7/11/23. NO `score_triad` call anywhere in this pass.\n\nHYGIENE, AND IT IS NOT THE USUAL SENTENCE. Both `file_scope` paths are DIRTY in the desk tree\nthis tick -- another lane holds 227 uncommitted lines across `tools/couple_w2_11_d5.py` (+82)\nand its test file (+153). The first measurements this pass took were against that working tree.\nThey were re-taken at HEAD before any of them was written down, and the uncommitted diff was\nchecked not to touch the axis or edge declarations this note is about (`git diff -U0` over the\nmodule, grepped for `draw_size_axis|edge_range|invoice_span_invariant|n_customers|saturates_`:\nno hits). Both readings agreed. The re-take is recorded because the agreement was not knowable\nin advance -- a pass that measures the desk tree and reports at HEAD is the wrong-tree class,\nand this atom's own file is where another lane is working.\n\nWHAT THIS PASS TOOK. Lead (d), standing since 2026-08-12 and re-listed as untouched on\n2026-08-13: \"the n-dependence of `book_memory_grid` and `dense_drift_grid`\". It is answered\nbelow in two lines, and answering it walked into the larger thing -- the D30 repair that landed\nthe same morning, which is the sibling of this atom's own subject.\n\nPART 1 -- LEAD (d), CLOSED, AND HALF OF IT WAS ALREADY ANSWERED BY THE PASS THAT RAISED IT.\n\n  * `dense_drift_grid` HAS ONE EXECUTABLE STATEMENT: `return book_recon_drift_grid(records,\n    as_of, grace_days)` (AST of the shipped function, docstring excluded, one node). Its grid is\n    bit-identical to `book_recon_drift_grid`'s at all 24 (n, seed) pairs tested. So the\n    2026-08-12 pass's own recon measurement -- the table showing `hi` walking from +74 to +88\n    between n=1 and n=25 -- WAS the answer for `dense_drift_grid`, and that pass filed the\n    question as open in the same note. A lead can be discharged by the measurement that raises\n    it when two names share one function; the delegation is documented in the function's own\n    docstring, which the lead did not read.\n\n  * `book_memory_grid`'s EXTENT DOES NOT MOVE WITH THE DRAW, and the reason is that neither end\n    is book-derived:\n\n        n     memory grid (lo, hi, points)      recon grid (lo, hi)\n        1       -400, 0,   2 pts                  -20, +74 / +74 / +76\n        5       -400, 0,   4 / 6 / 8 pts          -20, +83 / +84 / +84\n        25      -400, 0,  18 / 11 / 19 pts        -20, +88 / +88 / +88\n        300     -400, 0,  65 / 66 / 62 pts        -20, +88 / +88 / +88\n\n    `grid = {0, -window}` is added unconditionally before any age is read, and every observed\n    failure age on this book is under 92, so every book-derived point is strictly interior. The\n    grid is (-400, 0) at n=1 with ZERO failed records on all three seeds -- two points and\n    nothing between them. So the two grids the lead named as one class are structurally\n    different: the recon grid derives BOTH ends from the book and its upper end walks up to\n    fourteen days; the memory grid derives NEITHER, and its interior goes from 2 points to\n    62-66 while its edges do not move at all. The lead's premise -- that these were the same\n    question asked twice -- was wrong, which is why it reads as still-open in two notes.\n\nPART 2 -- AND THE EDGES READ OFF THAT INTERIOR DO MOVE, WHICH IS D30's, WHICH LANDED, WHICH IS\nWHERE THIS PASS ACTUALLY FOUND SOMETHING. `own_saturates_above` is `oldest_failure_age - window`\n-- interior, therefore draw-dependent. D30 measured exactly that on 2026-08-18 and its BUILD\nlanded the repair the same morning: per-entry `own_saturation_scope`, a shared\n`own_draw_size_axis` over n = (24, 40, 60, 120, 300, 600, 1200) x seeds 7/11/23, declared\n`above_edge_range` (-328, -308) and `below_edge_range` (-371, -342), a declared NULL CONTROL\n(`invoice_span_invariant: (30, 92)`), a six-rule checker and a seven-case mutation matrix. That\nis a real repair and this note does not undo it. What it did not do is derive its own floor.\n\nTHE FINDING, THREE MEASURED FACTS AND THEY ARE THREE DIFFERENT NUMBERS.\n\n    n     per-seed upper edge      invoice span (the NULL CONTROL)   null green?  in declared band?\n    12    -328, -320, -333         (30,92) (30,88) (31,90)           NO           no\n    17    -328, -308, -333         (30,92) (30,92) (30,92)           YES          NO\n    18    -328, -308, -333         (30,92) (30,92) (30,92)           YES          NO\n    19    -328, -308, -321         (30,92) x3                        yes          yes\n    24    -328, -308, -308         (30,92) x3                        yes          yes\n\n  * the NULL CONTROL first holds on all three seeds at n = 17;\n  * the declared `above_edge_range` first holds at n = 19;\n  * the declared axis floor is n = 24.\n\nNone of the three is derived from either of the others. At n = 17 and n = 18 the sweep is SOUND\nBY ITS OWN STATED CRITERION -- the invoice span reads exactly the declared invariant (30, 92) --\nand the register's declared band is FALSE, seed 23 reading -333 against a declared (-328, -308).\nRun through the shipped checker, moving nothing but the floor:\n\n    floor 24 (shipped):  invoice_spans ((30,92),)   above read (-328,-308)   violations 0\n    floor 18:            invoice_spans ((30,92),)   above read (-333,-308)   violations 2\n    floor 17:            invoice_spans ((30,92),)   above read (-333,-308)   violations 2\n      * belief: declares its above edge inside [-328, -308] ... and the sweep read [-333, -308]\n      * belief_population_mix: (the same, on the sibling entry)\n\nThe null control is GREEN in both red cases. The verdict is decided by the floor and by nothing\nelse.\n\nAND THE FALSIFIER IS IN THE DISCOVERY NOTE THAT SPECIFIED THE REPAIR. D30's 2026-08-18 pass\nswept n from 12 and its own table records `sat_above = -333` at n=12, seed 23. The build\ndeclared a band that excludes -333 and a floor that excludes the book which produced it. The\nnote gives a reason for stopping at 24 -- the invoice span reads [30, 92] \"at every n from 24\nup\" -- and the reason is true and is not the measurement: the span holds from 17. The floor is\nseven customers more conservative than its own stated justification requires, and the extra\nseven are exactly what removes the counterexample. The reason also lives only in the discovery\nrecord; there is no comment beside the literal deriving 24 from anything (grepped at the\ndeclaration site, lines 4941 and 5082).\n\nWHY NO CONTROL CATCHES IT, WHICH IS THE R15 POINT AND IS THE REASON THIS IS FILED AS A CONTROL\nFINDING. All seven cases of `test_the_belief_axis_control_fires_on_its_own_named_defects` mutate\nthe REGISTER and evaluate against the fixed shipped-axis fixture.\n`test_pinning_the_population_hides_the_belief_draw_size_defect` is the single axis-side mutation\nand it NARROWS the axis to one n. Widening the axis DOWNWARD -- the one perturbation that turns\nthe verdict red -- is in no test. The input that decides the verdict is the input the mutation\nproof never moves. The battery proves the checker fires when the DECLARATION is wrong; it does\nnot and cannot prove the SUBJECT was not chosen.\n\nWHICH MAKES THIS THE SAME CLASS ONE LEVEL OUT, and that is the only reason it is worth an atom's\nnote rather than a line. The 2026-08-12 pass on this atom wrote: \"A control certified only at\nthe n at which its subject is stable has the same shape as a control certified only where it had\nalready answered.\" D28 and D30 took that finding and replaced ONE un-derived n with SEVEN\nun-derived n's. The population axis is a genuine improvement -- it reads 21 books, it fires on\nseven register mutations, and its spread assertions are real -- and it inherits the defect it\nwas built to close, in the one field nobody thought of as a claim.\n\nWHAT THIS DOES NOT CLAIM, said plainly because the finding reads worse than the situation is.\nNobody reads a 17-account book, no published figure moves, and the caveat a reader meets is\nre-derived from the scored book on every call and is correct at any draw size (D30's own note 4\nestablished that and this pass did not re-examine it). The declared asymptote `own_saturates_above\n= -308` is not wrong. What is wrong is that an axis floor which is a free literal can be placed\nanywhere and no control can say so -- so a later widening for an unrelated reason turns two\nentries red with nothing about the world, the book or the register having changed.\n\nTHE REPAIR, AND IT IS SMALL -- three items, none of them this atom's reshape:\n  1. DERIVE the floor as the smallest n at which the null control holds (17 on this book,\n     measured here and written down nowhere in the repo), or keep 24 and state at the\n     declaration site what it is the smallest n OF, with the measurement beside it. A derived\n     floor cannot be chosen to green a verdict.\n  2. ADD THE MISSING MUTATION: lower the axis floor below the declared band's validity point and\n     assert the checker fires. One parametrised entry, and it is the case that makes this\n     irreproducible.\n  3. WIDEN `above_edge_range` to whatever the new floor admits. At floor 17 it is (-333, -308);\n     `own_saturates_above` stays -308 and stays at the edge of the read range, so\n     `test_the_belief_edges_move_on_the_draw_size_alone`'s asymptote assertion still holds.\n\nQUEUED, NOT FIXED ON SIGHT (SELF-INTERRUPT DISCIPLINE). This draw is DISCOVER/FRAME and the\nrepair is BUILD on a file this atom is parked for -- and which another lane is holding dirty\nthis tick, so it is also the wrong moment. Filed as\n`WORKER_FINDING_THE_BELIEF_AXIS_NULL_CONTROL_CANNOT_FAIL_BECAUSE_ITS_FLOOR_SITS_ABOVE_WHERE_IT_BREAKS_2026-08-18`,\nBLOCKING, lane D_billing_metering, classed `controls_that_cannot_fail` (verified through\n`background.finding_classes --list`, not assumed from the title), with its class document\nre-rendered in this same commit.\n\nR12: no published number moved, was tuned, or was written to any artefact. Every figure above\nwas measured read-only in a detached worktree to find out whether a declaration this module\nlanded today survives a population it was never asked about. It does not.\n\nWHY THE LEVEL DOES NOT MOVE. Level 2 for this atom means the reshaped book BUILT and\nmutation-proven both ways. A DISCOVER/FRAME tick on a parked atom may not write it, and an exit\ncriterion is not renegotiated to fit what a tick was allowed to do. `level_current` stays 0,\n`loop_stage` stays `idle`, `provenance` stays `proposal`. The map IS touched this tick, for one\nfield only: `simplifications_count` 2 -> 3. That is safe now and was not for the last two passes\n-- the spine ratchet they each cited as red is GREEN at this HEAD (305,418 B against the 400 KB\nbound) and `docs/design/maturity_map.yaml` is CLEAN in the desk tree, so the edit sweeps no\nother lane's work.\n\nLEADS FOR THE NEXT HOUR, re-ranked.\n  (a) The three repair items above -- cheapest correct thing in this module now, ahead of the\n      2026-08-12 unowned-ceiling piece, which is STILL OWED and untouched by three passes.\n  (b) THE SAME QUESTION OF THE SIBLING AXIS, which this pass did not ask: `saturates_above_scope`\n      / the detection register's own draw-size axis declares `n_customers: (150, 300, 600, 1200,\n      2400)` (line 2389). Its floor is 150. Nothing here establishes where ITS null control\n      starts holding, and if the answer is well below 150 the same finding is live one register\n      over -- which is where every member of this class has turned up so far.\n  (c) Unchanged from 2026-08-13 and still owed: the published CAUSE in\n      `organ_query_grid_saturation_caveat` (\"where nothing further is detected before `as_of`\")\n      is false of the SET reading; and the ANY/EVERY quantifier on `undefined_drifts`.\n  (d) CLOSED by part 1 above. Do not re-draw it."
