simplifications:
- '2026-08-12 BUILT, level 0 -> 2 (worker tick, self-certified with the evidence below per R16). Part 2 of DIRECTOR_RULING_THE_PORTAL_IS_A_WALL_EXHIBIT_2026-08-12. site/customers/index.html stops calling itself a Customer Portal and becomes the wall''s own exhibit: one household''s own view side by side with what the company knows and what only the simulation knows.

  THE MECHANISM, AND WHY IT IS NOT PROSE. The ruling''s non-negotiable was that the side-declaration be STRUCTURAL -- "if a new panel can be added to this page without declaring which side of the wall it sits on, nothing has been built, only written down", and it named the existing honesty-wall notes as exactly the prose version of the gap. So no tab renderer emits panel markup any more. Each returns a LIST of panel(side, title, body) objects and layoutPanels() is the SOLE writer of `.wall-panel` markup; panel() throws on a missing or unknown side and layoutPanels() throws again on anything reaching it that is neither a declared panel nor explicitly-marked chrome. That alone would still be walk-past-able by hand-building a card around the helper, so the second half is a STRUCTURAL GUARD on the rendered markup (site/customers/test_wall_exhibit.py::test_no_content_block_renders_outside_a_declared_panel): an HTML scanner walks every tab in every view and fails on any content block -- card, kpi-grid, accounts-grid, chart-wrap, bill-sum, timeline-list -- that inherits no declared side. Nav chrome carries none of those classes, which is why chrome legitimately needs no side and content cannot avoid one. Placeholders the page fills in AFTER layout (bills-section, usage-section, cashflow-kpis, cashflow-kpis-company, forecast-cashflow-body) are checked separately to sit inside a declared panel, or the guard would be bypassable by injecting into a bare div.

  THE FIGURES ACTUALLY MOVED, they were not merely relabelled. The top-of-page money grid used to render billed, banked, balance, lifetime net, cost-to-serve, churn risk AND a SIM satisfaction score as one undifferentiated row of tiles; it is now three panels on three sides (cust-money / cust-value / cust-sim), and the who-they-are grid split into the customer''s own account facts (cust-who) and the supplier''s classification of them -- segment, occupancy, vulnerability flag, engagement (cust-classify). In the drill-down: Overview and Accounts split into a customer card (account id, MPAN/MPRN, tariff, meter, customer-since) and a company card (lifetime revenue, lifetime net, cost-to-serve, hedge coverage), with the per-year commodity Gross/Net table -- the wholesale trading margin the ruling names as SIM-only -- lifted into its own SIM panel carrying its original note. Timeline split: the events a household lived through stay customer-side, while the CAUSAL EFFECT attached to each event moved to a SIM panel alongside the reaction chain, since a causal attribution is ground truth no supplier could read. Risk split into the customer''s own outstanding balance and the supplier''s churn probability / expected lifetime / pricing action. Cashflow split into billed-vs-collected (customer) and cost-to-serve / net contribution / forecast (company).

  THE CUSTOMER-EYE VIEW IS A REAL VIEW. A three-way selector (Both sides / The customer''s side / Behind the wall) filters by OMITTING panels from the DOM, not by hiding them with CSS -- so "the customer cannot see this" is true of the rendered document, not just of its styling. In Both-sides mode the panels lay out in two labelled columns; that is the side-by-side comparison the ruling asked for.

  EVIDENCE (R11 -- asserted on the RENDERED markup, driven by the page''s own code against the real per-customer JSON via the new site/customers/_wall_harness.mjs, never on the source string). site/customers/test_wall_exhibit.py 24/24 pass; site/customers/test_customers_door.py 11/11. Coupled set green in the same run: tests/tools/test_site_structure.py, test_e2_revenue_reconciliation_surfaces.py, test_billing_and_payments_ledger.py, test_billing_tab_fix.py, test_bill_correctness_addendum_defect1/2/4.py, test_nav_story_platform_method_rq.py, test_phase_qn_per_fuel_portal.py, site/test_brand_token_adoption.py, site/test_no_links_to_redirected_urls.py -- 141 passed. Wider sweep `pytest tests/tools/ -k "site or portal or bill or customer or door or nav or redirect"` 457 passed. tools/verify_printed_bill_render.mjs still PASSES on the moved file: 1557 rendered usage lines checked, 1557 printed a rate, 0 arithmetic failures.

  EXIT (7), Part 1 lands intact: D36 is unbuilt (level 0), so its exit tests do not yet exist; what this atom owed it was to leave the bill render path untouched, and test_wall_exhibit.py::test_the_bill_render_path_is_intact pins billEquationHtml, billUsageLinesHtml, billMeterDetailsHtml, downloadBillPdf and billExpandHtml by signature so a future SITE-lane edit cannot quietly restructure the surface D36 is about to change.

  EXIT (6), the honesty notes were DIFFED, not re-typed: `git show HEAD:site/customers/index.html` was extracted to /tmp/pre.html and all ten pinned notes confirmed present in the PRE page and in the POST page (Settlement clock SIM-internal; the commodity-trading-margin note; DESIGNED, NOT INSTRUMENTED; the Variable-DD honesty note; instrumented (DD1); the E5 carbon placeholder; "We will not fabricate one."; the no-wired-mechanism note; the ex-VAT Lifetime Revenue reconciliation note; the PDF''s "synthetic simulation, not a real bill"). The list is therefore non-vacuous by construction -- every string on it existed before the redesign.

  R15 BOTH WAYS, four mutations each killing a NAMED test and the clean case proven clean in the same test: (a) panel() called with no side / an unknown side, and a hand-built block reaching layoutPanels, all raise -- and a correctly-declared panel is accepted, so the control is not over-broad (test_mutation_a_panel_that_declares_no_side_is_refused_at_source); (b) stripping data-wall-side off a rendered panel makes the STRUCTURAL guard flag the content it was carrying, while the unmutated page passes (test_mutation_removing_a_panels_side_attribute_kills_the_guard); (c) the same mutation applied to the FILE -- a bare card appended to the op-state region -- is caught (test_mutation_an_undeclared_panel_in_the_file_kills_the_guard); (d) a churn probability moved into the customer-eye view is caught by the SAME checker the real test uses, and a satisfaction score placed under a company panel likewise (test_mutation_a_company_only_figure_moved_into_the_customer_eye_view_kills_a_named_test, test_mutation_a_sim_only_figure_moved_under_a_company_panel_is_caught). Anti-vacuity guards in both directions: test_the_named_figures_are_actually_present_somewhere fails if the page simply stopped rendering the company-only and SIM-only figures instead of re-homing them, and test_injected_content_is_non_empty fails if the placeholders render empty.

  ONE PRE-EXISTING TEST CHANGED, and why it is a tightening not a weakening. test_customers_door.py::test_money_kpis_carry_r14_clocks asserted billed/banked/settled all appeared in ONE element; the settled-clock figures (lifetime net, cost-to-serve) are now on the company side of the wall, so the assertion now checks billed+banked on the customer panel, settled on the company panel, AND that neither money panel carries no clock at all. R14 coverage goes up, not down. tests/tools/test_billing_and_payments_ledger.py''s function-presence list has renderCashflowShell -> cashflowPanels for the same reason (same sub-view, now side-declared).

  LEVEL 2, NOT 3, and the residuals are named rather than absorbed. (a) EXIT (4) IS HALF-LANDED: the name, title, entry copy and framing no longer claim a customer portal (title is "Two Sides of the Wall"; "Customer Portal", "Log in with your Poesys account number" and the Sign-in button are gone, pinned by test_the_page_no_longer_calls_itself_a_customer_portal), but the door still RESOLVES at /customers/. That half is split out as SITE3_wall_exhibit_url_rename rather than half-done here: /customers/ is a canonical door in site/sitemap.xml, so moving it also moves five door navs, three DAEMON-REGENERATED site/data feeds and ~10 hard-coded PORTAL paths, and those feeds were concurrently dirty from a regeneration this tick -- committing coordinated edits across them by pathspec is the "a repo-wide census is not decomposable by pathspec" failure this repo has already paid for. (b) R11 LIVE-PIXEL is genuinely unavailable for this change: the assertion has to be made against the DEPLOYED page, and the deployment lags this commit, so it belongs to the next tick with site/live_pixel_verify.py --door, not to a claim made here. (c) The atom''s level_target is 3 because a public wall exhibit''s trustworthiness is an Expert-Hour-verdict claim; expert_hour is not_attempted. Any one of those three would hold this at 2 on its own.

  EXIT (5) landed: the page names the real customer portal at company/portal/ twice -- in the exhibit header ("Poesys''s actual account-holder portal ... is a separate system at company/portal/") and in the entry copy -- pinned by test_the_relationship_to_the_real_portal_is_stated_on_the_page.'
- '2026-08-12 EXPERT HOUR (HARDEN, cold-eyes walk) -- VERDICT **NO**, level HELD at 2, and the two structural findings FIXED in the same tick because they are this atom''s own exit criteria, not new scope.

  WHAT THE WALK FOUND, AND WHY THE SUITE DID NOT. Three blindfolded personas (energy-retail COO, data/model-governance CDO, energy-tech VC) against the LIVE rendered surface only, priors stated before pixels. All three independently led with the same thing: **neither filtered view filtered**. With "The customer''s side" selected, the static #op-state exhibit still rendered COMPANY-ONLY (Lifetime net GBP492.96, Cost to serve GBP329.93, Churn risk 23%) and SIM-ONLY (Satisfaction 65%) panels on screen -- under the page''s own sentence "No company estimate and no simulation ground truth is in this view; if one appears, the page is broken". WALL_VIEW filtering lived only inside layoutPanels(); setWallView() re-rendered the drill-down alone. Exit criteria (2) and (3) were never met, and the level-2 record above claiming they were is corrected by this entry.

  THE R15 LESSON, which is the more valuable half: **24/24 was green against that page**, because no fixture''s subject was the document. `rendered` drove layoutPanels() directly -- by the harness''s own docstring, "deliberately ... rather than renderHousehold()" -- so every view-filtering assertion could only ever see drill-down panels; `op_state_html` was a static slice asserting side DECLARATION and never side FILTERING. All three mutation tests mutated inside those two subjects. This is the catalogued "a new layer above a control must inherit its subject" class, and the control was built with a subject that structurally excluded its own failure.

  THE FIX, both halves. (a) MECHANISM: setWallView() now calls applyWallViewToOpState(), which filters the exhibit''s declared blocks by the SAME attribute and the SAME wallViewShows() predicate the drill-down uses, and by REMOVING them from the document rather than hiding them with CSS -- so "the customer cannot see this" stays true of the rendered DOM, which was the original design claim. It fails CLOSED: a block declaring a side the wall does not know throws rather than rendering unfiltered. Because a detached node is unreachable via getElementById and the exhibit fills its placeholders from an async fetch, window.opStateFind() resolves ids through the detached blocks -- without it, switching view before company.json landed would throw inside renderCustomerState and blank the whole exhibit. (b) SUBJECT: the harness now also drives the page''s own setWallView() over the #op-state region (passed in as real DOM children) and reports what SURVIVES per view; whole_document(view) returns op-state + every drill-down tab, and the new section (9) runs the side and named-figure checks over that union. The op-state shell is FILLED first via _render_harness.mjs against the published company.json, because the shell alone contains no figure labels -- a union subject built from it would have been blind to the exact figures the walk found on screen.

  EVIDENCE that the new control is not vacuous, quoted from the rendered output: opState[both] sides [''company'',''customer'',''sim''], company-only figures present [''cost-to-serve'',''churn probability''], sim-only [''satisfaction score'']; opState[customer] sides [''customer''], company-only [], sim-only []; opState[behind] sides [''company'',''sim''], company-only [''cost-to-serve'',''churn probability''], sim-only [''satisfaction score'']. The checker SEES the figures in both/behind and finds none in customer -- that is the property, not an absence of instrumentation.

  R15 BOTH WAYS on the new half: (i) test_mutation_a_view_switch_that_skips_the_op_state_region_ kills_a_named_test reverts setWallView to its pre-fix shape ON THE FILE, drives the real harness, and requires the union guard to report the leak -- it does; (ii) test_mutation_an_op_state_block_ with_an_unknown_side_is_refused proves the fail-closed path; (iii) anti-vacuity in both directions -- test_the_op_state_region_is_actually_filtered_not_merely_reordered fails if a filtered view is EMPTY or identical to `both`, and test_the_customer_view_still_carries_the_customers_own_exhibit_ panels fails if the cheapest pass (delete the exhibit from the customer view) is taken.

  A CONTROL I BLINDED MYSELF, CAUGHT AND MECHANISED. The caption fix below renamed a tile to "Lifetime net (commodity)"; COMPANY_ONLY_FIGURES matched on r''kpi-label">Lifetime net<'', so the trailing ''<'' made the checker stop seeing it -- the narrowed-parser class, introduced by me, in the same tick. Patterns are now prefix-anchored and test_the_named_figures_are_visible_to_the_checker_in_the_op_state_exhibit fails if any named figure ever stops matching the page. That test exists because this happened, not in anticipation of it.

  THIRD FINDING FIXED (the one that explains the implausible economics). The "Lifetime net" tile was captioned "settled clock - after cost-to-serve" and was not: lifetime_net_gbp 492.96 is BEFORE the cost_to_serve_gbp 329.93 shown in the adjacent tile, and the per-customer record''s own lifetime_net_after_cts_gbp is their difference to the penny (163.03). Two neighbouring tiles that visibly failed to reconcile are what made the exhibit read at ~26% household net margin instead of ~12%. The tile is now "Lifetime net (commodity) - before cost-to-serve" and a third tile derives "Net after cost to serve" from the two figures already on screen -- no new data plumbing, per this atom''s own constraint.

  R11 LIVE-PIXEL, residual (b) from the level-2 record: CLOSED. site/live_pixel_verify.py --door /customers/ PASS (http=200 direct, feeds=4, rendered_elements=12). The deployed html was byte-identical to HEAD at the time of the check, and the committed checkers in test_wall_exhibit.py were re-run against the LIVE html driven by the LIVE per-customer feeds fetched from https://poesys.net/data/customers/C1.json and C1g.json -- 15/15 pass, panel census both {customer:8, company:4, sim:2}, customer {customer:8}, behind {company:4, sim:2}. NOTE the scope limit that matters: that check was of the LIVE page as it then stood, i.e. the page WITH the op-state defect -- it verified the drill-down''s rendering, which is precisely the subject that was too narrow. The fixes in this entry are verified in-repo only; their live-pixel re-verification belongs to the next tick, after deployment.

  WHY LEVEL STAYS 2. Ten findings remain open (map expert_hour.findings). Most are NOT render defects in this atom''s file_scope -- a churned account (closed 2021-12-30) presented in the present tense with a 23% churn risk and GBP2,741 CLV under a 2026-08-12 stamp; household-labelled money that is electricity-only when gas is the larger leg; a bill series whose summer exceeds its winter under a panel explaining why energy use is seasonal; arrears notices posted TO the customer filed as SIM-only while the customer panel claims a clean payment history; a 100x p/MWh vs GBP/MWh mislabel. Those are SIM/COMPANY fidelity gaps the exhibit SURFACED, and R12 applies -- they need diagnosis and their own atoms, never tuning toward a benchmark. Two persona findings were adjudicated REFUTED with the arithmetic that refutes them and are recorded as such. Independence caveat, per the skill''s own wall: same model family as the builder, so this was blindness, not independence (expert_hour.independence: false).

  VERIFICATION: site/customers/ 45 passed (test_wall_exhibit.py 34, test_customers_door.py 11). Coupled set green in the same run, 106 passed: tests/tools/test_site_structure.py, test_e2_revenue_reconciliation_surfaces.py, test_billing_and_payments_ledger.py, test_billing_tab_fix.py, test_bill_correctness_addendum_defect1/2/4.py, test_nav_story_platform_method_rq.py, test_phase_qn_per_fuel_portal.py, site/test_brand_token_adoption.py, site/test_no_links_to_redirected_urls.py. EXIT (7), D36 lands intact through this work: tests/company/compliance/test_printed_bill_foots_render.py 20 passed, and tools/verify_printed_bill_render.mjs PASS -- 1557 rendered usage lines, 1557 printed a rate, 0 arithmetic failures.'
- '2026-08-13 EXPERT-HOUR FINDING DISPOSITION (worker tick) -- four of the walk''s eight open findings were RENDER defects inside this atom''s own file_scope, not the SIM/COMPANY fidelity work the 2026-08-12 record classified them as. All four fixed, each with a control that fails on its own defect. LEVEL STAYS 2: exit (4) is still half-landed (the /customers/ URL move is SITE3_wall_exhibit_url_rename) and the Expert-Hour verdict is still NO with four findings open, so nothing here certifies a level move.

  THE RECORD WAS WRONG ABOUT ITS OWN REMAINDER. The 2026-08-12 entry filed the open findings as "each needs its own atom -- most are SIM/COMPANY fidelity, not render". Re-read against the code, four were one-file render defects: an arrears cascade mis-sided, a 100x unit mislabel, an R14 clock on a probability, and a promised control that was not on the page it was promised on. This is the "a PASS''s what-remains paragraph has been wrong twice running" class, caught here by reading the code rather than the summary.

  (a) ARREARS MIS-SIDED (coldwalk:site2_arrears_history_visible_only_behind_the_wall). The whole reaction chain rendered as ONE sim panel, so this household''s two arrears cascades -- payment missed, first overdue notice, second notice offering a payment plan, cleared via payment plan -- sat BEHIND the wall while the money panel above called the account clean. Every one of those is a letter the account holder received. The chain now splits three ways through _CHAIN_SIDE: customer (missed payment, both notices, resolution, placed-with-DCA), company (write-off, recovery, retention decision -- internal accounting and the company''s own expected value), sim (journey_state, outcome_* -- these carry sim_truth). Fail-closed exactly as panel() and applyWallViewToOpState() do: an event type nobody has sided THROWS rather than defaulting to a side, because placing it by default is a silent claim about the wall. Also fixed in passing: the raw enum "arrears_payment_missed" was reaching the public page through an unlabelled event type falling out of chainLabel(), now pinned by test_no_raw_event_type_enum_reaches_the_page. The op-state panel''s "No arrears cases on record -- clean payment history" was a HOUSEHOLD-wide claim made from a SINGLE-LEG record (company.json''s household block is commodity=electricity; the arrears are on the gas leg) and now states the scope it is derived from. The household-wide figure is the dual-fuel finding, deliberately NOT closed here.

  (b) TARIFF UNIT (coldwalk:site2_tariff_range_pounds_per_mwh_labelled_pence_per_mwh). The column read r.tariff_min/r.tariff_max -- generate_customer_data.py''s copy of tariff_min_gbp_per_mwh / tariff_max_gbp_per_mwh -- and labelled them "p/MWh". A 100x mislabel on a public surface. Rendered NOW, quoted from the harness: 92-176 &pound;/MWh, 91-192 &pound;/MWh, 91-220 &pound;/MWh; no cell carries "p/MWh". The column header names the unit and a note says the retail range is the customer''s own contracted rate shown for comparison, not part of the SIM''s trading-margin arithmetic (the finding''s second, lesser half). The control is INDEPENDENT rather than tautological: it cross-checks this column''s magnitude against the SAME quantity rendered by a DIFFERENT code path on the same page -- the timeline''s "Tariff renewed at 128.0 &pound;/MWh" -- so a column in pence and a line in pounds cannot both pass.

  (c) R14 CLOCK ON A PROBABILITY (coldwalk:site2_churn_probability_carries_a_settlement_clock), closed as a CLASS per R10, not as an instance. The caption is now "company estimate, not a fact - belief at last renewal decision". test_no_non_monetary_tile_carries_a_settlement_clock walks EVERY rendered .kpi tile and requires that a tile whose caption mentions a clock has a MONEY value, so the next non-monetary figure slot-filled with an R14 basis fails automatically; it also fails if NO tile carries a clock, so a pattern going blind cannot pass as compliance. NOT closed: the companion doubt (expected lifetime 13.8yrs vs churn 23% vs the per-year believed series) is COMPANY fidelity and stays for its own atom.

  (d) THE PROMISED CONTROL WAS NOT ON THE PAGE (coldwalk:site2_landing_promises_a_view_switch_that_is_not_on_the_landing_page). wallViewNav() was emitted only inside renderHousehold(). Since the 2026-08-12 fix the selector governs the #op-state exhibit, which IS on the landing page, so the control now sits at the door in a #door-wall-view host OUTSIDE #op-state -- it is chrome, carries no figure, and a block inside would have to declare a side and then be filtered by the selector it operates. Filled at boot, repainted by setWallView.

  EVIDENCE. site/customers/test_wall_exhibit.py 47/47 and test_customers_door.py 11/11 (45 -> 47 in this module; the two new sections add 11 tests and the pre-existing 24 all still pass). site/customers/ + site/test_no_links_to_redirected_urls.py + site/test_brand_token_adoption.py: 106 passed. `pytest tests/tools/ -k "site or portal or bill or customer or door or nav or redirect"`: 514 passed, 1 failed -- test_generate_shadow_html.py:: test_every_static_site_page_has_the_copyright_footer on site/knowledge/index.html, which is RED AT HEAD and untouched by this tick (`git show HEAD:site/knowledge/index.html | grep -c "All rights reserved"` = 0, and the file is not in this tree''s modified set). Registered, not absorbed.

  EXIT (7), Part 1 lands intact -- and this time D36 IS built, so the criterion has real teeth rather than a signature pin: tests/company/compliance/test_printed_bill_foots_render.py 20/20 and `node tools/verify_printed_bill_render.mjs` PASS on the edited file -- 1600 rendered usage lines checked, 1600 printed a rate, 0 arithmetic failures.

  R15 BOTH WAYS on every one of the four, each mutation killing a NAMED test and each clean case proven clean in the same module: arrears re-sided to sim (the notice appears behind the wall and vanishes from the customer view); an unclassified event type appended to the REAL gas JSON is REFUSED by the page (harness exits non-zero with "declares no wall side") rather than silently placed; the pence label restored (the checker''s own subject carries it); a settlement clock put back on the churn probability (the class control flags it); the door selector''s repaint removed (the selector is still rendered but frozen on the wrong view -- the test distinguishes the stale case from the absent one, so a missing selector cannot pass as a proof).

  ONE FIXTURE REPAIRED, and it is a tightening. test_mutation_a_view_switch_that_skips_the_op_ state_region_kills_a_named_test pinned setWallView''s ENTIRE one-line body as a string, so it went red the moment a second statement was added to the function -- a fixture that rots on any unrelated edit. It is now anchored on the REMOVAL OF THE applyWallViewToOpState() CALL, which is the mutation it is actually about, and it still fails loudly if the fix is genuinely reverted. Separately, _run() now builds the op-state region from the SAME file it drives; it previously built it from the real INDEX, which would have made every op-state mutation invisible -- the wrong-subject class this module already paid for once in section (9).'
- '2026-08-13 LANDED + MAP RECONCILED (worker tick). The disposition work described in the entry above was BUILT AND UNCOMMITTED in the working tree when this tick drew the atom -- the "a draw may already be built and unlanded" case. It was adopted, not rebuilt: verified (site/customers/test_wall_exhibit.py 47/47, test_customers_door.py 11/11, 58 passed) and landed. LEVEL STAYS 2, unchanged: exit (4) is still half-landed (the /customers/ URL move is SITE3_wall_exhibit_url_rename) and the Expert-Hour verdict is still NO with four findings genuinely open, so nothing here certifies a level move.


  THE RECORD AND THE MAP DISAGREED ABOUT THIS ATOM. The disposition tick wrote its four fixes into the adjudication ledger (state -> fixed, with fix_evidence) and into the entry above, and left all four sitting in the map''s expert_hour.findings under the comment "open; each needs its own atom -- most are SIM/COMPANY fidelity, not render" -- the very sentence that entry was written to correct. Two records, one subject, opposite claims, and nothing anywhere compared them. The map is the DRAWN-FROM record, so a fixed finding left open there re-draws work already done and holds a level move that may no longer be held. The map''s block is now split into dated fixed_2026_08_12 / fixed_2026_08_13 lists (the history is kept, not deleted) with six genuinely-open findings remaining, two of those adjudicated REFUTED.


  MECHANISM, NOT A HAND-CORRECTION (the same class of fix this atom exists to demonstrate). tests/controls/test_map_reconciliation.py -- the module that already guards unfolded level-report inboxes and duplicate map keys, i.e. exactly the self-report-vs-external-truth family -- gains test_no_map_finding_is_listed_open_while_the_ledger_records_it_fixed. The ledger is the truth by design: it carries the adjudication timestamp, adjudicator and fix evidence per key, where the map carries a bare list, so the check is ONE-WAY (ledger CLOSED while map OPEN is the defect). CLOSED_LEDGER_STATES is {fixed, superseded} only: adjudicated-false-positive is deliberately excluded because a refuted finding annotated in place is a disclosure, not a divergence, and a control that flagged it would be noise.


  R15 BOTH WAYS, AGAINST THE LIVE ARTEFACTS rather than only fixtures. Driving the control over `git show HEAD:docs/design/maturity_map.yaml` and the live ledger reports exactly the four real contradictions (arrears siding, tariff unit, churn R14 clock, door selector) and a resolvable population of 10; over the repaired map, 0 contradictions and a population of 6. Fixture-level proofs alongside: a fixed-finding-left-open FIRES the guard, an adjudicated-real and an adjudicated-false-positive are both SILENT while still COUNTING toward the population, and prose/unresolvable findings count ZERO.


  FAIL-OPEN PROOF, because this control''s obvious failure mode is going blind. Most atoms'' expert_hour.findings are prose narrative, so the comparison would pass trivially if the key-naming convention drifted or the record were rehomed out of the map. test_the_findings_ledger_comparison_is_not_vacuous fails the moment NO listed finding resolves into the ledger -- the guard reports a population of zero honestly rather than as a clean pass. tests/controls/test_map_reconciliation.py 13 passed.'
- '2026-08-14 HARDEN (worker tick): the exhibit stops being blank on one side. coldwalk:site2_behind_the_wall_view_is_empty_on_two_of_six_tabs CLOSED.

  MEASURED BEFORE BUILT, and the walk had undercounted. Driving this page''s own harness (_wall_harness.mjs) against HEAD''s index.html, the "Behind the wall" view rendered ZERO panels on THREE sub-views -- consumption, billing:bills AND billing:statement. The walk recorded "two of six tabs"; it had not enumerated the statement sub-view. That is why the control added here is a SWEEP over every rendered sub-view rather than a check of the two tabs that were named: a control written to the finding''s own count would have been born blind to a third of its subject.

  WHY SECTION (1) COULD NOT CATCH THIS. The existing structural guard asks whether a rendered block DECLARED a side. A tab rendering one lonely customer panel satisfies it perfectly -- and that was exactly the defect. Completeness of the OTHER side is a property the declaration guard is structurally blind to, so this is a new control, not a tightened one.

  THE REPAIR, and the siding judgement inside it. Three panels, every figure already in the per-customer JSON (no new data plumbing, per this atom''s own constraint): consumptionCompanyPanel (estimated-read count and share of billed volume, catch-up corrections and net re-bill, amount WRITTEN OFF under back-billing rules, cap-applied count, cost to serve); consumptionSimPanel (the per-year wholesale result over the volume actually billed -- net GBP/MWh under the meter); billingCompanyPanel (the same supply on the supplier''s clock -- exactly the "settled-vs-billed on one bill" the finding named, every row stating its clock per R14). The siding was the part that could have gone wrong: per-year gross/net IS "wholesale trading margin", a NAMED SIM-only figure already sided sim on the Accounts tab, so the unit-margin table is a SIM panel -- under a company panel it would have breached this atom''s own exit (3). Conversely per-invoice read type is printed on a real UK bill, so it stays customer-observable; the company panel carries its CONSEQUENCE (the back-billing write-off), which appears on no bill.

  R15, PROVEN ON THE REAL DEFECT AND NOT ONLY ON MUTANTS. Run against `git show HEAD:site/customers/index.html`, all three named checks FIRE: blank-behind on [billing:bills, billing:statement, consumption], the empty-column placeholder, and the missing read-exposure figures. Plus three in-file mutations -- drop the consumption far side, drop the billing far side (mutated INDEPENDENTLY so neither panel can carry the other''s proof), and blank a panel''s content while keeping its declared side. That last one is the fail-open probe: a side-declaring but EMPTY panel passes both the declaration guard and the blank sweep, and only the content check kills it -- so the content check is proven to be what does the work.

  ANTI-VACUITY: test_the_control_sees_every_sub_view pins the driven population BY NAME (including billing:statement, the one the walk missed) and fails if it shrinks, so the sweep cannot go green by the harness quietly rendering fewer tabs.

  GREEN: test_wall_exhibit.py 56 passed (47 pre-existing + 9 new); site/customers/ + tests/tools/test_billing_and_payments_ledger.py 72 passed; tests/tools bill-correctness + nav/brand consumers 81 passed. EXIT (7) D36 INTACT: tools/verify_printed_bill_render.mjs PASS -- 1600 rendered usage lines, 1600 with a printed rate, 0 arithmetic failures.

  CARRIED, NOT ABSORBED: tests/architecture/test_static_quality_ratchet.py ruff census is RED (I001 +1, F811 +1, E402 +1) from ANOTHER lane''s uncommitted files -- tools/generate_customer_data.py, tools/couple_cohort.py, tests/tools/test_generate_customer_data.py. This tick''s own file is clean on all three codes (ruff --select I001,F811,E402 on it: "All checks passed"). The ratchet lints the WORKING TREE, not the commit, which is why this lands via tools.surgical_land.

  STILL OPEN on this atom, unchanged by this tick: churned-account-in-the-present-tense and dual-fuel-elec-only-money (both real SITE2 render defects); the winter-peak finding is a sim-lane fidelity item this atom cannot discharge. Level stays 2.'
- '2026-08-15 HARDEN (worker tick): a closed account stops being shown a future. The RENDER half of coldwalk:site2_churned_account_presented_in_the_present_tense is built; the finding stays OPEN because its DATA half is not this atom''s.


  MEASURED BEFORE BUILT, and the walk had undercounted again -- the second time on this atom. Cold-eyes found C1 rendering ''CHURN RISK 23% / EXPECTED LIFETIME 13.8 yrs / PRICING ACTION OK / CLV GBP2,741 / Forecast Annual Profit GBP374'' beside its own notice reading ''Account closed 2021-12-30 -- final bill C1-INV72. Account settled to zero.'' Enumerating every published per-customer record first: FIVE of the nine domestic households (C1, C3, C4, C5, C6) carry a real `churned` timeline event, and every one of them was rendering live forward-looking figures. A fix written to the finding''s own single instance would have left four households defective and a green suite.


  THE REPAIR, and why it needed no new plumbing. householdClosureDate() reads the same real `churned` timeline event closedAccountNotice() already fires off -- the drill-down has always known the closure date, it just never told the forward-looking panels. fwdLabel() is the SOLE writer of the qualifier, frozenHint() the sole writer of the dated note. Six labels route through it: Churn Probability, Expected Lifetime, Pricing Action (per fuel leg), Customer Lifetime Value, Forecast Annual Profit, plus the forecast-cashflow projection''s own note. Nothing was recomputed and no figure changed -- the defect was TENSE, not value, and the fix is tense.


  R15 BOTH WAYS, and the second direction is the one that matters. Direction 1: fwdLabel() returning the label unchanged is exactly the page as cold-eyes found it, and it kills test_every_forward_looking_figure_on_a_closed_account_is_frozen by name. Direction 2 is the fail-open this control invites -- a closure detector that always answers ''closed'' satisfies direction 1 on any page at all, while telling every live account holder''s supplier that its customer had left. So the inverse is driven on a genuinely live dual-fuel household (C2/C2g, pinned non-churned by its own vacuity guard) and the always-stamp mutation kills test_a_live_households_forward_looking_figures_are_not_stamped_frozen. Neither ''never stamp'' nor ''always stamp'' passes.


  ANTI-VACUITY on the data, not just the render: test_the_closed_fixture_household_actually_carries_live_forward_looking_figures fails if the closed household''s record ever publishes zeros for churn/CLV/lifetime/forecast -- because then there would be nothing to mis-tense and the control would pass over a page that had never been fixed. The rendered closure date is read from the published record rather than typed in, so a regenerated run cannot make it cry wolf. Labels are read from LABEL SITES only (class="rl" / class="kpi-label"), not raw text: the projection''s prose legitimately says ''discounted at the same rate used for Customer Lifetime Value'', and a text-level checker would have flagged a sentence that was right.


  CAUGHT IN PASSING, by this module''s own anti-vacuity test rather than by review: the qualifier blinded the leak checker the moment it shipped. COMPANY_ONLY_FIGURES pinned ''class="kpi-label">Churn Probability<'' on the closing ''<'', so ''Churn Probability (at closure)'' stopped matching and test_the_named_figures_are_actually_present_somewhere went red -- the SAME narrowed-parser class the comment directly above that dict records having paid for once already (the ''Lifetime net (commodity)'' rename). Patterns now carry an optional _Q qualifier and match the figure on a live household and a closed one. Worth recording that the anchoring comment was there, was read, and the pattern was still written narrow.


  WHAT THIS DOES NOT FIX, stated rather than left to be found. (a) THE DATA HALF, and it is not SITE2''s: site/data/customers/C1.json publishes churn_probability 0.23 / clv_gbp 2840.5 / expected_lifetime_periods 14.94 / forecast_annual_profit_gbp 374.18 while C1g -- same household, same 2021-12-30 closure -- publishes zeros. The two legs of one household disagree about whether it still exists. Producer is tools/generate_customer_data.py, a generator-lane item; the page now presents those figures in the right tense but cannot make them agree. (b) The #op-state exhibit''s own churn tile reads company.json''s `household` block, which carries no closure field at all, so it could only know by new plumbing (forbidden by this atom''s constraint) or by inferring closure from annual_pnl''s last year -- an inference printed as a fact. Blocked on (a).


  GREEN: site/customers/test_wall_exhibit.py + test_customers_door.py 82 passed (75 pre-existing + 7 new). LEVEL STAYS 2: exit (4)''s URL half is still SITE3''s, the Expert-Hour verdict is still NO, and this finding is still open on its data half.'
map_notes:
  name: 'MINTED FROM Part 2 of DIRECTOR_RULING_THE_PORTAL_IS_A_WALL_EXHIBIT_2026-08-12 (advisor-staged, director-ruled in session 2026-08-12) -- the same missing-''WORK THIS CREATES''-block defect as D36 applies; derived from Part 2''s own Requirements/Non-negotiables, author asked to supply the formal block rather than this being silently absorbed. site/customers/index.html titles itself ''Customer Portal'' and invites login ''to view your household'' while rendering three layers at once: customer-observable (bills, usage, payments, meter details), company-only (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit), and SIM-only (satisfaction score, causal reaction chain, wholesale trading margin -- already noted ''SIM-internal'' on-page). No real supplier shows a customer their churn probability; nothing outside the simulation can see a satisfaction score at all. Director ruling: keep all three layers, rename and re-home the page as a deliberate side-by-side comparison of the two sides of the epistemic wall -- the layering becomes the exhibit, not a leak to apologise for. EXIT: (1) every panel on the page structurally declares which side it is on (customer-observable / company-only / SIM-only) via a mechanism that FAILS when a new panel is added without declaring a side -- the ruling''s own non-negotiable is ''a control that cannot fail is not a control'', and the existing honesty-wall notes are exactly the prose version of this gap; (2) the customer-eye view renders as its own coherent subset -- what a real account holder would see, isolated, not assembled by a visitor reading labels across the whole page; (3) no SIM-only figure (satisfaction score, causal reaction chain, wholesale trading margin) renders under a company-attributed panel, and no company-only figure (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit) renders under the customer-eye subset -- tested against these named instances specifically; (4) name, title, entry copy and URL stop claiming to be a customer''s portal, and the old URL redirects per SITE_CONSTITUTION.md''s own pixel/redirect rule (site/_redirects, site/test_no_links_to_redirected_urls.py), fetched live; (5) the relationship to the real customer portal at company/portal/ is stated on the page, not left to be inferred; (6) the existing honesty-wall notes (incl. the SIM-internal trading-margin note) are preserved, diffed against the pre-change page, not merely re-typed; (7) D36 (Part 1''s bill-footing fix) still passes its own exit tests after this atom''s redesign touches the same file -- the ruling''s own ''Part 1 lands intact through this work''; (8) R15 both ways -- a mutation removing a panel''s side-attribute, and one moving a company-only figure into the customer-eye subset, each kill a NAMED test. No new data plumbing -- everything named is already in the per-customer JSON.'
