  - "    findings:   # OPEN; reconciled vs the ledger by tests/controls/test_map_reconciliation.py\n    # THE RE-RUN WALK's four are ALL answered, under fixed_2026_08_18. The one left is an\n    # adjudicated FALSE POSITIVE. Verdict STAYS \"NO\": it is a property of a WALK, not of a\n    # list going empty, so the next Expert Hour re-walks and says what it finds.\n    # NOTE the two entries that used to sit here are now under findings_rehomed above, each\n    # with its owning lane. One residual this atom still cannot discharge and which travels\n    # with the data half: the #op-state exhibit's own churn tile reads company.json's\n    # `household` block, which carries no closure field at all -- so it can only know the\n    # account closed via new plumbing (forbidden by this atom's constraint) or by inferring\n    # closure from annual_pnl's last year, which would print an inference as a fact.\n    # Adjudicated REFUTED and kept here as narrative per the reconciliation control's own\n    # convention. Not carryable debt: the doubt was the identical GBP330 cost-to-serve on both\n    # fuel legs, which is the FIXED state of coldwalk:cost_to_serve_cross_fuel_mismatch_same_\n    # household (~GBP55/yr overhead per account, GBP110/household -- inside the persona's own\n    # prior), and its presentational half closed 2026-08-15 with the dual-fuel money fix above.\n    - coldwalk:site2_coo_cost_to_serve_double_count_doubt          # adjudicated REFUTED"
