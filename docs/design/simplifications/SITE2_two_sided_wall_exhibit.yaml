  - "    findings_rehomed:   # real, NOT SITE2's, and not closable inside its file_scope\n    # Staged for the owning lanes as\n    # docs/staging/WORKER_FINDING_TWO_DEFECTS_THE_WALL_EXHIBIT_SURFACED_ARE_NOT_THE_EXHIBITS_2026-08-17.md\n    # Both sat on the OPEN list below for five days, holding this atom's verdict on work no\n    # edit inside site/customers/** could do. Re-homed with owner + why recorded on each\n    # ledger row, never dropped.\n    - key: coldwalk:site2_churned_account_presented_in_the_present_tense\n      half: data   # the RENDER half is this atom's and was built 2026-08-15 (see the ledger)\n      owner: generator lane -- tools/generate_customer_data.py\n      # SCOPE CORRECTED against the tree 2026-08-17: the 08-14 note named four divergent\n      # fields; three now publish null on C1 too, repaired by another lane. What remains is\n      # one -- C1 churn_probability 0.23 vs C1g null, same household, same 2021-12-30 closure.\n    - key: coldwalk:site2_consumption_has_no_winter_peak_under_a_seasonality_panel\n      owner: sim/world lane -- the consumption generator\n      # The walk's OWN entry already said this was a WORLD/SIM fidelity finding needing its\n      # own sim-lane atom under R12, and it was filed against SITE2 regardless.\n      # RE-RUN 2026-08-17 reproduced it STRONGER, independently: August beats December on\n      # 3/3 checkable years, Dec 2021 sits 4.9% BELOW Nov, six-year volume CV is 0.55%, and\n      # lockdown 2020 is invisible. Same owner, more evidence.\n    - key: coldwalk:site2_renewal_effect_lags_its_cause_by_one_period\n      owner: generator/sim lane -- the customer reaction-chain producer, NOT site/customers/**\n      # Staged as docs/staging/WORKER_FINDING_THE_WALL_EXHIBITS_CAUSAL_PANEL_IS_ONE_PERIOD_LATE_2026-08-17.md\n      # Two personas reconciled it independently by shifting one row: 8/8 within 6%, with\n      # 334.0 GBP/MWh -> 33.34p exact. OBSERVED IN THE DATA, not the render -- C1's published\n      #