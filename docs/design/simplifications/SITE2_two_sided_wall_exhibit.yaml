atom_id: SITE2_two_sided_wall_exhibit
simplifications:
- '2026-08-17 HARDEN (worker tick, second of the day): the exhibit was BLANK on four of thirteen households and printed a fabricated company belief on six more. Neither defect was in the Expert Hour''s finding list, and both were live on the deployed page while the suite was 82/82 green -- because every control in this module drove TWO households.


  HOW THEY WERE FOUND. The draw was SITE2 at loop_stage build with every in-scope walk finding already closed, so the tick started by re-measuring rather than by picking the next item off a list: drive the page''s own code over EVERY published per-customer record and print what renders. Four households did not render at all.


  DEFECT A, A FAIL-CLOSED CONTROL FIRING ON REAL DATA. chainSide() refuses an event type nobody has sided -- correct, and the 2026-08-13 tick built it that way deliberately, because placing an unclassified event by default would be a silent claim about which side of the wall it belongs on. But _CHAIN_SIDE was written against the RESIDENTIAL arrears ladder only (DD_FAILED -> FIRST_NOTICE -> SECOND_NOTICE -> RESOLVED), and simulation/arrears_engine.py::ic_arrears_stages also publishes the I&C DISPUTE ladder (INVOICE_DISPUTED -> DISPUTE_NOTICE(+14d) -> PAYMENT_PLAN_AGREED(+30d) | WRITTEN_OFF). Twenty-two of those events are published across C5, C6, C_IC2, C_IC3, C_IC3g and C_IC4 and not one type was sided, so timelinePanels() threw. renderTab() has no catch, so the Timeline tab rendered as an EMPTY BODY with no message -- the causal reaction chain, one of the three layers this atom''s own exit criterion (3) names by instance, was unreachable on the public page for C5, C6, C_IC2 and C_IC3. R11 BEFORE the fix: the LIVE page fetched from https://poesys.net/customers/ (200, 128,831 bytes) driven against the LIVE https://poesys.net/data/customers/*.json refused on exactly those four and rendered C1 and C3. The live page does not contain the string arrears_invoice_disputed at all.


  THE SIDING, which is the part that could have gone wrong. All three types are CUSTOMER- observable and the reasoning is stage-for-stage parallelism, not vibes: the I&C ladder is the same ladder as the residential one whose every stage is already sided customer -- the customer RAISED the dispute, DISPUTE_NOTICE is the same artefact as first/second notice (tools/generate_payment_ledger_data.py buckets all three as "notice"), and a payment plan cannot be "agreed" with one party. The description "escalated to accounts receivable" is the INTERNAL CONSEQUENCE of a notice the account holder received, not evidence the notice is internal. The write-off/recovery tail is where the ladder genuinely crosses the wall and was already sided company. Human labels added too: chainLabel() falls back to the raw event_type, so a sided-but-unlabelled type prints arrears_payment_plan_agreed at a reader -- siding and naming are separate omissions and now have separate checks.


  DEFECT B, A STRUCTURAL BLANK PUBLISHED AS A CONFIDENT ZERO. The per-customer records deliberately carry null where the company holds no belief -- build_clv excludes accounts no longer supplied, and W2_17_dual_fuel_leg_clv_attribution stopped the gas legs publishing fabricated zeros. gbp() honoured that. Two other render sites did not. `(d.expected_lifetime_periods||0).toFixed(1)` printed "0.0 yrs" and `d.churn_probability||0` printed "0%" under a green "Low risk" caption with a zero-width risk bar, both inside the COMPANY-attributed "Retention & Risk -- the supplier''s estimates" panel. Measured population BEFORE building, because this atom has undercounted its own findings three times: 8 of 13 households publish a null expected lifetime and CLV (C1, C3, C4, C5, C6 and SYN-2021-001 on the domestic book, and every gas leg), and all of them rendered "Expected Lifetime (at closure): 0.0 yrs" -- beside a CLV in the SAME panel that correctly rendered a dash from the SAME null. SYN-2021-001 additionally rendered "Churn Probability 0% / Low risk" from a null. Third site: combinedTotals().clv summed the two legs with `(e?e.clv_gbp:0)+(g?g.clv_gbp:0)`, and null+null===0 in JS, so the roll-up published "Combined CLV £0". This is the RENDER instance of WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO_2026-08-17, on the one surface where manufacturing a company belief out of an absent one is the exhibit''s own subject.


  THE MECHANISM, not the six null-guards. NO_BELIEF is the single marker and every forward-looking site routes through a helper that emits it: yrs() for a lifetime, pct() and gbp() extended to null, sumBeliefs() for a roll-up that returns null when no leg has a value rather than adding two blanks to zero. The churn tile drops its risk bar and its "Low risk" caption when there is no estimate, because a colour and a word are beliefs too.


  THE CONTROL IS THE POPULATION, NOT THE SIX KEYS (R10). Adding three _CHAIN_SIDE entries and three null-guards is the instance fix. Section (14) makes the class fail by itself: test_the_page_renders_every_published_household drives EVERY published household, which is the control that would have caught defect A live and the one this module did not have; test_every_reaction_chain_event_type_in_the_published_book_declares_a_side is INDEPENDENT rather than tautological -- one side is the page''s own _CHAIN_SIDE parsed out of the page, the other is every event_type the generator actually publishes, so the next stage arrears_engine.py invents fails here before it reaches a reader; test_a_forward_looking_field_published_as_null_never_renders_as_a_number asserts on the RENDERED value across the whole book, so a render site added later is covered without being enumerated.


  R15 BOTH WAYS ON BOTH DEFECTS, AND THE SECOND DIRECTION IS THE ONE THAT MATTERS. Defect A: removing the three I&C keys is exactly the page as it was live and kills test_the_page_renders_every_published_household AND the census test, by name. Defect B direction 1: `||0` back on the lifetime site kills the null control with the literal string "renders ''0.0 yrs''". Direction 2 is the fail-open the null control INVITES -- a page that blanks EVERY forward-looking figure satisfies it on any book at all, while telling the supplier it holds no belief about any customer; yrs() returning NO_BELIEF unconditionally kills test_a_household_that_does_publish_forward_looking_figures_still_ renders_them. Anti-vacuity on the DATA as well as the render: test_the_published_book_carries_both_blank_and_populated_forward_looking_records fails if the generator ever publishes a belief for every account (the null control would then pass over an unfixed page) or for none (the inverse would).


  QUEUED, NOT FIXED, per SELF-INTERRUPT DISCIPLINE. C_IC4 publishes 9 of the disputed events and 66 invoices but an EMPTY `timeline` array, so timelinePanels() short-circuits before chainSide() is ever called -- it escaped defect A by having nothing to render, not by being correct, and its reaction chain is still invisible. That is a generator question (tools/generate_customer_data.py), not a render one, and is not this atom''s file_scope.


  GREEN: site/customers/ 91 passed (was 82; +9 in section 14). D36/exit (7) intact -- tools/verify_printed_bill_render.mjs PASS, 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures. Neighbouring consumers of this page green (73 passed across the bill-correctness, billing-ledger, revenue-reconciliation, printed-bill-footing, no-portal-claim and glossary suites). LEVEL STAYS 2: exit (4)''s URL half is still SITE3''s and the Expert-Hour verdict is still NO.'
- '2026-08-17 HARDEN, level STAYS 2 (worker tick, scheduled draw). Two pieces of work: the cost-to-serve caption finding closed as a CLASS rather than an instance, and SITE2''s whole Expert-Hour record reconciled against the tree.


  WHAT THE DRAW ACTUALLY FOUND. The atom was drawn at loop_stage=build with expert_hour status=findings_open, verdict NO and three findings on its open list. None of the three was a buildable SITE2 defect. One (coo_cost_to_serve_double_count_doubt) is adjudicated-false-positive and its kept half closed on 2026-08-15. Two are real and belong to other lanes -- and the seasonality one says so in its OWN evidence (''a WORLD/SIM fidelity finding surfaced by the exhibit, not a SITE2 render defect''). So the list that was holding this atom''s verdict had nothing on it this atom could do. Meanwhile the map''s fixed_2026_08_12 list named THREE findings whose ledger rows still read adjudicated-real -- the map said fixed, the ledger said open, for five days. Every one was verified in HEAD before its row was moved, not taken from the prose.


  THE DEFECT THAT WAS STILL LIVE, and it was hiding inside a finding both records called fixed. coldwalk:site2_lifetime_net_captioned_after_cost_to_serve_is_before_it was the walk''s root-cause-of-the-implausible-margin finding: a tile printing lifetime_net_gbp (BEFORE cost to serve) under an ''after cost-to-serve'' caption, beside a cost-to-serve tile a reader could subtract. The 08-12 repair fixed the tile it was found on and ONE other site, and shipped with NO TEST AT ALL -- the caption could be flipped straight back to the defect and the 91-test suite stayed green. The page renders a lifetime-net figure in FIVE places; three named no side of cost-to-serve at all, and the op-state tile''s ''before cost-to-serve'' spelling differed from the billing panel''s ''before cost to serve'', so even the fixed pair did not agree with each other.


  THE SHARPEST OF THE THREE was the household ROLL-UP, which is the figure this finding''s own arithmetic was about: it computed 1241.48/4815.98 = 25.8% shown against 12.1% actual, i.e. the HOUSEHOLD number, and the roll-up is where a reader gets the household number. It published a before-cost-to-serve ''Combined Net Margin'' under the heading ''what these accounts are worth to the supplier'' with no qualifier -- while combinedTotals().net_after_cts sat computed on line 816 and rendered nowhere. The fix needed no new data: the value already existed.


  BUILT. ctsSide() is the SOLE writer of the before/after-cost-to-serve qualifier and all five render sites route through it (the two already-qualified ones were re-routed so the sole-writer claim is true rather than asserted). The roll-up gains ''Combined Net after cost to serve'' from the already-computed total; the two drill-down company panels gain a per-account after-cost-to-serve row beside the figures a reader was previously left to subtract. The op-state tile''s hyphenated spelling is normalised. No new plumbing, per the atom''s own constraint.


  THE CONTROL, and why the last one was not one. site/customers/test_wall_exhibit.py section 16, 6 tests. SUBJECT is whole_document(rendered,''both'') -- the op-state exhibit PLUS every drill-down tab -- because two of the six defective renders live in the region section 9''s old subject excluded; a drill-down-scoped control would have been blind to them, which is the wrong-subject class this module has already paid for twice. It is a VALUE check, not a prose check: every lifetime-net figure is matched to the nearest legitimately-published value and the SIDE of that match is asserted, so a before-cost-to-serve number under an after caption fails. ANTI-PIN: the expected values are read from the same per-customer records the page reads, so regenerating the book cannot make it cry wolf. R15 BOTH WAYS -- test_mutation_the_original_defect_restored_kills_a_named_test (ctsSide always answers ''after'' = the 2026-08-12 finding put back verbatim) and test_mutation_dropping_the_qualifier_kills_a_named_test (ctsSide returns '''' = the state three of five sites were actually in). Two vacuity guards: the before/after values must be separable by more than the match tolerance, and the scanner must see all five render sites -- that second one is the miss that let the 08-12 repair look complete.


  PROVEN ON THE UNFIXED PAGE, which is the evidence that matters: the control was run against `git show HEAD:site/customers/index.html` and FIRES, naming all six unqualified renders (drill-down Overview x2 legs, drill-down Accounts x2 legs, roll-up x2 tabs). site/customers/ 97 passed (was 91); site/ 717 passed, 7 skipped.


  RECONCILED. Ledger: 3 rows moved to fixed with fix_evidence (the two 08-12 repairs the map knew about and the ledger did not, plus this one); the churned-account row moved to fixed on its render half with its DATA half re-homed to the generator lane; the seasonality row re-homed to the sim lane; the refuted cost-to-serve row annotated with how its kept half closed, since a false-positive state can hide a real second claim. Map: findings_rehomed records both with owner and why, the open list keeps only the refuted entry (the reconciliation control''s own documented convention, and what keeps its anti-vacuity leg non-empty), status moves to passed_execute_after_fix. Both re-homed halves are staged as docs/staging/WORKER_FINDING_TWO_DEFECTS_THE_WALL_EXHIBIT_SURFACED_ARE_NOT_THE_EXHIBITS_2026-08-17.md so neither is lost.


  CORRECTION TO THE RE-HOMED CLAIM, measured not inherited: the churned-account data half was recorded on 2026-08-14 as four divergent fields between C1 and C1g. Three of them (clv_gbp, expected_lifetime_periods, forecast_annual_profit_gbp) now publish null on C1 too, repaired by another lane''s null-belief work and not by anyone acting on this finding. One remains: C1 churn_probability 0.23 against C1g null, same household, same 2021-12-30 closure.


  LEVEL STAYS 2, deliberately. The Hour''s verdict of NO was returned against a page that has since been rebuilt, so it is stale -- but stale is not discharged, and this tick reconciled records it also wrote, which is not evidence for a level move. The gate for L3 is a re-run cold-eyes walk on the current page, which is its own draw. Also unchanged and NOT this atom''s: exit criterion (4)''s URL half belongs to SITE3_wall_exhibit_url_rename (level 0), and the #op-state churn tile still cannot know an account closed without the generator-lane data half.'
- '2026-08-17 HARDEN, THE RE-RUN COLD-EYES WALK (worker tick, scheduled draw). Level STAYS 2. The previous entry named the L3 gate in its own words -- "a re-run cold-eyes walk on the current page, which is its own draw" -- so this tick ran it. VERDICT NO, and two of its findings are this atom''s own exit criteria (2) and (3) RED again.


  METHOD, and the blindness is audited rather than asserted. Live https://poesys.net/customers/ fetched (200, byte-identical to the working tree at the time of the walk); 28 rendered captures from a real headless-Chromium boot against the live host, every scene x the three wall views, zero failed requests. Three blindfolded personas (retail COO, governance CDO, energy-tech VC) each received the captures and nothing else; all three transcripts were parsed for tool calls touching the repo, git, the map or any .py/.yaml -- 0 violations across 52 calls. Per the skill''s own wall that is BLINDNESS, not independence (same model family), and the map still records independence: false.


  WHAT IT FOUND FIRST, and all three led with it independently. In "The customer''s side" the landing document still published "sim 3.2% vs company 95.0%", "True satisfaction fell 12.2 percentage points" and "Real downstream drift: income stress low -> high" -- under the view''s OWN sentence "No company estimate and no simulation ground truth is in this view; if one appears, the page is broken". Root cause verified in code, not inferred: renderCaseStudies() appends .cs-card nodes to #app with no data-wall-side, and applyWallViewToOpState() walks #op-state''s children only, so the grid sat in no wall control''s subject. A second, quieter defect in the same function: "if(!side||wallViewShows(side))" showed any UNDECLARED block in every view -- the fail-open half.


  AND THE SELECTOR THREW IN ITS OWN HOME STATE. Every click of the three view buttons on the landing page raised "Cannot read properties of null (reading ''segment'')" -- setWallView called renderHousehold() with HH={elec:null,gas:null,base:null}. Silent to a reader (the throw is after the op-state filter, so filtering still applied) and invisible to a 97-green suite.


  WHY 97 TESTS WERE GREEN, which is the reusable half and the reason this is a CLASS. Every fixture in the module assigns a fully populated household BEFORE it drives anything -- _wall_harness.mjs sets sandbox.HH and only then calls setWallView -- so no subject in this module could contain either defect. One lives in the branch taken when HH is empty; the other in a component appended to #app by a third path. This is the SAME class as 2026-08-12 ("a new layer above a control must inherit its subject"), caught a second time in the same file, which is what makes an instance fix insufficient.


  BUILT, as a class at both ends. PRODUCER: tools/generate_case_study_recommender.py declares wall_side per slot through _side(), which RAISES on a missing or unknown value -- there is deliberately no default. The rule is stated and is not the obvious one: the side is the most privileged layer the PUBLISHED HEADLINE reveals, not the layer the DETECTOR read. Every slot here is detected off the reaction chain, so a detector-based rule would mark all six sim and answer a question nobody asked; what ships is the headline. Result 4 sim / 2 company / 0 customer. PAGE: each card carries its side and a chip and is filtered by the page''s own wallViewShows(); a card whose side is missing or unknown is WITHHELD and counted, not shown. CLASS GUARD: applyWallViewToApp() makes the DOCUMENT the subject -- every top-level child of #app must declare a side or declare itself chrome, and an undeclared one is removed from the document and pushed to WALL_VIOLATIONS with a console error. setWallView() renders the household only when one is open. The customer view now says why its grid is empty, so an empty grid reads as the exhibit working rather than a missing panel.


  THE CONTROL, and the fixture that did not exist. site/customers/_landing_harness.mjs: subject is the rendered #app document in the BOOT state, HH left at the page''s own declared initial value, driven through showLogin()/setWallView(), with #app modelled as real child nodes and real attributes because "a block was REMOVED from the document" is the property being asserted. test_wall_exhibit.py section 17, 10 tests. ANTI-PIN: the leak strings are read out of site/data/case_studies.json, never typed into the test, so regenerating the book changes what is checked rather than making it cry wolf. ANTI-VACUITY: every card must still be published in the behind-the-wall view, and the customer view must differ from the both-sides view -- a grid that simply stopped rendering would otherwise pass the leak check for the wrong reason.


  PROVEN ON THE UNFIXED PAGE, which is the evidence that matters. Run against "git show HEAD:site/customers/index.html" the harness reports the throw on 3 of 3 views AND the leak check fires naming all six cards. R15 four mutations, both defects, both directions: the leak restored (the grid stops obeying the view); the fail-OPEN shape the page was actually in (an undeclared card defaulting to the customer''s side, driven in all three views so a "behind"-only probe cannot pass it); the unconditional renderHousehold() put back; and the class guard''s fail-closed branch removed. R11 on a real chromium boot of the built page: 0 console errors, 0 leaked headlines in the customer view, 6/6 cards still published behind the wall, the empty-view note rendered. site/customers/ 107 passed (was 97); tests/tools/test_case_study_recommender.py 24 passed (was 20).


  WHAT WAS NOT FIXED, and why each is honest rather than deferred. FIVE findings stay open with evidence in the ledger. (1) One quantity, two published values: company.json household.latest_churn_probability = 0.23 renders as "belief at last renewal decision" while C1''s timeline says the company believed 5% at that same 2021-12-30 decision, and 23% matches none of the six beliefs the chain records. OBSERVED: both producers carry 0.23 independently. INFERRED and NOT yet checked (R9): which is the belief at the last renewal, i.e. whether this is a wrong FIELD behind a right label (SITE2''s) or a wrong VALUE upstream. (2) "FAILED PAYMENTS 0 / no arrears cases" beside two complete four-step arrears cascades -- two producers published side by side and never reconciled; the 2026-08-13 repair moved arrears onto the customer''s side and left the "clean" claim in the money panel. (3) The C1-pinned exhibit above every other household''s drill-down: not wrong data under a wrong id, but 3 of 3 blind readers attributed C1''s GBP6,560.17 and "two person / urban flat" to C6 (SME, no gas) and C_IC1 (I&C) -- the misread rate IS the finding. (4) "Account settled to zero" and "You are currently GBP24.37 in credit" on one closed account, a STATEMENT contradiction whose correct resolution depends on a fact the page does not carry. (5) The causal panel is one period late -- re-homed to the generator/sim lane, because C1''s published events literally pair "Tariff renewed at 128.0 GBP/MWh" with "Unit rate stepped 11.31p -> 11.36p"; two personas reconciled it independently by shifting one row (8/8 within 6%, 334.0 GBP/MWh -> 33.34p exact) and the VC''s open question is the one that matters: display join, or a billing engine applying last year''s price vintage through the 2022 spike. The re-homed seasonality finding reproduced STRONGER (August beats December 3/3 checkable years, six-year volume CV 0.55%, lockdown 2020 invisible). Both re-homed halves are staged for their lanes so neither is lost.


  WORTH KEEPING, from the VC: "Real underneath, badly mis-presented on top." She was convinced the simulation is real by the retail unit rate peaking in 2023, a full year after the 2022 wholesale peak -- the price-cap lag, which she said nobody reproduces by accident. Her closing note is the actionable one and it is why these findings rank above new capability: each presentation defect independently made a blind expert assume the data underneath was fabricated.


  LEVEL STAYS 2. Fixing two findings from a walk that returned NO is not the walk passing, and the remaining four are this atom''s own surface. The gate for L3 is unchanged in shape and now has a real list attached to it.'
- '2026-08-18 HARDEN, THE ARREARS COUNTERS (worker tick, scheduled draw). Level STAYS 2.



  THE FINDING, and it was the walk''s own MAJOR from all three personas. The money panel published ''FAILED PAYMENTS 0 - direct-debit returns'', ''PAYS BY direct debit'' and ''No arrears cases on this account''s electricity record'' directly above the same account''s Timeline, which renders two complete four-step arrears cascades whose rows read ''Standard credit payment not received''. Three claims, one producer -- company.json''s `household` block, which is commodity=''electricity'' ONLY -- published as the household''s, beside the per-leg record that contradicts them. The 2026-08-13 repair that moved arrears onto the customer''s side of the wall moved the cascades and left the clean claim stranded in the panel whose own footnote boasts about having fixed it.



  THE OWNERSHIP CALL THE LEDGER ROW DEFERRED, now made and measured rather than argued. The row said ''owner split is the next tick''s disposition''. The answer is that the whole RENDER half is this atom''s and nothing is owed by a producer lane: every contradicting claim is derivable from records the boot path ALREADY fetches. C1g''s reaction_chain carries the two cascades (arrears_payment_missed 2016-11-15 GBP43.66 and 2018-09-15 GBP26.84, each -> first_notice -> second_notice -> resolved); its ledger.entries carry the matching 4 notice + 2 arrears_resolved rows against invoice_number 82 and 104; its 68 payment_received rows are all method=standard_credit while C1''s 72 are all direct_debit. The persona''s separate doubt -- ''arrears amounts that reconcile to no invoice in the 72-bill ledger'' -- resolves as the SAME defect one level down: 82 and 104 are C1g''s own bills (C1g-INV73..INV144), so the reader was reconciling gas arrears against the ELECTRICITY leg''s numbering because the page had told them the household was one leg.



  BUILT, as a class at the producer end. window.__householdCollections(legs) is the SOLE producer of every collections claim on the panel, derived from the same per-leg chains the Timeline renders, so the two CANNOT disagree by construction. Three design choices that are not the obvious ones. (1) A case is counted by its OPENER (dd_failed / payment_missed / invoice_disputed), never by pairing a ladder start to a ladder end: C4 and C7 publish INTERLEAVED cascades -- a second miss opens before the first resolves -- so run-based grouping would silently merge or split real cases. (2) FAIL-CLOSED on an arrears event type the page cannot classify, and the reason is asymmetric: an undercount here does not render as an undercount, it renders as a CLEAN PAYMENT HISTORY. (3) The company.json block is NOT discarded -- reconcileCollections() compares it LEG TO LEG against that leg''s own chain and PUBLISHES the disagreement naming both producers and both values (the churn-tile precedent from 2026-08-18''s earlier tick), rather than silently preferring either. Leg-to-leg on purpose: comparing a leg-scoped counter to a household total would fire on every dual-fuel household and mean nothing.



  RENDERED (C1, through the page''s own _render_harness.mjs against the published records): ''Payments missed 2 - 2 standard-credit payments not received - household - from the account''s own arrears record''; ''Pays by direct debit + standard credit - differs by leg - electricity: direct debit - gas: standard credit''; and an Arrears block reading ''2 cases across this household''s 2 fuel accounts / electricity leg - none / gas leg - 2 arrears cases'' with both amounts and opening dates. The clean claim is gone, and the tile that said ''0'' says 2.



  THE CONTROL, and the one test that earned its keep in its first run. site/customers/test_wall_exhibit.py section 18, 43 tests, driven over EVERY published household rather than the one the walk named. R15 five mutations: read the counter off the single-leg block again; restore the unconditional clean claim (the CLAIM half, which no value check can see); derive from the legs but stop at the first (which for this household is the CLEAN electricity leg, so the page lands straight back on ''no missed payment'' beside two live cascades); fail open on an unclassified event; make the reconciliation note unconditional. Plus test_every_check_in_this_section_fires_on_the_page_as_it_SHIPPED, which drives all four checkers against `git show HEAD:site/customers/index.html` and requires each to fire -- and which immediately caught its own author: the first draft of the leak-string list was read off the REPAIR''s vocabulary and PASSED against a page publishing ''No arrears cases on this account''s electricity record''. A control whose subject is chosen by convenience. The list is now the DEFECT''s vocabulary, and the page''s per-leg line was changed to ''<fuel> leg - none'' so a scoped statement cannot collide with the household claim the control forbids. Anti-vacuity both directions: a household clean on every leg (C3) must STILL be told so in plain words, and the reconciliation note must stay SILENT on the real pairing where the two producers agree.



  RE-HOMED, not dropped. site/now/index.html:372-376 publishes the identical claim set off the same single-leg block -- ''Payments: 0 failed'', ''Arrears: none'', ''direct debit'' -- for this same household, on a second live public door. Outside this atom''s file_scope, with its own door tests (site/now/test_now_door.py:286 pins the chip) and its own R11 obligation, so it is staged as docs/staging/WORKER_FINDING_THE_NOW_DOOR_PUBLISHES_THE_SAME_SINGLE_LEG_COLLECTIONS_CLAIM_2026-08-18.md with the measurement attached rather than fixed out of scope.



  EVIDENCE. site/customers/ 153 passed (was 110). tools/verify_printed_bill_render.mjs PASS -- 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures (exit (7), D36 intact). tests/tools/test_case_study_recommender.py, tests/tools/test_billing_and_payments_ledger.py, site/now/test_now_door.py and tests/controls/test_map_reconciliation.py all green (214 together).



  LEVEL STAYS 2. Two of the re-run walk''s four findings are now fixed; the walk''s verdict was NO and fixing findings from a walk that returned NO is not the walk passing. Two remain, both this atom''s own surface: the C1-pinned exhibit above every other household''s drill-down (a layout decision), and ''Account settled to zero'' beside ''currently GBP24.37 in credit'' (a same-page contradiction whose correct resolution depends on whether that credit was ever refunded -- a fact the page does not carry). The gate for L3 is unchanged: a re-run cold-eyes walk that returns YES.'
- '2026-08-18 BUILD (worker tick, SITE2 draw): a closed account cannot both have settled to zero and be in credit. coldwalk:site2_closed_account_settled_to_zero_and_in_credit CLOSED as a CLASS, with a sole writer of every standing claim on the page.



  THE FINDING, all three blind personas of the 2026-08-17 re-run walk, and it survived the 2026-08-15 present-tense repair. C1 closed 2021-12-30; the page published, at once: ''Account closed 2021-12-30 -- final bill C1-INV72. Account settled to zero.'' (Billing), ''You are currently GBP24.37 in credit -- that is your money, held by us'' (overview), and ''the household combined (both fuels) LIVE ledger position'' (Risk), under a header stamped ''data 2026-08-17''. The arithmetic was never wrong -- 6,560.17 - 6,584.54 = -24.37, the credit entirely on the gas leg -- so this was filed as a STATEMENT contradiction, and the reading a blind COO reached for first is a supplier holding a departed customer''s money for four and a half years.



  IT WAS TWO DEFECTS, NOT ONE, AND ONLY ONE OF THEM WAS ABOUT FRAMING. (1) TENSE: three of the four sentence sites were hard-wired present tense on a household the page''s own timeline records as gone. fwdLabel() had frozen every forward-looking LABEL since 2026-08-12; the MONEY sentences were never brought under it. (2) A MISSING BRANCH, and this one is a literal falsehood: closedAccountNotice() tested `current_balance_gbp > 0.005` and otherwise printed ''Account settled to zero'', so a CREDIT balance -- a NEGATIVE number -- fell through to the zero branch. On C1''s GAS tab that claim sat directly over a ledger reading -24.37. Ninety-seven green tests could not see it: EVERY fixture in the module drove the ELECTRICITY leg, whose 0.00 made the claim true. The harness now renders the billing tab PER FUEL LEG (billsByFuel), which is the fixture gap and not a new assertion.



  ROOT CAUSE, which is why this is a class. FOUR sentence sites each decided, privately, what to claim about the same money: the op-state Balance tile''s caption, the op-state Direct-Debit paragraph, riskPanels()''s ''Outstanding Balance / live ledger position'' hint, and closedAccountNotice()''s settlement clause. Four private decisions is how one page comes to publish a settlement claim and a live-credit claim about one household.



  THE MECHANISM. window.__accountStanding is the SOLE writer: it decides state (credit/outstanding/square/unknown), tense (closed or live) and words from one input, and all four sites ask it. It spans BOTH inline scripts, so _wall_harness.mjs and _landing_harness.mjs now run both scripts as the browser does -- a harness that ran only the drill-down would be asserting against a page shape no reader is served. The drill-down''s standing() doorway THROWS rather than keeping a local fallback: a second implementation is exactly how the two claims drifted apart, and an unavailable control is a FAILED control. It FAILS CLOSED on a balance it cannot read -- ''not published'', never ''settled''. window.__householdClosedOn mirrors the drill-down''s householdClosureDate() off the legs the boot path already fetches, so no new plumbing was added (this atom''s constraint) and the two regions cannot disagree about whether the household has gone. The 2026-08-12 note recording that the op-state exhibit ''cannot know the account closed without new plumbing'' is now STALE: the dual-fuel money fix made the legs, and therefore the churned timeline event, available to that region.



  THE LEG-SCOPE HALF, which the finding did not name and which is the other reason the page read as contradicting itself. ''Account settled to zero'' was TRUE of C1''s electricity ledger. It was still read as the HOUSEHOLD''s, because nothing on the notice said which of the two accounts it was about. A leg-scoped notice on a multi-leg household now names its leg, the same discipline the money captions have carried since coldwalk:site2_dual_fuel_household_shows_electricity_only_money.



  THE FACT THE PAGE DOES NOT CARRY, stated rather than implied. Nothing published here records whether the closing credit was refunded. The finding''s own note said its resolution needs that fact; inventing it in either direction is the inference-printed-as-fact this exhibit exists to make visible. So the page states the closing position AND states that the refund is not in the record, and test_a_closed_household_in_credit_says_the_refund_is_not_in_the_record REQUIRES that sentence -- silence cannot come back.



  R15 FIVE WAYS, each killing a NAMED test. (1) the credit branch removed -> test_no_settlement_claim_is_published_over_a_non_zero_ledger. (2) the writer made closure-blind -> test_a_closed_household_makes_no_present_tense_claim_about_its_money. (3) the writer made ALWAYS-closed, the tautology that satisfies (2) on any page at all while telling every live account holder they had left -> test_a_live_household_still_states_its_position_in_the_present_tense. (4) the writer silenced, the fail-open, since no present-tense phrase is present if no sentence is written -> the refund and live-household checks. (5) THE PAGE EXACTLY AS IT SHIPPED (git show HEAD), where all three checkers fire -- the only direction whose subject is the real defect rather than a synthetic reversal of the repair.



  CAUGHT IN PASSING, and it is a control on the controls. This section''s first draft reused section 18''s test name. Python does not collide -- it REBINDS -- so section 18''s shipped-defect proof stopped being collected at all, and the only visible symptom was the skip count dropping from 1 to 0 with no failure to show for it. A silently deleted R15 proof is the FAIL-SILENT pattern applied to the proofs themselves, in a 3,200-line module written across nineteen ticks. test_no_definition_in_this_module_shadows_another now fails on any duplicate top-level name, helpers included -- a redefined _mutate retroactively changes what four earlier mutation tests actually run, and that had happened too.



  R11 ON A REAL CHROMIUM BOOT of the served page, 0 console errors, 0 page errors. Closed household C1: the elec leg renders ''This electricity account closed 2021-12-30 - final bill C1-INV72. Account settled to zero. This is the electricity leg''s own ledger; the household''s combined position is on the Risk tab.''; the GAS leg renders ''This gas account closed 2021-12-30 - final bill C1g-INV144. Closing balance: GBP24.37 in credit - the customer''s money, recorded here as held by us. Nothing published on this page records whether that credit was refunded...''; the Risk tab renders ''BALANCE AT CLOSURE -GBP24 / at closure 2021-12-30 - in credit'' with ''live ledger position'' GONE; the landing exhibit renders ''This account closed on 2021-12-30 holding GBP24.37 of the customer''s money''. ANTI-TAUTOLOGY on the same live surface: C2 still renders ''OUTSTANDING BALANCE GBP248 / outstanding / live ledger position'' and carries no ''at closure'' anywhere.



  EVIDENCE. site/ 832 passed 8 skipped before, 845 passed 8 skipped after -- 12 new tests plus the shadowing census. tests/controls/test_map_reconciliation.py 13 passed, so the ledger''s `fixed` state and the map''s move out of expert_hour.findings reconcile.



  LEVEL STAYS 2, and the reason does not weaken with the count. A walk that returned NO is discharged by a walk that returns YES, never by this lane fixing the things that walk named. ONE of the re-run walk''s findings is left and it is a LAYOUT decision rather than a data or wording repair: coldwalk:site2_c1_pinned_exhibit_reads_as_the_open_households -- the static #op-state exhibit is pinned to C1 and re-renders ~2,000px above EVERY household''s drill-down with nothing separating the two, and 3 of 3 blind readers attributed C1''s GBP6,560.17 and ''two person / urban flat'' to the SME and I&C accounts open below it. Inside file_scope, unbuilt. The gate for L3 is unchanged: a fresh cold-eyes re-run against the page as it now stands, whose independence is still false (same model family as the builder).'
map_notes:
  name: 'MINTED FROM Part 2 of DIRECTOR_RULING_THE_PORTAL_IS_A_WALL_EXHIBIT_2026-08-12 (advisor-staged, director-ruled in session 2026-08-12) -- the same missing-''WORK THIS CREATES''-block defect as D36 applies; derived from Part 2''s own Requirements/Non-negotiables, author asked to supply the formal block rather than this being silently absorbed. site/customers/index.html titles itself ''Customer Portal'' and invites login ''to view your household'' while rendering three layers at once: customer-observable (bills, usage, payments, meter details), company-only (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit), and SIM-only (satisfaction score, causal reaction chain, wholesale trading margin -- already noted ''SIM-internal'' on-page). No real supplier shows a customer their churn probability; nothing outside the simulation can see a satisfaction score at all. Director ruling: keep all three layers, rename and re-home the page as a deliberate side-by-side comparison of the two sides of the epistemic wall -- the layering becomes the exhibit, not a leak to apologise for. EXIT: (1) every panel on the page structurally declares which side it is on (customer-observable / company-only / SIM-only) via a mechanism that FAILS when a new panel is added without declaring a side -- the ruling''s own non-negotiable is ''a control that cannot fail is not a control'', and the existing honesty-wall notes are exactly the prose version of this gap; (2) the customer-eye view renders as its own coherent subset -- what a real account holder would see, isolated, not assembled by a visitor reading labels across the whole page; (3) no SIM-only figure (satisfaction score, causal reaction chain, wholesale trading margin) renders under a company-attributed panel, and no company-only figure (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit) renders under the customer-eye subset -- tested against these named instances specifically; (4) name, title, entry copy and URL stop claiming to be a customer''s portal, and the old URL redirects per SITE_CONSTITUTION.md''s own pixel/redirect rule (site/_redirects, site/test_no_links_to_redirected_urls.py), fetched live; (5) the relationship to the real customer portal at company/portal/ is stated on the page, not left to be inferred; (6) the existing honesty-wall notes (incl. the SIM-internal trading-margin note) are preserved, diffed against the pre-change page, not merely re-typed; (7) D36 (Part 1''s bill-footing fix) still passes its own exit tests after this atom''s redesign touches the same file -- the ruling''s own ''Part 1 lands intact through this work''; (8) R15 both ways -- a mutation removing a panel''s side-attribute, and one moving a company-only figure into the customer-eye subset, each kill a NAMED test. No new data plumbing -- everything named is already in the per-customer JSON.'
