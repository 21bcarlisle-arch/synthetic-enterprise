atom_id: SITE2_two_sided_wall_exhibit
simplifications:
- '2026-08-12 BUILT, level 0 -> 2 (worker tick, self-certified with the evidence below per R16).
  Part 2 of DIRECTOR_RULING_THE_PORTAL_IS_A_WALL_EXHIBIT_2026-08-12. site/customers/index.html
  stops calling itself a Customer Portal and becomes the wall''s own exhibit: one household''s
  own view side by side with what the company knows and what only the simulation knows.

  THE MECHANISM, AND WHY IT IS NOT PROSE. The ruling''s non-negotiable was that the
  side-declaration be STRUCTURAL -- "if a new panel can be added to this page without declaring
  which side of the wall it sits on, nothing has been built, only written down", and it named the
  existing honesty-wall notes as exactly the prose version of the gap. So no tab renderer emits
  panel markup any more. Each returns a LIST of panel(side, title, body) objects and layoutPanels()
  is the SOLE writer of `.wall-panel` markup; panel() throws on a missing or unknown side and
  layoutPanels() throws again on anything reaching it that is neither a declared panel nor
  explicitly-marked chrome. That alone would still be walk-past-able by hand-building a card
  around the helper, so the second half is a STRUCTURAL GUARD on the rendered markup
  (site/customers/test_wall_exhibit.py::test_no_content_block_renders_outside_a_declared_panel):
  an HTML scanner walks every tab in every view and fails on any content block -- card, kpi-grid,
  accounts-grid, chart-wrap, bill-sum, timeline-list -- that inherits no declared side. Nav chrome
  carries none of those classes, which is why chrome legitimately needs no side and content cannot
  avoid one. Placeholders the page fills in AFTER layout (bills-section, usage-section,
  cashflow-kpis, cashflow-kpis-company, forecast-cashflow-body) are checked separately to sit
  inside a declared panel, or the guard would be bypassable by injecting into a bare div.

  THE FIGURES ACTUALLY MOVED, they were not merely relabelled. The top-of-page money grid used to
  render billed, banked, balance, lifetime net, cost-to-serve, churn risk AND a SIM satisfaction
  score as one undifferentiated row of tiles; it is now three panels on three sides (cust-money /
  cust-value / cust-sim), and the who-they-are grid split into the customer''s own account facts
  (cust-who) and the supplier''s classification of them -- segment, occupancy, vulnerability flag,
  engagement (cust-classify). In the drill-down: Overview and Accounts split into a customer card
  (account id, MPAN/MPRN, tariff, meter, customer-since) and a company card (lifetime revenue,
  lifetime net, cost-to-serve, hedge coverage), with the per-year commodity Gross/Net table -- the
  wholesale trading margin the ruling names as SIM-only -- lifted into its own SIM panel carrying
  its original note. Timeline split: the events a household lived through stay customer-side, while
  the CAUSAL EFFECT attached to each event moved to a SIM panel alongside the reaction chain, since
  a causal attribution is ground truth no supplier could read. Risk split into the customer''s own
  outstanding balance and the supplier''s churn probability / expected lifetime / pricing action.
  Cashflow split into billed-vs-collected (customer) and cost-to-serve / net contribution /
  forecast (company).

  THE CUSTOMER-EYE VIEW IS A REAL VIEW. A three-way selector (Both sides / The customer''s side /
  Behind the wall) filters by OMITTING panels from the DOM, not by hiding them with CSS -- so
  "the customer cannot see this" is true of the rendered document, not just of its styling. In
  Both-sides mode the panels lay out in two labelled columns; that is the side-by-side comparison
  the ruling asked for.

  EVIDENCE (R11 -- asserted on the RENDERED markup, driven by the page''s own code against the real
  per-customer JSON via the new site/customers/_wall_harness.mjs, never on the source string).
  site/customers/test_wall_exhibit.py 24/24 pass; site/customers/test_customers_door.py 11/11.
  Coupled set green in the same run: tests/tools/test_site_structure.py,
  test_e2_revenue_reconciliation_surfaces.py, test_billing_and_payments_ledger.py,
  test_billing_tab_fix.py, test_bill_correctness_addendum_defect1/2/4.py,
  test_nav_story_platform_method_rq.py, test_phase_qn_per_fuel_portal.py,
  site/test_brand_token_adoption.py, site/test_no_links_to_redirected_urls.py -- 141 passed. Wider
  sweep `pytest tests/tools/ -k "site or portal or bill or customer or door or nav or redirect"`
  457 passed. tools/verify_printed_bill_render.mjs still PASSES on the moved file: 1557 rendered
  usage lines checked, 1557 printed a rate, 0 arithmetic failures.

  EXIT (7), Part 1 lands intact: D36 is unbuilt (level 0), so its exit tests do not yet exist; what
  this atom owed it was to leave the bill render path untouched, and
  test_wall_exhibit.py::test_the_bill_render_path_is_intact pins billEquationHtml,
  billUsageLinesHtml, billMeterDetailsHtml, downloadBillPdf and billExpandHtml by signature so a
  future SITE-lane edit cannot quietly restructure the surface D36 is about to change.

  EXIT (6), the honesty notes were DIFFED, not re-typed: `git show HEAD:site/customers/index.html`
  was extracted to /tmp/pre.html and all ten pinned notes confirmed present in the PRE page and in
  the POST page (Settlement clock SIM-internal; the commodity-trading-margin note; DESIGNED, NOT
  INSTRUMENTED; the Variable-DD honesty note; instrumented (DD1); the E5 carbon placeholder; "We
  will not fabricate one."; the no-wired-mechanism note; the ex-VAT Lifetime Revenue reconciliation
  note; the PDF''s "synthetic simulation, not a real bill"). The list is therefore non-vacuous by
  construction -- every string on it existed before the redesign.

  R15 BOTH WAYS, four mutations each killing a NAMED test and the clean case proven clean in the
  same test: (a) panel() called with no side / an unknown side, and a hand-built block reaching
  layoutPanels, all raise -- and a correctly-declared panel is accepted, so the control is not
  over-broad (test_mutation_a_panel_that_declares_no_side_is_refused_at_source); (b) stripping
  data-wall-side off a rendered panel makes the STRUCTURAL guard flag the content it was carrying,
  while the unmutated page passes (test_mutation_removing_a_panels_side_attribute_kills_the_guard);
  (c) the same mutation applied to the FILE -- a bare card appended to the op-state region -- is
  caught (test_mutation_an_undeclared_panel_in_the_file_kills_the_guard); (d) a churn probability
  moved into the customer-eye view is caught by the SAME checker the real test uses, and a
  satisfaction score placed under a company panel likewise
  (test_mutation_a_company_only_figure_moved_into_the_customer_eye_view_kills_a_named_test,
  test_mutation_a_sim_only_figure_moved_under_a_company_panel_is_caught). Anti-vacuity guards in
  both directions: test_the_named_figures_are_actually_present_somewhere fails if the page simply
  stopped rendering the company-only and SIM-only figures instead of re-homing them, and
  test_injected_content_is_non_empty fails if the placeholders render empty.

  ONE PRE-EXISTING TEST CHANGED, and why it is a tightening not a weakening.
  test_customers_door.py::test_money_kpis_carry_r14_clocks asserted billed/banked/settled all
  appeared in ONE element; the settled-clock figures (lifetime net, cost-to-serve) are now on the
  company side of the wall, so the assertion now checks billed+banked on the customer panel,
  settled on the company panel, AND that neither money panel carries no clock at all. R14 coverage
  goes up, not down. tests/tools/test_billing_and_payments_ledger.py''s function-presence list has
  renderCashflowShell -> cashflowPanels for the same reason (same sub-view, now side-declared).

  LEVEL 2, NOT 3, and the residuals are named rather than absorbed. (a) EXIT (4) IS HALF-LANDED:
  the name, title, entry copy and framing no longer claim a customer portal (title is "Two Sides of
  the Wall"; "Customer Portal", "Log in with your Poesys account number" and the Sign-in button are
  gone, pinned by test_the_page_no_longer_calls_itself_a_customer_portal), but the door still
  RESOLVES at /customers/. That half is split out as SITE3_wall_exhibit_url_rename rather than
  half-done here: /customers/ is a canonical door in site/sitemap.xml, so moving it also moves five
  door navs, three DAEMON-REGENERATED site/data feeds and ~10 hard-coded PORTAL paths, and those
  feeds were concurrently dirty from a regeneration this tick -- committing coordinated edits
  across them by pathspec is the "a repo-wide census is not decomposable by pathspec" failure this
  repo has already paid for. (b) R11 LIVE-PIXEL is genuinely unavailable for this change: the
  assertion has to be made against the DEPLOYED page, and the deployment lags this commit, so it
  belongs to the next tick with site/live_pixel_verify.py --door, not to a claim made here.
  (c) The atom''s level_target is 3 because a public wall exhibit''s trustworthiness is an
  Expert-Hour-verdict claim; expert_hour is not_attempted. Any one of those three would hold this
  at 2 on its own.

  EXIT (5) landed: the page names the real customer portal at company/portal/ twice -- in the
  exhibit header ("Poesys''s actual account-holder portal ... is a separate system at
  company/portal/") and in the entry copy -- pinned by
  test_the_relationship_to_the_real_portal_is_stated_on_the_page.'
