atom_id: SITE2_two_sided_wall_exhibit
simplifications:
- '2026-08-19 BUILD (worker tick, scheduled draw on SITE2 at loop_stage=build): the page has SEVEN top-level regions and exactly TWO of them were in any governor''s subject. Level STAYS 2.


  THE FINDING, and it is this atom''s own recurring class for the FOURTH time -- the first three each fixed one storey of it. 2026-08-12: the pinned op-state exhibit was outside the view selector. 2026-08-17: the case-study grid reached #app by a third path no wall control could see. 2026-08-18: #op-state''s child list was a boot-time SNAPSHOT, so a block appended later was in no governor''s subject whatever it declared. Each of those widened a governor''s subject to the CHILDREN OF ONE REGION. Nobody ever widened it to the REGIONS, and the set of governed regions was two getElementById literals -- the same hand-kept-subject shape as CONTENT_CLASSES, which the 08-18 tick had itself named structurally blind. applyWallViewToApp''s own comment says "the subject is now the DOCUMENT"; the document it means is #app.


  MEASURED FIRST, on the served page in a real chromium, before a line of repair existed -- and this ordering is the point, because the alternative is a section that reverses its own fix and calls that a defect. A block carrying "True satisfaction fell 12.2 percentage points" -- the exact string this page''s own WALL_VIEW_NOTE declares means the page is broken -- appended to document.body, then setWallView("customer") called through the page''s own entry point: SURVIVED in the customer''s view, WALL_VIOLATIONS empty, __subjectViolations() empty, 0 console errors, with 185 tests green. All seven regions carried neither a declaration nor a governor. That is R15''s FAIL-OPEN pattern in its purest form for the second time in this file: green because every region that happens to exist is innocent, which says nothing whatever about the next one.


  BUILT at the region list rather than in it. enforceDocumentRegions() requires every rendering top-level child of <body> to declare EITHER data-wall-chrome (carries no figure) OR data-wall-governed="<fn>"; anything else is recorded to WALL_VIOLATIONS with a console error and REMOVED, the same fail-closed rule the two inner governors already apply to their own children. Four design choices that are not the obvious ones. (1) NOT data-wall-side on the containers: #op-state and #app carry no figure themselves, and filtering the container by view would take its customer-observable children out with it -- so governance is a third term, not a side. (2) The declaration NAMES its governor and the governor must be a function that exists; a region asserting governance by a name nothing defines is ungoverned however loudly it says otherwise, and is treated exactly as one that declared nothing. Without that arm the new attribute is decoration. (3) NO CACHE, and it is a decision rather than an omission: opStateBlocks() caches because that governor removes AND restores, and taking the snapshot once is precisely what let a post-boot block escape it on 08-18. This governor never restores -- a region is chrome, or governed, or gone -- so a live read costs nothing and closes that hole by construction. (4) Deferred to DOMContentLoaded rather than called inline, because the page''s footer is emitted after the closing script tag: a guard running at script time would have reported the document clean while the last region of the page had never been in its subject. Its own boot order reproducing the fail-open it exists to remove.


  CAUGHT IN PASSING, by the mechanism''s own subject. The first draft of that comment contained the literal closing-script token. HTML ends the script element there, so the whole second inline script -- setWallView, both governors, renderHousehold, every function in it -- silently vanished from the page. The symptom in Playwright was "window.setWallView is not a function"; the symptom in the pytest suite would have been nothing at all, because the vm harnesses read the script blocks by regex and would have taken the truncated one. Recorded because it is the same class as everything above: a comment is not outside the document.


  THE CONTROL, and the probes are on the LIVE body rather than in the file. _subject_harness.mjs now models a real document.body whose children are read off the page''s own markup in document order -- a hand-written list here would be the harness''s opinion of what the page contains, and what the page contains IS the question. The four regions the rest of the harness already drives ARE those nodes, not copies, so a governor removing #app removes the same object renderHousehold() writes into. It refuses at <5 regions rather than running every probe against an empty body and reporting them all green. test_wall_exhibit.py section 22, 13 tests. TWO INDEPENDENCE POINTS worth naming: the governor''s non-rendering exemption set is REPORTED by the harness and checked against a set written in the test module, so the page cannot exempt a leaking region from its own control (a checker that reads its subject from the thing it checks is R15''s TAUTOLOGY); and test_every_declared_governor_is_a_function_that_exists reads the page SOURCE rather than asking the governor''s own runtime lookup.


  R15 FOUR MUTATIONS, each killing a NAMED test, plus the shipped page. (1) the body-level fail-open restored. (2) the record silenced -- FAIL-SILENT, and the leak test stays GREEN on it, which is exactly why the record needs an arm of its own. (3) any governor string accepted without checking it resolves -- the OVER-BROAD direction, and it must NOT also kill the plain leak check, or it would be proving arm (1) twice. (4) the call removed from setWallView -- the mechanism disconnected rather than broken, the shape in which a control is present in the file, reads correctly, and never runs. TWO NULL CONTROLS in the harness, not in prose: a chrome-declared region must SURVIVE (or the rule is "remove anything appended after boot" wearing a declaration rule''s clothes), and the page''s own seven regions must all still be in the document in all three views after the guard has removed three probes -- R11''s no-orphan-transition rule applied to a removal.


  THE SHIPPED-DEFECT PROOF, and it is built differently from the three above it on purpose. Section 22''s locator asks git WHICH COMMIT introduced the symbol (git log -S) and takes its parent, and it FAILS rather than skips when it cannot find one. That is because this tick''s suite run surfaced that sections 18, 19 and 21''s equivalents -- each walking a fixed HEAD~0..8 window -- have ALL THREE decayed into skips: the arm whose subject is the real defect has quietly stopped running on three sections while their mutation arms still report green. Staged as docs/staging/WORKER_FINDING_THREE_SHIPPED_DEFECT_PROOFS_HAVE_QUIETLY_STOPPED_RUNNING_2026-08-19.md with the reference implementation named, rather than fixed on sight: it is a defect in three other sections'' controls, and landing four sections'' R15 proofs in the same commit as the repair they are meant to be independent of is not an improvement.


  R11 ON A REAL CHROMIUM BOOT of the served page (python3 -m http.server over site/, headless chromium via the repo''s own playwright). 9 body children: 7 content regions -- site-nav, wall-head, door-wall-view, op-state, subject-boundary, app, footer -- plus the two inline scripts. All seven declared; op-state and app name their governors, the other five declare chrome with the reason written out. The bolted block is WITHHELD and RECORDED with its console error; a chrome-declared block SURVIVES; all seven regions survive in all three views; 0 page errors.


  EVIDENCE. site/customers/ 198 passed 3 skipped (was 185 passed 3 skipped). site/ 927 passed 10 skipped. tools/verify_printed_bill_render.mjs PASS -- 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures (exit (7), D36 intact). tests/tools/test_case_study_recommender.py, tests/controls/test_map_reconciliation.py, site/now/test_now_door.py and site/test_no_links_to_redirected_urls.py green (65 together).


  LEVEL STAYS 2, and this tick does not touch the reason. Exit criterion (1) asked for a mechanism that FAILS when a new panel is added without declaring a side; it now fails one storey higher than it did, which is a criterion strengthened rather than a criterion newly met. The L3 gate is unchanged and is a re-run cold-eyes walk that returns YES -- and this tick is not one, by the skill''s own wall: it was run by an instance that has read the whole build record, which is neither blindness nor independence. The atom''s two remaining adjudicated-real ledger rows (consumption seasonality, the one-period renewal lag) stay rehomed to the generator and sim lanes with their staged findings; neither is fixable inside this file_scope.'
- "2026-08-19 BUILD (worker tick, scheduled draw on SITE2 at loop_stage=build): FOUR shipped-defect proofs, four private locators, and all four were broken -- three had decayed into silent skips and the fourth was RED AT HEAD. Level STAYS 2.\n\n  THE DRAW. SITE2 was drawn at build with its open findings list holding one adjudicated FALSE POSITIVE, so there was no render defect on it. What WAS live was the finding this atom's own previous tick queued rather than fixed on sight, per SELF-INTERRUPT DISCIPLINE: WORKER_FINDING_THREE_SHIPPED_DEFECT_PROOFS_HAVE_QUIETLY_STOPPED_RUNNING_2026-08-19, inside file_scope and deliberately not landed in the same commit as the repair it is meant to be independent of. This tick is that separate commit.\n\n  THE FINDING REPRODUCED, first thing, before any repair existed. `pytest site/customers/ -q -rs`: three SKIPS naming themselves -- sections 18, 19 and 21's R15 direction-5 arms, the only arm in each section whose subject is the defect the page actually SHIPPED rather than a synthetic reversal of the repair. Each located its subject by walking a fixed ancestor window (HEAD then three or eight ancestors) for the absence of its own symbol. A window is wall-clock in disguise; this repo commits many times a day, so each proof had a shelf life and then converted to a skip. Mutation siblings stayed green, the suite stayed green, and the only symptom was a skip count nobody reads. R15's FAIL-SILENT pattern applied to the proofs themselves.\n\n  AND A FOURTH, WHICH THE FINDING DID NOT KNOW ABOUT AND WHICH IS WHY THIS IS A CLASS. The same run showed 1 FAILED: section 22's own locator -- written LAST TICK specifically to fix this, window-free, and named by the staged finding as THE REFERENCE IMPLEMENTATION. It was broken differently. It handed `git -C <site/customers>` the repo-root-relative pathspec `site/customers/index.html`; git resolves a pathspec relative to -C, so `git log -S` matched nothing, the locator returned None on every call, and the assert fired. It had been green for exactly ONE tick, on its uncommitted-case early return (HEAD did not yet carry its symbol, so HEAD *was* the pre-repair page), and it went red the moment its own repair was committed. So the finding's own recommended fix would have propagated a defect to three more sections. Recorded because the lesson is not \"windows decay\": it is that FOUR private answers to one question were wrong in three different ways.\n\n  BUILT AS A SOLE WRITER (R10: the class, not the instances), which is this module's own recurring repair shape -- four sentence sites deciding privately what to claim about one household's money (08-18), two governors deciding privately what a subject is (08-18), seven regions in nobody's subject (08-19). `_pre_repair_source(symbol, path)` is now the module's ONLY route to a pre-repair revision and its ONLY caller of git: ask git WHICH COMMIT introduced the symbol (`git log -S`, oldest hit) and take that commit's parent. No window, no pinned SHA, nothing to decay. Two properties beyond the finding's spec. (1) It runs git from the REPO ROOT, asked of `git rev-parse --show-toplevel` rather than assumed from the module's location -- the pathspec bug above is exactly what happens when a git invocation and its path argument disagree about their origin. (2) A POST-CONDITION: it refuses to return a source that still contains the symbol, so it can never hand a proof the repaired page to test against. All four call sites now ASSERT rather than skip -- \"the proof did not run\" and \"the proof passed\" must not look the same to a reader of the suite.\n\n  PROVEN ON BOTH BRANCHES, which is precisely what section 22 never was. Its git-log branch was exercised against ALREADY-COMMITTED symbols (`_pre_governor_index`, `_op_state_probes` on the test module's own path): both resolve, both return a source with the symbol absent. Section 22's version passed only ever on the uncommitted branch, and that is why its defect survived a full tick of green.\n\n  THE CONTROL, section 23, four arms, and its subject is the population of proofs rather than any one of them. (1) No pre-repair revision may be located by a fixed ancestor window. (2) No shipped-defect proof may call pytest.skip. (3) SET EQUALITY, both directions, between the shipped-defect proofs and the callers of the sole locator -- a proof may not locate its subject privately, and a non-proof may not call the locator. (4) Nothing in the module may shell git except the two named writers. Arm 4 is the one that does not depend on a naming convention at all: a fifth section could satisfy 1-3 and still shell git for a revision under some other name, and arm 4 fires on the subprocess call itself. ANTI-VACUITY floor on the population (>=4), because every arm is trivially green on an empty subject.\n\n  TWO DESIGN CHOICES THAT ARE NOT THE OBVIOUS ONES. (a) Arm 1's subject is a REV STRING READ OFF THE AST, not the file's text. The first draft grepped the source and fired on this section's own header -- the prose that has to name the defect it repaired. A control that forbids describing its own subject is not a control, it is a gag; and the module could never have been green. Both decayed shapes are still caught: the tuple form as a constant, the interpolated form via the constant half of its f-string. The LIMIT is stated in the code rather than glossed -- a window assembled at runtime would slip arm 1, and arm 4 is the named backstop, which is why the two are proven separately. (b) Arm 3 carries an EXEMPTION (the test whose subject IS the locator, and which therefore calls it without being a proof), so the exemption got its own arm: an exempt name may not look like a shipped-defect proof, and must actually exist in the module, or the way to defeat the sole-writer rule is to add yourself to the exemption list and a rename leaves a hole nothing watches.\n\n  R15 FIVE MUTATIONS, each killing a NAMED test, with the DECOYS WRITTEN BY THE TEST rather than borrowed from the module under test -- a decoy lifted from the real file carries every other property of it, so the arm that fires may not be the arm being exercised. (1) the window restored. (2) a proof that skips -- FAIL-SILENT, and arm 1 stays GREEN on it, asserted in the test, because proving one arm twice is not proving two arms. (3) a proof locating its subject privately. (4) a stray git call under a name no convention covers -- the OVER-BROAD direction, and arms 1-3 are asserted green on it. (5) the population emptied -- FAIL-OPEN, the direction that makes every other arm meaningless, and it must REFUSE rather than pass. NULL CONTROL: a clean decoy must come back clean on all four arms, or these checkers are `assert False` wearing four different messages.\n\n  THE SHIPPED-DEFECT PROOF FOR THIS SECTION, pointed at the module's own source via the same sole locator (`_pre_repair_source(_SOLE_LOCATOR, MODULE_PATH)`) -- this section is not exempt from the mechanism it enforces. All four arms are REQUIRED to fire on the module as it shipped, and all four do, naming the real functions: the window constants; the three skipping proofs; the four proofs locating privately; and `_pre_fix_index`, `_pre_governor_index`, `_pre_region_guard_index`, `_pre_standing_index` shelling git directly.\n\n  THE FINDING'S ITEM 2 ANSWERED, AND IT IS A NEGATIVE RESULT. It asked, `inferred`, whether the window pattern appears elsewhere in the repo. Swept `HEAD~` across every .py in tests/, site/, tools/ and background/: ZERO hits outside this module. The pattern was invented here and stayed here, so no other lane inherits the repair. Recorded as measured rather than left as an open worry.\n\n  EVIDENCE. site/customers/ 206 passed, 0 skipped (was 197 passed, 3 skipped, 1 FAILED -- the three dead proofs now RUN and PASS and section 22's red is gone). site/ 946 passed 7 skipped (was 927 passed 10 skipped); the 7 remaining skips are other doors' table/evidence fixtures, none of them a defect proof. tools/verify_printed_bill_render.mjs PASS -- 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures (exit (7), D36 intact). tests/tools/test_case_study_recommender.py + tests/controls/test_map_reconciliation.py 41 passed. No index.html change this tick: the repair is entirely in the control.\n\n  R11 LIVE, DISCHARGING THE DEBT THIS RECORD HAS CARRIED FOR THREE TICKS. The two prior entries record R11 as PENDING for 1ed5b7123 (the arrears-counters class fix) because the deploy had not run and the live page was byte-identical to the pre-fix build. It has now propagated: https://poesys.net/customers/ returns 200 at 180,465 bytes (was 142,202) and carries __householdCollections x4, reconcileCollections x2, enforceDocumentRegions x5, recordRegionViolation x3, __accountStanding x9 -- so a275425f1's region governor is live too. The LIVE-SERVED index.html was then driven through _render_harness.mjs against the LIVE-SERVED https://poesys.net/data/company.json + /data/customers/C1.json + C1g.json, and all four assertions the prior entry named are met ON THE DEPLOYED PIXEL: (a) \"Payments missed 2\" with \"2 standard-credit payments not received\"; (b) \"Pays by direct debit + standard credit\" with the per-leg split \"electricity: direct debit - gas: standard credit\"; (c) \"Arrears - 2 cases across this household's 2 fuel accounts\", gas leg GBP43.66 (opened 2016-11-15) and GBP26.84 (opened 2018-09-15), electricity leg \"none\"; (d) NO clean-payment claim anywhere in those panels. BOTH DIRECTIONS, as that entry required: the same live page driven against live C3/C3g (clean on both legs) renders \"No arrears case on any of this household's 2 fuel accounts (electricity + gas) - clean payment history\" and \"Payments missed 0 / no missed payment on any leg\" -- so (d) is not passing because the words were deleted. Also visible live and unasked-for: the money panel renders \"Balance -GBP24.37 / at closure 2021-12-30 - in credit\", the 08-18 standing fix on the deployed surface.\n\n  LEVEL STAYS 2, and this tick does not touch the reason. It repaired a control, not the page: not one of the atom's eight exit criteria is moved by it, and the L3 gate is unchanged -- a re-run cold-eyes walk that returns YES. This tick is not one, by the skill's own wall: it was run by an instance that has read the whole build record, which is neither blindness nor independence. What it does change is that the evidence behind criterion (8) is real again: for an unknown number of ticks this atom's R15 shipped-defect arms were reporting green without executing.\n\n  NOT DONE, stated rather than left as a silent gap. The MAP IS NOT EDITED, so simplifications_count still reads 15 while this is the sixteenth pass. The map carries another lane's COMPLETE staged atomic write (a W2_11/D5 coupling atom's count 45->46 plus its staged store file), and moving this atom's count in that same file would either strand or hijack it -- precedents 33c456c7e and 1aa4a3d7a, same draw shape, same call. A reader reconciling the count against the store finds the reason here rather than a miscount. Arm 1's runtime-assembly limit is real and unclosed by arm 1 (arm 4 is the backstop, not a proof it cannot happen). The atom's two remaining adjudicated-real ledger rows (consumption seasonality, the one-period renewal lag) stay rehomed to the sim and generator lanes."
- '2026-08-19 BUILD (worker tick, scheduled draw on SITE2 at loop_stage=build): the exhibit told every visitor that an account it will open -- and will CYCLE THEM INTO -- does not exist. Level STAYS 2.


  THE FINDING, measured on the LIVE surface before any repair existed. `curl https://poesys.net/customers/` serves a landing card whose only answer to "which accounts can I open?" is a list typed into the page: "Electricity: C1-C9, C_IC1-C_IC4 / Gas: C1g-C4g, C_IC3g" -- EIGHTEEN accounts. The roster the SAME page fetches for its own prev/next arrows, served at https://poesys.net/data/customers.json, carries NINETEEN. The nineteenth is SYN-2021-001: served at /data/customers/SYN-2021-001.json (HTTP 200, 87,449 bytes), present in /data/customers/_index.json, loadable by URL, and exactly one press of the arrow away from C_IC4. `git log -S` dates both sides rather than guessing: the typed list was written 443d00cc2 (2026-06-30, when the roster was eighteen) and SYN-2021-001 entered site/data/customers.json at 263dcf1b6 (2026-08-13). So the served exhibit has been wrong for six days.


  WHY NOTHING COULD FAIL ON IT, which is the reusable half: the claim had no subject outside itself. No test in site/customers/ mentioned the hint, and none could usefully -- a test asserting the literal would have pinned the defect rather than caught it. The page wrote down a population that an artefact it already fetches publishes.


  THE CLASS, and it is this module''s own recurring shape for the FIFTH time: a private answer to a question an artefact already answers. Four sentence sites deciding privately what to claim about one household''s money (08-18); two governors deciding privately what a subject is (08-18); seven top-level regions in nobody''s subject (08-19); four proofs privately locating a pre-repair revision (08-19); and now the page''s own account population. Repaired the same way each time -- a SOLE SOURCE, not an edited instance.


  BUILT. `fetchCustomerGroups()` already fetched the roster for cycling and threw the per-leg account ids away; it now keeps `elec`/`gas` (`loginId`/`group`, which cycleCustomer steers by, are untouched), and `rosterHintHtml()` renders the landing card''s list from that same fetch. The cycler and the card cannot disagree by construction. There is no literal left to update -- and updating one would not have been a repair, only a reset of the clock on the next drift.


  FAIL-CLOSED, which is the arm that matters most here and the one a "fix the list" repair would never have produced: an unreadable or empty roster renders a REFUSAL ("The published account roster could not be read, so this page will not list the accounts -- it would only be guessing"), never a fallback literal. A fallback is the same defect wearing a contingency label, sitting in the one state nobody looks at. Its terminal states are both tested, so the pending text has a tested release (R11, no orphan transitions).


  THE CONTROL, section 24, four arms, each a function so a mutant page goes through the SAME checker. (1) SET EQUALITY, both directions, between the ids the card NAMES and the ids the roster publishes -- omission and invention. Parsed off the two labelled lines rather than by an id-shaped regex, deliberately: a shape pattern has to be taught what an account id looks like, and SYN-2021-001, the account this section exists because of, does not look like the others. (2) INDEPENDENCE: add an account to the roster the harness serves and the card must move with it -- the arm the shipped page would have passed on equality alone for exactly as long as the roster stood still, which is what it did for six days. (3) FAIL-CLOSED on an unreadable roster. (4) The two published populations agree: /data/customers.json and /data/customers/_index.json must name one population, because the card can only be as honest as the artefact it reads -- measured, 19 = 19 today. ANTI-VACUITY floor (>=10 accounts) on the roster, since every arm is trivially green on an empty one.


  R15 FIVE MUTATIONS, each killing a NAMED arm, with the OTHER arms asserted GREEN on the same mutant -- proving one arm twice is not proving two arms. (1) the card drops an account (the shipped defect) -- equality fires, fail-closed stays green. (2) the card invents one -- the opposite direction. (3) a literal fallback on an unreadable roster -- FAIL-OPEN, and the equality arm is asserted GREEN on it, which is exactly why fail-closed has to be a separate arm. (4) a PINNED list built from today''s real rendered card -- R15''s TAUTOLOGY pattern: it satisfies the equality arm perfectly, asserted, and only the independence arm kills it. (5) the roster emptied -- the floor must REFUSE rather than pass. NULL CONTROL: the live page and the live roster pass all four.


  THE SHIPPED-DEFECT PROOF, through section 23''s sole locator (`_pre_repair_source("rosterHintHtml")`) -- this section invents no locator of its own, and section 23''s four arms hold with it added (set equality between the shipped-defect proofs and the locator''s callers now spans five). Its subject is chosen rather than assumed: the typed list covered C1-C9 as a RANGE, so a substring census over it would report most accounts "missing" and prove nothing. SYN-2021-001 is the one account no range in that list reaches -- it is the account that arrived after the list was written -- so the proof is that the shipped document does not contain it anywhere while the roster it is served alongside does, plus a positive check that the located revision really does render the typed list (or the subject is the wrong page).


  EVIDENCE. site/customers/ 228 passed, 0 skipped (was 217/0); site/ 957 passed, 7 skipped (was 946/7 -- the same seven other-door fixtures, none a defect proof). tools/verify_printed_bill_render.mjs PASS, 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures -- D36 intact, exit criterion (7). tests/tools/test_case_study_recommender.py + tests/controls/test_map_reconciliation.py 41 passed. `python3 -m tools.epistemic_verifier` PASS.


  LEVEL STAYS 2, and this tick does not touch the reason. None of the atom''s eight exit criteria moves: the L3 gate is a re-run cold-eyes walk that returns YES, and this tick is not one -- the skill''s own wall is that the walk needs an instance that has NOT read the build record, and this one has. What the tick does change is that the page''s account population is no longer a claim with no subject.


  NOT DONE, stated rather than left as a gap. R11 IS PENDING for this change: the repair is in the working tree and on HEAD after this commit, but https://poesys.net/customers/ still serves the typed list until the deploy propagates. The live check to run when it does, and the exact strings: the served page must carry `id="roster-hint"`, must name SYN-2021-001 in the landing card, and must NOT carry "Electricity: C1-C9". The pre-change live measurement above is already recorded, so the after-side is what is owed. Also unclosed: the pending text ("Reading the published account roster...") is a real exposure if the fetch neither resolves nor rejects -- the failure mode this project has met before as a panel that served "Loading" for eight days -- and no arm covers a fetch that hangs, only one that fails. Recorded as a known limit, not as covered.'
map_notes:
  name: 'MINTED FROM Part 2 of DIRECTOR_RULING_THE_PORTAL_IS_A_WALL_EXHIBIT_2026-08-12 (advisor-staged, director-ruled in session 2026-08-12) -- the same missing-''WORK THIS CREATES''-block defect as D36 applies; derived from Part 2''s own Requirements/Non-negotiables, author asked to supply the formal block rather than this being silently absorbed. site/customers/index.html titles itself ''Customer Portal'' and invites login ''to view your household'' while rendering three layers at once: customer-observable (bills, usage, payments, meter details), company-only (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit), and SIM-only (satisfaction score, causal reaction chain, wholesale trading margin -- already noted ''SIM-internal'' on-page). No real supplier shows a customer their churn probability; nothing outside the simulation can see a satisfaction score at all. Director ruling: keep all three layers, rename and re-home the page as a deliberate side-by-side comparison of the two sides of the epistemic wall -- the layering becomes the exhibit, not a leak to apologise for. EXIT: (1) every panel on the page structurally declares which side it is on (customer-observable / company-only / SIM-only) via a mechanism that FAILS when a new panel is added without declaring a side -- the ruling''s own non-negotiable is ''a control that cannot fail is not a control'', and the existing honesty-wall notes are exactly the prose version of this gap; (2) the customer-eye view renders as its own coherent subset -- what a real account holder would see, isolated, not assembled by a visitor reading labels across the whole page; (3) no SIM-only figure (satisfaction score, causal reaction chain, wholesale trading margin) renders under a company-attributed panel, and no company-only figure (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit) renders under the customer-eye subset -- tested against these named instances specifically; (4) name, title, entry copy and URL stop claiming to be a customer''s portal, and the old URL redirects per SITE_CONSTITUTION.md''s own pixel/redirect rule (site/_redirects, site/test_no_links_to_redirected_urls.py), fetched live; (5) the relationship to the real customer portal at company/portal/ is stated on the page, not left to be inferred; (6) the existing honesty-wall notes (incl. the SIM-internal trading-margin note) are preserved, diffed against the pre-change page, not merely re-typed; (7) D36 (Part 1''s bill-footing fix) still passes its own exit tests after this atom''s redesign touches the same file -- the ruling''s own ''Part 1 lands intact through this work''; (8) R15 both ways -- a mutation removing a panel''s side-attribute, and one moving a company-only figure into the customer-eye subset, each kill a NAMED test. No new data plumbing -- everything named is already in the per-customer JSON.'
