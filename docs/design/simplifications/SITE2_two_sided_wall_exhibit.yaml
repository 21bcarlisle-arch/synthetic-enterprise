atom_id: SITE2_two_sided_wall_exhibit
simplifications:
- '2026-08-18 BUILD (worker tick, SITE2 draw): a closed account cannot both have settled to zero and be in credit. coldwalk:site2_closed_account_settled_to_zero_and_in_credit CLOSED as a CLASS, with a sole writer of every standing claim on the page.



  THE FINDING, all three blind personas of the 2026-08-17 re-run walk, and it survived the 2026-08-15 present-tense repair. C1 closed 2021-12-30; the page published, at once: ''Account closed 2021-12-30 -- final bill C1-INV72. Account settled to zero.'' (Billing), ''You are currently GBP24.37 in credit -- that is your money, held by us'' (overview), and ''the household combined (both fuels) LIVE ledger position'' (Risk), under a header stamped ''data 2026-08-17''. The arithmetic was never wrong -- 6,560.17 - 6,584.54 = -24.37, the credit entirely on the gas leg -- so this was filed as a STATEMENT contradiction, and the reading a blind COO reached for first is a supplier holding a departed customer''s money for four and a half years.



  IT WAS TWO DEFECTS, NOT ONE, AND ONLY ONE OF THEM WAS ABOUT FRAMING. (1) TENSE: three of the four sentence sites were hard-wired present tense on a household the page''s own timeline records as gone. fwdLabel() had frozen every forward-looking LABEL since 2026-08-12; the MONEY sentences were never brought under it. (2) A MISSING BRANCH, and this one is a literal falsehood: closedAccountNotice() tested `current_balance_gbp > 0.005` and otherwise printed ''Account settled to zero'', so a CREDIT balance -- a NEGATIVE number -- fell through to the zero branch. On C1''s GAS tab that claim sat directly over a ledger reading -24.37. Ninety-seven green tests could not see it: EVERY fixture in the module drove the ELECTRICITY leg, whose 0.00 made the claim true. The harness now renders the billing tab PER FUEL LEG (billsByFuel), which is the fixture gap and not a new assertion.



  ROOT CAUSE, which is why this is a class. FOUR sentence sites each decided, privately, what to claim about the same money: the op-state Balance tile''s caption, the op-state Direct-Debit paragraph, riskPanels()''s ''Outstanding Balance / live ledger position'' hint, and closedAccountNotice()''s settlement clause. Four private decisions is how one page comes to publish a settlement claim and a live-credit claim about one household.



  THE MECHANISM. window.__accountStanding is the SOLE writer: it decides state (credit/outstanding/square/unknown), tense (closed or live) and words from one input, and all four sites ask it. It spans BOTH inline scripts, so _wall_harness.mjs and _landing_harness.mjs now run both scripts as the browser does -- a harness that ran only the drill-down would be asserting against a page shape no reader is served. The drill-down''s standing() doorway THROWS rather than keeping a local fallback: a second implementation is exactly how the two claims drifted apart, and an unavailable control is a FAILED control. It FAILS CLOSED on a balance it cannot read -- ''not published'', never ''settled''. window.__householdClosedOn mirrors the drill-down''s householdClosureDate() off the legs the boot path already fetches, so no new plumbing was added (this atom''s constraint) and the two regions cannot disagree about whether the household has gone. The 2026-08-12 note recording that the op-state exhibit ''cannot know the account closed without new plumbing'' is now STALE: the dual-fuel money fix made the legs, and therefore the churned timeline event, available to that region.



  THE LEG-SCOPE HALF, which the finding did not name and which is the other reason the page read as contradicting itself. ''Account settled to zero'' was TRUE of C1''s electricity ledger. It was still read as the HOUSEHOLD''s, because nothing on the notice said which of the two accounts it was about. A leg-scoped notice on a multi-leg household now names its leg, the same discipline the money captions have carried since coldwalk:site2_dual_fuel_household_shows_electricity_only_money.



  THE FACT THE PAGE DOES NOT CARRY, stated rather than implied. Nothing published here records whether the closing credit was refunded. The finding''s own note said its resolution needs that fact; inventing it in either direction is the inference-printed-as-fact this exhibit exists to make visible. So the page states the closing position AND states that the refund is not in the record, and test_a_closed_household_in_credit_says_the_refund_is_not_in_the_record REQUIRES that sentence -- silence cannot come back.



  R15 FIVE WAYS, each killing a NAMED test. (1) the credit branch removed -> test_no_settlement_claim_is_published_over_a_non_zero_ledger. (2) the writer made closure-blind -> test_a_closed_household_makes_no_present_tense_claim_about_its_money. (3) the writer made ALWAYS-closed, the tautology that satisfies (2) on any page at all while telling every live account holder they had left -> test_a_live_household_still_states_its_position_in_the_present_tense. (4) the writer silenced, the fail-open, since no present-tense phrase is present if no sentence is written -> the refund and live-household checks. (5) THE PAGE EXACTLY AS IT SHIPPED (git show HEAD), where all three checkers fire -- the only direction whose subject is the real defect rather than a synthetic reversal of the repair.



  CAUGHT IN PASSING, and it is a control on the controls. This section''s first draft reused section 18''s test name. Python does not collide -- it REBINDS -- so section 18''s shipped-defect proof stopped being collected at all, and the only visible symptom was the skip count dropping from 1 to 0 with no failure to show for it. A silently deleted R15 proof is the FAIL-SILENT pattern applied to the proofs themselves, in a 3,200-line module written across nineteen ticks. test_no_definition_in_this_module_shadows_another now fails on any duplicate top-level name, helpers included -- a redefined _mutate retroactively changes what four earlier mutation tests actually run, and that had happened too.



  R11 ON A REAL CHROMIUM BOOT of the served page, 0 console errors, 0 page errors. Closed household C1: the elec leg renders ''This electricity account closed 2021-12-30 - final bill C1-INV72. Account settled to zero. This is the electricity leg''s own ledger; the household''s combined position is on the Risk tab.''; the GAS leg renders ''This gas account closed 2021-12-30 - final bill C1g-INV144. Closing balance: GBP24.37 in credit - the customer''s money, recorded here as held by us. Nothing published on this page records whether that credit was refunded...''; the Risk tab renders ''BALANCE AT CLOSURE -GBP24 / at closure 2021-12-30 - in credit'' with ''live ledger position'' GONE; the landing exhibit renders ''This account closed on 2021-12-30 holding GBP24.37 of the customer''s money''. ANTI-TAUTOLOGY on the same live surface: C2 still renders ''OUTSTANDING BALANCE GBP248 / outstanding / live ledger position'' and carries no ''at closure'' anywhere.



  EVIDENCE. site/ 832 passed 8 skipped before, 845 passed 8 skipped after -- 12 new tests plus the shadowing census. tests/controls/test_map_reconciliation.py 13 passed, so the ledger''s `fixed` state and the map''s move out of expert_hour.findings reconcile.



  LEVEL STAYS 2, and the reason does not weaken with the count. A walk that returned NO is discharged by a walk that returns YES, never by this lane fixing the things that walk named. ONE of the re-run walk''s findings is left and it is a LAYOUT decision rather than a data or wording repair: coldwalk:site2_c1_pinned_exhibit_reads_as_the_open_households -- the static #op-state exhibit is pinned to C1 and re-renders ~2,000px above EVERY household''s drill-down with nothing separating the two, and 3 of 3 blind readers attributed C1''s GBP6,560.17 and ''two person / urban flat'' to the SME and I&C accounts open below it. Inside file_scope, unbuilt. The gate for L3 is unchanged: a fresh cold-eyes re-run against the page as it now stands, whose independence is still false (same model family as the builder).'
- '2026-08-18 BUILD (worker tick, scheduled draw on SITE2 at loop_stage=build). No level move. The atom''s map budget was rehomed: 12,221 B -> 2,641 B, from 67 B of headroom to 9,647 B.


  WHAT THE DRAW FOUND. SITE2 was drawn at build with its open findings list holding exactly one entry, and that entry adjudicated a FALSE POSITIVE -- so there was no buildable render defect on it, and the stated L3 gate (a re-run cold-eyes walk) is its own draw, not this one. What WAS live and blocking was the finding this atom''s own previous tick queued rather than fixed on sight, per SELF-INTERRUPT DISCIPLINE: WORKER_FINDING_AN_ATOMS_MAP_BUDGET_CAN_BE_SPENT_BY_THE_TICK_THAT_FIXES_ITS_LAST_FINDING_2026-08-18. Closing a finding is itself a map append (a key changes list, and each dated list costs a header), so SITE2 had spent its narrative allowance and the NEXT Hour''s own record could not have been written. The designed repair already existed and named its own trigger -- generate_proof_data._expert_hour_findings says the migration is partial by design ''as the cap names each one'' -- and the cap had named SITE2.


  BUILT, as a MOVE and not an edit. expert_hour''s dated fixed_* lists, findings_rehomed and the open findings list now live in this store file under two tenants: `expert_hour_findings` (the OPEN list -- the field with live consumers) and `expert_hour_history_findings` (the dispositioned record). The structured members every consumer reads (status/last/verdict/independence/ledger) stay inline, per simplifications_store''s own stated rule. Content preservation is PROVEN, not asserted: the migration ran a line census over the moved region and refused unless every non-blank line landed in exactly one tenant. It refused TWICE, and both refusals were real. First, history entries were being joined without a separator, fusing the last line of each block onto the first line of the next -- 10 lines lost. Second, and the one worth recording: the open key carries the trailing YAML comment `# adjudicated REFUTED`, which is load-bearing disclosure in this control''s own words (''the map annotates those in place, which is a disclosure, not a divergence'') and which a dumped store value cannot carry. The findings block is therefore preserved VERBATIM in the history tenant while the live field carries the parsed key -- the annotation survives the move.


  THE SUBJECT-FOLLOWS-THE-REHOME DEFECT, which is the half that mattered. tests/controls/test_map_reconciliation.py read `expert_hour.findings` INLINE ONLY. Measured before touching anything, across all 314 atoms: total findings resolving into the adjudication ledger = 1, and it was SITE2''s. So this atom''s single key WAS the entire population of the map-vs-ledger comparison, and a rehome with the reader left inline would have taken the whole control''s subject with it. That is the FAIL-SILENT pattern the queued finding named as check 2. It did NOT fail silently -- test_the_findings_ledger_comparison_is_not_vacuous fired the moment the keys moved, which is the R15 anti-blindness guard doing exactly what its docstring predicted (''an atom record rehomed out of the map would empty the population silently''). Recorded here because a control whose own predicted failure mode is later reproduced by a real event is evidence the control is real.


  THE REPAIR. `_open_findings` is the new seam: inline wins, then the store -- one rule across every reader of a partially-migrated field (hydrate, atom_name, _expert_hour_findings). It reads ONLY the open tenant; folding the history tenant in would manufacture one contradiction per correctly-recorded fixed finding and turn a fail-closed control into noise.


  R15 BOTH WAYS, 4 new tests (17 passed, was 10). FIRES: a store-resident open finding the ledger calls fixed is still caught, same verdict as the inline case -- so rehoming cannot launder an open-vs-fixed divergence. SILENT: the history tenant is not read as open work. INLINE WINS: a stale store copy cannot hide a divergence sitting inline. ANTI-VACUITY re-anchored to the live tree and now naming the reader a future rehome must follow.


  NULL CONTROL, as the finding specified it. Bytes must DROP and the Proof door''s finding history must be UNCHANGED. Both hold: 12,221 -> 2,641 B, and generate_proof_data._verification_stack serialises byte-identical before and after (captured before the first edit, diffed after). _expert_hour_findings returns the same single key for SITE2, now via the store rather than inline. No roll: the append did not chunk into a second file. GREEN: tests/controls 182 passed 1 xfailed; tests/design map/store/maturity 101 passed; store + declaration contracts 52 passed.


  NOT CLAIMED. This is bookkeeping capacity. It says nothing about the atom''s eight exit criteria, and the Expert-Hour verdict is still NO -- a verdict is a property of a walk, not of a list going empty. LEVEL STAYS 2.'
- '2026-08-18 BUILD (worker tick, SITE2 draw): the page has TWO membership governors and only one of them was fail-closed. Level STAYS 2.


  THE FINDING, and it is a clause this atom''s own record already contained. The 2026-08-17 re-run walk''s BLOCKING row says, in its own evidence: "Related fail-open in the same function: ''if(!side||wallViewShows(side))'' showed any UNDECLARED block in every view." That tick built applyWallViewToApp() -- the #app document, fail-closed, undeclared block REMOVED and recorded -- and marked the row `fixed`. Its sibling applyWallViewToOpState(), which governs the pinned #op-state exhibit, kept the fail-open line verbatim. #op-state is not a child of #app, so no part of the 08-17 class guard could reach it: one region of the page enforced "declare a side or declare yourself chrome" and the other showed anything undeclared, in every view, the customer''s included -- under that view''s own sentence "if a company estimate or simulation ground truth appears, the page is broken".


  WHY 176 TESTS WERE GREEN, which is the reusable half. Two blocks were living on that branch -- the region heading and the drill-down link -- and both are genuinely chrome, so nothing had leaked YET. That is R15''s FAIL-OPEN pattern in its purest form: a control that passes because its subject happens to be innocent, and which therefore says nothing about the next panel. The existing static control could not see it either, and the reason is structural rather than accidental: test_the_op_state_region_declares_a_side_for_every_block scans the SOURCE FILE and its subject is CONTENT_CLASSES, a hand-kept set of six class names. A block using none of the six is invisible to it; a block that never appears in the file at all cannot be in its subject by construction.


  AND IT WAS TWO DEFECTS, THE SECOND ONE WORSE. Driving a block that CORRECTLY declared data-wall-side="company" into the live region on the shipped page put it in the CUSTOMER''s view as well. Root cause read in code, not inferred: opStateBlocks() cached #op-state''s children on its first call and returned the cache forever after, so a block appended after boot was in no governor''s subject at all, whatever it declared. The cache exists for a real reason -- this governor REMOVES children, so a live read after the first pass loses everything the pass hid -- but taken once it is a snapshot, and a snapshot is the same "a new layer above a control does not inherit its subject" class this page has now paid for three times (2026-08-12 the op-state exhibit, 2026-08-17 the case-study grid, here the region''s own child list).


  BUILT, at the governor rather than in the vocabulary. (1) applyWallViewToOpState() now requires data-wall-side or data-wall-chrome and REMOVES an undeclared block from the document, pushing it to WALL_VIOLATIONS with a console error -- removed rather than thrown, because the failure being guarded is a leak and taking the page down would hide the customer''s own view with it. (2) recordOpStateViolation() dedupes on the block''s identity, because this governor re-runs on every tab switch and every view change and an undeduped push grows without bound until the record stops being readable. (3) opStateBlocks() is a UNION, not a snapshot: it still holds document order for the restore, and any live child not already in it joins the subject on the next pass. (4) The two chrome blocks now SAY they are chrome. The governor''s subject is every child of the region with no vocabulary to keep, which is why the fix belongs here and not in CONTENT_CLASSES.


  THE CONTROL, and the probes are on the LIVE region rather than in the file. site/customers/_subject_harness.mjs grew three probes that bolt a block onto the rendered #op-state -- the path a new panel actually arrives by -- and each takes its own block back out of the page''s subject list so the next probe is not measuring the last one''s residue. test_wall_exhibit.py section 21, 10 tests. R15 FOUR mutations: the fail-open branch restored; the cached snapshot restored; the record silenced (FAIL-SILENT, which the leak test stays green on, so it needs its own); and chrome treated as a declared side (the OVER-BROAD direction, which proves the two arms are different arms). TWO NULL CONTROLS, in the harness not in prose: a chrome-declared block must SURVIVE, or the mechanism is "hide anything appended after boot" wearing a declaration rule''s clothes; and a company-declared block must be governed by the VIEW -- behind the wall yes, customer''s side no -- or it is "withhold everything appended late", which would satisfy the finding test for the wrong reason. ANTI-PIN: no figure, count or stamp from the run appears in the section; the sentinels are the harness''s own strings and the leak string is the one the page''s WALL_VIEW_NOTE itself declares broken.


  PROVEN ON THE PAGE AS IT SHIPPED, by a test that locates the pre-repair revision by the ABSENCE OF ITS OWN SYMBOL rather than by a pinned SHA -- so it keeps working once this change is itself committed, which a `HEAD:` literal would not. On that page: an undeclared block carrying "True satisfaction fell 12.2 percentage points" rendered in the customer view, nothing was recorded, and the company-declared block rendered in the customer view too. R11 on a real chromium boot of the built page over http: 9 / 5 / 6 children across both / customer / behind with the two chrome blocks declared, 0 console errors, 0 page errors, and a block appended by document.createElement in the live browser withheld and recorded with its console error.


  EVIDENCE. site/customers/ 186 passed, 2 skipped (was 176). tools/verify_printed_bill_render.mjs PASS -- 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures (exit (7), D36 intact). tests/tools/test_case_study_recommender.py, site/now/test_now_door.py, tests/controls/test_map_reconciliation.py and site/test_no_links_to_redirected_urls.py green (65 together). The 08-17 ledger row''s fix_evidence now carries the second half rather than a new finding key being minted, because no new walk found this -- the row''s own evidence named it and the repair stopped short.


  LEVEL STAYS 2. This tick discharged a clause of a walk that returned NO; the L3 gate is unchanged and is a re-run cold-eyes walk that returns YES. This tick is not one: it was run by an instance that has read the whole build record, and per the skill''s own wall that is neither blindness nor independence.'
- '2026-08-19 BUILD (worker tick, scheduled draw on SITE2 at loop_stage=build): the page has SEVEN top-level regions and exactly TWO of them were in any governor''s subject. Level STAYS 2.


  THE FINDING, and it is this atom''s own recurring class for the FOURTH time -- the first three each fixed one storey of it. 2026-08-12: the pinned op-state exhibit was outside the view selector. 2026-08-17: the case-study grid reached #app by a third path no wall control could see. 2026-08-18: #op-state''s child list was a boot-time SNAPSHOT, so a block appended later was in no governor''s subject whatever it declared. Each of those widened a governor''s subject to the CHILDREN OF ONE REGION. Nobody ever widened it to the REGIONS, and the set of governed regions was two getElementById literals -- the same hand-kept-subject shape as CONTENT_CLASSES, which the 08-18 tick had itself named structurally blind. applyWallViewToApp''s own comment says "the subject is now the DOCUMENT"; the document it means is #app.


  MEASURED FIRST, on the served page in a real chromium, before a line of repair existed -- and this ordering is the point, because the alternative is a section that reverses its own fix and calls that a defect. A block carrying "True satisfaction fell 12.2 percentage points" -- the exact string this page''s own WALL_VIEW_NOTE declares means the page is broken -- appended to document.body, then setWallView("customer") called through the page''s own entry point: SURVIVED in the customer''s view, WALL_VIOLATIONS empty, __subjectViolations() empty, 0 console errors, with 185 tests green. All seven regions carried neither a declaration nor a governor. That is R15''s FAIL-OPEN pattern in its purest form for the second time in this file: green because every region that happens to exist is innocent, which says nothing whatever about the next one.


  BUILT at the region list rather than in it. enforceDocumentRegions() requires every rendering top-level child of <body> to declare EITHER data-wall-chrome (carries no figure) OR data-wall-governed="<fn>"; anything else is recorded to WALL_VIOLATIONS with a console error and REMOVED, the same fail-closed rule the two inner governors already apply to their own children. Four design choices that are not the obvious ones. (1) NOT data-wall-side on the containers: #op-state and #app carry no figure themselves, and filtering the container by view would take its customer-observable children out with it -- so governance is a third term, not a side. (2) The declaration NAMES its governor and the governor must be a function that exists; a region asserting governance by a name nothing defines is ungoverned however loudly it says otherwise, and is treated exactly as one that declared nothing. Without that arm the new attribute is decoration. (3) NO CACHE, and it is a decision rather than an omission: opStateBlocks() caches because that governor removes AND restores, and taking the snapshot once is precisely what let a post-boot block escape it on 08-18. This governor never restores -- a region is chrome, or governed, or gone -- so a live read costs nothing and closes that hole by construction. (4) Deferred to DOMContentLoaded rather than called inline, because the page''s footer is emitted after the closing script tag: a guard running at script time would have reported the document clean while the last region of the page had never been in its subject. Its own boot order reproducing the fail-open it exists to remove.


  CAUGHT IN PASSING, by the mechanism''s own subject. The first draft of that comment contained the literal closing-script token. HTML ends the script element there, so the whole second inline script -- setWallView, both governors, renderHousehold, every function in it -- silently vanished from the page. The symptom in Playwright was "window.setWallView is not a function"; the symptom in the pytest suite would have been nothing at all, because the vm harnesses read the script blocks by regex and would have taken the truncated one. Recorded because it is the same class as everything above: a comment is not outside the document.


  THE CONTROL, and the probes are on the LIVE body rather than in the file. _subject_harness.mjs now models a real document.body whose children are read off the page''s own markup in document order -- a hand-written list here would be the harness''s opinion of what the page contains, and what the page contains IS the question. The four regions the rest of the harness already drives ARE those nodes, not copies, so a governor removing #app removes the same object renderHousehold() writes into. It refuses at <5 regions rather than running every probe against an empty body and reporting them all green. test_wall_exhibit.py section 22, 13 tests. TWO INDEPENDENCE POINTS worth naming: the governor''s non-rendering exemption set is REPORTED by the harness and checked against a set written in the test module, so the page cannot exempt a leaking region from its own control (a checker that reads its subject from the thing it checks is R15''s TAUTOLOGY); and test_every_declared_governor_is_a_function_that_exists reads the page SOURCE rather than asking the governor''s own runtime lookup.


  R15 FOUR MUTATIONS, each killing a NAMED test, plus the shipped page. (1) the body-level fail-open restored. (2) the record silenced -- FAIL-SILENT, and the leak test stays GREEN on it, which is exactly why the record needs an arm of its own. (3) any governor string accepted without checking it resolves -- the OVER-BROAD direction, and it must NOT also kill the plain leak check, or it would be proving arm (1) twice. (4) the call removed from setWallView -- the mechanism disconnected rather than broken, the shape in which a control is present in the file, reads correctly, and never runs. TWO NULL CONTROLS in the harness, not in prose: a chrome-declared region must SURVIVE (or the rule is "remove anything appended after boot" wearing a declaration rule''s clothes), and the page''s own seven regions must all still be in the document in all three views after the guard has removed three probes -- R11''s no-orphan-transition rule applied to a removal.


  THE SHIPPED-DEFECT PROOF, and it is built differently from the three above it on purpose. Section 22''s locator asks git WHICH COMMIT introduced the symbol (git log -S) and takes its parent, and it FAILS rather than skips when it cannot find one. That is because this tick''s suite run surfaced that sections 18, 19 and 21''s equivalents -- each walking a fixed HEAD~0..8 window -- have ALL THREE decayed into skips: the arm whose subject is the real defect has quietly stopped running on three sections while their mutation arms still report green. Staged as docs/staging/WORKER_FINDING_THREE_SHIPPED_DEFECT_PROOFS_HAVE_QUIETLY_STOPPED_RUNNING_2026-08-19.md with the reference implementation named, rather than fixed on sight: it is a defect in three other sections'' controls, and landing four sections'' R15 proofs in the same commit as the repair they are meant to be independent of is not an improvement.


  R11 ON A REAL CHROMIUM BOOT of the served page (python3 -m http.server over site/, headless chromium via the repo''s own playwright). 9 body children: 7 content regions -- site-nav, wall-head, door-wall-view, op-state, subject-boundary, app, footer -- plus the two inline scripts. All seven declared; op-state and app name their governors, the other five declare chrome with the reason written out. The bolted block is WITHHELD and RECORDED with its console error; a chrome-declared block SURVIVES; all seven regions survive in all three views; 0 page errors.


  EVIDENCE. site/customers/ 198 passed 3 skipped (was 185 passed 3 skipped). site/ 927 passed 10 skipped. tools/verify_printed_bill_render.mjs PASS -- 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures (exit (7), D36 intact). tests/tools/test_case_study_recommender.py, tests/controls/test_map_reconciliation.py, site/now/test_now_door.py and site/test_no_links_to_redirected_urls.py green (65 together).


  LEVEL STAYS 2, and this tick does not touch the reason. Exit criterion (1) asked for a mechanism that FAILS when a new panel is added without declaring a side; it now fails one storey higher than it did, which is a criterion strengthened rather than a criterion newly met. The L3 gate is unchanged and is a re-run cold-eyes walk that returns YES -- and this tick is not one, by the skill''s own wall: it was run by an instance that has read the whole build record, which is neither blindness nor independence. The atom''s two remaining adjudicated-real ledger rows (consumption seasonality, the one-period renewal lag) stay rehomed to the generator and sim lanes with their staged findings; neither is fixable inside this file_scope.'
map_notes:
  name: 'MINTED FROM Part 2 of DIRECTOR_RULING_THE_PORTAL_IS_A_WALL_EXHIBIT_2026-08-12 (advisor-staged, director-ruled in session 2026-08-12) -- the same missing-''WORK THIS CREATES''-block defect as D36 applies; derived from Part 2''s own Requirements/Non-negotiables, author asked to supply the formal block rather than this being silently absorbed. site/customers/index.html titles itself ''Customer Portal'' and invites login ''to view your household'' while rendering three layers at once: customer-observable (bills, usage, payments, meter details), company-only (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit), and SIM-only (satisfaction score, causal reaction chain, wholesale trading margin -- already noted ''SIM-internal'' on-page). No real supplier shows a customer their churn probability; nothing outside the simulation can see a satisfaction score at all. Director ruling: keep all three layers, rename and re-home the page as a deliberate side-by-side comparison of the two sides of the epistemic wall -- the layering becomes the exhibit, not a leak to apologise for. EXIT: (1) every panel on the page structurally declares which side it is on (customer-observable / company-only / SIM-only) via a mechanism that FAILS when a new panel is added without declaring a side -- the ruling''s own non-negotiable is ''a control that cannot fail is not a control'', and the existing honesty-wall notes are exactly the prose version of this gap; (2) the customer-eye view renders as its own coherent subset -- what a real account holder would see, isolated, not assembled by a visitor reading labels across the whole page; (3) no SIM-only figure (satisfaction score, causal reaction chain, wholesale trading margin) renders under a company-attributed panel, and no company-only figure (lifetime revenue/net, cost-to-serve, churn probability, CLV, pricing action, forecast profit) renders under the customer-eye subset -- tested against these named instances specifically; (4) name, title, entry copy and URL stop claiming to be a customer''s portal, and the old URL redirects per SITE_CONSTITUTION.md''s own pixel/redirect rule (site/_redirects, site/test_no_links_to_redirected_urls.py), fetched live; (5) the relationship to the real customer portal at company/portal/ is stated on the page, not left to be inferred; (6) the existing honesty-wall notes (incl. the SIM-internal trading-margin note) are preserved, diffed against the pre-change page, not merely re-typed; (7) D36 (Part 1''s bill-footing fix) still passes its own exit tests after this atom''s redesign touches the same file -- the ruling''s own ''Part 1 lands intact through this work''; (8) R15 both ways -- a mutation removing a panel''s side-attribute, and one moving a company-only figure into the customer-eye subset, each kill a NAMED test. No new data plumbing -- everything named is already in the per-customer JSON.'
