- '2026-08-17 HARDEN (worker tick): a level, a ratio and a difference stop being one quantity. coldwalk:site2_coo_2841_percent_error_arithmetic_doubt CLOSED as a CLASS -- and the adjudication that filed it as a false-positive-with-a-minor had undercounted on two axes, the THIRD undercount on this atom.


  WHAT THE ADJUDICATION HAD RIGHT, AND WHAT IT KEPT. The COO persona flagged the landing page''s ''2841% error at the 2018 renewal (sim 3% vs company 95%)'' as not tying, computing (95-3)/3 = 3067%. It does tie unrounded -- (95.0-3.23)/3.23 = 2841% -- so the arithmetic complaint was refuted, and the file recorded the persona''s SECOND point as a kept minor: a gap between two probabilities published as a ''2,841% relative error'' is innumerate framing on a public surface, where the honest statement is ''92 percentage points''. That minor sat unbuilt for five days. It was the real half.


  MEASURED BEFORE BUILT, AND THE FINDING''S OWN INSTANCE WAS ONE OF TWO. Enumerating every headline the generator publishes rather than fixing the one named: a SECOND live case had the MIRROR-IMAGE defect. ''True satisfaction fell 12% (2019 to 2024)'' renders sm[''drop''], a DIFFERENCE of two 0-1 satisfaction scores (0.6382 -> 0.5166 = 12.2 percentage points), with a bare % after the word ''fell'' -- which states a relative fall, and the relative fall was 19%. So one headline published a ratio as though it were a gap and the other published a gap as though it were a ratio. Both were live: fetched from https://poesys.net/data/case_studies.json before the change (R11).


  AND THE RANKING, NOT ONLY THE FRAMING -- the half neither the walk nor the adjudication saw. The ''Largest company-vs-SIM churn divergence'' slot RANKED by abs(churn_estimate_error_pct), a ratio whose denominator is the sim probability, so it preferred whichever renewal had the SMALLEST denominator -- confident-when-nothing-happened -- over the largest actual divergence. Over the live book: 6 of 13 households'' within-household pick MOVES when ranked by percentage points (C1, C2, C4, C7, C8, C9). C9''s worst-by-ratio renewal is a 5.0-point gap when its true worst is 12.2; C7''s is 13.6 when its true worst is 13.9. The published WINNER (C_IC1, 91.8 points) is the same household under either key, so the public headline was right by LUCK rather than by construction -- but the ?year= a reader is deep-linked to was not. Stating that plainly rather than claiming the headline had been wrong.


  ROOT CAUSE, which is why this is a class and not two typos. tools/generate_case_study_recommender.py used ONE formatter, _fmt_pct, for a probability LEVEL, for a RATIO of two probabilities and for a DIFFERENCE of two probabilities -- emitting the same bare ''N%'' for all three and leaving the adjacent English to carry the unit. In both places the English mattered it was wrong, in opposite directions. A one-formatter-three-quantities module does not have an instance defect; it has a class.


  THE MECHANISM. The formatters are split by the KIND of quantity and each carries its own unit in the string: _fmt_level(v) -> ''3.2%'' for a level, _fmt_points(v) -> ''91.8 percentage points'' for a difference. There is deliberately no bare-percentage formatter left in the module to reach for, and no relative error is published at all. Levels print to ONE DECIMAL, not zero: the old formatter rounded 3.23% to ''3%'', which is exactly why the original figure was checkable only against unrounded inputs the reader was never shown -- the display rounded its own inputs. Ranking moved to _gap_points(), which also fails closed on a missing level, because churn_estimate_error_pct is documented nullable in simulation/run_phase2b.py and the old key''s abs(e.get(..., 0)) would have been a crash on a real None, not a ranking.


  LIVE HEADLINES NOW, after regenerating the artefact rather than editing it: ''91.8 percentage points apart at the 2018 renewal (sim 3.2% vs company 95.0%)'' -- and 95.0 - 3.2 = 91.8, so a reader can now reproduce the claim from the numbers printed beside it; and ''True satisfaction fell 12.2 percentage points (63.8% in 2019 to 51.7% in 2024) but never once answered a survey -- invisible to the company''s measurement instrument''.


  R15 BOTH WAYS, FIVE MUTATIONS, EACH KILLING A NAMED TEST. (1) restore the ratio framing -> test_no_headline_expresses_a_change_or_gap_as_a_bare_percentage. (2) restore ''fell 12%'' -> the same test, which is the point of writing it over the OUTPUT rather than per instance. (3) the fail-open that guard invites -- satisfy it by DELETING the numbers (''A large gap at the 2018 renewal'') -> test_the_divergence_headline_gap_is_reproducible_from_its_own_two_levels. (3b) keep the points figure but print only one level -> same test. (4) reintroduce the shared _fmt_pct -> test_the_module_exposes_no_shared_bare_percentage_formatter, so the root cause fails by name. (5) revert the ranking to the ratio -> test_gap_points_ranks_by_divergence_not_by_one_over_the_denominator, whose fixture asserts its own two keys still disagree so it cannot go vacuous.


  CAUGHT BY MUTATION 3 RATHER THAN BY REVIEW, and worth the entry. The reproducibility guard''s first draft ended `assert checked >= 2` and PASSED mutation 3 -- because with the divergence headline''s numbers deleted, the silent-middle slot was counted TWICE (once from the fixture, once from the real book) and stood in for the slot under test. That is this project''s own ''a both-rooms census over one pair of three reads as a clean sweep'' shape, reproduced by me in a control written to catch a counting error. The population is now pinned BY SLOT NAME (_QUANTIFIED_SLOTS), not counted. Second thing the mutation caught: the synthetic fixture initially went silent because ''Most eventful journey'' runs first, takes max() over an all-zero pool and consumed the household the divergence slot needed -- a decoy with real event density now holds that slot open, and test_the_control_sees_both_defective_slots fails if either slot stops being driven.


  WHAT THIS DOES NOT DO, stated rather than left to be found. (a) LEVEL STAYS 2. Exit (4)''s URL half is SITE3_wall_exhibit_url_rename''s and SITE3 is at level 0 -- the door still resolves at /customers/ -- so the atom''s own exit set is not met regardless of the Expert Hour. (b) Two Expert-Hour findings remain open and NEITHER is SITE2''s: the churned-account finding''s DATA half (C1 elec publishes churn 0.23 / clv 2840.5 while C1g publishes zeros for the same household and closure date -- tools/generate_customer_data.py, generator lane) and the winter-peak finding (a WORLD/SIM fidelity item under R12). Every finding inside this atom''s own scope is now closed. (c) SCOPE NOT WIDENED, queued per SELF-INTERRUPT DISCIPLINE: saas/reporting/annual_report.py and tools/generate_insights.py each carry their own local _fmt_pct. Neither publishes one of these headlines, and neither has been audited for the level-vs-difference class -- that sweep is its own finding, not this atom''s file_scope, and the hasattr guard above is deliberately scoped to this module only.


