atom_id: ARCH1_internal_seams
simplifications:
- '2026-07-15 STEP-1 RSS PROFILE LANDED (measurement only, no level move, no migration -- docs/design/ARCH1_STEP1_RSS_PROFILE.md). The R4 gate the BUILD_SCOPING ''real path'' required BEFORE any migration: split the ~674 MB non-output RSS into replayable-exogenous vs live-endogenous to BOUND the achievable win. Method: single-process boundary checkpoint (monkeypatched RiskCommitteeMonitor.__init__ = the exo->endo seam) on a 2016 truncated life; RSS via /proc/self/status (no memray/psutil in-env). Reproduced peak 737.7 MB / non-output 675.7 MB first-hand (matches prior 674 + tournament_runner 0.77 GB@2016). DECOMPOSITION of the 737.7 MB peak: ~375 MB (51%) interpreter+libraries (pymc ~208 + pytensor ~111 -- FIXED, window-invariant, NOT addressable by the trace mock); ~197 MB (27%) up-front EXOGENOUS world DATA (SSP price history 134 + HH smart-meter consumption 48 + weather/cloud 11 -- the replayable target); ~156 MB (21%) loop working set (mixed); 62 MB (8%) output. DECISIVE SCALING FACT: tournament_runner''s own 0.77 GB@2016 -> 5.67 GB@full-9.5yr means the ~375 MB library floor is only 7% of the full-window RSS while the ~5.3 GB of growth (93%) is almost entirely the exogenous world scaling with the window (endogenous book stays kilobytes). VERDICT: at the fidelity window that matters (full), exogenous DOMINATES -> the migration IS JUSTIFIED, FRAME premise holds; BUT a truncated-window profile UNDERSTATES the win (at 1yr the fixed pymc/pytensor floor masks it: exogenous only 27%). L1 evidence must therefore be measured at/toward the FULL window, and the mock''s achievable floor is sub-GB (~375 MB libs + small trace + endogenous + output), NOT near-zero -- it collapses the exogenous scaling, not the floor. SECONDARY LEVER, noted NOT actioned (register as candidate, twin to rank): ~319 MB of the fixed floor is pymc+pytensor imported eagerly in the run_phase4c chain (importing sim.risk_committee alone is 0.4 MB -- transitive); if SIM_FAST_MODE skips the Bayesian model, lazy-importing them shaves ~300 MB off every life''s floor, ORTHOGONAL to ARCH1. level_current STAYS 0 (measurement moves no level); the migration (step 2) is NOT started. || 2026-07-13 RE-RANKED to BUILD, thin-started (COMPOUNDING_WORK_FIRST.md P0). Compounding law: work that SHORTENS THE FEEDBACK LOOP goes first regardless of narrative-epoch. Decompose by JOURNEY not technical layer (onboarding, metering, billing, payments&collections, pricing&hedging, settlement, service, vulnerability, regulatory-reporting) -- stable interfaces because the messages (meter read, bill, payment, mandate, settlement run) are industry-standardised. The internal seams ARE the go-live seams (build the integration boundary once; get parallelism + modularity + the wall external contract from one work) AND enable the A8 mock-interface fast loop. DO NOT big-bang the 9 seams. Cut where the next work lands: the affordability cluster touches billing, payments&collections, service -- cut those 3 first, build the cluster against them, seams ACCRETE in front of the work. || 2026-07-13 REGISTERED (WORKTREE_ISOLATION_AND_SEAMS.md Half 2, director-decided QUEUE, Epoch 3). Worktrees solve FILE-SYSTEM collisions but NOT LOGICAL dependencies: two agents both reaching into hedged_settlement.py still collide in MEANING at the merge. The fix is the doctrine we already have (the sim/company epistemic wall enforced by hooks + tests, not a network) applied INWARD -- typed interfaces between billing / pricing / settlement / collections, enforced the same way (''walled interfaces''). KEY ROADMAP CONSEQUENCE (record it): the architecture work and the velocity work are THE SAME WORK -- Epoch-3 internal seams are not only the go-live boundary, they are what makes concurrent building SAFE, so they cap throughput now and are not merely ''later''. Also discharges the monolith obligation: a monolith stays modular only by DISCIPLINE (microservices enforce it through pain); we chose the monolith and have not yet paid that bill -- internal seams are how we pay it. Epoch-3 gated for BUILD, but DISCOVER/FRAME is available NOW and should be RANKED accordingly (thinking is never gated) -- this is the Lane-3 discovery work to progress alongside builds.'
- '2026-07-13 DISCOVER/FRAME LANDED (Lane-3 fork, doc-only, no level move, commit 14dff83d): docs/design/GO_LIVE_SEAM_AND_INTERNAL_SEAMS_DESIGN.md. Key decision: ONE async-shaped envelope (WallRequest/WallResponse, frozen, correlation-id = idempotency key, NOT_KNOWABLE_YET as a first-class status, valid_time/observed_at split lifted from bitemporal_event_log.py) serves BOTH the outer sim/company go-live wall AND the four inner seams (pricing->billing->collections, settlement->billing) -- same shape at two radii, so C-S3 + A3''s ''schema can''t represent pending latency'' are the same law, built once. Internal-seam enforcement clones tools/epistemic_verifier.py''s git-diff scan with a FORBIDDEN_CROSS_DOMAIN import table; R14 basis-label becomes a structural schema gate. This is why architecture work = velocity work (two agents can''t collide in meaning if the only shared artefact is a versioned typed contract). Biggest open Q for Epoch-3 open: async-migration cost -- migrate call sites incrementally vs a sync convenience wrapper (lean wrapper per SIMPLICITY GUARD), and how to stop the wrapper becoming the default so the async shape actually gets exercised. Epoch-3 BUILD stays gated until epoch-2 exit test passes.'
- '2026-07-14 FRAME LANDED (Lane-3, doc-only, no level move, docs/design/ARCH1_FRAME.md): scoped ARCH1''s HIGHEST-RETURN slice = a TYPED MOCK at the outer sim/company seam (A8''s owned lever, A8 depends_on ARCH1). Design: a third SimInterface impl (RecordedSimInterface) that REPLAYS a recorded EXOGENOUS observable trace (market/weather/regulatory -- the ~5.67 GB the company can''t see anyway, per experiment-cycle-profile.md) while the cheap ENDOGENOUS book loop runs live -> per-life RSS collapses -> tournament_runner''s memory cap stops throttling parallelism (memory-bound -> core-bound). Composes with A8 via ONE env var (SIM_RECORDED_TRACE) + the EXISTING per_life_rss_bytes parameter -- ZERO edit to tools/tournament_runner.py (disjoint file_scope, itself a proof of the seam doctrine). WALLS preserved: mock is a seam impl (epistemic wall intact, epistemic_verifier unchanged); replay is blindfold-gated (observed_at>as_of -> NOT_KNOWABLE_YET, mutation-tested, R15 FAIL-OPEN forbidden) and draws ZERO RNG (determinism strictly safer, C-S2 substream). NAMED CLASS SIMPLIFICATION (R10): the fixed exogenous world breaks the price->churn->volume feedback for ENDOGENOUS observables -- licensed for inner-loop RANKING only, NEVER publish (R15 fail-closed), with the mock-vs-full GAP measured per COUPLED_TRIAD. C-S5 exception: fixed-world endogenous approximation. C-S1/C-S3/C-S4 all conformant (arrival-order tolerant, envelope-shaped async, append-only log). Proposed file_scope: [company/interfaces, tools/observable_trace_capture.py, tests/interfaces]. Levels: L1=wall-safe single life at sub-GB RSS; L2 (TARGET)=composes with A8, workers>1 measured + gap measured; L3=gap-characterised auto-fallback (beyond target). BUILD-ready; twin can open. NOTE: this FRAME scopes ONLY the outer-seam mock; the four INNER domain seams remain the broader ARCH1 (GO_LIVE_SEAM_AND_INTERNAL_SEAMS_DESIGN.md), a later slice.'
- '2026-07-16 DISCOVER finding (Lane-3, doc-only, NO LEVEL MOVE, honest hold at 0). ROOT-CAUSE of why the map still reads level 0 despite the RecordedSimInterface outer-seam mock being built + committed (fe87611a4, 33 interface tests green, blindfold/publish-refusal gates mutation-tested): the L2 mechanism exists but the FRAME''s MEASURED-L2 DoD (docs/design/ARCH1_FRAME.md §8-L2, lines 118-122: a real before/after tournament run with workers>1 and reduced wall-clock, PLUS a measured mock-vs-full COUPLED_TRIAD gap figure) cannot be produced yet, because the actual life-run subprocess -- `python3 -m saas.reporting.annual_report` (tools/tournament_runner.py:17) -- does NOT construct its exogenous world through SimInterface at all. Verified by direct read: saas/reporting/annual_report.py (407KB, 9190 lines) has ZERO SimInterface / build_sim_interface references; it builds the weather/price/settlement world inline. build_sim_interface()''s only real caller is company/portal/app.py (the portal, not a tournament life). So SIM_RECORDED_TRACE never activates in a real run: the FRAME premise ''the life sees the exogenous world through the seam'' is not yet true of the run path. CONSEQUENCE FOR SCOPING the measured-L2 slice: it is NOT a thin wiring hook -- it requires routing annual_report.py''s exogenous-world access (the ~5.67 GB/life the mock is meant to replace) through SimInterface, a large refactor of the monolith that also touches saas/ + tools/tournament_runner.py (A8''s file_scope) => contended with A8, multi-turn, and needs a real (>=truncated-toward-full-window) measurement run to verify. Recommend BUILD decompose measured-L2 as its own opened slice with A8-serialisation, not folded into the mechanism build. The L2-mechanism (mock + capture tool + gap function + memory_safe_worker_cap unit-proof) remains load-bearing meanwhile; level stays 0 until the empirical run evidence exists (no shortcut -- R1 consumer-verified, R15 controls-must-fail).'
- '2026-07-16 BUILD 0->2 (H17 Lane-1): typed internal seam between PRICING/BILLING/SETTLEMENT/COLLECTIONS declared (company/interfaces/internal_seams.py: Domain enum, DOMAIN_PATHS map, 4 versioned directed seam messages PriceCardIssued/SettlementPosition/OverdueInvoiceReferred/CollectionsOutcome) + a fail-closed static verifier (tools/internal_seam_verifier.py) enforcing the boundary the same way the epistemic wall is enforced. R15: mutation-tested -- a planted pricing->billing internal import is flagged; removing a baseline entry re-fires the detector; unparseable file raises (fail-closed) not passes. PASS on current tree (93 files). DECLARED DEBT (not hidden): COLLECTIONS lives inside company/billing/ and SETTLEMENT inside company/market/ today, mapped in DOMAIN_PATHS so the boundary is enforceable in place without a package move; the 2 pre-seam crossings (pricing/switching_recommendation->billing.contract, billing/collections->billing.invoice) are in BASELINE_ALLOWLIST with reasons (remediate-on-touch per the typed-flow-seam/portability retroactive-application doctrine). Held at 2 not 3: the verifier is not yet wired into a hook/CI gate and existing crossings are baselined not migrated -- that hardening is the L2->L3 move.'
- '2026-07-22 HARDEN/red-team (H_harness self-refill, Rule-0 dial yielded — no below-target work anywhere; level HELD at 2, no bump). Re-verified the at-target control: 11 pre-existing exit tests green, live verifier PASS on 98 domain files (grew from 93 at build, still clean, zero false positives). RED-TEAM FOUND + FIXED a real R15 FAIL-OPEN gap: the package-import idiom `from company.billing import invoice` (module string company.billing) mapped via module_to_relpath to company/billing.py, which classify_path (directory-prefix matcher company/billing/) returned None for — so a cross-domain crossing written in that common form was INVISIBLE to the verifier (the dotted-submodule form `from company.billing.invoice import X` WAS caught; the package form was not). grep-confirmed NO real domain file uses the evading form today, so the historical PASS stayed honest, but any future crossing in that idiom would have slipped straight through the wall. FIX: added classify_module() (file-form then package-directory resolution) to company/interfaces/internal_seams.py; the verifier now expands ImportFrom names into candidate submodules and emits one violation per import statement at the most-specific guarded domain. All four evasion forms now flagged (from-PKG-import-submodule, from-PKG-import-cross-domain-submodule resolving precisely to collections, plain import PKG, dotted control); 4 new mutation/regression tests added (15 total green). L2->L3 wiring-into-a-hook/CI-gate + baseline-crossing migration remain the open hardening slice.'
- '2026-07-25 HARDEN (Rule-0 at-target draw), level HELD at 2 -- red-teamed the SIBLING-HALF class (the audit-sibling-half-for-hardened-class pattern): the epistemic verifier (tools/epistemic_verifier.py) was hardened 2026-07-16 against the importlib.import_module()/__import__() dynamic-import bypass (KL-2b), but this internal-seam verifier -- the same static import-direction wall enforcer -- was NOT. Proved the FAIL-OPEN concretely FIRST (R4/R15 both-ways): a company/pricing file doing importlib.import_module("company.billing.payments") / __import__("company.billing.invoice") returned 0 violations -- a domain could evade the ENTIRE seam by swapping one static cross-domain import for its dynamic form. FIX: added _dynamic_import_target() (literal-string target of importlib.import_module / bare import_module / builtin __import__, mirroring the sibling verifier) and wired ast.Call handling into _iter_import_statements; dynamic literal cross-domain imports are now flagged identically to static. A non-literal target (variable/f-string/concat) stays a DECLARED heuristic limit, not a silent false-clear (matches the epistemic verifier scope). 5 new mutation/unit tests (26 total green); internal_seam_verifier --all PASS on 98 files with no false positives. Level not bumped -- this hardens an existing control, it is not a new capability.'
- '2026-07-27 HARDEN/red-team (Rule-0 at-target draw, dial=3 yielded -- no below-target work; level HELD at 2). Re-verified the control end to end (29 pre-existing tests green, live --all PASS on 98 domain files, zero false positives) then red-teamed the one dimension prior passes never checked: not the PER-FILE crossing detector (static/dynamic/relative/package-form all hardened) but the ENFORCEMENT SCOPE -- which files --all (the phase-close gate) actually looks at. FOUND + CLOSED a genuine R15 FAIL-OPEN of killer-pattern 2 (coverage/fail-open-on-missing class): _all_domain_files() hardcoded its scan roots as a hand-maintained duplicate literal (''company/billing'', ''company/pricing'', ''company/market'') DERIVED INDEPENDENTLY from DOMAIN_PATHS (the spec). Proved the hole concretely BEFORE fixing (R4/R15 both-ways): appending the module''s OWN declared future work to the spec -- SETTLEMENT moved to a top-level company/settlement/ package (the docstring names this and company/collections/ as planned) -- leaves company/settlement OUTSIDE the hardcoded scan set, so a whole guarded domain would be silently UNSCANNED by --all and any cross-domain violation there would read as ''clean'' while unenforced (worse than no check). Today the two role sets coincide so the historical PASS stayed honest (same grep-confirm-no-real-evasion discipline as the 07-22/07-25 passes), but the control''s scope could drift below the spec it exists to enforce. FIX: new _domain_scan_roots() derives the --all scan roots FROM DOMAIN_PATHS (each dir-prefix entry -> its dir, each exact-file entry -> its parent, nested roots collapsed) so coverage can never cover less than the spec declares; _all_domain_files() now consumes it. 3 new tests (32 total green): a coverage INVARIANT (every DOMAIN_PATHS matcher resolves under some scan root), a regression PIN (derived roots == the three the scan has always used, so live behaviour/98-file PASS is unchanged -- no false alarm), and the R15 both-ways MUTATION (adding company/settlement/ to the spec MUST make the derived roots include it AND a planted violation in the new domain is scanned+flagged end to end; PROVEN to go RED under the old hardcoded-roots mutant). Level not bumped -- this hardens the existing control''s scope-coverage, not a new capability; the L2->L3 wiring-into-a-hook/CI-gate + baseline-crossing migration remain the open hardening slice.'
- '2026-07-28 HARDEN/red-team (Rule-0 at-target draw, dial=3 yielded -- no below-target work anywhere; level HELD at 2). Re-verified the control end to end (34 pre-existing tests green, live --all PASS on 98 domain files, zero false positives) then red-teamed the ONE crossing-form the prior static-relative and dynamic-absolute (2026-07-25) passes never intersected: the RELATIVE DYNAMIC import importlib.import_module(''.payments'', package=''company.billing''), which resolves at RUNTIME to company.billing.payments -- a cross-domain crossing exactly like its static ``from ..billing import payments`` form. Proved the FAIL-OPEN concretely BEFORE fixing (R4/R15 both-ways): a company/pricing file using that idiom returned 0 violations -- _dynamic_import_target returned the raw ''.payments'' literal, which classified to None, so the crossing was INVISIBLE. A domain could evade the ENTIRE seam by swapping one static (or absolute-dynamic) cross-domain import for its relative-dynamic spelling -- worse than no check, and it falsified the module docstring''s own ''BOTH STATIC AND DYNAMIC crossings are covered'' guarantee (static covered relative; dynamic did not). FIX: _dynamic_import_target now detects a leading-dot import_module target and resolves it against the package= argument (2nd positional or keyword) via the SAME _resolve_relative rule static relative imports use, so the two spellings of the same crossing resolve identically; a leading-dot __import__ (no package= semantics) and a missing/non-literal package stay the DECLARED heuristic limit (no crash, no false positive), matching the existing non-literal-target scope. 8 new tests (42 total green): a 4-case mutation (package= kw, positional package, specific collections-submodule, aliased-importlib -- all flagged), same-domain silence, unresolvable-package declared-limit (2 cases), and a resolver unit guard; PROVEN to go RED with the resolver neutered. Live --all PASS on 98 files unchanged. Level not bumped -- this hardens the existing control''s crossing-form coverage, not a new capability; the L2->L3 wiring-into-a-hook/CI-gate + baseline-crossing migration remain the open hardening slice.'
- '2026-07-28 HARDEN/red-team (Rule-0 at-target draw, dial=3 yielded -- no below-target work anywhere; level HELD at 2; the atom was in its 24h harden cooldown but this draw found genuine NEW work, so it is NOT a REST-WITH-PROOF decline). Re-verified the control end to end (42 pre-existing tests green, live --all PASS on 98 domain files, zero false positives). Prior passes (07-22/07-25/07-27 and earlier-today''s relative-dynamic fix) all hardened the crossing DETECTOR (static/dynamic/relative/package-form) or its scan SCOPE; this pass red-teamed the one class none touched: the CONTROL SUITE''s own fail-open. FOUND + CLOSED a real R15 fail-silent in test_baseline_entries_are_real_crossings -- its docstring claims ''each baseline entry must actually correspond to a cross-domain import in the tree -- a stale allowlist entry would silently widen the seam'', but its assertions only check that the entry''s KEY strings classify to two DIFFERENT domains; it NEVER reads the importing file, so it PASSES even if the grandfathered import was DELETED from disk (the ''non-empty config != live referent'' fail-open class). A stale entry left behind then silently widens the seam: a later re-introduction of that exact crossing is grandfathered again with no review. Proved the hollowness both ways (R15): injecting a STALE entry (pricing/switching_recommendation -> company.billing.payments, not actually imported) fires 0 violations under the old check. FIX: new test_every_baseline_entry_suppresses_a_live_on_disk_crossing generalises the single-entry removal-independence check (test_mutation_removing_baseline_entry_reintroduces_violation) to EVERY baseline entry, END-TO-END on real disk -- remove the entry => check_file MUST flag that exact crossing in that exact file (a deleted import fires 0 => RED, catching the stale entry); restore it => the file MUST be clean again (the entry, not something incidental, is what suppresses it). PROVEN to go RED on the injected stale entry and GREEN on today''s live tree (both baseline crossings -- switching_recommendation:14 -> billing.contract, collections:13 -> billing.invoice -- confirmed live on disk). 1 new test (43 total green); --all PASS on 98 files unchanged. Level not bumped -- hardens the control suite''s own fail-open, not a new capability; the L2->L3 wiring-into-a-hook/CI-gate + baseline-crossing migration remain the open hardening slice.'
- '2026-07-28 HARDEN/red-team (Rule-0 at-target draw, dial=3 yielded -- no below-target work anywhere; level HELD at 2). Re-verified end to end (43 pre-existing tests green, live --all PASS on 98 domain files, zero false positives). Prior dynamic-import passes hardened the POSITIONAL literal (07-25), the ALIASED form, and the RELATIVE form (07-28); this pass red-teamed the one dynamic spelling none touched: the module name passed by the name= KEYWORD rather than positionally -- importlib.import_module(name=...) / __import__(name=...), both legal Python and the EXACT same call. Proved the FAIL-OPEN concretely BEFORE fixing (R4/R15 both-ways): _dynamic_import_target read only node.args[0], so a company/pricing file using the keyword spelling returned 0 violations -- a domain could evade the ENTIRE dynamic-import check the positional/relative fixes exist to close, by a trivial re-spelling. FIX: _dynamic_import_target now reads the first argument positionally OR from the name= keyword (the first parameter of both import_module and __import__), composing with the relative-dynamic package= resolution; a non-literal keyword target stays the DECLARED heuristic limit (no crash, no false positive). 6 new tests (49 total green): a 5-case mutation (import_module name=, bare import_module name=, __import__ name=, collections-submodule, name= composed with relative package=) PROVEN to go RED with the fix neutered, plus a non-literal-keyword declared-limit boundary. Live --all PASS on 98 files unchanged. Level not bumped -- hardens the existing control''s dynamic crossing-form coverage, not a new capability; the L2->L3 wiring-into-a-hook/CI-gate + baseline-crossing migration remain the open hardening slice.'
