- '2026-07-18 BUILD L0->L2 (director open-front, console-orchestrated worktree fork, orchestrator-verified+merged: CSS renders live in ANNUAL_REPORT.md with real ledger-derived figures, waterfall reconciles to revenue <£1, 13 invariant tests + 309 report tests green, epistemic PASS, R14 clocks throughout). Presented on SETTLEMENT basis (only basis with per-segment granularity, revenue £14.03m) bridged to BILLED statutory accounts (£18.88m), the £4.85m difference surfaced as the headline reconciling item not hidden. HONEST GAPS (L3 blockers): (1) D&A reported £0 -- no fixed-asset/amortisation layer exists (named gap); (2) per-segment indirect allocation stays at GROUP level -- no activity-driver model (named, not fabricated); (3) SUPPLIER_REPORTING §4 obligations-register additions (capital adequacy/FMD/cyber) live in company/compliance -- OUTSIDE this fork file_scope, deferred; (4) R15 mutation tests for the reconciliation controls NOT yet in place; (5) transportation-vs-environmental sub-split uses a disclosed commodity-ratio approximation. L3 needs a HARDEN/cold-eyes pass on the allocation choices + R15 mutation discipline.'
- '2026-07-18 BUILT L2->L3 (director open-front, console-orchestrated worktree fork agent-a6bf9cadbc4ed138d, commit 17f354a04, merged 96bc0a89a; orchestrator-verified). saas/reporting/css_statement.py: extracted the reconciliation invariants (previously test-only) into a RUNTIME control verify_css_reconciliation() -- per-segment waterfall, transport+env split, aggregate==sum-of-segments, an INDEPENDENT aggregate-vs-top-line-settlement tie (Control B, the non-tautological leg that catches _classify_split_key silently dropping an unrecognised segment tag), settlement->billed bridge; fails CLOSED on missing structure, rejects non-finite (FAIL-OPEN guard); wired into render_css as a loud banner on violation. annual_report.py CSS wrapper no longer swallows a render error to '''''' (two FAIL-SILENT holes closed). D&A / activity-driver / transport-split gaps consolidated into one rendered Named-simplifications (R10) table -- DECLARED not fabricated. R15: 15 mutation tests; ORCHESTRATOR-VERIFIED not just fork-reported -- independently ran 28 tests green + neutered verify_css_reconciliation -> 12/15 RED, restored -> 15/15, proving the controls fire and the tests catch a dead control. epistemic PASS. HONEST L3 CAVEAT (cold-eyes, carried not hidden): Controls A/B/C are presentation-integrity (guard the rendered/persisted artifact against downstream transform/rounding/serialisation bugs, cannot fail at CONSTRUCTION), Control B is the genuinely independent leg; a fully double-entry component-decomposed bridge of the GBP4.85m settlement->billed difference needs data the two in-scope files do not own -- a NAMED residual gap for a separate atom, not fabricated here.'
