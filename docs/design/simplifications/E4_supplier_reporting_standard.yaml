- '2026-07-25 HARDEN (Rule-0 at-target draw): red-team of verify_css_reconciliation closed a genuine FAIL-OPEN hole in Control B. The per-segment fail-open guard only covered _MONEY_KEYS (revenue/fuel/transport/env/contribution); ''gross_margin_gbp'' and ''volume_mwh'' are referenced ONLY by Control B (aggregate==sum-of-segments), whose guard was on the AGGREGATE alone. A non-finite (NaN) value in one segment for those two keys made seg_sum NaN, and ''abs(finite_agg - NaN) > tol'' evaluates silently False -> the control returned clean [] while the rendered WACOE and gross-margin lines would show ''nan'' as audited figures. Proven live: pre-fix scratch returned [] for NaN volume_mwh AND NaN gross_margin_gbp. FIX: Control B now guards each SEGMENT value for finiteness before the sum comparison (fires ''fail-open guard: {seg}.{key} is non-finite''). R15 both-ways: 2 new mutation tests (test_fail_open_nan_volume_fires, test_fail_open_nan_gross_margin_fires) -> RED with the guard neutered (bad=[]), GREEN restored; full E4 suite 28->30 green, 923 report/css/annual tests green, epistemic PASS. Level unchanged (L3=L3); presentation-integrity hardening only, no new fidelity claim.'
- '2026-07-27 HARDEN (Rule-0 at-target draw, dial=3 yielded): re-verified the 32 E4 exit tests green, R15 mutation of verify_css_reconciliation still fires. RED-TEAMED Control B''s aggregate==sum-of-segments tie and found a NEW FAIL-OPEN (R15 killer pattern 2), the SAME class as the 2026-07-25 gross_margin/volume finding: the tie key-list covered revenue/fuel/gross_margin/contribution/transport/env/volume but OMITTED ''other_direct_gbp'' and ''non_commodity_gbp''. other_direct_gbp is a RENDERED audited line (''Other direct costs (capital/collateral charges)'', annual_report render row) and both keys also build the AGGREGATE COLUMN''s own waterfall -- which Control A never checks (it verifies only the per-segment waterfall, not the __agg__ column). PROVEN on real 2016-2025 data: a post-construction +GBP5m corruption of agg.other_direct_gbp (a serialise/transform-bug shape) broke both the aggregate tie AND the aggregate waterfall, yet verify_css_reconciliation returned [] silently while the rendered ''Other direct costs'' line would show the wrong audited figure. FIX (additive, no numeric change -- clean real data still returns [], no banner): added ''other_direct_gbp'' + ''non_commodity_gbp'' to Control B''s tie loop, closing the aggregate-waterfall hole by transitivity (per-segment waterfall + every aggregate component tied to sum-of-segments => aggregate waterfall holds). R15 both-ways: 2 new mutation tests (test_mutation_aggregate_other_direct_fires, test_mutation_aggregate_non_commodity_fires) go RED with the two keys removed from the tuple, GREEN restored. E4 suite 32->34 green, 927 report/css/annual tests green, epistemic PASS (493 files). Level unchanged (L3=L3); presentation-integrity hardening only, no new fidelity claim. loop_stage stays harden.'
