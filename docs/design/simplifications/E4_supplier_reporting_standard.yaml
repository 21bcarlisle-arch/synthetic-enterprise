- '2026-07-28 HARDEN red-team (Rule-0 dial=3 yielded on an empty feasible set -- no below-target work anywhere; level 3->3, at target). Re-ran the exit tests green, then ROTATED the R15 source-mutation to the genuinely-INDEPENDENT tie leg (Control B'''', aggregate-vs-top-line-settlement -- the ONE non-tautological leg, un-re-verified by the 07-25/07-27 passes which both re-tested Control B): fail-opened it (if False and ...) -> both test_mutation_independent_topline_fires and test_independent_tie_not_tautological fired RED, restored byte-identical. RED-TEAM then found a REAL NEW FAIL-OPEN (R15 killer pattern 2, NaN-blind comparison) on that SAME independent leg: a non-finite years[*].revenue_gbp makes topline NaN, and ''abs(agg - NaN) > tol'' evaluates silently False -- disabling the ONE genuinely-independent reconciliation while every finite segment/aggregate figure stays clean, so NO other control fires (Control B guards only the SEGMENT values + aggregate, both finite in this case). PROVEN 2026-07-28 on real run_output data: a NaN in years[*].revenue_gbp returned [] silently, agg + all segments finite. This is a DIFFERENT DATA PATH (the top-line source) from the segment/aggregate values whose NaN holes the 07-25 (volume/gross_margin) and 07-27 (other_direct/non_commodity) passes closed -- a NEW leg never finite-guarded, NOT an 8th guard on an already-closed hole. FIX (additive, no numeric change -- clean data still returns []): reject non-finite top-line/aggregate revenue FIRST (fires ''independent tie: fail-open guard''), else the original tie. R15 both-ways: new test_fail_open_nan_topline_year_revenue_fires GREEN with the guard, RED with it neutered (if False), restored byte-identical (cp-backup taken after the fix, not git-checkout, per restore-wipes-edit hazard). E4 suite 34->35 green, 1605 saas tests green, epistemic PASS (1 file). Level unchanged (L3=L3); control-integrity hardening only, no new fidelity claim. loop_stage stays harden.'
