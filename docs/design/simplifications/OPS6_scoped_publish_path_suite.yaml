map_notes:
  origin_note: 'MINTED FROM deliverable 1 of the WORK THIS CREATES block in DIRECTOR_RULING_PUBLISH_DECOUPLING_2026-08-10 (''THE SITE BREATHES''). The ruling names the defect precisely: the gate conflates ''is the entire repo green at HEAD?'' with ''may the site update?'', so a red anywhere freezes the public surface. NOT a duplicate of H23_publish_gate_scope_marker: H23 deselects @pytest.mark.operational, which still leaves every non-operational red -- allowlist rows, map ratchets, lint ratchets -- able to wedge the live site, and those are precisely the reds that caused the episodes on record. This atom narrows the BLOCKING set to the publish path proper (the code that produces and renders the published numbers) and routes reds outside it to an ANNOTATION on the page. EXIT: (1) the publish-path suite is a single inspectable surface beside publish_gate_pytest_argv (R15: a control''s scope must be inspectable); (2) an R15 mutation proves a publish-path defect BLOCKS and a non-publish-path red DOES NOT -- both directions, since a scope that only ever blocks is the old gate under a new name; (3) the annotate path carries the open-findings count onto the page (couples to OPS7); (4) the scope is measured against the wedge episodes on record: state, per episode, whether it would have blocked or annotated.'
