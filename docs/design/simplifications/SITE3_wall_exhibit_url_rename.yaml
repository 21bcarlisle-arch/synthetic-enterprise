atom_id: SITE3_wall_exhibit_url_rename
map_notes:
  name: 'MINTED 2026-08-12 (worker tick) as SITE2''s SINGLE NAMED RESIDUAL, not as new scope -- exit criterion (4) of SITE2 is ''name, title, entry copy and URL stop claiming to be a customer''s portal, and the old URL redirects''. The name/title/entry-copy half LANDED in SITE2 (title is now ''Two Sides of the Wall'', the login copy says plainly it is not a customer login, and the page names the real portal at company/portal/ twice). The URL half is split out because it is a different KIND of change with a different blast radius: site/customers/ is a canonical door in site/sitemap.xml, so moving it touches site/index.html, site/now/, site/privacy/, site/wip-flow/, site/company/ navs, three DAEMON-REGENERATED feeds (site/data/evidence.json look_href, site/data/moap_node_atoms.json look_href, site/data/capabilities.json evidence_link via tools/generate_capabilities_json.py), and ~10 hard-coded PORTAL = site/customers/index.html paths in tests/tools/ plus tools/verify_printed_bill_render.mjs. Attempting it in the same tick as SITE2''s page rebuild would have meant committing coordinated edits to site/data/*.json while those files were concurrently dirty from a daemon regeneration -- the ''a repo-wide census is not decomposable by pathspec'' failure this repo has already been bitten by. EXIT: (1) the door resolves at its new URL and site/sitemap.xml advertises only that one; (2) site/_redirects 301s the old /customers path (and /customers/*) to it; (3) NO published link on any canonical door, and no glossary see_url, still points at the redirected URL -- site/test_no_links_to_redirected_urls.py is the existing class guard and must stay green, which means repointing site/index.html''s ''./customers/#cust-who'' and the navs on now/privacy/wip-flow/company; (4) the three generated feeds are fixed AT THEIR GENERATOR, not hand-patched in the JSON, so the next regeneration agrees; (5) every hard-coded path to the door file moves with it and the coupled test set stays green (tests/tools/test_billing_tab_fix.py, test_bill_correctness_addendum_defect1/2/4.py, test_billing_and_payments_ledger.py, test_site_structure.py, test_nav_story_platform_method_rq.py, test_e2_revenue_reconciliation_surfaces.py, site/test_brand_token_adoption.py''s UNADOPTED key, tools/verify_printed_bill_render.mjs); (6) R11 -- the new URL fetched live returns 200 directly (not via a redirect) and the old one 301s, checked with site/live_pixel_verify.py, which derives its door list from the sitemap; (7) R15 -- a mutation reinstating a link to the old URL fails test_no_published_link_targets_a_redirected_url, proving the class guard covers this rename and not just the SITE_V5 one it was written for.'
