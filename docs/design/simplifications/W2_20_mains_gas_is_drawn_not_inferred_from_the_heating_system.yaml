atom_id: W2_20_mains_gas_is_drawn_not_inferred_from_the_heating_system
map_notes:
  gain: 'HOUSING RULING section 3.1 names ''heating system and fuel INCLUDING NO MAINS GAS''. Measured 2026-09-05: neither the DrawnPremise nor the Household carries any gas field at all, so off-gas is today INFERRED from the heating system -- which gets it backwards, because a property off the gas grid has no gas option to choose from and the causation runs connection -> system, not system -> connection. THE ANCHOR IS ALREADY PULLED: docs/market_research/floor_area_anchor_need_2026_hmrc_bands.md established DESNZ NEED anon2026_50k as open, account-free and HMRC-sourced, and the same 50,000 rows carry the gas/electricity split per dwelling. EXIT: a drawn mains-gas attribute whose marginal recovers the published off-gas share, with the existing heating-system marginals unmoved (a fidelity change to either is decided blind to P&L, never a side effect). WATCH THE CENSORING: NEED blanks gas readings under 1,000 kWh, so ''no gas reading'' and ''no gas connection'' are DIFFERENT and the first must not be read as the second -- that conflation would manufacture an off-gas population out of small flats.'
simplifications:
- 'TARGET LOWERED 3->2 (2026-10-07, delivery seat decision in DIRECTION.yaml, option 1 of docs/staging/SEAT_FINDING_W2_20_A_SIXTH_OF_DRAWN_GAS_BOILERS_HAVE_NO_GAS_SUPPLY_2026-10-07.md; same standing as 6314e5bc8). L2 was earned by 81732ffe2 and refused only because the coupled-triad gate holds a twinless world atom below L3. A supplier holds the MPRN, so whether a home has a gas supply is read, not inferred, and no company belief about it can be wrong in the way a twin measures. C14 is not a twin today: its couple_fabric draws through draw_premise_population, the sibling draw, so its gap does not move with this atom. RESTORE target 3 when a company grade reads an off-gas belief on the production draw (for example C14 couple_fabric run on draw_premise_from_joint) and the gap is re-measured there; register W2_20 -> that atom in background/coupled_triad._AUTHORITATIVE_COUPLING in the same commit.'
