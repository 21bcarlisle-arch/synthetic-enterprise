atom_id: PB1_population_target_and_its_price
simplifications:
- '2026-08-13 DISCOVER (LANE 3 idle draw, no BUILD, level HELD at 0, loop_stage still idle, no file_scope path touched, no curriculum value moved, no map edit). Full deliverable: docs/design/PB1_POPULATION_TARGET_DISCOVER.md. (a) PROPOSED PREMISE-POPULATION TARGET 4,000 premises, DERIVED not chosen, as the larger of two floors this repo already carries. FLOOR 1, the instrument''s own resolution: tests/simulation/test_premise_population.py:37 draws BIG_N = 4_000 against MARGINAL_TOLERANCE_PP = 0.03 with its reason in the source ("large enough that binomial noise on the smallest judged share is well inside the tolerance, so a FAILURE means a biased draw rather than a small sample"), and it is R15 both ways -- line 85 asserts the tolerance CAN be exceeded, commenting that otherwise "the control cannot fail and is worth nothing". Computed: on the largest published share (44.8%) the binomial sd is 0.0079 at N=4,000, so 3pp is 3.82 sd out; at today''s published research draw of n=200 (docs/observability/coupled_gap_ledger.json:52, population_seed=17) the sd is 0.0352 and 3pp is 0.85 sd out -- TODAY''S DRAW IS BELOW THE RESOLUTION OF ITS OWN CONTROL, which is the strongest reason to raise it and is independent of the book. FLOOR 2, the funnel (PB2 §4): 5.8324 quotes per win, so N=4,000 supports a book of 686, above the 465 the probe measured as reachable -- the world is not the binding constraint at this target, which is also why not to go higher yet. 4,000 = max(4,000, 2,712) and is 20x today''s 200. (b) THE COST HALF IS THE FINDING: AO12 NEVER PRICED THIS OBJECT. The report''s five stages are population_draw / settlement_build / run_output_serialization / site_publish / git_transport, and the stage named population_draw records its own subject in its own detail field -- "drew 10258 customers via simulation.population_draw" -- with tools/scale_probe_10k.py:27 labelling it "the book itself". It measures the CUSTOMER acquisition draw, not simulation/premise_population.py. There is therefore NO measured price for a drawn premise anywhere in the report, and exit (d) governs: an unmeasured stage is an UNKNOWN cost, not a zero. Cost UNKNOWN, affordability UNDECIDED, and this pass did NOT take the measurement itself because exit (b) says the cost is READ from AO12''s artefact -- taking it here would have produced a number with no instrument behind it and hidden the finding behind a plausible figure. What the record DOES say, quoted verbatim in §3 and read from docs/observability/scale_probe_10k/report.json (run 20260812T013154Z): settlement_build ceiling_death at 465 customer-years, peak RSS 3026 MiB, wall 7.05s, affordability DOES_NOT_FIT (projection 59.5 GiB vs a 7.99 GiB budget); run_output_serialization peak RSS 582 MiB, wall 0.73s, 126,214,554 B for 507,993 records, DOES_NOT_FIT, 248.46 B/record x 17,517 records/customer-yr = 4.35 MB/customer-yr RAW with THE REDUCTION UNMEASURED; site_publish and git_transport both subject_kind=replica, both UNDECIDED, git_transport''s own note saying its 1,306x pack ratio biases size and wall LOW by an unknown factor. (c) AFFORDABILITY VERDICT, COMPUTED, AND IT FAILS CLOSED BOTH WAYS ROUND. PATH A, raise the research draw alone: UNDECIDED (unpriced) and PURPOSELESS -- simulation/population_draw.py does not import premise_population, so the stock the company acquires from is still not this stock. PATH B, join it to the acquisition path, which is what the ruling asks for: simulation/live_population.py:161-177 returns list(CUSTOMERS) + drawn (read directly in this pass), so every drawn member IS a book member and the book-side stages bind at the drawn size -- N=4,000 is 8.60x the MEASURED ceiling_death at 465 and its raw settlement working set is 174.1 GB over the 10-year window before an UNMEASURED reduction: DOES_NOT_FIT. 465 is measured and 1,343 is a projection the probe''s own detail calls under-stated, so fail-closed uses 465 (20.2 GB raw over 10 yr). INTERIM: the largest N whose join completes a green full shipped run, by bisection, with 465 the fail-closed cap until that run exists. (d) TWO POPULATIONS, DISJOINT -- the structural finding, and it is new here. simulation/premise_population.py draws DrawnPremise records raked onto three published England housing-stock marginals and is consumed ONLY by tools/couple_fabric.py -- a research instrument no run reads; simulation/population_draw.py draws SyntheticCustomer acquisitions, imports only household_segments and stdlib, and is what live_population() appends. They share no membership, and premise_population''s own docstring records why (SyntheticCustomer carries no premise dimensions, so make_household defaults every drawn customer to the same suburban_semi, "a population of clones"). So "the company acquires a subset of the population" is false TWICE: the book equals the acquisition draw (PB2 exit d) and the acquisition draw is not the premise stock (this pass). Both halves must change before a population target means anything, and only the first is filed anywhere. (e) SEQUENCING CONSEQUENCE, and it inverts the ruling''s reading without inverting the map: on today''s seam GROWING the population IS granting the book, the one implementation PB2 names as forbidden, so deliverable 1 cannot be BOUGHT before deliverable 2''s remainder exists even though it is PROPOSED first. The map''s PB2.depends_on = [PB1] edge is right for the proposal and reversing it would be a cycle, so the buying order is recorded as a sentence rather than mechanised -- a cycle in the map is worse than a sentence in the record. (f) PREREQUISITES NAMED, in binding order, per the ruling''s own governor: (1) one new AO12 stage whose subject is premise_population.draw_premise_population -- the cheapest of the three and the one that turns UNDECIDED into a number; (2) PB2''s unwon remainder; (3) the persisted side, DIRECTOR_INSTRUCTION_QUERYABLE_PROJECTIONS_2026-08-10 (still an unconsumed mint source in the staging root, so named rather than edged). Its first increment HAS landed as G12_queryable_ projections (L2, AO12''s envelope copied verbatim into a rebuilt store) but G12''s own record says the envelope GOVERNS NOTHING YET and the store has no consumer until G13 -- so the storage prerequisite is begun, not met, and nothing here clears it. (g) QUEUED FINDING, not fixed here (SELF_INTERRUPT_DISCIPLINE, and not edited into another draw''s in-flight document): PB2 §4 prices 18,756 premises at "~16 MB to draw" from the 860 B/customer constant, and its record repeats "a drawn premise costs ~860 bytes RSS". That is a SUBJECT SUBSTITUTION -- the customer draw''s per-unit constant read onto premises -- R15''s wrong-subject shape. PB2''s count floors are unaffected; only its cost sentence is.'
- '2026-08-14 FRAME (LANE 3 idle draw, no BUILD, level HELD at 0, loop_stage still idle, no file_scope path touched, no curriculum value moved, no atom minted). Full deliverable: docs/design/PB1_PRICE_INSTRUMENT_FRAME.md. Follows the 2026-08-13 DISCOVER pass, whose own deliverable doc was UNTRACKED at HEAD until this commit -- the record cited evidence that had never landed. (1) WHY THE MISSING PRICE WAS INVISIBLE, and it is an R15 tautology in its mildest form: AO12''s two registry controls are MUTUALLY CLOSED -- tests/tools/test_scale_probe_10k.py:510 asserts set(BINDING_RESOURCE) == set(STAGES) and :517 asserts set(STAGE_FUNCS) == set(STAGES), so every term on both sides is drawn from STAGES. Nothing relates the stage set to the SUBJECTS a consumer prices against, so a subject that was never a stage is not a red control but a non-subject. The probe''s fail-closed vocabulary has exactly two shapes -- a stage that ran and could not measure a component (`unmeasured`) and a stage that did not run (test_report_lists_every_unrun_stage_as_unmeasured) -- and no third shape for an absent subject. DISCOVER could only find the hole by comparing five `detail` prose strings by eye; a consumer trusting the stage NAME would have read 859.69 B/unit off population_draw and priced 4,000 premises at 3.4 MB -- available, plausible, wrong, and unobjected-to. (2) THE MISSING MEASUREMENT, SPECIFIED (belongs in AO12''s file_scope, not PB1''s): stage `premise_population_draw` over simulation.premise_population.draw_premise_population (premise_population.py:646), subject_kind=real, unit=premise, BINDING_RESOURCE=rss_bytes (the draw writes nothing, so output_bytes is None NEVER 0), baseline taken after raked_joint() so the stage prices the population not the fit. `target_units` is the one place it can silently become the wrong subject again: the conversion is the funnel N_premises = ceil(q x N_book) and q=5.8324 is a PB2 DESIGN CONSTANT not a measurement, so it is cited into `extra` as quotes_per_win the way settlement_build cites records_per_customer, and FAIL-CLOSED on its absence -- target_units None and UNDECIDED, never defaulting to args.customers, which would price a 1:1 population:book world and re-commit the original error inside its own fix. `unmeasured` non-empty by construction (THE JOIN -- this prices drawing a stock, not sampling the acquisition draw from it, which no seam does today). Two R15 falsifiers: F1 short draw must RAISE not report (the premise analogue of test_the_probe_refuses_a_book_it_did_not_get:270, but for the OPPOSITE reason -- the customer stage tolerates batching because its generator saturates, the premise draw is a plain range(n) so a short draw is a broken instrument); F2 the wrong-subject mutation that would have caught this finding -- point the stage body at simulation.population_draw leaving name and detail unchanged, the suite must RED, asserting on the DrawnPremise objects constructed and never on the `detail` string, which is the prose that failed the first time. (3) THE DURABLE HALF, and it is the one that fixes the class rather than the instance: PRICED_SUBJECTS, a fourth registry mapping subject module path -> pricing stage, yielding a `subjects_without_a_stage` report field so exit (b) reads a MACHINE FIELD instead of comparing detail prose (today''s value would be [''simulation.premise_population'']), plus a consumer-end refusal that raises rather than returning the nearest stage -- the failure mode here is not that the report lied but that it was SILENT while a neighbouring number was in reach. ACCEPTANCE CONDITION, stated because it is the likely careless build: PRICED_SUBJECTS must be maintained from the CONSUMER side, never generated from STAGES -- generated, it is a fifth mutually closed set and the whole control is decoration. Its falsifier is deleting the new stage from STAGES while leaving the subject in PRICED_SUBJECTS. (4) MAP FINDING: A SATISFIED EDGE OVER AN UNMET DEPENDENCY. PB1 depends_on [''AO12_scale_probe_10k'']; AO12 is level_current 2 of level_target 2, at target, ran, produced its artefact -- by every reading the map supports PB1''s dependency is SATISFIED, while PB1''s exit (b) is unsatisfiable because AO12 measured a different object. depends_on encodes ''the thing I need is COMPLETE''; PB1 needed ''the thing I need COVERS MY SUBJECT''. When those come apart the map reads green on the edge and the atom stalls at 0 with no red anywhere -- drawable forever, completable never, which is why this atom has taken two full passes without moving. ONE INSTANCE, STATED AS ONE: no base rate is claimed (one observed divergence is not a base rate); what would measure it is a per-edge check that the dependant''s exit text names an artefact the dependency''s file_scope produces, a 200+-atom census that is not this atom''s work. (5) UPGRADED FROM CLAIM TO READ: DISCOVER flagged its own saturation scope-note as ''a claim about the shipped signature, not a measurement''. Read at HEAD it holds and is stronger -- draw_premise_population is a plain range(n) with no Poisson, no batching, no lambda, so the new stage is SIMPLER than the one beside it (one call, no loop, none of _stage_population_draw''s max_batches/reseed/id-prefix apparatus). Its docstring''s ''Growing n APPENDS -- P0007 never changes'' buys two further properties, neither previously written down and both load-bearing: APPEND-STABILITY (raising the target later does not reshuffle premise identities, so a won premise stays the same premise -- without it ''grow the population'' silently re-draws the book''s premises underneath it, a curriculum change disguised as a scale change), and CHEAP MONOTONE MEASUREMENT (the stage can be measured at several n in one run and its per-unit constant checked for LINEARITY rather than assumed -- every existing stage''s constant is a single-point estimate; this one need not be). (6) LEVEL HELD AT 0, with the argument against recorded rather than suppressed: the atom''s gain is a number that was PRICED before it was bought -- the number exists (4,000, derived) and the price does NOT, and no document can make it exist since exit (b) requires a reading from an instrument this pass has specified rather than produced. Moving the level would record ''priced'' against an UNKNOWN, the exact fail-open shape exit (d) and AO12''s own reading_note refuse. AGAINST: two passes, no cell movement, and this project has a filed report on that pattern. The counter is that the blocker is now named, specified and cheap -- one increment in an atom already at target with an open file_scope -- so the fix for the stall is to BUILD the instrument, not to move the cell; if read the other way the move is not a bump on PB1 but a RESTATEMENT of exit (b) to permit a price measured by this atom itself, and that restatement is the director''s, not mine. (7) DISCOVER''s queued finding against PB2 section 4 (the 860 B/customer constant read onto premises) STAYS QUEUED, not fixed on sight (SELF_INTERRUPT_DISCIPLINE); this pass generalises it -- the PB2 sentence and the absent stage are the same wrong-subject substitution, once by a reader and once by an instrument.'
map_notes:
  name: 'Deliverable 1 of DIRECTOR_RULING_POPULATION_AND_BOOK_GROWTH_2026-08-11: a proposed SIM premise-population target with the AO12 probe''s MEASURED cost beside it. The number and its reasoning are the worker''s; the ordering and the wall are the director''s. EXIT: (a) a proposed target N with the reasoning that produced it; (b) beside it, per-stage cost READ FROM AO12''s own report artefact -- peak RSS, wall time, output size -- never re-derived and never asserted; (c) an affordability verdict COMPUTED from that record rather than judged, honouring the ruling''s own governor: if the probe says the scale is unaffordable on current storage THAT IS THE ANSWER, and the queryable-projections/storage work is named as its prerequisite rather than worked around (that instruction is itself still an unminted mint-source, DIRECTOR_INSTRUCTION_QUERYABLE_PROJECTIONS_2026-08-10, so it cannot be a depends_on edge yet); (d) fail-CLOSED on an unmeasured stage -- a stage the probe never reached is an UNKNOWN cost, not a zero, and a proposal that prices it at zero is the fail-open shape R15 names.'
