map_records:
  evidence:
  # BARE PATH, no trailing parenthetical: `background.supervisor._atom_has_frame_doc`
  # resolves this entry against PROJECT_DIR and requires a real non-empty file, so an
  # annotation appended here makes the path unresolvable and re-hands a FRAMED atom to
  # the idle draw for ever. The annotation is the next entry instead.
  - docs/design/frame/C33_collections_reads_the_registers_it_already_has_FRAME.md
  - 'The above is the canonical per-atom FRAME, measured at 3bd9e95ed 2026-09-19, doc-only per EPOCH_GATING_AND_ATOM_AUTHORSHIP.md Rule 1: it re-asks the C29 Half-B claims at HEAD, carries levels 0->2, and reports three things the parent pass did not have.'
  - 'CONFIRMED AT HEAD, AND INERT. 68 commits separate the parent FRAME''s c1609e374 from 3bd9e95ed and none touched company/billing/, company/crm/ or tests/company/, so the re-confirmation is by construction. Re-read anyway: the dunning selectors (current_dunning_step, select_dunning_step) take no account id and AgedItem carries no moratorium field, so the resi day-56/day-90 and micro-SME day-75 enforcement steps are reachable on days-overdue alone -- AND nothing outside arrears_engine.py calls any of dunning_path/current_dunning_step/select_dunning_step/collections_snapshot, the one production importer (payment_observation_consumer.py:144) taking only the ageing half. breathing_space_register.py: 184 lines, 12 tests across two files, zero production callers. The conditional and production layers answer OPPOSITE ways and both belong in the record -- the first alone overstates a live compliance hole, the second alone reads as nothing-to-do, which is how the gate stays unbuilt until a caller retrofits it.'
  - 'THE RETENTION DEFECT IS LARGER THAN CLAIMED. The parent FRAME said expected_retention_value_gbp carries no probability. It is handed one and discards it: generate_offer takes a CustomerChurnRisk carrying churn_probability, and RetentionOffer stores the BANDED churn_risk_band instead, so the fix is to stop dropping a value already in hand rather than to find one. The correct form of the same arithmetic is written one module away -- portfolio_churn_risk.py:75 expected_loss_gbp = churn_probability * annual_revenue_gbp -- so the tree holds one right and one wrong use of "expected" where the wrong one CONSUMES the object carrying the right one. CustomerRetentionBook also has zero production callers, so the mis-named figure reaches no reader today.'
  - 'THE ORGAN CHOICE IS REFUTED IN DIRECTION. C29 FRAME §5 item 3 asks to wire company/billing/capacity_to_pay.py into the SLC 27 day-28 repayment_plan_offer step. The evidence at HEAD points at the other organ: capacity_to_pay is 98 lines, no production caller, no map atom; company/crm/affordability_inference.py has tools/couple_w2_4_c6.py, the atom C6_affordability_inference CLOSED at level_current 2, and a live measured belief-vs-truth gap of raw_gap 0.298 in docs/observability/coupled_gap_ledger.json. Wiring the orphan would make the closed measured organ the second implementation of a live rule -- the VAT shape. FRAME position: affordability_inference is the organ, capacity_to_pay is a retirement candidate, not a wiring target. Refutable if the day-28 step needs plan-months arithmetic affordability_inference cannot produce.'
  - 'COMMONS GAP FILED, NOT FILLED. docs/domain_artefact_library/regulatory/ holds twelve artefacts including psr_eligibility_and_disconnection_protection.md, and NONE mentions Breathing Space, the Debt Respite Scheme or a moratorium. breathing_space_register.py carries the regime as module constants instead (_BREATHING_SPACE_START_DATE 2021-05-04, _STANDARD_DURATION_DAYS 60, _MH_POST_TREATMENT_DAYS 30) cited only by inline comment. Owed: a regulatory-commons artefact for SI 2020/1311 carrying the durations, the two moratorium types and the enumeration of what a creditor may not do during a moratorium. Until it exists the L2 control must not be written against the module''s own literals, because a control that re-reads them only proves the module agrees with itself -- so L2 is blocked on EVIDENCE rather than on permission.'
  - 'LEVELS 0->2, KEYED TO THE PROPERTY. L0 today: enforcement selects on (segment, days_overdue); register and ability-to-pay organs uncalled; the retention figure is conditional but named as an expectation. L1: the retention arithmetic is honest -- either it carries churn_probability and becomes an expectation, or it is renamed (retention_value_if_retained_gbp) with the conditional stated at every call site and in the summary key. L2: dunning selection takes moratorium status as a REQUIRED input and cannot return an enforcement step without it. The tempting L2 control ("no account is dunned through an active moratorium") passes today on an empty world and would pass on a register that always answers no -- a control that cannot fail. The one that can asserts over the whole partition: the selector CAN return an enforcement step, CAN return a held step, and a moratorium flips it, reachability leg first.'
