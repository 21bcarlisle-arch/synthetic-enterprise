atom_id: A50_the_supplier_use_case_register_is_published_with_a_status_per_item
map_notes:
  gain: 'MINTED 2026-09-09, and the mint is two days late by an accident of archiving. PLANNER_MINTED_the_ruling_and_the_canon_are_seven_eighths_minted_2026-09-07 specified this atom in full and then said, in its own "What this tick did and did not do" section: "Did not: write A50/A51 into docs/design/maturity_map.yaml" -- because the map was mid-collision that tick, carrying 207 uncommitted lines from another lane, and a pathspec commit would have swept them. That was the right call. The document was then archived to docs/staging/done/, so nothing re-drew it; the contention it waited on has since cleared (W2_29, W2_30, W2_31 and W1_28 are all at HEAD). The two atoms sat specified and unminted for two days while the ruling itself re-drew in every tick doorbell, and LAW C''s independent read reported them covered the whole time -- see SEAT_RESULT_LAW_CS_INDEPENDENT_READ_BELIEVED_A_MINT_DOCS_SENTENCE_2026-09-09. THE GAP THIS EXISTS TO CLOSE, MEASURED 2026-09-09: site/data/capabilities.json parses to {generated_at, git_commit, phase, cards} and contains the string "use case" zero times; capabilities_door.json holds world/supplier/go_live/typed_seams/wall/scale/gaps and no use-case key. The register the ruling asked to publish has no home on the page it named. EXIT TO L1: the register renders on Capabilities from a generated feed, every use case in the ruling present, each status drawn from a CLOSED vocabulary and DERIVED from map/tree state rather than hand-set. EXIT TO L2: (a) a use case whose SIM fidelity is not established publishes that as a named gap -- an honest None with a reason, never an omission and never a plausible status; (b) a door test asserting the LIFTED value changed, against the real feed and not one the test built, because a door test that builds its own feed controls the render and not the lift; (c) a control that reds when a use case is added to the ruling and not to the register. FIRST DEPENDENCY, STATED RATHER THAN ASSUMED: the ruling''s deliverable 2 names six sub-items -- allocation rules, going-cold, per-asset decomposition, the sum-to-total control, consent to control, channel behaviour. The 09-07 mint verified the ATOMS covering People P1/P2 exist and explicitly did NOT verify each sub-item has a home. "Status per item" cannot be truthful until each does, so locating-or-declaring-missing those six is step one of this atom and not a later refinement.'
