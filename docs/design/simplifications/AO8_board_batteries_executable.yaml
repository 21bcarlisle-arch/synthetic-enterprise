atom_id: AO8_board_batteries_executable
map_notes:
  build_note: 'L0->L2 2026-08-08 (self-certified, gate_authorizations.jsonl). All 76 battery lines from the 8 scope briefs are addressable records in tests/domain/battery_register.yaml, generated by tools/build_battery_register.py from an INDEPENDENT ORACLE that parses the briefs themselves -- the register never feeds its own check, so agreement is not a tautology (R15). 3 mechanised and running (ELEC-4 negative-price regime, GAS-8 therm conversion, NCS-B3 levy fuel purity), 71 pending_capability each naming its blocker, 2 not_mechanisable each argued. 24 tests. NO SKIP DISPOSITION EXISTS and skip markers are banned in the battery module -- the atom''s own named fail-open (a check that skips on absent data reads as covered). R15: 15 mutations; one FAILED TO FIRE -- the first ELEC-4 check passed with the negative-price overlay disabled because an incidental gaussian tail satisfied it, so it was rebuilt as a differential whose control arm asserts its own premise, then proven. COVERAGE IS 3/76 AND THAT IS THE REPORTED HEADLINE, not a rounding-up: docs/design/BATTERY_CONVERSION.md carries a GENERATED status table (stale block fails the suite) plus the delta -- ELEC-2 (no day-ahead/within-day series) alone blocks 4 lines, and the merit-order reconstruction would make 4 more checkable with assertions rather than new capability. Integrity test wired into CONTROL_TESTS so a renamed/deleted check cannot keep reading as covered. Known limit recorded, not papered over: docs/ is outside CODE_PREFIXES so a brief edit does not fire the commit gate.'
  origin_note: 'Independent of the MAP->NET->KNIFE chain (hence no depends_on) -- it consumes already-purchased external judgement and touches no structure, so it can run alongside. ''External judgement already paid for stops sitting inert'' is the director''s own justification and also describes the eight scope briefs sitting unprocessed in staging as this was minted. R10 relevance: these batteries are the natural home for absurdity-class invariants, so a converted line should extend the invariant/obligations library rather than becoming a one-off assert. Watch the FAIL-OPEN shape: a battery line converted into a check that silently skips when its data is absent is worse than leaving it as prose, because it reads as covered.'
  name: 'Board scaling 3a -- the disqualification batteries already purchased (Specs 001-006 plus the five 2026-08-04 scope briefs: electricity, gas, carbon, CFD/assets, industry boundary, and the 2026-08-07 additions change-of-tenancy, non-commodity cost stack, prepayment estate) are PROSE. Convert each testable line into a standing check that runs with the suite; lines that cannot be mechanised are LISTED AS SUCH, NOT DROPPED.'
