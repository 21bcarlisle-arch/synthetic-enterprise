atom_id: SITE6_knowledge_in_nav_glossary_dissolved
map_notes:
  gain: 'The brief''s one non-negotiable sequencing constraint binds here: only once Knowledge carries real content does the glossary warehouse go, 301''d to Knowledge with its 26 definitions moved into the prose that needs them. The trap the brief does not name: `site/data/glossary.json` has a live consumer in the glossary LAYER (`site/test_glossary_layer.py`, 13 tests, L1 ''definitions stay in ONE place''), which is a term-inspection mechanism separate from the page. The director ruled §6 Q4 explicitly -- the layer SURVIVES. §3''s argument is against a warehouse a reader must already know the term to search; inline term inspection is the opposite of that and serves §6.7 directly. Killing the page must not kill the layer, and that must be decided rather than discovered.'
