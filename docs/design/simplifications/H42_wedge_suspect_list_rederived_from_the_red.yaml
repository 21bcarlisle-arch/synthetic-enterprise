atom_id: H42_wedge_suspect_list_rederived_from_the_red
map_notes:
  origin_note: 'RATIFIED AS A MINT by DIRECTOR_NOTE_SUSPECT_LIST_REDERIVATION_2026-08-10 (the 12:32 report''s recommendation). The publish-gate alarm''s ''Also filed and unactioned in staging'' block is built by background/process_run_complete.py::filed_findings() -- a RECENCY ranking over staged findings, structurally unrelated to the failure it is printed beside. Its own text already confesses the measurement: 0/8 named the cause in each of the FIVE preceding episodes, and the director''s note prices it at twenty minutes of every responder''s time per episode. THE FIX: re-derive the suspect set from the gate''s ACTUAL red -- the named blocking test in .last_gate_blocking_tests.json and its blame trail (the commits touching that test''s file and the modules it imports) -- never from a frozen recency set. EXIT: (1) suspects are derived from the blocking node id, so an alarm with no recorded blocking test yields NO suspect list rather than a recency fallback -- _blocking_clause''s existing ''never degrades to a guess'' discipline extends to the suspect block; (2) R15 both ways -- a mutation that reinstates the recency ranking, and one that emits suspects when the blocking test is unrecorded, each kill a NAMED test; (3) the 0/N hit-rate is MEASURED and carried in the payload, so a re-derivation that is also useless is visible rather than assumed better (R12: the hit rate is a diagnostic, never a target, and no finding may be archived to improve it); (4) fail-open check -- an unreadable or stale gate-state file must read as ''unrecorded'', not as ''no suspects'', per the FAIL-SILENT killer pattern. DRAW ORDER: the director''s note sequences this AFTER the folded-site verification the same report proposes.'
  build_note: 'BUILT 2026-08-10, L0 -> L2, single tick. WHAT LANDED in background/process_run_complete.py: `filed_findings()` is DELETED and the alarm''s suspect block is now derived from the red -- `blocking_test_files()` (the node ids already recorded in .last_gate_blocking_tests.json, in every form pytest writes them: `FAILED p::t`, `ERROR p - msg`, bare), `first_party_imports()` (ast over the blocking test''s SOURCE, never an import -- the module that wedged the gate may be the one that cannot be imported; restricted to the eight repo packages, since blaming json or pytest is how a suspect list becomes noise again), `blame_commits()` (git log over that test file plus those modules, 7 days, bounded), and `linked_findings()` -- staged findings whose TEXT names something on that trail, replacing the mtime ranking. The state contract the supervisor''s RUNG-1 draw reads (`cited_findings`) is UNCHANGED; only what fills it moved, so ''FILED FINDINGS ALREADY HOLDING THE SUSPECTS -- draw these FIRST'' is now a true sentence. EXIT (1): no recorded blocking test => `wedge_suspects()` returns {} => NO suspect block and NO citation -- `_blocking_clause`''s ''never degrades to a guess'' extended, not re-argued. EXIT (4): unreadable, malformed and STALE gate state all reach the reader as UNRECORDED via the existing `last_blocking_tests`, never as ''no suspects''; parametrised over all three. EXIT (2), R15 THREE mutations DRIVEN, each shown killing a NAMED test, not asserted: (a) re-point the citation at mtime -> test_mutation_reinstating_the_recency_ranking_dies_here + 3 others fail (4 failed / 37 passed); (b) fabricate a suspect when the blocking test is unrecorded -> test_mutation_emitting_suspects_with_no_recorded_blocking_test_dies_here (2 failed / 18 passed); (c) score an unmeasurable episode as a hit -> test_an_unmeasurable_change_set_is_not_a_hit (1 failed / 19 passed). EXIT (3): the hit rate is MEASURED into .wedge_suspect_hit_rate.json at every evidenced episode close and rides in every payload, including ''not yet measured''. The measurement is deliberately NARROWER than the human 0/8 it replaces and the phrase says so: ''the repair touched a path this alarm had NAMED''. Three outcomes, one hit -- no list emitted and unmeasurable change set BOTH record hit=None and leave the numerator AND denominator alone, so the ledger cannot flatter itself. R12 is written into the phrase: a diagnostic, never a target, and it says out loud that a rate stuck at 0 means this re-derivation is as useless as the recency list. TWO CONTROLS FIRED ON THIS CHANGE AND WERE PAID, NOT SILENCED: the self-clearing-alarm census flagged .last_gate_blocking_tests.json and .wedge_suspect_hit_rate.json undispositioned -- both dispositioned `benign` with the reason (no episode-scoped field; the blocking record''s staleness fails in the SAFE direction, making the page say LESS rather than an episode look shorter); and test_background_worker''s retry exit test broke because `background_worker.subprocess` IS the stdlib module, so its global patch caught the new read-only git call -- the test now filters to publisher invocations, which is what it always meant. WHAT THIS DOES NOT DO: it cannot say the suspects are RIGHT, only that they came from the red. That question is what the hit-rate ledger exists to answer over the next episodes, and it starts at ''not yet measured'' rather than at a claim. DRAW ORDER NOTE: the director''s note sequenced this after the folded-site verification; the supervisor drew it on the scheduled tick and Rule 0 treats draw order as a DIAL, so it was built rather than held -- the sequencing bought nothing here (disjoint file_scope, no shared surface).'
