atom_id: OPS1_launcher_cutover_completion
simplifications:
- '2026-07-29 MINTED (worker tick) from DIRECTOR_RULING_FIX_DOUBLE_MESSAGING_2026-07-29.md. The ruling carried NO ''WORK THIS CREATES'' block, which is itself a defect in the ruling per DIRECTOR_RULING_WORK_DEFINITION_AND_COHERENCE section 4 -- so the work identifiable from its body is minted here rather than silently absorbed, and the block has been requested from the author. This is the RESIDUAL of that ruling: the ntfy-responder and staging-watcher cutovers were COMPLETED in 67a2e3ee6 (launched_by: systemd flipped, so start_worker.sh''s manifest-derived launch set no longer tmux-launches them) and the DOUBLE_LAUNCH reconciler status now alarms the whole class -- but SEVEN sibling daemons carry the identical half-done cutover shape. OBSERVED-WITH-EVIDENCE, not inferred: `python3 -m background.process_reconciler startlist` returns executor-daemon, background-worker, dispatcher, discovery-daemon, sim-runner, sanity-daemon, naive-organ, token-proxy -- i.e. start_worker.sh still tmux-launches all seven (plus the DARK executor) -- while background/process_manifest.yaml declares owner: systemd for each and their units are installed+enabled. Live reconcile is currently 0 alarms ONLY because those units are inactive; the moment one activates at boot the daemon runs twice. WHY THIS IS AN ATOM AND NOT A FIX-ON-SIGHT (SELF_INTERRUPT_DISCIPLINE): the machine is not blocked, and the 2026-07-17 director ruling requires cutovers ONE AT A TIME with a verify between -- a seven-daemon mega-flip is precisely the mistake that produced the half-done state. BUILD SHAPE per daemon: flip launched_by: systemd in the manifest, confirm it leaves the startlist, confirm the unit is the sole launcher via `ps`, confirm reconcile stays 0-alarm. R15 REQUIREMENT: the DOUBLE_LAUNCH control already exists and is mutation-tested -- the per-daemon evidence is that reconcile reports DOUBLE_LAUNCH BEFORE the flip when the unit is started alongside the tmux copy, and OK after; a flip verified only by a green suite is not acceptable, because the suite injects tmux_running directly and the PID-aware live reader is exactly what the tests did not catch the first time.'
- '2026-07-29 DISCOVER+FRAME DONE (LANE 3, doc-only; level 0->1). FRAME doc: docs/design/OPS1_LAUNCHER_CUTOVER_FRAME.md. THE SEVEN-DAEMON CLAIM HOLDS EXACTLY, verified against live state rather than taken from the atom text: all seven (background-worker, dispatcher, discovery-daemon, sim-runner, sanity-daemon, naive-organ, token-proxy) have a unit file installed, `systemctl --user is-enabled` == enabled WITH a live ~/.config/systemd/user/default.target.wants symlink dated 2026-07-20 12:03, `is-active` == inactive/dead (MainPID 0), AND all seven are returned by `process_reconciler startlist()`. NOTHING IS DOUBLE-RUNNING NOW: each of the seven has exactly ONE live process, ppid 886926 (the tmux server); the five migrated daemons each have exactly one, ppid 305 (systemd --user). Distinguished RUNNING from MENTIONING per the liveness-OR precedent -- my own grep invocations appeared in ps and were excluded on that test. Committed units vs installed units diff IDENTICAL for all 13, so it is the ARMING decision, not the unit text, that the repo gets wrong.'
- '2026-07-29 DISCOVER ROOT CAUSE (one line, not seven bugs): the repo carries TWO derivations of the same fact -- who launches this daemon -- and they disagree. `process_reconciler.startlist()` derives the tmux launch set from `launched_by`; `background/install_schedule.sh:53` derives systemd BOOT-START ARMING from `state` alone (`if [ "$state" = "enabled" ]`), ignoring `launched_by` entirely. So `bash background/install_schedule.sh` on a CLEAN CHECKOUT arms boot-start for exactly the daemons start_worker.sh also tmux-launches: RECONSTRUCT-FROM-REPO CURRENTLY REPRODUCES THE DEFECT, which is the sharpest IaC statement available and makes this a class fix (one predicate + one guard, applied through seven ordered verified steps) rather than seven manifest edits.'
- '2026-07-29 DISCOVER CORRECTS THE ATOM''S OWN WORDING (refuted clause, stated honestly): the atom says "each DOUBLES at the next boot" -- it does not, and the real exposure is LARGER. Nothing runs start_worker.sh at boot (crontab -l empty; no unit/profile has start_worker in ExecStart). At boot the tmux server dies and systemd starts the armed units == ONE launcher. The double arrives at the next start_worker.sh run AFTER that boot, because _start_session skips only on `tmux has-session` and a systemd-launched daemon holds no tmux session. AND NO REBOOT IS EVEN REQUIRED: docs/design/OPS1_DEPLOY_RUNBOOK.md step 3 literally offers `systemctl --user restart <session>.service # e.g. ... sim-runner, ...` -- running the project''s own runbook line today doubles sim-runner instantly alongside live tmux PID 419030. Exposure = boot + any stack restart, OR any single systemctl start of one of the seven.'
- '2026-07-29 FRAME -- SINGLE-LAUNCHER INVARIANT (SL) + cutover design. SL: for every manifest entry with state enabled|dark, the set of ARMED launchers has cardinality exactly 1 (systemd armed iff unit installed AND is-enabled, or currently active; tmux armed iff in startlist()); retired == 0; the seat is exempt. The key move: the existing DOUBLE_LAUNCH status counts RUNNING launchers (`unit_active and tmux_present`), SL counts ARMED ones -- today all seven satisfy running==1 and violate SL, which is exactly why the reconciler is silent about a defect that is fully present. ORDER (blast radius of a duplicate act, ascending -- prove the procedure where a mistake is cheap, spend the proven procedure where it is not; downtime is near-zero for all seven so it does not reorder): STEP ZERO class fix (arm on state AND launched_by; add LATENT_DOUBLE_LAUNCH guard; disarm the seven), then 1 token-proxy (port-bound singleton on :8801 -- a second copy CANNOT silently coexist, it fails to bind and dies loudly, so a procedure defect surfaces as a crash not as silent duplication), 2 naive-organ, 3 sanity-daemon (NTFY already deduped by notify.py), 4 discovery-daemon (6h period), 5 background-worker (first daemon that ACTS -- can double-publish), 6 dispatcher (THE organ whose duplication turned one director NTFY into two queued instructions), 7 sim-runner (largest blast radius both ways), 8 follow-on executor-daemon (unarmed+dark, not at risk, but needed for startlist() to reach empty). PER-DAEMON RULE: THE CUTOVER CROSSES THROUGH DOWN, NEVER THROUGH DOUBLE -- flip the declaration FIRST (declaration leads reality, so a concurrent start_worker.sh can no longer re-add the tmux copy), THEN kill the tmux session (reconcile reads MISSING: a loud bounded seconds-long gap, correct), THEN systemctl start. Cardinality 0 for seconds is a harmless transient; cardinality 2 for seconds is the defect itself and for dispatcher/background-worker/sim-runner can execute a duplicate act that outlives the window. Per-step ROLLBACK is the mirror of the step and takes under a minute (revert the manifest commit -> the daemon returns to the startlist -> start_worker.sh relaunches it; .stack_disabled is the durable escape hatch). No step is a one-way door.'
- '2026-07-29 FRAME -- R15 GUARD DESIGN, and a LIVE TAUTOLOGY FOUND IN THE EXISTING SUITE. tests/background/test_process_reconciler.py::test_no_declared_daemon_has_two_launchers_in_the_committed_manifest computes startlist() INTERSECT {launched_by==systemd} and asserts empty -- but startlist() is DEFINED as excluding launched_by==systemd, so the intersection is empty by construction for EVERY possible manifest. It cannot fail, and it is presented as "the declaration-level half" of the DOUBLE_LAUNCH fix: theatre. The new LATENT_DOUBLE_LAUNCH guard must therefore read the arming side from a source INDEPENDENT of launched_by (systemctl is-enabled / the default.target.wants symlink / install_schedule''s own predicate). MUTATIONS: (TAUTOLOGY) flip launched_by on a fixture daemon while leaving its unit ARMED -- the old test stays green (pin that explicitly rather than quietly deleting it), the new guard must go RED; opposite direction must stay green so it fires on the defect only. (FAIL-OPEN, each must RED) is-enabled returns ("",rc=1) / a "Failed to get unit file state" string / whitespace / enabled-runtime|alias|indirect; manifest missing launched_by entirely must default to tmux==armed; a unit file with no manifest entry must be reported not skipped -- an unreadable arming state is ARMED, fail-closed, because "I could not tell whether a second launcher is armed" is not evidence of safety. (FAIL-SILENT, each must RED) systemctl absent on every call; delete the guard''s call from reconcile()''s report path (assert the status appears in a LIVE `python3 -m background.process_reconciler` run, not only in a pure function); remove LATENT_DOUBLE_LAUNCH from ALARM_STATUSES; AND the already-present risk that this test module carries `pytestmark = pytest.mark.operational` while the publish gate runs `-m "not operational"` -- so the guard must additionally execute in a lane that actually runs it (the 5-min reconcile-watch.timer, whose armed-ness is itself declared in schedule_manifest.yaml). Assert both.'
- '2026-07-29 FRAME -- IaC GAP LIST (what is behaviour-determining and NOT declared in the readable repo). (1) BLOCKING/root cause: the seven default.target.wants symlinks are machine state derived from the WRONG predicate and checked by NOBODY -- process_reconciler reads unit `active` never `enabled`; schedule_reconciler DOES read `enabled` but only for schedule_manifest units (file-api, boot-announce, reconcile-watch, worker-tick) and touches process-manifest units solely via _process_manifest_unit_names() to SUPPRESS UNDECLARED_UNIT. (2) /etc/systemd/system/claude-tmux.service -- hand-installed 2026-06-11, root-owned, enabled, WantedBy=multi-user.target, ExecStart=tmux new-session -d -s claude ''claude --dangerously-skip-permissions''. The `claude` session it creates IS declared in process_manifest as owned by worker-seat-manager, so TWO mechanisms are armed to create the worker seat, one of which the repo has never heard of; schedule_reconciler._installed_se_units() globs ~/.config/systemd/user/*.service ONLY, so a system-level unit can never be flagged UNDECLARED_UNIT -- the invisible-cron class one directory up. OUT OF SCOPE here (it is the seat not the seven, and part of it is root-owned platform administration): REGISTER as a sibling atom, part (a) widen the undeclared-unit scan to /etc/systemd/system, part (b) decide+declare the seat''s single launcher (may be director-reserved). (3) start_worker.sh''s retirement when startlist() empties is stated in the manifest header but asserted nowhere. (4) _validate() enforces reason+flip for non-enabled states but knows nothing of launched_by -- a typo like `launched_by: systemD` loads cleanly and silently means "still tmux", a silent path straight into this defect; add membership validation. (5) install_schedule.sh says "install+enable is inert until systemctl start/boot" and the runbook repeats it -- the /boot clause is FALSE (enable at boot IS the start), and a doc that misstates its own guarantee is how this survived nine days.'
- '2026-07-29 FRAME -- BUILD READINESS: file_scope should widen from [background/process_manifest.yaml] to [background/process_manifest.yaml, background/install_schedule.sh, background/process_reconciler.py, tests/background/test_process_reconciler.py] -- the step-zero class fix and the LATENT_DOUBLE_LAUNCH guard cannot be built inside the manifest alone. Level proposed 0->1 and deliberately NOT 2: nothing is coded and nothing is deployed; this atom''s value is entirely in the seven flips actually landing.'
map_notes:
  name: SEVEN daemons still have a systemd unit installed+enabled AND remain in start_worker.sh's tmux launch set (background-worker, dispatcher, discovery-daemon, sim-runner, sanity-daemon, naive-organ, token-proxy). They are single-launcher today only because those units happen to be inactive -- each DOUBLES at the next boot, which is exactly the defect that made one director NTFY become two queued instructions on 2026-07-29. Complete each cutover (one at a time, per the 2026-07-17 one-at-a-time ruling) so DOUBLE_LAUNCH cannot recur.
