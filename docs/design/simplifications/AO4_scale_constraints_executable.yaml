atom_id: AO4_scale_constraints_executable
map_notes:
  build_note: 'L0->L2 2026-08-09. All five constraints MECHANISED, none dropped: 13 standing checks in tests/system/test_scale_constraints.py + 22 R15 proofs in test_scale_constraint_mutation.py (34 passed + 1 xfailed for the two modules; 84 passed + 1 xfailed for the whole tier). Probe+assertion live in scale_constraints.py and are imported VERBATIM by both, so the mutation runs the assertion that ships. Cuts are in the PRODUCTION SOURCE (generate_bill made positional / stateful; as_known_at made append-ordered; _substream collapsed to one shared generator; pending surface emptied; latency made estimated-not-measured), except where the check''s subject IS a file population. BOTH DIRECTIONS where it matters: the RNG scan is proven NOT to fire on random.Random(seed) (false-positive jams the pipeline), C-S4 is proven to go GREEN on a clean fixture (a control that can only fail is a wedge), and every population check is proven to FAIL when pointed at a missing package or an empty map (an unavailable check is a FAILED check). TWO REAL FINDINGS, not theatre: (1) C-S4 answers FINDING 2 by measurement: the duplicated state files are LEGITIMATE publish-time snapshots via tools/mirror_github_pages.py''s declared register, and all four declared pairs AGREE at HEAD -- finding closes. Getting there cost one corrected measurement worth keeping: the first version compared the WORKING TREE and went red on all three, which is the pipeline mid-pass (generators write site/state at ~:935, the mirror copies to docs/state at ~:1269), not drift; a control over a multi-step pipeline must be sampled where the pipeline is quiescent, so it now reads the COMMITTED blob -- which is also what GitHub Pages actually serves (R11) -- with its own non-vacuity proof that it does not fall back to disk. (2) C-S3 residual: resolve_decision_request() accepts resolved_at == submitted_at and records 0.0s, so A4''s DD-mandate same-step exemplar is still writable against the mechanism built to replace it -- carried as xfail(strict=True) so it FAILS the day it is fixed; out of file_scope, queued not fixed on sight. CLOSES the addendum''s own open DoD item 4 (RNG substream discipline, deferred since 2026-07-13): zero modules draw from the process-global stream across 620 modules in simulation/sim/company/saas, and substream independence is now asserted rather than asserted-about. Report-only landing on its OWN marker (scale_report_only, not the join tier''s -- one marker would promote both tiers together); complement expression widened with it so the tier is deselected from the content gate and covered by the operational signal, never uncovered. Residuals written down rather than silent: docs/design/SCALE_CONSTRAINT_CHECKS.md §3 (C-S1 partiality not mechanisable at the class level; C-S2 run-level replay not duplicated here; C-S5 enforces that the question was answered, not that the answer is true -- 23 company-side L3+ atoms owe declarations, listed and frozen-pinned).'
  origin_note: 'These constraints are currently ASPIRATIONAL and there is MEASURED DRIFT the director cites by name: the billing ledger existing as two identical 2.3MB copies (FINDING 2, ADVISOR_FINDINGS_STRUCTURAL_AUDIT_2026-08-04) is the persistence constraint C-S4 not holding TODAY. So this is not a speculative guard -- one of the five is already breached and the check should fail on landing. That is the correct outcome, not a reason to soften the check (R12). The ''listed as not-mechanisable'' escape is a real option but it must be an explicit written list, never silence -- an unmechanised constraint that is simply not mentioned is the prose-only decay MAKE_IT_STICK forbids.'
