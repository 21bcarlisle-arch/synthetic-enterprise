simplifications:
- '2026-10-05 MINT NOTES (DIRECTOR_CANON_THE_PRIORITY_ORDER_2026-10-05 step 2, company half). WHAT IS ALREADY BUILT AND IS REUSED, NOT RESTATED: D1_bill_correctness (closed, L3) owns what a bill must say and that its arithmetic is right -- D48 does not re-check bill content. D3_catchup_rebilling (closed, L3) owns the catch-up rebill when an estimated read is replaced by an actual (NHH profiling) -- D48 reads the size and timing of those true-ups as one KIND of billed-versus-used gap; it does not rebuild the rebill. E3_accrual_restatement (closed, L2, saas/ledger.py + saas/reporting/annual_report.py) owns the period-end unbilled-revenue accrual and prior-period restatement -- D48 grades that accrual against what the later actual reads showed, it does not compute a second accrual. WHAT IS NEW: a per-kind measure (estimated vs actual reads, true-up size, back-billing limit, accrual error) built only from what crosses company/interfaces/sim_interface.py -- reads, read types, settlement volumes the supplier receives -- never the world''s true consumption. KNOWLEDGE DEPENDENCY: the canon item asked depends_on to name the step-1 knowledge note (docs/market_research/unbilled_energy_and_revenue_assurance.md). The map contract (tests/design/test_maturity_map_contract.py (c)) admits only atom ids in depends_on, and no atom carries that note except W2_36, whose file_scope opens with it; the note is not yet written (the step-1 knowledge item is held in /var/tmp/se-know as of this mint). So the dependency is carried by couples_with W2_36 plus this record: a D48 builder reads that note FIRST and, if it is still absent, the kinds are a gap to file, not constants to pick. depends_on stays [] because the company half can be measured against the read/true-up behaviour the world already produces (D3) before W2_36 adds theft, meter faults and the change-of-tenancy gap.'
- '2026-10-16 ELECTRICITY PRE-2020 YEAR-END UNDER-BILL ATTRIBUTED: neither the season profile nor a 2020 code change. One account (C7: unread EV home, no registry EAC, so TDCV-billed for 50 months, +41,778 kWh true-up on 2020-03-31) sits in every pooled K1 month-end grade 2016-01..2020-02. Without it the grade is -2.5%..+2.2%. Estimator cleared. Open: K1 states no concentration (the largest run share is proposed), and the world half (EAC-less HH account; legacy_pc1 homes +11..22% over their own EAC) is routed. WORKER_FINDING_D48_ELECTRICITYS_PRE_2020_UNDER_BILL_IS_ONE_UNREAD_EV_HOME_BILLED_ON_THE_TDCV_FALLBACK_2026-10-16.md.'
- '2026-10-21 DRAWN WITH NOTHING BUILDABLE IN SCOPE (worker). The company half is built; L3 waits on three things outside company/billing: (1) the first run whose producing commit carries 4d6d5ab91 (release_on_measured_rate) -- grade it against WORKER_PREREG_D48_THE_FIRST_RUN_CARRYING_THE_HELD_BILL_RELEASES_2026-10-21.md''s corrected prediction (no held gap over 2 months on PROS-2017-0336, none over 3 on the book, largest catch-up under GBP 1,000); the run at 9ca972774 lacks it, and the sim-runner is deferring to resident long jobs; (2) the world meter-exchange flip (meter_reads.SMART_METER_EXCHANGE, landed off in a60376f88), which waits on the value-arms grades; (3) a second blind Expert Hour after (2). K6 billed-vs-settled stays a GAP and is EP5''s, not D48''s. A draw before (1) exists has nothing to do here: check `git merge-base --is-ancestor 4d6d5ab91 <run producing commit>` first. CORRECTED 2026-10-21 23:40: its item (1) is spent. The release_on_measured_rate grade landed at f2db4aa45 (retnet off arm, 9 held, catch-up bound refuted). L3 now waits on (2) alone, then (3). The flip''s own trigger is four arm grades. Three have landed: per-customer c576f5f98, opex-credit e9e2fbe71, bad-debt switches-off a8e06397c. The fourth, the retention-netting net arm (unit longjob-retention-nets-bad-debt-arms-1ac35d918), was still running at 23:40Z. Before a D48 draw does anything, check that the net arm has been graded (git log --grep retention), and stop if not. The flip moves the world digest, so it also re-takes the value arms. It sits in W2, which is held behind that lane''s BLOCKING crisis-bad-debt finding. Ask whether that finding is still open before flipping.'
