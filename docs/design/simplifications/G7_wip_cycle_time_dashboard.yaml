atom_id: G7_wip_cycle_time_dashboard
simplifications:
- '2026-07-16 AUTHORED AS PROPOSAL (G6_method_lens_audit output, Kanban lens). Make flow/cycle-time visible and cap WIP by VERIFIED capacity (per PER_ATOM_INTEGRATION guardrail: throughput is bounded by verification, never raw fork count). DISCOVER/FRAME workable now; director ranks.'
- '2026-07-16 H17 Lane-2 SITE BUILD L0->L1: Built the WIP + cycle-time flow (Kanban) door. tools/generate_wip_flow_data.py computes WIP live from docs/design/maturity_map.yaml (99 atoms: 29 concurrent-BUILD / 26 harden / 44 idle, plus per-lane build/harden/idle split across 13 lanes) and REUSES tools/effort_calibration.py for cycle-time -- it imports git_log_transitions/compute_durations/calibration_by_lane rather than reinventing the git mining, giving per-lane mean/median cycle-time (55 parsed transitions, 17 durations) and throughput (transitions/day whole-history + trailing 7/14/30-day windows). Output written to site/data/wip_flow.json. site/wip-flow/index.html follows the method-casebook door pattern: theme-aware (prefers-color-scheme dark + data-theme light/dark), a @media(max-width:640px) mobile pass, KPI tiles, a Kanban-columns board, per-lane WIP bars, cycle-time rows with an R14 basis label (clock = git commit-time between level-transition commits), throughput, and the stated Kanban PRINCIPLE that WIP is capped by VERIFIED CAPACITY not fork count (verification runs once per integration, never fans out), with all flow metrics R12-labelled DIAL-not-target. Self-verified GREEN: site/wip-flow/test_wip_flow_door.py (10 tests -- generator real-keys/consistency, effort_calibration reuse, R14 clock, R12 dial-label, R11 rendered-pixel checks via the Node/vm harness, R15 independence-mutation + mobile-pass structural guard) + tests/tools/test_site_structure.py (14 tests) = 24 passed. HONEST GAP: live-pixel R11 verification (fetch the deployed GitHub-Pages surface and assert the rendered value) is PENDING -- no network in this fork -- which is the L1->L3 residual, NOT an L1 blocker; L1 bar (surface built + wired from real sources + structurally/render tested green + epistemic-clean) is met. This door is not yet linked from other doors'' navs (orchestrator/site-nav follow-on).'
- '2026-07-29 R15 HARDEN, REAL DEFECT FOUND AND FIXED (class audit drawn on G5_effort_sizing_discipline, landed here because G7 owns the code -- see G5''s trail): tools/generate_wip_flow_data.py::_throughput anchored its trailing 7/14/30-day windows on ts[-1], THE LAST TRANSITION''S OWN TIMESTAMP, so a window measured ''the N days before the last transition'', never the last N days. Consequence on a LIVE PUBLISHED surface (site/wip-flow/ ''Trailing 7 days: 19 transitions / 2.71/day''): once level transitions stopped, the published throughput FROZE at its final healthy value and could never decay -- a build stalled for a month rendered pixel-identical to one running at full velocity. A flow signal that cannot fall is not a flow signal (same law as G5''s honest-signal rule: the ABSENCE of work must be visible, never read as a benign value). Proven live before the fix: 19 transitions dated 60 days back still reported 2.71/day for trailing-7. FIX: windows anchored on wall-clock generation time (injectable `now` for tests), anchor=max(now, ts[-1]) so clock-skewed/future-dated commits are not silently dropped instead; new `hours_since_last_transition` + `window_basis` (R14, the windows carry their own clock, distinct from the cycle-time clock) published and RENDERED as a ''Since last transition'' KPI plus a stated-basis line (R11). R15 mutation-proven: restoring anchor=ts[-1] fails test_trailing_windows_decay_to_zero_when_transitions_stop (19 != 0) while the independence test (a genuinely live build must NOT read 0) and the skew test still pass -- 3 new invariant tests + 2 render/basis tests, 15 pass in site/wip-flow/test_wip_flow_door.py, 399 site tests pass. DIAL not target throughout (R12): the decay is a diagnostic, never a gate.'
- '2026-07-29 CORRECTION to the R15 HARDEN note above, filed same day, before any claim left the repo: that note called site/wip-flow/ a ''LIVE PUBLISHED surface''. It is not. Checked after the fix: site/_redirects 301s /wip-flow and /wip-flow/* to /proof/ (RC7 DIRECTOR_RULING_IDEA_FIRST_EXTERNAL_REGISTER 2026-07-24 -- the page rendered internal vocab, stays in-repo noindex and canonically unreachable). The only thing actually served is site/data/wip_flow.json, directly fetchable and consumed by no reachable page. So the frozen-throughput defect was REAL in mechanism (a signal that cannot fall) and real in the published JSON, but it was NOT in front of the director. Severity: internal-register, not public-claim. The fix and its R15 mutation proof stand unchanged; only the reach claim was overstated.'
