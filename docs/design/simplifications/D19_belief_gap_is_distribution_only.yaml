atom_id: D19_belief_gap_is_distribution_only
map_notes:
  origin_note: 'Minted 2026-08-10 by H27 Expert Hour #3, whose measurement this atom exists to close (docs/staging/WORKER_FINDING_THE_BELIEF_GAP_IS_BLIND_TO_WHO_HOLDS_THE_BELIEF_2026-08-10.md, commit 0470e50f9): permuting per-case arrears-severity labels moves per-case agreement 0.9287 -> 0.6432 and leaves the published belief gap at 0.0713 to machine precision. PROVENANCE NOTE, written 2026-08-10 by the H41 repair and NOT the original text -- the original never existed anywhere. The mint hand-wrote `notes_rehomed: [origin_note]` into the map without creating the store file, so the declared note''s text never reached the store and is not recoverable from git (verified: no D19 store file is tracked at any commit). The declaration is repaired here rather than deleted, because the defect worth keeping visible is the mint path itself: a hand-written rehome declaration with no store write is a LOST RECORD that nothing catches until the contract test reds. It reddened tests/design/test_atom_notes_store.py::test_declarations_match_the_store at HEAD 0d0840168 and -- sorting before tests/design/test_simplifications_store.py under the publish gate''s `-x` -- was the gate''s actual FIRST red, ahead of the map size ratchet the originating finding named.'
  build_note: 'BUILT 2026-08-10 (worker tick, L0->L2), closing the measurement H27''s Expert Hour #3 made: the belief HEADLINE is now a BALANCED PER-CASE severity error and the permutation sweep -- this atom''s own written acceptance criterion -- comes out MOVED. gap_metric.belief_measures scores undercall_rate over the accounts that COULD be under-called and overcall_rate over those that COULD be over-called, each on its own denominator (D11''s shape, D7''s denominator rule: no rate carries a prevalence normaliser, and a case already at the bottom of the scale is not counted in a denominator for an error it cannot suffer). `order` is a REQUIRED argument, never inferred from the labels a run happened to produce -- inferring it would let a run where nobody reached the top of the scale silently redefine what over-calling means. MEASURED, seeds 7/11/23 at n=600, R12 (the reshape was designed from the defect, never fitted to a value): headline 0.0700->0.1338, 0.1033->0.1950, 0.0733->0.1325. The movement is all reshape and no company change -- the denominator is the ~26% of accounts that could be under-called, not the whole book. THE DEGENERATE IS DEAD: permuting every per-case belief now scores 0.5007/0.4934/0.5003, i.e. exactly the no-skill baseline g0=0.5, where before it scored the real company''s own number to machine precision. Both severity-blind rules (call everyone `normal`, call everyone `high`) also land on 0.5. THE TV FIGURE IS RENAMED, NOT DELETED: it is published as its own dimension `belief_population_mix` -- ''does the company have the right MIX?'' is a real question a credit committee reads, and what was wrong was publishing it under a name that reads as a per-case error rate (on a one-directional book it even EQUALS one, which is what hid it). Keeping it also keeps AGGREGATE_SCORING_CONTRACT differential rather than a blanket ban: after the reshape every other dimension is per-case, and a register whose entries all land on one side is a blanket rule wearing a register''s clothes. It carries its own as_of declaration rather than inheriting `belief`''s, because a dimension that shares another''s inputs is exactly the one an author assumes is covered. ONE DIRECTION READS 0.0000 AND IS PROVEN ABLE TO FIRE (R15, the shape that lets a dead measure pass for a clean one -- D11''s `missed_failure_rate` is the same shape one dimension over): this book''s company only ever UNDER-calls, so overcall_rate is 0.0 on every seed over a non-empty denominator of 564/575/566 accounts. Registered as a property of the population, not banked as precision, and mutation-proven: escalate one account a step it did not earn and the rate moves and the headline worsens. Where a direction''s POPULATION is empty the rate is None and the headline is None -- never 0.0, never the surviving direction alone. R15 BOTH WAYS, mutating the SOURCE: reverting score_triad''s headline to belief_gap fires 5 tests including the acceptance criterion; the existing lying-declaration mutation now covers four dimensions. ALSO CLOSED ON THE WAY, a fail-silent hole in the D16 phrase sweep: `_rendered_dimension_text` was a HAND-MAINTAINED map of published dimensions, so a newly published one simply would not appear and the sweep would skip it and still pass. The set is now DERIVED from the scored result and asserted against it -- proven by deleting a dimension from the map, which fires three tests. OPEN AND REGISTERED, not fixed here: the D8 remittance counterfactual''s _ATTRIBUTED_MEASURES covers ageing and detection components only. Before this reshape the belief dimension had no per-case direction rate to attribute; it does now, and whether the ambiguous-remittance channel explains any of the under-calling is a D8 question this build declined to answer on its owner''s behalf. EVIDENCE: 76 green in tests/tools/test_couple_w2_11_d5.py (9 new), 696 green across every file touching gap_metric and the pairs that call belief_gap.'
