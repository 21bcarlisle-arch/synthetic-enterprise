- '2026-07-25 HARDEN red-team (self-refill worker tick, level 3->3, at target): re-ran the exit tests green, then RED-TEAMED the residual reconciliation control and found a real FAIL-OPEN (R15 killer pattern 2) in residual_is_material -- its strict-dominance requirement (|residual| > every named driver) meant a materially dropped/renamed cost line did NOT fire whenever a LARGER legitimate driver co-occurred in the same year. Concrete repro: a +£580k genuine gross-margin swing masking a separately-dropped £500k cost line -> residual -£500k but residual_is_material()=False (the exact provenance-break the control exists to catch, passing silently). FIX (additive, decouples two conflated concerns): new residual_breaks_reconciliation() = |residual| > materiality floor with NO dominance requirement -- the true reconciliation-integrity tripwire; residual_is_material() kept, now documented as the narrower ATTRIBUTION-dominance gate that governs only dominant_driver''s "other (unexplained)" label. Consumer effect (R11, no orphan): saas/reporting/annual_report.py::_section_net_margin_bridge now flags "<driver> unreconciled" on every broken row + emits a RECONCILIATION BREAK banner, so a break masked by a larger driver is visible not absorbed. R15 mutation-proven BOTH ways: neutering residual_breaks_reconciliation to return False reds 3 new control tests; restored clean. Verified no false positive on real 2016-2025 data (residuals ~£0, no flag/banner rendered). 47 bridge tests (was 42) + full saas/reporting suite (923) green; epistemic verifier PASS (492 files). loop_stage stays harden.'
