atom_id: G11_activity_cost_utilisation
simplifications:
- '2026-07-16 REGISTERED from ACTIVITY_COST_AND_UTILISATION.md (director-raised, P1). Answers "is the machine spending resources on PRODUCT or on ITSELF?" — currently a feeling, made a decomposition. Two resources tracked SEPARATELY (elapsed time = utilisation denominator; tokens = cost denominator; they diverge and the divergence is signal). Taxonomy: PRODUCTIVE/product, PRODUCTIVE/discovery (investment), WASTE/self-repair, WASTE/idle, WASTE/hit-limit, WASTE/rework, WASTE/idle-waiting-on-director. Metrics: productive-%, cost-of-self-maintenance (must trend DOWN or the harness is a treadmill), rework-rate, value-per-problem, idle-on-director. Build from data that ALREADY exists (git timestamps, commit-class tags, the 20-turn/window token meter, deadman/health logs) — a REPORTING layer, not new instrumentation. GUARDRAIL (prominent, same law as G5 sizing): utilisation is a DIAGNOSTIC never a TARGET — 40% productive-and-correct beats 90% busy-and-wrong; never tune the machine to make the number look good (corrupts the actuals). Sibling to G5 (effort remaining) + G6 (method lens) + G7 (WIP/flow, already L1); with G5 gives a live forecast (productive velocity / remaining sized effort). Surfaces on the Method door.'
- '2026-07-16 BUILD L0->L2 (SITE lane-2). Reporting layer over EXISTING data (git history + token-log.md + action_needed_register.json), no new instrumentation. tools/activity_cost.py classifies 4083 real commits into the full 7-class PRODUCTIVE/WASTE taxonomy via a documented ordered ruleset (rework/hit-limit/director/level-transition/fix-domain-split/discovery/product/file-domain-fallback -> unattributed), attributes elapsed TIME (git commit clock, inter-commit gap capped at 30min, excess->WASTE/idle) and TOKENS (token-log headings) SEPARATELY -- the divergence is the signal. All 5 metrics computed + surfaced on the Method door in a new Activity-Cost section (separate activity_cost.json fetch) and PIXEL-VERIFIED live (productive-time 40.7% / cost 74.6% / divergence -33.9pp / self-maint 7% time & 25.4% tokens / rework 0.3% / value-per-problem 6.89 / idle-on-director 2 open). GUARDRAIL ''DIAGNOSTIC never a TARGET'' in docstring + JSON + rendered banner. FAIL-HONEST proven: empty history/tokens->insufficient_data, missing register->no_register, unclassifiable commit->unattributed (excluded from every denominator, never fabricated 0). Generator wired into process_run_complete.py regen + commit-list (R11 no-orphan-transition). 23 pure-fn tests + 6 door render/R15 tests green (node present, real not skipped); no regressions (84 total incl siblings). HELD AT L2 not self-certified L3: the classifier''s FRAMING choices (esp. Auto-process-run-complete=PRODUCT, the fix product-vs-plumbing split) materially move productive-% yet are unreviewed design judgment, and classifier accuracy is not validated against a hand-labelled commit sample (no ground truth). REMAINS for L3: (1) cold-eyes/expert-hour review of the taxonomy-mapping framing; (2) accuracy check vs a hand-labelled sample; (3) token attribution is coarse (session-level headings, ~34 entries) -- a stronger token->activity source would tighten the cost denominator.'
- '2026-07-16 H17 HARDEN (cold-eyes Expert-Hour fork): PROMOTED L2->L3. FRAMING VERDICT on the two named choices: (a) ''Auto-process-run-complete = PRODUCT'' is DEFENSIBLE -- it is the product OPERATING and publishing its settlement output (a real supplier''s billing run producing statements is product output, not overhead); flagged as the highest-LEVERAGE call (the single largest PRODUCT contributor and the one place the classifier is generous), but sound. (b) The fix product-vs-plumbing split (fix touching product-domain files = product, else self-repair, decided by file-domain plurality) is PRINCIPLED; its only weakness is a plurality-flip when a product build also touches tooling/observability files (declared below). CRITICAL cold-read finding: the skeptic question ''does any rule flatter its own productive-%?'' -- NO, the opposite. A stratified 64-commit hand-labelled audit found the classifier ERRS CONSERVATIVE (under-counts productive), and found a real CLASS-level defect (R10): keyword false-positives contaminated the rare WASTE classes -- [ADVISOR-STAGED] policy/directive docs whose PROSE quotes ''revert''/''two-strike''/''escalation''/''quota''/''one-way door'' were mis-billed as WASTE/rework|hit-limit|idle-on-director, and energy-domain terms in product subjects (''Ombudsman escalation'') + plumbing fixes (''fix escalation gap'') were stolen into idle-on-director. DURABLE CLASS-FIX made at the classifier (not instance patches): (1) a staging-directive guard FIRST -- a commit whose files are all under docs/staging/ is framing INVESTMENT classified by location, never by the policy prose it quotes; (2) director-block now requires the word ''director'' AND a block cue, and is checked AFTER the fix rule so a plumbing fix that merely mentions the director is self-repair (the honest metric source for idle-on-director is the escalation register, not commit subjects); (3) hit-limit tightened to actual-interruption markers so BUILDING/FIXING usage-limit handling is self-repair, not a hit-limit event. Effect: rework-rate 0.3%->0.08% (11->3 commits), idle-on-director commit-count 29->1, hit-limit 6->0, productive-time only 40.7->41.8% (+1.1pp -- fix justified per-commit by reading them, direction incidental, headline barely moved; 331 commits now route via the staging_directive rule, most already productive). ACCURACY CONTROL BUILT (clears REMAINS-2): tests/tools/test_activity_cost_accuracy.py -- a repeatable, hand-labelled fixture of 64 real commits stratified across all classes, labelled INDEPENDENTLY of the classifier by reading subject+files against the taxonomy. Post-fix agreement: COARSE (productive/waste/unattributed -- the axis the headline depends on) 93.8% >= 0.90 threshold; FINE (full 7-class) 85.9% >= 0.80 threshold. Thresholds differ on purpose (coarse held high because it drives the headline; fine held lower because product<->discovery and which-waste-bucket sub-fuzz do not move the headline). R15 mutation-PROVABLE FAIL: a degenerate all-product classifier, an all-waste classifier, and a corrupted-label fixture all drop below threshold (proven by passing mutation tests); fail-CLOSED on missing git history (unresidable sha = failed check, never skipped); every miss must be a documented residual (undocumented-disagreement test guards against new error modes). This CLEARS REMAINS (1) framing-reviewed+durably-improved and (2) accuracy validated. RESIDUAL DECLARED SIMPLIFICATIONS (R10, all CONSERVATIVE or productive<->productive, none self-flattering): product features named ''...Register''/''Coverage Sprint'' route to discovery (productive<->productive, headline unaffected); product builds touching mostly tooling/observability files flip to self-repair (conservative under-count); and REMAINS-(3) token attribution stays coarse (session-level headings, 7 parsed / 17 unparsed of 24 entries) -- accepted as a named residual R10 simplification at L3, fail-honest (unparsed excluded, never fabricated). Tests: 34 pre-existing + 3 new class-fix unit tests + 8 accuracy/mutation tests = 45 green (site/method door render R11-verified against the regenerated activity_cost.json). VERDICT: framing sound (durably improved), accuracy control passes with margin -> L3. PROCEED per the SITE1 delegate precedent (678aead8e): a reversible cold-eyes review gate delegated to this fork, NOT a one-way door, no escalation; demotes freely if the orchestrator disagrees. maturity_map.yaml untouched (F1); no commit/push (orchestrator integrates).'
- '2026-07-18 HARDEN red-team (orchestrator, L3->L3 held, observed-with-evidence R9) -- a REAL fail-open in this atom''s own waste taxonomy, PROVEN by this session''s data. FINDING: G11 is COMMIT-CENTRIC (time attribution from git commit timestamps + subjects/changed-files; token attribution from token-log). So WASTE THAT PRODUCES NO COMMIT is invisible and G11 fail-opens toward ''looks productive''. CONCRETE PROOF this session: I mis-killed TWO live gap forks (~40min wall + ~190k fork tokens) that committed NOTHING before being TaskStopped, then re-dispatched -- pure WASTE/rework. But the live activity_cost.json shows WASTE/rework = 0 TOKENS and rework_rate 0.25% (10 commits): the killed forks left no commit so git-time misses them entirely, and the re-dispatch''s single successful commit reads as normal PRODUCTIVE/product. value_per_problem (7.09) is likewise OVERSTATED because fork-kills aren''t counted as problem-commits. This is the R15 pattern G11 exists to fight -- a waste measure that cannot see its own most expensive waste class (fork churn). CLASS FIX (R10, at G11 BUILD): attribute FORK-LIFECYCLE events (dispatch->kill/reap->re-dispatch) as WASTE/rework from the task/agent lifecycle data + fork token usage (already emitted in task-notification <usage>), not only from git commits; a killed fork with N tokens and no commit must land in WASTE/rework, not vanish. Mutation test: a synthetic kill+re-dispatch with no commit must raise rework, not read as product. Level held (HARDEN never moves the cell); registered not fixed (SELF_INTERRUPT). Also note honestly: this red-team is itself the kind of self-maintenance G11 tracks.'
- '2026-07-27 HARDEN re-verify (Rule-0 dial yielded -- at-target draw; L3->L3 held; observed-with-evidence R9). Exit tests re-run 26/26 green. Accuracy+mutation controls (test_activity_cost_accuracy.py) re-run 8/8 green against LIVE git history: coarse 0.938 >= 0.90, fine 0.859 >= 0.80; all three R15 mutations still TRIP the gate (all-product classifier, all-waste classifier, corrupted-label fixture) -- the control demonstrably still FIRES. RED-TEAMED the IDLE_GAP_CAP_SECONDS=30min DIAL against current live history (5,503 positive inter-commit gaps): measured p90 commit-gap = 15.9min, CONFIRMING the docstring''s ''~15min p90'' calibration STILL HOLDS as the repo grew (cap sits ~p95; only 3.7% of gaps exceed it). 43.3% of total gap-HOURS clip to WASTE/idle -- expected/by-design, the long overnight tail (p99=177min) carries most wall-clock and is idle, not work; NOT a fail-open. No drift, no fix warranted at the classifier. The 2026-07-18 fork-churn fail-open (commit-centric blindness to killed-fork waste) remains the OPEN BUILD-gated class-fix and was deliberately NOT actioned here (idle atom = BUILD-gated; SELF_INTERRUPT queue discipline).'
- '2026-07-27 HARDEN red-team #2 (Rule-0 dial=3 yielded -- at-target draw; L3->L3 held; observed-with-evidence R9). NEW self-flattering FAIL-OPEN found in the classifier, proven against live history. FINDING: `_PRODUCT_RE` matches ''harden'' and fires at step 8 -- BEFORE any file-domain split -- so a HARDEN commit touching ONLY harness/infra files (background/, tools/, .claude/, docs/observability/) is billed PRODUCTIVE/product. The sibling ''fix'' keyword already gets a product-vs-plumbing domain split (fix_of_product / fix_of_plumbing); ''harden'' does NOT. Consequence: the Rule-0 self-refill''s OWN harness-hardening treadmill reads as PRODUCT. Live evidence: 145 HARDEN-subject commits, of which 23 are classed PRODUCT while their files are INFRA-domain (many are ''.harden_cooldown.json'' rotation stamps + background/ tooling hardens). The corrected domain-split (give ''harden'' the same split as ''fix'') moves productive-time only -0.4pp (48.8->48.4) but RAISES self-repair +4.9h (78.8->83.7h) -- i.e. the current rule is SELF-FLATTERING and specifically HIDES harness-treadmill work from cost-of-self-maintenance, the very metric this atom declares ''must trend DOWN or the harness is a treadmill''. This CONTRADICTS the H17 review''s ''no rule flatters its own productive-%'' / ''errs conservative'' verdict (that audit predated the current Rule-0 HARDEN-treadmill volume). PINNED EXECUTABLY (not prose-only, MAKE_IT_STICK): tests/tools/test_activity_cost.py::test_REDTEAM_harden_of_harness_is_self_maintenance_not_product, xfail(strict) asserting a harness HARDEN -> WASTE/self-repair and a product HARDEN -> product; when the BUILD fix lands it flips to XPASS(strict) and forces this note + the pin to be retired (W2_5 precedent). CLASS-FIX (R10, at G11 BUILD, director/twin-gated per loop_stage idle): extend the product-vs-plumbing domain split to the ''harden'' keyword -- QUEUED, deliberately NOT fixed on sight (SELF_INTERRUPT). Also re-verified this pass: exit tests 26/26 green + 1 new xfail; accuracy controls 8/8 green vs live git (coarse 0.938>=0.90, fine 0.859>=0.80, all 3 R15 mutations still trip). The 2026-07-18 fork-churn fail-open remains separately OPEN + BUILD-gated. level_current unchanged (R16 -- no self-bump).'
- '2026-07-27 HARDEN red-team #3 (Rule-0 dial=3 yielded -- at-target draw; L3->L3 held; observed-with-evidence R9). A SECOND self-flattering FAIL-OPEN, DISTINCT from and EARLIER than #2, proven against live history. FINDING: `_ARROW_RE` (r''->\s*L\d+'') matches the SAME-LEVEL HOLD pattern ''Lx->Lx held'' -- e.g. ''(L2->L2 held)'', ''(L3->L3 at-target)'' -- and fires at STEP 3 (level_transition -> PRODUCTIVE/product) BEFORE the fix/harden/file-domain steps. But ''Lx->Lx held'' is EXPLICITLY NOT a level bump (the rule''s own comment: ''a landed level BUMP is product output''). Because step 3 short-circuits, the #2 harden-domain-split fix (at step 8) can NEVER reach these -- so this is an INDEPENDENT hole, not a duplicate of #2. Live evidence: 31 held-non-bump commits billed level_transition/PRODUCT, 25 touching ONLY infra/mixed files (the Rule-0 HARDEN treadmill''s own ''chore(harden): ... (Lx->Lx held)'' cooldown stamps). Isolated correction (a same-level arrow is NOT a transition; let it fall through the ruleset) moves productive-time -0.1pp (49.1->49.0) and RAISES self-repair +0.9h (79.1->80.0h) -- same SELF-FLATTERING direction as #2, and STACKS on it. Like #2 this HIDES harness-treadmill work from cost-of-self-maintenance, the metric the atom declares ''must trend DOWN or the harness is a treadmill''. PINNED EXECUTABLY (MAKE_IT_STICK): tests/tools/test_activity_cost.py::test_REDTEAM_held_same_level_arrow_is_not_a_transition, xfail(strict) asserting a held infra HARDEN -> WASTE/self-repair while a GENUINE bump and a held PRODUCT-file commit stay product (no over-correction); flips to XPASS(strict) when the BUILD fix lands and forces this note + pin retired. CLASS-FIX (R10, at G11 BUILD, director/twin-gated per loop_stage idle): the level_transition rule must match a GENUINE bump only (target level > source level), never a same-level hold -- QUEUED, deliberately NOT fixed on sight (SELF_INTERRUPT). Also re-verified this pass: exit tests 34 passed + 2 xfail green; the #2 harden hole and the 2026-07-18 fork-churn hole remain separately OPEN + BUILD-gated. level_current unchanged (R16 -- no self-bump).'
- '2026-07-28 HARDEN re-verify (Rule-0 dial=3 yielded -- at-target draw; L3->L3 held; observed-with-evidence R9). Re-ran against LIVE 07-28 history (5,653 classified commits, grown since the 07-27 passes): exit tests 34 passed + 2 xfail green -- the #2 harden-domain-split and #3 same-level-arrow pins STILL xfail(strict) = still OPEN, not silently flipped; accuracy+mutation controls 8/8 green vs live git (coarse 0.938>=0.90, fine 0.859>=0.80; all 3 R15 mutations -- all-product, all-waste, corrupted-label -- still TRIP the gate, the control demonstrably still FIRES). Live Method-door surface current+coherent (activity_cost.json generated 2026-07-28T05:41:48Z): productive-time 49.3% / cost 74.6% / divergence -25.3pp / self-maint 6.8% time & 25.4% tokens / rework 0.46% / value-per-problem 7.9 / idle-on-director 0 open. The atom''s OWN guardrail -- cost-of-self-maintenance ''must trend DOWN or the harness is a treadmill'' -- is SATISFIED on live data: self-repair %-of-time trends 7.4% (30d) -> 7.3% (14d) -> 4.0% (7d). SATURATED for HARDEN: the three self-flattering fail-opens (#2 harden-domain-split, #3 same-level-arrow, 2026-07-18 fork-churn) remain the ONLY forward paths and are ALL BUILD/director-gated per loop_stage idle (SELF_INTERRUPT queue discipline) -- deliberately NOT actioned here, no 4th finding accreted (rest-with-proof; do not accrete an Nth guard on a saturated atom). level_current unchanged (R16 -- no self-bump).'
- '2026-07-29 SIBLING FINDING REGISTERED, NOT FIXED (queued per SELF-INTERRUPT DISCIPLINE -- found by the class audit that drew G5_effort_sizing_discipline and landed a fix in G7_wip_cycle_time_dashboard; same class, different file_scope, so it is queued here rather than fixed on sight). tools/activity_cost.py::self_maintenance_trend sets `now = ordered[-1].timestamp` -- the LAST COMMIT''S OWN timestamp -- then counts its trailing 30/14/7-day windows back from it. Identical anchor defect to the one fixed in generate_wip_flow_data.py::_throughput: the window measures ''the N days before the last commit'', not the last N days, so if commit activity stopped the self-repair-share trend would freeze at its last value instead of decaying -- and this metric''s whole stated purpose is to be TRENDABLE DOWN, which a frozen window cannot demonstrate. Severity LOWER than G7''s instance for two reasons, both checked: commits (unlike level transitions) land near-continuously, so ordered[-1] is usually within minutes of real now; and site/method/ (the only consumer of site/data/activity_cost.json) also 301s to /proof/, so nothing reachable renders it. Fix when G11 next opens for BUILD: inject `now` and anchor on max(now, ordered[-1].timestamp), with the same R15 mutation test shape proven in site/wip-flow/test_wip_flow_door.py.'
- '2026-07-29 HARDEN -- the 07-29 registered anchor defect is now FIXED (Rule-0 dial=3 yielded, at-target draw; L3->L3 held; observed-with-evidence R9). The entry above deferred this to "when G11 next opens for BUILD"; that gate is GONE -- DIRECTOR_RULING_NTFY_IS_THE_DIRECTOR (2026-07-29) withdrew the ceremony on reversible acts ("when blocked, act at risk and record the undo -- do not queue for permission on anything reversible"), and a one-line anchor change behind a mutation test is as reversible as work gets. FIX: self_maintenance_trend() takes an injectable `now` (defaults to real wall clock, NOT ordered[-1].timestamp) and anchors its trailing windows on max(now, ordered[-1].timestamp) -- skew-tolerant, so commits timestamped ahead of now are not silently dropped out of every window. Also emits `hours_since_last_commit` + `window_basis` so the ABSENCE of work is VISIBLE and a young repo is distinguishable from a stalled one (same honest-signal law as G7''s hours_since_last_transition). DEFECT PROVEN LIVE PRE-FIX: 12 commits dated 200 days back still reported a full "trailing 7 days: 50.0%, 11.0 attributed hours"; post-fix the same fixture returns insufficient_data on both windows with hours_since_last_commit=4789.0. R15 MUTATION-PROVEN BOTH WAYS: reverting the anchor to `ordered[-1].timestamp` FAILS test_self_maintenance_trend_decays_when_stalled AND test_self_maintenance_trend_defaults_to_real_wall_clock (the latter guards the production call path specifically -- without it every pinned-clock test could pass while the default path kept the defect); the fresh-data and clock-skew controls stay green under the mutation, so the decay comes from staleness and not from the windows simply being broken. Restored from a /tmp backup, never `git checkout` (that would have wiped the uncommitted fix). Tests 38 passed + 2 xfailed (the #2 harden-domain-split and #3 same-level-arrow pins STILL xfail(strict) = still OPEN, untouched). site/data/activity_cost.json regenerated and now carries window_basis=trailing_windows_anchored_on_wall_clock_at_generation, hours_since_last_commit=0.02, self-repair trending 7.5% (30d) -> 7.6% (14d) -> 5.1% (7d). HONEST ON REACH: site/method/ still 301s to /proof/, so this is NOT a live-rendered public surface -- the fix is real in mechanism and in the emitted JSON, but no R11 pixel claim is made. level_current unchanged (R16 -- no self-bump).'
