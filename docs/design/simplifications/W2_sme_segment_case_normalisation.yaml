atom_id: W2_sme_segment_case_normalisation
simplifications:
- '2026-08-03 MINTED by the W2_payment_channel_dd_consistency_invariant build. VERIFIED LIVE, not inferred: simulation/arrears_engine.payment_method tests `segment == "sme"` while bills store the segment as "SME", so payment_method("SME", 500, "C5") returns standard_credit where payment_method("sme", ...) returns bacs. simulation/payment_behaviour_source.generate_payment_event repeats the same lowercase-only test (`segment in ("ic", "I&C", "sme")`), so the defect exists independently on both surfaces. Consequence today: C5 and C6 are billed as if they were households.'
- '2026-08-03 THE REASON THIS IS NOT A ONE-LINE FIX, measured: `payment_outcome("bacs", stress, rng, segment="SME")` returns ("success", 0) UNCONDITIONALLY, because the dispute branch is gated on _IC_SEGMENTS = ("ic", "I&C") and SME is not in it. So normalising the case alone moves C5/C6 onto a path where they can NEVER fail a payment -- deleting 3 failed payments and 3 arrears cases of real SME bad debt outright. The case-sensitivity bug has been MASKING the fact that there is no SME payment-outcome model at all. Closing this therefore requires an ANCHORED SME outcome model (real SME/microbusiness payment-default behaviour), not a coefficient invented to fill the gap. Until that source exists, fixing the case test alone is a regression and must not be done.'
map_notes:
  name: SME customers are routed through the RESIDENTIAL payment-channel model because the segment test is case-sensitive -- and the naive fix silently deletes all SME bad debt
