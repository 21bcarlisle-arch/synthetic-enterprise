atom_id: D38_renderer_provenance_names_the_moved_side
map_notes:
  gain: 'The walk executes a renderer and then reports a mismatch; with no record of whose renderer ran, a divergence is unattributable and both sides read as suspect. `renderer_provenance` (H27 Expert Hour #22) records the executing side, so a moved figure names the surface that moved it. Its own history is the finding it belongs to: 162 lines self-labelled `atom D38` sat complete and uncommitted in the working tree for three Hours while the register described them as open.'
