map_notes:
  origin_note: The Hardened security profile (container, unreadable credentials, audit, RBAC) is already filed as an Epoch-5 go-live NFR blocker and belongs in this analysis's dependency list rather than being rediscovered on the day. The honest thing this atom must produce is the list of failure modes that CANNOT be rehearsed against a mock -- because that list is the real argument for how long the dual-run period has to be, and it is the thing a cutover plan written from the mock side will silently omit.
