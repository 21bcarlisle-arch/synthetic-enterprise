map_notes:
  origin_note: 'The 2026-08-05 advisor retro (ADVISOR_RETRO_FAILURE_MODES_AND_BIRTH_CERTIFICATE_LAW_2026-08-05) named one law -- anything that persists declares its reader/writer/bound/death, and checks additionally declare a proven failure -- as the lateral fix for five clustered failure modes (write-time blindness, stores born without lifecycles, fields without contracts, checks that pass emptily, migrations without a finish line). Instantiation 1 (lifecycle certificates for the five known rotters) is done and self-applied: the simplifications store this atom''s own note lives in (docs/design/simplifications/README.md) carries a Birth Certificate section for itself. The system-level ''bound'' amendment graduated separately and was ratified (DIRECTOR_RULING_TRAFFIC_FORECAST_AND_DEEPENING_REGISTER_2026-08-07, in_progress/). Confirmed by search on this tick (no matching module found for any of the four): instantiation 2 (a schema + validating test for maturity_map.yaml and sibling governance YAMLs -- type, id-grammar, edge-must-be-id, dated provenance), instantiation 3 (a dedup key + daily byte/item budget in every writing organ''s certificate, naive organ first), instantiation 4 (extend the mutation-test discipline to reconciliation-class checks -- the credit-balance -GBP202-unreleased-for-3.5-years case is the retro''s own specified first planted defect), and instantiation 5 (a migration ledger recording each cutover''s retirement criterion at start, so ''started, not finished'' becomes a standing reportable class) remain unbuilt.'
