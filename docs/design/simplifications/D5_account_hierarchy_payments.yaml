- '2026-07-28 HARDEN (Rule-0 at-target draw, dial=4 yielded -- no below-target work anywhere; source was byte-identical since the 2026-07-27 stamp, so this began as a rest-with-proof re-verify but the red-team found a REAL fail-open and closed it). RED-TEAMED the ledger money-comparison controls (reconcile / check_conserved / verify_against_invoicing) for the R15 killer-pattern-2 NON-FINITE FAIL-OPEN -- the SAME class the E4 CSS reconciliation control (verify_css_reconciliation) closed 2026-07-25/27, red-teamed on the D5 sibling per the audit-sibling-half discipline. FOUND + PROVEN LIVE on the real source: these controls compare abs(actual - expected) > tol, which is silently False when either side is NaN/inf, and the LedgerEvent magnitude guard was `amount_gbp < 0` only -- `NaN < 0` is silently False too, so a NaN-corrupted bill event (an upstream rate*NaN-consumption transform bug shape) was CONSTRUCTED clean, produced balance_gbp=nan, and reconcile() against the TRUE control total (GBP100) returned CLEAN [] -- a corrupt audited AR figure sailed through the last-line independent control. FIX (R10 class-closure across account_ledger.py, additive, no numeric change -- clean real data byte-identical, 1775 pre-existing billing tests still green): (1) ROOT CAUSE -- LedgerEvent.__post_init__ now rejects non-finite amount_gbp (a magnitude that is not a finite number cannot enter the ledger); (2) DEFENSE-IN-DEPTH -- a shared _nonfinite_problems() helper rejects non-finite values in reconcile / check_conserved / verify_against_invoicing BEFORE the tolerance comparison (closes the EXTERNAL-total NaN path that construction cannot catch: a NaN in the invoicing register / cash book). R15 BOTH-WAYS on the real source: 3 new mutation tests (test_magnitude_guard_rejects_nonfinite_amount, test_reconcile_FIRES_on_nonfinite_external_total, test_check_conserved_FIRES_on_nonfinite_cash_total) -> RED with the guard neutered (helper->[], construction guard ->`if False`), byte-identical 