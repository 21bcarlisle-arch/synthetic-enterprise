atom_id: H47_the_orientation_header_states_a_figure_it_computes
map_notes:
  gain: '2026-09-05, from the director''s console: another session''s startup read PROJECT_OVERVIEW.md from the published mirror and oriented on it. Its header said ''2,500+ commits, 23,826 tests, ~55,700 lines across 360+ Python modules''. Measured the same day: 9,385 commits, 26,731 tests, 826,700 lines across 2,701 modules -- 3.7x out on commits and 15x on lines, so a session started from it was reasoning about a project a fifteenth of this one''s size, and every judgement about what is expensive or risky here scales with that. `tools/startup_anchor_freshness.py` now REFUSES a commit that leaves this document''s DATE disagreeing with its real age, which closes the staleness half. IT DOES NOT TOUCH THE FIGURES: they are still hand-typed, still rot the day after they are written, and nothing can notice -- the same shape one layer in. The four counts are all mechanically derivable (`git rev-list --count`, `git ls-files ''*.py''`, CLAUDE.md''s own Build stamp, which is already parsed for the live site). Derive them at publish and the recurring defect is gone rather than corrected-for-today.'
map_records:
  expert_hour_findings:
  - 'EXPERT HOUR 2026-09-17, HARDEN stage, blind pass via `tools/blind_review.py` (persona: veteran of corporate reporting and disclosure controls; domain restated blind-safe; packet + 16-question battery recorded verbatim at docs/observability/blind_review_ledger.jsonl, blindfold re-derived PASS by --audit; independence: false per 3c). VERDICT: FAIL at the L3 bar -- HELD AT 2. Two of the battery''s DISQUALIFYING questions were answered NO against the live tree and are REPAIRED this pass with mutation-proven controls; one remains open and is what the level now waits on. The reviewer''s own summary, formed on the description alone: "I cannot distinguish it from a tautological gate with a universal escape hatch." It was not tautological, and the escape hatch was real.'
  - 'EH-1 REPAIRED (battery Q11, DISQUALIFYING -- ''what stops the ungraded set from growing?''). `UNGRADED` was derived from ''the band has no floor'', and BOTH causes of a floorless band landed on it: a source that did not exist that far back (honest -- the reader is owed the reading) and a source that WAS readable at the start of the window and is not now. The second is not the passage of time. It was reachable by one edit: the `tests` figure''s source is matched on a literal `**Build:**` in CLAUDE.md, the pre-2026-08-28 spelling `Build:` returns None (measured), and a 2026-08-12 audit has already deleted that line once. One reword of one line in ANOTHER document switched this leg off with a green gate and a published table saying only that the figure could not be checked. The module''s own note closed the BACK-DATING route to `UNGRADED` and pointed at the LIES check -- but LIES grades the date of the header''s own document and can see nothing about a source living elsewhere, so it was never going to reach this. FIX: the band now carries whether the source was readable at EACH end; (readable, gone) is a new `SOURCE_GONE` verdict which IS a refusal, (gone, gone) stays `UNGRADED`. Keyed to the property, never to the date the source appeared. MUTATION-PROVEN: under the pre-repair rule both arrangements give band (None, None) and differ only in the ends -- identical verdict, identical exit 0.'
  - 'EH-2 REPAIRED (battery Q16, DISQUALIFYING -- ''would it have caught the last real error? replay it''). Replayed the 2026-08-09 header at 13ccd5c9f through the control. It REFUSES -- but by the unstated-figure leg, not the wrong-figure leg: `2,500+ commits` and `360+ Python modules` were read as NO FIGURE STATED, because the patterns ended the number at `[\d,]+` and a trailing `+` breaks the match (`~` and `over` never did, because they sit LEFT of the digits -- which is why the gap survived a reading of the patterns). So the OVERSTATES/UNDERSTATES machinery, the whole substance of this atom, was never reached by the only real instance of the defect it exists for, and the refusal told the author they had stated no commits figure when they had stated a hedged one. The hedge is exactly how a person types a number they already know is going stale: it is where this class LIVES. FIX: `\+?` in all four patterns; the bare number is graded and the hedge cannot rescue a 3.7x miss. MUTATION-PROVEN against the pre-repair patterns.'
  - 'EH-3 OPEN, AND IT IS WHAT L3 NOW WAITS ON (battery Q3/Q8/Q9). Three of the four figures are graded against git, which no author can type into. The fourth is not: `tests` is graded against CLAUDE.md''s Build line, itself a hand-typed number, and the band is DEGENERATE -- measured today, low == high == stated == 26,731. So one of the four legs is clearable by typing: an author who invents a test count and updates both documents in one commit is agreed with. The reviewer predicted the shape before seeing anything (''roughly half the self-consistency controls I have seen grade an artefact against a copy of itself'') and it is half-true here -- not a tautology (the two documents DID disagree historically: 23,826 in the header against 26,659 on the Build line) but not an independent record either. The published table''s `source` column says which source each figure has; the VERDICT vocabulary does not, so `tests AGREES` reads identically to `commits AGREES` while carrying materially less evidence. Not repaired in this pass because the honest source is a real suite collection, and this project has already retired one per-publish collection for costing 30-40s of an 8-9 minute cycle -- so the fix is a design choice about publish cost, not an edit.'
  - 'EH-4 OPEN, MINOR (battery Q7 -- ''one blanket tolerance across heterogeneous quantities is a design smell''). There is one window, +/-3 days, deliberately tied to the date check rather than minted separately, and that tying is right. But measured at the live header it yields commits 8,824-9,959 (+/-6%) and lines 765,105-900,678 (+/-8%) for quantities that are EXACTLY derivable at a named revision. The band is wide because the window is wide, not because the measurement is uncertain. Filed rather than changed: narrowing it is a real trade against a header written one day and landed the next, and no evidence yet says which side is costlier.'
  - EH-5 OPEN, MINOR (battery Q15 -- scope). The check grades the four quantities in ONE sentence. Nobody has asked whether the rest of PROJECT_OVERVIEW.md states comparable facts about the project; the reviewer's note that 'this sentence is the only place the document states facts about itself is almost never true' is unexamined here.
  - 'CREDITED, so the FAIL is calibrated rather than reflexive. Q2 (ten mutations): 8/8 -- all four figures refuse in BOTH directions, halved and doubled, measured not argued; the date''s own two directions are covered by the LIES check''s abs() drift. Q4 (does the bound track the DECLARED date or today''s): it tracks, and that is mutation-proven by an existing control, which is the single most common way a check like this gets disabled and it was avoided. Q5 (can a refusal be cleared by moving the date instead of the figure): no -- moving the date moves the band with it, so a wrong figure stays wrong, and back-dating past a source trips LIES. Q6 (does it run when the RECORD moves or only when the sentence is edited): every publish cycle, unconditionally. Q13 (is there a cheap remediation): the refusal prints the band, so the fix is one edit. Q14 (tolerance widened in response to a red): none -- the window is inherited, not minted.'
