atom_id: H47_the_orientation_header_states_a_figure_it_computes
map_notes:
  gain: '2026-09-05, from the director''s console: another session''s startup read PROJECT_OVERVIEW.md from the published mirror and oriented on it. Its header said ''2,500+ commits, 23,826 tests, ~55,700 lines across 360+ Python modules''. Measured the same day: 9,385 commits, 26,731 tests, 826,700 lines across 2,701 modules -- 3.7x out on commits and 15x on lines, so a session started from it was reasoning about a project a fifteenth of this one''s size, and every judgement about what is expensive or risky here scales with that. `tools/startup_anchor_freshness.py` now REFUSES a commit that leaves this document''s DATE disagreeing with its real age, which closes the staleness half. IT DOES NOT TOUCH THE FIGURES: they are still hand-typed, still rot the day after they are written, and nothing can notice -- the same shape one layer in. The four counts are all mechanically derivable (`git rev-list --count`, `git ls-files ''*.py''`, CLAUDE.md''s own Build stamp, which is already parsed for the live site). Derive them at publish and the recurring defect is gone rather than corrected-for-today.'
map_records:
  expert_hour_findings:
  - 'EXPERT HOUR 2026-09-17, HARDEN stage, blind pass via `tools/blind_review.py` (persona: veteran of corporate reporting and disclosure controls; domain restated blind-safe; packet + 16-question battery recorded verbatim at docs/observability/blind_review_ledger.jsonl, blindfold re-derived PASS by --audit; independence: false per 3c). VERDICT: FAIL at the L3 bar -- HELD AT 2. Two of the battery''s DISQUALIFYING questions were answered NO against the live tree and are REPAIRED this pass with mutation-proven controls; one remained open at the close of that pass and was repaired later the same day, in part, by the entry below -- which found the defect it predicted LIVE and unfixed on this tree. The reviewer''s own summary, formed on the description alone: "I cannot distinguish it from a tautological gate with a universal escape hatch." It was not tautological, and the escape hatch was real.'
  - 'EH-1 REPAIRED (battery Q11, DISQUALIFYING -- ''what stops the ungraded set from growing?''). `UNGRADED` was derived from ''the band has no floor'', and BOTH causes of a floorless band landed on it: a source that did not exist that far back (honest -- the reader is owed the reading) and a source that WAS readable at the start of the window and is not now. The second is not the passage of time. It was reachable by one edit: the `tests` figure''s source is matched on a literal `**Build:**` in CLAUDE.md, the pre-2026-08-28 spelling `Build:` returns None (measured), and a 2026-08-12 audit has already deleted that line once. One reword of one line in ANOTHER document switched this leg off with a green gate and a published table saying only that the figure could not be checked. The module''s own note closed the BACK-DATING route to `UNGRADED` and pointed at the LIES check -- but LIES grades the date of the header''s own document and can see nothing about a source living elsewhere, so it was never going to reach this. FIX: the band now carries whether the source was readable at EACH end; (readable, gone) is a new `SOURCE_GONE` verdict which IS a refusal, (gone, gone) stays `UNGRADED`. Keyed to the property, never to the date the source appeared. MUTATION-PROVEN: under the pre-repair rule both arrangements give band (None, None) and differ only in the ends -- identical verdict, identical exit 0.'
  - 'EH-2 REPAIRED (battery Q16, DISQUALIFYING -- ''would it have caught the last real error? replay it''). Replayed the 2026-08-09 header at 13ccd5c9f through the control. It REFUSES -- but by the unstated-figure leg, not the wrong-figure leg: `2,500+ commits` and `360+ Python modules` were read as NO FIGURE STATED, because the patterns ended the number at `[\d,]+` and a trailing `+` breaks the match (`~` and `over` never did, because they sit LEFT of the digits -- which is why the gap survived a reading of the patterns). So the OVERSTATES/UNDERSTATES machinery, the whole substance of this atom, was never reached by the only real instance of the defect it exists for, and the refusal told the author they had stated no commits figure when they had stated a hedged one. The hedge is exactly how a person types a number they already know is going stale: it is where this class LIVES. FIX: `\+?` in all four patterns; the bare number is graded and the hedge cannot rescue a 3.7x miss. MUTATION-PROVEN against the pre-repair patterns.'
  - 'EH-3 REPAIRED IN PART, AND THE REPAIR FOUND THE DEFECT LIVE (battery Q3/Q8/Q9). Three of the four figures are graded against git, which no author can type into. The fourth was not: `tests` was graded against CLAUDE.md''s Build line, itself hand-typed, so the band was DEGENERATE (low == high == stated == 26,731) and the leg was clearable by typing -- an author who invents a count and updates both documents in one commit was agreed with. THE HOLE WAS OCCUPIED. Measured 2026-09-17 while building the repair: both documents said 26,731; the Build line had not moved since its `**Build:**` spelling was introduced on 2026-08-28, 20 days and 1,440 commits earlier; a real `pytest --collect-only` of a clean HEAD extract returned 36,835 (37.9s); and this check said `tests AGREES` while `generate_dashboard_data` published the typed number to the live site. The stated figure was 27% low -- the same class as the 2,905-test gap in the incident that produced the atom, unrepaired one layer in. FIX, and the prior pass''s reason for deferring was a false dichotomy: the choice was framed as `per-publish collection or nothing`, and there is a third source that costs NOTHING. `_figures_at` already streams every `*.py` blob at both window revisions to count newlines, so the test functions in collectible-named files are counted in the SAME pass. A collected item is never fewer than one per test function -- class-nested, skipped and xfailed functions are all still collected and `@parametrize` only multiplies -- so that count is a FLOOR no truthful collection can sit below. Measured at HEAD: 34,171 functions against 36,838 collected, a 7.2% margin, and against the stated 26,731 it refuses. Taken at the LOW end of the window so an honestly-computed figure never races the suite''s growth, and checked BEFORE the band and before `low is None`, because the whole point is that it does not depend on the typed source being present, readable or right -- it is the only leg that survives the Build line being deleted. Verified there is no `testpaths`, `norecursedirs`, `collect_ignore` or `python_files` anywhere at HEAD, so collection is pytest''s default and the two filename spellings are exactly what it walks. MUTATION-PROVEN, and the mutation IS the forgery EH-3 named: `_tests_figure` stubbed to return the invented number so header and source agree perfectly, the band asserted to have actually followed the forgery (a stub that moved nothing would prove nothing), and the floor refuses anyway. Both documents corrected to 36,838, measured on the tree this commit creates rather than the shared working tree. AND THE FIRST DRAFT OF THE FLOOR WAS ITSELF THE DEFECT ITS OWN ATOM IS ABOUT, caught by the landing gate: it counted `def test_` with a REGEX OVER THE RAW BYTES, which reads `def test_x():` inside a STRING LITERAL as a test -- this repository''s own control fixtures write exactly that into temp files. It over-counted by 25 (34,196 against 34,171), and a floor that counts prose can rise ABOVE the truth it bounds and red an honest figure, which is the one direction this bound must never fail in. `tests/architecture/test_a_control_reads_python_as_code.py` refused the commit and named both functions. `python_code_text.searchable()`, which that control''s message suggests, removed only ONE of the 25 (the literals are call arguments, not bare string expressions) and cost 5.7s against the AST''s 1.4s -- so the AST is both the correct reading and the cheap one, and it is matched to what pytest actually collects (module-level functions plus methods of Test-prefixed classes) rather than to every `def test_`.'
  - 'EH-3 RESIDUAL, AND IT IS WHAT L3 NOW WAITS ON WITH THE SECOND BLIND PASS. The index floor bounds the figure BELOW and nothing bounds it above: there is no cheap ceiling, because `@parametrize` expansion is unbounded and only a real collection knows it. So the direction the real incident took twice (understatement -- 2,905 tests in 2026-08, 10,107 in 2026-09) is now closed by evidence no author can type into, and an OVERSTATEMENT inflated into both documents at once would still read `AGREES`. Named on the published table rather than papered over: the legend now says in the reader''s own words that the four verdicts are not worth the same, that `tests` is floored but not capped, and that an `AGREES` there rules out a count too small and not one too large. That is the reviewer''s point answered honestly -- `tests AGREES` no longer reads identically to `commits AGREES` -- rather than closed.'
  - 'EH-4 OPEN, MINOR (battery Q7 -- ''one blanket tolerance across heterogeneous quantities is a design smell''). There is one window, +/-3 days, deliberately tied to the date check rather than minted separately, and that tying is right. But measured at the live header it yields commits 8,824-9,959 (+/-6%) and lines 765,105-900,678 (+/-8%) for quantities that are EXACTLY derivable at a named revision. The band is wide because the window is wide, not because the measurement is uncertain. Filed rather than changed: narrowing it is a real trade against a header written one day and landed the next, and no evidence yet says which side is costlier.'
  - 'EH-3 RESIDUAL REPAIRED 2026-09-30 -- the cap is a real collection, paid only where the figure can be typed. The 2026-09-17 "no cheap ceiling" was true of a check that runs every publish; it is not true of the one commit that can inflate the figure, because the header only changes in a commit that stages it and `--gate` already confines the figure half to that commit. `real_collection` runs there (and under `--ceiling`) and nowhere else: `ABOVE_A_REAL_COLLECTION` refuses a count above what `pytest --collect-only` returns for the tree the commit creates. A STATIC AST CEILING WAS MEASURED FIRST AND CANNOT BE SOUND: against a real HEAD collection (38,706 at 7aa39b17a, 47.7 s, 1.14 GB peak) 85 files parametrize over a name or call, and 9 more read BELOW the truth where the model looked certain (up to 36 collected vs 12 counted), multiplied through a mark stored in a variable (`@_RESOLVERS = pytest.mark.parametrize(...)`) that no decorator-shape rule sees. An ERRORED collection is not a count -- its total is of the files that imported, below the truth, the one direction a cap must never fail in -- so it leaves the row AGREES with `ceiling_unavailable` named. Residual, named on the published table: the publish run floors but does not cap, so its AGREES on tests says the cap held at the last commit that wrote the sentence. Five mutations (cap never fires, refusal dropped, `--ceiling` wiring dropped, collect on every publish, errored total trusted) each red a control; live `--check --ceiling` collected 38,856 against a stated 36,838 and exits 0.'
  - 'SECOND BLIND PASS 2026-09-30 -- VERDICT PASS AT L3, one presentation repair landed with it. Same persona and domain as the first, fresh context, packet restated blind-safe to describe the floor, the cap and SOURCE_GONE; 15 questions recorded verbatim in docs/observability/blind_review_ledger.jsonl, --audit PASS, independence false per 3c. (An earlier dispatch the same hour sent the reviewer an unsubstituted template; it returned a generic battery about nothing, which was discarded unrecorded -- the tool records only what it rendered.) GRADED ON THE LIVE TREE: Q1 definitions -- each figure''s source is named on its row and the sentence defines lines/modules. Q2 maximum age -- NOT enforced, by design: the as-of date sits in the sentence, figures are graded as of it, age is computed and published per anchor (OLD after 14 days); refusing on age would wedge every lane on a document nobody in the lane touched. Credited as disclosure, not as enforcement. Q5 band width -- the band is the record''s own min-max over the window, printed beside every figure; its +/-6-8% width is EH-4, still open. Q7 -- stronger than asked: moving the date moves the band, so a figure is always graded as of whatever date the sentence declares. Q9 -- 0 UNGRADED live; sources are git and one typed line, so UNGRADED is reachable only by a pre-source date. Q10 -- the window is a code constant; a change is a gated commit. Q14 -- figures change only by commit; publish grades every run. Q3/Q8/Q12, THE ONE GAP, AND IT HID A FALSE CLAIM: `tests AGREES` read identically to `commits AGREES`, the qualifier lived only in the legend -- and the legend said the cap "was checked when the sentence was last committed", false for the live sentence (declared 2026-09-17, cap enforced from 2026-09-30, so it has NEVER been capped by the gate). REPAIRED to the reviewer''s own stated answer: the tests cell now says which of four states it is in (capped this run / cap unavailable, why / capped at the commit that wrote it / never checked for too large, predates the cap), keyed to the sentence''s own date against CAP_ENFORCED_FROM; live it reads the last. One assertion over the partition plus a distinctness leg; five mutations (date test forced either way, each branch dropped, bare verdict always) all red. LANDED: `_verdict_cell` in `tools/startup_anchor_freshness.py`'
  - EH-5 OPEN, MINOR (battery Q15 -- scope). The check grades the four quantities in ONE sentence. Nobody has asked whether the rest of PROJECT_OVERVIEW.md states comparable facts about the project; the reviewer's note that 'this sentence is the only place the document states facts about itself is almost never true' is unexamined here.
  - 'CREDITED, so the FAIL is calibrated rather than reflexive. Q2 (ten mutations): 8/8 -- all four figures refuse in BOTH directions, halved and doubled, measured not argued; the date''s own two directions are covered by the LIES check''s abs() drift. Q4 (does the bound track the DECLARED date or today''s): it tracks, and that is mutation-proven by an existing control, which is the single most common way a check like this gets disabled and it was avoided. Q5 (can a refusal be cleared by moving the date instead of the figure): no -- moving the date moves the band with it, so a wrong figure stays wrong, and back-dating past a source trips LIES. Q6 (does it run when the RECORD moves or only when the sentence is edited): every publish cycle, unconditionally. Q13 (is there a cheap remediation): the refusal prints the band, so the fix is one edit. Q14 (tolerance widened in response to a red): none -- the window is inherited, not minted.'
