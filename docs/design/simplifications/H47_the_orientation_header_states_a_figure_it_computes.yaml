atom_id: H47_the_orientation_header_states_a_figure_it_computes
map_notes:
  origin_note: '2026-09-05, from the director''s console: another session''s startup read PROJECT_OVERVIEW.md from the published mirror and oriented on it. Its header said ''2,500+ commits, 23,826 tests, ~55,700 lines across 360+ Python modules''. Measured the same day: 9,385 commits, 26,731 tests, 826,700 lines across 2,701 modules -- 3.7x out on commits and 15x on lines, so a session started from it was reasoning about a project a fifteenth of this one''s size, and every judgement about what is expensive or risky here scales with that. `tools/startup_anchor_freshness.py` now REFUSES a commit that leaves this document''s DATE disagreeing with its real age, which closes the staleness half. IT DOES NOT TOUCH THE FIGURES: they are still hand-typed, still rot the day after they are written, and nothing can notice -- the same shape one layer in. The four counts are all mechanically derivable (`git rev-list --count`, `git ls-files ''*.py''`, CLAUDE.md''s own Build stamp, which is already parsed for the live site). Derive them at publish and the recurring defect is gone rather than corrected-for-today.'
