atom_id: EP12_adapter_css_rec_switching
simplifications:
- '2026-08-14 DISCOVER+FRAME, LEVEL HELD AT 0 (worker tick, LANE 3 only; no BUILD code, epoch-3 BUILD gating unaffected -- loop_stage stays idle, no maturity_map.yaml edit). Produced docs/design/EP12_CSS_REC_SWITCHING_DISCOVER_FRAME.md. LEVEL DELIBERATELY NOT MOVED: this atom''s deliverable is an ADAPTER and this document is about the adapter, not the adapter -- same call as EP10_adapter_uk_link_xoserve (held at 0, 2026-08-13), opposite call to EP19_counterparty_qualification_paths (moved 0->1 the same day because a register was its own stated ceiling). The discriminator is the origin_note, and EP12''s names failure modes of a PROCESS, not a doc. THE COMPANY HALF IS BUILT AND ENTIRELY DEAD, observed by strict import check at HEAD: fifteen modules -- mpas_standing_data_correction_register, onboarding_journey, css_performance_register, transfer_objection_register, switching_cost_model, switch_governance, css_tracker, switch_analytics, erroneous_transfer, cos_process, switching_cba, mpas_registry, switching_report, billing/switching, dtn_log -- 2,161 lines, EVERY ONE with zero non-test importers, and eight of them carrying 165 named tests that all construct their subject directly. The one live switching-named module (company/pricing/switching_recommendation.py, imported by company/portal/app.py:30) is TARIFF switching between the company''s own products, not industry switching. Same population and shape as the 2026-08-13 "gas industry-systems layer is eleven modules and no callers" finding; EP12''s half is larger. The origin_note''s "modelled the easy half" is therefore NOT a description of the company''s code -- cos_process.CoSStage already runs SWITCH_REQUESTED -> OBJECTION_WINDOW -> OBJECTION_CLEARED -> FINAL_READ_REQUESTED -> FINAL_READ_RECEIVED -> SWITCH_COMPLETE with OBJECTED terminal, and erroneous_transfer.ETStatus runs OPEN -> INVESTIGATING -> RESOLVED_CORRECTED/RESOLVED_ACCEPTED -> COMPENSATION_DUE -> CLOSED. It is a description of the WORLD''s code and of the seam. THE WORLD HAS NO SWITCH TO BE WRONG ABOUT: the entire exit mechanism is one Bernoulli at a term boundary (simulation/customer_events.py:139-142, retained = roll <= effective_p_retain), so (a) there is exactly ONE undifferentiated exit event -- home_move_won is rolled on ALL non-retention, so every departure in this world is a home move that may or may not be won, and a competitive switch does not exist as a distinct thing that can happen; (b) the exit is instantaneous and irreversible, with no in-flight period, gaining counterparty, objection window or reversal, so there is no state that could be wrong for a fortnight and then corrected; (c) grep -iE "erroneous|objection|failed switch|rejected_switch" over simulation/ and sim/ returns ONE hit and it is a comment. The only switching failure mode the world models is on the GAIN leg (acquisition_funnel.py, live via run_phase2b.py:79, attrites at cooling_off through ONBOARDING_TO_COOLING_OFF_SURVIVAL resi 0.80 pre / 0.92 post) -- so the company can lose a switch it is GAINING and can never lose a switch it is LOSING. COUPLED TRIAD therefore blocks L3 structurally, not for want of build effort: the company''s belief would be "in flight, may be objected, may prove erroneous" and the world''s truth is a boolean, so no belief-vs-truth gap is available. Same conclusion EP10 reached about UIG, from the opposite direction. THE WALL CARRIES THE CAUSE OF A GAIN AND DISCARDS THE CAUSE OF A LOSS: sim_interface.notify_acquisition carries channel ("home-move-win" vs "market-acquisition") and predecessor_id; notify_churn carries only a free-text reason -- and at the ONE live production call site (run_phase2b.py:1570) that reason is the literal constant "non-renewal", fired UNCONDITIONALLY including on the branch that four lines later (1577) establishes the departure WAS a home move. The world knows the cause at that moment and throws it away on the loss leg while preserving it on the gain leg. So the origin_note''s "a switch and a tenancy change look identical from the company''s side until they don''t" UNDERSTATES HEAD: on the loss side they are identical always and there is no "until". Judged a fidelity gap and not the epistemic wall working (INFERRED, on the internal evidence that the sibling gain leg does carry cause and no wall doctrine distinguishes the two legs): a real supplier losing a customer to a competitor receives a registration flow naming a gaining supplier, and one losing a customer to a house move typically is not told or is told late -- distinguishable WITH LATENCY AND ERROR, which is the thing this atom exists to model. "CSS" MEANS THREE DIFFERENT THINGS IN THIS TREE, registered because it will mis-wire a future builder: saas/reporting/css_statement.py is the Consolidated Segmental Statement (SLC 19A, 712 lines, LIVE via annual_report.py:9290,9311), company/crm/css_tracker.py is the Customer Satisfaction Survey, and only company/market/css_performance_register.py is the Centralised Switching Service -- the only one of the three with live callers is the one that has nothing to do with this atom. THE CSS CUTOVER SITS INSIDE THE REPLAY WINDOW: the 2016-2025 replay crosses a regime boundary (INFERRED from the atom''s own dated source, docs/design/refs/ADVISOR_RESEARCH_COUNTERPARTY_APIS_EPOCH3_2026-08-05.md, marked verified-live 2026-08-05 for the RECCo/DCC/Data-Access-Matrix facts), and the tree''s only switching MESSAGE vocabulary (dtn_log.py: D0150 registration, D0301Z switch request; mpas_standing_data_correction_register.py: D0019) is the PRE-CSS DTN/D-flow regime and is dead. Exactly one constant knows about the change -- simulation/acquisition_funnel.py:76 REC_REFORM_DATE = date(2022, 7, 1), carrying its own confidence markers (M on the regime fact, L on the rates) and explicitly domestic-only -- and it is on the gain leg, the section-3 asymmetry again. THE FRAME, ordered by what unblocks what: F1 the WORLD needs a switch event with a cause, a duration and an outcome that can be other than success, before the adapter has a counterparty -- this is world work and it is where the gain ("an industry process with its own failure modes") actually lives; F2 the wall''s loss primitive needs the shape its gain primitive already has, which is a SEAM change and is EP6_wall_protocol_typing, this atom''s declared depends_on, OBSERVED AT LEVEL 0 -- EP12 cannot be built as a wrapper over the current seam because a single past-tense notify_churn call cannot express an in-flight reversible multi-step switch, so the declared dependency is real and correct; F3 only then is the adapter the work, and by then it is small, because the fifteen dead modules already model the company''s side and the BUILD move is to wire them rather than write them again. WHAT THE ADAPTER DOES NOT NEED: REC eligibility, the Data Access Matrix and REC Code Manager confirmation gate the TRANSPORT, not a mocked adapter, a world switch event, or a measured gap -- the access class is a reason EP12 cannot reach L3 AS AN INTEGRATION, not a reason its coupled loop cannot be built (same distinction EP10 drew about the Data Services Contract; EP19 holds the qualification path itself and nothing here duplicates that register). A DEFECT FOUND AND REGISTERED NOT FIXED (SELF-INTERRUPT DISCIPLINE, and this is a doc-only lane): run_phase2b.py:1577-1589 rolls home_move_won for EVERY non-retained account but SUCCESSOR_MAP has 6 keys (C1-C6) against 20 customers, so for the other 14 a True roll takes the outer if, finds no successor, does nothing, AND never reaches the elif mandate_permits_replacement() branch -- the account is lost with no successor and no market replacement, making a True win roll a strictly WORSE outcome than a False one and depressing the realised home-move-win rate below its parameter. Staged as a worker finding. SIX OPEN ITEMS NAMED AND NOT GLOSSED (R10): the REC_REFORM_DATE value is unverified against the actual go-live and no network exists in autonomous runs to check it; the pre-2022 half of the replay window has no adapter shape at all and whether EP12 owns both regimes is a curriculum question (R13), undecidable by this pass; the gas half (Supply Point Switching) is far thinner than the electricity half and EP10 already found the gas layer dead, so the two atoms share a gas problem neither owns; W2_12_change_of_tenancy_debt_physics is at L1 verify and its world half is ALSO absent by its own words (simulation/dd_balance_book.py:74-76 -- TenancyChangeCoupler has no production caller and the SIM has no tenancy-change stream), so BOTH sides of the origin_note''s coupling are missing from the world and whichever atom moves first should build the shared exit event rather than two; the 165 tests are all direct-construction and none would fail if the world never produced a switch, which is why the layer sat dead and green (not a mutation-test claim -- no control was mutated this pass); and 2026-08-05 is the freshness ceiling on every external claim. EVIDENCE PATH REPAIR (append, never rewrite -- the store refuses laundering): BOTH cited evidence entries were dead, the known "archiving a document breaks every atom record that cited it" class -- ADVISOR_RESEARCH_COUNTERPARTY_APIS_EPOCH3_2026-08-05.md moved to docs/design/refs/ and ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md moved to docs/domain_artefact_library/scope_briefs/. The live paths are appended alongside the dead ones; the dead entries stay as history.'
map_notes:
  origin_note: Erroneous transfers, objections and failed switches are the substance -- a switching adapter that only models successful switches has modelled the easy half and left out every case that generates a complaint, a credit balance and a regulatory obligation. Interacts with W2_12_change_of_tenancy_debt_physics, where a switch and a tenancy change look identical from the company's side until they don't.
  name: 'Adapter for switching flows: electricity CSS (operated by DCC) and gas Supply Point Switching, both administered through RECCo under the REC Data Access Matrix, with eligibility confirmed by the REC Code Manager. Access class GATED; the adapter stays mocked, shaped to REC message flows. B10_competitor_switching_response models the company''s RESPONSE to switching; this is the industry PROCESS that switching actually runs through.'
