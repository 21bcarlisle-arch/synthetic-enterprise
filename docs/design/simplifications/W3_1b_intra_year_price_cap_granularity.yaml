atom_id: W3_1b_intra_year_price_cap_granularity
simplifications:
- '2026-08-03 BUILT, L0->L2 (worker tick). get_cap_unit_rate_for_date() + _CAP_WINDOWS in company/pricing/ofgem_price_cap.py: 21 real Ofgem cap windows, six-monthly Apr/Oct to 30-Sep-2022 then quarterly, with an EPG overlay (min(cap, EPG)) for Oct-2022..Jun-2023. Window BOUNDARIES from Ofgem''s own default-tariff-levels page; unit rates from the published per-period p/kWh, with the two crisis windows independently corroborated by House of Commons Library CBP-9491/9714 (elec 20.8p->28.3p, gas 4.1p->7.4p) AND by the in-repo _PRICE_CAP_QUARTERLY -- three sources, one figure, so the control is not a tautology. Sourcing artefact: docs/market_research/ofgem_cap_windows.md. R10 CLASS, not an instance: BOTH year-keyed clamp sites re-threaded (simulation/hedged_settlement.py::run_deemed_term per settlement date, simulation/run_phase2b.py resi fixed-term per term-start date), and a source-scan control forbids either from going back to the annual lookup. The annual get_cap_unit_rate_gbp_per_mwh() is deliberately UNCHANGED for callers whose own grain is a year (compliance anchors, growth mandate, switching advice).'
- '2026-08-03 R15 BOTH WAYS, 8 mutations each firing its own named test, baseline restored green (15 new tests in tests/company/pricing/test_intra_year_cap_window.py + 3 rewritten in tests/simulation/test_hedged_settlement.py): (1) revert lookup to the annual blend; (2) the calendar-quarter defect -- end the Oct-2021 window at 31-Dec-2021; (3) gas branch reads the elec column; (4) drop min(cap, EPG); (5) FAIL-OPEN -- return None past the last window; (6) delete one window (silent gap); (7) restore the annual lookup at the hedged_settlement clamp; (8) delete the clamp from run_phase2b. Fail-open closed explicitly: dates past the published schedule CARRY THE LAST WINDOW FORWARD, because a None there silently un-caps every resi customer.'
- '2026-08-03 MEASURED, blind to P&L (R12/R13). The named defect is confirmed and is the largest deviation in the table: Jan-Mar 2022 elec ceiling was 305.0 vs a real 208.0 (-97.0, 47% too loose) and gas 95.0 vs 40.7 (-54.3, 133% too loose), in exactly the quarter the crisis bit -- in-sim revenue from capped deemed customers was over-stated and crisis margin less negative than reality. SECOND DEFECT THE MEASUREMENT EXPOSED, which the DISCOVER did not predict: the annual table is not only mis-TIMED but systematically mis-LEVELLED, sitting 10-80 GBP/MWh BELOW the published cap in almost every non-crisis period (2025 elec 190.0 vs a real 248.6-270.3) -- the hand-built ballpark drifted low. So the re-thread moves the ceiling DOWN in the crisis window and UP nearly everywhere else, both toward the published source. Published financial figures will move on the next full run; that is the correction landing, not a regression.'
- '2026-08-03 L3 RESIDUAL, named and not claimed: (a) COUPLED TRIAD -- no world atom reaches L3 until the company has been tested against it and the GAP measured; the per-customer bound is sized (~£343/dual-fuel deemed customer for Jan-Mar 2022) but the POPULATION-level effect needs a full sim run, which this bounded tick did not take. (b) HARDEN/Expert Hour not run. (c) DECLARED SIMPLIFICATIONS carried, all in the sourcing doc: unit-rate leg only (no standing charge, which itself stepped ~25->45 ppd in 2022 and would inherit this same window granularity), no regional/payment-method variation, VAT-inclusive basis (unchanged -- but the module docstring previously claimed ex-VAT while carrying VAT-inclusive numbers, and that mislabel is corrected).'
- '2026-08-03 DEBT REGISTERED on the sibling, not fixed here: company/regulatory/price_cap.py::_PRICE_CAP_QUARTERLY is keyed by CALENDAR quarter and is offset against the real windows across the whole six-monthly era -- 2022-Q1 carries the APRIL-2022 cap (28.34/7.37/£1,971) for a quarter governed by the OCTOBER-2021 cap (20.80/4.17/£1,277), and 2022-Q3 likewise carries the Oct-2022 level. Its consumer is PriceCapBook (compliance reporting), not the settlement clamp, so it is out of this atom''s scope -- but a naive future re-thread of any clamp to it BY CALENDAR QUARTER would re-introduce exactly the defect closed here. The closed DISCOVER found only the 2022-Q1 instance; the offset is systematic, so the fix is a re-keying, not a row edit.'
- 2026-08-03 BUILD-FOUND ERROR IN THE CLOSED DISCOVER DOC (second consecutive instance of this class -- cf. SP2_1's caller undercount + backwards interval). The DISCOVER cited pricecaprates.co.uk as its primary date source. That source, and utilitymatchmaker.co.uk which agrees with it, both carry WRONG effective dates (1 Jul 2019 and 1 Feb 2021 for changes Ofgem dates to 1 Apr 2019 and 1 Apr 2021) and omit the Oct-2019 £1,179 and Oct-2020 £1,042 levels entirely; their mutual agreement is not independence. Ofgem's own enumeration was used instead. The DISCOVER also named ONE binding site (hedged_settlement); there are TWO (run_phase2b.py:1115 clamps resi fixed terms on int(term_start_str[:4])), so building to the doc alone would have left half the class open. A CLOSED DISCOVER DOC IS A HYPOTHESIS, NOT A SPECIFICATION.
- '2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_intra_year_price_cap_granularity_2026-07-28.md. Sibling of W3_1_price_cap_binding, which is SATURATED at the ANNUAL grain -- this is the intra-year half that was left open. Parked behind director_build_open (abolished 2026-07-29, swept 2026-08-03); registered here per R17. FIDELITY GAINED: deemed/SVT customers inside a cap-STEP quarter are currently clamped against an annual blend, so the sharpest edge of the 2021-22 crisis -- the quarter in which the cap moved and the supplier was underwater against it -- is smoothed away. This atom exists to model the crisis, and the crisis happened at the step.'
- '2026-08-03 MINT -- R13 WALL: the cap SCHEDULE is real published Ofgem history, so sourcing it is a BASELINE fidelity act decided blind to company P&L; NEVER fabricate a cap date or level. R15: a Jan-Mar 2022 deemed period must clamp against the PRE-Apr-2022 cap and a May-2022 period against the POST-step cap -- mutate the lookup back to the annual blend and the test must FIRE. PORTABILITY: keyed by a cap-window SCHEDULE, never hardcoded to 2022, per the standing portability constraint that obligations are keyed by regime rather than by a baked-in date. LEGITIMATE ALTERNATIVE OUTCOME, explicitly credited (ruling section 3): if the builder judges period-granularity not worth the complexity, that is a DECLARED + MEASURED-BOUND simplification registered in W3_1''s simplifications with the DISCOVER-sized pound impact as the bound -- an argued outcome, NOT a silent closure. The DISCOVER half (source the real schedule, size the annual-blend-vs-period-cap impact on crisis-window deemed customers) is the first pass either way.'
