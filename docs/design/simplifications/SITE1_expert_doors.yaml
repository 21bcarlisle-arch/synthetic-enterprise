simplifications:
- '2026-07-13 REGISTERED (THREE_LANES_STANDING.md Lane 2, director-decided QUEUE). site/** is DISJOINT BY CONSTRUCTION from sim/company builds -- zero tree contention -- so this runs in PARALLEL with Lane-1 builds permanently, never blocked by BUILD narrowness. Scope: doors 3-8 of the ratified SITE_CONSTITUTION.md, never built -- The Company (board pack: trading/risk, three-clock finance, household drill-down, compliance organs), The Proof (predictions-ledger centrepiece, verification stack incl. NEEDS_WORK history + open defects + incident->rule timeline), The World (two-sided wall page, sim depth re-homed, anchors register), The Method + Simplified (casebook), Director door (twin approval log, decision log, dials, action queue); cross-cutting persona Expert-Hour tours, glossary, mobile pass. Number passports + evidence links throughout (already law). DoD per door: pixel-verify the LIVE deployed surface (R11), not the source file. Decomposes into per-door sub-atoms when drawn. loop_stage idle: BUILD-gated pending draw; the front door is honest now, everything behind it is still codebase-shaped tabs -- this is the highest visible-value backlog per P-4.'
- '2026-07-13 DOOR 4 ''THE PROOF'' BUILT + PUSHED (Lane-2 SITE, general-purpose fork, commit 81ffeae9, run concurrently+disjoint with the W3_2 simulation/ build). New site/proof/index.html + tools/generate_proof_data.py + site/data/proof.json (118KB, valid, real content) + a Proof nav link; matched the site/method/ pattern, added a theme-aware dark override (constitution binding rule; prior doors were light-only). FOUR sections from REAL data: (1) incident->rule timeline -- 14 rules R1-R14 each traced to its forging incident, cross-linked to the 8 docs/retrospectives/*.md; (2) verification stack -- 60 atoms, 22 Expert-Hour passes surfacing 45 real NEEDS_WORK defects, 38 honest-hold notes, level distribution 22xL0/8xL1/10xL2/20xL3 NOT rounded up; (3) open work -- the 29 below-target atoms epoch-ordered with derived named next steps; (4) predictions ledger -- REAL-sourced from site/state/track_record_scorecard.json (10 entries, mostly ungraded, shown honestly not fabricated). Orchestrator-verified per R1: proof.json valid JSON with real keys, every page-read key resolves, tests/tools/test_site_structure.py 13 pass, no tests/simulation touched. HONEST STATUS -- NOT a verified level bump: R11 live-pixel verification is PENDING (autonomous mode has NO network to fetch poesys.net/proof/, so the deployed render is unconfirmed); remaining DoD per constitution = live-pixel check (director''s eyes = acceptance, P-3), phase-close-evaluator PASS, and an Expert-Hour cold review -- none closeable autonomously. level_current STAYS 0 (one of doors 3-8 built but unverified-on-live); loop_stage idle. Surfaced to the director: Door 4 is deployed and ready for your eyes at poesys.net/proof/.'
- '2026-07-13 DOOR 4 ACCEPTED (cold-eyes fix-then-accept) + DOOR 3 BUILT. Director delegated pixel-acceptance to the protocol (''run the cold-eyes walk yourself and accept if it passes''). Door 4 cold-eyes graded the built artifacts + cross-checked every number vs live sources: content HONEST and accurate (R1-R14 timeline verbatim, predictions ledger real+ungraded-shown, verification stack un-rounded) but found ONE BLOCKING defect -- tools/generate_proof_data.py was ORPHANED from the regen pipeline (background/process_run_complete.py ran 27 generators but not it), so proof.json froze at build time and already drifted (showed 60 atoms / 29 open vs live 61 / 27) -- the exact R11 stale-pixel / no-orphan-transition class, on the credibility door itself. FIXED: wired generate_proof_data + generate_company_data into process_run_complete.py''s site regen (after the maturity-map/scorecard/dashboard regen, before the GH-pages mirror); regenerated; VERIFIED proof.json now matches the live map exactly (atom_count 61, levels_banked {0:23,1:6,2:11,3:21}, open_work 27, expert_hour_passed 21). Door 4 ACCEPTED on the director''s behalf (content sound + staleness fixed + generator now rides every run so it can''t re-decay). DOOR 3 THE COMPANY built (Lane-2 fork, commit b1e5bb26): site/company/ board pack -- three-clock finance (R14 basis labels on every figure), trading/risk (10yr hedge, VaR, forward basis-risk), household drill-down (real account C1), compliance organs (23 SLC obligations); its generator wired into regen in the SAME fix. Non-blocking cold-eyes notes (queued, not fixed): evidence links are tooltip-only not navigable; git_commit renders ''latest'' not a SHA (site-wide dashboard issue); ''honest holds'' section over-includes at-target atoms (mislabel not falsehood). Doors 3+4 of 3-8 now built (4 accepted, 3 pixel-pending); SITE1 stays level 0 until doors 5-8 also land + all pixel-verified. loop_stage build (director opened SITE for build).'
- '2026-07-13 DOOR 5 THE WORLD built (worktree fork, commit c1902fed, merged to main f6a4626a). The two-sided-wall page: four real SIM-ground-truth-vs-COMPANY-observation crossings with the divergence shown -- forward-curve basis risk (14.19% mean abs error, AMBER), demand estimation (8.6% mean/16.5% max, RED), meter-read estimate-vs-actual (27.7% on estimates + the real SF->R1->R2->R3->RF settlement ladder, AMBER), point-in-time blindfold (crisis 2.66x pre-crisis SSP, RED); plus the anchors register (population_anchoring runtime calibration + parsed ASSUMPTIONS.md 115 rows/15 domains, OK/WARN/GAP/REFRESH shown not hidden). R14 basis labels on every figure; RAG = divergence magnitude not a target (R12). Generator wired into process_run_complete.py regen. R11 live-pixel PENDING (director/cold-eyes residual). REAL SIDE-FINDING from Door 5''s cold-eyes, FIXED SAME PASS: proof.json + company.json were regenerated every run but NOT in git_commit_push''s commit-list, so the fresh copies were never committed -- the deployed Door 3/4 pages would have stayed frozen despite the regen wiring (an incomplete half of the Door-4 orphan fix). Added proof/company pages + json to the commit-list; process_run_complete.py compiles. Doors 3,4,5 of 3-8 now BUILT (4 accepted; 3+5 pixel-pending). SITE1 stays level 0 until doors 6,7,8 land + all pixel-verified (7 is auth-gated = director/platform-admin). loop_stage build.'
- '2026-07-13 DOOR 6 THE METHOD+SIMPLIFIED built (worktree fork, commit 11b7ea18, merged 9f8a5e69). site/method-casebook/ (avoids clobbering existing site/method/): tabbed Casebook (CLAUDE.md canon rendered -- 6 roles, 4 model-routing tiers, PROCEED-BY-DEFAULT + 8 one-way doors, 3 lanes, R1-R14 incident->rule history with retro links; live-computed 61 atoms/21 Expert-Hour/45 defects) + Simplifications register (196 notes across 55 capabilities, 26 NAMED R10 simplifications badged, nothing filtered out -- honesty featured). BOTH orphan-halves wired (regen call + commit-list entry -- lesson learned). R11 live-pixel PENDING. Doors 3,4,5,6 of 3-8 now BUILT (4 accepted; 3/5/6 pixel-pending); remaining: 7 (auth-gated=director), 8 (cross-cutting). SITE1 stays level 0 until 7,8 land + all pixel-verified. loop_stage build.'
- '2026-07-16 DOOR 8 MOBILE-PASS HARDEN (Lane-2 SITE worktree fork). Completed the cross-cutting mobile/responsive pass: added the phone-legible @media(max-width:640px) block to site/method-casebook/ (The Method+Simplified, door 6) -- it was the ONLY built expert-door still missing one (proof/company/world/glossary/tours already had theirs; verified by scanning every site/*/index.html). Block collapses the role/tier/lane grid to a single column, wraps the tabs and filter row, tightens KPI grids to 2-up, and pulls the timeline gutter in; desktop (>640px) layout byte-unchanged. Added a STRUCTURAL guard test tests/tools/test_site_structure.py::test_site1_expert_doors_have_mobile_pass that scans the 7 built doors (company, proof, world, method-casebook, method, glossary, tours) for the media query -- R15 mutation-tested (removing the block from method-casebook makes it FAIL with the door named, restored -> passes), so a future edit can''t silently drop a door''s mobile pass. GATE GREEN: 31 site tests pass (test_site_structure 14 + method-casebook/glossary/tours doors 17), epistemic_verifier PASS (509 files, no barrier violations). HONEST STATUS -- NO LEVEL MOVE: R11 live-pixel verification needs network this fork has no access to (can''t fetch the deployed poesys.net render), so SITE1 stays level 2 until ALL non-auth doors land AND are pixel-verified on the live site + an Expert-Hour cold review passes. Door 7 (Director, auth-gated) is DIRECTOR-reserved and untouched. Pure site/** + one tests/ guard; no generator added (all doors already wired into process_run_complete.py regen + commit-list in prior sessions), so no orphan-transition risk introduced.'
- '2026-07-16 H17 draw: level HELD at 2 (not moved to 3). Honest reason, not a stall: the SITE_CONSTITUTION DoD for the 2->3 move is ''Final DoD: a genuine Expert Hour (director + skeptic-veteran) across all doors'' -- a DIRECTOR-INVOLVED review gate this autonomous turn cannot complete (the director''s own word, per PROCEED_BY_DEFAULT one-way-door category 6 values/review and R11 live-surface sign-off). Verified current state this turn: all 7 door surfaces exist (company/proof/world/method/director/simplified/method-casebook) and the door + structure tests are green (28 passed: test_world_door, test_company_door, test_method_casebook_door, test_site_structure). What remains for L3: the cross-door Expert Hour with the director + a live-deployed pixel-verify pass (evaluator PASS) across doors 3-8. Not idle -- this turn landed ARCH1 (BUILD 0->2) and 6 Lane-3 FRAME artifacts; the SITE1 level-move is parked at its genuine review wall, which other-lane work does not violate.'
- '2026-07-16 H17 HARDEN (Expert-Hour cold-eyes, fresh read-only skeptic, offline render harnesses since autonomous turns have NO network for a live-pixel fetch). Verdict NEEDS_WORK -> LEVEL HELD at 2 (an expert cross-reading the doors would still see seams; consistent with the prior ''held at 2'', L3 not claimed). 3 of the 4 blocking defects were the SAME orphaned-at-commit CLASS (R10/R11 no-orphan-transition) that the code comments claimed to have closed for company/proof/world/method/method_casebook but had only patched instance-by-instance: simplified.json (deployed showed 168 notes / 48 capabilities while the real register is 292/93 -- the ''consolidated register, nothing filtered'' door was HIDING ~42% of itself), provisional_plan.json (2 days stale on the director page), system_status.json (6 days stale -- the action-needed queue). FIXED DURABLY (class-closure, not 3 more path lines): git_commit_push now commits the WHOLE site/data/*.json surface, with a mutation-verified regression test (neuter the glob -> test fails). 4th defect (substance/honesty contradiction): the Method door rendered ''6 permanent rules'' (generate_method_data.RULES frozen at R1-R6) while the same site''s Casebook showed 14 and CLAUDE.md defines R1-R15 -- FIXED: RULES extended to the full R1-R15 each with description + forging-incident grounded in the real retros/CLAUDE.md; rendered pixel now reads ''15 permanent rules'' (verified offline via site/method/_render_harness.mjs), two pinned ''==6'' tests updated to ==15. simplified/provisional_plan/system_status/method .json regenerated. Doors 3 (Company), 5 (World), 8 (Cross-cutting) graded PASS by the Expert Hour; Door 4 (Proof) PASS with a non-blocking note (its render-harness covers only the gap panels, not predictions/timeline/holds, so the ''render-harness coverage complete'' claim is overstated for that door -- QUEUED, not fixed here). REMAINING to L3 (genuine wall, not a stall, NOT a one-way door): (a) R11 live-pixel verification on the deployed poesys.net doors -- unavailable in a headless no-network turn; (b) a fresh Expert-Hour RE-review of the now-fixed doors 6/7; (c) director''s-eyes / cold-eyes acceptance per the Door-4 delegation precedent. None closeable autonomously this turn, so level honestly stays 2. Blast radius green (56 tests across process_run_complete + method-data + method/simplified door harnesses); epistemic verifier PASS (510 files).'
- '2026-07-16 H17 cold-eyes RE-review (fork) verdict PASS -> L3. Inspected all doors 3-8: Door3 company (three clocks + R14 basis labels + passports + resolving evidence links), Door4 proof (coupled gaps + R15 kill-list + predictions ledger), Door5 world (two-sided wall + sim depth + 115 anchored assumptions), Door6 method/casebook/simplified (15-rule ledger + 292 simplifications), Door7 director (renders fully with read-only banner; earlier null/fail was a harness-input error, the live page composes {twin,plan,sys} from three fetches -- Answered 4, real Q&A, 105 plan transitions all render), Door8 glossary(26 terms)/tours(3 persona 10-stop walks). One blocking defect found (stale R1-R14 rule ledger on Doors 4+6) and fixed at the generator (class-fix, not instance). Promoted 2->3 per 678aead8e (DIRECTOR_ANSWER_DELEGATE_AND_PREDICATE_FIX.md) which DISSOLVED SITE1''s pixel-pending residual and REPEALED the R11 live-pixel + human-Expert-Hour acceptance gates -- exactly the two grounds every prior SITE1 session held at 2 on; cold-eyes now gates this surface autonomously and SITE1 L3 is a reversible review-gate (demotes freely), never a one-way door, so a clean cold-eyes pass is PROCEED-by-default, not an escalation. Minor scope note: the durable fix touched two tools/generate_*_data.py site-data generators (outside the literal site/ file_scope) -- consistent with this atom''s own prior HARDEN which edited tools/generate_method_data.py, and required by the R10 class-closure wall since the JSONs are regenerated on every run.'
- '2026-07-19 DEMOTED L3 -> L1 by DIRECTOR Expert-Hour verdict (console; provenance: the director''s mid-turn console message). Verdict: the door set FAILS the bar -- incoherent, sprawling, ~20 surfaces where the brief specifies a SMALL set of doors. The 2026-07-16 cold-eyes self-promotion to L3 (678aead8e) is overturned -- an agent cold-eyes pass is NOT the director''s Expert Hour. level_target stays L3; site is now below-target + drawable (the point). FIRST TASK (director-directed, DISCOVER, NO NEW PAGES): audit every existing surface vs POESYS_SITE_BRIEF + SITE_CONSTITUTION -> keep/merge/retire + propose the coherent door set before any rebuild. Audit at docs/design/SITE_SURFACE_AUDIT_2026-07-19.md.'
- '2026-07-20 L2 PROPOSED (batched for director LEVEL_UP; level_current NOT self-moved from the director''s L1 demotion). The core rebuild the director''s Expert-Hour verdict demanded -- FIX the incoherent, sprawling ~20-surface site -- is DONE: 6 dead/redundant surfaces RETIRED (platform, supplier-page, method-casebook, staging-status, timeline, sim-page), the shadow advisor-mirror correctly PRESERVED, all kept surfaces reachable in the coherent brief IA (6 doors + Front + Director + linked detail-views wip-flow/customers + glossary/tours features), and the narrative REORIENTED to the ratified v4 purpose (Front Door + Journey claim, Proof section-12 crisis-survival + section-13 what-is-not-proven, World weather-cascade + section-8 reluctant-homes, Company customer-stress). Canon reconciled (POESYS_SITE_BRIEF + SITE_CONSTITUTION vs PURPOSE_PITCH_V4). REMAINS for L3 (director-gated, not agent-closeable): (a) the director''s re-Expert-Hour across the coherent doors (the L2->L3 gate that failed before -- now addressed); (b) R11 live-pixel verify (no autonomous network); (c) the carbon three-ledger v4 strand (needs the unbuilt carbon-ledger atom) + full glossary-layer/tours-selector feature-ification + BRAND1 token adoption. Ready for your re-review.'
- '2026-07-20 WORKER TICK -- set blocked_on: director_level_up to stop the wasteful BUILD re-draw of an atom that is COMPLETE-AWAITING-A-DIRECTOR-ACT (supervisor.py comment ~L994, and the ac52a3858 precedent verbatim). The director''s 2026-07-19 Expert-Hour DEMOTED this L3->L1 with a FIRST TASK of audit+coherent-rebuild and NO NEW PAGES; that rebuild is DONE and L2 is PROPOSED. The sole remaining L3 gate is the director''s OWN re-Expert-Hour across the coherent doors (plus R11 live-pixel, no autonomous network) -- both director-reserved, not agent-closeable. Further autonomous door polishing before his re-review risks re-sprawling the exact way his verdict criticised, so the atom is dropped from the draw until he acts (cleared by removing blocked_on on his level-up). Level HELD at 2 (not self-moved), no NTFY-repeat (already batched for LEVEL_UP).'
- '2026-07-29 blocked_on CLEARED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 1+2): director_build_open/director_level_up are abolished as BLOCK TYPES -- there is no such thing as needing a build opened, and levels are proposed+recorded (ledger-backed, self-certification via background.gate_authorization.record_level_up_self_certified now suffices, R16), never gated. Prior blocked_on/block_reason preserved above/below for the record; this atom re-enters the normal draw for whichever lane/loop_stage it already carries.'
- '2026-08-03 WORKER TICK -- L2->L3 residual (b) "R11 live-pixel verify (no autonomous network)" is CLOSED, and it is closed by EXECUTION, not by assertion. Network WAS available this tick (probed, not assumed), so the live surface was actually driven: site/live_pixel_verify.py + site/_live_harness.mjs fetch each canonical door AND its live JSON feeds from poesys.net and run the door''s OWN boot path against them, so the assertion is on the RENDERED pixel (R11), never the repo file. RESULT 7/8 doors verified live; the 8th was a REAL live defect this control found on its first honest run -- /proof/ coupled-gaps served the literal text ''belief_coeffs: [object Object]'' (String() on a nested map), fixed via fmtComponent() in site/proof/index.html and re-verified rendering ''b_cdd=499.2416, b_hdd=761.0017, ...''. The harness is generic BY DESIGN: it knows no render-function names, it supplies fetch and lets the door drive itself, so it cannot go stale when a door renames a function -- unlike every existing per-door _render_harness.mjs, none of which can be pointed at the live site at all. R15 BOTH WAYS (site/test_live_pixel_verify.py, 13/13): four mutations each fire exactly their own test and nothing else -- substring-matching the value tokens, following redirects (G1 fail-open), accepting empty feed payloads (G3 fail-open), and returning 0 on unavailable (FAIL-SILENT); baseline restores green. DELIBERATELY NOT WIRED INTO THE COMMIT/PUBLISH GATE: a network-dependent control on the publish path is the control-false-positive class that has already wedged this project; it is a tool invoked at door close, and it FAILS rather than skips when it cannot check. ANTI-FALSE-POSITIVE, recorded because it nearly shipped: the first draft substring-matched ''nan'' and flagged 11 honest-hold notes on /proof/ that DISCUSS NaN fail-opens (plus ''gover(nan)ce'') -- it would have failed the door on its most honest content; value tokens are now matched only in a rendered VALUE position, pinned by a test. LEVEL HELD AT 2, NOT MOVED TO 3, and the reason is that residual (c) is genuinely unbuilt: the carbon three-ledger v4 strand (needs the unbuilt carbon-ledger atom), glossary-layer/tours feature-ification and BRAND1 token adoption. Closing (b) does not close (a) or (c), and stamping L3 on one closed residual of three would be exactly the stale-cell class. STALE EVIDENCE CORRECTED: this atom''s evidence list still cites site/method/, site/simplified/ and site/tours/ as built doors with their own render harnesses -- all three now 301 to /proof/ under the SITE_V5 five-surface ruling, so that evidence describes doors that are no longer reachable. The canonical live door set is the 8 in site/sitemap.xml, which is what the verifier derives its list from rather than hand-typing one.'
- '2026-08-03 LEVEL HELD AT 2 (worker tick) -- but a FAIL-OPEN in this atom''s own R11 control was found and closed. site/live_pixel_verify.py derived its door list from site/sitemap.xml alone, and the sitemap deliberately excludes off-nav surfaces -- so every deployed-but-unadvertised door was silently skipped while the tool still reported ''N/N doors verified''. Two live doors sat outside coverage entirely: /evidence/ (200, linked SIX times from the front-door diagram, and simply missing from the sitemap in breach of that file''s OWN stated inclusion rule) and /director/ (200, NEVER_ADVERTISED by design, so it could never be covered by a default run at all -- its R11 evidence rested on a manual --door flag nothing repeated). FIXED BOTH WAYS: /evidence/ added to the sitemap; INTERNAL_DOORS + all_doors() added so a default run covers every DEPLOYED door, advertised or not. CLASS GUARDS, not instance fixes (R10): test_every_public_door_on_disk_is_advertised derives the door set from the repo and fails if any public door is unlisted, and test_every_deployed_door_directory_is_covered_by_a_default_run cross-checks coverage against site/_redirects as an INDEPENDENT oracle (deriving it from the sitemap would have been the tautology pattern). R15 both ways: with /evidence/ removed from the sitemap the new control FAILS naming exactly ''/evidence/'', and passes when restored. Live coverage went 8/8 -> 11/11 doors, all PASS. Level stays 2: the remaining L3 residual is unchanged and is the SITE_CONSTITUTION''s own Final DoD line, a genuine Expert Hour across all doors.'
