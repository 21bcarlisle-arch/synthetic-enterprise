  - '2026-07-16 H17 cold-eyes RE-review (fork): walked rendered content of all doors 3-8 via the offline render harnesses against real site/data/*.json. Found + fixed a BLOCKING internal contradiction: the Method door showed 15 rules (R1-R15) but the Proof door (Door 4) and Method-Casebook door (Door 6) both showed ''14 permanent rules (R1-R14)'', omitting R15 (controls-must-fail) -- and the Proof page even renders a whole ''Controls That Cannot Fail -- the kill-list (R15)'' section while its own rules ledger claimed R15 did not exist. Durable R10 class-fix (JSON-only would revert, process_run_complete.py regenerates both): added the R15 entry to tools/generate_proof_data.py and tools/generate_method_casebook_data.py, fixed the stale R1-R14 comments, regenerated both JSONs. Rendered-pixel verified: casebook rules-intro now shows ''15 permanent rules (R1-R15)''; rule_count is data-driven len(RULES) so it cannot silently drift again. Gate green: pytest site/ 121 passed/6 skipped, pytest tests/tools/ 1255 passed/4 skipped, tools.epistemic_verifier PASS (510 files).'
