atom_id: D17_d8_counterfactual_has_no_unattributed_residual
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). THE ATOM OFFERED TWO BRANCHES -- measure a partial attribution by injecting a belief error no invoice reference can cure, OR establish that this world structurally cannot produce one -- and the honest answer is that BOTH are true of different things, so both landed. THE STRUCTURAL CLAIM SURVIVED BUT ONLY NARROWER THAN IT WAS WRITTEN. The atom''s premise was that on this world ''ageing an invoice settled within five days of its due date REQUIRES a misallocation''. That is false as stated and true as meant: a SECOND mechanism exists -- the credit never being DELIVERED to the company''s books at all (unapplied cash, a feed gap, a payment to the wrong sort code) -- and it ages a within-grace-settled invoice with no misallocation anywhere. What is actually true is that the OBSERVATION CHANNEL is complete in this world, so once D16''s never-flaggable band has removed every invoice the company was right to carry as owed, oldest-first misallocation is the only mechanism LEFT. 100% attribution is therefore a property of the CHANNEL, not a pass mark for the subtraction, and it is now published as exactly that. THE INJECTED GUARD, MEASURED. Suppressing the delivery of every 5th within-grace credit at `emit_wall_responses` -- which `record_period` calls once for the real company and once for the shadow, so BOTH books lose the same cash and the money guard is not what fires -- puts 5 of 900 cases beyond any remittance reference''s reach. The ageing overstatement goes 0.090909 -> 0.163636 while the shadow goes 0.0 -> 0.090909, so 0.072727 of 0.163636 is attributed: 0.4444, not 1.0. The false-flag rate goes 0.236364 -> 0.309091 against a shadow at 0.090909: 0.7059. Suppress every 3rd instead (19 cases) and it falls further, 0.0500 and 0.2083 -- the right direction, and the monotonicity is the evidence that the guard is reading the injection rather than noise. Deterministic by CRC of the case key, never `hash()` (salted per process) and never iteration order (C-S2). It is a BELIEF error and not a world change, asserted rather than assumed: every `_SAME_WORLD_KEYS` stat is identical to baseline (the truth lives in `self._records`, built from the `PaymentEvent`, never from what crossed the seam) and the portfolio balances still match to the penny. DIRECTION CHECKED TOO: an undelivered credit can only make the company believe MORE debt is owed, so `understated_arrears_rate` and `unpursued_arrears_rate` must stay fully attributed under it, and they do -- a residual appearing there would mean the injection is doing something other than what the test says. R15 BOTH WAYS, and not by a hand-copied assertion: the guard''s predicate is extracted as `_assert_the_counterfactual_left_a_residual` and the MUTANT calls that same function under `pytest.raises`. The mutant is the rubber stamp in its purest form -- a shadow company forced clean BY CONSTRUCTION (its float components zeroed) while the injection, the population and the money are left exactly as the guard sees them. None of the three original guards fires (same world, balances match, channel exercised); every figure returns 100% attributed including the part caused by cash that never arrived; the new guard fires. That is the blind spot the atom named, demonstrated rather than argued. PUBLISHED AT SOURCE (the D6 precedent), so it reaches every consumer of this attribution and not just the surface someone remembered: `_attribution_discrimination` rides in the returned dict and in `headline.components`, and a clause rides in the rendered ledger note the Proof door reads. Its counts are DERIVED from the measures, so the sentence cannot outlive the figures, and the measures are NAMED as well as counted (the clause covers 5, the sentence it joins renders 4 -- a bare count sent the reader hunting for a fifth). The pointer it hands the reader is RESOLVED, not trusted: `test_d17_the_published_discrimination_pointer_resolves_to_a_live_guard` fails if the named guard stops existing, because a published sentence naming a dead mechanism is a measured failure class here. WHY AN INJECTED RESIDUAL AND NOT A NATURAL ONE: the guard D16 dissolved rested on a residual the world happened to supply, so an unrelated fix silently switched the control off and nobody noticed for a day. An injected one is exercised on every run rather than whenever the population is kind. R12 CLEAN: no published number moved -- the baseline measures are byte-identical (0.293948 / 0.090909 / 0.097983 / 0.0 / 0.236364 / 0.097983) before and after, the injection lives only inside the tests, and the answer was not chosen for making the attribution look more discriminating. 20 tests green in tests/background/test_live_payment_triad.py, 615 passed + 5 xfailed across all 26 test files touching the triad, gap_metric, couple_w2_11_d5 or the shared-quantity contract; ruff unchanged at 2 vs a pristine HEAD extract of both files. L3 NOT claimed: no Expert-Hour pass on the corrected instrument, and this is the tick that changed it.'
  origin_note: 'Minted 2026-08-09 by the D16 build, NOT fixed on sight (SELF_INTERRUPT_DISCIPLINE -- the machine is not blocked, and a tick that has just moved a published number is the worst possible one to also rewrite the control that judges it). The refuted test is REPLACED not repaired (the D7 rule) and names this atom in its own docstring, so the weakened guard cannot decay into an assumption that it is still guarding. R15 IS THE WHOLE POINT: a counterfactual is the easiest control in this repo to make un-failable -- subtracting a company from itself always yields a tidy zero and subtracting a DIFFERENT world always yields an impressive number -- and 100% attribution on every measure is exactly what a rubber stamp looks like from outside. It may nevertheless be the honest answer here; the atom is to find out WHICH, by measurement. R12 WALL: the answer may not be chosen for making the attribution look more discriminating. If the structural argument holds, the finding is that the counterfactual is complete on this world and the guard must be replaced with one that CAN fail (e.g. an injected non-allocation error), never with a looser threshold on the same measure.'
