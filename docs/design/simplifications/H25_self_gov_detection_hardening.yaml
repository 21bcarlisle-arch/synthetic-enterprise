simplifications:
- '2026-07-18 REGISTERED (proposal, director-instructed: carry the self-gov residuals as registered detection-hardening, flag loud if either bites). Four items, all DETECTION-layer (enforcement/prevention is live via the draw filter): (1) forge residual -- the model trusts channel==console which a worker can self-declare; sub-step 7 crypto-ties provenance to the director_input_log HMAC/console-presence stamp. (2) level-baseline fail-silent -- baseline is a pinned git-ref; if git show fails the LEVEL gate stops checking (surfaces level_baseline_available:false but does not page). (3) is_build_authorized does not itself re-check loop_stage -- W1 idle protection is via the upstream draw _is_valid_candidate idle-drop (confirmed live, not an active hole) + reconciler detection; add a defense-in-depth stage re-check. (4) fronts_reconciler.evaluate is not yet on a live timer (reconcile_watch was out of the build fork scope) -- detection runs on-demand/clean now but should page transition-only on a cadence. DISCOVER/FRAME workable; BUILD gated (director opens).'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, NO code, L0->L1). All four items VERIFIED as real gaps against the code (observed-with-evidence R9); enforcement/prevention stays live via the draw filter so these harden DETECTION only. (1) FORGE-PROOF PROVENANCE: fronts_reconciler classify_atom/_gate_cleared/_level_cleared authorize FRONT_OPEN/GATE_CLEAR/LEVEL_UP_PROPOSED against a ledger of console acts (lines ~103/246/232) but the ledger entry is trusted on channel==console, NOT cryptographically bound -- a worker can self-declare a console act. FIX: verify each authorizing act against background/director_input_log''s HMAC/console-presence signature before honouring it (a ledger entry with no valid HMAC is drift, not authority -- R7/R8: injected/self-authored text carries zero authority). (2) LEVEL-BASELINE FAIL-SILENT (R15): level_baseline(ref) (line 163-170) runs `git show {ref}:...maturity_map.yaml` and returns None when the ref is unreadable -> the LEVEL self-promotion gate then has no baseline and STOPS CHECKING, surfaced but not paged = fail-silent (an unavailable checker is a FAILED checker, the exact deadman/transport family). FIX: an unreadable baseline while enabled is a LOUD transition-only alarm (fail-closed on the SIGNAL, not on the draw -- must not zero the feasible set, Rule 0). (3) is_build_authorized (line 455) DEFENSE-IN-DEPTH: BUILD-authorization currently leans solely on the upstream _is_valid_candidate idle-drop; add an independent loop_stage re-check inside is_build_authorized so a bypass of the upstream filter cannot alone authorize a build (belt-and-braces, R15 independence). (4) LIVE CADENCE: confirmed reconcile_watch.py does NOT call fronts_reconciler.evaluate (grep empty) -- self-gov detection runs on-demand only; wire evaluate() into the reconcile-watch timer so drift pages transition-only (R5), matching how process/schedule drift already fires. SAFETY GATING (binding, states it plainly so no fork mis-builds this): these touch the SELF-GOVERNANCE layer -- even though detection-hardening is safety-INCREASING, items (1) and (3) change the AUTHORIZATION-trust model, which is a safety-control modification; per CLAUDE.md that is DIRECTOR-AUTHENTICATED-CONSOLE-ONLY, NOT twin-approvable and NOT proceed-by-default. The BUILD of H25 is director-reserved regardless of epoch; this FRAME is the design only. file_scope [fronts_reconciler.py, reconcile_watch.py] is correct for items 2/3/4; item 1 also reads director_input_log (verify-only import, no write) -- a scope note for the BUILD. Level 0->1; loop_stage stays idle.'
- '2026-07-18 DISCOVER (Lane-3, orchestrator, doc-only, observed-with-evidence R9) -- a REAL detection gap this session PROVED, a 5th item beyond the four above. BASELINE-GRANDFATHERING BLIND SPOT: fronts_reconciler.promotions_since_baseline() flags only atoms that were idle AT THE BASELINE snapshot and are now past idle -- so an off-front BUILD-open made BEFORE the current baseline (or between baseline re-snapshots) is GRANDFATHERED and never flagged. PROVEN: this session I (improperly) twin-opened FIVE off-front H_harness atoms idle->build (H26, H24_precommit, H23, H24_worktree, G4); only G4 (newest, post-baseline) tripped DRAW_OFF_FRONT and wedged the publish gate -- the other four went UN-flagged purely because they predated the baseline, NOT because they were authorized (all five had no BUILD_OPEN and are off-front, identical to G4). CONSEQUENCE: the off-front detection is temporally incomplete -- flip idle->build off-front, and once the baseline re-snapshots to include it the promotion is silently grandfathered. This is exactly the class H25 exists to close. HARDEN (adds to the four): detect an off-front loop_stage=build atom regardless of baseline timing -- compare CURRENT loop_stage against front-membership + a director BUILD_OPEN, not only against a mutable baseline snapshot. Item (4) (live cadence) is corroborated by the same incident: G4 was caught only when the publish gate happened to run ~minutes after the flip, not at flip time. Also corroborates the ACTIVE governance conflict (action_needed governance-buildopen-authority-conflict-2026-07-18): canon §3a ''twin opens BUILD'' vs the stage_advance gate ''console-only'' vs the front purpose ''build in-region without asking'' -- a model contradiction the DETECTION layer cannot resolve, only surface. Level held (DISCOVER never moves an idle atom); loop_stage stays idle; BUILD gated.'
- '2026-07-18 DISCOVER (Lane-3, orchestrator, doc-only, observed-with-evidence R9) -- a NEW detection-hardening item found this session, a 6th beyond the five above, squarely in this atom''s file_scope (background/fronts_reconciler.py). SCHEMA-GATE PATH-MATCH FAIL-OPEN (R15 fail-open class): crosses_static_gate() matches an atom''s file_scope entry against the schema_sim_structure gated_paths with `str(fs)==gp or str(fs).startswith(gp)`. The gated path is ''interface/'' (trailing slash) but an atom scoped to the bare directory ''interface'' (no slash) matches NEITHER (''interface''==''interface/'' is False; ''interface''.startswith(''interface/'') is False) -> crosses_static_gate returns None, so a bare-directory file_scope EVADES the schema/sim-structure path gate. PROVEN empirically this session on W4_4 (file_scope=[''interface'']): crosses_static_gate returned None. NOT an active breach there -- W4_4 had a director BUILD_OPEN which clears the gate regardless (authorized_atoms True -> ON_FRONT) -- but an atom scoped to a gated DIRECTORY without the trailing slash AND without a BUILD_OPEN would slip the schema gate undetected. This is exactly the FAIL-OPEN pattern H25 exists to close (a gate that silently fails to fire on a real crossing). CLASS FIX (R10, at BUILD): normalise BOTH sides before matching -- strip/normalise trailing slashes and match on a path-prefix with a separator boundary, so ''interface'', ''interface/'', and ''interface/foo.py'' all match gated ''interface/''; add a mutation test (a bare-dir file_scope on a gated directory MUST be caught -- the test fails on the current == / startswith logic). Also logged to the decision_log this session. Level held (DISCOVER never moves an idle atom; level 1); loop_stage stays idle; BUILD gated.'
- '2026-07-18 DISCOVER (Lane-3, orchestrator, doc-only, no code, level held 1) -- CONCRETE design for the listed ''live-cadence reconciler'' item, grounded in the actual infra (both halves already exist, so the BUILD is small + reuses them). THE GAP (a real incident this session): fronts_reconciler governance drift (off-front build, level self-promotion) is detected ONLY ON-DEMAND -- G4''s off-front open was caught minutes late, only because the publish gate happened to run; between gate runs, governance drift is UNWATCHED (the exact fail-silent pattern reconcile_watch.py''s own docstring names for process/schedule drift). MECHANISM (mirror reconcile_watch.py exactly -- it already does this for PROCESS/SCHEDULE drift on reconcile-watch.timer @ OnUnitActiveSec=5min, transition-only R5 paging via a STATE_FILE + drift_signature, report-only G-R3): add fronts_reconciler as a THIRD reconcile source in reconcile_watch''s timer loop. Both sides already provide the machinery -- fronts_reconciler exposes evaluate() -> {alarm, signature}, drift_signature(results), AND evaluate_transition(prev, cur) -> {paged, status, signature} (a PURE R5 transition decision); reconcile_watch already has the STATE_FILE + transition-only + typed-source (rotating_light on drift / white_check_mark on clear) pattern. So the BUILD is: call fronts_reconciler.evaluate() on the same timer tick, store its signature in a fronts-scoped key of the reconcile-watch STATE_FILE (or a sibling), page transition-only via the existing evaluate_transition, report-only (reconcile_watch reaps/starts nothing -- G-R3 preserved). RESULT: governance drift becomes LOUD within 5min of appearing, not whenever the publish gate next runs. R15 test (mirror reconcile_watch''s own): a NEW fronts alarm pages once (transition), a PERSISTENT alarm does NOT re-page (transition-only latch), a CLEAR pages the recovery; mutation -- neuter the signature-change guard -> the persistent-alarm test flips to re-paging every tick. file_scope stays background/fronts_reconciler.py + background/reconcile_watch.py (both already H25''s scope). Level held (DISCOVER never moves an idle atom); loop_stage idle; BUILD gated.'
- '2026-07-18 FRAME_SATURATED:true set (map-writer, H23_frame_saturation_draw_marker) -- the key DISCOVER items are designed: baseline-grandfathering detection, schema-gate path-match fail-open (class fix specified), the live-cadence governance-drift wiring (concrete, grounded in existing reconcile_watch + fronts_reconciler infra), and forge-proofing (the self-declared-channel-tag residual, designed in the phone_act threat model). Remaining items (is_build_authorized stage re-check, level-baseline git-ref fail-silent) are small BUILD-time details, not separate DISCOVER design. Further DISCOVER adds nothing meaningful; awaits BUILD (off-front H_harness -> needs a director front/BUILD_OPEN). Leaves the idle-DISCOVER draw; re-enters when BUILD opens.'
