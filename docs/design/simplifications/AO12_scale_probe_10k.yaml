map_notes:
  name: 'The 10k probe defined by docs/design/refs/ADVISOR_REVIEW_DATA_ARCHITECTURE_AND_SCALE_PROBE_2026-08-05.md, minted 2026-08-10 under the backlog-triage Group A instruction (verify the probe atom exists; mint if not -- it did not). Synthetic 10k-customer book from the existing per-run population draw, instrumented for peak RSS, per-stage wall time and per-artefact output size. Bounded: 1 year x 10k before any decade attempt, hard wall-time cap, scratch outputs only (canonical files untouched). A PREDICTION REGISTER is written BEFORE the run (advisor ranking: in-run RAM at settlement build > run-output serialization > per-customer site publish > git transport) and the probe confirms or refutes the ordering -- a surprise ordering is the most valuable outcome. KNOWLEDGE is the success criterion: the probe succeeds even if the run dies, provided it dies measurably. EXPLICITLY NOT IN SCOPE: any fix, any database or substrate adoption, any schema work -- measure first (R4); a storage swap is an architecture door, not a build, and findings return to the director before any substrate decision.'
