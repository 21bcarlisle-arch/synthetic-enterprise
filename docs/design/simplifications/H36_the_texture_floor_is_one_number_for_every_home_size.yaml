atom_id: H36_the_texture_floor_is_one_number_for_every_home_size
map_notes:
  origin_note: 'MINTED FROM the L1.1r/L1.1e dispositions in the H35 section of docs/design/BAND_NULL_SWEEP.md (2026-08-09). MEASURED at the applied window (couple_fabric PANEL, 15 homes x 120d, both bands exercised for the first time): L1.1r is INSIDE its own null (threshold 0.0363 against a null best of 0.1228, margin -0.0865) and L1.1e is SAME_ORDER (margin +0.0010 inside a null spread of 0.0302). THE CAUSE, measured not argued: both electric floors are `0.15 x behavioural share` where the share comes from ONE published typical home -- Ofgem TDCV medium against a DESNZ/ESC median-SPFH4 heat pump (47.0%) and against resistive heat (24.2%). The panel''s homes are not that home: heat share of own electricity runs 0.305-0.624 across the heat pumps and 0.356-0.738 across the resistive homes, and EVERY home clears the floor the band''s own arithmetic gives at its OWN share -- including H11, which fails the fixed 0.0705 floor by 0.2% and clears its own-share floor of 0.0564 by 25%. WHICH REPAIR, per BAND_NULL_SWEEP''s own diagnostic rule: the resistive population reads no higher than its null (observed median 0.1031 vs null best 0.1228), which is the statistic-has-no-discriminating-power reading rather than the threshold-too-low one -- for a heat-dominated home, half_hourly_texture is dominated by the thermostat''s own on/off blocks rather than by appliance events. EXIT: (1) the texture floor for an electrically-heated home is derived from THAT home''s behavioural share rather than from one published typical home, using the same published inputs and the same arithmetic (this is not a new anchor, it is the existing anchor applied per home); (2) the share the floor is computed from is a WORLD quantity the harness already holds (space_heat_grids), never a company measure and never read off the statistic being judged -- the independence is asserted, since a floor derived from the same series it judges is R15''s tautology pattern; (3) re-swept: L1.1r and L1.1e are measurable and NOT inside their nulls at 40/60/90/120d, or the residual is named and dispositioned rather than tolerated; (4) R15 both ways incl. a home whose behavioural share is genuinely tiny, so the per-home floor cannot collapse to zero and pass everything; (5) the H35 breach (H11 vs the fixed 0.0705 floor) is re-judged under the repaired band and its outcome recorded either way -- if it still fails, that is a generator finding and gets its own atom, and it must NOT be resolved by the repair being tuned until it passes (R12).'
