atom_id: PW2_failure_clears_its_own_alarm
map_notes:
  build_note: '2026-08-09, L0->L2. (1) CENSUS by derivation: background/self_clearing_alarm_census.py intersects the writer set with the reader set per state path over background/ + tools/ -- 2337 functions, 117 state paths, 28 hits. Writer/reader membership is AST plus a transitive call-graph closure, which is what finds the instance at all: record_publish_gate_failure contains no file call, it writes only via _write_publish_gate_state. Two classifier rules carry the weight and need no lexicon -- read-modify-write of a control''s own state, and writing the state while raising the alarm in the same path; the first is what caught .operational_layer_signal.json, which no naming rule reaches. All 28 hits dispositioned in docs/design/self_clearing_alarm_dispositions.json: 5 real, 23 benign-with-reason. (2) GUARD: background/episode_monotonic.py -- episode starts are low-water, episode counters are high-water, and only an evidenced close may reset either. Wired into the instance: _write_publish_gate_state(episode_closed=...), where the close is evidenced by pending_run_complete_markers()==0 -- an INDEPENDENT signal (R15 anti-tautology), so the ''or a clean skip'' clearing path that caused the defect can no longer zero the episode. The four other real hits are REGISTERED as PW4_guard_remaining_episode_states, not guarded here: each needs its own answer to ''what evidences a close'', which is a per-control judgement, not a mechanical edit. (3) R15 both ways, 29 tests. The headline is the replay: the recorded 2026-08-09 sequence (wedge_since 04:03:22Z through the last manufactured fresh episode at 14:30:09Z) reports 10.4h guarded, and the same replay with the guard removed reports 14min -- the mutation is a test in its own right, so the replay cannot quietly stop reproducing the defect. Vacuity guard: census_is_vacuous() makes an empty census a FAILURE, mutation-tested on each of the five ways the derivation can go blind. The disposition gate is mutation-tested too (drop the instance''s row, or leave a ''benign'' with no reason, and --check goes red). LEVEL HONESTY: L2 not L3 -- the guard has never yet caught a live episode in the wild; it is proven on a replay of a real one.'
  origin_note: 'This is the second-order form of a fail-silent control (R15): the check does fail, and does alarm, but the alarm''s SEVERITY is derived from state the failure just overwrote -- so the louder the failure, the quieter the signal. The census is the deliverable; the fix to the publish gate alone would close the instance the director explicitly said not to close.


    AS MINTED (moved verbatim from the map''s `name` field 2026-08-10, at the spine size ratchet -- the record is not lost, it is in the place the ratchet exists to push it):

    DIRECTOR_STEER_SECOND_PUBLISH_WEDGE_2026-08-09 OBSERVATIONS, carried as a named class (director: ''That is a class, not an instance. Where else can a check''s failure clear the signal that the check failed?''). The publish failure path wrote to .publish_gate_state.json -- the same state the alarm reads for episode memory -- so each failure reset wedge_since and the alarm truthfully described a fresh 14-minute wedge inside a 10-hour episode. EXIT: A CENSUS first, then a guard -- in that order, because an instance fix on .publish_gate_state.json is exactly what R10 forbids. EXIT: (1) an enumeration of every control in background/ and tools/ whose failure path WRITES to a state file its own alarm/severity READS, produced by a derivation (writer set intersected with reader set per state path) rather than by inspection, with each hit dispositioned real / benign-and-why; (2) the shape is guarded -- for each real hit the episode-scoped field is append-or-monotonic so a failure cannot shorten its own episode, and a test proves the guard fires by replaying the 2026-08-09 sequence and asserting the reported episode length is ~10h and not ~14min; (3) R15 both ways, including a vacuity guard proving the census is non-empty on the live tree (a census that finds nothing is the fail-open shape here).'
  name: A failure must clear the alarm it raised. Closed L2/L2 -- full mint text in origin_note, build record in build_note.
