atom_id: D37_the_door_row_is_four_provenances
map_notes:
  gain: 'A render-site sweep that treats the door as one surface credits a figure with a site it never renders at: `gap-val` re-renders the ledger CARRIER at 3dp and owns only the dimension handed to the ledger writer, while `note` prints the composed note verbatim and so carries every figure''s own renderer''s digits. Landed as `_DOOR_SITE_KEY` / `_DOOR_REGIONS` / `_door_row_regions` (H27 Expert Hour #21): the row is split by provenance, and a figure''s render site is asserted per region.'
