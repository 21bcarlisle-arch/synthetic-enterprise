simplifications:
- '2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_rng_substream_primitive_2026-07-28.md, source DIRECTOR_RULING_SHARED_PRIMITIVES_AND_CODE_STANDARDS_2026-07-28 section 2.2. DISCOVER half CLOSED 2026-07-28 (docs/design/RNG_SUBSTREAM_PRIMITIVE_DISCOVER.md): 16 derivations found against an estimate of ~8, in 5 DISTINCT formulas, with a CONCRETE Formula-A namespace-collision risk identified -- i.e. two subsystems can currently be handed the same substream. BUILD half was parked behind director_build_open, an act abolished 2026-07-29 and swept 2026-08-03; registering it here converts it from staging noise into drawable work (R17 consumed-not-absorbed). DISJOINT from SP2_1 (date arithmetic) -- the ruling states they may run concurrently.'
- '2026-08-03 MINT -- THIS IS THE C-S2 SCALE CONSTRAINT MADE REAL, not tidiness: "each subsystem draws from its own named seeded substream, so a new draw never shifts another subsystem''s outputs" is the property that makes deterministic replay hold as the sim grows. R15 BOTH WAYS: construct two subsystems whose names collide under the old Formula A => the collision control FIRES; under the canonical namespaced primitive => it passes. FAIL-OPEN GUARD: an unnamed or empty namespace must NOT silently fall back to the global stream -- that is the exact fail-open that makes the whole primitive theatre. R12/R13: replacing the derivation WILL move generated series; those moves are a mechanical consequence of re-seeding and must be reported as such, never tuned toward any company outcome, and the BASELINE world may only change for fidelity reasons decided blind to P&L.'
- '2026-09-28 BUILD, L1 EVIDENCE MET BUT LEVEL HELD AT 0 (tick worker): record_level_up_self_certified was REFUSED by OPS11 -- lane G_data_learning holds SEAT_FINDING_THE_C1_BRACKET_HAS_RETURNED_AND_IS_UNGRADED_2026-09-28.md with no severity header; raise to 1 once it is classified or discharged, citing this entry. simulation/rng_substream.py is the one derivation -- substream(namespace, name, base_seed), key byte-identical to Formula B so 11 modules (sme_distress, household_budget, dd_attribution, arrears_engine, payment_behaviour_source, premise_demand, willingness_classification, self_rationing, fabric_physics, demand_model, premise_trace) moved onto it with ZERO draw change, proven per module against the legacy formula. The census had grown from 11 to 18+ private copies since DISCOVER. DESIGN DEPARTURE from the DISCOVER doc: no length-prefixed encoding -- existing names carry ''::'' (payment_event::3, away::2024) and re-keying moves draws; injectivity is instead secured by refusing '':'' in the NAMESPACE (first ''::'' ends it) and a non-int seed (last ''::'' starts it). Empty namespace is REFUSED, not defaulted (the fail-open guard). R15: byte-order flip reds 12, dropping the empty-namespace refusal reds 1, dropping the colon refusal reds 2, a new private hashlib substream def reds the census. OWED for L2+: the 11 in NOT_YET_MIGRATED (tests/simulation/test_rng_substream.py) -- Formula A/C and 4-part variants whose migration IS a baseline break, each needing its own pinned-value re-freeze and the ruling section-8 open-campaign check at draw time.'
