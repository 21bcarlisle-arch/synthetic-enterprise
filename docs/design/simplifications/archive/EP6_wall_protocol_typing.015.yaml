simplifications:
- '2026-08-20 pass 18 IS THE EXPERT HOUR pass 17 NAMED, and it failed. Level HELD at 2. The named next move was a cold-eyes walk on channel D against the REPORTS rather than the code: can a reader who has never seen this atom tell from the CLI output alone that HEAD''s 0/1,996 is a stale artefact and not a broken wire. THE ANSWER IS NO, and the walk is the evidence. HEAD b22698df8 printed, verbatim: `channel D: all 3 wire site(s) put the version on the wire.` / `channel D on the artefact: 3 silent, 0 unresolved, 0 unobservable` / `! artefact meter_read_log 0/1600 row(s) carry a version`. A green code half and a zero artefact half contradict each other on their face, `!` reads as a defect marker, and nothing anywhere in the output dates the bytes. Pass 17 read that same disagreement as PROOF THE TWO HALVES ARE INDEPENDENT, which it is; what it did not notice is that the disagreement is also exactly what a broken wire looks like, SO THE REPORT COULD NOT TELL THIS ATOM''S SUCCESS CASE FROM ITS FAILURE CASE. That is a defect in the instrument, found by reading its output as a stranger and not by reading its code, which is the whole reason the Expert Hour was booked against the reports.

  BUILT: `artefact_provenance` orders the artefact against the modules that emit its rows, by COMMIT TOPOLOGY (`merge-base --is-ancestor`, never commit dates -- a rebase rewrites a date and two commits a second apart can land either way). THE SUBJECT IS DERIVED, pass 17''s discipline held: the producers come from the wire call sites themselves (`producer_paths_of`), so a fourth port emitting from a fourth module is dated the day it lands rather than omitted from a hardcoded three. THE READING AT HEAD, and the first thing this atom has ever been able to say about WHEN: the artefact''s last commit e9cdef112 (2026-08-19 05:17) is a strict ancestor of 0a242d6fa (2026-08-19 23:33), which landed all three wire sites at once -- the bytes were published EIGHTEEN HOURS BEFORE THE CODE THAT WOULD HAVE PUT THE VERSION IN THEM EXISTED. The CLI now says so under the silent logs: `the artefact PREDATES 2 of 2 producer(s) ... -> a silent log above is STALE BYTES, not evidence of a broken wire`.

  THE ASYMMETRY IS THE HONEST HALF AND IS ASSERTED BY A TEST. "Older than a producer" is a SUFFICIENT explanation of silence. "Not older than any producer" is NOT a production stamp and the report is forbidden from printing it as one -- a publisher process still running pre-migration code commits fresh bytes at any time (R2, committed is not running), and lands in exactly that bucket. So this narrows the reading from UNKNOWN to UNEXPLAINED and closes nothing: WORKER_FINDING_THE_PUBLISHED_ARTEFACT_CARRIES_NO_PRODUCTION_STAMP_2026-08-15 stands, and `test_the_report_REFUSES_to_claim_production_on_its_own_green_case` fails if the caveat is ever dropped from the green branch.

  R15: 11 new proofs, 64 passing in the file, and the two doctrine mutations were RUN not asserted. (1) EXCUSE-EVERYTHING: force `_strictly_precedes` to True and the same two files in producer-then-artefact order report `predates=[''simulation/run_phase2b.py'']` where the real control reports `[]` -- a verdict that says "stale" whichever way the commits went would excuse every genuinely broken wire while looking exactly as helpful, and the null control is the same two files in the opposite order giving the opposite reading. (2) FAIL-OPEN: make `_last_commit_touching` never return None and an undatable producer''s `undetermined` goes `[''simulation/run_phase2b.py'']` -> `[]`, at which point an empty `predates` prints the reassuring "no older than any producer" ON A QUESTION GIT NEVER ANSWERED. Both fired. BOUNDARY, the value the rule is most easily wrong about: artefact and producer in ONE commit is not staleness -- there is no order between them -- so `_strictly_precedes` returns False there and None only for a real fork. INDEPENDENCE against R15''s tautology: the artefact''s rows go from carrying to silent and the verdict moves for the unrelated reason that the republish is a later commit; contents never enter the ordering. FAIL-CLOSED three ways: an artefact with no commit at the rev is UNDETERMINED not current; a dirty worktree artefact is UNDETERMINED rather than dated by the commit that last touched its path (wrong in the reassuring direction on every tree with a daemon running, which is this tree today); and no wire sites at all is still NOT refused, because a paid-down channel D is this atom''s success case -- it prints "no producer to be dated against" and withholds the sentence that would convict a silent log with no subject to convict.

  STILL NOT A GATE and the condition is unchanged -- gating the artefact half would red the repair and pass the breakage until the artefact can say which code produced it. The live test asserts the question is ANSWERABLE (producers found, artefact dated, nothing undetermined) and deliberately not WHICH WAY it goes, because which way it goes is a property of when the last sim run published and pinning it would red a tree with nothing wrong with it.

  L3 STILL NOT CLAIMED, and the remaining condition is now the only one left standing: the Expert Hour is DONE and it found a defect, so pass 17''s first blocker is discharged; what remains is that THE OTHER FIVE CENSUS CHANNELS HAVE NO WIRE QUESTION TO ASK. Channels A, B, C, E and F are enumerated -- `channels_without_an_enumerator()` is empty -- but enumeration answers "who crosses here", not "does the crossing conform", and only D has the second half. L3 is the per-channel conformance shape, so it needs at least one more channel to own a conformance question of its own before "every channel across the wall is measured" is a claim rather than a count.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): give CHANNEL C its conformance question. C is the largest channel at 19 members and is the envelope channel, so its question is the one D''s answers -- does an envelope crossing carry its version on the wire -- asked of `interface/contracts/wall_envelope.py`''s importers rather than the typed ports. That is the cheapest second channel because the machinery this pass and pass 17 built (`wire_call_sites`, `wire_publish_keys`, the four-population artefact verdict, the provenance bound) is channel-agnostic in everything but the port-module filter, and two conforming channels is what turns a per-channel conformance shape from a sample of one into the L3 claim.

  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the unreadable-report defect is this atom''s own instrument and was repaired in the same pass that found it, not a defect in another lane''s mechanism.'
