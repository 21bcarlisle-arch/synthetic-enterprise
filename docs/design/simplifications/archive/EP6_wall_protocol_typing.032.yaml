atom_id: EP6_wall_protocol_typing
chunk: 32
simplifications:
- '2026-08-20 pass 36 BUILD, level HELD at 2, loop_stage stays build. THE HANDED-FORWARD ITEM WAS THE CHEAP ONE BECAUSE NOBODY HAD ASKED WHAT ENDS THE STATE IT CREATES: hearing `NOT_KNOWABLE_YET` was worthless until a resolution could still land on the id the honest answer had already burned. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD ae5f77a86, worktree, with this atom''s eight file_scope files CLEAN against HEAD before the pass.


  WHAT PASS 35 HANDED FORWARD, VERBATIM: "(1) `NOT_KNOWABLE_YET` is UNHEARD and needs only a reader -- the writer exists, the event already occurs, and this is the cheapest of the three and the only one with no design question in it." The writer half is true and was re-checked (`simulation/payment_seam_adapter.py:308`, the DISPUTE branch, with a live generator branch behind it at `simulation/arrears_engine.py:405`). The rest is false, and this atom''s own pass-29/pass-35 lesson is what found it: check the PRECONDITION of the repair you were handed, not the sentence.


  THE MEASUREMENT, and it is the finding. `PaymentObservationConsumer.observe` marked a `correlation_id` processed whatever the status, so the reader pass 35 proposed would have read a state with NO EXIT. Run against the live class as it stood: a `NOT_KNOWABLE_YET` for `INV-1`, then the OK remittance that resolves it, returns True then FALSE -- the resolution dropped as a duplicate re-delivery, GBP 120.00 of received cash never posted, the account still reading 120.00 outstanding. The NULL CONTROL beside it is what makes that a defect rather than a design: the identical resolution, on a consumer that had never heard the pending answer, posts normally and the balance clears. HEARING THE HONEST ANSWER WAS THE ONLY THING THAT COST THE COMPANY THE FACT.


  WHY THE SHIPPED DOCSTRING SAID OTHERWISE, because it named this exact scenario and got it backwards. It claimed marking non-OK processed was safe since "a resolved response uses a fresh, later `WallResponse` for the same fact per the envelope''s own bitemporal-restatement rule". Fresh RESPONSE, yes. Fresh CORRELATION ID, no: `interface/contracts/wall_envelope.py` says a `WallResponse` is "Matched to its request ONLY by `correlation_id`" and that a restatement "is always a NEW `WallResponse` with a later `observed_at` for the same `valid_time`". The id is the crossing; the resolution necessarily arrives on it. The claim was checked against the sentence next to it rather than against the contract it cited.


  THE REPAIR IS A SPLIT, NOT A FLAG. One processed-set could not tell "a fact is in hand" from "an answer is still owed", so it became two: `_resolved_correlation_ids` (an OK landed -- a re-delivery must never post twice, C-S2) and `_unresolved` (latest answer was non-OK -- still open). Four limbs, each a different obligation: a resolved id refuses everything (a payload-less response cannot restate a value, so "not yet" never revokes observed cash -- the conservative limb, and exactly what the method did before); a non-OK no later than the one held is a re-delivery or a late-arriving older answer (C-S1) and returns False; a later non-OK SUPERSEDES; an OK resolves, clears the register and posts.


  THE READER IS ONE BRANCH AND ONLY ONE, WHICH THE CENSUS BESIDE IT DICTATED. `UnresolvedCrossing.awaiting_resolution` is `status == WallStatus.NOT_KNOWABLE_YET` and nothing else. That member is the only non-OK answer that says something about the FACT (the counterparty has it, it is not resolvable yet, an answer is still owed); `TIMEOUT` and `ERROR` say something about the EXCHANGE. A branch for either of those would have been a reader for a message NOTHING IN THIS BUILD SAYS -- the dead arm pass 35''s `status_liveness_conformance` exists to stop, and which its live test asserts against. They are recorded undifferentiated, which is honestly all this company can do with them today.


  THE LIVE READING MOVED, by the atom''s own instrument and not by narration: `status_liveness_conformance_at(worktree=True)` was 1 of 4 at HEAD and is 2 of 4 now, `unheard` empty, `NOT_KNOWABLE_YET` said by `simulation.payment_seam_adapter` and distinguished by `company.billing.payment_observation_consumer`. The 23b live test was written to FAIL on exactly this ("WHEN THIS GOES GREEN the assertions below fail") and did, before being tightened: `live` is now GROW-ONLY, `unheard` is asserted EMPTY rather than bounded, the red buckets stay shrink-only.


  WHAT THIS DOES NOT BUY, THREE LIMITS, EACH MEASURED RATHER THAN HEDGED.

  (a) THE WORLD NEVER SENDS THE RESOLUTION. `emit_wall_responses` maps one `PaymentEvent` to its responses and no dispute RESOLUTION is ever emitted -- while the world models one, at `simulation/arrears_engine.py::ic_arrears_stages`: PAYMENT_PLAN_AGREED at +30d if eventually resolved, WRITTEN_OFF at +60d if not. So in a run the register opens and never closes. The EXIT is proven at the unit level (a later OK lands, and the mutation test shows the shipped rule losing it), so the state is no longer structurally terminal -- but the writer that would clear it in a live run does not exist, and that is the next piece of work, named.

  (b) NO NOT_KNOWABLE_YET CROSSES THIS WALL IN THE ONE SCENARIO THAT RUNS. `tools/couple_w2_11_d5.py:596` fixes the triad population to `segment="resi"`, and `payment_outcome` can only return "dispute" on the corporate (I&C) branch or via `sme_payment_outcome`; 100,000 resi draws across all five methods returned only success/failed. So the census''s SPOKEN is a mention-count, not a traffic-count, and here the difference is visible: a member can read `live` in the vocabulary and never cross the wall in the scenario the triad draws. A liveness question asked of TRAFFIC rather than of mentions is a candidate next instrument, and it would be a different question from both existing channel-C ones.

  (c) THE OTHER CONSUMER STILL REFUSES THE ANSWER, and pass 35''s wording for it was one step off in the same direction its own wording was off about dormancy. `company/market/flex_participation.py:270` does not collapse `NOT_KNOWABLE_YET` into not-OK -- it raises `WallProtocolError("CONTRACT_VIOLATION")` on any payload-less response, i.e. it treats the envelope''s proudest answer as a MALFORMED MESSAGE. That is a stronger defect than "collapsed", and it is not repaired here: that seam is UNSOLICITED INBOUND (`seam_conversation_conformance`, 1 of 3), so nothing asks it anything, and its repair sits behind the conversation repair rather than behind this one.


  THE ADJACENT WIRING DELIBERATELY NOT DONE, because it would have been a claim the seam never made. `company/billing/account_ledger.py`''s named simplification (3) says dispute state is PASSED IN as `disputed_refs` and "the live wiring is a seam-crossing job", and this atom is that seam. The register is NOT wired into `disputed_refs`: an unresolved crossing means "the counterparty has not answered yet", which is not the same assertion as "this invoice is under formal dispute", and treating them as one would move `expected_collection_misses` and the ageing buckets on a claim the wire does not carry. Named as the successor question, with the distinction stated, rather than taken because it was reachable.


  ATTRIBUTION, AND WHY IT FAILS TOWARD SILENCE. A non-OK response carries no payload and therefore no `account_id` -- the correlation id is the whole of what arrives. `unresolved_crossings(account_id, as_of)` joins by EXACT equality against that account''s own billed `invoice_ref`s (exact where the caller sets `correlation_id == invoice_ref`, which is the triad''s DD path) and matches nothing otherwise: a push payment quoting no invoice reference is attributed to NOBODY rather than to a guess. Parsing the id would be attribution by substring, a class already on this project''s record. Unattributable crossings stay visible in the account-less call, so the register loses no crossing, only a claim about whose it is.


  R15. 9 tests added (32 -> 41 in the consumer file). MUTATION: the shipped rule -- one processed-set, any status -- reproduced inline over the identical stream, asserted to return False on the resolution and to leave GBP 120.00 unposted, so the control fires on its own named defect. NULL CONTROL: the never-told consumer reaching the same balance, without which the headline test asserts only that cash posts. C-S2 (a redelivered pending answer is a no-op and does not multiply in the register), C-S1 (a later answer supersedes, an older one arriving late does not), the resolved-wins limb, the Blindfold (a crossing observed after `as_of` is absent from both the register call and the snapshot), attribution-to-nobody, and order-independence across three arrival orders. `ruff` clean on both changed source files; the two pre-existing I001s in the consumer test file are at HEAD and unchanged.


  MAP EDIT: `file_scope` gains `tests/company/billing/test_payment_observation_consumer.py` -- the file this pass''s controls live in was not in the declared scope, which is the "landable set is wider than the file_scope" class this project has recorded before. Same reading pass 35 used: `file_scope` declares which files an atom owns, changes no difficulty, sets no target, tunes no output.


  WHAT REMAINS FOR L3, and for the first time these items have an ORDER between them rather than a list. (1) A world-side WRITER for dispute resolution, so the register can close in a run and not only in a test -- and it is the only remaining item with no upstream dependency. (2) `ERROR` needs a writer then a reader; INFERRED, and flagged as a question rather than a plan: a structural refusal can be reported on an inbound message without any request having been sent, so ERROR does NOT appear to be blocked behind the conversation repair. (3) `TIMEOUT` needs a writer, and pass 35''s ordering question now looks answered in the affirmative: a timeout is a fact about a request that WAS SENT, both remaining seams are unsolicited inbound, so the conversation repair is the true predecessor of the TIMEOUT repair. That makes the seam-conversation finding upstream of one of the two vocabulary findings and independent of the other -- which is the first time this atom''s two open channel-C questions have been ordered against each other by anything but a guess.'
