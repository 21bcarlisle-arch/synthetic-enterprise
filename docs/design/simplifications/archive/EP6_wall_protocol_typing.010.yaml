nes 768-769 and 794-798 call\n`simulation.payment_seam_adapter.emit_wire_responses` -> `PaymentObservationConsumer.observe_wire`, inside\nthe triad that `simulation/run_phase2b.py` runs once per run. That is the L1->L2 bar (\"no longer dark\") and\nit is met by shipped code, independently of what pass 9 wrote about it.\n\nTHIS PASS'S OWN FINDING -- A MAP-ONLY COMMIT WOULD HAVE LOOKED PERFECTLY FINE. `tools/level_promotion_gate.py`\nreads its two inputs FROM TWO DIFFERENT TREES: the map from the INDEX (`_git_show(f\":{MAP_REL}\")` in `main()`)\nand the ledger from the WORKING TREE (`read_ledger()` -> `background.gate_authorization.LEDGER_PATH`, a plain\nfilesystem path). An UNCOMMITTED ledger row therefore authorises a COMMITTED level move. Committing the map\nalone here would have passed the gate and reproduced exactly the defect that commit 8233f3629 was written to\nrepair -- a count whose backing records had never been committed, leaving HEAD red in a way no working tree\ncould show. The two halves are consequently landed in ONE commit by pathspec in this pass. That is a\ncontrol-shape observation about the gate, not a defect in this atom: filed as a finding rather than fixed on\nsight (SELF_INTERRUPT_DISCIPLINE), because the supply of such repairs is infinite and this one is not blocking.\n\nL3 IS STILL NOT CLAIMED, unchanged from pass 9 and for its reason: exactly one of the 2026-08-15 census's six\nchannels is conformant, and the exit criterion stays per-channel conformance."
