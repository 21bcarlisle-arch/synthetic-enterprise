- "2026-08-15 (second pass of the day) DISCOVER ONLY, level stays 0, loop_stage stays idle\n(worker tick, LANE 3 idle draw). No BUILD code, no protocol designed, no adapter started --\nepoch-3 BUILD-gated on director-reserved curriculum sequencing (R13);\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 1 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` is touched for EXACTLY ONE bookkeeping line and no other: `simplifications_count: 2 -> 3` on this atom. NOT a level move, not a stage move, not a block-reason edit. The store append and that count are ONE ATOMIC WRITE -- appending a note without bumping the count reds `tests/design/test_simplifications_store.py:: test_counts_match_file_contents`, which is how this pass found out rather than by remembering. Checked before editing: the map carried no staged and no unstaged hunk from any other lane, so this commit strands no half of anyone else's atomic write. Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD 26c047083. Method is an AST walk of the two shipped reducers, run directly,\nnothing monkeypatched; plus the live `docs/reports/run_output_latest.json` parsed in FULL.\n\nTHIS PASS TOOK THE TASK THE 03:16 PASS NAMED AS THE FIRST BUILD MOVE -- and the result is that\nTHAT TASK IS THE WRONG TASK. Its recommendation, verbatim: \"The first BUILD move when the\ndirector opens epoch 3 is NOT a design and NOT the protocol: it is the PER-KEY PROVENANCE WALK\n-- which module first writes each of the 92 keys into the run output. Until the SIM-origin\nsubset is known, nobody can say whether channel F is a 7-key problem or a 60-key one.\" The walk\nis now done. It does not answer the question, and it cannot, for a structural reason that is\nitself the finding.\n\n==========================================================================================\nFINDING 1 -- THE UNIT OF PROVENANCE ON CHANNEL F IS THE FIELD, NOT THE KEY. A per-key walk\nis unanswerable for 38 of 92 keys BY CONSTRUCTION, because the orchestrator that produces\nthem binds both sides' values into one row inside one function scope.\n==========================================================================================\n\nTHE WALK, by mechanism, two levels with local-alias resolution (depth<=6) at each:\n\n  level 1  `saas/reporting/annual_report.py::extract_report_data`   92 keys returned\n  level 2  `simulation/run_phase2b.py::main`                        58 keys returned\n\nEvery published key chased through level-1 locals to its `phase2b[...]`/`run_output[...]`\nancestor, then through level-2 locals to a name whose defining import names a side\n(`simulation`/`sim` = WORLD, `company`/`saas` = COMPANY; 89 WORLD and 44 COMPANY names are\nimported into that one module).\n\n  RESULT, all 92 classified, none dropped:\n\n    UNRESOLVED           38    no single side is derivable -- see below\n    RUN_OUTPUT-LEVEL     27    ancestor is `run_output[...]`, built in a THIRD orchestrator\n                               (`simulation/run_phase4c_on_phase2b.py`), not walked here\n    COMPANY-ORIGIN       14    constructor traces to a `company.*`/`saas.*` import\n    BUSINESS-COMPUTED    11    no world ancestor at all -- computed in the reducer\n    WORLD-ORIGIN          2    `gri_trajectory`, `per_customer_behavioral`\n\nWHY 38 IS STRUCTURAL AND NOT A WEAK TRACER. Spot-checked three of them against the source\nrather than assumed. `all_records`, `customer_events_log` and `retention_log` are each declared\n`: list[dict] = []` at the top of `main()` (lines 1083, 1094, 1131) and populated by a single\n`.append(...)`/`.extend(...)` deep inside the nested term loop, where the appended dict is\nbuilt INLINE from company-computed and world-computed values in the same literal. There is no\nassignment for an alias-chaser to follow, because the value never had one owner.\n\nTHE LIVE ARTEFACT SHOWS IT AT FIELD LEVEL. Rows and field counts read from\n`run_output_latest.json`, not inferred:\n\n  `customer_events`  58 rows x 17 fields -- one row carries `company_churn_estimate` (the\n      supplier's BELIEF), `churn_probability` / `realized_churn_probability` / `random_roll`\n      (the world's GROUND TRUTH and its actual draw), and `churn_estimate_error_pct` (the GAP\n      BETWEEN THEM, computed and published as a field). Three provenances, one row.\n  `meter_read_log`   1,600 rows x 9 fields -- `estimated_consumption_kwh` (company) beside\n      `true_consumption_kwh` (world). This is the KNOWN W4_1 2026-07-22 registered gap; what\n      is new is that it is not a stray key, it is the SHAPE of the row.\n  `retention_log`    12 rows x 10 fields -- `company_churn_estimate` and\n      `expected_term_margin_gbp` (company) beside the realised `outcome`.\n\nSo the 03:16 pass's question -- \"is channel F a 7-key problem or a 60-key one\" -- has no\nanswer at the key level. The honest bound this pass CAN state: 2 keys are provably world-origin,\n14 provably company-origin, and 38 are mixtures whose composition is per-field. A protocol that\nversions and types KEYS would put a `schema_version` on `customer_events` and leave the belief,\nthe truth and the error term sitting in one undifferentiated row underneath it.\n\nAND NOTE WHAT THE MIXTURE ACTUALLY IS. `churn_estimate_error_pct` is the COUPLED TRIAD's own\ngap metric -- belief vs truth -- published as a field of the same record that carries both\noperands. That is not a defect: it is the harness measurement the triad exists to produce. It\nis decisive for EP6's shape, though, because it means the artefact is NOT a counterparty\nmessage and can never become one. A real counterparty never sees the error term; the harness\nmust. One wire cannot be both.\n\nFRAME -- what this does to the exit criterion, sharpening the 03:16 pass again:\n\n  RETIRED: \"per-key provenance walk, then decide.\" Done, and it cannot decide.\n\n  RETIRED: any exit criterion of the form \"every published key is envelope-borne or\n  grandfathered\". The 03:16 pass already weakened this for F on cathedral grounds; this pass\n  kills it on measurability grounds, which is the stronger objection. R15's own failure mode is\n  an unfalsifiable criterion, and per-key conformance on a per-field mixture is one.\n\n  WHAT SURVIVES, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): channel F is TWO wires\n  wearing one name, and EP6's first real move is to SPLIT them, not to type them.\n    (a) the COUNTERPARTY wire -- what a real supplier's systems would actually receive. This is\n        where the envelope belongs, it is small, and channels C and D are already most of it.\n    (b) the HARNESS wire -- belief, truth and gap together, which is the coupled-triad\n        instrument and must NEVER be envelope-shaped, because its whole value is that it sees\n        both sides at once.\n  The testable exit criterion that follows is a FIELD-LEVEL one and it is falsifiable at HEAD:\n  no field on the counterparty wire may be world-origin unless a real supplier could observe\n  it. `true_consumption_kwh` fails that today; `churn_estimate_error_pct` fails it and SHOULD,\n  which is exactly why it belongs on the other wire. The mutation proof is an injected\n  ground-truth field on the counterparty wire that must red the suite.\n\n  DEPENDENCY NOTE, unchanged and re-confirmed: EP7-EP15 (9 atoms) still inherit through\n  `depends_on`. They plug into (a), never (b).\n\nWHAT THIS PASS DID NOT DO, stated rather than implied. The 27 RUN_OUTPUT-LEVEL keys were not\nchased into `simulation/run_phase4c_on_phase2b.py` -- that is a third orchestrator and a third\nwalk, and it includes `meter_read_log`, `bills` and `contact_centre_log`, the three that carry\nthe known ground-truth leak. Extending the walk there is the obvious next DISCOVER draw. The\nlevel-2 walk covers `main()` only; a value assembled in a helper this module calls would read\nUNRESOLVED here for a reason that IS tracer weakness rather than structure, so 38 is an upper\nbound on the structural class, not a measurement of it. Stating the bound in the direction that\ncosts me the argument, because the finding does not need the larger number.\n\nONE FINDING FILED (SELF_INTERRUPT_DISCIPLINE -- queued, not fixed on sight):\n`docs/staging/WORKER_FINDING_THE_PUBLISHED_ARTEFACT_CARRIES_NO_PRODUCTION_STAMP_2026-08-15.md`.\nObserved on the way: `tools/run_annual_report.py::save_run_output_json` unconditionally writes\n`_cache_meta` (git_commit + generated_at_utc) and a versioned copy, and the live artefact has\nNEITHER -- `'_cache_meta' in d` is False and `docs/reports/run_output_versioned/` does not\nexist. So the artefact every provenance claim in this record rests on was not written by the\nonly writer that stamps it. That does not weaken the measurements above (they are of shipped\nCODE, plus row shapes that would be the same whoever wrote them), but a provenance atom whose\nown evidence file has no provenance is worth one document."
