simplifications:
- 'TWENTY-NINTH HOUR (2026-08-14, worker tick, H27 2->3 HARDEN draw), on the instrument''s own governance seam as Hour #28''s record required -- and it started in the TREE. THE FINDING: the citation control D45 (does the cell a citation names EXIST?) was on disk as 218 uncommitted lines of tools/map_assertion_provenance.py, carrying its own CLI flag AND a wire into the DEFAULT integrity-findings list -- a repo-wide refusal -- with `git diff --stat tests/tools/test_map_assertion_provenance.py` EMPTY. Not one test. That is the previous tick''s own finding one step further along: last tick a record asserted a mechanism HEAD did not carry; this tick a mechanism asserted a refusal nothing had exercised, caught BEFORE the commit rather than after it. AND AN UNTESTED CONTROL WAS A WRONG CONTROL, measured on the live bytes: of its 15 findings FIVE had no repair available to any reader, which is the signature of a finding manufactured rather than found -- a LANE GLOB (the token `W`, out of the prose ''a product-lane atom (W*/D/B/E/C/F/G-product/SITE...)'': nothing to mint, nothing to correct); a QUOTATION of a phantom id inside the very record stating it had been fixed (D6''s `D6a`); and the module''s OWN regex doc examples, i.e. findings the file manufactured about itself. Seven more of the same shape appeared the moment the tests existed, out of their own fixtures. MECHANISED (R12: no published number moved, no scorer touched): (1) `_is_id_shaped`, a second population filter DERIVED FROM THE MAP -- every one of the 296 live ids is lane+number or lane+slug, so a bare lane letter is a lane by construction -- pinned in the ADMITTING direction, which is the fail-open half a dropping filter would hide in; (2) the two genuinely stale slugs in tools/couple_w2_11_d5.py corrected to the map''s own (D28 and D35 were cited under Hours #10 and #17 working titles: same cell, same Hour); (3) the three self-inflicted removed -- doc examples now name cells that resolve, D6''s record says ''the id'' where it said ''atom'', and every fixture moved to a ZQ prefix with a pin that fails the day a ZQ lane is minted; (4) the pin the module''s own comment PROMISED BY NAME, `test_the_lane_number_grammar_matches_the_map_contracts`, which did not exist -- a mirrored regex nothing compares is a second description that rots from the day it is written. R15: 16 new tests (94 in the file) and THREE SOURCE MUTATIONS, each firing named tests and green on restore -- dropping the shape filter re-manufactures the lane glob on the live bytes, CITATION_FLOOR=0 turns a moved citing convention into a clean read, and a resolver that always returns None reds six. WHAT IS STILL OPEN AND IS THE WHOLE POINT: the map''s D series stops at D36, and NINE ids -- D37 through D45 -- are cited as minted atoms by nine consecutive Hours, by background/gap_metric.py, by the Proof door''s supplier and by this control''s own header, with `grep -c ''D3[7-9]_\|D4[0-4]_'' docs/design/maturity_map.yaml` = 0. `--citations` reports all nine by default now, and test_the_live_repo_still_carries_the_phantom_D_SERIES_this_hour_measured is the TRIPWIRE: it goes RED the day the mint lands. NOT taken here for the third Hour running, and the rank is now itself the finding -- it is a map edit that must decide which cell owns nine Hours of shipped work (D35''s file_scope holds most of it and still reads level 0 / idle) and nine cells minted at a non-zero level are nine recorded level moves under R16, which is a BUILD, not a fix-on-sight. THE 2->3 IS NOT TAKEN: this Hour added no instrument work and moved no published figure, so Hour #4''s two-consecutive-clean-Hours criterion stays at zero. Evidence: docs/staging/WORKER_FINDING_A_CONTROL_ARRIVED_WITH_A_REPO_WIDE_REFUSAL_AND_NO_TEST_2026-08-14.md'
- 'THIRTIETH HOUR (2026-08-14, worker tick, H27 2->3 HARDEN draw), on the D44 declaration mechanism the last two Hours built -- and it found that the mechanism''s own GRADER had never once been called. THE FINDING, in two coupled halves, both measured before anything was written. (1) NO CALLER: `background.gap_metric.audit_ledger_normalisation` was built by Hour #28 to grade every published entry against the relation it declares; `grep -rn audit_ledger_normalisation --include=*.py` returned its own test module and NOTHING ELSE -- ten call sites in tests, zero in production. It had never graded the live ledger, so its verdict on the artefact the public door serves was unknown to everyone including the Hour that built it. Given a caller this tick, it reports FOURTEEN findings on `site/data/proof.json`: eleven `undeclared_normalisation`, TWO `undeclared_and_relation_false` (W2_5 and W2_8 -- the door renders `baseline g0 X · raw Y` on one line for pairs where that relation is arithmetically false), and one new class below. (2) THE RESERVED-NAME COLLISION: `components` is emitted by `to_dict` as a SIBLING of the declared fields, and the door renders both in one row -- the basis line off the entry-level `normalisation`, and every `components` key BY NAME inside the disclosure headed ''Components & measurement basis''. On the live published row `W2_9_segment_debt_tnc` that rendered, in one row, `basis UNDECLARED -- this entry does not record whether g0 divides the headline` beside `normalisation: majority-class prevalence`. One word, two fields, opposite readings, and the free-text side is not in NORMALISATION_KINDS -- so a reader taking it for the declaration gets a value outside the closed vocabulary while the D44 audit, which reads only the entry level, calls the entry clean. Three writers had the collision (`misapplication_gap`, `ageing_gap`, and this atom''s own detection-latency composer in `tools/couple_w2_11_d5.py`); exactly one had reached disk. MECHANISED, R10 as a CLASS not three instances (R12: no published number moved, no scorer touched, no gap recomputed): (1) `reserved_component_keys()` DERIVED from `dataclasses.fields(GapResult)` -- never hand-listed, so a field added to the contract tomorrow is reserved the same day; (2) a construction-time refusal in `__post_init__` placed BEFORE the kind check, because the live offender had no declared kind at all and a guard placed after it would have raised on the kind and carried the shadow away unreported; (3) a new audit finding `component_key_shadows_entry_field`, graded before every early `continue`, because the write guard cannot reach an entry already serialised to JSON and the live offender was exactly that; (4) the grader WIRED into `tools/generate_proof_data.py`, which already reads that ledger on every publish and is the reader the audit exists to protect; (5) its verdict RENDERED as a door alarm, because a grader whose findings nobody renders is a grader nobody reads -- which is how this collision reached the public door and stayed. Six SOURCE mutations, every one proven to fire: delete the write guard (2 red); move the audit check after the kind `continue`s (1 red); make the import fail (1 red); drop the grader call while leaving the flag set (1 red); stop the door distinguishing ''never ran'' from ''clean'' (1 red); rename the scorer key back (4 red). AND THE HOUR CAUGHT ITSELF: the first version of the wiring initialised `basis_audit_ran = True` and cleared it in an `except`, so mutant 3 -- an audit that could not even be imported -- published `ran=True, findings=[]` and the whole panel suite stayed GREEN. That is the exact fail-silent shape the flag exists to prevent, reproduced inside the mechanism meant to prevent it, and it was invisible until the mutation was actually run rather than reasoned about. Fixed by initialising the flag FALSE and setting it only after the call returns, and the live test now checks the panel''s verdict against an INDEPENDENT call of the grader, so a generator that skips the call is caught by the disagreement rather than by a flag it sets about itself. SCOPE, stated because D43 will flag it: four of the eight changed files are outside this atom''s declared `file_scope` (`background/gap_metric.py`, `tools/generate_proof_data.py`, `site/proof/index.html` and its panel test). The defect is in the shared gap-metric contract that this atom''s instrument writes THROUGH, and one of the three colliding writers is `tools/couple_w2_11_d5.py` itself -- fixing only the in-scope writer would have left the class open and the live door row untouched. WHAT THIS HOUR DID NOT DO: the 13 undeclared live entries are now REPORTED on the door but not repaired -- repairing them means re-measuring each pair with a declaring writer, which moves published numbers and belongs to each pair''s own lane, not to this one (R12/R13). THE 2->3 IS NOT TAKEN: Hour #4''s two-consecutive-clean criterion is at zero, because this Hour found two defects and then a third in its own repair. The next promoter runs Hour #31; the leads are #28''s minus the normalisation-collision (closed here), PLUS: the 13 undeclared entries now have a door alarm and no owner; the two `undeclared_and_relation_false` pairs (W2_5, W2_8) publish a false relation TODAY and are the sharpest of them; and `audit_ledger_normalisation` was the SECOND control on this instrument found with no caller, which is a rate, not an incident. NOT a wall, and NOT a reason to tune any number (R12).'
