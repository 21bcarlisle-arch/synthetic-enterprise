atom_id: EP6_wall_protocol_typing
chunk: 31
simplifications:
- "2026-08-20 pass 35 BUILD, level HELD at 2, loop_stage stays build. THE ATOM'S LAST NAMED L3 BLOCKER WAS THE WRONG UNIT, AND ENUMERATING THE VOCABULARY FOUND ITS SIBLING IN THE SAME STATE. Passes 33 and 34 both closed carrying one item in the same words -- \"give `WallStatus.TIMEOUT` a reader or delete it\". Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 291620cbb, worktree, with this atom's subject files CLEAN against HEAD before the pass.\n\n  THE MEASUREMENT CAME FIRST AND IT IS THE FINDING, which is this atom's own pass-29 lesson applied to its own backlog. Counting the `WallStatus.X` mentions across the census trees instead of reasoning about the one member somebody had noticed: TIMEOUT HAS NO WRITER EITHER. Nothing in `sim/`, `simulation/`, `company/`, `saas/`, `interface/` or `tools/` constructs it. So the repair both previous passes handed forward -- add a reader -- is a build item for a message this wall cannot send, and it would have landed as a satisfied blocker and a branch no test could reach. R11's orphan transition pointed at the RELEASE half: a hold whose release triggers nothing.\n\n  AND THE MISS SAT NEXT TO THE HIT, for the second recorded time on this atom, which makes it a class here and not an instance. Pass 29: the belt named `nudge_uplift` and missed `tone_uplift`, drawn four lines apart by the same helper. Pass 35: three passes named TIMEOUT and NONE named `ERROR` -- its immediate sibling in the same four-member enum, in the identical state (no writer, no hearer), and distinguished from it by the very docstring sentence that made TIMEOUT worth naming (\"`TIMEOUT` is distinct from `ERROR`\"). A list assembled by noticing gets the member someone was looking at. Only enumerating the vocabulary gets the second one.\n\n  THE LIVE READING, 1 OF 4, and the third bucket was named by nobody either. `OK` is said by three modules and distinguished by one. `NOT_KNOWABLE_YET` is UNHEARD -- `simulation/payment_seam_adapter.py` says it and NOTHING distinguishes it, because both company-side consumers collapse every non-OK member to not-OK (`payment_observation_consumer.py:611`, `flex_participation.py:274`), so the honest answer the envelope's docstring is proudest of is discarded on arrival. `TIMEOUT` and `ERROR` are UNINHABITED. Meanwhile `_decode_status` in `company/interfaces/wall_protocol.py` accepts ALL FOUR off the wire, as a decoder must -- so the company can RECEIVE a status it cannot SEND and cannot ACT ON. That is the atom's `gain` failing in the small: a real transport produces timeouts on day one, and go-live would find the distinction unbought.\n\n  THE CONTROL. `status_liveness_conformance` in `tools/wall_channel_census.py`, with `StatusVerdict`, `declared_statuses`, `status_mentions` and `_at`. One question per declared member -- IS IT SAID, IS IT ACTED ON -- sorted into four buckets each naming a different repair: `live`, `unheard` (writer, no reader), `unspoken` (reader, no writer -- the dead arm the proposed repair would have built), `uninhabited` (neither, and the ordering is stated: writer first, because a reader alone IS the unspoken bucket). Population DERIVED from the enum, so a fifth member is scored the day it lands.\n\n  EVERY ERROR IT CAN MAKE IS TOWARD GREEN, chosen deliberately because it arrives RED: a red it manufactured would be worse than a finding it lost. Mention-counting is generous in both directions -- any `WallStatus.X` outside a comparison counts as speaking it, any inside one counts as hearing it, and readers count on BOTH sides of the wall. A member this calls uninhabited is uninhabited under the loosest reading available. `match` arms are counted as HEARING, and that closed a fail-open with a shelf life rather than a hypothetical one: read naively, the first consumer rewritten from `if status != OK` to a four-arm `match` would have flipped every member it reads from heard to said, and the verdict would have gone GREENER as the code got better.\n\n  R15 TAUTOLOGY, and it is the reason the declaring module is excluded from both counts. `WallResponse.__post_init__` compares against `OK` and `ERROR` to enforce its payload invariants. Counting that as a reader would derive the checked value from the source it checks, and every member would be born live the moment someone wrote a payload invariant for it -- the vocabulary certifying itself. `test_R15_TAUTOLOGY_the_declaring_module_cannot_inhabit_its_own_vocabulary` adds `ERROR` to a fixture in exactly that shape and asserts it stays uninhabited.\n\n  THE BLIND SPOT IS PINNED, NOT DESCRIBED, AND IT NEEDED A SECOND CONTROL. This question derives its population from the declaration it measures, so DELETING a member does not move the finding -- it removes the subject and leaves, scoring as a full repair. That is the R15 mutation that deletes the subject instead of mutating it (a class already on this project's record), and pass 33's own wording invited it: \"or delete it\". Deleting TIMEOUT is the cheap cut that BANKS the defect behind the wall -- the contract stops being able to distinguish \"the answer did not arrive\" from \"the answer is that this failed\", which is the one distinction `WallStatus` exists to draw, and go-live is exactly when it is needed. So `STATUS_VOCABULARY_FLOOR` + `missing_from_status_floor` land in the same commit, GROW-ONLY -- the opposite direction to the census baseline beside it, and the difference is what each list is for: a channel shrinks as crossings are paid down; a vocabulary shrinks when the wall loses the ability to say something. `test_MUTATION_deleting_TIMEOUT_is_INVISIBLE_here_and_REFUSED_by_the_floor` asserts BOTH halves in one function, so the pairing cannot rot apart and the liveness question's limit is a failing assertion rather than a docstring claim.\n\n  THE TWO HALVES ARE WIRED DIFFERENTLY, BY THIS FILE'S OWN RULE -- a check becomes a gate \"in the same commit that makes it satisfiable\". The liveness question arrives UNSATISFIED (3 of 4 red), so it REPORTS: gating it would refuse every commit in the repo including the ones that repair it, which is pass 13's landing-order defect this file has now learned three times. The FLOOR is satisfiable at HEAD -- all four members declared -- so it GATES from its first commit, and the only commits it can refuse are commits that delete a member, which is precisely its subject. Landing the liveness check WITHOUT the floor would have shipped a control whose cheapest repair is deleting its own subject.\n\n  R15 OTHERWISE. 15 tests, section 23/23b. Green case REACHABLE on the fixture (2 of 2 live) -- which matters because the live tree is 1 of 4, and a control that has only ever said no is indistinguishable from one that can only say no. Mutations: reader-without-writer -> `unspoken`; writer-without-reader -> `unheard`, asserted NOT to collapse into `unspoken` (opposite defects, opposite repairs, and a control that merged them would name the wrong half of the work); neither -> `uninhabited`; a new member declared tomorrow -> scored uninhabited with no edit to the control. NULL CONTROL: an unrelated `ReplayStatus` enum with the SAME member names moves the verdict not at all (asserted by whole-verdict equality, so the sample moves and the law does not). FAIL-CLOSED three ways: module absent, class absent, class empty -- and ZERO MEMBERS IS REFUSED, deliberately inverting the zero-is-fine rule the seam questions follow, because a paid-down seam channel is a success case and an emptied vocabulary is a deleted contract. Test count 186 -> 201 (+15); `ruff` clean, which is the check that caught pass 34's silent duplicate-`def` collision.\n\n  MAP EDIT, AND IT IS WIDER THAN PASS 34 SAID. Pass 34 recorded that the scope needs the two CONSUMER paths added before the TIMEOUT item can land. The measurement says that is half of it: with no writer, the repair needs PRODUCER paths too. `file_scope` gains four -- `company/billing/payment_observation_consumer.py`, `company/market/flex_participation.py`, `simulation/payment_seam_adapter.py`, `sim/flex_dispatch.py`. Recorded under the 2026-08-19 director instruction's reading, which puts `file_scope` outside the curriculum reservation: it declares which files an atom owns, changes no difficulty, sets no target and tunes no output.\n\n  WHAT REMAINS FOR L3, restated in the unit the measurement supports rather than the one pass 33 guessed. THREE members fail, not one, and they are two pieces of work. (1) `NOT_KNOWABLE_YET` is UNHEARD and needs only a reader -- the writer exists, the event already occurs, and this is the cheapest of the three and the only one with no design question in it. (2) `TIMEOUT` and `ERROR` are UNINHABITED and need a WRITER FIRST: a world-side adapter that can fail to answer in time and one that can fail structurally, then the company-side branches. ANSWERING PASS 34'S ORDERING QUESTION, which it correctly refused to answer by inference: it guessed the unsolicited finding and the TIMEOUT finding were \"probably one defect seen twice\", and on this measurement they are NOT -- `payment_observable_seam` is unsolicited AND its adapter is the one module that already says `NOT_KNOWABLE_YET`, so its status path is live while its request leg is not. The two findings share a seam and not a cause. INFERRED, and flagged as the next pass's first question rather than assumed: (2) may not be buildable honestly while the seam is unsolicited, because a timeout is a fact about a request that was sent, and on an unsolicited seam nothing was sent to time out -- which would make the conversation repair the true predecessor of the TIMEOUT repair, and would be the first time these two questions have had an ordering between them."
