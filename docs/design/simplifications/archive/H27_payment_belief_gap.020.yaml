- 'TWENTY-FIFTH HOUR (2026-08-13, worker tick, H27 2->3 HARDEN draw), on the lead Hours #23 and #24 both named as the highest-value unbuilt thing this atom knows about, and the Hour''s first act FALSIFIED THE LEAD AS WORDED. Both Hours filed it identically: ''a register claim of LANDED checked against what is COMMITTED, not against another record.'' MEASURED AGAINST THE REAL HISTORY BEFORE ANY OF IT WAS BUILT, that check reads CLEAN at both moments it was queued from. A prototype extracting the backticked identifiers from each register entry''s LANDED span and grepping them across the whole committed tree reports ZERO missing tokens at `1f1b09893` and at `dfc233094` -- because Hour #22''s entry claims exactly one landing, D41 in `tools/map_assertion_provenance.py`, and that landing IS committed; the entry says nothing at all about D38, whose 162 lines were the thing sitting unlanded. AT BOTH MOMENTS THE COMMITTED TREE WAS INTERNALLY CONSISTENT, which is why no reading of it can find the defect -- the same shape as the ''cut recorded as EXECUTED'' instance where HEAD stayed self-consistent and every detector was green. THE ONLY WITNESS IS THE DIFFERENCE BETWEEN THE TWO TREES. A lead specified from an Hour''s own prose rather than from the instance is a hypothesis, and this one was wrong about where its own evidence lives; the staged finding doc''s recommendation (''refuse when the scope is dirty at the paths the entry names'') was closer, and is still not it -- this tree carries 200+ dirty paths across concurrent lanes as its NORMAL state, so plain dirtiness is noise with no owner. WHAT LANDED (atom D42, `tools/map_assertion_provenance.py`, D41''s own file and the same derived population): the subject is the PAIR of trees, and the signal is the one thing this convention already writes into the work itself -- an Hour labels its code with its own atom and ordinal. Two questions. `UNLANDED_HOUR_WORK`: a tracked code file carries `<atom> Expert Hour #N` in the working tree and its HEAD version does not. `UNLANDED_HOUR_RECORD`: the atom''s record file holds an Hour ENTRY the HEAD version does not -- the verdict itself unlanded, which is what Hour #23 left. HEAD side from `git show`, tree side from the filesystem: two readers, because one reader asked twice cannot see a difference between them. A RECORD IS NOT A LANDING -- `docs/` and `site/data/` repeat these labels verbatim, and counting them would report Hour #22 as landed at `dfc233094` on the strength of the register that was wrong about it, record against record one level down. PROVEN ON THE REAL BYTES, not a fixture: run with head=`dfc233094` and worktree=the content Hour #24 actually found, it names ''H27 Hour(s) #22 -- tools/couple_w2_11_d5.py carries them in the working tree and not at HEAD'', and the same at `1f1b09893`, which is the fact Hour #23 and Hour #24 each spent most of a draw establishing by hand. TWO DEFECTS IN THIS CHECK''S OWN FIRST LIVE RUN, both fixed and both pinned rather than quietly corrected. (1) WRONG SUBJECT BY PREFIX: two map cells begin `H27` (`H27_payment_belief_gap`, `H27_phone_act_channel`), so resolving a qualifier to ''the atom whose id it prefixes'' attributed one atom''s unlanded work to a cell that had never touched the file -- and dropping the ambiguous label instead would have gone INERT on the very atom the check was built for. The finding is now keyed on the LABEL, fires either way, and names every candidate cell. (2) ITS OWN DOCUMENTATION SCORED AS A LANDING: a comment spelling `H_GAP Expert Hour #<n>` as an example produced a phantom finding against H_GAP. A control keyed on a string in code cannot tell its own documentation from its subject, so the examples now split the ordinal out of the string, in the module and in the tests. AND THE HOUR FOUND A RED IT DID NOT COME FOR: `test_the_live_store_carries_no_stale_hold_record` -- D41''s own live control -- WAS FAILING AT HEAD when this Hour drew, proven in a clean `HEAD` worktree, not in the dirty tree. The cause is one adjective. The only sentence in which an Hour states its own outcome is ''THE LEVEL STAYS 2 FOR THE TWENTY-FOURTH CONSECUTIVE HOUR'', and `_ORDINAL_BEFORE_HOUR` required the ordinal to ABUT `HOUR`, so `answered_hours` read only the ''Hour #4'' reference later in the same sentence and reported a register that was perfectly current as two Hours behind. Hour #24 landed the entry that introduced the wording and never ran the control that reads it -- the third member of this family in three Hours, and the one that cost a red HEAD. REPAIRED AT THE CLASS, not at the word: a bounded run of intervening words is allowed rather than `(?:CONSECUTIVE\s+)?`, which is the instance fix that returns the first time an Hour writes STRAIGHT. The ordinal is now an ALTERNATION OF THE KNOWN WORDS rather than `[A-Z]+`, and that is load-bearing once words may sit in between: with a wildcard first group ''AND THE TWENTIETH HOUR'' matches on AND, the scan resumes past the discarded match, and the real ordinal inside it is LOST -- a parse that drops Hours silently. Pinned both ways, including a bound test so a far-off ordinal cannot answer the draw. R15, run against the tree this Hour was about to land: NINE source mutations, each firing a NAMED test, md5 byte-clean restore (`4f796aeb51811f60f4bd7322dbf4c18f` before and after), every restore a `cp` and never `git checkout --` (Hour #24''s near miss). TAUTOLOGY -- the HEAD side read from the working tree, so the two sides are one reader: reds the end-to-end and the live-parse tests. FAIL-SILENT -- a git that cannot answer returns None instead of raising: reds by name. FAIL-OPEN ON MISSING -- an absent HEAD side degrading to `''''`. WRONG SUBJECT -- an unqualified `Expert Hour #N` counted as somebody''s. AMBIGUITY GOING INERT. A RECORD COUNTING AS A LANDING. The vacuity floor removed. The CLI''s own exit code collapsed into 0. And the pre-Hour parser restored, which reds the live D41 test and the new adjective pin together. ONE MUTATION SURVIVED THE FIRST PASS AND IS RECORDED RATHER THAN QUIETLY PATCHED: `missing_is_empty` passed 58/58, because the fail-open-on-missing assertion was written against the PURE function with `head=None` handed to it, so mutating the BUILDER that decides None was invisible to it. A control tested only where the caller supplies the answer is testing the fixture. Closed with an end-to-end test over a genuinely new uncommitted file in a real repo; the mutation now reds by name. NOT ALWAYS-RED: 59 pass unmutated (was 55 at Hour #24, and one of those 55 was failing at HEAD). WIRED, and deliberately not into the shared refusal: `--unlanded` has its OWN exit code 3, because its subject is the WORKING TREE and folding a working-tree predicate into the repo-wide findings list would wedge every lane the moment any Hour is mid-flight -- which is the state this check exists to REPORT, not to punish. 2 stays COULD-NOT-RUN, so an unavailable check cannot be mistaken for the finding. Its live run this tick correctly named THIS Hour''s own uncommitted work and goes quiet on landing. R12: NO published number moved and no scorer was touched -- this Hour changed no instrument, and the atom''s own file is byte-identical at 446 passed, the count Hour #24 measured at landing. ruff clean on both changed files, matching HEAD. DELIBERATELY NOT TOUCHED, third Hour running and for the same live reason: the H27 map cell''s `expert_hour.last` and `simplifications_count` stay stale because `docs/design/maturity_map.yaml` still carries other lanes'' hunks staged in the shared index and a pathspec commit touching it would carry them. The verdict for the draw is written HERE, which is the shape D41 accepts. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): (a) D42 answers the CLI, and the CLI is not the DRAW -- until `background/supervisor.py` reads it, the next Hour is still one command away from the fact rather than being handed it, and that command is outside this atom''s file_scope; (b) D42 sees only work that SELF-LABELS, so an uncommitted change carrying no Hour label is still invisible, and the labelling convention is itself unenforced; (c) D39 and D40, untouched for a fifth Hour; (d) D37-D42 exist only in this register''s prose and in no map cell. THE LEVEL STAYS 2 FOR THE TWENTY-FIFTH CONSECUTIVE HOUR, and Hour #4''s two-consecutive-clean-Hours criterion reads zero again for the honest reason rather than the structural one: this Hour was not clean, it found a red at HEAD in a sibling control and two defects in its own first run.'
