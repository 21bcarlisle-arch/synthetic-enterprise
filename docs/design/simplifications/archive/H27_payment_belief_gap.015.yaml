simplifications:
- 'SEVENTEENTH HOUR (2026-08-11, worker tick, H27 2->3 HARDEN draw), on Hour #16''s lead 2 -- the ROUNDING before the render -- which found the layer ABOVE it first. THE FINDING, measured artefact-side and reading no source at all, n=300, seeds 7/11: THE READER''S PRECISION WAS READ AT ONE OF THIS FIGURE''S TWO RENDER SITES. D34 (one Hour old) reads each published figure''s reader precision off the format spec in ONE NAMED FUNCTION, and the AGEING headline reaches its reader through two -- `format_ageing_summary` at `.3f`, and `_ageing_direction_note` at `.6f` into the published component `ordinal_direction_caveat`. A COMPONENT is exactly what Hour #15 established consumers read (''the ledger writer, the live wiring and the dashboard read `components` and never the prose''), so this is not a latent site: it is the sentence that travels with the number. The register therefore declared 3dp for a figure whose reader is handed 6, and every band, floor and collapse certified for this dimension ''at the reader''s own precision'' was certified at 5e-4 where the step is 5e-7 -- A THOUSANDFOLD. D34''s own R15 list names the mutation ''one gap rendered at two precisions'' as firing; it fires only INSIDE the anchored function, so the SHIPPED two-precision state was invisible to the control built to detect exactly it. Ninth escape of a control of this module by its own keying, and the third time running that an Hour has found its defect inside the control the previous Hour built. A SECOND SITE THE SAME SWEEP FOUND: `belief_population_mix` renders its own gap at 4dp into its own `.note` -- the string the ledger writer puts in front of the Proof door -- same precision, so no epsilon moved, but as invisible to a function-anchored walk as the first. HOUR #16''s LEAD 2, ANSWERED AND NEGATIVE: the inner quantisation is never coarser than the render on any shipped figure (ageing carrier 6dp / render 6dp, detection_latency 6dp / 2dp, the other three unquantised at 17dp), so the render precision is not a decoration -- and that measured negative is now PINNED so a future coarsening of any carrier fires. It also leaves ageing''s inner quantum EQUAL to its finest render, which is why that figure''s `carrier_is_the_gap` claim (delta 4.1e-7) now sits within a hair of its own epsilon and holds by construction, the component being `round(gap, 6)`. WHAT THIS TICK DELIVERED (HARDEN; R12: no published number moved -- all five figures bit-identical at seed 7, ageing 0.11296259117981663, belief 0.1518987341772152, mix 0.07999999999999997, detection 0.014505119453924915, latency 2.343137): (1) ageing''s epsilon corrected to the FINEST site with 3dp declared beside it, and the mix note declared; (2) `measure_component_render_sites`, the INDEPENDENT half of the control -- it scores the book and looks for each figure''s OWN VALUE in every string the consumer is handed, with a DISCRIMINATION RULE that a literal counts only if it CHANGES with the figure across two books (a one-book sweep reports ''0.0'' -- which is in half the strings this module publishes -- as this figure''s reader precision, and would hand every band a 0.05 epsilon); (3) D34''s rule RESHAPED rather than dropped: ''two precisions, refuse to guess'' becomes ''the epsilon is half a step of the FINEST'', with the guard MOVED onto the declared SET so an undeclared precision still fires by name -- a repaired verdict must not leave its guards on the old statistic; (4) the epsilon refusal message interpolated from the register, which had ''ageing 3dp'' typed into it and would have gone on saying so; (5) both this control and D34''s WIRED INTO THE CLI, which D34''s never was. R15 both ways on eight mutations: the pre-Hour register state (undeclared 6dp site, epsilon set from 3dp), a declared site the scoring cannot produce, an undeclared second precision in the anchored function, a declared-but-not-finest epsilon, a carrier quantised coarser than its render, a single scoring (RAISES -- one book cannot tell a render from a constant), an inert sweep finding nothing (RAISES -- an unavailable check is a failed check), and the discrimination rule proven to REJECT a ''0.0'' that never moves and ACCEPT the same site once the literal tracks the figure. THE RESHAPE IS MINTED, NOT TAKEN: D35_the_render_site_sweep_stops_at_this_processs_edge -- the sweep sees only strings this module''s own `score_triad` returns, and the same figures are re-rendered by the ledger writer, the dashboard and the Proof-door page, by writers it never runs.'
map_records:
  expert_hour_findings:
  - 'SEVENTH HOUR (2026-08-10), on the corrected instrument, taken on `detection_latency` -- the only dimension never given an Hour of its own: THE INSTRUMENT CANNOT RESOLVE THE QUANTITY IT PUBLISHES. The reconciliation first-knowledge date is read by asking the organ on a grid of ONE candidate date per period at the harness''s own `due + grace` -- the very re-derivation the docstring claims R15 independence for avoiding. So `recon_lag_days` is the CONSTANT 5 (= `reconciliation_grace_days`, a harness input echoed back): a company that reconciles instantly, or flags an invoice a fortnight before it is due, publishes the same 5.0, and a one-day-SLOWER one is published as +21.0 (+1/+7/+21 bit-identical, seeds 7/11/23). Seven tests fire on a +1d organ mutation and NOT ONE names latency; on every improvement drift, none fire at all. CLOSED AT THE CLASS (R10) by ORGAN_QUERY_GRID -- each grid reading declares which company drifts it can and cannot see, re-measured every run and in the CLI, differential across a date reading and a set-membership reading (both go blind together, which is the evidence the GRID is the defect and not the latency formula); R15-proven on an inert probe, a repaired grid and an unowned declaration, with the repair direction failing BY NAME so the entry cannot outlive its debt. Declared `organ_reconciliation_drift_days` counterfactual + resolution caveat stamped AT SOURCE. The RESHAPE is atom D23 (not fixed on sight: it moves a published number on three pairs). FULL TEXT: docs/staging/WORKER_FINDING_THE_INSTRUMENT_CANNOT_RESOLVE_ITS_OWN_LATENCY_2026-08-10.md -- kept there for the same per-atom-budget reason Hour #6 recorded, still ATOM H41''s class.'
