atom_id: EP6_wall_protocol_typing
chunk: 34
simplifications:
- "2026-08-20 pass 39 BUILD, level HELD at 2, loop_stage stays build. THE PORT NOW ASKS WHO IS SPEAKING. Pass 38 left seven payable exit criteria and this pass took Q13, the one the blind reviewer aimed at the atom's own headline sentence: if the company genuinely cannot tell a real counterparty from a stand-in, what happened to counterparty authentication? The answer, measured then and re-measured now, was that indistinguishability had been achieved by the identity check being ABSENT from the path -- a control gap wearing an abstraction's clothes. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 010b7be68, worktree, with all six touched files carrying only this pass's hunks (checked by `git diff` hunk headers before writing anything -- pass 38's lesson is that a landing defect and a concurrent-lane defect read identically from a record).\n\nWHAT THE DEFECT ACTUALLY WAS, stated so the repair can be judged against it rather than against the question. `company/billing/payment_observation_consumer.py::observe_wire` -- the live triad's ONLY route to a payment observation, and the crossing EP6 migrated to the wire at pass ~12 -- read `decode_response(wire, ...)`. That decoder refuses a malformed envelope beautifully and has no opinion whatever about who sent it. Any process that could format seven keys correctly was a bank. Repo-wide, the concepts of SMKI, DIP signing, DTN participant identity and mutual TLS existed only in `background/one_way_door.py`, i.e. modelled purely as a RESERVED REAL-WORLD ACT and never as a verified property of a message.\n\nTHE REPAIR IS A TRANSPORT FRAME, AND IDENTITY IS DELIBERATELY NOT AN ENVELOPE FIELD. In DTN, the DIP and Bacstel-IP the participant is established by the CHANNEL -- a certificate, a signed header -- and the business document inside knows nothing about it. So the wire gained a wrapper (`sender`, `credential`, `envelope`; `FRAME_WIRE_FIELDS`) and the envelope gained nothing. That also kept `interface/contracts/wall_envelope.py` untouched, which this atom's file_scope does not own and which had no business widening for a transport concern.\n\nTHE TWO SIDES ARE STILL INDEPENDENT CODE, which is the only thing that makes this a check rather than a handshake with itself. The counterparty frames with its OWN function (`simulation/payment_seam_adapter.py::frame_wire_message`, `PARTICIPANT_ID`, `PARTICIPANT_CREDENTIAL`) -- that module may not import `company.*` at all and does not. The company holds a sha256 FINGERPRINT in `COUNTERPARTY_REGISTRY` and never the credential; `test_the_registry_holds_a_fingerprint_and_never_the_credential` asserts the literal is absent from the receiver's source and that the digest is the sender's string hashed. Neither side reads the other's value at runtime, so this is not the R15 TAUTOLOGY pattern one layer down.\n\nTHE MUTATION, RUN AND NOT DESCRIBED. Rotate the counterparty's credential without telling the company and the live crossing must STOP WORKING -- `test_MUTATION_a_rotated_credential_the_company_was_not_told_about_BREAKS_the_seam` does exactly that and gets BAD_CREDENTIAL, with the un-rotated message landing on the same consumer as its null control. That is what a participant changing its key without notifying its counterparty does on a real network, and a version of this that kept working would be checking nothing. Second mutation, the defect this pass closed: `test_MUTATION_the_unframed_envelope_that_used_to_be_accepted_is_now_REFUSED` feeds `observe_wire` the exact bytes that used to be believed.\n\nTHREE REFUSALS, THREE REASONS, ON PURPOSE. UNKNOWN_SENDER (\"I have never heard of you\"), BAD_CREDENTIAL (\"you are not who you say you are\") and VERSION_NOT_SPOKEN (\"you have not cut over yet\") call for a registry entry, a credential rotation and a release schedule respectively. A single AUTH_FAILED would hide which, and `feedback_a_bare_raises_cannot_tell_two_stacked_belts_apart` is why every test asserts the reason code rather than that something raised.\n\nQ10'S HALF CAME FREE AND IS NOT CLAIMED AS DONE. `CounterpartyRecord.speaks_schema_versions` is a different fact from `SUPPORTED_SCHEMA_VERSIONS`: the first is one participant's current release, the second is what this build can read at all. `test_two_counterparties_on_different_releases_are_read_differently` proves the dimension on a two-participant fixture registry -- the same bytes accepted from the participant that has cut over, refused from the one that has not, which a single global constant cannot express. STATED LIMIT, in the module docstring and in the ledger: this build understands exactly ONE wire dialect, because `REQUEST_WIRE_FIELDS`/`RESPONSE_WIRE_FIELDS` are version-blind. The table can currently say which participants are on v1 and nothing more. Q10 stays FAIL.\n\nFAIL-OPEN SWEPT, NOT ASSUMED. Parametrized over `None`/empty-string/0/list/dict/bytes on both `sender` and `credential`; over every one of the three frame fields deleted in turn (MISSING_FIELD each); an extra frame key (UNKNOWN_FIELD); a non-mapping frame (NOT_A_MESSAGE). The empty-string case is the one that mattered -- `registry.get(\"\")` is a miss, but only because the value was required to be a non-empty str BEFORE the lookup. And `test_an_EMPTY_registry_refuses_everything_rather_than_accepting_it` closes the injectable-registry hole: there is no value of that argument meaning \"skip the check\", because empty refuses everything.\n\nTHE INSTRUMENT CAUGHT THE CHANGE, WHICH IS THE SECOND THING THIS TICK PROVED. `tools/wall_channel_census.py` red-listed the payment seam as \"ENCODED ONLY: transported on one side\" the moment the consumer stopped importing `decode_response`. It was right to fire and wrong about the cause: `LEG_DECODE_NAME` mapped a leg to ONE decoder NAME, so it could not tell \"the decoder went away\" from \"the decoder was renamed\" -- and the second is what hardening the port looks like from here. It is now a tuple per leg, ENUMERATED rather than prefix-matched, so adding an entry point to `wall_protocol` reds the gate until someone adds it here too. That is the correct expense: a leg silently dropping out of the census is the exact thing this instrument exists to prevent.\n\nTHE RATCHET, because one crossing framed and two not is a state that decays into three not. `test_the_framed_and_unframed_crossings_are_exactly_as_declared` walks `company/**/*.py` and asserts the framed set is exactly {payment_observation_consumer} and the unframed set exactly {susceptibility_estimator, flex_participation}. A fourth company module decoding wall responses without a participant check now reds, so widening the unauthenticated surface is a decision somebody takes on purpose rather than a silence (`feedback_a_ratchet_moving_down_is_not_coverage_moving_up` -- this one measures the SET, not a count).\n\nEVIDENCE: `tests/company/interfaces/test_wall_protocol.py` 85 passed, 59 test functions AST-counted off the tree against 41 at HEAD (+18); `tests/background/test_live_payment_triad.py` 24 passed in 32.7s -- the LIVE path, so the company's real route to a payment observation now runs a participant check; `tests/tools/test_wall_channel_census.py` 201 passed; `tests/interface` + `tests/company/comms` + `tests/simulation/test_conversation_response.py` 160 passed; `tests/company/billing/test_payment_observation_consumer.py` + `tests/simulation/test_payment_seam_adapter.py` + `tests/company/market/test_flex_participation.py` 91 passed; `tests/tools/test_discovery_pass_ceiling.py` + `tests/tools/test_cold_eyes_battery.py` + `tests/background/test_conversation_gap_ledger_wire.py` 74 passed; `python3 -m tools.epistemic_verifier` PASS; `python3 -m tools.wall_channel_census` clean on every frozen channel.\n\nWHAT THIS PASS DOES NOT ESTABLISH, said here rather than discovered later.\n  * NO CRYPTOGRAPHY. There is no certificate chain and no signature over the bytes; a credential presented in the clear would be worthless on a real network. What is modelled is the REFUSAL -- the check the review said was missing -- not SMKI or DIP signing. Recorded in the module docstring so the next reader does not have to infer the scope from the test names.\n  * TWO OF THREE CROSSINGS ARE UNFRAMED and are named, not implied. The conversation and flex crossings still take a bare envelope from anybody.\n  * THE VERIFIED SENDER IS DISCARDED by `observe_wire`. One counterparty means a per-sender belief has nothing to distinguish yet; the fact is returned at that line rather than thrown away inside the port, so the day a second bank feed exists it does not have to be reconstructed.\n  * THE LEVEL IS STILL 2, and the reason has not changed since pass 38: `level_target: 3` is unreachable in this epoch because Q9 and Q15 need an act in a RESERVED class. Q13 moving from \"absent\" to \"present on one crossing, cryptography out of scope\" does not clear it, and greening it would be the level certified by the absence of its own check.\n\nWHAT REMAINS, from the reviewer's closed set and not from this pass's opinion: SIX payable items (Q2, Q3, Q5, Q6, Q10, Q14) and two epoch-gated (Q9, Q15). Q13 stays outstanding with its evidence rewritten to say exactly what now exists and what does not, so the ceiling keeps drawing it rather than a partial repair retiring it. NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): Q14 is now cheap and was not before -- the registry is the place a stand-in participant can be DECLARED as one, so \"what stops a stand-in configuration reaching production\" becomes a startup assertion over a field that exists, rather than the environment-segregation project it looked like at pass 37. The target decision recommended to the director at pass 38 (retarget to level 2 for epoch 3, move Q9/Q15 to `EP19_counterparty_qualification_paths`) is unchanged and still his (R13)."
