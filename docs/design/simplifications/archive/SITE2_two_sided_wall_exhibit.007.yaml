atom_id: SITE2_two_sided_wall_exhibit
chunk: 7
simplifications:
- '2026-08-17 HARDEN (worker tick, second of the day): the exhibit was BLANK on four of thirteen households and printed a fabricated company belief on six more. Neither defect was in the Expert Hour''s finding list, and both were live on the deployed page while the suite was 82/82 green -- because every control in this module drove TWO households.


  HOW THEY WERE FOUND. The draw was SITE2 at loop_stage build with every in-scope walk finding already closed, so the tick started by re-measuring rather than by picking the next item off a list: drive the page''s own code over EVERY published per-customer record and print what renders. Four households did not render at all.


  DEFECT A, A FAIL-CLOSED CONTROL FIRING ON REAL DATA. chainSide() refuses an event type nobody has sided -- correct, and the 2026-08-13 tick built it that way deliberately, because placing an unclassified event by default would be a silent claim about which side of the wall it belongs on. But _CHAIN_SIDE was written against the RESIDENTIAL arrears ladder only (DD_FAILED -> FIRST_NOTICE -> SECOND_NOTICE -> RESOLVED), and simulation/arrears_engine.py::ic_arrears_stages also publishes the I&C DISPUTE ladder (INVOICE_DISPUTED -> DISPUTE_NOTICE(+14d) -> PAYMENT_PLAN_AGREED(+30d) | WRITTEN_OFF). Twenty-two of those events are published across C5, C6, C_IC2, C_IC3, C_IC3g and C_IC4 and not one type was sided, so timelinePanels() threw. renderTab() has no catch, so the Timeline tab rendered as an EMPTY BODY with no message -- the causal reaction chain, one of the three layers this atom''s own exit criterion (3) names by instance, was unreachable on the public page for C5, C6, C_IC2 and C_IC3. R11 BEFORE the fix: the LIVE page fetched from https://poesys.net/customers/ (200, 128,831 bytes) driven against the LIVE https://poesys.net/data/customers/*.json refused on exactly those four and rendered C1 and C3. The live page does not contain the string arrears_invoice_disputed at all.


  THE SIDING, which is the part that could have gone wrong. All three types are CUSTOMER- observable and the reasoning is stage-for-stage parallelism, not vibes: the I&C ladder is the same ladder as the residential one whose every stage is already sided customer -- the customer RAISED the dispute, DISPUTE_NOTICE is the same artefact as first/second notice (tools/generate_payment_ledger_data.py buckets all three as "notice"), and a payment plan cannot be "agreed" with one party. The description "escalated to accounts receivable" is the INTERNAL CONSEQUENCE of a notice the account holder received, not evidence the notice is internal. The write-off/recovery tail is where the ladder genuinely crosses the wall and was already sided company. Human labels added too: chainLabel() falls back to the raw event_type, so a sided-but-unlabelled type prints arrears_payment_plan_agreed at a reader -- siding and naming are separate omissions and now have separate checks.


  DEFECT B, A STRUCTURAL BLANK PUBLISHED AS A CONFIDENT ZERO. The per-customer records deliberately carry null where the company holds no belief -- build_clv excludes accounts no longer supplied, and W2_17_dual_fuel_leg_clv_attribution stopped the gas legs publishing fabricated zeros. gbp() honoured that. Two other render sites did not. `(d.expected_lifetime_periods||0).toFixed(1)` printed "0.0 yrs" and `d.churn_probability||0` printed "0%" under a green "Low risk" caption with a zero-width risk bar, both inside the COMPANY-attributed "Retention & Risk -- the supplier''s estimates" panel. Measured population BEFORE building, because this atom has undercounted its own findings three times: 8 of 13 households publish a null expected lifetime and CLV (C1, C3, C4, C5, C6 and SYN-2021-001 on the domestic book, and every gas leg), and all of them rendered "Expected Lifetime (at closure): 0.0 yrs" -- beside a CLV in the SAME panel that correctly rendered a dash from the SAME null. SYN-2021-001 additionally rendered "Churn Probability 0% / Low risk" from a null. Third site: combinedTotals().clv summed the two legs with `(e?e.clv_gbp:0)+(g?g.clv_gbp:0)`, and null+null===0 in JS, so the roll-up published "Combined CLV £0". This is the RENDER instance of WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO_2026-08-17, on the one surface where manufacturing a company belief out of an absent one is the exhibit''s own subject.


  THE MECHANISM, not the six null-guards. NO_BELIEF is the single marker and every forward-looking site routes through a helper that emits it: yrs() for a lifetime, pct() and gbp() extended to null, sumBeliefs() for a roll-up that returns null when no leg has a value rather than adding two blanks to zero. The churn tile drops its risk bar and its "Low risk" caption when there is no estimate, because a colour and a word are beliefs too.


  THE CONTROL IS THE POPULATION, NOT THE SIX KEYS (R10). Adding three _CHAIN_SIDE entries and three null-guards is the instance fix. Section (14) makes the class fail by itself: test_the_page_renders_every_published_household drives EVERY published household, which is the control that would have caught defect A live and the one this module did not have; test_every_reaction_chain_event_type_in_the_published_book_declares_a_side is INDEPENDENT rather than tautological -- one side is the page''s own _CHAIN_SIDE parsed out of the page, the other is every event_type the generator actually publishes, so the next stage arrears_engine.py invents fails here before it reaches a reader; test_a_forward_looking_field_published_as_null_never_renders_as_a_number asserts on the RENDERED value across the whole book, so a render site added later is covered without being enumerated.


  R15 BOTH WAYS ON BOTH DEFECTS, AND THE SECOND DIRECTION IS THE ONE THAT MATTERS. Defect A: removing the three I&C keys is exactly the page as it was live and kills test_the_page_renders_every_published_household AND the census test, by name. Defect B direction 1: `||0` back on the lifetime site kills the null control with the literal string "renders ''0.0 yrs''". Direction 2 is the fail-open the null control INVITES -- a page that blanks EVERY forward-looking figure satisfies it on any book at all, while telling the supplier it holds no belief about any customer; yrs() returning NO_BELIEF unconditionally kills test_a_household_that_does_publish_forward_looking_figures_still_ renders_them. Anti-vacuity on the DATA as well as the render: test_the_published_book_carries_both_blank_and_populated_forward_looking_records fails if the generator ever publishes a belief for every account (the null control would then pass over an unfixed page) or for none (the inverse would).


  QUEUED, NOT FIXED, per SELF-INTERRUPT DISCIPLINE. C_IC4 publishes 9 of the disputed events and 66 invoices but an EMPTY `timeline` array, so timelinePanels() short-circuits before chainSide() is ever called -- it escaped defect A by having nothing to render, not by being correct, and its reaction chain is still invisible. That is a generator question (tools/generate_customer_data.py), not a render one, and is not this atom''s file_scope.


  GREEN: site/customers/ 91 passed (was 82; +9 in section 14). D36/exit (7) intact -- tools/verify_printed_bill_render.mjs PASS, 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures. Neighbouring consumers of this page green (73 passed across the bill-correctness, billing-ledger, revenue-reconciliation, printed-bill-footing, no-portal-claim and glossary suites). LEVEL STAYS 2: exit (4)''s URL half is still SITE3''s and the Expert-Hour verdict is still NO.'
