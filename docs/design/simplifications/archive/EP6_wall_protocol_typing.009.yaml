atom_id: EP6_wall_protocol_typing
chunk: 9
simplifications:
- '2026-08-19 BUILD, level 1 -> 2 (worker tick, self-refill draw; the SECOND BUILD pass). This

  pass does the one thing the previous pass recorded as the next move, verbatim: "migrate ONE crossing

  onto the codec end to end -- `payment_observable_seam` is the candidate". It is done, and the atom is

  no longer dark. Everything is observed-with-evidence unless labelled inferred (R9).


  MEASURED AT: HEAD d7d36b46a. Tests run directly; the mutation harness run out-of-tree against the real

  modules and both files restored byte-identical (sha256 compared, printed by the harness).


  WHAT L1 ACTUALLY MEANT, AND WHAT CHANGED. The previous pass built the codec and refused L2 in its own

  words: "NO PRODUCTION CROSSING CALLS THIS YET: the only callers are its tests, so the module is BUILT

  AND DARK". The crossing chosen is the LIVE payment triad -- `background/live_payment_triad.py`, which

  `simulation/run_phase2b.py` runs once per run over the real run population -- and it now crosses as

  MESSAGES. `emit_wire_responses` (new, sim side) hands over wire dicts; `PaymentObservationConsumer.

  observe_wire` (new, company side) decodes them through `company.interfaces.wall_protocol.

  decode_response`. The company''s only route to a payment observation on this crossing is now one a real

  bank feed could also take.


  WHY THE ENCODER IS NOT IN THE CODEC MODULE, WHICH IS THE LOAD-BEARING DESIGN DECISION HERE.

  `simulation/payment_seam_adapter.py` writes its own encoder and never imports `company.*` -- it may

  not (its own docstring, and the sim-side wall rule). That constraint turned out to be the RIGHT shape

  rather than an obstacle to route around: if the sender called the receiver''s `encode_response` the

  round-trip below would be a TAUTOLOGY in the R15 sense -- the decoder checked against its own

  arithmetic -- and would stay green through a schema change no real counterparty would have made. The

  two sides are separate code agreeing ONLY through `interface/contracts/payment_observable_seam.py`,

  which is exactly the relationship a supplier has with a bank: the published schema, not the

  counterparty''s source. `test_the_two_sides_are_independent_code` asserts the absence of the import by

  AST, so the independence is checkable rather than claimed.


  THE VINTAGE STAMP HAS NOW LEFT THE PROCESS. The 2026-08-18 trace localised this atom''s gap as "not a

  switch that is off, a WIRE THAT WAS NEVER BUILT": `schema_version` was populated at all ten envelope

  construction sites and had never been serialised anywhere. On this crossing it now is, and the test

  asserts BOTH halves -- the key is in the JSON bytes, and the value the company holds was READ from

  those bytes rather than supplied by the reader''s own constant. That second half is the whole point;

  the sibling defect this atom named (`tools/*_port.py`''s `entry.get("schema_version", SCHEMA_VERSION)`)

  is a stamp that is present and cannot disagree, which is not a stamp.


  POPULATION-LEVEL EVIDENCE, NOT A FIXTURE. Over the live triad''s real event stream -- 200 customers x

  12 periods -- 4,322 responses crossed the wire (3,154 `RemittanceAdvice`, 1,168 `BacsArruddOutcome`)

  and `decode(encode(r)) == r` held for every one: ZERO mismatches. That is also the invariance argument

  for the swap being safe: the consumer receives objects EQUAL to the ones it received before, so no

  measurement downstream of it can have moved. Live gaps after the migration: detection 0.1387, belief

  0.1500, ageing 0.4036. HONEST LIMIT: this population emitted no `dispute`, so `NOT_KNOWABLE_YET` did

  not cross LIVE; it is covered by `test_the_honest_non_answers_cross_too` and not by the population.


  THE ONE RULE, EXTENDED DOWN A LEVEL. ABSENCE IS NEVER AGREEMENT was the envelope''s rule; the payload

  had no such rule and is where the money is. A missing `amount_gbp` must not become GBP 0.00 -- that is

  not an exception the company can act on, it is a `RemittanceAdvice` the bank never sent, and every

  later read site would treat it as real. So the payload field set must match the CONTRACT exactly:

  missing is refused, unknown is refused, and the expected set comes from `get_type_hints` on the seam''s

  dataclasses -- an independent source from anything the sender emitted, so a field added to the

  contract cannot silently fail to cross. The payload is also TYPE-TAGGED, because six payload types

  cross this seam and a receiver guessing from the field set would mis-route the day two shapes

  coincided.


  R15 -- EIGHT GUARDS, EIGHT MUTATIONS, ALL RED. Each guard was killed in the real module and the real

  suite re-run: payload tag required (1 failed), unknown payload_type refused (1), payload field never

  defaulted (3), unknown payload field refused (3), the bool-is-not-an-amount check (1), the enum-value

  check (1), the encoder''s off-seam payload-type refusal (1), the encoder''s undefined-field-type refusal

  (1). Zero unproven guards; both files restored byte-identical.


  ONE OF THE EIGHT WAS UNREACHABLE ON THE FIRST ATTEMPT, AND THAT IS THE PASS''S OWN FINDING. The

  encoder''s "no defined wire form" refusal came back GREEN under mutation -- 55 passed with the guard

  deleted -- because the test aimed at it used a look-alike class, which the class-IDENTITY check

  refuses several lines earlier. The test asserted a refusal that a DIFFERENT guard was producing. Both

  tests now exist and are separate: the identity check is exercised by a look-alike deliberately sharing

  the contract class''s NAME (a name-only check would pass it), and the field-type check by a GENUINE

  contract payload carrying an unshippable value -- the seam''s dataclasses are frozen but not

  type-enforcing, so that is the case the guard is actually for. Generalisable: a mutation that comes

  back green is not always an untested guard, it is sometimes a test standing in front of the wrong one,

  and only killing the guard tells them apart.


  NULL CONTROLS. Each refusal is paired with the identical fixture with only the deleted key restored

  (`test_R15_null_control_...`, and the restored-field assertions inside the missing-field tests), so

  each `raises` is about the field and not about a generally bad fixture. And

  `test_R15_a_refused_message_is_not_marked_processed` closes the failure mode a naive wire entry point

  would introduce: a refusal must not consume the `correlation_id`, or a corrected re-delivery -- what a

  real feed sends after a bad file -- could never land.


  THE D8 COUNTERFACTUAL CROSSES THE SAME WAY. Both call sites in the triad were migrated, the real

  company''s and the shadow''s. Migrating one would have made the two companies differ in TRANSPORT as

  well as in the remittance reference, and the counterfactual would have stopped isolating one variable.


  THREE EXISTING R15 CONTROLS IN `tests/background/test_live_payment_triad.py` WERE RE-POINTED, NOT

  WEAKENED: they monkeypatch the seam emission to inject a leak or suppress a credit, and they now patch

  `emit_wire_responses` and put their injected response through the seam''s own encoder. The mutation

  stays about the LEAK rather than about the transport -- an injected message that arrived malformed

  would be refused at the envelope and the control would have passed for the wrong reason. All three

  still fire.


  LEVEL 1 -> 2, AND WHY NOT 3. L2 is "genuine artefacts, happy path" and that is met: a live per-run

  crossing, 4,322 real messages, lossless. L3 is NOT claimed, and the exit criterion is the one the

  2026-08-15 census established -- per-channel conformance -- not a repo-wide claim that pass showed is

  unfalsifiable at HEAD. ONE of that census''s six channels is now conformant. Channels D (5 same-step

  typed ports), E (structurally-satisfied Protocols, still with nowhere to put a version) and F (91

  published report keys) are untouched, and A/B remain in good order under KNIFE3.


  NEXT BUILD MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate the SECOND crossing,

  `interface/contracts/flex_observable_seam.py`, which the 2026-08-15 census lists in channel C beside

  this one and which already borrows this seam''s idiom by its own docstring. Two migrated crossings is

  what makes the payload-codec-per-crossing pattern evidence rather than a sample of one, and it is the

  cheapest remaining step toward the per-channel conformance shape L3 needs.


  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the unreachable-guard lesson is recorded

  above and is about THIS pass''s own test, not a defect in another lane''s mechanism.


  LANDING NOTE. `docs/design/maturity_map.yaml` again carried ANOTHER LANE''S hunk at draw time -- EP1''s

  `file_scope` + `simplifications_count` 10 -> 11 -- and this time it was STAGED in the shared index

  rather than merely unstaged, so `git diff` on the map was EMPTY while `git diff --cached` showed it

  (the index is `git diff`''s baseline). A `git diff`-only check would have concluded the map was clean

  and swept EP1''s pass 11 into this commit. Landed by worktree swap presenting only EP6''s two lines to

  the gate, with EP1''s hunk re-applied and re-staged afterwards -- their work is neither committed nor

  lost. This atom''s two map lines (`level_current` 1 -> 2, `simplifications_count` 8 -> 9) and this

  store append are ONE ATOMIC WRITE.'
