simplifications:
- "2026-08-18 DISCOVER/FRAME ONLY, pass 6, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (5 -> 6). Measured at\nHEAD 9718066ce against the working tree, `docs/reports/run_output_latest.json`, the committed\n`docs/reports/ANNUAL_REPORT.md`, and the LIVE `https://poesys.net/data/company.json` fetched\n2026-08-18. Everything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE FIVE BEFORE IT DID NOT: it ran a check another finding had\nexplicitly declined to run, and the answer escalated that finding. Passes 1-5 each measured\nsomething new about the estimator, the population or the tree. This one closed an open\nepistemic question that was sitting in the staging root with \"that check has not been run\"\nwritten into it -- which is the cheapest unclaimed evidence on this atom's subject matter.\n\n==========================================================================================\n1. R2 RE-VERIFICATION OF PASS 5, FIRST, BECAUSE ITS FINDING HAD A ONE-DAY SHELF LIFE.\n==========================================================================================\n\nPass 5 filed `WORKER_FINDING_THE_LIVE_VALUATION_IS_SERVED_BY_AN_UNCOMMITTED_GENERATOR_AND_ITS\n_DISCHARGE_NAMED_UNTRACKED_FALSIFIERS_2026-08-17.md` at LATENT, and argued LATENT on the\nground that the live figure is the REPAIRED one because the pipeline runs from the working\ntree. Re-measured at HEAD 9718066ce, one day and three published stamps later, EVERY LEG\nSTILL HOLDS and none of it has landed:\n\n    saas/clv_model.py            CLV_MARGIN_BASIS      HEAD: absent      disk: 3 occurrences\n    saas/cost_to_serve.py        net_of_all_costs_...  HEAD: 0           disk: 5\n    tools/generate_dashboard_data.py  cost_basis|margin_basis  HEAD: 0   disk: 11\n    tests/saas/test_clv_margin_basis.py                UNTRACKED (`??`)\n    tests/tools/test_derived_basis_parentage_gate.py   UNTRACKED (`??`)\n\nThe finding is still live in the staging root, undischarged. What is NEW is that the defect\nis no longer a snapshot: the artefact's stamp has moved three times (3c1401df5 at pass 5,\n6ed24044d on the live surface now, 2e15f420b in the local `site/data/company.json`) and NOT\nONE of those commits can produce the figure it stamps. The live surface serves\n`finance.enterprise_value_gbp 1284348.96` with `finance.enterprise_value_basis.cost_basis:\nnet_of_all_costs`; at 6ed24044d the generator cannot emit a `cost_basis` key at all. Pass 5's\nseverity call was right at the time and is now the thing to watch: LATENT rests entirely on a\nworking tree that no commit reproduces, and the population of stamps that misdescribe their\nown parentage grows by one per publish. Not escalated this tick -- no published figure is\nwrong BECAUSE of it, which is still the honest reading, and landing it is a BUILD-lane draw\nLANE 3 may not take.\n\n==========================================================================================\n2. THE CHECK THAT WAS DECLINED, RUN. A BOARD INSTRUCTION IS WRONG BY TWO ACCOUNTS.\n==========================================================================================\n\n`docs/staging/WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO_2026-08-17.md`\n(lane D_billing_metering) measured the mechanism -- `v.get(\"clv_gbp\") or 0.0` at seven sites\nin `saas/reporting/annual_report.py` -- and the exposed population (5 of 13 accounts publish\n`clv_gbp: null`), then stopped, in its own words, \"deliberately short of claiming a specific\npublished figure is wrong, because that check has not been run\". It is EP1's subject matter\nexactly: what the company believes a customer is worth, and what it publishes about it.\n\nTHE SITE THAT MATTERS IS NOT A STATISTIC, IT IS A BOUNDARY.\n`_section_customer_strategic_value` uses `clvs[n // 2]` as the CLV axis of the Customer\nStrategic Value Matrix, and the section ends in a board instruction whose count is decided by\nthat boundary. At HEAD, `docs/reports/ANNUAL_REPORT.md:2194` publishes\n`Median CLV: £791.98`, and `:2237` publishes:\n\n    **Board action: CRITICAL quadrant has 5 account(s). High CLV at risk from elevated churn\n    probability. Immediate retention offers recommended.**\n\nR15, THE MUTATION THE FINDING ITSELF PROPOSED, EXECUTED ON THE SHIPPED BUILDER. Calling\n`_section_customer_strategic_value` on the real run output, then again with all five nulls\nreplaced by explicit `0.0`: sha256[:12] d997858d414a both times, BYTE-IDENTICAL. The\ndistinction `build_clv` and `_round_or_none` are built to preserve -- `null` means NOT\nAPPLICABLE, `0.0` means WORTH NOTHING -- does not survive to the aggregation site. The\ncontrol the finding proposed fails on today's code, as it predicted it would.\n\nTHE EFFECT, DECOMPOSED SO TWO CAUSES ARE NOT CONFLATED (this is the part a one-line\n\"exclude the nulls\" rerun gets wrong):\n  * EFFECT A, the null substitution alone -- population held at 13, churn boundary held at\n    its published 0.29, only the CLV order changed: med_clv £791.98 -> £38,255.61 (48x), and\n    CRITICAL {C2, C8, C_IC1, C_IC2, C_IC3} -> {C_IC1, C_IC2, C_IC3}. C2 (£791.98) and C8\n    (£1,163.69) are published under \"High CLV, High Churn -- priority intervention\" and\n    inside a board retention recommendation. They are the 7th and 6th largest of the 8\n    accounts that HAVE a CLV. C2 clears the \"High CLV\" boundary by being EQUAL to it.\n  * EFFECT B, the population question -- deleting the five unvalued accounts (the finding's\n    own preferred repair) also moves the CHURN boundary 0.29 -> 0.35, because those five\n    carry real churn probabilities. Executed: `Median CLV: £38,255.61 | Median churn: 35%`\n    and `Board action: CRITICAL quadrant has 1 account(s)`.\nThe conclusion is ROBUST TO WHICH REPAIR IS CHOSEN: the boundary is £38,255.61 under Effect A\nalone and £38,255.61 under exclusion. Only the current silent zero yields £791.98. That is\nwhy it is stated as a defect and not as a preference.\n\nSIZED HONESTLY: the wrong figure is in the COMMITTED ANNUAL REPORT, not on the live site --\n`grep -rl \"Strategic Value Matrix\\|CRITICAL quadrant\" site/` returns nothing, and the live\n`company.json` publishes `enterprise_value_gbp` and a null `household.clv_gbp`, not the\nmatrix. `total_clv` is £1,283,652.65 either way; the sum was always the harmless case.\n\nACTION TAKEN, and it is the only edit this pass made outside its own record: that finding is\nESCALATED LATENT -> BLOCKING on lane D_billing_metering, with the measurement appended to its\nown body and the escalation dated in its header. \"A published figure may be wrong\" is the\nBLOCKING trigger verbatim; a board instruction naming two accounts that a manufactured zero\nput there is past \"may\". `parse_severity_file` re-read: BLOCKING / D_billing_metering.\n`blocking_by_lane` over the staging root was EMPTY before this edit (106 documents scanned),\nso this is now the only blocking finding and D_billing_metering level-raises are refused\nuntil it is repaired. Down-classifying to keep that lane open is the anti-pattern\n`background/finding_severity.py` names in its own header, and the lane the finding belongs to\nis not a reason to soften it. NOT REPAIRED here: deciding what an aggregate does with a\nstructural blank is BUILD work in another lane's file scope (SELF_INTERRUPT_DISCIPLINE).\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE FOR EP1, WHICH IS WHY THIS BELONGS IN THE RECORD.\n==========================================================================================\n\nCount the CLV defects this atom's six passes have found, by kind:\n\n    POPULATION / BASIS defects        estimator MATH defects\n    ---------------------------       ----------------------\n    valuing accounts that had left      the belief-swap (pass 1, repaired 14876d687)\n    (pass 1, repaired 66141b70c)\n    margin excludes 76% of the cost\n    stack (pass 4, repaired, uncommitted)\n    nine valued, eight published;\n    divisor is renewal points (filed)\n    empty final-year snapshot\n    (pass 4, repaired a87fdc1b9)\n    null-as-zero in the boundary\n    (this pass, escalated)\n\nFive to one. Every CLV number this project has published wrongly was wrong about WHO or WHAT\nWAS COUNTED, not about the arithmetic applied to them -- and the one estimator defect was\nfound by a mutation and repaired in a day. Pass 4 derived, from a single decomposition, that\nan EP1 gap instrument reporting one number per account would score the ESTIMATOR for an INPUT\ndefect. Six passes of evidence now says that constraint is not a caveat, it is the DESIGN:\n\n  EP1'S PUBLISHED OUTPUT MUST CARRY ITS POPULATION, NOT ONLY ITS NUMBER. Every horizon\n  figure -- contract-term, tenure-expected, portfolio-cohort -- publishes alongside it: how\n  many accounts it values, how many it EXCLUDED and why (ceased / no renewal history / no\n  CLV), and on which margin line. A CLV headline whose population is implicit is, on this\n  atom's own six-pass record, the shape that has been wrong five times out of six.\n\n  AND THE FALSIFIER IS AVAILABLE FOR FREE: for any aggregate EP1 publishes, swapping a\n  structural blank between `null` and `0.0` MUST move the rendered figure or the aggregate is\n  not population-aware. That is a mutation, not an assertion (R15), it is cheap on every\n  horizon, and it is the exact control that fails on today's code.\n\nThis sharpens, rather than replaces, item 4 of the 2026-08-13 \"WHAT FOLLOWS\" list (the exit\ncriterion is the GAP, not the estimate): the gap must be reported per-population as well as\nper-account, or a population defect will read as a belief error again.\n\n==========================================================================================\nSTILL OWED, unchanged and now for the SIXTH pass running.\n==========================================================================================\n\nTHE NAME COLLISION. `company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast\nwhile this atom's triple is contract-term/tenure/cohort;\n`company/finance/portfolio_dashboard.py:11` still propagates it. Six passes have recorded it\nand none has resolved it, which is itself the decay shape MAKE_IT_STICK names -- a line\nre-copied forward is not a mechanism. RECOMMENDATION, recorded rather than asked\n(NEVER_ASK_WITHOUT_RECOMMENDING), for the draw that opens this atom to execute in its FIRST\ncommit, before a line of EP1 code exists: rename `company/core/three_horizon_clv.py` to\n`company/core/commitment_actual_forecast.py` and its classes to what they are, leaving\n\"three-horizon CLV\" unambiguously this atom's. It is the cheaper side of the collision --\nzero non-test importers at HEAD, re-confirmed this pass -- and it gets cheaper never.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`, no CLV pair in\n`docs/observability/coupled_gap_ledger.json`. Consumed, not absorbed (R17)."
