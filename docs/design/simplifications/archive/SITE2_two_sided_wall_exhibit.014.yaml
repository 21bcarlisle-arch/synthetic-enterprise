simplifications:
- '2026-08-19 BUILD (worker tick, scheduled draw on SITE2 at loop_stage=build): the page has SEVEN top-level regions and exactly TWO of them were in any governor''s subject. Level STAYS 2.


  THE FINDING, and it is this atom''s own recurring class for the FOURTH time -- the first three each fixed one storey of it. 2026-08-12: the pinned op-state exhibit was outside the view selector. 2026-08-17: the case-study grid reached #app by a third path no wall control could see. 2026-08-18: #op-state''s child list was a boot-time SNAPSHOT, so a block appended later was in no governor''s subject whatever it declared. Each of those widened a governor''s subject to the CHILDREN OF ONE REGION. Nobody ever widened it to the REGIONS, and the set of governed regions was two getElementById literals -- the same hand-kept-subject shape as CONTENT_CLASSES, which the 08-18 tick had itself named structurally blind. applyWallViewToApp''s own comment says "the subject is now the DOCUMENT"; the document it means is #app.


  MEASURED FIRST, on the served page in a real chromium, before a line of repair existed -- and this ordering is the point, because the alternative is a section that reverses its own fix and calls that a defect. A block carrying "True satisfaction fell 12.2 percentage points" -- the exact string this page''s own WALL_VIEW_NOTE declares means the page is broken -- appended to document.body, then setWallView("customer") called through the page''s own entry point: SURVIVED in the customer''s view, WALL_VIOLATIONS empty, __subjectViolations() empty, 0 console errors, with 185 tests green. All seven regions carried neither a declaration nor a governor. That is R15''s FAIL-OPEN pattern in its purest form for the second time in this file: green because every region that happens to exist is innocent, which says nothing whatever about the next one.


  BUILT at the region list rather than in it. enforceDocumentRegions() requires every rendering top-level child of <body> to declare EITHER data-wall-chrome (carries no figure) OR data-wall-governed="<fn>"; anything else is recorded to WALL_VIOLATIONS with a console error and REMOVED, the same fail-closed rule the two inner governors already apply to their own children. Four design choices that are not the obvious ones. (1) NOT data-wall-side on the containers: #op-state and #app carry no figure themselves, and filtering the container by view would take its customer-observable children out with it -- so governance is a third term, not a side. (2) The declaration NAMES its governor and the governor must be a function that exists; a region asserting governance by a name nothing defines is ungoverned however loudly it says otherwise, and is treated exactly as one that declared nothing. Without that arm the new attribute is decoration. (3) NO CACHE, and it is a decision rather than an omission: opStateBlocks() caches because that governor removes AND restores, and taking the snapshot once is precisely what let a post-boot block escape it on 08-18. This governor never restores -- a region is chrome, or governed, or gone -- so a live read costs nothing and closes that hole by construction. (4) Deferred to DOMContentLoaded rather than called inline, because the page''s footer is emitted after the closing script tag: a guard running at script time would have reported the document clean while the last region of the page had never been in its subject. Its own boot order reproducing the fail-open it exists to remove.


  CAUGHT IN PASSING, by the mechanism''s own subject. The first draft of that comment contained the literal closing-script token. HTML ends the script element there, so the whole second inline script -- setWallView, both governors, renderHousehold, every function in it -- silently vanished from the page. The symptom in Playwright was "window.setWallView is not a function"; the symptom in the pytest suite would have been nothing at all, because the vm harnesses read the script blocks by regex and would have taken the truncated one. Recorded because it is the same class as everything above: a comment is not outside the document.


  THE CONTROL, and the probes are on the LIVE body rather than in the file. _subject_harness.mjs now models a real document.body whose children are read off the page''s own markup in document order -- a hand-written list here would be the harness''s opinion of what the page contains, and what the page contains IS the question. The four regions the rest of the harness already drives ARE those nodes, not copies, so a governor removing #app removes the same object renderHousehold() writes into. It refuses at <5 regions rather than running every probe against an empty body and reporting them all green. test_wall_exhibit.py section 22, 13 tests. TWO INDEPENDENCE POINTS worth naming: the governor''s non-rendering exemption set is REPORTED by the harness and checked against a set written in the test module, so the page cannot exempt a leaking region from its own control (a checker that reads its subject from the thing it checks is R15''s TAUTOLOGY); and test_every_declared_governor_is_a_function_that_exists reads the page SOURCE rather than asking the governor''s own runtime lookup.


  R15 FOUR MUTATIONS, each killing a NAMED test, plus the shipped page. (1) the body-level fail-open restored. (2) the record silenced -- FAIL-SILENT, and the leak test stays GREEN on it, which is exactly why the record needs an arm of its own. (3) any governor string accepted without checking it resolves -- the OVER-BROAD direction, and it must NOT also kill the plain leak check, or it would be proving arm (1) twice. (4) the call removed from setWallView -- the mechanism disconnected rather than broken, the shape in which a control is present in the file, reads correctly, and never runs. TWO NULL CONTROLS in the harness, not in prose: a chrome-declared region must SURVIVE (or the rule is "remove anything appended after boot" wearing a declaration rule''s clothes), and the page''s own seven regions must all still be in the document in all three views after the guard has removed three probes -- R11''s no-orphan-transition rule applied to a removal.


  THE SHIPPED-DEFECT PROOF, and it is built differently from the three above it on purpose. Section 22''s locator asks git WHICH COMMIT introduced the symbol (git log -S) and takes its parent, and it FAILS rather than skips when it cannot find one. That is because this tick''s suite run surfaced that sections 18, 19 and 21''s equivalents -- each walking a fixed HEAD~0..8 window -- have ALL THREE decayed into skips: the arm whose subject is the real defect has quietly stopped running on three sections while their mutation arms still report green. Staged as docs/staging/WORKER_FINDING_THREE_SHIPPED_DEFECT_PROOFS_HAVE_QUIETLY_STOPPED_RUNNING_2026-08-19.md with the reference implementation named, rather than fixed on sight: it is a defect in three other sections'' controls, and landing four sections'' R15 proofs in the same commit as the repair they are meant to be independent of is not an improvement.


  R11 ON A REAL CHROMIUM BOOT of the served page (python3 -m http.server over site/, headless chromium via the repo''s own playwright). 9 body children: 7 content regions -- site-nav, wall-head, door-wall-view, op-state, subject-boundary, app, footer -- plus the two inline scripts. All seven declared; op-state and app name their governors, the other five declare chrome with the reason written out. The bolted block is WITHHELD and RECORDED with its console error; a chrome-declared block SURVIVES; all seven regions survive in all three views; 0 page errors.


  EVIDENCE. site/customers/ 198 passed 3 skipped (was 185 passed 3 skipped). site/ 927 passed 10 skipped. tools/verify_printed_bill_render.mjs PASS -- 1600 usage lines, 1600 with a printed rate, 0 arithmetic failures (exit (7), D36 intact). tests/tools/test_case_study_recommender.py, tests/controls/test_map_reconciliation.py, site/now/test_now_door.py and site/test_no_links_to_redirected_urls.py green (65 together).


  LEVEL STAYS 2, and this tick does not touch the reason. Exit criterion (1) asked for a mechanism that FAILS when a new panel is added without declaring a side; it now fails one storey higher than it did, which is a criterion strengthened rather than a criterion newly met. The L3 gate is unchanged and is a re-run cold-eyes walk that returns YES -- and this tick is not one, by the skill''s own wall: it was run by an instance that has read the whole build record, which is neither blindness nor independence. The atom''s two remaining adjudicated-real ledger rows (consumption seasonality, the one-period renewal lag) stay rehomed to the generator and sim lanes with their staged findings; neither is fixable inside this file_scope.'
