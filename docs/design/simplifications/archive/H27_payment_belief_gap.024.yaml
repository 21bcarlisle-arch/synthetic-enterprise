simplifications:
- 'TWENTY-EIGHTH HOUR (2026-08-13, worker tick, H27 2->3 HARDEN draw), on Hour #27''s lead (a) -- `raw 0.000` on the public basis line beside a live headline of 0.118, which Hour #27 recorded as "either the raw gap really is ~0 and the basis line is telling the reader something surprising, or it is the render of a quantity that is not being carried, and nobody has asked". IT IS THE THIRD THING. THE DEFECT: `background/gap_metric.py`''s own module docstring has stated ONE relation between the three fields it publishes since atom A6 -- `gap = raw_gap / g0` -- and enumerated EXACTLY ONE exempt family (ageing, un-normalised by design, with a named reason constant beside it). THAT ENUMERATION WAS INCOMPLETE, and the omission reaches the PUBLIC Proof door, which renders `baseline g0 <g0> · raw <raw>` on one line for every pair with nothing to say which relation holds. MEASURED on the live ledger the door serves, 14 published pairs: ELEVEN satisfy `gap == raw_gap/g0` and THREE DO NOT, all three the SAME unenumerated family -- `detection_measures` (D11, landed 2026-08-09), where the headline is the MEAN of two error directions on their own denominators, `g0 = 0.5` is the no-skill SCORE on the headline''s own scale rather than a divisor, and `raw_gap` is ONE of the two averaged directions. Both the metric name (`"detection"`) and the field names are shared with the RECALL family that does divide, so nothing on the entry distinguishes them. THE READER GOT BOTH READINGS OF THE SAME FIELD: on W2_11<->D5, `raw 0.000` beside a live headline -- the miss direction really IS zero (the company missed no true payment failure) and the ENTIRE headline is the other direction, 242 of 1,451 truly-succeeded invoices flagged (false_flag_rate 0.1668), the wrongful-dunning exposure; `raw 0.000` beside a nonzero score reads as "the company''s own error is nil, the score is an artefact of the normalisation", the exact opposite of what happened, on the one dimension whose real-world cost is dunning a customer who paid. And on W2_8<->C10 the SAME field errs the other way: `raw 0.361` against a published 0.199, so a reader applying the module''s own stated relation gets 0.723, 3.6x the headline. Nothing anywhere asserted the relation on any population; it had never been measured. WHAT LANDED (atom D44): (1) `GapResult.normalisation` -- `divisor` / `reference` / `none` -- with NO usable default, so an undeclared kind RAISES and a new family that forgets to declare cannot be constructed, which is the only reason `detection_measures` was able to join the ledger; (2) the declaration is DECLARED, NEVER DERIVED -- a kind inferred from whether `gap == raw/g0` holds would classify every entry correctly by construction and could never fire on the case it exists for, the fail-OPEN direction of this same mistake (D40''s negative answer, applied to a field rather than an element); (3) it is FALSIFIABLE AT CONSTRUCTION per kind -- `divisor` requires the arithmetic to 1e-9, `reference` requires `raw_gap_is` to NAME a published component carrying the same number (prose alone would be unfalsifiable, which is the state this check exists to leave) plus a non-zero g0 and no live headline outliving an undefined direction, `none` requires g0 == 0.0 and raw_gap to BE the headline; (4) `reference` and `none` must state WHY there is no divisor -- an unexplained exemption is how the first one sat unnoticed for four days; (5) every construction site declares (six in gap_metric, plus this atom''s own latency measure and couple_cohort), and the two `reference` sites are exactly the two balanced successors -- the D19 belief one is not in the live ledger today and was ONE re-measure away from publishing the same defect; (6) `audit_ledger_normalisation` grades the LEDGER ON DISK, not the code that writes it, because an entry nothing re-measures is still being served -- fail-closed both ways, with `undeclared_and_relation_false` kept SEPARATE from `undeclared_normalisation` because unable-to-check and already-told-something-false are not the same defect, and never raising on a malformed entry (a checker that dies on its own population is fail-SILENT); (7) THE DOOR SAYS WHICH RELATION IT PUBLISHES -- `basisText` renders per kind, and every live entry predates D44, so the door today renders `basis UNDECLARED -- this entry does not record whether g0 divides the headline`, which is true. R15: TWENTY write-side mutations, each a defect writable today -- the undeclared entry (the defect that shipped), a divisor whose arithmetic is false, a reference with no reason / no `raw_gap_is` / naming a component that does not exist / naming one carrying a different number / with g0=0 / with a live headline beside an undefined direction, a `none` with non-zero g0, a `none` whose raw is not the headline, an unknown kind word; audit-side, each declared kind''s own lie, the malformed entry, and the writer''s and auditor''s vocabularies proven to be the SAME object. Plus SIX render-side tests executing the page''s own JavaScript against the four kinds, including THE OLD DEFECT STATED AS A CONTROL (a `reference` row must not render `raw 0.000` without saying it is one of two directions). NOT ALWAYS-RED: a fully-declared ledger audits EMPTY, the real scorers construct clean, and the `divisor` render carries no caveat at all so the caveat keeps meaning something. R12: no scorer was touched and NO published NUMBER moved -- no gap, epsilon, band, floor or collapse. The one published STRING that moved is the basis line itself, deliberately, and the `why_inert` declaration of `div.gap-row[0]/div.gap-basis[0]` was updated to match (the surface stays inert; Hour #27''s two-book classification is unaffected). THE LEVEL STAYS 2 FOR THE TWENTY-EIGHTH CONSECUTIVE HOUR. Hour #4''s two-consecutive-clean-Hours criterion is at zero. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): (a) `components["normalisation"]` ALREADY carries three different meanings across families (the ageing no-normaliser reason, the misapplication "majority-class prevalence", the latency reason) and now sits beside a top-level `normalisation` that is the KIND word -- two namespaces, one name, rendered in the same row; not renamed here because four cells'' tests read it; (b) the live ledger''s 14 entries are all UNDECLARED and stay so until runs re-measure with the declaring writers, and nothing re-measures them on a schedule; (c) D37-D44 exist only in this register''s prose and in no map cell, a SEVENTH Hour running; (d) Hour #27''s leads (b) the bar''s unstated clamp and (c) the other six pairs'' rows, plus D35''s scoped build and Hour #21''s vacuous-in-isolation sibling control, remain untaken. FULL TEXT: docs/staging/WORKER_FINDING_THE_BASIS_LINE_PUBLISHED_A_RELATION_THAT_IS_FALSE_FOR_THREE_PAIRS_2026-08-13.md'
