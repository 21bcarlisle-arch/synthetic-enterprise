  - 'FIFTEENTH HOUR (2026-08-11), on Hour #14''s lead 2 -- the six moving cells whose caveat numbers are bands and edges nobody checks against the figure: THE BELIEF CAVEAT PUBLISHED THE BOOK''S BOUND AS THE FIGURE''S OWN RESOLUTION, on two figures that do not share one. `belief_resolution_caveat` stated `measure_belief_window_resolution`''s headroom+1 as ''the smallest memory error IT can resolve at all'', byte-identically on `belief` and `belief_population_mix`. MEASURED through each dimension''s own scorer at the 4dp its consumers render, n=300, seeds 7/11/23: bound 310/309/309, `belief` 310/310/309, `belief_population_mix` 310/314/312 -- five days out on seed 11 for the mix figure, understating the instrument''s blindness. The predictor''s docstring had declared the gap (''the organ''s business and not this predictor''s'') and the mix register entry''s own_why had already noticed the bluntness; neither was a control. Closed at the class by `number_source` subject-checking on every moving cell plus a per-figure floor measured on a book-derived grid. Reshape minted as D33_the_collapse_predicate_is_bit_equality: the mix figure''s declared ceiling of -309 rests on a 1.4e-17 reading, and every collapse run and saturation edge in this module is derived with the same bit-equality.'
