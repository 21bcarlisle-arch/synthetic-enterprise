atom_id: EP6_wall_protocol_typing
chunk: 37
simplifications:
- '2026-08-20 pass 42 BUILD, level HELD at 2, loop_stage stays build. THE STAND-IN CAN NOW MISBEHAVE ON PURPOSE, AND THE FIRST THING IT EMITTED PUT GBP126 OF A STRANGER''S CASH INTO THIS COMPANY''S BOOK. Pass 41 handed forward Q6 as "may already be closer than its row says"; it was closer in the half that was never the question and wide open in the half that was. Everything here is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD a47f4945c, worktree.


  WHAT PASS 37''s ROW GOT RIGHT AND WHY IT WAS STILL THE WRONG SUBJECT. That row recorded, correctly, that the seam REFUSES spec-violating input and that the consumer handles duplicates and out-of-order revisions, both tested. Neither is Q6. Those tests hand the company a HAND-BUILT bad message, which asks whether the receiver copes; Q6 asks whether the STAND-IN can produce one. The reviewer said why in his own words -- "if the fake can only be well-behaved, it rehearses nothing worth rehearsing" -- and the practical consequence is that the receiver''s tolerances were exercised solely by the imagination of whoever wrote the fixture. Re-reading the row against passes 36-41, as pass 41 recommended, is what made that distinction visible: six passes of repair had moved the RECEIVER and never once the EMITTER.


  WHAT WAS BUILT. simulation/payment_seam_adapter.py::SpecViolation -- DUPLICATE_REFERENCE, FOREIGN_ACCOUNT, OUT_OF_ORDER_REVISION, BACKLOG_BURST, the reviewer''s own four. Three design calls carry it. (1) APPLIED TO THE FRAMED WIRE, after `encode_wall_response` has done its honest job, because a misbehaving counterparty is exactly one whose bytes its own encoder would not have produced; weakening the encoder to let a violation through would break the well-behaved path in order to model the badly-behaved one. (2) STRUCTURALLY VALID, SEMANTICALLY WRONG, and structurally malformed bytes are deliberately absent -- those are the decoder''s business and pass 37 already tests them from hand-built fixtures, so a fault mode for them would re-test the refusals and add nothing. The class nothing could produce before is a message the company will happily read and should not act on. (3) SEQUENCE-LEVEL, because three of the four are not properties of any one message: a duplicate, an ordering and a burst exist only across a hand-over.


  EVERY TRANSFORM REFUSES RATHER THAN NO-OPS, and this is the R15 clause of the design. `apply_spec_violation` raises when the hand-over cannot carry the violation -- an ordering needs two messages, a burst needs two, FOREIGN_ACCOUNT needs a payload with an account (a non-OK envelope is about no account at all), an unrecognised member is refused rather than passed through. A violation that silently declined to happen would make every regression built on it FAIL-OPEN in the exact named sense: green because nothing misbehaved, read as green because the company coped.


  WHAT THE MISBEHAVING STAND-IN FOUND ON ITS FIRST RUN. FOREIGN_ACCOUNT -- a remittance mis-keyed to another supplier''s account reference, this seam''s form of the reviewer''s "readings for MPANs you don''t supply" -- went straight through. `LedgerBook.ledger()` creates an account on first sight, so the cash CREATED a phantom account and posted into it. The tell is one line: on three well-formed messages `portfolio_balance_gbp()` came out -126.0 for the mis-keyed hand-over and -126.0 for the clean one, BIT-IDENTICAL. The company''s own headline cash figure could not distinguish its customers'' money from a stranger''s, and no existing test could see it because no existing test could produce the message.


  THE REPAIR, AND WHY IT IS A REGISTER AND NOT A REFUSAL. `PaymentObservationConsumer(supplied_accounts=...)` -- the company''s OWN roster, stated before the first message is read and never read off the wire, because a message naming an account cannot be the evidence that the account is ours (R15 TAUTOLOGY). A well-formed observation about an account it does not supply becomes a `MisdirectedObservation` and touches no ledger. Not refused: the message is VALID, the fact is real, and losing it would be worse than mis-filing it -- which is why real receivables functions book it to suspense and work it off. SENSING ONLY, the same clause as `ExpectedCollectionMiss`: nothing queries, returns or writes off, because those are acting organs and RESERVED (ruling 2026-07-25 s2).


  `None` MEANS UNASKED, NOT EMPTY, and that distinction is the reason the roster is optional. Every caller that existed before this pass is bit-identical, because a company with no roster has no grounds to reject anything -- but `holds_account_roster` publishes which of the two an empty register is, so "nothing was misdirected" cannot be read off a company that could never have told. The check itself FAILS CLOSED in the direction that matters: with a roster held, a payload carrying no `account_id` RAISES rather than passing, because all six of this seam''s response payload types declare one and treating an object without one as well-directed would let exactly the malformed case through the check built to catch it.


  THE CONTROL HAS A RUNNING CALLER, not only a test, and WHICH caller was decided by a refused landing rather than by preference. The first attempt wired the roster into tools/couple_w2_11_d5.py at construction, since that harness builds the book and knows its whole roster up front. `surgical_land` REFUSED it: tests/tools/test_couple_w2_11_d5.py is wedged at HEAD by 21 door tests whose harness path (site/proof/_render_harness.mjs, site/proof/index.html) is in NO tree -- `git ls-tree -r HEAD | grep -c site/proof/` is 0 -- so every one of them errors before reaching an assertion and any commit touching that file is unlandable. Filed as its own finding rather than fixed on sight (SELF_INTERRUPT_DISCIPLINE); the harness edit was reverted rather than left uncommitted on a shared tree.


  The caller it landed on is BETTER, and the refusal is what exposed why. background/live_payment_triad.py is the company that actually runs inside run_phase2b, and it does NOT know its book up front -- it learns of an account when it BILLS one. So the roster GROWS: `note_supplied_account` is called at the bill, the one place the company acts on its own knowledge of the account and never on anything that arrived on the wire, and `holds_account_roster` flips there from False to True. Calling it on a consumer holding no roster STARTS one, which is the transition from "cannot tell" to "can". The D8 shadow is told identically, for the same reason it is billed identically: a shadow with a different roster is a second company, not a counterfactual. The live figures are unchanged (84 passed), because every account that stand-in names is one the triad billed.


  EVIDENCE: tests/simulation/test_payment_seam_adapter.py 58 passed, including the null-control assertion that the clean hand-over names a DIFFERENT account (without it the FOREIGN_ACCOUNT test would pass on a transform that did nothing) and the non-mutation assertion (a transform that edited in place would make every null control equal to its violation). tests/background/test_live_payment_triad.py -- nine Q6 tests driving the REAL company path (`observe_wire`, so frame, envelope and payload refusals all run), each holding the well-behaved hand-over beside it. tests/company/billing/test_payment_observation_consumer.py + tests/company/interfaces/ + tests/tools/test_wall_channel_census.py 864 passed. tests/architecture/test_epistemic_wall_ratchet.py + tests/simulation/test_payment_seam_adapter.py + tests/background/test_live_payment_triad.py 102 passed. python3 -m tools.epistemic_verifier PASS. TWO R15 MUTANTS, one per direction the wiring can fail. Neutering `_is_misdirected` returns the phantom account and empties the suspense register (test_q6_R15_MUTANT_deleting_the_roster_check_puts_the_cash_back_in_the_book). And a triad that states only its FIRST account -- what a partial wiring looks like -- suspends its OWN customers'' cash (test_q6_R15_MUTANT_a_triad_that_stops_stating_its_roster_suspends_its_own_cash), which is the direction that matters once the check exists at all: a roster the company forgets to state stops being a harmless omission.


  WHY Q6 IS RECORDED FAIL ANYWAY. BACKLOG_BURST is emitted and is BYTE-IDENTICAL to an ordinary batch. Nothing on this wire records when a message was HANDED OVER, only when the counterparty says it observed the fact, so a released queue and a normal delivery are the same bytes and no company-side check could tell them apart. That is a missing delivery clock -- the same missing-request-leg family as Q2 and Q5 -- and it is pinned rather than glossed. Q10, Q13 and Q14 were each left FAIL after partial repairs on this reasoning, and pass 41 wrote down why: a different standard for the pass that built the repair is the ceremony the cold-eyes walk exists to stop.


  WHAT THIS PASS DOES NOT ESTABLISH. No violation RATE -- the stand-in misbehaves only when a caller asks it to, because a rate would be a property of the baseline world and R13 makes that the director''s, so no committed run moves by a penny. No malformed-byte emission (excluded above, with the reason). No roster on any caller but the live triad; the offline coupling harness still holds none and says so, because the file that would state it is wedged (above). The level is still 2, same reason as passes 38-41: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.


  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): Q2, the request leg. Three separate items now hand forward to it -- Q5''s initial silence (pass 41), Q6''s undetectable burst (this pass), and Q2 itself -- and all three are the same missing structure: the company records nothing about a crossing until an answer arrives, so it can hold no clock against one. That makes Q2 the highest-leverage remaining item rather than merely the next one, and the first pass on it should build the request REGISTER before the request MESSAGE, because the register is what the other two need. The target decision recommended at passes 38-41 -- retarget to level 2 for epoch 3, move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director''s (R13).'
