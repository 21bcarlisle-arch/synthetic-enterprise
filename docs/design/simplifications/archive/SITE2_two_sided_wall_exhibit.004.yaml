- '2026-08-13 LANDED + MAP RECONCILED (worker tick). The disposition work described in the entry above was BUILT AND UNCOMMITTED in the working tree when this tick drew the atom -- the "a draw may already be built and unlanded" case. It was adopted, not rebuilt: verified (site/customers/test_wall_exhibit.py 47/47, test_customers_door.py 11/11, 58 passed) and landed. LEVEL STAYS 2, unchanged: exit (4) is still half-landed (the /customers/ URL move is SITE3_wall_exhibit_url_rename) and the Expert-Hour verdict is still NO with four findings genuinely open, so nothing here certifies a level move.


  THE RECORD AND THE MAP DISAGREED ABOUT THIS ATOM. The disposition tick wrote its four fixes into the adjudication ledger (state -> fixed, with fix_evidence) and into the entry above, and left all four sitting in the map''s expert_hour.findings under the comment "open; each needs its own atom -- most are SIM/COMPANY fidelity, not render" -- the very sentence that entry was written to correct. Two records, one subject, opposite claims, and nothing anywhere compared them. The map is the DRAWN-FROM record, so a fixed finding left open there re-draws work already done and holds a level move that may no longer be held. The map''s block is now split into dated fixed_2026_08_12 / fixed_2026_08_13 lists (the history is kept, not deleted) with six genuinely-open findings remaining, two of those adjudicated REFUTED.


  MECHANISM, NOT A HAND-CORRECTION (the same class of fix this atom exists to demonstrate). tests/controls/test_map_reconciliation.py -- the module that already guards unfolded level-report inboxes and duplicate map keys, i.e. exactly the self-report-vs-external-truth family -- gains test_no_map_finding_is_listed_open_while_the_ledger_records_it_fixed. The ledger is the truth by design: it carries the adjudication timestamp, adjudicator and fix evidence per key, where the map carries a bare list, so the check is ONE-WAY (ledger CLOSED while map OPEN is the defect). CLOSED_LEDGER_STATES is {fixed, superseded} only: adjudicated-false-positive is deliberately excluded because a refuted finding annotated in place is a disclosure, not a divergence, and a control that flagged it would be noise.


  R15 BOTH WAYS, AGAINST THE LIVE ARTEFACTS rather than only fixtures. Driving the control over `git show HEAD:docs/design/maturity_map.yaml` and the live ledger reports exactly the four real contradictions (arrears siding, tariff unit, churn R14 clock, door selector) and a resolvable population of 10; over the repaired map, 0 contradictions and a population of 6. Fixture-level proofs alongside: a fixed-finding-left-open FIRES the guard, an adjudicated-real and an adjudicated-false-positive are both SILENT while still COUNTING toward the population, and prose/unresolvable findings count ZERO.


  FAIL-OPEN PROOF, because this control''s obvious failure mode is going blind. Most atoms'' expert_hour.findings are prose narrative, so the comparison would pass trivially if the key-naming convention drifted or the record were rehomed out of the map. test_the_findings_ledger_comparison_is_not_vacuous fails the moment NO listed finding resolves into the ledger -- the guard reports a population of zero honestly rather than as a clean pass. tests/controls/test_map_reconciliation.py 13 passed.'
