simplifications:
- "2026-08-20 pass 26 BUILD, level HELD at 2, loop_stage stays build. THE VERSION ON THE WIRE NOW HAS A REFERENT: `SURFACE_PINS` binds each seam's `SCHEMA_VERSION` to the observable surface that version denotes, so a surface can no longer widen silently under an unchanged version. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 3ee0d47da, worktree.\n\nTHIS PASS IS NOT THE COLD-EYES WALK PASS 25 ASKED FOR, and that is the first thing to say because the rest is worth less without it. Pass 25's next move was a blindfolded stranger put to the three codecs. This tick could not spawn one -- the invocation forbade delegating to a fresh instance -- so what happened instead is that the SAME LANE THAT BUILT THE CODECS put pass 25's question to them. That is a weaker instrument for exactly the reason the technique exists, and the walk stays unrun and is now one pass older again. What follows is a build move that came out of asking the question, not a review that discharges it.\n\nTHE QUESTION, VERBATIM FROM PASS 25: \"the closed set moves the epistemic decision to the moment someone edits `OBSERVABLE_PAYLOAD_FIELDS` -- so is there anything at all, other than a reviewer's attention, standing between 'I added a field and the test went red' and 'I added the field name to the tuple and it went green'?\"\n\nTHE ANSWER WAS NO, AND THE INTERESTING PART IS WHAT THAT COSTS. Not that a leak becomes possible -- it always was, and no code can make the observable/hidden judgement for a human. What the tuple edit bought was SILENCE. `SCHEMA_VERSION` is not decoration on these seams: it is encoded into every envelope (`schema_version=SCHEMA_VERSION` at four sites in `simulation/payment_seam_adapter.py`, two in `simulation/conversation_response.py`) and REFUSED on mismatch by each decoder (`conversation_response.py:732` -- `schema_version {version} is not the {SCHEMA_VERSION} this seam speaks`). So the counterparty is told to trust a number. All three seams declare `SCHEMA_VERSION = 1`, and NOTHING anywhere pinned what 1 means -- grepped both `tests/interface/` and `tests/sim/test_flex_dispatch.py` for a pin, digest or bump rule and found none. A version whose meaning moves silently is strictly WORSE than no version: the counterparty's check passes and its assumption is wrong, which is the precise failure a version exists to prevent.\n\nCHANNEL C READ 3 OF 3 BEFORE THIS PASS AND STILL DOES. That saturation is why the origin moved rather than the population: the transport question is answered and cannot ask the question that makes its own answer worth having. `channel C: 3 of 3 versioned seam(s) cross on a wire` is now followed by `channel C surface pins: 3 of 3 versioned seam(s) still mean what their version says`.\n\nTHE PIN LIVES IN THE INSTRUMENT AND NOT IN THE SUBJECT, and that separation IS the control (R15 TAUTOLOGY). Every existing guard on these declarations lives in the SAME FILE as the thing it guards -- the mirror against the dataclass, the AST literal guard, the denylist -- so all three are satisfied by one edit that touches two literals a few lines apart. `SURFACE_PINS` sits in `tools/wall_channel_census.py`: the seam declares what it observes, the census independently records what each version was pinned to mean, and the two are edited at different times in different files. `test_the_pins_are_LITERAL_and_not_derived_from_the_surfaces_they_pin` holds the pin table to the same AST discipline the contracts' own closed sets carry.\n\nWHAT IT DOES NOT DO, recorded as a limit rather than discovered as one later. It does not stop a leak. An editor who bumps `SCHEMA_VERSION` and re-pins has widened the surface deliberately and the census goes green. The claim is narrower and is the whole claim: the SILENT widening is gone. The one-line tuple append now costs a version bump plus an edit in a second file, both diff-visible, and a counterparty reading version numbers can act on it.\n\nR15 PROVEN BOTH WAYS, 12 new tests, COUNTED OFF THE TREE AND NOT FROM THE PLAN (651 passed across `tests/tools/test_wall_channel_census.py` + `tests/company/interfaces` against pass 25's 639 on the same two paths; the plan said 11 and the tree says 12). A NULL CONTROL (`test_the_written_out_digest_and_the_fixtures_surface_actually_correspond`) proves the fixture's hand-written digest and its declaration actually correspond -- without it every refusal below could be the literal being wrong rather than the mutation being caught. The mutations: a field ADDED with the version left at 1 (the doctrine mutation -- pass 25's exact sentence, executed); a field REMOVED, which is equally drift and breaks the counterparty rather than the wall; the version BUMPED without a re-pin, which is UNPINNED and red because a bump that passes unnoticed decays the pin table into a record of what someone once thought. FAIL-OPEN is proven closed: a seam absent from `SURFACE_PINS` is UNPINNED, not skipped, so a fourth seam lands RED on the day it lands. FAIL-SILENT is proven closed: an unparseable seam RAISES `CensusUnavailable` rather than reading as undeclared. There is a DELIBERATE NON-FIRING case with a test of its own -- a re-ordered surface is not drift, because the envelope carries a mapping and a control that reds on cosmetics is one that gets tuned away with the real edit still inside it.\n\nIT GATES FROM ITS FIRST COMMIT, following the rule this file already wrote for channel C: a check becomes a gate \"in the same commit that makes it satisfiable\". Channel C's transport question could not gate on arrival because two seams were genuinely in-process and it would have refused its own repair. The pin has no such excuse -- all three seams are pinned green at HEAD -- so the only commits it can refuse are commits that move a surface without moving its version. `python3 -m tools.wall_channel_census` returns 1 on drift; `python3 -m tools.epistemic_verifier`: PASS, 577 company/ + saas/ files, no barrier violations.\n\nA SECOND DEFECT FOUND WHILE READING, NOT FIXED, RECORDED SO IT IS NOT RE-DISCOVERED. The `FORBIDDEN_TRUTH_FIELDS` denylist -- pass 25's \"second belt\", the one that still fires when a truth field is added to the dataclass AND declared observable in the same edit -- covers TWO of the three seams. `interface/contracts/payment_observable_seam.py` declares none; the identifier appears there exactly once, at line 281, inside a comment describing the history of not having one. So on the payment seam the belt pass 25 described as kept-and-ordered-first does not exist, and the closed set is the only belt. Six payload types cross that seam. This is a build move on its own and is the strongest candidate for the next BUILD pass.\n\nWHAT THIS PASS DOES NOT ESTABLISH.\n  * THE COLD-EYES WALK IS STILL UNRUN. Stated twice on purpose: it is the first blocker on L3 and this pass did not clear it, it acted on it.\n  * THE PIN GUARDS THE DECLARATION, NOT THE ENCODER. A codec that stops consulting `OBSERVABLE_PAYLOAD_FIELDS` altogether leaves the pin green and the wall open. The encode-leg tests are what hold that today and they are in the same file as their subject.\n  * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION -- A, B, E and F are enumerated only. Unchanged from pass 22.\n  * NOTHING HERE MAKES THE (SEAM, LEG) UNIT FINER. Unchanged from pass 25.\n\nNEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): GIVE THE PAYMENT SEAM THE DENYLIST BELT ITS TWO SIBLINGS HAVE, with the R15 mutation proving it fires independently of the closed set, exactly as `test_mutation_a_known_forbidden_trait_still_trips_the_denylist_belt` does on the conversation seam. It is a smaller move than the cold-eyes walk, it is unambiguously a build move, and it closes a hole that is currently one belt deep on the widest of the three seams. The walk stays queued ahead of L3 and should be run by a fresh instance the first tick that can spawn one."
- "2026-08-20 pass 27 BUILD, level HELD at 2, loop_stage stays build. THE PAYMENT SEAM GETS THE SECOND BELT ITS TWO SIBLINGS HAVE, AND THE CENSUS GETS THE QUESTION THAT WOULD HAVE FOUND THE HOLE. This pass does the move pass 26 recorded as next, in the order it recorded it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: parent 03dd8c49e, worktree.\n\nFIRST, THE THING THAT WAS WRONG BEFORE ANY OF THIS: PASS 26 WAS IN NO COMMIT. Its record said \"IT GATES FROM ITS FIRST COMMIT\" and there was no first commit -- `tools/wall_channel_census.py`, its tests, this store file and the rolled `archive/EP6_wall_protocol_typing.017.yaml` were all sitting unstaged in the shared tree, and `git show HEAD:tools/wall_channel_census.py | grep -c SURFACE_PINS` returned 0. Landed at the top of this tick as b559c070f (gate-rc 0, 582 passed). The gate refused the first attempt for a reason worth keeping: the roll is a TWO-FILE atomic write and the map's `simplifications_count` is a THIRD -- `test_counts_match_file_contents` read `map=24 != store=25` on the tree the commit WOULD create while the working tree was green, because the count edit was in the worktree and not in the pathspec. This is the third pass of this atom to record a landing that was in no commit (`WORKER_FINDING_THREE_CONSECUTIVE_PASSES_RECORDED_A_LANDING_THAT_IS_IN_NO_COMMIT_2026-08-19.md`); it is a two-strike component by R3's count and the record here is not the fix.\n\nTHE COLD-EYES WALK IS STILL UNRUN, and is now TWO passes older than the pass that asked for it. Same cause as pass 26: this invocation forbids delegating to a fresh instance. Stated first among the limits rather than last, because it is the first blocker on L3 and no build move below discharges it.\n\nTHE DEFECT, RESTATED WITH ITS MEASUREMENT. Pass 26 found by hand that `interface/contracts/payment_observable_seam.py` declared no `FORBIDDEN_TRUTH_FIELDS` -- the identifier appeared there exactly once, at line 281, inside a comment about not having one. Six payload types cross that seam and the closed set was their only belt. What the closed set cannot see is a truth field added to a dataclass AND declared observable in the same edit, because that edit moves the very thing the control reads.\n\nAND THE ASYMMETRY NOBODY HAD WRITTEN DOWN, WHICH IS WHY THIS SEAM NEEDED IT MOST. The two legs of this crossing are not equally defended. The ENCODE leg (`simulation/payment_seam_adapter.encode_observable_payload`) checks `OBSERVABLE_PAYLOAD_FIELDS`, which is declared independently of the dataclasses. The DECODE leg (`company/billing/payment_observation_consumer.decode_observable_payload`) does not: its permitted key set is `_OBSERVABLE_PAYLOAD_HINTS = {t.__name__: get_type_hints(t) ...}`, so it WIDENS with its subject and is an R15 TAUTOLOGY for exactly this question. Until this pass the decode leg had NO non-derived check of any kind. That is not a theoretical gap given what this seam is for: at go-live the encoder belongs to a bank and the decode leg is the only side of the crossing the company still owns. The belt is now on BOTH legs, denylist-first on each, matching the ordering `sim/flex_dispatch.py` already states.\n\nTHE LIST IS MEASURED AND SAYS WHICH PARTS ARE NOT. 22 names in two labelled groups. MEASURED (12): each is an attribute of a world-side truth producer behind this seam, cited with the file it lives in -- `PaymentEvent` (`result`, `dd_failure_reason`, `period_index`, `data_regime`), `WillingnessProfile` (`ability`, `willingness`, `quadrant`, `discretionary_margin_monthly`, `discretionary_margin`), plus `hardship_tier`, `income_stress`, `stress`. ANTICIPATED (10): spellings of the four classes the module header already forbids, with no such attribute in the tree today, and honestly weaker by construction. `PaymentEvent` carries 10 fields and the belt names exactly 4 of them: the other 6 (`customer_id`, `due_date`, `amount_gbp`, `payment_method`, `payment_date`, `days_late`) are company-owned or genuinely observable and are DELIBERATE NON-MEMBERS with a test naming each and its reason. A denylist that reds on `days_late` -- which any supplier computes from its own due date and the advised value date -- is one that gets relaxed, and the relaxation takes the real entries with it.\n\nTHE R10 HALF, WHICH IS THE PART THAT OUTLIVES THIS SEAM. Pass 26 found the hole by reading three files side by side; NOTHING could have failed, because the belt was a per-seam convention and a convention is what a fourth seam lands without. `second_belt_conformance` in `tools/wall_channel_census.py` now asks every channel C seam whether it declares a non-empty LITERAL denylist and whether any non-test module refuses on it, with the seam set DERIVED from `envelope_seams` so a fourth seam owns the question on the day it lands. Reading at HEAD: `channel C second belt: 3 of 3 versioned seam(s) carry a truth-field denylist something refuses on`. It GATES from this commit by the rule this file has now stated twice -- a check becomes a gate in the same commit that makes it satisfiable -- and `second_belt.ok` is in the CLI's return expression, pinned by a test that reads the return statements rather than running the CLI.\n\nTHE INSTRUMENT IS SEPARATE FROM ITS SUBJECT, AND THE ENFORCEMENT HALF IS NOT SYMBOL-PRESENCE. The question lives in the census, not in the seams, because a seam that declares no belt is exactly the one that would not carry the check. The second half asks whether the constant is READ and RAISED ON inside one function body, not whether the name appears -- a module that imports a denylist and never acts on it is the fail-open case being looked for, and `test_MUTATION_a_denylist_NOTHING_refuses_on_is_UNENFORCED` is the proof that state is caught. The proxy is coarse and the docstring says so: it cannot tell a belt checked in the encode path from one checked in an unrelated helper that happens to raise. It can tell enforced-somewhere from enforced-nowhere, which is the failure it exists for.\n\nR15 PROVEN BOTH WAYS, 30 NEW TESTS, COUNTED OFF THE TREE AND NOT FROM THE PLAN (222 collected across `tests/tools/test_wall_channel_census.py` + `tests/interface/test_payment_observable_seam.py` + `tests/simulation/test_payment_seam_adapter.py` + `tests/company/billing/test_payment_observation_consumer.py`, against 192 on the same four paths at parent). NULL CONTROLS, three of them, because without each the battery beside it proves nothing: `test_the_fixtures_belt_is_declared_AND_refused_on_so_the_green_case_is_real` (else every census refusal could be a fixture that never had a working belt); `test_NULL_CONTROL_an_undeclared_but_INNOCENT_field_trips_the_OTHER_belt` on each leg (else \"the denylist fired\" is indistinguishable from \"anything unusual is refused\" -- the two belts stay separately observable, each with a case only it can pass); `test_the_MEASURED_names_really_are_attributes_of_the_producers_they_cite`, which is the null control on the LIST -- a denylist of invented names is indistinguishable from a good one until the day it is needed, and this also reds when a producer RENAMES a truth field, which is when a belt goes hollow while still looking full. THE DOCTRINE MUTATION is performed on both legs: a truth field added to the payload AND declared observable in the same edit, with an assertion in the test body that the closed set / the derived hints are GENUINELY GREEN on that payload -- which is what makes the belt load-bearing rather than redundant. FAIL-OPEN is proven closed twice in the census: an EMPTY denylist reads as UNBELTED (it is what \"delete the awkward entries\" leaves behind, and it reads as present to any check that only asks whether the constant exists), and a COMPUTED one reads as UNBELTED for the tautology reason. FAIL-SILENT is proven closed: an unparseable seam RAISES `CensusUnavailable` rather than reading as beltless. A LOCATION test (`test_an_enforcer_that_imports_the_belt_from_ANOTHER_seam_does_not_count`) fixes the shape where two seams both name their denylist `FORBIDDEN_TRUTH_FIELDS` and one seam's enforcement vouches for another's -- the unbelted seam being exactly the one that would be vouched for. `python3 -m tools.epistemic_verifier --all`: PASS, 541 company/ + saas/ files, no barrier violations. The surface pins are UNTOUCHED and still green (3 of 3): this pass adds a constant and changes no declared surface, so no re-pin was due and none was made.\n\nWHAT THIS PASS DOES NOT ESTABLISH.\n  * THE COLD-EYES WALK IS STILL UNRUN. Stated twice on purpose.\n  * THE BELT IS THE SECOND BELT AND NEVER THE CONTROL. It answers \"did we think of this name\". An editor who adds a truth field under a name nobody listed, and declares it observable, still gets through both legs. No code can make the observable/hidden judgement for a human; what is bought is that the four measured classes of world truth behind this seam cannot cross under their own names.\n  * THE DECODE LEG'S PERMITTED KEY SET IS STILL DERIVED. `get_type_hints` remains the only thing deciding which fields are allowed there. The belt sits in front of it; it does not replace it, and the tautology is unchanged.\n  * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION -- A, B, E and F are enumerated only. Unchanged since pass 22.\n  * NOTHING HERE MAKES THE (SEAM, LEG) UNIT FINER. Unchanged since pass 25.\n\nA SECOND DEFECT FOUND BY THE NEW INSTRUMENT, NOT FIXED, RECORDED SO IT IS NOT RE-DISCOVERED (SELF-INTERRUPT DISCIPLINE: queue, do not fix on sight). The census names its enforcers, and they are not evenly spread: flex is enforced by two modules (`sim/flex_dispatch.py`, `company/market/flex_participation.py`), payment now by two (`simulation/payment_seam_adapter.py`, `company/billing/payment_observation_consumer.py`), and CONVERSATION BY ONE -- `simulation/conversation_response.py`, the SIM side. Grepped the company side: `company/comms/conversation_generator.py` and `company/comms/susceptibility_estimator.py` import the conversation seam and neither consults its denylist; the payload arrives through `company/interfaces/wall_protocol.decode_response`, which checks the ENVELOPE and treats the payload as opaque. So the conversation seam is belted on the leg the SIM owns and bare on the leg the company owns -- the same asymmetry this pass just closed on payment, on the seam that carries a customer's hidden latent traits. That the check REPORTED this rather than a human noticing it is the R10 half working on its first run.\n\nNEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): GIVE THE CONVERSATION SEAM'S COMPANY LEG THE BELT, with the same doctrine mutation proving it fires where the derived check is green, and then TIGHTEN `belt_enforcers` from \"some module refuses on it\" to \"BOTH legs refuse on it\" -- the finding above is a per-leg fact that the current per-seam verdict can only report in its enforcer list, not fail on. The two go together: the tightened check would be born red on conversation, which is the honest landing order (build the repair, then let the check that demanded it gate). The cold-eyes walk stays queued ahead of L3 and should be run by a fresh instance the first tick that can spawn one."
