simplifications:
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing typed, no protocol designed -- this atom is\nepoch-3 BUILD-gated on director-reserved curriculum sequencing (R13), and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` deliberately NOT edited: nothing in the map moves for this\npass, and another lane holds staged hunks in that file (`git diff --cached --stat` at draw\ntime: 13 insertions, 5 deletions). Output is this record plus one queued finding.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD d5916fd67. Live published artefact `docs/reports/run_output_latest.json`\n(mtime 2026-08-13 17:51:47, 3,568,564 bytes) read directly; shipped modules read as they\nsit on disk; nothing monkeypatched, nothing regenerated. Two of this atom's three cited\nevidence paths were DEAD (the known moved-path class) and are repaired above: the director\nruling had been archived to `docs/staging/done/`, the counterparty-API research moved to\n`docs/design/refs/`. Six paths added -- the ones a reader of this atom actually needs.\n\n==========================================================================================\nFINDING 1 -- THIS ATOM'S OWN `name:` POINTS AT THE WRONG ANCESTOR. The protocol layer EP6\nproposes to build ALREADY EXISTS, is live on three crossings, and is not the pattern this\natom names. Nine downstream atoms inherit the wrong pointer through `depends_on`.\n==========================================================================================\n\nThe atom's `name:` says: \"W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this\nis the protocol layer every named adapter below plugs into.\" Read that against the tree and\nit sends EP7-EP15 to the one family that implements none of C-S3.\n\nWhat is actually on disk, two disjoint families:\n\nFAMILY A -- `interface/contracts/wall_envelope.py`. `WallRequest[P]` / `WallResponse[R]` /\n`WallStatus`, frozen and generic. Its module docstring enumerates the same five properties\nthis atom's origin note is about (C-S3 separate events in time, C-S2 at-least-once\nidempotency, C-S1 late/out-of-order/never, NOT_KNOWABLE_YET as a first-class answer, and\nrestatement-not-mutation), and implements them: `correlation_id` is both the idempotency\nkey and the ONLY link between request and response; `as_of` (decision clock) is kept\ndistinct from `emitted_at` (transaction time); `observed_at`/`valid_time` are bitemporal by\nconstruction; `__post_init__` REFUSES a malformed envelope (an OK with no payload, a\nnon-OK carrying one, an ERROR with no `ErrorDetail`) at construction rather than at some\nquieter later read. `schema_version: int` is a REQUIRED field on both request and response\n-- no default, structurally impossible to omit. Referenced by 11 non-test modules; three\ncrossings are expressed in it (`payment_observable_seam.py`, `conversation_seam.py`,\n`flex_observable_seam.py`), live-wired at `simulation/conversation_response.py::\nrespond_over_wall` (which contract-validates the pairing so \"a same-step or mis-linked\nresponse can never leave this function\"), `simulation/payment_seam_adapter.py`,\n`sim/flex_dispatch.py`, and consumed on the company side by\n`company/billing/payment_observation_consumer.py` and `company/interfaces/sim_interface.py`.\nBuilt under atom W4_4 per its own docstring -- NOT under W4_1.\n\nFAMILY B -- `tools/*_port.py`, the five ports W4_1 built and this atom's `name:` cites:\n`market_data_port`, `credit_bureau_port`, `meter_read_port`, `acquisition_funnel_port`,\n`contact_centre_port`. Every one is a `runtime_checkable` Protocol whose method RETURNS the\nanswer in the same call frame -- `get_meter_reads() -> list[MeterReadMessage]`,\n`check_credit(applicant_id, segment, seed) -> CreditCheckResult`,\n`get_spot_elec_gbp_per_mwh(as_of) -> float`. Zero request objects. Zero correlation ids.\nZero separation in time. Grepped for `correlation_id` across the five: one hit, in a\n`contact_centre_port.py` COMMENT explaining that the real crossing dict has no\ncorrelation_id and the sketch's illustrative guess did.\n\nSo the origin note's fear -- \"C-S3 is the thing most likely to be quietly dropped, because\nsame-step is easier\" -- has already come true, but in the opposite direction from the one it\nguards. C-S3 was not dropped from the DESIGN; it was designed properly in Family A and\nnever picked up by the family this atom points its nine dependants at. And the sketch's own\nrow 7 (`docs/design/WALLED_INTERFACES_SKETCH.md`, banking/payment rails) explicitly defers\n\"full typed/versioned HARDENING of this seam (schema versioning, the reference-flow-\nconversion treatment given to the other rows)\" to Epoch 3 -- i.e. to THIS atom -- and that\nis precisely the seam Family A already landed.\n\nWHAT FOLLOWS, recorded rather than asked (NEVER_ASK_WITHOUT_RECOMMENDING):\n\n1. This atom is not greenfield. `level_current: 0` and `file_scope: []` describe an atom\n   with nothing built; the honest reading is that its deliverable exists in part, under a\n   different atom, and its level must be re-derived from a CENSUS when it opens, not\n   assumed from the record. Not changed here: a level move is a BUILD-side act on a\n   BUILD-gated atom, and the map holds another lane's hunks.\n2. When EP6 opens, its first task is the census, not a design: enumerate every live\n   SIM/company crossing and classify each as (a) envelope-borne, (b) same-step typed port,\n   (c) bare dict. The measured starting point from this pass -- 9 known crossings (the\n   sketch's 7-row table plus conversation and flex), 3 envelope-borne, 5 in Family B, 1\n   (smart-meter comms) still not a real crossing at all. The denominator is NOT claimed\n   complete: this pass enumerated from the sketch table and the `WallResponse` importer\n   set, not from an exhaustive walk. Establishing that walk IS the census task.\n3. EP7-EP15 (`depends_on: ['EP6_wall_protocol_typing']`, 9 atoms, verified by grep) should\n   be read as plugging into `interface/contracts/wall_envelope.py`. The Family B pattern is\n   a transport-shape convenience for in-process logs; it is not a counterparty protocol,\n   and an EP7 Elexon adapter or an EP11 GoCardless adapter built to it would have no\n   representable answer for \"the webhook arrived four days later\" -- the exact physics\n   those atoms' own `name:` fields say they exist to reproduce.\n4. The SIMPLICITY GUARD in the origin note is now the strongest argument AGAINST a new\n   protocol layer: one already exists and is proven. EP6's honest shape is CONFORMANCE\n   (migrate crossings onto the envelope, refuse new ones outside it), not construction.\n\n==========================================================================================\nFINDING 2 -- LATENT, QUEUED NOT FIXED. The \"versioned message\" is UNVERSIONED ON THE WIRE\nin the live published artefact, and nothing can catch it, because the wall's only automated\nconformance control is IMPORT-shaped, not protocol-shaped.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_SHAPED_2026-\n08-13.md` (LATENT, lane W4_the_wall). Summary of the measurement, which is EP6's problem\nrather than W4_1's because EP6 is the atom that would inherit it:\n\nLive `docs/reports/run_output_latest.json`, entries parsed not sampled:\n\n    meter_read_log          1,600 entries   any schema_version: False\n    contact_centre_log        392 entries   any schema_version: False\n    acquisition_funnel_log      4 entries   any schema_version: False\n\n`to_log_entry(include_schema_version: bool = False)` defaults the version OFF so the round\ntrip stays byte-identity; all three live call sites (`simulation/run_phase4c_on_phase2b.py`\nlines 237 and 324, `simulation/run_phase2b.py` line 1647) take the default. The only three\noccurrences of `include_schema_version=True` in the repo are test assertions. The version\nfield exists on the object and has never crossed the seam.\n\nWorse than absent, and this is the R15 FAIL-OPEN part: `from_log_entry` reads\n`entry.get(\"schema_version\", SCHEMA_VERSION)` -- the module constant AT READ TIME. Today\nthat is harmless (one version, \"1.0\"). The first bump to \"2.0\" silently relabels every\narchived v1.0 entry as 2.0, because absence is indistinguishable from agreement. A version\nfield that cannot disagree is not a version field, and version negotiation is exactly what\nEP6 exists to provide. Family A avoids this by construction -- `schema_version: int` is\nrequired, so there is no absent case to default.\n\nWHY NOTHING FIRED. `tools/epistemic_wall.py` (read directly): `WALL_DIRS = ('company',\n'saas', 'sim', 'simulation')`, `SEAM_PACKAGE = 'company.interfaces'`. Both `tools` and\n`interface` are UNCLASSIFIED -- `tests/architecture/test_epistemic_wall_ratchet.py`\nasserts this deliberately (`assert not _under_seam(\"interface.contracts.wall_envelope\")`).\nThe ratchet polices IMPORT EDGES between the two sides. It is sound for that subject and\nsays so. But data crossing as a JSON list through an unclassified package is not an import\nedge, so the crossing below is invisible to every control in the repo:\n\n    producer   simulation/run_phase4c_on_phase2b.py  -> meter_read_log (1,600 rows)\n    consumers  company/billing/monthly_bill_assembly.py\n               company/compliance/population_sanity.py\n               saas/reporting/annual_report.py\n               saas/reporting/css_statement.py\n\nSame-step, unversioned, and -- as W4_1's own 2026-07-22 red-team already registered and\nthis pass re-confirmed on the live artefact -- carrying `true_consumption_kwh`, SIM ground\ntruth, in the published bytes. That last part is a KNOWN registered latent gap, not a new\nfinding; it is repeated here only because it is the same blind spot: the accessor is\nenforced, the wire is not, and no control looks at the wire.\n\nTHE CONSEQUENCE FOR THIS ATOM: EP6 cannot be exit-tested by \"the crossings are typed\" --\nthey already are, and the typing is silent on the wire. Recommendation, acted on by\nrecording it here for the draw that opens this atom: EP6's exit criterion is a CONFORMANCE\nCENSUS with a shrink-only allowlist, mirroring the ratchet's own proven shape -- every live\ncrossing either carries a `WallRequest`/`WallResponse` or appears in a dated, shrink-only\nlist of grandfathered same-step crossings, with the mutation proof being an injected\nsame-step crossing that must red the suite. That control is protocol-shaped, it is the\npattern this repo has already proven it can keep honest, and it makes \"a mock counterparty\nand a real one are indistinguishable to the company\" a testable claim rather than a hope.\n\n------------------------------------------------------------------------------------------\nPROCESS CORRECTION, recorded because `git show` of this atom's commit would otherwise\nmislead. This pass's commit 263dcf1b6 was made with a BARE `git commit -m` and no pathspec,\nso it swept the whole shared index: 99 files, 15,109 insertions, where this atom's own\nchange was 2 files. The 97 passengers were another lane's already-staged work, including\n`docs/design/maturity_map.yaml` -- so that commit's message line \"maturity_map.yaml\ndeliberately untouched\" is FALSE OF THE COMMIT, though true of this atom (I made no map\nedit; the shared index held someone else's). Inspected before deciding: the swept map hunks\nare `simplifications_count` bookkeeping bumps only, NO `level_current` move, and the map is\nstill modified in the working tree, so no half of an atomic write was stranded. NOT repaired\nby `reset --soft` + re-commit: the branch was unpushed so origin was safe, but three writers\nshare this tree and a concurrent commit inside that window turns a small mislabel into a\nreal loss. Disclosure was the cheaper correct move. The class is the already-known one\n(commit specific paths, never a bare commit on this tree) and the lapse was mine.\n"
