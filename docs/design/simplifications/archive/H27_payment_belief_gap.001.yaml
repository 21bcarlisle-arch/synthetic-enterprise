simplifications:
- '2026-07-18 REGISTERED as DISCOVER proposal (director D5 ruling). The gap is the score: company payment-belief vs world payment-truth. Binds W2_11 (source) and D5 (consumption) -- neither the world source reaches L3 nor the company consumption completes until this gap is measured.'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, no code, L0->L1). Designs the HARNESS third of the D5-decomposition coupled triad (W2_11 source + W4_4 seam + THIS gap + D5 consumption). REUSES existing infra: background/gap_metric.py (classification/detection/belief gap fns, the C10 self-rationing pattern) + background/coupled_triad.py -- the measurement is NOT new, only its application to the payment triad. BELIEF (company/D5, built from W4_4-seam OBSERVABLES ONLY -- bank statements, remittance advices, BACS/DD success-failure, never W2_11 internals): the company''s inferred payment state -- allocation of received cash (open-item remittance-else-oldest-first, disputed excluded), 30/60/90+ ageing, arrears/cash-position inference. TRUTH (world/W2_11): the actual behaviour generated -- who truly paid when, actual DD success/failure, true arrears age. GAP DIMENSIONS (each ALLOWED to be non-zero -- the company is allowed to be wrong, that is the point): (1) ALLOCATION gap -- did the company allocate a payment to the invoice/period it truly belonged to, vs the oldest-first Clayton''s-Case simplification D5 declared (a structural belief error real suppliers make); (2) AGEING gap -- bucket belief vs the debt''s true age (drifts when allocation is wrong); (3) ARREARS/cash-position gap -- inferred vs true; (4) DD-FAILURE DETECTION gap -- a failure observed late/never through the seam (the no-remittance/traditional-meter analogue of C10''s no-baseline blind spot) vs the true failure -- a detection+timing gap. R12/R13: the gap is a DIAGNOSTIC never a target; a near-zero gap is a RED FLAG (a leak or an erased blind spot), never banked. BINDING (COUPLED_TRIAD wall): W2_11 does not reach L3 until this gap is measured against D5''s consumption, and D5''s L3 completes only through this measurement -- reported per coupled pair each digest + Proof door. SCOPE NOTE (director set file_scope company/compliance, likely placeholder): belief-EXTRACTION is company-side (reads D5''s ledger inferences) but the gap SCORER is HARNESS (gap_metric + tools/tests) -- the BUILD should split so the scorer sees BOTH sides while the company never does (the wall). DEPENDS: W4_4 seam contract + W2_11 truth must exist before the gap is measurable; FRAME available now, BUILD gated. Level 0->1.'
- '2026-07-18 GAP SCORER BUILT + GAP MEASURED -- the coupled triad is CLOSED (level_current STAYS 0 per §0; L2 PROPOSED). tools/couple_w2_11_d5.py on origin (13 tests): generates W2_11 truth -> adapter -> observables -> D5 consumer -> belief, then scores belief-vs-truth via gap_metric. NON-TRIVIAL gaps proven (R12/R13, non-tuned): DETECTION gap 0.30 = the headline (78 of 257 true failures are non-DD and NEVER observed through the seam -- the no-remittance blind spot, leak-witness count 0 every seed); BELIEF gap 0.073 (TV distance, arrears/cash inference vs truth). R15 INDEPENDENCE proven: the consumer NEVER receives theta (runtime spy test asserts every observe() arg is a WallResponse) + 3 mutation checks (detection_gap hits 1.0 when belief blind, 0.0 when perfect). HONEST flags (fork, not hidden): allocation dimension DROPPED (misapplication_gap needs a small shared label space but invoice_ref is per-period-unique -- its effect surfaces in ageing instead); ageing gap ~0.90-1.05 borderline (worse-than-blind-guesser, a genuine non-tuned finding worth scrutiny before relying on it); 2 real bugs found+fixed pre-commit (seed threading collapsed per-customer RNG isolation -> zero failures; correlation_id collision hit consumer idempotency dedup -> dropped payments). LEDGER: written a bare-keyed HEADLINE entry (detection) so coupled_triad.gap_measured(W2_11)=True + ::detection/::belief/::ageing detail entries. FOLLOW-UP (surfaced, not blocking the measurement): the map W2_11<->D5 coupling is not cleanly derivable (_twin_id_for returns None; ledger twin label read D5_payment_observation_consumer not the atom id D5_account_hierarchy_payments) -- the couples_with/depends_on wiring needs fixing before the MECHANICAL world_l3_blocked gate can recognise the twin at an actual L3 cell-move. blocked_on coupled_triad_measured (its own build+measurement is done). file_scope tools/couple_w2_11_d5.py.'
- '2026-07-18 CORRECTION (supersedes the ''GAP MEASURED / coupled triad is CLOSED'' note above -- append-only, so that note stays as history but is WRONG as a current claim). The gap SCORER is built + proves non-trivial gaps (that stands), BUT I registered the gap in the shared coupled_gap_ledger.json BEFORE wiring the W2_11<->D5 coupling into coupled_triad.py''s authoritative table -- so the Proof door counted unmapped extras (11 vs 7 pairs) and WEDGED the publish gate (3 proof-gaps tests red). I REMOVED the premature ledger entries to unwedge; gap_measured(W2_11) is now False. So the triad is NOT closed: outstanding = wire the coupling (off-front, needs director authorization) + re-register the gap + bump the proof-gaps pair-count tests 7->8. The measurement is real+preserved; only its registration was premature. Level unchanged.'
- '2026-07-18 GENUINELY MEASURED + coupling WIRED (director console AUTHORIZED). Supersedes the premature-registration correction above: the W2_11<->D5 coupling is now in coupled_triad._AUTHORITATIVE_COUPLING (8th pair), the scorer writes ONE bare headline entry (twin=D5_account_hierarchy_payments; no ::suffixed proof-door pollution), gap_measured(W2_11)=True (detection 0.30), the Proof door shows 8 mapped pairs, and the full publish gate is green. The coupled triad is NOW genuinely closed. H27->L2 PROPOSED (its build+measurement is done; the director ratifies the cell per §0). Level_current stays 0 until he moves it.'
- '2026-08-08 L0->L2 SELF-CERTIFIED (worker tick; recorded in gate_authorizations.jsonl as LEVEL_UP_SELF_CERTIFIED, authorized_by=agent_self_certified). This cell had sat at 0 since 2026-07-18 with blocked_reason=coupled_triad_measured while the note above already claimed that block satisfied -- the STALE-CELL class: it was waiting on a director ratification that the 2026-08-03 PROPOSE-RECORD-ACT rip-out abolished, not on missing work. RE-VERIFIED against real disk state rather than re-stamped from the prose: 21/21 tests green in tests/tools/test_couple_w2_11_d5.py; file_scope git-TRACKED and clean (untracked-build class checked explicitly); coupled_triad.gap_measured(W2_11)=True against the LIVE coupled_gap_ledger -- and the entry is a PER-RUN one written in-run by run_phase2b (measured_at 2026-08-03T20:40:43Z, run_git_commit 2546a4a0), so the instrument is living, not a one-shot from build day. LIVE GAP (differs from the build-day figures above, which is the instrument working): headline DETECTION 0.5641 -- 22 of 39 true payment failures never surface through the W4_4 seam (the no-remittance blind spot) -- companion belief 0.2222, ageing 1.1538. R12: diagnostic, never a target. WHY NOT L3: two honest reasons, neither papered over. (1) HARDEN/Expert Hour has never run on this atom. (2) The AGEING dimension reads 1.1538 -- ABOVE 1.0, i.e. the company''s ageing belief is worse than the flag-nobody baseline the metric norms against. That is either a real and interesting company failure mode (oldest-first Clayton''s-Case allocation actively misdating debt) or a metric-shape defect in applying detection-style normalisation to a bucket-distance dimension. It is NOT known which, and a >1.0 gap is not evidence of fidelity until that is resolved. Queued as its own atom per SELF_INTERRUPT_DISCIPLINE (queue, don''t fix on sight) rather than tuned -- tuning it would be a straight R12 breach. LANE: the 2026-08-05 H-lane-cut ruling emigrates this atom to lane D (verification-of-X belongs to X). Recorded as pending_lane_move: D rather than half-renamed here -- the id is a machine key referenced by coupled_triad''s authoritative coupling table, the gate ledger, and three site/data/*.json derivations, so the rename is one coherent registry-backed job (minted), not a drive-by that would leave those out of sync.'
- '2026-08-08 HARDEN PASS RUN (first one on this atom -- it was reason (1) of the two the L0->L2 self-certification gave for not going to L3). Red-teamed the scorer for the three R15 killer patterns; found and fixed TWO fail-silent controls, each now mutation-proven to fire on its own named defect (24 tests green in tests/tools/test_couple_w2_11_d5.py, up from 21; the sibling tests/background/test_live_payment_triad.py stays green -- the additions are new stats keys only, no existing reading moved). (A) THE LEAK WITNESS WAS VACUOUS. `n_flagged_non_dd_failures == 0` -- the assertion that no non-DD case reaches belief through the DD-failure channel -- is satisfied just as happily when that channel observes NOTHING at all. Proven by mutation: with `recent_dd_failures` forced empty, `n_true_non_dd_failures > 0`, `n_flagged_non_dd_failures == 0` and `n_flagged_non_dd_via_reconciliation > 0` ALL still held, i.e. the whole leak test passed while the organ it claims to watch was dead. Fixed with a vacuity guard (`n_flagged_via_dd_channel > 0`) whose load-bearingness is itself pinned by test_leak_witness_is_vacuous_without_its_channel_guard. Same class as the 1557/1557-passed-while- the-field-was-absent population control. (B) THREE SILENT JOIN DROPS HAD NO WITNESS. Every belief-side observation is joined back to a truth case by a KEY (`value_date` -> due date, `invoice_ref` -> the harness ref, `AgedItem.reference` -> the same) and every join is a `.get()` whose miss SILENTLY DISCARDS the observation -- so a drift in either convention would push the measured gap toward the no-skill baseline with nothing firing at all. Empirically the keys line up today (dd 69/69, reconciliation 173/173; the ageing side matches 173/900 because a SETTLED invoice correctly leaves open-item ageing -- that partial miss is honest, which is exactly why a bare miss-count could not police it). Fixed with `n_unjoined_dd_failures`/`n_unjoined_collection_misses` (must be 0) and `n_ageing_refs_matched` (must be > 0), all three mutation-proven by test_join_witnesses_fire_on_a_key_convention_drift.'
- '2026-08-08 HARDEN FINDING, measured not asserted -- THE HEADLINE DETECTION GAP IS INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL. `flagged_set` is a UNION of two detection paths, so a channel only moves the number for detections it makes UNIQUELY. The DD channel makes NONE: `n_flagged_via_dd_channel_only == 0` at seeds 7/11/23 (400 customers: dd 93/86/110 flags, ALL of them also caught by reconciliation, which adds 136/141/134 more on its own). Consequence, verified by mutation: deleting the DD channel outright leaves the published gap BIT-IDENTICAL (0.15625 -> 0.15625). So the gap that sits in coupled_gap_ledger.json, on the Proof door, and on W2_11''s L3 binding is determined by expected-collection reconciliation ALONE. This is NOT a defect to tune away (R12) -- it is structurally correct: a rail failure necessarily means the cash did not arrive, so reconciliation sees the same shortfall, and the company genuinely does detect these. What it means is that set-membership detection cannot express the only thing the DD channel actually buys: EARLIER detection. RESIDUAL, named and NOT closed here: per-channel detection LATENCY is the measurement that would show it, but `detection_latency_days` covers the reconciliation path only, and DD latency cannot be honestly measured in this scenario because the adapter emits `value_date == due_date` with no ARUDD lag -- reporting "0 days" would be a scenario artefact, not a reading. The lag belongs upstream (W2_11 / payment_seam_adapter), not to this scorer, so it is registered here rather than faked. Pinned against silent rot by test_dd_channel_contributes_no_unique_detections_and_headline_is_insensitive, which FAILS if the channel ever starts contributing and forces the module''s `channel_contribution` note to be re-derived.'
- '2026-08-08 LEVEL STAYS AT 2 -- HARDEN done, L3 NOT taken, and the reason is not procedural. Of the two blockers the L0->L2 certification named, (1) "HARDEN has never run" is now discharged, but (2) the AGEING dimension reading 1.1538 (above the flag-nobody baseline) is still unresolved and still owned by D6_payment_ageing_gap_validity, which sits at level 0. To that the pass above ADDS a second, independent limit on the instrument: the headline dimension is single-channel-determined. L3 is a claim that this harness measures what it says it measures; asserting it in the same tick that proved one dimension insensitive to half its inputs and left another dimension''s validity undecided would be exactly the self-serving promotion R15 exists to prevent. The honest state is a HARDENED L2 whose two open validity questions are both registered and both drawable. No number was moved to make this reading nicer (R12).'
- '2026-08-09 D10 LANDED: THE RESIDUAL ABOVE IS CLOSED, AND ONE OF ITS CLAIMS WAS WRONG. The 2026-08-08 note recorded that DD latency "cannot be honestly measured in this scenario because the adapter emits `value_date == due_date` with no ARUDD lag". That is FALSE, and it was a misread of the WRONG FIELD, not a missing capability: `value_date` is the collection date, but `WallResponse.observed_at` -- carried verbatim onto `DDFailureObservation.observed_at` -- is the BANK-FEED REPORT date, and simulation/payment_seam_adapter.py already lags it by a per-case draw of 0..ARUDD_NOTIFICATION_LAG_DAYS (simulation/bacs_rails.py, a cited real Bacs constant). Measured DD lags are {0,1,2} days. The measurement was available all along; the residual was named against a field that was never the observation date. BUILT (atom D10_detection_headline_is_single_channel, L0->L2): a fourth dimension `detection_latency` -- days from an invoice''s due date to the company''s FIRST knowledge, whichever channel got there first, with the DD-channel-deleted COUNTERFACTUAL beside it. LIVE (400 customers, seeds 7/11/23): mean 2.30/2.41/2.04 days with the channel, exactly 5.00 without it -- the DD-observation channel buys 2.70/2.59/2.96 days of EARLIER detection while moving the set-membership detection gap by exactly zero, which is the finding stated as a number instead of a paragraph. NO NORMALISER, deliberately (D7''s mutation-caught trap applied before it could bite): an absolute mean in days, no class-balance denominator anywhere, undetected failures COUNTED beside the mean and never imputed into it at an invented cap. RETIRED, NOT RE-LABELLED: `stats[''detection_latency_days'']` was never a latency -- `ExpectedCollectionMiss.days_latency` is days-overdue at whatever single `as_of` the scorer asks at, so on this scenario''s fixed period grid it read exactly {30,51,72} days, a pure artefact of the question''s timing. It is now `reconciliation_days_overdue_at_as_of`, and its characterization test was REPLACED, not repaired. SECOND FINDING, OBSERVED CASE BY CASE AND NOT INFERRED (R9), which corrects a sentence published on every surface this instrument feeds: the detection residual is NOT "failures the company never observes -- the no-remittance blind spot". Asking the company''s OWN reconciliation organ at each invoice''s due+grace date shows n_undetected == 0 on seeds 7/11/23 -- every truly-failed case was flagged ON TIME. The misses the headline counts are detections the company later UN-MADE: a later period''s ambiguous non-DD payment carries no invoice reference, so AccountLedger''s oldest-first fallback allocates it onto the FAILED invoice, which goes quiet while a genuinely-paid later invoice takes its place in the open-item view (inspected directly -- seed 7 C000024 p0 prepayment failed, flagged at due+5, open item at as_of is p2). That is Clayton''s Case surfacing in the DETECTION dimension, not only the ageing one: atom D8_ambiguous_remittance_misdating. The blind spot is still REAL (a failed non-DD payment emits no rail event at all); it is simply not what this residual is made of. R12 CLEAN: not one published number moved -- the detection gap is byte-for-byte what it was, and what changed is the sentence describing what it counts. R15, FOUR mutations, each proven to fire on its own named defect and each restoring green: read `value_date` instead of `observed_at` (the degenerate all-zero DD distribution); define the latency population at `as_of` instead of ever-knew (re-imports the artefact -- measured, it moved the mean 1.96->1.80 for zero change in any detection date); fold DD-only cases into the counterfactual (mixes a population change into a timing change); and both channels dead (proves `n_undetected`, which reads 0 here, is not a vacuous witness). Plus two shape mutants of the metric itself -- divide by the truth count, impute the undetected at a cap -- each swinging where the real measure is flat. 31 tests green in tests/tools/test_couple_w2_11_d5.py (up from 24); 467 green across every file touching the triad or gap_metric; ruff unchanged at 18 for the touched files, measured against a pristine HEAD extract. L3 NOT claimed for D10 and H27 NOT promoted: no Expert-Hour pass ran this tick, and the tick that discovers a published sentence was wrong is not the tick to certify the instrument as real.'
- '2026-08-10 EXPERT HOUR #4 RAN; STILL HELD AT L2, AND THE FOURTH DEFECT IS IN A CLAIM RATHER THAN AN ARITHMETIC. The BELIEF dimension publishes its two sides as "same threshold shape, different-coverage inputs" -- the clause that makes the number a measure of the WALL and not of two different rules. It was never measured: the truth-side rule (`_severity_label`) is a HAND-COPY of the company organ''s own thresholds (`_arrears_risk_belief`) and no test in the repository mentioned it. Three plausible organ-ONLY drifts, world and truth-side rule untouched (n=1200, seed 7): one failure no longer raising WATCH moved the published headline 0.1424 -> 0.4146 (2.9x); hardship amplification 2 -> 1 took the over-call direction off zero; HIGH bar 3+ -> 4+ moved it 0.1424 -> 0.1551. Exactly ONE test fired each time and none named the divergence -- two gave an actively WRONG diagnosis (a weak permutation probe; an epistemic-wall leak), so a reader would have chased the wrong organ while the headline became a mixture of coverage loss and rule divergence, still published as coverage. CLOSED IN THIS TICK (atom D20) by equalising the coverage rather than comparing the rules -- an all-DD counterfactual on which the company observes every failure, so the surviving residual IS the divergence and needs no copy of either rule (the threshold-table test would have been the R15 tautology). Residual 0.000000 on seeds 7/11/23 with four vacuity witnesses asserted, because the healthy reading here is a ZERO; class control sweeps the PUBLISHED TEXT and its own first draft was vacuous (swept the formatter, where the phrase does not appear) -- caught by its own vacuity guard, recorded not quietly fixed. The two leads D19 handed over were checked and neither is the defect: the structurally-zero error directions are a property of this BOOK, honestly declared and mutation-proven able to fire, and the unattributed belief directions are D8''s question. WHY STILL L2: four consecutive Hours, four defects, none predicted by the previous Hour and the arrival rate is not falling; two of the four were in claims ABOUT the instrument, which is precisely the part of L3 ("it measures what it says it measures") that keeps failing. This is also again the tick that CHANGED the instrument. The promotion criterion the next Hour should state in advance: TWO CONSECUTIVE CLEAN HOURS, decided before the draw rather than by whichever tick happens to take it. Named next start point: the `ageing` dimension is the only one of the four never given an Hour of its own, and its owner-atom D6_payment_ageing_gap_validity has sat at level 0 since the original L0->L2 certification named it blocker (2). Evidence: docs/staging/WORKER_FINDING_THE_BELIEF_TRUTH_RULE_IS_AN_UNMEASURED_MIRROR_2026-08-10.md; 8 new tests, 195 green across every coupled-pair suite.'
- '2026-08-10 EXPERT HOUR #5 RAN (recorded LATE, 2026-08-10, by Hour #6 -- the Hour landed as atom D21, its commit 15125f388 and its staged finding, and appended itself to the map''s `expert_hour.findings`, but not to THIS register. That is the SECOND consecutive Hour whose own log entry had to be written by its successor: Hour #5 caught the identical omission in the map register and recorded it, then made it here. The lesson is not ''remember both'' -- two append-only registers with no mechanism tying them together will keep diverging.) THE FINDING: THE AGEING DIMENSION''S TRUTH SIDE WAS THE COMPANY ORGAN''S OWN FUNCTION -- not a hand-copy like D20 but the literal import (`from company.billing.arrears_engine import age_bucket`), applied to a days-overdue the scenario constructs to be the organ''s own integer (world `issue = due - 14`; organ `due = issue_date + 14`). Same rule, same argument, so the dimension whose whole subject is debt DATING could not see a company dating error: `wrong_bucket` measured 0 at every seed and under every drift tried, BY CONSTRUCTION, and an edit to `age_bucket` moved the harness''s ground truth with it -- R15''s TAUTOLOGY pattern in the direction nobody checks (harness -> company). It hid under a COVERAGE_ONLY_CLAIM_CONTRACT exemption reading ''two different rules, not one rule over two coverages'' while the module''s own docstring four hundred lines up said ''Both sides use the IDENTICAL bucket function'' -- the control believed the exemption, so D20''s control was switched off for the dimension with the strongest mirror of the three. CLOSED AT THE CLASS (R10): TRUTH_SIDE_RULE_OWNERSHIP, a register that is the CALL PATH not a declaration, refusing any truth-side labelling rule owned by `company.*`; the harness''s own `_ageing_bucket` pinned against the organ''s across 126 day values; ageing enrolled in the coverage-only control (residual 0.000000 at HEAD on seeds 7/11/23 non-vacuous; an organ-only 60->75 dating drift takes it to 0.3627/0.3194/0.3333). R15 both ways, and the mutation that reinstates the defect moves NO published number -- which is why the control is about ownership rather than a value. Atom D21, level 0->2. Evidence: docs/staging/WORKER_FINDING_THE_AGEING_TRUTH_SIDE_IS_THE_ORGANS_OWN_RULE_2026-08-10.md.'
- '2026-08-10 EXPERT HOUR #6 RAN; STILL HELD AT L2, AND THE SIXTH DEFECT IS THE THIRD SIGHTING OF ONE CLASS. Hour #5 handed over two leads, both about the ageing dimension''s POPULATION rather than its rules; this Hour took the second and it is the defect. THE FINDING, measured not asserted: THE AGEING ORDINAL HEADLINE COUNTS ONE DIRECTION. `mean_bucket_displacement` -- the number published as `GapResult.gap`, the term that exists so this dimension can ''distinguish off-by-one from stone-blind, which an error rate cannot'' -- is a mean over the TRULY-OVERDUE population, so no amount of OVER-ageing can move it. A company that dates every truly-overdue invoice perfectly and dumps its ENTIRE truly-current book into `90+` scores 0.000000, bit-identical to a company that dates every invoice right (n=4000, seeds 7/11/23: 10,758 cases changed and the headline identical to machine precision); so does one that over-ages every current invoice by exactly ONE bucket. The direction is not invisible to the DIMENSION -- `overstated_arrears_rate` counts it -- but it is invisible to the ORDINAL term, which is the whole of what this dimension adds over a rate. In that direction the measure degrades to the error rate it was built to replace, and the distinction between a 30-60 and a 90+ wrongful ageing (different collections paths in a real supplier) is unavailable. WHY THIS IS THE SWEEP''S DEFECT AND NOT THE INSTANCE''S: this is the class DETECTION_DIRECTION_CONTRACT already states -- a one-directional score cannot distinguish a precise company from an indiscriminate one -- which D11/D12/D14/D15 fixed in four detection dimensions and which D19 then found had ESCAPED into `belief`, because that register is KEYED TO DETECTION SCORERS. It escaped again, the same way, into the one dimension that is neither a detection scorer nor a rate. Three sightings, one keying. CLOSED AT THE CLASS (R10) by HEADLINE_DIRECTION_COVERAGE, the sweep with the keying removed: its keyset is DERIVED from the dimensions `score_triad` actually publishes (a published dimension with no entry RAISES; so does a registered dimension nobody publishes), and per entry it scores that dimension''s own INDISCRIMINATE DEGENERATE -- the strategy that is perfect in the direction the headline counts and maximally wrong in the other -- through the dimension''s OWN shipped scorer. Measured perfect -> degenerate: detection 0.0 -> 0.5, belief 0.0 -> 0.5, belief_population_mix 0.0 -> ~0.96, ageing 0.0 -> 0.0. DIFFERENTIAL ON PURPOSE (a register where every entry lands on one side is a blanket ban wearing a register''s clothes), with a THIRD state that is checked rather than trusted: `detection_latency` is honestly truth-conditioned -- its population is cases the company DID detect, so an indiscriminate flagger''s extra flags never enter it and no belief-side degenerate exists -- so its entry NAMES the sibling that counts the direction it cannot, and the control asserts both that the sibling really does distinguish AND that no truly-current case reached the latency population. Ageing may NOT claim that cover, and the reason is already measured: D16 established that detection''s false_flag_rate is a DIFFERENT quantity over a different population from this dimension''s overstatement, so nothing in this instrument sees over-ageing SEVERITY. R15 BOTH WAYS on the register (a false both-directions claim; a debt entry that has been fixed and rotted; a one-directional entry naming neither owner nor cover; a cover claim whose sibling is itself one-directional; a cover naming a dimension that does not exist; a declared strategy nobody wrote) plus a VACUITY GUARD on the probe itself -- an inert degenerate hands a silent pass to every debt entry, which is the fail-silent shape D19''s probe_bit was built for one register over. STAMPED AT SOURCE so it reaches the other caller (tools/d6_ageing_metric_oracle.py) and not only the pair whose Hour found it: `gap_metric.ageing_gap` now publishes the mirrored `mean_overstatement_displacement` / `max_overstatement_displacement` / `n_overaged_beyond_one_bucket` and an `ordinal_direction_caveat` with its witnesses interpolated from the measurement, and `format_ageing_summary` prints the mirrored term, so the headline cannot be published bare (the D7 anti-decay mechanism). R12: NO published number moved -- the headline, both rates and the mean displacement are byte-identical before and after; only witnesses were added. THE RESHAPE (a headline covering both directions) moves a published number on every pair calling `ageing_gap` and is therefore atom D22, minted here and NOT built here (SELF_INTERRUPT_DISCIPLINE). LEAD 1 WAS ALSO CHECKED AND NOT TAKEN, recorded because a register listing only the leads that paid off is not an honest one: the truly-overdue side reaching 2 of 4 buckets on a three-age book is real, is already pinned by test_the_ageing_headline_is_entirely_miss_driven_here, and turns out to be the SAME weakness from the other side -- of the 4-bucket ordinal vocabulary the headline is published in, one side of the book exercises two buckets and the other contributes nothing at all. Widening the scenario''s age spread moves published numbers on every dimension, so it stays registered. ALSO CAUGHT IN THIS TICK, and it is the SECOND consecutive Hour to catch it: the Hour #5 entry was missing from THIS register (Hour #5 caught the same omission in the map''s `expert_hour.findings` and recorded it late; its own entry here was then left behind). Written late above, marked as late. AND the map''s per-atom byte budget went RED on the attempt to record this Hour faithfully -- H27 at 12,685 B against the 12,288 B cap -- which is atom H41''s class recurring in the field its own exit criterion (2) anticipates: `expert_hour.findings` is the map''s next unbounded narrative flow after the two H41 named. The map entry is therefore a POINTER to this record; nothing was laundered, but the flow is still running. WHY STILL L2: Hour #4 set the release criterion in advance as TWO CONSECUTIVE CLEAN HOURS. Six Hours, six defects, none predicted by the previous one, and this is again the tick that changed the instrument. The count is still zero. THE CRITERION FOR HOUR #7, stated in advance so the next tick does not get to choose it: two consecutive clean Hours, and the FIRST place to look is the one dimension no Hour has yet taken on its own terms -- `detection_latency`, whose entry in the new register is the only one whose honesty rests on a division of labour with a sibling rather than on its own arithmetic. Evidence: docs/staging/WORKER_FINDING_THE_AGEING_ORDINAL_HEADLINE_COUNTS_ONE_DIRECTION_2026-08-10.md; 13 new tests in tests/tools/test_couple_w2_11_d5.py; 516 green across every suite touching gap_metric and the coupled pairs; 94 green in tests/design + tests/controls.'
