simplifications:
- 'THIRTIETH HOUR, LANDING ADDENDUM (2026-08-14, worker tick, same H27 2->3 HARDEN draw, a later tick of it). Hour #30''s repair had NOT reached the artefact it was about. The record above says the collision ''reached the public door and stayed'', and closes with the three colliding writers renamed and the grader wired -- all true, and all of it about FUTURE writes. Measured this tick on the live bytes: `site/data/proof.json` row `W2_9_segment_debt_tnc` still carried `components[''normalisation''] = ''majority-class prevalence''` beside `basis UNDECLARED`, exactly as the Hour found it, because a ledger entry is a STORED record and renaming its producer does not rewrite it. The published door was unchanged by the Hour that was about the published door. THE OBJECTION THAT BLOCKED THE DRAIN WAS FALSE FOR THIS PAIR, and measuring it cost one command. Hour #30 deferred all 13 undeclared entries on the ground that ''repairing them means re-measuring each pair with a declaring writer, which moves published numbers'' (R12/R13). `tools/couple_w2_9_c11.py` states in its own header that both its streams are seeded from stable hashes with no wall-clock and no global RNG, so it was re-run WITHOUT `--write-ledger` first and the output compared to the published row: gap 0.2290836653386454, error_rate 0.0230, n 500000, n_wrong 11500, wrongly_applied 8200, wrongly_withheld 3300, g0 0.1004 -- every figure identical to sixteen significant figures. Only THEN was the ledger written. A leaf-by-leaf diff of the row either side shows what actually moved: `components.normalisation` -> `components.normaliser`, and the entry gaining `normalisation: divisor` and `raw_gap_is`, plus `measured_at`/`run_git_commit`. No number moved, because for a deterministic pair a re-measure with a declaring writer is a RENAME, not a re-measurement -- the risk the deferral was priced against does not exist here. It may still exist for the other 12; each is now a one-command question rather than an assumed blocker. THE FIX REACHED THE DOOR, verified by regenerating rather than by reasoning (R11): `coupled_gaps.basis_finding_count` 14 -> 12 on the regenerated `site/data/proof.json`, the `component_key_shadows_entry_field` finding gone from the panel entirely, and the `undeclared_normalisation` finding for this pair gone with it -- the row that had rendered two opposite readings of one word now renders one. `audit_ledger_normalisation` over the live ledger returns [] for `W2_9_segment_debt_tnc`, down from two findings. WHAT ELSE THE REGENERATION EXPOSED, and it is not this Hour''s: `proof.json` was four days stale against the ledger the live runs write, so publishing it also carried this atom''s OWN pair (pairs[5], W2_11<->D5) from 0.083391 to 0.031128 -- the live per-run value measured at 21:34Z by the run at 5975a4e26, already on disk before this tick started, not produced by it. Its population moved further than its value: universe 1600 -> 276, TRUE DD failures 31 -> 4. The headline is `mean(missed_failure_rate, false_flag_rate)` with missed = 0/4, so one missed failure would now quintuple it, against a fifth of its value in the older population -- a 25x change in one-event sensitivity between two publishes, rendered with the same `measured`/blue chip. QUEUED, not fixed (SELF-INTERRUPT DISCIPLINE): `docs/staging/WORKER_FINDING_THE_PAIRS_HEADLINE_IS_MEASURED_ON_FOUR_EVENTS_2026-08-14.md`, whose recommendation is to publish the one-event sensitivity beside the value -- it is derivable from components the entry already carries, and invents no threshold. THE LESSON, and it is a rate not an incident: Hour #29 found a mechanism asserting a refusal nothing had exercised; Hour #30 found a grader with no caller; this addendum found a repair that never reached its artefact. Three consecutive Hours on this instrument, three different ways for work to be complete in the tree and absent where it was supposed to act. THE 2->3 IS STILL NOT TAKEN: Hour #4''s two-consecutive-clean criterion stays at zero -- this tick found a defect in the previous Hour''s own repair, which is the third consecutive Hour to do so.'
