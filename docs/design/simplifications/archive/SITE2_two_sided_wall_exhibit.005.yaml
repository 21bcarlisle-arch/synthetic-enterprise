- '2026-08-14 HARDEN (worker tick): the exhibit stops being blank on one side. coldwalk:site2_behind_the_wall_view_is_empty_on_two_of_six_tabs CLOSED.

  MEASURED BEFORE BUILT, and the walk had undercounted. Driving this page''s own harness (_wall_harness.mjs) against HEAD''s index.html, the "Behind the wall" view rendered ZERO panels on THREE sub-views -- consumption, billing:bills AND billing:statement. The walk recorded "two of six tabs"; it had not enumerated the statement sub-view. That is why the control added here is a SWEEP over every rendered sub-view rather than a check of the two tabs that were named: a control written to the finding''s own count would have been born blind to a third of its subject.

  WHY SECTION (1) COULD NOT CATCH THIS. The existing structural guard asks whether a rendered block DECLARED a side. A tab rendering one lonely customer panel satisfies it perfectly -- and that was exactly the defect. Completeness of the OTHER side is a property the declaration guard is structurally blind to, so this is a new control, not a tightened one.

  THE REPAIR, and the siding judgement inside it. Three panels, every figure already in the per-customer JSON (no new data plumbing, per this atom''s own constraint): consumptionCompanyPanel (estimated-read count and share of billed volume, catch-up corrections and net re-bill, amount WRITTEN OFF under back-billing rules, cap-applied count, cost to serve); consumptionSimPanel (the per-year wholesale result over the volume actually billed -- net GBP/MWh under the meter); billingCompanyPanel (the same supply on the supplier''s clock -- exactly the "settled-vs-billed on one bill" the finding named, every row stating its clock per R14). The siding was the part that could have gone wrong: per-year gross/net IS "wholesale trading margin", a NAMED SIM-only figure already sided sim on the Accounts tab, so the unit-margin table is a SIM panel -- under a company panel it would have breached this atom''s own exit (3). Conversely per-invoice read type is printed on a real UK bill, so it stays customer-observable; the company panel carries its CONSEQUENCE (the back-billing write-off), which appears on no bill.

  R15, PROVEN ON THE REAL DEFECT AND NOT ONLY ON MUTANTS. Run against `git show HEAD:site/customers/index.html`, all three named checks FIRE: blank-behind on [billing:bills, billing:statement, consumption], the empty-column placeholder, and the missing read-exposure figures. Plus three in-file mutations -- drop the consumption far side, drop the billing far side (mutated INDEPENDENTLY so neither panel can carry the other''s proof), and blank a panel''s content while keeping its declared side. That last one is the fail-open probe: a side-declaring but EMPTY panel passes both the declaration guard and the blank sweep, and only the content check kills it -- so the content check is proven to be what does the work.

  ANTI-VACUITY: test_the_control_sees_every_sub_view pins the driven population BY NAME (including billing:statement, the one the walk missed) and fails if it shrinks, so the sweep cannot go green by the harness quietly rendering fewer tabs.

  GREEN: test_wall_exhibit.py 56 passed (47 pre-existing + 9 new); site/customers/ + tests/tools/test_billing_and_payments_ledger.py 72 passed; tests/tools bill-correctness + nav/brand consumers 81 passed. EXIT (7) D36 INTACT: tools/verify_printed_bill_render.mjs PASS -- 1600 rendered usage lines, 1600 with a printed rate, 0 arithmetic failures.

  CARRIED, NOT ABSORBED: tests/architecture/test_static_quality_ratchet.py ruff census is RED (I001 +1, F811 +1, E402 +1) from ANOTHER lane''s uncommitted files -- tools/generate_customer_data.py, tools/couple_cohort.py, tests/tools/test_generate_customer_data.py. This tick''s own file is clean on all three codes (ruff --select I001,F811,E402 on it: "All checks passed"). The ratchet lints the WORKING TREE, not the commit, which is why this lands via tools.surgical_land.

  STILL OPEN on this atom, unchanged by this tick: churned-account-in-the-present-tense and dual-fuel-elec-only-money (both real SITE2 render defects); the winter-peak finding is a sim-lane fidelity item this atom cannot discharge. Level stays 2.'
