simplifications:
- 'SIXTEENTH HOUR (2026-08-11), on Hour #15''s leads 1 AND 2, which need one number between them -- WHAT PRECISION IS THE READER ACTUALLY GIVEN? THE READER''S PRECISION WAS ONE FIGURE''S, DECLARED AS EVERY FIGURE''S. Hour #15 had installed that number one Hour earlier (`PUBLISHED_GAP_DECIMALS = 4`, "the precision every consumer renders these gaps at", with an independence re-read so that "a consumer that starts publishing 6dp fails the control instead of leaving the epsilon stale"), and it was neither. (1) IT COULD NOT FAIL ON THE CHANGE IT WAS BUILT FOR: the re-read collected EVERY `.Nf` in the anchored function and asked only whether 4 was among them -- and `format_belief_summary` renders three other RATES at `.4f` and the mean steps at `.2f`, so it already returned {2, 4}, a set and not a precision. Mutated live on a copy of the tree, moving the BELIEF GAP''s own render to `.6f` leaves {2, 4, 6} and the shipped check STILL PASSES. A membership test over every number in a function is not a check on the one number the figure is. (2) IT WAS THE BELIEF READER''S PRECISION ON ALL FIVE FIGURES: the keyset was two hand-typed consumer sites, both BELIEF, while five dimensions are published. Read off the shipped renderers by AST -- `detection` and both belief figures 4dp, `ageing` 3dp (`format_ageing_summary` publishes `balanced_bucket_displacement` and never renders `.gap` at all) and `detection_latency` 2dp (a `.2f` render reached through a local alias) -- so the one constant was TEN times too fine for one published figure and a HUNDRED times too fine for another, and `_own_floor_clause` was publishing "at the 4dp every consumer renders these gaps at" to the reader of both belief numbers. Lead 2''s own extension would have measured the ageing and latency floors at 10x and 100x their readers'' steps, UNDERSTATING those figures'' blindness -- the same direction as the defect Hour #15 had just closed, inside the clause written to close it. LEAD 1 ANSWERED, AND IT BOUNDS D33: re-derived at each dimension''s OWN reader precision on the dense book-derived grids (n=300, seeds 7/11/23, terms knob and recon knob), every declared band, edge and collapse run in DIMENSION_DRIFT_RESOLUTION and ORGAN_QUERY_GRID reproduces EXACTLY -- the bit-equality divergence D33 owns is confined to the belief cells, which is why the declared numbers are right today by a property of this book while the control certifying them was reading somebody else''s epsilon. CLOSED AT THE CLASS (R10) by PUBLISHED_GAP_CONSUMERS -- per dimension, keyset DERIVED from `published_dimensions` BOTH WAYS (a published figure with no entry RAISES, the fallback IS the defect; an entry for a figure nobody publishes RAISES); `measure_published_reading_precision` reading the number off THE FORMAT SPEC THAT RENDERS THAT DIMENSION''S GAP, through one level of local alias, through the COMPONENT where the gap reaches the reader as one, and through a Subscript key so one shared renderer (the live writer''s `measure_and_write`) cannot lend a sibling''s precision to this figure (the D32 wrong-subject rule at the render site); the component carrier CHECKED NUMERICALLY against a real scoring (delta 4.1e-7, inside that figure''s own 5e-4 step) rather than believed by name; RAISES on an absent consumer file, an absent renderer or a gap with no fixed-point render (the pre-Hour version returned an empty tuple for a missing file and its caller read that as agreement); `published_reading_epsilon()` REFUSING a caller that names no figure, on the `_own_floor_clause` precedent; and the floor and the caveat sentence both taking the precision per figure. R15 both ways on ELEVEN mutations: the gap render moved off its declared precision (the pre-Hour defect on `belief`, and both figures the constant was wrong about), one gap rendered at TWO precisions, the consumer file absent (fail-silent), the renderer renamed away, a gap with no fixed-point render (fail-open), a published dimension dropped (raises), an entry for a figure nobody publishes (raises), a component carrier that is not the gap, a component carrier nothing checked, a bare epsilon call, and a VACUITY guard pinning the 2-4dp spread itself. R12: NO published number moved -- all five figures bit-identical. The RESHAPE is atom D34_the_resolution_floor_covers_two_of_five_figures, minted at L0: `measure_published_resolution_floor` has only ever been asked of the belief pair, and stating floors for the other three moves published caveat text on three dimensions. FULL TEXT: docs/staging/WORKER_FINDING_THE_READERS_PRECISION_WAS_ONE_FIGURES_DECLARED_AS_EVERY_FIGURES_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6/#7 recorded, still ATOM H41''s class. HELD AT L2: sixteen Hours, sixteen defects, and this one was found INSIDE the control the previous Hour built.'
