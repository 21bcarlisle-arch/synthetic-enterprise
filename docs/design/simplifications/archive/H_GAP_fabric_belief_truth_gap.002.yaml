atom_id: H_GAP_fabric_belief_truth_gap
chunk: 2
simplifications:
- '2026-08-10 THE DRAIN THIS ATOM BUILT WAS EXCLUDING THE ONE ITEM A SINGLE COMMAND WOULD CLOSE, and the level still does not move (worker tick, L2->L3 draw). RUNG 4b''s work list rested on REFRESHABLE_STATUSES, whose comment swept never_measured and never_landed into one sentence -- ''no re-run clears a row that does not exist''. That is TRUE of never_measured (a pair the map declares with no row and no producer to point at) and FALSE of never_landed (a tool that exists on disk, in the discovered family, and if invocable is one command away from landing its row). tools/couple_cohort.py sat in the drift set as a permanent member for two days -- surfaced by this atom''s own reconcile on 2026-08-09, reported as the orphan-transition class, and then structurally unactionable -- while `python3 -m tools.couple_cohort` ran clean in seconds. The exclusion was not protecting the ladder from a wedge; it was hiding the only entry that could never drain, which is the ratchet-with-no-drain shape this atom has cited twice (feedback_a_ratchet_with_no_drain_is_a_cleanup_not_a_control). SIXTH TIME THIS ATOM FOUND SOMETHING BY RUNNING A THING RATHER THAN READING IT. THE WEDGE GUARD SURVIVES AS A NARROWER RULE, not as a status ban: a never_landed tool with NO invocable runner stays off the work list, because there the ITEM IS THE TOOL and no command could ever land its row. That deliberately REVERSES the fail-closed listing used for ROWS, and the asymmetry has a stated reason -- a stale ROW hides a live public figure behind its absence, a dead TOOL hides nothing; either way it stays reported in the DRIFT set, only the WORK list differs. THE FIX BROKE A FIXTURE AND THE FIXTURE WAS RIGHT: tests/background/test_rest_ladder_isolation.py pins the reconciler''s LEDGER_PATH at an absent file, and RUNG 4b immediately produced ELEVEN work items. Root cause is one rung deeper and is a FAIL-OPEN of the pre-existing kind -- load_ledger() returns {} for a file that is absent or malformed, and every verdict downstream was then graded as though the ledger legitimately held no rows: every declared pair never_measured, every couple_* tool never_landed. Those were not eleven orphaned tools, they were ONE unread file, and the blanket never_landed exclusion had been the only thing masking it. Added ledger_is_readable() and a single `ledger_unreadable` verdict that short-circuits the reconcile: an unavailable check is a FAILED check (R15), and it is not refreshable, because no gap-tool re-run repairs a file that cannot be read. The distinction is file EXISTENCE, never row count -- an empty-but-present ledger is a real state and reads clean (test_a_READABLE_ledger_never_reports_unreadable_so_the_branch_can_pass). AND ONE TEST WAS VACUOUS, found the same way: test_every_live_ledger_row_gets_a_verdict_from_the_known_set called reconcile() under that same conftest pin, so it graded an empty dict and had asserted nothing about any real row since the pin landed. It now reads the real ledger path explicitly and carries a vacuity guard that fails if there are no live rows (feedback_population_control_needs_a_vacuity_guard). R15 BOTH WAYS, four SOURCE mutations with byte-clean restore (md5 verified after each, adfe1497), each firing its OWN named test with the rest green: (1) re-exclude never_landed => the CAN_BE_RUN test fires; (2) drop the _TOOL_ITEM_STATUSES guard => the CANNOT_BE_RUN test fires; (3) ledger_is_readable always True => the unreadable test AND three rest-ladder isolation tests fire; (4) always False => the readable-direction test fires, so the branch is not a control that can only fail. 28 reconciler tests green, 97 green across the five affected files. THE DRAIN WAS THEN RUN AND THE DRIFT SET REACHED ZERO FOR THE FIRST TIME: 14 of 14 rows CURRENT, ''no refreshable rows''. tools/couple_cohort.py landed W2_2_population_draw -> C_cohort_discovery at gap 1.0344827586206897 (worst cell price_sensitivity::tenure=social_rent, n=434), closing the orphan-transition instance this atom reported on 2026-08-09. ONE NUMBER MOVED AND IS REPORTED RATHER THAN REPUBLISHED: W2_11_payment_behaviour_source 0.0859375 -> 0.0130940, and the move is NOT attributed to the code change -- the POPULATION moved with it, universe_size 1557 -> 12000, truth_size 31 -> 1215. That row was written in-run by run_phase2b and the refresh command is the tool''s BASE invocation, so the re-run did not re-take the measurement, it took a different one. AND IT SELF-HEALED IN SIX MINUTES, which is the part worth keeping: a live run_phase2b re-wrote the row at 13:28:30 (the tool wrote 13:22:40) back to 0.0859375 over its own 1557-case population, stamped at HEAD, and the committed ledger carries the IN-RUN figure, not the tool''s -- the in-run writer owns that row and simply reclaimed it. The exposure is therefore NOT uniform across the family: for a row with a live in-run writer the wrong-population window is minutes and nobody was going to see it; for a row produced only by an on-demand couple_* tool there is no reclaim at all, and whatever the drain wrote is what the public door carries. The reconcile grades WHO measured, is blind to WHAT IT WAS MEASURED OVER, and treats both cases with identical confidence. Filed as its own finding rather than absorbed here: docs/staging/WORKER_FINDING_THE_REFRESH_COMMAND_CAN_CHANGE_THE_POPULATION_2026-08-10.md. Second finding queued, not fixed on sight (SELF_INTERRUPT_DISCIPLINE): the cohort headline is worst-of-20 over a cell set in which 12 cells are pinned at exactly 1.0 by construction (three axes have no discovery mechanism, so the honest belief IS g0), so the published gap can never read below the no-skill baseline and is blind to every improvement on the two axes the company can actually learn -- docs/staging/WORKER_FINDING_A_WORST_CELL_HEADLINE_FLOORED_AT_THE_NO_SKILL_BASELINE_2026-08-10.md. STILL L2, and the residual is unchanged in reason. (a) L1.4 MAGNITUDE needs per-day half-hourly readings the LCL extract does not carry (SERL or the trial raw archive; no network in autonomous runs). (b) L1.2h heating-shape repeatability has no published statistic and is vacuous at population scale. (c) L2.4 scale spread is RED and is a GENERATOR question owned by W1_12 -- and RED is this control working, not this atom failing. (e) Expert Hour not_attempted, and it is now the ONLY residual in this atom''s own hands: (a) is blocked on data, (b) on a published statistic, (c) on another atom. Five consecutive ticks have written ''(e) not_attempted'' and moved on, which is the consumed-not-absorbed pattern R17 names -- it is the next draw for this atom and should not be a sixth. An exit test is not renegotiated to fit what got done. PUBLISHING CONSEQUENCE, caught by the pre-commit gate and not by me: landing the W2_2 row added a PAIR to the public Proof door, and tests/tools/test_generate_proof_coupled_gaps.py pins the count. That pin is a control working exactly as intended -- a new row on a public surface should not be able to land silently -- so the counts were updated with the reason, never the assertion weakened. site/data/proof.json now renders pair_count 14, worse_than_blind 2, with W2_2_population_draw at 1.0344827586206897 chip=worse_than_blind severity=RED. That red is the metric reading its own worst cell correctly and it is PUBLISHED rather than hidden, with the shape objection filed beside it.'
