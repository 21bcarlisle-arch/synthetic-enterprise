- '2026-08-11 FIFTH EXPERT HOUR (worker tick, L2->L3 draw) -- IT FOUND SOMETHING, SO THE LEVEL STAYS 2. Directed question set verbatim by the fourth Hour: `panel_mirror_normaliser_drift` and the MONEY half of `_favours`. THE DRIFT TERM IS REFUTED as a defect (it recovers the no-skill baseline by division rather than reading `GapResult.g0`, and matches the direct value to six decimals on both published populations). THE MONEY HALF IS THE FOURTH HOUR''S OWN DEFECT, which that Hour filed as probably-something-else because "its decisiveness DOES improve with N" -- improving with N is the failure read from the wrong end. Over 120 random subpanels of the drawn population the aggregate 5%-of-the-larger band on two GBP SUMS named an arm on 75/87/98/100% at n=25/50/100/150 while the paired per-premise evidence resolved 13/59/100/100%: 62% of 25-home panels published a verdict the homes could not support. Signature DECISIVENESS DECOUPLED FROM N (accuracy''s was FLAT IN N -- same root, opposite sign). THE AUTHORED PANEL IS IN THAT REGIME: n=15, aggregate margin 57.7% of the larger, 80.6% of it ONE HOUSE, paired interval [+GBP 3, +GBP 4,736] against a point of +1,692, and dropping any one of the four differing premises makes it unresolvable while the aggregate rule survives every single-premise deletion. SECOND FINDING, inside the controls: every cell of the mirror''s 2x2 was pinned on a money verdict that was ONE HOUSE, and the FLIP cell was unreachable under a verdict with an error bar until a 400-panel search found exactly one. MECHANISED: `_premise_forgone` (one definition; `money_consequence` aggregates it), `_paired_money_verdict` (bootstrap CI on a named C-S2 substream, tie count, `largest_premise_share`, old rule''s answer kept), APPLIED TO ALL FOUR MONEY VERDICTS (R10 class -- the three flip caveats are comparisons between them), one shared `_bootstrap_mean_ci`, three disclosures (MONEY VERDICT UNRESOLVED, MONEY VERDICT CARRIED BY ONE HOME, MIRROR VERDICT UNRESOLVED), `ONE_HOUSE_SHARE = 0.50` as a THIRD constant with populations either side (80.6%/22.5%). R15 NINE source mutations each firing their own named test, md5 byte-clean restore -- one INITIALLY SURVIVED because every fixture in the file had the two rules AGREEING on the mirrored panel: A CONTROL SET WITH NO POPULATION WHERE THE CONTROLLED THING VARIES IS A CONTROL THAT CANNOT FAIL. No figure moved (0.4269/0.4042 re-taken; drawn money verdict stays ''inferred'', now earned at +GBP 485/premise CI [+196,+883], 184/200 ties). R10 CLASSES: a verdict on an EXTENSIVE quantity cannot be banded as a share of its own total; an interval is not a concentration measure; a control set needs a population where the controlled thing varies. NOT CLOSED: `MIRROR_FIDELITY_BAND` serves two subjects (the kW/K gate AND the normaliser-drift disclosure) -- named, not repaired, and the next Hour''s opener; the `weight_null` money totals are still published with no interval. THIS ENTRY IS DELIBERATELY A SUMMARY: full text docs/staging/WORKER_FINDING_THE_MONEY_VERDICT_WAS_A_SUM_AND_A_SUM_HAS_NO_ERROR_BAR_2026-08-11.md.'
