- "2026-08-21 pass 56 LAND, level HELD at 2, loop_stage stays build. PASS 55 WROTE ITSELF DOWN AS THE LANDING AND DID NOT COMMIT EITHER, WHICH MAKES SIX PASSES RUNNING -- AND ITS FIGURES, RE-MEASURED AT A NEW HEAD BY A SEAT THAT WAS NOT THERE, ARE IDENTICAL. The tick drew EP6 and found the same six files dirty against HEAD (three production, three test, 578 insertions / 39 deletions), the store rolled to archive chunk 039 with the roll uncommitted, the map count already moved to 51, and TWO finished rows -- pass 54's and pass 55's -- both describing a tree no commit held. This pass is the commit. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD c43439739, one publish-provenance commit later than the HEAD pass 55 measured (72d628afd) and touching a single site data file, nothing in this atom's file_scope.\n\n\n  WHAT THIS PASS RE-MEASURED, AND WHY THESE AND NOT THE MUTATION BATTERY. Pass 55 was itself the landing-tick verifier of pass 54 and added no production byte, so re-running M1/M2/M3 would check pass 54's code against pass 54's claim a second time and say nothing about the only thing that has changed since: the HEAD underneath. What CAN move under a new HEAD is every instrument that reads the whole tree, so those are what this pass ran, and all four reproduce to the digit. The three file_scope test files: 72 passed -- the same number pass 55 reports as its unmutated null. `tools.wall_crossing_dispositions`: OK, 6 live crossings (4 direct, 2 indirect via a bridge package), 91 ruled (cut 85, owed 6, grandfathered 0), so the landing still creates no wall crossing and rules none away. `tools.epistemic_verifier --all`: PASS on 544 files. The store pair tests/design/test_simplifications_store.py + test_atom_notes_store.py: 60 passed.\n\n\n  THE ROLL LANDS WHOLE OR NOT AT ALL. Pass 55's append crossed ROLL_WATERMARK, so the live file and `archive/EP6_wall_protocol_typing.039.yaml` are one atomic write, and the count invariant reading them is TREE-WIDE -- half a roll refuses every lane's commit, not only this atom's. This row rolls the store again where the watermark demands it; every chunk moves in the same pathspec as the live file, and the map's `simplifications_count` moves in the same commit. The map edit landing here is pass 54's and pass 55's as well as mine: the file_scope widened by the four files pass 54 wrote in, and the count 49 -> 52.\n\n\n  WHAT DID NOT CHANGE. No production line in this commit is this pass's: the six files are pass 54's, unmodified by pass 55 and unmodified by me, and the only bytes pass 55 and pass 56 add between them are two rows and a count. No published figure moved and none was recomputed. THE LEVEL DOES NOT MOVE and is not re-litigated: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.\n\n\n  WHAT REMAINS, inherited unchanged and not re-opinionated. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first. (b) The venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations` -- so `settlement_solicited` stays a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers. (c) Q3's BRANCHING conversation, left by passes 44, 47 and 53. (d) The census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, filed by passes 48 and 50 and still filed.\n\n\n  THE LESSON, now measured twice rather than argued once. Pass 55's case for writing a row that lands no capability was that a landing-tick check whose only recorded outcome is FIRED cannot be told from one that always fires, and it supplied the first empty run. This is the second, at a different HEAD and from outside the build. The cost side is visible in the same place: six rows of prose have now been written about a body of work that took one commit to land, and the discipline only earns that cost while the commit follows in the SAME tick as the row. It did here."
- "2026-08-21 pass 57 BUILD, level HELD at 2, loop_stage stays build. THE WORLD COULD STILL DISPATCH A UNIT NOBODY HAD ENROLLED; ONLY THE HARNESS OBJECTED. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 7f94bae95, with all five touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing.\n\n  WHICH ITEM, AND WHY IT WAS ALREADY CHOSEN FOR ME. Passes 54, 55 and 56 each closed with the same four-item remaining list and the same sentence about its second item: \"the venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations`, so `settlement_solicited` stays a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers.\" Three passes named it and none took it, which is exactly the shape a deferred item takes on the way to becoming permanent. `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- with five payable rows and an explicit instruction not to record `infeasible_here`, so the payable half was taken again.\n\n  THE DEFECT, STATED AS THE DIFFERENCE BETWEEN A REPORT AND A RULE. Pass 54 gave the L2 loop a first leg and scored `settlement_solicited`: the unit read off the DECODED settlement lines against the unit the venue said it registered. Two quantities from two sides, and it is a real check -- but it is an OBSERVATION made after the fact by the one layer allowed to see both sides, and the world went on being able to produce the statement being observed. Nothing in `sim/**` consulted `VenueRegistrations` before putting a line on the wire, so `unit_id` remained a KEYWORD DEFAULT and a unit that had never enrolled was still settleable; the only thing standing between this loop and a payment nobody had asked for was a harness that remembered to look. A gap the harness can only report is not a law the world obeys, and the next loop written -- L1 and L3 both, today -- simply would not look.\n\n  WHAT LANDED, AND THE FOUR DECISIONS INSIDE IT THAT COST SOMETHING. (1) CONTAINMENT, NOT OVERLAP. `VenueRegistrations.covers` asks whether a declared availability window CONTAINS the delivery window, where the pre-existing `overlapping` asks whether two registrations collide. They are different questions and the class now holds both: overlap is right for \"may I register this?\" and wrong for \"may I call this?\", because an instruction that starts inside availability and runs past its end calls the unit over minutes it never offered. The mutation collapsing one into the other is run below and is the plausible mistake rather than an invented one. (2) THE BOOK IS A REQUIRED KEYWORD on both wire legs, not a defaulted one. A `registrations=None` that skips the check is this project's own fail-open pattern -- the control passes for every caller who forgot the argument -- so the legs refuse to be called without it and a test asserts the TypeError. (3) THE CHECK READS WHAT WAS EMITTED, not what was passed in: `unit_id`, `venue` and both window bounds come off the constructed payload, so an emitter that ignored its own `unit_id` argument is caught by the same check that catches a stranger. (4) AN EMPTY BOOK REFUSES. `covers` returns None for a venue that has registered nobody, and None is a refusal; the fail-open case has its own test because that is where this class of control usually dies.\n\n  THE OWNERSHIP MOVE THAT MADE IT POSSIBLE, and it is the part with a portability argument rather than a defect behind it. The venue's `VenueRegistrations` was minted INSIDE `_FlexEnrolmentDesk`, a company module, and died with the seam object -- so the counterparty's state was born on the wrong side of the wall and nothing else in the world could consult it. It is now injectable (`build_sim_interface(flex_registrations=...)`), and the HARNESS -- the one layer that holds the world -- constructs it, hands it to the seam as counterparty state, and hands the SAME instance to the venue's dispatch legs. What the venue registered and what the venue will honour became one fact instead of two that happened to agree. Nothing on the company's surface changed: `test_the_seam_publishes_no_door_onto_the_VENUES_OWN_book` is untouched and green, and `flex_registrations=None` keeps the old behaviour for every caller with no world to speak of.\n\n  A CONTROL REDDING ON ITS OWN SUCCESS CASE, MET AGAIN AND FLIPPED RATHER THAN DELETED. `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_scores_UNSOLICITED` asserted the harness SCORED a stranger's settlement unsolicited. With the world refusing, the stranger's lines never reach the wire to be scored, so the test reds -- this project's recorded class, and the correct move is the one pass 53's addendum used: its useful half was never \"the score is False\" but \"a unit nobody enrolled must not be settled\", and asserting the REFUSAL is strictly stronger than asserting the score. It is flipped. The observation is NOT thereby made unfalsifiable, which would be the quiet cost: a second test mutates the DECODER instead of the emitter (a mis-keyed feed, or the same statement read for the wrong party -- downstream of the law, which fires at emission) and `settlement_solicited` still scores False.\n\n  LANDED: `UnregisteredDispatch` in `sim/flex_dispatch.py`\n\n  LANDED: `covers` in `sim/flex_dispatch.py`\n\n  LANDED: `_require_registered` in `sim/flex_dispatch.py`\n\n  LANDED: `SolicitedRegistration` in `background/flex_dispatch_triad.py`\n\n  LANDED: `test_MUTATION_a_unit_this_venue_NEVER_REGISTERED_cannot_be_settled_at_all` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_an_EMPTY_book_refuses_rather_than_passing__the_fail_open_case` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_call_running_PAST_the_declared_availability_is_refused` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_registration_at_ANOTHER_VENUE_does_not_license_this_one` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_the_book_is_REQUIRED_and_not_a_defaulted_argument` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_is_now_REFUSED` in `tests/background/test_flex_dispatch_triad.py`\n\n  LANDED: `test_the_company_holds_the_SAME_reference_the_world_will_honour` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's five files copied in and only the named part swapped -- never on the shared worktree, which carried 200 other-lane modifications throughout. The unmutated tree is the null control: 62 passed, and it was re-run between mutations rather than assumed. M1, `covers` returns a reference unconditionally (the book is never consulted): 6 failed, 56 passed -- all four refusal tests plus the triad's flipped refusal and the same-book test, which is the correct blast radius for removing the consult itself. M2, containment collapsed to `overlapping`: 1 failed, 61 passed, redding exactly the boundary test. M3, `venue` dropped from the book's key so a Capacity Market registration licenses a Balancing Mechanism call: 1 failed, 61 passed, redding exactly its named test. M4, the fail-open shape -- `registrations` given a `None` default and the loop skipped when absent: 1 failed, 61 passed, redding exactly the required-keyword test. A NOTE ON M2, because the first version of it proved nothing and the correction is the lesson: the fixture originally shortened the registration by a WHOLE period, which leaves the last delivery window butt-jointed to the registration -- and overlap refuses a butt joint too, so the mutation passed. It is cut by HALF a period, which is the only shape where overlap and containment actually disagree. Every null control is stated with its test: the exactly-covering book accepts; the forged-venue book licenses the venue it was really made at; the same book returns None for a unit it never registered.\n\n  NO PUBLISHED FIGURE MOVED, measured rather than reasoned. HEAD's `measure_l2` was run in the detached worktree and this tree's beside it over three settings (no delivery model; a stochastic delivery model; a stochastic model with a biased baseline), with the SAME injected synthetic record on both sides -- injected deliberately, because a comparison across two data caches is this atom's own recorded two-trees artefact. All 15 reported keys per setting, 45 across the three, are identical; NO key was lost and NO key was added. Transport is not a belief and neither is a refusal that never fires.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.epistemic_verifier --all` PASS on 544 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-56, so this pass creates no wall crossing and rules none away. `tools.company_network_isolation` exits 0 on its four frozen routes and its R15 battery, with the two epistemic-wall ratchets, is 44 passed with the allowlist unwidened -- the harness-to-world edge added here opens no route. `tools.wall_channel_census` reads IDENTICALLY at HEAD and on this tree on every channel this pass could touch; the two places the readings differ are both another lane's and are named rather than glossed: channel D/F move because `docs/reports/run_output_latest.json` is uncommitted in the shared tree (which is also what takes the census exit code to 1), and the `paid down on C_envelope (1)` line is present at a CLEAN HEAD too, so it was neither opened nor cleared here.\n\n  EVIDENCE: tests/sim/test_flex_dispatch.py 38 passed (32 at HEAD); tests/background/test_flex_dispatch_triad.py 24 passed (22 at HEAD); 219 passed across the downstream consumers (tests/interface, tests/company/interfaces/test_sim_interface.py, tests/company/test_flex_participation.py, tests/sim/test_flex_dispatch_stacked.py); the four mutations above with the figures given; ruff clean on all five changed files.\n\n  WHAT DID NOT CHANGE. `emit_dispatch_instructions_over_wire` is belted and still has NO production caller -- it is a leg with a control and no traffic, stated the same way pass 53 stated `FlexEnrolmentBook`, not counted as traffic. The in-process `emit_dispatch_instructions` / `emit_settlement_lines` are deliberately UNBELTED: they are constructors, they are what this module's own truth tests measure, and belting them would put the check on the object path as well as the wire without adding a refusal the wire does not already make.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-56 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first, and until they do the STACKED wire emitters cannot be belted -- belting them without a registration leg would refuse every stacked run, which is why they are not belted here. That is now the next item, and it is the same item as (a): one repair, not two. (b) Q3's BRANCHING conversation, left by passes 44, 47 and 53. (c) The census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, filed by passes 48 and 50 and still filed. The target decision recommended at passes 38-56 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
