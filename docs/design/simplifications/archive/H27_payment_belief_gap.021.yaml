simplifications:
- 'TWENTY-SIXTH HOUR (2026-08-13, worker tick, H27 2->3 HARDEN draw). THE NUMBER THAT ANSWERS THIS DRAW IS NOT A COUNT OF EXAMINATIONS OF THIS ATOM. Every Hour closes ''the level stays 2 for the Nth consecutive Hour'', and N is the sentence a promoter reads. MEASURED AT HEAD from the map''s own file_scope and the labels the code carries -- two independent readers, the map side and the committed bytes -- this atom''s Hours have landed in EIGHT distinct code files and this atom declares TWO of them. The other six are each declared by a DIFFERENT cell, and none of those cells was ever told: `background/gap_metric.py` (Hour #6; named by D6, D7, D11, D15, D16, D19, D22), `site/proof/index.html` and `site/proof/test_coupled_gaps_panel.py` (Hour #18; D9), `tests/architecture/test_epistemic_wall_indirect_ratchet.py` (Hour #5; KNIFE3), and this module and its test (Hours #22 and #25; AO11). Of the 24 recorded Hours, 18 left a mark in a file this cell declares -- and that 18 is an UPPER BOUND, because a string check cannot tell a landing from a later Hour''s citation of it. The useful direction is the complement: SIX RECORDED HOURS LEFT NO TRACE IN ANY FILE THIS ATOM DECLARES, and no reading of the label rescues them. WHY THAT IS A DEFECT AND NOT BOOKKEEPING: `file_scope` is the field every provenance control in this repo reads as ''what this cell is about''. `build_rows`/`_classify` date the assertion from it, and `supervisor._file_scope_sha` decides from it whether the harden cooldown re-offers the atom. So an Hour that lands outside its own cell''s scope is invisible twice -- this atom''s clocks cannot see work done under its name, and the cell that DOES declare the file has its assertion silently staled by an Hour it has no record of. AO11 had its module rewritten three times this way and read STALE with nobody claiming the move. WHAT LANDED (atom D43, `tools/map_assertion_provenance.py`, the same derived population as D41 and D42): `hour_subject_findings` -- HOUR_OFF_SCOPE where a committed Hour label sits outside every cell its qualifier could name, with a HOUR_BUILT_FOREIGN_SCOPE clause naming the cell that does own the path; and `hours_on_subject(atom)`, the count a promoter should read beside the ordinal. Own CLI flags and own exit code 4, deliberately outside the shared refusal list on D42''s precedent: off-subject work is often the RIGHT work -- a defect found here may genuinely live there -- so this reports, and what is not optional is that somebody knows. THE SUBJECT IS HEAD, NOT THE WORKING TREE, and the two checks hand off cleanly: while this Hour was uncommitted D42''s `--unlanded` named it in both files and D43 was silent; after the commit that reverses. THIS HOUR IS ITSELF AN INSTANCE AND IS NOT EXEMPTED -- it landed in AO11''s scope, so the check names its own Hour #26 beside #22 and #25, and AO11''s register carries the notification by hand this once (whether the check should WRITE that rather than report it is QUEUED, not built). THREE DEFECTS IN THIS CHECK''S OWN FIRST LIVE RUN, all fixed and all pinned. (1) WRONG SUBJECT FROM ORDINARY PROSE: the label convention''s regex takes whatever word precedes ''Expert Hour'', so ''...landed AFTER Expert Hour #18'' and ''the CELL Expert Hour #15 built'' parsed as atom qualifiers and invented seven findings against cells that have never existed. A qualifier now counts only if it names a map cell -- DERIVED FROM THE MAP, never a stopword list -- and the vacuity floor counts only what survives that filter, so a convention drifting off atom ids FAILS the check rather than passing it empty. (2) WRONG POPULATION IN THE ATTRIBUTION HALF: `file_scope` mixes granularities and ~20 cells scope bare `tools`/`background`/`tests`, so a prefix-aware owner rule reported every one of them as the wronged party -- a finding with twenty owners has none. The asymmetry is now explicit and load-bearing: COVERAGE (is this Hour on its own cell''s subject?) is prefix-aware because a directory scope really does put the file under that cell''s clocks; ATTRIBUTION (who else owns this file?) is exact-match only, because this module already has a word for what a directory claim does to ownership -- DIRECTORY_SCOPE, ''unarbitrable''. (3) The ambiguous-qualifier rule was certified on the alphabetical luck of today''s map. R15: TEN source mutations, each firing a NAMED test, md5 byte-clean restore (be6ac8d673b5058630d03f6ee5f3b5ab before and after), every restore a `cp` and never `git checkout --`. FAIL-OPEN (findings always empty), FAIL-SILENT (no label parsing reads clean), FAIL-OPEN ON MISSING (an empty map side), COVERAGE COLLAPSED TO EXACT MATCH, A DIRECTORY CLAIM NAMING THE OWNER, A PROSE QUALIFIER ACCEPTED, AMBIGUITY RESOLVED TO THE FIRST CELL, `hours_on_subject` counting every ordinal, `hours_on_subject` reporting zero for a cell that does not exist, the working-tree side folded in, and the CLI''s own exit code collapsed to 0. TWO SURVIVED THE FIRST PASS AND ARE RECORDED RATHER THAN QUIETLY PATCHED, and both are the same shape -- a test that passed for a reason other than the one it names. (a) Deleting the empty-map-side guard left 77 green, because with no scopes no qualifier resolves to a cell, every label is dropped, and the LABEL floor raises instead; the test matched the word VACUITY, so it was asserting that SOMETHING refused, not that this guard did. It now matches the map-side message. (b) Resolving an ambiguous qualifier to `owners[0]` left 77 green, because `_candidates` sorts and the live pair happens to put the DECLARING cell first (`H27_payment_belief_gap` < `H27_phone_act_channel`) -- a control certified on today''s alphabetical luck is testing the map, not the rule. It now runs both orders. NOT ALWAYS-RED: 77 pass unmutated (59 at Hour #25). R12: NO published number moved and no scorer was touched -- this Hour changed no instrument; the atom''s own file and `background/gap_metric.py` are byte-identical. ruff clean on both changed files. AND A WARNING THIS HOUR OWES THE NEXT TICK, because a precedent landed on this same day that could be misapplied to this atom: `H_GAP_fabric_belief_truth_gap` closed L2->L3 after fifteen draws under the class ''an exit criterion can outlive the box''s ability to meet it'', with its residual named UNPAYABLE-HERE. H27 IS NOT THAT CASE AND MUST NOT BE CLOSED ON THAT PRECEDENT. H_GAP''s blocked bands need a metered per-day half-hourly panel this box cannot fetch -- no BUILD draw closes them. H27''s remaining questions (D35''s scoped build, D39, D40, and the vacuous-in-isolation sibling control Hour #21 queued) are ALL payable by a BUILD draw on this machine; nobody has taken them for six Hours. The two atoms share the symptom -- real work every draw, a level that never moves -- and not the cause, and closing on a shared symptom is the reasoning R4 exists to stop. THE LEVEL STAYS 2 FOR THE TWENTY-SIXTH CONSECUTIVE HOUR, and the honest reason is narrower than most: this Hour did not touch the instrument, so nothing it did makes the five published figures better or worse. What it establishes is that the sentence which has answered this draw twenty-five times counts draws, not examinations, and that six of them examined nothing this cell declares. That is a reason to distrust the promotion evidence, not the numbers. Hour #4''s two-consecutive-clean-Hours criterion is at zero. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): (a) whether an off-subject Hour should WRITE its notification into the owning cell''s register rather than only report it -- the hand-written AO11 entry this tick is one instance, not a mechanism; (b) D43 reads only work that SELF-LABELS, which D42 already registered as its own open limit and which this check inherits; (c) H27''s declared file_scope has never been reconciled with where its Hours actually work, and widening it is a `docs/design/maturity_map.yaml` edit, deliberately not taken for a fourth Hour running because that file still carries other lanes'' hunks in the shared index; (d) D39 and D40, untouched for a sixth Hour; (e) D37-D43 exist only in this register''s prose and in no map cell, a fifth Hour running.'
