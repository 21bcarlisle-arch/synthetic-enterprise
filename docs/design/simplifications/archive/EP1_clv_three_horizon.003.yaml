- "2026-08-15 REPAIR (worker tick, RUNG 1c BLOCKING-FINDING draw on lane B_commercial), NOT an\nEP1 build: level stays 0, loop_stage stays idle, file_scope untouched, `maturity_map.yaml`\nedited for the `simplifications_count` scalar ONLY (2 -> 3). What was drawn is the discharge\nof this atom's own blocking finding, and the module repaired\n(`company/core/three_horizon_clv.py`) is not in EP1's file scope -- it is the artefact the\nfinding named. Measured at HEAD 75fd42288.\n\nDISCHARGED: `docs/staging/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\nnow carries a structured `**Discharged:**` field that `background.finding_severity.parse_discharge`\nRELEASES (checked this tick, and `false_discharges()` is empty). `blocking_by_lane` over the\nstaging root now returns NO blocking finding on any lane, B_commercial included.\n\nCONDITION 1 TAKEN, the one this record recommended: the term is priced rather than the module\ndemoted to a documented perpetuity. `_term_value_gbp` is now the single valuation both horizons\ncall -- sum over t=1..T of margin * retention^t / (1+d)^t, closed form\nmargin * retention * (1 - r^T) / (1 + d - retention) with r = retention/(1+d). That is the old\nexpression times (1 - r^T), so the perpetuity survives as its T -> infinity limit instead of as\nthe answer for every T. The dead `denom <= 0` branch is gone as a branch: the unit-retention case\n(retention == 1 + d) is now the algebraically correct degenerate value margin x T, reached by a\ntest rather than by a fallback.\n\nRE-RUN OF THE FINDING'S OWN TABLES (margin 100, churn 0.20, discount 0.08; ceiling = margin x term):\n  H1  1-day   years= 0.0027  clv=  0.2347  ceiling=   0.2738\n  H1  1-year  years= 0.9993  clv= 74.0306  ceiling=  99.9316\n  H1  2-year  years= 1.9986  clv=128.8793  ceiling= 199.8631\n  H1  5-year  years= 4.9993  clv=221.9831  ceiling= 499.9316\n  H1  30-year years=29.9986  clv=285.6791  ceiling=2999.8631   (was 285.7143 for all five)\n  H3  rem=0.00 clv=0.0000 - rem=0.50 clv=39.8106 - rem=1.00 clv=74.0741 - rem=10.00 clv=271.5043\nThe finding's two accounts (1 day vs 9 years of term, same margin and churn) now differ by three\norders of magnitude on both horizons where they were identical.\n\nONE THING THE FINDING DID NOT NAME AND THE REPAIR HAD TO FIX. Pricing the term makes\n`h3_signal` unsound in a new way: a part-term H3 forecast scored against a whole-term H1 value\nwould read every account as deteriorating merely because time had passed -- mechanical decay\ndressed as a signal, which is the defect class this project files against derived headlines.\nThe signal now scores H3 against `H1Commitment.clv_over_years_gbp` over the SAME remaining\nwindow, so an unchanged belief reads on_track at any point in the term and a worsened one still\nreaches at_risk. Both directions are tested.\n\nR15, BOTH WAYS, this tick. The two tautological assertions and the two negative-churn coverage\ntests are gone; value assertions now compare against a period-by-period loop (`discounted_sum`\nin the test module), never against the closed form the module evaluates -- independence, killer\npattern 1. With `git show HEAD:` restoring the pre-repair module, 12 of the 47 controls FAIL,\nincluding `test_h1_clv_rises_strictly_with_the_term`,\n`test_h1_clv_never_exceeds_what_the_term_can_deliver`,\n`test_h3_clv_rises_strictly_with_remaining_term`, `test_h3_clv_of_an_expired_contract_is_zero`\nand `test_an_expiring_contract_is_not_worth_the_same_as_a_ten_year_one`, each failing on the\nterm-blindness itself rather than on a new method being absent. On the repair, 47 pass.\n\nNO PUBLISHED FIGURE MOVED, re-confirmed rather than carried forward: zero non-test importers of\n`company/core/three_horizon_clv.py` at HEAD. This was repaired BEFORE EP1 wires it, which is\nthe cheap end of the finding's own argument.\n\nSTILL OWED, unchanged by this pass and deliberately not swept in with it: the name collision\n(item 3 of the 2026-08-13 list) -- this module still answers commitment-vs-actual-vs-reforecast\nwhile the atom's triple is contract-term/tenure/cohort, and `company/finance/portfolio_dashboard.py:11`\nstill propagates it; and the CLV belief-vs-truth gap (item 4 / COUPLED_TRIAD), still measured\nnowhere with `couples_with: []`. What item 2 of that list called REPAIR-THEN-WIRE for the\ncontract-term leg is now REPAIRED and still unwired: the wiring is EP1 BUILD and stays gated."
- "2026-08-17 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing wired, `maturity_map.yaml` edited for the\n`simplifications_count` scalar ONLY (3 -> 4). Measured at HEAD 4276a179b against the\npublished `docs/reports/run_output_latest.json`, `docs/reports/ANNUAL_REPORT.md` and the LIVE\n`https://poesys.net/data/company.json`. Everything below is `observed-with-evidence` unless\nlabelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE THREE BEFORE IT DID NOT: it MEASURED THE GAP. Item 4 of the\n2026-08-13 \"WHAT FOLLOWS\" list -- the belief-vs-realised CLV gap that is this atom's stated\nexit criterion -- has been recorded as \"still measured nowhere\" by every prior pass. The\n2026-08-13 note argued it was assemblable from artefacts that already exist. It is, and it now\nhas been. That assembly is a READ, not a build: no estimator was written, nothing was wired,\nand `couples_with` stays `[]` because wiring it into the coupled gap ledger is BUILD.\n\nMETHOD, so it can be re-run (`/tmp` scratch only, nothing added to the tree):\n  * BELIEF: `clv_snapshots[Y][account]` from the run output. Point-in-Time verified by reading\n    `_build_clv_snapshots` rather than trusting its docstring -- records AND renewals truncated\n    at `Y-12-31`, `build_cost_to_serve` rebuilt on the truncated window, ceased accounts\n    excluded from the truncated window itself. These are genuine ex-ante estimates.\n  * REALISED: `years[y][\"per_customer\"][leg][\"net_gbp\"]` summed over both fuel legs of the\n    billing account for y > Y, discounted at the same DISCOUNT_RATE_ANNUAL = 0.10, PV struck at\n    the snapshot.\n  * UNCENSORED SUBSET: the five accounts that ceased inside the run (C1 2021-12-29, C3\n    2020-06-29, C4 2024-09-28, C5 2020-12-29, C6 2024-03-29). For these the whole post-snapshot\n    life is observed, so the comparison is complete rather than a lower bound. Every surviving\n    account's realised figure is censored at the 2025-06-07 run edge and is reported separately.\n\nTHE RAW GAP, uncensored subset, first snapshot per account:\n    acct  ceased      snap  belief GBP  realised GBP   ratio\n    C1    2021-12-29  2016     3004.63        786.66   0.262\n    C5    2020-12-29  2016    11967.53       -288.93  -0.024\n    C3    2020-06-29  2017     5277.81        350.35   0.066\n    C4    2024-09-28  2017     6420.17      -1834.56  -0.286\n    C6    2024-03-29  2017    22292.15       1964.76   0.088\nEvery one of the five delivered less than 27% of the value believed of it, two delivered\nNEGATIVE value against a large positive belief, and the ratio falls as the cessation\napproaches rather than rising (C1: 0.262 -> 0.228 -> 0.209 -> 0.143 -> 0.066 -> 0.000 across\nits 2016..2021 snapshots). C1's 2021 snapshot values it at 1849.22 two days before it stops\nsettling; C5's 2020 snapshot at 7141.31, one day before. That last pair is NOT a defect -- the\n35-day supply-continuity grace is why, and a real supplier learns of a loss with a lag. It is\nthe gap doing its job.\n\nTHE DECOMPOSITION, and it is the finding of this pass (`inferred` where marked). The raw ratio\nis dominated by a MARGIN BASIS defect, not by a belief error. `build_clv`'s margin input is\n`cost_to_serve[\"by_customer\"][cid][\"net_margin_gbp\"] = margin_gbp - cost_to_serve`, and\n`margin_gbp` is revenue minus WHOLESALE ONLY; the realised side above is the run's own\n`net_gbp`, after policy levies, network charges, capital charges and bad debt. Restating each\nbelief onto the realised basis by that account's own lifetime `(net - cts)/(gross - cts)`\nfactor (`inferred`: a linear rescale of a linear model, using a hindsight factor -- a\ndecomposition of the gap, never a proposed estimator):\n    acct  factor   raw ratio   matched ratio (first snap -> last)\n    C1     0.260       0.262   1.008 -> 0.000\n    C3     0.118       0.066   0.564 -> 0.287\n    C6     0.120       0.088   0.737 -> 0.239   (1.366/1.621/1.617 in 2018/2019/2020)\n    C5    -0.098      -0.024   0.246 -> 0.000\n    C4    -2.518      -0.286   0.113 -> 0.501\nOn a matched basis C1's 2016 belief was right to within 0.8%, and C6's mid-life beliefs\nUNDERstated what it delivered. So the honest reading is: this company's churn/lifetime belief\nis roughly the right order of magnitude, and its valuation is 4-10x too high because of what\nit counts as margin. C4 and C5 have negative net-of-cost margin against positive\ngross-of-cost margin, which makes their restated belief a negative number and their matched\nratio an object that should not be read as an accuracy score -- said plainly rather than\ndressed up.\n\nCONSEQUENCE FOR THIS ATOM'S EXIT CRITERION, which is why this belongs in the record and not\nonly in a finding: a CLV gap instrument that reports one number per account will score the\nESTIMATOR for an INPUT defect. Whatever EP1 builds must decompose the gap into (i) margin\nbasis, (ii) lifetime/churn belief, (iii) realised surprise, or its first reading will say \"the\ncompany's CLV model is 15x wrong\" when the model's belief was within 1% and its margin feed\nwas 4x. That is a NEW design constraint on the atom, discovered by measuring rather than by\ndesigning, and it is what item 4 of the 2026-08-13 list could not have known.\n\nTWO FINDINGS FILED, both BLOCKING, both lane B_commercial, neither fixed this tick\n(SELF_INTERRUPT_DISCIPLINE queues by default, and both repairs are BUILD code inside this\nBUILD-gated atom's own subject matter, which LANE 3 may not write):\n  (a) `WORKER_FINDING_THE_BOOK_IS_VALUED_ON_A_MARGIN_THAT_EXCLUDES_THREE_QUARTERS_OF_THE_COST_STACK_2026-08-17.md`\n      -- the basis defect above, at portfolio scale and on the live surface. `gross - net =\n      4,890,769.21` reconciles TO THE PENNY against the run's own cost lines (policy\n      3,404,188.65 + network 869,332.79 + gas policy 171,108.84 + gas network 393,759.19 +\n      capital 51,554.84 + bad debt 824.90, residual 0.00) and is 75.969% of gross margin, none\n      of which reaches the valuation. The live `enterprise_value_gbp` is 6,304,202.92 (fetched\n      2026-08-17T10:54:43Z, git 0a3b39ee9) and its published `enterprise_value_basis` says\n      \"Derived from the settled-clock net margin above\" -- a parentage that is FALSE: its\n      parent totals 6,414,533.34, 4.15x the stated one. Sharpest instance: C7 is published at\n      `clv_gbp 7771.10` while the same run's P&L gives it +117.83 net across ten years and\n      -401.30 after its own cost-to-serve. Restated on the run's own net-of-cts margin with\n      every lifetime and annuity held exactly as published, the eight named accounts total\n      1,138,265.43 against 6,298,818.09 -- 18.1% (`inferred`, a counterfactual).\n  (b) `WORKER_FINDING_THE_FINAL_YEAR_CLV_SNAPSHOT_IS_EMPTY_AND_THE_REPORT_PUBLISHES_IT_AS_A_THREE_MILLION_FALL_2026-08-17.md`\n      -- `_build_clv_snapshots` passes `as_of = \"{year}-12-31\"` to `ceased_billing_accounts`\n      while the run's observation edge is 2025-06-07 and the continuity grace is 35 days, so\n      every account reads as ceased and `clv_snapshots[\"2025\"] == {}`. `_section_clv_evolution`\n      then ranks that empty year against full ones and publishes \"Largest YoY fall: 2025\n      (GBP -3,255,946)\" and \"Earliest/lowest: 2025 (GBP 0)\" in ANNUAL_REPORT.md:1791-1795.\n      Structural, not data-thin: any run ending >35 days before 31 December does this.\n\nRE-VERIFIED, not carried forward. The 2026-08-13 ceased-account repair holds in the SNAPSHOT\npath too, which no prior pass checked: C3 is absent from the 2020 snapshot onward, C5 from\n2021, C1 from 2022, C4 and C6 from 2024 -- each first missing from the snapshot after its own\ncessation, and each still informing the churn prior. The per-account belief following the\nper-account belief (the 14876d687 repair) also holds: `fit_theta_posterior_per_account` is on\nthe live path and the eight valued accounts carry eight distinct `expected_lifetime_periods`\n(10.107 .. 11.099).\n\nSTILL OWED, unchanged by this pass. The NAME COLLISION (item 3 of the 2026-08-13 list) is\nuntouched for the fourth pass running: `company/core/three_horizon_clv` answers\ncommitment-vs-actual-vs-reforecast while this atom's triple is contract-term/tenure/cohort,\nand `company/finance/portfolio_dashboard.py:11` still propagates it. `couples_with: []`, and\nno CLV pair in `docs/observability/coupled_gap_ledger.json` -- the gap is now MEASURED but not\nINSTRUMENTED, and the distinction is exactly the \"consumed vs absorbed\" one R17 names. What\nitem 2 called REPAIR + WIRE + BUILD ONE now reads: the contract-term leg is repaired and\nunwired, the tenure leg is live and valued on the wrong margin line, the cohort leg is built\nand unwired, and the gap has a measurement method with no mechanism behind it."
