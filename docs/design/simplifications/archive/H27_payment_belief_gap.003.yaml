- '2026-08-10 EXPERT HOUR #8 RAN; STILL HELD AT L2, AND THE EIGHTH DEFECT IS THE FOURTH ESCAPE OF A REGISTER''S OWN KEYING. Hour #7 handed over three leads and this is the first of them: D23''s ORGAN_QUERY_GRID asks whether a reading taken on a grid of the HARNESS''s own making is quantised to that grid, and answers it for the two readings off the RECONCILIATION candidate grid -- so nothing ever asked it of the dimension whose grid is not made of dates. THE FINDING, measured not asserted: THE AGEING DIMENSION''S RESOLUTION IS THE HARNESS''S CALENDAR. Every truly-overdue invoice in the scenario is 30, 51 or 72 days overdue at `as_of` -- three distances, fixed entirely by FIRST_DUE_DATE + PERIOD_SPACING_DAYS x N_PERIODS and AS_OF_BUFFER_DAYS -- so an ordinal bucket headline can only see a dating error that carries an invoice across a 30/60/90 boundary. MEASURED via a new declared counterfactual company (`organ_terms_drift_days`: the supplier holds the wrong payment terms on every account, so it dates every debt k days out; world untouched and truth-side rule untouched, so all movement is the company''s dating moving), n=300, seeds 7/11/23, bit-identical at all three: a company that dates every debt ONE TO EIGHT DAYS OLDER than truth -- over-ageing, the direction that posts an early dunning letter -- publishes the SAME headline as the shipped company (0.078649 / 0.146341 / 0.078706, unchanged to machine precision), while the DETECTION dimension of the same instrument moves on every one of those drifts, which is what makes this a blindness and not a dead probe. In the other direction the reading COLLAPSES: +1d and +12d are ONE number, so a movement here cannot be read as days at all. The asymmetry (1 day visible one way, 9 the other) is an accident of where three due dates fell, not a property of the company being graded. CLOSED AT THE CLASS (R10) by DIMENSION_DRIFT_RESOLUTION, the register with the keying removed: its keyset is DERIVED from what `score_triad` publishes (a published dimension with no entry RAISES; an entry nobody publishes RAISES), and each entry is re-scored through the dimension''s OWN shipped scorer against the declared counterfactual. THREE STATES, DIFFERENTIAL ON PURPOSE: on-path-and-BLIND (ageing, detection) owes a debt_atom; on-path-and-SIGHTED (detection_latency, which D23''s daily grid resolves to the day in both directions) is the entry without which this register would be an all-blind excuse; OFF-path (belief, belief_population_mix -- their organ counts observed FAILURE EVENTS and never reads the ledger''s dating) must NAME a probe that does move them and have it MEASURED, because a believed exemption is exactly what hid D21. THE DIFFERENTIAL IS ALSO THE EVIDENCE: the same one-day company error is seen by exactly one of ageing/detection in EACH direction (ageing sees +1 and is blind to -1; detection the reverse), which localises the defect to the population''s PLACEMENT rather than to one formula, and forbids reading either headline as covering the other''s blind side (the D16 rule). CAUGHT BY THE CONTROL ON ITS OWN FIRST DRAFT: with only ''declared-invisible must be unmoved'' and ''declared-visible must move'', UNDER-stating the band passed silently -- drop -1 from the ageing band and every declaration still held, while `ageing_resolution_caveat`, which INTERPOLATES that band, went on publishing a narrower blind spot than the instrument has. The band must now be EXACT: any measured-unmoved drift not declared is a violation. R15 BOTH WAYS -- eight register mutations fire by name (understated band, overstated sight, a collapse checked against readings nobody took, a collapse that is really an invisibility, an unowned hole, a rotted off-path claim, a probe-less exemption, an all-blind register), a dropped or invented dimension RAISES, an inert counterfactual trips the vacuity guard, and a SOURCE mutation (the drift dropped inside `score_triad`, restored md5-identical 9c6cbb34ee413e3872c49e2285cb634a) fires FOUR tests, the first of which names the register. R12: every published figure bit-identical before and after (n=600 seed 7: ageing 0.06847916348907757, detection 0.012100259291270527, latency 2.132353, belief 0.1337579617834395) -- the RESHAPE (a population whose invoices sit at distances that can resolve a dating error) moves numbers and is therefore atom D25, minted at L0, not fixed on sight. WHY STILL L2: eight consecutive Hours, eight defects, none predicted by the Hour before it and the arrival rate is not falling; Hour #4''s stated-in-advance criterion of TWO CONSECUTIVE CLEAN HOURS has still not been approached, and this is again the tick that CHANGED the instrument. Hour #9 leads, in order: (1) belief and belief_population_mix are OFF this drift''s path, so their smallest visible company error remains unmeasured -- no counterfactual organ knob for the arrears-severity belief exists in this harness at all, which is a hole in the same shape as the one this Hour closed; (2) the pinned generated value Hour #7 left (`assert c["n_recon_detected_undated"] == 0`); (3) whether the other dimensions'' normalisation notes have the same gap between what they DENY and what they ESTABLISH. Tests: 12 new (271 green in tests/tools/test_couple_w2_11_d5.py, was 244); 153 green across every sibling coupled-pair suite. Evidence: docs/staging/WORKER_FINDING_THE_AGEING_RESOLUTION_IS_THE_HARNESS_CALENDAR_2026-08-10.md'
