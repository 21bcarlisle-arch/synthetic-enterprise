simplifications:
- '2026-08-10 EXPERT HOUR #7 (worker tick, H27 2->3 HARDEN draw), on `detection_latency` -- the last dimension never given an Hour of its own, and the one carrying the most exemptions (coverage-only exempt; the sole `covered_by` entry in the direction register). D21''s lesson was that the control believed the exemption, so the most-exempted dimension is where to look. FINDING: THE INSTRUMENT CANNOT RESOLVE THE QUANTITY IT PUBLISHES. `detection_latency_gap`''s docstring claims R15 independence in as many words -- the reconciliation first-knowledge date is ''asked of the organ itself, never re-derived here (a harness re-implementation of `due + grace` would be a tautology that could not fail if the organ''s rule changed)''. The organ IS asked; it is asked at exactly ONE date per period, and `score_triad` builds that date itself (`candidates = {r.due_date + reconciliation_grace_days}`). That is the re-derivation, promoted from a computed value to the only place the question is ever put: independent in FORM, tautologous in VALUE. A reading taken by querying an organ on a grid of the harness''s own making is quantised to that grid, and the resolution is a property of the harness, not of the company being graded. MEASURED via the declared `organ_reconciliation_drift_days` counterfactual (company detector only; world and every truth-side rule untouched, so all movement is the company''s detector moving), n=300/600, seeds 7/11/23, bit-identical at all three: `recon_lag_days` is the CONSTANT 5 for all 204 dated cases at seed 7 -- zero variance -- which is `reconciliation_grace_days`, a harness input parameter echoed back. IMPROVEMENT IS INVISIBLE WITHOUT BOUND: -1d, -5d (flags the day it falls due) and -20d (flags a fortnight BEFORE due) all publish 5.0 / 2.132353 / 0.012100, identical to the shipped organ, so `mean_lag_days_without_dd_channel` -- the counterfactual arm the docstring calls ''the whole point of the dimension'' and its own comment insists is ''a reading rather than a constant'' -- is not a reading of the company at all, and `dd_channel_days_earlier` is that constant minus the DD lag. A supplier that halved its reconciliation time would see the number not move, and NOT ONE test in the repository fires on any improvement drift. DEGRADATION IS QUANTISED TO 21 DAYS (`PERIOD_SPACING_DAYS`): a one-day-later detector misses its period''s only candidate and is next dated at the NEXT period''s, so +1d publishes as +21.0d (a 21x overstatement) and +1/+7/+21 are one number (26.0 / 7.124088 / 0.024362); the last period has no later candidate at all, so its cases leave the population (undated 0 -> 59, n=600 seed 7). A permanent source mutation of the organ (`item.days_overdue < grace_days` -> `< grace_days + 1`, restored and md5-verified) fires SEVEN tests in the pair''s suite and NOT ONE names latency -- they count witnesses and shared quantities, and the first of them fails on `assert c["n_recon_detected_undated"] == 0`, a PINNED GENERATED VALUE whose diagnostic sends the reader to coverage bookkeeping. CLOSED AT THE CLASS (R10): ORGAN_QUERY_GRID, a register keyed on the READING rather than the dimension (the same grid feeds two), each entry declaring which company drifts it can and cannot see plus the measured step; `measure_organ_query_grid_resolution` re-derives every declaration each run by re-scoring the same population against the drifted company, `check_organ_query_grid_resolution` returns named violations, and both run in the CLI as well as the suite (a control living only in the tests is one the reader about to quote a latency never meets). DIFFERENTIAL ON PURPOSE, and the differential is the evidence: the second entry `flagged_via_reconciliation` is a SET MEMBERSHIP off the same grid feeding `detection` -- no step in days to declare, but it shares the improvement blindness exactly, because a detector firing earlier still fires at the same single candidate and flags the same set. That the DATE reading and the SET reading go blind together is what makes this a finding about the GRID rather than about the latency formula. R15 BOTH WAYS: inert probe (a runner ignoring the drift) -> the vacuity guard fires and names the PROBE, not the reading; repaired grid (a D23-shaped runner tracking the organ day for day) -> the `invisible_drifts` declarations fire BY NAME, the violation names D23 as the atom to re-derive, and the quantisation pin fires with ''published as 1.0 days, not the declared 21.0'' -- the direction that matters, since a debt entry outliving its debt misleads worse than none (the D22 second rule); a register declaring a blindness with no `debt_atom` -> unowned-hole violation. Counterfactual is a DECLARED `score_triad`/`measure` parameter, not a test monkeypatch (D20 rule), verified to reproduce the monkeypatch measurement digit for digit before anything was built on it. Caveat + step + `organ_improvement_is_visible` stamped AT SOURCE in `detection_latency_gap.components` with the step INTERPOLATED from the register, so all three coupled pairs carry it. R12: every published figure bit-identical before and after (2.132353 / 5.0, n=600 seed 7) -- the RESHAPE moves numbers on three pairs and is therefore atom D23, minted at L0, not fixed on sight. HELD AT L2: seven Hours, seven defects, none predicted by the Hour before it, arrival rate not falling; Hour #4''s stated-in-advance criterion of TWO CONSECUTIVE CLEAN HOURS has not been approached, and this is again the tick that changed the instrument. Hour #8 leads, in order: (1) the other grid readings -- `snapshot()` is asked at `as_of` ONLY, the same shape with the grid degenerate to a single date, and whether `ageing`/`belief` are as_of-quantised is a measurement nobody has taken (DIMENSION_AS_OF_CONTRACT asks whether the headline MOVES with as_of, not whether it can RESOLVE the company at a fixed one); (2) the pinned generated value above; (3) DETECTION_LATENCY_NO_NORMALISER_REASON is correct and now insufficient -- ''an absolute mean in days'' needs the RESOLUTION of those days beside it, and whether the other dimensions'' normalisation notes have the same gap between what they DENY and what they ESTABLISH is one sweep, not four readings. Tests: 9 new in tests/tools/test_couple_w2_11_d5.py (244 green, was 235); 135 green across every sibling coupled-pair suite; size ratchet green. FULL TEXT: docs/staging/WORKER_FINDING_THE_INSTRUMENT_CANNOT_RESOLVE_ITS_OWN_LATENCY_2026-08-10.md'
