simplifications:
- '2026-08-11 THE SEVENTH EXPERT HOUR RAN ON THE QUESTION THE SIXTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DEFECT: the money channel''s fidelity term -- the one half of `panel_mirror_is_attributable` that actually fires on both published populations -- was a DIFFERENCE OF TWO POPULATION TOTALS standing in for an attribution the verdict it guards has made PER PREMISE since the fifth Hour. This is the THIRD Hour''s own repair (`_register_mad`, "an aggregate of differences, never a difference of aggregates") left undone in the money channel that the same Hour created, which is why it is filed as a CLASS and not an instance: a paired verdict acquires a fidelity gate, and the gate inherits the retired statistic because nobody re-asks what the new verdict is denominated in.

  OBSERVED, WITH EVIDENCE, BY RUNNING IT (twelfth time on this atom). The mirror moves the deciding margin in BOTH directions -- 1 premise up and 3 down of the 4 it moves at all on the authored panel, 10 up and 8 down of 18 on the drawn one -- so the sums cancel: 21.4% of the mirror''s per-premise movement is invisible to its own total on the authored panel and 39.6% on the drawn one, while the NULL''s cancels by a different 32.6% / 25.3%. The ratio of two differently-attenuated sums is not the attribution, and it errs in both directions: 68.9% published where the truth is 80.4% (authored), 90.4% where it is 73.1% (drawn). The failure is not academic: on 7 of 200 real 20-home subpanels drawn from this atom''s own published population the old shape PASSES the 50% band (32.9%, 41.7%, 44.7%, 47.7%, 49.3%, 49.996%, 44.7%) where the per-premise shape FAILS it (up to 65.1%) -- and a pass there means the row certifies the mirror and publishes ''no composition effect'' as a finding.

  THE SAME DEFECT AT THE OTHER END, which is why the sixth Hour''s two openers close as one mechanism: the sentence that justifies refusing the money verdict quoted the weight null''s two population totals (''GBP 29,722 epc / 12,835 inferred'') with no interval -- the aggregate rule the verdict stopped using two Hours earlier, offered as the ground for distrusting the per-premise one.

  MECHANISED, not exhorted. `_paired_margin_moves` measures both channels premise-by-premise across three panels (base, mirror, weight null), guarded on premise order and on non-finite movement, and the pairs are carried on the verdict as `margin_moves` so the point estimate and its interval are two readings of ONE measurement. The band is UNTOUCHED at 0.50 (R12 -- the statistic was wrong, not the threshold; MIRROR_WEIGHT_ARTEFACT_BAND has never been moved). The old answer is kept as `panel_mirror_weight_artefact_aggregate` alongside `panel_mirror_margin_cancellation` and `weight_null_margin_cancellation` -- TWO cancellation numbers, not one, because either channel cancelling on its own moves the ratio and on the suite''s passing fixture it is the NULL''s that does it (0.0% mirror / 31.4% null, 29.9% against 43.6%). The share now carries a 95% percentile-bootstrap interval on a THIRD named C-S2 substream, computed through the same `_artefact_share` function the gate reads, and `_bootstrap_mean_ci` is generalised to `_bootstrap_statistic_ci` so three published intervals share one resampling implementation rather than three copies that drift.

  R15 -- FIVE source mutations, each firing its own named test and nothing else: (1) the term reverted to the aggregate shape -- the per-premise test AND the zero-corner test fire; (2) the interval computed from a different expression than the gate reads -- the one-statistic test fires; (3) the sentence quoting the two totals again -- the disclosure test fires; (4) `_mean_abs` returning 0.0 on an empty panel instead of raising (the fail-open shape: ''the instrument disturbed nothing'' and ''nothing was measured'' are opposite readings) -- fires; (5) the premise-order guard removed -- fires. 234 tests green in `tests/harness/test_premise_two_level.py`, 79 across `test_couple_fabric.py`, `test_gap_ledger_reconciler.py` and `test_lcl_household_anchors.py`.

  NO PUBLISHED FIGURE MOVED: both gap headlines are unchanged (0.4269 epc / 0.4042 inferred), both populations were INCONCLUSIVE before and remain so, and what changed is the number the row gives as its reason (80% per premise, interval [73%, 122%], across the 4 of 15 premises the mirror moved) and the fact that it now says what the old rule said and why the two differ.

  OPENER FOR THE EIGHTH HOUR, and it is this Hour''s own deliberate non-move: the gate compares a POINT ESTIMATE to the band while the interval around it straddles the band on the suite''s own passing fixture (0.4364, 95% [0.219, 0.792]) -- a mirror certified attributable on evidence that cannot resolve which side it is on, which is the fourth and fifth Hours'' finding one level up from the verdict and applied to nothing yet. Moving a live gate onto an interval in the same Hour that repaired its statistic would change what is published for two reasons at once and neither could be attributed afterwards.

  ALSO OBSERVED, NOT FIXED HERE (queued, per SELF-INTERRUPT DISCIPLINE): `gap_ledger_reconciler` reports both fabric rows STALE on HEAD -- 3 commits touched `background/fabric_gap_ledger.py` / `tools/couple_fabric.py` since 442ecbd02, i.e. the previous three Hours each re-measured nothing. This tick re-runs the drawn population with `--write-ledger` AFTER landing the code, which is the only ordering under which the row can come out `current`.'
