atom_id: H27_payment_belief_gap
chunk: 9
map_records:
  expert_hour_findings:
  - the CLI `--write-ledger` path was STILL overwriting the measured note with the refuted "fraction of true payment failures the company never observes -- the no-remittance blind spot" sentence, into the SAME bare ledger key the live path writes correctly. The live sibling was corrected on 2026-08-09; this one was left behind and had no test at all -- the identical defect, in the identical shape, one file over from where it was just fixed. It now appends to the measured note rather than clobbering it, under a test that asserts the CLAIM rather than banning a substring (a bare ban refused the honest sentence that negates it -- the AO2 "none" shape, caught in this same tick)
  - 'THIRD HOUR, on the corrected instrument (2026-08-10): THE BELIEF DIMENSION IS BLIND TO WHO HOLDS THE BELIEF. It is a total-variation distance between two population severity DISTRIBUTIONS, so permuting the company''s per-case labels among cases -- destroying every correct per-case assignment while leaving the label multiset alone -- takes agreement 0.9287 -> 0.6432 and moves the published gap 0.0713 -> 0.0713, identical to machine precision (n=4000 seed 7; seeds 11/23 agree). The degenerate is ''right mix, every individual wrong''. It survived the D11/D12/D14/D15 sweep because DETECTION_DIRECTION_CONTRACT is keyed to detection scorers, and it hid in plain sight because on a one-directional book TV is ARITHMETICALLY EQUAL to the per-case disagreement rate (0.0700/0.0700, 0.1033/0.1033, 0.0733/0.0733 at seeds 7/11/23), so the number reads as the per-case rate and numerically IS one. CLOSED AT THE CLASS (R10) by AGGREGATE_SCORING_CONTRACT + a control that PERMUTES per-case labels and re-scores through each dimension''s OWN shipped scorer, differential on purpose (belief must not move; ageing and detection must), with a vacuity guard on the probe itself; R15-proven by mutating the SOURCE both ways -- flipping the belief declaration and making the permutation inert each fire. Caveat + n_cases_misassigned / per_case_disagreement_rate witnesses stamped AT SOURCE in gap_metric.belief_gap so they reach all three pairs calling it (W2_11<->D5, W2_4<->C6, couple_cohort), None never 0 where a caller cannot supply labels. Also caught by the new control on its first run: rendering detection truth as failed/ok against belief flagged/clear made per-case agreement 0 on EVERY case by construction, which would have left that dimension silently unprobed. The RESHAPE itself is atom D19 (not fixed on sight: it moves a published number on three pairs)'
