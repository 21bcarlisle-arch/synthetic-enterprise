simplifications:
- "2026-08-20 pass 23 BUILD, level HELD at 2, loop_stage stays build. THE CHANNEL C GATE IS ARMED, and this pass does nothing else. This is the one thing pass 22 recorded as the next move, in the form it recorded it: \"ARM THE CHANNEL C GATE, in a pass that does nothing else. Wire `envelope_wire_conformance` into `_wall_channel_census_check` fail-closed on a raise, exactly as channel D's wire check is wired, and MEASURE FIRST against a probe tree ... rather than hoping.\" Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 6467c826f, with this atom's file_scope CLEAN against HEAD before the pass -- which is what made the measurement below a reading of HEAD itself rather than of an uncommitted tree, the distinction that cost passes 12-17.\n\n  MEASURED BEFORE ARMING, WHICH IS THE WHOLE PROCEDURE. `envelope_wire_conformance_at(rev=\"HEAD\")` reports `ok=True`, `channel C: 3 of 3 versioned seam(s) cross on a wire`, in-process bucket EMPTY. That is the first HEAD in this atom's history at which arming is honest, and it is the condition pass 19 wrote down: the check \"becomes a gate in the same commit that makes it satisfiable, which is the only commit in which restoring it is honest.\" Every earlier tree had at least one seam crossing the call frame, so arming there would have refused EVERY commit in the repo including the publisher's -- a landing-order defect, not a control defect, and precisely what cost channel D passes 12-14.\n\n  THE TEST THAT FORBADE THIS WAS THE INSTRUCTION FOR DOING IT. `test_channel_C_is_NOT_wired_into_the_commit_gate_and_the_condition_is_recorded` asserted `\"envelope_wire_conformance\" not in gate` and its own docstring said \"this test is what has to be edited to do it\". It is now `test_channel_C_IS_wired_into_the_commit_gate_and_the_condition_that_allowed_it_is_recorded`, asserting the symbol IS present, and it carries the old reading as the record of why it flipped. That assertion is deliberately the STRUCTURAL half only -- a symbol appearing in a caller is not evidence its verdict is used, which is the exact fail-open this atom shipped for four passes -- so it guards the cheap reversal (deleting the call) and the mutations below prove the refusal.\n\n  ZERO TOLERANCE AND NO DEBT LIST, matching channel D beside it. `EnvelopeWireVerdict.ok` is `not in_process and not half_wired`. HALF-WIRED refuses as hard as IN-PROCESS on purpose: one side only LOOKS transported -- bytes in the declared wire form that nothing version-checks -- so a migration that lands its encoder and forgets its decoder is refused rather than credited as progress. THE UNSCORED BUCKETS CANNOT WEDGE A LANE, which is the property that makes zero tolerance safe here: a DORMANT leg (declared, never sent) and an UNVERSIONED seam (`wall_envelope`, which defines the shape rather than crossing it) are facts about a CONTRACT, not defects in a crossing. Scoring either would make the gate permanently red for a reason no lane can repair without deleting a contract -- the shape of a control that gets tuned away.\n\n  THE LEG-BLIND FALLBACK IS NOW REPORTED BY THE GATE, and it is a report rather than a refusal on purpose. Leg ownership is read from a seam's own `WallRequest[...]`/`WallResponse[...]` aliases, so a one-line delete makes the leg-aware rule inapplicable and the verdict falls back to pass 19's leg-blind rule. That fallback is never WEAKER than the reading it replaced, so refusing on it would red a tree with nothing wrong with it. But silence would make deleting the alias the cheapest way to downgrade this control, and the gate is the one place a lane would actually have seen it -- so the pass message names the seams and says a half-migrated seam would not be caught. Live reading: the bucket is empty, and both a live test and the gate's own success message would say so if it filled.\n\n  R15: 8 new proofs (`tests/tools/test_wall_channel_census.py` section 16, 98 to 106 in the file). THREE MUTATIONS RUN, NOT ASSERTED, each against a probe tree built as `git archive HEAD` + this pass's two files and committed, so the mutation was applied to a real gate module and never to the shared worktree -- a full suite was in flight throughout (pid 1682834, 24m elapsed at the time), and mutating a shared module under a live suite is how this project has broken sibling lanes before. (1) DISCARD THE VERDICT -- delete the two refusal lines, which is exactly the reporting branch passes 19-22 shipped: BOTH refusal proofs fail. (2) EXCUSE-EVERYTHING -- refuse only on `in_process`, the laxer rule anyone would write: ONLY the half-wired proof fails, so the attribution is per-population and not a blanket. (3) FAIL-OPEN -- swallow the `CensusUnavailable` raise and substitute an empty verdict: only the fail-closed proof fails, which matters because `envelope_wire_conformance` RAISES rather than reporting an empty subject when every seam has lost its `SCHEMA_VERSION` -- swallowing it would turn the loudest failure the enumerator has into the quietest. NULL CONTROL: the same probe tree restored, same command, 104 passed -- so what fires is the move and not the wrapping.\n\n  A CONTROL'S FIXTURE WAS ITSELF FAIL-OPEN AND THIS PASS CAUGHT IT. `_gate_wire_branch`, channel D's caller-mutation fixture from section 11, forced the census half green and left everything else real. With a third half added, the real `envelope_wire_conformance_at` then ran against the fixture's fake index tree `\"0\"*40`, raised, and hit its own fail-closed branch -- so channel D's NULL CONTROL went red while looking exactly like a defect in channel D. Repaired by pinning channel C too. The general form, which is why it is recorded: EVERY half of a multi-part step has to be pinned for any ONE of them to be a subject, and adding a half silently un-isolates every fixture that pins the others by name.\n\n  THE LIVE READING, AND THE COST. The armed step returns True on the tree this commit creates: `the wall's four walker-invisible channels have not grown; channel D's 3 wire site(s) carry the version; channel C's 3 of 3 scored seam(s) cross on a wire`, with no fallback notice. Measured cost 5.0s per commit, on top of the `head_export` the census and channel D halves already pay for -- it reuses that machinery rather than adding a second export.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * NO HARDEN PASS AND NO EXPERT HOUR on pass 22's two hand-written codecs. This is the condition that has caught this atom every time, and pass 18 is the reason to take it seriously: the Expert Hour booked against pass 17's freshly-written instrument FOUND A DEFECT IN IT.\n    * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION. A, B, E and F are enumerated; enumeration answers \"who crosses here\", not \"does the crossing conform\". Two channels of six own the second half.\n    * `3 OF 3` IS NOT \"NO OBJECT CROSSES THIS SEAM\" -- pass 22's call-site limit stands, and the gate inherits it exactly: the gate's unit is the (SEAM, LEG), so a fourth crossing of an already-wired leg handed over as a Python object is invisible to it. The gate makes the current reading unreversible; it does not make it finer.\n\n  THE ATOM IS OVER ITS OWN PASS CEILING AND THAT IS RECORDED, NOT WORKED AROUND. `python3 -m tools.discovery_pass_ceiling` reports EP6 at 14 passes SINCE its level last moved (21 total), against a ceiling of 5. The ceiling gates the idle DISCOVER/FRAME lane only -- BUILD and HARDEN stay drawable, and this pass is BUILD -- so it did not refuse this draw and no rule was bent to take it. But the ruling behind it (\"make it impossible for the system to run indefinitely on work that cannot change its own state\") is aimed at exactly this shape, and 14 passes at level 2 with target 3 is the shape. Naming it here so the next pass does not have to rediscover it: the honest reading is that this atom's remaining L3 conditions are a HARDEN pass and a third channel's conformance question, both of which are BUILD-shaped and neither of which is a reason to investigate again.\n\n  L3 IS STILL NOT CLAIMED, and pass 22's first blocker is the one this pass discharged. Its list was: no HARDEN/Expert Hour; the channel C check does not gate; four of six channels have no conformance question; `3 of 3` is not call-site-level. The SECOND is now false -- the gate is armed, mutation-proven, and green on the tree it was armed in. The other three stand, and the first of them is the one that matters, for pass 22's own reason: claiming L3 on the pass that armed the gate would be greening my own verdict with codecs that have had no adversarial reading.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): THE HARDEN PASS / EXPERT HOUR on pass 22's flex and conversation codecs, run as a cold-eyes walk against the CODECS rather than the reports -- the reverse of pass 18's target, because pass 18 already walked the reports and the codecs are what has never been read by anyone but their author. The specific question to put to it is the one pass 22's own record raises and does not answer: both codecs refuse `FORBIDDEN_TRUTH_FIELDS` by name, so what happens when the world adds an observable that is NOT on that list but is nonetheless ground truth the company should not have -- is the list a wall or a denylist? That is the R10 question (the class, not the instance) and it is the one a stranger would ask first.\n\n  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the un-isolated fixture is this atom's own test file, found by using it and repaired in the same pass."
