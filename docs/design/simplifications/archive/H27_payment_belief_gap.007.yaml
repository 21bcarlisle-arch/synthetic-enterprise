atom_id: H27_payment_belief_gap
chunk: 7
map_records:
  expert_hour_findings:
  - 'the DETECTION headline is an as_of ARTEFACT: truth (result==''failed'') is invariant under the clock but flagged_set is a belief held AT as_of, so company+world fixed and as_of +60d walks the published figure 0.0725 -> 0.1232 (+70%, seed 7). Its companion detection_latency dimension already uses an EVER-KNEW population and does not move -- the fix went to the neighbour, not the headline. CLOSED AT THE CLASS (R10) by DIMENSION_AS_OF_CONTRACT + a differential as_of sweep control, source-mutation-proven both ways; the DIMENSION ITSELF is atom D11 (not fixed on sight: it moves a published number)'
  - 'the DETECTION headline counts ONE ERROR DIRECTION: detection_gap is pure recall, so flag-EVERYTHING scores a perfect 0.0 while the published baseline names only ''flag nobody -> 1''. Measured: 44-51% of all flags land on invoices that truly SUCCEEDED (seed 7: 101 false flags / 0.0951 over truly-current -- the SAME 101/1062 D7''s overstated_arrears_rate reports one dimension over). Caveat + n_false_flags/false_flag_rate witnesses stamped AT SOURCE in gap_metric.detection_gap, so they land on all three coupled triads calling it; reshape is atom D11'
  - 'background/live_payment_triad.py::measure_and_write -- the path that PUBLISHES the gap into coupled_gap_ledger.json for the Proof door -- had NO test reaching it, so every word of its note was unexercised and a rotted sentence or KeyError would have surfaced only in a live run_phase2b. Closed: it now renders under test with the witness interpolated from the measurement'
  - tests/background/test_live_payment_triad.py had NOTICED the over-flagging ('flagged can EXCEED true') and explained it away as reconciliation picking up late-boundary invoices, explicitly declining to assert on it. That is where this error direction hid in plain sight for a fortnight -- it is now counted on its own denominator
  - 'SECOND HOUR, on the CORRECTED instrument (2026-08-09): THIS INSTRUMENT PUBLISHES ONE NAMED QUANTITY AS TWO DIFFERENT NUMBERS. "The wrongful-dunning exposure" prints twice in one output block -- detection false_flag_rate 0.0269 (21 of 782) and ageing overstated_arrears_rate 0.0951 (101 of 1062), 3.5x apart, sharing SEVEN cases -- while gap_metric asserted in prose they were "literally the same numerator". Measured case by case: the denominators are in EXACT containment (1062 == 782 + 280) because D11 applied its exclusion rule (a payment past grace really WAS unpaid past grace, so the flag was correct) to the DETECTION dimension only, and 94 of ageing''s 101 land in that excluded band. Divergence confirmed at seeds 7/11/23 and two grace windows. CLOSED AT THE CLASS (R10) by SHARED_QUANTITY_CONTRACT + a control that derives both sides from the two scorers'' own components and sweeps the rendered summaries for unregistered publishers; R15-proven on two register lies and a de-registered emitter. The ALIGNMENT itself is atom D16 (not fixed on sight: it moves a published number)'
