- "2026-08-20 pass 37 BUILD, level HELD at 2, loop_stage stays build. THE L3 EXIT CRITERION HAS BEEN SITTING ON DISK, CLOSED AND BLIND-AUTHORED, SINCE PASS 33 -- AND NO PASS SINCE HAS WORKED IT. Seven of the cold-eyes battery's twelve DISQUALIFYING questions had never been reconciled against the code by anybody, while passes 34, 35 and 36 each derived a fresh \"WHAT REMAINS FOR L3\" list from their own investigation. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 5f1553fea, worktree, with all nine file_scope files CLEAN against HEAD before the pass.\n\nWHAT THE DRAW ASKED FOR AND WHY IT WAS REFUSED. The tick drew this atom for BUILD. `python3 -m tools.discovery_pass_ceiling` names it saturated -- 35 passes, 28 since the level last moved, second worst in the project -- and its verdict is explicit: \"another build pass at the same level is no longer an available answer\". So a thirty-seventh build item was not taken. The three answers the ceiling does offer are land the move, record `infeasible_here`, or close, and establishing WHICH of those is true is the only work that can end the loop.\n\nTHE MEASUREMENT, AND IT IS THE FINDING. L3 is defined in `docs/design/MATURITY_MAP.md:52` as \"passed the full loop incl. HARDEN; Expert Hour: 'this is real'\". The Expert Hour for this atom RAN in pass 33, and `docs/observability/blind_review_ledger.jsonl` holds its battery VERBATIM: 17 questions, 12 of them marked DISQUALIFYING by the reviewer BEFORE any code was seen. That is a CLOSED SET, authored blind, sitting on disk -- the exit criterion, already written down. Pass 33 reconciled five of the twelve (Q1, Q2, Q3, Q5, Q11) and found two passing. SEVEN WERE NEVER RECONCILED BY ANY PASS. Reconciled now, against the tree:\n  * Q6 FAIL -- the seam REFUSES spec-violating input and the consumer handles duplicates and out-of-order revisions (C-S1/C-S2, pass 36), but no STAND-IN can EMIT spec-violating traffic in regression. The malformed inputs are hand-built test fixtures, not counterparty behaviour.\n  * Q9 FAIL, EPOCH-GATED -- no contract tests against any counterparty's real test environment, and none possible: `tools/company_network_isolation.py` makes it a WALL that company/ and saas/ may not open a socket, ever. Stand-in-vs-real divergence is undetectable by construction here.\n  * Q10 FAIL -- `company/interfaces/wall_protocol.py:91`, `SUPPORTED_SCHEMA_VERSIONS = frozenset({1})`. A single GLOBAL version constant with no per-counterparty dimension: exactly the shape the reviewer said makes every market release a big-bang cutover.\n  * Q13 FAIL -- and it is the sharpest. There is NO counterparty authentication anywhere below the port. A repo-wide search for SMKI, DIP signing, DTN participant identity, mutual TLS or client certificates hits only `background/one_way_door.py:196` and its test, i.e. the project models SMKI accession solely as a RESERVED REAL-WORLD ACT and never as a verified property of a message. The atom's headline claim -- a mock counterparty and a real one are indistinguishable to the company -- is TRUE HERE BECAUSE THE IDENTITY CHECK IS ABSENT FROM THE PATH. That is the reviewer's precise objection, predicted from five sentences: a control gap, not an abstraction. NOT epoch-gated: modelling identity verification below the port against a stand-in needs no real certificate.\n  * Q14 FAIL -- nothing stops a stand-in configuration reaching production because nothing distinguishes them; no environment segregation and no startup assertion exists across the seam contracts.\n  * Q15 FAIL, EPOCH-GATED -- nothing runs against DCC SIT/UIT/UEPT, CSS test or the DIP test environments, and this layer feeds no Elexon qualification or REC entry-assessment evidence. Reserved classes 1 and 2; `EP19_counterparty_qualification_paths` (epoch 5) is where that register lives.\n  * Q17 PASS -- the honest \"they don't, they're outside this\", which the reviewer explicitly named as fine and expected. A streaming price feed is channel F (published artefact); a gate-closure-critical ECVN submission is not modelled and appears only as a reserved act. Neither is claimed to fit.\nLIVE READING: 12 DISQUALIFYING, 3 PASS (Q1, Q11, Q17), 9 OUTSTANDING, of which 2 are epoch-gated.\n\nTHE CONTROL THAT SAID OTHERWISE, AND IT IS THIS ATOM'S OWN. `wall_channel_census.cold_eyes_walk_outstanding()` returns `()` -- no blocker -- on the live tree right now. It greens on the mere EXISTENCE of a review record, whatever that record says. Pass 33 wrote, verbatim, that \"greening a level on the mere fact that the review happened would make the instrument a ceremony\", held the level by judgement in prose, and then shipped a predicate that greens on the mere fact that the review happened. The level was held by a paragraph; the MECHANISM said unblocked. That is R15 FAIL-OPEN -- the control passes on the state it exists to catch -- and it is the third time in this project's record that a test has pinned the defect it was meant to catch: `test_EP6s_walk_is_recorded_and_its_cell_no_longer_claims_the_blocker` ASSERTS that predicate returns `()`.\n\nTHE REPAIR: THE UNIT IS THE DISQUALIFYING QUESTION, NOT THE REVIEW. `tools/cold_eyes_battery.py` (new, 12 files under the 600-line cap rather than a fourteenth section of the 3,504-line census) reads the battery from the ledger and the answers from `docs/observability/cold_eyes_battery_reconciliation.jsonl`, and returns the outstanding set. `battery_outstanding()` is `()` only when every DISQUALIFYING question carries a recorded, evidenced PASS. `unpayable_here()` is the strict subset additionally marked `epoch_gated` -- currently ('Q9','Q15').\n\nWHY AN AUTHORED RECONCILIATION IS NOT A TAUTOLOGY, since the lane writes the file it is checked against. The DIRECTION of failure is what holds it: to GREEN this the lane must record twelve falsifiable claims, each citing a file a reader can open; to RED it the lane need do nothing. Silence BLOCKS. The predicate it replaces failed the opposite way -- silence RELEASED, and no claim was required of anyone.\n\n`infeasible_here` IS DELIBERATELY NOT SET, and this is the pass's one refusal. The ceiling renders that record as \"BLOCKED ON AN INSTRUMENT, not on work ... do not record another pass as if they could\". Seven of the nine outstanding questions -- Q2, Q3, Q5, Q6, Q10, Q13, Q14 -- are ORDINARY BUILD WORK this seat can do. Recording the atom as instrument-blocked would retire them, which is the mirror-image abuse of the same notation and is named in the new module's own docstring: \"recording the first as the second is how a lane retires work it simply did not want to do.\" What IS true, and is new, is that L3 IS UNREACHABLE IN EPOCH 3 REGARDLESS OF BUILD WORK, because Q9 and Q15 require acts in reserved classes 1 and 2. The ceiling has no way to say \"the target is unreachable this epoch AND build work remains\" -- a fourth state its three answers do not cover -- and that is filed as a finding rather than fixed here, because fixing the ceiling in the tick where it refuses my own draw is the shape the director's own instruction file warns about.\n\nR15, 19 TESTS, PROVEN BOTH WAYS AND RUN. MUTATION on the LIVE tree, not a fixture: both predicates run against the real ledger and are asserted to DISAGREE -- the shipped one returns `()` while the battery returns nine. FAIL-OPEN: a battery with zero DISQUALIFYING questions RAISES (that is what a flawless capability looks like AND what a broken parse looks like, and they are not the same); a recorded walk with an empty battery RAISES; an ABSENT reconciliation blocks every question. FAIL-SILENT: unreadable ledger and unreadable reconciliation both RAISE. Vocabulary and join, all fail-closed: a row missing evidence, a verdict outside {PASS, FAIL}, two rows for one question, and a row for a question the battery does not carry each RAISE. NULL CONTROLS: all-PASS clears to `()`, so the success case is reachable; an unanswered SUPPORTING question does NOT block, so the reviewer's own split is respected rather than overridden; a PASSING question marked `epoch_gated` does not become unpayable, so the flag can narrow and never widen.\n\nTHE CONSUMER, because a control with no caller is a class this project already carries. `test_EP6_MAY_NOT_BE_RECORDED_AT_L3_WHILE_ITS_OWN_BATTERY_IS_OUTSTANDING` refuses a level-3 record for this atom while any DISQUALIFYING question is outstanding, and it FIRES on that state today (asserted, not claimed). Scoped to the EVENT rather than to every commit on purpose: a census half redding on nine outstanding questions would refuse every commit on this shared tree, born red, and would be relaxed within a day.\n\nWHAT REMAINS FOR L3, AND FOR THE FIRST TIME THE LIST IS NOT THIS PASS'S OPINION -- it is the blind reviewer's own closed set, and the next pass may not invent a different one. ORDINARY BUILD WORK, seven: Q13 (identity below the port -- the sharpest and the one that most undercuts the atom's headline claim), Q10 (per-counterparty concurrent versions), Q14 (stand-in/production segregation), Q5 (TIMEOUT writer then reader, and a horizon ladder), Q2 and Q3 (the unsolicited-inbound and multi-leg conversation repair, one gap seen from two sides), Q6 (a stand-in that can misbehave). EPOCH-GATED, two: Q9 and Q15, both requiring reserved-class acts, both belonging to EP19's register. INFERRED: with Q9 and Q15 unreachable in epoch 3, `level_target: 3` on this atom is not attainable in this epoch, and the honest disposition is a curriculum question for the director rather than a build item -- flagged, not taken, because targets are explicitly his (R13)."
- '2026-08-20 pass 38 BUILD, level HELD at 2, loop_stage stays build. PASS 37 BUILT THIS ATOM''S EXIT CRITERION AND THEN EXITED WITHOUT COMMITTING ANY OF IT -- the tick died between writing and landing, and the tree it left behind was indistinguishable from one where the work had never been done. This pass landed it, and then closed the gap that had refused it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 5f1553fea, with pass 37''s five artefacts UNCOMMITTED and its four earlier file_scope files clean.


  WHAT WAS ON THE FLOOR, AND HOW A READER CAN TELL IT MATTERED. `tools/cold_eyes_battery.py` (277 lines), `tests/tools/test_cold_eyes_battery.py` (223 lines, 19 tests), `docs/observability/cold_eyes_battery_reconciliation.jsonl` (12 rows), the store append and its roll to chunk 027, and the map''s count and file_scope -- all present on disk, all in NO commit. `git ls-tree -r HEAD` carried none of it. The 19 tests were re-run before anything else and pass in 0.33s; the store invariant suite (41 tests) is green either side. So the work was real, complete, and worth exactly nothing until this commit -- which is this project''s own most-recorded failure class (`CLASS_UNCOMMITTED_AND_ORPHANED_WORK`) landing on the atom that had just finished writing about controls that cannot fail.


  THE LANDING WAS REFUSED, AND THE REFUSAL WAS RIGHT. `python3 -m tools.surgical_land` on those six paths ran the real gate against the tree the commit would create and came back RED on the orphan ratchet: "THIS COMMIT ADDS WORK THAT NOTHING RUNS -- tools.cold_eyes_battery". Nothing imports it and no committed unit runs it; its own test file does not count, by design. Verified by the TREE and not by the tool''s exit code, which was 0 -- HEAD was still 5f1553fea afterwards (`feedback_verify_a_landing_by_the_tree_never_by_the_landing_command`). Pass 37 had built a criterion with a consumer that was a TEST, which is a document with an assertion in it, not a mechanism anything runs.


  THE BUILD ITEM THIS PASS TOOK, AND IT IS THE ONE PASS 37 FILED RATHER THAN FIXED. Its record ends: "The ceiling has no way to say ''the target is unreachable this epoch AND build work remains'' -- a fourth state its three answers do not cover -- and that is filed as a finding rather than fixed here, because fixing the ceiling in the tick where it refuses my own draw is the shape the director''s own instruction file warns about." That objection is spent one tick later: this tick was not refused by the ceiling, it was refused by the orphan ratchet, and the repair the ratchet demands and the repair the finding demands are THE SAME EDIT. `tools/discovery_pass_ceiling.py` now imports the battery at module level, which makes it a module the supervisor reaches (`background/supervisor.py:957`, `:1538`) and the ratchet green.


  WHAT `exit_criterion()` ADDS. For any saturated atom it reads whatever exit criterion the atom ACTUALLY HAS -- a recorded blind-review battery -- and splits it by who can pay: `unpayable` (outstanding AND `epoch_gated`, i.e. needing an act in a RESERVED class) against `payable` (ordinary build work). `None` for the 111 atoms with no walk on record; it invents no criterion. `decisions()` then renders the FOURTH answer when both halves are non-empty. Live on the tree right now, unedited from the CLI: "THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS ... 2 of this atom''s own recorded exit criteria need an act in a RESERVED class (Q9, Q15), so the level cannot move in this epoch however much is built; 7 are ordinary build work (Q2, Q3, Q5, Q6, Q10, Q13, Q14) and must keep being drawn. Do NOT record `infeasible_here`: its verdict retires the payable half."


  THE DISCRIMINATOR IS DERIVED, NOT DECLARED, which is what keeps it from being a fifth field nobody sets. `unpayable_here` is already a strict subset of `battery_outstanding`, so three states fall out of records that already exist: both halves non-empty is the fourth answer; unpayable with nothing payable IS `infeasible_here` and the verdict says so in those words; payable-only keeps the ordinary build decision untouched.


  R15, 8 NEW TESTS, THE MUTATION RUN AND NOT ASSERTED. MUTATION on the LIVE tree: EP6 itself is the subject -- `decisions()` must name both halves and every outstanding question by id, and the test says out loud that going red because the split collapsed is a fact worth being told. MUTATION on the discriminator, EXECUTED: replacing `if crit["payable"]:` with `if True:` reds `test_MUTATION_nothing_payable_left_is_the_THIRD_answer_and_must_not_be_masked` (1 failed, 5 passed) and the module was restored from a copy outside the repo in the same command, so the window was bounded. That direction is the dangerous one: telling a genuinely instrument-blocked atom to keep drawing work that does not exist is how an unbounded pass loop gets bought back. FAIL-SILENT, both sources separately: an unreadable ledger and an unreadable reconciliation each RAISE `CeilingUnavailable` -- `None` means "no criterion on record" and an unreadable one is the same VALUE and the opposite FACT. NULL CONTROLS: an entirely payable criterion keeps `STAGE_DECISIONS["build"]` verbatim, and an atom with no battery is byte-identical to before. R11-shaped: the CLI RENDER is asserted, not the return value, because this module already shipped a `decisions()` its own CLI did not print.


  FIXTURE ISOLATION, and it was not optional. `exit_criterion` is consulted for every saturated atom, so the 36 existing tests in that file would have silently read the REAL blind-review ledger through their fixtures. Both battery sources are now pointed at fixture files by `_point` (`feedback_new_draw_rung_needs_fixture_isolation`).


  EVIDENCE: `tests/tools/test_discovery_pass_ceiling.py` + `tests/tools/test_cold_eyes_battery.py` 62 passed; `tests/background/test_harden_rung_pass_ceiling.py` 9 passed; `tests/design/test_simplifications_store.py` 41 passed; `import background.supervisor` + `saturated_ids()` -> 24, so the module the supervisor draws through still imports.


  WHAT REMAINS FOR L3 IS UNCHANGED AND IS STILL NOT THIS PASS''S OPINION -- it is the blind reviewer''s closed set, and it now has a reader instead of a paragraph. Seven ordinary build items: Q13 (counterparty identity below the port -- independently re-verified this pass, the only repo-wide hits for SMKI/DTN participant identity/mutual TLS are `background/one_way_door.py:196` and a capability-door label, so the atom''s headline claim is true because the identity check is ABSENT from the path), Q10, Q14, Q5, Q2, Q3, Q6. Two epoch-gated: Q9, Q15.


  THE TARGET IS THE DECISION DUE, AND IT IS THE DIRECTOR''S (R13), so it is going to him by NTFY with a recommendation rather than being taken here: RECOMMENDATION -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to `EP19_counterparty_qualification_paths` (epoch 5), because `level_target: 3` cannot be reached in this epoch by any amount of work this seat can do, and an unreachable target is what has been buying the pass loop. The seven payable items keep being drawn either way; the target changes nothing about them, which is why this is a notification and not a hold.'
