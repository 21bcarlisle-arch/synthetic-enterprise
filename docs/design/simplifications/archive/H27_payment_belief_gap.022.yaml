simplifications:
- 'TWENTY-SEVENTH HOUR (2026-08-13, worker tick, H27 2->3 HARDEN draw). ON THE INSTRUMENT AND ON THIS ATOM''S OWN file_scope, which is what Hour #26 said the next Hour owed: it took two of the four leads that have sat payable-by-a-BUILD- draw-on-this-box for six Hours (D40 and D39), and both are one repair. THE DEFECT: `_DOOR_ROW_KNOWN_CLASSES` enumerates every class the Proof door''s row is known to carry and `_door_row_regions` refuses any class outside it, on a stated guarantee -- "a door that grows a fifth region fails the walk instead of rendering a figure nobody searches". THAT GUARANTEE IS FALSE FOR ANY REGION THE DOOR RENDERS WITHOUT A CLASS, AND THE ROW HAS FIVE SUCH ELEMENTS TODAY. Measured on the rendered pixel through the live page''s own JavaScript: the head''s two column divs, the `<details>`/`<summary>` of the components block, and the bar''s fill span. `re.findall(r''class="([^"]*)"'', row)` returns nothing for any of them -- they are not classes the census cannot name, they are elements it never looked at. A census keyed on an attribute cannot express the population of elements that do not carry the attribute. ONE OF THE FIVE RENDERS THE HEADLINE: the bar''s fill is `width:<barPct.toFixed(0)>%`, the figure clamped to [0,1], scaled by 100 and rounded to 0dp -- 0.11818 -> `width:12%`, 0.12931 -> `width:13%` on the two published books. It is invisible twice: to the class census because it carries no class, and to every literal sweep in this module because all of them search UNSCALED digits and `12` is among no rendering of 0.118. That is D39, reached from the population side rather than the precision side. AND THE CENSUS CANNOT TELL A WRAPPER FROM A REGION: its only response to any door change is the same stop-the-world refusal, discharged by appending a string, with the same one-line discharge available whichever it was -- its own comment says so and nothing tells the maintainer which one they are holding. THE SECOND INSTANCE, ON A REGION THAT IS DECLARED: `basis` is one of the four named regions, owned by the headline and searched for its digits every run, and on BOTH published books it renders `baseline g0 0.500 - raw 0.000 - measured <date>` -- INERT. Everything it prints is a designed constant, a quantity that renders 0.000 at the door''s own 3dp, or the run stamp. To the two-book discrimination rule every sweep here turns on, an inert region is indistinguishable from a region that does not render the figure at all, so this surface can never credit any figure with a site; the guard one level up cannot see it because it tests for a region that came back EMPTY, and a constant is not empty. Reported, not tuned (R12). WHAT LANDED (atom D40): (1) the population is the RENDERED ELEMENTS (`_DoorRowWalker`, `_door_row_surfaces`), path-keyed, each carrying the text it owns itself, so a wrapper is inert unless it prints something itself; (2) NOT derived from the door -- deriving the known-set from the render would make the subject its own population and every class the door emits would be known by construction, which is the fail-OPEN direction of the same mistake, so D40''s open question has a NEGATIVE answer and it is the answer that matters: what gets derived is the population, what stays declared is what each surface IS; (3) the classification is MEASURED -- across the two books already walked, does the element''s own text move, do any of its attributes move; (4) ATTRIBUTES ARE IN THE POPULATION, because a render need not be text, which is what makes the bar expressible at all; (5) the scaled render is held to the pixel -- the declaration states the scaling and the clamp, the check PREDICTS the rendered literal from the carrier and confirms it on every book, and the precision the scaling implies (decimals + log10(scale) = 2dp) is compared with the epsilon the figure is set from (4dp): COARSER, so no epsilon moves, and that is now a measurement rather than an absence of one; (6) the inert `basis` region is declared WITH ITS REASON, and a declared region measured inert with no stated reason is itself a finding. R15: TEN mutations each firing a NAMED finding, NINE of them by mutating the DOOR''S OWN SOURCE and re-rendering rather than by editing the measurement -- a classless span grown on the row rendering the figure (with the OLD class census proven silent on it in the same test, the defect stated as a control); a declared structural wrapper that starts printing the figure; a searched region gone CONSTANT (with the shipped empty-region guard proven silent, because the region is present and non-empty); a declaration that outlived its element; a render arriving in an ATTRIBUTE the declaration does not allow; the bar at toFixed(2) so the declared scaling no longer predicts the pixel; the bar at toFixed(3) WITH THE DECLARATION MOVED TO MATCH, so the prediction passes and the epsilon alarm fires alone at an effective 5dp against a 4dp epsilon; a row whose SHAPE is the book''s (an untested entry -- no bar span, a different chip), refused because aligning what two books have in common would report the elements they agree about and stay silent about the one only one of them renders; a walk that reached the door and recorded no census (FAIL-SILENT); and a single book (refused -- one row cannot tell a wrapper holding a constant from a region rendering the figure). NOT ALWAYS-RED: zero findings on the real books and on the fixture, the fixture''s population asserted EQUAL to the declared one rather than assumed, and the three-way split (3 text-movers, 1 attribute-mover, 15 inert) asserted as a measurement rather than a restatement of the declaration. R12: no published number and no published string moved -- this Hour touched no scorer; the change is entirely in what the reader-surface walk can see. THE LEVEL STAYS 2 FOR THE TWENTY-SEVENTH CONSECUTIVE HOUR, and the honest reason is narrower than most: nothing this Hour did makes the five published figures better or worse, and no epsilon, band, floor or collapse moved. What it establishes is that a surface of the PUBLIC door has been rendering the headline, at 2dp, to a census that could not have found it. Hour #4''s two-consecutive-clean-Hours criterion is at zero. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): (a) `raw 0.000` on the public basis line while the gap reads 0.118 -- either the raw gap really is ~0 and the basis line is telling the reader something surprising, or it is the render of a quantity that is not being carried, and nobody has asked; (b) the CLAMP is a limit nobody states -- outside [0,1] the bar renders nothing that moves, so a `worse than blind` gap (>1) and a leak (<=0) are pixel-identical at the bar to gaps of exactly 1 and 0, and the door has a `classifyGap` band for both; (c) this census is the H27 ROW''s -- the panel renders seven pairs through the same code and no other pair''s row has ever been walked element by element, which is Hour #18''s unanswered "whose Hour are the fabric rows'' 43 unreadable figures?" in its population form; (d) D35''s scoped build and Hour #21''s vacuous-in-isolation sibling control, a seventh Hour running; (e) D37-D43 exist only in this register''s prose and in no map cell, a sixth Hour running. FULL TEXT: docs/staging/WORKER_FINDING_THE_ROW_CENSUS_COULD_NOT_SEE_AN_ELEMENT_WITHOUT_A_CLASS_2026-08-13.md'
