simplifications:
- "2026-08-20 pass 30 BUILD, level HELD at 2, loop_stage stays build. CHANNEL E GETS THE CONFORMANCE QUESTION IT HAS BEEN OWED SINCE PASS 22, AND THE ANSWER IS 2 OF 2. This is the oldest un-progressed item on the atom -- \"four of six channels still have no conformance question; A, B, E and F are enumerated only\" has appeared verbatim in eight consecutive records (22-29) and moved in none of them. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD d7213b989, with this atom's four file_scope files CLEAN against HEAD before the pass -- checked first, because a landing defect and a control defect read identically from a record (pass 24's lesson).\n\n  THE RECORDED NEXT MOVE WAS NOT TAKEN, AND WHY, STATED FIRST SO IT IS NOT MISREAD AS AN OVERSIGHT. Passes 26-29 each recorded THE COLD-EYES WALK as next, and pass 29 said it should displace further build moves. It is still unrun, for the fifth pass, and the cause is unchanged and structural: this invocation is forbidden from delegating to a fresh instance, and a cold-eyes walk performed by the author of the thing is not one. That is a DIAL and not a wall (Rule 0), so holding the tick on it while an authorised build item sat undrawn would itself be the violation. The walk remains THE FIRST BLOCKER ON L3 and nothing in this pass discharges it.\n\n  WHAT THE WIDTH COULD NOT ASK. `enumerate_e` answers \"how many business-side Protocols are declared\" -- a WIDTH. The module's own docstring names the limit that leaves, verbatim: \"Channel E's list is a SUPERSET. It enumerates every `Protocol` declared business-side, not only those a world object satisfies -- deciding satisfaction needs a type checker.\" So the census could not tell a real wall crossing from company-internal typing, and it was blind to the failure mode that is SPECIFIC to this channel: structural typing means NEITHER SIDE DECLARES THE OTHER, so when a world-side class drifts out of shape, NOTHING BREAKS AT IMPORT TIME. There is no `implements` clause to go stale, no envelope to fail decoding, no version to mismatch. The company simply starts reading an attribute that is no longer there. Channels C and D cannot fail this way, which is why E needed its own question and not a copy of theirs.\n\n  THE MEASURED ANSWER: 2 OF 2, AND THE SUPERSET TURNED OUT TO BE EXACT. `company/billing/monthly_bill_assembly.py -> ReadArrival` is satisfied by `simulation/meter_reads.py::MeterReadEvent`; `-> ReadArrivalFeed` by `simulation/meter_reads.py::SimulatedReadFeed`. Both are real structural wall crossings; neither Protocol is company-internal; and ZERO company-side classes satisfy either, which is the reading that makes the world-side attribution mean something rather than being one satisfier among many.\n\n  NOT A PROSE SCAN, ON PURPOSE -- pass 29's discipline, applied to a second seam. BOTH Protocols NAME their world-side implementor in a docstring (\"the world's own `MeterReadEvent` satisfies it as-is\"; \"In the simulation that is `simulation.meter_reads.SimulatedReadFeed`\"). Reading those sentences would have scored the DOCUMENTATION as evidence the coupling holds -- and the docstring is exactly what stays true while the code drifts, which is the whole defect. Membership is computed from the class bodies on both sides by AST instead. WORKER_FINDING_A_COUPLING_STATED_IN_A_COMMENT_IS_FALSE_A_QUARTER_OF_THE_TIME_2026-08-13 is the filed class; both citations here happen to be TRUE, checked rather than assumed -- `company.interfaces.bill_assembly` re-exports both names, so the second one's path resolves.\n\n  THE UNIT IS THE (PROTOCOL, WORLD SATISFIER) PAIR, frozen in the baseline under `E_structural_satisfaction`, so the reading reds in BOTH directions: a world class that STOPS satisfying (the silent drift above) and one that STARTS satisfying (a crossing nobody has looked at). A Protocol that leaves the tree entirely is a PAYDOWN and passes -- the same split the width ratchet makes, applied to the finer unit, because a control that reds on its own success case gets relaxed and takes the real reds with it.\n\n  R15 PROVEN BOTH WAYS. FIVE MUTATIONS RUN, NOT ASSERTED, each against a probe tree built as `git archive HEAD` + this pass's files -- TWO full suites were in flight throughout (pids 2421650, 2424823), and mutating a shared module under a live suite is how this project has broken sibling lanes before. (1) THE WORLD RENAMES A FIELD (`MeterReadEvent.status` -> `read_status`): reds as DRIFTED, naming the Protocol and the satisfier that stopped satisfying. (2) A NEW WORLD CLASS SATISFIES: reds as an unexamined NEW crossing. (3) FAIL-OPEN -- the SIM trees yield no classes: REFUSES with \"empty satisfier population\", because every Protocol would otherwise read as company-internal and print the reassuring answer from a measurement that looked at nothing. (4) VACUITY -- a Protocol emptied of members: REFUSES, since a requirement of no members is a subset of every class in the tree and emptying it is the cheapest way to make this check say anything you like. (5) NULL CONTROL ON THE SUBJECT SET -- a COMPANY-side class given the exact members: stays GREEN, because `SATISFIER_DIRS` is `SIM_PACKAGES` and not `WALL_DIRS`; without that pin the control is satisfiable by a test double and would report crossings that do not exist. ATTRIBUTION IS PER-MUTATION: 1 fires `drifted` only, 2 fires `appeared` only, 3 and 4 raise, 5 fires nothing. NULL CONTROL: the same probe tree unmutated, same command, green.\n\n  IT GATES FROM ITS FIRST COMMIT, which is the rule this file has now stated three times: a check becomes a gate \"in the same commit that makes it satisfiable\". It has no landing-order excuse to wait for -- both crossings are green at HEAD and the freeze records that reading -- so the only commits it can refuse are commits that break a structural crossing or add one. Wired into `tools/pre_commit_test_gate.py::_wall_channel_census_check` (the CLI is typed by nobody; channel C spent passes 19-22 green in the tool and unarmed in the gate) with its own fail-closed branch, and asserted against the file rather than described.\n\n  THE FIXTURE LESSON, THIRD TIME OF ASKING, so it is mechanised rather than re-learned. Arming a fourth half of `_wall_channel_census_check` broke EIGHT existing gate tests: each forces the OTHER halves green so a refusal is attributable to the half under test, and the new half ran real against the fixture's fake index tree `\"0\"*40`, raised, and hit its own fail-closed branch -- so channel C's and D's NULL CONTROLS failed while looking like defects in channel C and D. The three hand-written pin-lists are now one `_pin_the_other_halves` helper, so a FIFTH half pins itself everywhere at once. Observed, not predicted: the eight reds were run before the fix.\n\n  TEST COUNT, AST-COUNTED OFF THE TREE AND NOT FROM THE PLAN: `tests/tools/test_wall_channel_census.py` holds 153 test functions against 136 at HEAD -- 17 new. `python3 -m tools.epistemic_verifier --all` PASS over 541 company/ + saas/ files; `tests/tools/test_pre_commit_test_gate.py` 38 passed; full census CLI exit 0.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * THE COLD-EYES WALK IS STILL UNRUN and is now FIVE passes older. Still the first blocker on L3. See the second paragraph for the cause; it is not that the work was judged unnecessary.\n    * SATISFACTION IS NAME-LEVEL, NOT TYPE-LEVEL. Members are compared by NAME; a world class that keeps `status` and changes it from `str` to `int` still reads as a satisfier. The census docstring's \"deciding satisfaction needs a type checker\" remains true of the strict question -- this answers the name half of it, which is the half that catches renames and deletions.\n    * INHERITED MEMBERS ARE NOT RESOLVED. `_class_members` reads one class body, so a world class inheriting a required member from a base reads as a NON-satisfier. That is the safe direction (it would red as drift and be looked at, never pass silently), and neither live satisfier inherits.\n    * TWO OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION -- A and B are enumerated only, down from four. Their enforcement has an owner (`WALL_CROSSING_DISPOSITION_REGISTER.md`), which is why they were the ones left; F is now the only unowned gap.\n    * THE BASELINE IS READ FROM DISK, NOT FROM THE COMMIT'S TREE, matching `load_baseline` beside it exactly. Diverging unilaterally would make the two halves of one gate step read different trees, which is its own filed defect class -- recorded as a property of the whole step rather than fixed for one half.\n\n  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the fixture breakage is this atom's own subject, found by arming its own control and closed in the same pass.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): THE COLD-EYES WALK, unchanged and now the only thing standing between this atom and an L3 claim, with channel F's conformance question as the build move behind it. The walk must be run by an invocation permitted to delegate; if five more passes cannot do it, the honest move is to record that this atom cannot reach L3 under the current invocation constraints rather than to keep deferring it one pass at a time."
