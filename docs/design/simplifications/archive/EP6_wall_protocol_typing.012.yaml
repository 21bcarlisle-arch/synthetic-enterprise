simplifications:
- "2026-08-19 pass 12 BUILD, level HELD at 2, loop_stage stays build. THE VERSION IS NOW ON\nTHE WIRE. This pass does the one thing pass 11 recorded as the next move, verbatim: \"migrate the three\nlive port call sites onto include_schema_version=True, so schema_version leaves the process on channel D\nfor the first time\". Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD c728642c3, worktree, with this atom's file_scope clean before the pass.\n\nTHE BEFORE-STATE, MEASURED ON THE PUBLISHED ARTEFACT RATHER THAN ASSERTED. Reading\ndocs/reports/run_output_latest.json at HEAD: meter_read_log 1600 rows, contact_centre_log 392 rows,\nacquisition_funnel_log 4 rows -- 1,996 channel-D rows in total, and ZERO carrying a schema_version.\nExactly what the 2026-08-15 census predicted four days ago and what pass 11 re-measured: the field was\nstructurally present on every port message and populated on none of them.\n\nWHAT CHANGED, THREE LINES. The call sites are simulation/run_phase4c_on_phase2b.py (meter reads,\ncontact centre) and simulation/run_phase2b.py (acquisition funnel), all three now\n`to_log_entry(include_schema_version=True)`. Purely additive on the wire: every consumer reads named\nkeys (`company/compliance/population_sanity.py`, `saas/reporting/annual_report.py`,\n`tools/generate_dashboard_data.py`, `tools/population_anchor.py`, `tools/generate_shadow_html.py` all\nchecked), no consumer asserts an exact key set, and there is no run-output schema validator to refuse a\nnew field. `from_log_entry` already defaulted the field, so old artefacts still load.\n\nPASS 11'S OWN LINE NUMBERS HAD DRIFTED -- it named :237, :324 and :1647; the sites were at :270, :357\nand :1705. Recorded because a \"next move\" written as a line number is a pointer that rots: the file\npath plus the expression found them, the number did not.\n\nTHE CONTROL, AND WHY IT IS NOT A BIGGER ENUMERATOR. `enumerate_d` counts IMPORTERS of a port. A port\ncan be counted by it, declare `schema_version`, and emit it nowhere -- which is precisely the state\nthat held for four days without any control noticing. A count of importers is blind to that by\nconstruction, so `wire_conformance()` is a separate function in tools/wall_channel_census.py: it finds\nevery `X.to_log_entry(...)` outside the port modules and asks whether the call sets the flag TRUE.\n\nR15 -- 14 new tests, 39 in the file, both directions shown.\n  THE MUTATION FOR THIS CONTROL IS REAL REPO HISTORY, NOT A FIXTURE. `wire_conformance_at(rev='HEAD')`\n  is RED at c728642c3 and names exactly the three sites this pass repaired; the worktree is GREEN.\n  Separately, reverting ONE shipped call site by hand turned test_THE_LIVE_WIRE_CARRIES_THE_VERSION red\n  naming simulation/run_phase2b.py:1710, and restoring it turned it green.\n  MUTATIONS THAT MUST FIRE: a call site omitting the flag; the flag passed as False (naming the keyword\n  is not carrying the version); a SECOND caller omitting it while the first still carries.\n  FAIL-CLOSED, and the first branch is the one that matters: DELETING THE PARAMETER FROM THE PORT is\n  the cheapest way to make this control pass, so ports-exist-and-none-declares-the-flag RAISES rather\n  than passing. Ports declaring the flag with no caller at all raises too -- an empty denominator makes\n  channel D vacuously conformant, channel F's own doctrine applied to a second channel.\n  ZERO IS NOT REFUSED: no ports at all returns a clean verdict, because channel D fully paid down is\n  this atom's success case and a control pinned to a non-zero count reds on its own success\n  (feedback_a_control_pinned_as_a_count_reds_on_its_own_success_case).\n  NULL CONTROLS THAT MUST NOT FIRE (move the sample, not the law): a port's OWN nested serialisation --\n  acquisition_funnel_port calls to_log_entry() on its FunnelStageMessage rows, whose serialiser takes\n  no flag, and counting it would make the control permanently red for a reason its subject cannot fix;\n  an unrelated module; and simulation/meter_reads.py's free function `read_event_to_log_entry`, which a\n  bare-name match would have swallowed.\n  INDEPENDENCE: the verdict's subject is program text on disk, not a value the module derives from\n  itself -- test_the_wire_check_reads_the_TREE moves only the call site and the verdict moves with it.\n\nTHE CALLER IS THE COMMIT. `_wall_channel_census_check` in pre_commit_test_gate now runs the wire check\nagainst the same `git write-tree` the census step uses, fail-closed on a raise, so a commit that makes\na port message cross silently is refused before it lands rather than found four days later.\n\nTHE ARTEFACT HALF IS REPORTED AND DELIBERATELY NOT GATED. `wire_on_artefact()` counts, per published\nkey, how many rows carry a version -- the R11 half, because only the artefact proves the version\nARRIVED. It is not in the gate, and a test asserts that: the artefact is regenerated by a SIM RUN, so\nflipping a call site cannot move a single row until the next run publishes. A gate on it would red the\nvery commit that repairs the defect and pass the one that introduced it -- the ordering trap this file\nalready learned once for channel F.\n\nTHE SIX CHANNEL COUNTS DID NOT MOVE (3/2/19/7/2/131) and the baseline needed no re-freeze. Channel F\ncounts TOP-LEVEL keys, and schema_version is a key inside a log ROW, so widening the row does not widen\nthe channel. Checked rather than assumed.\n\nWHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later:\n  * THE VERSION HAS NOT YET ARRIVED ANYWHERE. Every published artefact in the repo still reads 0/1,996.\n    The code now asks for the version; only the next sim run can show it on the wire. R11 is half\n    satisfied on purpose and the missing half is named, not glossed.\n  * The nested `stages` rows inside acquisition_funnel_log still carry no version. FunnelStageMessage\n    has no version field to carry; the version is borne once by the envelope row. Not a defect, but it\n    means \"every channel-D row carries a version\" is false at one nesting level down.\n  * `wire_call_sites` matches the method by NAME on an attribute call, so a port message serialised\n    through an alias or a computed getattr is invisible -- a LOWER BOUND, the same limit\n    `_literal_key_reads` already carries for channel F.\n\nL3 IS NOT CLAIMED, and the reason has moved on from pass 11's. Pass 11 held for two reasons: (a) no\nHARDEN pass against freshly-written code, and (b) channel D's named substance undone. (b) IS NOW DONE.\n(a) still stands -- this pass again wrote new code, and the map's L3 definition is \"passed the full loop\nincl. HARDEN; Expert Hour: this is real\". Added to it is the R11 gap above: an atom whose headline is\n\"the wall carries versioned messages\" should not move to L3 while every published artefact still shows\nzero of them.\n\nNEXT MOVE, named so the next pass does not re-derive it: after the next sim run publishes, run\n`wire_on_artefact(artefact_at('HEAD'))` against the committed artefact and confirm the three logs read\n1600/1600, 392/392 and 4/4 rather than 0. That closes R11 on this atom with a fetched value rather than\na fixture, and it is the last thing standing between here and a HARDEN pass toward L3."
- "2026-08-19 pass 13 BUILD, level HELD at 2, loop_stage stays build. PASS 12 IS LANDED AND\nTHE CONTROL IS BLOCKING AGAIN. Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 2227083c8.\n\nTHE FINDING THIS PASS OPENED WITH -- PASS 12 WAS IN NO COMMIT. `git grep include_schema_version HEAD --\nsimulation/` returns EMPTY at 2227083c8; all three migrated call sites existed only in the working tree.\nPass 12's own record was uncommitted beside them, and the maturity-map cell it wrote says, verbatim,\n\"LANDED VIA A WORKTREE SWAP ... this commit's tree is HEAD plus the three EP6 hunks only\". A landing\nclaim that exists only in the working tree is self-refuting: the tree it describes was never created.\nTwo commits (c728642c3, 2227083c8) went past it, neither carrying the code. This is the\nuncommitted_and_orphaned_work class again, on the atom that had already recorded the same class twice\n(pass 10 landed pass 9's uncommitted L2; pass 12 was landed by nobody until now).\n\nWHAT PASS 12 CLAIMED THAT IS TRUE, RE-MEASURED RATHER THAN INHERITED. Its artefact claim holds on the\nLIVE artefact: `wire_on_artefact(docs/reports/run_output_latest.json)` reads meter_read_log 1600/1600,\ncontact_centre_log 392/392, acquisition_funnel_log 4/4 -- 1,996 of 4,542 published rows now carry a\nschema_version, against zero four days ago. The scope limit pass 12 stated is also still true and is\nnot narrowed here: the COMMITTED copy of that artefact reads 0, because the publish path never refreshes\nthe tracked file, so `wire_on_artefact(artefact_at('HEAD'))` still reports zero. R11 is satisfied on the\nlive artefact and unsatisfiable on the committed one until that publish question is ruled.\n\nTHE CONTROL WAS DOWNGRADED TO REPORTING-ONLY, AND THAT WAS A LANDING-ORDER DEFECT WEARING A CONTROL\nDEFECT'S CLOTHES. An uncommitted edit to `_wall_channel_census_check` printed the wire verdict and\nreturned ok, with a written reason: committed code had three silent sites, so the check refused EVERY\ncommit in the repo, the publisher's included. The reason was accurate and the remedy was aimed at the\nwrong half -- the rule was right and its subject was merely unlanded. Landing the sites makes it\nsatisfiable, so this pass restores BLOCKING in the SAME commit that makes it pass, which is the only\ncommit in which restoring it is honest. Measured before restoring, not hoped: `wire_conformance_at`\nagainst a probe tree of HEAD + this atom's four code files reports all 3 sites carrying; against HEAD it\nreports all 3 SILENT and names them. A gate no commit can satisfy stops the line; a gate every commit\nsatisfies by construction is not a gate. This one now refuses exactly the defect it is named for.\n\nR15 ON THE CALLER, WHICH IS THE HALF THAT WAS MISSING. The enumerator had 39 tests and every one of\nthem proved the VERDICT right. None asked whether the caller acts on it -- and for one commit it did\nnot. Three new tests (42 in the file), all on `_wall_channel_census_check` with the census half forced\ngreen so the result is attributable to the wire half alone:\n  MUTATION: a verdict carrying one silent site must return (False, ...) and the refusal must name the\n  site (R5, diagnostic payload). PROVEN BY REVERTING THE SHIPPED BRANCH: with the reporting-only body\n  restored by hand, this test and ONLY this test goes red; the file was restored byte-identical after.\n  NULL CONTROL: same caller, same forced-green census, only the wire verdict changes -- a conformant\n  verdict must PASS. Without it, the mutation above is satisfied by a gate that refuses everything.\n  FAIL-CLOSED: the wire check raising must refuse, not skip (R15 FAIL-SILENT -- an unavailable check is\n  a failed check). The existing UNAVAILABLE-import branch already covered the module; this covers the\n  call.\nA control invoked by a caller that discards its verdict is a control that cannot fail, and no amount of\ntesting the control itself can see that -- the test has to be on the caller.\n\nALSO RECORDED: the \"three uncommitted lanes\" pass 12 named in the two call-site files are GONE from the\ntree -- `git diff HEAD` on both files shows the EP6 hunks and nothing else, so no worktree swap was\nneeded there. The map DID need one: its EP6 and EP1 cells both carry unlanded pass-12 counts, and\nlanding EP1's count without EP1's store note would red the store-count invariant that couples them. The\nmap was swapped to HEAD-plus-this-atom's-cell for the commit and the other lane's hunk restored after.\n\nWHAT THIS PASS DOES NOT ESTABLISH:\n  * THE COMMITTED ARTEFACT STILL READS ZERO. Unchanged from pass 12 and deliberately not papered over.\n  * NO HARDEN PASS. This pass wrote new test code and restored a gate branch; the map's L3 definition\n    requires the full loop including HARDEN and an Expert Hour, and neither has run against any of the\n    code written on this atom since pass 11. That is the whole reason the level is held at 2 -- the\n    substance of L3 is now built, and the evidence for it is not.\n\nNEXT MOVE, named: HARDEN. Nothing on this atom is unbuilt any more; what is missing is an adversarial\npass over freshly-written code by something that did not write it. Rule the committed-artefact question\nin the same pass -- either the publish path refreshes docs/reports/run_output_latest.json and\n`wire_on_artefact(artefact_at('HEAD'))` becomes a real R11 check, or the tracked copy is ruled a stale\nsample and the check stops pretending to read it."
