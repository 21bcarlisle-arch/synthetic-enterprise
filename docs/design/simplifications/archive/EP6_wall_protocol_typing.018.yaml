atom_id: EP6_wall_protocol_typing
chunk: 18
simplifications:
- '2026-08-20 pass 21 BUILD, level HELD at 2, loop_stage stays build. THE VERDICT''S UNIT MOVES FROM THE SEAM TO THE CROSSING. This pass does the one thing pass 20 recorded as the next move, in the order it recorded it: "make `envelope_wire_conformance` LEG-AWARE before migrating `flex_observable_seam`" -- the control before the last migration, so the migration lands against an instrument that can see it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD baf496f97, worktree, this atom''s file_scope clean before the pass.

  THE DEFECT, PROVEN BY MUTATING THE CONTROL RATHER THAN ASSERTING IT. A seam resolves in two crossings separated in time -- the company EMITS a `WallRequest`, later OBSERVES a `WallResponse` -- and the old rule credited the SEAM as wire-borne on any one encoder and any one decoder ANYWHERE among its importers. Built a fixture whose response leg is fully wired and whose request leg is handed over as a Python object, then ran BOTH rules over the identical tree: leg-blind reports `wire_borne=[conversation_seam, payment_observable_seam]`, leg-aware reports `[payment_observable_seam]` with `request=DECODED-only, response=wire`. The mutation was applied to the CONTROL (leg ownership made unreadable, forcing the fallback), which is the only way to show the reading this replaced was actually wrong rather than merely coarser.

  THE CORRECTION THAT MATTERED, AND PASS 20''S PLAN WAS WRONG ABOUT IT. That plan assumed encode sites are recognised by the SHAPE they emit -- true of the counterparty, and the first leg-aware run therefore reported `conversation_seam` as `request=DECODED-only` and dropped the live reading from 2 of 3 to 1 of 3. That was a FALSE ALARM ON THE ARCHITECTURE''S OWN CORRECT ANSWER: `conversation_generator.generate_wire_request` calls `wall_protocol.encode_request` and builds no dict at all, because the company OWNS that codec and is supposed to use it. THE WALL IS WHAT MAKES THE ASYMMETRY, and it cuts both ways: `simulation/**` may not import `company.*`, so the counterparty CANNOT decode through the codec and instead mirrors the contract''s exact key set (`conversation_response._REQUEST_WIRE_FIELDS`) and refuses against it. So each side has TWO lawful shapes -- codec entry point, or own bytes against the published key set -- and a detector knowing one shape per side red-lists a leg for being written the way the wall requires. That is the most expensive kind of false alarm, because the repair it invites is to break the wall. Both halves are now symmetric (`_encoded_legs`/`_decoded_legs`) and each shape has its own test naming the wall as the reason it exists.

  DORMANT IS A THIRD ANSWER, AND PASS 20''S RECORD STATED THE PREMISE FOR IT WRONGLY. That record justified the design by saying `payment_observable_seam` "honestly has only the inbound leg". It does not: it declares `PaymentCollectionWallRequest = WallRequest[CollectionRequest]`. Under the rule as written, payment would have been red-listed for a leg it genuinely declares -- the opposite of the record''s own stated intent. What is TRUE is that no module anywhere constructs a `CollectionRequest` (its only construction in the repo is inside the contract''s own test, and tests are outside CENSUS_DIRS). So the contract describes a message this build does not yet exchange. Transport evidence alone cannot tell that from an unmigrated crossing, because "never encoded, never decoded" is what BOTH look like; the discriminator is whether the payload type is CONSTRUCTED anywhere in the census trees. DORMANT is reported and not scored -- scoring it would make the control permanently red for a reason its subject cannot fix without deleting the contract, which is the shape of a control that gets tuned away. Its null control is one statement long: construct the payload and nothing else, and the leg leaves the unscored bucket immediately.

  THE LIVE READING IS UNCHANGED AT 2 OF 3 AND IS NOW LEG-PRECISE, which is the point -- a control that moved the headline would have been changing the answer rather than sharpening the question. `conversation_seam [request=wire, response=wire]`, `payment_observable_seam [request=dormant, response=wire]`, `flex_observable_seam [request=dormant, response=IN-PROCESS]`. The last line is the whole remaining claim: ONE leg, on one seam.

  WHAT THIS BUYS THE NEXT PASS, stated as the thing that is now impossible. Wiring `flex_observable_seam`''s DORMANT request leg would have flipped the old count to `3 of 3` and been believed -- a real encoder and a real decoder for a real declared leg, with the live crossing still on the call frame. It is now a no-op on the verdict, and there is a mutation that runs exactly that edit and asserts the verdict does not move.

  TWO FAIL-OPENS THIS DESIGN CREATES, BOTH NAMED AND BOTH CLOSED. (1) SELF-CERTIFYING: the mirror half of the decoder rule makes it reachable for ONE module to both emit a leg''s shape and restate its key set, satisfying "an encoder exists" and "a decoder exists" by itself while nothing crosses. A wire has two ends, so a leg counts as transported only when the encoder and decoder sets are not the same single module; the mutation runs that module and the leg reads ENCODED-only. (2) DELETING THE LEG ALIASES: ownership is read from the seam''s own `WallRequest[...]` specialisations, so a one-line delete makes the leg-aware rule inapplicable. The fallback to the leg-blind rule is correct -- never weaker than what it replaced -- but it must not happen QUIETLY, or the cheapest way to silence a red leg becomes deleting the line declaring it. Legless seams land in their own reported bucket, and a LIVE test asserts that bucket is empty, because every fixture test would still pass while the live control silently reverted.

  R15: 13 new proofs (`tests/tools/test_wall_channel_census.py` section 15, 85 to 98 in the file). Six mutations RUN, each isolated by a null control: one leg unwired on the request side, the same on the response side, wiring only a dormant leg, a self-certifying module, deleted leg aliases, and an unrelated module that must not move any leg state. The live pair follows section 14''s discipline -- ANSWERABLE, not GREEN: every scored seam must resolve to a per-leg state and at least one live leg must read `wire`, so the control has answered in its own success direction, but WHICH legs are wired is deliberately unpinned because pinning it would red the commit that migrates the last one.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate `flex_observable_seam`''s RESPONSE leg -- the only scored IN-PROCESS leg left on the wall. Its payloads (`FlexDispatchInstruction`, `FlexSettlementLine`) are constructed in `sim/flex_dispatch.py`, so the counterparty end grows its own encoder against the published key set, and the company end (`company/market/flex_participation.py`) decodes through `wall_protocol.decode_response`. The request leg is DORMANT and must be left alone: wiring it proves nothing and the instrument now says so.

  FOUND IN PASSING, QUEUED NOT FIXED (SELF_INTERRUPT_DISCIPLINE). `tools/wall_crossing_dispositions` is RED on the live tree -- `simulation.run_phase2b -> company.policy.decision_policy` is ruled `cut` while the import is still present. Verified present at HEAD as well as in the worktree, so it is neither mine nor a working-tree artefact, and it is another register''s subject with its own owner (that register''s doc is currently dirty in the shared tree, so a lane appears to be on it). Not touched: it is outside this atom''s file_scope and fixing another lane''s red on sight is the treadmill this rule exists to stop.'
