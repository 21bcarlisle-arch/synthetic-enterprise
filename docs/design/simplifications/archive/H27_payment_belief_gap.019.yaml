simplifications:
- 'TWENTY-THIRD HOUR (2026-08-13, worker tick, H27 2->3 HARDEN draw), and the Hour''s own act was VERIFY-AND-LAND rather than build: THE RECORD THAT ANSWERS THE DRAW IS KEPT CURRENT AGAINST THE OTHER RECORD, NEVER AGAINST THE TREE. Hour #22 closed by naming this Hour''s brief in its own words -- ''Hour #21''s three open leads (D39, D40, and the vacuous-in-isolation sibling control) are untouched by this Hour''. Observed-with-evidence: the repair for the third of those leads was ALREADY COMPLETE AND UNCOMMITTED IN THE WORKING TREE when this Hour drew. At HEAD 1f1b09893 the test file contains the string `renderer_provenance` ZERO times; the working tree contains it five times, across +162/-15 lines in `tools/couple_w2_11_d5.py` and `tests/tools/test_couple_w2_11_d5.py`, every docstring self-labelled ''atom D38, H27 Expert Hour #22''. The committed register names D38 once. So Hour #22 authored D38, described it in prose, listed the lead D38 repairs as OPEN, and landed neither. THIS IS D41''s DEFECT ROTATED 90 DEGREES, WHICH IS WHY D41 CANNOT SEE IT: `map_assertion_provenance` asks whether the LATEST RECORDED HOUR IS ANSWERED IN A RECORD THE DRAW READS -- record against record. Both records were perfectly current with each other and both were wrong about the tree. The register is a claim about what LANDED, and nothing compares it to what is committed. Under this shape the next draw rebuilds work that already exists, or -- worse, and the near miss here -- a later concurrent commit sweeps a half-verified change in under another lane''s message. NOT REBUILT (memory: a draw may already be built and unlanded in the working tree). VERIFIED, THEN LANDED, in that order. WHAT D38 IS, restated from the code rather than from Hour #22''s prose: `renderer_in_note` compares the string the WALK''s renderer produces against the note the COMPOSER wrote -- two independent resolutions of one name, since the composer binds its renderers `from background.gap_metric import ...` at ITS import time and the walk re-resolves them from the module at walk time. `_composer_renderer_bindings` now records, per book and per dimension, the renderer OBJECT the composer''s own namespace held, resolved by name and then by `__name__` (the composer aliases `format_detection_summary`, and an alias is the same object under a different label). `measure_reader_render_sites` derives `renderer_provenance` from it and `check_reader_render_sites` REFUSES on every state but `the_composers`: where the walk executed a renderer the published artefact never saw, a divergence is the SWAP''s and not the composer''s, and -- the worse direction -- the ABSENCE of a divergence means both sides moved together and the seam was never measured at all. THE LEAD IS DISCHARGED BY MEASUREMENT, NOT BY ASSERTION: the two named controls now PASS RUN ALONE (`test_a_composer_that_stops_carrying_a_renderers_string_fires`, `test_a_walk_that_swapped_the_renderer_measures_the_swap_not_the_seam`, one node id each, 2.7s each), which is the exact condition Hour #21 filed them as failing -- their subject when run alone was not the seam they named, because they depended on an earlier test in the file having imported the composer. Order-dependence is gone because the composer-side mutation no longer needs the import to have happened first. R15, run by this Hour against the tree it was about to land, not quoted from Hour #22: FOUR source mutations, each firing a NAMED test, no survivors, md5 byte-clean restore (`1cf3a72f775c7c5246522eeea7683b1c` before and after) -- (1) the provenance refusal branch made unreachable, FAIL-OPEN, reds two of the three; (2) a book carrying no provenance record degrades to `the_composers` instead of `unrecorded`, FAIL-OPEN ON MISSING, reds `test_a_book_that_records_no_renderer_provenance_fails_closed`; (3) the alias fallback deleted, so the aliased renderer reports as held by nobody, reds the same; (4) `all(h is fn for h in held)` forced true so provenance can never say `not_the_composers`, TAUTOLOGY, reds the swap control. Not always-red: 3 pass unmutated and 442 pass on the file (was 440 at Hour #21). R12 -- NOTHING COMPUTED MOVED, and it is measured rather than argued: on the shipped walk all four walkable dimensions report `the_composers` (`belief_population_mix` `None`, it declares no renderer), so not one D38 refusal fires and `check_reader_render_sites` returns exactly the door-stage set it returned before. ruff: 4 pre-existing findings on these two files, unchanged, none added. DELIBERATELY NOT TOUCHED, and the reason is a live hazard rather than an omission: the H27 MAP CELL''s `expert_hour.last` and `simplifications_count` are left stale, because `docs/design/maturity_map.yaml` carries THREE other lanes'' hunks already in the shared index (H_GAP''s L3 certification, KNIFE3 step 21, OPS13) and a pathspec commit touching that file would carry them. The verdict for the draw is therefore written where the sibling atom writes it -- in this entry, which is the shape D41 accepts. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): (a) the general control this Hour''s finding asks for -- a register claim of LANDED checked against what is committed, not against another record; (b) Hour #21''s leads D39 and D40, untouched again; (c) Hour #22''s own queued finding that D37-D41 exist only in this register''s prose and in no map cell. THE LEVEL STAYS 2 FOR THE TWENTY-THIRD CONSECUTIVE HOUR, and the count is now the measurement: Hour #4''s two-consecutive-clean-Hours criterion has read ZERO for nineteen straight Hours because the Hour protocol REQUIRES each Hour to leave an opener, so the criterion re-arms itself every time it is approached. That is the self-regenerating sub-class named in the 2026-08-13 fifteen-draws report, now with a second instance and a longer chain. It is NOT renegotiated here -- an exit test is a WALL -- and the exclusion that would act on it is the queued `infeasible_here` BUILD-draw change in `background/supervisor.py`, out of this atom''s file_scope.'
- 'TWENTY-FIRST HOUR (2026-08-12, worker tick, H27 2->3 HARDEN draw), on Hour #20''s leads 1 and 2, one repair: A VALUE TEST DECIDED WHOSE RENDER THE DOOR WAS. `has_door_carrier` admitted a dimension to the door surface only where its carrier EQUALLED the panel row''s value -- a VALUE test doing PROVENANCE work, which is the exact shape Hour #19 named for `cross_attributed` and then left standing in the gate one level up. THE TWO CONSEQUENCES POINT OPPOSITE WAYS, which is why neither showed as a wrong number: it EXCLUDED the four companion figures from a surface that demonstrably renders them -- the panel prints the composed note verbatim and every companion''s own renderer''s digits are in it -- and it would have handed the WHOLE panel, `fmtGap`''s 3dp and every 4dp numeric component, to any companion that happened to equal the headline. Today nothing else does equal it, so the gate read clean on a coincidence: measured, the headline passes the restored value gate and `belief_population_mix` does not, while the panel row''s own value passes it -- i.e. a companion made equal on both books is admitted to `gap-val` and `components` outright. WHAT LANDED (atom D37). (1) THE DOOR IS NOT ONE SURFACE: its row is four regions with four different provenances -- `gap-val` (`fmtGap(p.value)`, the ledger CARRIER re-rendered at 3dp, owned by the dimension the composer handed the ledger writer and by no other), `note` (the composed note printed VERBATIM, so it carries every figure''s own renderer''s digits and is owned by each figure in turn), `components` (`fmtComponent`/`flattenNumbers` re-rendering every finite numeric leaf of the HEADLINE''s components at 4dp) and `basis` (`baseline_g0`/`raw_gap`, also `fmtGap`). Split off the html the page produced, keyed by the door''s OWN class attributes rather than by position, and the row must contain no class the walk cannot name -- a door that grows a fifth region FAILS the walk instead of rendering a figure into a surface nobody searches. (2) THE HEADLINE BY IDENTITY, NOT BY DIGITS: the composer is spied at the seam it actually crosses (`write_gap_entry`) and the answer is the `GapResult` OBJECT it passed, matched with `is`; more than one match, or none, refuses -- an unresolved provenance owns nothing, `<ambiguous>` matches no dimension, so every region cross-attributes and the register cannot resolve it into silence. (3) ALL FIVE FIGURES NOW DECLARED WHERE THEY ARE IN FACT RENDERED ON THE DOOR: ageing `note`@3, belief `note`@4, mix `note`@4, detection `gap-val`@3 AND `note`@4, latency `note`@2. (4) THE VERBATIM SEAM IN THIS INSTRUMENT''S OWN UNITS: four of the five figures'' door coverage rests entirely on the panel printing the entry''s note unchanged, and `note_verbatim` tests that on the note''s first 60 characters only; every precision at which the door''s note renders a figure must now equal every precision at which the ENTRY''s note renders it, or it fires -- without it the companions'' door coverage is coverage by coincidence one hand-off down, the shape Hour #20 named and this Hour found still standing. (5) `components` IS NOW A SEARCHED SURFACE: neither sweep could express it before (the component sweep searches the entry''s STRINGS; the old door search was one string open to one dimension). It renders none of the five published figures today, so no epsilon rests on it -- and that is now a measurement rather than an absence of one. R12: this Hour changed what is MEASURED, never what is computed. Every door site is at a precision the figure already had, so NO EPSILON MOVED: `published_reading_decimals` is unchanged at ageing 3 / belief 4 / mix 4 / detection 4 / latency 2, and `check_reader_render_sites` is empty on the shipped walk. R15: five source mutations, each firing its own named test -- the restored value gate pointed at a companion made equal to the headline; a door region the walk cannot name; a region that VANISHED (which reads to a value sweep exactly like a region rendering nothing); a door note diverging from the entry''s note; and a composer that stops crossing the ledger seam. 440 passed on the atom (was 433). ruff: 5 -> 4 pre-existing findings on these two files, none added. THE MUTATION THIS HOUR''S OWN LANDING HAD TO REPAIR, and it is the Hour''s lesson turned on itself: the seam mutation neutralised the module ATTRIBUTE `live_payment_triad.write_gap_entry` -- but that attribute is precisely what `_publish_one_book`''s spy wraps, so the spy still counted one crossing, the provenance check passed, and the run died on the absent ledger file (FileNotFoundError) rather than on the refusal it was written to prove. A mutation that patches BOTH sides of the seam it tests proves nothing about that seam. It now mutates the CALL SITE instead -- the composer routes the write around the spied name, through the test module''s own import-time binding to the same function -- so the ledger is still written, the seam is genuinely not crossed, and the named refusal fires. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): Hour #20''s sibling control `test_a_composer_that_stops_carrying_a_renderers_string_fires` is VACUOUS in isolation. It depends on earlier tests having seeded `_PUBLISHED_BOOKS`: run alone the books are composed AFTER the patch, so composer and walk both use the mutated renderer, they agree, and the control reports no divergence. It FAILS standing up rather than passing, so it is loud rather than fail-open -- but its subject when run alone is not the seam it names. Proven PRE-EXISTING at HEAD (43a456cba) in a detached worktree, so it is not this Hour''s regression; filed as a finding. Level stays 2 for the TWENTY-FIRST consecutive Hour.'
- 'TWENTY-SECOND HOUR (2026-08-12, worker tick, H27 2->3 HARDEN draw), and this one is in the GOVERNANCE RECORD rather than the instrument: THE RECORD THAT ANSWERS THE DRAW IS NOT REQUIRED TO BE CURRENT, AND NOTHING ASKS. The self-refill drew this atom 2->3 and the promoter read `level_hold_note` -- the one record whose whole job is to answer that draw -- and was handed Hour #19''s leads for Hours #19, #20 and #21 that had all already run, landed and recorded themselves in `simplifications`. This note recorded that exact failure once before, at Hour #16 (one Hour behind), and closed it BY EDITING THE NOTE: a prose fix for a prose defect, so it recurred three times larger. R3 -- a second false record on the same component is a redesign. THE NEAREST WORKING ANALOGUE IS IN THIS REPO (R4): measured across the whole store, three atoms have run Expert Hours (W5_1 at #2, H_GAP at #15, H27 at #21) and H_GAP keeps NO separate hold note at all -- each of its register entries carries its own verdict (''...SO THE LEVEL STAYS 2''), so the answer to the draw is written by the one act an Hour cannot skip. The diff is WHERE THE VERDICT LIVES; a second copy kept by hand is the only shape that can fall behind, and it is the shape this atom chose. LANDED (atom D41, `tools/map_assertion_provenance.py`): for every atom held below its target with Hours recorded, the LATEST recorded Hour must be ANSWERED in a record the draw reads -- either shape satisfies it, neither is mandated, and the population is DERIVED from the record store rather than a hand-typed list of the two atoms that run Hours today (the construct D40 is open about). THE FAIL-OPEN IT IS BUILT AGAINST, PINNED BY NAME: every hold record here ends by naming the NEXT Hour, so the highest ordinal MENTIONED is current by construction, one step ahead of the truth -- at the one-Hour-behind instance a mention check reads GREEN on the defect it exists for. Only ordinals in a sentence that also states a hold verdict count. THE CHECK''S FIRST REAL RUN COMMITTED THE SAME DEFECT ON THE OTHER SIDE, and that is fixed and pinned rather than quietly corrected: H_GAP''s fifteenth entry ends ''OPENER FOR THE SIXTEENTH HOUR'', so counting mentions reported a perfectly current atom as one Hour behind. An entry''s Hour is now the FIRST ordinal it names -- what it IS, never what it refers to -- and an entry that stops self-identifying within 120 characters RAISES rather than guessing. R15 both ways: nine fixtures written in the two conventions the two real registers actually use; four mutations each firing a named finding (note behind register; forward pointer accepted as an answer; register forward pointer inventing an Hour; Hours recorded with no verdict anywhere); two refusals (a drifted convention, and a register parsing to nothing -- an unavailable check is a FAILED check); silence on an atom at its target; and the check WIRED INTO THE CLI with the stale finding proven to reach a non-zero exit, because D34''s control was never wired into its own CLI and nobody noticed for two Hours. 36 passed on this file (was 24). ruff clean on both files. R12: no published number moved and no instrument was touched. FOUND AND QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): the same class is live on a second surface -- D37, D38, D39 and D40 exist ONLY in this register''s prose and in no map cell, with the atom inbox empty, and Hour #21 described D37 as LANDED. Level stays 2 for the TWENTY-SECOND consecutive Hour; Hour #4''s two-consecutive-clean-Hours criterion is at zero. The next promoter runs Hour #23 on the instrument: Hour #21''s three open leads (D39, D40, and the vacuous-in-isolation sibling control) are untouched by this Hour.'
- 'TWENTY-FOURTH HOUR (2026-08-13, worker tick, H27 2->3 HARDEN draw), and it is Hour #23''s own finding arriving a second time before its ink was dry: THE RECORD SAID LANDED, AND THE LANDING WAS NEVER MADE -- and in the interval a CONCURRENT LANE WROTE INTO THE SAME TWO FILES AND LEFT THE ATOM RED. Observed-with-evidence at HEAD dfc233094: `renderer_provenance` appears ZERO times in either committed file and 7+5 times in the working tree, so D38 was still unlanded; Hour #23''s entry, itself uncommitted, states ''VERIFIED, THEN LANDED, in that order'' and ''442 pass on the file''. THE FILE MEASURED 445 PASSED AND ONE FAILED when this Hour drew it. Nothing about Hour #23''s verification was wrong when it ran -- what it could not verify is a tree it does not own, and between its measurement and its (absent) commit the 2026-08-13 grid-extent lane extended `dense_drift_grid` from the harness constant to the book''s own extent inside the same module. This is the precise hazard Hour #23 named one sentence before it happened: ''a later concurrent commit sweeps a half-verified change in under another lane''s message''. The near miss is now the measurement: an unlanded verification decays at the rate the shared tree moves, so on this tree VERIFY-THEN-LAND is one act or it is neither. TWO DEFECTS IN THE RED, BOTH IN THE NEW LANE''S ASSERTIONS AND NEITHER IN ITS MECHANISM (R12: nothing computed moved this Hour, only what is asserted). (1) A WRONG-POPULATION CONTROL. `test_an_absent_reading_is_not_counted_as_resolution` grew `assert not check_dimension_drift_resolution(real)` over a sweep at n=120 on seed 7, while `DIMENSION_DRIFT_RESOLUTION` is declared -- and says so in its own comments -- at n=300 on seeds 7/11/23. Fifteen violations, and EVERY ONE IS POPULATION-DEPENDENT rather than a stale declaration: ageing''s collapse sits at companies (-19,-18) on the thin book where the register declares (-20,-19); seven of detection''s declared collapses read apart; both saturation edges move (detection measures 70 against a declared 82). The register was never wrong -- it was asked about a book it was never measured on, and the module fixture `drift_resolution` at `_RES_N` already carries the global assertion at the population the register IS declared from. What is population-INVARIANT here, and what the test is actually about, is that the two empty-population drifts are DECLARED: the assertion is now the absent-reading class alone. (2) AN EXPECTATION MOVED FROM THE REAL HALF TO THE INJECTED HALF. The same lane changed the injected-hole assertion to `undefined_readings == (12, 87, 88)` -- but that half''s `runner` re-scores the BASELINE at every drift and takes `k` only to punch its hole, so the real emptiness at +87/+88 cannot appear in it at all. Restored to `(12,)`, which is what HEAD had, with the reason written beside it: this half is an INJECTED absence over a NON-empty population, and it is a different control from the real sweep three lines above. R15 ON THE REPAIR, and it took two goes, which is the Hour''s second lesson: mutating the register''s `undefined_drifts` to `()` fires the narrowed assertion BY NAME (''published NO reading at drifts [87, 88]''). The FIRST attempt at that mutation reported the control PASSING -- because this module holds TWO registers carrying an identically-spelled `undefined_drifts` field for `detection_latency` (`ORGAN_QUERY_GRID` at line 2125, `DIMENSION_DRIFT_RESOLUTION` at 4168) and a first-occurrence edit landed on the one the check never reads. A MUTATION THAT LANDS ON THE WRONG SUBJECT IS INDISTINGUISHABLE FROM A CONTROL THAT CANNOT FAIL, and it fails in the reassuring direction -- the R15 discipline needs the mutated line PRINTED BACK and located, not merely applied. THE OTHER NEAR MISS, recorded because it nearly cost two lanes their uncommitted work: the mutation was restored with `git checkout --`, which on this shared tree does not undo a mutation, it reverts the file to HEAD and deletes every uncommitted hunk in it. Caught by the md5 pin (`bc1ba1049c1d582f9afb0cf3febb045b`), restored byte-identical from the pre-mutation copy; every later restore was a `cp`. MEASURED AT LANDING: 446 passed, 0 failed on the atom''s file (445+1F at draw; Hour #23 recorded 442, and the delta is the grid-extent lane''s own tests). ruff: 4 findings on the two files against 5 on the same two files at HEAD -- one fewer, none added. WHAT LANDS: BOTH LANES, IN ONE COMMIT, NAMED AS TWO -- D38''s renderer-provenance seam (Hour #22''s build, Hour #23''s verification) and the grid-extent finding''s book-derived `dense_drift_grid`, because they are interleaved in the same two files and no hunk-level split of them would leave either half green. DELIBERATELY NOT TOUCHED: the H27 map cell''s `expert_hour.last` and `simplifications_count` stay stale for the second Hour running, for the same live reason -- `docs/design/maturity_map.yaml` still carries three other lanes'' hunks in the shared index. The verdict for the draw is written HERE, which is the shape D41 accepts. QUEUED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE): (a) Hour #23''s queued control -- a register claim of LANDED checked against what is COMMITTED rather than against another record -- is now witnessed TWICE and is the highest-value unbuilt thing this atom knows about; (b) D39 and D40, untouched for a fourth Hour; (c) D37-D41 exist only in this register''s prose and in no map cell. THE LEVEL STAYS 2 FOR THE TWENTY-FOURTH CONSECUTIVE HOUR, and Hour #4''s two-consecutive-clean-Hours criterion reads zero for the twentieth time: this Hour was not clean, it found a red. That is the criterion working, not the self-regenerating opener -- and the distinction is worth the sentence, because the 2026-08-13 fifteen-draws report treats every zero as the same zero.'
map_records:
  expert_hour_findings:
  - 'EIGHTH HOUR (2026-08-10), first of the three leads Hour #7 left: THE AGEING DIMENSION''S RESOLUTION IS THE HARNESS''S CALENDAR. Every truly-overdue invoice in the scenario is 30, 51 or 72 days overdue at `as_of` (arithmetic over FIRST_DUE_DATE, PERIOD_SPACING_DAYS, N_PERIODS and AS_OF_BUFFER_DAYS), so an ordinal bucket headline can only see a dating error that crosses a 30/60/90 boundary. Measured against a new declared counterfactual company (`organ_terms_drift_days` -- the supplier holds the wrong payment terms; world and truth-side rule untouched), n=300, seeds 7/11/23: a company dating every debt ONE TO EIGHT DAYS OLDER than truth publishes a BIT-IDENTICAL headline, and +1d and +12d collapse to one number -- while the detection dimension moves on every drift the ageing one cannot see, so it is a blindness rather than an inert probe. D23''s register could not reach it because that register is keyed to the RECONCILIATION date grid; this is the fourth escape of a register''s own keying. Closed at the class by DIMENSION_DRIFT_RESOLUTION -- keyset DERIVED from the published dimensions, three declared states (on-path blind / on-path sighted / off-path, the last required to name a probe MEASURED to move it), R15 both ways plus a source mutation, and an exact-band rule added after the control''s own first draft passed an under-stated band. The reshape is atom D25, minted at L0. HELD AT L2: eight Hours, eight defects, and this Hour changed the instrument again.'
