- '2026-08-12 THE THIRTEENTH EXPERT HOUR RAN ON THE QUESTION THE TWELFTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- what happens when a panel the level reflection is feasible for on 199 of 200 premises falls WHOLLY to the log form on the strength of one home -- IS ANSWERED YES, THE COST IS REAL AND WAS NEVER MEASURED. THE DEFECT: `_level_reflection_is_feasible` is a THRESHOLD, so `panel_mirror`''s instrument is a STEP FUNCTION OF THE WORST CERTIFICATE IN THE PANEL. MEASURED on the drawn 200 by walking its worst home across `2*epc == actual` and moving nothing else -- a TWO-PARTS-PER-MILLION change in one register: premises breaching the level promise 0 -> 175 of 200, worst breach 1.79e-15 -> 4.26 (426% of a home''s own error), register MAE 0.044774 -> 0.074085 kW/K, mirror money +296 -> +341 GBP per premise. None of the other 199 homes moved. Holding the population fixed and switching only the instrument: drawn 200 +15.4% on the mirror''s money reading (yardstick share 1.0 -> 0.377), authored 15 +42.9% -- and the direction is not consistent, the fallback flattering the mirror on one published population (gap-difference-relative 0.124 -> 0.030) and damning it on the other (0.019 -> 0.206). NOT HYPOTHETICAL: the published draw''s worst register ratio is 1.7371 against a cliff at 2.0, and five seeds under identical drawing rules read 1.7371 / 1.7371 / 1.8585 / 1.8585 / 2.0828 -- the fifth genuinely takes the branch, one home of 200 forcing it, switch cost GBP 56 per premise. WHAT THE ROW COULD NOT SAY: `panel_mirror_reflection` has always NAMED the instrument and nothing said what the naming was worth; the counterfactual is a second pass over the same homes and both existing channels are computed on the branch taken. THE ALTERNATIVE THE DOCSTRING NEVER NAMED is EXCLUDE-AND-DECLARE, and it is REFUTED by measurement rather than argument: excluding the forcing home moves the BASE money reading by GBP 138 per premise (27%) because the excluded home is by construction the most-wrong home, against the instrument switch''s GBP 45 -- both roads cost, the fallback''s is the smaller one and was the unmeasured one, so the rule stands and its price is published. MECHANISED: `instrument_switch` prices the switch on the premises that did NOT force it, BOTH READINGS ON THE SAME ROWS so the difference is the instrument and not the population; `panel_mirror_switch_*` (borne_by, cost, published, counterfactual, error bar, counterfactual INTERVAL, favours) and `panel_mirror_instrument_channel` in the ledger row; `_switch_cost_caveat` printing on rows the mirror CERTIFIED as well as refused (the twelfth Hour''s rule applied on the way IN); the channel a THIRD input to `panel_mirror_attribution`, refusing on two grounds both in GBP and neither against a new constant -- different arms, or cost past the published reading''s own 95% error bar -- with an unmeasurable cost `unresolved`, never clean. THE FIRST ANSWER WAS WRONG AND THAT IS THE SECOND FINDING: searched on 4,600 REAL subpanels of the drawn population each carrying a forcing home, cost/error-bar never exceeded 0.332 and the arms never differed, so the gate was written off as unfirable and demoted to a bare disclosure -- and it fires at 2.46x on the suite''s OWN searched flipping population with one forcing home, whose register understates UNIFORMLY so the distortion is systematic and does not cancel, while the drawn population''s errors are mixed in direction (74 of 200 over-state) and largely do. The gate is restored. Where the instruments DO disagree (130 of 1,500 synthetic, 3 of 3,000 real) it is ALWAYS a RESOLUTION crossing and NEVER two different resolved arms, which is why the counterfactual''s interval is published beside its point. R15: NINE source mutations each firing its own named test, all red, md5 byte-clean (93dc9265b2b998478ce74f457ca6ffe1 pre-interval-change). ONE SURVIVED THE FIRST PASS AND THE SURVIVAL IS THE LESSON: the shared-substream mutation, because a bootstrap POINT estimate is the sample mean and does not move with the seed, so the cost was identical under either wiring and the C-S2 justification written in the source was FALSE AS BUILT -- fixed by publishing the counterfactual''s INTERVAL, the only observable place, and not its half-width, which coincides to the bit across those two streams. NOT ALWAYS RED on synthetic AND real data: 97 of 600 randomised fallback draws certify non-degenerate, the real seed-21 population at 0.222. NO PUBLISHED FIGURE MOVED: 0.4269 / 0.4042 unchanged, whole-ledger diff is eight added keys (all None on the level branch bar `panel_mirror_instrument_channel: attributable`) plus measured_at and run_git_commit. 274 passed / 2 xfailed (was 265), 353 across the atom and its three siblings, ruff clean, epistemic PASS 555 files. R10 CLASSES. (1) A THRESHOLD THAT SELECTS AN INSTRUMENT MAKES THE READING DISCONTINUOUS IN THE SELECTING VARIABLE, and a field naming which instrument produced a reading is a LABEL, not a disclosure -- signature: an epsilon change in one member of the population changes every other member''s measurement. (2) A NOT-ALWAYS-RED SEARCH RUN ON ONE POPULATION''S SUBPANELS ANSWERS A QUESTION ABOUT THAT POPULATION -- subpanels share the structure that makes the control quiet, and it nearly cost this Hour its own gate. (3) A C-S2 SUBSTREAM CLAIM IS ONLY A DISCIPLINE IF SOMETHING PUBLISHED MOVES WITH IT. OPENER FOR THE FOURTEENTH HOUR: the instrument channel refuses when the two readings name different arms, and every disagreement measured is a RESOLUTION crossing in which one side says `neither` -- so the gate refuses a row for having had LESS evidence under an instrument it did not use, and in 31 of 130 measured cases the direction runs the other way. Whether a resolution crossing should refuse at all, and whether its two directions are the same finding, has not been asked. Also still open, now the oldest item on this atom: FOUR retained-but-superseded fidelity statistics defended only by their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_ONE_HOMES_CERTIFICATE_CHANGED_THE_INSTRUMENT_FOR_THE_OTHER_199_2026-08-12.md.'
- '2026-08-12 THE FOURTEENTH EXPERT HOUR RAN ON THE QUESTION THE THIRTEENTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DIRECTED QUESTION -- should a RESOLUTION CROSSING refuse at all, and are its two directions the same finding -- IS ANSWERED YES AND ONE-FINDING-TWO-CLAIMS, BUT IT COULD NOT BE ANSWERED AS POSED, because on the panels it was asked about the crossing was not a disagreement between instruments at all. THE DEFECT: `InstrumentSwitch.resolution`''s direction half says ''the two instruments name DIFFERENT ARMS ... which needs no threshold to read'', and the threshold it was reading is the MOVER COUNT. `favours` is `neither` iff the 95% bootstrap interval contains zero; a paired money advantage is EXACTLY 0.0 on every premise both arms forgo the same money on; so for m movers in n rows P(a resample draws none) is (1-m/n)**n -> e**-m = 36.6/13.2/4.7% at m=1/2/3 against a 2.5% tail, and 1.65% at m=4. MEASURED WITH GBP 1,000,000 ON EVERY MOVER: three movers read GBP -37,975 per premise and name `neither`; four name `epc`. BELOW FOUR MOVERS A PAIRED MONEY VERDICT CANNOT NAME AN ARM HOWEVER MUCH MONEY IS ON IT, and no panel size repairs it -- the limit does not depend on n (0.0388 at n=20, 0.0496 at n=1,000), so a BIGGER panel makes a three-mover verdict LESS resolvable and a guard sized on the panel has the sign of its own protection backwards. THE GATE''S OWN FIXTURE FOR THAT HALF WAS ONE OF THESE: `_disagreeing_forced_population`, searched for and shipped by the thirteenth Hour, carries FOUR movers on the published reading and THREE on the counterfactual of 79 borne homes, the counterfactual''s interval ending at exactly 0.0 -- the ''different arms'' is the count crossing 3->4, on a money difference of GBP 38 against an error bar of GBP 171. HOW MUCH OF THE GATE THIS WAS, 5,000 fresh fallback draws: 1,003 disagreements, ZERO of them two different resolved arms (reconfirming the thirteenth Hour on an independent sample), and only FIFTEEN with both readings carried by MIN_HOMES_FOR_DIVERSITY or more -- 98.5% of what the direction half fired on was the mover count. AND THE FAIL-OPEN IS THE LARGER HALF: of 3,000 draws, 2,373 rows have a reading carried by under five movers and 1,930 of them CERTIFIED, 1,682 off a reading carried by one home or none; in its purest form, where both arms forgo identical money everywhere, both readings are exactly GBP 0.00 with a zero-width interval and the magnitude half asked `0.0 > 0.0` and said `attributable` -- R15''s second killer pattern by name. THAT REACHES THE TWELFTH HOUR''S RELEASE: all five stocks it certified and counted have carried_by == (0,0), so they were released into a GBP channel with no GBP in it; its own claim (no row refused by a kW/K reading, its channel still saying either word across the twelve) is untouched, ten of the twelve now stop at `unresolved`, and the two whose register OVER-states, six carrying homes each, still certify. THE ANSWER TO THE DIRECTED QUESTION, AND IT INVERTS: among all 1,003 crossings the reading the row USED is the one that names an arm, 935 to 68; among the fifteen carriable ones it is 1 to 14 -- the instrument the row actually used made it LESS decisive, not more. The thirteenth Hour flagged that minority direction as unexamined; once the artefact is removed it is almost the whole population, which is why the refusal sentence now NAMES its direction instead of asserting the majority one. MECHANISED: `carried_by` (the movers behind each reading, off the two MoneyVerdicts already computed -- no new bootstrap, no new constant); `resolution` returning `unresolved` when either reading is carried by under MIN_HOMES_FOR_DIVERSITY movers, CHECKED BEFORE BOTH EXISTING HALVES so a thin panel is never told a real mechanism decided it; `panel_mirror_switch_carried_by` in the ledger row; the carriage printed in `_switch_cost_caveat` (on certified rows too, the twelfth Hour''s rule) and in `_why_unattributable`''s new clause; `_disagreeing_forced_population` RE-SEARCHED onto one of the fifteen carriable crossings (79 borne, 8 and 9 movers, cost GBP 48 inside a bar of GBP 123, still firing the arms half WITHOUT the magnitude half) with the old one KEPT as `_thin_disagreeing_forced_population` and pinned as the defect; the stock-coarseness disclosure test repointed off a carried_by==(0,0) row onto one with 11 and 7 carrying homes. ONE-DIRECTIONAL BY CONSTRUCTION (`unresolved` is not a pass), proven over a searched family rather than asserted. NOT ALWAYS RED on synthetic OR real data: 627 of 3,000 draws are carriable on both readings, 445 certifying and 182 refusing. NO PUBLISHED FIGURE MOVED, measured end-to-end by A/B of tools/couple_fabric.py against committed HEAD on BOTH published populations: one added key (`panel_mirror_switch_carried_by: null`, both on the level branch where the quantity does not exist) and ZERO moved values; gaps 0.4269/0.4042 and 0.2184/0.2624 unchanged. R15: NINE source mutations -- guard counts the panel / clause deleted / reads `max` / checked after the arms half / off by two / zero-carriage reads clean / sentence loses its direction / carriage clause reports one reading twice / disclosure drops the carriage -- each firing its own named test, all RED, md5 byte-clean (993754f85490764fd7fd8080ddf73a44). 284 passed / 2 xfailed on the atom (was 274/2), 397 passed / 2 xfailed across it and its four sibling suites, ruff clean, epistemic PASS 557 files. R10 CLASSES. (1) A LABEL COMPARED TO A LABEL INHERITS THE THRESHOLD THAT MADE THEM -- ''needs no threshold to read'' was true of the comparison and false of its operands; signature: a gate fired on a difference in CLASSIFICATION that no difference in QUANTITY supports. (2) A GUARD SIZED ON THE PANEL CANNOT PROTECT A STATISTIC CARRIED BY A SUBSET -- the TENTH Hour''s class recurring verbatim in a channel built three Hours after it was closed on a different statistic; the eleventh Hour ASKED it of its own term and correctly found it did not reach, the thirteenth built a new resampled statistic and did not ask. (3) A CONTROL THAT COMPARES CAN PASS ON TWO ZEROES: `0.0 > 0.0` is False and False reads as clean. OPENER FOR THE FIFTEENTH HOUR: the guard uses MIN_HOMES_FOR_DIVERSITY on the movers while the algebraic floor for naming an arm at all is FOUR, so a five-mover reading is certified with one home of headroom and nothing measures how close to that floor a certified reading sat; nor whether `borne_by` should be published beside it as a RATIO (nine movers of 59 is a different object from nine of nine). Also still open, now the oldest item on this atom: FOUR retained-but-superseded fidelity statistics defended only by their docstrings. FULL TEXT: docs/staging/WORKER_FINDING_THE_ARMS_HALF_OF_A_GATE_WAS_READING_THE_MOVER_COUNT_2026-08-12.md.'
