atom_id: H27_payment_belief_gap
chunk: 13
simplifications:
- 'FIFTEENTH HOUR (2026-08-11), on Hour #14''s lead 2: THE CAVEAT''S NUMBER WAS THE BOOK''S, ON TWO FIGURES THAT DO NOT SHARE A RESOLUTION. Hour #14''s contract checks one cell''s number against the published figure -- the only day-linear one -- and the other six state BANDS and EDGES nothing compares with the figure they ride on. Asked of the two BELIEF cells, the number is neither figure''s: `belief_resolution_caveat` published `measure_belief_window_resolution`''s book bound (headroom + 1, the smallest window shortening that drops any observed event out of memory) in the sentence ''the smallest memory error IT can resolve at all'', BYTE-IDENTICALLY on both belief dimensions, because one function rendered one sentence for both. MEASURED through each organ at the 4dp its consumers render (n=300, seeds 7/11/23): the bound is 310/309/309 while `belief` resolves 310/310/309 and `belief_population_mix` resolves 310/314/312 -- a day out on one figure, FIVE days out on the other, in the direction that UNDERSTATES the instrument''s blindness. Both halves of it were already written down and neither was a control: the predictor''s own docstring says shortening by more ''MAY be visible ... the organ''s business and not this predictor''s'' (nobody asked the organ), and the mix entry''s `own_why` already said it was blunter (''a 310d shortening moves `belief` on all three seeds while moving this one on only seed 7''). CLOSED AT THE CLASS (R10): every moving cell of PUBLISHED_FIGURE_CAVEAT_CONTRACT now declares `number_source` and its SUBJECT is checked -- a DIMENSION_DRIFT_RESOLUTION source must be keyed to THIS dimension, an ORGAN_QUERY_GRID source must feed it and owes a published-figure number where its `headline_key` names a sub-reading, and a BOOK source (a population-side predictor that cannot know which figure reads it) owes a per-figure floor; a moving cell with no source RAISES. `measure_published_resolution_floor` measures that floor through each dimension''s own shipped scorer on a grid derived from the BOOK -- one day INSIDE its own provable bound, out by its own event span -- at an epsilon that is HALF A STEP of the precision the reader is given, read back out of the consumers'' source rather than chosen as a tolerance. The caveat is corrected AT SOURCE (D6/D22): each figure states its OWN floor, names the sibling''s as the sibling''s, the book bound is stated AS a bound on any figure here, both numbers ride as components, and an unnamed caller gets an explicit refusal rather than a default. R15 both ways on twelve named defects including the pre-Hour caveat, the sibling''s floor, a floor the sentence never states, a cross-dimension source, an absent sweep (an unavailable check is a failed one), an inert probe and a book with no bound. R12: no published number moved -- both belief figures, the detection gap, the latency mean and the ageing measures are bit-identical. NOT CLOSED, and minted as D33: the movement predicate itself. Every collapse run and saturation edge in this module is derived with `repr()` bit-equality, so a 1.4e-17 difference tells two counterfactual companies apart -- measured live, the mix figure ''moves'' at -310..-313 on seed 11 by 1.4e-17, which is what put its declared ceiling at -309 where the reader''s own precision puts it at -313. Re-deriving every declared edge at that precision moves edges across two registers and is a reshape, not a fix on sight.'
