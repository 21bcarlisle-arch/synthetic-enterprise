simplifications:
- '2026-08-19 pass 16 SETTLES THE INSTANCE BY THE TREE, AFTER A SIXTH FAILURE. Measured FIRST, before writing anything, because the five records before this one wrote their claim first: at HEAD 9c0f96666 `git grep -c include_schema_version HEAD -- simulation/` was EMPTY. So pass 15 -- which had started a content-sourced landing in the background and honestly declined to claim its outcome -- was a SIXTH consecutive pass whose landing is in no commit. Recorded as such rather than re-attempted quietly. THIS PASS LANDED IT: commit 0a242d6fa, exactly 2 paths, gate-rc 0, receipt consistent (tree 6b2dcd299). LANDED: `include_schema_version` in `simulation/` -- the three call sites the 2026-08-15 census named as channel D''s whole substance: simulation/run_phase2b.py (acquisition funnel) and simulation/run_phase4c_on_phase2b.py (meter read, contact centre). Verified BY THE TREE and never by the landing command: `git grep -c include_schema_version HEAD -- simulation/` returns run_phase2b.py:1 and run_phase4c_on_phase2b.py:2, which is the finding''s own admissible settlement query and the only evidence it accepts. The commit carries those two paths and nothing else, and the worktree holds no residue afterwards -- so no sibling lane was swept in and no hunk was dropped. WHAT THE R3 REDESIGN BOUGHT, observed rather than argued: while this pass''s gate was running, a concurrent KNIFE3 lane ran `git checkout -- company/interfaces/growth_desk.py` against the shared worktree -- the same class of event that at 22:49:00 reverted both EP6 files and moved the work from ''in the worktree, in no commit'' to ''in neither''. It could not touch this landing, because --content committed bytes held in /tmp and the worktree copy was never read. A shared worktree is not storage; that is why five worktree-sourced passes could not settle this and the sixth content-sourced one did. ALL THREE PROCEDURAL RULES THE SIX PASSES COST ARE NOW EXERCISED TOGETHER, not just written down: content-sourced (bytes outside the repo), BACKGROUNDED (the tool call waiting on the gate hit its bound twice at ~9.5 minutes while the landing continued -- a landing driven in the foreground from a bounded tick is killed mid-gate, which is what produced the silent failure exit in passes 12-14), and settled by the tree. L3 IS STILL NOT CLAIMED, and the reason is narrower than pass 11''s: the atom''s own named next move -- ''migrate the three live port call sites onto include_schema_version=True'' -- is now done rather than unbuilt, so the letter of channel D''s criterion is met for the first time. But it is met by a migration that has faced no HARDEN pass and no Expert Hour, which the map''s own L3 definition requires, and the atom''s other five census channels are untouched. NEXT MOVE, named: HARDEN the three migrated call sites -- assert schema_version is present in the emitted bytes of all three logs, which is the first time this atom''s wire has been observable in a published artefact rather than in a call signature.'
- '2026-08-20 pass 17 HARDEN, level HELD at 2, loop_stage stays build. THE WIRE IS NOW OBSERVABLE IN THE BYTES, WITH A SUBJECT. This pass does the one thing pass 16 recorded as the next move, verbatim: "HARDEN the three migrated call sites -- assert schema_version is present in the emitted bytes of all three logs". Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD b22698df8, with this atom''s file_scope clean before the pass and the maturity map clean of other lanes'' hunks. WHY THE ASSERTION COULD NOT BE MADE, which is the finding this pass turned up before writing any of it. The tool already had an artefact half -- wire_on_artefact -- (CORRECTED AT LANDING, by the pass that committed this entry: "already had" was true of the WORKING TREE and of no commit. At b22698df8 tools/wall_channel_census.py contains no wire layer at all -- 0 occurrences of wire_call_sites or include_schema_version -- so wire_on_artefact, wire_conformance and wire_call_sites were all still uncommitted when this entry was written about them. The three SIM call sites it measures were genuinely committed, 1 in simulation/run_phase2b.py and 2 in simulation/run_phase4c_on_phase2b.py, which is why the code-half reading below stands. The instrument was in no tree but this one; the subject was. Same class as the already-filed WORKER_FINDING_THREE_CONSECUTIVE_PASSES_RECORDED_A_LANDING_THAT_IS_IN_NO_COMMIT_2026-08-19, and the reason this commit lands passes 12-17'' worth of tool code at once) and it could not state the claim, for a reason that is structural rather than a bug: it reports (rows carrying, rows) for EVERY published list-of-dicts and has no notion of which of the 131 keys is supposed to carry a version, so "meter_read_log is 0 of 1600" and "meter_read_log is not a port log at all" are the same reading on it. Its only caller, main(), then filtered on `if carrying:` -- printing a key only when at least one row carried a version. So the exact state the check exists to find printed NOTHING. Measured, not argued: at HEAD the three migrated logs carry the version on 0 of 1,996 rows (acquisition_funnel_log 0/4, contact_centre_log 0/392, meter_read_log 0/1600), the artefact section of the report was empty, and the command returned 0. That is the artefact hiding in the off-state, and it is the same class as WORKER_FINDING_THE_ARTEFACT_HIDES_IN_THE_OFF_STATE_2026-08-09. WHAT WAS BUILT, and the one design choice in it. The subject is DERIVED from the tree, never declared: wire_publish_keys() resolves each wire call site to the artefact key its emitted rows are published under, by finding the local name the rows land in (an assignment or an .append) and then the string key a dict literal in the same module publishes that name under. A declared set of three keys would have been the hardcoded-five this module''s own docstring refuses, and a fourth port''s log would then be silent AND unlisted on the same day. On the live tree it resolves all three sites: run_phase2b.py:1708 -> acquisition_funnel_log, run_phase4c_on_phase2b.py:266 -> meter_read_log, run_phase4c_on_phase2b.py:356 -> contact_centre_log. artefact_wire_conformance() joins that key set against the artefact''s rows and returns four populations kept deliberately apart -- carrying, silent, unresolved, absent -- because "0 rows carry it", "no key to read" and "no rows to read" are three different facts and only the first is a defect in the wire. THE READING, AT TWO REFS, and it is the first evidence this atom has that is not a call signature. At HEAD: the code half is GREEN on all three sites (every call passes include_schema_version=True) and the artefact half is SILENT on all three logs, 0 of 1,996 rows. In the worktree, whose run_output_latest.json was published by a run AFTER the migration landed: 1,996 of 1,996 rows, all three logs. The two halves DISAGREEING at HEAD is the point -- it is what proves they are independent rather than one value checked against itself, and it is the true state of a migration that has landed in code and not yet in published bytes. R15, AND THE MUTATION THAT MATTERED WAS AGAINST THIS PASS''S OWN FIRST CUT. Eleven new proofs in tests/tools/test_wall_channel_census.py, 53 passing in the file. The first cut of wire_publish_keys iterated the resolved SINKS rather than the wire CALLS, so a call site in a bare `return [...]` -- the shape the existing R15 fixture uses -- vanished from the subject instead of surfacing as UNRESOLVED. A fail-open in the control written to close a fail-open, caught by its own mutation test before it was committed, and fixed by walking the calls. The other proofs that earn their place: a PARTIALLY carrying log is silent, not carrying (asserting the first row carries a version passes on that fixture, which is the cheap version of this check); a key absent from the artefact and a key present with zero rows are both UNOBSERVABLE and not conformant, so deleting the log is not the cheapest way to pass; all sites unresolved raises CensusUnavailable rather than reporting an empty subject; a tree with no wire sites at all is NOT refused, because channel D fully paid down is this atom''s success case. The publish-key fixture publishes a local list named `rows` under the key meter_read_log, so the derivation is shown answering the KEY and not echoing the local name -- which the three live sites cannot show, since there the two coincide. STILL NOT A GATE, and this pass names the condition for making it one instead of leaving that to be rediscovered. The artefact is a past sim run''s output, so the commit that repairs a silent log cannot move a row until the next run publishes; gating would red the repair and pass the breakage, and a fresh checkout would red on bytes that are nobody''s defect. Closing that needs the artefact to say which code produced it, which it does not -- WORKER_FINDING_THE_PUBLISHED_ARTEFACT_CARRIES_NO_PRODUCTION_STAMP_2026-08-15. The live test therefore asserts the SUBJECT (every wire site still resolves to a published key) and not the ANSWER, because the subject is read from program text and rots silently: a refactor moving the rows into a helper would leave the code half green, the artefact half with an empty subject, and no reader any the wiser. FALSIFIERS, in the form the next pass can refute. (1) `python3 -m tools.wall_channel_census` at HEAD prints three lines beginning "! artefact" naming acquisition_funnel_log 0/4, contact_centre_log 0/392, meter_read_log 0/1600. (2) artefact_wire_conformance_at(worktree=True).ok is True and its carrying map is exactly those three keys at 4/4, 392/392 and 1600/1600. (3) tests/tools/test_wall_channel_census.py collects 53 and passes. If any of the three is false on the tree at this commit, this record is wrong. L3 IS STILL NOT CLAIMED, and the reason is narrower again than pass 16''s. Channel D''s wire now has both halves of R11 -- the call asks and the bytes carry -- with the artefact half subject-aware and mutation-proven, which is what a HARDEN pass owes. What it does not have: an Expert Hour, which the map''s own L3 definition requires; and the atom''s other five census channels have no equivalent wire question asked of them at all, because only D has a version field to put on a wire. NEXT MOVE, named: the Expert Hour on channel D, run as a cold-eyes walk against the two reports rather than the code -- the specific question being whether a reader who has never seen this atom can tell, from the CLI output alone, that HEAD''s 0/1,996 is a stale artefact and not a broken wire. That is the claim the production-stamp finding says nothing in the repo can currently make, and it is the honest test of whether this pass''s report is legible or merely loud.'
