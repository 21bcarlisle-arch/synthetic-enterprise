simplifications:
- "2026-08-20 pass 29 BUILD, level HELD at 2, loop_stage stays build. THE CONVERSATION BELT GETS ITS MEASURED HALF, AND THE MEASUREMENT FOUND THREE UNNAMED TRAITS BEFORE IT PROVED ANYTHING. This is the move pass 28 recorded as next, in the form it recorded it: \"derive the belt's subject from what the SIM actually holds ... so that RENAMING a hidden trait reds the belt instead of hollowing it silently.\" Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 49af55d9d, with this atom's subject files CLEAN against HEAD before the pass -- so the readings below are of HEAD and not of a tree carrying someone else's hunks.\n\n  THE MEASUREMENT CAME FIRST AND IT IS THE FINDING. Pass 28 filed this belt's weakness as \"15 names, ALL ANTICIPATED, ZERO MEASURED\". Enumerating the hidden-trait producers behind this seam -- the seed literals handed to `_stable_fraction` / `_stable_unit`, plus the two derived scalars -- gives NINE, of which the belt named SIX. The three it did not name: `tone_uplift` (seed `tone_uplift_`, the tone lever's per-customer magnitude), `positive_action_probability`, and `adverse_share`. All three are now on the belt, which is why this pass changed the list and not only its tests.\n\n  THE TELL IS THE SAME ONE THE FLEX SEAM GAVE AT PASS 25, and it is worth stating as a class rather than an instance: THE MISS SITS NEXT TO A HIT. The belt named `nudge_uplift` and not `tone_uplift` -- the framing lever's uplift and the tone lever's uplift, drawn four lines apart in the same module by the same helper, one forbidden and one not. A denylist assembled by imagining leaks gets the trait someone was thinking about and misses its sibling; only enumerating the producer finds the second one. `positive_action_probability` is the sharper case: `simulation/conversation_response.py`'s own module docstring calls it \"the load-bearing number the company can never read\", and the belt did not name it in any spelling.\n\n  WHY THIS SEAM COULD NOT COPY ITS SIBLING, which is the reason the measured half was skipped three passes running rather than merely forgotten. Pass 27's payment analogue checks belt names against `dataclasses.fields` of the producers it cites. NOTHING behind this seam stores a hidden trait on a record: every one is computed per customer, on demand, from a NAMED SEED STRING. So there is no field list to read, and the seed literal is the citable thing -- it is what the world would change if it renamed a trait. `_MEASURED_SEEDS` maps seed -> belt name per producer module, read from the CALL SITES by AST.\n\n  NOT A SUBSTRING SCAN, ON PURPOSE. Both producer modules name most of these traits in PROSE -- `conversation_response`'s docstring alone contains \"trust\", \"intent\", \"susceptibility\" and \"latent\" -- so a text search over the source would score the DOCUMENTATION as evidence that the mechanism exists, and would have reported the belt fully covered while `tone_uplift_` sat undeclared. The extractor matches calls to the two draw helpers and takes the literal argument (`_stable_unit(customer_id, \"conv_trust\")`) or the literal left operand (`_stable_fraction(\"nudge_uplift_\" + customer_id)`).\n\n  THE CONTROL IS TWO-DIRECTIONAL AND THAT IS THE WHOLE POINT. `test_every_hidden_trait_the_world_draws_is_named_by_the_belt` asserts SET EQUALITY between the seeds drawn in the source and the seeds the belt cites, so it reds BOTH ways: a hidden trait ADDED to the SIM with no belt entry fails here rather than crossing unrefused, and a seed RENAMED out from under an entry fails rather than leaving it full-looking and hollow. Reading the belt tells you which leaks were thought of; reading the producers tells you which exist -- and until this pass only the first question had an answer.\n\n  THE SUBJECT SET HAS ITS OWN NULL CONTROL, without which \"the belt names every seed\" is satisfiable by a belt that forbids the seam's own product. `conversation_response` draws its OBSERVABLE response from four further named substreams (`conversation_positive`, `conversation_adverse`, `conversation_channel`, `conversation_latency`). Those are not latent traits -- they draw what the customer was OBSERVED to do -- and `test_the_observable_substreams_are_NOT_treated_as_hidden_traits` pins each out of both the subject set and the belt, with the reason stated per name. A control that reds on a legal payload is one that gets relaxed, and the relaxation takes the real entries with it (pass 27's `days_late` lesson, applied to the subject rather than the surface).\n\n  THE EXTRACTOR'S OWN FAIL-OPEN IS GUARDED. `_hidden_trait_seeds` finds seeds by matching the helper's NAME at the call site, so renaming `_stable_unit` would make it return the EMPTY SET -- and an empty subject is how a census passes while measuring nothing. `test_the_draw_helpers_the_measurement_rests_on_are_still_defined_where_it_looks` asserts each producer still defines one. HONEST LIMIT: on today's tree the equality check catches that rename too (three cited seeds become zero found), so the guard is not the only thing standing between here and the fail-open. It becomes load-bearing the day a producer module's cited set is legitimately empty, at which point equality passes vacuously and only the guard is left. Recorded rather than claimed as today's proof.\n\n  R15 PROVEN BOTH WAYS. FIVE MUTATIONS RUN, NOT ASSERTED, each against a probe tree built as `git archive HEAD` + this pass's two files -- TWO full suites were in flight throughout (pids 2352798 and 2367351), and mutating a shared module under a live suite is how this project has broken sibling lanes before. (1) THE WORLD RENAMES A TRAIT (`conv_trust` -> `conv_confidence`): the equality test reds, naming both sides of the divergence. (2) A BELT ENTRY IS DELETED (`tone_uplift`): reds with \"the belt does not name 'tone_uplift' -- a payload could carry it across the wall\", which is the entry this pass added and therefore a proof about the new coverage and not only the old. (3) THE SIM GAINS A NEW HIDDEN TRAIT (a `_stable_unit(customer_id, \"conv_new_secret\")` draw appended): reds as drawn-but-not-cited -- the direction no belt has ever had. (4) FAIL-OPEN (`_stable_unit` renamed): reds the guard AND the equality test. (5) A MEASURED DERIVED SCALAR IS RENAMED (`_adverse_share` -> `_reaction_split`): reds the functions test only. ATTRIBUTION IS PER-POPULATION -- mutations 1, 2 and 3 each fail exactly one test, and 5 fails a different one, so what fires is the specific move and not the wrapping. NULL CONTROL: the same probe tree restored, same command, 17 passed.\n\n  TEST COUNT, AST-COUNTED OFF THE TREE AND NOT FROM THE PLAN: `tests/interface/test_conversation_seam.py` holds 17 test functions against 12 at HEAD -- 5 new.\n\n  THE PIN IS NOT AFFECTED AND NO VERSION MOVED, checked rather than assumed. `SURFACE_PINS` digests `OBSERVABLE_PAYLOAD_FIELDS` (`DECLARED_SURFACE_CONSTANT`), which this pass does not touch. Widening a DENYLIST is strictly a tightening -- it cannot let anything new cross -- so a `SCHEMA_VERSION` bump would have been the wrong signal to send a counterparty. Live readings: `wall_channel_census --worktree` gives `channel C second belt: 3 of 3 ... conversation_seam -- 20 name(s)`, both sides, against `15 name(s)` at HEAD; surface pins 3 of 3; channel C wire 3 of 3; `python3 -m tools.epistemic_verifier --all` PASS over 541 company/ + saas/ files. The 140 tests across `tests/interface/`, `tests/simulation/test_conversation_response.py`, `tests/company/comms/test_susceptibility_estimator_wire.py` and `tests/background/test_conversation_gap_ledger_wire.py` pass on the widened belt, which is the check that matters for a denylist that just grew: no legal payload reds.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * THE COLD-EYES WALK IS STILL UNRUN, and is now FOUR passes older than the pass that asked for it (26, 27, 28, 29). Same cause each time: this invocation is forbidden from delegating to a fresh instance. It is the first blocker on L3 and nothing below discharges it.\n    * THE ANTICIPATED GROUP IS STILL ELEVEN NAMES WITH ZERO PRODUCERS. The measured half now covers nine; the other eleven (`susceptibility`, `intent`, `archetype`, `latent`, `true_scalar`, `probability`, `uplift` and the four run-together spellings) remain what pass 28 called them -- spellings someone predicted. They are honestly weaker and the contract now says so IN the list rather than only in a record.\n    * THE BELT STILL ANSWERS THE NARROWER QUESTION. `OBSERVABLE_PAYLOAD_FIELDS` is the control; this is the second belt, earning its place on the one case the closed set cannot see (a truth field added AND declared observable in one edit). A measured denylist is a better denylist, not a different kind of control.\n    * SIDE IS NOT LEG -- nothing here asks whether a seam's REQUEST and RESPONSE legs are separately belted. Unchanged since pass 25.\n    * `_refuses_on` IS STILL A PER-MODULE PROXY, and THE DECODE LEG'S PERMITTED KEY SET IS STILL DERIVED (`get_type_hints`); the belt sits in front of it and does not replace it. Both unchanged since pass 28.\n    * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION -- A, B, E and F are enumerated only. Unchanged since pass 22.\n\n  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the three unnamed traits are this atom's own subject, found by measuring it and closed in the same pass.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): THE COLD-EYES WALK, and it should now displace further build moves on this atom rather than queue behind them. Four passes have each found a real defect in the pass before (26 found an unversioned wire, 27 an unbelted payment side, 28 an unbelted conversation side, 29 three unnamed traits), which is evidence the codecs repay adversarial reading and NOT evidence that the author can keep supplying it -- every one of those was found by the same reader who wrote the thing. The specific question to put to a fresh instance is unchanged and is now sharper for having been measured: the belt is nine measured names and eleven imagined ones, so ask whether the ELEVEN should exist at all, given that an imagined name is what made this list look full while `tone_uplift` was missing from it."
