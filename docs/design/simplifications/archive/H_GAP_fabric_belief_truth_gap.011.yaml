simplifications:
- "2026-08-11 THE EIGHTH EXPERT HOUR RAN ON THE QUESTION THE SEVENTH LEFT, AND IT FOUND SOMETHING, SO THE LEVEL STAYS 2 (worker tick, L2->L3 draw). THE DEFECT: `panel_mirror_is_attributable` compared a POINT ESTIMATE to its band with no statement of whether the panel could resolve which side of it the artefact share sat on. THIRTEENTH TIME THIS ATOM SURFACED SOMETHING BY RUNNING A THING RATHER THAN READING IT -- every figure below came out of the tool on this atom's own published population.\n\n  MEASURED, ON REAL SUBPANELS OF THE POPULATION THE LEDGER PUBLISHES. That population's own share is 0.7307, comfortably above the 0.50 band, so every honest answer on a subpanel drawn from it is `unattributable` or `unresolved`. The point rule returned `attributable` on 50% / 37% / 30% / 15% of panels at n=20 / 30 / 50 / 100. On the worst of them the share was estimated from FOUR moved homes and its 95% interval was [0.000, 1.000] -- the whole of the range the band divides -- and the gate certified the mirror anyway. At n=100, 14 of 120 certified while carrying a DECISIVE money verdict, which is the case that costs a reader something: a certified mirror that does not flip publishes 'no composition effect' as a finding. THE SIGNATURE IS NOT THE FOURTH HOUR'S 'FLAT IN N' -- the point rule's error rate does fall with N. It is that the point rule NEVER LEARNS IT CANNOT RESOLVE: at n=100 the interval reading certifies 0 of 120 panels while the point rule still certifies 14.\n\n  MECHANISED AS THREE STATES, NOT TWO. `panel_mirror_weight_artefact_resolution` reads the interval (hi <= band -> attributable, lo > band -> unattributable, else unresolved); `panel_mirror_attribution` combines it with the register channel worst-first; `panel_mirror_is_attributable` is now `== 'attributable'`, so an unresolved panel never certifies. Collapsing `unresolved` into `unattributable` would publish 'the artefact is above the band' as a MEASUREMENT on a panel that measured no such thing -- one is a finding about the instrument, the other a statement about the evidence, and a reader acts differently on them (this mirror is the wrong instrument for this panel / get more homes). FAIL-CLOSED ON A MISSING INTERVAL, because an unavailable check is a FAILED check and a four-home panel is where a point estimate is worth least, not most -- with ONE exception, the exact zero corner where the mirror moved the margin on no premise and the share is a reading rather than an estimate. THE REPAIR IS ONE-DIRECTIONAL BY CONSTRUCTION: it can only take certification away, never grant it, so no verdict this gate released before is newly released now.\n\n  THE ALWAYS-RED CHECK WAS THE REAL RISK, AND IT WAS SEARCHED RATHER THAN ASSUMED. The suite's own proof that this gate can pass -- `test_the_WEIGHT_ARTEFACT_GATE_CAN_PASS_so_it_is_not_an_ALWAYS_RED_DETECTOR` -- rested on a panel reading 0.4711 on a 95% interval of [0.414, 0.561]: inside the band by 0.029, spanning it. So the demonstration that this control is not always-red was itself a panel that could not resolve the band. A resolved pass had to be found or the repair would have BEEN the defect: 700 draws of the flipping family, 13 flip a resolvable verdict into a different resolvable one, 8 of those are resolved-faithful, and `_flipping_population` now defaults to the tightest (60 homes, share 0.1690 on [0.123, 0.230] wholly under the band, largest premise 26% / 6%). The 2x2's flipped+faithful cell -- the one the whole mechanism exists to protect -- had been pinned on a panel that could not resolve the fidelity it asserts.\n\n  R15, SIX SOURCE MUTATIONS, md5 byte-clean restore (2ab549446cbef0b86e3ebe9f34d6444a), 9 green on the same selection unmutated: gate reads the point estimate again (the exact defect reinstated) / unresolved counts as a pass / a missing interval falls back to the point estimate / the disclosure keyed back to the point estimate / the exact zero corner forced through the interval / unresolved collapsed into unattributable. ONE SURVIVED THE FIRST SWEEP AND IT IS THE REUSABLE PART: the disclosure mutation -- which is the defect this Hour caught in its OWN repair an hour after landing it, a clause left on `share > band` while the gate had moved onto the interval, printing 'above the 50% band' and 'cannot resolve which side of the 50% band' in one sentence joined by 'and'. It survived because BOTH fixtures agreed between the two rules (one under the band and unresolved, one over it and resolved). A CONTROL SET WITH NO POPULATION WHERE THE CONTROLLED THING VARIES IS A CONTROL THAT CANNOT FAIL -- the sixth Hour's own finding, arriving inside the test written to pin the eighth's. The separating panel is not exotic: over the band point-wise, unresolved by interval, which is the shape of the row this atom ACTUALLY PUBLISHES (0.7307 on [0.359, 0.902]).\n\n  NO PUBLISHED FIGURE MOVED, CHECKED NOT ASSERTED. Both rows re-taken on their own declared population (--seed 17 --unit-rate 7.4 --population 200 --population-seed 17, read back off the row per the refresh_args mechanism) AFTER the code landed, which is the only ordering under which the row comes out current: gap 0.4269 / 0.4042, forgone GBP 548,919 / 451,832, misranked 11, declined 89 / 73, two-level still RED on L2.4_scale_spread_p90_p10 (the birth condition holding, not a regression). Both rows read attributable=False before and after. The whole ledger diff is measured_at, run_git_commit, the two new attribution fields, and the one caveat sentence whose CLAIM changed -- it said the artefact was measured above the band; it now says the panel cannot resolve which side of the band it sits on. W2_11 re-stamped itself concurrently via its own live writer and is not this tick's change. Suites: 238 in the atom's own file, 317 across it and its three siblings; epistemic_verifier PASS 553 files.\n\n  OPENER FOR THE NINTH HOUR, and it is what this Hour deliberately did not take. The REGISTER channel of the gate still has no interval at all: `panel_mirror_register_infidelity` is compared to its band as a bare point, exactly as the money channel was until today. It reads 0.000e+00 by algebra under the level-preserving reflection, so the question is not whether it is wrong but whether a term that is zero by construction on every branch either published population takes can carry half a gate -- the third Hour's own note that measuring an algebraically-zero quantity does not make it failable, never followed up. ALSO NAMED, NOT TOUCHED: `panel_mirror_weight_artefact` is called a SHARE and is not bounded by 1 (the authored row reads 80% on [73%, 122%]), because the sign flip can oppose the re-composition per premise -- readings over 1 are real and informative and the word 'share' does not admit them."
