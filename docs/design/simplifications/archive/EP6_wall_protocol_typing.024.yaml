simplifications:
- "2026-08-20 pass 28 BUILD, level HELD at 2, loop_stage stays build. THE CONVERSATION SEAM GETS ITS COMPANY LEG, AND THE CENSUS STOPS ACCEPTING ONE ENFORCER ANYWHERE AS AN ANSWER. This pass does the move pass 27 recorded as next, in the order it recorded it: give the conversation seam's company side the belt, THEN tighten the check that demanded it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: parent 43766e01e, worktree, this atom's files clean of other lanes' hunks before the pass.\n\nTHE READING MOVED AND THE INSTRUMENT SAYS SO IN BOTH DIRECTIONS, which is what makes this a landing order rather than a claim. Against the tree at HEAD: `channel C second belt: 2 of 3 versioned seam(s) carry a truth-field denylist BOTH SIDES of the wall refuse on` with `interface.contracts.conversation_seam -- ONE-SIDED: declares 15 forbidden name(s) refused on the world side (simulation/conversation_response.py) and on nothing on the company side`. Against the worktree after the repair: `3 of 3`, with `conversation_seam -- 15 name(s), company side company/comms/susceptibility_estimator.py; world side simulation/conversation_response.py`. The tightened check was BORN RED on the real tree, not on a fixture, and the repair is what turned it green -- so `second_belt.ok`, which is already in the CLI's return expression, gates on a question that had a live failing subject at the moment it was asked.\n\nTHE DEFECT, RESTATED WITH ITS MEASUREMENT. `company/comms/susceptibility_estimator.decode_observable_payload` had no non-derived check of any kind: its permitted key set is `_OBSERVABLE_PAYLOAD_HINTS = {t.__name__: get_type_hints(t) ...}`, which WIDENS with the dataclasses it guards and is an R15 TAUTOLOGY for \"could a real supplier know this\". The world's encode leg has refused by name since it was built. That left the seam carrying a customer's hidden latent traits belted only on the side that gets REPLACED at go-live -- the same asymmetry pass 27 closed on payment, on the seam where it matters most, because the entire F1b/F1c gap exists to score the company's INFERRED susceptibility against the SIM's true hidden scalar. A company handed `framing_susceptibility` and folding it in would be scoring itself against the answer key. Denylist-first on this leg now, the same ordering and the same reason as its three siblings.\n\nSIDE IS NOT LEG, AND THE WORD WAS ABOUT TO MEAN TWO THINGS IN ONE REPORT. Pass 27's recorded next move said \"tighten `belt_enforcers` ... to BOTH legs\", and the first implementation here used that word. `tools/wall_channel_census.py` already owns \"leg\": `seam_legs` reads the request/response pair a seam declares, `wire_field_sets_by_leg` keys on it, and the channel C line prints `[request=dormant, response=wire]`. A crossing's LEGS are request and response; each leg has two ENDS, encode and decode; the ends sit on opposite SIDES of the wall. A seam can be wired on both LEGS and belted on one SIDE, which is precisely the state found here -- so `one_legged` beside `wire_field_sets_by_leg` would have made the two axes unreadable from the report. Renamed to SIDE throughout before landing (`belt_enforcer_sides`, `BeltSides`, `one_sided`, \"company side\"/\"world side\" in the report), and `_enforcer_side`'s docstring states the three-level vocabulary so the next pass does not have to rediscover it.\n\nTHE SIDE SPLIT IS NOT A LIST THIS CENSUS OWNS. `COMPANY_PACKAGES` and `SIM_PACKAGES` are imported from `tools.epistemic_wall` -- the constants the wall walker itself is built on -- so a package added to a side there is a side here the same day. A census with its own copy would agree on the day it was written and diverge silently after, and `test_the_SIDES_come_from_the_WALLS_OWN_definition_of_its_two_sides` pins the identity rather than the values.\n\nFAIL-CLOSED ON THE NEW QUESTION'S OWN BOUNDARY. `belt_enforcers` walks `CENSUS_DIRS`, which includes the BRIDGE packages (`tools`, `background`, `interface`) because channel D's ports live there. A check that counted \"two enforcers\" rather than \"two SIDES\" would read a bridge module's refusal as a belted leg. It scores as NEITHER side: a bridge module is not on the path the payload takes from the world to the company, so its refusal defends neither end. The fact is still REPORTED (`refused only off-wall by ...`) so the reader is not sent hunting for a `FORBIDDEN_TRUTH_FIELDS` the grep will find. Two tests hold this, one with a bare side beside the bridge refusal and one with both sides inert.\n\nR15 PROVEN BOTH WAYS. 11 NEW TESTS, COUNTED OFF THE TREE AND NOT FROM THE PLAN: 171 test functions across `tests/tools/test_wall_channel_census.py` + `tests/company/comms/test_susceptibility_estimator_wire.py` + `tests/background/test_conversation_gap_ledger_wire.py`, AST-counted, against 160 on the same three paths at parent 43766e01e. THE DOCTRINE MUTATION on the company leg widens a REAL DATACLASS, not a patched hint dict, and the fixture docstring says why: the decoder ends in `payload_type(**fields)`, so a hint map widened alone is refused by the CONSTRUCTOR and every assertion after it would be measuring Python rather than the wall. Both halves are performed on the identical widened seam -- with the belt, refused CONTRACT_VIOLATION naming `framing_susceptibility`, with the derived check asserted GENUINELY GREEN on that payload first; with the denylist emptied, the same payload DECODES CLEANLY and the test asserts `decoded.framing_susceptibility == 87`, which is the state this leg was in until this pass and is what makes the belt load-bearing rather than redundant. PER-SIDE MUTATIONS run in BOTH DIRECTIONS (remove the company enforcer, remove the world enforcer) because with only one, \"one-sided\" would be indistinguishable from \"that fixture file went missing\". NULL CONTROLS, three: the fixture's belt is declared AND refused on BOTH sides before any mutation; the two sides are separately observable (`legs.company` / `legs.world` land in different buckets, else neither mutation proves anything); and an undeclared-but-INNOCENT field trips the OTHER belt, so \"the denylist fired\" and \"anything unusual is refused\" stay distinguishable.\n\nTWO EXISTING TESTS WERE MEASURING THE WRONG BELT, AND BOTH PASSED. This is the part worth keeping. (1) `test_every_forbidden_truth_field_is_refused_by_name` asserted a bare `pytest.raises` over all 15 names -- every one of which was ALREADY refused by the derived closed set, so the test passed identically with NO belt present anywhere in the module. A test whose name claims \"by name\" could not tell by-name from by-shape. It now asserts the reason code is CONTRACT_VIOLATION and that the offending name appears in the message. (2) `test_an_undeclared_payload_field_is_refused_rather_than_tolerated` -- the null control for the closed set -- used `tone_susceptibility`, which is ON the denylist. Once the belt landed it would have gone on passing while silently measuring the denylist instead of the closed set it was written for. Changed to `segment_score`, with an assertion that the name is not on the belt. The cross-side R15 test in `tests/background/test_conversation_gap_ledger_wire.py` legitimately changed reason from UNKNOWN_FIELD to CONTRACT_VIOLATION and gained a null-control sibling; the reason change is the point and the docstring records it.\n\n`python3 -m tools.epistemic_verifier --all`: PASS, 541 company/ + saas/ files, no barrier violations. Surface pins UNTOUCHED and still 3 of 3 -- this pass adds a constant read and changes no declared surface.\n\nWHAT THIS PASS DOES NOT ESTABLISH.\n  * THE COLD-EYES WALK IS STILL UNRUN, and is now THREE passes older than the pass that asked for it. Same cause as passes 26 and 27: this invocation forbids delegating to a fresh instance. Stated first, because it is the first blocker on L3 and no build move below discharges it.\n  * THIS SEAM'S BELT IS 15 NAMES, ALL ANTICIPATED, ZERO MEASURED -- and that is the weakest thing here, on the seam that matters most. Measured this pass: NONE of the 15 is a class attribute anywhere in `sim/` or `simulation/` (AST walk over every ClassDef in both trees). The reason is structural, not sloppiness: this seam's hidden traits are computed by private FUNCTIONS -- `_trust`, `_budget_stress`, `_considering_switch` in `simulation/conversation_response.py`, keyed on the stable seeds `conv_trust` / `conv_budget_stress` / `conv_true_intent_switch` -- and never stored on a producer dataclass. So pass 27's `test_the_MEASURED_names_really_are_attributes_of_the_producers_they_cite`, which also reds when a producer RENAMES a truth field, HAS NO ANALOGUE HERE and none was faked. What was built instead is the achievable half: no belt name may also be a field the contract declares OBSERVABLE (pass 27's `days_late` lesson -- a denylist that reds on a legal payload is one that gets relaxed, and the relaxation takes the real entries with it), and every observable field of both payload types is a DELIBERATE NON-MEMBER with a stated reason. QUEUED, not fixed.\n  * SIDE IS NOT LEG, restated as a limit: nothing here asks whether a seam's REQUEST and RESPONSE legs are separately belted. That is the finer unit `seam_legs` names and no check has been built on it. Unchanged since pass 25.\n  * `_refuses_on` IS STILL A PER-MODULE PROXY. This asks whether each SIDE has a refusing module, never whether the refusal sits on the codec the payload actually travels through. A company-side module refusing in an unrelated helper reads as a belted side. Stated in the verdict's docstring, not only here.\n  * THE DECODE LEG'S PERMITTED KEY SET IS STILL DERIVED. `get_type_hints` remains the only thing deciding which fields are allowed; the belt sits in front of it and does not replace it.\n  * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION -- A, B, E and F are enumerated only. Unchanged since pass 22.\n\nA DEFECT FOUND IN ANOTHER LANE'S SUBJECT, NOT FIXED, RECORDED SO IT IS NOT RE-DISCOVERED (SELF-INTERRUPT DISCIPLINE: queue, do not fix on sight). `tests/company/compliance/test_printed_bill_foots_render.py` produces 19 ERRORS at setup on the current tree: it reads `site/customers/index.html` and shells `site/customers/_bill_render_harness.mjs`, both DELETED by 03dd8c49e (the five-tabs consolidation). The file is modified-and-uncommitted in the shared tree, so a lane is already on it, and it is outside this commit's gate selection (`tests_for` maps by filename stem and no file in this pass shares one). Untouched here on purpose; recorded because \"19 errors\" seen cold on a later tick reads as this pass's fallout and is not.\n\nNEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): GIVE THE CONVERSATION BELT A MEASURED HALF. The traits behind this seam are function-computed, so the payment-shaped null control cannot be copied -- the move is to derive the belt's subject from what the SIM actually holds (the `_stable_unit` seed names `conv_trust` / `conv_budget_stress` / `conv_true_intent_switch` are literals in one module, and the framing/tone susceptibility scalars in `simulation/nudge_physics.py` are the others), so that RENAMING a hidden trait reds the belt instead of hollowing it silently. That is the check pass 27's payment list has and this one does not, and until it exists this seam's belt can only answer \"did we think of this spelling\". The cold-eyes walk stays queued AHEAD of L3 and should be run by a fresh instance the first tick that can spawn one; it is now the oldest open item on this atom."
