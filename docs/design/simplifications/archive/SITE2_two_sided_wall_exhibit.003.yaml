simplifications:
- '2026-08-13 EXPERT-HOUR FINDING DISPOSITION (worker tick) -- four of the walk''s eight open findings were RENDER defects inside this atom''s own file_scope, not the SIM/COMPANY fidelity work the 2026-08-12 record classified them as. All four fixed, each with a control that fails on its own defect. LEVEL STAYS 2: exit (4) is still half-landed (the /customers/ URL move is SITE3_wall_exhibit_url_rename) and the Expert-Hour verdict is still NO with four findings open, so nothing here certifies a level move.

  THE RECORD WAS WRONG ABOUT ITS OWN REMAINDER. The 2026-08-12 entry filed the open findings as "each needs its own atom -- most are SIM/COMPANY fidelity, not render". Re-read against the code, four were one-file render defects: an arrears cascade mis-sided, a 100x unit mislabel, an R14 clock on a probability, and a promised control that was not on the page it was promised on. This is the "a PASS''s what-remains paragraph has been wrong twice running" class, caught here by reading the code rather than the summary.

  (a) ARREARS MIS-SIDED (coldwalk:site2_arrears_history_visible_only_behind_the_wall). The whole reaction chain rendered as ONE sim panel, so this household''s two arrears cascades -- payment missed, first overdue notice, second notice offering a payment plan, cleared via payment plan -- sat BEHIND the wall while the money panel above called the account clean. Every one of those is a letter the account holder received. The chain now splits three ways through _CHAIN_SIDE: customer (missed payment, both notices, resolution, placed-with-DCA), company (write-off, recovery, retention decision -- internal accounting and the company''s own expected value), sim (journey_state, outcome_* -- these carry sim_truth). Fail-closed exactly as panel() and applyWallViewToOpState() do: an event type nobody has sided THROWS rather than defaulting to a side, because placing it by default is a silent claim about the wall. Also fixed in passing: the raw enum "arrears_payment_missed" was reaching the public page through an unlabelled event type falling out of chainLabel(), now pinned by test_no_raw_event_type_enum_reaches_the_page. The op-state panel''s "No arrears cases on record -- clean payment history" was a HOUSEHOLD-wide claim made from a SINGLE-LEG record (company.json''s household block is commodity=electricity; the arrears are on the gas leg) and now states the scope it is derived from. The household-wide figure is the dual-fuel finding, deliberately NOT closed here.

  (b) TARIFF UNIT (coldwalk:site2_tariff_range_pounds_per_mwh_labelled_pence_per_mwh). The column read r.tariff_min/r.tariff_max -- generate_customer_data.py''s copy of tariff_min_gbp_per_mwh / tariff_max_gbp_per_mwh -- and labelled them "p/MWh". A 100x mislabel on a public surface. Rendered NOW, quoted from the harness: 92-176 &pound;/MWh, 91-192 &pound;/MWh, 91-220 &pound;/MWh; no cell carries "p/MWh". The column header names the unit and a note says the retail range is the customer''s own contracted rate shown for comparison, not part of the SIM''s trading-margin arithmetic (the finding''s second, lesser half). The control is INDEPENDENT rather than tautological: it cross-checks this column''s magnitude against the SAME quantity rendered by a DIFFERENT code path on the same page -- the timeline''s "Tariff renewed at 128.0 &pound;/MWh" -- so a column in pence and a line in pounds cannot both pass.

  (c) R14 CLOCK ON A PROBABILITY (coldwalk:site2_churn_probability_carries_a_settlement_clock), closed as a CLASS per R10, not as an instance. The caption is now "company estimate, not a fact - belief at last renewal decision". test_no_non_monetary_tile_carries_a_settlement_clock walks EVERY rendered .kpi tile and requires that a tile whose caption mentions a clock has a MONEY value, so the next non-monetary figure slot-filled with an R14 basis fails automatically; it also fails if NO tile carries a clock, so a pattern going blind cannot pass as compliance. NOT closed: the companion doubt (expected lifetime 13.8yrs vs churn 23% vs the per-year believed series) is COMPANY fidelity and stays for its own atom.

  (d) THE PROMISED CONTROL WAS NOT ON THE PAGE (coldwalk:site2_landing_promises_a_view_switch_that_is_not_on_the_landing_page). wallViewNav() was emitted only inside renderHousehold(). Since the 2026-08-12 fix the selector governs the #op-state exhibit, which IS on the landing page, so the control now sits at the door in a #door-wall-view host OUTSIDE #op-state -- it is chrome, carries no figure, and a block inside would have to declare a side and then be filtered by the selector it operates. Filled at boot, repainted by setWallView.

  EVIDENCE. site/customers/test_wall_exhibit.py 47/47 and test_customers_door.py 11/11 (45 -> 47 in this module; the two new sections add 11 tests and the pre-existing 24 all still pass). site/customers/ + site/test_no_links_to_redirected_urls.py + site/test_brand_token_adoption.py: 106 passed. `pytest tests/tools/ -k "site or portal or bill or customer or door or nav or redirect"`: 514 passed, 1 failed -- test_generate_shadow_html.py:: test_every_static_site_page_has_the_copyright_footer on site/knowledge/index.html, which is RED AT HEAD and untouched by this tick (`git show HEAD:site/knowledge/index.html | grep -c "All rights reserved"` = 0, and the file is not in this tree''s modified set). Registered, not absorbed.

  EXIT (7), Part 1 lands intact -- and this time D36 IS built, so the criterion has real teeth rather than a signature pin: tests/company/compliance/test_printed_bill_foots_render.py 20/20 and `node tools/verify_printed_bill_render.mjs` PASS on the edited file -- 1600 rendered usage lines checked, 1600 printed a rate, 0 arithmetic failures.

  R15 BOTH WAYS on every one of the four, each mutation killing a NAMED test and each clean case proven clean in the same module: arrears re-sided to sim (the notice appears behind the wall and vanishes from the customer view); an unclassified event type appended to the REAL gas JSON is REFUSED by the page (harness exits non-zero with "declares no wall side") rather than silently placed; the pence label restored (the checker''s own subject carries it); a settlement clock put back on the churn probability (the class control flags it); the door selector''s repaint removed (the selector is still rendered but frozen on the wrong view -- the test distinguishes the stale case from the absent one, so a missing selector cannot pass as a proof).

  ONE FIXTURE REPAIRED, and it is a tightening. test_mutation_a_view_switch_that_skips_the_op_ state_region_kills_a_named_test pinned setWallView''s ENTIRE one-line body as a string, so it went red the moment a second statement was added to the function -- a fixture that rots on any unrelated edit. It is now anchored on the REMOVAL OF THE applyWallViewToOpState() CALL, which is the mutation it is actually about, and it still fails loudly if the fix is genuinely reverted. Separately, _run() now builds the op-state region from the SAME file it drives; it previously built it from the real INDEX, which would have made every op-state mutation invisible -- the wrong-subject class this module already paid for once in section (9).'
