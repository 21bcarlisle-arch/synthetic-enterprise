atom_id: EP6_wall_protocol_typing
chunk: 16
simplifications:
- '2026-08-20 pass 19 BUILD, level HELD at 2, loop_stage stays build. CHANNEL C NOW OWNS A CONFORMANCE QUESTION, and its first answer is that two of the three versioned seams never become messages at all. This pass does the one thing pass 18 recorded as the next move, verbatim: "give CHANNEL C its conformance question ... does an envelope crossing carry its version on the wire -- asked of `interface/contracts/wall_envelope.py`''s importers rather than the typed ports." Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 63bf50039, worktree.

  THE QUESTION HAD TO BE RE-DERIVED, AND THE ONE PASS 18 NAMED WOULD HAVE BEEN A TAUTOLOGY. `WallRequest`/`WallResponse` declare `schema_version` as a REQUIRED dataclass field, so "an envelope crossing carries a version" is true by construction on every tree that compiles -- R15 TAUTOLOGY exactly, a checked value guaranteed by the same definition it checks. Worse, the structural presence of the field is PRECISELY what makes the defect invisible: a `WallResponse` handed to the far side as a Python object has a `schema_version` attribute that is never serialised, never decoded and never refused, and it looks identical to a conforming crossing from every angle a field-presence check can see. So channel D''s question -- is the version actually ON THE WIRE -- lands on channel C as: does this seam''s envelope get ENCODED into the declared wire form by one side and DECODED back by the other, or does the object simply cross the call frame.

  BUILT: `envelope_wire_conformance` in `tools/wall_channel_census.py`, reporting four populations rather than a boolean, because "not wire-borne" hides three different repairs. `wire_borne` -- encoded and decoded. `half_wired` -- one side only, which is STRICTLY WORSE than in-process because it looks transported: bytes in the wire form that nothing version-checks, or a decoder with no producer. `in_process` -- neither, the defect the atom exists to close. `unversioned` -- a channel C seam declaring no `SCHEMA_VERSION`, reported rather than scored or dropped, because it has nothing to put on a wire and that is a different fact from staying quiet (the same discipline as `_ports_declaring_the_flag`).

  THE READING AT HEAD, and the first thing this atom has been able to say about the envelope channel: `channel C: 1 of 3 versioned seam(s) cross on a wire`. `payment_observable_seam` is encoded by `simulation.payment_seam_adapter` and decoded by `company.billing.payment_observation_consumer`. `conversation_seam` and `flex_observable_seam` are IN-PROCESS -- 19 channel C members, four seams, and only one of them has ever been a message. `wall_envelope` itself is the honest member of the unversioned bucket: it defines the shape and is not a crossing.

  THE TWO SIDES ARE DETECTED DIFFERENTLY AND THE ASYMMETRY IS THE DESIGN''S, NOT A SHORTCUT. `simulation/payment_seam_adapter.py`''s own comment forbids the counterparty importing the company''s codec -- a mock that encoded with the company''s decoder would make the round-trip a tautology in the R15 sense -- so there is no shared encoder to look for and an ENCODE site is recognised by the SHAPE it emits. The company has exactly one codec, so a DECODE site is recognised by importing `decode_request`/`decode_response` from it. THE SHAPES THEMSELVES ARE READ FROM `wall_protocol`''S OWN `REQUEST_WIRE_FIELDS`/`RESPONSE_WIRE_FIELDS`, never restated in the census, which is what makes this independent rather than self-agreeing: a field added to the envelope moves the contract and moves this control with it, where a copy of the key set would agree with itself for ever. THE SUBJECT IS DERIVED, pass 17 and 18''s discipline held: the seams come from `enumerate_c`''s own output, so a fourth seam owns a wire question on the day it lands rather than the day someone remembers to list it.

  R15: 21 new proofs, 85 passing in `tests/tools/test_wall_channel_census.py`, and the two doctrine mutations were RUN not asserted. (1) EXCUSE-EVERYTHING: relax the encoder match from "a dict literal whose key set IS a declared wire form" to "any dict literal at all" and both in-process seams jump to `half_wired ENCODED` -- the report would then claim `conversation_seam` and `flex_observable_seam` put bytes on a wire when they emit nothing of the kind, which is a verdict that excuses every unwired crossing while looking exactly as diligent. (2) FAIL-OPEN: default a missing `SCHEMA_VERSION` to 1 instead of reporting it and `1 of 3` becomes `2 of 4` with `wall_envelope` -- the module that DEFINES the envelope -- credited as a conforming crossing; the null control is the same wrapper without the default, which leaves the verdict byte-identical, so the move is the default and not the patching. BOUNDARY, the value the rule is most easily wrong about: a dict ONE KEY SHORT of the wire form is not an encode site and neither is a SUPERSET, because `absence is never agreement` is the envelope''s own law -- a message missing a required key is one the far side must refuse, so accepting it would certify as transported exactly the crossing that cannot land. FAIL-CLOSED four ways: an absent codec REFUSES rather than reporting every seam in-process (the reassuring failure -- with no shapes to match, a diligent-looking control finds a lot); a missing or computed wire-field constant refuses; all seams losing their version constant refuses, because deleting `SCHEMA_VERSION` is the cheapest way to make this pass; and ZERO channel C members is NOT refused, because a fully paid-down envelope channel is this atom''s success case and a control pinned to a non-zero count reds on its own success.

  REPORTS, DOES NOT GATE, and the condition for that changing is recorded in the code and asserted by `test_channel_C_is_NOT_wired_into_the_commit_gate_and_the_condition_is_recorded`. Two of three seams are in-process at HEAD, so gating channel C would refuse EVERY commit in the repo including the ones that migrate a seam -- pass 13''s landing-order defect, which this file has already learned once. It becomes a gate in the same commit that makes it satisfiable, which is the only commit in which restoring it is honest.

  L3 IS STILL NOT CLAIMED, AND PASS 18''S CONDITION WAS NECESSARY RATHER THAN SUFFICIENT. Pass 18 named one remaining blocker -- a second channel owning a conformance question of its own -- and that blocker IS discharged: C has one, R15-proven, mutations run. What discharging it REVEALED is a larger condition that was previously unmeasurable and is now a number: this atom''s claim is that every SIM/company boundary crossing becomes a typed, versioned message, and its own new instrument says two of three seams are not messages. Moving to L3 on the pass that first measured the gap would be greening my own verdict with the reading that convicts it. The level moves when channel C''s answer does, not when its question exists.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate `conversation_seam` onto the wire -- the counterparty (`simulation/conversation_response.py`) grows its OWN encoder emitting `RESPONSE_WIRE_FIELDS`, exactly as the payment adapter does and for the same anti-tautology reason, and the company side (`company/comms/conversation_generator.py`, `company/comms/susceptibility_estimator.py`) decodes through `company.interfaces.wall_protocol`. Conversation before flex because it is the narrower of the two -- three importers against four -- and because a second migrated seam is what turns channel C''s conformance from a sample of one into a rate the gate can eventually hold.

  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the in-process reading is this atom''s own subject and its repair is this atom''s own next move, not a defect in another lane''s mechanism.'
