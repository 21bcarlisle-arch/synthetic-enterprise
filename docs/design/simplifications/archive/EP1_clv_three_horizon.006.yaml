- "2026-08-19 DISCOVER/FRAME ONLY, pass 7, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (6 -> 7). Measured at\nHEAD bc689525a against the working tree, `docs/reports/run_output_latest.json` and the\ncommitted `docs/reports/ANNUAL_REPORT.md`. Every module named below was EXECUTED as it sits on\ndisk. Everything is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE SIX BEFORE IT DID NOT: it read the THIRD HORIZON. Passes 1-6\nmeasured the tenure leg (live, repaired four times), the contract-term leg (repaired pass 3)\nand the published surfaces. The portfolio-cohort leg -- `company/crm/clv_cohort_book.py`, named\nin pass 1 as \"literally this atom's third horizon\", built and unwired -- has been cited in six\nrecords and read in none. It is the cheapest unclaimed evidence left on this atom's own subject\nmatter, and it turns out to carry the atom's dominant defect class, un-remediated, twice.\n\n==========================================================================================\n1. R2 RE-VERIFICATION FIRST, AND PASS 6'S OWN PREDICTION WAS WRONG BY A FACTOR OF 1.93.\n==========================================================================================\n\nPass 6 escalated `WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO`\nLATENT -> BLOCKING and predicted the post-repair boundary in writing: \"the boundary is\nGBP 38,255.61 under Effect A alone and GBP 38,255.61 under exclusion. Only the current silent\nzero yields GBP 791.98.\" The repair landed (`84ae6bbeb`, finding archived to `done/`,\n`blocking_by_lane` empty over 89 documents this tick). What shipped:\n\n    ANNUAL_REPORT.md:2194  Median CLV: GBP 19,859.24 | Median churn: 32%\n    ANNUAL_REPORT.md:2246  Board action: CRITICAL quadrant has 1 account(s).\n\nThe board line moved 5 -> 1 exactly as pass 6 measured, so the finding was right about the\ndefect. The BOUNDARY is 19,859.24, not the 38,255.61 pass 6 twice computed. Reason, read at\n`saas/reporting/annual_report.py:8234-8265`: the repair fixed TWO things, and pass 6 modelled\none. It replaced `clvs[n // 2]` -- the upper of the two middle values -- with a real `_median`\nthat averages them for even n, and its docstring names that as a second defect in its own\nright. Pass 6 held the median CONVENTION fixed while varying the population, so its\ncounterfactual is an accurate reading of a code path that no longer exists.\n\nTHE LESSON IS ABOUT THE FORM OF THE PREDICTION, NOT THE ARITHMETIC. A counterfactual computed\nby re-running a shipped function with a substituted input predicts the world in which ONLY that\ninput changes. A repairer who sees the defect usually sees its neighbours too. Pass 6's number\nwas stated flatly as what the repair would yield; the honest form is \"under the estimator as it\nstands today\". Recorded here because this record is where this atom's passes check each other,\nand a prediction that missed is worth more written down than quietly superseded.\n\n==========================================================================================\n2. THE THIRD HORIZON, READ. IT HAS NO SLOT FOR THE FACT THE OTHER TWO WERE REPAIRED FOR.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_COHORT_HORIZONS_RECORD_TYPE_HAS_NO_SLOT_FOR_THE_\nPOPULATION_FACT_ITS_SIBLINGS_WERE_REPAIRED_FOR_2026-08-19.md` (LATENT, lane B_commercial,\nparsed both ways this tick; `classify_file` returns no class, so no class doc is touched and\nnothing is owed a re-render). Zero non-test importers at HEAD, re-confirmed, so LATENT is the\nhonest severity and BLOCKING would hold B_commercial for a risk rather than a red.\n\n`CustomerCLVRecord` declares seven fields and NONE of them says whether the customer is still\nsupplied -- grepped the annotations for `supplied|ceased|active|churn`: none. The tenure leg's\nrepair for the identical defect (`66141b70c`) is a REQUIRED keyword with no default, still that\nshape at HEAD (`saas/enterprise_value.py:153,174,202,211`), and the cohort leg has no slot to\nput it in. `clv_gbp` is annotated `float`; executed, `_cohort_summary` on a record carrying\n`None` raises `TypeError` from `sorted`. Loud, not silent -- to its credit -- but it means the\nboundary MUST resolve the blank and the record it writes cannot say which way it resolved.\n\nPASS 6'S \"FREE FALSIFIER\" CANNOT BE RUN HERE. Pass 6 declared, as this atom's design control,\nthat swapping a structural blank between `null` and `0.0` must move any aggregate EP1 publishes\n\"cheap on every horizon\". On this horizon that mutation raises before producing either figure.\nNot fail-open -- UN-RUNNABLE, which is worse in the R15 sense because there is no verdict to\nread at all.\n\nAND THE FALSIFIER THAT CAN BE RUN IS DEGENERATE ON THIS BOOK. Census of the 13 accounts in\n`run_output_latest.json::by_billing_account` on the 2x2 of (still_supplied, clv_is_null):\n\n    supplied=False null=True   n=5   C1 C3 C4 C5 C6\n    supplied=True  null=False  n=8   C2 C7 C8 C9 C_IC1 C_IC2 C_IC3 C_IC4\n    supplied=True  null=True   n=0   EMPTY\n    supplied=False null=False  n=0   EMPTY\n\nThe two discriminating cells are empty, so \"drop the nulls\" and \"keep only the supplied\" are\nindistinguishable. Executed, cohort book built from the live 13 under three policies:\n\n    policy        n      total_clv       avg_clv   profitable_pct\n    zero         13   1,283,074.77     98,698.06        53.8%\n    drop_null     8   1,283,074.77    160,384.35        87.5%\n    supplied      8   1,283,074.77    160,384.35        87.5%\n\nBit-identical on every field. A wiring of this horizon that never checks whether a customer is\nstill supplied WOULD PASS A POPULATION TEST ON TODAY'S BOOK -- for the same reason a stopped\nclock passes at noon, and the case that would separate them is exactly the bug the tenure leg\nhad. `profitable_pct` swings 33.7 points on the blank policy alone; on a residential split\n(`inferred` -- derived from the `C_IC` id prefix, a naming convention the run output does not\npublish as a field; the portfolio row above needs no such derivation) the cohort median is\nGBP 0.00 against GBP 976.92 and profitability 33.3% against 75.0%. Meanwhile the ONE\nqualitative accessor the class exposes, `is_profitable_cohort` (`avg_clv_gbp > 0`), reads True\nunder every policy: the boolean a reader would quote is blind to the choice that moves every\nnumber beneath it.\n\nTHIRD INSTANCE OF THE SAME CLASS, SAME MODULE: `_cohort_summary` returns an all-zeros summary\nfor `n == 0`, so a cohort that DOES NOT EXIST and a cohort that LOSES MONEY both publish\n`avg_clv_gbp=0.0` and `is_profitable_cohort=False`, distinguished by `customer_count` and by\nnothing else. That is the null-means-not-applicable vs zero-means-worth-nothing collapse\n`84ae6bbeb` repaired one module away, still live here.\n\nR15: 19 tests, green in 0.05s, ZERO mentioning `None`/`supplied`/`ceased`, all against one\nhand-written five-record fixture in which every `clv_gbp` is a concrete float -- the live book's\ndefining feature (5 of 13 unvalued) cannot arise in it. Three tests do not merely miss the\ncollapse, they PIN it: `test_by_acquisition_year_empty` asserts `avg_clv_gbp == approx(0.0)`\nfor a cohort that does not exist.\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE, WHICH IS WHY THIS BELONGS IN THE RECORD.\n==========================================================================================\n\nPass 6 counted this atom's defects five population/basis to one arithmetic and turned it into\na design constraint on EP1's OUTPUT: every horizon figure publishes its population, its\nexclusions and its margin line. Pass 7 says the constraint has to bind one layer lower.\n\n  THE POPULATION FACT MUST LIVE ON THE RECORD TYPE, NOT ON THE PUBLISHED SUMMARY. A horizon\n  whose per-customer record cannot express \"this customer is no longer supplied\" and cannot\n  express \"this customer has no CLV\" cannot publish an honest population no matter what the\n  renderer does, because the boundary that fills the record has already thrown the distinction\n  away. Two of this atom's three horizons were repaired at the record/boundary layer\n  (`ceased_accounts` required with no default; `_median` over a stated `placeable` population);\n  the third was never wired, and is the one that still cannot hold either fact.\n\n  AND THE FALSIFIER MUST BE CONSTRUCTED, NOT SAMPLED. Section 2 shows both discriminating\n  cells of the population 2x2 are empty in the live book. Any EP1 population control validated\n  against the current run passes without exercising its own subject. The test that must exist\n  is a deliberately built account that is supplied and unvalued, and one that is ceased and\n  valued -- neither of which the world currently supplies.\n\nThis does not replace pass 6's constraint; it names the layer at which it can be enforced, and\nsupplies the one falsifier shape that today's population cannot deliver on its own.\n\n==========================================================================================\nSTILL OWED, unchanged and now for the SEVENTH pass running.\n==========================================================================================\n\nTHE NAME COLLISION. `company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast\nwhile this atom's triple is contract-term/tenure/cohort;\n`company/finance/portfolio_dashboard.py:11` still propagates it. Seven passes, no resolution --\nthe decay shape MAKE_IT_STICK names. The pass 6 recommendation stands unchanged: rename it to\n`company/core/commitment_actual_forecast.py` in the FIRST commit of the draw that opens EP1,\nbefore a line of EP1 code exists. Zero non-test importers, re-confirmed this pass; it gets\ncheaper never.\n\nTHE UNCOMMITTED MARGIN-BASIS REPAIR, fourth pass running and still true at HEAD bc689525a:\n`saas/clv_model.py` CLV_MARGIN_BASIS HEAD=0 disk=3; `saas/cost_to_serve.py`\nnet_of_all_costs_margin_gbp HEAD=0 disk=5; `tools/generate_dashboard_data.py`\ncost_basis HEAD=0 disk=8; `tests/saas/test_clv_margin_basis.py` and\n`tests/tools/test_derived_basis_parentage_gate.py` still `??`. The published\n`enterprise_value_margin_basis` in the run output reads `net_of_all_costs_margin_gbp` -- a value\nno commit can produce. Its finding is live in the staging root at LATENT and landing it remains\na BUILD-lane draw.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`, no CLV pair in\n`docs/observability/coupled_gap_ledger.json`. Consumed, not absorbed (R17)."
