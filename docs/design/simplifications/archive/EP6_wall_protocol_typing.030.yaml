atom_id: EP6_wall_protocol_typing
chunk: 30
simplifications:
- '2026-08-20 pass 34 BUILD, level HELD at 2, loop_stage stays build. THE SECOND OF PASS 33''S TWO NAMED BLOCKERS IS CLOSED: THE CENSUS NOW HAS A QUESTION THAT FAILS ON UNSOLICITED INBOUND, AND THE LIVE WALL FAILS IT 2 OF 3. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD bf41f02ed, worktree.


  WHAT PASS 33 LEFT. The cold-eyes walk ran and said NOT YET, on two build items this seat can do: (1) give `WallStatus.TIMEOUT` a reader or delete it; (2) give the census a question that FAILS on an all-dormant request leg. This pass does (2) and does not touch (1), which remains the atom''s last named L3 blocker. Doing one and claiming both would be the ceremony the walk exists to stop.


  THE DEFECT, RESTATED PRECISELY, because pass 33''s prose was one step off. The walk said ''all-dormant request leg''; the code says something sharper. `envelope_wire_conformance` skips dormant legs when building `scored`, then credits a seam as `wire_borne` if every leg that REMAINS is transported. So a seam with a dormant request and a wired response is not merely unscored -- IT SCORES AS A FULL PASS. The transport question''s strongest possible answer, 3 of 3 wire-borne, is returned by a wall on which two of the three conversations never happen. The seam-level verdict credits a two-leg crossing on one leg, which is a class this project has already recorded once.


  THE CONTROL. `seam_conversation_conformance` in `tools/wall_channel_census.py`, with `ConversationVerdict` and `_at`. It asks one question per versioned seam -- ARE BOTH ROLES LIVE -- and sorts into four scored buckets, each naming a different repair: `conversant` (both live, the green case), `unsolicited` (response live, nobody asks), `unanswered` (request live, nobody answers), `silent` (neither). `versionless` and `legless` are reported and NOT scored, carrying the same honesty the transport verdict carries.


  THE LIVE READING, which is the finding: 1 of 3. `conversation_seam` is conversant. `flex_observable_seam` and `payment_observable_seam` are both UNSOLICITED INBOUND -- they declare a request leg this build never sends, so the company receives their observations as answers to nothing and the envelope''s `correlation_id` correlates to nothing it sent. This is exactly what the blind reviewer predicted from five sentences and no code: "''We model it as a response to a synthetic request'' is a fail." It now reds instead of printing as a neutral status word.


  WHY ROLE LIVENESS AND NOT LEG DORMANCY, which is the whole design decision and was measured, not assumed. The obvious implementation keys on ''a DECLARED leg that is dormant''. That rule can be shed by a ONE-LINE EDIT: delete the seam''s `WallRequest[...]` specialisation and there is no declared leg to be dormant, so the finding vanishes while the architecture gets WORSE -- the contract stops even claiming an ask. That is the R15 mutation that deletes the subject instead of moving it, and scope loss would have scored as green. Both rules were run side by side on the same fixture: on the deletion the weaker rule returns () and this one returns the seam. A role that is undeclared and a role that is declared-but-dormant are therefore the same bucket, and deleting the declaration is not available as a repair.


  IT REPORTS AND DOES NOT GATE, and that is a rule this file had already stated twice: a check becomes a gate ''in the same commit that makes it satisfiable''. This is the first check to arrive UNSATISFIED. Wiring it into the CLI''s exit code would refuse EVERY commit in the repo including the ones that repair it -- pass 13''s landing-order defect, learned twice already. So the verdict is PRINTED by `main()` and `test_the_conversation_check_is_REPORTED_by_the_CLI_and_deliberately_NOT_in_its_exit_code` asserts BOTH halves off the source: that `conversations.report()` reaches a reader (a control nobody sees is not reporting), and that `conversations.ok` is NOT in any return (arming it now would wedge the tree). That test names its own deletion condition.


  R15, AND THE GREEN CASE IS REACHABLE. 13 tests, section 22, all against section 15''s `two_leg_tree` fixture on purpose: where section 15 asserts `wire_borne`, section 22 asserts RED on the SAME tree, and `test_MUTATION_a_seam_nobody_ever_ASKS_is_UNSOLICITED_INBOUND` asserts both verdicts in one function so the disagreement is pinned rather than described. Mutations: nobody asks -> unsolicited; nobody answers -> unanswered (asserted NOT to collapse into unsolicited -- opposite defects, opposite repairs); neither -> silent, the bucket the transport question `continue`s past entirely; the declaration-deletion escape -> still red. NULL CONTROLS: an unrelated module constructing an unrelated type moves nothing (verdict equality, so the sample moves and the law does not), and `wall_envelope` stays reported-not-scored. FAIL-CLOSED: every seam losing `SCHEMA_VERSION` raises `CensusUnavailable` rather than printing a tidy ''0 of 0''. Zero seams is NOT refused -- a paid-down channel is this atom''s success case. The green case is reachable on the fixture, which matters because the live tree is red: a control that has only ever said no is indistinguishable from one that can only say no.


  A COLLISION CAUGHT BY THE RATCHET, recorded because the loss would have been silent. The new zero-seam test was first written under the same name as section 13''s, and a duplicate `def` at module scope does not fail -- Python rebinds, pytest collects only the second, and the transport question''s zero-seam branch would have stopped being tested with nothing reporting a loss. ruff F811 refused it. Renamed, and the reason is in the docstring. Test count moved 172 -> 186 (+13 new, +1 restored); the file is green.


  WHAT REMAINS FOR L3. One item, unchanged from pass 33: `WallStatus.TIMEOUT` has no production reader. Both company-side consumers collapse all four statuses to OK/not-OK (`company/billing/payment_observation_consumer.py:611`, `company/market/flex_participation.py:274`), so a status the contract distinguishes releases exactly what `ERROR` releases -- R11''s orphan transition in the small. NOTE FOR THE NEXT PASS, since it decides the shape of that work: those two modules are OUTSIDE this atom''s `file_scope`, which names only `wall_protocol.py`, its test, `wall_channel_census.py` and its test. The landable set is wider than the file_scope; the scope needs the two consumer paths added before that item can land, and that is a map edit, not a build. INFERRED: the unsolicited finding and the TIMEOUT finding are probably one defect seen twice -- a seam whose request leg is never sent cannot meaningfully time out, so giving TIMEOUT a reader on an unsolicited seam may be building a reader for an event that cannot occur. The next pass should decide which of the two repairs comes first rather than assuming they are independent.'
