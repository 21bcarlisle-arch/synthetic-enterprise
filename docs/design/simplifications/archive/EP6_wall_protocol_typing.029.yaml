atom_id: EP6_wall_protocol_typing
chunk: 29
simplifications:
- '2026-08-20 pass 33 BUILD, level HELD at 2, loop_stage stays build. THE COLD-EYES WALK RAN. Seven passes asked for it, six recorded in prose that they could not have it, and pass 32 built the predicate that would notice the day it happened. It happened this tick: `docs/observability/blind_review_ledger.jsonl` exists for the first time and holds one record, `cold_eyes_walk_outstanding()` returns `()`, and the map''s `infeasible_here` block is gone because the thing it claimed is no longer true. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 0f5224e98, worktree.


  HOW THE INSTRUMENT WAS OBTAINED, because six passes said it could not be. The blocker was never "no mechanism" -- `tools/blind_review.py` has been in the tree since 2026-08-08 with its blindfold, its ledger and its audit. The blocker was that the fresh instance had to come from somewhere, and each of passes 26-31 read its own invocation as forbidding delegation. What was sitting unused the whole time is the pattern `background/director_twin.py::_default_invoke` has carried since the 2026-07-12 self-caught incident: `claude -p --model <M> --tools= <prompt>`, cwd a scratch temp directory OUTSIDE this repo. That is not a fork and not a delegated agent -- it is a subprocess with no tool access, no repo, and nothing in its context but the packet. It is the exact shape a blind reviewer requires, and it was the twin''s shape first. Six passes recorded an instrument as unobtainable while the instrument was a sibling module''s twenty-year-old-looking subprocess call. INFERRED, and worth saying plainly: the thing that blocked this was a reading of the seat''s own permissions, not a fact about the machine.


  THE BLINDFOLD HELD, AND IT REFUSED ONCE FIRST. `--packet EP6_wall_protocol_typing` REFUSED: the index carries no plain-words description for this capability, so there was nothing blind-safe to derive. The restatement supplied via `--plain-words` is recorded as `restated` rather than `index`, which is the substitution being visible exactly as the tool intends. `--audit` re-derives the verdict from the stored text and reports "1 recorded review(s) audited, blindfold intact in each." The record carries `independence: false` by construction: the reviewer is the same model family as the builder, and this walk is BLINDNESS, not independence.


  WHAT THE STRANGER WAS GIVEN: five sentences of plain words about a supplier whose systems never read the market directly, whose every exchange with an outside party carries a version stamp and splits into an ask now and an answer later, and which cannot tell a genuine counterparty from a stand-in. No path, no identifier, no module, no prior verdict, no mention of a build.


  WHAT IT SENT BACK: priors before pixels (interface counts, MHHS volumes, DCC and REC timings, DTC release cadence, the cost of getting it wrong in imbalance and back-billing terms), a first doubt, and a 17-question battery -- 12 DISQUALIFYING, 5 SUPPORTING. Its net read: "a sound and unremarkable ports-and-adapters boundary, stated in a way that promises more than it can deliver," and its first doubt went straight at the atom''s own headline sentence: indistinguishability from a stand-in "is the property you get for free from any well-factored port, and it certifies nothing about whether the fake resembles the market."


  THE RECONCILIATION -- FIVE ANSWERS CHECKED AGAINST THE CODE, NOT AGAINST THE CLAIM.


  Q11, is the version stamp ENFORCED on receipt or just carried? ENFORCED, and this is the atom''s strongest answer. `SUPPORTED_SCHEMA_VERSIONS = frozenset({1})`; an out-of-set version raises `UNSUPPORTED_VERSION`, an absent one raises `MISSING_FIELD`, and the module''s own docstring names the sibling FAIL-OPEN it exists to avoid -- `tools/*_port.py`''s `entry.get("schema_version", SCHEMA_VERSION)`, a decoder supplying the answer it is checking. Passes the reviewer''s bar as written.


  Q1, what fraction of external calls go through this layer, and what does not? The census answers with a number and a candid exclusion list, which is precisely the answer the reviewer said he needed and precisely the answer he predicted would not be given. Six channels, 165 members: A=4, B=2, C=19, D=7, E=2, F=131. The typed versioned envelope is channel C alone. The largest channel by far, F at 131 members, is published artefact and is not a message path at all. "Everything" was never claimed here.


  Q5, can the answer that never arrives be modelled? HALF. `WallStatus.TIMEOUT` is first-class and deliberately distinct from `ERROR` -- the envelope''s own docstring argues the distinction well ("a timeout says nothing about whether the fact exists, only that the answer did not arrive in time") and explicitly assigns the caller an obligation on receipt. NO CALLER HAS ONE. Both company-side consumers collapse all four statuses to OK/not-OK: `company/billing/payment_observation_consumer.py:611` (`if response.status != WallStatus.OK`) and `company/market/flex_participation.py:274` (refuses on any non-OK status). `WallStatus.TIMEOUT` appears in the enum and in three tests, and in ZERO production readers. A status the contract went to the trouble of distinguishing, whose release triggers exactly what `ERROR` triggers, is R11''s orphan transition in the small: a flag whose effect is nothing. No horizon exists at all, let alone the 1-minute / 24-hour / 5-working-day ladder the reviewer asked for.


  Q2, where does unsolicited inbound live? THIS IS THE FINDING OF THE WALK. The reviewer, who had seen five sentences and no code, named the failure shape in advance: "''We model it as a response to a synthetic request'' is a fail." The census reports exactly that shape as a neutral status word. Two of the three versioned seams -- `interface.contracts.flex_observable_seam` and `interface.contracts.payment_observable_seam` -- run `request=dormant, response=wire`: they declare a request leg this build NEVER SENDS, and the company receives their observations as responses to nothing. That is unsolicited inbound wearing a response''s envelope. `tools/wall_channel_census.py:1464-1465` sees it and declines to score it: "Every declared leg is dormant: the seam describes messages this build never exchanges. No crossing, so nothing to red." The census can SEE the defect and has no question that FAILS on it. An outsider with five sentences found what an in-house control reports as a status word -- which is the entire argument for the technique, demonstrated on its first run.


  Q3, a conversation with more than two legs? NONE EXISTS. Four functions, `correlation_id` linking exactly one request to one response. Honest gap, and the same gap as Q2 seen from the other side.


  WHAT THIS MEANS FOR THE LEVEL, AND WHY IT IS STILL 2. The walk was the L3 exit criterion and the walk has been performed and recorded. It would be available right now to read that as the criterion discharged and move the level. That would be the move the criterion FORBIDS: a cold-eyes walk whose two sharpest DISQUALIFYING answers are confirmed true against the code is a walk that says NOT YET, and greening a level on the mere fact that the review happened would make the instrument a ceremony. So the level is held, and the REASON has changed, which is the whole gain of this pass. Passes 26-32 held on an instrument this seat could not obtain. Pass 33 holds on TWO NAMED BUILD ITEMS this seat can do: (1) give `WallStatus.TIMEOUT` a reader, or delete it -- a distinction with no consumer is not a distinction; (2) give the census a question that FAILS on an all-dormant request leg, so that "the company receives messages it never asked for" reds instead of narrating. Both are inside the atom''s existing `file_scope`. Neither needs a fresh instance, a director, or an instrument.


  WHAT REMAINS. The two items above are the L3 blockers now. `infeasible_here` is removed from the map cell because its predicate is `()` and a map claiming a blocker that is not there is worse than a map claiming nothing. `tests/tools/test_discovery_pass_ceiling.py::test_the_live_map_and_EP6s_predicate_agree_about_what_this_seat_cannot_pay_for` red on the disagreement first and is green on the removal -- the control fired on the event it was built for, which is the second thing this tick proved that a mutation test could not have.'
