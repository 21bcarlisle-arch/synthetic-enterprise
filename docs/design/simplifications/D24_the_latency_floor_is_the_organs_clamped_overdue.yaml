atom_id: D24_the_latency_floor_is_the_organs_clamped_overdue
map_notes:
  build_note: 'BUILT 2026-08-10 (worker tick, L0->L2). THE ORGAN''S CLOCK IS SIGNED: `age_open_items`/`age_balance` publish `(as_of - due).days`, not `max(0, days)`. TWO LIVE DEFECTS, both reproduced before the change and neither of them the harness''s: (1) `collections_snapshot` selected the dunning path''s trigger-0 step from the moment a bill was ISSUED -- a residential customer chased for a bill they had been given 14 days to pay; (2) the same zero also stood for ''no items at all'' (`max(..., default=0)`), so an account with NOTHING open read `dunning_action=''reminder''`. Both are one class: zero doing duty as ''nothing'', ''not yet due'' and ''due today''. R15 BOTH WAYS, 11 new mutation tests: `assert_overdue_clock_resolves_before_due` is a DIFFERENCE against elapsed calendar time (never a re-derivation of `due = issue + terms`, which would be R15''s tautology), so it fires on the shipped clamp AND on a weekly-quantised clock that has no floor at all, is fail-closed on an empty probe and refuses to run on a domain with no pre-due days; `assert_dunning_requires_an_item` fires on the zero sentinel, on a disputed-only account and on a not-yet-due item, with a vacuity guard that an INERT selector fails. Both are wired into `collections_snapshot` so a re-clamp raises at read time. R10, the class not the instance: `assert_age_buckets_partition` now probes from -400 days -- the clamp was the only thing keeping negative days out of the bucket function, so lifting it without widening the probe would have moved an untested domain into production. THE HARNESS SIDE, re-derived because D23''s own control fired by name the moment this landed: -5d and -20d now read 0.0 vs -14.0 (date) and 0.025597 vs 0.500000 (set) at seed 7, so `ORGAN_QUERY_GRID`''s declared collapse was a debt outliving its debt. What is left is NOT a debt and the register now says which of three kinds each residual is: -20d/-30d collapse because nothing exists to reconcile before the invoice is ISSUED (a bound on the COMPANY''s knowledge, witnessed by `n_recon_dated_at_issue_floor` saturating for both and zero at the baseline), -15d/-20d collapse only in the SET reading because a saturated set has nowhere to go (a bound on the READING''s shape, witnessed by the sibling date reading separating the same pair), +1d likewise. Neither claim is takeable on trust: a knowledge-bound whose readings are not AT the floor is refused as a debt in disguise, a shape-bound the sibling is equally blind to is refused as a dead instrument. NEW `distinct_pairs` ((-5,-20) on both readings) is the direction `collapsed_pairs` structurally cannot check -- a collapse rule fires when a residual is FIXED, never when a fix is UNDONE -- and its mutation test re-clamps the REAL organ (`mock.patch` on the shipped `age_open_items`) rather than simulating it. R12: NO published figure moved. The shipped baseline is 5.0 / 0.014505 exactly as before, because a positive grace and a bucket scheme whose lowest band is ''current'' read a negative day exactly as they read zero; what changed is that the organ can now be ASKED about the days before the due date. EVIDENCE: 298 green in tests/tools/test_couple_w2_11_d5.py + test_d7_ageing_measures.py, 2,146 green in tests/company/billing/, plus every suite touching the arrears organ, the payment-observation consumer and the live triad.'
