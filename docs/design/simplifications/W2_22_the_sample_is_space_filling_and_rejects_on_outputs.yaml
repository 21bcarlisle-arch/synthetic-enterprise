atom_id: W2_22_the_sample_is_space_filling_and_rejects_on_outputs
map_notes:
  gain: 'HOUSING RULING section 1 and 3.2, and the director''s framing is the whole of it: ''Draw for DIFFERENCE, not for proportion. Two London terraces on one street teach the world nothing the first did not.'' AND THE REJECTION IS JUDGED ON OUTPUTS, NOT INPUTS -- usage level, shape, weather gradient, and the ceiling on each lever -- never on type/age/size labels. That distinction is the atom: a similarity test run on inputs produces a sample matching every marginal and missing every joint corner, which is failure mode (a) the ruling names. DELIVERS the two coverage curves (distinct houses versus variance covered; tail coverage as the share of the population''s top 1% on each output represented) and therefore N, which is REPORTED rather than chosen. Coverage is a property of the ENSEMBLE OF RUNS with a visited-corner ledger across lives -- the director explicitly does not want every house in every geography in one run.'
