atom_id: SPINE_3_gas_storage_crisis_regime
simplifications:
- '2026-07-29 DISCOVER (L0->L1) + FRAME (design) -- promoted to docs/design/SPINE_3_GAS_STORAGE_CRISIS_FRAME.md (this atom''s OWN frame doc, now first in evidence; an inline-only FRAME does not saturate, so this is what stops the every-tick re-hand). DISCOVER, verified against disk with file:line evidence rather than inherited from BOARD_SPEC_004: wholesale gas today is REPLAYED REAL HISTORY -- sim/gas_prices_history.py:1-27 ingests FRED PNGASEUUSDM (a TTF proxy for NBP, fixed GBPUSD 1.28), :73-90 repeats the MONTHLY value once per calendar day (so the daily series has zero intra-month structure), persisted to sim/gas_data/nbp_sap.csv (3,446 daily records, 2016-01-01..2025-06-07) and read at the wall by company/interfaces/sim_interface.py:313-315. THE 2021/22 INVERSION IS NOT SCRIPTED ANYWHERE: a full sweep of sim/ for a hardcoded crisis returns only docstring prose (forward_curve.py:7, gas_scenario_generator.py:25-26, risk_engine.py:19-21, intraday_shape.py:31-32) -- no branch, no month table, no date-keyed multiplier. The ONE hardcoded crisis trajectory (sim/scenario/curriculum/crisis_2021_22.yaml:26-33: gas_trend 84->226->130 p/therm, storage_capacity 1.0->0.75->0.35) is INERT -- grep for paths_as_of/ScenarioSpine across sim|company|saas|background|tools finds exactly ONE importer outside spine.py, background/run_rotation.py:58, which only stamps ledger rows, so no generator consumes it; it is ratified:false/in_rotation:false besides. The synthetic generator sim/scenario/gas_scenario_generator.py:150-169 NEVER CONSULTS THE MONTH (current_date is used only for the settlementDate string at :172), so its expected seasonal spread is zero-plus-noise in every preset -- it cannot form a winter premium, let alone invert one. The only seasonal shape in the tree is sim/forward_curve.py:82-88/:88 GAS_MONTH_SEASONAL_MULTIPLIER, a STATIC dict in the COMPANY BELIEF pricer averaged across 2016-2024 (sim/data/seasonal_calibration.json), so the one inverted year is diluted to invisibility and the belief is winter-premium PERMANENTLY -- it cannot change sign, which is precisely the structural gap the coupled triad will measure. REAL TARGETS COMPUTED THIS PASS from nbp_sap.csv (computed, never recalled): the detrended per-year shape spread (winter/annual minus summer/annual ratio) is POSITIVE every year 2016-2024 (+0.009..+0.605) and NEGATIVE in exactly ONE year, 2022 = -0.387; the trading-definition realised spread W2021/22-S2022 = -34.44 GBP/MWh (the advisor decade review cites -29.7 for the same event -- NOT reconciled, different series/window, which is WHY the tolerance is a band and not a point); transience 2021 +0.394 / 2022 -0.387 / 2023 +0.300; collapse leg 2022-08 186.54 -> 2022-10 55.47 = -70.3% in two months. A methodological trap is recorded: on a trending series the realised winter-vs-following-summer spread is trend-contaminated (W2020/21-S2021 reads -18.45 purely from the run-up), so the PRIMARY criterion is the detrended one. FRAME designs the stock-and-flow (European working-gas stock S_t; balance B_t = pipeline+LNG+indigenous minus heating(HDD-driven)+power-burn(merit-order-driven)+industrial; fill-DEPENDENT rate bounds running in OPPOSITE directions -- injectivity falls as the store fills, deliverability falls as it empties, the load-bearing nonlinearity a linear model will silently miss), the transmission (security margin m_t = (S_t - expected remaining-season draw)/C_wg evaluated under normal-weather climatology, never realised weather; P = marginal LNG netback x Phi(m_t) with Phi convex and deliberately the SAME functional form as price_engine.py:99-103''s residual-demand multiplier -- no new price-model family, SIMPLICITY GUARD), and the INVERSION mechanism: a low-stock winter exit forces a refill race whose required injection rate becomes ADDITIONAL SUMMER DEMAND competing for the marginal cargo (fear-as-injection-demand, Spec-004 4.FLOW, scored ABSENT there for want of a storage state), amplified by the fill-dependent injection cap, while the winter leg does NOT rise because a refilled store restores projected winter cover -- so F(Winter)-F(Summer) crosses zero WITHOUT any calendar term, and the SAME mechanism produces the post-refill COLLAPSE (A_t vanishes discontinuously at target), which is the leg B6 actually needs. Acceptance: leg A SIGN, detrended shape spread strictly < 0 (primary, non-negotiable); leg B MAGNITUDE -0.55..-0.20 (observed -0.387); leg B-prime LEVEL -20..-70 GBP/MWh, a band DELIBERATELY WIDER than the 4.7 disagreement between two independent measurements of the same real event (a tolerance narrower than the disagreement between measurements of the target is false precision); leg C TRANSIENCE, positive the year before AND the year after (else it is a re-parameterisation, not a regime); leg D COLLAPSE <= -50% over two months. Absolute price LEVEL is deliberately NOT an acceptance criterion (R12: diagnostic, never target). R13 SPLIT: BASELINE/agent-buildable = the recursion, the bound shapes, C_wg, the demand decomposition, m_t and Phi''s form, Phi''s fit-to-reality calibration, F(sigma), the seasonal-spread DEFINITION and the acceptance/oracle machinery; CURRICULUM/director-reserved = the shock magnitude/onset/ramp/persistence, the fill TARGET S* and its deadline (a POLICY intervention -- Spec-004 3.INTERVENTION; A_t is a MECHANISM, S* is a VALUE), and rotation/true_probability/ratification. ONE sub-part falls exactly the W1_2_generate_futures way (content=curriculum, mechanism=agent): the storage_capacity path VALUES in crisis_2021_22.yaml -- and sharper than ownership, under this design a director-authored storage TRAJECTORY would re-script the answer one layer down, since the trajectory must be an OUTPUT; that field should become initial-condition + capacity, or be removed in favour of the shock parameters, and the reinterpretation is the director''s (Q2). UNLIKE W1_2, the mechanism residue here is ENTIRELY UNBUILT, so this is a real build waiting on its gate, not a W1_2-shaped no-build. R12 BINDING CLAUSE: the shock magnitude must be set from the externally observed real supply reduction and NEVER solved backwards from the target spread -- an out-of-band result is an R4 diagnosis, never a cue to retune; honestly recorded as a PROCESS discipline that no mutation test can catch (a back-solved magnitude greens the suite by construction), mitigated only by requiring the curriculum artefact to cite an external source so an uncited number is at least visible. R15 at BUILD names the TAUTOLOGY trap in three concrete forms -- T1 parameter tautology (assert the spread matches a curriculum field the generator itself reads), T2 arithmetic tautology ("assert storage fell, then assert price rose" where P=f(S) by construction, which cannot fail while the code compiles and merely re-asserts the code''s own arithmetic), T3 self-oracle (derive the band from the generated series) -- and the independence rule that kills all three: the CHECKED value comes from the world''s emitted series while the ORACLE takes only nbp_sap.csv plus a date window, enforced by a test that the oracle module imports neither the generator nor sim.scenario.spine. Seven mutations must go RED: M1 zero the shock leaving the scenario label intact (the strongest single control -- if A/B stay green the inversion did not come from the shock), M2 freeze S_t, M3 constant withdrawal rate, M4 A_t=0, M5 permanent shock (leg C), M6 ramp A_t to zero instead of the discontinuous drop (leg D), M7 bidirectionality -- the test must FAIL on the baseline history_replay and on a null-shock run, because a control that passes on every world distinguishes nothing. Plus fail-OPEN guards (empty/short series, non-finite values rejected FIRST before any comparison, missing oracle file, no shock/series overlap, near-zero detrend denominator) and fail-SILENT guards (oracle raises = FAILED, never skipped-green), on top of SPINE_1''s inherited W1 wall / W2 byte-identical-baseline / W3 curriculum-not-tuning. B6 CONTRACT: SPINE_3 alone is NECESSARY BUT NOT SUFFICIENT -- B6 also needs a per-tenor daily forward MARK (B4_traded_product_ladder/WVC_2) because variation margin marks a MOVING FORWARD and a spot-only series gives it nothing to mark against; and it needs the COLLAPSE leg, not the spike, because a supplier holding bought cover is LONG and dies when the forward FALLS (the real killer was -70.3% Aug->Oct 2022 against a book bought at the peak) -- a world that only spikes cannot kill B6. Speed dF/dt is a headline diagnostic (the cash crisis is driven by the rate of change, not the level), and margin calls stay asynchronous per C-S3. COUPLED TRIAD: the company cannot read S_t; it sees published prices, its own book, and -- a flagged reversible judgement call (Q3) -- possibly a LAGGED, EU-aggregate, typed published storage feed, because a real desk DOES watch GIE storage data and the epistemic test is "could a real supplier know this", so the wall here is lag + aggregation + absence of foresight, NOT blindness; the import-direction wall is unchanged. Harness measures the seasonal-spread belief gap (predicted to be large, structural and one-directional because the company''s static multiplier table cannot change sign), the storage-state belief gap, and regime-recognition latency. Four open questions filed for the director (Q1 is the tolerance baseline or curriculum -- this FRAME argues BASELINE, because what happened in 2022 is a fact of the record and not a difficulty dial, which is a deliberate narrow disagreement with this atom''s existing map note, surfaced rather than silently resolved; Q2 storage_capacity semantics; Q3 storage feed vs strict blindness; Q4 B4 ordering). Real figures BUILD must FETCH and may NEVER fill from recall are named (EU fill-regulation numeric targets and regulation number, GIE AGSI actual fills, EU aggregate working-gas capacity, GB-vs-EU storage, and the real pipeline-reduction magnitude which the R12 clause makes load-bearing) -- each already recorded as a failed-fetch gap at docs/market_research/scenario_spine_and_friction_anchors_2026-07-23.md:145-160,228-229; none is asserted as fact anywhere in the FRAME. LEVEL HELD AT 0, deliberately and not for want of work: the L2 bar is "mechanically real AND mutation-tested" and NOTHING is built (loop_stage: idle), so claiming L2 for analysis alone would be an unearned level; separately tools/level_promotion_gate.py refuses ANY unauthorized level_current increase at write time (MATURITY_MAP.md section 0 -- the director and advisor own levels, the agent proposes with evidence and never moves a cell) and R16 forbids --no-verify on a level_current change. An L1 proposal citing this FRAME is filed in docs/observability/level_up_proposals.jsonl. Precedent followed: H29_import_time_env_capture_test_isolation held level_current at 0 through a complete DISCOVER+FRAME and closed its re-draw treadmill by promoting the FRAME to a real artefact, not by bumping a level.'
- '2026-07-29 REGISTERED into the map (worker tick, sole map writer per THREE_LANES) from docs/design/BACKLOG.md item B2 (Wave B) + docs/design/SCENARIO_SPINE_AND_TRADING_FRICTION_FRAME.md section C sibling SPINE_3_gas_storage_crisis_regime. AUTHORING ONLY (EPOCH_GATING: agent may author candidate atoms, provenance: proposal, never BUILD until opened). SEQUENCING RECONCILIATION: the FRAME (2026-07-23) held SPINE_3-5 "named-not-registered until SPINE_1 lands"; docs/design/THE_STANDARD.md (2026-07-29, governing) SS7.3 directs turning the Wave-B backlog into real candidate atoms now -- registration is not build, and depends_on: [SPINE_1_scenario_world_state] encodes the landing prerequisite so nothing can build out of order. This is the WORLD half of the Wave-B coupled pair; COUPLED-TRIAD law binds it to B6_collateral_cash_death_loop (the company capability this world exists to defeat) -- neither reaches L3 without the other. R13 SPLIT: the storage stock-and-flow MECHANISM is agent-buildable; the shock magnitude + the target 2021/22 inversion shape/tolerance are director-authored CURRICULUM, decided blind to company P&L (R13). DoD (BACKLOG B2): a storage state variable drives wholesale gas such that a defined shock scenario reproduces an inversion of the observed 2021-22 shape within a stated tolerance, verified blind to company P&L, registered as a scenario in SPINE_1s spine. No BUILD code, no engine touched, level_current 0 (R16: no self-bump).'
map_notes:
  name: 'Gas storage stock-and-flow that can ENDOGENOUSLY produce a 2022-shape inversion: a European storage stock variable that fills and draws, driving wholesale gas so a defined supply-shock scenario reproduces the winter-2021/22 seasonal-spread inversion within a stated tolerance, rather than the inversion being scripted. The load-bearing Spec-004 gap; registered as a scenario within SPINE_1''s spine. BACKLOG.md B2 (Wave B, coupled with B6).'
