atom_id: D46_the_validator_holds_against_the_varied_population
map_notes:
  gain: 'DIRECTOR SEQUENCING, 2026-09-05 console, STAGE 2 of three and it supersedes the ranking where they conflict: ''Second: bill it correctly. Every one of those varied customers, across payment methods, estimated and actual reads, catch-ups, moves and deemed contracts. The bill validator is the test -- it reconstructed 11,549 periods to the penny on a small homogeneous book, and it needs to hold against the population the segments produce. WHERE IT DISAGREES, THE VALIDATOR WINS.'' That last clause is the ruling: the validator is not a report on the biller, it is the arbiter over it. THE ATOM HAD NO EXISTENCE UNTIL NOW -- the nearest rows were D4_loyalty_incentive_billing at dial 1 and the DCC/n3rgy adapters at 3 -- which is the same defect as the phase-1 rulings this morning: a thing ranked first that was not in the queue. WHAT MAKES THIS HARD is exactly what stage 1 produces: today''s book is homogeneous, so estimated-versus-actual reads, catch-up bills after a long estimate, a change of tenancy mid-period, a deemed contract on an incoming occupier and three payment methods with different charging mechanics are all either absent or rare. Each is a billing path the reconstruction has never met. AND THE HONEST BOUND MUST TRAVEL WITH THE RESULT: tools/independent_bill_validator.py''s own header says the levy line is UNCHECKABLE (the exported figure bundles DUoS, TNUoS, BSUoS, RO, FiT, CfD, CM and smart metering against a cited-but-unfetchable source) and the VAT AMOUNT is unreconstructible because its base contains that line. docs/design/WHAT_THE_BILL_VALIDATION_CANNOT_CATCH.md exists so that ''11,549 of 11,549'' is never quoted without it. A green validator is not a green bill; it is a bill whose reconstructible lines agree.'
