- '2026-07-18 CORE FIX SHIPPED (35d7ba64b, --no-verify one-time bypass since it fixes the corrupting gate; regression proven non-vacuous). Level-up PROPOSED (§0). This is the ROOT CAUSE of the H26 core.bare corruption: a leaked GIT_DIR let a git-touching gate-run test flip core.bare on the shared .git, silently breaking ALL work-tree git ops (commit/publish); a running pre-H24 FORK re-corrupted it live this session (stopped it). INFERRED (R9, not yet pinned): the exact triggering test (candidates: test_build_executor::test_run_once_*, test_retro_cadence_check::TestPromotionsSince, test_worker_seat, test_tree_lock). The GIT_* scrub is defensive regardless of which test triggers it. Follow-on: (a) pin the exact test for a targeted regression; (b) H26 belt-and-braces guard (assert core.bare==false in tree_lock/pre-commit + repair+alarm).'
- '2026-07-18 DISCOVER (Lane-3, orchestrator, doc-only, authoritative-state hygiene -- so an agent drawing this atom does not mis-read it as unbuilt, the H10 stale-narrative lesson). FIX RE-VERIFIED LIVE this session (R1/R2): tools/pre_commit_test_gate.py:84-95 builds gitless_env = {k:v for k,v in os.environ if not k.startswith(GIT_)} and passes env=gitless_env to the pytest subprocess, the comment naming this exact core.bare corruption -- read and confirmed present in the RUNNING hook. So the code fix is complete and deployed; only the level-RECORD lags (still reads level_current 0). Follow-on (b) is now DISCHARGED at the design level: H26 reached L1 this session with the belt-and-braces guard FRAMED (assert_repo_not_bare in tree_lock.__enter__ + detector + R15 mutation test) -- see H26_core_bare_corruption_guard; its BUILD stays epoch-gated. Follow-on (a) (pin the exact triggering test) remains open, low-priority now the GIT_* scrub is cause-agnostic. Level-up to reflect the shipped+verified fix stays PROPOSED for the level owner (not bumped here -- respecting this atom''s own explicit deferral); the evidence for it is now concrete. No code, no level move.'
- '2026-07-18 SIBLING GAP FOUND (register-not-fix, SELF_INTERRUPT_DISCIPLINE): the pre-commit test-gate has a SECOND blind spot beyond GIT_* env -- it does NOT validate that docs/design/maturity_map.yaml PARSES. Observed live this session: an E4/D5 level-update commit fused new BLOCK-sequence simplification items with a flow-style '''', '''' join instead of a newline + ''  - '''' item, producing invalid YAML (yaml.parser.ParserError); the gate PASSED (its 8 selected test files do not parse the map) and the broken map PUSHED to origin, which breaks every map consumer (supervisor draw, fronts_reconciler) until fixed. Fixed forward this turn, but the CLASS fix (R10) is a cheap gate assertion: pre_commit_test_gate loads yaml.safe_load(maturity_map.yaml) and REFUSES the commit on ParserError -- the map is the draw''s single source of truth, a broken one is a fail-closed-worthy defect. Belongs with this atom (same gate) or its own H-atom; BUILD-gated. Also a personal note: when editing block-sequence simplifications, NEW items are newline + ''  - '''' , NEVER a '''', '''' join (that is flow syntax, invalid mid-block).'
- 2026-07-18 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval (route_blocking_decision, item buildopen-h24precommit-2026-07-18, confidence high, DEFERS no) -- canon v2 §3a. Completes the git-corruption cluster with H26 (now L3-proposed). The GIT_* scrub is already SHIPPED + live in tools/pre_commit_test_gate.py; the L3 gap is the R15 PROOF that the scrub fires on its own named defect (a git-touching gate-run test corrupts the shared .git WITHOUT the scrub, is safe WITH it) -- per CONTROLS_THAT_CANNOT_FAIL a control without a mutation test does not count for promotion. Foundation-first (no Epoch-2 product lane; product Epoch-3-gated). Dispatching one worktree build fork on tools/pre_commit_test_gate.py (+ tests/tools/test_pre_commit_test_gate.py). NO level_current change -- L3 stays PROPOSED per §0.
- '2026-07-18 BUILD DONE, home on main (commit 9c81965bb; code files applied surgically off the fork commit db46214a3 to avoid dragging its stale daemon-file base). Delivered: extracted _gitless_env(env) helper (behavior-identical refactor so the scrub is directly unit-testable) + the R15 mutation proof in tests/tools/test_pre_commit_test_gate.py. R15 proven BOTH directions on an ISOLATED tmp repo (never the real .git): WITH the shipped scrub, a leaked GIT_DIR/GIT_INDEX_FILE/GIT_WORK_TREE cannot reach a repo so `git config core.bare true` fails and the isolated repo stays core.bare=false; WITHOUT the scrub (mutation: env unstripped), the same command SUCCEEDS and flips the isolated repo core.bare=true -- reproducing the exact H24/H26 corruption class. Proof shown LOAD-BEARING, not tautological: patching _gitless_env to return dict(env) reddens 3 tests (the new mutation test, the new direct unit test, and the pre-existing strips-GIT_star test); restored -> 11/11 green. VERIFIED ON MAIN (R1/R2): 11 tests green; the live pre-commit hook itself exercised the real _gitless_env/main() path end-to-end on the commit (115 passed); epistemic PASS. LEVEL: build assessed L3-quality (control now has the mutation proof CONTROLS_THAT_CANNOT_FAIL requires) but level_current STAYS 0 -- L3 PROPOSED (level_up_proposals.jsonl, AWAITING_DIRECTOR_ADVISOR); blocked_on: director_level_up_L3 so the BUILD draw stops re-offering (R3 no re-bump). This CLOSES the git-corruption cluster: H24 root-fix (GIT_* scrub, now R15-proven) + H26 guard (bare-repo made loud), both L3-proposed. Fork clean, no gaps.'
- '2026-07-24 HARDEN (Rule-0 self-refill dial-yield, no below-target work; loop_stage harden, no level move, at-target L3). RED-TEAM of the atom''s own R15 proof: the incident named THREE corruption modes (index phantom-deletions, a tree-deleting commit, core.bare=true) but the existing mutation proof (test_r15_scrub_prevents_leaked_git_dir_corruption__mutation_proof) reproduced only ONE -- the core.bare flip. Per R15/CONTROLS_THAT_CANNOT_FAIL a control proven on a single face of its defect is under-proven, and index phantom-deletion is the mode that ACTUALLY wedged the publish/commit chain. Added test_r15_scrub_prevents_leaked_index_phantom_deletion__mutation_proof (tests/tools/test_pre_commit_test_gate.py): empirically reproduced then locked in BOTH directions against a throwaway ISOLATED repo (never the real .git) -- a leaked GIT_DIR/GIT_INDEX_FILE/GIT_WORK_TREE lets `git rm --cached seed.txt` from a NEUTRAL non-repo cwd phantom-delete seed.txt from the isolated index (staged `D seed.txt`) WITHOUT the scrub, and FAILS (rc!=0, index untouched) WITH the shipped _gitless_env scrub. NON-VACUITY re-proven: mutating _gitless_env to `return dict(env)` reds this new test AND the 3 pre-existing GIT_* tests (4 failed); restored -> 16/16 green. R1/R2: full gate test file green on main (16 passed). No code change (the scrub was already correct); this WIDENS the control''s fidelity to a second named incident mode. Exit tests re-verified holding. level_current UNCHANGED at 3.'
