- '2026-07-28 HARDEN (Rule-0 self-refill dial-yield, agenda+staging empty, no below-target work; loop_stage harden, no level move, at-target L3). AUDIT-THE-SIBLING-HALF for the H24 corruption CLASS (R10: close the class, not the instance). The four GIT_* faces + parse blind-spot are all proven WITHIN tools/pre_commit_test_gate.py, but the committed hook (tools/git-hooks/pre-commit) chains SIX gate steps that ALL inherit the commit''s GIT_INDEX_FILE/GIT_DIR/GIT_WORK_TREE -- the identical leak surface. Audited every one: the two gates that spawn an ARBITRARY pytest subprocess (pre_commit_test_gate.py AND its sibling site_lane_gate.py, which runs `pytest site/`) BOTH already scrub GIT_* via a _gitless_env; the three read-only gates (level_promotion / moap_coherence / ruling_archive_question) run only their OWN `git show :<path>`/`git diff --cached` -- read-only, cannot corrupt -- and deliberately KEEP GIT_INDEX_FILE so the staged-blob read works. So NO instance gap exists today. But the CLASS had NO structural guard: a future 7th gate added to the chain that runs pytest without scrubbing would SILENTLY re-open H24/H26 (CONTROLS_THAT_CANNOT_FAIL -- the protection lived only in two hand-written call sites, not an invariant). Added test_every_hook_gate_that_spawns_pytest_scrubs_GIT_star__class_guard (tests/tools/test_pre_commit_test_gate.py): parses the hook TEXT for every `python3 tools/<gate>.py` step (reconstruct-from-repo, so a new gate is auto-covered), and asserts every gate whose source spawns a pytest argv also strips GIT_* -- reds any future unscrubbed test-spawning gate at write time. R15 proven BOTH ways: mutating site_lane_gate.py''s scrub (startswith(''GIT_'') -> ''XIG_'') reds the guard naming site_lane_gate.py as the defect; restored -> green. Non-vacuity built in: the guard fails-CLOSED if it parses zero gates, and asserts both known spawners were actually exercised (so it cannot pass by matching nothing). No production code change (both spawners were already correct); this converts a two-call-site convention into a class invariant, discharging the audit-sibling-half obligation for H24. Exit tests re-verified holding (20 -> 21, all green). level_current UNCHANGED at 3.'
