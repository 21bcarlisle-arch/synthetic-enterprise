level_current UNCHANGED at 3.'
- '2026-07-24 HARDEN (Rule-0 self-refill dial-yield; product lane SITE_MODEL_SPINE walled this tick -- §A director-pixel-gated, §D blocked-on-§A, §C-arrears a supervised SIM build not a bounded blind-land -- so the always-drawable harden lane is correct; loop_stage harden, no level move, at-target L3). THIRD and final named face of the H24/H26 incident now R15-proven: a LEAKED TREE-DELETING COMMIT. The two prior proofs cover CONFIG (core.bare flip) and INDEX (phantom-deletion staged but not committed); neither reaches HEAD. The incident''s most destructive face was "once producing a commit that deleted the whole tree" -- the leak advancing the real repo''s HEAD to a commit whose tree is empty. Added test_r15_scrub_prevents_leaked_tree_deleting_commit__mutation_proof (tests/tools/test_pre_commit_test_gate.py): empirically reproduced (probe: leaked GIT_DIR/GIT_WORK_TREE/GIT_INDEX_FILE + `git rm --cached seed.txt` + `git commit` from a NEUTRAL non-repo cwd advances the ISOLATED repo''s HEAD, ls-tree HEAD now empty) then locked BOTH directions -- WITH the shipped _gitless_env scrub HEAD is UNMOVED and the tree keeps seed.txt; WITHOUT it HEAD advances to an empty-tree commit. Entirely against a throwaway isolated repo, never the real .git. NON-VACUITY re-proven: mutating _gitless_env to `return dict(env)` reds all THREE R15 faces (core.bare + index + tree-deleting-commit); restored -> 17/17 green. R1/R2: full gate test file green on main (17 passed). No code change (the scrub was already correct); all three named incident faces now fire against the control, closing the CONTROLS_THAT_CANNOT_FAIL "proven on a single face" gap for this atom. Exit tests re-verified holding. level_current UNCHANGED at 3.'
