atom_id: SITE7_capabilities_tab
map_notes:
  gain: 'The cheapest step in the programme and the one that most improves a first-time reader''s path: a new area with no deletion, no redirect and no existing consumer -- purely additive on top of SITE4''s register. It doubles as the roadmap and should make a separate pitch document unnecessary. `tools/generate_capabilities_json.py` already exists and writes capability data; whether it feeds this or something else is the first thing to check, not to assume. This step has NO ordering argument attached -- the proposal said so rather than pretending otherwise, and it is the one atom in the chain the director can pull forward at zero cost if he wants visible progress sooner. REVISION 2026-08-18 (brief revised after this atom was minted): it is no longer the cheapest step. It gains THE INTERFACE INVENTORY -- every seam between world and company named, split into typed doorways vs the world still handing data over directly, each with the real counterparty it swaps to at go-live (settlement and metering data, the smart-meter network, gas industry systems, payment collection), plus the wall''s own measured crossing count and its trend. That is a real derivation over `W4_the_wall`''s territory, not a page. The brief calls it the strongest architectural claim the project has, because the wall IS the go-live seam: switching a simulated endpoint for a real one is the launch, not a rewrite. The inventory belongs here; the EXPERIENCE of the boundary stays SITE10''s.'
