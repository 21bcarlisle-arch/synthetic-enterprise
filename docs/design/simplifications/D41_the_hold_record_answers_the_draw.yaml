atom_id: D41_the_hold_record_answers_the_draw
map_notes:
  gain: 'The promoter read `level_hold_note` -- the one record whose whole job is to answer the draw -- and was handed leads for three Hours that had already run, landed and recorded themselves. The same failure had been closed once by EDITING THE NOTE, a prose fix for a prose defect, so it recurred three times larger (R3). Either shape now satisfies the rule and neither is mandated: a separate hold note, or a verdict inside each register entry (H_GAP''s shape, where the answer is written by the one act an Hour cannot skip). The population is DERIVED from the record store, not a hand-typed list of the two atoms that run Hours today. Built against a named fail-open: every hold record here ends by naming the NEXT Hour, so the highest ordinal MENTIONED is current by construction and a mention check reads green on exactly the one-Hour-behind defect. (H27 Expert Hour #22.)'
