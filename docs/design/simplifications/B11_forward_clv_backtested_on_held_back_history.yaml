atom_id: B11_forward_clv_backtested_on_held_back_history
simplifications:
- '2026-10-05 MINT NOTES (DIRECTOR_CANON_THE_PRIORITY_ORDER_2026-10-05 step 3). WHAT IT IS: per customer, a forward value = base-case cashflow (margin at the tariff actually held, net of cost to serve and bad debt) weighted by survival under the churn risk the company believes, forecast at a cut-off date from the book''s EARLIER years only, then graded against what the same customers did in the LATER years (stayed, left, paid, what margin they made). The grade is per-customer error and its calibration (forecast vs realised by decile), with the bound its sample earns. RELATION TO EP1_clv_three_horizon: EP1 (L2) values a customer on three horizons and ranks by legs-then-rate; its L3 needs that RANKING replicated on a second book, which is the director''s choice of world (R13) and stays blocked on it. B11 needs no second book: a held-back split of THIS book is an out-of-sample test in time, not a replication across worlds. So EP1''s block_reason was re-scoped on the same commit to say only the ranking replication waits on a second book. B11 should REUSE EP1''s horizon machinery (company/analytics/clv_three_horizon.py, customer_value_view.py) for the cashflow leg rather than writing a parallel CLV; what is new is the held-back fit/grade split and the per-customer churn-risk term. EPISTEMIC: every input is the company''s own book and observables; the later years are graded only after the cut-off, never fed back into the fit.'
- '2026-10-06 SLICE 4: departures split into switch and move from the run''s move-out register (household + move_date only), switch hazard with moves censored, forecast survival still all-cause. The tracked run has no register (B7 home_moves_activation OFF), so the split is None with LIMITATION_NO_MOVE_REGISTER. The split waits on B7 slice 3 plus the director''s curriculum switch, not on company code. Still open: production caller (EP17 book count), L2 VERIFY.'
- '2026-10-11 SLICE 5 PREDICTIONS, written before the run (3f1ebfac3, c4fb2931b ancestor, moves ON) produced a byte. Full text: docs/staging/records/SEAT_PREREG_B11_FIFTH_SLICE_FORWARD_VALUE_ERROR_SPLIT_BY_STAYERS_SWITCHERS_AND_MOVERS_2026-10-11.md. At cut 2020, paired per-customer minus flat: P1 the run carries a register and the held-back window counts at least one move (the B7 drop test). P2 movers are 10-50% of held-back departures. P3 stayers Brier: per-customer better. P4 switchers Brier: flat better, or cannot tell with a positive point estimate. P5 movers Brier: cannot tell, positive point estimate. P6 margin error: cannot tell in all three. P7 the movers mean signed margin error is above the stayers for both rules.'
