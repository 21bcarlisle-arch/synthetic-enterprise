atom_id: B11_forward_clv_backtested_on_held_back_history
simplifications:
- '2026-10-05 MINT NOTES (DIRECTOR_CANON_THE_PRIORITY_ORDER_2026-10-05 step 3). WHAT IT IS: per customer, a forward value = base-case cashflow (margin at the tariff actually held, net of cost to serve and bad debt) weighted by survival under the churn risk the company believes, forecast at a cut-off date from the book''s EARLIER years only, then graded against what the same customers did in the LATER years (stayed, left, paid, what margin they made). The grade is per-customer error and its calibration (forecast vs realised by decile), with the bound its sample earns. RELATION TO EP1_clv_three_horizon: EP1 (L2) values a customer on three horizons and ranks by legs-then-rate; its L3 needs that RANKING replicated on a second book, which is the director''s choice of world (R13) and stays blocked on it. B11 needs no second book: a held-back split of THIS book is an out-of-sample test in time, not a replication across worlds. So EP1''s block_reason was re-scoped on the same commit to say only the ranking replication waits on a second book. B11 should REUSE EP1''s horizon machinery (company/analytics/clv_three_horizon.py, customer_value_view.py) for the cashflow leg rather than writing a parallel CLV; what is new is the held-back fit/grade split and the per-customer churn-risk term. EPISTEMIC: every input is the company''s own book and observables; the later years are graded only after the cut-off, never fed back into the fit.'
- '2026-10-06 SLICE 4: departures split into switch and move from the run''s move-out register (household + move_date only), switch hazard with moves censored, forecast survival still all-cause. The tracked run has no register (B7 home_moves_activation OFF), so the split is None with LIMITATION_NO_MOVE_REGISTER. The split waits on B7 slice 3 plus the director''s curriculum switch, not on company code. Still open: production caller (EP17 book count), L2 VERIFY.'
- '2026-10-11 SLICE 5 PREDICTIONS, written before the run (3f1ebfac3, c4fb2931b ancestor, moves ON) produced a byte. Full text: docs/staging/records/SEAT_PREREG_B11_FIFTH_SLICE_FORWARD_VALUE_ERROR_SPLIT_BY_STAYERS_SWITCHERS_AND_MOVERS_2026-10-11.md. At cut 2020, paired per-customer minus flat: P1 the run carries a register and the held-back window counts at least one move (the B7 drop test). P2 movers are 10-50% of held-back departures. P3 stayers Brier: per-customer better. P4 switchers Brier: flat better, or cannot tell with a positive point estimate. P5 movers Brier: cannot tell, positive point estimate. P6 margin error: cannot tell in all three. P7 the movers mean signed margin error is above the stayers for both rules.'
- '2026-10-11 SLICE 5 RESULT (run 3f1ebfac3, cut 2020, 247 graded; docs/staging/SEAT_FINDING_B11_THE_SPLIT_BY_OUTCOME_GRADES_THE_RULES_DEPARTURE_LEVEL_NOT_WHAT_THEY_KNOW_2026-10-11.md). P1 and P2 held: 61 of 138 held-back departures are moves (44%). P7 held. P3 to P5 were refuted, in the opposite direction: per-customer is better on switchers and movers and worse on stayers. P6 was partly refuted: flat is better on stayers. The cause is that both rules are near-constant (departure p 0.79 and 0.67, sd 0.03, AUC about 0.52) against 0.43 realised, so a Brier score within an outcome grades the level, not knowledge. The per-outcome statistic should be the AUC against stayers (switchers 0.58, movers 0.43 to 0.45, both rules). The next slice is departure-level calibration, which is company code. B7 dropped from blocked_on; EP17 blocks L3 only.'
- '2026-10-11 SLICE 6 (prereg + code 4212a9a56; result docs/staging/SEAT_FINDING_B11_THE_DEPARTURE_LEVEL_MISS_IS_THE_HELD_BACK_SWITCHING_COLLAPSE_NOT_FOUNDER_CHURN_2026-10-11.md). The departure p is graded for level (calibration-in-the-large, +0.361 per-customer and +0.241 flat) and for ranking (DeLong AUC, with a paired difference that cannot tell on the book, switchers or movers). The per-outcome Brier is replaced by AUC against stayers. Founder churn is refuted: the 2016-17 rate is 0.73x the 2019-20 rate. The miss is the held-back switching collapse, at 0.35x the fit switch rate, with 2022 at 4 switches in 2,975 account-months; moves held at 0.79x. A 2020-only hazard still misses by +0.199. Next: cut 2022/2023 against the arithmetic prediction, and a regime caveat in place of a calibrated level.'
- '2026-10-11 SLICE 7 (prereg + code 375ec5772; result docs/staging/SEAT_FINDING_B11_THE_MOVE_TERM_TRANSFERS_AND_THE_SWITCH_TERM_IS_THE_REGIME_2026-10-11.md). Flat calibration +0.241 / +0.169 / +0.057 at cuts 2020 / 2022 / 2023, as predicted. Split into competing switch and move incidences, the move term holds zero at all three cuts and the switch term carries the miss (+0.243, +0.143, +0.049). Per-customer is calibrated at 2022 only because its oldest contract year is fitted on the cut year alone, which makes it a recency estimator for founders, not tenure. Published as two terms with LIMITATION_SWITCH_LEVEL_IS_THE_REGIME and a named oldest-year confound; no calibrated constant.'
- '2026-10-11 L2. The named gap was the production caller: backtest_run_output was reached only from staging scripts. saas/reporting/annual_report.py::_section_held_back_grade now renders the grade at the one stated cut (DEFAULT_CUT_YEAR 2020) in every annual report: the departure level per rule with its interval, the flat level split into switch and move terms where the run carries a register (refused with its reason where it does not), the AUCs and their paired difference, the margin error, and LIMITATION_SWITCH_LEVEL_IS_THE_REGIME with the backtest''s own limitations. Door test tests/saas/reporting/test_the_held_back_grade_door.py reads the saved run and checks the figures against the module''s file door; dropping the section and ignoring the register each red one test. On the saved run (998814330, 2026-10-05, moves off, 56 graded): flat level +0.145 [+0.021, +0.270], per-customer -0.005 [-0.131, +0.120], AUC difference +0.021 [-0.080, +0.123], cannot tell. The per-customer level is the oldest-contract-year recency confound slice 7 named (year 4 fitted on 2020 alone), printed on the page. L3 stays blocked on EP17.'
- '2026-10-16 ITEM 4 of SEAT_FINDING_B11_THE_FLAT_SUPPLIER_ARM_HAS_NO_DOOR_ON_A_VARIED_BOOK: the prereg''s third arm has a door. tools/seed_family.py member --policy flat_at_level --level-from DIR runs FLAT_SUPPLIER_POLICY with renewal_margin_arm flat_at_level at the median margin the SAME seed''s value_arm member chose (arm_decision_shape''s, the figure run_value_cycle_ab --level-arm holds), read from that member''s stamped record. It refuses before running where the source is missing, refused, not value_arm, another seed, another commit, or carries no median; launch reads every seed''s source before starting any unit. Seven mutations each red a test. Nothing was run: the prereg''s seeds 61113-61118 wait on the director''s listing (for_the_director). The member-level wiring (level read into policy_named) now has a run-free control: member_policy is the member''s own road from source record to policy, checked at a non-default level and refusing without a policy (three mutations red it).'
