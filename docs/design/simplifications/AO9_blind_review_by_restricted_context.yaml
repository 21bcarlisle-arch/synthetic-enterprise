atom_id: AO9_blind_review_by_restricted_context
map_notes:
  origin_note: 'The director named the reconciliation with COLD_EYES_PROTOCOL.md as the worker''s job and as a ONE-MECHANISM requirement -- shipping this beside the existing cold-eyes skill is a failure of the atom, not a follow-up. Depends on AO1 because ''the plain-words capability description'' the reviewer is shown IS a capability-index row; without the index this hand-writes the input and the blindness stops being auditable. R15/outcome-testing (the doctrine''s own carve-out for LLM judges): blindness must be PROVEN by construction, not asserted -- if the committed transcript is the only evidence, a mutation that leaks code into the reviewer''s context must be shown to be detectable from that transcript. 3c is a WALL: this atom may never be described as delivering independence.'
