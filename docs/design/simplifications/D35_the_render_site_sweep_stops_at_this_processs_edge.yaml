atom_id: D35_the_render_site_sweep_stops_at_this_processs_edge
simplifications:
- "2026-08-12 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD\ncode written and nothing in `file_scope` touched: this atom is `loop_stage: idle`, and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available on a parked atom\nwhile BUILD is not. Output is this record.\n\nFIRST, AND IT REFRAMES THE REST: MOST OF THIS ATOM'S STATED SCOPE IS ALREADY SHIPPED, UNDER\nIDS THAT DO NOT EXIST. The atom's own text (written at H27 Expert Hour #17) says the\ndownstream renders \"have NOT been measured\". Measured on HEAD today, they largely have:\n`tools/couple_w2_11_d5.py` carries `reader_renders`, `_READER_WALK_FIELDS`,\n`measure_reader_render_sites`, `check_reader_render_sites`, `_DOOR_SITE_KEY`,\n`_DOOR_REGIONS` and `_door_row_regions`, and the working tree carries a further\n`renderer_provenance` stage. In-source those are attributed to \"atom D35, Expert Hour #19\",\n\"atom D36, Hour #20\", \"atom D37, Hour #21\" and \"atom D38, Hour #22\".\n\n  $ grep -c \"D37\\|D38\" docs/design/maturity_map.yaml\n  0\n\nNeither D37 nor D38 exists anywhere in the map. And the map's D36 is\n`D36_bill_render_footing_and_pence` -- epoch 1, value_stream price_to_bill,\nprovenance director_ruling, file_scope `site/customers/index.html` -- a bill-render atom\nwith no relation to the render-site sweep. So four Hours of landed work cite two ids that\nhave never existed and one that names a different atom, and a reader following those\ncitations lands on the wrong record or on none. Meanwhile THIS atom, whose file_scope the\nwork is in, still reads `level_current: 0, loop_stage: idle, provenance: proposal`. This is\nthe \"record can outrun the code\" class inverted -- here the code outran the record -- and it\nis staged separately as\n`WORKER_FINDING_A_MODULES_HOURS_CITE_ATOM_IDS_THE_MAP_HAS_NEVER_CARRIED_2026-08-12.md`,\nbecause it is a map-integrity defect and not this atom's own subject.\n\nWHAT THE SWEEP NOW COVERS (read off HEAD, not off the Hours' prose). Three surfaces past\nthe component strings: the register's declared renderer's own output; the COMPOSED note\n`measure_and_write` writes into the ledger entry (not the scorer's note -- Hour #20's\ncorrection); and the Proof door, split into four regions by the door's own class\nattributes, with a fail-closed census that reds on a fifth region -- `gap-val` (the ledger\ncarrier re-rendered at 3dp by `fmtGap`), `note` (printed verbatim), `components` (every\nfinite numeric leaf at 4dp via `fmtComponent`), `basis` (`baseline_g0`/`raw_gap` at 3dp).\nThe door is reached by driving the REAL row builder (`tools.generate_proof_data._coupled_gaps`)\nand the page's own inline script, not a hand-built row.\n\nWHERE IT STILL STOPS, AND BOTH SITES ARE MEASURED HERE.\n\n(1) THE PUBLISHED BYTES ARE NEVER OPENED. `_walk_to_the_door` writes its OWN freshly-scored\nentry into a temp ledger, points `coupled_triad.GAP_LEDGER_PATH` at it, and renders the door\nfrom that. The file the deployed door actually fetches -- `site/data/proof.json` -- is not\nread by any stage of the walk. Measured, `observed-with-evidence`, 2026-08-12:\n\n  docs/observability/coupled_gap_ledger.json  W2_11: gap 0.0311284046692607\n                                              measured_at 2026-08-12T15:52:25.762332+00:00\n                                              run_git_commit 2abb973c2\n  site/data/proof.json  /coupled_gaps/pairs[5]: value 0.0859375\n                                              measured_at 2026-08-12T15:14:13.485525+00:00\n                                              run_git_commit 5053c2a4b\n\nA different run and a different figure, on the surface the reader stands in front of. The\nPRECISION hop is transparent and that is worth stating positively: `_coupled_gaps` passes\n`entry.get(\"gap\")` through unrounded, the published 0.0859375 is an exact binary float, and\nnothing between ledger and published JSON rounds -- so this is NOT a fourth precision. What\nis unmeasured is not the precision but the POPULATION: every band, floor, collapse and\nepsilon this module certifies is certified against a book the published artefact does not\ncontain. R11's own words are \"verify to the RENDERED value\"; this walk verifies to a\nrendered value it manufactured, which is the same shape as a harness choosing its own\nsubject. `background/gap_ledger_reconciler.py` does not close this -- it grades\nledger-vs-HEAD CODE drift (has the tool moved since the reading), never whether the two\npublished files agree on the number.\n\n(2) A PUBLISHED RENDER AT 7dp, BY A WRITER NO SWEEP RUNS. `site/data/simplified.json`\n(1.9MB, consumed by `site/simplified/index.html` and referenced from `site/proof/index.html`)\ncontains, sourced from `docs/design/simplifications/archive/H_GAP_fabric_belief_truth_gap.002.yaml`:\n\n  \"W2_11_payment_behaviour_source 0.0859375 -> 0.0130940\"\n\nThe detection headline at SEVEN decimals, on a published page, when the finest declared\nreader site for that figure is 4dp. Under D34's reshaped rule -- \"the epsilon is half a step\nof the FINEST site\" -- a literal reading moves detection's epsilon 5e-5 -> 5e-8, a\nthousandfold, on the same shape of move Hour #17 made for ageing and Hour #20 had to undo.\n\nFRAME -- THE RECOMMENDATION, AND WHY IT IS NOT \"DECLARE A 7dp SITE\". The 7dp string is a\nHISTORICAL QUOTATION, not a render: it was written once into a record, it does not move when\nthe figure moves, and the two-book discrimination rule this module's own sweep is built on\nwould REJECT it (a literal that does not change with the figure across two books is a render\nof nothing). So it must NOT set the live instrument's epsilon. What it does falsify is the\nsweep's standing claim to know every site at which its figures meet a reader. The design:\n\n  * A THIRD DECLARED CLASS, `historical_quotations` -- (artefact, decimals, measured_at,\n    run_git_commit) -- EXCLUDED from the epsilon by rule, with the exclusion reason\n    interpolated into the refusal message rather than left to a comment, and REQUIRED to\n    carry its clock: a quoted financial-class figure with no basis and no date is R14's\n    defect one hop outside the ledger, and the 7dp string above carries neither. An\n    undeclared quotation still fires, exactly as an undeclared render does today.\n  * A PUBLISHED-BYTES STAGE that opens `site/data/proof.json`, finds this pair's row, and\n    answers TWO questions separately: does the row carry the ledger's own value (a\n    POPULATION check -- today it does not), and does the door render THOSE bytes at the\n    declared precisions (a PRECISION check -- today it passes). Two statuses, not one, for\n    the same reason `gap_ledger_reconciler` needed two: a stale published copy is a\n    publish-cycle fact whose repair is a republish, and collapsing it into the precision\n    verdict sends the next tick to re-run a tool that has already measured.\n\nBLAST RADIUS -- WHY THIS IS A MINT AND NOT A FIX ON SIGHT. Reading published artefacts and\nasserting on them enlists the publish path, and a control that reds on ordinary publish lag\nwedges the gate for everyone (the class this repo has repeated memory of). The population\ncheck must therefore land as a REPORTED status first, hard only once the publish cycle's own\nordering guarantee is written down. That is real design work with a real gate cost, which is\nprecisely why Hour #17 declined to do it on the promoter's behalf and why this tick does not\neither.\n\nR12: no published number moved. Nothing was tuned; nothing in `file_scope` was edited.\n\nWHY THE LEVEL DOES NOT MOVE. Level 2 for this atom means the two stages above BUILT and\nmutation-proven both ways. A DISCOVER/FRAME tick on a parked atom may not write them, and an\nexit criterion is not renegotiated to fit what a tick was allowed to do. `level_current`\nstays 0.\n\nLEADS FOR THE NEXT HOUR. (a) The id collision is the map's to fix, not the source's -- the\nsource is the wrong place to guess which atom four Hours belonged to. (b) The 7dp quotation\nis one instance of a repo-wide class: `simplified.json` publishes every atom's prose,\nand how many OTHER atoms' figures are quoted there, at what precision, with what clock, has\nnot been counted. This atom found one; the census is not this atom's."
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched (EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7). This\npass adds no new prose to the atom's design: it TESTS the two things yesterday's entry\nasserted and left as judgement, and one of the two answers changes the recommended shape.\n\nMEASUREMENT HYGIENE, THE SAME CLASS THIS ATOM IS ABOUT. Every source claim below is read from\n`git show HEAD:tools/couple_w2_11_d5.py` -- that file and its test are modified-uncommitted in\nthe shared tree by another lane, so the desk tree is not the subject. Every artefact claim\nnames its tree explicitly, because the whole finding is that the tree is the variable.\n\nTHE ATOM'S CORE CLAIM STILL STANDS AT HEAD, and is now checked repo-wide rather than\nmodule-locally. No stage of the sweep opens the published bytes: the only path manipulation in\nthe module is `_walk_to_the_door` re-pointing `coupled_triad.GAP_LEDGER_PATH` at its own temp\nledger, and `site/data/proof.json` appears nowhere in it. Widening to the whole repo, six\nmodules mention both proof.json and the gap ledger (`tools/generate_proof_data.py`,\n`background/gap_ledger_reconciler.py`, `background/gap_metric.py`, `background/supervisor.py`\nand two tests) and in every one the co-occurrence is a comment, a docstring or a path-routing\nstring. NOTHING IN THE REPO OPENS THE PUBLISHED DOOR AND COMPARES ITS VALUE WITH THE LEDGER.\n\nFINDING 1 -- THE INSTANCE IS GONE, THE CLASS IS REAL, AND IT NOW HAS A BASE RATE.\nYesterday's entry rested its stage-2 design on ONE observation (ledger 0.0311284046692607 vs\ndoor 0.0859375). That instance does not reproduce. `observed-with-evidence`, 2026-08-13:\nledger and door agree on 14 of 14 pairs, bit-for-bit, at HEAD, at `origin/main` AND in the\nworking tree. A design that treated that single reading as a standing defect would have been\nbuilt against a state the repo was not in.\n\nThe CLASS survives the instance, and the right measurement was never the instance -- it is how\noften the published tree is internally inconsistent. Over the 66 commits since 2026-08-06 that\ntouched either file, comparing the two blobs AS COMMITTED AT EACH COMMIT (what a reader\nfetching that published tree would have got, against the ledger of record beside it):\n\n    DIVERGING COMMITS: 17 of 66  (26%)\n\nLongest continuous run per pair, over that commit series (commit-granularity, so each is a\nLOWER bound on the wall-clock a stale figure was on the door):\n\n    W2_11_payment_behaviour_source           2 runs   worst 33.4h   2026-08-09 -> 08-10\n    W1_11_fabric_physics_core                1 run    worst  7.7h   2026-08-09\n    W1_12_premise_trace_generator            3 runs   worst  7.7h   2026-08-09\n    WORLD_recontracting_relationship_start   1 run    worst  3.8h   2026-08-08\n    W2_5_life_event_stream                   1 run    worst  2.0h   2026-08-09\n    W2_8_self_rationing                      1 run    worst  0.9h   2026-08-09\n\nAnd two of the 17 are a STRICTLY WORSE shape than a stale number, which yesterday's entry did\nnot anticipate: at 677a7f7bf and 7d01fffba, `WORLD_recontracting_relationship_start` is a\nmeasured row in the ledger and ABSENT FROM THE DOOR'S PAIR LIST ENTIRELY -- the panel published\n`pair_count: 13` while the ledger held 14. A population check that only compares values it\nfinds on both sides would score those two commits clean; the absent row is the failure mode,\nso the check owes a SET comparison before it owes a value comparison.\n\nTHIS CONFIRMS THE REPORTED-FIRST RECOMMENDATION, and converts it from prudence into a number.\nYesterday's entry argued the population check \"must land as a REPORTED status first, hard only\nonce the publish cycle's own ordering guarantee is written down\", on the general ground that a\ncontrol redding on ordinary publish lag wedges the gate for everyone. Landed HARD against this\nhistory it would have redded 17 of 66 publishing commits -- roughly one in four, for a median\nof a few hours each, none of them a defect in the thing being gated. The recommendation stands\nas written and now has its evidence.\n\nFINDING 2 -- THE QUOTATION CLAIM IS NOW PROVEN ON TWO REAL BOOKS, AND THE TRAP IS SHARPER THAN\nYESTERDAY STATED IT. The 7dp string is still published at HEAD:\n\n    site/data/simplified.json:  \"W2_11_payment_behaviour_source 0.0859375 -> 0.0130940\"\n\nYesterday ARGUED, from its shape, that this is a historical quotation rather than a render, and\nthat the module's two-book discrimination rule would reject it. That argument is now a\nmeasurement, taken on two books the publish path itself produced:\n\n    book A (HEAD, origin/main)   live figure 0.0859375              quotation 0.0859375\n    book B (working tree, today) live figure 0.0833907649896623     quotation 0.0859375\n\nThe quotation does not track the figure, so it is a render of nothing and must not set the\nepsilon -- confirmed, not asserted. But note WHICH book is the published one. On book A the\nquotation and the live figure COINCIDE EXACTLY, because the string was written on 2026-08-11\nwhen the figure was 0.0859375 and the figure has not moved in a commit since. A sweep scoring\nONE book -- and HEAD is the book anything published would naturally be scored against -- finds\nthe figure's own value rendered at seven decimals on a published page and has no way to tell a\nfrozen quotation from a live render. Under D34's reshaped rule it would then move `detection`'s\nepsilon 5e-05 -> 5e-08, a thousandfold, on a string that will never move again. The two-book\nrule is not a nicety here; it is the only thing standing between this module and a repeat of\nthe ageing epsilon move, and this is the first time it has been exercised against a real\npublished artefact rather than a constructed one. The tracked history is pinned: the quotation\nfirst appears 2026-08-11T13:23 and its digits have never changed across the 31 commits touching\n`simplified.json` since 2026-08-06.\n\nQUEUED, NOT FIXED ON SIGHT (SELF-INTERRUPT DISCIPLINE). `background/gap_ledger_reconciler.py`\nstates the coupling this atom is about AS A FACT, in the design comment that justifies its own\nsubject: \"`site/data/proof.json` is built from the ledger and both are committed and pushed.\"\nThat is the premise Finding 1 measures false at 17 of 66. It does not invalidate the reconciler's\nverdict -- that module grades ledger-vs-HEAD-CODE drift and never reads a door value -- but it\nis a load-bearing sentence about a coupling nothing enforces, in the file most likely to be\nread as authority on it. Staged as\n`WORKER_FINDING_A_COUPLING_STATED_IN_A_COMMENT_IS_FALSE_A_QUARTER_OF_THE_TIME_2026-08-13.md`,\nLATENT / H_harness. It is that module's subject, not this atom's file_scope.\n\nR12: no published number moved, nothing was tuned, nothing in `file_scope` was edited. Every\nfigure above is read out of committed blobs or the live artefacts as they already stood.\n\nWHY THE LEVEL DOES NOT MOVE. Unchanged from yesterday and for the same reason: level 2 means\nthe published-bytes stage and the quotation class BUILT and mutation-proven both ways. A\nDISCOVER/FRAME tick on a parked atom may not write them, and an exit criterion is not\nrenegotiated to fit what a tick was allowed to do. `level_current` stays 0.\n\nLEADS FOR THE NEXT HOUR. (a) The published-bytes stage now has a specified shape and a base\nrate to build against: SET comparison first (the absent-row failure), then value, both\nREPORTED, and the divergence census above is the fixture it should reproduce. (b) Yesterday's\nlead (b) -- the repo-wide census of figures quoted in `simplified.json` -- is unchanged and\nstill not this atom's; Finding 2 raises its value, since the trap is one-book coincidence and\nany quotation that happens to match the live figure at scoring time has the same shape.\n(c) UNTOUCHED BY THIS PASS AND STILL OPEN: yesterday's lead (a), the four Hours citing atom\nids `D37`/`D38` that the map has never carried."
- "2026-08-17 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched (EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7). Like the\n2026-08-13 pass, this one adds no new prose to the design: it TESTS what the previous two passes\nasserted. Both of the things it tested came back against them, and the second changes the\nrecommended shape and its cost.\n\nMEASUREMENT HYGIENE, THE SAME CLASS THIS ATOM IS ABOUT. Every source claim is read from\n`git show <ref>:<path>` at a NAMED ref -- `tools/couple_w2_11_d5.py` and its test are still\nmodified-uncommitted in the shared tree by another lane, so the desk tree is not the subject.\nBoth sides of every two-sided census are read from ONE ref, because a mixed join manufactures\nthe defect it counts.\n\nFINDING 1 -- THE SWEEP WAS WIDENED PAST THIS PROCESS'S EDGE TO THE WHOLE PUBLISHED SURFACE, AND\nTHE FIRST RESULT IS ABOUT THE INSTRUMENT, NOT THE FIGURES. Both prior passes widened to exactly\ntwo files (`site/data/proof.json`, `site/data/simplified.json`). This pass ran the module's own\n`_rendered_at` rule over all 40 `site/data/*.json` at HEAD, for all 14 ledger pairs at every\nprecision 0-9. At dp>=2 that returns 44 (file, pair, precision) candidate sites across 11 files;\nat dp<=1 it returns essentially the whole surface, since \"0\" and \"1.0\" are in every artefact.\n\nThe candidates on this atom's OWN headline are all COINCIDENCE, and it is worth naming what they\nactually are, because the near-miss is instructive:\n\n    site/data/dashboard.json        W2_11 0.0859375 \"found\" at 2, 3 AND 4dp\n                                    -> \"error_pct\":0.0859  -- a 2020-03-31 forward-curve error\n                                       on customer C2, nothing to do with the payment triad\n    site/data/customer_sample.json  W2_11 \"found\" at 3 and 4dp\n                                    -> \"tariff_error_pct\": 0.0859 -- the same C2 row\n\n`site/data/dashboard.json` is the third surface the ATOM'S OWN TEXT names (\"the ledger, the\ndashboard and the Proof-door page\") and the one neither prior pass measured. Measured now: the\ndashboard does not render the coupled-triad figures at all. Its apparent 4dp hit is a\nforward-curve error percentage that happens to share four digits. So the atom's own scope\nstatement is one surface too wide, and a value-search sweep at repo scale has a false-positive\nrate that swamps the signal -- which is the positive case for the two-book discrimination rule\nthis module already has, now measured against the real published surface rather than argued.\nA one-book sweep widened to `site/data/**` would have declared an undeclared 4dp render site for\n`detection` on the dashboard and left the epsilon exactly where it is by luck, not by design.\n\nTHE ONE dp=7 HIT IN `proof.json` IS THIS ATOM'S OWN RECORD. It is not a render: it is the\n2026-08-12 entry above, published verbatim onto the Proof door, quoting\n`value 0.0859375`. The record ABOUT the frozen-quotation trap is now itself a published\nquotation of the same figure at seven decimals, on the same door, carried by a different writer\nthan the `simplified.json` string pass 2 pinned. Same class, new carrier, and it has the same\none-book coincidence property: it reads as a live 7dp render on any book where the figure sits\nat 0.0859375. Two carriers is enough to say the `historical_quotations` class the 2026-08-12\nentry designed is not a one-off accommodation -- this module's own prose is a publishing channel\nfor its own figures.\n\nFINDING 2 -- THE DIVERGENCE IS NOT PUBLISH LAG, AND PASS 2'S CHARACTERISATION OF IT IS FALSE FOR\n36 OF 43. The 2026-08-13 entry measured 17 of 66 commits diverging and characterised the whole\nclass as staleness: \"a stale published copy is a publish-cycle fact whose repair is a republish\",\nwith a worst run of 33.4h and a median of a few hours. Extending the identical census to today\n(78 commits touching either file since 2026-08-06):\n\n    DIVERGING COMMITS: 29 of 78  (37%)\n\nClassifying each diverging (commit, pair) by DIRECTION -- does the door's value appear as the\nledger's value at an EARLIER commit in the series (door behind: stale publish, pass 2's model),\nat a LATER one (door ahead), or at NEITHER:\n\n    unmatched      36     the door's value has never been the ledger's value, at any commit\n    door_behind     5     staleness, the only shape pass 2 modelled\n    absent_row      2     the row is in the ledger and absent from the door's pair list\n\nPass 2's model covers 5 of 43. It was not wrong about what it saw; it inferred a cause from a\nwindow that ended hours before the counter-example began. The run that falsifies it opens\n2026-08-13 17:55, and pass 2's reading was taken earlier that same day.\n\nTHE CLOCKS SETTLE THE DIRECTION (R14 -- both artefacts carry `measured_at` and `run_git_commit`,\nso this needs no inference). At HEAD AND at origin/main, identically:\n\n    LEDGER  W2_11  gap   0.0859375           measured_at 2026-08-12T06:10:09  run 2e9ecf710\n    DOOR    pairs[5]     0.0833907649896623  measured_at 2026-08-17T15:11:25  run 3c1401df5\n    WORKING TREE (uncommitted)\n            W2_11  gap   0.0311284046692607  measured_at 2026-08-17T15:38:56  run e015bac36\n\n    $ git log -S'0.0833907649896623' -- docs/observability/coupled_gap_ledger.json\n    (no output)\n\nThe door is five days AHEAD of the record of it, and the number the public door has been showing\nhas never existed in any committed version of the ledger. Three live values for one figure on\none machine. Current open run, commit-granularity lower bound: 93.4h (2026-08-13 17:55 -> HEAD),\nSTILL OPEN -- against pass 2's \"worst 33.4h\" for this same pair, and on the pair whose epsilon,\nfloor, band and collapse this entire module certifies.\n\nCorrecting one number of my own in passing: the door's value is `0.0833907649896623` unrounded.\nThe publish hop is transparent, as the 2026-08-12 entry said -- `_row` assigns\n`value = float(gap)` verbatim. The defect is the POPULATION, exactly as that entry framed it;\nwhat is new is that the population is not merely stale.\n\nFINDING 3 -- THE CAUSE, AND IT IS AN R10 CLASS-CLOSURE APPLIED TO ONE SIDE OF A SEAM.\n`load_gap_ledger()` reads `GAP_LEDGER_PATH`, the WORKING-TREE file.\n`background/process_run_complete.py` then commits the output under a pathspec whose own comment\nrecords closing the orphaned-at-commit gap as a CLASS: \"the durable fix is to commit the WHOLE\ngenerated data surface, not to add another explicit path line each time a door is built. Any\nfuture `site/data/*.json` is now tracked automatically.\" `docs/observability/coupled_gap_ledger.json`\nis not in that pathspec, and no other publish path commits it. So the class was closed on the\nRENDERED side and re-opens one hop upstream: the publish commit carries the rendering without the\nrecord it was rendered from. The published figure is therefore not reconstructible from the\ncommitted repo, which is the IaC test CLAUDE.md states in its own words. Staged as\n`WORKER_FINDING_THE_PUBLISH_PATH_COMMITS_THE_DOOR_AND_NOT_THE_RECORD_IT_RENDERED_2026-08-17.md`,\nLATENT / H_harness -- that module's subject, not this atom's `file_scope`.\n\nWHAT THIS CHANGES IN THE RECOMMENDED SHAPE, AND IT IS THE COST ARGUMENT THAT MOVES.\nThe 2026-08-12 entry designed a published-bytes stage with TWO statuses (set, then value); the\n2026-08-13 entry kept both REPORTED rather than hard, reasoning that a hard control would have\nredded 17 of 66 publishing commits \"none of them a defect in the thing being gated\". That ground\nis now measured false for 36 of 43: an uncommitted source is a defect in exactly the thing being\ngated. Revised design, and the change is small but load-bearing:\n\n  * The value check owes THREE outcomes, not one, because the REPAIRS ARE DIFFERENT and a\n    control that collapses them sends the next tick to the wrong lane. Door behind ledger ->\n    republish. Door AHEAD of ledger (36 of 43) -> the source was never committed; republishing\n    makes it worse, since regenerating from the current tree would publish a third value again.\n    Rows absent on one side -> the SET failure the 2026-08-13 entry already put first.\n  * Direction is decided by the two artefacts' OWN clocks, which both already carry, not by\n    scanning history for the value -- the history scan is what this pass used to get a base rate,\n    and it is too expensive for a control.\n  * REPORTED-first still stands, but for a different reason than pass 2 gave. Not \"these are\n    benign\"; rather that the cheap real repair is upstream of the control entirely (put the\n    ledger in the publish pathspec -- it removes 36 of 43), and a control landed hard before that\n    repair would red on a defect it does not own.\n\nBLAST RADIUS, UNCHANGED IN KIND AND NOW SHARPER. The pathspec repair is one line and it is still\nnot a fix on sight: the ledger is written by other lanes, so listing it re-enters the\n\"a pathspec commit still carries another lane's staged hunks\" class this repo has repeated\nmemory of. That is why it is staged rather than done.\n\nR12: no published number moved, nothing was tuned, nothing in `file_scope` was edited. Every\nfigure above is read out of committed blobs at a named ref or out of the live artefacts as they\nalready stood.\n\nWHY THE LEVEL DOES NOT MOVE. Unchanged from both prior passes and for the same reason: level 2\nmeans the published-bytes stage and the quotation class BUILT and mutation-proven both ways. A\nDISCOVER/FRAME tick on a parked atom may not write them, and an exit criterion is not\nrenegotiated to fit what a tick was allowed to do. `level_current` stays 0.\n\nLEADS FOR THE NEXT HOUR. (a) The published-bytes stage now has a direction rule, a clock-based\ntest for it, and a 78-commit fixture with all three outcomes present in it. (b) UNTOUCHED BY THIS\nPASS AND STILL OPEN, third time of asking: the four Hours citing atom ids `D37`/`D38` the map has\nnever carried. (c) The `simplified.json` quotation census is still not this atom's, and Finding 1\nraises it again -- there are now two known carriers of this module's own figures-in-prose, and\n`proof.json` was not on that census's list. (d) NEW, and bigger than this atom: the publish\npathspec commits ~40 derived `site/data/*.json` files. This pass audited the source of ONE of\nthem. Whether any OTHER published artefact is rendered from a record the same commit leaves\nuncommitted has not been counted, and the same three-value state would be invisible on every one."
- "2026-08-17 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched (EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7). Fourth pass,\nsame method as passes 2 and 3: it adds no new design prose, it RUNS the instrument pass 3 specified\nagainst the fixture pass 3 named. The instrument comes back RED on its own fixture, and the repair\npass 3 sized comes back at half the size.\n\nMEASUREMENT HYGIENE, THE SAME CLASS THIS ATOM IS ABOUT. Both sides of every two-sided census are read\nfrom ONE ref via `git show <ref>:<path>`; `tools/couple_w2_11_d5.py` is still modified-uncommitted in\nthe shared tree by another lane, so the desk tree is never the subject. The census is pass 3's,\nextended to today: 81 commits since 2026-08-06 touching either file (pass 3: 78), 32 diverging\n(pass 3: 29), 46 divergent (commit, pair) rows (pass 3: 43). Pass 3's numbers reproduce; the classes\nbelow re-derive them, they do not replace them.\n\nFINDING 1 -- PASS 3'S DIRECTION RULE DECIDES A DIFFERENT QUESTION FROM THE ONE ITS ROUTING TABLE\nBRANCHES ON, AND THE TWO PARTITIONS CROSS-CUT ON 17 OF 39. Pass 3 wrote: \"Direction is decided by the\ntwo artefacts' OWN clocks, which both already carry, not by scanning history for the value -- the\nhistory scan is what this pass used to get a base rate, and it is too expensive for a control.\" Both\nwere run over every divergent row, `observed-with-evidence` 2026-08-17:\n\n    truth (was the door's source ever committed?)  x  clock verdict (which measured_at is newer)\n\n    never_committed   clock says door_ahead     22\n    never_committed   clock says door_behind    17     <-- the cross-cut\n    committed         clock says door_behind     5\n    absent_row (set failure, no clock join)       2\n\nThe clock's AHEAD verdict is one-sided sound on this fixture: 22 of 22 are never-committed. Its\nBEHIND verdict is not a verdict at all -- 5 genuine staleness against 17 whose source has never been\nin any committed ledger. Pass 3's own routing sends BEHIND to \"republish\", and its own words for why\nthat is the wrong repair for the other class are \"republishing makes it worse, since regenerating\nfrom the current tree would publish a third value again\". So a clock-only control silently routes 17\nof 39 never-committed rows (44%) to the repair pass 3 argues against, and it does so QUIETLY -- the\nR15 fail-open shape, an instrument that fires on the easy half and reports the hard half as the\nbenign class.\n\nFINDING 2 -- AND THE REASON PASS 3 CHOSE THE CLOCK IS FALSE: A TWO-LOOKUP PROBE ANSWERS THE REAL\nQUESTION EXACTLY. What made the history scan expensive was scanning every commit for a VALUE. The\ndoor row does not need scanning: it already carries `run_git_commit` and `measured_at` per pair.\nProbe -- read the ledger blob at the door's OWN `run_git_commit`, and at the first ledger-touching\ncommit after it, and ask whether either carries that pair's (measured_at, run_git_commit) IDENTITY.\nTwo `git show`s per row, no series walk:\n\n    cheap 2-lookup probe vs full-history identity truth\n        truth=committed        probe=committed        5\n        truth=never_committed  probe=never_committed  39\n        (no disagreement in either direction, n=44)\n\nSecond result worth pinning because it removes a design choice rather than adding one: the VALUE join\nand the IDENTITY join agree 44 of 44 (39 false/false, 5 true/true) on this fixture, so the identity\njoin is not more discriminating here -- it is merely the one the door can answer in O(1) about itself.\nNAMED UNTESTED LEG, because the fixture cannot exercise it: all 44 door `run_git_commit`s resolve in\nthis repo, so the probe's unresolvable-ref path has no coverage. That leg must score FAILED, never\n`committed` -- an unavailable check is a failed check -- and it is a mutation the build owes, not\nsomething this fixture proves.\n\nFINDING 3 -- THE PATHSPEC REPAIR IS HALF THE SIZE PASS 3 GAVE IT: 22 OF 46, NOT 36 OF 43. Pass 3\nclosed on \"the cheap real repair is upstream of the control entirely (put the ledger in the publish\npathspec -- it removes 36 of 43)\". Classifying the same divergent rows by WHICH FILE the commit\nactually touched:\n\n    commits            door_only 46   ledger_only 30   both 5\n    diverging commits  door_only 20   ledger_only 12   both 0\n\n    divergent rows     door_only    22   all never_committed\n                       ledger_only  22 value (5 committed, 17 never_committed) + 2 absent_row\n                       both          0\n\nThe publish pathspec only acts at a PUBLISH commit, so it reaches the 22 door_only rows and nothing\nelse -- and it reaches all 22, by construction: `tools.generate_proof_data._coupled_gaps` calls\n`load_gap_ledger()`, which reads `GAP_LEDGER_PATH` off DISK, so the working-tree ledger at publish\ntime IS the door's source and co-committing them publishes the record the render came from. The other\n24 rows arrive at ledger_only commits -- another lane commits a new scoring and the door keeps\nshowing the last published one -- and no pathspec on the publish path touches those. `inferred`, R9,\nand it is the honest form of the claim: under the repair those 24 would not vanish, they would change\nCLASS, from \"the door's source was never committed\" (unrepairable by republishing) to plain staleness\n(repairable by republishing). That is a real improvement and a better argument for the repair than the\nnumber pass 3 gave it, but 36 of 43 is not what the tree says.\n\nThe co-committed evidence points the same way and is too small to carry weight on its own: 0 of 5\nboth-file commits diverge against 32 of 76 single-file commits (~p=0.07). The mechanism above, not\nthose five commits, is what makes the repair sound.\n\nFINDING 4 -- THE STATE PASS 3 PINNED HAS CHANGED SHAPE AND THE RUN IS STILL OPEN. Pass 3 recorded\nthree live values for one figure. At HEAD AND origin/main, identically, today:\n\n    LEDGER  W2_11  gap    0.0859375            measured_at 2026-08-12T06:10:09  run 2e9ecf710\n    DOOR    pairs[5]      0.0833907649896623   measured_at 2026-08-17T20:03:21  run cdade47cc\n    WORKING TREE (uncommitted)\n            W2_11  gap    0.0833907649896623   measured_at 2026-08-17T21:11:55  run 5d0b5a02f\n\n    $ git log -S'0.0833907649896623' -- docs/observability/coupled_gap_ledger.json\n    (no output)\n\nThe three-value state has collapsed to two: the door's published value now EXISTS on disk, and is\nstill uncommitted, so the published figure is still not reconstructible from the committed repo. The\ndoor has republished twice since pass 3 read it (3c1401df5 -> cdade47cc) and the ledger commit still\nhas not happened; the ledger of record is five days behind its own door. Open run for this pair,\ncommit-granularity lower bound: 98.6h from 2026-08-13 (263dcf1b6), STILL OPEN, against pass 3's 93.4h\nand pass 2's \"worst 33.4h\". This is the pair whose epsilon, floor, band and collapse this module\ncertifies.\n\nWHAT THIS CHANGES IN THE RECOMMENDED SHAPE. Pass 3's three outcomes survive; what changes is the\npredicate that selects between them and what they are named after.\n\n  * The deciding question is NOT \"which artefact is newer\" but \"was the door's source ever\n    committed\", and Finding 2 gives it in two lookups. Name the outcomes after the repair they\n    route: SOURCE_NEVER_COMMITTED (39 of 46) -> commit the record, do not republish;\n    STALE_PUBLISH (5) -> republish; SET_MISMATCH (2) -> the set failure pass 2 put first and which\n    still owes its check before any value check.\n  * The clock is demoted from decider to cheap pre-filter. `door_ahead` may stand alone (22/22 here);\n    `door_behind` may not select republish on its own evidence -- it must be confirmed by the probe.\n  * REPORTED-first stands, with pass 3's reason intact and Finding 3's correction applied: the\n    upstream repair is real but covers 22 of 46, so a control landed hard behind it would still red\n    on 24 rows it does not own.\n\nR12: no published number moved, nothing was tuned, nothing in `file_scope` was edited. Every figure is\nread out of committed blobs at a named ref or out of the live artefacts as they already stood.\n\nWHY THE LEVEL DOES NOT MOVE. Unchanged from all three prior passes and for the same reason: level 2\nmeans the published-bytes stage and the quotation class BUILT and mutation-proven both ways. A\nDISCOVER/FRAME tick on a parked atom may not write them, and an exit criterion is not renegotiated to\nfit what a tick was allowed to do. `level_current` stays 0.\n\nLEADS FOR THE NEXT HOUR. (a) The published-bytes stage now has its predicate, a two-lookup\nimplementation of it, a 44-row fixture with both outcomes present, and one named leg the fixture\ncannot cover (unresolvable `run_git_commit` -> FAILED). (b) UNTOUCHED BY THIS PASS AND STILL OPEN,\nfourth time of asking: the four Hours citing atom ids `D37`/`D38` the map has never carried. (c) The\n`simplified.json` quotation census is still not this atom's. (d) Pass 3's lead (d) -- whether any\nOTHER published `site/data/*.json` is rendered from a record its own commit leaves uncommitted -- is\nuntouched, and Finding 3 sharpens the shape it should be counted in: the question is not \"is the\nsource committed anywhere\" but \"does the publish commit carry it\", which the touch-profile census\nabove answers in one pass per artefact."
- "2026-08-18 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD code\nwritten and nothing in `file_scope` touched (EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7). Fifth pass,\nsame method as passes 2-4: no new design prose, it takes the oldest untouched lead and measures it.\nThat lead is (d) -- \"whether any OTHER published `site/data/*.json` is rendered from a record its own\ncommit leaves uncommitted\", in the shape Finding 3 of pass 4 sharpened it to: not \"is the source\ncommitted anywhere\" but \"does the publish commit carry it\". The answer is YES, this atom's own door is\nNOT the worst case, and the cheap predicate pass 4 recommended MISCLASSIFIES the worst one.\n\nMEASUREMENT HYGIENE. Every figure is read from committed blobs via `git show <ref>:<path>` or from the\nlive artefacts as they stand. Window `--since 2026-08-06`, matching passes 3 and 4 so the counts are\ncomparable. STATE NOTE, because passes 2-4 each had to discount for it: `tools/couple_w2_11_d5.py`\nand `tests/tools/test_couple_w2_11_d5.py` are CLEAN in the shared tree this tick, as are this record\nand `docs/design/maturity_map.yaml`. HEAD 660a19719, `origin/main` ledger byte-identical to HEAD's.\n\nFINDING 1 -- THE UNIT OF EXPOSURE IS THE LEDGER BLOCK, NOT THE ARTEFACT, AND A SECOND DOOR ON THE SAME\nFILE SCORES CLEAN. `docs/observability/coupled_gap_ledger.json` has a second published consumer this\natom's sweep has never named: `tools/generate_premise_demand_data.py` reads the same file and renders\n`site/data/premise_demand.json` (atom W1_5, gap at 3dp, `cwv_worst_cell_gap_delta` at 5dp) -- a door\nwhose writer the sweep never runs, exactly the class in this atom's `name`. Run pass 4's own two-lookup\nidentity probe against it, `observed-with-evidence` 2026-08-18:\n\n    site/data/premise_demand.json   47 publish commits   47 source_committed_at_publish   0 never\n    site/data/proof.json            (pass 4, same window) 46 divergent rows, 39 never_committed\n\nSame record, same window, opposite verdicts. The per-block census says why -- on-disk vs committed,\nall 14 blocks:\n\n    13 of 14 blocks   byte-identical to HEAD\n     1 of 14 blocks   W2_11_payment_behaviour_source, measured_at 2026-08-17T23:37:21, and\n                      `git log -S` finds that stamp in 0 committed ledger blobs -- NEVER committed\n\nSo an artefact-level or record-level control grades this file 13/14 = 93% clean while the one exposed\nblock is precisely the block this module certifies the epsilon, floor, band and collapse of. The\ncensus unit must be the (door, block) pair. AND THE CLEAN RESULT IS NOT EVIDENCE OF A CONTROL: the\npremise_demand door republished 47 times over 3 distinct `measured_at` values, because W1_5's block\nhas not moved since 2026-08-11. Its 47/47 is a property of a STILL WRITER, not of publish discipline\n-- the same door behind a live writer would score like the proof door. `inferred`, R9.\n\nFINDING 2 -- LEAD (d) ANSWERED YES, AND THE WORST DOOR IS THE PUBLIC MARKET PANEL. `site/data/market.json`\nis rendered from `docs/market_data/price_feed.json`, and both carry `published_at`, so the same probe runs\nwith no new machinery:\n\n    site/data/market.json   47 publish commits   44 distinct published_at\n                            0 source_committed_at_publish   47 source_not_at_publish\n    committed price_feed.json `published_at` at every one of those 47:  2026-07-17T11:07:42.853017\n    currently published stamp 2026-08-17T23:05:17.533216 -> 0 committed blobs carry it\n\nThe door's own `evidence` string reads \"docs/market_data/price_feed.json (published_at\n2026-08-17T23:05:17.533216+00:00)\" -- an R14 clock naming a stamp that has never been in the repo.\n47 of 47 against the proof door's 39 of 46.\n\nFINDING 3 -- AND THAT DOOR REFUTES THE GENERALISATION OF PASS 4's PREDICATE: THE IDENTITY JOIN AND THE\nVALUE JOIN DISAGREE 47 OF 47 HERE. Pass 4 pinned \"the VALUE join and the IDENTITY join agree 44 of 44\n(39 false/false, 5 true/true) on this fixture\", and qualified it to the fixture. On market.json they\nagree on nothing:\n\n    identity join  never committed 47/47\n    value  join    committed HEAD `prices` == working-tree `prices`, byte-identical, n=58\n                   the whole working diff is one line, the `published_at` stamp\n\nPass 4's routing sends SOURCE_NEVER_COMMITTED to \"commit the record, do not republish\". Applied here it\nwould commit a refresh stamp that the next run bumps again, forever, to repair a door whose published\nvalues ARE reconstructible from the committed repo. So the identity probe is sound for the block whose\nvalues move and wrong for a source whose stamp churns; the predicate needs a third outcome --\nSTAMP_CHURN (identity absent, value reconstructible) -- separated from LOST_VALUE, and the value leg is\nwhat separates them. That is the leg pass 4 dropped as \"not more discriminating here\".\n\nFINDING 4 -- A THIRD DOOR WHERE NEITHER JOIN CAN RUN, AND THE PUBLISH COMMIT'S OWN MESSAGE IS THE\nEVIDENCE. `docs/reports/run_output_latest.json` feeds `site/data/company.json` and\n`site/data/dashboard.json`; it carries NO identity field at all (no `generated_at`, no `run_git_commit`),\nso the two-lookup probe is unavailable, not negative -- and an unavailable check is a FAILED check (R15),\nnever a `committed`. The value join is all there is, and it is stark:\n\n    last commit of run_output_latest.json     59ab1ac01, 2026-07-29  (20 days before this tick)\n    committed total_net_gbp at HEAD and at every 2026-08 publish commit   1,521,069.65\n    on-disk total_net_gbp                                                 1,530,002.96\n    publish commits since 2026-08-06 quoting `net=£` in their own message  43\n    distinct announced values  £1,526,252 (24), £1,547,113 (7), £1,530,003 (7), £1,526,676 (4),\n                               £1,533,687 (1)   -- and the committed figure is NONE of them\n    published on the live doors  1530002.96 appears 1x in company.json, 21x in dashboard.json\n\nc23faeba0 announces \"net=£1,530,003\" in the commit subject while the tree that commit creates says\n1,521,069.65. This is the same class as the ledger door, one layer worse: there the record existed and\nwent uncommitted; here the record has been frozen for 20 days while 43 commits published and announced\nfigures derived from a file none of them carried.\n\nWHAT THIS CHANGES IN THE RECOMMENDED SHAPE. Pass 4's three outcomes and its REPORTED-first stance\nsurvive. Two amendments, both from measurement:\n\n  * The predicate gains a VALUE leg and a fourth outcome. SOURCE_NEVER_COMMITTED splits into\n    LOST_VALUE (identity absent AND published value not reconstructible from the committed source ->\n    commit the record) and STAMP_CHURN (identity absent, value reconstructible -> the record is fine,\n    the stamp is noise; committing it repairs nothing and recurs). market.json is the fixture for the\n    second; W2_11 is the fixture for the first. A fifth, NO_IDENTITY_KEY (Finding 4), must score FAILED.\n  * The census unit is (door, block), not (door, file). Finding 1's 13/14 is the fail-open shape this\n    atom keeps producing: a control keyed one level coarser than the thing it certifies reports the\n    hard case as the benign class -- the tenth escape of this module's controls by their own keying.\n\nR12: no published number moved, nothing was tuned, nothing in `file_scope` was edited. Every figure above\nwas read out of a committed blob at a named ref or off the live artefact as it already stood.\n\nWHY THE LEVEL DOES NOT MOVE. Unchanged from all four prior passes: level 2 means the published-bytes\nstage and the quotation class BUILT and mutation-proven both ways. A DISCOVER/FRAME tick on a parked\natom may not write them, and an exit criterion is not renegotiated to fit what a tick was allowed to do.\n`level_current` stays 0.\n\nLEADS FOR THE NEXT HOUR. (a) The published-bytes stage now has a four-outcome predicate, three named\nfixtures with different outcomes (W2_11 block, market.json, run_output_latest.json) and two legs the\nfixtures cannot cover (unresolvable `run_git_commit`; missing identity key) -- both must score FAILED.\n(b) UNTOUCHED, fifth time of asking: the four Hours citing atom ids `D37`/`D38` the map has never\ncarried. (c) The `simplified.json` quotation census is still not this atom's. (d) NEW, and outside this\natom -- the run_output_latest.json freeze of Finding 4 is a live publish-path defect affecting the\nboard's headline figures, not a precision question; it wants its own staged finding rather than another\nline in this record."
map_notes:
  name: 'SPUN OUT OF H27 EXPERT HOUR #17 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT DISCIPLINE). Hour #17 took Hour #16''s lead 2 (the ROUNDING before the render) and found the layer above it first: D34 reads each figure''s reader precision off the format spec in ONE NAMED FUNCTION per figure, and the AGEING headline reaches its reader through TWO. `format_ageing_summary` renders `balanced_bucket_displacement` at `.3f`; `_ageing_direction_note` renders the SAME component at `.6f` into `ordinal_direction_caveat` -- a COMPONENT, which is precisely what Hour #15 established consumers read (''the ledger writer, the live wiring and the dashboard read `components` and never the prose''). So the register declared 3dp for a figure whose reader is handed 6, and the epsilon every band, floor and collapse for this dimension was certified against was 5e-4 where the reader''s own step is 5e-7 -- a THOUSANDFOLD, on the dimension whose own history is three reshapes deep. D34''s R15 list claims a mutation ''one gap rendered at two precisions'' fires: it fires only INSIDE the anchored function, so the SHIPPED two-precision state was invisible to the control built to detect exactly it (the ninth escape of a control of this module by its own keying). MEASURED, n=300, seeds 7/11, artefact-side and reading no source: ageing carrier 0.112963 / 0.191535, rendered at 6dp in `ageing.ordinal_direction_caveat` on both books. A SECOND undeclared site the same sweep found: `belief_population_mix` renders its own gap at 4dp into its own NOTE -- the string the ledger writer puts in front of the Proof door -- same precision, so no epsilon moved, but as invisible to a function-anchored walk as the first. HOUR #17''s LEAD 2 ANSWERED, and the answer is NEGATIVE and now pinned: the inner quantisation is never coarser than the render on any shipped figure (ageing 6dp carrier / 6dp render, detection_latency 6dp / 2dp, the other three unquantised at 17dp), so the render precision is not a decoration -- but ageing''s inner quantum EQUALS its finest render, which means its `carrier_is_the_gap` claim (delta 4.1e-7) is now satisfied within a hair of its own epsilon and by construction, since the component IS `round(gap, 6)`. THIS ATOM IS THE RESHAPE HOUR #17 DECLINED TO DO ON THE PROMOTER''S BEHALF: THE SWEEP STOPS AT THIS PROCESS''S EDGE. It can only see strings this module''s own `score_triad` returns -- `components` and `.note`. The same figures reach readers through `docs/observability/coupled_gap_ledger.json`, the dashboard and the Proof-door page, rendered by writers this sweep never runs, and whether any of those renders at a precision the epsilon does not know about has NOT been measured. Reaching them means reading published artefacts outside the module and touching the publish path, which is real blast radius and a mint rather than a fix on sight. R12: no published number moved -- all five figures bit-identical at seed 7 (ageing 0.11296259117981663, belief 0.1518987341772152, mix 0.07999999999999997, detection 0.014505119453924915, latency 2.343137); what moved is one declared epsilon and what the instrument admits about itself. ALREADY LANDED UNDER H27''s HOUR: `also_rendered_at` and `component_renders` on PUBLISHED_GAP_CONSUMERS, with ageing''s epsilon-setting precision corrected to the FINEST site (6dp, 3dp declared beside it) and the mix note declared; `measure_component_render_sites`, the INDEPENDENT half -- it reads no source at all, scores the book and looks for each figure''s OWN VALUE in every string the consumer is handed, with a DISCRIMINATION RULE (a literal only counts as a render of this figure if it CHANGES with the figure across two books, so ''0.0'' -- which is in half the strings this module publishes -- is a render of nothing); `_rendered_at`, which refuses a hit abutting another digit; the inner-quantum measurement, with `_FULL_PRECISION_DECIMALS` keeping ''not quantised'' distinct from ''not measured''; D34''s rule RESHAPED rather than dropped -- ''two precisions, refuse to guess'' becomes ''the epsilon is half a step of the FINEST'' with the guard moved onto the declared SET, so an undeclared precision still fires by name; the epsilon refusal message interpolated from the register (it said ''ageing 3dp'' and would have gone on saying it); and both controls WIRED INTO THE CLI, which D34''s never were. R15 both ways: the sweep fires on the pre-Hour register state (the 6dp site undeclared, and the epsilon set from 3dp), on a declared site the scoring does not produce, on an undeclared second precision in the anchored function, on a declared-but-not-finest epsilon, on a carrier quantised coarser than its render, and it RAISES on a single scoring (one book cannot tell a render from a constant) and on an inert sweep that finds nothing at all; the discrimination rule is proven to REJECT a ''0.0'' that never moves and to ACCEPT the same site once the literal tracks the figure.'
