atom_id: H32_map_size_ratchet_red_on_head
map_notes:
  origin_note: 'Minted 2026-08-09 by the D16 build, which tripped it and did NOT fix it on sight (SELF_INTERRUPT_DISCIPLINE). Attribution measured, not assumed: HEAD''s map was already 464110 bytes, 54510 over the ceiling, before this tick added 8865 -- the same red-on-committed-HEAD shape as WORKER_FINDING_RUFF_RATCHET_RED_ON_HEAD_2026-08-09, and NOT the working-tree-dirt wedge class it superficially resembles. Not blocking: the pre-commit gate does not run this test.'
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09. Took candidate 2 -- the one the interim ratchet raise named as the real fix and made a precondition of any second raise. The narrative note CLASS (build_note/discover_note/harden_note/level_hold_note/level_note/notes/origin_note, plus any *_note by suffix) MOVED verbatim into the existing sibling store''s new `map_notes:` tenant: 84 fields over 61 atoms, 129,750 bytes. Map 521,770 -> 393,692, so the ratchet went back to its ORIGINAL 400K rather than staying at the 640K interim -- the amnesty is repaid, not extended. NOT paid with the record: nothing was trimmed or reworded, and the move is hash-proven (tools/migrate_atom_notes.py, three layers -- per-span re-parse, canonical-JSON SHA-256 of the whole note subtree matched against an independent recombination through the loader, and a remainder proof that every NON-note field of every atom is byte-identical). THE PROOFS EARNED THEIR KEEP: layer 1 caught two real content-destroying bugs before any write -- joining kept-ends lines with ''\n'' inserted blank lines that a folded (>-) scalar turns into literal paragraph breaks, and slicing indentation off a bare ''\n'' line deleted the line entirely, silently reflowing two atoms'' prose into one paragraph. Both would have passed a shape-only check. R15 both ways in tests/design/test_atom_notes_store.py: 13 mutation tests, and the class guard fires on an invented `frame_note` nobody has written yet (R10 -- the class, not the instance). The one-file-two-tenants hazard is PROVEN not asserted: both writers rebuild the whole file, so a writer ignorant of the other tenant would silently delete it; two tests pin that it does not. Cross-tenant defect found and fixed in the process: load_all() reported notes-only files as zero-count simplifications entries, firing the count check on all 61 rehomed atoms -- each tenant''s loader now reports only its own population, and absent-vs-zero counts are one statement. NOT at L3: no HARDEN/Expert-Hour pass, and the ratchet''s new claim -- that what it now measures is the STRUCTURED spine, which grows with the atom count rather than with how much prose an atom writes about itself -- is a prediction that has not yet been tested by a few weeks of recording.'
