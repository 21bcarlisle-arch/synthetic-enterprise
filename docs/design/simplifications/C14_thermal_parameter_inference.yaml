  - '2026-08-09 HALF THE L2->L3 STEP BUILT, AND THE LEVEL DELIBERATELY NOT MOVED. This atom''s own L2 record named TWO exit conditions: (a) wire the belief into a live decision path so a company DECISION is made wrong by it, (b) measure the gap on the POPULATION rather than a hand-picked panel. (a) IS DONE. (b) IS NOT -- the panel is 10 authored premises, so the level stays 2 and the exit test is not renegotiated to fit what got built. DONE: company/pricing/fabric_intervention.py, the first thing in this codebase that spends money on a thermal belief. It reads the two C14 properties that until now were computed by nothing and read by nobody -- is_actionable (refuses a stock prior however tight its band) and interval_95 (refuses a winner that dies at the pessimistic end of the company''s OWN uncertainty). THE DEFECT IT CLOSED WAS FOUND BY PROBING NUMBERS, NOT BY REVIEW: the only decision function the fabric triad had lived in the harness that scores it, and its choice set had NO DO-NOTHING in it, so every premise was recommended something. A 0.08 kW/K flat using 4,000 kWh/yr at 7.4 p/kWh was recommended time_shift at a lifetime net value of MINUS 41 pounds -- spend 300 to save 259 -- and the money-consequence metric scored it as a PERFECT decision, because the truth arm picked the same value-destroying measure. A choice set that cannot say ''nothing here is worth doing'' cannot report the loss. THE DECISION MOVED TO THE COMPANY AND THE WALL FORCED A BETTER MODEL: the harness had scaled the company''s demand estimate by belief/truth to make the belief matter, which cannot live in company code even in principle because it needs the truth. The company instead attributes part of its own bill to fabric (HLC x degree days x 24, capped at the bill, at the 15.5C published UK base), so insulation saves a share of the FABRIC portion, never of the bill -- more physical AND consequential without contrivance. The harness now calls the company''s rule TWICE, once on belief and once on the SIM truth it alone can see; both arms run the same rule and the same catalogue, so the only difference between them is the belief. MEASURED, and the two numbers DISAGREE, which is the finding: the C14 posterior is WORSE than the register at predicting fabric (gap 0.2325 vs 0.2049, improvement -0.0277) and BETTER at deciding what to do about it -- 16,261 forgone against 41,586, a 61pct reduction, because narrowing the uncertainty converts refusals into correct actions. Reporting either number alone would be a lie in one direction or the other. THREE OUTCOMES NOW COUNTED SEPARATELY because they cost different things: bought-wrong, declined-where-value-existed (honest caution has a price -- a metric counting only wrong purchases scores a company that never acts as flawless), and value-destroying (structurally invisible before). BOTH NEW COUNTERS R15-PROVEN TO FIRE, because a counter only ever observed at zero cannot be told from one that cannot count. THREE THINGS THE WORK CORRECTED IN PASSING, each a control that was weaker than it read: (1) the carbon-invariance test guarded only on the COUNT of misranked premises, which is not the same as the same decisions -- two premises flipping opposite ways keeps the count and changes every kWh, and that is exactly what happened; it now asserts the decision VECTOR, computed independently of the metric it is checking. (2) ''the money consequence scales LINEARLY with the unit rate'' was FALSE -- capex does not move with the price and does not cancel, so the relationship is AFFINE; the doc, the printout and the test all now say so, tested as f(r1)+f(r3)==2f(r2). (3) the decision fixtures were priced at 25 p/kWh, an ELECTRICITY rate at which the heat pump wins on delivered efficiency whatever the fabric -- a belief 85pct low cost exactly nothing and every fabric test below it was vacuous; that saturation is now its own standing test in both directions rather than a silently chosen number. R15 FOUND SOMETHING THE DESIGN HAD NOT: guards 2 and 3 OVERLAP -- removing the do-nothing option does not resurrect the loss-making sale, because a winner negative at the estimate is negative at the pessimistic bound too. Recorded rather than tidied, and the suite no longer claims ''outcome unchanged under mutation'' proves inertness; each guard is instead shown firing ALONE on an input the other cannot refuse. Tests: 871 passed, 3 xfailed (company/pricing 630 incl. 34 new, harness/test_premise_two_level 96, tools/test_couple_fabric, simulation/test_premise_trace); epistemic_verifier PASS; wall ratchet 12 passed. WHAT L3 STILL NEEDS, and the blocker is now precisely located: the population. The panel is 10 authored premises whose composition was CHOSEN to span the stock, so no result on it can distinguish the company''s skill from the panel designer''s taste. The anchors to draw a stock-representative population already exist in docs/market_research/ASSUMPTIONS.md (EHS 2022-23 AT1_5 property-type and build-era distributions, AT1_2 EPC bands, AT3_1/AT4 heating systems), all four rows currently marked ''Gap -- household.py not yet built''. simulation/population_draw.py cannot serve: SyntheticCustomer carries no home_type/epc_rating/bedrooms, so make_household defaults every draw to the same suburban_semi and the population would be clones.'
  - '2026-08-09 L2->L3. THE EXIT TEST WAS THE POPULATION, AND THE POPULATION CHANGED THE ANSWER. This atom''s L2 record named two conditions: (a) wire the belief into a live decision path -- done earlier today, company/pricing/fabric_intervention.py; (b) measure the gap on a POPULATION rather than a hand-picked panel. (b) IS NOW DONE and the level moves. BUILT: simulation/premise_population.py + tests/simulation/test_premise_population.py (31 tests), and tools/couple_fabric.py --population N. THE BLOCKER NAMED IN THE L2 RECORD WAS REAL AND IS PINNED AS AN EXECUTABLE FACT: SyntheticCustomer carries no home_type/epc_rating/bedrooms, so make_household defaults every draw to the same suburban_semi -- test_the_recorded_clone_defect_is_what_this_draw_replaces asserts 200 such records occupy exactly ONE cell, which is a worse instrument than the panel, not a better one. HOW THE POPULATION IS COMPOSED: three published EHS marginals exist (property type AT1_5, build era AT1_5, EPC band AT1_2); the JOINT does not. Crossing them independently puts post-2000 detached houses in band G. So a SEED joint is formed from directional tilts (older stock rates worse; flats better than houses of the same age -- both directions published, neither magnitude), then RAKED (iterative proportional fitting) onto all three marginals, which is what makes the unanchored tilt magnitudes shape only the joint and never the marginals. Recovered to 0.10pp at n=20,000. THE CONTROL THAT CAN FAIL IS NOT THE MARGINAL ONE: raking to marginals is free to destroy a conditional, so the ONS 2023 statement (pre-1930 dwellings >80% in bands D-G, median score 59) is held out as an ORACLE and never fitted. Bar 0.680, derived from published numbers ONLY by diluting 0.80 for the sim''s wider pre-1945 era band under the most extreme admissible dilution (0.571*0.80 + 0.429*0.520). Fitted joint 0.794; the independent product of the SAME three marginals scores 0.520 and FAILS by 16 points, which is what makes it a test. The tilts were not adjusted after 0.794 was known, and that is stated in the source next to the constant. R15 BOTH WAYS, including a REAL SOURCE MUTATION (x = rng.random()*total -> x = 0.0 in _weighted_choice): 7 named tests fire, baseline restored green. Monkeypatch mutations on the source constants fire the marginal control (a 16-point error in a published share) and the oracle (flatten the era tilt -- raking still fits all three marginals exactly and the oracle still fails, which is the whole argument for holding it out). Fail-closed: rake RAISES on non-convergence rather than returning a joint whose marginals are not the published ones; a conditional over an empty conditioning set RAISES rather than reporting 100pct of no homes. PUBLISHED SHARES DO NOT SUM TO 1 AND THAT IS NOT A ROUNDING DETAIL: EHS AT1_2''s EPC bands sum to 100.1pct, three mutually inconsistent margins have no joint fitting all three, and IPF cycles forever instead of converging -- observed on first run at a 2.9e-4 residual. Normalisation is now explicit and BOUNDED: anything further from 1 than publication rounding RAISES, so a wrong share cannot be laundered by the same code path that absorbs a rounded one. THE MEASURED RESULT, AND BOTH HEADLINE PANEL NUMBERS WERE PANEL ARTEFACTS. n=200, four independent population seeds, same weather/window/rate as the panel run: EPC-vs-actual gap 0.427/0.457/0.480/0.449 against the panel''s 0.2049 -- THE PANEL UNDERSTATED THE REGISTER''S ERROR BY ~2.2x. And the SIGN of the prediction result FLIPPED: the panel said the C14 posterior was WORSE than the register (improvement -0.0277); on drawn populations it is BETTER in all four seeds (+0.0218/+0.0509/+0.0585/+0.0533). The decision benefit survives but shrinks honestly -- forgone GBP 451k/422k/415k/402k on the inferred belief against 548k/614k/568k/604k on the register, a 27-33pct reduction where the panel reported 61pct. Yesterday''s recorded finding ''the posterior is worse at predicting fabric and better at deciding'' is HALF WITHDRAWN: the second half holds, the first half was composition. WHAT THE POPULATION FOUND THAT A PANEL CANNOT, recorded and DELIBERATELY NOT FIXED (self-interrupt discipline -- both are queued as staged findings, neither is C14''s): (1) the two-level test is GREEN at n=10/25 and RED at n=50/100/200 on the SAME generator, weather and seed, because every L1 cell is a worst-of-N statistic and a worst-of-N is monotone in N by construction -- the bands encode ''no home in TEN may exceed this''. W1_12''s L3 rests on a green two-level test measured on that same 10-home panel; whether it survives at population scale is now an open question and is claimed neither way. docs/staging/WORKER_FINDING_WORST_OF_N_CONTROL_IS_NOT_SCALE_INVARIANT_2026-08-09.md. (2) the L1.1 texture band conditions on the BINARY is_gas_heated, but the drawn population contains resistive electric homes for the first time (9 of 200, which is roughly what England has) and the electric band''s own derivation is heat-pump arithmetic (SPFH4 2.78). A storage heater has an SPF of ~1.0, so P0197 is failed at 0.0414 by a threshold derived for a different machine. This is the 2026-08-08 gas-shaped-band defect recurring one subpopulation over, i.e. an R10 class miss: the band is keyed on a boolean where the physics is keyed on a delivered-efficiency ratio. docs/staging/WORKER_FINDING_HEATING_REGIME_CONDITIONING_IS_BINARY_2026-08-09.md. NEITHER band was touched and no cell was marked UNVALIDATED -- either would have turned the suite green in one edit. STOPS AT L3, and the largest open simplification is named: bedrooms are an UNANCHORED placeholder (two searches found no published stock-wide bedroom marginal) and they drive floor area, which scales the HLC nearly linearly -- so the LEVEL of every pound figure here rests on an unpublished table while the RANKING does not. Bungalows (8pct of stock) are folded into DETACHED because PropertyType has no such member, making the drawn detached share 25pct against a published 17pct. Solar and EVs are OFF for every drawn premise, exactly as in the panel, so a panel-vs-population difference is attributable to composition and nothing else. Expert Hour not_attempted. Tests: 31 new (tests/simulation/test_premise_population.py) + 20 in tests/tools/test_couple_fabric.py (5 new, on the drawn path and the wall); epistemic_verifier PASS (535 files).'
