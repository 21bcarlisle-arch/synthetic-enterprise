atom_id: KNIFE4_orphan_disposition
map_notes:
  origin_note: 'DISJOINT BY MEASUREMENT, not by definition: an orphan could in principle also sit on a crossing edge (nothing stops a module with no company-side caller being imported from simulation/), and the measured overlap with all three wall passes is zero. So this pass may run at any position, including alongside a wall pass if width is ever available. The 258 module paths are NOT frozen into file_scope -- the register is the owned artefact and the index is the source; freezing 258 paths would make every unrelated module addition a scope conflict. Directly connected to the no-caller class census (2026-08-09, 13 instances in 13 days, 8 found by accident): this pass is that class''s standing disposition, and a module ''kept-and-explained'' because the index could not see its caller is a finding AGAINST the index, to be logged, not absorbed.'
