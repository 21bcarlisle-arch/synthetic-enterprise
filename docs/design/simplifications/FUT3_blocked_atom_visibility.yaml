atom_id: FUT3_blocked_atom_visibility
map_notes:
  origin_note: The specific risk this atom must disprove is that the blocked-atom exclusion is implemented once and reused everywhere -- supervisor._is_externally_blocked drops blocked atoms from EVERY draw, and if the target-design and staleness readers share that filter, the futures become invisible to precisely the surfaces the ruling wants them visible on, which would make the whole minting exercise a no-op that looks fine. Verify by reading the actual readers (AO7 target-design, AO11 map_assertion_provenance) against the newly-blocked ids, not by inspecting the draw.
  name: 'DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 §4, WORK-THIS-CREATES #4: blocked atoms are invisible to the DRAW but must be visible to the target-design deltas and the staleness clocks -- confirmed, not assumed. Verification target, measured at mint on 2026-08-08: lane weights were 82 harness vs 7 commercial across 206 atoms, with zero atoms touching CLV, named counterparty adapters or a forecast feed.'
map_records:
  evidence:
  - docs/staging/DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08.md
  - '2026-08-09 BUILT L0->L2. Mechanism: background/blocked_atom_visibility.py, rendering docs/design/BLOCKED_ATOM_VISIBILITY.md (generated; --check re-derives and fails on drift). THE ORIGIN_NOTE''S NAMED RISK IS DISPROVEN, by reading the readers as it demanded: `_is_externally_blocked` has exactly two call-site families and both are in background/supervisor.py (grep, whole tree) -- neither AO7 nor AO11 imports it, so the exclusion is NOT implemented once and reused everywhere. TWO CORRECTIONS TO THE RULING''S PREMISE, measured not assumed: (1) `blocked` on this map is `loop_stage: idle` + prose `block_reason`, NOT `blocked_on` -- ZERO of 232 atoms carry a `blocked_on`, for the three reasons the EP1-EP20 mint recorded in the map header, so the measured parked set is the 82 idle atoms; (2) AO7 target_design_delta does not read the maturity map AT ALL -- all seven of its probes are code-tree architecture (AST/git-index/size-census), so the ruling''s ''visible to the target-design deltas'' was not a property AO7 had either way. Bolting a map-composition target into an architecture document would be accretion (OPERATIONAL_COHERENCE_DESIGN_PASS), so the dial is carried HERE, in AO7''s shape but on its own subject. MEASURED, LIVE TREE: draw 82/82 parked atoms not offered by the REAL draw, of which 60 proven excluded BY THE PARK (lifting the park alone makes the same atom drawable) and 22 excluded for another reason (never counted as proof); clocks 82/82 parked atoms carry an AO11 row; dial harness 86/232 = 37.1% vs 82/206 at mint, and ALL FOUR named subjects (clv 1, counterparty_adapter 8, forecast_feed 1, tournament 2) have coverage that is ENTIRELY parked -- a park-filtering reader would report exactly the zero the ruling was minted to fix, which is the visibility property doing work rather than decorating. R15 PROVEN BOTH WAYS, five source mutations: is_parked->False kills 16; a verdict reached without probing the draw (tautology) kills 2; a skipped probe failing open kills 1; clock_invisible->[] kills 1; the vacuity floor removed kills 1; unmutated passes 26. R12: --check returns 0 on a 100% harness share (test_a_lopsided_dial_is_reported_and_passes) -- measurability gates, the number never does. Tests: tests/background/test_blocked_atom_visibility.py 26 passed. Stops at L2 (mechanically real, happy path): nothing calls it on a schedule, so the dial moves only when the CLI is run -- digest/pre-commit wiring is L3.'
