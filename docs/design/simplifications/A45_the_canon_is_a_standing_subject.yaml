atom_id: A45_the_canon_is_a_standing_subject
map_notes:
  gain: 'Director, 2026-08-28: ''Today''s three corrections were found because the director and advisor happened to read the page -- no mechanism ever checks it, so the mission sits structurally outside the machine''s field of view. That check would have caught C1 and C2 weeks ago, and it is the machine''s job rather than the director''s.'' The three corrections cost nothing to find once someone looked: C1''s traits were unread by any response function, C2''s competitor was eleven design documents and no module, C3''s collateral was a fixed cost line and never a call. All three were greppable. The atom is the standing check, not the three answers -- those are filed in WORKER_FINDING_THE_CANON_AND_THE_CODE_DISAGREE_ON_THREE_CLAIMS_2026-08-28. Note the direction runs both ways: C1 was found to be PARTLY SUPERSEDED, because a channel for price_sensitivity landed on 2026-08-27, the day before the guidance was drafted. A drift check that can only report the page over-claiming would have missed that.'
map_records:
  expert_hour_findings:
  - >-
    Blind pass, fresh read-only reviewer (control-attestation veteran), independence false. Verdict
    NEEDS_WORK, held at 2. MAJOR 1: 5 of 20 claims could not go red -- three searched for
    `collateral_call` (no source file ever held it), one for `UPLIFTABLE_COMMODITY` (renamed
    2026-09-07; and literal_assign skipped any value literal_eval could not read, so pointing it at
    the frozenset would also have held), one for the archived decarb_recommender. CLOSED 2026-11-14:
    an absent claim must show a witness in live code or report ERROR (VACUOUS); literal_assign
    refuses an unassigned name or an unreadable value; the C3 trio reads the one world call that
    marks the margin-call book (`mark_date=effective_end`); the arm reads UPLIFTABLE_COMMODITIES
    contains gas; decarb retired. The witness reported exactly those 5 and no others. OPEN, the
    remaining L3 work: MAJOR 2 CLOSED 2026-11-14 (a red register now mints one
    WORKER_FINDING_THE_CANON_DRIFTS_FROM_THE_CODE_<key> per distinct drift set, BLOCKING on an
    OVER_CLAIM, LATENT otherwise, deduped across every staging room; six mutations red); MAJOR 3, an under-claim is
    seen only where an absent-claim was pre-registered, and the page's spine (the C3 paragraph,
    "competition ... blocked entirely by C2 ... none of them presses yet") contradicts its own
    organs line that a rival now moves, with the check green. MINOR: coverage is per section, so a
    section with one anchor reads watched (renewal ceiling, tariffs-only channel, modelling never
    offered to the household are unbound); The mission section's two unregisterable claims have
    since been overtaken (M3 names time, A47 landed).
  - >-
    MAJOR 3, 2026-11-14, partly closed. The check now names every "the code lacks X" phrase
    (UNDER_CLAIM_FORMS) that no anchor covers. The unit is the phrase, not the sentence, so the
    spine sentence the pass found ("none of them presses yet ... competition (blocked entirely by
    C2)") is named even though its collateral clause is anchored. It reports coverage, not drift:
    18 sentences on the live page, printed in the note and the report, with the exit status
    unmoved. Still open: naming a negative is not judging it. An under-claim goes red only once
    an `absent` claim binds it, and the lexicon is a judgement (the broader form named 50).
    Controls: a three-leg partition plus a print leg. Mutations at sentence grain, a dropped
    append, a lexicon widened by `never`, `blocked` dropped and the list unprinted were all red.
    Phrase-overlap against phrase-containment is an equivalence except where a phrase straddles
    an anchor edge.
  - >-
    MAJOR 3, 2026-11-14, worked from its own list. The 18 named sentences were read against the
    code. Two were judged and bound: the cap sentence (said twice; the renewal desk calls the
    clamp, now PRICING_the_renewal_desk_clamps_at_the_competitive_ceiling, present) and the
    carbon correction's "The ledger is still called by nothing" (the same predicate as
    CARBON_the_three_ledger_is_called_by_nothing). A claim may now carry `also_anchors`, so a
    page that repeats a claim binds every copy to one probe and each copy going reads UNBOUND.
    Found doing it: import_edge read only `node.module`, so `from company.carbon import
    carbon_ledger` was no edge and an absent claim on a module (this one, TF2's) could hold
    while the import existed. Fixed. 18 -> 16 named; the carbon sentence stays named for its
    unchecked "abatement is still unmeasured". Left: "nobody yet targets the company's book"
    needs a probe for a mechanism that does not exist yet (no witness, so it would be VACUOUS);
    the picture-YAML and links lines are the lexicon's false positives. Level held at 2.
  - >-
    MAJOR 3 residual, 2026-11-15 ("naming a negative is not judging it"). A named sentence is now
    settled one of two ways: an absent claim binds it, or a `_judged_negatives` row in the register
    says why no predicate can be written (no_witness | not_about_code | summary), keyed to a
    verbatim excerpt so an edited sentence is named again. A summary lapses the moment a claim it
    restates stops holding. A malformed row exits 2. Bound: "read by no decision surface"
    (MISSION_the_household_share_is_read_by_no_decision_surface; witness = the three tools that
    call it). Judged: 13. Predicted 16 -> 3 named; read 4, because the table row has no full stop,
    so the time row's two "not yet instrumented" cells shared the share row's sentence; judged
    no_witness, then 3. Left named on purpose, needing a judgement this pass could not settle:
    the spine's debt clause (arrears coupled to wholesale peaks, against W2_4's household budget),
    "moneyness trigger absent" (against customer_events' market switching multiplier), and
    "Abate ... not yet instrumented at all". Six mutations red. Level held at 2; next is a fresh
    Expert Hour pass against MAJOR 3 and the per-section MINOR.
  - >-
    MAJOR 3 residual, 2026-11-15, second pass. Of the three left named: "Abate ... not yet
    instrumented at all" was read and found to carry a slip, "is instrumented as our £/tCO2e and is
    not yet instrumented at all" (since 01ac4b7512; the page's own table says designed, not
    instrumented). Corrected on the page, marked beside it, and judged no_witness: no module computes
    an Abate score term, so there is no symbol to watch. Predicted 3 -> 2 named; read 2. The other
    two stay named because each needs a definition before a probe, not a judgement: churn already
    reads each renewal's rate against the market, so "moneyness trigger" is either that or a
    mid-term exit from an undercut fix; and if W2_4's household budget carries the bill into
    arrears (not checked here), "coupled to wholesale peaks" needs saying what coupling would be
    beyond that. Level held at 2.
  - >-
    MAJOR 3 residual, 2026-11-15, third pass: the last two named sentences, each defined before it
    was settled. Debt: "coupled to wholesale peaks" defined as the world's per-bill outcome
    depending on the bill meeting the household's budget. It does not (payment_outcome draws from a
    life-event income-stress tier; W2_4's budget is imported only by three answer keys and offline
    tools), so it is bound as C3_arrears_do_not_meet_the_bill (import_edge, absent; held with the
    exclusions, fires 8 hits without them). "none of them presses yet" is judged a summary of the
    two bound C3 clauses, and "blocked entirely by C2" as the superseded clause kept beside its 14
    Nov correction. Moneyness: defined as leaving a fix before its end because the market beats it;
    judged no_witness (the departure roll runs once per renewal). "does not yet CONTEST" is the
    fourth copy of "Nobody yet targets the company's book". Named 2 -> 0. No prediction was filed
    before this pass, so the count is a reading, not a test. Open: the per-section MINOR (three
    sections unwatched) and a fresh Expert Hour pass. Level held at 2.
