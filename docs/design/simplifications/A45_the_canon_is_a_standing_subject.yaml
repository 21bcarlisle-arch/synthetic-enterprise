atom_id: A45_the_canon_is_a_standing_subject
map_notes:
  gain: 'Director, 2026-08-28: ''Today''s three corrections were found because the director and advisor happened to read the page -- no mechanism ever checks it, so the mission sits structurally outside the machine''s field of view. That check would have caught C1 and C2 weeks ago, and it is the machine''s job rather than the director''s.'' The three corrections cost nothing to find once someone looked: C1''s traits were unread by any response function, C2''s competitor was eleven design documents and no module, C3''s collateral was a fixed cost line and never a call. All three were greppable. The atom is the standing check, not the three answers -- those are filed in WORKER_FINDING_THE_CANON_AND_THE_CODE_DISAGREE_ON_THREE_CLAIMS_2026-08-28. Note the direction runs both ways: C1 was found to be PARTLY SUPERSEDED, because a channel for price_sensitivity landed on 2026-08-27, the day before the guidance was drafted. A drift check that can only report the page over-claiming would have missed that.'
