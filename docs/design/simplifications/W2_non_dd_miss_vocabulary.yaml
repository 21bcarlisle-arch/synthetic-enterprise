atom_id: W2_non_dd_miss_vocabulary
simplifications:
- '2026-08-03 MINTED by the W2_payment_channel_dd_consistency_invariant build as its NAMED L3 residual, not as a discovered aside. That atom closed the BILLING LEDGER surface (12 violating arrears cases -> 0). The BEHAVIOURAL/SAMPLE surface still carries 8 violating customers, MEASURED with the shipped control: C1g, C4, C8 (resi standard_credit), C5, C6 (SME) and C_IC1, C_IC2, C_IC3g (I&C). Root cause is NOT the one the DISCOVER predicted: background/live_payment_triad.py maps BOTH "failed" AND "dispute" onto the literal string DD_FAILED under its own explicitly NAMED SIMPLIFICATION ("the legacy analytics vocabulary has only ON_TIME/LATE/DD_FAILED"), so every corporate invoice dispute is recorded as a returned Direct Debit for a customer who pays by CHAPS.'
- '2026-08-03 THE TRAP, measured before minting so the next tick does not walk into it: the fix is NOT a rename. company/crm/payment_behaviour_analytics.py derives dd_fail_rate by counting result == "DD_FAILED", and company/crm/life_event_detector.py, company/crm/affordability_inference.py and saas/sme_credit_risk.py all read late_rate + dd_fail_rate as their distress signal. Emitting a new label without teaching those four consumers about it would make a non-DD customer''s missed payments STOP REGISTERING AS DISTRESS -- a silent loss of real signal, strictly worse than the mislabel it fixes. simulation/payment_seam_adapter.py additionally maps dd_failure_reason onto Bacs reason categories and must not receive a reason for a payment that was never a Direct Debit. R15 both ways: (a) a corporate dispute must stop reading as DD_FAILED; (b) each of the four distress consumers must still score a non-DD miss as distress -- mutate the consumer to ignore the new label and its test FIRES.'
- '2026-10-07 BUILT. `_derive_analytics_record` labels a failed collection DD_FAILED only on a Direct Debit; a miss on any other rail, and every corporate dispute, is MISSED. `compute_payment_metrics` gains `miss_rate` (DD_FAILED + MISSED) and the score, life_event_detector, affordability_inference and saas/sme_credit_risk read it, so a non-DD miss still registers as distress; `dd_fail_rate` and the trajectory''s `dd_failed` are now the DD share alone. Controls: tests/company/crm/test_a_non_dd_miss_still_reads_as_distress.py and the triad''s per-method arm, each reader mutated to ignore MISSED. BEFORE, on the published site/data/customer_sample.json (generated 2026-10-05): 31 of 175 non-DD customers carry a DD-only artefact (the mint counted 8 on a smaller sample). The AFTER recount needs a run on this code and has not been taken. RESIDUAL: 16 of the 31 are prepayment (14 standard credit, 1 SME), and a prepayment customer has no bill to miss -- the world draws them a direct_debit-tier outcome (payment_behaviour_source.generate_payment_event); that is a world-fidelity question, not this vocabulary.'
- '2026-10-09 AFTER-RECOUNT, L0->L2. The sample generated from run 224e4af02 (contains the build, 2026-10-09; generated to /tmp, not published) reads 0 of 271 non-DD customers carrying a DD-only artefact, through the same flattening and `record_asserts_dd_failure` that reproduces the BEFORE figure exactly. CORRECTION to the BUILT entry: BEFORE was 31 of 46 non-DD customers in a sample of 175, not 31 of 175 non-DD. The zero is not vacuous: 195 DD customers still carry dd_fail_rate > 0 and 40 non-DD customers carry MISSED bills. Found on the way and fixed: the desk record the sample publishes (`behavioural_record`) carried on-time, late and dd_fail_rate but not miss_rate, so on 45 customers the published rates summed below one, the MISSED share in none of them; it now publishes miss_rate. The prepayment RESIDUAL reads 0 of 136 prepayment customers with any miss on this run (16 BEFORE); more than this atom changed between the two runs, so I cannot yet say what moved it. TARGET 3 -> 2, the W2_payment_channel_dd_consistency_invariant precedent (6314e5bc8): the coupled-triad gate refused L2 here because a world row aiming at L3 needs a company twin, and none has one to hold -- no company grade scores the distress belief about a non-DD customer against the world. Restore L3 when one does (EP4_collections_journey is the natural twin: what the company does about a missed bill), with the pair in coupled_triad''s table and its gap measured.'
map_notes:
  name: Give the behavioural/analytics surface a non-DD missed-payment label, so a standard-credit or corporate customer's miss stops being recorded as a returned Direct Debit
