atom_id: D15_w2_5_false_flag_direction_r13_choice
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). THE SECOND DIRECTION IS PUBLISHED AND THE CHOICE IS NAMED RATHER THAN TAKEN QUIETLY. (1) THE THREE POPULATIONS ARE EACH BUILT BY THEIR OWN POSITIVE PREDICATE (`_POPULATION_PREDICATES`), and `_classify` runs ALL THREE per instance and RAISES unless exactly one matches -- so the defect the atom named (deriving NEITHER as the complement of must-flag) is refused at the source, not reviewed for. Reproduced exactly on the D13 reference population: 1099 / 2772 / 16129 of 20000. (2) ALL THREE CANDIDATE NEGATIVES ARE SCORED ON EVERY RUN (`EXCLUSION_BASES` + `false_flag_measures`), printed side by side, and carried into the ledger components -- A 0.1661 (3140/18901), B 0.1491 (2674/17937), C 0.0576 (929/16129), miss 0.0081 on all three because the company is literally fixed. The published basis is ONE CONSTANT (`PUBLISHED_EXCLUSION_BASIS`) the director moves in a one-line edit. (3) THE R13 CALL WENT TO THE DIRECTOR WITH A RECOMMENDATION, NOT AS A BARE ASK (NEVER_ASK_WITHOUT_RECOMMENDING): recommend C, PROVISIONAL, acted on and reversible, all three rates on the table -- docs/design/D15_FALSE_FLAG_EXCLUSION_R13_CHOICE.md. R12 HAZARD STATED WHERE A READER SEES IT (module docstring, register entry, doc, provenance string): C is the LOWEST of the three and is recommended by the agent whose atom closes, so the argument stands on the SET -- the miss direction''s truth is EVENT-shaped (''an event dated in this year'') while the detector''s claim is STATE-shaped (''this household is in distress''), and the carried-distress band is exactly where the two shapes disagree. The doc also names what would OVERTURN it (a curriculum decision to price timeliness) and says the honest instrument for that want is a latency dimension, not basis A. (4) THE DEBT IS CLOSED IN THE REGISTER, MEASURED NOT DECLARED: `DETECTION_DIRECTION_CONTRACT[''couple_w2_5_c7.detection'']` flips to two-directional, and `_flag_everything_score` now routes it through `false_flag_measures` ON ITS OWN WORLD (customer-years, not the triad''s payment records) -- flag-EVERYTHING and flag-NOBODY both score 0.5 under all three bases where the retired recall-only metric gave flag-everything a perfect 0.0. Three of four published detection dimensions now count both directions; the one survivor (couple_w2_8_c10, D14) is VACUOUS rather than unchosen, which is D13''s finding paying off. (5) FOUND AND FIXED AT BIRTH, NOT AFTER A READER WAS MISLED: `gap_metric.format_detection_summary` hardcoded the payment triad''s nouns, so this pair''s first render published ''the wrongful-dunning exposure'' for a life-event distress rate -- the exact one-name-two-numbers class D16 had just closed one instrument over. The two nouns are now parameters DEFAULTING to the triad''s wording (every pre-existing render byte-identical, asserted) and this pair names what it measured. (6) R15, 20 controls, every one a differential: the complement mutation raises, the no-match mutation raises, membership is re-derived from `simulation.life_events` rather than from the sets under test, folding NEITHER back moves the rate 0.0576->0.1661, a company flagging ONE carried-distress year scores 0 false flags while one flagging ONE settled LOW/LOW year scores 1 (and the naive basis cannot tell them apart), an unexplained exclusion raises, and the vacuity guards fire on empty populations. 145 tests green across the pair, the triad, the live path and gap_metric; 857 green across the wider detection/gap/coupled selection. SIZE RATCHET PAID BY LOGGED OVERRIDE, NOT BY TRIMMING (H32''s rule): 241->511 lines is the second direction plus three named exclusions; same remedy as the sibling coupler''s existing override. L3 NOT claimed: no Expert-Hour pass on the published instrument, and the director has not yet answered the R13 call the atom exists to put to him.'
  origin_note: 'Minted 2026-08-09 by the D13 DISCOVER. This is the half that IS buildable, and D12''s mint was wrong to bracket it with W2_8 -- the two pairs are debt for OPPOSITE reasons (W2_8''s measure is vacuous, this one''s is live and consequential). THE NUMBER: x2.88 (0.1661 -> 0.0576), the same class as D11''s x10.5 and D12''s 0.1031 -> 0.0584, and flat under scale (x2.80 / x2.88 / x2.89 at 5k / 20k / 50k instances) so it is not a small-sample artefact. WHAT MAKES IT BUILDABLE where the mint thought neither was: the choice is DISCRETE -- income_stress has exactly three values, so there are exactly three candidate negatives, each with a measured consequence. That is a named enumerable question the director can answer under R13, not a threshold on a continuum. THREE POPULATIONS, state them: must-flag = a distress event dated in that year (1099); NEITHER = no event but stress carried in (2772) -- flags here are CORRECT and belong in n_excluded; must-not-flag = LOW at both ends (16129). Deriving the second as the complement of the first is exactly the defect this atom exists to avoid. R12: whichever option the director names, the rate it produces is a DIAGNOSTIC -- the build does not get to prefer the low one. R15: needs a mutation proving the published direction distinguishes a real false flag from a carried-distress flag, and the flag-EVERYTHING degenerate must score >0 through the register entry''s own scorer.'
  name: 'W2_5<->C7 CAN publish a false-flag rate -- its negative is settled (income_stress LOW at both year ends, a discrete state, not a threshold) -- but the exclusion boundary swings the measured rate x2.88 with company behaviour literally fixed: naive 0.1661 / exclude-carried-HIGH 0.1491 / LOW-both-ends 0.0576. The swing is driven by income_stress PERSISTENCE: 2772 instances (14.7% of the naive denominator) are years with no distress EVENT but carried-in distress, where a C7 flag is CORRECT. Publish the second direction on the settled negative, and put the three-way exclusion to the director as an R13 curriculum call with all three rates on the table -- never chosen by the agent that benefits from the atom closing.'
