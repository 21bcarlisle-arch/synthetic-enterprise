- '2026-08-03 L0->L2 RECORDED (worker tick). The BUILD was adopted to main at 08acb5f60 but the map cell still read 0 -- the stale-cell class (adoption moved the code, nothing moved the level). RE-VERIFIED, not re-stamped: tests/tools/test_evidence_pages.py 25/25; and R11 driven against the LIVE surface -- https://poesys.net/evidence/ returns 200 and renders 6395 elements carrying real atom ids, L-levels, NO_LEDGER_RECORD tags and counted test functions (primary-state evidence, not restated prose). ORPHAN TRANSITION CLOSED, which was the real gap: tools/generate_evidence_data.generate() was NEVER wired into background/process_run_complete.py despite its own docstring saying it was safe to call from there, so a page derived ENTIRELY from moving sources (maturity_map.yaml, gate_authorizations.jsonl, test_execution_log.jsonl) would have frozen at its build-day state while the map moved beneath it -- the same defect as the 2026-07-14 director_twin.json freeze. Now wired. HONEST BOUND: at wiring time the regenerated page differed from the committed one ONLY in generated_at/git_hash, so nothing had drifted YET; the freeze was structural and future-facing, not an observed stale page. RESIDUAL, recorded not hidden: the evidence page is not one of moap_coherence_gate.py''s four surfaces, so a map-only edit is gated on stage coherence but not on evidence-section presence; the missing-section case is instead closed by DERIVATION (the generator raises EvidenceSourceUnavailable before writing rather than emitting a blank page).'
