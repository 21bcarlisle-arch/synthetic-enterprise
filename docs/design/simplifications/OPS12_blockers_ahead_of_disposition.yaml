atom_id: OPS12_blockers_ahead_of_disposition
map_notes:
  name: 'MINTED FROM deliverable 4 of the WORK THIS CREATES block in DIRECTOR_RULING_FINDING_SEVERITY_AND_INTERLEAVE_2026-08-12 -- ''blockers wired ahead of the disposition queue''. Clause 3: a BLOCKING finding draws ahead of the general disposition queue, ahead of latent findings, and ahead of new feature work in its own lane; the drain proceeds around it. EXIT: (1) the supervisor draw orders in-lane BLOCKING findings ahead of all three of those categories, and the ordering is read from the OPS9 severity parse, never from a second hand-kept list that could disagree with it; (2) NON-BLOCKING ELSEWHERE proven -- with a blocker live in lane L, a draw in another lane is unaffected, which is the ''drain proceeds around it'' half and the half a naive global priority would break; (3) the draw REASON names the blocker, so a tick that jumped the queue can be audited afterwards from the log alone; (4) R15 both ways -- a mutation restoring arrival/recency order, and one that lets a blocker starve every other lane, each kill a NAMED test; (5) fail-open check -- if the severity index cannot be read, the draw must say so and fall back visibly, never silently resume recency order, which is how a re-ranking control quietly stops re-ranking.'
