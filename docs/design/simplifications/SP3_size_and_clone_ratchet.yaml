atom_id: SP3_size_and_clone_ratchet
simplifications:
- '2026-08-03 BUILT L0->L2 (worker tick), recorded in gate_authorizations.jsonl. LIVE: tools/size_ratchet.py (engine) + tools/size_ratchet_gate.py (pre-commit skin) + tools/size_ratchet_override.py (logged override), wired into tools/git-hooks/pre-commit, baseline docs/observability/size_ratchet_baseline.json. 28 tests; R15 both ways via 13 SOURCE mutations, each firing its own named test with the rest green, baseline restored byte-clean. Four rules live: file-exceeds-frozen-baseline; TOUCHED-file-grew-vs-HEAD (the rule that DRAINS rather than freezes); new-file/new-function caps 600/60 (NEW only -- the 43 existing oversized files are grandfathered, never retroactively broken); clone ceiling.'
- '2026-08-03 THE CEILING WAS MEASURED AND 223 WAS REFUSED. The DISCOVER doc s2.3 said to freeze the ruling s0 figure (223) directly; its own s8 made "re-derive it and confirm it lands at or very near 223" the CONDITION for trusting it. It does not, under either available convention: SP5s detector reads 283 over SP3s 8-root scope and 269 over its own 5 roots, a body-only fingerprint reads 209, and the tree moved 789->818 files (+24k lines) in six days. Freezing 223 against a tree measuring 283 would have granted 60 instances of silent headroom on day one -- a fail-open by construction. Frozen at the MEASURED 283, with 223 carried in the artefact as historical_reference_ceiling so the delta stays visible rather than laundered.'
- '2026-08-03 THE DETECTOR IS BORROWED, NOT REBUILT -- and the DISCOVER doc was six days stale on exactly the claim that authorises writing new code. Its s2.1 ("no existing clone-census tool in-repo; the BUILD half must BUILD one") was true on 07-28 and FALSE by the draw: background/shared_primitive_census.py (SP5, landed earlier the same day) ships a parameterised AST detector whose own docstring records the reconciliation it owed SP3. Building the designed tools/clone_census.py would have put a SECOND AST clone detector in the repo, committed by the atom whose purpose is to stop duplication. SP3 imports SP5s detector; test_sp3_does_not_ship_a_rival_clone_detector fails if the fingerprinting ever comes home.'
- '2026-08-03 FINDING -- THE RULINGs CEILING WAS NEVER ENFORCED ANYWHERE (5th instance of the orphan-transition class, subtlest disguise yet: not a function nobody calls, a CONSTANT nobody compares). CLONE_CEILING = 223 appears at exactly two sites in the repo -- its definition and one write into docs/observability/shared_primitive_census.json. It is never compared to anything; that artefact reads clone_ceiling 223 beside clone_count 267, a 44-instance breach sitting in primary state firing nothing. SP3 IS the missing tripwire, which is the strongest argument this atom was worth building rather than archiving.'
- '2026-08-03 L3 RESIDUAL, stated honestly: rollout_state is WARN -- the ratchet detects, prints and logs to docs/observability/size_ratchet_warnings.jsonl but does NOT block, so it has never prevented a real regression in the wild. A gate that has only ever run in warn state is an untested brake. L3 needs the warn->gate flip (a deliberate one-line diff to the baseline artefact after one retro cadence of real warn-log evidence, never an auto-flip -- that would be the silent-state-change class R2/R7 forbid), plus a cycle of evidence that the 600 cap does not false-fire on legitimate work. Also open: SP5s scan scope omits tools/ and interface/ (110 files) while SP3 uses the ruling-faithful 8 roots, so two live numbers describe "the clone count" -- SP5 is the side that deviates; reconcile on next touch of that module.'
- 2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_size_and_clone_ratchet_2026-07-28.md, source DIRECTOR_RULING_SHARED_PRIMITIVES_AND_CODE_STANDARDS_2026-07-28 section 3. BUILD half was parked behind director_build_open (abolished 2026-07-29, swept 2026-08-03) -- registered here so it competes as build work rather than re-presenting as staging noise every tick (R17).
- '2026-08-03 MINT -- THE RATCHET SHAPE IS THE POINT (and it is the anti-treadmill design): a ceiling that can only ever go DOWN means the debt drains as a SIDE-EFFECT of touching code, which is why it does not become the "infinite supply" treadmill SELF_INTERRUPT_DISCIPLINE warns about. R15 BOTH WAYS: add a clone above the current ceiling => the ratchet REDS; remove it => passes. FAIL-OPEN GUARD: an unparseable or missing census must FAIL the ratchet, not pass it -- an unavailable check is a FAILED check. ANTI-GOODHART (ruling section 7): the clone count is a REPORTED FACT, never a score to maximise or a target to hit; a ceiling lowered by deleting tests rather than duplication is the defect this must not reward. DEPENDS on the clone census supplying the 223 ceiling number -- if that census is not re-runnable, the ratchet has no defensible starting ceiling and that is a blocker to state, not to assume away.'
