atom_id: PW3_suite_duration_watch
map_notes:
  origin_note: 'The tempting build is a new metrics collector; the cheap and correct one is a headroom ratio over a series that already exists. R12 is the live risk on this atom specifically: the fastest way to make the number green is to run fewer tests, which is the one move CLAUDE.md''s ''DEPTH IS NOT THE PLACE TO SAVE'' forbids.'
  build_note: 'BUILT L0 -> L2 (2026-08-10). WHAT CHANGED: background/suite_duration_watch.py (new, ~250 lines); the publish gate measures its own run (background/process_run_complete.py::_run_gate_in wraps subprocess.run in time.monotonic and hands the elapsed to _record_gate_duration, including on TimeoutExpired before re-raising); the daily self-note grows a "Suite headroom" block. THE EXISTING SERIES WAS CHECKED FIRST, as the atom''s EXIT requires, and REJECTED WITH REASONS — docs/observability/test_execution_log.jsonl records {timestamp, test_count} and no duration at all; it carries no commit SHA, so a duration could not be attributed to a subject; every partial pytest invocation appends to it undifferentiated (1,000+ lines/day, many of 2-6 tests), so gate runs are not separable from them; and the gate now runs inside a throwaway HEAD checkout whose docs/observability is discarded with the tmpdir, so gate runs never reach that log in the first place. Extending it would have meant changing what every pytest session writes in order to observe one caller. One append per GATE run, written by the gate, is the smaller change. EXIT (1): each run appends {timestamp, git_hash, duration_seconds, ceiling_seconds, headroom_ratio, band, outcome} to docs/observability/publish_gate_duration.jsonl — the raw duration AND the raw ceiling are both stored so the ratio stays re-derivable by an independent reader rather than trusted (test_record_stores_the_raw_inputs_so_the_ratio_is_rederivable). The timeout is recorded too: the run that hits the wall is the most informative point in the series and would otherwise be the one missing from it. EXIT (2): reported on the daily self-note as a RATIO — headroom = 1 - duration/ceiling — because a raw second count is not comparable across a changed ceiling, and the ceiling moved 600 -> 1800s on the day this atom was minted, silently changing the meaning of every historical second count at that moment. Same fraction of the wall reads the same on both sides of that move (test_headroom_is_comparable_across_a_changed_ceiling). The line carries the SHA and a TREND fragment (latest against the median of the prior 5), because the atom''s point is the approach, not the arrival. EXIT (3): the alarm is a TREND TRANSITION (R5) — fires once on crossing into tight (headroom < 0.34, i.e. the ceiling is less than ~1.5x the measured runtime, half the 3x margin the re-derivation bought), once on recovery (>= 0.45), and never on an unchanged band; the hysteresis gap is deliberate, since a suite sitting on one threshold would otherwise page every publish cycle and a repeating alarm is an ignored alarm. R12 IS ON THE ATOM''S FACE, as the atom demanded: no test may be deselected, marked slow, or moved to a tier to make this number smaller. The module docstring says it, the reported line says it, and the alarm itself says it in the message it pages with — because the alarm is the exact moment someone is tempted. A tight headroom means raise the ceiling from a fresh measurement or make the machine faster; it never means run less. Mechanised beyond exhortation as far as it goes: headroom() takes duration and ceiling and NOTHING else, so suite size is not an input the measure can even see (test_the_measure_has_no_test_count_input pins the signature). R15 BOTH WAYS, 4 source mutations run and restored, each killing named tests: (a) the atom''s own named mutation — report headroom from the ceiling alone (1 - 600.0/c) — killed test_headroom_reads_the_measured_duration_not_the_ceiling_alone, test_headroom_is_comparable_across_a_changed_ceiling, test_the_wedge_shape_reports_negative_headroom and the end-to-end recording test; (b) fail-open on an unmeasurable input (return 1.0 instead of None) killed 3 parametrised cases of test_unmeasurable_inputs_are_none_never_a_number; (c) a green line on an empty series killed test_a_missing_series_renders_red_not_green; (d) dropping the unchanged-band short-circuit killed test_an_unchanged_tight_status_never_repeats. 29 tests, green after restore. THE NAMED DEFECT REPRODUCES: 612.94s against the 600s wall reads -0.0216 headroom, band tight, and is not clamped at zero — how far past the wall a run went is the diagnostic. NEVER RAISES INTO THE PUBLISH PATH: record_gate_run swallows everything and the gate-side call is guarded again, so an unavailable watch costs one missing point in a series rather than a blocked publish (test_record_gate_run_never_raises). NOT DONE, stated rather than implied: the series starts EMPTY and forward-only — no historical durations exist to backfill and fabricating them would breach the no-fabrication rule, so the first several cycles report RED ("unmeasured"), not green, and the trend fragment stays silent until there is a prior window. The 0.34/0.45 thresholds are reasoned from the one measured incident, not from a distribution; the first real series is what should re-derive them. Nothing here watches the OTHER long-running suites (the sanity daemon, the site lane) — only the publish gate''s, which is the one that had the wall.'
