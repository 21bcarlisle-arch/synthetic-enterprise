led non-payment) plus TWO occupancy_started -- a stranger drawn fresh from population_draw at the VACATED premise after a void gap, and the mover at their NEW premise (in-book or out-of-book) -- both landing on DEEMED terms, so the exit-test pattern falls out of the identity split rather than being asserted. home_move_won is re-founded not deleted: after B7 "did we win the mover" is about the new premise and "did we keep the premise" is about the incoming occupant, two questions one roll currently conflates. Income shock gains MAGNITUDE and DURATION beside IncomeStress (which becomes a derived view so all five consumers keep working), recovery becomes SCHEDULED rather than an annual 50% coin-flip (life_events.py:177-178), and the missing consumption leg feeds the existing self_rationing atom rather than duplicating it. R13: BASELINE = move hazard by tenure, void-gap, p(final bill unpaid), notification-lag INCLUDING the never-told fraction, deemed duration, shock magnitude/duration, formation/dissolution rates, cross-occupant consumption response -- all to be externally sourced at BUILD and DELIBERATELY UNNUMBERED here, because inventing a move rate is exactly the fabrication R13 forbids. CURRICULUM (director-reserved) = the book''s tenure mix (the real difficulty dial: a 60%-private-rent book has several times the move rate), any named scenario dialling move rates or shock severity, and WHETHER THE LAYER IS ACTIVE in a live run -- explicit precedent at life_events.py:346-355, mechanism built, activation director-facing. NEITHER: saas/home_move_win_rate.py:38-41/:47-55 are company-side competitive BELIEFS currently imported into the world''s roll by customer_events.py:89 (admitted cross-seam at :17-22); after B7 the outcome should be world physics and the constant a thing SCORED, logged as seam debt for remediation-on-touch. C-S2 SUBSTREAMS, namespaced stream customer_state (population_draw.py:152 pattern, NOT the bare life_events one) keyed per-premise/per-occupancy not sequentially (the _cohort_substream:390-401 pattern): move_hazard, move_date, move_destination, incoming_occupant, void_gap, final_bill_outcome, notification_lag, deemed_duration, income_shock_onset, income_shock_magnitude, income_shock_duration, composition_change. Binding: never extend _LIFE_EVENT_SUBSTREAMS (different layer); onset and magnitude stay SEPARATE streams or changing the magnitude distribution shifts WHICH customers get a shock (the 01:09Z shape one level down); a test enumerates the registry and asserts adding a name leaves every other stream byte-identical. WALL: the company CAN see a final read (or the estimate when none is taken), an inbound "I''m moving" contact, a cancelled DD, a consumption discontinuity, an unpaid final bill, a new name registering, and SETTLED VOLUME AT A PREMISE WITH NOBODY CONTRACTED (how a real supplier finds a void it was never told about); it CANNOT see the move date until told (sometimes never), the reason, the forwarding address, the incoming occupant''s income/composition/tenure (it re-discovers all of it -- which is what makes a move the prime acquisition moment), whether a 3-month-unread premise is void/vacant/unread, or the income shock (only its shadow in payment behaviour, months later). New typed premise_occupancy_seam on the conversation_seam.py/payment_observable_seam.py pattern with FORBIDDEN_TRUTH_FIELDS including move_date, move_reason, occupancy_id, income_shock_magnitude/duration, household_size, outgoing_occupant_id, void_gap. The company-side hook ALREADY EXISTS AND IS INERT: life_event_detector.py:89-90 declares metering_changed for exactly this and nothing ever sets it True. TRIAD: SIM = the identity split + move transaction + shock depth behind the wall on named substreams; COMPANY = C7 plus the four uninvoked CoT engines finally acquiring a source, inferring the move from observables and ALLOWED to bill the wrong occupant, chase the new occupant for the old one''s debt, miss a void, or waste a retention offer on someone already gone; HARNESS = a tools/couple_b7_c7.py in the couple_* family (in tools/ so the epistemic verifier does not scan it) reporting detection LAG plus never-detected fraction (gap_metric.py:39,333 detection family), MISATTRIBUTION harm via harm_cost:162 with a DERIVED not declared ratio because chasing an innocent incoming occupant is a Consumer Duty harm, and CATCHABILITY HONESTY -- the fraction of scored churn that was genuinely un-catchable, exactly the number is_catchable() was built to produce and today cannot, which corrects a CURRENTLY PUBLISHED company metric. R15 for when BUILD opens, each with its mutation: TAUTOLOGY = put move_date on the seam (FORBIDDEN_TRUTH_FIELDS must fire) PLUS an identical-observations-identical-belief leg because an import-only wall test is fail-open against a value laundered through a caller argument (the hole B8 found at run_phase2b.py:1163-1172); assert two-deemed-entries against the BILLING outcome over correct non-overlapping windows reconciling to settled volume, never by counting the objects the constructor just made; set the harm ratio to 1.0 and the outcome ranking must change or the ratio is decorative. FAIL-OPEN = THE CLASS THAT IS ALREADY LIVE HERE: run with zero moves emitted and any "move-churn is excluded from recall" control must go RED, which forces non-emptiness INTO the assertion -- this one control would have caught finding (3); same for final-bill reconciliation with no rows; reject non-finite/None move dates FIRST not via comparison guards (life_events.py:370-384 is this project''s own worked precedent for why operand order made the original safe only by luck); malformed hazard params fail CLOSED. FAIL-SILENT = the layer inactive while every test is green, which is the OBSERVED status quo of the CoT stack not a hypothetical, so the control must be an INVOCATION check on real run output (moves-per-run > 0 when active) and the mutation is to disable the call site while leaving unit tests intact, proving only the run-level control catches it; a registry import failure must ABORT, never degrade to a shared RNG; one unseeded draw in the move path must turn a full-run replay-determinism test RED. C-S1 is load-bearing here (final read, notification and new registration arriving singly/late/out of order is the NORMAL case for a move, not an edge case); C-S3 the notification and response are separate events, never same-step; C-S5 annual hazards against a half-hourly settlement clock needs an explicit invariance statement or a named R10 simplification at L3+. R12: detection lag and misattribution harm are DIAGNOSTICS -- no threshold tuned to shorten the lag, no move rate adjusted because bad debt came out high. OPEN FOR BUILD, registered not answered: whether the split lands in household.py or a new premise_occupancy.py; whether B7 or W2_12 wires the four engines (W2_12 is blocked_on director_level_up at L0 so B7 must not assume it moves first -- recommendation: B7 emits and provides the seam, W2_12 consumes, registered now so both do not build the same fan-out); whether home_move_won is renamed at the same touch (yes, but separately -- it is a published artefact field with its own consumers); and ALL baseline sourcing. LEVEL HELD AT 0: MATURITY_MAP.md s3 sets L1 at "been BUILT in any form" and this fork wrote no code, so claiming a level for analysis alone would be unearned -- saturation via the FRAME artefact, not a level bump, is what correctly stops the re-draw.'
- '2026-10-05 BUILD slice 1, 0->1 (ledger LEVEL_UP_SELF_CERTIFIED; that row says 10 mutations, it was 8 distinct, two re-run after tests were added). sim/customer_state_layer.py: premise/occupancy split, a move = OccupancyEnded (final-bill exposure via simulation/final_bill_outcome) + two deemed OccupancyStarted; hazard IMPORTED from simulation/arrival_route (EHS 2024-25, a premise-turnover rate); void start None with reason, seasonality uniform, ended/new households not modelled -- all named GAPs. Namespaced customer_state substreams. OPEN: no production caller (FAIL-SILENT until wired); the mover keeps its occupancy_id at the new premise; income-shock depth, composition, the premise_occupancy seam and the run-level moves>0 control are slices 2-3.'
