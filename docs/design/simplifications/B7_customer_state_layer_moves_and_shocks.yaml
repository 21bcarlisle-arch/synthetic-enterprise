- '2026-10-17 KNOWLEDGE for item (d), level HELD at 1, no code (world builds wait for the 2026-10-19 publish). docs/market_research/income_shock_depth_and_duration_b7.md: the HIGH flag joins two experiences, a spell out of work (ONS LFS stock implies a median of 3-6 months) and a scar after return (Beduk 2025: household income -17% in year 1, -35% over 5 years). The recovery coin as written gives a 19-month median spell against its own cited 6. IFS bank data: the replacement rate decides whether the energy bill is paid (-17 to -20% bottom third, -3% top). The spell fix and the scar land together, or arrears are understated (F11).'
- '2026-10-17 KNOWLEDGE for item (e), level HELD at 1, no code (world builds wait for the 2026-10-19 publish). docs/market_research/household_composition_change_b7.md: about one household in six changes membership a year (BHPS), and none does in the world. Headcount is drawn once; new_baby and divorce move only income_stress; nobody dies, so no account ends by bereavement. The sole-occupant death (about 0.6-0.7% of households a year, a derived floor) is a credit exit and goes first, re-occupied as a move-out is. Births wait for leaving home, which waits for an age state: alone they lift the mean headcount by about 0.2 against a flat published 2.4 to 2.36.'
- '2026-10-18 KNOWLEDGE for item (d), level HELD at 1, no code (world builds wait for the 2026-10-19 publish). income_shock_depth_and_duration_b7.md section 6 reads the two GAPs. ONS X02 flows: about half the unemployed stock leaves each quarter, so the median to work is 5-6 months and the median to any exit about 3. The 25% still out after a year is a STOCK share. Per job loss, the share is about 4-15%, a long type of about a tenth with a monthly exit of 0.06-0.08. The flows and the stock do not reconcile under geometric types (the cause is unestablished). Beduk abstract: the household loss of about 17% in year 1 fades to nothing over the long run, so the scar state needs an exit. Corrected beside section 5.'
- '2026-10-19 KNOWLEDGE for item (e) slice 1, level HELD at 1, no code. household_composition_change_b7.md section 5: a sole-occupant death is a credit exit WITH a named payer (the estate), so the move-out''s gone-away leg does not apply and the empty home is billed to the estate, not booked as occupier debt. No bereavement licence condition (SLC 0, 26 PSR, 27 reach it); Tell Us Once skips utilities; a Bacs code-2 DD cancellation is the unprompted signal; collection waits for probate (about 4-12 weeks to grant, 2023-24). GAPs: the insolvent-estate share (carried as None, never the 0.12), the notification lag, the rented-home empty spell. The per-home hazard must come from 65+ mortality, not from the 0.6-0.7% household floor.'
- '2026-10-19 BUILD slice (e)1, level HELD at 1. sim/customer_state_layer.draw_sole_occupant_death: a sole occupant''s death is one credit exit (payer the estate, insolvent_share None with its reason, the move-out''s 0.12 not borrowed) plus one deemed entry (next occupant, start None), on the sole_occupant_death and death_date substreams, reaching only a one-person home with a pensioner present. Hazard DERIVED per year 2016-2025 from ONS deaths tables 10 and 3 weighted by FAH table 6 living-alone ages: 4.5-5.4%, 2020 the peak (household_composition_change_b7.md s6, a floor). Prediction 12-26 deaths on the 426-home live book, 19 drawn: held. 5 mutations, all red after one tautology was fixed (rate graded against the function it calls). The world under-draws sole pensioners (9.2% of homes against FAH''s 14.8%: pensioner drawn independent of size): W2_19''s people joint, not this atom. OPEN: NOT WIRED, fail-silent until the run asks it, which needs the estate final bill and the empty home billed to the estate (s5 choices 1(b)-(c)) behind an activation switch.'
map_notes:
  name: 'The customer state layer: house moves (a credit exit plus two deemed entries), income shocks and household composition change as first-class state transitions on named RNG substreams, driving switching, arrears and consumption -- the half of customer state that the existing life-event stream (job loss/illness/divorce/retirement/new child) does not emit. BACKLOG.md B7 (Wave D).'
