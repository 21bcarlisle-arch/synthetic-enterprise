the trigger ... Built. Emits the events; W2_5 dependency" -- but that module is COMPANY-side (company/crm/life_events.py:18-19), is not W2_5 (simulation/life_events.py, which has no move type), and does not emit (LifeEventLog.record:71-77 is a passive append nothing generates into). maturity_map.yaml:569 depends_on [W2_5_life_event_stream] is therefore satisfied by a module that cannot supply the trigger, and naming a company-side log as the world-side source is a wall inversion. (5) FIVE BUILT CoT ENGINES, ZERO LIVE INVOCATIONS: change_of_tenancy_register.py, occupancy_register.py (:40,48), company/billing/cot.py (:51,69), deemed_contract.py, account_closure.py all have green tests and no non-test caller -- the only non-test hits are a reason STRING (credit_refund.py:12) and a comment (run_phase4c_on_phase2b.py:313). The pipe is built end-to-end downstream of a source that does not exist (FAIL-SILENT in pure form). (6) THE STRUCTURAL PREREQUISITE IS MISSING: simulation/household.py:87-120 keys Household on customer_id with NO mpan/premise_id/supply_point anywhere in the world layer, while company/crm/occupancy_register.py:21,40 is keyed on MPAN -- the company side already assumes a premise key that persists across occupants and the world cannot supply one. A move is by definition the event where premise identity persists and occupant identity does not, so it cannot be expressed until that split exists. (7) NO COMPOSITION STATE: household.py:88-120 has bedrooms but no occupants/household_size; population_draw.py:704-732 draws accommodation/cars/nssec/heating_fuel plus region(:614)/tenure(:459) and no composition axis; W2_13 (map:571-589, L0, blocked_on director_level_up) owns composition->consumption, so B7 owns composition as a TRANSITIONING state and W2_13 reads it -- ownership split registered so neither invents a schema. (8) INCOME SHOCK is 3-valued (household.py:70-73), magnitude-free, duration-free and single-cause (life_events.py:196-203 states illness shares