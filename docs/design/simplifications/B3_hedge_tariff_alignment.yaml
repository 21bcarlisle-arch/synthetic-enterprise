atom_id: B3_hedge_tariff_alignment
simplifications:
- '2026-07-10 DISCOVER finding, verified not assumed: MARGIN_REALISM Step 4''s goal is substantially already built. Fixed/pass-through tariffs: decide_hedge_fraction() decided once per term (volatility as-of term start), held constant until the next renewal -- confirmed via real 2020 data (start_hf == avg_hf exactly for the large majority of customers). Deemed (out-of-contract/SVT-adjacent) tariffs: spot+premium, explicitly NO forward hedge -- correctly matches SVT tracking the cap''s own wholesale-observation window. Flex tariffs: weekly re-hedge at rolling reference price -- matches a short-reset tariff''s own commitment horizon. One honest exception NOT glossed over: a few I&C customers show hf changing within a calendar year, plausibly multiple genuine contract renewals (I&C terms are often 3-6 months in reality) rather than a mid-term re-decision bug -- NOT independently re-verified against the raw per-term log (not retained in the report-extracted shape), flagged as resting on a plausible inference, not a full re-derivation.'
- '2026-07-11 HARDEN-sweep gap CLOSED (commit 8dc14ca1): hedge_fraction was always on every settlement record but never reached a business surface (harden_sweep:live_site:B3_hedge_tariff_alignment). Added consumption-weighted avg_hedge_fraction to per_customer_lifetime (saas/reporting/annual_report.py) and threaded it into each per-customer site JSON (tools/generate_customer_data.py) plus a new visible ''Avg. Hedge Coverage'' row on the customer portal account card (site/customers/index.html, right after Cost to Serve). 5 new tests (weighted-average math, None-when-zero-consumption, full JSON thread), browser-verified the row renders correctly (Playwright, injected test value, reverted after). Live data awaits the next natural sim run -- the field wasn''t in run_output_latest.json generated before this fix landed.'
