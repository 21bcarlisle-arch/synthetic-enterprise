simplifications:
- '2026-07-13 BUILT to L2 (BUILD_THE_BACKLOG P0, fork, saas/sme_credit_risk.py). Company assesses SME distress from OBSERVABLES only (payment pattern+timing, sector, tenure, consumption) -- never the answer key; epistemic PASS. Disentangles the CULTURE-vs-DISTRESS confound via temporal handles (persistence=>culture, deterioration-off-clean-baseline=>distress) + own sector list + consumption collapse=>insolvency; designed to be fooled by always-late-then-distressed. Closes W2_6: classification gap 0.475, attribution gap 0.993 (naive distress-share 0.221 vs true 0.440 -- badly under-attributes late-pay to distress), fn_ability 0.544 (misses ~54pct of genuine distress as habitual late-payers). REAL, not tuned (R15 independence verified). 14 tests + mutation. || 2026-07-13 REGISTERED as a COUPLED-TRIAD company-side twin (COUPLED_TRIAD_DESIGN.md, director P1 THE_COUPLED_TRIAD.md, provenance proposal). W2_6 SME/I&C distress twin (sector shocks, insolvency, late-payment culture). SIM holds the hidden distress state; the company must assess credit risk from observables (payment pattern, sector, late-payment behaviour). GAP = classification/attribution gap (misclassified distress + attribution of late payment to culture-vs-distress). Per the two binding rules (CLAUDE.md/A6): this company atom is not complete until it has faced the defeating world (W2_6_sme_distress_twin) with a non-degenerate gap measured; and W2_6_sme_distress_twin''s L3 blocks until this twin + gap exist. loop_stage idle: DISCOVER/FRAME workable now (the company-side capability design), BUILD ranks per dial. The gap metric + harm-cost weights (CURRICULUM, director-signed) are defined in A6_coupled_triad_gap_metric.'
