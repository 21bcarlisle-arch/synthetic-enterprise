atom_id: W2_15_segment_case_sensitivity_siblings
map_notes:
  notes: 'Queued per SELF-INTERRUPT DISCIPLINE from the W2_sme_segment_case_normalisation build (2026-08-08), NOT fixed on sight -- out of that atom''s file_scope and needs its own analysis. LATENT, not live: every current caller passes a canonical spelling, so nothing is mis-billed today. Three findings. (1) simulation/sme_distress.py:112 BUSINESS_SEGMENTS = ("SME","I&C") is compared case-SENSITIVELY at :212, and :351 RAISES on a non-match -- so a lower-case "sme" would crash the twin rather than mis-route it. tools/segment_case_guard.py CANNOT catch this shape: the literals are canonical, so there is nothing non-canonical to flag; the defect is in the comparison, which needs dataflow the AST scan does not do. Say so rather than let the guard''s green read as coverage it does not have. (2) simulation/segment_debt_obligation.py keeps its own case-insensitive label sets (_norm lower-cases first, so it is correct by construction and deliberately exempt) and EMITS ''resi''/''sme''/''iandc'' as the company''s OBSERVED vocabulary. (3) ''iandc'' is not an alias in segment_vocabulary._ALIASES, so normalise_segment raises on it -- fine while the two vocabularies stay apart, a silent trap the moment anyone pipes one into the other. The DISCOVER question is whether these are one vocabulary or three, and the honest answer may be three (world-true / company-observed / cohort) that must never be coerced -- in which case the work is a named seam, not a merge. ANSWERED 2026-08-09, L0->L2 (docs/design/W2_15_SEGMENT_VOCABULARIES_DISCOVER.md): ONE DRIFT AND TWO SEAMS. (1) sme_distress WAS drift -- a private copy of a vocabulary that already had an owner; sourced from the canon, predicate routed through normalise_segment, lower-case spellings no longer raise. (2)+(3) V2 (company-observed book label) and V3 (cohort id) are genuine seams: coercing V2 onto V1 makes the company''s belief equal the truth BY CONSTRUCTION and silently zeroes the W2_9/C11 gap. The atom''s premise that (3) is a trap UNDERSTATED it -- the block was PARTIAL, not silent: ''resi'' and ''sme'' are also valid V1 aliases and coerced silently while only ''iandc'' raised, so a V2->V1 pipe runs green on any resi/SME population and fails on the first I&C customer. Closed at the TYPE (CompanyBookLabel), which is the only thing that distinguishes them, since the strings are legitimately shared. FOURTH FINDING, not in the notes above: the guard was FAIL-OPEN on ast.AnnAssign -- a type annotation switched the constant channel off, which is why it had never looked at BUSINESS_SEGMENTS and reported clean for 83 files. Fixed, plus a duplicated-canonical-vocabulary check as the reachable proxy for the comparison defect the AST genuinely cannot see (limits stated in the guard docstring and the DISCOVER doc, not left to be inferred from a green run). 4 R15 mutations run, all fire. NOT L3: no coupled-triad measurement against an adversarially-spelled feed, no Expert Hour, saas//company/ unscanned.'
  name: 'The segment-case class has a second shape the guard cannot see statically: a CANONICAL literal compared case-sensitively (sme_distress raises on a lower-case ''sme''), plus three rival segment vocabularies nobody reconciles'
