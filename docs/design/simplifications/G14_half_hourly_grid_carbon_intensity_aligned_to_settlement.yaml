atom_id: G14_half_hourly_grid_carbon_intensity_aligned_to_settlement
map_notes:
  gain: 'AUTHORISED 2026-09-06 by DIRECTOR_RULING_SUPPLIER_USE_CASE_REGISTER_AND_SIM_FIDELITY section 3.2 -- one of two small discovery pulls, ''reversible, cheap, wall-clean''. Reaffirmed the same day in the sequencing ruling: ''The two authorised discovery pulls stand: grid carbon intensity and a forward-curve series. Both are INPUTS, not use cases.'' RANKED BELOW STAGE 1 DELIBERATELY: it is authorised, and its consumer (use case 4.6, the carbon product) is stage 3, so it must not displace the world-fidelity work. It is also the mission''s second currency -- CLAUDE.md records carbon as designed and unwired -- so the asset has standing beyond any one use case. THE FAILURE MODE THE RULING NAMES IS ALIGNMENT: carbon intensity pulled at a resolution that does not align with the settlement periods is worse than none, because a half-hourly claim resting on hourly data is a figure nobody can check. Align it or state the mismatch on the asset. Register with provenance as a data asset; no product build.'
  level_note: 'L3 recorded 2026-11-14 under canon G16 (ruled 12 Oct): a level-3 pass whose only open question is reviewer independence passes, with the limit recorded here. THE LIMIT: the 2026-10-05 Expert Hour re-take that passed was a same-model cold-eyes pass (restricted context, not an independent reviewer). Restricted context is what G16 counts as independence; an external review is the director''s to choose. G14 sat at 2 for a month after the ruling because its apply step named H45 only.'
