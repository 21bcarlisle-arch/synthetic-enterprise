atom_id: OPS1_tmux_target_qualification
simplifications:
- 'REGISTERED CLEANUP (2026-07-17, director-required at the worker-seat gate: ''Record the gotcha as a registered cleanup item... Scheduled, not drifting''). During the worker-seat migration a bare `tmux ... -t claude` run from inside the `work` console resolved to the console''s WINDOW named ''claude'' (window-name match) instead of the SESSION named ''claude'' (the worker seat) — so capture-pane showed the director''s own screen, a false ''latch'' alarm (halted, pulled PID/window/JSONL evidence, distinguished tooling-ambiguity from a real latch — the correct halt-verify-distinguish pattern). worker_seat.py itself is SAFE (it uses `has-session`, which is session-scoped). FIX: any pane-scoped tmux tooling must FULLY QUALIFY its target (session form `claude:` or the window id `@N`, never bare `-t claude`) so the window/session name collision cannot mis-target. Audit background/*.py + scripts for bare `-t claude` pane/capture calls; qualify them. Low-risk, scheduled — not a live hazard (has-session is safe).'
- 'BUILT + MECHANISM (2026-07-17, maiden autonomous turn, LANE 1 BUILD): audited all background/*.py tmux calls. Session-scoped commands (has-session/kill-session/new-session) are safe bare; the PANE-scoped ones were qualified with the session form `X:` (trailing colon forces session resolution, so a window named `claude` can never mis-target): session_watchdog.py (list-panes + capture-pane), tmux_relay.py (capture-pane + display-message), autonomous_runner.py (retired, qualified for hygiene). worker_seat.py confirmed already safe (has-session only). MECHANISM (MAKE_IT_STICK/R15): tests/background/test_tmux_target_qualification.py greps background/*.py and FAILS on any bare pane-scoped `-t` target, with a mutation test proving the guard fires on a bare capture-pane and stays quiet on a bare has-session. 112 watchdog/tmux tests pass; guard green; live scan clean. Deploys on next systemd restart of session_watchdog (R2). level 0->3.'
map_notes:
  name: Fully-qualify pane-scoped tmux targets (bare -t claude is window/session ambiguous)
