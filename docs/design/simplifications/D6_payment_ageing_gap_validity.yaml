atom_id: D6_payment_ageing_gap_validity
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-08. The DISCOVER answered the question; this level records the CLASS closure it implied (R10 -- an absurdity-class defect may not be closed at the instance where it was found). The prevalence defect belongs to background.gap_metric.misapplication_gap ITSELF, so it lands on every call site. Delivered: (1) the caveat is STAMPED AT SOURCE into components (normalisation / minority_class_share / prevalence_caveat) -- components, unlike `note`, survive a caller override, which matters because BOTH live callers replace note; (2) it travels through to_ledger_entry -> coupled_gap_ledger.json -> site/data/proof.json and RENDERS as visible text on the Proof panel (verified by executing the page''s own JS against live data, R11); (3) the SECOND call site was audited by measurement, not argument -- holding C11''s misrecording channel fixed and moving only the world business share 2%->40% moves the company error rate 0.0210->0.0365 while the published gap moves 1.0000->0.0905, so at a 2% share the pair would read no-better-than-blind on its LOWEST error rate; its published note now carries that measurement; (4) tests/test_gap_metric_misapplication_class.py registers every live call site so a NEW one FAILS rather than silently publishing an uncaveated figure. R15: mutation-proven three ways -- remove the stamp (tests 1+2 fail), make the metric prevalence-invariant (test 4 fails, the documented reshape signal), add an unregistered caller (test 3 fails); each restores green. Vacuity guards on the AST scan and the ledger sweep. R12 CLEAN: the W2_9 figure re-measured to the identical 0.2290836653386454 -- the class closure relabelled a number, it did not move one. Also fixed: the published disclaimer named the id ''D6a'', which does not exist; it now names D7_ageing_gap_metric_reshape (the live W2_11 ledger note carries the old string until the next sim run rewrites it from the fixed code). Minted rather than fixed on sight: D9_worse_than_blind_chip_is_metric_blind (the panel renders any gap>1 as red ''worse_than_blind'' -- valid for detection_gap, refuted for misapplication_gap; latent today since W2_9 reads 0.2291). L3 NOT claimed: no HARDEN/Expert-Hour pass, and D7 will replace the characterized behaviour.'
  discover_note: 'DISCOVER CLOSED 2026-08-08, verdict BOTH (docs/design/D6_PAYMENT_AGEING_GAP_VALIDITY_DISCOVER.md). (1) The 1.1538 is a METRIC-SHAPE DEFECT and is not evidence -- oracle-proven three ways against the unchanged criterion: a company finding 100% of real arrears with a 1.5% false-positive rate scores 1.50; holding company behaviour LITERALLY fixed and moving only arrears prevalence swings the score 3.00->0.15 (twentyfold); off-by-one-bucket and stone-blind both score exactly 1.0000. Framing correction: it norms against MAJORITY-CLASS, not flag-nobody -- that text is detection_gap''s, reused by eye. (2) A GENUINE failure mode does sit underneath, demonstrable WITHOUT the broken metric: unreferenced non-DD credits (correlation_id stripped to None at the seam) are appropriated oldest-first, so the account BALANCE is exactly right (open_sum == balance_gbp on 60/60 probed accounts) while the ageing DATES are materially wrong -- Clayton''s Case, and 0 of 19 misses land on DD. R12 respected: no number was tuned. Level stays 0 -- DISCOVER answers the question, D7_ageing_gap_metric_reshape/D8_ambiguous_remittance_misdating build the answer. Falsifier committed: tests/tools/test_d6_ageing_metric_shape.py, mutation-proven to fire (4/5 fail under a prevalence-safe reshape).'
  origin_note: 'Surfaced 2026-08-08 during the H27 L0->L2 self-certification and QUEUED rather than fixed on sight (SELF_INTERRUPT_DISCIPLINE). R12 WALL: this atom resolves whether the number MEANS anything; it may never tune the gap toward a nicer value. If the answer is ''genuine failure mode'', the gap stays at 1.15 and that is the finding. Id D6 chosen as the first free D number -- deliberately not another bare ''D_'' id, per the collision classes measured in WORKER_MINTED_THREE_RULINGS_WORK_BLOCK_DEFECT_2026-08-08.md.'
  name: 'Is the payment AGEING gap real or a metric artefact? The live coupled-triad measurement reports an ageing gap of 1.1538 -- ABOVE 1.0, meaning the company''s debt-ageing belief scores worse than the flag-nobody baseline the metric norms against. Decide which of two things that is: a genuine company failure mode (oldest-first Clayton''s-Case allocation actively misdating debt, which a real supplier would recognise) or a metric-shape defect (detection-style normalisation misapplied to a bucket-distance dimension). Until resolved, the ageing dimension is not evidence of anything and must not be cited as fidelity.'
