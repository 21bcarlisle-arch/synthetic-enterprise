atom_id: H41_the_map_ratchet_has_no_ongoing_drain
map_notes:
  name: 'MINTED FROM docs/staging/WORKER_FINDING_THE_MAP_RATCHET_REPAIR_DID_NOT_HOLD_2026-08-10.md, which carries the measured field-byte table and must not be re-derived. H32 drained the note class 464,110 -> 393,692; the map regrew to 423,947 in ONE DAY of ordinary minting, and the same red is now a PUBLISH WEDGE rather than the backlog item the first finding called it (the publish gate runs tests/design/; the pre-commit gate does not). THE FINDING: a ratchet with no ongoing drain is a one-time cleanup, not a control. EXIT: (1) a drain that runs at MINT RATE, not another one-off migration -- state which of the three candidates it implements and why; (2) if the expert_hour default is omitted, the Proof door figure expert_hour_not_attempted (tools/generate_proof_data.py:359, Counter over .get(status)) is asserted UNCHANGED against the live rendered surface, because an omitted key currently counts as None and silently moves a published number (R11); (3) the ceiling is re-derived only AFTER a drain lands, from what a 258-atom map costs -- raising it while wedged is the make-the-number-green move R12 forbids; (4) R15: a mutation that satisfies the ceiling by TRIMMING a build note must kill a named test, since paying a size warning with the record is the one closure H32 already ruled out; (5) the record may NOT be shortened to close this -- H32''s own atom text binds here. R3 IS ARMED: this control has now been repaired once and recurred; a third occurrence means eliminating the fixed-byte ceiling in favour of a per-atom budget the mint path enforces, not patching it again.'
  gain: The spine ratchet stops being a control that goes red every fortnight and gets paid with the record.
  level_hold_note: 'LANDED: `over_inline_prose_budget` in `tools/simplifications_store.py`

    LANDED: `migrate` in `tools/migrate_gain_to_store.py`

    LANDED: `check_inline_prose_budget` in `tests/design/test_simplifications_store.py`

    LANDED: `note_write_refusal` in `tools/simplifications_store.py`


    HELD AT 0 ON 2026-09-06 WITH THE WORK DONE, and the hold is the honest half of the result. WHAT LANDED, both halves, because the finding this atom came from calls a stock move on its own ''a reprieve, not a fix''. STOCK: tools/migrate_gain_to_store.py moved 137 atoms'' `gain` out of BOTH map halves into this store, under three proofs -- span re-parse, read-back through simplifications_store.notes_for_atom (an independent path), and a remainder proof that every other field of every atom is byte-identical. Map 408,183 -> 364,984 B; headroom on the 409,600 B ratchet 1,417 -> 44,616 B, measured before and after. FLOW: `gain` is now in NOTE_FIELDS, so check_no_inline_notes refuses an inline one from here on, and INLINE_PROSE_BUDGET (2,048 chars) caps ANY single inline field whatever it is called -- because fixing `gain` alone would be the same instance-fix that let `gain` in after `name`. `size_basis` is exempt and the exemption names its reader (tools/effort_calibration.py); the discriminator is has-a-reader, not is-big. WHY THE LEVEL DID NOT MOVE. record_level_up_self_certified refused it: OPS11, lane H_harness carries 13 live BLOCKING findings, so a level certified here would be certified by an instrument the lane''s own findings say may be wrong. record_limitation_accepted would have moved the number today and is exactly the laundering the rule exists to stop, so it was not used. WHAT THE RUN ALSO FOUND, and it is a finding about the note ratchet rather than about this atom: one atom (OPS2_publish_gate_head_worktree, 60,906 B of notes, of which a single 56,846 B build_note) is over NOTE_TENANT_MAX_BYTES, so the store REFUSES to accept its 104-byte gain. Refusing the move as well would leave the prose nowhere, so the map keeps it and the inline guard permits exactly the atoms the store refuses -- an exception that is COMPUTED (store.note_write_refusal) and clears itself when that tenant is compacted, rather than a name on a list. A first draft of this relaxed the note ratchet for any ''move off the spine'' instead; that was withdrawn, because it weakened a second control to land the first and the declared-debt ratchet caught it. CONTROLS: tests/design/test_simplifications_store.py 46 pass, tests/design/test_atom_notes_store.py 24 pass. The new ones carry their own defect: the prose budget fires on an invented `rationale` (the class, not the instance) and not on a long LIST or on the exempt reader field; the inline exception is proved BOTH LEGS over one partition -- same atom id, same field, violation when the store would accept and permitted when it refuses -- so what decides is the store''s answer and not anything about the atom.'
