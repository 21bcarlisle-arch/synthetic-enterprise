atom_id: D44_the_basis_line_declares_its_relation
map_notes:
  gain: '`gap = raw_gap / g0` was the module''s stated relation with exactly one exempt family enumerated. Measured on the 14 published pairs the door serves: eleven satisfy it and THREE do not, all three the same unenumerated family -- and the door rendered `baseline g0 <g0> - raw <raw>` for all fourteen with nothing to say which relation held, so one pair published `raw 0.000` beside a live headline (reading as ''the company''s own error is nil'') on the dimension whose real cost is dunning a customer who paid. `GapResult.normalisation` (divisor / reference / none) has NO usable default, is DECLARED never derived (a kind inferred from whether the arithmetic holds classifies every entry correctly by construction and could never fire on the case it exists for), and is falsifiable at construction per kind; `audit_ledger_normalisation` grades the LEDGER ON DISK rather than the code that writes it, because an entry nothing re-measures is still being served. (Hour #28.)'
