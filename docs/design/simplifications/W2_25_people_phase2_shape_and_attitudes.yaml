atom_id: W2_25_people_phase2_shape_and_attitudes
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05, docs/staging/DIRECTOR_RULING_PEOPLE_MONEY_AND_WHO_THEY_ARE_PHASE1_2026-09-05.md section 2 item 1, AS RE-SCOPED THE SAME DAY by DIRECTOR_RULING_AMENDMENT_MERIT_ORDER_PEOPLE_PHASES_AND_PRACTICE_BOOKS, which governs where the two conflict.


    THE AMENDED SCOPE IS THE ONE REGISTERED HERE, verbatim from the amendment: ''Phase 2 -- shape and attitudes. Price elasticity and the stability-versus-time-of-use preference; contact propensity and channel; presence residuals (working hours, holidays, shift patterns, working from home) and the shape they make; CONSENT TO CONTROL -- the attitudes that grant or withhold permission over an EV or a battery, which is where geography''s asset potential becomes value or does not; green stance and trust.''


    WHAT THE AMENDMENT MOVED OUT, and this row must not silently re-claim: collections responses, vulnerability and disclosure, moves and change of tenancy, engagement archetype and expected length of stay all went FORWARD into phase 1 (W2_19). Presence residuals came BACK from phase 3. A stale copy of the original phase-2 scope is exactly the failure this registration exists to prevent -- the original ruling''s phase 2 and the amendment''s phase 2 are DIFFERENT SETS, and only the amendment''s is live.


    CONSENT TO CONTROL IS THE NEW TERM and the one with product consequences: a battery or an EV the household will not let the company touch has a technical ceiling (W2_18) and no realisable value, so the housing axis''s asset potential is bounded by an attitude that lives on this axis. That coupling is why couples_with names the housing observation phase.


    FRAME PASS 2026-09-06 (docs/design/W2_25_PEOPLE_PHASE2_FRAME.md) -- a census of all six elements, and five findings.


    (1) THE CENSUS. Of the six, price elasticity is DRAWN AND WIRED (population_draw.price_elasticity_for_customer, read at customer_events.py:543); contact propensity is DRAWN AND WIRED (simulation/contact_propensity.py, built in August precisely so the world''s contact rate stopped being the company''s own estimate, keyed on the engagement archetype the amendment moved into phase 1 -- so nothing to build); green stance and contact channel are DRAWN AND WIRED TO NOTHING; trust exists ONCE ALREADY under another roof; consent to control, the stability-versus-time-of-use preference and presence residuals have NO ROUTE. Measured, not read -- every simulation/ file mentioning each axis: green_stance and channel_pref appear in population_draw.py and population_coverage.py and nowhere else; price_sensitivity appears in six modules including the response function; `consent` appears in none.


    (2) AND THE CANON PAGE PUBLISHES THE WIRED-TO-NOTHING PART AS A PROBED CLAIM. canon_claims.yaml carries C1_green_stance_carries_no_channel and C1_channel_pref_carries_no_channel against THE_MODEL_ON_A_PAGE.md, both `expects: absent`, probing all of simulation/ except the draw and the coverage test. So the FIRST COMMIT THAT WIRES EITHER TRAIT TURNS canon_drift_check RED, and that gate runs on every lane''s commit. The claim and the probe must be retired in the SAME commit that wires the trait. This is invisible from inside the row -- blocked_on, scope and depends_on say nothing about a published claim that contradicts the deliverable -- which is why it is recorded here.


    (3) CONTACT CHANNEL HAS TWO MECHANISMS AND THE HOUSEHOLD''S OWN PREFERENCE IS NEITHER. contact_centre.py:88-94 rolls the channel from a fixed population mix whose anchors the module itself marks provisional; Cohort.channel_pref is the household''s drawn truth and is read by nothing; and tools/couple_cohort.py:162 synthesises the company''s observed channels FROM the truth inside the harness. The scoring path and the world path are disconnected. So "contact propensity and channel" is two jobs, and the channel half is a CONVERGENCE onto one channel decision that reads the household''s preference, not a new draw.


    (4) TRUST ALREADY EXISTS, ONCE, AND MUST NOT BE MINTED TWICE. conversation_response.py:245 `_trust` is a hidden per-customer scalar in [0,1) that really does move behaviour (:311 scales the adverse-reaction share by 0.6 + 0.8*(1-trust)). It is uniform with no published anchor, scoped to the conversation model alone, not a Cohort axis, so not coverage-tested and not crossed with anything. Recommendation, needing no ruling: phase 2 EXTENDS that scalar onto the Cohort and anchors it. A second trust would be the next VAT rule / vulnerability scorer / `willingness` -- one concept, several homes -- and it would be born that way.


    (5) THE ELASTICITY ELEMENT''S REAL PRECONDITION IS A DIRECTOR VALUE, NOT A PHASE ARRIVING. The spread is mean-preserving over a segment LEVEL read from the curriculum, and that level is the household-level switching amplitude the phase-1 ruling reserves as an R13 slot to be presented and ratified, never filled. Phase 1 landing with the slot UNRATIFIED opens phase 2 onto a spread whose level nobody has set. Recommendation to the director, treated as adopted unless he objects: the opening condition reads "phase 1 lands AND the switching-amplitude slot is ratified". block_reason NOT edited here -- rewriting the condition before he has read the argument is the wrong order. Related standing hazard: market_switching_propensity holds the MARKET level and shape and records that the world ran 3.15x below the published GB switching record because the level was cancelled and only the shape survived; a per-household amplitude that re-levels the book reintroduces that defect from the other end, which is why the existing spread is mean-preserving and must stay so.


    CONSENT TO CONTROL, on the row''s own headline term: no anchor was established this pass and no number is offered. Two things make it more tractable than it looks -- the population already exists (EVs and batteries arrive on anchored unprompted curves in life_events), and it is a CEILING term rather than a behaviour term, so it multiplies W2_18''s technical ceiling without needing its own response function. It is therefore the cheapest of the six to make consequential and the most likely to move a business answer. And `consent` is one word over two quantities: consent to CONTACT exists company-side (customer_comm_preferences, privacy_register) and is not this.'
