atom_id: W2_25_people_phase2_shape_and_attitudes
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05, docs/staging/DIRECTOR_RULING_PEOPLE_MONEY_AND_WHO_THEY_ARE_PHASE1_2026-09-05.md section 2 item 1, AS RE-SCOPED THE SAME DAY by DIRECTOR_RULING_AMENDMENT_MERIT_ORDER_PEOPLE_PHASES_AND_PRACTICE_BOOKS, which governs where the two conflict.


    THE AMENDED SCOPE IS THE ONE REGISTERED HERE, verbatim from the amendment: ''Phase 2 -- shape and attitudes. Price elasticity and the stability-versus-time-of-use preference; contact propensity and channel; presence residuals (working hours, holidays, shift patterns, working from home) and the shape they make; CONSENT TO CONTROL -- the attitudes that grant or withhold permission over an EV or a battery, which is where geography''s asset potential becomes value or does not; green stance and trust.''


    WHAT THE AMENDMENT MOVED OUT, and this row must not silently re-claim: collections responses, vulnerability and disclosure, moves and change of tenancy, engagement archetype and expected length of stay all went FORWARD into phase 1 (W2_19). Presence residuals came BACK from phase 3. A stale copy of the original phase-2 scope is exactly the failure this registration exists to prevent -- the original ruling''s phase 2 and the amendment''s phase 2 are DIFFERENT SETS, and only the amendment''s is live.


    CONSENT TO CONTROL IS THE NEW TERM and the one with product consequences: a battery or an EV the household will not let the company touch has a technical ceiling (W2_18) and no realisable value, so the housing axis''s asset potential is bounded by an attitude that lives on this axis. That coupling is why couples_with names the housing observation phase.'
