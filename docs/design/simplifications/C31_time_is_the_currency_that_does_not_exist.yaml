atom_id: C31_time_is_the_currency_that_does_not_exist
simplifications:
- '2026-10-04 DISCOVER/FRAME ONLY pass 1, level stays 0, loop_stage stays idle (worker tick, LANE 3 idle draw). Deliverable docs/design/C31_TIME_AS_A_CURRENCY_DISCOVER_FRAME_2026-10-04.md: time defined as household minutes split into four classes (T1 shopping, T2 servicing, T3 recovery, T4 routine admin); published record read from source -- Ofgem CES 2017 46% hassle / 41% worry / 27% too long (perception, not minutes), CMA EMI 2016, Citizens Advice call wait 224s/340s/391s 2021-22 (the only supplier-attributable minute series), Ofgem GSOP 2018 GBP30/15 per failure event ''to reflect consumer inconvenience'' (a transfer, priced per event not per hour). Code census: no time symbol; simulation/resentment_ledger.py declares CALL_WAIT_LONG and never emits it -- the world has no contact queue. FRAME: L1 world-side minutes ledger counting events with every minute cost a declared None; L2 calibrated contact queue (T2); L3 minutes as A47''s third column. Recommendation on Q1 (director''s): minutes in their own unit, never converted to GBP.'
- '2026-10-04 DISCOVER pass 2, level stays 0 (L1 = built), loop_stage stays idle. Q3 answered: no published minutes-per-event for T1/T3/T4 in the sources searched. T2 now has the full CA star-rating call-wait CSV, per supplier per quarter, Q4 2017-Q2 2024 (median 82-388 s, peak Q1 2022), and that series is L2''s calibration band. T3 is published as 6 contacts per domestic complaint and 38% over 28 days (Ofgem 2014, pre-window), which gives contacts and days, not minutes. CSS go-live was 18 Jul 2022. Doc §7.'
- '2026-10-04 DISCOVER pass 3, level stays 0, loop_stage stays idle. The knowledge map''s open question is answered: national time use does not isolate energy admin. UKTUS 2014-15 codes 3620/3710/3727 pool energy with every bill and banking; the published figure is 35 min/day for shopping+services+household management (CTUR/gov.scot 2019); ONS OTUS folds bills into unpaid household work. Microdata cannot separate energy either, and licence registration is reserved. DISCOVER is exhausted: T1/T3/T4 minute costs stay None permanently. The next motion is Q1 (director) plus the epoch opening. Doc §8.'
map_notes:
  gain: 'Director, 2026-08-28, mission: ''There are three currencies, not one -- money, time and carbon -- and we have only ever optimised money; time has never appeared in this project at all.'' Verified the same day, observed-with-evidence: no time-, hours-, effort- or hassle-as-value symbol exists anywhere in company/, simulation/, saas/ or tools/, and no design document names time as a currency. Of the six cells in the mission''s two-sides-by-three-currencies table, time is the only one that is ABSENT rather than merely uninstrumented -- carbon is designed and unwired (E5), household money is unmeasured but computable from figures the run already has. Time needs a household model of effort before it can be saved: what a switch, a query, a bill dispute or a meter read COSTS a household in attention. That model does not exist on either side of the wall.'
