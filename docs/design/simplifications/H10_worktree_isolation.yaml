simplifications:
- '2026-07-13 REGISTERED (WORKTREE_ISOLATION_AND_SEAMS.md Half 1, director-decided QUEUE, HIGH rank -- the last known cap on BUILD width). Our exact failure is the documented headline problem: multiple agents in ONE working tree overwrite edits / read half-modified files / corrupt the git index. The answer already exists and is native: git worktrees (one checked-out dir + branch per agent, shared .git object store) via Claude Code''s `isolation: worktree` subagent directive (our build agents in .claude/agents/ are already subagents) -- VERIFY the directive against current official docs before adopting. SUPERSEDES H9''s interim ''orchestrator is sole map writer'' convention with structure: (1) concurrent BUILD atoms each in an isolated worktree/branch, no shared tree; (2) maturity_map.yaml becomes READ-DURING-BUILD -- per-atom status/evidence to its own file (or append-only journal), map generated/merged from those, map stays single source of truth for the draw, no lost update (this is H9''s build, done here as one mechanism); (3) merge model = orchestrated sequential merge, one integrator merges branches in defined order after each passes checks (simple model right below ~4-5 concurrent agents = us); (4) scoped suite per worktree, full 17k suite ONCE at integration; (5) per-worktree env is real plumbing (env files, ports, deps, daemon stack do NOT carry over) -- handle explicitly; (6) pre-flight merge-base conflict detection before merge. DoD: two disjoint atoms building simultaneously in separate worktrees, both status updates landing, no lost writes, merged cleanly. Fold recurring re-check into HARNESS_BEST_PRACTICE_ADOPTION (field moving monthly). loop_stage idle: DISCOVER/FRAME (verify the directive, design the status-file/merge model) workable now; BUILD is a harness change to rank.'
- '2026-07-13 FRAME DESIGN LANDED (Lane-3 discovery fork, doc-only, docs/design/WORKTREE_AND_MAP_CONTENTION_DESIGN.md -- one design covering H10 Half-A worktree isolation + H9 Half-B map read-during-build). Two load-bearing findings from direct repo read: (1) NONE of the six .claude/agents/*.md frontmatters use any isolation directive today (only name/description/tools/model) -- so `isolation: worktree` is UNPROVEN in-repo and MUST be verified against current official Claude Code subagent docs before wiring (the single biggest build-time risk; no network here to confirm the exact frontmatter key/value, branch-naming, worktree path). (2) The two build agents (saas-engineer, sim-engineer, both model:opus) are the only ones needing isolation; the four read-only agents do not. Design specifies: orchestrated sequential merge (first-green-first, pre-flight merge-base changed-file intersection to catch a mis-declared file_scope and re-sequence rather than merge blind); scoped suite per worktree by file_scope root (sim/simulation->tests/sim+tests/simulation, saas->tests/saas, company->tests/company, etc.), full ~17k suite ONCE at integration; per-worktree env plumbing enumerated concretely (secrets carry over via ~/.config out-of-tree + conftest setdefault + SIM_FAST_MODE autouse => scoped tests need no Ollama; .venv must be shared by absolute path, NOT recreated; the singleton daemon stack + ports :8801/:11434/file-api MUST NOT be relaunched by a fork; data/lake symlink if scoped tests read it). Ordered 8-step BUILD task list in the doc. loop_stage stays idle (BUILD-gated); ranks HIGH -- twin-approvable within the open epoch.'
- '2026-07-13 BUILT L0->L2, worktree half PROVISIONAL (same fork/commit bc32e130). L2 = the H9 map-de-contention mechanism (built+proof-tested, the real structural win). KEY FINDING: isolation=worktree is a CONFIRMED per-invocation Agent-dispatch parameter (usable NOW for true per-fork worktree isolation), but whether it works as a STANDING frontmatter default in .claude/agents/ is UNVERIFIED (no network vs official docs) -- wired best-effort + flagged provisional in both agent files; the guaranteed form is passing isolation=worktree per Agent dispatch. 732 background tests pass. L3 NOT reached: needs the isolation directive verified AND a real two-worktree end-to-end build; the directive verification needs the director/official docs (not autonomously doable), so loop_stage idle (honest hold at L2, L3 blocked on external verification). The map-contention half is load-bearing meanwhile.'
- '2026-07-17 HARDEN + NARRATIVE RECONCILIATION (Rule-0 self-refill at-target draw). RED-TEAM START: this atom''''s structured level (level_current 3, loop_stage build) CONTRADICTED its own newest simplification above (''''honest hold at L2 ... L3 blocked on external verification ... loop_stage idle''''). Investigated per R9 (direct evidence before narrative) and the alarming ''''silent/false promotion'''' hypothesis DID NOT HOLD: git shows a real L2->L3 promotion (commit 347123778, 2026-07-14) whose stated basis is genuinely evidenced -- (a) the original L3 blocker (''''standing-frontmatter worktree isolation UNVERIFIED, needs official docs / not autonomously doable'''') was RESOLVED by OBSERVATION-AT-SCALE, not the docs-check it originally demanded: 50 live .git/worktrees/<id> checkouts with independent indexes observed during one real build wave (recorded in .claude/agents/sim-engineer.md + saas-engineer.md, ''''2026-07-14 UPDATE''''); (b) a real R15-mutation-tested enforcement control landed -- background/tree_lock.py::assert_changes_within_scope raises ScopeViolation on any out-of-scope OR protected-path (maturity_map.yaml) write by a fork, fail-open + fail-silent both probed (tests/background/test_worktree_isolation.py). THE GENUINE SURVIVING FINDING (real, not the false alarm): the L3 rationale + evidence were written into the AGENT FILES and the commit message but NEVER back into THIS atom''''s simplifications/evidence, leaving the map narrative frozen at ''''L2 hold'''' -- so any agent drawing H10 (this very pass included) would mis-read it as L2-blocked, the exact mis-read hazard the ''''authoritative state so a drawing agent cannot mis-read'''' convention exists to kill. FIX (this note): narrative reconciled to L3-verified; evidence[] extended to point at the actual L3 control (test_worktree_isolation.py + tree_lock.py + the contention design doc) rather than only the registration/FRAME docs. HARDEN RE-VERIFY THIS PASS: 20/20 test_worktree_isolation exit tests green; R15 mutation re-confirmed live (neutering the ScopeViolation raise turns the two guard-fires tests RED, restoring turns them GREEN). CARRIED-FORWARD HONEST CAVEAT (unchanged, still true): the guaranteed-working isolation form remains per-invocation isolation=worktree on the Agent dispatch; standing-frontmatter is now OBSERVED-working at scale but was never confirmed against official docs (no network) -- an empirical, not documentary, verification. No code change, no level change (stays L3); doc-only reconciliation.'
- '2026-07-18 HARDEN red-team (orchestrator, L3->L3 held, observed-with-evidence R9) -- a REAL isolation edge in this atom''s own ''map read-during-build'' invariant, surfaced by heavily exercising worktree isolation this session. FINDING: maturity_map.yaml writes are NOT atomic file-replaces -- NO writer uses os.replace on it (grep-confirmed); write-concurrency relies on tree_lock serialising WRITERS, but a concurrent READER (a fork reading the map during build) takes no lock, so a reader overlapping a writer''s in-place open(''w'').write() can get a TORN/partial read, then a YAML parse error, then fork failure. Low-probability (small write window; some forks get their atom from the dispatch brief not a map read) but real, and it violates the map-read-during-build isolation H10 claims. The atomic-write pattern ALREADY EXISTS in-repo (console_sanctity._atomic_write; ntfy_utils tmp+os.replace) but is NOT applied to the map. CLASS FIX (R10, at H10 BUILD): route ALL maturity_map.yaml writes through one atomic helper (write a temp in the same dir + os.replace) so any unlocked reader sees old-OR-new, never torn -- robust reader/writer isolation without a read-side lock. Mutation test: a reader interleaved with a mid-write must never observe a partial file. NOTE: my own orchestrator map writes this session used in-place open(''w'') (the flagged pattern) -- writer-serialised via tree_lock but not atomic vs readers; no torn read observed, but the gap is structural. Level held (HARDEN never moves the cell); registered not fixed on sight (SELF_INTERRUPT).'
- '2026-07-27 HARDEN re-verify (Rule-0 dial yielded -- no below-target work anywhere; L3->L3 held, HARDEN never moves the cell). Exit tests re-run GREEN: 14/14 test_worktree_isolation, 26/26 across the worktree/tree_lock/core_bare set. R15 MUTATION re-confirmed on the core control assert_changes_within_scope: neutering its raise (if prot or scope_v -> if False) reds EXACTLY the 5 guard-fire tests (out-of-scope write, untracked-out-of-scope, protected-map-even-when-misdeclared, empty-scope-fail-closed, name-prefix-not-fooled) and nothing else; restoring greens them. RED-TEAM of two live invariants, both CLEAN: (1) a git-mv rename that moves a file OUT of scope IS caught -- changed_paths contributes BOTH old and new path, the new out-of-scope path fires ScopeViolation; (2) non-ASCII filenames -- git octal-escapes them in --porcelain output (cafe -> caf\303\251) and changed_paths does not decode the escape, but the DIRECTORY PREFIX is preserved verbatim so prefix scope-matching is unaffected: the only effect is over-strictness on an exact-file scope entry with a non-ASCII name (fail-CLOSED / safe side, never fail-open), and no real file_scope uses such names. DOC RECONCILE: the 2026-07-17 note cited ''20/20 test_worktree_isolation exit tests'' but this file has held 13 (build commit 1c3d8b063) then 14 tests throughout -- the 20 was a stale over-count, corrected here; the CONTROL is unchanged and green. Known residual NOT re-filed (already registered harness debt, SELF_INTERRUPT): the 2026-07-18 map-atomic-write torn-read gap (maturity_map.yaml writes are not os.replace-atomic vs unlocked readers). No code change; record_harden_pass stamped so the next tick rotates PAST this atom.'
- '2026-07-27 HARDEN pass #2 (Rule-0 dial=3 yielded, no below-target work; L3->L3 held). WHY re-offered so soon: the earlier 08:17Z pass was DOC-ONLY (prose analysis, no code); its 6h rotation cooldown then expired and _harden_in_cooldown correctly re-offered -- legitimate rotation (scope files .claude/agents + background/tree_lock.py unchanged since 2026-07-18), not a regression. ADDED CODE (converts the prior pass''s PROSE non-ASCII red-team into PINNED R15 mechanism -- MAKE_IT_STICK, prose-only evaporates): 2 tests in test_worktree_isolation.py (14->16 green). test_guard_fires_on_out_of_scope_nonascii_filename is a fail-OPEN probe -- git octal-escapes non-ASCII paths in --porcelain output but the ASCII directory prefix survives verbatim, so an out-of-scope non-ASCII file is STILL caught (pins fail-safe so a future unescape-properly refactor cannot open a hole); test_guard_passes_in_scope_nonascii_untracked is the mirror (an in-scope accented test filename must NOT be false-flagged and wedge a legit build). Empirically verified git''s quoting first. FILE_SCOPE FIX: added tests/background/test_worktree_isolation.py to this atom''s file_scope -- it was absent, so a FORK hardening H10 with a new test would have tripped H10''s OWN guard (out-of-scope) on its own test dir; the guard now dogfoods cleanly. REGISTERED-NOT-FIXED (SELF_INTERRUPT, MAKE_IT_STICK-class): the guard assert_changes_within_scope is invoked BY CONVENTION only -- the two build-agent instruction files tell a fork to call it before committing, but NO mechanism enforces it (no pre-commit hook; fork_reconciler is reap-only, never merges/checks scope). A fork that skips the self-check writes out of scope silently and the R15-proven guard never fires -- a control nothing invokes passes vacuously (R15 fail-silent). Robust fix is INTEGRATOR-SIDE (verify the fork branch diff stayed within the atom''s declared file_scope at merge), same theme as ARCH1''s open wire-the-verifier-into-a-CI-gate slice; a real BUILD with merge-path blast radius, not fixed on sight. record_harden_pass re-stamped.'
- '2026-07-27 HARDEN pass #3 (Rule-0 dial=3 yielded; L3->L3 held). PURE TIME-BASED re-offer: content_sha AND scope_sha both still MATCH pass #2''''s 15:37Z stamp exactly (verified via _atom_content_sha/_file_scope_sha) -- the 6h rotation cooldown elapsed at 21:37Z and the tick fired 21:38Z, so _harden_in_cooldown correctly returned False. NOTHING has changed since pass #2 -> RE-VERIFY ONLY, no new finding claimed. Exit tests 16/16 green; R15 mutation re-confirmed LIVE (not asserted) -- neutering assert_changes_within_scope''''s raise (if prot or scope_v -> if False) reds EXACTLY the 6 guard-fire tests and nothing else, restoring greens all 16. Both registered residuals re-confirmed still real, still correctly BUILD-gated, NOT re-filed (SELF_INTERRUPT): (a) 2026-07-18 map torn-read -- grep re-confirms still no os.replace/atomic write on maturity_map.yaml; (b) pass #2''''s convention-only guard invocation (no integrator-side merge-time enforcement). DIAL SIGNAL TO DIRECTOR (not a regression): H10 was offered 3x on 2026-07-27 (08:17Z / 15:37Z / 21:38Z) with scope files unchanged since 15:38Z -- the 6h HARDEN rotation is cycling the small at-target set faster than its content changes, so the 3rd pass adds re-verification but no new mechanism; a HARDEN_COOLDOWN_HOURS / at-target-set-size dial-tuning candidate. record_harden_pass re-stamped.'
- '2026-07-28 HARDEN pass #4 (Rule-0 dial=3 yielded, no below-target work; L3->L3 held). PURE TIME-BASED re-offer -- the 6h rotation cooldown elapsed since the 2026-07-27T21:40Z stamp; scope files (.claude/agents, background/tree_lock.py, the test file) UNCHANGED since 2026-07-18/07-27, so RE-VERIFY ONLY, no new finding claimed. Exit tests 16/16 green. R15 MUTATION re-confirmed LIVE both ways on BOTH controls of assert_changes_within_scope: (A) neuter the scope check (_within_scope -> return True) reds EXACTLY the 5 scope-fire tests AND LEAVES test_guard_protects_map_even_when_scope_mis_declares_it GREEN -- proving the protected-path check is INDEPENDENT of the scope check (R15 tautology-class independence, not merely fail-open coverage); (B) neuter the protected-path check (prot -> []) reds EXACTLY test_guard_protects_map... and nothing else; both restored green (16/16). RED-TEAM of the non-ASCII fail-open, re-confirmed STRUCTURALLY closed: git C-escapes only inject backslashes/octals, NEVER a ''/'', so an out-of-scope file''s ASCII directory prefix always survives -> the prefix scope-match cannot be fooled into an in-scope verdict. NO code change, NO accretion (control saturated; a 3rd guard would be theatre). Two registered residuals re-confirmed still real, still correctly BUILD-gated, NOT re-filed (SELF_INTERRUPT): (a) map torn-read (still no os.replace on maturity_map.yaml vs unlocked readers); (b) convention-only guard invocation (no integrator-side merge-time scope enforcement). record_harden_pass re-stamped AFTER this note.'
- '2026-07-28 HARDEN pass #5 (Rule-0 dial=3 yielded, no below-target work anywhere; L3->L3 held, HARDEN never moves the cell). PURE TIME-BASED re-offer -- the 6h rotation cooldown elapsed since the pass #4 stamp; scope files (.claude/agents, background/tree_lock.py, tests/background/test_worktree_isolation.py) UNCHANGED since 2026-07-18/07-27, so RE-VERIFY ONLY, NO new finding claimed. Exit tests 16/16 green (python3 -m pytest tests/background/test_worktree_isolation.py). R15 MUTATION re-confirmed LIVE on the protected-path independence control: neutering prot to the empty list reds EXACTLY test_guard_protects_map_even_when_scope_mis_declares_it and nothing else (15 passed / 1 failed), restoring greens all 16, source byte-identical after restore (git diff empty). Both registered residuals re-confirmed still real, still correctly BUILD-gated, NOT re-filed (SELF_INTERRUPT): (a) map torn-read -- still no os.replace atomic write on maturity_map.yaml vs unlocked readers; (b) convention-only guard invocation -- re-verified this pass that assert_changes_within_scope has ZERO production callers (grep-confirmed repo-wide: only tests + stale .claude/worktrees copies), and fork_reconciler is REAP-ONLY (never merges/scope-checks), so the R15-proven guard is an available BELT, not a wired control; the LOAD-BEARING guarantees are native per-fork worktree isolation + the workers own in-turn GATED landing (pre-commit test gate), which the reap-only lifecycle preserves. NO code change, NO accretion (control saturated; a 3rd guard would be theatre). DIAL ESCALATION (P-2 self-repeat, now flagged in passes #3/#4/#5): H10 has been offered ~5x in ~24h with scope files unchanged since 2026-07-18 -- the 6h HARDEN_COOLDOWN over-offers a saturated at-target atom; PROMOTE to a P1 dial-tuning candidate (raise HARDEN_COOLDOWN_HOURS, or add a saturation skip once N consecutive pure-time re-verifies find nothing new). record_harden_pass re-stamped AFTER this note.'
- '2026-07-30 LIVE DEFECT FOUND IN THIS ATOM''S OWN DOMAIN, registered not fixed (SELF_INTERRUPT). Worktree ISOLATION works (L3 stands, no lost writes between concurrent forks); what has NO MECHANISM is fork LIFECYCLE -- a fork COMING HOME. OBSERVED, not inferred: a FORK LIFECYCLE audit at the start of the 2026-07-30 00:0xZ worker tick found that of the three forks the 2026-07-29 23:05Z fan-out dispatched, at least TWO built substantial real work and then DIED WITHOUT COMMITTING -- 1,581 lines total, existing only as dirty files inside prunable worktrees, i.e. one `git worktree prune` from permanent loss. Recovered as preservation commits: 8a7a90f66 on worktree-agent-a7f7adeb627f11410 (SITE_EH3 MAJOR-4/6: period_coverage_fraction + a _check_period_coverage_present gate + part-year render + its R15 test file, 772 lines) and d7b3db614 on worktree-agent-a6ad9f2b324019a71 (SITE_EH2 predictions ledger + 2 new test files, 809 lines). THE CLASS (MAKE_IT_STICK, verbatim: every rule that DECAYED was an exhortation, every rule that HELD was a MECHANISM): ''each fork MUST come home -- on success merge its branch, on failure reap it; NO orphaned branches'' is carried ONLY as prose in the scheduled-tick doorbell text. It has now demonstrably decayed TWICE IN ONE HOUR. Prose-only is worse than no rule -- the doorbell asserts fork lifecycle is handled while nothing enforces it, so the orchestrator believes forks came home and they did not. PROPOSED MECHANISM (BUILD, not done here): at fork reap/completion, machine-check the fork''s worktree for uncommitted non-generated changes; if present, commit-preserve to its branch and surface it, NEVER prune silently. R15 both ways: a fork that dies dirty must be detected and preserved (mutation: kill a fork mid-edit -> its work survives), and a genuinely clean fork must not false-flag. SECOND, INDEPENDENT DEFECT from the same audit: the dispatch draw is BLIND TO WORK ALREADY IN FLIGHT -- the 00:0xZ tick was handed SITE_EH2 and dispatched a fork for it while an uncommitted implementation of that same atom sat in a23:15Z worktree, so the machine paid twice for one atom and neither instance knew of the other. A draw that cannot see in-flight/abandoned work will keep re-issuing atoms that are already built.'
- '2026-07-30 FINDING CONFIRMED TWICE IN ONE HOUR, now registered as a BUILD item (queued per SELF_INTERRUPT_DISCIPLINE, not fixed on sight). THE DRAW IS BLIND TO WORK IN FLIGHT. The 00:0xZ tick recorded this after dispatching a SITE_EH2 fork while an uncommitted SITE_EH2 build already sat in a prior worktree, and wrote docs/observability/.forks_in_flight.json -- explicitly labelling itself ''a RECORD, not a mechanism ... will decay unless the reaper/draw-guard is actually built''. THE VERY NEXT TICK PROVED IT: 00:2xZ drew W1_9_dsr_flex_markets, SITE1_expert_doors and SITE_EH1_segment_disclosure -- all three already had work in flight or were explicitly deferred by that file one tick earlier. SITE_EH1 was listed as ''dispatched_awaiting_return''; SITE1_expert_doors was listed as NOT provably disjoint. The draw read none of it. WORSE: SITE_EH1 had been dispatched to TWO concurrent forks, neither aware of the other, producing two independent 800+ line implementations that must now be reconciled. COST: three dead forks (no owning process, zero file activity) held 2,689 uncommitted lines; with the 1,581 rescued the prior tick, ~4,270 lines came within one `git worktree prune` of being lost. This is the second confirmed instance of the same class, so R3 applies (two-strike redesign: eliminate/redesign, do not patch again). CONCRETE BUILD, both halves needed because either alone leaves the hole: (1) DRAW-GUARD -- supervisor.py _maturity_map_draw_concurrent must exclude any atom whose file_scope intersects a live worktree or an unmerged rescue branch, reading real git state (`git worktree list`, `git log main..<branch>`) rather than a voluntarily-maintained JSON; (2) REAPER -- a worktree with no owning process and no file activity for N minutes is DEAD: commit its diff to its branch automatically and register it, so preservation never depends on whichever tick happens to look. R15 both ways: the guard must be proven to BLOCK a colliding draw and to ALLOW a genuinely disjoint one, and the reaper proven to fire on a dead tree and NOT on a live one. Note the record file itself is fail-silent by construction -- nothing reads it, so it cannot fail; that is exactly the FAIL-SILENT pattern R15 names, and is why the mechanism, not the record, is the deliverable.'
