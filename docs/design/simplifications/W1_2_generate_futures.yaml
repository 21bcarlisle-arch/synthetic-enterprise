atom_id: W1_2_generate_futures
simplifications:
- '2026-07-10: generating NEW future scenarios/difficulty is CURRICULUM per CLAUDE.md R13 (the baseline/curriculum split) -- the director''s own instrument, never built or content-decided unilaterally by the agent, even once the depends_on prerequisite is met. Any work here beyond the underlying mechanism/engine must be director-named and director-authored content, not agent-invented.'
- '2026-07-12 DISCOVER pass (self-refill draw, no BUILD code -- depends_on: [W1_reveal_over_time] not yet resolved either, W1 itself idle pending M4). Confirmed zero prior art directly: sim/forward_curve.py::generate_forward_price() is a DIFFERENT thing -- a backward-looking decision-time pricing model over the real 2016-2025 history, not a generator of new ground-truth history beyond it. External research grounds this atom''s own mechanism-vs-content boundary in two distinct real traditions: (1) NESO''s Future Energy Scenarios -- a small number of NAMED, human-curated pathway narratives, now off its annual cycle (next full FES not due until 2028), confirming real-world scenario CONTENT is deliberately-paced and curated, not cheaply automated; (2) real energy-trading risk desks (KYOS/Montel/QuantRisk/academic 3-factor literature) generate many synthetic price paths from a single CALIBRATED stochastic MECHANISM -- mean-reversion, seasonality, jump-diffusion, regime-switching volatility (hidden Markov, MCMC-estimated), cross-commodity correlation -- narrative-agnostic, reusable across different targets. Maps cleanly onto this atom''s existing mechanism/content split: the MECHANISM (calibrate a stochastic generator against the SIM''s own real history, analogous to sim/forward_curve.py''s existing seasonal calibration) is a real, scoped, buildable capability; the CONTENT (which specific stress target it''s pointed at and named) stays the director''s R13 instrument, matching FES''s own real curated-pathway practice. Named next step for the eventual FRAME pass (not decided here): whether the mechanism reuses sim/forward_curve.py''s existing seasonal_calibration.json as its starting parameters, or needs its own independent volatility-regime calibration (calculate_sigma_recent() today is a plain recent-window stdev, no jump/regime-switching term). Full findings: docs/market_research/synthetic_future_generation_w1_2.md.'
- '2026-07-13 FRAME pass answers the named next-step question above (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Re-checked depends_on against the map''s own dependency-met rule (loop_stage==''idle'' counts as met, not just level_current>=level_target): W1_reveal_over_time is loop_stage=idle, so this atom''s dependency is genuinely met, resolving the prior pass''s own hedged phrasing (''not yet resolved either''). Read sim/forward_curve.py::generate_forward_price() and sim/risk_engine.py::calculate_sigma_recent() in full rather than summarising from memory: generate_forward_price() is ENTIRELY DETERMINISTIC -- EWMA spot estimate + a fixed seasonal-shape multiplier (from sim/data/seasonal_calibration.json) + a term premium scaling with sqrt(tenor) -- there is no random/noise term anywhere in it, it returns one point price, never a distribution or a path. calculate_sigma_recent() likewise only computes a backward-looking realised coefficient-of-variation (stdev/mean over a trailing window) -- a single descriptive statistic, not a simulatable stochastic process (no mean-reversion speed, no jump intensity, no regime-transition matrix estimated anywhere in this codebase). This sharpens the prior pass''s mechanism/content split into a concrete build plan: seasonal_calibration.json''s own real, already-calibrated seasonal shape IS legitimately reusable as a starting input (same seasonality a synthetic future should still exhibit), but the actual stochastic engine (the mean-reversion/jump-diffusion/regime-switching path generator itself) does not exist anywhere in sim/ today and must be built genuinely from scratch -- this atom is fully greenfield at the mechanism level, not merely ''different in purpose'' from the existing pricing model as the prior pass put it. Next BUILD question (not decided here, epoch-gated): which single real calibration target to fit the new stochastic engine''s volatility/mean-reversion parameters against -- the existing 2016-2025 Elexon SSP history itself (matching real historical statistical properties, the most defensible anchor) -- before any director-authored CURRICULUM content (the specific stress scenario to generate) is layered on top per R13.'
- '2026-07-15 DISCOVER pass, coupling + substream discipline (self-refill draw, DISCOVER/FRAME only, no BUILD code). Two grounded refinements to the prior FRAME''s ''calibrate a greenfield stochastic engine against 2016-2025 Elexon SSP history'' plan. (1) COUPLING, not an independent price path: a synthetic FUTURE market must be DRIVEN BY the W1_3 weather physics (blocking-high regime -> cold-and-still -> tight margin -> price spike), because price is an OUTPUT of weather (the explicit thesis of W1_3/W1_6); building W1_2 as a standalone SSP path generator drawn independently of weather would reproduce the exact naive-decoupling error the weather-hierarchy atoms exist to prevent, and would make every hedge look fine in a tail that never co-occurs with a still-cold spell. This sequences W1_2 AFTER (or jointly with) W1_3, a real dependency the current depends_on: [W1_reveal_over_time] does not capture. (2) C-S2 SUBSTREAM DISCIPLINE (binding, from the real 01:09Z incident): the new stochastic generator MUST draw from its OWN named, seeded RNG substream -- the sim already partitions substreams across simulation/population_draw.py, life_events.py, etc., so a future-market generator sharing any existing substream would silently shift every downstream draw. NOTE sim/scenario/bimodal_generator.py already generates Dunkelflaute price premia -- check at BUILD whether it seeds this engine or is a separate concern. No level change, no BUILD code, no CURRICULUM content chosen (R13, the director''s instrument).'
- '2026-07-16 DISCOVER/FRAME (Lane-3, H17 draw): framing artifact written; the R13 baseline/curriculum wall is this atom''s central constraint (synthetic futures = director-authored curriculum). BUILD gated on W1_reveal_over_time. Level unchanged (0).'
- '2026-07-16 FRAME (Lane-3 H17, doc-only, NO LEVEL MOVE, L0): docs/design/SYNTHETIC_FUTURES_GENERATION_FRAME.md. RECONCILIATION FLAG (not adjudicated in a doc-only turn): a calibrated regime-switching futures generator (sim/scenario/bimodal_generator.py + gas_scenario_generator.py) already EXISTS and is wired end-to-end -- so this atom may be under-rated at 0 and warrants a VERIFY pass to judge L1+, which this FRAME does not claim. Design adds the R13 baseline/curriculum-ratification wall (calibration faces reality, scenario library faces the director, never tuned to company P&L), an RNG-substream refactor, reveal-seam integration, and a red-then-green mutation plan for 3 concrete gaps found (an open SIM-boundary violation, missing data_regime tagging, bulk injection bypassing the reveal seam).'
- '2026-07-16 VERIFY re-level 0->1 (Lane-3 H17 ORCHESTRATOR turn, resolving the reconciliation flag the FRAME passes raised but could not claim from a doc-only pass). Grounded by reading sim/scenario/bimodal_generator.py plus callers and tests: a calibrated two-regime Markov regime-switching synthetic forward price generator, with negative-price / Dunkelflaute / crisis-spike overlays, drop-in compatible with the historical price record shape, calibrated to docs/market_research/price_distribution_high_renewables_2027.md; wired into simulation/run_scenario.py + scenario_comparison.py + saas/reporting/annual_report.py (real callers, not orphaned like the B4 modules); covered by 31 tests (16 bimodal + 15 gas_scenario). Per the rubric L1 = been BUILT in any form, so L0 under-registered the existing mechanism. Held at L1, NOT L2: the R13 wall means synthetic-futures CONTENT is director-authored curriculum (the mechanism exists, the named stress scenarios are the directors instrument), and the FRAME named three real integrity gaps (a SIM-boundary violation, missing data_regime tagging, bulk injection bypassing the reveal seam). No BUILD code this turn; loop_stage stays idle (depends_on W1_reveal_over_time, Epoch 3 gated).'
- '2026-07-16 H17 Lane-3 DISCOVER/FRAME draw (fork, doc-only, empty file_scope): LEVEL HELD at 1, no new framing artifact, DISPOSITION recommendation instead. This atom received SIX DISCOVER/FRAME/VERIFY passes on 2026-07-16 alone (culminating in the ORCHESTRATOR VERIFY re-level 0->1 that reconciled the existing sim/scenario/bimodal_generator.py mechanism, plus SYNTHETIC_FUTURES_GENERATION_FRAME.md naming three concrete integrity gaps -- an open SIM-boundary violation, missing data_regime tagging, bulk injection bypassing the reveal seam -- and the R13 baseline/curriculum wall). The frame is now saturated: the mechanism/content split, the coupling-to-W1_3-weather dependency, C-S2 substream discipline, and the three named gaps are all documented. A seventh DISCOVER doc pass would be filler (SELF_INTERRUPT_DISCIPLINE: the supply of doc passes is infinite = the treadmill). The three named integrity gaps are BUILD fixes touching sim/scenario/* -- BOTH Epoch-3 gated AND outside this atom''s file_scope ([] empty), so not actionable by a Lane-3 doc fork. depends_on W1_reveal_over_time is now MET (that atom is L3/harden), but Epoch-3 gating still bars BUILD. RECOMMEND: park W1_2 from the DISCOVER draw until either Epoch 3 opens for BUILD or the director authors a specific CURRICULUM stress scenario (R13 -- synthetic-futures CONTENT is the director''s instrument, not agent-invented); re-drawing it for DISCOVER meanwhile yields diminishing filler. Not a one-way door; no escalation. No BUILD code, no curriculum content chosen (R13).'
- '2026-07-16 Lane-3 H17 RE-DRAW (doc-only, no BUILD code -- EPOCH_GATING Rule 1). FRAME already saturated (existing docs/design/frame/W1_2_generate_futures_FRAME.md); level HELD at 1, no honest FRAME-stage move possible (target requires BUILD-gated code). BUILD-unblock gate: W1_reveal_over_time resolved (blindfold enforcer) + a DIRECTOR-authored named baseline-continuation scenario (curriculum, R13) + Epoch-3 BUILD-open. Engine (bimodal_generator.py) already exists; curriculum authorship is the block. See LANE3_H17_BUILD_GATE_SURVEY_20260716.md for the full 6-atom gate table.'
- '2026-07-19 BUILD increment (L1->L2 gap b): build_extended_price_feeds now tags every record with data_regime historical|synthetic (epistemic-wall rule .claude/rules/epistemic-wall-sim.md) -- real and generated records were structurally indistinguishable once concatenated. 3 new tests (present + correct-by-origin + no-op path), 18 pass, epistemic verifier PASS. R13-RESPECTING: pure provenance, NO curriculum content touched (5 named presets stay director-authored). Gap (a) annual_report sim-import was ALREADY resolved (recorded disk state). REMAINS for full L2: block-bootstrap fidelity-check mode + gap (c) structural bitemporal routing (no live leak today). level_current HELD at 1 (increment; levels director-ratified).'
- '2026-07-19 BUILD increment (L1->L2 fidelity-check mode): sim/scenario/fidelity_check.py -- the block-bootstrap sanity baseline the FRAME S3/S8 names. On the agree-expected baseline scenario, block-bootstraps BOTH real reference and generated return series and tests CI OVERLAP on shared moments (mean/volatility/lag-1 autocorrelation), so it accounts for both samples'' noise and fires only on GROSS divergence (a sanity check, not a 5pct equality test). R15: wrong-mean/wrong-vol/memoryless generators each FIRE; a matching generator passes; FAIL-OPEN on degenerate input. 9 tests, epistemic PASS. R13-RESPECTING baseline fidelity machinery (measures agreement, authors no curriculum). REMAINING for full L2: only gap (c) structural bitemporal routing of scenario records (no live leak today -- company reads are backward-windowed). level_current HELD at 1 (levels director-ratified).'
- '2026-07-20 L2 PROPOSED (batched for director LEVEL_UP; level_current NOT self-moved). The two substantive FRAME L1->L2 gaps are closed -- gap (a) annual_report sim-import was already resolved, gap (b) data_regime provenance BUILT (cf0b66a5b), the block-bootstrap fidelity-check mode BUILT (13a94f6a9). R10 SIMPLIFICATION registered for the remainder: gap (c) -- scenario-generated records are not yet STRUCTURALLY routed through W1_reveal_over_time''s as-of/bitemporal gate the way real records are; the FRAME states there is NO live leak today (company-side reads are backward-windowed regardless of whether the feed is historical or scenario), so this is structural-enforcement hardening, not a correctness gap -- carried as the L2->L3 item, not a blocker on the mechanically-real L2 claim. blocked_on director_level_up so the draw stops re-offering a done-to-L2 atom every cycle.'
- '2026-07-24 HARDEN red-team (self-refill draw, atom AT L2/harden): re-verified all 31 generator + 27 run_scenario/fidelity exit tests still hold, then FOUND + CLOSED an R15 blind spot in sim/scenario/fidelity_check.py -- the block-bootstrap sanity check validated mean/std/lag1-autocorr ONLY, so a generator matching those three but FLATTENING the spike tail (Gaussian innovations against heavy-tailed real energy returns) PASSED every check; that flattened tail is exactly the risk-relevant feature (Dunkelflaute/scarcity spikes, negative-price days) the synthetic-futures atom exists to stress the company with, and the property the just-closed SPIKE_TAIL work addressed. Fix: added a dimensionless tail_ratio moment (99th-pct |deviation| / std) to MOMENTS -- R10 (extends the invariant so the WHOLE tail-flattening class fails, not one instance) + R15 mutation-proven BOTH ways (flat-tail generator FIRES on tail_ratio with mean/std matched by construction so nothing else could catch it; matched heavy-tailed generator still PASSES; pre-hardening 3-moment control demonstrably let it slip). BASELINE fidelity machinery only, blind to company P&L, no curriculum content touched (R13). level_current HELD at 2.'
- '2026-07-27 HARDEN red-team (self-refill worker tick, atom AT L2/harden): re-verified all 62 generator + run_scenario/fidelity exit tests still hold (was 60), then FOUND + CLOSED a SIGN-BLIND sibling of the 2026-07-24 tail_ratio finding in sim/scenario/fidelity_check.py -- tail_ratio takes the 99th percentile of |deviation|, so it is structurally blind to which SIDE the heavy tail sits on: a generator matching mean, volatility, lag-1 persistence AND tail_ratio MAGNITUDE but with its heavy tail MIRROR-IMAGED (down-spikes / negative-price-dominated where real UK energy returns spike UP on scarcity) PASSED every check (empirically confirmed: reference skew +2.9 vs generator skew -1.8, verdict passed=True). Direction is the risk-relevant axis because this atom''s two named stress features point OPPOSITE ways (Dunkelflaute scarcity = up-spikes, negative-price days = down), so an inverted generator mis-states the risk while matching every magnitude moment -- the audit-the-sibling-half pattern (one half of a split hardened -> red-team the sibling for the same class). Fix: added a dimensionless signed tail_skew moment ((99th-pct up-move + 1st-pct down-move) in std units; >0 right-skew like real energy, <0 left-skew, ~0 symmetric) to MOMENTS -- R10 (extends the invariant so the WHOLE wrong-tail-direction class fails, not one instance) + R15 mutation-proven BOTH ways (a wrong-direction generator FIRES on tail_skew with mean/std/tail_ratio matched by construction so nothing else can catch it; a same-direction generator still PASSES with no false fire; sign-folding tail_skew to abs() -- the fail-open mutation -- lets the inverted generator slip through, proving the control depends on the sign). High-quantile based for the same block-bootstrap robustness rationale as tail_ratio, not raw 3rd-moment skewness (whose CIs are too wide). BASELINE fidelity machinery only, blind to company P&L, no curriculum content touched (R13). 2 new tests (13 fidelity, was 11). level_current HELD at 2.'
- '2026-07-27 HARDEN red-team (self-refill worker tick, cooldown-expired re-draw, atom AT L2/harden): re-verified all 62 generator + run_scenario/fidelity exit tests still hold, then FOUND + CLOSED a TEMPORAL-marginal blind spot in sim/scenario/fidelity_check.py -- the four preceding moments (mean, std, tail_ratio, tail_skew) are ALL functions of the return MARGINAL alone, and lag1_autocorr measures only the SIGNED level, so a generator matching the entire marginal AND the level autocorrelation yet emitting its heavy-tailed spikes ISOLATED instead of in multi-day SPELLS PASSED every check (empirically confirmed: a random shuffle of a volatility-clustered reference -- identical marginal by construction, clustering autocorr 0.27 -> 0.01 -- returned passed=True with zero diverging moments). Volatility clustering is the ARCH signature of real UK energy stress (a Dunkelflaute cold-still regime, a gas-crisis run-up both persist for DAYS, not one settlement); sustained consecutive-settlement stress -- not an isolated one-day spike a hedge rides out -- is what broke the under-hedged 2021 UK suppliers, so a fidelity check blind to clustering green-lights a generator that understates exactly the sustained-tail exposure this atom exists to stress. Fix: added a dimensionless vol_clustering moment (lag-1 autocorr of |deviation from mean|, the standard clustering statistic) to MOMENTS -- R10 (extends the invariant so the WHOLE isolated-spike / no-clustering class fails, not one instance) + R15 mutation-proven BOTH ways (a shuffled/no-clustering generator with mean/std/tail_ratio/tail_skew matched by construction FIRES on vol_clustering ONLY -- nothing else can catch it; a same-clustering regime-switching generator still PASSES with no false fire; removing the moment -- the fail-open mutation -- lets the isolated-spike generator slip through). Lag-1 |deviation| autocorr is block-bootstrap-stable like the other moments. BASELINE fidelity machinery only, blind to company P&L, no curriculum content touched (R13). 2 new tests (15 fidelity, was 13). level_current HELD at 2.'
- '2026-07-27 HARDEN red-team (self-refill worker tick, atom AT L2/harden): re-verified all 64 generator + run_scenario/fidelity exit tests still hold (was 62). Then found an R15 FAIL-SILENT / theatre-control gap the five preceding moment-hardening passes never noted: sim/scenario/fidelity_check.py::check_scenario_fidelity has ZERO production callers -- grep across the whole repo (excluding its own def + its own test file) finds NONE, and simulation/run_scenario.py (the real scenario runner, in this atom''s file_scope) builds the extended synthetic feed (build_extended_price_feeds) but never reconciles it against real history. The FRAME S3 calls the distributional sanity check a HARD GATE ("any synthetic path population must pass a distributional sanity check against the real record"); in reality it gates NOTHING -- the six moments (mean/std/lag1_autocorr/tail_ratio/tail_skew/vol_clustering) are sharp but the blade is never swung on any real generated output, so per R15 doctrine (a control that gates no real output protects nothing; an uninvoked check is a failed check) the accumulated moment-hardening rests partly on a control that never fires in production. NOT rush-fixed in a bounded worker tick (SELF_INTERRUPT_DISCIPLINE: queue, do not wire a fresh control into a LIVE reporting pipeline mid-tick -- false-fire jams publishing, a known hazard). Scoped closure for a proper BUILD: (a) select the agree-expected baseline scenario (baseline_2025 preset, already commented "baseline check against historical tail") as the reconciliation subject; (b) wire a reconcile_baseline_fidelity() gate that feeds GENERATED baseline returns + REAL 2016-2025 SSP returns into check_scenario_fidelity -- the 128MB sim/cache/elexon_ssp_full.json is the only real reference, so a compact cached real-return-series fixture is needed (too heavy to parse per-test); (c) fire ONLY on the baseline scenario, never on stress scenarios (a price-war SHOULD diverge -- that is the point) and never blocking the reporting path; (d) R15 both-ways: baseline PASSES, a detuned baseline FIRES. BASELINE fidelity machinery only, blind to company P&L, no curriculum content touched (R13). level_current HELD at 2 (levels director-ratified).'
- '2026-07-28 HARDEN red-team (self-refill worker tick, dial=4 yielded, atom AT L2/harden): CLOSED the R15 FAIL-SILENT gap registered 2026-07-27 -- check_scenario_fidelity''s six hardened moments had ZERO production callers (the FRAME S3 "hard gate" gated nothing; an uninvoked check is a failed check). BUILT the caller: simulation/run_scenario.py::reconcile_baseline_fidelity() + load_real_ssp_daily_returns() + a compact 32KB committed real-reference fixture sim/scenario/data/real_ssp_daily_mean.json (daily-mean of the 128MB half-hourly Elexon SSP cache, so it is never parsed per run/test). NON-BLOCKING diagnostic (R12/R4 -- a divergence is a finding, never a publish gate; the false-fire-jams-publishing hazard is why it never gates a live path). Swinging the blade on the ACTUAL baseline generator vs real 2016-2025 SSP returns (ΔP first-differences -- SSP goes negative, so log-returns are undefined) for the FIRST TIME immediately surfaced a GENUINE fidelity gap: the baseline_2025 generator UNDER-CLUSTERS volatility -- vol_clustering ~0.21 generated vs 0.42-0.51 real, and the real figure is ROBUST across every window (calm 2016-2019 0.42, crisis 2021-22 0.47, post-2023 0.43), so it is a structural property of real UK electricity, NOT a crisis-window artifact. The generator''s fast-turnover daily Markov regime (persistence 0.85) + 1-3 day Dunkelflaute spells do not sustain the multi-day volatility SPELLS real energy stress arrives in -- exactly the sustained-tail exposure that broke under-hedged 2021 UK suppliers. Vindicates the R15 doctrine end-to-end: the blade the five prior passes sharpened caught a real defect the instant it was finally swung (named_standard_best_day: expose coincidence not bank it). R15 both-ways on the caller: a self-matching generator PASSES (not fail-closed/tautological), an injected +50 mean-shift FIRES on mean, a degenerate reference FAIL-OPENs loud. 9 new tests (42 total, was 33), epistemic PASS. REGISTERED GAP, NOT fixed here (out of file_scope): the vol_clustering under-clustering fix lives in sim/scenario/bimodal_generator.py (regime persistence / spell-duration) -- scoped as a proper generator BUILD (add a slow-moving volatility-regime layer or lengthen spell durations, calibrated to the real 0.42-0.51 clustering; R13 fidelity-to-reality, blind to P&L), needing bimodal_generator.py in file_scope or a dedicated generator atom. BASELINE fidelity machinery only, blind to company P&L, no curriculum content touched (R13). level_current HELD at 2.'
- '2026-07-28 HARDEN red-team (self-refill worker tick, dial=4 yielded, atom AT L2/harden): re-verified all 56 W1_2 exit tests (run_scenario + fidelity_check) still hold + epistemic PASS (527 files). Then RED-TEAMED the fidelity check''s own REAL-REFERENCE ANCHOR (the audit-the-sibling-half pattern one level UP from the just-closed uninvoked-check gap: the check now HAS a caller, but what does the caller measure agreement AGAINST?) and found an R15 INDEPENDENCE / fail-open gap (killer pattern 1, TAUTOLOGY): check_scenario_fidelity measures the generator''s agreement against the committed real-SSP fixture sim/scenario/data/real_ssp_daily_mean.json, which lives in THIS atom''s own file_scope (editable) yet had only len>2000 / std>0 guards -- so a truncated fixture (array no longer matching its self-declared n_days) or a wrong-unit / returns-stored-as-levels reference would PASS and silently turn the whole fidelity check into agreement-against-a-fabricated-anchor (measuring nothing real). Fix (simulation/run_scenario.py::_validate_real_reference, wired into load_real_ssp_daily_returns, raising CorruptReferenceError LOUD -- an untrustworthy reference is a FAILED check): two INDEPENDENT guards -- (1) internal consistency, the fixture''s self-declared n_days == actual daily_mean_ssp length (catches truncation/append corruption, value-independent, two separately-authored fields must agree); (2) external plausibility, daily-mean LEVEL median in a published-UK band [10,500] GBP/MWh anchored to Ofgem/Elexon market knowledge, NOT tuned to the fixture (real median 55.59; fires on p/kWh mis-unit ~5.5, returns-stored-as-levels ~0, fabricated near-zero -- the wrong-anchor case guard 1 structurally cannot see). R15 mutation-proven BOTH ways: the real committed fixture PASSES (not fail-closed/tautological); a fail-open stub reds all 6 fire-tests (length-mismatch, wrong-unit, returns-as-levels, missing/empty, non-finite, end-to-end loader-from-disk) while the pass-test stays green. 7 new tests. BASELINE fidelity machinery only, blind to company P&L, no curriculum content touched (R13). level_current HELD at 2.'
