atom_id: OPS4_surgical_landing_tool
map_notes:
  origin_note: 'MINTED FROM the director ruling DIRECTOR_RULING_HOOK_BYPASS_IS_A_WALL_2026-08-09 (hook-bypass is a WALL; the sanctioned interim shape d6f894b6e expires when this lands). CAUSE, MEASURED 2026-08-09: `git merge` refused correctly because 35 paths of other lanes'' staged work sat in the shared index and a merge commit would have swept them in; the operator''s only apparent moves were sweep-their-work or bypass-the-hook, so the bypass was a MISSING TOOL, not a discipline failure -- a rule alone would leave no legal move and would evaporate (MAKE_IT_STICK). WHAT IT DOES: takes an explicit path list, builds the tree the commit WOULD create, runs the gate against a clean extract of THAT tree (not the working tree, whose green is the tree-divergence defect this project has hit four times in one day), and on green commits exactly those paths with the gate receipt (command, counts, tree sha) recorded IN the commit message. EXIT: (1) the tool lands and is the documented way to commit by pathspec on a dirty shared tree; (2) it is proven to REFUSE on a red resulting tree, R15 both ways -- reachable defect and fail-CLOSED when the gate is unavailable (an unavailable check is a FAILED check); (3) it never mutates the caller''s index or working tree, proven against an index holding another lane''s staged work; (4) the receipt is checkable after the fact, so a commit claiming a gate run can be falsified; (5) docs/design/SURGICAL_LANDING.md states why bypass is a wall and why this is the legal move.'
  name: 'MINTED FROM DIRECTOR_RULING_HOOK_BYPASS_IS_A_WALL_2026-08-09 (hook-bypass is a WALL). A tool that lands exactly-named paths by building the tree the commit WOULD create and running the gate against THAT, so a dirty shared index never leaves bypass as the only move. Full mint text, cause and the five exit criteria: origin_note in the store.'
