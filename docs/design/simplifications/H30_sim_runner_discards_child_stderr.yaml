atom_id: H30_sim_runner_discards_child_stderr
map_notes:
  notes: 'Registered 2026-08-08 from the WORKER_FINDING that diagnosed the sim red loop, so the finding''s own queued class defect is not lost when the doc is archived (R17: consumed is not absorbed). R5 says an alert carries its diagnostic payload; this one structurally cannot. Suggested shape from the finding: capture stderr, tee the last N lines into docs/observability/sim-runner-log.md, and put them in the failure NTFY. Note the cost this already imposed -- the root cause turned out to be a one-line NameError that took a manual re-run to see, because the traceback was written to a socket and discarded unread.

    BUILT 2026-08-08, L0 -> L2. Not closed as an instance fix (R10): the guard tools/child_stderr_guard.py flags ANY launch site under background/ that reports a child''s failure to a human while discarding its stderr, so the class fails at commit time. It found ELEVEN sites, all fixed, none exempted -- sim_runner (both), background_worker''s leftover sweep, process_run_complete''s git add/commit/push + liveness publish, executor_governor''s map fold. Scope is proven, not asserted: the guard reads background/process_manifest.yaml and returns rc 2 if any declared non-retired daemon''s entrypoint sits outside the scanned root. R15 both ways -- the 2026-08-08 NameError traceback as a source fixture turns the guard red and the behavioural test red when stderr=PIPE is removed; both go green with it. Live smoke: a real failing child''s "NameError: name ''_IC_SEGMENTS'' is not defined" now appears in the log tail AND as the NTFY headline, where the incident had only "rc=1". NOT at L3, and loop_stage is harden: no HARDEN/Expert-Hour pass, and the guard has never run against a REAL new daemon landing outside background/ -- only against a fixture manifest.'
map_records:
  evidence:
  - background/sim_runner.py
  - docs/staging/done/WORKER_FINDING_SIM_RED_LOOP_ROOT_CAUSE_2026-08-08.md
