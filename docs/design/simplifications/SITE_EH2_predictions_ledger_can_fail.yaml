simplifications:
- '2026-07-29 MINTED from the cold-eyes Expert Hour (MAJOR-3). THE DEFECT is this projects own R15 breach on its most load-bearing public surface: on the door billed as "the page an expert checks first", NO prediction can ever be wrong. Every failure routes to an unfalsifiable escape hatch -- renewal misses are recorded "inconclusive" with the note "not counted as a miss" because the portfolio snapshot may be stale, and 25 of 26 hedge calls are "ungraded -- market data has not advanced". 26 identical INCREASE recommendations is a constant, not a forecast, and log_entry_count is padded by counting one C9 prediction four times. A control that cannot fail is worse than none. SCOPE: (1) render the headline the data actually supports ("1 of 26 predictions graded; 0 renewal predictions gradeable; grading blocked on a stale portfolio snapshot") rather than a count that implies a track record; (2) de-duplicate a repeated prediction to one row with a re-log count; (3) make "inconclusive" a BOUNDED state -- if the blocker is a stale snapshot, name the snapshot and its age, and after a stated horizon the entry grades or is declared ungradeable, never permanently parked; (4) R15 mutation test: a deliberately wrong prediction must render as a MISS. NOTE the correct voice already exists on the same surface -- the retention block says "grading them would require building that missing signal first, not inventing a result now" -- so this is applying an honesty pattern the page already has, to the two blocks that lack it.'
- '2026-08-03 L1 LANDED + SELF-CERTIFIED (worker tick, sole-map-writer; ledger docs/observability/gate_authorizations.jsonl, authorized_by agent_self_certified per the 2026-07-29 ruling item 2, R16). NOT BUILT THIS TICK -- ADOPTED. The atom was drawn as fresh SITE work while the build already existed, unmerged, on worktree-agent-aebe35df16c7670fd; the UNMERGED-WORK guard flagged the overlap and Rule 0 correctly kept the atom in the draw, so the tick checked git reality first and adopted rather than minting a rival. main had not touched any of the four non-generated files since the branch point, so adoption was clean (commit a7f71b3b0, original SHAs 8a8340022/23c3e8694/336db0261 recorded in its message; branch reaped). All four scope items are met: (1) the headline is now derived, not a log-line count -- the rendered surface reads "0 of 2 distinct predictions graded (0 on target, 0 MISSED) ... NO TRACK RECORD HAS BEEN ESTABLISHED"; (2) de-duplication with a re-log count (35 log lines to 2 distinct predictions); (3) undecidedness is BOUNDED -- a closed vocabulary ON TARGET/MISS/AWAITING/UNGRADEABLE with no "inconclusive", a 14-day horizon, and every undecided entry naming its blocker and that blocker''s age; (4) a MISS is reachable and R15-mutation-proven. Independence (anti-tautology): prediction from track_record_scorecard.json, outcome from live_portfolio.json -- two files, two writers. ONE DEFECT FIXED ON ADOPTION: the live control pinned generated values (relog_count == 4, the date 2025-06-29) that the decision log moves every run -- the same class as the 4-day publish blackout -- rewritten to assert the RELATIONSHIP (section arithmetic closes; log_lines > distinct so de-dup stays under test, failing loudly if that premise empties) and mutation-proven BOTH WAYS. Landed THROUGH the full pre-commit gate (213 targeted + 434 site green) where the rescue commits had been --no-verify. HONESTY, level held at L1 and NOT proposed higher: the rival implementation worktree-agent-a6ad9f2b324019a71 was NOT reconciled as the fork registry required (it is a broader 34-file branch off a different merge-base, left INTACT, only its proof-data half lost); and the two upstream causes -- the stale portfolio snapshot and the hedge recommender that has only ever emitted the constant INCREASE -- are UNFIXED and out of scope, now stated on the surface rather than absorbed by it. Those two are why the door still grades nothing: R12 says that honest zero ships as-is, and no assertion here rewards a better-looking track record.'
- '2026-08-03 HARDEN pass (fresh fork, Rule-0 draw; L1->L1 held, HARDEN never moves the cell). Re-verified the control end to end. A REAL DEFECT WAS CAUGHT LIVE by this atom''s own R11 tests on arrival, not a synthetic mutation: 2 of 91 site/proof tests were RED (test_live_surface_renders_the_derived_headline, test_live_surface_states_the_horizon_and_names_the_stale_snapshot) because the then-published site/data/proof.json (committed at daed23c16, "Auto-process run complete") carried outcome_source_stamp=2026-08-03T05:00:56Z -- claiming the portfolio snapshot backing the ledger was 0 days old -- while the live_portfolio.json actually committed in that SAME commit (last touched 950773234, 2026-07-20) is genuinely stamped 2026-07-20T05:47:26Z, 14 days old. A real cross-file inconsistency within one published commit: whatever wrote proof.json read a live_portfolio.json that never made it into the repo, so the door was telling a reader the grading blocker was fresh when it was two weeks stale -- exactly the kind of false-freshness this atom exists to prevent, just one hop upstream of the grading logic itself. FIX NOT TAKEN -- ORCHESTRATOR CORRECTION ON MERGE (2026-08-03, worker tick). The fork proposed regenerating site/data/proof.json to stamp outcome_source_stamp=2026-07-20T05:47:26Z/14-days-old. That fix was REJECTED and NOT merged: by merge time main had self-healed at 05aa3df92, where site/state/live_portfolio.json is stamped 2026-08-03T05:28:36Z and site/data/proof.json matches it exactly (outcome_source_age_days 0). Merging the fork''s proof.json would have RE-INTRODUCED a 14-day-stale stamp that no longer matches the on-disk portfolio -- a regression, and the exact false-freshness class this atom exists to prevent, inverted. Only this evidence note was merged; the generated JSON was left to main. The DEFECT ITSELF WAS REAL and is independently confirmed at the branch point by the orchestrator (git show daed23c16:site/state/live_portfolio.json -> generated_at 2026-07-20T05:47:26Z, vs git show daed23c16:site/data/proof.json -> outcome_source_stamp 2026-08-03T05:00:56Z): one published commit carried a proof.json generated against a live_portfolio.json that never landed in it. It is TRANSIENT and SELF-HEALING (the next auto-process run rewrites both), which is precisely why it needs a standing gate rather than an instance fix -- a defect that disappears before anyone looks is not a fixed defect. ALSO NOT MERGED (but the fork was RIGHT -- orchestrator self-correction, same tick): the fork additionally edited tests/tools/test_level_promotion_gate.py, outside its file_scope, changing an assertion to "no director LEVEL_UP" and justifying it as a stale string blocking the commit gate. The orchestrator FIRST recorded that justification as false, having checked it against main''s WORKING TREE. That check was wrong and the accusation is RETRACTED. A second fork (W1_7, worktree-agent-a69fd6a9db76bfd65) independently made the identical change, which prompted a re-check against COMMITTED state and exposed the real cause: **tools/level_promotion_gate.py carries a large UNCOMMITTED rescope in main''s working tree.** Its last commit is 666e778a0 (2026-07-18); the committed file emits "no director LEVEL_UP", while the uncommitted working-tree version -- rescoping the gate from PREVENTION/director-authorized to RECORDING/self-certified per DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29 item 2 -- emits "no recorded LEVEL_UP". PROVEN by running main''s committed test inside a fresh worktree against the committed gate: FAILS ("assert ''no recorded LEVEL_UP'' in ''...has no director LEVEL_UP authorization...''"). So every fork and every fresh checkout correctly sees a RED test, while main''s dirty tree shows green. Both forks read reality; the orchestrator read a locally-patched tree. The test change was still not merged, because on main''s working tree it would go red -- the actual fix is COMMITTING THE GATE RESCOPE, which is a safety-control change (one-way door #5) and was therefore ESCALATED via NTFY, not self-authorised. SECONDARY R15 FINDING on the door mechanism itself: background/one_way_door.py, which CLAUDE.md names as the SOLE enumeration, is FAIL-OPEN on this very category -- classify_action returns is_one_way_door=False for "Disable the pre-commit safety control gate" and for "Change the security profile from Restricted to Developer", matching only REAL_MONEY. The agent''s only mechanised door check cannot see categories 5 or 8. Registered here; not fixed this tick. ROOT CAUSE NOT FIXED HERE, registered not absorbed (SELF_INTERRUPT_DISCIPLINE, outside this atom''s file_scope): tools/generate_proof_data.py itself is correct -- it faithfully renders whatever live_portfolio.json is on disk at generation time -- so the bug is upstream, in whatever auto-process/publish step produced that commit''s proof.json against a live_portfolio.json that differed from what the same commit persisted (candidates: tools/project_portfolio_to_2026.py''s output not landing before the proof-data generation step ran, or a later git operation reverting only that one file). Flagged for the publish-pipeline owner as a same-commit cross-file consistency gap, not filed as a new atom by this fork. The two previously-registered residuals are unchanged and re-confirmed live: live_portfolio.json is still genuinely 14 days stale (direct read, untouched since 2026-07-20), and the hedge recommender still emits only the constant INCREASE (31 log lines, one distinct stance). TAKEAWAY: this is direct evidence the R15 control is real, not theatre -- its very next re-verify caught a genuine production staleness defect, not merely its own rehearsed mutations. Level held at L1; no new capability -- a re-verify that found and fixed one live instance of the exact defect class this atom was minted to prevent.'
