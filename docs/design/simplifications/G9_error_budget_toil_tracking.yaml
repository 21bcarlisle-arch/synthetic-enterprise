atom_id: G9_error_budget_toil_tracking
simplifications:
- '2026-07-16 AUTHORED AS PROPOSAL (G6 output, SRE lens). Strengthens G4_unified_failure_register: quantify TOIL (SELF_INTERRUPT_DISCIPLINE treadmill) + an error-budget view. DISCOVER/FRAME workable now; director ranks.'
- '2026-07-16 H17 Lane-3 FRAME L0->L1 (doc-only, BUILD-gated so no code). ERROR_BUDGET_AND_TOIL_TRACKING.md specifies a 7-class TOIL taxonomy grounded in real recurring treadmill toil (publish-gate wedges T1, stale-daemon-not-restarted/R2 T2, map-truth reconciliation T3, worktree-scan false-positives T4, staging re-archival T5, archived-doc resurrection T6, harness false-positive triage T7), sourced from the G4 unified failure register (reader-only, no duplication) plus retros and the existing anti-decay digest counters. Designs an SRE error-budget view where discretionary net-new feature work SOFT-yields (re-order the draw, never hold) to toil-paydown when the self-caught-failure budget is burned, using the already-live anti-decay proto-signals (turns-waiting-on-human, escalations-later-reversible, idle-turns-with-atoms). Guardrails stated prominently: budget/toil % are DIALS/diagnostics never targets (R12); the soft gate never zeroes the feasible set (Rule 0, toil-paydown is always drawable); and NO 0-toil target -- a zero-toil goal would incentivise HIDING self-caught failures (they are a health signal, not a defect count). R15 note: the failure-catching controls feeding the budget must themselves be mutation-testable (inheriting H18) or the budget is fail-silent theatre. Strengthens G4 (builds on the register). The background/tools budget-reader + digest-render block (folding with G4 + the effort_digest.py block-managed render pattern) + the draw-path soft-gate dial-yield are a NAMED later BUILD slice, not built here.'
map_notes:
  name: 'SRE error-budget + toil tracking: quantify recurring toil (the treadmill) and gate discretionary work on a self-caught-failure budget'
