atom_id: A48_enterprise_value_is_the_method_not_the_book
map_notes:
  gain: 'Director, 2026-08-28, mission: ''the enterprise value is the automated method for finding those customers, not the book itself.'' Observed-with-evidence the same day: saas/enterprise_value.py''s own docstring says ''The portfolio-wide sum of the resulting per-account CLVs is the enterprise value: the total discounted future net margin of the customer book.'' That is the superseded definition, written into the one place carrying the mission''s own noun, and reached through company/analytics/customer_value_view.py into the live phase-4c run. This atom is NOT a rename: the CLV roll-up is a correct and useful figure and keeps its name in its own domain. What is missing is any measure of the METHOD -- how reliably the machine finds individual customers it can create value for, at what cost per customer found, and whether that improves. Until one exists, the project''s headline number is the thing the director says is the evidence, presented as the thing being built. Filed: WORKER_FINDING_THE_ONLY_MODULE_NAMED_ENTERPRISE_VALUE_MEASURES_THE_BOOK_2026-08-28.'
