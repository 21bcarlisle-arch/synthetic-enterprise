atom_id: AO6_consolidation_rhythm
map_notes:
  origin_note: 'This is the step that decides whether the whole programme decays. MAKE_IT_STICK is directly on point: ''every rule that DECAYED was an exhortation; every rule that HELD was a MECHANISM.'' An epoch-close consolidation pass that lives only as prose in a checklist WILL evaporate exactly as the earlier exhortations did -- so it must land as an enforced epoch-boundary mechanism (a check that FAILS an epoch close lacking its consolidation record), not as another line in a skill file. The standing orphan query from ADVISOR_ADDENDUM_ARCHITECTED_OUT_EDGE_INTEGRITY_2026-08-06 is this atom''s natural instrument.'
