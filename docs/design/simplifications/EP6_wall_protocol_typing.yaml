simplifications:
- "2026-08-22 pass 62 BUILD, level HELD at 2, loop_stage stays build. THE TWO FEEDS THAT CARRY THE MONEY WERE THE UNSIGNED ONES. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 973aa9ac6 -- pass 61's own landing -- with all eight touched files clean against HEAD before the first edit, on a shared tree carrying 250+ other-lane modifications throughout.\n\n  WHICH ITEM, AND IT IS THE ONE PASS 61 NAMED. Pass 61's \"WHAT REMAINS (a)\": `observe_response_wire` -- the dispatch-instruction and settlement feeds -- still decoded a response with no participant check, which is why `flex_participation.py` was deliberately declared in BOTH the framed and the bare crossing tables. `python3 -m tools.discovery_pass_ceiling` reports this atom in its fourth state, THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS, naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`; the payable half was taken again. Q13's OTHER remaining leg -- `company/comms/susceptibility_estimator.py` -- is untouched and stated below rather than left to be inferred from a count: its production module is not in this atom's `file_scope` and framing it means giving the comms world leg an operator identity it does not have.\n\n  THE DEFECT, AND WHY IT IS WORSE THAN THE ONE PASS 61 CLOSED. Pass 61 framed the ENROLMENT leg because a registration reference could be minted by anything that echoed two fields back. The same seam's two OBSERVABLE feeds stayed bare, and they are the ones that carry money: anything able to put bytes in front of `observe_response_wire` could tell this company it had been dispatched, over which window, and how much it had been paid. A registration a company wrongly believes it holds is a business that does not exist and shows up as a discrepancy; a settlement line it should never have been sent goes straight into revenue. Reproduced before a line was written, and it is what mutation M1 below restores.\n\n  ONE SIGNATURE PER MESSAGE, NOT PER FEED, and this is the part a single-venue seam could not have taught. `_frame_feed` reads the venue off `r.payload.venue` -- the WORLD'S own record of which market it is settling, being constructed here and not received, so there is no message to believe -- and signs each message with THAT venue's operator. The obvious implementation signs the feed once. It is wrong on the stacked feeds, because a stacked portfolio is called at several venues at once and the fixture is contended across the Balancing Mechanism and a local constraint market, which in GB are run by different parties. A once-signed feed stamps the local constraint line with the system operator's identity: a forgery the world itself commits, and one no company-side check could ever catch, because the company would be authenticating a claim that was already false when it left. `test_a_STACKED_feed_carries_TWO_DIFFERENT_signers_in_ONE_list` asserts the sender SET has two members and that each message's signer matches its own venue; M4 is that implementation, restored, and it reds.\n\n  READING THE VENUE OFF THE PAYLOAD IS NOT THE TAUTOLOGY PASS 61 REMOVED, and the difference is worth stating precisely because the shapes look alike. There, the ONLY evidence was field-vs-field: the message supplied both sides of the comparison, so nothing had to be HELD to pass it. Here the evidence is a credential fingerprint this module holds and the sender has to present; the venue named in the payload selects WHICH participant is entitled to have sent it. An impostor holding nothing is refused at the frame; one holding the system operator's genuine credential cannot mint a local constraint line by relabelling it, because moving the venue moves the operator the frame is then required to prove. The company reads its OWN `VENUE_OPERATORS`, never the world's table.\n\n  WHAT THIS LEG STILL DOES NOT ASK, said here rather than left for a later pass to discover: whether this company ever ENROLLED at the venue named. That answer lives in `FlexEnrolmentBook`, which the module-level feed readers do not hold. The world refuses an unregistered dispatch at emission (`UnregisteredDispatch`, pass 57) and the harness scores `settlement_solicited` downstream, so the hole is covered from both ends and not from the reader's own side. That is the next thing owed on this leg.\n\n  THE HAND-OVER CLOCK HAS NO DEFAULT ON ANY OF THE FOUR LEGS, inherited from `frame_venue_message` and now enforced where the feeds are emitted. The tempting default is the envelope's own `observed_at`, and a hand-over stamp read off the document it wraps could never disagree with it. The harness supplies TWO clocks rather than one (`_hand_over_clocks`): the instruction feed is handed over as the record closes, the statement when the settlement run for it completes `_SETTLEMENT_LAG_DAYS` later. One shared stamp would quietly re-merge the two events C-S3 exists to keep apart.\n\n  THE RATCHET'S MUTATION TEST WOULD HAVE DIED OF THIS PASS'S SUCCESS, and repairing that is half the work. Pass 61 wrote `test_MUTATION_a_file_with_ONE_framed_and_ONE_bare_leg_is_not_recorded_as_framed` against `flex_participation.py`, then genuinely mixed. Framing the feed leaves NO mixed file in this repository, so the version asserting `overlap == {that file}` had to be deleted the moment the wall got better -- a control that dies when its subject is repaired. What that control is really about is whether the SCANNER can express a mixed file, and that question survives having no mixed file left, so `_response_decode_sites` gained a `root` parameter and the test now writes a one-framed-one-bare module into a scratch tree and requires the scan to name it on both sides. Its null control asserts the real repository has no overlap today, so a green is the scanner working rather than the tree happening to be mixed.\n\n  THE HAND-WRITTEN ENVELOPE FIXTURES ARE NOW HAND-WRITTEN FRAMES TOO. `tests/company/market/test_flex_participation.py` builds its messages from the published schema and never from the world's encoder, which is what makes the round trip evidence rather than a handshake; that property is kept one layer up -- the sender, the credential and the hand-over stamp are written out from the frame form, not produced by calling `frame_venue_message`. Their `schema_version` moved 1 -> 2, and that is a fact rather than a fixture detail: `COUNTERPARTY_REGISTRY` has both flex operators on v2 only, so a v1 line -- readable by this build -- is now refused VERSION_NOT_SPOKEN as a message from a release that does not exist. Framing the feed is what made that distinction reachable at all.\n\n  A DUPLICATE TEST NAME WAS SHADOWING A REAL CONTROL, caught by `ruff` and not by the suite. The credential test added here first carried the same name as the enrolment leg's, and Python's later definition silently replaced the earlier one: the enrolment leg's control had stopped running and the suite was green. Renamed, both run, and the two are deliberately separate nodes -- the legs reach `_verify_frame` by different call paths, and one test proving the rule once would keep passing if either path stopped calling it.\n\n  LANDED: `_frame_feed` in `sim/flex_dispatch.py`\n  LANDED: `handed_over_at` required on all four `*_over_wire` legs in `sim/flex_dispatch.py`\n  LANDED: the framed + operator-checked `observe_response_wire` in `company/market/flex_participation.py`\n  LANDED: `_hand_over_clocks` in `background/flex_dispatch_triad.py`\n  LANDED: `test_every_message_on_BOTH_single_venue_feeds_is_SIGNED_by_the_venues_operator` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_STACKED_feed_carries_TWO_DIFFERENT_signers_in_ONE_list` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_feed_may_not_be_handed_over_without_saying_WHEN` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_feed_for_a_venue_NOBODY_OPERATES_cannot_reach_the_wire` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_an_UNFRAMED_settlement_line_is_REFUSED_however_well_formed_it_is` in `tests/company/test_flex_participation.py`\n  LANDED: `test_an_UNREGISTERED_sender_cannot_tell_this_company_it_was_PAID` in `tests/company/test_flex_participation.py`\n  LANDED: `test_a_KNOWN_participant_that_cannot_PRESENT_its_credential_is_refused_on_the_FEED` in `tests/company/test_flex_participation.py`\n  LANDED: `test_a_REGISTERED_participant_may_not_SETTLE_a_venue_it_does_not_OPERATE` in `tests/company/test_flex_participation.py`\n  LANDED: `test_the_INSTRUCTION_feed_is_checked_TOO_and_not_only_the_money_one` in `tests/company/test_flex_participation.py`\n  LANDED: `test_MUTATION_the_operator_table_has_NO_DEFAULT_on_the_FEED_leg` in `tests/company/test_flex_participation.py`\n  LANDED: the root-parameterised `_response_decode_sites` and its rebuilt mutation test in `tests/company/interfaces/test_wall_protocol.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's eight files copied in and only the named part swapped -- never on the shared worktree. The unmutated tree is the null control and was re-established after every mutation rather than assumed: 291 passed, and 291 passed again at the end. M1, the feed leg returned to a bare `decode_response` with its \"sender\" taken from the message the way the enrolment leg used to take its venue: 39 failed, 252 passed -- the six new company-side refusals, the eight framed-fixture tests, both ratchet nodes and the whole live L2/L3 loop, which is the correct blast radius for un-framing a leg the running loop crosses. M2, the wrong-operator refusal removed with the frame intact: 3 failed, 288 passed -- exactly the three authorisation tests, and nothing else, so the frame and the authorisation are separable belts rather than one belt tested twice. M3, that same refusal made FAIL-OPEN on a venue the company holds no operator for (`if expected_operator is not None and ...`): 1 failed, 290 passed, redding ONLY the no-default test -- which is what makes that test the fallback's own control rather than a copy of M2's, since the refusal is otherwise intact and still fires. M4, the whole feed signed by ONE participant: 15 failed, 276 passed -- the two-signer test, the unoperated-venue test and every L3 node, and NOT the L1/L2 single-venue ones, which is precisely the shape that says a single-venue seam could not have caught this.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because every refusal above would also pass on a seam that refused everything. The unframed-line test takes the bare envelope OUT of a frame the world really built, so the accepted and refused messages differ by the frame and nothing else, and asserts the framed one crosses. The wrong-operator test asserts the untouched feed is accepted first and only then moves the signer. The unoperated-venue test emits the same feed at an operated venue cleanly. `test_a_feed_may_not_be_handed_over_without_saying_WHEN` asserts each leg WITH a stamp returns messages, so the TypeError is the missing argument and not a broken leg. The ratchet's mutation asserts the real tree has no overlap, so its green is the scanner and not the tree.\n\n  THE INSTRUMENTS, none of them edited here, each run in TWO detached worktrees -- one at clean HEAD, one carrying this pass -- rather than on the shared tree, where `docs/reports/run_output_latest.json` is uncommitted and moves census channels D and F. `tools.wall_channel_census`: IDENTICAL on every channel, exit 0 both times, including the pre-existing `paid down on C_envelope (1)` line. Identical is the correct reading: the census scores whether both roles of a seam are live and whether a version still means what it says, and a transport frame around an unchanged envelope is neither. `tools.epistemic_verifier --all`: PASS on 544 files, both trees. `tools.wall_crossing_dispositions`: OK both trees, 6 live crossings (4 direct, 2 indirect via a bridge package), 91 ruled (cut 85, owed 6, grandfathered 0) -- this landing creates no wall crossing and rules none away. `tools.company_network_isolation`: IDENTICAL, exit 1 at HEAD and exit 1 here -- the four frozen routes, unchanged.\n\n  EVIDENCE: tests/sim/test_flex_dispatch.py 53 passed (49 at HEAD, 4 added); tests/company/test_flex_participation.py 28 passed (22 at HEAD, 6 added); tests/company/market/test_flex_participation.py 14 passed (unchanged count, every fixture reframed); tests/company/interfaces/test_wall_protocol.py 165 passed; tests/background/test_flex_dispatch_triad.py 30 passed; 3379 passed across the downstream consumers (tests/interface, tests/company/interfaces, tests/company/market, the payment observation consumer, the payment seam adapter, the wall channel census and the susceptibility wire); the four mutations above with the figures given; `ruff check` clean on all eight changed files.\n\n  A RED THAT IS NOT MINE, RESOLVED BEFORE REACTING TO IT. `tests/architecture` reports 5 failed, 286 passed, 1 skipped: two nodes in `test_no_committed_store_claims_an_unlanded_falsifier.py` and three ruff-ratchet nodes in `test_static_quality_ratchet.py`. All five fail IDENTICALLY in a detached worktree at clean HEAD with none of this pass's files present -- measured on both trees, 137s and 136s, same five names -- so they are pre-existing and another lane's, the same five passes 60 and 61 recorded, and the ruff one matches this project's own filed finding that the ratchet is red at HEAD. Filed, not fixed (SELF_INTERRUPT_DISCIPLINE).\n\n  WHAT DID NOT CHANGE. NO PUBLISHED FIGURE MOVED and none was recomputed: nothing this pass touches produces a figure, and `test_TRANSPORT_DOES_NOT_MOVE_THE_BELIEF` still holds -- two companies reading the same settlement run, one as objects and one as framed bytes, agree to the last float. The L2 and L3 gaps read exactly what they read before. `file_scope` gained ONE file, `tests/company/market/test_flex_participation.py`: its fixtures had to be reframed and the atom's scope named the module's other test file only.\n\n  WHAT REMAINS. (a) Q13's last leg: `company/comms/susceptibility_estimator.py`, the only bare response decode left in `company/**` and now the only entry in `_BARE_CROSSING_SITES`. Its production module is outside this atom's `file_scope` and framing it means giving `simulation/conversation_response.py` a participant identity, which is a wider change than this one. (b) The feed reader's own book-anchored refusal, described above. (c) There is still no cryptography anywhere on this wall: what is modelled is the REFUSAL and the shape of a participant proving itself, not SMKI/DIP signing. (d) Give the switch exchange a production caller -- pass 61 measured `CoSProcess` as having none at all, so wiring it to the register would join two dark things, and that measurement stands. (e) Q5's no-response horizons at 1 min / 24 h / 5 working days, which `crossing_silence` answers in part and which no flex feed is aged by yet.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-61 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half. The target decision recommended at passes 38-61 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-22 pass 63 LAND, level HELD at 2, loop_stage stays build. PASS 62 IS COMMITTED; THE RUN OF PASSES LEAVING THEIR OWN WORK IN THE SHARED TREE ENDS AT SIX. This pass added no production byte and is not a build pass -- it is the landing pass 62 did not perform, written so the next seat does not re-measure the same dirty tree a seventh time. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: the tick drew EP6 from the map at HEAD 973aa9ac6 and landed at 4175424cc.\n\n  WHAT WAS FOUND. Pass 62's row was present in the live store describing eight touched files, a four-mutation R15 battery and a 291-passed null control, and NONE of it was in any commit. The store roll was half-written in the same way pass 56 recorded for pass 55: the live store had already been trimmed to four rows while `archive/EP6_wall_protocol_typing.045.yaml`, holding the two rolled rows (passes 56 and 57), sat UNTRACKED. The map's `simplifications_count` had already moved 56 -> 57.\n\n  THE NULL CONTROL WAS RE-RUN AT THIS TICK RATHER THAN INHERITED, because pass 62's figure was measured at a HEAD that no longer existed: 291 passed across `tests/sim/test_flex_dispatch.py`, `tests/background/test_flex_dispatch_triad.py`, `tests/company/test_flex_participation.py`, `tests/company/market/test_flex_participation.py` and `tests/company/interfaces/test_wall_protocol.py` -- reproducing pass 62's number to the digit at a different base. The four mutations were NOT re-run and this pass does not claim them; they are pass 62's evidence, recorded in pass 62's row, and re-running them would have checked pass 62's code against pass 62's claim a second time rather than the only thing that had changed.\n\n  PASS 62'S CODE IS IN COMMIT 4175424cc, put there by `tools.surgical_land` over ten paths at gate-rc 0, receipt checked with `--verify` and pushed to origin. This row deliberately does NOT restate that as a shouted landing claim, and the reason is the control that refused this commit's first attempt: `tools.record_landing_claim_check` reads a claim as an assertion about THE TREE THE COMMITTING PASS CARRIES, and this pass carries no production byte -- the code is one commit behind it. A claim form here would have been unfalsifiable in exactly the way the checker exists to stop, since the evidence for it is a different commit's tree. The falsifiable form is the commit id, which git can be asked about directly. TEN paths and not eleven, which is the whole of the next paragraph.\n\n  THE MAP HUNK WAS ALREADY GONE, AND THAT IS A FINDING RATHER THAN AN ACCIDENT OF TIMING. Between this tick's first and second reads of `git status`, `docs/design/maturity_map.yaml` moved from worktree-modified to STAGED, and the routine publish commit 87eed63cc (`Auto-process run complete`) carried pass 62's map hunk away inside it. So 87eed63cc declares `simplifications_count: 57` against 56 notes present in that tree: RED on the count invariant, gated, committed and PUSHED. It is healed at 4175424cc, which carries the store file and the untracked chunk and finds the map already correct. `process_run_complete.py:3970` stages the map deliberately and by name so the reconciler's atom_status inbox fold lands with its run, and cannot tell that fold from any other lane's uncommitted map edit. Recorded as a SECOND MEASURED INSTANCE on `WORKER_FINDING_A_STORE_COUNT_INVARIANT_IS_GREEN_ON_THE_TREE_AND_RED_ON_THE_COMMIT_2026-08-19.md` (landed ccf61ad60), appended rather than minted as a new class doc per that finding's own instruction. Queued, not fixed on sight: the repair is the class door and is sequenced behind its sibling findings deliberately.\n\n  WHY THE COUNT INVARIANT WAS CHECKED AT THE COMMIT AND NOT ON THE TREE, since that is the only reason the above was seen at all: the store contract's control runs in the working tree, where the roll was complete and everything was green. At 4175424cc the committed tree reads map 57 against 53 archived + 4 live = 57. Green where it counts.\n\n  WHAT REMAINS is pass 62's own list, unchanged and not restated here, plus the item pass 62 named as owed on the leg it framed: the module-level feed readers still do not ask whether this company ever ENROLLED at the venue named, because that answer lives in `FlexEnrolmentBook` which they do not hold. The world refuses an unregistered dispatch at emission (`UnregisteredDispatch`, pass 57) and the harness scores `settlement_solicited` downstream, so the hole is covered from both ends and not from the reader's own side. inferred: nothing in this pass tested that coverage; it is pass 62's reading, carried forward as owed rather than as closed."
- "2026-08-22 pass 64 BUILD, level HELD at 2, loop_stage stays build. BOTH BELTS ON THIS FEED ANSWERED \"WHO SENT THIS\" AND NEITHER ANSWERED \"DID WE ASK\". Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 793c5808b -- pass 63's landing -- with all five touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing, on a shared tree carrying 480+ other-lane modifications throughout. HEAD moved to ea3f038d1 (a routine publish commit) mid-pass; none of the five was touched by it.\n\n  WHICH ITEM, AND IT IS THE ONE PASSES 62 AND 63 BOTH NAMED AS OWED. Pass 62 closed by writing \"WHAT THIS LEG STILL DOES NOT ASK ... whether this company ever ENROLLED at the venue named. That answer lives in `FlexEnrolmentBook`, which the module-level feed readers do not hold\"; pass 63 carried it forward verbatim. `python3 -m tools.discovery_pass_ceiling` reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. The level is HELD at 2 for the reason the instrument gives and not for lack of work: Q9 and Q15 need an act in a RESERVED class.\n\n  THE DEFECT, MEASURED BEFORE A LINE WAS WRITTEN. `observe_response_wire` had two belts and both are about identity: `WallProtocolError` asks whether the participant is who it says, `WrongVenueOperator` asks whether that participant runs the market it is speaking for. The system operator satisfies both -- it is registered, its credential verifies, and it really does run the balancing mechanism. `test_THE_DEFECT_a_correctly_signed_line_for_a_unit_we_never_enrolled_was_BOOKED` reproduces the state as it stood: a settlement line whose only alteration is the unit_id, sent inside an untouched and genuine frame, decodes and hands back `utilisation_payment_gbp > 0`. Nothing was forged. The company had no way to say \"we never registered that\".\n\n  THE EVIDENCE IS THE BOOK, AND IT IS HELD BEFORE THE MESSAGE ARRIVES. `FlexEnrolmentBook.observe_feed` runs the transport read unchanged and then `_admit` against `held_registrations()`. That set is keyed off `_references` (written only when an acceptance passed every belt in `observe_outcome`) and read out of `_submitted` (what we SENT). Taking the coverage off the acceptance instead was rejected on the seam's own evidence: `FlexEnrolmentOutcome` carries no window AT ALL, deliberately, so the venue cannot decide what this company believes it is available for -- the same reasoning `MisroutedOutcome` records one leg earlier.\n\n  THREE THINGS MUST LINE UP -- UNIT, VENUE AND WINDOW -- and each omission is a real half-implementation rather than a hypothetical. Unit alone: a stacked party registered at one venue becomes dispatchable at every other, which is the exact multi-venue mistake L3 exists to model. Unit+venue with no window: one registration ever made buys standing for all time. Containment and not overlap: a call straddling the edge of a declared window is refused, because a party is obliged for the window it declared and a half-covered call is one it could not have delivered in full.\n\n  SUBMITTED IS NOT HELD, and this is the mutation the design would most naturally get wrong. An enrolment sent and unanswered, or answered with a refusal, confers no standing. `_enrolled(accept=False)` builds the discriminating fixture: the venue registers the unit and emits the identical statement, and the only difference between the two books is whether the answer was ever read. An implementation anchored on `_submitted` passes every other node in this battery.\n\n  THE ORDER IS LOAD-BEARING AND HAS ITS OWN NODE. The book is asked LAST. A reader that consults its own registrations before authenticating has already done an unknown participant's work, and leaks which registrations are held through which forgeries it bothers to parse. `test_the_TRANSPORT_is_checked_BEFORE_the_book_and_the_order_is_load_bearing` requires reason code UNKNOWN_SENDER on a message that fails both, which a bare `raises` could not tell from the wrong answer.\n\n  WHAT THIS CANNOT DO, stated rather than left to be discovered: it cannot refuse a well-formed forgery naming a registration the company DOES hold. That message is stopped, if at all, by the credential the frame demands. The two belts are complementary and neither contains the other, which is why `UnheldRegistration` is a separate type from `WrongVenueOperator` and not a widening of it.\n\n  FIVE MUTATIONS, RUN OUT OF PROCESS AND AGAINST THE SHIPPED MODULE (`/tmp/ep6p64_mutations.py`, monkeypatching the real class so nothing on the shared tree was edited to run them). M1 no book check at all -> 6 RED. M2 anchor on `_submitted` -> 1 RED, and it is the accepted-vs-submitted node. M3 no window containment -> the window node RED. M4 unit-only, venue-blind -> the cross-venue node RED. M5 book consulted before the transport -> the order node RED. M1 correctly leaves the ORDER node green, because with no book check the transport still refuses an unknown sender. TWO EXTRA REDS UNDER M3 ARE HARNESS ARTEFACTS AND NOT EVIDENCE: the mutation stubs are simpler than the shipped `_admit` -- one formatted the venue as `FlexVenue.DSO_LOCAL_CONSTRAINT` where the test asserts the wire value, the other has no None guard and raised AttributeError on the anchorless payload. Named here rather than polished away, because a battery whose spurious reds are unexplained is a battery nobody can read.\n\n  THE NULL CONTROL REPRODUCES PASS 62'S FIGURE TO THE DIGIT AT A DIFFERENT BASE. 299 passed across `tests/sim/test_flex_dispatch.py`, `tests/background/test_flex_dispatch_triad.py`, `tests/company/test_flex_participation.py`, `tests/company/market/test_flex_participation.py` and `tests/company/interfaces/test_wall_protocol.py` -- pass 62's 291 plus this pass's 8 new nodes, arithmetic that only closes if nothing else moved. `python3 -m tools.epistemic_verifier` PASS. Both live loops re-run end to end: L2 gap 0.7378265373677676 with `settlement_solicited` True, L3 gap 0.716546267629859 with `feeds_solicited` True.\n\n  THE BELT IS ON THE RUNNING PATH AND NOT BESIDE IT, which needed its own construction because the world refuses first. `sim.flex_dispatch._require_registered` stops an unenrolled line reaching the wire, so an honest world never exercises the company's belt and a test that merely ran the loop would prove nothing. `test_the_COMPANY_still_refuses_the_statement_when_the_WORLD_does_not` removes the venue's teeth -- which is every real venue from this company's side, since no counterparty checks our registrations for us -- settles a unit nobody enrolled, and requires `measure_l2` to raise `UnheldRegistration`. Its null control is the same toothless world settling the unit we DID enrol, which completes.\n\n  A NEW BELT KILLED TWO EXISTING FALSIFIERS, AND THAT IS THE FINDING OF THIS PASS. `test_the_solicited_OBSERVATION_can_still_be_False` and its L3 twin exist to prove `settlement_solicited` / `feeds_solicited` are not always-green. Both mutated by injecting a stranger's unit or an unjoined venue ABOVE the reader -- and this pass's belt now refuses exactly that, so each mutation would have been stopped by the new belt and reported as evidence about the downstream observation. The observations would have been unfalsifiable-by-mutation while their tests stayed green. Repaired by moving both mutations BELOW the belt: they now wrap the real read and relabel its result. The L3 one needed a further discrimination that used to be free -- the old target was reached by the instruction feed alone, the book reader serves both, and an undiscriminated relabel mis-keys the settlement lines into `learn_delivery_ratio_from_lines`, which raises before the observation is computed. Queued as a general shape, not fixed on sight: A CONTROL ADDED UPSTREAM OF AN OBSERVATION SILENTLY RETIRES THAT OBSERVATION'S FALSIFIER, and nothing in this build looks for it -- the tests stay green either way, which is the whole difficulty.\n\n  THE UNANCHORED READERS ARE NO LONGER IMPORTED INTO THE TRIAD, replaced by a comment saying why. `observe_response_wire` / `observe_settlement_wire` in that namespace would be a name a future call site could reach for, and were the name four mutation tests were still patching after the live path moved off them -- the patch would have raised AttributeError, which is the loud failure this pass wanted, but a decoy left behind is how a control goes on passing against nothing.\n\n  THE RUFF RATCHET IS RED AND IT IS NOT THIS PASS'S RED. Verified against a pristine HEAD worktree: E401 21->22, E402 176->177, E741 108->111, F541 27->28, F841 128->132 at HEAD ea3f038d1 with none of this pass's changes present. This tree shows the same four minus F541 (fixed by another lane's uncommitted work). `ruff check` on all five touched files: clean. Already filed as `WORKER_FINDING_THE_RUFF_RATCHET_IS_RED_AT_HEAD_AND_ONLY_SOME_COMMITS_CAN_SEE_IT_2026-08-14`; not appended to, because this is that finding's existing behaviour and not a new instance.\n\n  WHAT REMAINS. (a) The seam publishes `flex_enrolment_book()` and the harness is its only caller; no company-side consumer outside the triad reads a flex feed today, so the belt covers every live crossing there is and would not cover a new one automatically -- a reader that called `observe_response_wire` directly would be unanchored again, and nothing refuses that. `tools.wall_channel_census` classifies whole FILES and cannot see it. (b) Q13's other leg, `company/comms/susceptibility_estimator.py`, is still untouched and still outside this atom's `file_scope`. (c) Pass 62's own list is unchanged and not restated here. inferred: (a)'s exposure is a reading of the call graph at this HEAD, not something this pass tested."
- "2026-08-22 pass 65 BUILD, level HELD at 2, loop_stage stays build. PASS 64 BUILT THE BELT AND NOTHING REFUSED THE NEXT READER TO WALK PAST IT. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 8deb45092 -- pass 64's landing -- with all three touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing (`git diff HEAD` on the three carries 737 insertions and 1 deletion, every hunk this pass's), on a shared tree carrying 500+ other-lane modifications throughout.\n\n  WHICH ITEM, AND IT IS THE ONE PASS 64 CLOSED BY NAMING. Pass 64's WHAT REMAINS (a), verbatim: \"a reader that called `observe_response_wire` directly would be unanchored again, and nothing refuses that. `tools.wall_channel_census` classifies whole FILES and cannot see it.\" It could not be closed in that pass because a control over who bypasses a belt needs the belt to exist first. `python3 -m tools.discovery_pass_ceiling` reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. The level is HELD at 2 for the instrument's reason and not for lack of work: Q9 and Q15 need an act in a RESERVED class.\n\n  THE DEFECT, AND IT IS A DEFECT IN THE INSTRUMENT RATHER THAN IN THE COMPANY. `FlexEnrolmentBook.observe_feed` is correct and mutation-proven. `observe_response_wire` and `observe_settlement_wire` are still importable, still correct at the transport level, and still answer a strictly weaker question. A call site that reaches for one of them is back in the state pass 64 found -- a correctly signed settlement line for a unit this company never enrolled, decoded and paid -- and NOTHING IN THE TREE MOVES: no import edge (channels A/B see the same two modules), no bypassed envelope (channel C is satisfied by either path), no version mismatch (the version is on the frame and the frame is genuine). Every existing control stays green through the whole failure.\n\n  SO THE UNIT IS THE CALL SITE, which is the one unit none of channels A-F can use. They are keyed on modules, seams, classes and published keys, and both paths through this feed live in ONE FILE: `observe_settlement_wire` and `FlexEnrolmentBook.observe_settlement_feed` are two spellings of the same read in the same module. A file-keyed control cannot express \"this function may read the wire and that one may not\".\n\n  THE READERS ARE DERIVED AND NOT LISTED, which is the half that answers the second-subject shape. Seeded from the codec's own decode entry points -- `DECODE_NAMES`, shared with channel C's transport question so the two cannot drift apart -- and closed under \"calls one of these\". Measured on the live tree the fixpoint returns exactly (`observe_response_wire`, `observe_settlement_wire`); the second decodes nothing itself and is a reader because it composes the first. A third reader added tomorrow is covered the day it lands. MODULE-LEVEL is the load-bearing word and it is the module's own: \"that question needs a registration the company HOLDS, which a module-level function does not have.\"\n\n  THE EXEMPTION IS EARNED, NOT NAMED. A call site inside the feed's module is conformant on two grounds only: its enclosing function is itself a bookless reader (transport composing transport, and its own call sites are then checked by the same rule), or it is a method of the declared book class WHOSE BODY ALSO CALLS `_admit`. Not \"is called observe_feed\". Stripping `self._admit(...)` out of that method -- the cheapest possible way to delete pass 64's belt, leaving every name, signature and caller in place -- reds this control, and that is its own test node. A call site outside the module is unanchored full stop, which is the module's stated contract; a call at module scope inside no function is unanchored, fail-closed.\n\n  MEASURED BEFORE ARMING, at HEAD and in the tree this commit creates, rather than hoped: 2 bookless readers, 2 call sites, both anchored, 0 unanchored, at both `rev=HEAD` and `--worktree`. That is the condition this file has now written five times -- a check becomes a gate in the same commit that makes it satisfiable -- so it gates from its first commit in `main()`'s exit code and in `tools/pre_commit_test_gate.py::_wall_channel_census_check`. Cost measured too, because a gate step runs on every commit touching a `.py`: 1.9s at HEAD, 1.8s on the worktree.\n\n  TWENTY-TWO NEW NODES, RUN IN-SUITE AGAINST SYNTHETIC TREES so the proofs do not depend on what the live tree holds today. FIVE MUTATIONS that are new or moved CALL SITES in a tree where nothing else changes: M1 an outside module importing the bare transport function -> RED naming file, line and enclosing function. M2 `self._admit(...)` stripped out of `observe_feed` -> RED. M3 a second class in the feed's own module reading the wire -> RED. M4 a read at module scope -> RED. M5 a NEW module-level reader (green, transport composing transport) and then an outside caller of THAT function -> RED, which proves the derived reader set carries the rule to the function it just admitted. FIVE FAIL-CLOSED nodes, each a different way this could go quiet: feed module gone, book class gone, anchor method gone, readers renamed out from under a name-matched walk, and readers that nothing calls (an empty denominator, which is what a walk that has silently stopped matching also looks like). THREE NULL CONTROLS that move the sample and not the law: the SAME new outside consumer of the SAME feed going through the book -> green (without it, \"reds on an unanchored caller\" and \"reds on any caller it has not seen\" are the same experiment); a `tests/` file calling the bare reader -> green, and it must be, because pass 62's and pass 64's belts are PROVEN by calling it with a stranger's unit -- a control that refused that would make the transport belt unfalsifiable; transport composing transport -> green. Then at the GATE: null control passes and names the figure, mutation refuses carrying the diagnostic payload, and the raising check refuses (R15 FAIL-SILENT).\n\n  THE FIFTH HALF HAD TO BE PINNED IN THE FIXTURE THAT ARMS IT, and the fixture's own docstring predicted this for the fourth time. `_pin_the_other_halves` forces every half of the gate step green except the one under test; left real, this one runs `head_export` against the fake index tree `\"0\"*40`, raises, hits its own fail-closed branch, and every NULL CONTROL in the file fails while looking like a defect in the half it was aimed at.\n\n  THE SECOND SUBJECT IS COMPUTED AND PRINTED, never gated. `unbooked_transport_readers` enumerates, from the same decode entry points, the business-side modules that read a wall response and have no book to anchor it against: `company/billing/payment_observation_consumer.py` and `company/comms/susceptibility_estimator.py`, both named in a live test so a third appearing is a red rather than a silent widening of what this control does not cover. NOT frozen, by this module's own A/B rule: enrolment is what a flex feed can be anchored against and those two have no equivalent holding today, so freezing the list would red ordinary commits against a subject whose owner cannot fix them. The codec module is excluded -- it IS the decoder, and a decoder decoding is not a crossing (R15 TAUTOLOGY).\n\n  NULL CONTROL ON THE SUITES. `tests/tools/test_wall_channel_census.py` 229 passed (207 nodes at HEAD plus this pass's 22, arithmetic that only closes if nothing else moved); `tests/tools/test_pre_commit_test_gate.py` 38 passed -- run because the gate is the second file this pass edits and the gate selects tests by filename stem. `python3 -m ruff check` clean on all three touched files. `python3 -m tools.epistemic_verifier` PASS (580 files). `python3 -m tools.wall_channel_census` exits 0 with the new line printed.\n\n  WHAT THIS CANNOT DO, stated rather than left to be discovered. It matches by NAME, so a read through an alias or a computed getattr is invisible (a lower bound, the same limit `_literal_key_reads` and `wire_call_sites` carry) and an unrelated function elsewhere sharing one of these names would be reported (an upper bound, made legible by the report naming the file). It says nothing about whether `_admit` is CORRECT -- pass 64's five mutations are what say that; this says only that the call is there. And it covers one feed, because one feed has a book.\n\n  WHAT REMAINS. (a) `company/comms/susceptibility_estimator.py` still decodes on the WEAKER entry point (`decode_response`, not `decode_framed_response`), so it is unbooked AND unframed -- Q13's other leg, still outside this atom's `file_scope`, and now the one item on the list with a measured instrument pointing at it. (b) The payment consumer is unbooked because no equivalent holding exists to admit against; what a payment \"enrolment book\" would be (the mandate register) is a design question, not a build one. (c) Pass 62's and pass 64's own lists are unchanged and not restated here. inferred: (a)'s exposure is a reading of the call graph at this HEAD, not something this pass tested."
- "2026-08-22 pass 66 LAND, level HELD at 2, loop_stage stays build. THE PUBLISHER TOOK THE MAP HALF OF PASS 65'S COUNT BUMP AND LEFT BOTH STORE HALVES BEHIND, AND ITS OWN GATE COULD NOT HAVE SEEN IT. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 33a2fb82a on entry, landing on 260aad3e2, commit `75b1745b0`.\n\n  WHY THIS PASS EXISTS. Pass 65 wrote its row and its three files and committed none of them: at entry `docs/design/simplifications/EP6_wall_protocol_typing.yaml` was rolled (pass 60's row moved out, pass 65's appended) with the archive chunk `.047` still UNTRACKED, `docs/design/maturity_map.yaml` carried the bump 59 -> 60, and `git diff HEAD` on the three code files carried 738 insertions and 1 deletion. That is the sixth EP6 pass in this run to leave its work in the shared tree, and pass 63 already wrote the same sentence. This pass took the payable half by landing it, not by adding to it.\n\n  THE WORK WAS RE-MEASURED BEFORE IT WAS TRUSTED, because a row is a claim and not a receipt (R7). `tests/tools/test_wall_channel_census.py` and `tests/tools/test_pre_commit_test_gate.py` together: 267 passed in 64s, which is exactly pass 65's claimed 229 + 38 and closes only if nothing else moved. `git diff` on `tools/pre_commit_test_gate.py` is 28 lines and every hunk is pass 65's; the map diff is one hunk and it is EP6's count; the census and its test are new-file additions. So no path needed a content swap and the landing was a plain pathspec.\n\n  THE FIRST LANDING GATED GREEN AND COMMITTED NOTHING. `tools.surgical_land` builds the resulting tree, runs the repo's own pre-commit hook against it, and only then takes `tree_lock` to compare-and-swap HEAD -- with a 60-second acquisition timeout. `process_run_complete.py` held the lock through its own commit, the acquisition timed out, and a multi-minute gate run was discarded with `TreeLockTimeout` and a traceback rather than a retry. Observed, with the traceback in hand; the second attempt (wait for the lock, then land) took it on the first try. inferred: this is a general shape rather than today's luck -- the gate is minutes and the lock window is 60s, so any publish cycle overlapping a landing loses the landing, not the publish.\n\n  AND WHILE THAT ATTEMPT WAS DYING, THE PUBLISHER SPLIT THE INVARIANT. `process_run_complete.py`'s commit pathspec names `docs/design/maturity_map.yaml` outright, so it adopted this lane's uncommitted `simplifications_count: 60` and committed it as `260aad3e2` -- without the live store row and without the untracked archive chunk, which were not in its pathspec and could not have been. MEASURED on a clean extract of that commit rather than inferred from the symptom: map declares 60, store holds 59. `main` carried a red tree-wide count invariant for exactly the span of one commit, closed by `75b1745b0`, whose own stat shows FIVE files and not six -- the map hunk was already gone when the landing ran, which is how a landing can be correct and still not contain the change it was written to carry.\n\n  THE PUBLISHER'S GATE CANNOT SEE THIS CLASS, and that is the point rather than a complaint. Its count-invariant nodes (`tests/design/test_atom_notes_store.py`, `tests/design/test_simplifications_store.py`) were running in the WORKING TREE at the moment of the commit, and in the working tree both halves were present and the count was 60/60. The commit it was creating held one half. That is precisely the tree-not-the-commit class `surgical_land` exists to close, with one addition worth naming: the count invariant is the case where the two halves live in DIFFERENT FILES, so a pathspec that takes one and not the other does not merely fail to notice a split -- it manufactures one. Commit `ccf61ad60` is the same event under a different lane, and `793c5808b` is the same event under this one.\n\n  WHAT THIS PASS DID NOT DO. It added no control and moved no level. Q9 and Q15 still need an act in a RESERVED class, so 2 -> 3 is unreachable in this epoch whatever is built; `python3 -m tools.discovery_pass_ceiling` still reports the atom in its fourth state and still instructs explicitly NOT to record `infeasible_here`.\n\n  WHAT REMAINS. (a) Pass 65's list is unchanged and stands: `company/comms/susceptibility_estimator.py` still decodes on the weaker entry point (`decode_response`, not `decode_framed_response`), unbooked AND unframed, Q13's other leg, still outside this atom's `file_scope`. (b) The payment consumer is unbooked because no equivalent holding exists to admit against. (c) NEW, and it is harness work rather than EP6 work, so it is named here and not taken: `surgical_land` discards a green gate on a 60-second lock timeout, and `process_run_complete.py` splits any in-flight count bump it happens to overlap. Both are queued rather than fixed on sight (SELF-INTERRUPT DISCIPLINE); neither blocks this atom."
- "2026-08-22 pass 67 BUILD, level HELD at 2, loop_stage stays build. THE LAST LIVE WALL LEG THAT NEVER ASKED WHO WAS SPEAKING, AND THE INSTRUMENT THAT COULD NOT HAVE TOLD YOU. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD ebc56959f on entry (468ce247f by landing -- the publisher committed a site/-only cycle mid-pass and touched none of these files), with all nine touched files clean against HEAD before the first edit, on a shared tree carrying 470+ other-lane modifications throughout.\n\n  WHICH ITEM, AND IT IS THE ONE PASS 65 NAMED AND PASS 66 CARRIED FORWARD. Both passes' WHAT REMAINS (a), verbatim: `company/comms/susceptibility_estimator.py` still decodes on the WEAKER entry point (`decode_response`, not `decode_framed_response`), unbooked AND unframed, Q13's other leg. `python3 -m tools.discovery_pass_ceiling` reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. The level is HELD at 2 for the instrument's reason and not for lack of work: Q9 and Q15 need an act in a RESERVED class.\n\n  THE DEFECT. `SusceptibilityEstimator.observe_wire` had a full set of DOCUMENT refusals -- exact key set, version, payload depth, a denylist of hidden traits, all mutation-proven -- and no answer at all to who handed the document over. A document cannot carry that fact. So any process that could put a well-formed conversation envelope in front of this seam had its reply folded into the company's belief about one of its own customers, and every check above stayed green while it happened. The payment seam closed this at pass 39 and the flex seam at pass 53; this was the third and last live leg. Reproduced before a line was written, and it is what mutation M1 below runs in reverse.\n\n  AND THE INSTRUMENT COULD NOT HAVE FOUND IT, which is the half worth more than the migration. `LEG_DECODE_NAME` holds BOTH spellings of each decoder in one tuple, and it has to: pass 39 proved that a census matching one name per leg reads \"the decoder was renamed\" as \"the decoder went away\" and red-lists a seam for getting STRONGER. The price of that repair, unnoticed until now, is that `decode_response` and `decode_framed_response` became INDISTINGUISHABLE to every channel in the census -- one authenticates the sender and one does not. A business module moving between them deletes the participant check while moving no import edge (channels A/B see the same two modules), bypassing no envelope (channel C is satisfied by either name), and mismatching no version (the version is on the envelope either way). Every existing control stays green through the whole failure. That is the same shape as pass 65's finding one layer up, and it is why this pass ships a control and not only a migration.\n\n  THE TWO DECODER SETS ARE DERIVED, NOT LISTED. FRAMED = the entry points in `DECODE_NAMES` that reach `_verify_frame`, by closure over the CODEC'S OWN CALL GRAPH; BARE = the remainder, and `DECODE_NAMES` is itself derived from `LEG_DECODE_NAME`, so adding a leg adds its decoders to this question on the day it lands. A fourth framed decoder is covered the day it lands, and -- the case a list can never express -- a framed decoder that keeps its name and QUIETLY STOPS VERIFYING is RECLASSIFIED as bare by the same walk. That is mutation M4, and no list-based control has a green-to-red transition for it.\n\n  SCOPED TO `BUSINESS_DIRS`, and the exclusion is earned rather than convenient. `sim/flex_dispatch.py:1072` calls `decode_request`: the WORLD reading what the COMPANY sent it, the opposite direction and a different participant's problem. It is a NULL CONTROL node, not a silence. The codec module is excluded for `unbooked_transport_readers`' reason -- `decode_framed_response` calls `decode_response`, and a decoder decoding is not a crossing (R15 TAUTOLOGY).\n\n  MEASURED BEFORE ARMING, and this time the subject was REAL rather than synthetic. At HEAD ebc56959f the business trees held SEVEN decode call sites across three modules and exactly ONE was bare; `authenticated_decode_conformance_at(rev='HEAD')` returns `ok=False` naming `company/comms/susceptibility_estimator.py:420 -> SusceptibilityEstimator.observe_wire -> decode_response`, and returns `ok=True` on the tree this commit creates. So the control's own green-to-red transition is demonstrated on the repository and not only on a fixture, which is the strongest form of the condition this file has now written six times: a check becomes a gate in the same commit that makes it satisfiable. It gates from this first commit in `main()`'s exit code and in `tools/pre_commit_test_gate.py::_wall_channel_census_check`.\n\n  TWENTY-ONE NEW CENSUS NODES (`tests/tools/test_wall_channel_census.py` 229 -> 250, arithmetic that only closes if nothing else moved), run in-suite against synthetic trees so the proofs do not depend on what the live tree holds today. FOUR MUTATIONS, each moving a call site between the two spellings in a tree where nothing else changes: M1 the shipped reader moved to the bare decoder -> RED naming file, line and enclosing function. M2 a NEW business module arriving on a bare decoder while the shipped one stays right -> RED (a per-file question would have credited the tree for the file that was already correct). M3 a bare decode at MODULE SCOPE, inside no function -> RED, fail-closed. M4 the codec's `decode_framed_response` stops calling `_verify_frame` while keeping its name, signature and every caller -> RED, with the other two framed decoders still verifying as the null control. FIVE FAIL-CLOSED nodes: codec unreadable; `_verify_frame` renamed away; the verifier reaching no decoder; EVERY decoder framed (the vacuous case -- a control with no detectable violation is worse than none, so it raises rather than reporting clean, with a null control asserting the fixture really parses); and nothing business-side decoding at all (an empty denominator). FOUR NULL CONTROLS: a second FRAMED business reader -> green; the world side calling `decode_request` -> green and out of population; the codec composing its own decoders -> not counted; and the live codec still holding four bare entry points, so a green live tree is the business trees not using them rather than this control having nothing left to detect. Then at the GATE: null control passes and names the figure, mutation refuses carrying the diagnostic payload, and the raising check refuses (R15 FAIL-SILENT).\n\n  THE SIXTH HALF HAD TO BE PINNED IN THE FIXTURE THAT ARMS IT, and `_pin_the_other_halves`' docstring has now predicted this five times running -- pass 65 wrote the same sentence about the fifth. Left real, this half runs `head_export` against the fake index tree `\"0\"*40`, raises, hits its own fail-closed branch, and every NULL CONTROL in the file fails while looking like a defect in the half it was aimed at.\n\n  AN R15 NODE ELSEWHERE HAD BEEN UNFALSIFIABLE FOR TWENTY-THREE PASSES, AND THE FRAME IS WHAT REPAIRED IT. `tests/background/test_conversation_gap_ledger_wire.py::test_R15_MUTATION_a_counterparty_on_a_future_schema_is_refused_not_absorbed` was RED at HEAD -- `DID NOT RAISE` -- observed by running the file in a clean detached worktree at ebc56959f, not inferred from the symptom, and the worktree was removed afterwards. It was written when 2 was a version this build could not read; EP6 pass 44 put 2 inside `SUPPORTED_SCHEMA_VERSIONS` for the payment seam's release, and from that commit a v2 conversation response DECODED CLEAN. Its sibling in the susceptibility file was repaired the same day with `_UNSPOKEN_VERSION` and a null control; this one was not, and nothing noticed because the gate selects by filename stem and `conversation_gap_ledger.py` had not been touched since. What refuses the mutation now is the PER-COUNTERPARTY version table, which has existed since pass 44 and had NO SUBJECT on this seam until this pass gave the seam a registry row: CONTACT-PLATFORM-01 is on v1, so a v2 message from it is readable by this build and still wrong (VERSION_NOT_SPOKEN, deliberately distinct from UNSUPPORTED_VERSION -- \"wait for that participant's cutover\" and \"change the build\" are different repairs).\n\n  SEVEN NEW SEAM NODES BESIDE THE CENSUS. Company side (`test_susceptibility_estimator_wire.py` 24 -> 31): a stranger presenting a PERFECT document -> UNKNOWN_SENDER; a registered sender that cannot prove it -> BAD_CREDENTIAL; a version this participant is not on -> VERSION_NOT_SPOKEN, with a null control asserting 2 is still inside `SUPPORTED_SCHEMA_VERSIONS`; the pre-pass-67 UNFRAMED shape -> refused rather than parsed; frame key set exact in both directions; ORDER -- a stranger whose envelope is ALSO missing `schema_version` gets UNKNOWN_SENDER back, with the same broken envelope from the registered sender getting MISSING_FIELD, which is the evidence that no envelope field was read before the credential; and the mutation, RUN not asserted -- the OLD read (`decode_response(wire[\"envelope\"], ...)`) on the stranger's message folds the belief and moves the posterior, with the shipped path refusing the same bytes. World side: the handed-over message is framed and names this participant; the company holds only a FINGERPRINT (computed in the test, never read off the registry -- reading the stored value and comparing it to itself is the tautology this seam exists to refuse); `handed_over_at` has no default; non-datetime and non-envelope both refused.\n\n  NULL CONTROL ON THE SUITES. `tests/tools/test_wall_channel_census.py` 250 passed; `tests/tools/test_pre_commit_test_gate.py`, `tests/simulation/test_conversation_response.py`, `tests/company/comms/test_susceptibility_estimator_wire.py`, `tests/background/test_conversation_gap_ledger_wire.py`, `tests/company/interfaces/test_wall_protocol.py` and `tests/architecture/test_epistemic_wall_ratchet.py` together 313 passed; the three sibling seams (`test_flex_participation` x2, `test_flex_dispatch`, `test_live_payment_triad`, `test_payment_seam_adapter`, `test_payment_observation_consumer`, `test_flex_dispatch_triad`) 355 passed. `python3 -m tools.epistemic_verifier` PASS. `python3 -m tools.wall_channel_census --worktree` exits 0 with the new line printed. RUFF: every one of the nine touched files has the SAME error count in the worktree as at HEAD -- two pre-existing in `susceptibility_estimator.py`, one in `conversation_response.py`, two in `tests/simulation/test_conversation_response.py`, clean elsewhere -- so the ratchet does not move and none of those findings is this pass's.\n\n  WHAT THIS CANNOT DO, stated rather than left to be discovered. It matches by NAME, so a decode through an alias or a computed getattr is invisible (lower bound) and an unrelated function elsewhere sharing one of these names would be reported (upper bound); the report names file, line and enclosing function so the second is legible. It says nothing about whether `_verify_frame` is CORRECT -- the seam batteries say that; this says only that the call reaches it. And it is scoped to what the company ACCEPTS: the company's own OUTBOUND messages are unframed and this control is silent about them.\n\n  WHAT REMAINS. (a) NEW, and it is this pass's own bound: the company's outbound leg carries no frame, so a counterparty cannot authenticate the COMPANY. Q13 is symmetric and only one direction is answered; the other needs the world side to hold a fingerprint of a company credential, which is a design question about who issues it, not a build one. (b) The payment and comms readers remain UNBOOKED -- authenticated now, and still with no equivalent holding to admit a payload against; for the payment consumer that holding is the mandate register, which is design work. (c) Q2 (a first-class unsolicited-inbound primitive with its own idempotency and ordering rules), Q5 (no-response as a modelled outcome with defined behaviour at 1 min / 24 h / 5 working days) and Q14's segregation half are the payable items nobody has drawn for several passes; Q5 is the largest and has no instrument pointing at it. (d) Pass 66's harness items are unchanged and still queued, not fixed on sight (SELF-INTERRUPT DISCIPLINE): `surgical_land` discards a green gate on a 60-second lock timeout, and `process_run_complete.py` splits any in-flight count bump it overlaps. inferred: (a)'s exposure is a reading of this build's message shapes, not something this pass tested."
map_notes:
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
