e company had no way to say \"we never registered that\".\n\n  THE EVIDENCE IS THE BOOK, AND IT IS HELD BEFORE THE MESSAGE ARRIVES. `FlexEnrolmentBook.observe_feed` runs the transport read unchanged and then `_admit` against `held_registrations()`. That set is keyed off `_references` (written only when an acceptance passed every belt in `observe_outcome`) and read out of `_submitted` (what we SENT). Taking the coverage off the acceptance instead was rejected on the seam's own evidence: `FlexEnrolmentOutcome` carries no window AT ALL, deliberately, so the venue cannot decide what this company believes it is available for -- the same reasoning `MisroutedOutcome` records one leg earlier.\n\n  THREE THINGS MUST LINE UP -- UNIT, VENUE AND WINDOW -- and each omission is a real half-implementation rather than a hypothetical. Unit alone: a stacked party registered at one venue becomes dispatchable at every other, which is the exact multi-venue mistake L3 exists to model. Unit+venue with no window: one registration ever made buys standing for all time. Containment and not overlap: a call straddling the edge of a declared window is refused, because a party is obliged for the window it declared and a half-covered call is one it could not have delivered in full.\n\n  SUBMITTED IS NOT HELD, and this is the mutation the design would most naturally get wrong. An enrolment sent and unanswered, or answered with a refusal, confers no standing. `_enrolled(accept=False)` builds the discriminating fixture: the venue registers the unit and emits the identical statement, and the only difference between the two books is whether the answer was ever read. An implementation anchored on `_submitted` passes every other node in this battery.\n\n  THE ORDER IS LOAD-BEARING AND HAS ITS OWN NODE. The book is asked LAST. A reader that consults its own registrations before authenticating has already done an unknown participant's work, and leaks which registrations are held through which forgeries it bothers to parse. `test_the_TRANSPORT_is_checked_BEFORE_the_book_and_the_order_is_load_bearing` requires reason code UNKNOWN_SENDER on a message that fails both, which a bare `raises` could not tell from the wrong answer.\n\n  WHAT THIS CANNOT DO, stated rather than left to be discovered: it cannot refuse a well-formed forgery naming a registration the company DOES hold. That message is stopped, if at all, by the credential the frame demands. The two belts are complementary and neither contains the other, which is why `UnheldRegistration` is a separate type from `WrongVenueOperator` and not a widening of it.\n\n  FIVE MUTATIONS, RUN OUT OF PROCESS AND AGAINST THE SHIPPED MODULE (`/tmp/ep6p64_mutations.py`, monkeypatching the real class so nothing on the shared tree was edited to run them). M1 no book check at all -> 6 RED. M2 anchor on `_submitted` -> 1 RED, and it is the accepted-vs-submitted node. M3 no window containment -> the window node RED. M4 unit-only, venue-blind -> the cross-venue node RED. M5 book consulted before the transport -> the order node RED. M1 correctly leaves the ORDER node green, because with no book check the transport still refuses an unknown sender. TWO EXTRA REDS UNDER M3 ARE HARNESS ARTEFACTS AND NOT EVIDENCE: the mutation stubs are simpler than the shipped `_admit` -- one formatted the venue as `FlexVenue.DSO_LOCAL_CONSTRAINT` where the test asserts the wire value, the other has no None guard and raised AttributeError on the anchorless payload. Named here rather than polished away, because a battery whose spurious reds are unexplained is a battery nobody can read.\n\n  THE NULL CONTROL REPRODUCES PASS 62'S FIGURE TO THE DIGIT AT A DIFFERENT BASE. 299 passed across `tests/sim/test_flex_dispatch.py`, `tests/background/test_flex_dispatch_triad.py`, `tests/company/test_flex_participation.py`, `tests/company/market/test_flex_participation.py` and `tests/company/interfaces/test_wall_protocol.py` -- pass 62's 291 plus this pass's 8 new nodes, arithmetic that only closes if nothing else moved. `python3 -m tools.epistemic_verifier` PASS. Both live loops re-run end to end: L2 gap 0.7378265373677676 with `settlement_solicited` True, L3 gap 0.716546267629859 with `feeds_solicited` True.\n\n  THE BELT IS ON THE RUNNING PATH AND NOT BESIDE IT, which needed its own construction because the world refuses first. `sim.flex_dispatch._require_registered` stops an unenrolled line reaching the wire, so an honest world never exercises the company's belt and a test that merely ran the loop would prove nothing. `test_the_COMPANY_still_refuses_the_statement_when_the_WORLD_does_not` removes the venue's teeth -- which is every real venue from this company's side, since no counterparty checks our registrations for us -- settles a unit nobody enrolled, and requires `measure_l2` to raise `UnheldRegistration`. Its null control is the same toothless world settling the unit we DID enrol, which completes.\n\n  A NEW BELT KILLED TWO EXISTING FALSIFIERS, AND THAT IS THE FINDING OF THIS PASS. `test_the_solicited_OBSERVATION_can_still_be_False` and its L3 twin exist to prove `settlement_solicited` / `feeds_solicited` are not always-green. Both mutated by injecting a stranger's unit or an unjoined venue ABOVE the reader -- and this pass's belt now refuses exactly that, so each mutation would have been stopped by the new belt and reported as evidence about the downstream observation. The observations would have been unfalsifiable-by-mutation while their tests stayed green. Repaired by moving both mutations BELOW the belt: they now wrap the real read and relabel its result. The L3 one needed a further discrimination that used to be free -- the old target was reached by the instruction feed alone, the book reader serves both, and an undiscriminated relabel mis-keys the settlement lines into `learn_delivery_ratio_from_lines`, which raises before the observation is computed. Queued as a general shape, not fixed on sight: A CONTROL ADDED UPSTREAM OF AN OBSERVATION SILENTLY RETIRES THAT OBSERVATION'S FALSIFIER, and nothing in this build looks for it -- the tests stay green either way, which is the whole difficulty.\n\n  THE UNANCHORED READERS ARE NO LONGER IMPORTED INTO THE TRIAD, replaced by a comment saying why. `observe_response_wire` / `observe_settlement_wire` in that namespace would be a name a future call site could reach for, and were the name four mutation tests were still patching after the live path moved off them -- the patch would have raised AttributeError, which is the loud failure this pass wanted, but a decoy left behind is how a control goes on passing against nothing.\n\n  THE RUFF RATCHET IS RED AND IT IS NOT THIS PASS'S RED. Verified against a pristine HEAD worktree: E401 21->22, E402 176->177, E741 108->111, F541 27->28, F841 128->132 at HEAD ea3f038d1 with none of this pass's changes present. This tree shows the same four minus F541 (fixed by another lane's uncommitted work). `ruff check` on all five touched files: clean. Already filed as `WORKER_FINDING_THE_RUFF_RATCHET_IS_RED_AT_HEAD_AND_ONLY_SOME_COMMITS_CAN_SEE_IT_2026-08-14`; not appended to, because this is that finding's existing behaviour and not a new instance.\n\n  WHAT REMAINS. (a) The seam publishes `flex_enrolment_book()` and the harness is its only caller; no company-side consumer outside the triad reads a flex feed today, so the belt covers every live crossing there is and would not cover a new one automatically -- a reader that called `observe_response_wire` directly would be unanchored again, and nothing refuses that. `tools.wall_channel_census` classifies whole FILES and cannot see it. (b) Q13's other leg, `company/comms/susceptibility_estimator.py`, is still untouched and still outside this atom's `file_scope`. (c) Pass 62's own list is unchanged and not restated here. inferred: (a)'s exposure is a reading of the call graph at this HEAD, not something this pass tested."
map_notes:
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
