atom_id: EP6_wall_protocol_typing
simplifications:
- "2026-08-20 pass 40 BUILD, level HELD at 2, loop_stage stays build. THE STAND-IN IS NOW REFUSED, AND THE OTHER HALF OF Q14 IS NOT BUILT. Pass 39 left six payable items and recorded that Q14 had become cheap: the registry is the place a stand-in participant can be DECLARED as one, so \"what stops a stand-in configuration reaching production\" turns into a startup assertion over a field that exists. That is what this pass built, and it is HALF of what the reviewer asked for -- the half that is now real is stated below, and the half that is not is stated with it, because Q14's own answer_needed names two legs and greening it on one would be the level certified by the absence of its own check. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 4db804458, worktree, with all touched files carrying only this pass's hunks (`git status --porcelain` on the file_scope was empty before the first edit -- pass 38's lesson that a landing defect and a concurrent-lane defect read identically from a record).\n\nWHAT THE DEFECT WAS, and it is not the one the question sounds like. The obvious reading of Q14 is \"can the stand-in be reached from production\", and the answer to that has always been yes-it-cannot: `simulation/payment_seam_adapter.py` holds the stand-in's credential, `company/` may not import `simulation/` (`tools/epistemic_verifier`, `tests/architecture/test_epistemic_wall_ratchet.py`), and a production artefact shipping `company/` without `simulation/` has no speaker at all. The RESIDUE is what nobody had looked at: segregation removes the SPEAKER and does nothing whatever about the TRUST. `COUNTERPARTY_REGISTRY` lives inside `company/interfaces/wall_protocol.py`, so it ships to production intact, fingerprint and all, and anyone who then read one string literal out of a repository would be a bank. The check therefore had to be \"does this build still ACCEPT a stand-in\", not \"can the stand-in be reached\".\n\nTHE REPAIR. `CounterpartyRecord` gained `nature: CounterpartyNature` -- REQUIRED, no default, because a row that does not say is a row nobody decided about and this module's whole doctrine is that absence is never agreement. `assert_registry_fit_for_posture(posture, registry=...)` raises `STAND_IN_IN_PRODUCTION`, naming every offending participant, when a build is asked to run in production while its registry still carries a counterparty it does not hold as real. It is called from `PaymentObservationConsumer.__init__` -- the startup of the ONLY framed crossing the company has -- once, before any wire is read, rather than per message: a control whose only caller is its own test is an orphan (`feedback_a_controls_own_test_is_not_a_caller_so_the_landing_reds`), and the live triad constructs this consumer.\n\nFAIL-CLOSED, AND THE DIRECTION IS THE WHOLE DESIGN. The R15 FAIL-OPEN shape here would be an unreadable posture meaning \"assume simulation\", and that is exactly the reading a stand-in reaches production through -- \"I could not tell where I am\" is not a licence to trust an impersonator. So every value this build does not recognise is read as PRODUCTION, the strictest reading, and `test_an_UNRECOGNISED_posture_is_read_as_production_and_never_as_simulation` sweeps twelve of them. The one that mattered: `DeploymentPosture` is a str-Enum, so an EQUALITY check would have accepted the bare string `\"simulation\"` that an unvalidated config read produces. The comparison is IDENTITY, and the bare string is in the parametrized list. A record whose `nature` is not a `CounterpartyNature` is read the same way for the same reason (seven cases, including the string `\"real\"`).\n\nTHE DECLARATION CANNOT BE FORGED, which is the only thing standing between this and the \"config flag and good intentions\" the reviewer names as the failing answer. Relabelling the shipped row STAND_IN -> REAL defeats the startup assertion completely, and `test_MUTATION_a_stand_in_relabelled_REAL_is_CAUGHT_by_the_cross_check` SAYS SO IN ITS BODY -- it asserts the assertion now passes on the forged registry -- and then catches the forgery against `_stand_in_credential_fingerprints()`, the sha256 of every credential literal actually present under `simulation/`, read off the tree by AST. Company declares, sim tree is measured: two sources, so not the R15 TAUTOLOGY pattern. That helper refuses to report a clean tree from an empty scan (`scanned > 0` and `found` both asserted), because a rename of the sim package would otherwise make every row look un-impersonated -- FAIL-SILENT, closed. Null control on the same test: a participant this repo cannot speak for is not flagged by the same function, so it is measuring the credential and not the label.\n\nWHY Q14 IS STILL RECORDED FAIL, and this is a deliberate call rather than an oversight. The reviewer asked for ENVIRONMENT-LEVEL segregation AND a startup assertion. This project has exactly one environment. `DECLARED_POSTURE` is a constant inside the same shipping unit as the code that reads it, which is the config-flag half of the answer the reviewer refuses; what keeps it honest is a test suite, and a test suite is not a deployment boundary. The genuine second leg is a production artefact BUILT without `simulation/` plus a publish step that refuses one containing it, and neither exists. The tree-level wall is real segregation of IMPORTS, not of DEPLOYMENTS, and the module docstring says so at the line that declares the posture rather than leaving a future reader to infer the scope from test names. Q10 and Q13 were both left FAIL after partial repairs on exactly this reasoning; a third standard here would be the treadmill.\n\nEVIDENCE: `tests/company/interfaces/test_wall_protocol.py` 111 passed against 85 at HEAD (+26); `tests/background/test_live_payment_triad.py` + `tests/tools/test_wall_channel_census.py` 225 passed in 82.7s -- the LIVE path, so the company's real route to a payment observation now runs the startup assertion at construction; `tests/company/billing/test_payment_observation_consumer.py` + `tests/simulation/test_payment_seam_adapter.py` + `tests/company/market/test_flex_participation.py` 91 passed; `tests/interface` + `tests/company/comms` + `tests/simulation/test_conversation_response.py` 160 passed; `python3 -m tools.epistemic_verifier` PASS; `python3 -m tools.wall_channel_census` clean on every frozen channel (the new entry point is not a leg, so `LEG_DECODE_NAME` needed no widening -- checked by running it, not by reading it). `cold_eyes_battery.battery_outstanding` re-read after the reconciliation edit: Q2, Q3, Q5, Q6, Q9, Q10, Q13, Q14, Q15 -- unchanged, so nothing drifted and no question was cleared as a side effect.\n\nWHAT THIS PASS DOES NOT ESTABLISH, said here rather than discovered later.\n  * NO BUILD-TIME SEGREGATION. Nothing constructs a company artefact, so nothing can refuse one containing `simulation/`. That is Q14's remaining half and it is a packaging job, not a protocol one.\n  * THE POSTURE IS DECLARED, NOT DETECTED. `assert_registry_fit_for_posture` is honest about where it is told it is running and has no way to find out independently. A deployer who edits the constant and does not run the suite gets exactly what they asked for.\n  * NO CRYPTOGRAPHY, unchanged from pass 39. The credential is still a string compared by fingerprint; there is no certificate chain and no signature over the bytes.\n  * TWO OF THREE CROSSINGS ARE STILL UNFRAMED (conversation, flex) and the ratchet naming them is unchanged.\n  * THE LEVEL IS STILL 2, same reason as passes 38 and 39: Q9 and Q15 need an act in a RESERVED class, so `level_target: 3` is unreachable in this epoch whatever is built.\n\nWHAT REMAINS: SIX payable items (Q2, Q3, Q5, Q6, Q10, Q13) plus Q14's packaging half, and two epoch-gated (Q9, Q15). NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): Q5 -- a response that NEVER ARRIVES, with defined behaviour at 1 min / 24 h / 5 working days. Its reconciliation row records that `WallStatus.TIMEOUT` has neither a reader nor a writer, so the status exists and nothing produces or consumes it; that is a smaller, better-bounded job than Q2's unsolicited-inbound primitive or Q3's multi-leg conversation, and `UnresolvedCrossing` (built pass 36) is already the place a crossing that has not answered is recorded. The target decision recommended at passes 38 and 39 -- retarget to level 2 for epoch 3, move Q9/Q15 to `EP19_counterparty_qualification_paths` -- is unchanged and still the director's (R13)."
- '2026-08-20 pass 41 BUILD, level HELD at 2, loop_stage stays build. PASS 40''S HANDED-FORWARD NEXT MOVE IS BUILT: Q5''s ladder exists, the stand-in can now go quiet, and the status vocabulary went 2 of 4 to 4 of 4 -- but Q5 IS RECORDED FAIL, for two reasons stated below rather than discovered later. Everything here is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 6fd310d35, worktree.


  THE DEFECT, AND WHY IT WAS NEVER GOING TO BE ''GIVE TIMEOUT A READER''. Passes 33 and 34 both handed forward the same words. The census''s own commentary had already corrected them: TIMEOUT had no WRITER either, so a reader added first is R11''s orphan transition pointed at the release half. This pass builds the writer and the reader together, and it builds them for ERROR as well -- ERROR sat in the identical state (no writer, no hearer), four lines away in the same enum, missed by three passes looking straight at it. That miss-next-to-a-hit is this atom''s second recorded instance and therefore a class, so the repair enumerated the vocabulary instead of fixing the member someone was looking at.


  THE DEEPER DEFECT THE BLOCKER''S PHRASING HID, and the reason a whole module exists. SILENCE IS NOT A MESSAGE. A response that never arrives produces no envelope and calls no handler, so it is detectable ONLY against an expectation -- and the company held no clock anywhere. PaymentObservationConsumer is purely response-driven, and UnresolvedCrossing''s own docstring said a crossing leaves the register only on an OK, ''never by expiry, never by assumption''. That sentence is right about what must not happen and was silent about what must: nothing aged, so a crossing answered ''not yet'' in 2016 and never mentioned again read IDENTICALLY at one minute and at one year. Pinned as a test that fails against the pass-40 register.


  WHAT WAS BUILT. (1) simulation/payment_seam_adapter.py::TransportFault -- SILENCE, TIMEOUT, ERROR, applied AFTER the truth->observable mapping, which is split out as _map_event_to_responses so the wall property stays a property of one function and a fault can only REMOVE information. Default NONE, asserted identity on every outcome class: a failure RATE would be a baseline change and is the director''s under R13, not this module''s to invent. (2) company/interfaces/crossing_silence.py -- SilenceHorizon (IN_FLIGHT / LATE >=1min / OVERDUE >=24h / ABANDONED >=5 working days), one obligation per band, plus next_move giving each status its own arm so TIMEOUT stops releasing exactly what ERROR releases. (3) PaymentObservationConsumer.silence_ladder -- the ladder over the live register, Blindfolded at datetime granularity because the first horizon is a MINUTE and the register filters by date.


  TWO DESIGN CALLS WORTH THE RECORD. A REAL COUNTERPARTY NEVER SENDS YOU A TIMEOUT, so TIMEOUT has two legitimate writers and they are different facts: the transport reporting it gave up (a message ARRIVES) and the company''s own clock concluding it (NOTHING arrives). SilenceConclusion keeps heard_status and concluded_status apart for exactly this reason; a company that collapsed them would be inventing a message from its counterparty. And THE LADDER CLASSIFIES, NEVER EVICTS -- dropping the crossing at five working days would assume a resolution the seam never sent, the same fail-open in a slower costume.


  THE INSTRUMENT MOVED, AND WAS NOT EDITED TO MOVE. status_liveness_conformance now reads live=(OK, TIMEOUT, ERROR, NOT_KNOWABLE_YET), 4 of 4, from 2 of 4. Mid-build it read UNHEARD for both new members: the census counts a status as read only when the attribute is directly a comparison side, so an ''in (A, B)'' tuple test was invisible to it. The reader was rewritten into the shape the instrument already recognises rather than widening the instrument in the same pass that needed it green (R15 TAUTOLOGY). The census''s tuple blind spot is real, is noted at the code that works around it, and is NOT fixed by the pass that benefits.


  WHY Q5 IS STILL FAIL. (a) INITIAL SILENCE IS INVISIBLE. The ladder ages only crossings something arrived about; a crossing whose FIRST message never arrives leaves no trace, because nothing records that the company asked. Pass 41 made the stand-in able to produce precisely that silence, so the gap is now REACHABLE rather than hypothetical -- pinned in tests/background/test_live_payment_triad.py so it cannot be quietly forgotten. Its repair is the REQUEST leg (Q2) and was deliberately not smuggled in here. (b) THE HANDLING IS SPECIFIED, NOT ENACTED: each horizon names an obligation as a sentence, and nothing re-asks, labels a figure stale, or provisions, because acting organs are RESERVED to the director''s dunning/debt/provisioning session (ruling 2026-07-25 s2). Q10, Q13 and Q14 were each left FAIL after partial repairs on this same reasoning; a different standard here would be the ceremony the cold-eyes walk exists to stop.


  THE RATCHET FIRED AND WAS RULED, NOT AMNESTIED. The wall census caught company.interfaces.crossing_silence -> interface.contracts.wall_envelope as a NEW channel-C member. Ruling: it is the same shape as three company-side members already frozen there, reading the shared four-member status enum in interface/ (the regulation-commons side). Added BY HAND to the baseline rather than by --worktree --freeze, which on a tree carrying 160 other-lane modifications would have banked their state too.


  EVIDENCE: tests/company/interfaces/test_crossing_silence.py 23 passed, including the two differentials that let the ladder fail -- five CALENDAR days over a weekend is three working days and must NOT abandon, and Mon 31 Aug 2026 being a bank holiday defers abandonment a day, so neither a calendar-day nor a weekends-only ladder passes; tests/simulation/test_payment_seam_adapter.py 46 passed; tests/company/billing/test_payment_observation_consumer.py + tests/company/interfaces/ 709 passed; tests/tools/test_wall_channel_census.py 201 passed; tests/architecture/test_epistemic_wall_ratchet.py + tests/background/test_live_payment_triad.py + tests/interface + tests/company/market/test_flex_participation.py 105 passed; python3 -m tools.epistemic_verifier PASS. battery_outstanding re-read after the reconciliation edit: Q2, Q3, Q5, Q6, Q9, Q10, Q13, Q14, Q15 -- unchanged, so nothing drifted and no question was cleared as a side effect.


  WHAT THIS PASS DOES NOT ESTABLISH. No request register, so no crossing is detectable before its first answer (Q2). No failure RATE, so the stand-in goes quiet only when a caller asks it to -- the baseline world is untouched and what a real rate should be is the director''s curriculum question (R13). No acting organ on any horizon (reserved). The level is still 2, same reason as passes 38, 39 and 40: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.


  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): Q6 -- the seam''s refusal of spec-violating input and the consumer''s duplicate/out-of-order handling are both already tested, so its reconciliation row should be re-read against what pass 36-41 built before any new code is written; it may be the cheapest remaining item and may already be closer than its row says. The target decision recommended at passes 38, 39 and 40 -- retarget to level 2 for epoch 3, move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director''s (R13).'
- '2026-08-20 pass 42 BUILD, level HELD at 2, loop_stage stays build. THE STAND-IN CAN NOW MISBEHAVE ON PURPOSE, AND THE FIRST THING IT EMITTED PUT GBP126 OF A STRANGER''S CASH INTO THIS COMPANY''S BOOK. Pass 41 handed forward Q6 as "may already be closer than its row says"; it was closer in the half that was never the question and wide open in the half that was. Everything here is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD a47f4945c, worktree.


  WHAT PASS 37''s ROW GOT RIGHT AND WHY IT WAS STILL THE WRONG SUBJECT. That row recorded, correctly, that the seam REFUSES spec-violating input and that the consumer handles duplicates and out-of-order revisions, both tested. Neither is Q6. Those tests hand the company a HAND-BUILT bad message, which asks whether the receiver copes; Q6 asks whether the STAND-IN can produce one. The reviewer said why in his own words -- "if the fake can only be well-behaved, it rehearses nothing worth rehearsing" -- and the practical consequence is that the receiver''s tolerances were exercised solely by the imagination of whoever wrote the fixture. Re-reading the row against passes 36-41, as pass 41 recommended, is what made that distinction visible: six passes of repair had moved the RECEIVER and never once the EMITTER.


  WHAT WAS BUILT. simulation/payment_seam_adapter.py::SpecViolation -- DUPLICATE_REFERENCE, FOREIGN_ACCOUNT, OUT_OF_ORDER_REVISION, BACKLOG_BURST, the reviewer''s own four. Three design calls carry it. (1) APPLIED TO THE FRAMED WIRE, after `encode_wall_response` has done its honest job, because a misbehaving counterparty is exactly one whose bytes its own encoder would not have produced; weakening the encoder to let a violation through would break the well-behaved path in order to model the badly-behaved one. (2) STRUCTURALLY VALID, SEMANTICALLY WRONG, and structurally malformed bytes are deliberately absent -- those are the decoder''s business and pass 37 already tests them from hand-built fixtures, so a fault mode for them would re-test the refusals and add nothing. The class nothing could produce before is a message the company will happily read and should not act on. (3) SEQUENCE-LEVEL, because three of the four are not properties of any one message: a duplicate, an ordering and a burst exist only across a hand-over.


  EVERY TRANSFORM REFUSES RATHER THAN NO-OPS, and this is the R15 clause of the design. `apply_spec_violation` raises when the hand-over cannot carry the violation -- an ordering needs two messages, a burst needs two, FOREIGN_ACCOUNT needs a payload with an account (a non-OK envelope is about no account at all), an unrecognised member is refused rather than passed through. A violation that silently declined to happen would make every regression built on it FAIL-OPEN in the exact named sense: green because nothing misbehaved, read as green because the company coped.


  WHAT THE MISBEHAVING STAND-IN FOUND ON ITS FIRST RUN. FOREIGN_ACCOUNT -- a remittance mis-keyed to another supplier''s account reference, this seam''s form of the reviewer''s "readings for MPANs you don''t supply" -- went straight through. `LedgerBook.ledger()` creates an account on first sight, so the cash CREATED a phantom account and posted into it. The tell is one line: on three well-formed messages `portfolio_balance_gbp()` came out -126.0 for the mis-keyed hand-over and -126.0 for the clean one, BIT-IDENTICAL. The company''s own headline cash figure could not distinguish its customers'' money from a stranger''s, and no existing test could see it because no existing test could produce the message.


  THE REPAIR, AND WHY IT IS A REGISTER AND NOT A REFUSAL. `PaymentObservationConsumer(supplied_accounts=...)` -- the company''s OWN roster, stated before the first message is read and never read off the wire, because a message naming an account cannot be the evidence that the account is ours (R15 TAUTOLOGY). A well-formed observation about an account it does not supply becomes a `MisdirectedObservation` and touches no ledger. Not refused: the message is VALID, the fact is real, and losing it would be worse than mis-filing it -- which is why real receivables functions book it to suspense and work it off. SENSING ONLY, the same clause as `ExpectedCollectionMiss`: nothing queries, returns or writes off, because those are acting organs and RESERVED (ruling 2026-07-25 s2).


  `None` MEANS UNASKED, NOT EMPTY, and that distinction is the reason the roster is optional. Every caller that existed before this pass is bit-identical, because a company with no roster has no grounds to reject anything -- but `holds_account_roster` publishes which of the two an empty register is, so "nothing was misdirected" cannot be read off a company that could never have told. The check itself FAILS CLOSED in the direction that matters: with a roster held, a payload carrying no `account_id` RAISES rather than passing, because all six of this seam''s response payload types declare one and treating an object without one as well-directed would let exactly the malformed case through the check built to catch it.


  THE CONTROL HAS A RUNNING CALLER, not only a test, and WHICH caller was decided by a refused landing rather than by preference. The first attempt wired the roster into tools/couple_w2_11_d5.py at construction, since that harness builds the book and knows its whole roster up front. `surgical_land` REFUSED it: tests/tools/test_couple_w2_11_d5.py is wedged at HEAD by 21 door tests whose harness path (site/proof/_render_harness.mjs, site/proof/index.html) is in NO tree -- `git ls-tree -r HEAD | grep -c site/proof/` is 0 -- so every one of them errors before reaching an assertion and any commit touching that file is unlandable. Filed as its own finding rather than fixed on sight (SELF_INTERRUPT_DISCIPLINE); the harness edit was reverted rather than left uncommitted on a shared tree.


  The caller it landed on is BETTER, and the refusal is what exposed why. background/live_payment_triad.py is the company that actually runs inside run_phase2b, and it does NOT know its book up front -- it learns of an account when it BILLS one. So the roster GROWS: `note_supplied_account` is called at the bill, the one place the company acts on its own knowledge of the account and never on anything that arrived on the wire, and `holds_account_roster` flips there from False to True. Calling it on a consumer holding no roster STARTS one, which is the transition from "cannot tell" to "can". The D8 shadow is told identically, for the same reason it is billed identically: a shadow with a different roster is a second company, not a counterfactual. The live figures are unchanged (84 passed), because every account that stand-in names is one the triad billed.


  EVIDENCE: tests/simulation/test_payment_seam_adapter.py 58 passed, including the null-control assertion that the clean hand-over names a DIFFERENT account (without it the FOREIGN_ACCOUNT test would pass on a transform that did nothing) and the non-mutation assertion (a transform that edited in place would make every null control equal to its violation). tests/background/test_live_payment_triad.py -- nine Q6 tests driving the REAL company path (`observe_wire`, so frame, envelope and payload refusals all run), each holding the well-behaved hand-over beside it. tests/company/billing/test_payment_observation_consumer.py + tests/company/interfaces/ + tests/tools/test_wall_channel_census.py 864 passed. tests/architecture/test_epistemic_wall_ratchet.py + tests/simulation/test_payment_seam_adapter.py + tests/background/test_live_payment_triad.py 102 passed. python3 -m tools.epistemic_verifier PASS. TWO R15 MUTANTS, one per direction the wiring can fail. Neutering `_is_misdirected` returns the phantom account and empties the suspense register (test_q6_R15_MUTANT_deleting_the_roster_check_puts_the_cash_back_in_the_book). And a triad that states only its FIRST account -- what a partial wiring looks like -- suspends its OWN customers'' cash (test_q6_R15_MUTANT_a_triad_that_stops_stating_its_roster_suspends_its_own_cash), which is the direction that matters once the check exists at all: a roster the company forgets to state stops being a harmless omission.


  WHY Q6 IS RECORDED FAIL ANYWAY. BACKLOG_BURST is emitted and is BYTE-IDENTICAL to an ordinary batch. Nothing on this wire records when a message was HANDED OVER, only when the counterparty says it observed the fact, so a released queue and a normal delivery are the same bytes and no company-side check could tell them apart. That is a missing delivery clock -- the same missing-request-leg family as Q2 and Q5 -- and it is pinned rather than glossed. Q10, Q13 and Q14 were each left FAIL after partial repairs on this reasoning, and pass 41 wrote down why: a different standard for the pass that built the repair is the ceremony the cold-eyes walk exists to stop.


  WHAT THIS PASS DOES NOT ESTABLISH. No violation RATE -- the stand-in misbehaves only when a caller asks it to, because a rate would be a property of the baseline world and R13 makes that the director''s, so no committed run moves by a penny. No malformed-byte emission (excluded above, with the reason). No roster on any caller but the live triad; the offline coupling harness still holds none and says so, because the file that would state it is wedged (above). The level is still 2, same reason as passes 38-41: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.


  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): Q2, the request leg. Three separate items now hand forward to it -- Q5''s initial silence (pass 41), Q6''s undetectable burst (this pass), and Q2 itself -- and all three are the same missing structure: the company records nothing about a crossing until an answer arrives, so it can hold no clock against one. That makes Q2 the highest-leverage remaining item rather than merely the next one, and the first pass on it should build the request REGISTER before the request MESSAGE, because the register is what the other two need. The target decision recommended at passes 38-41 -- retarget to level 2 for epoch 3, move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director''s (R13).'
- '2026-08-21 pass 43 BUILD, level HELD at 2, loop_stage stays build. THE WALL GREW A THIRD PRIMITIVE, AND THE FIRST THING IT REVEALED IS THAT THE COMPANY ALREADY KNEW WHAT IT DELIVERS. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 970418456, worktree, with this atom''s file_scope files clean against HEAD before the pass.


  WHY THIS QUESTION AND NOT ANOTHER. `tools.discovery_pass_ceiling` renders this atom''s fourth state -- the target is unreachable here AND build work remains -- and names seven payable questions that ''must keep being drawn''. Of those, Q2 and Q3 were the only two no pass had ever touched: both still carried the pass-33 reconciliation while 39-42 each partly repaired one of Q13, Q10, Q14, Q5, Q6. Q2 was picked over Q3 because three other questions name it as their upstream in their own recorded evidence -- Q5''s ''the repair is the REQUEST leg, which is Q2'', Q6''s ''the same missing-request-leg family as Q2 and Q5'', and pass 36''s ordering of the conversation repair before the TIMEOUT one. The ordering was read off the record rather than invented here.


  THE DEFECT, AND IT WAS A READER WITH NO WRITER. `AddacsAdvice` is the payer''s bank advising a mandate change the company did not action -- unsolicited by its own contract docstring, and the one payload on this seam that no request could be an answer to. The company had a reader for it (`_observe_addacs`, feeding mandate belief) and NOTHING ANYWHERE EVER SENT ONE: the only delivery shape available was a `WallResponse` correlated to a `CollectionRequest` that is constructed nowhere but its own contract test. That is the blind reviewer''s named fail verbatim -- ''we model it as a response to a synthetic request'' -- predicted before any code was seen.


  THE REPAIR IS A TYPE, AND THE ABSENCES ARE THE DESIGN. `interface/contracts/wall_envelope.py::WallNotification` carries no `correlation_id` (nothing to correlate to; minting one recreates the fail), no `status` (a status answers a question and nobody asked), and a MANDATORY payload (an unsolicited message that says nothing is not a message) -- each refused at construction rather than documented, on `WallResponse.__post_init__`''s reasoning that a contract which CAN leak by construction is worse than one that cannot. What it adds is `sender` + `sequence`: a position in ONE counterparty''s stream. A response set is deliberately order-blind because the company knows what it asked; an unsolicited stream is not, because it does not. The sequence is what makes the one otherwise-unanswerable question askable -- WHAT NEVER ARRIVED.


  THE MEASUREMENT, AND IT IS THE FINDING. Wired live into `background/live_payment_triad.py`, 37 advices crossed the 150-customer/6-month population. EVERY PUBLISHED FIGURE IS BIT-IDENTICAL either side of the new leg -- detection 0.1181818182, detection_latency 2.135447, belief 0.1470588235, belief_population_mix 0.2666666667, ageing 0.2469740634 -- and the mandate beliefs are 28 likely_dead_believed with the leg and 28 without it. THE ARUDD LINE ALREADY SAID THE SAME THING. So the second channel the real rails have is now modelled, and in the one scenario that runs it is REDUNDANT: it buys structure and one new detectable, not a moved belief. That is recorded as the headline rather than buried under the R15 count, because a pass that built a primitive and then claimed a capability gain it did not measure is the ceremony the cold-eyes walk exists to stop.


  WHAT IS GENUINELY NEW IS A DETECTABLE, NOT A BELIEF. `inbound_stream(sender).missing_sequences` lets the company say it is OWED a message -- the thing no reading of the messages it did receive can yield. In the live run it is empty, because the default transport loses nothing; the capability is proven at unit level and UNEXERCISED in the scenario, which is the same shape as this atom''s pass-36 limit (b) and is stated the same way rather than counted as traffic.


  WHY THE TRIGGER IS NOT A CURRICULUM CHANGE (R13), since a new world message is exactly what would make it one. The advice fires off `CANCELLED_OTHER`/closed/deceased -- reasons the generator ALREADY drew and already published as the ARUDD line''s category. No parameter, no difficulty value, no new draw, no substream. The world was under-reporting a fact it had; it now reports it down both channels real Bacs uses. The corollary is limit (b) below: because `PaymentEvent` is per-payment-attempt, an advice with NO collection behind it -- the payer cancelling between collections, the purest unsolicited case -- cannot be emitted without a mandate-lifecycle event the generator does not draw, and adding one IS the director''s.


  FOUR REASONS Q2 STAYS FAIL, and the standard is this atom''s own: ''Q10, Q13 and Q14 were each left FAIL after partial repairs on this reasoning; a different standard for the pass that built the repair is the ceremony the walk exists to stop.'' (a) The reviewer''s four named examples -- pushed D0010s, CSS notifications, DCC alerts, AQ updates -- are not modelled anywhere in this build. (b) The trigger cannot fire without a failed collection, above. (c) THE NOTIFICATION LEG DOES NOT TRAVEL THE WIRE: it is at parity with the object-level `observe()` and does not pass `decode_framed_response`, so an unsolicited message is accepted from anybody. It weakens nothing that existed -- `observe()` is equally unframed -- but it is a leg Q13''s framing has not reached, and it is named there rather than left to be discovered. (d) The REQUEST leg is still dormant: `seam_conversation_conformance` still reads 1 of 3 conversant, correctly, and that is what keeps Q5(a)''s invisible initial silence unrepaired.


