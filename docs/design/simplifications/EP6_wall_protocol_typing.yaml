simplifications:
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing typed, no protocol designed -- this atom is\nepoch-3 BUILD-gated on director-reserved curriculum sequencing (R13), and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` deliberately NOT edited: nothing in the map moves for this\npass, and another lane holds staged hunks in that file (`git diff --cached --stat` at draw\ntime: 13 insertions, 5 deletions). Output is this record plus one queued finding.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD d5916fd67. Live published artefact `docs/reports/run_output_latest.json`\n(mtime 2026-08-13 17:51:47, 3,568,564 bytes) read directly; shipped modules read as they\nsit on disk; nothing monkeypatched, nothing regenerated. Two of this atom's three cited\nevidence paths were DEAD (the known moved-path class) and are repaired above: the director\nruling had been archived to `docs/staging/done/`, the counterparty-API research moved to\n`docs/design/refs/`. Six paths added -- the ones a reader of this atom actually needs.\n\n==========================================================================================\nFINDING 1 -- THIS ATOM'S OWN `name:` POINTS AT THE WRONG ANCESTOR. The protocol layer EP6\nproposes to build ALREADY EXISTS, is live on three crossings, and is not the pattern this\natom names. Nine downstream atoms inherit the wrong pointer through `depends_on`.\n==========================================================================================\n\nThe atom's `name:` says: \"W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this\nis the protocol layer every named adapter below plugs into.\" Read that against the tree and\nit sends EP7-EP15 to the one family that implements none of C-S3.\n\nWhat is actually on disk, two disjoint families:\n\nFAMILY A -- `interface/contracts/wall_envelope.py`. `WallRequest[P]` / `WallResponse[R]` /\n`WallStatus`, frozen and generic. Its module docstring enumerates the same five properties\nthis atom's origin note is about (C-S3 separate events in time, C-S2 at-least-once\nidempotency, C-S1 late/out-of-order/never, NOT_KNOWABLE_YET as a first-class answer, and\nrestatement-not-mutation), and implements them: `correlation_id` is both the idempotency\nkey and the ONLY link between request and response; `as_of` (decision clock) is kept\ndistinct from `emitted_at` (transaction time); `observed_at`/`valid_time` are bitemporal by\nconstruction; `__post_init__` REFUSES a malformed envelope (an OK with no payload, a\nnon-OK carrying one, an ERROR with no `ErrorDetail`) at construction rather than at some\nquieter later read. `schema_version: int` is a REQUIRED field on both request and response\n-- no default, structurally impossible to omit. Referenced by 11 non-test modules; three\ncrossings are expressed in it (`payment_observable_seam.py`, `conversation_seam.py`,\n`flex_observable_seam.py`), live-wired at `simulation/conversation_response.py::\nrespond_over_wall` (which contract-validates the pairing so \"a same-step or mis-linked\nresponse can never leave this function\"), `simulation/payment_seam_adapter.py`,\n`sim/flex_dispatch.py`, and consumed on the company side by\n`company/billing/payment_observation_consumer.py` and `company/interfaces/sim_interface.py`.\nBuilt under atom W4_4 per its own docstring -- NOT under W4_1.\n\nFAMILY B -- `tools/*_port.py`, the five ports W4_1 built and this atom's `name:` cites:\n`market_data_port`, `credit_bureau_port`, `meter_read_port`, `acquisition_funnel_port`,\n`contact_centre_port`. Every one is a `runtime_checkable` Protocol whose method RETURNS the\nanswer in the same call frame -- `get_meter_reads() -> list[MeterReadMessage]`,\n`check_credit(applicant_id, segment, seed) -> CreditCheckResult`,\n`get_spot_elec_gbp_per_mwh(as_of) -> float`. Zero request objects. Zero correlation ids.\nZero separation in time. Grepped for `correlation_id` across the five: one hit, in a\n`contact_centre_port.py` COMMENT explaining that the real crossing dict has no\ncorrelation_id and the sketch's illustrative guess did.\n\nSo the origin note's fear -- \"C-S3 is the thing most likely to be quietly dropped, because\nsame-step is easier\" -- has already come true, but in the opposite direction from the one it\nguards. C-S3 was not dropped from the DESIGN; it was designed properly in Family A and\nnever picked up by the family this atom points its nine dependants at. And the sketch's own\nrow 7 (`docs/design/WALLED_INTERFACES_SKETCH.md`, banking/payment rails) explicitly defers\n\"full typed/versioned HARDENING of this seam (schema versioning, the reference-flow-\nconversion treatment given to the other rows)\" to Epoch 3 -- i.e. to THIS atom -- and that\nis precisely the seam Family A already landed.\n\nWHAT FOLLOWS, recorded rather than asked (NEVER_ASK_WITHOUT_RECOMMENDING):\n\n1. This atom is not greenfield. `level_current: 0` and `file_scope: []` describe an atom\n   with nothing built; the honest reading is that its deliverable exists in part, under a\n   different atom, and its level must be re-derived from a CENSUS when it opens, not\n   assumed from the record. Not changed here: a level move is a BUILD-side act on a\n   BUILD-gated atom, and the map holds another lane's hunks.\n2. When EP6 opens, its first task is the census, not a design: enumerate every live\n   SIM/company crossing and classify each as (a) envelope-borne, (b) same-step typed port,\n   (c) bare dict. The measured starting point from this pass -- 9 known crossings (the\n   sketch's 7-row table plus conversation and flex), 3 envelope-borne, 5 in Family B, 1\n   (smart-meter comms) still not a real crossing at all. The denominator is NOT claimed\n   complete: this pass enumerated from the sketch table and the `WallResponse` importer\n   set, not from an exhaustive walk. Establishing that walk IS the census task.\n3. EP7-EP15 (`depends_on: ['EP6_wall_protocol_typing']`, 9 atoms, verified by grep) should\n   be read as plugging into `interface/contracts/wall_envelope.py`. The Family B pattern is\n   a transport-shape convenience for in-process logs; it is not a counterparty protocol,\n   and an EP7 Elexon adapter or an EP11 GoCardless adapter built to it would have no\n   representable answer for \"the webhook arrived four days later\" -- the exact physics\n   those atoms' own `name:` fields say they exist to reproduce.\n4. The SIMPLICITY GUARD in the origin note is now the strongest argument AGAINST a new\n   protocol layer: one already exists and is proven. EP6's honest shape is CONFORMANCE\n   (migrate crossings onto the envelope, refuse new ones outside it), not construction.\n\n==========================================================================================\nFINDING 2 -- LATENT, QUEUED NOT FIXED. The \"versioned message\" is UNVERSIONED ON THE WIRE\nin the live published artefact, and nothing can catch it, because the wall's only automated\nconformance control is IMPORT-shaped, not protocol-shaped.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_SHAPED_2026-\n08-13.md` (LATENT, lane W4_the_wall). Summary of the measurement, which is EP6's problem\nrather than W4_1's because EP6 is the atom that would inherit it:\n\nLive `docs/reports/run_output_latest.json`, entries parsed not sampled:\n\n    meter_read_log          1,600 entries   any schema_version: False\n    contact_centre_log        392 entries   any schema_version: False\n    acquisition_funnel_log      4 entries   any schema_version: False\n\n`to_log_entry(include_schema_version: bool = False)` defaults the version OFF so the round\ntrip stays byte-identity; all three live call sites (`simulation/run_phase4c_on_phase2b.py`\nlines 237 and 324, `simulation/run_phase2b.py` line 1647) take the default. The only three\noccurrences of `include_schema_version=True` in the repo are test assertions. The version\nfield exists on the object and has never crossed the seam.\n\nWorse than absent, and this is the R15 FAIL-OPEN part: `from_log_entry` reads\n`entry.get(\"schema_version\", SCHEMA_VERSION)` -- the module constant AT READ TIME. Today\nthat is harmless (one version, \"1.0\"). The first bump to \"2.0\" silently relabels every\narchived v1.0 entry as 2.0, because absence is indistinguishable from agreement. A version\nfield that cannot disagree is not a version field, and version negotiation is exactly what\nEP6 exists to provide. Family A avoids this by construction -- `schema_version: int` is\nrequired, so there is no absent case to default.\n\nWHY NOTHING FIRED. `tools/epistemic_wall.py` (read directly): `WALL_DIRS = ('company',\n'saas', 'sim', 'simulation')`, `SEAM_PACKAGE = 'company.interfaces'`. Both `tools` and\n`interface` are UNCLASSIFIED -- `tests/architecture/test_epistemic_wall_ratchet.py`\nasserts this deliberately (`assert not _under_seam(\"interface.contracts.wall_envelope\")`).\nThe ratchet polices IMPORT EDGES between the two sides. It is sound for that subject and\nsays so. But data crossing as a JSON list through an unclassified package is not an import\nedge, so the crossing below is invisible to every control in the repo:\n\n    producer   simulation/run_phase4c_on_phase2b.py  -> meter_read_log (1,600 rows)\n    consumers  company/billing/monthly_bill_assembly.py\n               company/compliance/population_sanity.py\n               saas/reporting/annual_report.py\n               saas/reporting/css_statement.py\n\nSame-step, unversioned, and -- as W4_1's own 2026-07-22 red-team already registered and\nthis pass re-confirmed on the live artefact -- carrying `true_consumption_kwh`, SIM ground\ntruth, in the published bytes. That last part is a KNOWN registered latent gap, not a new\nfinding; it is repeated here only because it is the same blind spot: the accessor is\nenforced, the wire is not, and no control looks at the wire.\n\nTHE CONSEQUENCE FOR THIS ATOM: EP6 cannot be exit-tested by \"the crossings are typed\" --\nthey already are, and the typing is silent on the wire. Recommendation, acted on by\nrecording it here for the draw that opens this atom: EP6's exit criterion is a CONFORMANCE\nCENSUS with a shrink-only allowlist, mirroring the ratchet's own proven shape -- every live\ncrossing either carries a `WallRequest`/`WallResponse` or appears in a dated, shrink-only\nlist of grandfathered same-step crossings, with the mutation proof being an injected\nsame-step crossing that must red the suite. That control is protocol-shaped, it is the\npattern this repo has already proven it can keep honest, and it makes \"a mock counterparty\nand a real one are indistinguishable to the company\" a testable claim rather than a hope.\n\n------------------------------------------------------------------------------------------\nPROCESS CORRECTION, recorded because `git show` of this atom's commit would otherwise\nmislead. This pass's commit 263dcf1b6 was made with a BARE `git commit -m` and no pathspec,\nso it swept the whole shared index: 99 files, 15,109 insertions, where this atom's own\nchange was 2 files. The 97 passengers were another lane's already-staged work, including\n`docs/design/maturity_map.yaml` -- so that commit's message line \"maturity_map.yaml\ndeliberately untouched\" is FALSE OF THE COMMIT, though true of this atom (I made no map\nedit; the shared index held someone else's). Inspected before deciding: the swept map hunks\nare `simplifications_count` bookkeeping bumps only, NO `level_current` move, and the map is\nstill modified in the working tree, so no half of an atomic write was stranded. NOT repaired\nby `reset --soft` + re-commit: the branch was unpushed so origin was safe, but three writers\nshare this tree and a concurrent commit inside that window turns a small mislabel into a\nreal loss. Disclosure was the cheaper correct move. The class is the already-known one\n(commit specific paths, never a bare commit on this tree) and the lapse was mine.\n"
- "2026-08-15 DISCOVER ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3 idle\ndraw). No BUILD code, no protocol designed -- epoch-3 BUILD-gated on director-reserved curriculum\nsequencing (R13); EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 1 makes DISCOVER/FRAME available.\nDeliverable: `docs/design/EP6_WALL_CONFORMANCE_CENSUS_DISCOVER.md`. Everything is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD 6a33e9f0d. Live artefact `docs/reports/run_output_latest.json` (mtime\n2026-08-15 02:47:30, 4,156,355 bytes) parsed in FULL, not sampled; the walker run directly;\nno network.\n\nTHIS PASS PAID THE DEBT THE 2026-08-13 PASS NAMED. That pass refused to claim a denominator\n(\"this pass enumerated from the sketch table and the WallResponse importer set, not from an\nexhaustive walk -- establishing that walk IS the census task\"). The walk is now done, by\nMECHANISM, each channel with its enumeration method stated.\n\nTHE CENSUS -- six channels carry data across this wall; the repo's one enumerator sees two.\n\n  A  direct import edge          6 live   walker-visible, every survivor RULED in the register\n  B  indirect edge via bridge    2 live   walker-visible\n  C  envelope (WallRequest/Response)  3 seams, 10 non-test modules   INVISIBLE to the walker\n  D  same-step typed port        5 ports  INVISIBLE\n  E  structurally-satisfied Protocol  >=1  INVISIBLE, and has NOWHERE to put a version\n  F  published artefact keys     91 of 92 keys, 11 reader modules    INVISIBLE\n\nChannel C is the ONLY one with the property this atom exists to establish (schema_version\nrequired, correlation_id the sole request/response link, as_of separate from emitted_at,\nmalformed refused in __post_init__). Channels A and B are in good order -- 91 examined, 6\nsurviving, each ruled, each ruling checked against HEAD by\n`tools/wall_crossing_dispositions.py`. The register does not overclaim: its own section 5\nsays it decides nothing about the Epoch-3 adapter programme. The gap was DISCLOSED and\nUNMEASURED; it is now measured.\n\nTWO OBSERVATIONS THAT ARE THIS PASS'S OWN.\n\n1. Channel E is the class the KNIFE programme PRODUCED. Converting an import edge into a\n   structural read is how several of the 91 register rows were paid down, and\n   `company/billing/monthly_bill_assembly.py` says so in its own docstring (\"the world's own\n   MeterReadEvent satisfies it as-is, so nothing had to change shape for this cut\"). That is\n   a real reduction in coupling AND a real reduction in visibility at once. No count claimed\n   -- one confirmed instance establishes the class; the walk that would total it was not built.\n\n2. On channel F the business side is not merely a READER of SIM ground truth. Seven artefact\n   keys carry a ground-truth-named field (`bills`, `meter_read_log`, `demand_estimation_log`,\n   `feedback_survey_log`, `churn_basis_risk`, `company_event_log`, `basis_risk_terms`; an\n   eighth, `churn_model_performance`, is a NAMING FALSE POSITIVE -- confusion-matrix cells).\n   `monthly_bill_assembly._annotate_billing_basis` WRITES three of them: it takes `true_bill`\n   as an argument and stamps `true_consumption_kwh`/`true_commodity_amount_gbp`/\n   `true_total_amount_gbp` onto every estimated bill, deliberately and with a stated reason.\n   A conformance control that only inspects READS would find nothing there. The presence of\n   ground truth in published bytes is the KNOWN W4_1 2026-07-22 red-team gap, re-confirmed\n   not re-filed. Nothing in the repo reads this wire: no test asserts over `true_*` in\n   published output.\n\nTHE TRAP IN THE NUMBER 91, recorded so nobody quotes it wrongly. KEY ACCESS IS NOT\nPROVENANCE. Many of the 92 keys are the business side's OWN output round-tripping through the\nrun harness (`management_accounts`, `ledger_pnl`, `enterprise_value_gbp`, `_ledger_headline`);\nreading those back is not a crossing at all. 91 is the width of the CHANNEL, not a count of\nSIM->company crossings. The seven ground-truth-named keys are a LOWER BOUND on the genuine\nsubset, established by field naming rather than by tracing the writer.\n\nFRAME -- how this changes the exit criterion the 2026-08-13 pass proposed. It recommended one\nconformance census with a shrink-only allowlist. Sharpened AND weakened:\n\n  SHARPENED: the allowlist's UNIT cannot be \"the crossing\". A and B have (src,dst) pairs --\n  which is precisely why the register works. C has a seam module, D a port class, F a KEY, and\n  E has NO stable identifier at all. So \"every crossing is envelope-borne or grandfathered\" is\n  NOT testable at HEAD, and an atom adopting it would adopt an unfalsifiable criterion (R15's\n  own failure mode). The testable form is PER-CHANNEL: each channel gets an enumerator and its\n  own shrink-only list, and the exit criterion is that every channel HAS one. Channel F's is\n  seven lines of Python and is already written (census section 6).\n\n  WEAKENED: \"migrate every crossing onto the envelope\" is WRONG for F. The artefact is a\n  REPORT, not a counterparty message; wrapping 92 report keys in WallResponse is the protocol\n  cathedral this atom's own origin_note forbids by name. F's defensible target is PROVENANCE\n  (know which keys originate world-side; stop that set growing silently). D is the opposite --\n  those five ports ARE counterparty stand-ins, they already own a version field, and putting\n  it on the wire is the whole of their conformance.\n\nRECOMMENDATION, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING). The first BUILD move when\nthe director opens epoch 3 is NOT a design and NOT the protocol: it is the PER-KEY PROVENANCE\nWALK -- which module first writes each of the 92 keys into the run output. Until the SIM-origin\nsubset is known, nobody can say whether channel F is a 7-key problem or a 60-key one, and that\nanswer decides which of the remaining channels is worth a protocol at all.\n\nNO NEW FINDING FILED (SELF_INTERRUPT_DISCIPLINE): everything above is a measurement of an\nalready-registered class or a re-confirmation of the queued 2026-08-13 finding\n(`docs/staging/WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_SHAPED_2026-08-13.md`),\nwhich stays QUEUED -- re-measured on a newer artefact, not discharged.\n"
- "2026-08-15 (second pass of the day) DISCOVER ONLY, level stays 0, loop_stage stays idle\n(worker tick, LANE 3 idle draw). No BUILD code, no protocol designed, no adapter started --\nepoch-3 BUILD-gated on director-reserved curriculum sequencing (R13);\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 1 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` is touched for EXACTLY ONE bookkeeping line and no other:
`simplifications_count: 2 -> 3` on this atom. NOT a level move, not a stage move, not a
block-reason edit. The store append and that count are ONE ATOMIC WRITE -- appending a note
without bumping the count reds `tests/design/test_simplifications_store.py::
test_counts_match_file_contents`, which is how this pass found out rather than by
remembering. Checked before editing: the map carried no staged and no unstaged hunk from any
other lane, so this commit strands no half of anyone else's atomic write. Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD 26c047083. Method is an AST walk of the two shipped reducers, run directly,\nnothing monkeypatched; plus the live `docs/reports/run_output_latest.json` parsed in FULL.\n\nTHIS PASS TOOK THE TASK THE 03:16 PASS NAMED AS THE FIRST BUILD MOVE -- and the result is that\nTHAT TASK IS THE WRONG TASK. Its recommendation, verbatim: \"The first BUILD move when the\ndirector opens epoch 3 is NOT a design and NOT the protocol: it is the PER-KEY PROVENANCE WALK\n-- which module first writes each of the 92 keys into the run output. Until the SIM-origin\nsubset is known, nobody can say whether channel F is a 7-key problem or a 60-key one.\" The walk\nis now done. It does not answer the question, and it cannot, for a structural reason that is\nitself the finding.\n\n==========================================================================================\nFINDING 1 -- THE UNIT OF PROVENANCE ON CHANNEL F IS THE FIELD, NOT THE KEY. A per-key walk\nis unanswerable for 38 of 92 keys BY CONSTRUCTION, because the orchestrator that produces\nthem binds both sides' values into one row inside one function scope.\n==========================================================================================\n\nTHE WALK, by mechanism, two levels with local-alias resolution (depth<=6) at each:\n\n  level 1  `saas/reporting/annual_report.py::extract_report_data`   92 keys returned\n  level 2  `simulation/run_phase2b.py::main`                        58 keys returned\n\nEvery published key chased through level-1 locals to its `phase2b[...]`/`run_output[...]`\nancestor, then through level-2 locals to a name whose defining import names a side\n(`simulation`/`sim` = WORLD, `company`/`saas` = COMPANY; 89 WORLD and 44 COMPANY names are\nimported into that one module).\n\n  RESULT, all 92 classified, none dropped:\n\n    UNRESOLVED           38    no single side is derivable -- see below\n    RUN_OUTPUT-LEVEL     27    ancestor is `run_output[...]`, built in a THIRD orchestrator\n                               (`simulation/run_phase4c_on_phase2b.py`), not walked here\n    COMPANY-ORIGIN       14    constructor traces to a `company.*`/`saas.*` import\n    BUSINESS-COMPUTED    11    no world ancestor at all -- computed in the reducer\n    WORLD-ORIGIN          2    `gri_trajectory`, `per_customer_behavioral`\n\nWHY 38 IS STRUCTURAL AND NOT A WEAK TRACER. Spot-checked three of them against the source\nrather than assumed. `all_records`, `customer_events_log` and `retention_log` are each declared\n`: list[dict] = []` at the top of `main()` (lines 1083, 1094, 1131) and populated by a single\n`.append(...)`/`.extend(...)` deep inside the nested term loop, where the appended dict is\nbuilt INLINE from company-computed and world-computed values in the same literal. There is no\nassignment for an alias-chaser to follow, because the value never had one owner.\n\nTHE LIVE ARTEFACT SHOWS IT AT FIELD LEVEL. Rows and field counts read from\n`run_output_latest.json`, not inferred:\n\n  `customer_events`  58 rows x 17 fields -- one row carries `company_churn_estimate` (the\n      supplier's BELIEF), `churn_probability` / `realized_churn_probability` / `random_roll`\n      (the world's GROUND TRUTH and its actual draw), and `churn_estimate_error_pct` (the GAP\n      BETWEEN THEM, computed and published as a field). Three provenances, one row.\n  `meter_read_log`   1,600 rows x 9 fields -- `estimated_consumption_kwh` (company) beside\n      `true_consumption_kwh` (world). This is the KNOWN W4_1 2026-07-22 registered gap; what\n      is new is that it is not a stray key, it is the SHAPE of the row.\n  `retention_log`    12 rows x 10 fields -- `company_churn_estimate` and\n      `expected_term_margin_gbp` (company) beside the realised `outcome`.\n\nSo the 03:16 pass's question -- \"is channel F a 7-key problem or a 60-key one\" -- has no\nanswer at the key level. The honest bound this pass CAN state: 2 keys are provably world-origin,\n14 provably company-origin, and 38 are mixtures whose composition is per-field. A protocol that\nversions and types KEYS would put a `schema_version` on `customer_events` and leave the belief,\nthe truth and the error term sitting in one undifferentiated row underneath it.\n\nAND NOTE WHAT THE MIXTURE ACTUALLY IS. `churn_estimate_error_pct` is the COUPLED TRIAD's own\ngap metric -- belief vs truth -- published as a field of the same record that carries both\noperands. That is not a defect: it is the harness measurement the triad exists to produce. It\nis decisive for EP6's shape, though, because it means the artefact is NOT a counterparty\nmessage and can never become one. A real counterparty never sees the error term; the harness\nmust. One wire cannot be both.\n\nFRAME -- what this does to the exit criterion, sharpening the 03:16 pass again:\n\n  RETIRED: \"per-key provenance walk, then decide.\" Done, and it cannot decide.\n\n  RETIRED: any exit criterion of the form \"every published key is envelope-borne or\n  grandfathered\". The 03:16 pass already weakened this for F on cathedral grounds; this pass\n  kills it on measurability grounds, which is the stronger objection. R15's own failure mode is\n  an unfalsifiable criterion, and per-key conformance on a per-field mixture is one.\n\n  WHAT SURVIVES, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): channel F is TWO wires\n  wearing one name, and EP6's first real move is to SPLIT them, not to type them.\n    (a) the COUNTERPARTY wire -- what a real supplier's systems would actually receive. This is\n        where the envelope belongs, it is small, and channels C and D are already most of it.\n    (b) the HARNESS wire -- belief, truth and gap together, which is the coupled-triad\n        instrument and must NEVER be envelope-shaped, because its whole value is that it sees\n        both sides at once.\n  The testable exit criterion that follows is a FIELD-LEVEL one and it is falsifiable at HEAD:\n  no field on the counterparty wire may be world-origin unless a real supplier could observe\n  it. `true_consumption_kwh` fails that today; `churn_estimate_error_pct` fails it and SHOULD,\n  which is exactly why it belongs on the other wire. The mutation proof is an injected\n  ground-truth field on the counterparty wire that must red the suite.\n\n  DEPENDENCY NOTE, unchanged and re-confirmed: EP7-EP15 (9 atoms) still inherit through\n  `depends_on`. They plug into (a), never (b).\n\nWHAT THIS PASS DID NOT DO, stated rather than implied. The 27 RUN_OUTPUT-LEVEL keys were not\nchased into `simulation/run_phase4c_on_phase2b.py` -- that is a third orchestrator and a third\nwalk, and it includes `meter_read_log`, `bills` and `contact_centre_log`, the three that carry\nthe known ground-truth leak. Extending the walk there is the obvious next DISCOVER draw. The\nlevel-2 walk covers `main()` only; a value assembled in a helper this module calls would read\nUNRESOLVED here for a reason that IS tracer weakness rather than structure, so 38 is an upper\nbound on the structural class, not a measurement of it. Stating the bound in the direction that\ncosts me the argument, because the finding does not need the larger number.\n\nONE FINDING FILED (SELF_INTERRUPT_DISCIPLINE -- queued, not fixed on sight):\n`docs/staging/WORKER_FINDING_THE_PUBLISHED_ARTEFACT_CARRIES_NO_PRODUCTION_STAMP_2026-08-15.md`.\nObserved on the way: `tools/run_annual_report.py::save_run_output_json` unconditionally writes\n`_cache_meta` (git_commit + generated_at_utc) and a versioned copy, and the live artefact has\nNEITHER -- `'_cache_meta' in d` is False and `docs/reports/run_output_versioned/` does not\nexist. So the artefact every provenance claim in this record rests on was not written by the\nonly writer that stamps it. That does not weaken the measurements above (they are of shipped\nCODE, plus row shapes that would be the same whoever wrote them), but a provenance atom whose\nown evidence file has no provenance is worth one document."
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
