- "2026-08-21 pass 60 BUILD, level HELD at 2, loop_stage stays build. Q3'S OTHER EXAMPLE IS NOT A LINE, AND THE REGISTER ANSWERED IT WRONGLY RATHER THAN NOT AT ALL. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 2a0568fab, with all six touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing. (Numbering: the store's last row is pass 58's; 2a0568fab was the landing pass between, which wrote no row of its own.)\n\n  WHICH ITEM, AND IT HAS BEEN THE NEXT ONE FOUR TIMES. Passes 44, 47, 53 and 58 each closed naming Q3's BRANCHING conversation -- pass 53's phrasing was \"a switch with objection is an alternative continuation, not a later position on one path\" -- and pass 58 promoted it to first place: \"now the next item, and the oldest untouched one on the list.\" `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again.\n\n  THE DEFECT, AND IT IS NOT THE ONE THE ITEM DESCRIBES. Four passes filed this as missing expressiveness: the primitive could not SAY that an exchange branched. Measured on this build before writing a line, it was worse than that -- the register answered the question, silently, and got it wrong. `ConversationLeg.identity` was (kind, ordinal), and Q3's own second example puts both continuations at the SAME ordinal: a switch confirmed at leg 2 either has an objection raised at leg 3 or has its objection window close clean at leg 3. So the second continuation was not rejected and was not filed alongside -- it was deduplicated as a REDELIVERY of the first, and `_file`'s restatement rule keeps the LATEST arrival. The probe, run at HEAD before the first edit and reproduced as a test: an exchange told `ObjectionRaised` and then `ObjectionWindowClosed` reports `leg_count` 3, `restatements` 1, and `ObjectionWindowClosed` as the surviving leg. A company reading that register starts supplying a customer whose switch was objected, and WHICH OF TWO CONTRADICTORY MARKET OUTCOMES IT BELIEVES IS DECIDED BY NETWORK ARRIVAL ORDER. Nothing raises, no count looks odd, and the exchange reads as one that never diverged.\n\n  WHAT LANDED, AND THE FOUR DECISIONS INSIDE IT THAT COST SOMETHING. (1) THE COUNTERPARTY NAMES THE BRANCH AND THE COMPANY NAMES THE MENU. `WallInterim.branch` is a wire field because which continuation happened is a fact about the world, learned the way everything else on this wall is learned; a company that derived it from the message type would be keeping a private table of every counterparty's vocabulary and calling its own reading of it evidence. What the company supplies from its OWN book is the SET of branches its process has (`open_conversation(branches=)`), and a label outside that set is refused -- `UnaskedLeg`'s reasoning one level up: the wire may report a choice, never extend the menu. (2) CONFLICT IS REFUSED, NOT RESOLVED. The two fail-open shapes available are keep-the-first and keep-the-last, and this register did the second by accident for sixteen passes. Neither is admissible, because the company ACTS differently on the two outcomes -- one switch completes and the other does not -- and a contradiction the counterparty has to be asked about is not a value to be picked from a pair by arrival order. (3) THE BRANCH IS IN THE DEDUPLICATION KEY AS WELL, and this is the half the refusal cannot cover: a TRUNK leg is admissible on every path by design, so the conflict check waves it through, and on the old key a shared leg sharing an ordinal with a branch leg would overwrite it -- the objection would vanish and the exchange would quietly stop having diverged. (4) ONLY NON-TERMINAL LEGS CARRY A BRANCH, which is why `WallResponse` is untouched. Paths diverge before they end; if the first thing distinguishing two outcomes were the ending itself that is not a branch, it is two possible answers, and `WallStatus` plus the payload type already say it. `branch_taken` is read off the interim legs and the terminal closes whichever path the exchange was on.\n\n  A NEW WIRE RELEASE, BECAUSE THE MODULE'S OWN RULE SAID SO AND HAD NEVER BEEN EXERCISED. Adding `branch` to the interim changes a FIELD SET on a message an earlier release already spoke, and `wall_protocol`'s version-table comment has said since pass 47 what that must look like: \"it lands as a new row in this table rather than as an edit to the constants above, and both sets go on being read at once.\" Editing `INTERIM_WIRE_FIELDS` in place would have refused every interim already in flight from a counterparty that has not cut over -- the big-bang cutover Q10 names as the fail -- so v3 is a new row and v2 keeps its narrower set. This is the FIRST release in this build's history to change a field on an existing message: until now every version difference was a new message KIND, and the test asserting the table is not theatre said so in its own docstring (\"no release here has changed a field on an existing message, and inventing one to make the table look busier would be fabrication\"). A real one arrived, so that test now pins BOTH kinds of release difference and the one thing no release has ever touched -- request and response are byte-identical across all three, which is what makes \"no big-bang\" true for a participant that only transacts those two.\n\n  THE ENCODER REFUSES RATHER THAN DOWNGRADES, and it is the decision in the release with a fail-open on the other side of it. An interim on a branch stamped v2 is `FIELD_NOT_IN_VERSION`, not a v2 message with the label dropped: encoding it away would put well-formed bytes on the wire saying the exchange was progressing along the trunk when the sender said it had diverged, and nothing in a valid v2 message records that a field was removed in transit. In the other direction, on v3 the key is PRESENT AND NULL on the trunk and an omitted `branch` is MISSING_FIELD -- an absent field and a field agreeing with the default are the same bytes, so a branch that could be omitted would not be a branch.\n\n  LANDED: `branch` on `WallInterim` in `interface/contracts/wall_envelope.py`\n  LANDED: `INTERIM_WIRE_FIELDS_V3` in `company/interfaces/wall_protocol.py`\n  LANDED: `_V3_VOCABULARY` in `company/interfaces/wall_protocol.py`\n  LANDED: `BranchError` (reasons UNDECLARED_BRANCH, BRANCH_CONFLICT) in `company/interfaces/crossing_conversation.py`\n  LANDED: `TRUNK` in `company/interfaces/crossing_conversation.py`\n  LANDED: `_require_admissible_branch` in `company/interfaces/crossing_conversation.py`\n  LANDED: `branch_taken` in `company/interfaces/crossing_conversation.py`\n  LANDED: `is_branching` in `company/interfaces/crossing_conversation.py`\n  LANDED: `branches` on `open_conversation` in `company/interfaces/crossing_conversation.py`\n  LANDED: `test_the_FULL_SWITCH_WITH_OBJECTION_crosses_the_wall_as_FIVE_legs` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_the_OTHER_CONTINUATION_of_the_SAME_declared_process_ends_differently` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_the_BRANCH_IS_IN_THE_KEY_or_a_contradiction_is_filed_as_a_restatement` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_a_TRUNK_leg_at_the_SAME_ORDINAL_does_not_OVERWRITE_the_branch` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_a_branch_this_companys_PROCESS_DOES_NOT_HAVE_is_REFUSED` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_ENCODING_a_branch_onto_a_release_that_cannot_carry_it_is_REFUSED` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_a_v3_interim_OMITTING_branch_is_MISSING_FIELD_and_never_a_trunk_leg` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_an_OLDER_dialect_is_a_SUBSET_of_the_contract_and_never_a_stranger_to_it` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_the_releases_actually_DIFFER_IN_TWO_WAYS_or_this_whole_table_is_theatre` in `tests/company/interfaces/test_wall_protocol.py`\n\n  THE WORKED CASE IS DRIVEN OVER A WIRE, NOT BETWEEN TWO OBJECTS. Every leg of the switch battery is built, passed through `encode_interim`, serialised with `json.dumps`, read back with `json.loads` and decoded before it reaches the register. A register checked against interims it was handed directly would prove the company agrees with itself, which is the R15 TAUTOLOGY for the one question a seam is asked -- the same reasoning pass 53 recorded for the flex round trip. The exchange reads: request, `css.registration_confirmed` (trunk), `css.objection_raised` (branch=objected), `css.objection_upheld` (branch=objected), `css.switch_cancelled`. FIVE LEGS, zero restatements, `branch_taken` = objected. The other continuation is driven from the SAME declaration and ends in `css.switch_completed`, which is the thing a register that could only express a line was unable to say at all.\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's six files copied in and only the named part swapped -- never on the shared worktree, which carried 280+ other-lane modifications throughout. The unmutated tree is the null control: 234 passed, re-established between mutations rather than assumed. M1, the BRANCH_CONFLICT refusal removed: 1 failed, 233 passed, redding exactly the contradiction test. M2, `branch` dropped from `ConversationLeg.identity`: 1 failed, 233 passed, redding exactly the trunk-overwrite test -- which is what makes that test the key's own control rather than a copy of the refusal's, since the conflict check is untouched by it and still fires. M3, the UNDECLARED_BRANCH refusal removed: 2 failed, 232 passed, redding the undeclared-label test and the linear-exchange test, which is the correct blast radius for removing the consult itself. M4, the encoder DROPPING a branch it cannot carry instead of refusing (the fail-open shape): 1 failed, 233 passed, redding exactly the encode refusal.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because every refusal above would also pass on a register that refused everything. A second leg on the SAME branch at the next ordinal is an ordinary leg (without this the conflict refusal would be indistinguishable from a register admitting exactly one branch leg per exchange, which would cap every branching conversation at four legs and make the five-leg case impossible). A REDELIVERY of a branch leg is still a restatement, so C-S2 is unchanged. A LATE TRUNK LEG is admitted after the paths have already diverged and `arrived_out_of_order` records it, so C-S1 is unchanged and the case a stricter rule would have broken is asserted rather than hoped for. The same linear exchange that refuses every branch takes its trunk leg normally. A v2 interim identical but for the label encodes cleanly onto v2. And a v3 interim with an EXPLICIT NULL branch is accepted, which is what makes the MISSING_FIELD test about omission rather than about v3 trunk legs.\n\n  A RED THAT IS NOT MINE, RESOLVED BEFORE REACTING TO IT. Running the wider consumer set surfaced five failures in `tests/architecture` -- two in `test_no_committed_store_claims_an_unlanded_falsifier.py` and three ruff-ratchet nodes in `test_static_quality_ratchet.py`. All five fail identically in a detached worktree at a CLEAN HEAD with none of this pass's files present, so they are pre-existing and another lane's; the ruff one matches this project's own recorded finding that the ratchet is red at HEAD. Filed, not fixed (SELF_INTERRUPT_DISCIPLINE). Recorded because a bare red on a shared tree is the easiest thing here to misattribute to whoever read it last.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.wall_channel_census` was run in TWO detached worktrees -- one at clean HEAD, one carrying this pass -- and the readings are BYTE-IDENTICAL on every channel, exit code 0 both times. Deliberately not run from the shared worktree, where `docs/reports/run_output_latest.json` is uncommitted and moves channels D and F: that is this atom's own recorded two-trees artefact and pass 53 retracted a measurement to it. The correct reading of identical is that this pass neither opens nor clears a census red -- the census scores whether both roles of a seam are live, and a branch is a fact about one leg's content, which is a question it does not ask. `tools.epistemic_verifier` PASS on 580 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-58, so this pass creates no wall crossing and rules none away.\n\n  EVIDENCE: tests/company/interfaces/test_crossing_conversation.py 37 passed (22 at HEAD, 15 added); tests/company/interfaces/test_wall_protocol.py 163 passed (154 at HEAD, 9 added); tests/interface/test_wall_envelope.py 34 passed (27 at HEAD, 7 added); 1255 passed across the downstream consumers (tests/interface, tests/company/interfaces, the payment observation consumer, flex participation, the payment seam adapter, the susceptibility wire and the wall channel census); the four mutations above with the figures given; `ruff check` clean on all six changed files.\n\n  WHAT DID NOT CHANGE, said plainly. NO PUBLISHED FIGURE MOVED and none was recomputed: nothing in this pass is wired into a live run, and no module that produces a figure was touched. The two existing production callers of the register -- `PaymentObservationConsumer` and `FlexEnrolmentBook` -- are UNMODIFIED and declare no branches, which is correct rather than an omission: a Bacs collection has one path and two ways of ending it, and an exchange that declares no alternatives now refuses all of them, so the default is the stricter statement and not the weaker one. NO PRODUCTION CALLER DECLARES A BRANCH TODAY. The switch exchange is a worked case with a proven round trip and no scenario driving it -- the same shape as pass 43's `missing_sequences` and pass 53's `FlexEnrolmentBook`, and it is stated the same way rather than counted as traffic. `company/crm/cos_process.py` holds this build's CoS stage machine entirely company-side, driven by direct method call and crossing nothing; joining it to this register is a real next item and is NOT claimed here.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-58 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS. (a) Give the switch exchange a production caller: `CoSProcess` is a company-side state machine whose objection arrives by method call, so the company currently objects to its own switches. That is the next item and it is a new crossing rather than a widening of one, which is why it is not folded in here. (b) Q13's second half, unmoved by this pass and said plainly because a belt and a frame are easy to conflate: `_UNFRAMED_CROSSINGS` still names `company/comms/susceptibility_estimator.py` and `company/market/flex_participation.py`, nothing on those crossings checks WHO is speaking, and there is still no cryptography anywhere on this wall -- what is modelled is the REFUSAL, not SMKI/DIP signing. (c) Q5's no-response horizons at 1 min / 24 h / 5 working days, which `crossing_silence` answers in part and which no branching exchange is aged by yet. STRUCK: Q3's branching item itself, closed here. The target decision recommended at passes 38-58 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-22 pass 61 BUILD, level HELD at 2, loop_stage stays build. THE FLEX SEAM'S ONLY EVIDENCE THAT AN ANSWER WAS ADMISSIBLE CAME OUT OF THE ANSWER. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 49dabefe5, with all six touched files clean against HEAD before the first edit.\n\n  WHICH ITEM. Q13's second half, which pass 60 named as remaining and did not claim: `_UNFRAMED_CROSSINGS` still listed `company/market/flex_participation.py` and `company/comms/susceptibility_estimator.py`, and nothing on either crossing checked WHO was speaking. `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q5, Q13, Q14 payable (Q3 struck by pass 60) and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. The flex leg was taken and the susceptibility one was not; both halves are stated below rather than one being left to be inferred from a count.\n\n  THE DEFECT, AND IT IS NOT THAT THE ANSWER WAS UNCHECKED. `FlexEnrolmentBook.observe_outcome` DID check that an acceptance described its own offer: `MisroutedOutcome` compares the outcome's `unit_id` and `venue` against the company's own submission book, and pass 53 wrote it that way on purpose. But both of those values are read OUT OF THE MESSAGE BEING CHECKED. So the entire barrier between this company and an `enrolment_reference` minted by any process that could put bytes on the leg was that the impostor echo two fields back correctly -- the evidence for a message's admissibility was supplied by the message. That is the R15 TAUTOLOGY pattern at the transport layer, and the payment seam has not had it since pass 50. Reproduced before writing a line, and it is the mutation M2 below runs in reverse.\n\n  A VENUE IS A MARKET FUNCTION AND A SENDER IS A PARTICIPANT, which is why this is a mapping and not a `sender = venue.value` line. The contract has said so in as many words since it was written (`FlexVenue`: \"The flex MARKET FUNCTION, not a counterparty\"), and in GB the two genuinely do not line up: one system operator runs the balancing mechanism, the capacity market's delivery role AND the demand-flexibility service -- three functions, one counterparty -- while a local constraint market is run by the network operator for that region, a different party holding a different key. So `sim.flex_dispatch.FLEX_VENUE_OPERATORS` is the world's FACT of who runs what, `company.market.flex_participation.VENUE_OPERATORS` is the company's BELIEF about it, neither imports the other, and a disagreement REFUSES the crossing. A company that read the operator table off the world could not be wrong about it, and being able to be wrong is what makes the check a check.\n\n  TWO REGISTRY ROWS FOR ONE SEAM, and the second is not a line nobody maintains. With a single flex participant, \"the sender is registered with us\" and \"the sender runs the venue we addressed\" collapse into one question, a check of the operator would pass for the same reason a check of nothing would, and NO TEST IN THIS REPOSITORY COULD TELL THEM APART. `NETWORK-OPERATOR-01` exists so the wrong-operator refusal has a subject: a participant this build IS registered with, presenting its GENUINE credential, answering a DFS registration it does not run. Identity proved is not authorisation granted, and that case is the whole reason the row is there.\n\n  `FlexVenue.OTHER` HAS NO OPERATOR ON EITHER SIDE, and neither table has a default. On the world side a venue nobody runs a market for has nobody to put a message on the wire (`UnoperatedVenue`); on the company side the fail-open reading is \"we hold no expected operator, so accept whoever replied\", which is exactly how a registry with a fallback stops being able to say no. M3 below is that fallback, restored as a one-line mutation, and it reds.\n\n  A REFUSAL IS FRAMED TOO, not only an acceptance. An unframed refusal is a message any process could put on this leg to make a company believe its registration had been declined -- and a registration a company wrongly believes it does NOT hold is as expensive as one it wrongly believes it does. Both paths through `answer_enrolment` go through `frame_venue_message`.\n\n  THE RATCHET THAT NAMED THIS CROSSING COULD NOT HAVE RECORDED THE RESULT, and finding that out is half the pass. `test_the_framed_and_unframed_crossings_are_exactly_as_declared` classified each FILE, `if \"decode_framed_response(\" in text ... elif \"decode_response(\" in text`. `flex_participation.py` has TWO response decode sites -- the enrolment leg and `observe_response_wire`, which reads the dispatch-instruction and settlement feeds -- so framing one of them would have moved the whole module into the FRAMED set and its remaining bare leg would have stopped being named anywhere in this repository. A measurement that cannot express the state the system is actually in reports the state it can express. The ratchet is now per CALL SITE and read with `ast` rather than as substrings (the old scan counted the phrase in docstrings, so a comment could clear a crossing), and `flex_participation.py` is deliberately in BOTH tables: one framed leg, one bare.\n\n  THE STAND-IN CROSS-CHECK WAS SCANNING ONE WORLD TREE. `_stand_in_credential_fingerprints` walked `simulation/` only -- correct while the only stand-in lived in `simulation/payment_seam_adapter.py`, and silently wrong the moment a counterparty was impersonated from `sim/`. The two new rows would have been un-impersonated as far as that scan could see, so relabelling either `nature=REAL` would have passed the startup assertion AND passed the cross-check: the pair of controls that exist so a forgery cannot slip both would both have been blind. It now scans both trees, asserts `scanned > 0` PER TREE (a total over both stays non-zero while one silently stops being walked), and `test_the_declared_nature_of_every_row_matches_the_tree` quantifies over EVERY row instead of naming the payment one -- while the registry had one entry, naming it was the same as quantifying over it.\n\n  LANDED: `FLEX_VENUE_OPERATORS` in `sim/flex_dispatch.py`\n  LANDED: `SYSTEM_OPERATOR_ID` / `NETWORK_OPERATOR_ID` in `sim/flex_dispatch.py`\n  LANDED: `frame_venue_message` in `sim/flex_dispatch.py`\n  LANDED: `UnoperatedVenue` in `sim/flex_dispatch.py`\n  LANDED: `FLEX_SYSTEM_OPERATOR_SENDER` / `FLEX_NETWORK_OPERATOR_SENDER` rows in `company/interfaces/wall_protocol.py`\n  LANDED: `VENUE_OPERATORS` in `company/market/flex_participation.py`\n  LANDED: `WrongVenueOperator` in `company/market/flex_participation.py`\n  LANDED: `test_the_ANSWER_crosses_inside_a_frame_naming_the_venues_OPERATOR` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_LOCAL_constraint_market_is_signed_by_a_DIFFERENT_participant` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_REFUSAL_is_framed_too_and_not_only_an_ACCEPTANCE` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_venue_NOBODY_OPERATES_cannot_put_a_message_on_the_wire_at_all` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_the_HAND_OVER_time_has_no_default_and_may_not_be_taken_from_the_document` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_the_two_flex_operators_hold_DIFFERENT_credentials` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_an_UNREGISTERED_sender_is_refused_however_well_formed_its_ANSWER_is` in `tests/company/test_flex_participation.py`\n  LANDED: `test_a_KNOWN_participant_that_cannot_PRESENT_its_credential_is_refused` in `tests/company/test_flex_participation.py`\n  LANDED: `test_a_REGISTERED_participant_may_not_speak_for_a_venue_it_does_not_OPERATE` in `tests/company/test_flex_participation.py`\n  LANDED: `test_the_expected_operator_is_read_off_OUR_SUBMISSION_and_not_off_the_ANSWER` in `tests/company/test_flex_participation.py`\n  LANDED: `test_MUTATION_the_expected_operator_table_has_NO_DEFAULT_for_an_unknown_venue` in `tests/company/test_flex_participation.py`\n  LANDED: `test_the_companys_operator_table_is_its_OWN_and_agrees_with_the_worlds_today` in `tests/company/test_flex_participation.py`\n  LANDED: `test_the_framed_and_bare_crossing_SITES_are_exactly_as_declared` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_MUTATION_a_file_with_ONE_framed_and_ONE_bare_leg_is_not_recorded_as_framed` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_MUTATION_a_scan_of_ONE_world_tree_cannot_see_the_flex_stand_ins` in `tests/company/interfaces/test_wall_protocol.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in its own detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's six files copied in and only the named part swapped -- never on the shared worktree, which carried 250+ other-lane modifications throughout. The unmutated tree is the null control and was re-established for every mutation rather than assumed: 237 passed. M1, the venue-to-operator lookup replaced by ONE constant sender: 2 failed, 235 passed -- the local-constraint test and the unoperated-venue test, which is the correct blast radius for deleting the mapping itself. M2, the wrong-operator refusal removed: 3 failed, 234 passed. M3, that same refusal made FAIL-OPEN on a venue the company holds no operator for (`if expected_operator is not None and ...`): 1 failed, 236 passed, redding ONLY the no-default test -- which is what makes that test the fallback's own control rather than a copy of M2's, since the refusal is otherwise intact and still fires. M4, the flex stand-in row relabelled `nature=REAL`: 1 failed, 236 passed, redding the cross-check -- and that mutation would NOT have been caught by the `simulation/`-only scan this check shipped with, which is asserted inside the suite by `test_MUTATION_a_scan_of_ONE_world_tree_cannot_see_the_flex_stand_ins` rather than argued here.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because every refusal above would also pass on a seam that refused everything. The honest round trip still registers and still returns the venue's own reference. The unoperated-venue test frames the SAME envelope under an operated venue cleanly. The one-world-tree mutation asserts the PAYMENT row is still found under the narrowed scan, so it is the missing tree and not a broken scanner. And `test_the_expected_operator_is_read_off_OUR_SUBMISSION_and_not_off_the_ANSWER` keeps the payload honest (it still says `dfs_turn_down`) and moves ONLY the signer: an implementation reading the venue off the message would accept that message, so the test distinguishes the two implementations rather than merely exercising one.\n\n  THE INSTRUMENTS, none of them edited here, and both run in TWO detached worktrees -- one at clean HEAD, one carrying this pass -- rather than on the shared tree, where `docs/reports/run_output_latest.json` is uncommitted and moves channels D and F (this atom's own recorded two-trees artefact; pass 53 retracted a measurement to it). `tools.wall_channel_census`: readings IDENTICAL on every channel, exit 0 both times, flex surface pin unchanged at v2 = e9d4eb24a8d69735. The correct reading of identical is that this pass neither opens nor clears a census red: the census scores whether both roles of a seam are live and whether a version still means what it says, and a transport frame around an unchanged envelope is neither. `tools.company_network_isolation`: IDENTICAL, exit 1 at HEAD and exit 1 here -- the four frozen routes, unchanged; the new `company.market.flex_participation` reference to two participant-id constants opens no route to an endpoint. `tools.epistemic_verifier` PASS on 544 files.\n\n  EVIDENCE: tests/sim/test_flex_dispatch.py 49 passed (43 at HEAD, 6 added); tests/company/test_flex_participation.py 23 passed (16 at HEAD, 7 added); tests/company/interfaces/test_wall_protocol.py 165 passed (163 at HEAD, 2 net added, one existing test rep