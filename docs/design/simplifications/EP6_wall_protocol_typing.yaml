simplifications:
- '2026-08-20 pass 34 BUILD, level HELD at 2, loop_stage stays build. THE SECOND OF PASS 33''S TWO NAMED BLOCKERS IS CLOSED: THE CENSUS NOW HAS A QUESTION THAT FAILS ON UNSOLICITED INBOUND, AND THE LIVE WALL FAILS IT 2 OF 3. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD bf41f02ed, worktree.


  WHAT PASS 33 LEFT. The cold-eyes walk ran and said NOT YET, on two build items this seat can do: (1) give `WallStatus.TIMEOUT` a reader or delete it; (2) give the census a question that FAILS on an all-dormant request leg. This pass does (2) and does not touch (1), which remains the atom''s last named L3 blocker. Doing one and claiming both would be the ceremony the walk exists to stop.


  THE DEFECT, RESTATED PRECISELY, because pass 33''s prose was one step off. The walk said ''all-dormant request leg''; the code says something sharper. `envelope_wire_conformance` skips dormant legs when building `scored`, then credits a seam as `wire_borne` if every leg that REMAINS is transported. So a seam with a dormant request and a wired response is not merely unscored -- IT SCORES AS A FULL PASS. The transport question''s strongest possible answer, 3 of 3 wire-borne, is returned by a wall on which two of the three conversations never happen. The seam-level verdict credits a two-leg crossing on one leg, which is a class this project has already recorded once.


  THE CONTROL. `seam_conversation_conformance` in `tools/wall_channel_census.py`, with `ConversationVerdict` and `_at`. It asks one question per versioned seam -- ARE BOTH ROLES LIVE -- and sorts into four scored buckets, each naming a different repair: `conversant` (both live, the green case), `unsolicited` (response live, nobody asks), `unanswered` (request live, nobody answers), `silent` (neither). `versionless` and `legless` are reported and NOT scored, carrying the same honesty the transport verdict carries.


  THE LIVE READING, which is the finding: 1 of 3. `conversation_seam` is conversant. `flex_observable_seam` and `payment_observable_seam` are both UNSOLICITED INBOUND -- they declare a request leg this build never sends, so the company receives their observations as answers to nothing and the envelope''s `correlation_id` correlates to nothing it sent. This is exactly what the blind reviewer predicted from five sentences and no code: "''We model it as a response to a synthetic request'' is a fail." It now reds instead of printing as a neutral status word.


  WHY ROLE LIVENESS AND NOT LEG DORMANCY, which is the whole design decision and was measured, not assumed. The obvious implementation keys on ''a DECLARED leg that is dormant''. That rule can be shed by a ONE-LINE EDIT: delete the seam''s `WallRequest[...]` specialisation and there is no declared leg to be dormant, so the finding vanishes while the architecture gets WORSE -- the contract stops even claiming an ask. That is the R15 mutation that deletes the subject instead of moving it, and scope loss would have scored as green. Both rules were run side by side on the same fixture: on the deletion the weaker rule returns () and this one returns the seam. A role that is undeclared and a role that is declared-but-dormant are therefore the same bucket, and deleting the declaration is not available as a repair.


  IT REPORTS AND DOES NOT GATE, and that is a rule this file had already stated twice: a check becomes a gate ''in the same commit that makes it satisfiable''. This is the first check to arrive UNSATISFIED. Wiring it into the CLI''s exit code would refuse EVERY commit in the repo including the ones that repair it -- pass 13''s landing-order defect, learned twice already. So the verdict is PRINTED by `main()` and `test_the_conversation_check_is_REPORTED_by_the_CLI_and_deliberately_NOT_in_its_exit_code` asserts BOTH halves off the source: that `conversations.report()` reaches a reader (a control nobody sees is not reporting), and that `conversations.ok` is NOT in any return (arming it now would wedge the tree). That test names its own deletion condition.


  R15, AND THE GREEN CASE IS REACHABLE. 13 tests, section 22, all against section 15''s `two_leg_tree` fixture on purpose: where section 15 asserts `wire_borne`, section 22 asserts RED on the SAME tree, and `test_MUTATION_a_seam_nobody_ever_ASKS_is_UNSOLICITED_INBOUND` asserts both verdicts in one function so the disagreement is pinned rather than described. Mutations: nobody asks -> unsolicited; nobody answers -> unanswered (asserted NOT to collapse into unsolicited -- opposite defects, opposite repairs); neither -> silent, the bucket the transport question `continue`s past entirely; the declaration-deletion escape -> still red. NULL CONTROLS: an unrelated module constructing an unrelated type moves nothing (verdict equality, so the sample moves and the law does not), and `wall_envelope` stays reported-not-scored. FAIL-CLOSED: every seam losing `SCHEMA_VERSION` raises `CensusUnavailable` rather than printing a tidy ''0 of 0''. Zero seams is NOT refused -- a paid-down channel is this atom''s success case. The green case is reachable on the fixture, which matters because the live tree is red: a control that has only ever said no is indistinguishable from one that can only say no.


  A COLLISION CAUGHT BY THE RATCHET, recorded because the loss would have been silent. The new zero-seam test was first written under the same name as section 13''s, and a duplicate `def` at module scope does not fail -- Python rebinds, pytest collects only the second, and the transport question''s zero-seam branch would have stopped being tested with nothing reporting a loss. ruff F811 refused it. Renamed, and the reason is in the docstring. Test count moved 172 -> 186 (+13 new, +1 restored); the file is green.


  WHAT REMAINS FOR L3. One item, unchanged from pass 33: `WallStatus.TIMEOUT` has no production reader. Both company-side consumers collapse all four statuses to OK/not-OK (`company/billing/payment_observation_consumer.py:611`, `company/market/flex_participation.py:274`), so a status the contract distinguishes releases exactly what `ERROR` releases -- R11''s orphan transition in the small. NOTE FOR THE NEXT PASS, since it decides the shape of that work: those two modules are OUTSIDE this atom''s `file_scope`, which names only `wall_protocol.py`, its test, `wall_channel_census.py` and its test. The landable set is wider than the file_scope; the scope needs the two consumer paths added before that item can land, and that is a map edit, not a build. INFERRED: the unsolicited finding and the TIMEOUT finding are probably one defect seen twice -- a seam whose request leg is never sent cannot meaningfully time out, so giving TIMEOUT a reader on an unsolicited seam may be building a reader for an event that cannot occur. The next pass should decide which of the two repairs comes first rather than assuming they are independent.'
- "2026-08-20 pass 35 BUILD, level HELD at 2, loop_stage stays build. THE ATOM'S LAST NAMED L3 BLOCKER WAS THE WRONG UNIT, AND ENUMERATING THE VOCABULARY FOUND ITS SIBLING IN THE SAME STATE. Passes 33 and 34 both closed carrying one item in the same words -- \"give `WallStatus.TIMEOUT` a reader or delete it\". Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 291620cbb, worktree, with this atom's subject files CLEAN against HEAD before the pass.\n\n  THE MEASUREMENT CAME FIRST AND IT IS THE FINDING, which is this atom's own pass-29 lesson applied to its own backlog. Counting the `WallStatus.X` mentions across the census trees instead of reasoning about the one member somebody had noticed: TIMEOUT HAS NO WRITER EITHER. Nothing in `sim/`, `simulation/`, `company/`, `saas/`, `interface/` or `tools/` constructs it. So the repair both previous passes handed forward -- add a reader -- is a build item for a message this wall cannot send, and it would have landed as a satisfied blocker and a branch no test could reach. R11's orphan transition pointed at the RELEASE half: a hold whose release triggers nothing.\n\n  AND THE MISS SAT NEXT TO THE HIT, for the second recorded time on this atom, which makes it a class here and not an instance. Pass 29: the belt named `nudge_uplift` and missed `tone_uplift`, drawn four lines apart by the same helper. Pass 35: three passes named TIMEOUT and NONE named `ERROR` -- its immediate sibling in the same four-member enum, in the identical state (no writer, no hearer), and distinguished from it by the very docstring sentence that made TIMEOUT worth naming (\"`TIMEOUT` is distinct from `ERROR`\"). A list assembled by noticing gets the member someone was looking at. Only enumerating the vocabulary gets the second one.\n\n  THE LIVE READING, 1 OF 4, and the third bucket was named by nobody either. `OK` is said by three modules and distinguished by one. `NOT_KNOWABLE_YET` is UNHEARD -- `simulation/payment_seam_adapter.py` says it and NOTHING distinguishes it, because both company-side consumers collapse every non-OK member to not-OK (`payment_observation_consumer.py:611`, `flex_participation.py:274`), so the honest answer the envelope's docstring is proudest of is discarded on arrival. `TIMEOUT` and `ERROR` are UNINHABITED. Meanwhile `_decode_status` in `company/interfaces/wall_protocol.py` accepts ALL FOUR off the wire, as a decoder must -- so the company can RECEIVE a status it cannot SEND and cannot ACT ON. That is the atom's `gain` failing in the small: a real transport produces timeouts on day one, and go-live would find the distinction unbought.\n\n  THE CONTROL. `status_liveness_conformance` in `tools/wall_channel_census.py`, with `StatusVerdict`, `declared_statuses`, `status_mentions` and `_at`. One question per declared member -- IS IT SAID, IS IT ACTED ON -- sorted into four buckets each naming a different repair: `live`, `unheard` (writer, no reader), `unspoken` (reader, no writer -- the dead arm the proposed repair would have built), `uninhabited` (neither, and the ordering is stated: writer first, because a reader alone IS the unspoken bucket). Population DERIVED from the enum, so a fifth member is scored the day it lands.\n\n  EVERY ERROR IT CAN MAKE IS TOWARD GREEN, chosen deliberately because it arrives RED: a red it manufactured would be worse than a finding it lost. Mention-counting is generous in both directions -- any `WallStatus.X` outside a comparison counts as speaking it, any inside one counts as hearing it, and readers count on BOTH sides of the wall. A member this calls uninhabited is uninhabited under the loosest reading available. `match` arms are counted as HEARING, and that closed a fail-open with a shelf life rather than a hypothetical one: read naively, the first consumer rewritten from `if status != OK` to a four-arm `match` would have flipped every member it reads from heard to said, and the verdict would have gone GREENER as the code got better.\n\n  R15 TAUTOLOGY, and it is the reason the declaring module is excluded from both counts. `WallResponse.__post_init__` compares against `OK` and `ERROR` to enforce its payload invariants. Counting that as a reader would derive the checked value from the source it checks, and every member would be born live the moment someone wrote a payload invariant for it -- the vocabulary certifying itself. `test_R15_TAUTOLOGY_the_declaring_module_cannot_inhabit_its_own_vocabulary` adds `ERROR` to a fixture in exactly that shape and asserts it stays uninhabited.\n\n  THE BLIND SPOT IS PINNED, NOT DESCRIBED, AND IT NEEDED A SECOND CONTROL. This question derives its population from the declaration it measures, so DELETING a member does not move the finding -- it removes the subject and leaves, scoring as a full repair. That is the R15 mutation that deletes the subject instead of mutating it (a class already on this project's record), and pass 33's own wording invited it: \"or delete it\". Deleting TIMEOUT is the cheap cut that BANKS the defect behind the wall -- the contract stops being able to distinguish \"the answer did not arrive\" from \"the answer is that this failed\", which is the one distinction `WallStatus` exists to draw, and go-live is exactly when it is needed. So `STATUS_VOCABULARY_FLOOR` + `missing_from_status_floor` land in the same commit, GROW-ONLY -- the opposite direction to the census baseline beside it, and the difference is what each list is for: a channel shrinks as crossings are paid down; a vocabulary shrinks when the wall loses the ability to say something. `test_MUTATION_deleting_TIMEOUT_is_INVISIBLE_here_and_REFUSED_by_the_floor` asserts BOTH halves in one function, so the pairing cannot rot apart and the liveness question's limit is a failing assertion rather than a docstring claim.\n\n  THE TWO HALVES ARE WIRED DIFFERENTLY, BY THIS FILE'S OWN RULE -- a check becomes a gate \"in the same commit that makes it satisfiable\". The liveness question arrives UNSATISFIED (3 of 4 red), so it REPORTS: gating it would refuse every commit in the repo including the ones that repair it, which is pass 13's landing-order defect this file has now learned three times. The FLOOR is satisfiable at HEAD -- all four members declared -- so it GATES from its first commit, and the only commits it can refuse are commits that delete a member, which is precisely its subject. Landing the liveness check WITHOUT the floor would have shipped a control whose cheapest repair is deleting its own subject.\n\n  R15 OTHERWISE. 15 tests, section 23/23b. Green case REACHABLE on the fixture (2 of 2 live) -- which matters because the live tree is 1 of 4, and a control that has only ever said no is indistinguishable from one that can only say no. Mutations: reader-without-writer -> `unspoken`; writer-without-reader -> `unheard`, asserted NOT to collapse into `unspoken` (opposite defects, opposite repairs, and a control that merged them would name the wrong half of the work); neither -> `uninhabited`; a new member declared tomorrow -> scored uninhabited with no edit to the control. NULL CONTROL: an unrelated `ReplayStatus` enum with the SAME member names moves the verdict not at all (asserted by whole-verdict equality, so the sample moves and the law does not). FAIL-CLOSED three ways: module absent, class absent, class empty -- and ZERO MEMBERS IS REFUSED, deliberately inverting the zero-is-fine rule the seam questions follow, because a paid-down seam channel is a success case and an emptied vocabulary is a deleted contract. Test count 186 -> 201 (+15); `ruff` clean, which is the check that caught pass 34's silent duplicate-`def` collision.\n\n  MAP EDIT, AND IT IS WIDER THAN PASS 34 SAID. Pass 34 recorded that the scope needs the two CONSUMER paths added before the TIMEOUT item can land. The measurement says that is half of it: with no writer, the repair needs PRODUCER paths too. `file_scope` gains four -- `company/billing/payment_observation_consumer.py`, `company/market/flex_participation.py`, `simulation/payment_seam_adapter.py`, `sim/flex_dispatch.py`. Recorded under the 2026-08-19 director instruction's reading, which puts `file_scope` outside the curriculum reservation: it declares which files an atom owns, changes no difficulty, sets no target and tunes no output.\n\n  WHAT REMAINS FOR L3, restated in the unit the measurement supports rather than the one pass 33 guessed. THREE members fail, not one, and they are two pieces of work. (1) `NOT_KNOWABLE_YET` is UNHEARD and needs only a reader -- the writer exists, the event already occurs, and this is the cheapest of the three and the only one with no design question in it. (2) `TIMEOUT` and `ERROR` are UNINHABITED and need a WRITER FIRST: a world-side adapter that can fail to answer in time and one that can fail structurally, then the company-side branches. ANSWERING PASS 34'S ORDERING QUESTION, which it correctly refused to answer by inference: it guessed the unsolicited finding and the TIMEOUT finding were \"probably one defect seen twice\", and on this measurement they are NOT -- `payment_observable_seam` is unsolicited AND its adapter is the one module that already says `NOT_KNOWABLE_YET`, so its status path is live while its request leg is not. The two findings share a seam and not a cause. INFERRED, and flagged as the next pass's first question rather than assumed: (2) may not be buildable honestly while the seam is unsolicited, because a timeout is a fact about a request that was sent, and on an unsolicited seam nothing was sent to time out -- which would make the conversation repair the true predecessor of the TIMEOUT repair, and would be the first time these two questions have had an ordering between them."
- '2026-08-20 pass 36 BUILD, level HELD at 2, loop_stage stays build. THE HANDED-FORWARD ITEM WAS THE CHEAP ONE BECAUSE NOBODY HAD ASKED WHAT ENDS THE STATE IT CREATES: hearing `NOT_KNOWABLE_YET` was worthless until a resolution could still land on the id the honest answer had already burned. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD ae5f77a86, worktree, with this atom''s eight file_scope files CLEAN against HEAD before the pass.


  WHAT PASS 35 HANDED FORWARD, VERBATIM: "(1) `NOT_KNOWABLE_YET` is UNHEARD and needs only a reader -- the writer exists, the event already occurs, and this is the cheapest of the three and the only one with no design question in it." The writer half is true and was re-checked (`simulation/payment_seam_adapter.py:308`, the DISPUTE branch, with a live generator branch behind it at `simulation/arrears_engine.py:405`). The rest is false, and this atom''s own pass-29/pass-35 lesson is what found it: check the PRECONDITION of the repair you were handed, not the sentence.


  THE MEASUREMENT, and it is the finding. `PaymentObservationConsumer.observe` marked a `correlation_id` processed whatever the status, so the reader pass 35 proposed would have read a state with NO EXIT. Run against the live class as it stood: a `NOT_KNOWABLE_YET` for `INV-1`, then the OK remittance that resolves it, returns True then FALSE -- the resolution dropped as a duplicate re-delivery, GBP 120.00 of received cash never posted, the account still reading 120.00 outstanding. The NULL CONTROL beside it is what makes that a defect rather than a design: the identical resolution, on a consumer that had never heard the pending answer, posts normally and the balance clears. HEARING THE HONEST ANSWER WAS THE ONLY THING THAT COST THE COMPANY THE FACT.


  WHY THE SHIPPED DOCSTRING SAID OTHERWISE, because it named this exact scenario and got it backwards. It claimed marking non-OK processed was safe since "a resolved response uses a fresh, later `WallResponse` for the same fact per the envelope''s own bitemporal-restatement rule". Fresh RESPONSE, yes. Fresh CORRELATION ID, no: `interface/contracts/wall_envelope.py` says a `WallResponse` is "Matched to its request ONLY by `correlation_id`" and that a restatement "is always a NEW `WallResponse` with a later `observed_at` for the same `valid_time`". The id is the crossing; the resolution necessarily arrives on it. The claim was checked against the sentence next to it rather than against the contract it cited.


  THE REPAIR IS A SPLIT, NOT A FLAG. One processed-set could not tell "a fact is in hand" from "an answer is still owed", so it became two: `_resolved_correlation_ids` (an OK landed -- a re-delivery must never post twice, C-S2) and `_unresolved` (latest answer was non-OK -- still open). Four limbs, each a different obligation: a resolved id refuses everything (a payload-less response cannot restate a value, so "not yet" never revokes observed cash -- the conservative limb, and exactly what the method did before); a non-OK no later than the one held is a re-delivery or a late-arriving older answer (C-S1) and returns False; a later non-OK SUPERSEDES; an OK resolves, clears the register and posts.


  THE READER IS ONE BRANCH AND ONLY ONE, WHICH THE CENSUS BESIDE IT DICTATED. `UnresolvedCrossing.awaiting_resolution` is `status == WallStatus.NOT_KNOWABLE_YET` and nothing else. That member is the only non-OK answer that says something about the FACT (the counterparty has it, it is not resolvable yet, an answer is still owed); `TIMEOUT` and `ERROR` say something about the EXCHANGE. A branch for either of those would have been a reader for a message NOTHING IN THIS BUILD SAYS -- the dead arm pass 35''s `status_liveness_conformance` exists to stop, and which its live test asserts against. They are recorded undifferentiated, which is honestly all this company can do with them today.


  THE LIVE READING MOVED, by the atom''s own instrument and not by narration: `status_liveness_conformance_at(worktree=True)` was 1 of 4 at HEAD and is 2 of 4 now, `unheard` empty, `NOT_KNOWABLE_YET` said by `simulation.payment_seam_adapter` and distinguished by `company.billing.payment_observation_consumer`. The 23b live test was written to FAIL on exactly this ("WHEN THIS GOES GREEN the assertions below fail") and did, before being tightened: `live` is now GROW-ONLY, `unheard` is asserted EMPTY rather than bounded, the red buckets stay shrink-only.


  WHAT THIS DOES NOT BUY, THREE LIMITS, EACH MEASURED RATHER THAN HEDGED.

  (a) THE WORLD NEVER SENDS THE RESOLUTION. `emit_wall_responses` maps one `PaymentEvent` to its responses and no dispute RESOLUTION is ever emitted -- while the world models one, at `simulation/arrears_engine.py::ic_arrears_stages`: PAYMENT_PLAN_AGREED at +30d if eventually resolved, WRITTEN_OFF at +60d if not. So in a run the register opens and never closes. The EXIT is proven at the unit level (a later OK lands, and the mutation test shows the shipped rule losing it), so the state is no longer structurally terminal -- but the writer that would clear it in a live run does not exist, and that is the next piece of work, named.

  (b) NO NOT_KNOWABLE_YET CROSSES THIS WALL IN THE ONE SCENARIO THAT RUNS. `tools/couple_w2_11_d5.py:596` fixes the triad population to `segment="resi"`, and `payment_outcome` can only return "dispute" on the corporate (I&C) branch or via `sme_payment_outcome`; 100,000 resi draws across all five methods returned only success/failed. So the census''s SPOKEN is a mention-count, not a traffic-count, and here the difference is visible: a member can read `live` in the vocabulary and never cross the wall in the scenario the triad draws. A liveness question asked of TRAFFIC rather than of mentions is a candidate next instrument, and it would be a different question from both existing channel-C ones.

  (c) THE OTHER CONSUMER STILL REFUSES THE ANSWER, and pass 35''s wording for it was one step off in the same direction its own wording was off about dormancy. `company/market/flex_participation.py:270` does not collapse `NOT_KNOWABLE_YET` into not-OK -- it raises `WallProtocolError("CONTRACT_VIOLATION")` on any payload-less response, i.e. it treats the envelope''s proudest answer as a MALFORMED MESSAGE. That is a stronger defect than "collapsed", and it is not repaired here: that seam is UNSOLICITED INBOUND (`seam_conversation_conformance`, 1 of 3), so nothing asks it anything, and its repair sits behind the conversation repair rather than behind this one.


  THE ADJACENT WIRING DELIBERATELY NOT DONE, because it would have been a claim the seam never made. `company/billing/account_ledger.py`''s named simplification (3) says dispute state is PASSED IN as `disputed_refs` and "the live wiring is a seam-crossing job", and this atom is that seam. The register is NOT wired into `disputed_refs`: an unresolved crossing means "the counterparty has not answered yet", which is not the same assertion as "this invoice is under formal dispute", and treating them as one would move `expected_collection_misses` and the ageing buckets on a claim the wire does not carry. Named as the successor question, with the distinction stated, rather than taken because it was reachable.


  ATTRIBUTION, AND WHY IT FAILS TOWARD SILENCE. A non-OK response carries no payload and therefore no `account_id` -- the correlation id is the whole of what arrives. `unresolved_crossings(account_id, as_of)` joins by EXACT equality against that account''s own billed `invoice_ref`s (exact where the caller sets `correlation_id == invoice_ref`, which is the triad''s DD path) and matches nothing otherwise: a push payment quoting no invoice reference is attributed to NOBODY rather than to a guess. Parsing the id would be attribution by substring, a class already on this project''s record. Unattributable crossings stay visible in the account-less call, so the register loses no crossing, only a claim about whose it is.


  R15. 9 tests added (32 -> 41 in the consumer file). MUTATION: the shipped rule -- one processed-set, any status -- reproduced inline over the identical stream, asserted to return False on the resolution and to leave GBP 120.00 unposted, so the control fires on its own named defect. NULL CONTROL: the never-told consumer reaching the same balance, without which the headline test asserts only that cash posts. C-S2 (a redelivered pending answer is a no-op and does not multiply in the register), C-S1 (a later answer supersedes, an older one arriving late does not), the resolved-wins limb, the Blindfold (a crossing observed after `as_of` is absent from both the register call and the snapshot), attribution-to-nobody, and order-independence across three arrival orders. `ruff` clean on both changed source files; the two pre-existing I001s in the consumer test file are at HEAD and unchanged.


  MAP EDIT: `file_scope` gains `tests/company/billing/test_payment_observation_consumer.py` -- the file this pass''s controls live in was not in the declared scope, which is the "landable set is wider than the file_scope" class this project has recorded before. Same reading pass 35 used: `file_scope` declares which files an atom owns, changes no difficulty, sets no target, tunes no output.


  WHAT REMAINS FOR L3, and for the first time these items have an ORDER between them rather than a list. (1) A world-side WRITER for dispute resolution, so the register can close in a run and not only in a test -- and it is the only remaining item with no upstream dependency. (2) `ERROR` needs a writer then a reader; INFERRED, and flagged as a question rather than a plan: a structural refusal can be reported on an inbound message without any request having been sent, so ERROR does NOT appear to be blocked behind the conversation repair. (3) `TIMEOUT` needs a writer, and pass 35''s ordering question now looks answered in the affirmative: a timeout is a fact about a request that WAS SENT, both remaining seams are unsolicited inbound, so the conversation repair is the true predecessor of the TIMEOUT repair. That makes the seam-conversation finding upstream of one of the two vocabulary findings and independent of the other -- which is the first time this atom''s two open channel-C questions have been ordered against each other by anything but a guess.'
- "2026-08-20 pass 37 BUILD, level HELD at 2, loop_stage stays build. THE L3 EXIT CRITERION HAS BEEN SITTING ON DISK, CLOSED AND BLIND-AUTHORED, SINCE PASS 33 -- AND NO PASS SINCE HAS WORKED IT. Seven of the cold-eyes battery's twelve DISQUALIFYING questions had never been reconciled against the code by anybody, while passes 34, 35 and 36 each derived a fresh \"WHAT REMAINS FOR L3\" list from their own investigation. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 5f1553fea, worktree, with all nine file_scope files CLEAN against HEAD before the pass.\n\nWHAT THE DRAW ASKED FOR AND WHY IT WAS REFUSED. The tick drew this atom for BUILD. `python3 -m tools.discovery_pass_ceiling` names it saturated -- 35 passes, 28 since the level last moved, second worst in the project -- and its verdict is explicit: \"another build pass at the same level is no longer an available answer\". So a thirty-seventh build item was not taken. The three answers the ceiling does offer are land the move, record `infeasible_here`, or close, and establishing WHICH of those is true is the only work that can end the loop.\n\nTHE MEASUREMENT, AND IT IS THE FINDING. L3 is defined in `docs/design/MATURITY_MAP.md:52` as \"passed the full loop incl. HARDEN; Expert Hour: 'this is real'\". The Expert Hour for this atom RAN in pass 33, and `docs/observability/blind_review_ledger.jsonl` holds its battery VERBATIM: 17 questions, 12 of them marked DISQUALIFYING by the reviewer BEFORE any code was seen. That is a CLOSED SET, authored blind, sitting on disk -- the exit criterion, already written down. Pass 33 reconciled five of the twelve (Q1, Q2, Q3, Q5, Q11) and found two passing. SEVEN WERE NEVER RECONCILED BY ANY PASS. Reconciled now, against the tree:\n  * Q6 FAIL -- the seam REFUSES spec-violating input and the consumer handles duplicates and out-of-order revisions (C-S1/C-S2, pass 36), but no STAND-IN can EMIT spec-violating traffic in regression. The malformed inputs are hand-built test fixtures, not counterparty behaviour.\n  * Q9 FAIL, EPOCH-GATED -- no contract tests against any counterparty's real test environment, and none possible: `tools/company_network_isolation.py` makes it a WALL that company/ and saas/ may not open a socket, ever. Stand-in-vs-real divergence is undetectable by construction here.\n  * Q10 FAIL -- `company/interfaces/wall_protocol.py:91`, `SUPPORTED_SCHEMA_VERSIONS = frozenset({1})`. A single GLOBAL version constant with no per-counterparty dimension: exactly the shape the reviewer said makes every market release a big-bang cutover.\n  * Q13 FAIL -- and it is the sharpest. There is NO counterparty authentication anywhere below the port. A repo-wide search for SMKI, DIP signing, DTN participant identity, mutual TLS or client certificates hits only `background/one_way_door.py:196` and its test, i.e. the project models SMKI accession solely as a RESERVED REAL-WORLD ACT and never as a verified property of a message. The atom's headline claim -- a mock counterparty and a real one are indistinguishable to the company -- is TRUE HERE BECAUSE THE IDENTITY CHECK IS ABSENT FROM THE PATH. That is the reviewer's precise objection, predicted from five sentences: a control gap, not an abstraction. NOT epoch-gated: modelling identity verification below the port against a stand-in needs no real certificate.\n  * Q14 FAIL -- nothing stops a stand-in configuration reaching production because nothing distinguishes them; no environment segregation and no startup assertion exists across the seam contracts.\n  * Q15 FAIL, EPOCH-GATED -- nothing runs against DCC SIT/UIT/UEPT, CSS test or the DIP test environments, and this layer feeds no Elexon qualification or REC entry-assessment evidence. Reserved classes 1 and 2; `EP19_counterparty_qualification_paths` (epoch 5) is where that register lives.\n  * Q17 PASS -- the honest \"they don't, they're outside this\", which the reviewer explicitly named as fine and expected. A