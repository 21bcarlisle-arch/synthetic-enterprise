- "2026-08-21 pass 50 BUILD, level HELD at 2, loop_stage stays build. TWO OF THE WALL'S FOUR LEGS WERE LIVE AND UNAUTHENTICATED, AND THE ONE THAT MOVES MANDATE BELIEF WAS ONE OF THEM. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 5facfca90 for the mutations (a tree materialised outside the repo), the worktree for everything else, with all six touched file_scope files clean against HEAD before the first edit and still this lane's only modifications on them at landing.\n\n  WHY THIS CRITERION. `python3 -m tools.discovery_pass_ceiling` reports EP6 in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- and names five payable rows (Q2, Q3, Q5, Q13, Q14) that must keep being drawn, with an explicit instruction NOT to record `infeasible_here` because that verdict retires the payable half. Of those five, Q2's own row named its next item in its own words: reason (c), 'THE NOTIFICATION LEG DOES NOT TRAVEL THE WIRE ... an unsolicited message is accepted from anybody. That is Q13's axis and is the next item on this leg.' Pass 44's row named the same gap on the interim leg. Two rows, one repair, and Q13 is the least-recently-touched payable row -- still on pass 39's text.\n\n  THE DEFECT, STATED AS AN ASYMMETRY RATHER THAN AN ABSENCE. The response leg has been framed since pass 39: a message naming an unregistered participant, presenting a wrong credential, or stamped with a release that counterparty is not on is refused before the envelope is read. The interim leg (pass 44) and the notification leg (pass 43) were live from the day they were built and crossed to the company as IN-PROCESS OBJECTS, so they went round all of it. That is worse than an unbuilt leg, because the crossing reads as authenticated from the response leg alone -- and the leg that skipped the check is the ADDACS advice, which feeds `_observe_addacs` and moves this company's belief that a customer's mandate is dead. The reviewer's Q13 names this shape exactly: 'If indistinguishability was achieved by removing it from the path, that's a control gap, not an abstraction.'\n\n  WHAT THIS PASS PUT IN THE TREE. World side, `simulation/payment_seam_adapter.py`: two encoders written against the published SCHEMA and not against the company's decoders (this module may not import `company.*`, and an encoder built by reading the receiver makes the round trip a handshake with itself), plus the two functions that wrap each in this participant's transport frame. Company side, `company/billing/payment_observation_consumer.py`: two framed entry points, decoding through `decode_framed_interim`/`decode_framed_notification` -- the two decoders pass 48 built and NOTHING CALLED. Live side, `background/live_payment_triad.py`: the run `run_phase2b` drives now crosses both legs framed, one encoding shared by both books for the same reason the response leg shares one -- a shadow receiving different bytes would differ in the transport as well as in the variable the counterfactual isolates. The checkable claims, one per line and each verified against the tree this commit creates:\n  LANDED: `encode_wall_interim` in `simulation/payment_seam_adapter.py`\n  LANDED: `encode_wall_notification` in `simulation/payment_seam_adapter.py`\n  LANDED: `emit_wire_interim` in `simulation/payment_seam_adapter.py`\n  LANDED: `emit_wire_notification` in `simulation/payment_seam_adapter.py`\n  LANDED: `observe_wire_interim` in `company/billing/payment_observation_consumer.py`\n  LANDED: `observe_wire_unsolicited` in `company/billing/payment_observation_consumer.py`\n  LANDED: `decode_interim_payload` in `company/billing/payment_observation_consumer.py`\n  LANDED: `decode_unsolicited_payload` in `company/billing/payment_observation_consumer.py`\n  LANDED: `emit_wire_notification` in `background/live_payment_triad.py`\n  LANDED: `test_q13_the_LIVE_notification_leg_IS_FRAMED_and_is_not_an_orphan` in `tests/background/test_live_payment_triad.py`\n\n  THE REFUSAL THAT EXISTS ONLY ONCE THERE IS A FRAME, and it is the part worth having rather than the identity check itself. A notification names its sender TWICE: once in the frame, authenticated against a credential fingerprint the company holds and the counterparty's module never sees, and once as a document field, because `sequence` is a position in ONE counterparty's stream and a notification separated from its frame must still be orderable. `decode_framed_notification` refuses a disagreement as SENDER_MISMATCH -- an authenticated participant relaying another's stream position would corrupt precisely the gap detector pass 43 built that field for. The object path cannot even ask the question, and the test asserts both sides side by side.\n\n  TWO THINGS THE WIRING MADE THIS PASS FIND, neither planned, both about my own side of the wall. (a) ALL THREE LEGS SHARED ONE PAYLOAD TABLE, so the LEG carried no claim about what kind of thing had arrived -- a counterparty could ship its outcome as an acknowledgement, or a mandate advice as an answer to a question nobody asked, and every check between the wire and belief would still pass. Each leg now encodes and decodes against the set the CONTRACT declares for it, and `observe_interim` gained the object-level refusal `observe_unsolicited` already had. All three tuples are DECLARED in `interface/contracts/payment_observable_seam.py`, so none is computed from what the adapter happens to send. (b) THE DECODE LEG HAD NO BRANCH FOR AN INT. The interim payload is the first on this seam to carry one -- Bacs file-level item counts -- so a leg the contract had DECLARED could never actually have crossed; pass 44's 'declared but not encodable' limit was two-sided and only the encode half was written down. 38.0 is REFUSED rather than read as 38: a float where the contract declares a count means the two sides disagree about the field, and coercing it hides exactly that. A third, smaller: the silence-ladder fixture was handing the consumer a bare dict as an interim payload and is now a real `BacsInputReport`, so that class proves itself against a message this seam actually carries.\n\n  WHAT DID NOT CHANGE, said plainly. NO PUBLISHED FIGURE MOVED and none was recomputed: transport is not a belief. The same population sends the same messages into the same books; what changed is who is permitted to send them, and the live run's inbound stream reports no invented gap and no poorly-delivered hand-over. The level is still 2 and cannot move, for the reason the ceiling states: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built.\n\n  R15 BOTH WAYS, RUN AT THIS TICK, each against a tree materialised by `git archive` OUTSIDE the repo with only the changed files swapped in -- never on the shared worktree, which carried 200+ other-lane modifications and two full suites in flight throughout. MUTATION 1: revert the live advice loop to the object path (the shape this build actually shipped in) -- 1 failed, 50 passed, redding exactly test_q13_the_LIVE_notification_leg_IS_FRAMED_and_is_not_an_orphan and nothing else. MUTATION 2: collapse the three per-leg payload tables into one -- 4 failed, 79 passed, and it fires HARDER than the sentence it was aimed at, which is named rather than glossed: with one shared table the interim leg cannot carry its own declared payload at all, so the acceptance test reds alongside the two refusal tests and the int test. test_the_unsolicited_leg_REFUSES_an_acknowledgement_payload does NOT red under it, and is therefore not discriminating for that mutation; recorded here rather than counted as evidence it is not.\n\n  EVIDENCE: tests/simulation/test_payment_seam_adapter.py 87 passed (8 added); tests/company/billing/test_payment_observation_consumer.py 83 passed (8 added); tests/background/test_live_payment_triad.py 51 passed (6 added), the LIVE path; 1608 passed / 1 skipped across the wider file_scope, with 6 architecture reds that are red at HEAD and untouched here (the ruff ratchet -- the I001 in background/live_payment_triad.py is proven pre-existing by `ruff --isolated` over `git show HEAD:` of that file -- and the unlanded-falsifier store check); `python3 -m tools.epistemic_verifier --all` PASS on 544 files; `python3 -m tools.wall_channel_census --worktree` every frozen channel matches its list exactly with no new channel member; `cold_eyes_battery.battery_outstanding` re-read after the row edit: Q2, Q3, Q5, Q9, Q13, Q14, Q15 -- unchanged, so nothing drifted and no question was cleared as a side effect.\n\n  THE GATE REFUSED THIS PASS ONCE, AND IT WAS RIGHT TO. The first landing attempt was REFUSED by `tools.record_landing_claim_check`: this record asserted a landing in prose and stated no claim in the checkable form, which is exactly clause 1 of the control built after five consecutive EP6 records claimed a landing no tree carried. The repair is the ten lines above, not an argument. Recorded because the near-identical failure is this atom's own recurring one and the next pass should expect the same refusal.\n\n  THE INSTRUMENT STILL CANNOT SEE THIS PASS, filed and not fixed, and this is now the third pass running that has had to say so. `tools/wall_channel_census.py`'s `LEG_ENVELOPE_NAMES` scores WallRequest and WallResponse only, so the census is blind to both legs migrated here and reports the payment crossing unchanged. The staged finding WORKER_FINDING_THE_WALL_CENSUS_SCORES_TWO_LEGS_OF_A_FOUR_LEG_WALL_2026-08-21 (committed in 5facfca90) already names the repair and warns that widening the census would red-list these two crossings for failing to use transport that did not exist. It does now -- the blocker that finding names is exactly what this pass removed -- so widening it is a clean move for a later pass rather than a deliberate red, and its baseline should still move in the same commit. Not taken here: tightening this atom's own instrument inside an EP6 draw is the shape pass 37 refused, and SELF_INTERRUPT_DISCIPLINE says a harness finding is registered, not fixed in the tick that found it.\n\n  WHAT REMAINS, and the ordering is read off the rows rather than invented here. Q2 keeps reasons (a) and (b): none of the reviewer's four named industry flows is modelled, and the ADDACS trigger still cannot fire without a failed collection behind it, which is a BASELINE change and the director's under R13. Q13 keeps its own two: one of three crossings is still unframed (`company/comms/susceptibility_estimator.py`, whose module this atom's file_scope does not carry -- `company/market/flex_participation.py` does, and is the framable one), and there is still no cryptography, so what is modelled is the REFUSAL and not SMKI/DIP signing. NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): frame the FLEX crossing, which is the only remaining unframed one inside file_scope and is also the seam the census still red-lists as UNSOLICITED INBOUND -- one edit answering a Q13 half and a standing census red at once. The BRANCHING conversation Q3's second named example needs is the larger item and should follow it. The target decision recommended at passes 38-49 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-21 pass 53 LAND, level HELD at 2, loop_stage stays build. PASS 52 WROTE 675 LINES ACROSS BOTH SIDES OF THE WALL, TESTED NONE OF IT, AND COMMITTED NONE OF IT -- THE FOURTH PASS RUNNING. The tick drew EP6 and found five files dirty against HEAD carrying an entire enrolment exchange -- the company's `FlexEnrolmentBook`, the venue's `VenueRegistrations`/`answer_enrolment`, a seam bumped to v2 with a new payload type, and the census re-pinned to match -- with NOT ONE test file touched. Commits 131b86df7, 21c286c15 and 4e8253db9 wrote this same sentence about passes 43, 44-45 and 46. This pass is the landing. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 6f667b545.\n\n  WHAT THE UNLANDED WORK ACTUALLY WAS, verified at the tree rather than read off a row -- pass 52 left NO record at all, which is the inverse of this atom's usual failure and is worse in one specific way: there was no claim to check, so nothing but reading 675 lines could say what it did. It is the repair pass 50 recommended in its own closing line: FRAME THE FLEX CROSSING. `CompanyVenueOffer` has always been the company's own participation decision and `WallRequest[FlexEnrolment]` has been declared since the seam was written, and NOTHING IN THIS BUILD EVER JOINED THEM -- so every dispatch instruction and settlement line arrived as an answer to a question no company had asked, and the venue dispatched a unit nobody had registered.\n\n  THE INDEPENDENT INSTRUMENT CONFIRMS IT, and this is the difference between this pass and pass 43, where the census structurally could not see the leg. `tools/wall_channel_census.py`'s LEG MODEL IS UNEDITED HERE -- the only census change in this commit is the SURFACE_PINS re-pin -- so its reading is an outside verdict rather than my own. Measured in a DETACHED GIT WORKTREE at HEAD (a tar extract fails the census closed: it needs a real repo, and it says so rather than passing): HEAD reads `[request=dormant, response=wire]`, `declares a request leg this build never sends, so it is not scored`, and a standing RED -- `UNSOLICITED INBOUND: the response role is live and NOTHING IN THIS BUILD EVER ASKS`. With this commit it reads `[request=wire, response=wire]`, `both roles live`, and THE RED IS GONE. One standing census red cleared, on the seam pass 50 named.\n\n  A MEASUREMENT I RETRACTED BEFORE RECORDING IT, because it is this project's own two-trees defect and I nearly published it. Running the census from the WORKTREE against HEAD's sources reported the flex seam `UNPINNED: declares version 1, which SURFACE_PINS has no entry for` -- which would have read as a second red cleared. It is an ARTEFACT: the tool half came from my worktree (pin table already at v2) and the subject half from HEAD (seam still v1), so the two halves read two different trees. In the detached worktree HEAD pins correctly at `v1 = ea1b70a309a2a3e4`. Nothing was wrong at HEAD and no second red was cleared. Recorded because the false version of this sentence is the more flattering one.\n\n  WHAT THIS PASS ADDED, and it is the whole reason the pass exists: 27 TESTS ACROSS THREE FILES, where pass 52 wrote none. Placed in the files whose STEMS match the three changed production modules, because this project's gate selects tests by filename stem -- a new test file named for the exchange would not have been selected by a commit to `flex_participation.py`. The round trip is driven END TO END, company encoder to VENUE codec to company reader, never with a stubbed reply: a company-side test that asserted this module agrees with a fixture I wrote is the R15 TAUTOLOGY for the one question a seam is asked.\n\n  LANDED: `FlexEnrolmentBook` in `company/market/flex_participation.py`\n\n  LANDED: `observe_outcome` in `company/market/flex_participation.py`\n\n  LANDED: `encode_enrolment_payload` in `company/market/flex_participation.py`\n\n  LANDED: `MisroutedOutcome` in `company/market/flex_participation.py`\n\n  LANDED: `FlexEnrolmentRefused` in `company/market/flex_participation.py`\n\n  LANDED: `answer_enrolment` in `sim/flex_dispatch.py`\n\n  LANDED: `VenueRegistrations` in `sim/flex_dispatch.py`\n\n  LANDED: `decode_request` in `sim/flex_dispatch.py`\n\n  LANDED: `EnrolmentRefused` in `sim/flex_dispatch.py`\n\n  LANDED: `FlexEnrolmentOutcome` in `interface/contracts/flex_observable_seam.py`\n\n  LANDED: `ENROLMENT_REFUSAL_CODES` in `interface/contracts/flex_observable_seam.py`\n\n  LANDED: `REQUEST_PAYLOAD_FIELDS` in `interface/contracts/flex_observable_seam.py`\n\n  LANDED: `test_the_full_enrolment_ROUND_TRIP_crosses_the_wall_and_comes_back_registered` in `tests/company/test_flex_participation.py`\n\n  LANDED: `test_MUTATION_an_outcome_on_a_correlation_id_this_company_NEVER_SUBMITTED_is_refused` in `tests/company/test_flex_participation.py`\n\n  LANDED: `test_C_S2_a_RESENT_enrolment_returns_the_SAME_reference_and_does_not_mint_a_second` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_the_venue_judges_the_window_on_ITS_OWN_clock_not_the_senders` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_field_added_to_the_payload_and_not_DECLARED_is_caught` in `tests/interface/test_flex_observable_seam.py`\n\n  R15, THREE PRODUCTION MUTATIONS RUN AT THIS TICK, each against a tree materialised by `git archive` OUTSIDE the repo with only the mutated file swapped -- never on the shared worktree, which carried 190 other-lane modifications and a 352-test suite in flight throughout. Each redded EXACTLY its named test against a 56-passing null control, so none is always-red. (1) `submitted is None` -> `False` in `observe_outcome`, i.e. the register is not consulted: reds `test_MUTATION_an_outcome_on_a_correlation_id_this_company_NEVER_SUBMITTED_is_refused` and nothing else -- the refusal is keyed on the company's OWN book and not on anything about the message. (2) The venue's idempotency short-circuit removed so a resend mints a second reference: reds the C-S2 test alone. (3) The overlap predicate collapsed from half-open to closed (`<` -> `<=`): reds the boundary test alone, which is the point of asserting BOTH directions there -- a registration ending exactly when another starts is two consecutive availability periods, not a double sale, and that boundary is the only value this rule is easy to be wrong about.\n\n  A MUTATION THAT WAS CAUGHT BY THE WRONG BELT, fixed in the writing and recorded because it is this project's stacked-belts class met live. The misrouted-acceptance test first mutated `answer['payload']['unit_id']`, and it passed -- on the PAYLOAD KEY-SET belt one layer earlier (`UNKNOWN_FIELD`), never reaching the `MisroutedOutcome` refusal it names. A bare `raises` would have called that a pass. The mutation now goes inside `fields`, and the refusals in this battery are asserted by REASON CODE rather than by exception type wherever two belts could both fire.\n\n  THE NULL CONTROLS, said explicitly because refusal tests without them prove only that a seam is broken: the full round trip returns the venue's own minted reference (`DFS_TURN_DOWN-REG-000001`); the forged-id answer is ACCEPTED byte-for-byte by the book that really submitted it; a butt-jointed window is accepted where an overlapping one is refused; the same unit MAY enrol at a different venue over the same window (overlap is scoped by venue deliberately, because a multi-venue book is the legitimate stacking case); and the clock mutation's third assertion is an OPEN window accepted by the same venue at the same clock -- without which the two refusal assertions would also hold of a venue that refused everything.\n\n  WHAT DID NOT CHANGE, said plainly. NO PUBLISHED FIGURE MOVED and none was recomputed; nothing in this pass is wired into a live run. `FlexEnrolmentBook` has NO PRODUCTION CALLER -- it is a primitive with a proven round trip and no scenario driving it, which is the same shape as pass 43's `missing_sequences` and is stated the same way rather than counted as traffic. Wiring it into the live flex path is the next item and is NOT claimed here.\n\n  EVIDENCE: tests/company/test_flex_participation.py 14 passed (7 at HEAD); tests/sim/test_flex_dispatch.py 32 passed (26 at HEAD); tests/interface/test_flex_observable_seam.py 11 passed (5 at HEAD); 352 passed across the downstream consumers (tests/interface, the stacked-dispatch, passthrough, phase41a, flex-revenue and crossing-conversation suites); the three mutations above with the figures given; `python3 -m tools.epistemic_verifier` PASS on the one changed company file; `python3 -m tools.wall_crossing_dispositions` OK -- 6 live crossings, 91 ruled, and NO new wall crossing created (the company module imports `company.interfaces.crossing_conversation`, which is company-side; the venue codec imports no company module, asserted by a test); `python3 -m tools.wall_channel_census --worktree` every frozen channel matches its list exactly.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, unchanged from passes 38-52 and not re-opinionated here: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built. `tools.discovery_pass_ceiling` says so and says explicitly NOT to record `infeasible_here`, because that verdict would retire the payable half.\n\n  MAP EDIT: `file_scope` gains the four files this pass's work lives in that the atom did not declare -- interface/contracts/flex_observable_seam.py, tests/company/test_flex_participation.py, tests/sim/test_flex_dispatch.py, tests/interface/test_flex_observable_seam.py. The seam contract is the clearest instance of this atom's own recorded 'landable set is wider than the file_scope' class: the flex seam's own contract was owned by no atom while two atoms edited it. Same reading passes 35, 36, 42, 43, 44 and 45 used: file_scope declares which files an atom owns, changes no difficulty, sets no target and tunes no output.\n\n  WHAT REMAINS. The ordering is read off the rows rather than invented here. (1) Wire `FlexEnrolmentBook` into the live flex path, so the enrolment exchange has a scenario and not only a unit proof -- the smallest item with a measurable consequence. (2) Q3's BRANCHING conversation (a switch with objection is an alternative continuation, not a later position on one path), the larger item pass 44 and 47 both left. (3) The census's LEG_ENVELOPE_NAMES third/fourth-leg blindness, filed by pass 48 and 50 and still filed. THE LESSON THIS PASS IS FOR, and it is now four passes deep: this atom keeps producing work that is sound and invisible. Pass 45 found three real defects in the gap between pass 44's record and its commit; pass 47 found two false measurements in pass 46's; this pass found 675 lines with no control of any kind in pass 52's. The code was good each time. What is missing each time is the part that makes it checkable by someone who was not there."
- "2026-08-21 pass 53 ADDENDUM, written after the gate refused the landing above and appended rather than folded into it, because this store is append-only and a row that quietly absorbs its own correction teaches nothing. THE GATE CAUGHT THREE THINGS MY OWN SUITE RUN COULD NOT, and one of them was mine.\n\n  REFUSAL 1, AND IT WAS MY OWN TEST POISONING TWENTY-TWO OTHERS. `test_the_declared_request_key_set_is_what_the_venue_refuses_against` proved the venue decodes against the CONTRACT by calling `importlib.reload(sim.flex_dispatch)` under a widened declaration. Reload REDEFINES every class in the module, so the 22 tests in `tests/sim/test_flex_dispatch_stacked.py` that had already imported the old classes failed `isinstance` against the new ones. IT PASSED WHEN THE FILE RAN ALONE and redded the gate -- which is precisely this project's own recorded rule, never mutate a shared module while a suite is in flight, produced by me inside the very battery I was writing to prove the work was controlled. Repaired by mutating the module's own binding via `monkeypatch` instead: same claim, same both-direction proof, no reload. The null control (a well-formed wire accepted against the real declaration) is unchanged, and both files now pass in ONE session -- 60 tests -- which is the only run that could ever have shown this.\n\n  REFUSAL 2, A CONTROL REDDING ON ITS OWN SUCCESS CASE, and its author predicted it in writing. `test_THE_LIVE_WALL_IS_UNSOLICITED_ON_EXACTLY_THE_TWO_SEAMS_THE_WALK_NAMED` pinned the conversant set as EQUAL to two named seams. Clearing flex made it three and redded the test -- this project's recorded COUNT-PINNED class, where the number was never the law but the size of the backlog the day it was written. Its docstring says exactly what to do: \"WHEN THIS GOES GREEN the assertion below fails, and that is the correct moment to move the check into the CLI's return and this test into `assert verdict.ok`.\"\n\n  SO THE CHECK IS NOW ARMED, and this is the substantive thing the record above does not contain. Measured first, not assumed: `seam_conversation_conformance_at(worktree=True)` reports ok=True, conversant = all three scored seams, and unsolicited/unanswered/silent all EMPTY. Three separate comments in `tools/wall_channel_census.py` each promised the check \"becomes part of this return the day `.ok` is True on HEAD\", and the flex request leg was the last thing standing between the wall and that day. `conversations.ok` is now in the CLI's return, so a seam that asks into nothing REDS rather than printing a paragraph nobody must read. The sibling test that asserted the check must NOT be in the exit code is FLIPPED rather than deleted -- its useful half was never \"it is unarmed\" but \"the reader and the exit code agree about whether this control counts\" -- and it now fails if the check is ever disarmed. This is R11's no-orphan-transitions rule paid: the repair had a release, and the release does something.\n\n  LANDED: `conversations.ok` in `tools/wall_channel_census.py`\n\n  LANDED: `test_the_conversation_check_is_REPORTED_by_the_CLI_and_deliberately_NOT_in_its_exit_code` in `tests/tools/test_wall_channel_census.py`\n\n  REFUSAL 3, THE STORE COUNT. The append above rolled the store (a two-file atomic write, live file plus `archive/EP6_wall_protocol_typing.038.yaml`) and the map's `simplifications_count` still declared 47. The count invariant is TREE-WIDE, so this one atom's stale number refuses every lane's commit, not just mine. Corrected to 48, and to 49 by this entry.\n\n  EVIDENCE FOR THIS ADDENDUM: tests/sim/test_flex_dispatch.py + tests/sim/test_flex_dispatch_stacked.py 60 passed IN ONE SESSION (the run that exposes the reload defect; separately they were 32 and 22-failing); tests/tools/test_wall_channel_census.py 207 passed; tests/design/test_simplifications_store.py 41 passed; ruff clean on every changed file.\n\n  THE LESSON, and it is the same one the record above draws about pass 52 turned on myself. I wrote a battery to prove that untested work was now controlled, and the battery contained a defect that only a run I had not done could see. Pass 52's failure was writing code with no controls; mine was trusting a green file-scoped run as if it were a green suite. The gate is what closed both, which is the argument for never landing around it."
- "2026-08-21 pass 54 LAND, level HELD at 2, loop_stage stays build. THE EXCHANGE PASS 53 LANDED HAD NO PRODUCTION CALLER, AND THE DOOR THAT SHOULD HAVE BEEN IT WAS A NEAR-COPY THAT CROSSED NOTHING. Pass 53's own closing line named this as the next item and did not claim it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 72d628afd.\n\n  WHAT WAS ACTUALLY WRONG, and it is one level up from where pass 53 left it. `SimInterface.enrol_flex` is the ONE declared COMPANY -> WORLD crossing for flex, and it crossed nothing: `StubSimInterface` built a request envelope with its OWN private correlation-id grammar, appended it to `self._flex_enrolments` -- a list nothing in this build reads -- and handed the company back its own question; `LiveSimInterface` did not implement the method AT ALL, so a live company could not enrol into a flex venue. `sim/flex_dispatch.py`'s own registration-desk comment says this in as many words. NO TEST IN THIS REPOSITORY CALLED `enrol_flex`, which is why none of it was ever visible: the door was dark, not merely thin. Measured before touching anything: `grep -rn enrol_flex --include=*.py` outside the seam file returned one hit, a comment.\n\n  THE PRIVATE GRAMMAR WAS ALSO WRONG, and this is the part that would have gone on being wrong after any purely cosmetic wiring. The seam minted `flex-{unit}-{date}`, with NO VENUE IN THE KEY. One unit registered into two venues over one day -- the legitimate multi-venue book `dispatch_and_settle_stacked` models -- collides on a single correlation id, so the second venue's answer arrives on the first submission's id and `observe_outcome` checks it against the wrong offer. Reproduced as a mutation, not asserted: restoring that grammar reds two tests, one on each side, and the company ends the run holding ONE reference where it made two registrations.\n\n  WHAT THIS PASS DID. `FlexEnrolmentBook.submit_enrolment` gives the book a second DOOR into ONE minting site (the