  THE INDISTINGUISHABILITY TEST, stated as one falsifiable criterion and applied per channel:

  swapping a crossing''''s SIM-side adapter for a different implementation that answers the same

  contract -- including one that sometimes returns TIMEOUT/NOT_KNOWABLE_YET/a duplicate response for

  the same correlation_id -- must require ZERO company-side code changes and no company-side branch

  that could only succeed against one specific adapter. Channel C (envelope) PASSES on the

  import-direction half (already proven by test_epistemic_wall_ratchet.py) but has never been forced

  through its own non-OK statuses by a test -- an unproven control on this specific property, R15-

  speaking. Channel D (same-step ports) FAILS BY CONSTRUCTION: a Protocol method returning

  list[MeterReadMessage] has no representable "not yet available" path, so a real D0010/bureau feed

  that answers late cannot be swapped in without a visible shape change. Channel A/B (direct import)

  fails trivially -- no adapter exists to swap; this is KNIFE3''''s subject, not EP6''''s. Channel E

  (structural Protocol) passes for a frozen shape and fails under evolution -- no version field

  exists anywhere in the pattern. Channel F (published report) should not be held to this test at

  all: it exists specifically so the harness can see both the company''''s belief and the SIM''''s truth

  in one row (e.g. customer_events'''' company_churn_estimate beside realized_churn_probability, per

  the 2026-08-15 second pass), which is the opposite goal from indistinguishability.


