  -- a SEPARATE document from docs/design/EP6_WALL_CONFORMANCE_CENSUS_DISCOVER.md (2026-08-15), not

  a replacement: this pass re-verifies that census''s numbers at a newer HEAD rather than re-walking

  it, then adds the three sections the dispatcher for this draw asked for that neither prior pass

  produced in this form -- a falsifiable per-channel indistinguishability test, an explicit SIMPLICITY

