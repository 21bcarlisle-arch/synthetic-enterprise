  CORRECTION to the 2026-08-17 pass, in a NEW entry per this store''s append-only convention. That pass

  wrote "the 5 W4_1 ports ... with schema_version fields that are structurally present but ... never

  populated on the wire." At this HEAD it is 3 of 5, not 5 (credit_bureau_port''s CreditCheckResult has no

  version field; market_data_port is a bare Protocol with no message dataclass), and "never populated"

  conflates the two things NEW-2 exists to separate -- the field IS populated; the populated value is

  never EMITTED. Neither correction changes that pass''s conclusions.


  THE GAP IS TWO DIFFERENT GAPS. (1) ENVELOPES: zero production reads of .schema_version anywhere -- the

  8 repo hits are 5 tests and 3 unrelated port-class self.schema_version. The code holding an envelope

  longest, company/billing/payment_observation_consumer.py, forwards observed_at and correlation_id into

  ledger events across its six handlers (484-558) and DROPS schema_version and status. No serialiser for

  an envelope exists in the tree. So this is not a switch that is off, it is a WIRE THAT WAS NEVER BUILT;

  there is nothing to plumb into. (2) PORTS: the serialiser EXISTS (to_log_entry, three ports) and CAN

  emit the stamp, and is called on exactly the 3 production paths that build the 3 published log keys

  (run_phase4c_on_phase2b.py:270 meter, :357 contact centre, run_phase2b.py:1705 funnel) -- ALL THREE with

  no argument, i.e. include_schema_version=False. The only three callers in the repo that pass True are

  the three port tests. Disclosed, not a defect: the flag''s own docstring names the migrating caller it

  waits for, and that caller does not exist yet.


  ARTEFACT AGREES: 0 occurrences of each of schema_version, correlation_id, observed_at, valid_time,

  NOT_KNOWABLE_YET, WallStatus, wall_ across 4,154,354 bytes.


  THE PORTS'' OWN ROUND-TRIP CLAIM TESTED ON THE LIVE POPULATION, not a fixture: all 1,996 published

  entries (meter_read_log 1,600, contact_centre_log 392, acquisition_funnel_log 4) parsed back through

  their own from_log_entry and re-emitted at the default flag -- 0 parse errors, 0 identity mismatches,

  0 already stamped. The lossless-identity docstring claim HOLDS on real data. Flag ON adds exactly one

  key, {"schema_version": "1.0"}, on all three families and changes nothing else -- which is what makes

  the flip a MEASURED blast radius over the whole population rather than an assertion.


