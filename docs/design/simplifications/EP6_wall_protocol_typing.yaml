  THE COMPANY IS NOW INDISTINGUISHABLE BETWEEN A WIRE COUNTERPARTY AND AN OBJECT ONE, asserted rather than asserted-about: two estimators, same customer, same message, one handed the observable as bytes and one as an object, must reach an identical `posterior_report`. If transport moves the belief at all then a mock and a real endpoint are NOT indistinguishable, whatever the envelope says.

  THIS IS THE LIVE PATH, NOT A SPARE ONE (R11-shaped). `background/conversation_gap_ledger.py::_train_estimator` -- the harness that publishes the belief-vs-truth gap -- now crosses on `respond_over_wire` + `observe_wire`. The published gap is therefore measured against a company that only ever saw an encoded, version-checked envelope. Proven by patching `observe_wire` to refuse and asserting the refusal FIRED (a codec nobody calls would leave that test passing for the wrong reason), and by the un-patched twin that asserts the belief still moves. The envelope clock is a fixed epoch, never `now()`: C-S2 replay means two identical runs must emit identical bytes.

  R15: 63 new proofs -- 21 appended to `tests/simulation/test_conversation_response.py` (24 to 45) and three new files, 19 + 12 + 11. Six mutations RUN, not asserted, each with a NULL CONTROL that isolates the move from the wrapping. (1) FAIL-OPEN, both sides: `wire.setdefault("schema_version", 1)` -- the sibling `from_log_entry` pattern -- makes a message that never stated its version decode CLEAN, silently relabelled as the one version this build speaks today; the same wrapper without the default still refuses. (2) EXCUSE-EVERYTHING: relax the exact-key-set rule to a subset check and a message carrying an undeclared key sails through, so the decoder can no longer tell a v2 counterparty from a v1 one. (3) THE WALL, at payload depth: a counterparty that starts shipping `tone_susceptibility` alongside the observables produces a perfectly well-formed ENVELOPE, so only a payload-depth refusal catches it -- and it must, because a company that folded that number in would be READING ground truth rather than inferring it. Every one of `FORBIDDEN_TRUTH_FIELDS` is refused by name (R10: the class fails, not an instance). (4) TIDY-ENCODER: dropping null-valued keys is the most natural "cleanup" anyone would make, and it hands the far side an absence it can only resolve by defaulting. BOUNDARY, the values these rules are most easily wrong about: `offer` is `Optional[str]` and `tone` is not, so a decoder that treated every null alike would either refuse every offer-less message (most situations carry none) or accept a tone-less one -- the difference is read from the contract''s own hints, never listed; and `bool` is an `int` subclass, so a `True` latency would decode to a plausible, actionable 1 rather than raising.

  THE RATCHET CAUGHT MY OWN NEW CROSSING, which is the control doing its job on its author. The first draft of `observe_wire` imported `WallStatus` to check the envelope status, and `wall_channel_census --worktree` reported `NEW on channel C_envelope (1): company.comms.susceptibility_estimator -> interface.contracts.wall_envelope`. The repair was to DELETE the import, not to re-freeze the list: `WallResponse.__post_init__` already makes "payload is None" and "status is not OK" the same fact, so the status read asked nothing the payload check had not already answered and would have widened a shrink-only list for nothing. Channel C is back to `every frozen channel matches its list exactly`.

  A GATE BLIND SPOT WAS CLOSED IN PASSING, and it is why the three new test files are named as they are. `pre_commit_test_gate.tests_for` selects by filename STEM (`tests/**/test_<stem>.py` and `test_<stem>_*.py`). No `test_susceptibility_estimator*.py`, `test_conversation_generator*.py` or `test_conversation_gap_ledger*.py` existed, so THREE of the four modules this pass touches mapped to ZERO tests and could have been committed untested -- the same class as the 2026-08-09 publish wedge that put the suffix half of `tests_for` there in the first place. Naming the new files after the module stems puts those modules inside the gate permanently, not just for this commit.

  L3 IS STILL NOT CLAIMED, on pass 19''s own stated condition and not a new one. That pass said "the level moves when channel C''s answer does, not when its question exists". The answer moved -- from one seam in three to two -- but the atom''s claim is that EVERY SIM/company boundary crossing becomes a typed, versioned message, and its own instrument still reports one in-process seam. Two of three is progress, not the claim.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING), and it is the CONTROL before the last migration, in that order. Make `envelope_wire_conformance` LEG-AWARE before migrating `flex_observable_seam`. The limit this pass had to work around by hand is now the binding one: a seam is credited as wire-borne on one encoder and one decoder ANYWHERE among its importers, so a next migration that wires only the observable leg would report `3 of 3` and be believed. The legs a seam HAS are derivable in this file''s established discipline -- a seam declaring a `WallRequest[...]` specialisation owns a request leg, one declaring `WallResponse[...]` owns a response leg -- so `payment_observable_seam`, which honestly has only the inbound leg, is not red-listed for a leg it does not have. The encoder half already distinguishes the shapes (`wire_field_sets` returns request and response separately and `_emits_a_wire_shape` collapses them to a bool); the decoder half distinguishes them by name (`DECODE_NAMES`). Both halves already hold the information the verdict throws away, which is the cheapest possible version of this repair and the reason to do it before rather than after.

  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE) for the leg-granularity limit: it is a limit of THIS atom''s own instrument, found by using it, and its repair is this atom''s own next move. The gate stem blind spot was closed in place rather than filed, being three file names.'
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
