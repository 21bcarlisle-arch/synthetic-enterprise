simplifications:
- "2026-08-19 BUILD, level 0 -> 1 (worker tick, self-refill draw; the FIRST BUILD pass on this\natom -- the seven entries above are all DISCOVER, taken while the epoch-3 curriculum block stood).\nThe block is gone: `DIRECTOR_INSTRUCTION_PASS_CEILING_AND_EP1_EP6_PROMOTION_2026-08-19.md` records the\ndirector opening EP6 and EP1 for build in console, `loop_stage` is `build` and `block_reason` is absent\nat draw time. Deliverables: `company/interfaces/wall_protocol.py` and\n`tests/company/interfaces/test_wall_protocol.py` -- exactly this atom's `file_scope`, nothing else\ntouched but this record and its two map bookkeeping lines. Everything is observed-with-evidence unless\nlabelled inferred (R9).\n\nMEASURED AT: HEAD 068878332. Tests run directly; the mutation harness run out-of-tree against the real\nmodule and the file restored byte-identical (verified by string compare, printed by the harness).\n\nWHAT WAS BUILT, AND WHY THIS AND NOT THE OTHER SIX CANDIDATES. Every prior pass converged on the same\nverdict -- EP6's honest shape is CONFORMANCE, not construction, because the envelope already exists\n(`interface/contracts/wall_envelope.py`, atom W4_4) and already has the properties this atom is named\nfor. The 2026-08-18 dependent-atom audit then found the one requirement that is UNANIMOUS across all\nnine dependants: P2, the vintage stamp on the message (9 of 9; async P1 measures 4 of 9, three of those\ninferred). The 2026-08-18 path trace then localised the gap precisely -- population of `schema_version`\nis complete and STRUCTURALLY guaranteed at all ten envelope construction sites, and the value has never\nleft the process: \"not a switch that is off, a WIRE THAT WAS NEVER BUILT; there is nothing to plumb\ninto.\" So the buildable intersection of (unanimous requirement) x (named structural hole) x (this\natom's file_scope) is one thing: the wire.\n\n`company/interfaces/wall_protocol.py` is a codec -- four functions, `encode_request`/`decode_request`/\n`encode_response`/`decode_response` -- and one refusal. No registry, no transport, no retry policy, no\nnew message types, no plugin lookup: the payload codec is a FUNCTION ARGUMENT with no default, so a new\ncrossing needs no edit here and nothing can be serialised by accident. That is the SIMPLICITY GUARD\nreading this atom's own origin_note demands by name, and it is why the module is ~250 lines of which\nmost is the reasoning.\n\nWHY THE COMPANY SIDE. The atom's claim is that \"a mock counterparty and a real one are\nindistinguishable to the company\". That is decided where the company DECODES, because that is the only\nplace a real endpoint and an in-process call differ observably: a real counterparty hands over bytes, a\nmock hands over an object. With the codec here both arrive as the same typed envelope having passed the\nsame refusals, which turns indistinguishability into something testable rather than hoped for. The\nenvelope stays shared in `interface/`; this module reads it and widens nothing. Epistemically it adds\nNO observable -- it is transport, the payload is opaque to it, and `python3 -m tools.epistemic_verifier`\nreturns PASS.\n\nTHE ONE RULE, aimed at a MEASURED sibling defect rather than a hypothetical: ABSENCE IS NEVER\nAGREEMENT. A wire message must state every field including its nulls, and must state its\n`schema_version`; a missing key is refused, never defaulted. The named defect is the one the 2026-08-13\npass filed: `tools/*_port.py`'s `from_log_entry` reads `entry.get(\"schema_version\", SCHEMA_VERSION)` --\nthe READER's own constant, at read time -- so the first bump to \"2.0\" silently relabels every archived\nv1.0 entry, because an absent field and an agreeing field are the same bytes. A version field that\ncannot disagree is not a version field. Unknown keys are refused for the mirror reason: if a later\nschema adds a field, the version number is how a decoder finds out, not silent tolerance.\n\nR15 -- FIVE GUARDS, FIVE MUTATIONS, ALL RED. Each guard was killed in the real module and the suite\nre-run: MISSING_FIELD (6 failed), the int check on schema_version (3), UNSUPPORTED_VERSION (1),\nUNKNOWN_FIELD (1), the correlation_id non-empty check (2). Zero unproven guards; file restored\nbyte-identical. Three further R15 patterns are addressed by construction, not by assertion:\n  TAUTOLOGY -- every refusal fixture is a HAND-AUTHORED wire dict, never `encode_request` output, so the\n    decoder is not checked against its own arithmetic; and the wire field sets are asserted against\n    `dataclasses.fields` on the shared contract, an independent source, so a field added to the envelope\n    reds the suite instead of silently never crossing (which is exactly how `schema_version` came to be\n    populated at ten sites and present in zero published bytes).\n  NULL CONTROL -- `test_null_control_the_same_message_with_its_version_decodes` restores the deleted\n    field and nothing else, so the `raises` above is about the field, not about a generally bad fixture.\n  THE MUTANT SITS BESIDE THE CONTROL -- `test_mutant_decoder_with_a_defaulting_read_silently_relabels_\n    an_old_message` BUILDS the `.get(default)` reader, shows it reporting an unstamped v1-era message as\n    the reader's own v2 and being unable to tell that from genuine agreement, then runs the shipped\n    decoder on the identical bytes and gets MISSING_FIELD.\n36 tests pass. `True == 1` in Python, so a membership-only version check would accept `True` as v1; the\nint check is separately tested and separately mutated. The four statuses round-trip losslessly\nINCLUDING the honest non-answers (TIMEOUT, NOT_KNOWABLE_YET) -- the ones a real counterparty produces\nand a mock is tempted to skip -- and the wire form is asserted to survive real JSON transport.\n\nLEVEL 0 -> 1, AND WHY NOT 2. L1 is \"been BUILT in any form\" and that is met. L2 requires VERIFY on\ngenuine artefacts, and the honest statement is that NO PRODUCTION CROSSING CALLS THIS YET: the only\ncallers are its tests, so the module is BUILT AND DARK -- a class this project has been caught by\nbefore. `schema_version` still occurs zero times in `docs/reports/run_output_latest.json`, and it will\nuntil a crossing is migrated onto the codec. Claiming L2 on a dark module would be the false-completion\nshape R11 exists to stop.\n\nWHAT THIS DELIBERATELY DID NOT DO, each with the prior pass that argued it. Did NOT flip\n`to_log_entry(include_schema_version=...)` on the three port call sites -- cheapest thing on the board\nand measured blast radius, but the 2026-08-18 trace is right that it stamps the artefact for the family\nEP6 is LEAST about; it is this atom's cleanup, never its headline. Did NOT envelope channel F's 93\npublished report keys -- the 2026-08-15 pass killed that on measurability grounds (the unit of\nprovenance there is the FIELD, not the key) and the 2026-08-17 pass on cathedral grounds. Did NOT build\nAWACS -- its home is EP11 (2026-08-18 second pass). Did NOT touch channels A/B while KNIFE3 is live.\nDid NOT reconcile the two version TYPES (envelopes int, ports str) -- no shape has diverged, and\nreconciling now is adapters-for-future-adapters.\n\nNEXT BUILD MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate ONE crossing onto the\ncodec end to end -- `payment_observable_seam` is the candidate, because its consumer\n(`company/billing/payment_observation_consumer.py`) is the code that holds an envelope longest and\ncurrently DROPS `schema_version` and `status` while forwarding `observed_at` and `correlation_id`. That\none migration is what moves this atom to L2 and what makes the vintage stamp appear in published bytes\nfor the first time. The exit criterion for L3 stays the per-channel conformance shape the 2026-08-15\npass established, not a repo-wide \"every crossing is envelope-borne\" claim, which that pass showed is\nunfalsifiable at HEAD.\n\nLANDING NOTE. `docs/design/maturity_map.yaml` carried ANOTHER LANE'S unstaged hunk at draw time (EP1's\nown `file_scope` + `simplifications_count` 10 -> 11, verified by `git diff` before editing), so this\ncommit was landed with a worktree swap presenting only EP6's two lines to the gate and restoring EP1's\nhunk afterwards -- their work is neither committed nor lost. This atom's two map lines\n(`level_current` 0 -> 1, `simplifications_count` 7 -> 8) and this store append are ONE ATOMIC WRITE.\n\nNO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the fail-open `.get(default)` in the ports is\nalready queued as `WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_SHAPED_2026-08-13.md` and is\nhere answered for the ENVELOPE family only, not discharged for the ports."
- '2026-08-19 BUILD, level 1 -> 2 (worker tick, self-refill draw; the SECOND BUILD pass). This

  pass does the one thing the previous pass recorded as the next move, verbatim: "migrate ONE crossing

  onto the codec end to end -- `payment_observable_seam` is the candidate". It is done, and the atom is

  no longer dark. Everything is observed-with-evidence unless labelled inferred (R9).


  MEASURED AT: HEAD d7d36b46a. Tests run directly; the mutation harness run out-of-tree against the real

  modules and both files restored byte-identical (sha256 compared, printed by the harness).


  WHAT L1 ACTUALLY MEANT, AND WHAT CHANGED. The previous pass built the codec and refused L2 in its own

  words: "NO PRODUCTION CROSSING CALLS THIS YET: the only callers are its tests, so the module is BUILT

  AND DARK". The crossing chosen is the LIVE payment triad -- `background/live_payment_triad.py`, which

  `simulation/run_phase2b.py` runs once per run over the real run population -- and it now crosses as

  MESSAGES. `emit_wire_responses` (new, sim side) hands over wire dicts; `PaymentObservationConsumer.

  observe_wire` (new, company side) decodes them through `company.interfaces.wall_protocol.

  decode_response`. The company''s only route to a payment observation on this crossing is now one a real

  bank feed could also take.


  WHY THE ENCODER IS NOT IN THE CODEC MODULE, WHICH IS THE LOAD-BEARING DESIGN DECISION HERE.

  `simulation/payment_seam_adapter.py` writes its own encoder and never imports `company.*` -- it may

  not (its own docstring, and the sim-side wall rule). That constraint turned out to be the RIGHT shape

  rather than an obstacle to route around: if the sender called the receiver''s `encode_response` the

  round-trip below would be a TAUTOLOGY in the R15 sense -- the decoder checked against its own

  arithmetic -- and would stay green through a schema change no real counterparty would have made. The

  two sides are separate code agreeing ONLY through `interface/contracts/payment_observable_seam.py`,

  which is exactly the relationship a supplier has with a bank: the published schema, not the

  counterparty''s source. `test_the_two_sides_are_independent_code` asserts the absence of the import by

  AST, so the independence is checkable rather than claimed.


  THE VINTAGE STAMP HAS NOW LEFT THE PROCESS. The 2026-08-18 trace localised this atom''s gap as "not a

  switch that is off, a WIRE THAT WAS NEVER BUILT": `schema_version` was populated at all ten envelope

  construction sites and had never been serialised anywhere. On this crossing it now is, and the test

  asserts BOTH halves -- the key is in the JSON bytes, and the value the company holds was READ from

  those bytes rather than supplied by the reader''s own constant. That second half is the whole point;

  the sibling defect this atom named (`tools/*_port.py`''s `entry.get("schema_version", SCHEMA_VERSION)`)

  is a stamp that is present and cannot disagree, which is not a stamp.


  POPULATION-LEVEL EVIDENCE, NOT A FIXTURE. Over the live triad''s real event stream -- 200 customers x

  12 periods -- 4,322 responses crossed the wire (3,154 `RemittanceAdvice`, 1,168 `BacsArruddOutcome`)

  and `decode(encode(r)) == r` held for every one: ZERO mismatches. That is also the invariance argument

  for the swap being safe: the consumer receives objects EQUAL to the ones it received before, so no

  measurement downstream of it can have moved. Live gaps after the migration: detection 0.1387, belief

  0.1500, ageing 0.4036. HONEST LIMIT: this population emitted no `dispute`, so `NOT_KNOWABLE_YET` did

  not cross LIVE; it is covered by `test_the_honest_non_answers_cross_too` and not by the population.


  THE ONE RULE, EXTENDED DOWN A LEVEL. ABSENCE IS NEVER AGREEMENT was the envelope''s rule; the payload

  had no such rule and is where the money is. A missing `amount_gbp` must not become GBP 0.00 -- that is

  not an exception the company can act on, it is a `RemittanceAdvice` the bank never sent, and every

  later read site would treat it as real. So the payload field set must match the CONTRACT exactly:

  missing is refused, unknown is refused, and the expected set comes from `get_type_hints` on the seam''s

  dataclasses -- an independent source from anything the sender emitted, so a field added to the

  contract cannot silently fail to cross. The payload is also TYPE-TAGGED, because six payload types

  cross this seam and a receiver guessing from the field set would mis-route the day two shapes

  coincided.


  R15 -- EIGHT GUARDS, EIGHT MUTATIONS, ALL RED. Each guard was killed in the real module and the real

  suite re-run: payload tag required (1 failed), unknown payload_type refused (1), payload field never

  defaulted (3), unknown payload field refused (3), the bool-is-not-an-amount check (1), the enum-value

  check (1), the encoder''s off-seam payload-type refusal (1), the encoder''s undefined-field-type refusal

  (1). Zero unproven guards; both files restored byte-identical.


  ONE OF THE EIGHT WAS UNREACHABLE ON THE FIRST ATTEMPT, AND THAT IS THE PASS''S OWN FINDING. The

  encoder''s "no defined wire form" refusal came back GREEN under mutation -- 55 passed with the guard

  deleted -- because the test aimed at it used a look-alike class, which the class-IDENTITY check

  refuses several lines earlier. The test asserted a refusal that a DIFFERENT guard was producing. Both

  tests now exist and are separate: the identity check is exercised by a look-alike deliberately sharing

  the contract class''s NAME (a name-only check would pass it), and the field-type check by a GENUINE

  contract payload carrying an unshippable value -- the seam''s dataclasses are frozen but not

  type-enforcing, so that is the case the guard is actually for. Generalisable: a mutation that comes

  back green is not always an untested guard, it is sometimes a test standing in front of the wrong one,

  and only killing the guard tells them apart.


  NULL CONTROLS. Each refusal is paired with the identical fixture with only the deleted key restored

  (`test_R15_null_control_...`, and the restored-field assertions inside the missing-field tests), so

  each `raises` is about the field and not about a generally bad fixture. And

  `test_R15_a_refused_message_is_not_marked_processed` closes the failure mode a naive wire entry point

  would introduce: a refusal must not consume the `correlation_id`, or a corrected re-delivery -- what a

  real feed sends after a bad file -- could never land.


  THE D8 COUNTERFACTUAL CROSSES THE SAME WAY. Both call sites in the triad were migrated, the real

  company''s and the shadow''s. Migrating one would have made the two companies differ in TRANSPORT as

  well as in the remittance reference, and the counterfactual would have stopped isolating one variable.


  THREE EXISTING R15 CONTROLS IN `tests/background/test_live_payment_triad.py` WERE RE-POINTED, NOT

  WEAKENED: they monkeypatch the seam emission to inject a leak or suppress a credit, and they now patch

  `emit_wire_responses` and put their injected response through the seam''s own encoder. The mutation

  stays about the LEAK rather than about the transport -- an injected message that arrived malformed

  would be refused at the envelope and the control would have passed for the wrong reason. All three

  still fire.


  LEVEL 1 -> 2, AND WHY NOT 3. L2 is "genuine artefacts, happy path" and that is met: a live per-run

  crossing, 4,322 real messages, lossless. L3 is NOT claimed, and the exit criterion is the one the

  2026-08-15 census established -- per-channel conformance -- not a repo-wide claim that pass showed is

  unfalsifiable at HEAD. ONE of that census''s six channels is now conformant. Channels D (5 same-step

  typed ports), E (structurally-satisfied Protocols, still with nowhere to put a version) and F (91

  published report keys) are untouched, and A/B remain in good order under KNIFE3.


  NEXT BUILD MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate the SECOND crossing,

  `interface/contracts/flex_observable_seam.py`, which the 2026-08-15 census lists in channel C beside

  this one and which already borrows this seam''s idiom by its own docstring. Two migrated crossings is

  what makes the payload-codec-per-crossing pattern evidence rather than a sample of one, and it is the

  cheapest remaining step toward the per-channel conformance shape L3 needs.


  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the unreachable-guard lesson is recorded

  above and is about THIS pass''s own test, not a defect in another lane''s mechanism.


  LANDING NOTE. `docs/design/maturity_map.yaml` again carried ANOTHER LANE''S hunk at draw time -- EP1''s

  `file_scope` + `simplifications_count` 10 -> 11 -- and this time it was STAGED in the shared index

  rather than merely unstaged, so `git diff` on the map was EMPTY while `git diff --cached` showed it

  (the index is `git diff`''s baseline). A `git diff`-only check would have concluded the map was clean

  and swept EP1''s pass 11 into this commit. Landed by worktree swap presenting only EP6''s two lines to

  the gate, with EP1''s hunk re-applied and re-staged afterwards -- their work is neither committed nor

  lost. This atom''s two map lines (`level_current` 1 -> 2, `simplifications_count` 8 -> 9) and this

  store append are ONE ATOMIC WRITE.'
- "2026-08-19 LEVEL LANDING, map level_current 1 -> 2 (worker tick, self-refill draw, which drew this\natom as \"level 1->3, loop_stage build\"). NO NEW PROGRAM: this pass writes no code. What it lands is the\nhalf of pass 9's L2 move that never reached any commit. Everything is observed-with-evidence unless\nlabelled inferred (R9).\n\nMEASURED AT: HEAD 8233f3629, with this atom's entire file_scope clean in the working tree.\n\nTHE STATE PASS 9 LEFT -- four artefacts that should agree, and did not:\n\n  CODE     LANDED        company/interfaces/wall_protocol.py + tests/company/interfaces/test_wall_protocol.py,\n                         committed in fb19bc8e0 and 8233f3629, clean at HEAD.\n  RECORD   LANDED        this store file, pass 9, and the map's simplifications_count: 9 agreeing with it.\n  LEDGER   UNCOMMITTED   the L2 self-certified row existed in the WORKING TREE ONLY.\n                         `git show HEAD:docs/observability/gate_authorizations.jsonl | grep -c EP6_wall_protocol_typing`\n                         returned 1; the same grep on the worktree file returned 2.\n  MAP      NEVER MOVED   `level_current: 1` at HEAD *and* in the worktree.\n\nSo at HEAD this atom's L2 was true in the code, argued in its own record, and invisible to every reader\nthat asks the MAP -- the supervisor's draw, the site, the dashboards. The draw that produced this pass\nstill said \"level 1->3\", which is precisely how the discrepancy surfaced: the atom kept being offered as\nif the first build move had not happened.\n\nTHE L2 CLAIM WAS RE-VERIFIED HERE, NOT INHERITED FROM PASS 9's PROSE. Re-run rather than quoted:\n640 tests pass across tests/background/test_live_payment_triad.py, tests/simulation/test_payment_seam_adapter.py,\ntests/interface/ and tests/company/interfaces/ (56 of them in this atom's own file); `python3 -m\ntools.epistemic_verifier` returns PASS. And the crossing is LIVE in the production path rather than in a\nfixture: background/live_payment_triad.py lines 768-769 and 794-798 call\n`simulation.payment_seam_adapter.emit_wire_responses` -> `PaymentObservationConsumer.observe_wire`, inside\nthe triad that `simulation/run_phase2b.py` runs once per run. That is the L1->L2 bar (\"no longer dark\") and\nit is met by shipped code, independently of what pass 9 wrote about it.\n\nTHIS PASS'S OWN FINDING -- A MAP-ONLY COMMIT WOULD HAVE LOOKED PERFECTLY FINE. `tools/level_promotion_gate.py`\nreads its two inputs FROM TWO DIFFERENT TREES: the map from the INDEX (`_git_show(f\":{MAP_REL}\")` in `main()`)\nand the ledger from the WORKING TREE (`read_ledger()` -> `background.gate_authorization.LEDGER_PATH`, a plain\nfilesystem path). An UNCOMMITTED ledger row therefore authorises a COMMITTED level move. Committing the map\nalone here would have passed the gate and reproduced exactly the defect that commit 8233f3629 was written to\nrepair -- a count whose backing records had never been committed, leaving HEAD red in a way no working tree\ncould show. The two halves are consequently landed in ONE commit by pathspec in this pass. That is a\ncontrol-shape observation about the gate, not a defect in this atom: filed as a finding rather than fixed on\nsight (SELF_INTERRUPT_DISCIPLINE), because the supply of such repairs is infinite and this one is not blocking.\n\nL3 IS STILL NOT CLAIMED, unchanged from pass 9 and for its reason: exactly one of the 2026-08-15 census's six\nchannels is conformant, and the exit criterion stays per-channel conformance."
- "2026-08-19 pass 11 BUILD, level HELD at 2, loop_stage stays build. THE FOUR MISSING ENUMERATORS\nARE BUILT. Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 84a3bc5f1, worktree, with this atom's file_scope clean before the pass.\n\nWHAT THIS PASS TOOK AND WHY IT IS THE ATOM'S OWN CRITERION AND NOT A NEW PROGRAM. The 2026-08-15\ncensus (docs/design/EP6_WALL_CONFORMANCE_CENSUS_DISCOVER.md) section 8 rejected the obvious exit\ncriterion in as many words -- \"an exit criterion of the form 'every crossing is envelope-borne or\ngrandfathered' is NOT directly testable at HEAD today, and an atom that adopted it would be\nadopting an unfalsifiable criterion\" -- and named the testable one: \"each channel gets its own\nenumerator and its own shrink-only list, and the exit criterion is that every channel HAS an\nenumerator\". Two of six had one. This pass built the other four.\n\n  tools/wall_channel_census.py, 6 enumerators, 159 previously-invisible crossings:\n    A  direct import edge      3 members   DELEGATED to epistemic_wall.crossings_at\n    B  indirect via a bridge   2 members   DELEGATED to epistemic_wall.indirect_crossings\n    C  the envelope           19 members   NEW  (importer module, interface.contracts seam)\n    D  the same-step port      7 members   NEW  (tools/*_port module, importer)\n    E  structural Protocol     2 members   NEW  (business-side file, Protocol class name)\n    F  published artefact    131 members   NEW  (run-output key, business-side reader file)\n\nA AND B ARE REPORTED AND DELIBERATELY NOT FROZEN. WALL_CROSSING_DISPOSITION_REGISTER.md plus\ntools/wall_crossing_dispositions.py already enforce a shrink-only rule on exactly that subject.\nFreezing them a second time here would put two controls on one subject, which does not double the\nsafety: it means an ordinary ruled change reds a gate whose owner is another file, and\nfeedback_control_that_can_only_fail_wedges says such a gate is routed around within a day. So the\ntool REPORTS all six (channels_without_an_enumerator() is the exit criterion as a function, and it\nreturns []) and FREEZES the four that had no owner.\n\nR15 -- 25 tests, and both directions shown for every guard.\n  MUTATIONS THAT MUST FIRE, one per frozen channel plus two shapes that a naive control misses:\n  a new envelope importer; a new port importer; A SIXTH PORT appearing; a new key reader; A SECOND\n  KEY READ BY AN ALREADY-LISTED READER; and a declared channel whose enumerator is removed. All\n  RED without the guard.\n  NULL CONTROLS THAT MUST NOT FIRE (move the sample, not the law): an unrelated module added to\n  the same trees; a WORLD-side module reading the same published key; a business-side literal that\n  is not a published key; a non-Protocol class. All leave the census byte-identical.\n  FAIL-CLOSED, six branches proven: empty artefact (an empty denominator makes channel F vacuously\n  conformant), artefact absent at the rev, bogus rev, missing baseline, baseline missing a frozen\n  channel, baseline with no `frozen` object. An unavailable check is a FAILED check.\n  TAUTOLOGY CHECK: the baseline is a committed FILE and the current reading is computed from a\n  tree. test_the_baseline_is_a_FILE_and_editing_it_changes_the_verdict moves ONLY the baseline\n  against a byte-identical tree and the verdict flips, so the comparison has a subject outside the\n  reading it checks.\n  ZERO IS NOT REFUSED, on purpose. A channel measuring zero members is a channel fully paid down,\n  and a control pinned to a non-zero count reds on its own success case\n  (feedback_a_control_pinned_as_a_count_reds_on_its_own_success_case). What IS refused is an empty\n  DENOMINATOR, which is a different fact wearing the same number.\n\nTHE CONTROL'S CALLER IS THE COMMIT, NOT A PERSON TYPING IT. pre_commit_test_gate now runs\n_wall_channel_census_check against `git write-tree` -- the tree the commit WOULD create -- placed\nbeside the wall-register step and before the pure-docs early return, because a commit that widens\nthe envelope or the artefact may select no test targets at all. HEAD would have been the wrong\nsubject for the reason this file already learned once: it reds the commit that REPAIRS a\ndivergence and passes the one that introduces it. Measuring the would-be tree also puts both sides\nof channel F on ONE ref -- the readers and the artefact their keys come from -- which is the\ndiscipline a two-sided census needs. Cost measured: 5.4s.\n\nTHE FIXTURE FOUND A REAL FAIL-OPEN IN THIS PASS'S OWN FIRST DRAFT. Channel D discovered its ports\nfrom the EDGE LIST (any module named tools.*_port that appeared as an import source). A port that\nimports nothing produces no edge, so the simplest port anyone could write was invisible to the\nchannel built to see ports. test_MUTATION_a_SIXTH_port_appearing built exactly that and got a\nclean bill of health. Ports are now discovered from the FILESYSTEM. Recorded because the shape is\ngeneral: deriving a population from a by-product of that population's behaviour makes the inert\nmembers invisible, and the inert member is usually the new one.\n\nTWO CORRECTIONS TO THE CENSUS ITSELF, both measured here:\n  1. CHANNEL A HAS SHRUNK 6 -> 3 since 2026-08-15 (KNIFE paydown). The three survivors are\n     simulation.customer_events -> {company.crm.churn_model, saas.churn_model,\n     saas.home_move_win_rate}. Reported, not filed as a finding: this is the programme working.\n  2. THE CENSUS'S CHANNEL-D READER LIST WAS PARTLY WRONG. Section 4 names\n     company/trading/credit_limits.py (via CreditCheckResult) and\n     company/interfaces/bitemporal_event_log.py (via MarketDataPort) as reaching the business side.\n     Neither imports a port: both only MENTION one in a docstring or comment. The AST enumerator\n     finds 7 real import edges and neither of those is among them. The census's prose was built\n     from references, not from edges -- the substring-census shap