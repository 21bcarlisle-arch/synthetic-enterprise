simplifications:
- "2026-08-21 pass 58 BUILD, level HELD at 2, loop_stage stays build. THE LAST UNBELTED WIRE LEGS WERE THE STACKED ONES, AND THE LOOP THAT READ THEM HAD JOINED NO MARKET. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 2f2aed651, with all four touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing.\n\n  WHICH ITEM, AND IT WAS NAMED BY THE PASS BEFORE IT. Pass 57 closed with a four-item remaining list whose first item was its own: \"`measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first, and until they do the STACKED wire emitters cannot be belted -- belting them without a registration leg would refuse every stacked run.\" `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. This is Q13's axis: the crossings that do not check who is speaking, one layer in.\n\n  THE DEFECT, AND IT IS NOT THE PASS-57 ONE REPEATED. `measure_l3` is the loop that scores the STACKING over-claim -- the real failure mode of a real aggregator that books the same MW at two venues. It emitted both feeds for `FLEX_UNIT_1`, a KEYWORD DEFAULT, at venues nobody had enrolled with, and the company then formed a stacked belief about contention between markets it had never joined. So the measurement was of a world that could not have happened: a portfolio cannot contend at a venue that never registered it. The single-venue belt could not have caught this even had it been applied, and that is the whole content of the pass: the stacked question is (unit, VENUE), not unit. A party correctly registered at the Balancing Mechanism and instructed at a DSO local constraint is a KNOWN unit at an unjoined venue, and a check keyed on the unit alone waves it through -- then the party is instructed and paid at a market it never entered.\n\n  WHAT LANDED, AND THE THREE DECISIONS INSIDE IT THAT COST SOMETHING. (1) THE COMPANY REGISTERS FROM ITS OWN DECLARATION, not from `truth.venues`. They hold the same specs on the default path, so this buys nothing today and is the difference between a control and a tautology: a loop that registered from the world's own book could never be short a venue, which is precisely the defect the belt exists for. `venues` comes from the caller. (2) ONE BOOK, N REGISTRATIONS. Every venue is asked separately -- a real party signs a separate agreement per market function -- and the answers land in ONE `VenueRegistrations` handed to both emitters. `VenueRegistrations` already scopes by (unit, venue), so one unit into several venues over one window is accepted (the legitimate stacking this atom models) while a second registration at the SAME venue over an overlapping window is still refused UNIT_ALREADY_ENROLLED. Nothing in that class changed. (3) `unit_id` ON `StackedRegistration` RAISES RATHER THAN PICKING when the outcomes disagree: a stacked portfolio is ONE physical unit offered into several venues, which is what makes the MW contend at all, so two unit ids would mean the loop had silently become two portfolios and the conservation law it measures would be scoring an aggregate nobody owns.\n\n  WHAT L1 TURNED OUT TO BE, corrected against the code rather than carried forward from the sentence that named it. Pass 57's item named `measure` alongside `measure_l3`, and on inspection `measure` EMITS NOTHING OVER THIS SEAM AT ALL: it holds truth and belief in one process and its company side reads `outturn_price`, which is a different channel. There is therefore no wire leg in L1 to belt and no crossing for a registration to license; giving it one would be ceremony, and a registration nothing consults is exactly the shape this atom keeps catching elsewhere. The item was two loops in one sentence and only one of them had a crossing. L1 is struck from the remaining list on that ground rather than closed by having been done.\n\n  LANDED: `registrations` as a REQUIRED keyword on `emit_dispatch_instructions_stacked_over_wire` in `sim/flex_dispatch.py`\n  LANDED: `registrations` as a REQUIRED keyword on `emit_settlement_lines_stacked_over_wire` in `sim/flex_dispatch.py`\n  LANDED: `StackedRegistration` in `background/flex_dispatch_triad.py`\n  LANDED: `solicit_registration_stacked` in `background/flex_dispatch_triad.py`\n  LANDED: `_record_window` in `background/flex_dispatch_triad.py`\n  LANDED: `feeds_solicited` in `background/flex_dispatch_triad.py`\n  LANDED: `test_MUTATION_a_stacked_world_calling_a_unit_NOBODY_enrolled_is_refused` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_MUTATION_a_book_missing_ONE_venue_refuses_only_that_venues_feed` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_an_EMPTY_book_refuses_the_stacked_legs_too__the_fail_open_case` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_MUTATION_a_stacked_call_running_PAST_the_declared_availability_is_refused` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_the_stacked_book_is_REQUIRED_and_not_a_defaulted_argument` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_MUTATION_a_stacked_world_calling_a_venue_the_portfolio_NEVER_JOINED_is_REFUSED` in `tests/background/test_flex_dispatch_triad.py`\n  LANDED: `test_the_L3_solicited_OBSERVATION_can_still_be_False__it_is_not_always_green` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's four files copied in and only the named part swapped -- never on the shared worktree, which carried 280 other-lane modifications throughout. The unmutated tree is the null control: 73 passed, re-established between mutations rather than assumed. M1, the belt removed from both stacked legs (the shape this build shipped in until this pass): 5 failed, 68 passed -- all four new refusal tests plus the triad's, which is the correct blast radius for removing the consult itself. M2, `responses[:1]` -- check the first message and emit the rest, the plausible mistake on a multi-response leg: 1 failed, 72 passed, redding exactly the missing-venue test and nothing else, which is what makes that test the stacked-specific one rather than a copy. M3, the fail-open shape (`registrations` given a `None` default and the loop skipped when absent): 1 failed, 72 passed, redding exactly the required-keyword test. M4, `feeds_solicited = True` hardcoded -- the observation reporting its own intention: 1 failed, 72 passed, redding exactly the not-always-green test.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because three of the four refusals above would also pass on a book that refused everything. The full book admits both stacked feeds. The PARTIAL book (one venue registered, two called) licenses its own venue's feed when handed a truth carrying only that venue -- so the refusal is the missing registration and not an inert book. The exactly-covering book accepts where the half-period-short one is refused; half a period, not a whole one, because a whole one leaves the window butt-jointed and `overlapping` refuses a butt joint too, so it would not discriminate (pass 57's recorded correction, reused rather than rediscovered). And the restored `solicit_registration_stacked` runs the same record clean.\n\n  THE FALSIFIABILITY OF `feeds_solicited`, which is where an observation sitting downstream of a law usually dies. The world now REFUSES at emission, so a check that read the emitted messages could only ever be True. This one reads the DECODED feeds, so the discriminating mutation is downstream of both: an instruction read for a venue the company never joined still scores False. It is the INSTRUCTION leg and not the settlement leg, and the reason is recorded because the first attempt proved nothing: `learn_delivery_ratio_from_lines` ALREADY refuses to learn from a settlement line at a venue the company has no offer in, so mutating that leg raises there and says nothing about this observation at all.\n\n  NO PUBLISHED FIGURE MOVED, measured rather than reasoned. HEAD's `measure_l3` was run in the detached worktree and this tree's beside it over three settings (perfect delivery; a stochastic delivery model; a SOURCED Capacity Market availability price, which is the only setting that exercises the AVAILABILITY venue and its registration). All 15 reported scalar keys per setting, 45 across the three, are IDENTICAL; NO key was lost. One key was added, `feeds_solicited`, and it is a structural fact rather than a figure -- a registration is not a belief and neither is a refusal that never fires.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.epistemic_verifier --all` PASS on 544 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-57, so this pass creates no wall crossing and rules none away. `tools.company_network_isolation` exits 0 on its four frozen routes. `tools.wall_channel_census --worktree` was diffed line-for-line against HEAD's reading: channels A, B, C and E are IDENTICAL, including the `paid down on C_envelope (1)` line, which is present at HEAD too and was therefore neither opened nor cleared here. The two channels that differ (D and F) are another lane's and are named rather than glossed: `docs/reports/run_output_latest.json` is uncommitted in the shared tree, which is also what takes the census exit code to 1 on this tree and left it 0 in the clean worktree.\n\n  A CARRIED CLAIM THAT WAS FALSE WHEN I INHERITED IT, and correcting it is the more useful half of this paragraph. Passes 50 and 57 both closed saying the census's `LEG_ENVELOPE_NAMES` scores WallRequest and WallResponse only and is therefore blind to the interim and notification legs. IT IS NOT, and has not been since pass 51: the live lookup carries all four names, the finding that asked for it (WORKER_FINDING_THE_WALL_CENSUS_SCORES_TWO_LEGS_OF_A_FOUR_LEG_WALL_2026-08-21) is DISCHARGED with five named tests landed at e84b6d54c and sits in `docs/staging/done/`, and its four discharging nodes are green at this tick. Pass 57 restated pass 50's sentence without re-reading the tool -- the record outran the code, in the direction that costs an atom a repair it thinks it still owes. Struck from the remaining list on measurement, not on having been done here. What IS still true, and is a different and smaller thing: the census's leg model does not score the STACKED flex feeds separately from the single-venue ones, so this pass's belt is invisible to it either way -- the reading is unchanged by design and not by blindness.\nEVIDENCE: tests/sim/test_flex_dispatch.py 43 passed (38 at HEAD, 5 added); tests/background/test_flex_dispatch_triad.py 30 passed (24 at HEAD, 6 added); 311 passed across the downstream consumers (tests/sim/test_flex_dispatch_stacked.py, tests/company/test_flex_participation.py, tests/interface, tests/company/interfaces/test_sim_interface.py, tests/company/interfaces/test_wall_protocol.py); the four mutations above with the figures given; `ruff check` clean on all four changed files.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-57 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS, one item shorter and one item struck. (a) Q3's BRANCHING conversation, left by passes 44, 47 and 53 -- now the next item, and the oldest untouched one on the list. (b) STRUCK: the census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, carried by passes 50 and 57 and measured false at this tick -- see the correction above. (c) Q13's own second half, and this pass did NOT move it -- said plainly, because a belt and a frame are easy to conflate and only one of them authenticates. `_UNFRAMED_CROSSINGS` in `tests/company/interfaces/test_wall_protocol.py` still names BOTH `company/comms/susceptibility_estimator.py` and `company/market/flex_participation.py`: the flex crossing reads `decode_response`, not `decode_framed_response`, so nothing on it checks WHO is speaking. What landed here is the venue's own registration law -- may this unit be called at all -- which is a different question from whether the message came from the venue it claims. And there is still NO cryptography anywhere on this wall: what is modelled is the REFUSAL, not SMKI/DIP signing. STRUCK: L1's registration leg, for the reason recorded above -- `measure` has no crossing to license. The target decision recommended at passes 38-57 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-21 pass 60 BUILD, level HELD at 2, loop_stage stays build. Q3'S OTHER EXAMPLE IS NOT A LINE, AND THE REGISTER ANSWERED IT WRONGLY RATHER THAN NOT AT ALL. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 2a0568fab, with all six touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing. (Numbering: the store's last row is pass 58's; 2a0568fab was the landing pass between, which wrote no row of its own.)\n\n  WHICH ITEM, AND IT HAS BEEN THE NEXT ONE FOUR TIMES. Passes 44, 47, 53 and 58 each closed naming Q3's BRANCHING conversation -- pass 53's phrasing was \"a switch with objection is an alternative continuation, not a later position on one path\" -- and pass 58 promoted it to first place: \"now the next item, and the oldest untouched one on the list.\" `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again.\n\n  THE DEFECT, AND IT IS NOT THE ONE THE ITEM DESCRIBES. Four passes filed this as missing expressiveness: the primitive could not SAY that an exchange branched. Measured on this build before writing a line, it was worse than that -- the register answered the question, silently, and got it wrong. `ConversationLeg.identity` was (kind, ordinal), and Q3's own second example puts both continuations at the SAME ordinal: a switch confirmed at leg 2 either has an objection raised at leg 3 or has its objection window close clean at leg 3. So the second continuation was not rejected and was not filed alongside -- it was deduplicated as a REDELIVERY of the first, and `_file`'s restatement rule keeps the LATEST arrival. The probe, run at HEAD before the first edit and reproduced as a test: an exchange told `ObjectionRaised` and then `ObjectionWindowClosed` reports `leg_count` 3, `restatements` 1, and `ObjectionWindowClosed` as the surviving leg. A company reading that register starts supplying a customer whose switch was objected, and WHICH OF TWO CONTRADICTORY MARKET OUTCOMES IT BELIEVES IS DECIDED BY NETWORK ARRIVAL ORDER. Nothing raises, no count looks odd, and the exchange reads as one that never diverged.\n\n  WHAT LANDED, AND THE FOUR DECISIONS INSIDE IT THAT COST SOMETHING. (1) THE COUNTERPARTY NAMES THE BRANCH AND THE COMPANY NAMES THE MENU. `WallInterim.branch` is a wire field because which continuation happened is a fact about the world, learned the way everything else on this wall is learned; a company that derived it from the message type would be keeping a private table of every counterparty's vocabulary and calling its own reading of it evidence. What the company supplies from its OWN book is the SET of branches its process has (`open_conversation(branches=)`), and a label outside that set is refused -- `UnaskedLeg`'s reasoning one level up: the wire may report a choice, never extend the menu. (2) CONFLICT IS REFUSED, NOT RESOLVED. The two fail-open shapes available are keep-the-first and keep-the-last, and this register did the second by accident for sixteen passes. Neither is admissible, because the company ACTS differently on the two outcomes -- one switch completes and the other does not -- and a contradiction the counterparty has to be asked about is not a value to be picked from a pair by arrival order. (3) THE BRANCH IS IN THE DEDUPLICATION KEY AS WELL, and this is the half the refusal cannot cover: a TRUNK leg is admissible on every path by design, so the conflict check waves it through, and on the old key a shared leg sharing an ordinal with a branch leg would overwrite it -- the objection would vanish and the exchange would quietly stop having diverged. (4) ONLY NON-TERMINAL LEGS CARRY A BRANCH, which is why `WallResponse` is untouched. Paths diverge before they end; if the first thing distinguishing two outcomes were the ending itself that is not a branch, it is two possible answers, and `WallStatus` plus the payload type already say it. `branch_taken` is read off the interim legs and the terminal closes whichever path the exchange was on.\n\n  A NEW WIRE RELEASE, BECAUSE THE MODULE'S OWN RULE SAID SO AND HAD NEVER BEEN EXERCISED. Adding `branch` to the interim changes a FIELD SET on a message an earlier release already spoke, and `wall_protocol`'s version-table comment has said since pass 47 what that must look like: \"it lands as a new row in this table rather than as an edit to the constants above, and both sets go on being read at once.\" Editing `INTERIM_WIRE_FIELDS` in place would have refused every interim already in flight from a counterparty that has not cut over -- the big-bang cutover Q10 names as the fail -- so v3 is a new row and v2 keeps its narrower set. This is the FIRST release in this build's history to change a field on an existing message: until now every version difference was a new message KIND, and the test asserting the table is not theatre said so in its own docstring (\"no release here has changed a field on an existing message, and inventing one to make the table look busier would be fabrication\"). A real one arrived, so that test now pins BOTH kinds of release difference and the one thing no release has ever touched -- request and response are byte-identical across all three, which is what makes \"no big-bang\" true for a participant that only transacts those two.\n\n  THE ENCODER REFUSES RATHER THAN DOWNGRADES, and it is the decision in the release with a fail-open on the other side of it. An interim on a branch stamped v2 is `FIELD_NOT_IN_VERSION`, not a v2 message with the label dropped: encoding it away would put well-formed bytes on the wire saying the exchange was progressing along the trunk when the sender said it had diverged, and nothing in a valid v2 message records that a field was removed in transit. In the other direction, on v3 the key is PRESENT AND NULL on the trunk and an omitted `branch` is MISSING_FIELD -- an absent field and a field agreeing with the default are the same bytes, so a branch that could be omitted would not be a branch.\n\n  LANDED: `branch` on `WallInterim` in `interface/contracts/wall_envelope.py`\n  LANDED: `INTERIM_WIRE_FIELDS_V3` in `company/interfaces/wall_protocol.py`\n  LANDED: `_V3_VOCABULARY` in `company/interfaces/wall_protocol.py`\n  LANDED: `BranchError` (reasons UNDECLARED_BRANCH, BRANCH_CONFLICT) in `company/interfaces/crossing_conversation.py`\n  LANDED: `TRUNK` in `company/interfaces/crossing_conversation.py`\n  LANDED: `_require_admissible_branch` in `company/interfaces/crossing_conversation.py`\n  LANDED: `branch_taken` in `company/interfaces/crossing_conversation.py`\n  LANDED: `is_branching` in `company/interfaces/crossing_conversation.py`\n  LANDED: `branches` on `open_conversation` in `company/interfaces/crossing_conversation.py`\n  LANDED: `test_the_FULL_SWITCH_WITH_OBJECTION_crosses_the_wall_as_FIVE_legs` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_the_OTHER_CONTINUATION_of_the_SAME_declared_process_ends_differently` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_the_BRANCH_IS_IN_THE_KEY_or_a_contradiction_is_filed_as_a_restatement` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_a_TRUNK_leg_at_the_SAME_ORDINAL_does_not_OVERWRITE_the_branch` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_a_branch_this_companys_PROCESS_DOES_NOT_HAVE_is_REFUSED` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_ENCODING_a_branch_onto_a_release_that_cannot_carry_it_is_REFUSED` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_a_v3_interim_OMITTING_branch_is_MISSING_FIELD_and_never_a_trunk_leg` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_an_OLDER_dialect_is_a_SUBSET_of_the_contract_and_never_a_stranger_to_it` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_the_releases_actually_DIFFER_IN_TWO_WAYS_or_this_whole_table_is_theatre` in `tests/company/interfaces/test_wall_protocol.py`\n\n  THE WORKED CASE IS DRIVEN OVER A WIRE, NOT BETWEEN TWO OBJECTS. Every leg of the switch battery is built, passed through `encode_interim`, serialised with `json.dumps`, read back with `json.loads` and decoded before it reaches the register. A register checked against interims it was handed directly would prove the company agrees with itself, which is the R15 TAUTOLOGY for the one question a seam is asked -- the same reasoning pass 53 recorded for the flex round trip. The exchange reads: request, `css.registration_confirmed` (trunk), `css.objection_raised` (branch=objected), `css.objection_upheld` (branch=objected), `css.switch_cancelled`. FIVE LEGS, zero restatements, `branch_taken` = objected. The other continuation is driven from the SAME declaration and ends in `css.switch_completed`, which is the thing a register that could only express a line was unable to say at all.\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's six files copied in and only the named part swapped -- never on the shared worktree, which carried 280+ other-lane modifications throughout. The unmutated tree is the null control: 234 passed, re-established between mutations rather than assumed. M1, the BRANCH_CONFLICT refusal removed: 1 failed, 233 passed, redding exactly the contradiction test. M2, `branch` dropped from `ConversationLeg.identity`: 1 failed, 233 passed, redding exactly the trunk-overwrite test -- which is what makes that test the key's own control rather than a copy of the refusal's, since the conflict check is untouched by it and still fires. M3, the UNDECLARED_BRANCH refusal removed: 2 failed, 232 passed, redding the undeclared-label test and the linear-exchange test, which is the correct blast radius for removing the consult itself. M4, the encoder DROPPING a branch it cannot carry instead of refusing (the fail-open shape): 1 failed, 233 passed, redding exactly the encode refusal.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because every refusal above would also pass on a register that refused everything. A second leg on the SAME branch at the next ordinal is an ordinary leg (without this the conflict refusal would be indistinguishable from a register admitting exactly one branch leg per exchange, which would cap every branching conversation at four legs and make the five-leg case impossible). A REDELIVERY of a branch leg is still a restatement, so C-S2 is unchanged. A LATE TRUNK LEG is admitted after the paths have already diverged and `arrived_out_of_order` records it, so C-S1 is unchanged and the case a stricter rule would have broken is asserted rather than hoped for. The same linear exchange that refuses every branch takes its trunk leg normally. A v2 interim identical but for the label encodes cleanly onto v2. And a v3 interim with an EXPLICIT NULL branch is accepted, which is what makes the MISSING_FIELD test about omission rather than about v3 trunk legs.\n\n  A RED THAT IS NOT MINE, RESOLVED BEFORE REACTING TO IT. Running the wider consumer set surfaced five failures in `tests/architecture` -- two in `test_no_committed_store_claims_an_unlanded_falsifier.py` and three ruff-ratchet nodes in `test_static_quality_ratchet.py`. All five fail identically in a detached worktree at a CLEAN HEAD with none of this pass's files present, so they are pre-existing and another lane's; the ruff one matches this project's own recorded finding that the ratchet is red at HEAD. Filed, not fixed (SELF_INTERRUPT_DISCIPLINE). Recorded because a bare red on a shared tree is the easiest thing here to misattribute to whoever read it last.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.wall_channel_census` was run in TWO detached worktrees -- one at clean HEAD, one carrying this pass -- and the readings are BYTE-IDENTICAL on every channel, exit code 0 both times. Deliberately not run from the shared worktree, where `docs/reports/run_output_latest.json` is uncommitted and moves channels D and F: that is this atom's own recorded two-trees artefact and pass 53 retracted a measurement to it. The correct reading of identical is that this pass neither opens nor clears a census red -- the census scores whether both roles of a seam are live, and a branch is a fact about one leg's content, which is a question it does not ask. `tools.epistemic_verifier` PASS on 580 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-58, so this pass creates no wall crossing and rules none away.\n\n  EVIDENCE: tests/company/interfaces/test_crossing_conversation.py 37 passed (22 at HEAD, 15 added); tests/company/interfaces/test_wall_protocol.py 163 passed (154 at HEAD, 9 added); tests/interface/test_wall_envelope.py 34 passed (27 at HEAD, 7 added); 1255 passed across the downstream consumers (tests/interface, tests/company/interfaces, the payment observation consumer, flex participation, the payment seam adapter, the susceptibility wire and the wall channel census); the four mutations above with the figures given; `ruff check` clean on all six changed files.\n\n  WHAT DID NOT CHANGE, said plainly. NO PUBLISHED FIGURE MOVED and none was recomputed: nothing in this pass is wired into a live run, and no module that produces a figure was touched. The two existing production callers of the register -- `PaymentObservationConsumer` and `FlexEnrolmentBook` -- are UNMODIFIED and declare no branches, which is correct rather than an omission: a Bacs collection has one path and two ways of ending it, and an exchange that declares no alternatives now refuses all of them, so the default is the stricter statement and not the weaker one. NO PRODUCTION CALLER DECLARES A BRANCH TODAY. The switch exchange is a worked case with a proven round trip and no scenario driving it -- the same shape as pass 43's `missing_sequences` and pass 53's `FlexEnrolmentBook`, and it is stated the same way rather than counted as traffic. `company/crm/cos_process.py` holds this build's CoS stage machine entirely company-side, driven by direct method call and crossing nothing; joining it to this register is a real next item and is NOT claimed here.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-58 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS. (a) Give the switch exchange a production caller: `CoSProcess` is a company-side state machine whose objection arrives by method call, so the company currently objects to its own switches. That is the next item and it is a new crossing rather than a widening of one, which is why it is not folded in here. (b) Q13's second half, unmoved by this pass and said plainly because a belt and a frame are easy to conflate: `_UNFRAMED_CROSSINGS` still names `company/comms/susceptibility_estimator.py` and `company/market/flex_participation.py`, nothing on those crossings checks WHO is speaking, and there is still no cryptography anywhere on this wall -- what is modelled is the REFUSAL, not SMKI/DIP signing. (c) Q5's no-response horizons at 1 min / 24 h / 5 working days, which `crossing_silence` answers in part and which no branching exchange is aged by yet. STRUCK: Q3's branching item itself, closed here. The target decision recommended at passes 38-58 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-22 pass 61 BUILD, level HELD at 2, loop_stage stays build. THE FLEX SEAM'S ONLY EVIDENCE THAT AN ANSWER WAS ADMISSIBLE CAME OUT OF THE ANSWER. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 49dabefe5, with all six touched files clean against HEAD before the first edit.\n\n  WHICH ITEM. Q13's second half, which pass 60 named as remaining and did not claim: `_UNFRAMED_CROSSINGS` still listed `company/market/flex_participation.py` and `company/comms/susceptibility_estimator.py`, and nothing on either crossing checked WHO was speaking. `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q5, Q13, Q14 payable (Q3 struck by pass 60) and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. The flex leg was taken and the susceptibility one was not; both halves are stated below rather than one being left to be inferred from a count.\n\n  THE DEFECT, AND IT IS NOT THAT THE ANSWER WAS UNCHECKED. `FlexEnrolmentBook.observe_outcome` DID check that an acceptance described its own offer: `MisroutedOutcome` compares the outcome's `unit_id` and `venue` against the company's own submission book, and pass 53 wrote it that way on purpose. But both of those values are read OUT OF THE MESSAGE BEING CHECKED. So the entire barrier between this company and an `enrolment_reference` minted by any process that could put bytes on the leg was that the impostor echo two fields back correctly -- the evidence for a message's admissibility was supplied by the message. That is the R15 TAUTOLOGY pattern at the transport layer, and the payment seam has not had it since pass 50. Reproduced before writing a line, and it is the mutation M2 below runs in reverse.\n\n  A VENUE IS A MARKET FUNCTION AND A SENDER IS A PARTICIPANT, which is why this is a mapping and not a `sender = venue.value` line. The contract has said so in as many words since it was written (`FlexVenue`: \"The flex MARKET FUNCTION, not a counterparty\"), and in GB the two genuinely do not line up: one system operator runs the balancing mechanism, the capacity market's delivery role AND the demand-flexibility service -- three functions, one counterparty -- while a local constraint market is run by the network operator for that region, a different party holding a different key. So `sim.flex_dispatch.FLEX_VENUE_OPERATORS` is the world's FACT of who runs what, `company.market.flex_participation.VENUE_OPERATORS` is the company's BELIEF about it, neither imports the other, and a disagreement REFUSES the crossing. A company that read the operator table off the world could not be wrong about it, and being able to be wrong is what makes the check a check.\n\n  TWO REGISTRY ROWS FOR ONE SEAM, and the second is not a line nobody maintains. With a single flex participant, \"the sender is registered with us\" and \"the sender runs the venue we addressed\" collapse into one question, a check of the operator would pass for the same reason a check of nothing would, and NO TEST IN THIS REPOSITORY COULD TELL THEM APART. `NETWORK-OPERATOR-01` exists so the wrong-operator refusal has a subject: a participant this build IS registered with, presenting its GENUINE credential, answering a DFS registration it does not run. Identity proved is not authorisation granted, and that case is the whole reason the row is there.\n\n  `FlexVenue.OTHER` HAS NO OPERATOR ON EITHER SIDE, and neither table has a default. On the world side a venue nobody runs a market for has nobody to put a message on the wire (`UnoperatedVenue`); on the company side the fail-open reading is \"we hold no expected operator, so accept whoever replied\", which is exactly how a registry with a fallback stops being able to say no. M3 below is that fallback, restored as a one-line mutation, and it reds.\n\n  A REFUSAL IS FRAMED TOO, not only an acceptance. An unframed refusal is a message any process could put on this leg to make a company believe its registration had been declined -- and a registration a company wrongly believes it does NOT hold is as expensive as one it wrongly believes it does. Both paths through `answer_enrolment` go through `frame_venue_message`.\n\n  THE RATCHET THAT NAMED THIS CROSSING COULD NOT HAVE RECORDED THE RESULT, and finding that out is half the pass. `test_the_framed_and_unframed_crossings_are_exactly_as_declared` classified each FILE, `if \"decode_framed_response(\" in text ... elif \"decode_response(\" in text`. `flex_participation.py` has TWO response decode sites -- the enrolment leg and `observe_response_wire`, which reads the dispatch-instruction and settlement feeds -- so framing one of them would have moved the whole module into the FRAMED set and its remaining bare leg would have stopped being named anywhere in this repository. A measurement that cannot express the state the system is actually in reports the state it can express. The ratchet is now per CALL SITE and read with `ast` rather than as substrings (the old scan counted the phrase in docstrings, so a comment could clear a crossing), and `flex_participation.py` is deliberately in BOTH tables: one framed leg, one bare.\n\n  THE STAND-IN CROSS-CHECK WAS SCANNING ONE WORLD TREE. `_stand_in_credential_fingerprints` walked `simulation/` only -- correct while the only stand-in lived in `simulation/payment_seam_adapter.py`, and silently wrong the moment a counterparty was impersonated from `sim/`. The two new rows would have been un-impersonated as far as that scan could see, so relabelling either `nature=REAL` would have passed the startup assertion AND passed the cross-check: the pair of controls that exist so a forgery cannot slip both would both have been blind. It now scans both trees, asserts `scanned > 0` PER TREE (a total over both stays non-zero while one silently stops being walked), and `test_the_declared_nature_of_every_row