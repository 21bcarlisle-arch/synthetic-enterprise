- "2026-08-20 pass 40 BUILD, level HELD at 2, loop_stage stays build. THE STAND-IN IS NOW REFUSED, AND THE OTHER HALF OF Q14 IS NOT BUILT. Pass 39 left six payable items and recorded that Q14 had become cheap: the registry is the place a stand-in participant can be DECLARED as one, so \"what stops a stand-in configuration reaching production\" turns into a startup assertion over a field that exists. That is what this pass built, and it is HALF of what the reviewer asked for -- the half that is now real is stated below, and the half that is not is stated with it, because Q14's own answer_needed names two legs and greening it on one would be the level certified by the absence of its own check. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 4db804458, worktree, with all touched files carrying only this pass's hunks (`git status --porcelain` on the file_scope was empty before the first edit -- pass 38's lesson that a landing defect and a concurrent-lane defect read identically from a record).\n\nWHAT THE DEFECT WAS, and it is not the one the question sounds like. The obvious reading of Q14 is \"can the stand-in be reached from production\", and the answer to that has always been yes-it-cannot: `simulation/payment_seam_adapter.py` holds the stand-in's credential, `company/` may not import `simulation/` (`tools/epistemic_verifier`, `tests/architecture/test_epistemic_wall_ratchet.py`), and a production artefact shipping `company/` without `simulation/` has no speaker at all. The RESIDUE is what nobody had looked at: segregation removes the SPEAKER and does nothing whatever about the TRUST. `COUNTERPARTY_REGISTRY` lives inside `company/interfaces/wall_protocol.py`, so it ships to production intact, fingerprint and all, and anyone who then read one string literal out of a repository would be a bank. The check therefore had to be \"does this build still ACCEPT a stand-in\", not \"can the stand-in be reached\".\n\nTHE REPAIR. `CounterpartyRecord` gained `nature: CounterpartyNature` -- REQUIRED, no default, because a row that does not say is a row nobody decided about and this module's whole doctrine is that absence is never agreement. `assert_registry_fit_for_posture(posture, registry=...)` raises `STAND_IN_IN_PRODUCTION`, naming every offending participant, when a build is asked to run in production while its registry still carries a counterparty it does not hold as real. It is called from `PaymentObservationConsumer.__init__` -- the startup of the ONLY framed crossing the company has -- once, before any wire is read, rather than per message: a control whose only caller is its own test is an orphan (`feedback_a_controls_own_test_is_not_a_caller_so_the_landing_reds`), and the live triad constructs this consumer.\n\nFAIL-CLOSED, AND THE DIRECTION IS THE WHOLE DESIGN. The R15 FAIL-OPEN shape here would be an unreadable posture meaning \"assume simulation\", and that is exactly the reading a stand-in reaches production through -- \"I could not tell where I am\" is not a licence to trust an impersonator. So every value this build does not recognise is read as PRODUCTION, the strictest reading, and `test_an_UNRECOGNISED_posture_is_read_as_production_and_never_as_simulation` sweeps twelve of them. The one that mattered: `DeploymentPosture` is a str-Enum, so an EQUALITY check would have accepted the bare string `\"simulation\"` that an unvalidated config read produces. The comparison is IDENTITY, and the bare string is in the parametrized list. A record whose `nature` is not a `CounterpartyNature` is read the same way for the same reason (seven cases, including the string `\"real\"`).\n\nTHE DECLARATION CANNOT BE FORGED, which is the only thing standing between this and the \"config flag and good intentions\" the reviewer names as the failing answer. Relabelling the shipped row STAND_IN -> REAL defeats the startup assertion completely, and `test_MUTATION_a_stand_in_relabelled_REAL_is_CAUGHT_by_the_cross_check` SAYS SO IN ITS BODY -- it asserts the assertion now passes on the forged registry -- and then catches the forgery against `_stand_in_credential_fingerprints()`, the sha256 of every credential literal actually present under `simulation/`, read off the tree by AST. Company declares, sim tree is measured: two sources, so not the R15 TAUTOLOGY pattern. That helper refuses to report a clean tree from an empty scan (`scanned > 0` and `found` both asserted), because a rename of the sim package would otherwise make every row look un-impersonated -- FAIL-SILENT, closed. Null control on the same test: a participant this repo cannot speak for is not flagged by the same function, so it is measuring the credential and not the label.\n\nWHY Q14 IS STILL RECORDED FAIL, and this is a deliberate call rather than an oversight. The reviewer asked for ENVIRONMENT-LEVEL segregation AND a startup assertion. This project has exactly one environment. `DECLARED_POSTURE` is a constant inside the same shipping unit as the code that reads it, which is the config-flag half of the answer the reviewer refuses; what keeps it honest is a test suite, and a test suite is not a deployment boundary. The genuine second leg is a production artefact BUILT without `simulation/` plus a publish step that refuses one containing it, and neither exists. The tree-level wall is real segregation of IMPORTS, not of DEPLOYMENTS, and the module docstring says so at the line that declares the posture rather than leaving a future reader to infer the scope from test names. Q10 and Q13 were both left FAIL after partial repairs on exactly this reasoning; a third standard here would be the treadmill.\n\nEVIDENCE: `tests/company/interfaces/test_wall_protocol.py` 111 passed against 85 at HEAD (+26); `tests/background/test_live_payment_triad.py` + `tests/tools/test_wall_channel_census.py` 225 passed in 82.7s -- the LIVE path, so the company's real route to a payment observation now runs the startup assertion at construction; `tests/company/billing/test_payment_observation_consumer.py` + `tests/simulation/test_payment_seam_adapter.py` + `tests/company/market/test_flex_participation.py` 91 passed; `tests/interface` + `tests/company/comms` + `tests/simulation/test_conversation_response.py` 160 passed; `python3 -m tools.epistemic_verifier` PASS; `python3 -m tools.wall_channel_census` clean on every frozen channel (the new entry point is not a leg, so `LEG_DECODE_NAME` needed no widening -- checked by running it, not by reading it). `cold_eyes_battery.battery_outstanding` re-read after the reconciliation edit: Q2, Q3, Q5, Q6, Q9, Q10, Q13, Q14, Q15 -- unchanged, so nothing drifted and no question was cleared as a side effect.\n\nWHAT THIS PASS DOES NOT ESTABLISH, said here rather than discovered later.\n  * NO BUILD-TIME SEGREGATION. Nothing constructs a company artefact, so nothing can refuse one containing `simulation/`. That is Q14's remaining half and it is a packaging job, not a protocol one.\n  * THE POSTURE IS DECLARED, NOT DETECTED. `assert_registry_fit_for_posture` is honest about where it is told it is running and has no way to find out independently. A deployer who edits the constant and does not run the suite gets exactly what they asked for.\n  * NO CRYPTOGRAPHY, unchanged from pass 39. The credential is still a string compared by fingerprint; there is no certificate chain and no signature over the bytes.\n  * TWO OF THREE CROSSINGS ARE STILL UNFRAMED (conversation, flex) and the ratchet naming them is unchanged.\n  * THE LEVEL IS STILL 2, same reason as passes 38 and 39: Q9 and Q15 need an act in a RESERVED class, so `level_target: 3` is unreachable in this epoch whatever is built.\n\nWHAT REMAINS: SIX payable items (Q2, Q3, Q5, Q6, Q10, Q13) plus Q14's packaging half, and two epoch-gated (Q9, Q15). NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): Q5 -- a response that NEVER ARRIVES, with defined behaviour at 1 min / 24 h / 5 working days. Its reconciliation row records that `WallStatus.TIMEOUT` has neither a reader nor a writer, so the status exists and nothing produces or consumes it; that is a smaller, better-bounded job than Q2's unsolicited-inbound primitive or Q3's multi-leg conversation, and `UnresolvedCrossing` (built pass 36) is already the place a crossing that has not answered is recorded. The target decision recommended at passes 38 and 39 -- retarget to level 2 for epoch 3, move Q9/Q15 to `EP19_counterparty_qualification_paths` -- is unchanged and still the director's (R13)."
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
