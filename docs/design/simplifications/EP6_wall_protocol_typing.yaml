- '2026-08-21 pass 44 BUILD, level HELD at 2, loop_stage stays build. THE WALL COULD SAY ASK, ANSWER AND TELL, AND HAD NO SHAPE FOR ''NOT YET FINISHED''. Pass 43 handed forward Q3 -- ''show me a conversation with more than two legs'' -- as the only payable question no pass had ever touched, and that reading held up: its reconciliation row was still pass 33''s. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 96b64ea31, worktree, with all 22 declared file_scope files clean against HEAD before the first edit.


  THE DEFECT, STATED SO THE REPAIR CAN BE JUDGED AGAINST IT. `correlation_id` on a `WallResponse` is the IDEMPOTENCY key: its own docstring''s rule is that a resolver which has already answered an id must return the SAME response. So two responses on one id is not a long conversation, it is a broken contract -- and that, not an oversight, is why this seam had exactly two legs and could only ever have two. The three shapes on the wall could between them say ASK (`WallRequest`), ANSWER (`WallResponse`) and TELL (`WallNotification`, pass 43). None could say RECEIVED, IN PROGRESS.


  THE REPAIR IS A TYPE AND A RELATION, and the second half is the part a message type cannot supply. `interface/contracts/wall_envelope.py::WallInterim` carries NO `status` -- the load-bearing absence, because a status is a resolution and an interim with one is indistinguishable from a response, which collapses the third leg straight back into the second. `leg` is refused below 2 at construction, since leg 1 IS the request and an interim that could call itself leg 1 would describe an exchange nobody started. A terminal REFUSAL stays a `WallResponse(status=ERROR)`: only ACCEPTANCE leaves something owed, which is why there is no `accepted` flag anywhere -- a boolean whose False branch belongs to a different primitive is a branch that will one day be taken. Then `company/interfaces/crossing_conversation.py::ConversationRegister`, because a conversation is not a kind of message but a RELATION BETWEEN messages, and the counterparty cannot hold that relation: it does not know what the company still considers open.


  THE WORKED CASE, since Q3 asks to be SHOWN one and a primitive is not a demonstration. The Bacs three-working-day cycle, which `payment_observable_seam`''s own header has described since it was written and which no code here could express: WallRequest[CollectionRequest] -> WallInterim[BacsInputReport] -> WallResponse[ARUDD|Remittance|Settlement]. The ADDACS notification runs ALONGSIDE and is deliberately not annexed as a fourth leg -- it answers no request, and pulling it into a correlation it has no part in is the Q2 fail in mirror image. A conversation gets longer by having more legs, not by annexing the messages next to it. LIVE on the 150-customer/6-month population: 796 conversations, 636 of them THREE legs, 160 single-leg -- the push rails, which asked for nothing and correctly get no request leg.


  THE ONE REFUSAL IS THE R15 CLAUSE. An interim naming a correlation_id this company never opened raises `UnaskedLeg`. The company''s own request register -- written when it SENT the request -- is the only admissible evidence that it asked; a message on the wire can never be that evidence, or any process able to mint a plausible id is in conversation with us. Same reasoning one layer up as pass 42''s account roster (''a message naming an account cannot be the evidence that the account is ours'') and pass 39''s credential fingerprint. MUTATED ON THE LIVE PATH: the same interim, byte for byte, is REFUSED under a forged id and accepted under one the triad really submitted, so the refusal is keyed on the register and not on anything about the message.


  WHAT IT DID NOT BUY, MEASURED RATHER THAN HEDGED, and this is the honest headline. EVERY PUBLISHED FIGURE IS BIT-IDENTICAL to pass 43 -- detection 0.1181818182, detection_latency 2.135447, belief 0.1470588235, belief_population_mix 0.2666666667, ageing 0.2469740634 -- now pinned as a regression test against those five literals rather than re-derived. That is correct rather than disappointing: an acknowledgement resolves nothing, so a version of this that moved a belief would be reading a resolution into the one message defined by not being one.


