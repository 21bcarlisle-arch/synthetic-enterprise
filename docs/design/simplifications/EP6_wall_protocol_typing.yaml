ubject cannot fix;\n  an unrelated module; and simulation/meter_reads.py's free function `read_event_to_log_entry`, which a\n  bare-name match would have swallowed.\n  INDEPENDENCE: the verdict's subject is program text on disk, not a value the module derives from\n  itself -- test_the_wire_check_reads_the_TREE moves only the call site and the verdict moves with it.\n\nTHE CALLER IS THE COMMIT. `_wall_channel_census_check` in pre_commit_test_gate now runs the wire check\nagainst the same `git write-tree` the census step uses, fail-closed on a raise, so a commit that makes\na port message cross silently is refused before it lands rather than found four days later.\n\nTHE ARTEFACT HALF IS REPORTED AND DELIBERATELY NOT GATED. `wire_on_artefact()` counts, per published\nkey, how many rows carry a version -- the R11 half, because only the artefact proves the version\nARRIVED. It is not in the gate, and a test asserts that: the artefact is regenerated by a SIM RUN, so\nflipping a call site cannot move a single row until the next run publishes. A gate on it would red the\nvery commit that repairs the defect and pass the one that introduced it -- the ordering trap this file\nalready learned once for channel F.\n\nTHE SIX CHANNEL COUNTS DID NOT MOVE (3/2/19/7/2/131) and the baseline needed no re-freeze. Channel F\ncounts TOP-LEVEL keys, and schema_version is a key inside a log ROW, so widening the row does not widen\nthe channel. Checked rather than assumed.\n\nWHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later:\n  * THE VERSION HAS NOT YET ARRIVED ANYWHERE. Every published artefact in the repo still reads 0/1,996.\n    The code now asks for the version; only the next sim run can show it on the wire. R11 is half\n    satisfied on purpose and the missing half is named, not glossed.\n  * The nested `stages` rows inside acquisition_funnel_log still carry no version. FunnelStageMessage\n    has no version field to carry; the version is borne once by the 