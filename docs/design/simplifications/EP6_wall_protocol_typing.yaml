simplifications:
- "2026-08-19 pass 11 BUILD, level HELD at 2, loop_stage stays build. THE FOUR MISSING ENUMERATORS\nARE BUILT. Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 84a3bc5f1, worktree, with this atom's file_scope clean before the pass.\n\nWHAT THIS PASS TOOK AND WHY IT IS THE ATOM'S OWN CRITERION AND NOT A NEW PROGRAM. The 2026-08-15\ncensus (docs/design/EP6_WALL_CONFORMANCE_CENSUS_DISCOVER.md) section 8 rejected the obvious exit\ncriterion in as many words -- \"an exit criterion of the form 'every crossing is envelope-borne or\ngrandfathered' is NOT directly testable at HEAD today, and an atom that adopted it would be\nadopting an unfalsifiable criterion\" -- and named the testable one: \"each channel gets its own\nenumerator and its own shrink-only list, and the exit criterion is that every channel HAS an\nenumerator\". Two of six had one. This pass built the other four.\n\n  tools/wall_channel_census.py, 6 enumerators, 159 previously-invisible crossings:\n    A  direct import edge      3 members   DELEGATED to epistemic_wall.crossings_at\n    B  indirect via a bridge   2 members   DELEGATED to epistemic_wall.indirect_crossings\n    C  the envelope           19 members   NEW  (importer module, interface.contracts seam)\n    D  the same-step port      7 members   NEW  (tools/*_port module, importer)\n    E  structural Protocol     2 members   NEW  (business-side file, Protocol class name)\n    F  published artefact    131 members   NEW  (run-output key, business-side reader file)\n\nA AND B ARE REPORTED AND DELIBERATELY NOT FROZEN. WALL_CROSSING_DISPOSITION_REGISTER.md plus\ntools/wall_crossing_dispositions.py already enforce a shrink-only rule on exactly that subject.\nFreezing them a second time here would put two controls on one subject, which does not double the\nsafety: it means an ordinary ruled change reds a gate whose owner is another file, and\nfeedback_control_that_can_only_fail_wedges says such a gate is routed around within a day. So the\ntool REPORTS all six (channels_without_an_enumerator() is the exit criterion as a function, and it\nreturns []) and FREEZES the four that had no owner.\n\nR15 -- 25 tests, and both directions shown for every guard.\n  MUTATIONS THAT MUST FIRE, one per frozen channel plus two shapes that a naive control misses:\n  a new envelope importer; a new port importer; A SIXTH PORT appearing; a new key reader; A SECOND\n  KEY READ BY AN ALREADY-LISTED READER; and a declared channel whose enumerator is removed. All\n  RED without the guard.\n  NULL CONTROLS THAT MUST NOT FIRE (move the sample, not the law): an unrelated module added to\n  the same trees; a WORLD-side module reading the same published key; a business-side literal that\n  is not a published key; a non-Protocol class. All leave the census byte-identical.\n  FAIL-CLOSED, six branches proven: empty artefact (an empty denominator makes channel F vacuously\n  conformant), artefact absent at the rev, bogus rev, missing baseline, baseline missing a frozen\n  channel, baseline with no `frozen` object. An unavailable check is a FAILED check.\n  TAUTOLOGY CHECK: the baseline is a committed FILE and the current reading is computed from a\n  tree. test_the_baseline_is_a_FILE_and_editing_it_changes_the_verdict moves ONLY the baseline\n  against a byte-identical tree and the verdict flips, so the comparison has a subject outside the\n  reading it checks.\n  ZERO IS NOT REFUSED, on purpose. A channel measuring zero members is a channel fully paid down,\n  and a control pinned to a non-zero count reds on its own success case\n  (feedback_a_control_pinned_as_a_count_reds_on_its_own_success_case). What IS refused is an empty\n  DENOMINATOR, which is a different fact wearing the same number.\n\nTHE CONTROL'S CALLER IS THE COMMIT, NOT A PERSON TYPING IT. pre_commit_test_gate now runs\n_wall_channel_census_check against `git write-tree` -- the tree the commit WOULD create -- placed\nbeside the wall-register step and before the pure-docs early return, because a commit that widens\nthe envelope or the artefact may select no test targets at all. HEAD would have been the wrong\nsubject for the reason this file already learned once: it reds the commit that REPAIRS a\ndivergence and passes the one that introduces it. Measuring the would-be tree also puts both sides\nof channel F on ONE ref -- the readers and the artefact their keys come from -- which is the\ndiscipline a two-sided census needs. Cost measured: 5.4s.\n\nTHE FIXTURE FOUND A REAL FAIL-OPEN IN THIS PASS'S OWN FIRST DRAFT. Channel D discovered its ports\nfrom the EDGE LIST (any module named tools.*_port that appeared as an import source). A port that\nimports nothing produces no edge, so the simplest port anyone could write was invisible to the\nchannel built to see ports. test_MUTATION_a_SIXTH_port_appearing built exactly that and got a\nclean bill of health. Ports are now discovered from the FILESYSTEM. Recorded because the shape is\ngeneral: deriving a population from a by-product of that population's behaviour makes the inert\nmembers invisible, and the inert member is usually the new one.\n\nTWO CORRECTIONS TO THE CENSUS ITSELF, both measured here:\n  1. CHANNEL A HAS SHRUNK 6 -> 3 since 2026-08-15 (KNIFE paydown). The three survivors are\n     simulation.customer_events -> {company.crm.churn_model, saas.churn_model,\n     saas.home_move_win_rate}. Reported, not filed as a finding: this is the programme working.\n  2. THE CENSUS'S CHANNEL-D READER LIST WAS PARTLY WRONG. Section 4 names\n     company/trading/credit_limits.py (via CreditCheckResult) and\n     company/interfaces/bitemporal_event_log.py (via MarketDataPort) as reaching the business side.\n     Neither imports a port: both only MENTION one in a docstring or comment. The AST enumerator\n     finds 7 real import edges and neither of those is among them. The census's prose was built\n     from references, not from edges -- the substring-census shape\n     (feedback_a_substring_census_can_be_100_percent_false_positives_from_a_longer_common_word).\n     The enumerator is now the authority and the census is the narrative.\n\nWHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later:\n  * Channel F's 131 is the CHANNEL WIDTH, not the count of SIM-origin crossings. Per-key\n    provenance is unanswerable for 38 of the keys by construction (FINDING 1, the 2026-08-15\n    walk): the orchestrator binds both sides' values into one row in one function scope. A\n    shrink-only width is the honest control that walk leaves available.\n  * Channel E's 2 is a SUPERSET -- every business-side Protocol declaration, not only those a\n    world object satisfies. Deciding satisfaction needs a type checker. Superset is the safe\n    direction for a ratchet: a new Protocol must be LOOKED at.\n  * Channel F's reader side is literal-access only. A computed key is unresolvable statically, so\n    the reader set is a LOWER BOUND rather than a total.\n\nL3 IS NOT CLAIMED, and the reason is sharper than pass 10's. The enumerator criterion is met for\nthe first time -- but (a) it was met by code written in THIS pass, with no HARDEN pass and no\nExpert Hour against it, and the map's own L3 definition is \"passed the full loop incl. HARDEN;\nExpert Hour: this is real\"; and (b) channel D's named substance is still undone. Section 8 said of\nthe ports: \"they already own a version field, and putting it on the wire is the whole of their\nconformance\". Re-measured this pass: `include_schema_version` appears in ZERO call sites across\nsimulation/, company/, saas/ and background/ -- every live call takes the False default, exactly as\nthe census found four days ago. Moving to L3 now would be claiming the criterion's letter while\nits stated content is unbuilt.\n\nNEXT MOVE, named so the next pass does not have to re-derive it: migrate the three live port call\nsites (simulation/run_phase4c_on_phase2b.py:237, :324, simulation/run_phase2b.py:1647) onto\ninclude_schema_version=True, so schema_version leaves the process on channel D for the first time.\nThat is channel D's whole conformance by the census's own definition, it is small, and it is\ncheckable on the published artefact rather than in a fixture."
- "2026-08-19 pass 12 BUILD, level HELD at 2, loop_stage stays build. THE VERSION IS NOW ON\nTHE WIRE. This pass does the one thing pass 11 recorded as the next move, verbatim: \"migrate the three\nlive port call sites onto include_schema_version=True, so schema_version leaves the process on channel D\nfor the first time\". Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD c728642c3, worktree, with this atom's file_scope clean before the pass.\n\nTHE BEFORE-STATE, MEASURED ON THE PUBLISHED ARTEFACT RATHER THAN ASSERTED. Reading\ndocs/reports/run_output_latest.json at HEAD: meter_read_log 1600 rows, contact_centre_log 392 rows,\nacquisition_funnel_log 4 rows -- 1,996 channel-D rows in total, and ZERO carrying a schema_version.\nExactly what the 2026-08-15 census predicted four days ago and what pass 11 re-measured: the field was\nstructurally present on every port message and populated on none of them.\n\nWHAT CHANGED, THREE LINES. The call sites are simulation/run_phase4c_on_phase2b.py (meter reads,\ncontact centre) and simulation/run_phase2b.py (acquisition funnel), all three now\n`to_log_entry(include_schema_version=True)`. Purely additive on the wire: every consumer reads named\nkeys (`company/compliance/population_sanity.py`, `saas/reporting/annual_report.py`,\n`tools/generate_dashboard_data.py`, `tools/population_anchor.py`, `tools/generate_shadow_html.py` all\nchecked), no consumer asserts an exact key set, and there is no run-output schema validator to refuse a\nnew field. `from_log_entry` already defaulted the field, so old artefacts still load.\n\nPASS 11'S OWN LINE NUMBERS HAD DRIFTED -- it named :237, :324 and :1647; the sites were at :270, :357\nand :1705. Recorded because a \"next move\" written as a line number is a pointer that rots: the file\npath plus the expression found them, the number did not.\n\nTHE CONTROL, AND WHY IT IS NOT A BIGGER ENUMERATOR. `enumerate_d` counts IMPORTERS of a port. A port\ncan be counted by it, declare `schema_version`, and emit it nowhere -- which is precisely the state\nthat held for four days without any control noticing. A count of importers is blind to that by\nconstruction, so `wire_conformance()` is a separate function in tools/wall_channel_census.py: it finds\nevery `X.to_log_entry(...)` outside the port modules and asks whether the call sets the flag TRUE.\n\nR15 -- 14 new tests, 39 in the file, both directions shown.\n  THE MUTATION FOR THIS CONTROL IS REAL REPO HISTORY, NOT A FIXTURE. `wire_conformance_at(rev='HEAD')`\n  is RED at c728642c3 and names exactly the three sites this pass repaired; the worktree is GREEN.\n  Separately, reverting ONE shipped call site by hand turned test_THE_LIVE_WIRE_CARRIES_THE_VERSION red\n  naming simulation/run_phase2b.py:1710, and restoring it turned it green.\n  MUTATIONS THAT MUST FIRE: a call site omitting the flag; the flag passed as False (naming the keyword\n  is not carrying the version); a SECOND caller omitting it while the first still carries.\n  FAIL-CLOSED, and the first branch is the one that matters: DELETING THE PARAMETER FROM THE PORT is\n  the cheapest way to make this control pass, so ports-exist-and-none-declares-the-flag RAISES rather\n  than passing. Ports declaring the flag with no caller at all raises too -- an empty denominator makes\n  channel D vacuously conformant, channel F's own doctrine applied to a second channel.\n  ZERO IS NOT REFUSED: no ports at all returns a clean verdict, because channel D fully paid down is\n  this atom's success case and a control pinned to a non-zero count reds on its own success\n  (feedback_a_control_pinned_as_a_count_reds_on_its_own_success_case).\n  NULL CONTROLS THAT MUST NOT FIRE (move the sample, not the law): a port's OWN nested serialisation --\n  acquisition_funnel_port calls to_log_entry() on its FunnelStageMessage rows, whose serialiser takes\n  no flag, and counting it would make the control permanently red for a reason its subject cannot fix;\n  an unrelated module; and simulation/meter_reads.py's free function `read_event_to_log_entry`, which a\n  bare-name match would have swallowed.\n  INDEPENDENCE: the verdict's subject is program text on disk, not a value the module derives from\n  itself -- test_the_wire_check_reads_the_TREE moves only the call site and the verdict moves with it.\n\nTHE CALLER IS THE COMMIT. `_wall_channel_census_check` in pre_commit_test_gate now runs the wire check\nagainst the same `git write-tree` the census step uses, fail-closed on a raise, so a commit that makes\na port message cross silently is refused before it lands rather than found four days later.\n\nTHE ARTEFACT HALF IS REPORTED AND DELIBERATELY NOT GATED. `wire_on_artefact()` counts, per published\nkey, how many rows carry a version -- the R11 half, because only the artefact proves the version\nARRIVED. It is not in the gate, and a test asserts that: the artefact is regenerated by a SIM RUN, so\nflipping a call site cannot move a single row until the next run publishes. A gate on it would red the\nvery commit that repairs the defect and pass the one that introduced it -- the ordering trap this file\nalready learned once for channel F.\n\nTHE SIX CHANNEL COUNTS DID NOT MOVE (3/2/19/7/2/131) and the baseline needed no re-freeze. Channel F\ncounts TOP-LEVEL keys, and schema_version is a key inside a log ROW, so widening the row does not widen\nthe channel. Checked rather than assumed.\n\nWHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later:\n  * THE VERSION HAS NOT YET ARRIVED ANYWHERE. Every published artefact in the repo still reads 0/1,996.\n    The code now asks for the version; only the next sim run can show it on the wire. R11 is half\n    satisfied on purpose and the missing half is named, not glossed.\n  * The nested `stages` rows inside acquisition_funnel_log still carry no version. FunnelStageMessage\n    has no version field to carry; the version is borne once by the envelope row. Not a defect, but it\n    means \"every channel-D row carries a version\" is false at one nesting level down.\n  * `wire_call_sites` matches the method by NAME on an attribute call, so a port message serialised\n    through an alias or a computed getattr is invisible -- a LOWER BOUND, the same limit\n    `_literal_key_reads` already carries for channel F.\n\nL3 IS NOT CLAIMED, and the reason has moved on from pass 11's. Pass 11 held for two reasons: (a) no\nHARDEN pass against freshly-written code, and (b) channel D's named substance undone. (b) IS NOW DONE.\n(a) still stands -- this pass again wrote new code, and the map's L3 definition is \"passed the full loop\nincl. HARDEN; Expert Hour: this is real\". Added to it is the R11 gap above: an atom whose headline is\n\"the wall carries versioned messages\" should not move to L3 while every published artefact still shows\nzero of them.\n\nNEXT MOVE, named so the next pass does not re-derive it: after the next sim run publishes, run\n`wire_on_artefact(artefact_at('HEAD'))` against the committed artefact and confirm the three logs read\n1600/1600, 392/392 and 4/4 rather than 0. That closes R11 on this atom with a fetched value rather than\na fixture, and it is the last thing standing between here and a HARDEN pass toward L3."
- "2026-08-19 pass 13 BUILD, level HELD at 2, loop_stage stays build. PASS 12 IS LANDED AND\nTHE CONTROL IS BLOCKING AGAIN. Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 2227083c8.\n\nTHE FINDING THIS PASS OPENED WITH -- PASS 12 WAS IN NO COMMIT. `git grep include_schema_version HEAD --\nsimulation/` returns EMPTY at 2227083c8; all three migrated call sites existed only in the working tree.\nPass 12's own record was uncommitted beside them, and the maturity-map cell it wrote says, verbatim,\n\"LANDED VIA A WORKTREE SWAP ... this commit's tree is HEAD plus the three EP6 hunks only\". A landing\nclaim that exists only in the working tree is self-refuting: the tree it describes was never created.\nTwo commits (c728642c3, 2227083c8) went past it, neither carrying the code. This is the\nuncommitted_and_orphaned_work class again, on the atom that had already recorded the same class twice\n(pass 10 landed pass 9's uncommitted L2; pass 12 was landed by nobody until now).\n\nWHAT PASS 12 CLAIMED THAT IS TRUE, RE-MEASURED RATHER THAN INHERITED. Its artefact claim holds on the\nLIVE artefact: `wire_on_artefact(docs/reports/run_output_latest.json)` reads meter_read_log 1600/1600,\ncontact_centre_log 392/392, acquisition_funnel_log 4/4 -- 1,996 of 4,542 published rows now carry a\nschema_version, against zero four days ago. The scope limit pass 12 stated is also still true and is\nnot narrowed here: the COMMITTED copy of that artefact reads 0, because the publish path never refreshes\nthe tracked file, so `wire_on_artefact(artefact_at('HEAD'))` still reports zero. R11 is satisfied on the\nlive artefact and unsatisfiable on the committed one until that publish question is ruled.\n\nTHE CONTROL WAS DOWNGRADED TO REPORTING-ONLY, AND THAT WAS A LANDING-ORDER DEFECT WEARING A CONTROL\nDEFECT'S CLOTHES. An uncommitted edit to `_wall_channel_census_check` printed the wire verdict and\nreturned ok, with a written reason: committed code had three silent sites, so the check refused EVERY\ncommit in the repo, the publisher's included. The reason was accurate and the remedy was aimed at the\nwrong half -- the rule was right and its subject was merely unlanded. Landing the sites makes it\nsatisfiable, so this pass restores BLOCKING in the SAME commit that makes it pass, which is the only\ncommit in which restoring it is honest. Measured before restoring, not hoped: `wire_conformance_at`\nagainst a probe tree of HEAD + this atom's four code files reports all 3 sites carrying; against HEAD it\nreports all 3 SILENT and names them. A gate no commit can satisfy stops the line; a gate every commit\nsatisfies by construction is not a gate. This one now refuses exactly the defect it is named for.\n\nR15 ON THE CALLER, WHICH IS THE HALF THAT WAS MISSING. The enumerator had 39 tests and every one of\nthem proved the VERDICT right. None asked whether the caller acts on it -- and for one commit it did\nnot. Three new tests (42 in the file), all on `_wall_channel_census_check` with the census half forced\ngreen so the result is attributable to the wire half alone:\n  MUTATION: a verdict carrying one silent site must return (False, ...) and the refusal must name the\n  site (R5, diagnostic payload). PROVEN BY REVERTING THE SHIPPED BRANCH: with the reporting-only body\n  restored by hand, this test and ONLY this test goes red; the file was restored byte-identical after.\n  NULL CONTROL: same caller, same forced-green census, only the wire verdict changes -- a conformant\n  verdict must PASS. Without it, the mutation above is satisfied by a gate that refuses everything.\n  FAIL-CLOSED: the wire check raising must refuse, not skip (R15 FAIL-SILENT -- an unavailable check is\n  a failed check). The existing UNAVAILABLE-import branch already covered the module; this covers the\n  call.\nA control invoked by a caller that discards its verdict is a control that cannot fail, and no amount of\ntesting the control itself can see that -- the test has to be on the caller.\n\nALSO RECORDED: the \"three uncommitted lanes\" pass 12 named in the two call-site files are GONE from the\ntree -- `git diff HEAD` on both files shows the EP6 hunks and nothing else, so no worktree swap was\nneeded there. The map DID need one: its EP6 and EP1 cells both carry unlanded pass-12 counts, and\nlanding EP1's count without EP1's store note would red the store-count invariant that couples them. The\nmap was swapped to HEAD-plus-this-atom's-cell for the commit and the other lane's hunk restored after.\n\nWHAT THIS PASS DOES NOT ESTABLISH:\n  * THE COMMITTED ARTEFACT STILL READS ZERO. Unchanged from pass 12 and deliberately not papered over.\n  * NO HARDEN PASS. This pass wrote new test code and restored a gate branch; the map's L3 definition\n    requires the full loop including HARDEN and an Expert Hour, and neither has run against any of the\n    code written on this atom since pass 11. That is the whole reason the level is held at 2 -- the\n    substance of L3 is now built, and the evidence for it is not.\n\nNEXT MOVE, named: HARDEN. Nothing on this atom is unbuilt any more; what is missing is an adversarial\npass over freshly-written code by something that did not write it. Rule the committed-artefact question\nin the same pass -- either the publish path refreshes docs/reports/run_output_latest.json and\n`wire_on_artefact(artefact_at('HEAD'))` becomes a real R11 check, or the tracked copy is ruled a stale\nsample and the check stops pretending to read it."
- "2026-08-19 pass 14 BUILD, level HELD at 2, loop_stage stays build. PASS 13 WAS ALSO IN NO\nCOMMIT, AND TWO OF THE THREE SITES IT CERTIFIED HAD LEFT THE TREE. Everything below is\nobserved-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 2227083c8 -- the SAME head pass 13 measured at, one tick later. That is the finding.\n\nWHAT THE DRAW FOUND. Pass 13's record says, verbatim, \"PASS 12 IS LANDED\"; pass 12's record says it\nwas \"LANDED VIA A WORKTREE SWAP\". Neither is in any commit. `git grep include_schema_version HEAD --\nsimulation/` is still EMPTY at 2227083c8, the same query pass 13 ran to convict pass 12. Pass 13\ndiagnosed the uncommitted_and_orphaned_work class on this atom for the third time and then joined it:\nits census edits, its gate edit, its store append and its map bump were all still worktree-only when\nthis pass drew the atom. Three passes in a row have now written a landing claim into a tree that was\nnever committed, which is the two-strike rule's threshold twice over.\n\nTHE PART THAT IS NOT MERELY A REPEAT -- THE CERTIFIED SITES DECAYED WHILE THE RECORD SLEPT. Pass 13\nrecorded: \"the EP6 hunks and nothing else, so no worktree swap was needed there.\" That was true when\nwritten and is FALSE NOW. Measured on disk at draw time, before any edit by this pass:\n  `wire_conformance(Path('.'))` -> ok=False, carrying 1 of 3.\n  CARRYING: simulation/run_phase2b.py -> 1714.\n  SILENT:   simulation/run_phase4c_on_phase2b.py -> 265, -> 352.\nBoth channel-D sites in run_phase4c_on_phase2b.py had reverted to the bare `to_log_entry()`, and the\nfile instead carried a STAGED hunk from the margin-basis lane (`contribution_margin_gbp` /\n`net_of_all_costs_margin_gbp` prints replacing the mislabelled \"Net margin\" line). INFERRED, not\nobserved: that lane wrote the file from a HEAD base and staged it, silently discarding the EP6 hunks,\nbecause the index copy contains the margin change and no EP6 change and nothing records a revert.\nWhat IS observed is the outcome -- an uncommitted certification decays without anyone touching the\natom, because the only thing holding it was a working tree three other writers also own.\n\nA RECORD IS ONLY AS DURABLE AS THE COMMIT UNDER IT. Pass 13's own conclusion -- \"a landing claim that\nexists only in the working tree is self-refuting: the tree it describes was never created\" -- applies\nto pass 13. This pass does not rewrite its text. It appends the correction, restores the two sites,\nand commits, so that the sentence stops being true of this atom.\n\nWHAT THIS PASS DID.\n  1. RESTORED the two silent sites in run_phase4c_on_phase2b.py (meter reads, contact centre) to\n     `to_log_entry(include_schema_version=True)`. Re-measured, not assumed:\n     `wire_conformance(Path('.'))` -> ok=True, carrying all 3, silent [].\n  2. RE-RAN the atom's tests rather than inheriting pass 13's count: 98 passed across\n     tests/tools/test_wall_channel_census.py and tests/company/interfaces/test_wall_protocol.py.\n  3. LANDED passes 12, 13 and 14 in ONE commit via `tools.surgical_land`, because the blocking\n     restoration pass 13 wrote into `_wall_channel_census_check` is only honest in the commit that\n     makes it satisfiable -- and that commit did not exist until this one.\n\nFOUR FILES CARRIED A SECOND LANE AND WERE SWAPPED TO HEAD-PLUS-EP6-ONLY FOR THE GATE, disk restored\nby `trap` afterwards (the gate outlives any caller timeout):\n  simulation/run_phase2b.py -- also carries KNIFE3 step 39's removal of the `counted_in_guard`\n    keyword. Checked rather than assumed that dropping it is safe: `company/interfaces/growth_desk.py`\n    at HEAD STILL DECLARES `counted_in_guard`, so HEAD-plus-EP6 is internally consistent and the\n    TypeError that killed 8 consecutive sim runs cannot be reintroduced by this commit.\n  simulation/run_phase4c_on_phase2b.py -- also carries the margin-basis lane described above.\n  tools/pre_commit_test_gate.py -- also carries that lane's two new CONTROL_TESTS entries, one of\n    which names `tests/saas/test_net_after_cts_and_blindfold_arithmetic.py`, a file that is NOT in\n    this commit. Landing that entry would have made the gate reference a path its own tree lacks --\n    the R15 FAIL-SILENT shape, manufactured by a landing. Only the `_wall_channel_census_check` hunk\n    is taken.\n  docs/design/maturity_map.yaml -- also carries EP1_clv_three_horizon's own unlanded count bump.\n    Landing EP1's count without EP1's store note reds the store-count invariant that couples them.\n\nWHAT THIS PASS DOES NOT ESTABLISH.\n  * THE COMMITTED ARTEFACT STILL READS ZERO. Unchanged from passes 12 and 13, deliberately not\n    papered over: the publish path never refreshes the tracked docs/reports/run_output_latest.json,\n    so `wire_on_artefact(artefact_at('HEAD'))` reports zero while the LIVE artefact reads 1,996 rows\n    carrying. R11 holds on the live artefact and is unsatisfiable on the committed one.\n  * STILL NO HARDEN PASS, and this pass adds no new capability to harden -- it makes the existing\n    one exist in a commit. The level stays at 2 for exactly the reason pass 13 gave.\n\nNEXT MOVE, unchanged and now actually reachable: HARDEN over the code passes 11-13 wrote, by\nsomething that did not write it, plus a ruling on the committed-artefact question."
- '2026-08-19 pass 16 SETTLES THE INSTANCE BY THE TREE, AFTER A SIXTH FAILURE. Measured FIRST, before writing anything, because the five records before this one wrote their claim first: at HEAD 9c0f96666 `git grep -c include_schema_version HEAD -- simulation/` was EMPTY. So pass 15 -- which had started a content-sourced landing in the background and honestly declined to claim its outcome -- was a SIXTH consecutive pass whose landing is in no commit. Recorded as such rather than re-attempted quietly. THIS PASS LANDED IT: commit 0a242d6fa, exactly 2 paths, gate-rc 0, receipt consistent (tree 6b2dcd299). LANDED: `include_schema_version` in `simulation/` -- the three call sites the 2026-08-15 census named as channel D''s whole substance: simulation/run_phase2b.py (acquisition funnel) and simulation/run_phase4c_on_phase2b.py (meter read, contact centre). Verified BY THE TREE and never by the landing command: `git grep -c include_schema_version HEAD -- simulation/` returns run_phase2b.py:1 and run_phase4c_on_phase2b.py:2, which is the finding''s own admissible settlement query and the only evidence it accepts. The commit carries those two paths and nothing else, and the worktree holds no residue afterwards -- so no sibling lane was swept in and no hunk was dropped. WHAT THE R3 REDESIGN BOUGHT, observed rather than argued: while this pass''s gate was running, a concurrent KNIFE3 lane ran `git checkout -- company/interfaces/growth_desk.py` against the shared worktree -- the same class of event that at 22:49:00 reverted both EP6 files and moved the work from ''in the worktree, in no commit'' to ''in neither''. It could not touch this landing, because --content committed bytes held in /tmp and the worktree copy was never read. A shared worktree is not storage; that is why five worktree-sourced passes could not settle this and the sixth content-sourced one did. ALL THREE PROCEDURAL RULES THE SIX PASSES COST ARE NOW EXERCISED TOGETHER, not just written down: content-sourced (by