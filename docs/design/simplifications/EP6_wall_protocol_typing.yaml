atom_id: EP6_wall_protocol_typing
simplifications:
- '2026-08-20 pass 19 BUILD, level HELD at 2, loop_stage stays build. CHANNEL C NOW OWNS A CONFORMANCE QUESTION, and its first answer is that two of the three versioned seams never become messages at all. This pass does the one thing pass 18 recorded as the next move, verbatim: "give CHANNEL C its conformance question ... does an envelope crossing carry its version on the wire -- asked of `interface/contracts/wall_envelope.py`''s importers rather than the typed ports." Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 63bf50039, worktree.

  THE QUESTION HAD TO BE RE-DERIVED, AND THE ONE PASS 18 NAMED WOULD HAVE BEEN A TAUTOLOGY. `WallRequest`/`WallResponse` declare `schema_version` as a REQUIRED dataclass field, so "an envelope crossing carries a version" is true by construction on every tree that compiles -- R15 TAUTOLOGY exactly, a checked value guaranteed by the same definition it checks. Worse, the structural presence of the field is PRECISELY what makes the defect invisible: a `WallResponse` handed to the far side as a Python object has a `schema_version` attribute that is never serialised, never decoded and never refused, and it looks identical to a conforming crossing from every angle a field-presence check can see. So channel D''s question -- is the version actually ON THE WIRE -- lands on channel C as: does this seam''s envelope get ENCODED into the declared wire form by one side and DECODED back by the other, or does the object simply cross the call frame.

  BUILT: `envelope_wire_conformance` in `tools/wall_channel_census.py`, reporting four populations rather than a boolean, because "not wire-borne" hides three different repairs. `wire_borne` -- encoded and decoded. `half_wired` -- one side only, which is STRICTLY WORSE than in-process because it looks transported: bytes in the wire form that nothing version-checks, or a decoder with no producer. `in_process` -- neither, the defect the atom exists to close. `unversioned` -- a channel C seam declaring no `SCHEMA_VERSION`, reported rather than scored or dropped, because it has nothing to put on a wire and that is a different fact from staying quiet (the same discipline as `_ports_declaring_the_flag`).

  THE READING AT HEAD, and the first thing this atom has been able to say about the envelope channel: `channel C: 1 of 3 versioned seam(s) cross on a wire`. `payment_observable_seam` is encoded by `simulation.payment_seam_adapter` and decoded by `company.billing.payment_observation_consumer`. `conversation_seam` and `flex_observable_seam` are IN-PROCESS -- 19 channel C members, four seams, and only one of them has ever been a message. `wall_envelope` itself is the honest member of the unversioned bucket: it defines the shape and is not a crossing.

  THE TWO SIDES ARE DETECTED DIFFERENTLY AND THE ASYMMETRY IS THE DESIGN''S, NOT A SHORTCUT. `simulation/payment_seam_adapter.py`''s own comment forbids the counterparty importing the company''s codec -- a mock that encoded with the company''s decoder would make the round-trip a tautology in the R15 sense -- so there is no shared encoder to look for and an ENCODE site is recognised by the SHAPE it emits. The company has exactly one codec, so a DECODE site is recognised by importing `decode_request`/`decode_response` from it. THE SHAPES THEMSELVES ARE READ FROM `wall_protocol`''S OWN `REQUEST_WIRE_FIELDS`/`RESPONSE_WIRE_FIELDS`, never restated in the census, which is what makes this independent rather than self-agreeing: a field added to the envelope moves the contract and moves this control with it, where a copy of the key set would agree with itself for ever. THE SUBJECT IS DERIVED, pass 17 and 18''s discipline held: the seams come from `enumerate_c`''s own output, so a fourth seam owns a wire question on the day it lands rather than the day someone remembers to list it.

  R15: 21 new proofs, 85 passing in `tests/tools/test_wall_channel_census.py`, and the two doctrine mutations were RUN not asserted. (1) EXCUSE-EVERYTHING: relax the encoder match from "a dict literal whose key set IS a declared wire form" to "any dict literal at all" and both in-process seams jump to `half_wired ENCODED` -- the report would then claim `conversation_seam` and `flex_observable_seam` put bytes on a wire when they emit nothing of the kind, which is a verdict that excuses every unwired crossing while looking exactly as diligent. (2) FAIL-OPEN: default a missing `SCHEMA_VERSION` to 1 instead of reporting it and `1 of 3` becomes `2 of 4` with `wall_envelope` -- the module that DEFINES the envelope -- credited as a conforming crossing; the null control is the same wrapper without the default, which leaves the verdict byte-identical, so the move is the default and not the patching. BOUNDARY, the value the rule is most easily wrong about: a dict ONE KEY SHORT of the wire form is not an encode site and neither is a SUPERSET, because `absence is never agreement` is the envelope''s own law -- a message missing a required key is one the far side must refuse, so accepting it would certify as transported exactly the crossing that cannot land. FAIL-CLOSED four ways: an absent codec REFUSES rather than reporting every seam in-process (the reassuring failure -- with no shapes to match, a diligent-looking control finds a lot); a missing or computed wire-field constant refuses; all seams losing their version constant refuses, because deleting `SCHEMA_VERSION` is the cheapest way to make this pass; and ZERO channel C members is NOT refused, because a fully paid-down envelope channel is this atom''s success case and a control pinned to a non-zero count reds on its own success.

  REPORTS, DOES NOT GATE, and the condition for that changing is recorded in the code and asserted by `test_channel_C_is_NOT_wired_into_the_commit_gate_and_the_condition_is_recorded`. Two of three seams are in-process at HEAD, so gating channel C would refuse EVERY commit in the repo including the ones that migrate a seam -- pass 13''s landing-order defect, which this file has already learned once. It becomes a gate in the same commit that makes it satisfiable, which is the only commit in which restoring it is honest.

  L3 IS STILL NOT CLAIMED, AND PASS 18''S CONDITION WAS NECESSARY RATHER THAN SUFFICIENT. Pass 18 named one remaining blocker -- a second channel owning a conformance question of its own -- and that blocker IS discharged: C has one, R15-proven, mutations run. What discharging it REVEALED is a larger condition that was previously unmeasurable and is now a number: this atom''s claim is that every SIM/company boundary crossing becomes a typed, versioned message, and its own new instrument says two of three seams are not messages. Moving to L3 on the pass that first measured the gap would be greening my own verdict with the reading that convicts it. The level moves when channel C''s answer does, not when its question exists.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate `conversation_seam` onto the wire -- the counterparty (`simulation/conversation_response.py`) grows its OWN encoder emitting `RESPONSE_WIRE_FIELDS`, exactly as the payment adapter does and for the same anti-tautology reason, and the company side (`company/comms/conversation_generator.py`, `company/comms/susceptibility_estimator.py`) decodes through `company.interfaces.wall_protocol`. Conversation before flex because it is the narrower of the two -- three importers against four -- and because a second migrated seam is what turns channel C''s conformance from a sample of one into a rate the gate can eventually hold.

  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the in-process reading is this atom''s own subject and its repair is this atom''s own next move, not a defect in another lane''s mechanism.'
- '2026-08-20 pass 20 BUILD, level HELD at 2, loop_stage stays build. THE CONVERSATION SEAM IS A MESSAGE NOW, BOTH LEGS, and channel C''s answer moved 1-of-3 to 2-of-3. This pass does the one thing pass 19 recorded as the next move: "migrate `conversation_seam` onto the wire -- the counterparty grows its OWN encoder emitting `RESPONSE_WIRE_FIELDS` ... and the company side decodes through `company.interfaces.wall_protocol`." Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 53687720f, worktree.

  THE READING MOVED, and it is the atom''s own instrument that says so. Before, at HEAD: `channel C: 1 of 3 versioned seam(s) cross on a wire`, with `conversation_seam` and `flex_observable_seam` IN-PROCESS. After: `channel C: 2 of 3`, `interface.contracts.conversation_seam -- encoded and decoded`. `flex_observable_seam` is now the only in-process crossing left and is the next migration; `wall_envelope` stays the honest member of the unversioned bucket.

  BOTH LEGS, NOT THE ONE THE CENSUS WOULD HAVE ACCEPTED, and this is the substantive judgement of the pass. `envelope_transport` credits a seam as wire-borne on ONE encoder and ONE decoder anywhere among its importers -- the subject is the SEAM, not the LEG. This seam has two legs where the payment seam had one: the company EMITS a `WallRequest[ConversationMessage]` and separately in time OBSERVES a `WallResponse[ConversationResponse]`. Wiring only the observable leg would have flipped the census reading to exactly the same `2 of 3` while leaving the request envelope crossing the call frame with a version nobody reads -- the identical defect, on the leg the instrument cannot see. So: `simulation/conversation_response.py` grew `encode_wall_response`/`respond_over_wire` AND `decode_wire_request`; `company/comms/conversation_generator.py` grew `encode_message_payload`/`generate_wire_request`; `company/comms/susceptibility_estimator.py` grew `decode_observable_payload`/`observe_wire`.

  THE TWO SIDES ARE WRITTEN INDEPENDENTLY AND THE ROUND TRIP IS THEREFORE NOT A TAUTOLOGY. The world''s codec never imports `company.*` (structurally asserted from the AST, not by scanning for lines beginning `import` -- a docstring in this very module wraps onto a line starting "from ``nudge_physics``", and a control a stray sentence can red is a control that gets weakened until it means nothing). The company''s codec never imports `simulation.*`. What makes them agree is the CONTRACT and only the contract: both read `interface.contracts.conversation_seam` -- the payload dataclasses, their `get_type_hints`, `OBSERVABLE_RESPONSE_PAYLOAD_TYPES`, `SCHEMA_VERSION` -- the way a real counterparty reads a published schema. EVIDENCE THAT THE INDEPENDENCE IS REAL RATHER THAN CLAIMED: the company-side fixture, hand-written against the schema, encoded `status` as `"ok"` and was REFUSED -- `WallStatus`''s values are upper-case. A fixture built by calling the sim''s encoder would have agreed with itself and never asked.

  THE COMPANY IS NOW INDISTINGUISHABLE BETWEEN A WIRE COUNTERPARTY AND AN OBJECT ONE, asserted rather than asserted-about: two estimators, same customer, same message, one handed the observable as bytes and one as an object, must reach an identical `posterior_report`. If transport moves the belief at all then a mock and a real endpoint are NOT indistinguishable, whatever the envelope says.

  THIS IS THE LIVE PATH, NOT A SPARE ONE (R11-shaped). `background/conversation_gap_ledger.py::_train_estimator` -- the harness that publishes the belief-vs-truth gap -- now crosses on `respond_over_wire` + `observe_wire`. The published gap is therefore measured against a company that only ever saw an encoded, version-checked envelope. Proven by patching `observe_wire` to refuse and asserting the refusal FIRED (a codec nobody calls would leave that test passing for the wrong reason), and by the un-patched twin that asserts the belief still moves. The envelope clock is a fixed epoch, never `now()`: C-S2 replay means two identical runs must emit identical bytes.

  R15: 63 new proofs -- 21 appended to `tests/simulation/test_conversation_response.py` (24 to 45) and three new files, 19 + 12 + 11. Six mutations RUN, not asserted, each with a NULL CONTROL that isolates the move from the wrapping. (1) FAIL-OPEN, both sides: `wire.setdefault("schema_version", 1)` -- the sibling `from_log_entry` pattern -- makes a message that never stated its version decode CLEAN, silently relabelled as the one version this build speaks today; the same wrapper without the default still refuses. (2) EXCUSE-EVERYTHING: relax the exact-key-set rule to a subset check and a message carrying an undeclared key sails through, so the decoder can no longer tell a v2 counterparty from a v1 one. (3) THE WALL, at payload depth: a counterparty that starts shipping `tone_susceptibility` alongside the observables produces a perfectly well-formed ENVELOPE, so only a payload-depth refusal catches it -- and it must, because a company that folded that number in would be READING ground truth rather than inferring it. Every one of `FORBIDDEN_TRUTH_FIELDS` is refused by name (R10: the class fails, not an instance). (4) TIDY-ENCODER: dropping null-valued keys is the most natural "cleanup" anyone would make, and it hands the far side an absence it can only resolve by defaulting. BOUNDARY, the values these rules are most easily wrong about: `offer` is `Optional[str]` and `tone` is not, so a decoder that treated every null alike would either refuse every offer-less message (most situations carry none) or accept a tone-less one -- the difference is read from the contract''s own hints, never listed; and `bool` is an `int` subclass, so a `True` latency would decode to a plausible, actionable 1 rather than raising.

  THE RATCHET CAUGHT MY OWN NEW CROSSING, which is the control doing its job on its author. The first draft of `observe_wire` imported `WallStatus` to check the envelope status, and `wall_channel_census --worktree` reported `NEW on channel C_envelope (1): company.comms.susceptibility_estimator -> interface.contracts.wall_envelope`. The repair was to DELETE the import, not to re-freeze the list: `WallResponse.__post_init__` already makes "payload is None" and "status is not OK" the same fact, so the status read asked nothing the payload check had not already answered and would have widened a shrink-only list for nothing. Channel C is back to `every frozen channel matches its list exactly`.

  A GATE BLIND SPOT WAS CLOSED IN PASSING, and it is why the three new test files are named as they are. `pre_commit_test_gate.tests_for` selects by filename STEM (`tests/**/test_<stem>.py` and `test_<stem>_*.py`). No `test_susceptibility_estimator*.py`, `test_conversation_generator*.py` or `test_conversation_gap_ledger*.py` existed, so THREE of the four modules this pass touches mapped to ZERO tests and could have been committed untested -- the same class as the 2026-08-09 publish wedge that put the suffix half of `tests_for` there in the first place. Naming the new files after the module stems puts those modules inside the gate permanently, not just for this commit.

  L3 IS STILL NOT CLAIMED, on pass 19''s own stated condition and not a new one. That pass said "the level moves when channel C''s answer does, not when its question exists". The answer moved -- from one seam in three to two -- but the atom''s claim is that EVERY SIM/company boundary crossing becomes a typed, versioned message, and its own instrument still reports one in-process seam. Two of three is progress, not the claim.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING), and it is the CONTROL before the last migration, in that order. Make `envelope_wire_conformance` LEG-AWARE before migrating `flex_observable_seam`. The limit this pass had to work around by hand is now the binding one: a seam is credited as wire-borne on one encoder and one decoder ANYWHERE among its importers, so a next migration that wires only the observable leg would report `3 of 3` and be believed. The legs a seam HAS are derivable in this file''s established discipline -- a seam declaring a `WallRequest[...]` specialisation owns a request leg, one declaring `WallResponse[...]` owns a response leg -- so `payment_observable_seam`, which honestly has only the inbound leg, is not red-listed for a leg it does not have. The encoder half already distinguishes the shapes (`wire_field_sets` returns request and response separately and `_emits_a_wire_shape` collapses them to a bool); the decoder half distinguishes them by name (`DECODE_NAMES`). Both halves already hold the information the verdict throws away, which is the cheapest possible version of this repair and the reason to do it before rather than after.

  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE) for the leg-granularity limit: it is a limit of THIS atom''s own instrument, found by using it, and its repair is this atom''s own next move. The gate stem blind spot was closed in place rather than filed, being three file names.'
- '2026-08-20 pass 21 BUILD, level HELD at 2, loop_stage stays build. THE VERDICT''S UNIT MOVES FROM THE SEAM TO THE CROSSING. This pass does the one thing pass 20 recorded as the next move, in the order it recorded it: "make `envelope_wire_conformance` LEG-AWARE before migrating `flex_observable_seam`" -- the control before the last migration, so the migration lands against an instrument that can see it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD baf496f97, worktree, this atom''s file_scope clean before the pass.

  THE DEFECT, PROVEN BY MUTATING THE CONTROL RATHER THAN ASSERTING IT. A seam resolves in two crossings separated in time -- the company EMITS a `WallRequest`, later OBSERVES a `WallResponse` -- and the old rule credited the SEAM as wire-borne on any one encoder and any one decoder ANYWHERE among its importers. Built a fixture whose response leg is fully wired and whose request leg is handed over as a Python object, then ran BOTH rules over the identical tree: leg-blind reports `wire_borne=[conversation_seam, payment_observable_seam]`, leg-aware reports `[payment_observable_seam]` with `request=DECODED-only, response=wire`. The mutation was applied to the CONTROL (leg ownership made unreadable, forcing the fallback), which is the only way to show the reading this replaced was actually wrong rather than merely coarser.

  THE CORRECTION THAT MATTERED, AND PASS 20''S PLAN WAS WRONG ABOUT IT. That plan assumed encode sites are recognised by the SHAPE they emit -- true of the counterparty, and the first leg-aware run therefore reported `conversation_seam` as `request=DECODED-only` and dropped the live reading from 2 of 3 to 1 of 3. That was a FALSE ALARM ON THE ARCHITECTURE''S OWN CORRECT ANSWER: `conversation_generator.generate_wire_request` calls `wall_protocol.encode_request` and builds no dict at all, because the company OWNS that codec and is supposed to use it. THE WALL IS WHAT MAKES THE ASYMMETRY, and it cuts both ways: `simulation/**` may not import `company.*`, so the counterparty CANNOT decode through the codec and instead mirrors the contract''s exact key set (`conversation_response._REQUEST_WIRE_FIELDS`) and refuses against it. So each side has TWO lawful shapes -- codec entry point, or own bytes against the published key set -- and a detector knowing one shape per side red-lists a leg for being written the way the wall requires. That is the most expensive kind of false alarm, because the repair it invites is to break the wall. Both halves are now symmetric (`_encoded_legs`/`_decoded_legs`) and each shape has its own test naming the wall as the reason it exists.

  DORMANT IS A THIRD ANSWER, AND PASS 20''S RECORD STATED THE PREMISE FOR IT WRONGLY. That record justified the design by saying `payment_observable_seam` "honestly has only the inbound leg". It does not: it declares `PaymentCollectionWallRequest = WallRequest[CollectionRequest]`. Under the rule as written, payment would have been red-listed for a leg it genuinely declares -- the opposite of the record''s own stated intent. What is TRUE is that no module anywhere constructs a `CollectionRequest` (its only construction in the repo is inside the contract''s own test, and tests are outside CENSUS_DIRS). So the contract describes a message this build does not yet exchange. Transport evidence alone cannot tell that from an unmigrated crossing, because "never encoded, never decoded" is what BOTH look like; the discriminator is whether the payload type is CONSTRUCTED anywhere in the census trees. DORMANT is reported and not scored -- scoring it would make the control permanently red for a reason its subject cannot fix without deleting the contract, which is the shape of a control that gets tuned away. Its null control is one statement long: construct the payload and nothing else, and the leg leaves the unscored bucket immediately.

  THE LIVE READING IS UNCHANGED AT 2 OF 3 AND IS NOW LEG-PRECISE, which is the point -- a control that moved the headline would have been changing the answer rather than sharpening the question. `conversation_seam [request=wire, response=wire]`, `payment_observable_seam [request=dormant, response=wire]`, `flex_observable_seam [request=dormant, response=IN-PROCESS]`. The last line is the whole remaining claim: ONE leg, on one seam.

  WHAT THIS BUYS THE NEXT PASS, stated as the thing that is now impossible. Wiring `flex_observable_seam`''s DORMANT request leg would have flipped the old count to `3 of 3` and been believed -- a real encoder and a real decoder for a real declared leg, with the live crossing still on the call frame. It is now a no-op on the verdict, and there is a mutation that runs exactly that edit and asserts the verdict does not move.

  TWO FAIL-OPENS THIS DESIGN CREATES, BOTH NAMED AND BOTH CLOSED. (1) SELF-CERTIFYING: the mirror half of the decoder rule makes it reachable for ONE module to both emit a leg''s shape and restate its key set, satisfying "an encoder exists" and "a decoder exists" by itself while nothing crosses. A wire has two ends, so a leg counts as transported only when the encoder and decoder sets are not the same single module; the mutation runs that module and the leg reads ENCODED-only. (2) DELETING THE LEG ALIASES: ownership is read from the seam''s own `WallRequest[...]` specialisations, so a one-line delete makes the leg-aware rule inapplicable. The fallback to the leg-blind rule is correct -- never weaker than what it replaced -- but it must not happen QUIETLY, or the cheapest way to silence a red leg becomes deleting the line declaring it. Legless seams land in their own reported bucket, and a LIVE test asserts that bucket is empty, because every fixture test would still pass while the live control silently reverted.

  R15: 13 new proofs (`tests/tools/test_wall_channel_census.py` section 15, 85 to 98 in the file). Six mutations RUN, each isolated by a null control: one leg unwired on the request side, the same on the response side, wiring only a dormant leg, a self-certifying module, deleted leg aliases, and an unrelated module that must not move any leg state. The live pair follows section 14''s discipline -- ANSWERABLE, not GREEN: every scored seam must resolve to a per-leg state and at least one live leg must read `wire`, so the control has answered in its own success direction, but WHICH legs are wired is deliberately unpinned because pinning it would red the commit that migrates the last one.

  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate `flex_observable_seam`''s RESPONSE leg -- the only scored IN-PROCESS leg left on the wall. Its payloads (`FlexDispatchInstruction`, `FlexSettlementLine`) are constructed in `sim/flex_dispatch.py`, so the counterparty end grows its own encoder against the published key set, and the company end (`company/market/flex_participation.py`) decodes through `wall_protocol.decode_response`. The request leg is DORMANT and must be left alone: wiring it proves nothing and the instrument now says so.

  FOUND IN PASSING, QUEUED NOT FIXED (SELF_INTERRUPT_DISCIPLINE). `tools/wall_crossing_dispositions` is RED on the live tree -- `simulation.run_phase2b -> company.policy.decision_policy` is ruled `cut` while the import is still present. Verified present at HEAD as well as in the worktree, so it is neither mine nor a working-tree artefact, and it is another register''s subject with its own owner (that register''s doc is currently dirty in the shared tree, so a lane appears to be on it). Not touched: it is outside this atom''s file_scope and fixing another lane''s red on sight is the treadmill this rule exists to stop.'
- "2026-08-20 pass 22 BUILD, level HELD at 2, loop_stage stays build. THE FLEX SEAM IS A MESSAGE NOW, AND CHANNEL C HAS NO IN-PROCESS CROSSING LEFT: 2 of 3 -> 3 of 3. This pass does the one thing pass 21 recorded as the next move, in the order it recorded it: \"migrate `flex_observable_seam`'s RESPONSE leg -- the only scored IN-PROCESS leg left on the wall ... The request leg is DORMANT and must be left alone.\" Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 9d997ae8d, worktree, this atom's file_scope and the map both clean of other lanes' hunks before the pass.\n\n  THE READING MOVED, and it is the atom's own instrument that says so. Before: `channel C: 2 of 3 versioned seam(s) cross on a wire`, `flex_observable_seam [request=dormant, response=IN-PROCESS]`. After: `channel C: 3 of 3`, `flex_observable_seam -- encoded and decoded [request=dormant, response=wire]`. Every SCORED leg on the wall is now wire-borne and the in-process bucket is empty for the first time since the channel had a conformance question at all. `every frozen channel matches its list exactly` -- no new channel member was created (both migrated modules already imported the seam, and neither needed `wall_envelope`: the company reads `response.payload` and the envelope's own `__post_init__` already makes \"payload is None\" and \"status is not OK\" the same fact, so no `WallStatus` import was required to check it -- pass 20's ratchet lesson applied before the ratchet had to teach it again).\n\n  THE DORMANT LEG WAS VERIFIED DORMANT, NOT INHERITED, which is the check pass 21's trap actually demands. That pass warned that wiring the dormant request leg would flip the count to `3 of 3` and be believed; the count did reach 3 of 3 this pass, so the warning had to be answered rather than cited. Measured: `FlexEnrolment` is CONSTRUCTED in exactly one file in the repo, `tests/interface/test_flex_observable_seam.py`, which is outside CENSUS_DIRS -- a payload built only by its own contract test is not traffic. `SimInterface.enrol_flex` builds the `FlexEnrolmentWallRequest` ENVELOPE but takes its payload from a caller, and it has ZERO callers anywhere outside its own definition. So the contract describes an outbound message this build genuinely does not send, the dormant reading is correct, and the request leg is untouched. The `3 of 3` is bought entirely by the response leg.\n\n  MIGRATED ALL THREE CALL SITES, NOT THE ONE THE INSTRUMENT CAN SEE, and this is the substantive judgement of the pass. The census's unit is the (SEAM, LEG). The flex response leg is crossed at THREE separate places: `measure_l2`'s settlement statement, and `measure_l3`'s stacked instruction feed and stacked settlement feed. Migrating the first alone would have produced the identical `3 of 3` with two crossings still handed over as Python objects -- the same defect, one granularity below the instrument's, which is precisely what pass 21 fixed at the seam->leg granularity one pass ago. THAT IS THE PATTERN, RECORDED RATHER THAN REPAIRED: the verdict's unit has now been coarser than the defect twice running, and a call-site-level census is the repair. It is not built here because the honest version of it is `wire_call_sites` for channel C, which is a pass of its own; what is done instead is that all three sites were found by hand and moved, and the limit is stated so the next pass does not read `3 of 3` as \"no object crosses this seam\".\n\n  WHAT WAS BUILT, two codecs that never meet. WORLD (`sim/flex_dispatch.py`): `encode_observable_payload` (tagged with the payload type, tag set read from the contract's own `OBSERVABLE_RESPONSE_PAYLOAD_TYPES`), `encode_wall_response`, and three wire feeds -- `emit_settlement_lines_over_wire`, `emit_dispatch_instructions_stacked_over_wire`, `emit_settlement_lines_stacked_over_wire`. COMPANY (`company/market/flex_participation.py`): `decode_observable_payload`, `observe_response_wire`, `observe_settlement_wire`, decoding through `company.interfaces.wall_protocol.decode_response`. THE ASYMMETRY IS THE WALL'S: `sim/**` may not import `company.*`, so the counterparty cannot use the company's codec and builds the bytes against the published key set itself; the company owns that codec and calls it. Neither side is the other's source of truth -- both read `interface.contracts.flex_observable_seam` (the payload dataclasses, their `get_type_hints`, `OBSERVABLE_RESPONSE_PAYLOAD_TYPES`, `FORBIDDEN_TRUTH_FIELDS`, `SCHEMA_VERSION`), the way a real party reads a published schema. THE FIXTURE DISCIPLINE IS THE INDEPENDENCE EVIDENCE, stated as what it is and not more: every company-side fixture is a hand-authored dict written from the schema and NEVER produced by the world's encoder, and the encoder/decoder round trip is asserted only in `background/` -- the harness, the one layer permitted to hold both sides. A fixture built by calling the other side's codec agrees with itself and never asks.\n\n  TAGGED PAYLOADS ARE LOAD-BEARING HERE IN A WAY THEY WERE NOT ON THE CONVERSATION SEAM. This seam really does carry two response payload types -- a `FlexDispatchInstruction` and a `FlexSettlementLine` arrive as SEPARATE responses at different `observed_at` times (C-S3) -- and they SHARE FOUR FIELD NAMES (`unit_id`, `venue`, `window_start`, `window_end`). A receiver that guessed the type from the field set would mis-route them silently, so the tag is checked and `observe_response_wire` takes an `expect=` naming which feed the call site is reading.\n\n  R15: 22 new proofs -- 8 appended to `tests/sim/test_flex_dispatch.py` (9 to 17), 10 to `tests/company/market/test_flex_participation.py` (4 to 14), 4 to `tests/background/test_flex_dispatch_triad.py` (14 to 18). 270 passing across the ten flex/wall/census/protocol suites. Mutations RUN, not asserted, each with a null control that isolates the move from the wrapping. (1) THE VERSION IS NOT A LITERAL: patch the name the encoder reads and the emitted version follows it, plus `fd.SCHEMA_VERSION is seam.SCHEMA_VERSION` tying that name to the contract -- a hardcoded `1` passes every other proof in the file and mislabels every message the day the schema moves. (2) FORBIDDEN TRUTH FIELDS, refused on BOTH sides and by NAME, with the mutation that shows the named check is not redundant with the generic unknown-key rule: give the contract a `true_baseline_mwh` field and the generic rule WELCOMES it, because it is now a declared field -- only the name-keyed refusal stops the company being handed the SIM's counterfactual, which is the exact quantity this triad's gap exists to measure the error of (R10, the class not the instance). Null control: the same fake payload type with an unforbidden field name crosses cleanly, so what fires is the name and not the mutation's scaffolding. (3) FAIL-OPEN: a message that never stated its version is MISSING_FIELD, never relabelled as the one version this build speaks, and a version outside the supported set is UNSUPPORTED_VERSION -- kept distinguishable because \"you did not say what you speak\" and \"you speak a dialect I do not know\" call for different repairs. (4) ABSENCE IS NEVER AGREEMENT, both directions: the encoder writes every declared key INCLUDING its nulls (the tidy-encoder edit anyone would make is the one that hands the far side an absence it can only resolve by defaulting), and the decoder refuses an absent payload field rather than defaulting it -- null control, restore the one field and the identical message crosses. (5) MIS-ROUTED FEED refused, with the same message read by its own feed as the null control. (6) AN EMPTY MESSAGE IS NOT AN EMPTY PERIOD: a payload-less envelope is refused, because a failed feed and a period with no settlement are otherwise identical and the company would read its own under-count as the world's. BOUNDARIES, the values these rules are most easily wrong about: bool is an int subclass, so a `True` metered delivery must be MALFORMED and not a plausible, actionable 1.0 -- while a plain `2` must still cross, because JSON has no int/float distinction and refusing it would refuse honest traffic.\n\n  THE CODECS ARE ON THE LIVE PATH, PROVEN BY BREAKING THEM. A codec nobody calls leaves every codec test green, so the proof has to be on the caller: patch `observe_settlement_wire` to refuse and `measure_l2` FAILS; patch `observe_response_wire` and `measure_l3` FAILS; unpatched, both still produce their gap (the null control, without which the mutation is satisfied by a harness that fails always). The same shape catches a decoder that had quietly grown its own envelope parser instead of calling the company's codec: patch `decode_response` and require the seam read to fail. AND THE CLAIM ITSELF IS ASSERTED, NOT ASSERTED-ABOUT: two companies see the same settlement run, one handed the lines as objects across a call frame and one handed the same run as bytes it decoded itself, and their `learned_delivery_ratio` and `expected_utilised_revenue` must be identical to the last float. If transport moves the belief at all then a mock counterparty and a real endpoint are not indistinguishable, whatever the envelope says -- and indistinguishability is this atom's entire headline.\n\n  A DEFECT THIS PASS INTRODUCED AND CAUGHT, recorded because of HOW it was caught. The first cut of the version-provenance proof used `importlib.reload(sim.flex_dispatch)` to move `SCHEMA_VERSION`. It PASSED when its own file was run alone, and turned SEVEN tests in `tests/sim/test_flex_dispatch_stacked.py` red in the combined run: reload rebinds `DeliveryModel`, `VenueSpec` and `FlexPaymentBasis` to fresh class objects while every sibling test module still holds the old ones, so the isolation cost lands entirely on tests that have nothing to do with the check. Repaired with a `monkeypatch` on the name the encoder actually reads. \"The test passed when I ran its own file\" is exactly how this class ships, and running the ten suites together rather than the touched file is what stopped it.\n\n  FOUND IN PASSING, NOT MINE, NOT TOUCHED (SELF_INTERRUPT_DISCIPLINE) -- AND MY FIRST READING OF IT WAS WRONG, which is the more useful half. `tests/architecture/test_epistemic_wall_ratchet.py` is RED in the shared working tree, on `simulation.run_phase2b -> company.policy.decision_policy`. I first attributed that to HEAD, on the evidence that `git grep -n \"from company.policy.decision_policy\" HEAD -- simulation/run_phase2b.py` finds the import at HEAD. The evidence was real and the conclusion from it was FALSE. Measured properly -- by building the tree THIS COMMIT WOULD CREATE (`git archive HEAD` + this pass's nine files) and running the control inside it -- 12 PASSED. The red is a working-tree artefact and it belongs to the KNIFE3 lane. What that lane holds uncommitted is the REMOVAL of the `(\"simulation.run_phase2b\", \"company.policy.decision_policy\")` entry from `LEGACY_SIM_READS_COMPANY`, annotated \"KNIFE3 step 39, 2026-08-18 (register 3ah): ... is CUT\". What is in NEITHER the tree nor HEAD is the cut itself: `simulation/run_phase2b.py` still imports `CURRENT_POLICY, DecisionPolicy, active_policy` from that module, and the file is byte-identical at both refs. THE RECORD OF THE CUT IS IN THE TREE AND THE CUT IS NOT -- a consumer half without its producer half, the class already filed twice in staging (A_CUT_RECORDED_AS_EXECUTED_HAD_NEVER_BEEN_COMMITTED, A_RENAMES_CONSUMER_HALF_WAS_COMMITTED_AND_ITS_PRODUCER_HALF_NEVER_WAS). Not touched: it is another lane's in-flight work and fixing another lane's red on sight is the treadmill. Named here for two reasons that matter to whoever reads this next. FIRST, it is WHY THIS LANDING IS SAFE: my commit does not carry that allowlist hunk, so the control is green on my tree and the gate can be believed. SECOND, that hunk MUST NOT LAND ALONE -- this test is in the gate's always-run CONTROL_TESTS, so committing the record without the cut reds every commit in the repo, the publisher's included; it is the publish-wedge shape, pre-armed.\n\n  THE GENERAL LESSON, and the reason the wrong reading is recorded rather than quietly replaced: `git grep <symbol> HEAD` answers \"is this symbol at HEAD\", and a CONTROL'S VERDICT IS A PROPERTY OF A WHOLE TREE, not of any one symbol in it. An allowlist and the thing it allows live in two files, so either can move without the other and the symbol query is right about its own question while being useless for attribution. Only building the tree the commit would create can attribute a red -- one `git archive` and one pytest run, which was available the whole time and which I reached for only after asserting the opposite in this very record. It also nearly cost the landing: the erroneous sentence was already inside the bytes handed to `surgical_land`, and the run had to be stopped and re-sourced.\n\n  LINT, repaired on touch rather than filed: `sim/flex_dispatch.py` and `background/flex_dispatch_triad.py` were BOTH already ruff-I001 red at HEAD (measured by running ruff over `git show HEAD:` copies, not inferred) and my own edit added a third on `company/market/flex_participation.py`; all three import blocks are now clean.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * NO HARDEN PASS AND NO EXPERT HOUR on any of the code above. This is the condition that has caught this atom every single time: pass 18's Expert Hour was booked against pass 17's freshly-written instrument and FOUND A DEFECT IN IT -- a report that could not tell its own success case from its failure case. There is no reason to believe two hand-written codecs and a rewired harness are the exception, and the map's L3 definition names the full loop including HARDEN.\n    * THE CHANNEL C CHECK STILL DOES NOT GATE, AND FOR THE FIRST TIME ITS OWN STATED CONDITION IS MET. Pass 19 recorded that `envelope_wire_conformance` \"becomes a gate in the same commit that makes it satisfiable, which is the only commit in which restoring it is honest\" -- and this is that commit: with zero in-process seams, gating would no longer refuse every commit in the repo. It is NOT armed here, and the reason is not the one that rule anticipated. Arming a repo-wide commit gate whose leg detector has faced no adversarial pass, on a shared tree three other lanes are committing to, wedges every lane on a single false negative -- the class that wedged publishing for three hours. A met condition sitting un-armed is itself a control that cannot fail, so this is a debt with a name and a date, not a decision to leave it reporting-only.\n    * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION. A, B, E and F are enumerated -- `channels_without_an_enumerator()` is empty -- but enumeration answers \"who crosses here\", not \"does the crossing conform\". Two channels of six own the second half. \"Every channel across the wall is measured\" remains a count for the other four.\n    * `3 OF 3` IS NOT \"NO OBJECT CROSSES THIS SEAM\", per the call-site limit above.\n\n  L3 IS STILL NOT CLAIMED, and pass 19's condition -- \"the level moves when channel C's answer does, not when its question exists\" -- is now NECESSARY-AND-DISCHARGED rather than sufficient. The answer moved to its ceiling: 3 of 3, no in-process leg left. What stops the level is the first two items above, and the first of them is the one that matters: claiming L3 on the pass that wrote the code would be greening my own verdict with an instrument that has had no adversarial reading, which is the specific mistake pass 18 caught pass 17 making on this same atom.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): ARM THE CHANNEL C GATE, in a pass that does nothing else. Wire `envelope_wire_conformance` into `_wall_channel_census_check` fail-closed on a raise, exactly as channel D's wire check is wired, and MEASURE FIRST against a probe tree of HEAD-plus-the-atom's-files rather than hoping -- the procedure pass 13 established for channel D. Doing nothing else in that commit is the point: if the detector red-lists a lane, the arming commit can be reverted on its own without taking a migration with it. The Expert Hour on this pass's codecs then runs against a gate that already exists, which is the order that worked on channel D and the reverse of the order that cost passes 12-14."
- "2026-08-20 pass 23 BUILD, level HELD at 2, loop_stage stays build. THE CHANNEL C GATE IS ARMED, and this pass does nothing else. This is the one thing pass 22 recorded as the next move, in the form it recorded it: \"ARM THE CHANNEL C GATE, in a pass that does nothing else. Wire `envelope_wire_conformance` into `_wall_channel_census_check` fail-closed on a raise, exactly as channel D's wire check is wired, and MEASURE FIRST against a probe tree ... rather than hoping.\" Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 6467c826f, with this atom's file_scope CLEAN against HEAD before the pass -- which is what made the measurement below a reading of HEAD itself rather than of an uncommitted tree, the distinction that cost passes 12-17.\n\n  MEASURED BEFORE ARMING, WHICH IS THE WHOLE PROCEDURE. `envelope_wire_conformance_at(rev=\"HEAD\")` reports `ok=True`, `channel C: 3 of 3 versioned seam(s) cross on a wire`, in-process bucket EMPTY. That is the first HEAD in this atom's history at which arming is honest, and it is the condition pass 19 wrote down: the check \"becomes a gate in the same commit that makes it satisfiable, which is the only commit in which restoring it is honest.\" Every earlier tree had at least one seam crossing the call frame, so arming there would have refused EVERY commit in the repo including the publisher's -- a landing-order defect, not a control defect, and precisely what cost channel D passes 12-14.\n\n  THE TEST THAT FORBADE THIS WAS THE INSTRUCTION FOR DOING IT. `test_channel_C_is_NOT_wired_into_the_commit_gate_and_the_condition_is_recorded` asserted `\"envelope_wire_conformance\" not in gate` and its own docstring said \"this test is what has to be edited to do it\". It is now `test_channel_C_IS_wired_into_the_commit_gate_and_the_condition_that_allowed_it_is_recorded`, asserting the symbol IS present, and it carries the old reading as the record of why it flipped. That assertion is deliberately the STRUCTURAL half only -- a symbol appearing in a caller is not evidence its verdict is used, which is the exact fail-open this atom shipped for four passes -- so it guards the cheap reversal (deleting the call) and the mutations below prove the refusal.\n\n  ZERO TOLERANCE AND NO DEBT LIST, matching channel D beside it. `EnvelopeWireVerdict.ok` is `not in_process and not half_wired`. HALF-WIRED refuses as hard as IN-PROCESS on purpose: one side only LOOKS transported -- bytes in the declared wire form that nothing version-checks -- so a migration that lands its encoder and forgets its decoder is refused rather than credited as progress. THE UNSCORED BUCKETS CANNOT WEDGE A LANE, which is the property that makes zero tolerance safe here: a DORMANT leg (declared, never sent) and an UNVERSIONED seam (`wall_envelope`, which defines the shape rather than crossing it) are facts about a CONTRACT, not defects in a crossing. Scoring either would make the gate permanently red for a reason no lane can repair without deleting a contract -- the shape of a control that gets tuned away.\n\n  THE LEG-BLIND FALLBACK IS NOW REPORTED BY THE GATE, and it is a report rather than a refusal on purpose. Leg ownership is read from a seam's own `WallRequest[...]`/`WallResponse[...]` aliases, so a one-line delete makes the leg-aware rule inapplicable and the verdict falls back to pass 19's leg-blind rule. That fallback is never WEAKER than the reading it replaced, so refusing on it would red a tree with nothing wrong with it. But silence would make deleting the alias the cheapest way to downgrade this control, and the gate is the one place a lane would actually have seen it -- so the pass message names the seams and says a half-migrated seam would not be caught. Live reading: the bucket is empty, and both a live test and the gate's own success message would say so if it filled.\n\n  R15: 8 new proofs (`tests/tools/test_wall_channel_census.py` section 16, 98 to 106 in the file). THREE MUTATIONS RUN, NOT ASSERTED, each against a probe tree built as `git archive HEAD` + this pass's two files and committed, so the mutation was applied to a real gate module and never to the shared worktree -- a full suite was in flight throughout (pid 1682834, 24m elapsed at the time), and mutating a shared module under a live suite is how this project has broken sibling lanes before. (1) DISCARD THE VERDICT -- delete the two refusal lines, which is exactly the reporting branch passes 19-22 shipped: BOTH refusal proofs fail. (2) EXCUSE-EVERYTHING -- refuse only on `in_process`, the laxer rule anyone would write: ONLY the half-wired proof fails, so the attribution is per-population and not a blanket. (3) FAIL-OPEN -- swallow the `CensusUnavailable` raise and substitute an empty verdict: only the fail-closed proof fails, which matters because `envelope_wire_conformance` RAISES rather than reporting an empty subject when every seam has lost its `SCHEMA_VERSION` -- swallowing it would turn the loudest failure the enumerator has into the quietest. NULL CONTROL: the same probe tree restored, same command, 104 passed -- so what fires is the move and not the wrapping.\n\n  A CONTROL'S FIXTURE WAS ITSELF FAIL-OPEN AND THIS PASS CAUGHT IT. `_gate_wire_branch`, channel D's caller-mutation fixture from section 11, forced the census half green and left everything else real. With a third half added, the real `envelope_wire_conformance_at` then ran against the fixture's fake index tree `\"0\"*40`, raised, and hit its own fail-closed branch -- so channel D's NULL CONTROL went red while looking exactly like a defect in channel D. Repaired by pinning channel C too. The general form, which is why it is recorded: EVERY half of a multi-part step has to be pinned for any ONE of them to be a subject, and adding a half silently un-isolates every fixture that pins the others by name.\n\n  THE LIVE READING, AND THE COST. The armed step returns True on the tree this commit creates: `the wall's four walker-invisible channels have not grown; channel D's 3 wire site(s) carry the version; channel C's 3 of 3 scored seam(s) cross on a wire`, with no fallback notice. Measured cost 5.0s per commit, on top of the `head_export` the census and channel D halves already pay for -- it reuses that machinery rather than adding a second export.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * NO HARDEN PASS AND NO EXPERT HOUR on pass 22's two hand-written codecs. This is the condition that has caught this atom every time, and pass 18 is the reason to take it seriously: the Expert Hour booked against pass 17's freshly-written instrument FOUND A DEFECT IN IT.\n    * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION. A, B, E and F are enumerated; enumeration answers \"who crosses here\", not \"does the crossing conform\". Two channels of six own the second half.\n    * `3 OF 3` IS NOT \"NO OBJECT CROSSES THIS SEAM\" -- pass 22's call-site limit stands, and the gate inherits it exactly: the gate's unit is the (SEAM, LEG), so a fourth crossing of an already-wired leg handed over as a Python object is invisible to it. The gate makes the current reading unreversible; it does not make it finer.\n\n  THE ATOM IS OVER ITS OWN PASS CEILING AND THAT IS RECORDED, NOT WORKED AROUND. `python3 -m tools.discovery_pass_ceiling` reports EP6 at 14 passes SINCE its level last moved (21 total), against a ceiling of 5. The ceiling gates the idle DISCOVER/FRAME lane only -- BUILD and HARDEN stay drawable, and this pass is BUILD -- so it did not refuse this draw and no rule was bent to take it. But the ruling behind it (\"make it impossible for the system to run indefinitely on work that cannot change its own state\") is aimed at exactly this shape, and 14 passes at level 2 with target 3 is the shape. Naming it here so the next pass does not have to rediscover it: the honest reading is that this atom's remaining L3 conditions are a HARDEN pass and a third channel's conformance question, both of which are BUILD-shaped and neither of which is a reason to investigate again.\n\n  L3 IS STILL NOT CLAIMED, and pass 22's first blocker is the one this pass discharged. Its list was: no HARDEN/Expert Hour; the channel C check does not gate; four of six channels have no conformance question; `3 of 3` is not call-site-level. The SECOND is now false -- the gate is armed, mutation-proven, and green on the tree it was armed in. The other three stand, and the first of them is the one that matters, for pass 22's own reason: claiming L3 on the pass that armed the gate would be greening my own verdict with codecs that have had no adversarial reading.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): THE HARDEN PASS / EXPERT HOUR on pass 22's flex and conversation codecs, run as a cold-eyes walk against the CODECS rather than the reports -- the reverse of pass 18's target, because pass 18 already walked the reports and the codecs are what has never been read by anyone but their author. The specific question to put to it is the one pass 22's own record raises and does not answer: both codecs refuse `FORBIDDEN_TRUTH_FIELDS` by name, so what happens when the world adds an observable that is NOT on that list but is nonetheless ground truth the company should not have -- is the list a wall or a denylist? That is the R10 question (the class, not the instance) and it is the one a stranger would ask first.\n\n  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the un-isolated fixture is this atom's own test file, found by using it and repaired in the same pass."
- "2026-08-20 pass 24 BUILD, level HELD at 2, loop_stage stays build. THE CHANNEL C GATE PASS 23 ARMED IS IN A COMMIT NOW -- 1a565872c -- AND IT NEVER WAS BEFORE. Pass 23's record is the one that describes the work; this pass adds no capability to the wall and exists because that work was in the worktree and in no commit, which is this atom's oldest recurring failure and the class pass 16 was written to settle. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 6467c826f before the landing, 1a565872c after.\n\n  MEASURED FIRST, BEFORE WRITING ANYTHING, which is the discipline pass 16 installed after five consecutive passes wrote their claim first. At HEAD 6467c826f: `git grep -c envelope_wire_conformance_at HEAD -- tools/pre_commit_test_gate.py` was EMPTY and `git show HEAD:docs/design/simplifications/EP6_wall_protocol_typing.yaml | grep -c 'pass 23'` returned 0, while the worktree carried the arming, its 8 new proofs, the flipped `test_channel_C_IS_wired_into_the_commit_gate...`, the pass 23 record and its archive roll. So the whole of pass 23 -- code, control, proofs and record together -- was in the tree and in none of the repo's commits. Pass 16's record names passes 11-15 as five consecutive instances of exactly this; passes 17-22 each cite a distinct HEAD that moved (63bf50039, 53687720f, baf496f97, 9d997ae8d, 6467c826f), so pass 23 is the first recurrence since the class was settled.\n\n  WHAT ACTUALLY REFUSED IT, and pass 23 could not have seen it because it never ran the gate against the resulting tree. Rebuilt pass 23's landing set exactly and ran the repo's own hook inside a clean extract of the tree that commit would create (tree 9dabc985a): ONE red out of 533, `tests/design/test_simplifications_store.py::test_counts_match_file_contents`, verbatim -- `EP6_wall_protocol_typing: map simplifications_count=21 != store file count=22`. The store roll is a TWO-FILE atomic write (the live file loses the pass 16 note, `archive/EP6_wall_protocol_typing.014.yaml` gains it) and the map's `simplifications_count` is a THIRD file recording the same fact. Pass 23 wrote all three into the worktree and named only two of them plus its code in what it tried to land, so the invariant was GREEN ON THE TREE and RED ON THE COMMIT -- the tree had the map bump, the commit did not. Landing the same five paths with `docs/design/maturity_map.yaml` added went green first time.\n\n  THE ARMED STEP WAS GREEN THROUGHOUT, and this is the part that has to be stated precisely or the record misreads its own history. The gate run that REFUSED pass 23's set printed, verbatim: `[test-gate] OK the wall's four walker-invisible channels have not grown; channel D's 3 wire site(s) carry the version; channel C's 3 of 3 scored seam(s) cross on a wire`. Pass 23's substantive claim -- the gate is armed, mutation-proven, and green on the tree it was armed in -- was TRUE of the very tree it was refused on. What was false was the unstated claim underneath it, that any of this had reached a commit. A LANDING DEFECT AND A CONTROL DEFECT LOOK IDENTICAL FROM THE RECORD and are told apart only by asking the tree, which is why the first act of this pass was a git-grep at HEAD and not a reading of the note.\n\n  THE LANDABLE SET IS THE LESSON, AND IT IS THIS ATOM'S OWN ALREADY-FILED FINDING. `file_scope` names four files (`company/interfaces/wall_protocol.py`, `tests/company/interfaces/test_wall_protocol.py`, `tools/wall_channel_census.py`, `tests/tools/test_wall_channel_census.py`). The landing was five files and exactly ONE of them, `tests/tools/test_wall_channel_census.py`, is in file_scope: the gate module, both store files and the map are all outside it. So an atom that stays strictly inside its declared scope cannot land its own record, and a pass that treats file_scope as the landing set is refused by an invariant whose subject is the whole tree. WORKER_FINDING_AN_ATOMS_LANDABLE_SET_IS_FIVE_FILES_WIDER_THAN_ITS_FILE_SCOPE_2026-08-19 is filed and unactioned in `docs/staging/`, and this pass is a SECOND observed instance of it rather than a new finding (SELF_INTERRUPT_DISCIPLINE: queued against the existing finding, not re-filed and not fixed on sight).\n\n  VERIFIED BY THE TREE AND NEVER BY THE LANDING COMMAND, which is the only evidence this atom's history accepts. At HEAD 1a565872c: `git grep -c envelope_wire_conformance_at HEAD -- tools/pre_commit_test_gate.py` returns 3; `git grep -c test_channel_C_IS_wired_into_the_commit_gate HEAD -- tests/tools/test_wall_channel_census.py` returns 1; the pass 23 note is present in the committed store file; the committed map reads `simplifications_count: 22`. The commit carries exactly those five paths and the worktree holds no residue in any of them afterwards, so no sibling lane was swept in and no hunk was dropped -- checked while two full suites were in flight (pids 1682834, 1726572), which is why the landing was a plain `surgical_land` that never swaps the shared worktree.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, unchanged from pass 23 because this pass bought a commit and not a reading.\n    * NO HARDEN PASS AND NO EXPERT HOUR on pass 22's two hand-written codecs. This is still the first blocker on L3 and it is now one pass older.\n    * FOUR OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION. A, B, E and F are enumerated only.\n    * `3 OF 3` IS NOT \"NO OBJECT CROSSES THIS SEAM\" -- the gate's unit is the (SEAM, LEG), so a fourth crossing of an already-wired leg handed over as a Python object is invisible to it. The gate makes the current reading unreversible; it does not make it finer.\n\n  L3 IS NOT CLAIMED. Pass 23 discharged the second of pass 22's four blockers; this pass discharged none of them and made the first one true of a commit rather than of a tree.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): unchanged from pass 23, THE HARDEN PASS / EXPERT HOUR on pass 22's flex and conversation codecs, as a cold-eyes walk against the CODECS rather than the reports. The question to put to it is still the one pass 22 raises and does not answer: both codecs refuse `FORBIDDEN_TRUTH_FIELDS` by name, so what happens when the world adds an observable that is not on that list but is nonetheless ground truth the company should not have -- is the list a wall or a denylist? That is the R10 question and it is the one a stranger asks first. It was not taken this pass because taking it would have meant reading codecs that were in no commit."
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
