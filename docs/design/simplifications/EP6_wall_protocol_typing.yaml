  MEASURED AT: HEAD 31791a01d. Live artefact docs/reports/run_output_latest.json (mtime 2026-08-17

  18:58, 4,154,361 bytes) parsed in full; tools.epistemic_wall.live_crossings()/

  live_indirect_crossings() and python3 -m tools.wall_crossing_dispositions run directly.


  TWO NUMBERS FROM THE 2026-08-15 CENSUS MOVED, NEITHER CHANGES ITS CONCLUSIONS. (1) Channel A

  (direct import edge) is 5 live, not 6: KNIFE3 pass 3 step 32 (same day as this draw) cut

  simulation.run_phase4c_on_phase2b -> company.billing.dd_review_runner via a new door,

  company/interfaces/dd_review.py. Re-verified: live_crossings() returns 5 rows,

  wall_crossing_dispositions reports "7 live crossings (5 direct, 2 indirect); 91 ruled (cut 84,

  owed 7, grandfathered 0)" -- matching KNIFE3''''s own step-32 record exactly. Ordinary census decay

  against a tree under active unrelated construction, not a defect in either register. (2) Channel

  F''''s denominator moved 92 -> 93 top-level published keys; not chased further (identifying the new

  key is a rerun of the conformance census''''s own §6/§7, out of this pass''''s scope). Everything

  else spot-checked (channel D''''s three log types still carry zero schema_version/correlation_id on

  today''''s artefact; _cache_meta still absent) and held.


  FINDING (framing, not a new defect) -- THE ATOM HAS TWO DISJOINT TYPED PATTERNS ON DISK AND ONLY

  ONE HAS THE PROPERTY IT IS NAMED FOR. Re-confirms and sharpens the 2026-08-13 finding: the envelope

  (interface/contracts/wall_envelope.py, built under W4_4, 3 crossings) has real request/response

  separation in time by construction; the 5 W4_1 ports (tools/*_port.py) are typed VALUES returned in

  the same call frame, with schema_version fields that are structurally present but, per the artefact

  check above, never populated on the wire.


  THE INDISTINGUISHABILITY TEST, stated as one falsifiable criterion and applied per channel:

  swapping a crossing''''s SIM-side adapter for a different implementation that answers the same

  contract -- including one that sometimes returns TIMEOUT/NOT_KNOWABLE_YET/a duplicate response for

  the same correlation_id -- must require ZERO company-side code changes and no company-side branch

  that could only succeed against one specific adapter. Channel C (envelope) PASSES on the

  import-direction half (already proven by test_epistemic_wall_ratchet.py) but has never been forced

  through its own non-OK statuses by a test -- an unproven control on this specific property, R15-

  speaking. Channel D (same-step ports) FAILS BY CONSTRUCTION: a Protocol method returning

  list[MeterReadMessage] has no representable "not yet available" path, so a real D0010/bureau feed

  that answers late cannot be swapped in without a visible shape change. Channel A/B (direct import)

  fails trivially -- no adapter exists to swap; this is KNIFE3''''s subject, not EP6''''s. Channel E

  (structural Protocol) passes for a frozen shape and fails under evolution -- no version field

  exists anywhere in the pattern. Channel F (published report) should not be held to this test at

  all: it exists specifically so the harness can see both the company''''s belief and the SIM''''s truth

  in one row (e.g. customer_events'''' company_churn_estimate beside realized_churn_probability, per

  the 2026-08-15 second pass), which is the opposite goal from indistinguishability.


  SIMPLICITY GUARD READING, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): do not rebuild the

  envelope (channel C already has the property, built under a different atom -- EP6''''s honest first

  move is conformance, not design, matching both prior passes'''' conclusion); do not envelope channel

  F (92-93 report keys wrapped in WallResponse is the protocol cathedral the origin_note forbids by

  name -- the defensible target there is provenance, not messages); do not envelope channel E yet

  (cheapest working pattern, no shape divergence has occurred to justify it -- building for a failure

  mode that has not happened is adapters-for-future-adapters); do not scope channel A/B into EP6 while

  KNIFE3 is live (7 edges still owed at this HEAD under a different design vocabulary aimed at

  REMOVING the crossing, not typing it -- typing an edge KNIFE3 is about to cut is waste in the other

  direction). Channel D is the one place the guard does NOT counsel restraint: EP7/EP8/EP9/W5_1''''s own

  real-world analogues (DCC Service Request/Response, Bacs ARUDD returns days later) name genuine

  asynchrony as the fidelity claim, so building the protocol there is the one thing nine dependent

  atoms actually need, not cathedral-building.


  SIX OPEN QUESTIONS NAMED, each with what resolves it (full text in the document): (1) whether

  channel D''''s async gap is load-bearing for all nine EP7-EP15 atoms or only some, resolved by reading

  each atom''''s own real-world-analogue claim, not done here; (2) EP6''''s deliverable shape (census vs.

  migration vs. both), resolved by a director/curriculum ruling when Epoch 3 opens -- this pass''''s own

  recommendation is the channel-D migration as higher-leverage, with the census as its accompanying

  control; (3) standing exclusion of KNIFE3-owed edges from EP6 scope, resolved by re-reading

  wall_crossing_dispositions''''s live count at BUILD time, not a one-time check, since the count moved

  during this very draw; (4) whether the 2026-08-15 "two wires wearing one name" split for channel F

  is ratified anywhere -- checked this pass, zero hits for "counterparty wire"/"harness wire" outside

  that one document, so it is STILL an unratified DISCOVER hypothesis, not a settled design; (5)

  whether channel D''''s to_log_entry(include_schema_version=False) fail-open default must flip before

  the first v2.0 schema bump, resolved at that bump, not pre-emptively per the simplicity guard; (6)

  identity of the new 93rd published key and whether it changes channel F''''s 7-ground-truth-field

  count, not resolved here.


  Deliverable: docs/design/EP6_WALL_PROTOCOL_TYPING_DISCOVER.md. No new WORKER_FINDING filed

  (SELF_INTERRUPT_DISCIPLINE): the two drift observations are re-measurements of already-tracked

  numbers, the rest is framing/synthesis against existing findings, not a new defect against a

  control.'
- "2026-08-18 DISCOVER ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3 idle draw).\nNo BUILD code, no protocol designed, no adapter started -- epoch-3 BUILD-gated on director-reserved\ncurriculum sequencing (R13); EPOCH_GATING_AND_ATOM_AUTHORSHIP Rule 1 permits DISCOVER/FRAME while\nBUILD is not. `docs/design/maturity_map.yaml` is touched for EXACTLY ONE bookkeeping line:\n`simplifications_count: 4 -> 5` on this atom -- not a level move, not a stage move, not a\nblock-reason edit. That count and this append are ONE ATOMIC WRITE (appending without the bump reds\ntests/design/test_simplifications_store.py::test_counts_match_file_contents). Checked before\nediting: the map carried no staged and no unstaged hunk from any other lane, so this commit strands\nno half of anyone else's atomic write. Deliverable:\ndocs/design/EP6_DEPENDENT_ATOM_PROPERTY_AUDIT_DISCOVER.md -- a THIRD document beside the 2026-08-15\nconformance census and the 2026-08-17 protocol-typing pass, not a replacement. Everything is\nobserved-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 65b26e4e4. Live artefact docs/reports/run_output_latest.json (mtime 2026-08-18\n15:56, 4,154,361 bytes, 93 top-level keys) parsed in FULL; shipped modules read as they sit on disk;\nno network, nothing monkeypatched.\n\nTHIS PASS ANSWERED OPEN QUESTION 1 OF THE 2026-08-17 PASS -- and the answer REFUTES that pass's own\nrecommendation. The question: \"whether channel D's async gap is load-bearing for all nine EP7-EP15\natoms or only some, resolved by reading each atom's own real-world-analogue claim, not done here.\"\nThe 2026-08-17 recommendation resting on it, verbatim: channel D is \"the one place the guard does NOT\ncounsel restraint ... building the protocol there is the one thing nine dependent atoms actually\nneed.\"\n\nFINDING 1 -- \"ASYNCHRONY\" WAS THREE PROPERTIES WEARING ONE WORD, AND THE ONE THAT IS UNANIMOUS IS\nNOT THE ONE THAT WAS RECOMMENDED. Separated: P1 time separation (a response that is its own event),\nP2 vintage stamp (as-of / valid-time / schema-version ON the message), P3 unsolicited inbound (a\nmessage with no request). P1 is narrower than it reads -- \"the answer isn't available for 15 minutes\"\nis a synchronous NOT_KNOWABLE_YET plus a re-poll, NOT P1. Judging each of the nine against its OWN\nmap_notes text (the director-ruling curriculum prose, hydrated from each atom's store file):\n\n  P2  9 of 9   EP7 D+1 refresh | EP8 SEC schema releases | EP9 which days are held | EP10 \"schema-\n                drift tolerance is a requirement\" | EP11 report vintages | EP12 REC flow versions |\n                EP13 forecast-vs-actual for one half-hour | EP14 \"columns move between periods\" |\n                EP15 \"a forecast is a POINT-IN-TIME ARTEFACT ... as of when\" -- this atom IS P2\n  P1  4 of 9   EP8, EP10, EP12 (all three INFERRED from domain shape, absent from both the atom text\n                and the advisor research), EP11 (stated: \"~4-5 working days after charge creation\")\n  P3  2 of 9   EP7 \"IRIS real-time push\", EP11 \"webhook events\" (EP12 inferred, not stated)\n\nBOTH HALVES OF THE PRIOR CLAIM FAIL: async is not the binding requirement, and it does not bind all\nnine -- for EP13/EP14/EP15 it is not implicated at all. Nine atoms ask for the vintage stamp in nine\nvocabularies (refresh, coverage, drift, forecast-vs-actual, as-of); nobody had put those words in one\ncolumn, which is why the unanimous requirement stayed invisible across four passes.\n\nFINDING 2 -- THE 9-OF-9 PROPERTY EXISTS IN THE TYPE AND IS ABSENT FROM EVERYTHING PUBLISHED. WallRequest\ncarries schema_version/as_of/emitted_at and WallResponse carries schema_version/observed_at/valid_time\n(interface/contracts/wall_envelope.py:86-127). On today's artefact, schema_version, correlation_id,\nobserved_at, as_of, valid_time and _cache_meta each occur ZERO times across all 93 top-level keys.\n\nCORRECTION TO THE 2026-08-17 PASS'S PORT COUNT (