  below excluded) finds 10 envelope construction sites across 5 modules and 3 crossings, and ALL 10 pass

  schema_version=SCHEMA_VERSION -- the crossing''s OWN module constant, never a call-site literal, never a

  default. Structurally guaranteed, not merely observed: neither envelope shape gives the field a default,

  so an omitting construction raises TypeError at the call site. On the port side, 3 of the 5 tools/*_port.py

  ports carry SCHEMA_VERSION = "1.0" as a dataclass field default, so every instance is stamped by

