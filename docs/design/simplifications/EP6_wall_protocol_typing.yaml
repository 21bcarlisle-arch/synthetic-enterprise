atom_id: EP6_wall_protocol_typing
simplifications:
- '2026-08-21 pass 44 BUILD, level HELD at 2, loop_stage stays build. THE WALL COULD SAY ASK, ANSWER AND TELL, AND HAD NO SHAPE FOR ''NOT YET FINISHED''. Pass 43 handed forward Q3 -- ''show me a conversation with more than two legs'' -- as the only payable question no pass had ever touched, and that reading held up: its reconciliation row was still pass 33''s. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 96b64ea31, worktree, with all 22 declared file_scope files clean against HEAD before the first edit.


  THE DEFECT, STATED SO THE REPAIR CAN BE JUDGED AGAINST IT. `correlation_id` on a `WallResponse` is the IDEMPOTENCY key: its own docstring''s rule is that a resolver which has already answered an id must return the SAME response. So two responses on one id is not a long conversation, it is a broken contract -- and that, not an oversight, is why this seam had exactly two legs and could only ever have two. The three shapes on the wall could between them say ASK (`WallRequest`), ANSWER (`WallResponse`) and TELL (`WallNotification`, pass 43). None could say RECEIVED, IN PROGRESS.


  THE REPAIR IS A TYPE AND A RELATION, and the second half is the part a message type cannot supply. `interface/contracts/wall_envelope.py::WallInterim` carries NO `status` -- the load-bearing absence, because a status is a resolution and an interim with one is indistinguishable from a response, which collapses the third leg straight back into the second. `leg` is refused below 2 at construction, since leg 1 IS the request and an interim that could call itself leg 1 would describe an exchange nobody started. A terminal REFUSAL stays a `WallResponse(status=ERROR)`: only ACCEPTANCE leaves something owed, which is why there is no `accepted` flag anywhere -- a boolean whose False branch belongs to a different primitive is a branch that will one day be taken. Then `company/interfaces/crossing_conversation.py::ConversationRegister`, because a conversation is not a kind of message but a RELATION BETWEEN messages, and the counterparty cannot hold that relation: it does not know what the company still considers open.


  THE WORKED CASE, since Q3 asks to be SHOWN one and a primitive is not a demonstration. The Bacs three-working-day cycle, which `payment_observable_seam`''s own header has described since it was written and which no code here could express: WallRequest[CollectionRequest] -> WallInterim[BacsInputReport] -> WallResponse[ARUDD|Remittance|Settlement]. The ADDACS notification runs ALONGSIDE and is deliberately not annexed as a fourth leg -- it answers no request, and pulling it into a correlation it has no part in is the Q2 fail in mirror image. A conversation gets longer by having more legs, not by annexing the messages next to it. LIVE on the 150-customer/6-month population: 796 conversations, 636 of them THREE legs, 160 single-leg -- the push rails, which asked for nothing and correctly get no request leg.


  THE ONE REFUSAL IS THE R15 CLAUSE. An interim naming a correlation_id this company never opened raises `UnaskedLeg`. The company''s own request register -- written when it SENT the request -- is the only admissible evidence that it asked; a message on the wire can never be that evidence, or any process able to mint a plausible id is in conversation with us. Same reasoning one layer up as pass 42''s account roster (''a message naming an account cannot be the evidence that the account is ours'') and pass 39''s credential fingerprint. MUTATED ON THE LIVE PATH: the same interim, byte for byte, is REFUSED under a forged id and accepted under one the triad really submitted, so the refusal is keyed on the register and not on anything about the message.


  WHAT IT DID NOT BUY, MEASURED RATHER THAN HEDGED, and this is the honest headline. EVERY PUBLISHED FIGURE IS BIT-IDENTICAL to pass 43 -- detection 0.1181818182, detection_latency 2.135447, belief 0.1470588235, belief_population_mix 0.2666666667, ageing 0.2469740634 -- now pinned as a regression test against those five literals rather than re-derived. That is correct rather than disappointing: an acknowledgement resolves nothing, so a version of this that moved a belief would be reading a resolution into the one message defined by not being one.


  WHAT IT DID BUY IS A GAP ANOTHER QUESTION HAD FILED AS UNREACHABLE. Q5''s own row records that INITIAL SILENCE IS INVISIBLE, because ''nothing records that the company asked'' -- pass 41 built a stand-in that could go quiet and could not make the company see it. It can now: driving the live triad with `TransportFault.SILENCE` (pass 41''s own machinery, not a stubbed return) on one DD crossing leaves an OPEN conversation naming what it is still owed, asserted beside a pre-pass-44 consumer that has no record of it at all. Three questions named this register as their upstream -- Q5''s initial silence, Q6''s undetectable burst, Q2''s dormant request leg -- and it is the first of the three that closes.


  THREE THINGS THE INSTRUMENT MADE THIS PASS DO, none of them planned, all of them about my own work. (a) THE CENSUS WENT 3-OF-3 TO 2-OF-3 on the transport question the moment `CollectionRequest` became live: ''ENCODED ONLY: transported on one side [request=IN-PROCESS]''. It was right -- I had made a leg live and left it off the wire. Repaired rather than filed, because a red on a frozen instrument is not a finding you record and walk past: `company/billing/collection_submission.py` encodes through the company''s own codec and `payment_seam_adapter.decode_collection_request` mirrors the published key set and refuses against it, which is the only shape the wall permits (simulation/ may not import company/). Both legs now read `wire`, and the CONVERSATION question moved 1-of-3 to 2-OF-3 conversant with the census unedited -- an independent instrument confirming the change, which is the difference between this and pass 43, where the census structurally could not see the leg. (b) THE SURFACE PIN DRIFTED: a new payload type under an unchanged version number. The seam is now v2, re-pinned in the same edit in the other file, and the observable/hidden judgement the pin exists to force is written at the version constant where an editor will meet it. `SUPPORTED_SCHEMA_VERSIONS` widened to {1,2}, because a release that stopped reading the previous version would refuse every message in flight -- the big-bang cutover Q10 names as the failing answer. (c) FIVE NEW channel-C members, ruled and added BY HAND rather than by --freeze, which on a tree carrying 180 other-lane modifications would have banked their state too (pass 41''s precedent).


  THE CLASS DEFECT THE VERSION BUMP EXPOSED, and it is the sharpest thing here. `encode_wall_response` wrote the module''s own `SCHEMA_VERSION` and DISCARDED `response.schema_version` -- in ALL THREE world-side seam encoders (`payment_seam_adapter`, `conversation_response`, `flex_dispatch`) -- while the company''s codec (`wall_protocol.encode_response`) had always preserved it. It was invisible for exactly as long as one version existed anywhere. An encoder that overwrites the stamp makes the vintage field unable to differ from the reader''s constant, so the decoder''s version check -- the one thing a version number is FOR, and the thing `test_mutant_decoder_with_a_defaulting_read_silently_relabels_an_old_message` was built to refuse on the DECODE side -- could never fire on anything these seams emitted. The same defect, four hundred lines from its own guard. Fixed in all three under R10, since an instance fix would leave it in two siblings, and pinned by a test asserting preservation on a response whose version is deliberately NOT the module''s current one -- the only input that can tell the two implementations apart. Live behaviour is unchanged, because every construction site already stamps the constant; what is removed is the latent relabelling. SECOND THING THE BUMP EXPOSED: two tests had picked the LITERAL 2 as ''a version the company does not speak''. One failed loudly; the other would have gone quietly green on a message it existed to reject. Repaired with a null control that ASSERTS the chosen literal is still outside SUPPORTED_SCHEMA_VERSIONS, so a literal picked to be outside a set cannot silently become a test of nothing the next time the set grows.


  WHY Q3 IS RECORDED FAIL, and the standard is this atom''s own -- Q10, Q13, Q14, Q5, Q6 and Q2 were each left FAIL after partial repairs, and a different standard for the pass that built the repair is the ceremony the walk exists to stop. (a) A SWITCH WITH OBJECTION IS A BRANCH, NOT AN EXTRA LEG. The reviewer''s second named example needs an ALTERNATIVE CONTINUATION -- the objection is a different path, not a later position on one path -- and this register models a linear sequence with no notion of a fork. That is a structural absence, not a missing payload, and it is the reason this question is not closed by a third leg. (b) NEITHER OF HIS NAMED EXAMPLES EXISTS: no DCC request/ack/response/alert and no switch are modelled anywhere in this build, so the Bacs cycle is a THIRD case rather than either of the two he asked for. (c) ONE CROSSING ONLY: the conversation and flex seams are untouched, and flex is still read by the census as UNSOLICITED INBOUND. (d) THE REGISTER IS NOT JOINED TO THE SILENCE LADDER. `open_conversations()` now knows about crossings nothing came back on; `silence_ladder` still ages only crossings something arrived about. The newly-visible silence has a READER and not yet an AGEING one -- that join is the single highest-value follow-on and is named here rather than smuggled in.


  NAMED LIMITS, said here rather than discovered later. ONE ITEM PER SUBMISSION: this triad bills customer by customer, so the file a real bureau receives with thousands of items carries exactly one here, and `items_in_submission`/`items_rejected` are 1 and 0 on every live report; the file-level fields are exercised against real batches at unit level, and what the live run proves is the LEG, not the batch size. THE INTERIM LEG DOES NOT TRAVEL THE FRAMED WIRE -- at parity with the notification leg (pass 43 limit (c)) -- and the company does not authenticate ITSELF to the bureau on the new outbound leg either, though a real Bacs submission carries a service user number and its own credential. Both are Q13''s axis, named at the code rather than left to be found. THE INTERIM PAYLOAD IS DECLARED BUT NOT ENCODABLE: it is under `OBSERVABLE_PAYLOAD_FIELDS` (so a field added to it reds the declaration test) and deliberately outside `_ENCODABLE_PAYLOAD_TYPES`, because nothing encodes an interim yet and a codec that could is a surface nothing uses. A TERMINATING REJECTION IS INDISTINGUISHABLE FROM A TRANSPORT ERROR at the consumer: both arrive as `WallResponse(status=ERROR)`, so the register keeps the exchange OPEN and the ladder owns it, which is the conservative direction -- the company keeps expecting an answer it will not get, and can say so, rather than quietly concluding on a code string.


  R15, 61 NEW TESTS ACROSS FIVE FILES, both directions. MUTATIONS, each run: the unasked-leg refusal with its null control on the live path; a field added to `CollectionRequest` cannot cross undeclared (the fail-open direction a reflected `asdict` encoder would have carried silently); the encoder no longer relabels a foreign vintage; dropping `BacsInputReport` from `OBSERVABLE_PAYLOAD_FIELDS` reds the declaration test, run against the real module and restored from a copy outside the repo so the window was bounded. NULL CONTROLS, six: a two-leg exchange is NOT counted as multi-leg (or `is_multi_leg` would be true of everything and the 636 would prove only that the register exists); a push rail gets no request leg; the unsilenced crossings in the same run all CLOSED; a clean submission reports zero rejected; legs 2 AND 9 are both legal, so the primitive does not cap at three; the unmutated payload encodes cleanly. C-S2: a redelivered leg does NOT inflate `leg_count`, which would make the measure a property of the TRANSPORT rather than the exchange -- and a REDELIVERY is not read as a REORDERING, which is the bug the arrival-order property had when it was first written and which its own test now pins. C-S1: an outcome that overtakes its own acknowledgement is ACCEPTED and FLAGGED, never refused, because a register that refused it would model a reliability the wall''s own contract says does not exist.


  EVIDENCE: tests/company/interfaces/test_crossing_conversation.py 17 passed; tests/company/billing/test_collection_submission.py 33 passed; tests/interface/test_wall_envelope.py 27 passed; tests/simulation/test_payment_seam_adapter.py 79 passed; tests/background/test_live_payment_triad.py 41 passed (the LIVE path, so the company run_phase2b drives now holds three-leg exchanges); tests/company/comms/test_susceptibility_estimator_wire.py 24 passed; `python3 -m tools.epistemic_verifier` PASS; `python3 -m tools.wall_channel_census --worktree` channel C clean on every frozen list with request=wire, response=wire and the pin green at v2; `cold_eyes_battery.battery_outstanding` re-read after the reconciliation edit: Q2, Q3, Q5, Q6, Q9, Q10, Q13, Q14, Q15 -- unchanged, so nothing drifted and no question was cleared as a side effect.


  MAP EDIT: `file_scope` gains the six files this pass''s work lives in that the atom did not declare -- company/interfaces/crossing_conversation.py, tests/company/interfaces/test_crossing_conversation.py, company/billing/collection_submission.py, tests/company/billing/test_collection_submission.py, simulation/conversation_response.py and tests/company/comms/test_susceptibility_estimator_wire.py. The last two are the R10 class fix and its exposed vacuous test, which live outside this atom''s usual neighbourhood precisely because the defect was a class. Same reading passes 35, 36, 42 and 43 used: file_scope declares which files an atom owns, changes no difficulty, sets no target and tunes no output.


  WHAT REMAINS FOR L3 is the blind reviewer''s closed set and not this pass''s opinion: 12 disqualifying, 3 PASS, 9 outstanding, 2 epoch-gated. NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): join the conversation register to the silence ladder. It is the smallest remaining edit with a measured consequence -- the silence this pass made VISIBLE is not yet AGED, so a collection unanswered for a minute and one unanswered for a year still read alike, which is the exact sentence pass 41 wrote about `UnresolvedCrossing` before it built the ladder. Q3''s own remaining half (a BRANCHING conversation, for the switch-with-objection case) is the larger item and should follow it. The target decision recommended at passes 38-43 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director''s (R13).'
- '2026-08-21 pass 45 LAND, level HELD at 2, loop_stage stays build. PASS 44 WROTE EVERY BYTE OF ITS WORK AND COMMITTED NONE OF IT, WHICH IS THE SECOND PASS RUNNING. The tick drew EP6 and found the atom''s own record already describing WallInterim, the ConversationRegister and a three-leg live run, none of which was in any tree -- the exact sentence commit 131b86df7 had just written about pass 43. This pass is the landing, and the landing was not a formality: the gate refused three times and each refusal was a real defect in work whose record already read as finished. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 631fdfcda.


  REFUSAL 1, THE WALL-CROSSING REGISTER. `simulation.run_phase2b -> company.billing.collection_submission` was a LIVE CROSSING WITH NO DISPOSITION -- pass 44 MADE a wall crossing and did not rule it. The first repair was to rule it `owed` to B14 (the same design as its two siblings, and B14''s cut genuinely kills it: `background/live_payment_triad.py`:96 is the edge''s only carrier, unlike the pair above it which take two bridges). That repair was CORRECT AND WRONG, and refusal 2 is why.


  REFUSAL 2, THE INDIRECT RATCHET, AND THE REASON THE FIRST REPAIR WAS THE LAZY ONE. `tests/architecture/test_epistemic_wall_indirect_ratchet.py` reds on a NEW indirect crossing and says in its own allowlist comment what to do about it: ''a NEW indirect crossing must be cut rather than added here ... Cut it, or route it through `company.interfaces`.'' A register row would have made the edge EXAMINED while leaving it EXISTING, and the ratchet is the control that refuses precisely that trade. THE CUT TAKEN: `collection_submission` moved from `company/billing/` to `company/interfaces/`. It holds no billing rule -- it imports `company.interfaces.wall_protocol` and two published contracts and nothing else -- so it is a CODEC, and the seam package is where it always belonged. The edge is now exempt because it is genuinely a sanctioned seam crossing, not because the instrument stopped looking, and the difference is the whole point: re-exporting a billing module through `company/interfaces/` would have been the laundering shape KNIFE pass 1 refused. The register row and the B14 edit were REVERTED rather than left in -- a row for an edge in no tree is the corpse-grandfathering the disposition tool rejects at rc 2. Ratchets green with the list UNWIDENED: 2 legacy indirect crossings, unchanged since 2026-08-10.


  REFUSAL 3, AND IT IS PASS 44''S OWN R10 CLASS FIX CATCHING ITSELF ONE FILE SHORT. Pass 44 fixed three world-side encoders that wrote their own `SCHEMA_VERSION` and discarded the message''s, and pinned the repair in ONE of the three. `tests/sim/test_flex_dispatch.py::test_the_version_on_the_wire_comes_from_the_CONTRACT_not_a_literal` then went RED -- correctly. Its mutation patched the MODULE constant, which a preserving encoder no longer reads; both the old and the new test are honestly ''not a literal'', and only one of them can fail on a real message. Rewritten to move the MESSAGE''s vintage, which is the only input the two implementations disagree about, with a null control asserting 7 is still a version the seam does not speak. THE THIRD SIBLING WAS THE QUIET ONE: `tests/simulation/test_conversation_response.py::test_the_version_is_on_the_wire_and_comes_from_the_contract` STAYED GREEN through the whole class, because its fixture stamps the module constant -- the one input on which a relabelling and a preserving encoder agree. Given its differentiating twin here (`test_the_encoder_PRESERVES_a_foreign_vintage_instead_of_relabelling_it`) under R10, since a class fix pinned in one instance is an instance fix wearing a class''s clothes.


  WHAT DID NOT CHANGE, said plainly. No published figure moved and none was recomputed: this pass added no capability. The five literals pass 44 pinned (detection 0.1181818182, detection_latency 2.135447, belief 0.1470588235, belief_population_mix 0.2666666667, ageing 0.2469740634) are carried unaltered, and the cold-eyes reconciliation row for Q3 is pass 44''s own text, landed as written -- Q3 stays FAIL. The one substantive judgement here is the module move, and it changes no behaviour: the same functions, the same codec, a different package.


  EVIDENCE: `tests/architecture/test_epistemic_wall_indirect_ratchet.py` + `test_live_payment_triad_is_the_only_bridge.py` + `test_epistemic_wall_ratchet.py` + `tests/company/interfaces/test_collection_submission.py` 71 passed; `tests/sim/test_flex_dispatch.py` + `tests/simulation/test_conversation_response.py` 52 passed; the new preservation pin RED-checked against the pre-repair shape (a module-constant encoder emits 1 where the assertion demands 7); `python3 -m tools.epistemic_verifier` PASS; `python3 -m tools.wall_channel_census --worktree` every frozen channel matches its list exactly with the two renamed channel-C members reconciling; `python3 -m tools.wall_crossing_dispositions` OK. MAP EDIT: `file_scope`''s two `company/billing/` collection paths become `company/interfaces/` ones -- the same two files, moved.


  WHAT REMAINS is pass 44''s list, unchanged and not re-opinionated here: join the conversation register to the silence ladder (the newly-visible silence has a reader and no ageing one), then the BRANCHING conversation Q3''s second named example needs. THE LESSON THIS PASS IS FOR, and it is about the harness rather than the wall: a pass that writes its record before it lands has recorded a tree that does not exist, and the three defects above were all INSIDE the gap between the record and the commit. Two passes running have now ended that way.'
- '2026-08-21 pass 47 LAND, level HELD at 2, loop_stage stays build. PASS 46 BUILT THE JOIN AND COMMITTED NONE OF IT, WHICH IS THE THIRD PASS RUNNING. The tick drew EP6 and found seven of its file_scope files dirty against HEAD -- the silence ladder reading two books, two obligation tables, three as-of readings on the conversation, and a Q5 reconciliation row already rewritten to pass_no 46 -- and no commit anywhere carrying any of it. Commit 131b86df7 wrote that sentence about pass 43 and 21c286c15 wrote it about 44 and 45. This pass is the landing, and as with pass 45 the landing was not a formality: two of the four R15 claims in the record I was about to land are FALSE, measured, and are corrected in the same tree. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 4e8253db9.


  WHAT PASS 46 BUILT, verified at the tree rather than read off its own row. PaymentObservationConsumer.silence_ladder now ages TWO books instead of one -- the unresolved register (the counterparty answered non-OK) and the conversation register (the company asked, pass 44) -- deduplicated by correlation_id with the status entry winning, and with whichever side spoke last starting the clock. That closes reason (a) of the pass-41 row, INITIAL SILENCE IS INVISIBLE, which three passes had named as their upstream. Joining the books surfaced a defect in the ladder itself: SILENCE_OBLIGATION''s OVERDUE arm says ''re-ask'', written when every subject was a crossing the counterparty demonstrably held, and applied unchanged to a submission nothing came back on that sentence licenses a re-submission in the one case where the company cannot rule out the first one having landed -- a Bacs collection sent twice debits the payer twice. Hence SilenceOrigin selecting UNRECEIPTED_OBLIGATION, which names a QUERY at every horizon and a re-send at none.


  THE TWO FALSE CLAIMS, AND THE REASON THEY ARE THE POINT OF THIS PASS. All four R15 mutations in the unlanded Q5 row were re-run here, each against a tree materialised from HEAD by git archive OUTSIDE the repo, with only the named part swapped -- never on the shared worktree, which carried 200+ other-lane modifications throughout. TWO HOLD EXACTLY: dropping the acknowledged-guard on the clock-forward branch reds exactly test_a_response_timestamped_BEFORE_the_request_does_not_forge_an_acknowledgement (1 failed, 74 passed), and removing the ANSWER-with-no-status refusal in conclude_silence reds exactly its own parametrised case (1 failed, 31 passed). TWO DO NOT. (1) The row claimed the join mutation reds ''10 of 10'' tests in TestSilenceLadderOverOpenConversations against a null control of ''64 pre-existing tests still passing''. Measured: 21 failed, 54 passed. The class holds ELEVEN tests, and the other ten failures are in the PRE-EXISTING TestSilenceLadder, because pass 46 changed conclude_silence''s signature (last_heard_at -> silent_since, plus origin) and rewrote those tests onto it. They are co-modified by the pass they were offered as the null control for, and a control that moves with its subject is not a control. The honest null control is 54. (2) The row claimed collapsing the two obligation tables reds one named test ''and nothing else (31 pass, so it is not always-red)''. Measured: a module-level assertion in the test file -- ''the two ladders must differ at every horizon'' -- errors the whole file at COLLECTION, so ZERO tests execute. The control fires harder than advertised and the advertisement was still wrong; the (31 pass) figure was the OTHER mutation''s null control, attached to the wrong claim. Both sentences are rewritten in the row rather than dropped, because a row that quietly loses a number it got wrong teaches nothing.


  WHY THIS IS A CLASS AND NOT A SLIP, stated because the atom has now produced it three times. A pass that writes its record before it lands is describing a tree that does not exist, and every number in that description is unfalsifiable until someone materialises the tree. Pass 45 recorded that three real defects lived in the gap between pass 44''s record and its commit. This pass records that two false measurements lived in the same gap for pass 46 -- not defects in the CODE, which is sound, but defects in the EVIDENCE, which is worse, because the code has a suite and the evidence has only whoever reads it next. The mitigation is not exhortation: it is that a landing tick re-runs the record''s own mutations before committing it, which is what happened here and is how both were found.


  WHAT DID NOT CHANGE. No published figure moved and none was recomputed; this pass adds no capability of its own. Q5 stays FAIL for reason (b) of the pass-41 row, verbatim and unchanged: THE HANDLING IS SPECIFIED, NOT ENACTED -- each horizon names an obligation as a sentence, and nothing re-asks, queries, labels a figure stale or provisions, because acting organs are RESERVED to the director''s dunning/debt/provisioning session (ruling 2026-07-25 s2). The level is still 2, same reason as passes 38-46: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.


  EVIDENCE: tests/company/interfaces/test_crossing_silence.py 32 passed (23 at pass 41); tests/company/interfaces/test_crossing_conversation.py 22 passed (17 at pass 44); tests/company/billing/test_payment_observation_consumer.py 75 passed (64 at HEAD); tests/background/test_live_payment_triad.py 42 passed, the LIVE path, including test_the_silence_ladder_runs_on_the_LIVE_company_and_says_it_is_owed_NOTHING; the four mutations above, each re-run at this tick with the figures given; python3 -m tools.epistemic_verifier PASS; python3 -m tools.wall_channel_census --worktree every frozen channel matches its list exactly, with no new channel member (crossing_silence imports no register and crossing_conversation imports no ladder -- the join lives only in the consumer that holds both books); cold_eyes_battery.battery_outstanding re-read after the row edit: Q2, Q3, Q5, Q6, Q9, Q10, Q13, Q14, Q15 -- unchanged, so nothing drifted and no question was cleared as a side effect. conclude_silence has exactly one production caller (the consumer), so the signature change is contained -- grepped, not assumed.


  WHAT REMAINS is pass 44''s list with its first item struck: the conversation register is now joined to the silence ladder, so the BRANCHING conversation Q3''s second named example needs (a switch with objection is an alternative continuation, not a later position on one path) is the next item on this atom. The target decision recommended at passes 38-46 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director''s (R13).'
- '2026-08-21 pass 48 BUILD, level HELD at 2, loop_stage stays build. THE PASS CEILING''S OWN READING OF THIS ATOM IS WHAT THE TICK ACTED ON, and it is worth restating because it is the reason a forty-something pass on a level-2 atom is not simply the treadmill: `python3 -m tools.discovery_pass_ceiling` reports EP6 as SATURATED (38 passes since its last level move) and then says, uniquely among the 24 saturated atoms, that "THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS -- both are true at once": 2 of its 12 disqualifying exit criteria (Q9, Q15) need an act in a RESERVED class, so the level cannot move in this epoch however much is built, and 7 are ordinary build work that must keep being drawn. It also says explicitly: do NOT record `infeasible_here`, because that verdict would retire the payable half. So this pass took the payable half.


  WHICH CRITERION, AND WHY THAT ONE. Q10 and Q13 were the two least-recently-touched payable rows, both last repaired at pass 39. Q10 was chosen because its remaining item was named precisely by its own row and sat ENTIRELY inside this atom''s file_scope, where Q13''s remaining half names `company/comms/susceptibility_estimator.py`, which file_scope does not carry. A staged finding from 2026-08-21 recommended Q3 as "the only one no pass has ever touched"; that recommendation is STALE and was not followed -- the live reconciliation shows Q3 was taken by pass 44 and reads "PARTLY REPAIRED, pass 44". Recorded because the finding is still in the staging root and the next tick will read the same stale sentence.


  WHAT LANDED. Q10 asked "Can two versions of the same interface run concurrently, per counterparty?" and named its own failure mode: "a single global version constant means every market release is a big-bang cutover". Pass 39 built the per-COUNTERPARTY half (COUNTERPARTY_REGISTRY / speaks_schema_versions) and left the other half undone in words: the wire FIELD SETS were version-blind, one flat key set per message kind applied to every version alike, so this build understood exactly ONE dialect and the table could only express WHICH participants were on it. This pass keys the field sets by version. `company/interfaces/wall_protocol.py::WIRE_VOCABULARY_BY_VERSION` maps version -> message kind -> exact key set and is the sole authority; SUPPORTED_SCHEMA_VERSIONS is now DERIVED from its keys rather than stated beside it, so the single global constant the reviewer named no longer exists as an independent statement that could drift.


  THE PART THAT MAKES IT NOT THEATRE, and it is the question this repair invites. A version table whose versions are identical buys nothing. These two genuinely differ, and the difference was already sitting in the tree unused: `WallNotification` (pass 43) and `WallInterim` (pass 44) both existed as in-process Python objects WITH LIVE CONSUMERS and NEITHER COULD BE SERIALISED -- exactly the diagnosis this module''s own docstring makes of `schema_version` before the module existed, "not a switch that is off, a wire that was never built". A primitive with no wire cannot arrive from a real counterparty, so until now the multi-leg conversation and the unsolicited stream were company-side constructions no wire could deliver. They now have codecs, and they are v2-ONLY: v1 is the original two-leg wall, v2 is the release that added them, and an interim stamped v1 is refused MESSAGE_TYPE_NOT_IN_VERSION because that release has no way to say it.


  THE RELEASE WEEKEND IS NOW REHEARSABLE, which was Q10''s literal ask: one build, one registry, the cut-over participant reporting an exchange still in progress while the participant still on v1 goes on transacting request/response in the same moment, neither upgraded by force. Two independent refusals stack and are asserted by REASON CODE rather than by a bare `raises`, because they call for different repairs -- MESSAGE_TYPE_NOT_IN_VERSION is about the dialect, VERSION_NOT_SPOKEN about the participant.


  AN ORDERING CHANGE CAME WITH IT, and it is the load-bearing bit rather than a detail: the version is decoded FIRST and the key set it selects enforced SECOND, the reverse of what this module did. Which fields are legal is a fact ABOUT a release, so a decoder that judges fields before it knows the dialect is checking a message against a schema its sender never claimed. The visible consequence is a deliberate precedence change: an unknown version carrying an unknown field now reports UNSUPPORTED_VERSION, not UNKNOWN_FIELD, because the field may be perfectly legal in the release it came from. Both directions read the one table, so an encoder cannot emit bytes this build''s own decoder would refuse.


