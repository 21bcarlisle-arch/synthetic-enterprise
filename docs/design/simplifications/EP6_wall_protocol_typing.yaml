ere is no `implements` clause to go stale, no envelope to fail decoding, no version to mismatch. The company simply starts reading an attribute that is no longer there. Channels C and D cannot fail this way, which is why E needed its own question and not a copy of theirs.\n\n  THE MEASURED ANSWER: 2 OF 2, AND THE SUPERSET TURNED OUT TO BE EXACT. `company/billing/monthly_bill_assembly.py -> ReadArrival` is satisfied by `simulation/meter_reads.py::MeterReadEvent`; `-> ReadArrivalFeed` by `simulation/meter_reads.py::SimulatedReadFeed`. Both are real structural wall crossings; neither Protocol is company-internal; and ZERO company-side classes satisfy either, which is the reading that makes the world-side attribution mean something rather than being one satisfier among many.\n\n  NOT A PROSE SCAN, ON PURPOSE -- pass 29's discipline, applied to a second seam. BOTH Protocols NAME their world-side implementor in a docstring (\"the world's own `MeterReadEvent` satisfies it as-is\"; \"In the simulation that is `simulation.meter_reads.SimulatedReadFeed`\"). Reading those sentences would have scored the DOCUMENTATION as evidence the coupling holds -- and the docstring is exactly what stays true while the code drifts, which is the whole defect. Membership is computed from the class bodies on both sides by AST instead. WORKER_FINDING_A_COUPLING_STATED_IN_A_COMMENT_IS_FALSE_A_QUARTER_OF_THE_TIME_2026-08-13 is the filed class; both citations here happen to be TRUE, checked rather than assumed -- `company.interfaces.bill_assembly` re-exports both names, so the second one's path resolves.\n\n  THE UNIT IS THE (PROTOCOL, WORLD SATISFIER) PAIR, frozen in the baseline under `E_structural_satisfaction`, so the reading reds in BOTH directions: a world class that STOPS satisfying (the silent drift above) and one that STARTS satisfying (a crossing nobody has looked at). A Protocol that leaves the tree entirely is a PAYDOWN and passes -- the same split the width ratchet makes, applied to the finer unit, because a control that reds on its own success case gets relaxed and takes the real reds with it.\n\n  R15 PROVEN BOTH WAYS. FIVE MUTATIONS RUN, NOT ASSERTED, each against a probe tree built as `git archive HEAD` + this pass's files -- TWO full suites were in flight throughout (pids 2421650, 2424823), and mutating a shared module under a live suite is how this project has broken sibling lanes before. (1) THE WORLD RENAMES A FIELD (`MeterReadEvent.status` -> `read_status`): reds as DRIFTED, naming the Protocol and the satisfier that stopped satisfying. (2) A NEW WORLD CLASS SATISFIES: reds as an unexamined NEW crossing. (3) FAIL-OPEN -- the SIM trees yield no classes: REFUSES with \"empty satisfier population\", because every Protocol would otherwise read as company-internal and print the reassuring answer from a measurement that looked at nothing. (4) VACUITY -- a Protocol emptied of members: REFUSES, since a requirement of no members is a subset of every class in the tree and emptying it is the cheapest way to make this check say anything you like. (5) NULL CONTROL ON THE SUBJECT SET -- a COMPANY-side class given the exact members: stays GREEN, because `SATISFIER_DIRS` is `SIM_PACKAGES` and not `WALL_DIRS`; without that pin the control is satisfiable by a test double and would report crossings that do not exist. ATTRIBUTION IS PER-MUTATION: 1 fires `drifted` only, 2 fires `appeared` only, 3 and 4 raise, 5 fires nothing. NULL CONTROL: the same probe tree unmutated, same command, green.\n\n  IT GATES FROM ITS FIRST COMMIT, which is the rule this file has now stated three times: a check becomes a gate \"in the same commit that makes it satisfiable\". It has no landing-order excuse to wait for -- both crossings are green at HEAD and the freeze records that reading -- so the only commits it can refuse are commits that break a structural crossing or add one. Wired into `tools/pre_commit_test_gate.py::_wall_channel_census_check` (the CLI is typed by nobody; channel C spent passes 19-22 green in the tool and unarmed in the gate) with its own fail-closed branch, and asserted against the file rather than described.\n\n  THE FIXTURE LESSON, THIRD TIME OF ASKING, so it is mechanised rather than re-learned. Arming a fourth half of `_wall_channel_census_check` broke EIGHT existing gate tests: each forces the OTHER halves green so a refusal is attributable to the half under test, and the new half ran real against the fixture's fake index tree `\"0\"*40`, raised, and hit its own fail-closed branch -- so channel C's and D's NULL CONTROLS failed while looking like defects in channel C and D. The three hand-written pin-lists are now one `_pin_the_other_halves` helper, so a FIFTH half pins itself everywhere at once. Observed, not predicted: the eight reds were run before the fix.\n\n  TEST COUNT, AST-COUNTED OFF THE TREE AND NOT FROM THE PLAN: `tests/tools/test_wall_channel_census.py` holds 153 test functions against 136 at HEAD -- 17 new. `python3 -m tools.epistemic_verifier --all` PASS over 541 company/ + saas/ files; `tests/tools/test_pre_commit_test_gate.py` 38 passed; full census CLI exit 0.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * THE COLD-EYES WALK IS STILL UNRUN and is now FIVE passes older. Still the first blocker on L3. See the second paragraph for the cause; it is not that the work was judged unnecessary.\n    * SATISFACTION IS NAME-LEVEL, NOT TYPE-LEVEL. Members are compared by NAME; a world class that keeps `status` and changes it from `str` to `int` still reads as a satisfier. The census docstring's \"deciding satisfaction needs a type checker\" remains true of the strict question -- this answers the name half of it, which is the half that catches renames and deletions.\n    * INHERITED MEMBERS ARE NOT RESOLVED. `_class_members` reads one class body, so a world class inheriting a required member from a base reads as a NON-satisfier. That is the safe direction (it would red as drift and be looked at, never pass silently), and neither live satisfier inherits.\n    * TWO OF SIX CHANNELS STILL HAVE NO CONFORMANCE QUESTION -- A and B are enumerated only, down from four. Their enforcement has an owner (`WALL_CROSSING_DISPOSITION_REGISTER.md`), which is why they were the ones left; F is now the only unowned gap.\n    * THE BASELINE IS READ FROM DISK, NOT FROM THE COMMIT'S TREE, matching `load_baseline` beside it exactly. Diverging unilaterally would make the two halves of one gate step read different trees, which is its own filed defect class -- recorded as a property of the whole step rather than fixed for one half.\n\n  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the fixture breakage is this atom's own subject, found by arming its own control and closed in the same pass.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): THE COLD-EYES WALK, unchanged and now the only thing standing between this atom and an L3 claim, with channel F's conformance question as the build move behind it. The walk must be run by an invocation permitted to delegate; if five more passes cannot do it, the honest move is to record that this atom cannot reach L3 under the current invocation constraints rather than to keep deferring it one pass at a time."
- "2026-08-20 pass 31 BUILD, level HELD at 2, loop_stage stays build. CHANNEL F -- THE WIDEST CHANNEL AND THE LAST UNOWNED ONE -- GETS ITS CONFORMANCE QUESTION, AND THE BLINDNESS IT CLOSES WAS MEASURED BEFORE A LINE WAS WRITTEN: 93 TOP-LEVEL KEYS HIDE 693 NESTED FIELD NAMES, AND EVERY GROUND-TRUTH-SHAPED FIELD THAT REACHES THE BUSINESS SIDE SITS WHERE THE WIDTH CANNOT SEE IT. This is the build move pass 30 recorded as second, taken because the first is structurally unavailable to this invocation (see the last paragraph, which is the honest part of this record). Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD c07b9dc7d, with this atom's four file_scope files CLEAN against HEAD before the pass -- checked first, because a landing defect and a control defect read identically from a record (pass 24's lesson).\n\n  THE MEASUREMENT CAME FIRST AND IT IS THE FINDING. `enumerate_f`'s unit is the (TOP-LEVEL key, business reader) pair -- a WIDTH, and channel F's only control since it was built. Enumerating the artefact's NESTED field names against that unit gives 693 distinct names under 93 top-level keys, and the ground-truth-shaped ones are all at depth >= 1: `true_consumption_kwh`, `true_commodity_amount_gbp` and `true_total_amount_gbp` read by `company/billing/monthly_bill_assembly.py`, `true_total_equity_gbp` by `company/finance/double_entry.py`, `actual_net_gbp` by three modules. ADDING ONE MOVES NOTHING IN THE CENSUS: same top-level keys, same readers, same count of 131. That is channel C's pass-26 disease in worse form -- there a surface could widen under an unchanged VERSION; here it widens under an unchanged KEY, and channel F has no version to pin it to.\n\n  THE FALSE POSITIVES WERE SEPARATED FROM THE FINDING RATHER THAN SHIPPED WITH IT. Of the six nested names business-side code reads by literal, `true_positives`/`true_negatives` are a confusion matrix in `churn_model_performance` (a common word, not ground truth -- the class `feedback_a_substring_census_can_be_100_percent_false_positives_from_a_longer_common_word` names exactly this), `actual_net_gbp` and `true_total_equity_gbp` are the company's OWN realised P&L and its own balance-sheet equity, which a supplier knows. `monthly_bill_assembly`'s three carry a reasoned epistemic note in the module: the true/billed pair on an ESTIMATED bill is divergence analytics, and the one decision-driving read is `_resolve_catchup`, gated on an ACTUAL read having arrived -- at which point the consumption is genuinely the supplier's to know. SO THE LIVE READING IS CLEAN AND THE CONTROL IS BORN GREEN. That is stated plainly rather than dressed up: this pass did not find a leak, it found that nothing in the repo could have found one.\n\n  WHY THIS IS NOT A DENYLIST, WHICH IS THE TRAP THIS ATOM ALREADY FELL INTO ONCE. Pass 25 established that `FORBIDDEN_TRUTH_FIELDS` was fail-open on 9 of the 11 fields of the SIM's own truth record because it \"enumerates INSTANCES of a class it does not describe\". A `true_*` prefix detector over the artefact rebuilds that defect exactly: it catches `true_consumption_kwh` and misses the next hidden field somebody names `settled_actual`. The unit here is therefore the CLOSED SET -- every nested field name under a key the business side reads, whatever it is called. Widening is the event; the name is not the test. A SIM-derived subject was tried first and rejected on evidence: only two classes in the SIM trees are named `*Truth` (`FlexDispatchTruth`, `StackedFlexTruth`, both `sim/flex_dispatch.py`), both belong to the flex seam that channel C already belts, and neither reaches channel F -- so that derivation has no subject here.\n\n  WIDENING REFUSES AND NARROWING DOES NOT, stated rather than left to be inferred. A nested field DISAPPEARING is a paydown, and a control that reds on that reds on its own success case and gets relaxed (`feedback_a_control_pinned_as_a_count_reds_on_its_own_success_case`). A RENAME still refuses, because the new name is an addition -- which is what keeps narrowing-tolerance from being a hole, and it is asserted rather than argued (`test_MUTATION_a_RENAMED_nested_field_fails_because_the_new_name_is_an_addition`).\n\n  THE ID-MAP DISCRIMINATOR, AND THE MUTATION THAT FORCED IT. Several published blobs are dicts keyed by customer id or year, so a naive walk over nested key names reds every time the population changes -- measured across 8 committed artefacts: `churn_risk: +SYN-2021-001 -C1_2` is population churn and no wall event at all. `_is_id_map` reads the homogeneity of a dict's VALUES, never a pattern on its KEYS: matching keys against something that looks like a customer id would be a denylist over identifier spellings and the next id format walks through it. A map contributes its values' schema and not its own keys.\n\n  THE FIRST CUT OF THAT WALK WAS WRONG AND R15 IS WHAT CAUGHT IT, which is the part of this pass worth keeping. It sampled the first 5 values of a map and the first 80 elements of a list, reasoning that `_is_id_map` guarantees homogeneity so any value would do. MUTATION 6 falsified it: homogeneity holds at the TOP of a map and not through the sub-maps beneath it, so removing one customer shifted the sample window and `years` gained `2021-12` and `SYN-2021-001` from churn alone. A control whose value depends on dict iteration order reds on ordinary work and is then relaxed. The walk is now exhaustive, bounded only by depth, and a test pins the property directly (`test_the_schema_walk_is_EXHAUSTIVE_so_the_reading_does_not_depend_on_dict_ORDER`) rather than trusting the null control to keep catching it. Stability re-measured after the fix across the same 8 artefacts: SILENT across four consecutive runs, and moving only on real schema change (`bills` gaining `billing_basis`, `ledger_pnl` gaining `back_billing_write_off_gbp`).\n\n  R15 PROVEN BOTH WAYS. SIX MUTATIONS RUN, NOT ASSERTED, plus a null control, each against the reading built from ONE REF -- artefact and readers both from HEAD, because the first attempt read the artefact from the WORKING TREE and the baseline from HEAD and came back red on three `schema_version` fields that were nobody's defect (`feedback_a_two_sided_census_must_read_both_sides_from_one_ref`, caught in this pass's own harness). (1) A NEW NESTED FIELD UNDER A READ KEY: reds as WIDENED, naming `bills` and the field. (2) A RENAME: reds on the added name, with the removal reported as narrowing. (3) FAIL-OPEN -- artefact with no top-level keys: REFUSES, same doctrine and same sentence as `enumerate_f`. (4) FAIL-OPEN -- zero business readers: REFUSES, because zero pins is the reassuring answer produced by a measurement that looked at nothing, and it is exactly what a broken `enumerate_f` would hand this function. (5) NULL CONTROL -- a new field under an UNREAD key: stays GREEN, because the subject is the wall crossing and not the artefact at large. (6) NULL CONTROL -- population churn in an id-map: stays GREEN. ATTRIBUTION IS PER-MUTATION: 1 and 2 fire `widened` only, 3 and 4 raise, 5 and 6 fire nothing. NULL CONTROL: the unmutated artefact against its own freeze, green.\n\n  IT GATES FROM ITS FIRST COMMIT, the rule this file has now stated four times: a check becomes a gate \"in the same commit that makes it satisfiable\". The freeze in this commit records the nested surface at HEAD (91 read keys, 793 nested field names), so the only commits it can refuse are ones that widen a published blob or hand an unread key its first business reader. Wired into `tools/pre_commit_test_gate.py::_wall_channel_census_check` as its FIFTH half with its own fail-closed branch, and asserted against the file rather than described. `_pin_the_other_halves` absorbed the fifth half with no new hand-written pin-list, which is what pass 30 built it for -- the fixture lesson did not have to be learned a fourth time.\n\n  TEST COUNT, AST-COUNTED OFF THE TREE AND NOT FROM THE PLAN: `tests/tools/test_wall_channel_census.py` holds 175 test functions against 153 at HEAD -- 22 new. `tests/tools/test_pre_commit_test_gate.py` 38 passed. `python3 -m tools.epistemic_verifier --all` PASS over 541 company/ + saas/ files. Full census CLI exit 0.\n\n  WHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later.\n    * THE READING IS NAME-LEVEL, NOT PROVENANCE-LEVEL. It answers \"did the published surface widen\", never \"is this field ground truth\". A widened surface must still be looked at by a person; the control makes that moment exist, which is the whole of its claim.\n    * A SINGLE-ENTRY MAP READS AS A RECORD. `_is_id_map` needs two values to see homogeneity, so a map that shrinks to one customer pins that customer's id as a field name and reds once. Observed on the real artefacts (`clv_snapshots: +SYN-2021-001 -C1_2` survives the discriminator). Safe direction -- it can only pin MORE than necessary -- and stated because it will be seen.\n    * TWO ARTEFACT KEYS HAVE NO BUSINESS READER and are deliberately unpinned (`dd3_held_credit_balance_sheet`, `enterprise_value_margin_basis`). Pinning them would red on published data that crosses no wall.\n    * CHANNELS A AND B STILL HAVE NO CONFORMANCE QUESTION -- unchanged, and they remain the two whose enforcement has an owner (`WALL_CROSSING_DISPOSITION_REGISTER.md`), which is why they are the ones left. F is no longer the unowned gap. All six channels now have an enumerator; four of six now have a conformance question.\n    * THE BASELINE IS READ FROM DISK, NOT FROM THE COMMIT'S TREE, matching `load_baseline` and `load_satisfaction_baseline` beside it exactly, for the reason pass 30 recorded: diverging unilaterally would make the halves of one gate step read different trees.\n\n  NO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the sampling defect is this atom's own subject, found by mutating its own control and closed in the same pass.\n\n  THE COLD-EYES WALK IS NOW SIX PASSES OLD, AND PASS 30 SAID WHAT TO DO ABOUT THAT, SO THIS PASS DOES IT RATHER THAN DEFERRING A SIXTH TIME. Pass 30's words were: \"if five more passes cannot do it, the honest move is to record that this atom cannot reach L3 under the current invocation constraints rather than to keep deferring it one pass at a time.\" RECORDED, PLAINLY: THIS ATOM CANNOT REACH L3 UNDER THE CURRENT INVOCATION CONSTRAINTS. The cause is structural and unchanged across passes 26-31 -- the walk requires a fresh instance with a hard blindfold (`.claude/skills/cold-eyes-walk`), every one of these six invocations has been forbidden from delegating to one, and a walk performed by the lane that authored the thing is not a cold-eyes walk but a re-read. It is not that the work was judged unnecessary or was hard to schedule; the instrument is unavailable to the seat. That is a DIAL and not a wall (Rule 0), which is why each pass correctly took an authorised build item instead of holding -- but six consecutive dial-yields on the SAME blocker is no longer a scheduling accident, it is a property of how this atom is being worked, and continuing to record it as \"next move\" would be the deferral pass 30 named. L3 IS BLOCKED ON AN INSTRUMENT, NOT ON BUILD WORK.\n\n  NEXT MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING). TWO, and the first is not a build item: (1) THE WALK MUST BE SCHEDULED INTO AN INVOCATION PERMITTED TO DELEGATE -- an interactive session, or a tick whose constraints allow a fresh instance. Until that happens this atom's level is capped at 2 no matter how many conformance questions it answers, and the next pass should NOT record the walk as its own next move again. (2) The remaining BUILD work behind it is channels A and B, which is the smallest of the six remaining items and is owned elsewhere -- so the honest ranking is that this atom is close to out of build work and the binding constraint is the instrument."
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
