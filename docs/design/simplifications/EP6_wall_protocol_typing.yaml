flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_registration_at_ANOTHER_VENUE_does_not_license_this_one` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_the_book_is_REQUIRED_and_not_a_defaulted_argument` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_is_now_REFUSED` in `tests/background/test_flex_dispatch_triad.py`\n\n  LANDED: `test_the_company_holds_the_SAME_reference_the_world_will_honour` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's five files copied in and only the named part swapped -- never on the shared worktree, which carried 200 other-lane modifications throughout. The unmutated tree is the null control: 62 passed, and it was re-run between mutations rather than assumed. M1, `covers` returns a reference unconditionally (the book is never consulted): 6 failed, 56 passed -- all four refusal tests plus the triad's flipped refusal and the same-book test, which is the correct blast radius for removing the consult itself. M2, containment collapsed to `overlapping`: 1 failed, 61 passed, redding exactly the boundary test. M3, `venue` dropped from the book's key so a Capacity Market registration licenses a Balancing Mechanism call: 1 failed, 61 passed, redding exactly its named test. M4, the fail-open shape -- `registrations` given a `None` default and the loop skipped when absent: 1 failed, 61 passed, redding exactly the required-keyword test. A NOTE ON M2, because the first version of it proved nothing and the correction is the lesson: the fixture originally shortened the registration by a WHOLE period, which leaves the last delivery window butt-jointed to the registration -- and overlap refuses a butt joint too, so the mutation passed. It is cut by HALF a period, which is the only shape where overlap and containment actually disagree. Every 