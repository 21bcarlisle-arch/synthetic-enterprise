onse`/`decode_response` -- and one refusal. No registry, no transport, no retry policy, no\nnew message types, no plugin lookup: the payload codec is a FUNCTION ARGUMENT with no default, so a new\ncrossing needs no edit here and nothing can be serialised by accident. That is the SIMPLICITY GUARD\nreading this atom's own origin_note demands by name, and it is why the module is ~250 lines of which\nmost is the reasoning.\n\nWHY THE COMPANY SIDE. The atom's claim is that \"a mock counterparty and a real one are\nindistinguishable to the company\". That is decided where the company DECODES, because that is the only\nplace a real endpoint and an in-process call differ observably: a real counterparty hands over bytes, a\nmock hands over an object. With the codec here both arrive as the same typed envelope having passed the\nsame refusals, which turns indistinguishability into something testable rather than hoped for. The\nenvelope stays shared in `interface/`; this module reads it and widens nothing. Epistemically it adds\nNO observable -- it is transport, the payload is opaque to it, and `python3 -m tools.epistemic_verifier`\nreturns PASS.\n\nTHE ONE RULE, aimed at a MEASURED sibling defect rather than a hypothetical: ABSENCE IS NEVER\nAGREEMENT. A wire message must state every field including its nulls, and must state its\n`schema_version`; a missing key is refused, never defaulted. The named defect is the one the 2026-08-13\npass filed: `tools/*_port.py`'s `from_log_entry` reads `entry.get(\"schema_version\", SCHEMA_VERSION)` --\nthe READER's own constant, at read time -- so the first bump to \"2.0\" silently relabels every archived\nv1.0 entry, because an absent field and an agreeing field are the same bytes. A version field that\ncannot disagree is not a version field. Unknown keys are refused for the mirror reason: if a later\nschema adds a field, the version number is how a decoder finds out, not silent tolerance.\n\nR15 -- FIVE GUARDS, FIVE MUTATIONS, ALL RED. Each guard was killed in the real module and the suite\nre-run: MISSING_FIELD (6 failed), the int check on schema_version (3), UNSUPPORTED_VERSION (1),\nUNKNOWN_FIELD (1), the correlation_id non-empty check (2). Zero unproven guards; file restored\nbyte-identical. Three further R15 patterns are addressed by construction, not by assertion:\n  TAUTOLOGY -- every refusal fixture is a HAND-AUTHORED wire dict, never `encode_request` output, so the\n    decoder is not checked against its own arithmetic; and the wire field sets are asserted against\n    `dataclasses.fields` on the shared contract, an independent source, so a field added to the envelope\n    reds the suite instead of silently never crossing (which is exactly how `schema_version` came to be\n    populated at ten sites and present in zero published bytes).\n  NULL CONTROL -- `test_null_control_the_same_message_with_its_version_decodes` restores the deleted\n    field and nothing else, so the `raises` above is about the field, not about a generally bad fixture.\n  THE MUTANT SITS BESIDE THE CONTROL -- `test_mutant_decoder_with_a_defaulting_read_silently_relabels_\n    an_old_message` BUILDS the `.get(default)` reader, shows it reporting an unstamped v1-era message as\n    the reader's own v2 and being unable to tell that from genuine agreement, then runs the shipped\n    decoder on the identical bytes and gets MISSING_FIELD.\n36 tests pass. `True == 1` in Python, so a membership-only version check would accept `True` as v1; the\nint check is separately tested and separately mutated. The four statuses round-trip losslessly\nINCLUDING the honest non-answers (TIMEOUT, NOT_KNOWABLE_YET) -- the ones a real counterparty produces\nand a mock is tempted to skip -- and the wire form is asserted to survive real JSON transport.\n\nLEVEL 0 -> 1, AND WHY NOT 2. L1 is \"been BUILT in any form\" and that is met. L2 requires VERIFY on\ngenuine artefacts, and the honest statement is that NO PRODUCTION CROSSING CALLS THIS YET: the only\ncallers are its tests, so the module is BUILT AND DARK -- a class this project has been caught by\nbefore. `schema_version` still occurs zero times in `docs/reports/run_output_latest.json`, and it will\nuntil a crossing is migrated onto the codec. Claiming L2 on a dark module would be the false-completion\nshape R11 exists to stop.\n\nWHAT THIS DELIBERATELY DID NOT DO, each with the prior pass that argued it. Did NOT flip\n`to_log_entry(include_schema_version=...)` on the three port call sites -- cheapest thing on the board\nand measured blast radius, but the 2026-08-18 trace is right that it stamps the artefact for the family\nEP6 is LEAST about; it is this atom's cleanup, never its headline. Did NOT envelope channel F's 93\npublished report keys -- the 2026-08-15 pass killed that on measurability grounds (the unit of\nprovenance there is the FIELD, not the key) and the 2026-08-17 pass on cathedral grounds. Did NOT build\nAWACS -- its home is EP11 (2026-08-18 second pass). Did NOT touch channels A/B while KNIFE3 is live.\nDid NOT reconcile the two version TYPES (envelopes int, ports str) -- no shape has diverged, and\nreconciling now is adapters-for-future-adapters.\n\nNEXT BUILD MOVE, recorded not asked (NEVER_ASK_WITHOUT_RECOMMENDING): migrate ONE crossing onto the\ncodec end to end -- `payment_observable_seam` is the candidate, because its consumer\n(`company/billing/payment_observation_consumer.py`) is the code that holds an envelope longest and\ncurrently DROPS `schema_version` and `status` while forwarding `observed_at` and `correlation_id`. That\none migration is what moves this atom to L2 and what makes the vintage stamp appear in published bytes\nfor the first time. The exit criterion for L3 stays the per-channel conformance shape the 2026-08-15\npass established, not a repo-wide \"every crossing is envelope-borne\" claim, which that pass showed is\nunfalsifiable at HEAD.\n\nLANDING NOTE. `docs/design/maturity_map.yaml` carried ANOTHER LANE'S unstaged hunk at draw time (EP1's\nown `file_scope` + `simplifications_count` 10 -> 11, verified by `git diff` before editing), so this\ncommit was landed with a worktree swap presenting only EP6's two lines to the gate and restoring EP1's\nhunk afterwards -- their work is neither committed nor lost. This atom's two map lines\n(`level_current` 0 -> 1, `simplifications_count` 7 -> 8) and this store append are ONE ATOMIC WRITE.\n\nNO NEW WORKER_FINDING FILED (SELF_INTERRUPT_DISCIPLINE): the fail-open `.get(default)` in the ports is\nalready queued as `WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_SHAPED_2026-08-13.md` and is\nhere answered for the ENVELOPE family only, not discharged for the ports."
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
