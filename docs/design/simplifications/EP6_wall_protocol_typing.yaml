simplifications:
- "2026-08-21 pass 54 LAND, level HELD at 2, loop_stage stays build. THE EXCHANGE PASS 53 LANDED HAD NO PRODUCTION CALLER, AND THE DOOR THAT SHOULD HAVE BEEN IT WAS A NEAR-COPY THAT CROSSED NOTHING. Pass 53's own closing line named this as the next item and did not claim it. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 72d628afd.\n\n  WHAT WAS ACTUALLY WRONG, and it is one level up from where pass 53 left it. `SimInterface.enrol_flex` is the ONE declared COMPANY -> WORLD crossing for flex, and it crossed nothing: `StubSimInterface` built a request envelope with its OWN private correlation-id grammar, appended it to `self._flex_enrolments` -- a list nothing in this build reads -- and handed the company back its own question; `LiveSimInterface` did not implement the method AT ALL, so a live company could not enrol into a flex venue. `sim/flex_dispatch.py`'s own registration-desk comment says this in as many words. NO TEST IN THIS REPOSITORY CALLED `enrol_flex`, which is why none of it was ever visible: the door was dark, not merely thin. Measured before touching anything: `grep -rn enrol_flex --include=*.py` outside the seam file returned one hit, a comment.\n\n  THE PRIVATE GRAMMAR WAS ALSO WRONG, and this is the part that would have gone on being wrong after any purely cosmetic wiring. The seam minted `flex-{unit}-{date}`, with NO VENUE IN THE KEY. One unit registered into two venues over one day -- the legitimate multi-venue book `dispatch_and_settle_stacked` models -- collides on a single correlation id, so the second venue's answer arrives on the first submission's id and `observe_outcome` checks it against the wrong offer. Reproduced as a mutation, not asserted: restoring that grammar reds two tests, one on each side, and the company ends the run holding ONE reference where it made two registrations.\n\n  WHAT THIS PASS DID. `FlexEnrolmentBook.submit_enrolment` gives the book a second DOOR into ONE minting site (the seam is handed a `FlexEnrolment` the caller already assembled; `submit` is handed an offer, and now delegates). `enrol_flex` on BOTH implementations routes through it: company encoder -> venue's independently-written decoder -> company outcome reader, returning the venue's `FlexEnrolmentOutcome` rather than the company's own envelope. `flex_enrolments` -- a list of things the company SAID, published as if it were a list of things that HAPPENED -- is REMOVED rather than kept alongside, and replaced by `flex_registrations` (references the venue minted) and `flex_awaiting_answer`.\n\n  THE VENUE CLOCK IS FAIL-CLOSED, and this is the one design decision in the pass that cost anything. The obvious convenience is to default the venue's read time to the submitter's `as_of`, which is exactly the defect `sim.flex_dispatch` names about itself: a WINDOW_ALREADY_CLOSED refusal keyed on a timestamp the SENDER controls is a refusal the sender can switch off. A seam built with no world clock therefore raises `FlexVenueUnreachable` -- an unavailable counterparty is a FAILED crossing, never a silently accepted registration (R15 fail-silent). The control proves both halves: the same already-closed window that the fallback would have accepted is REFUSED once a real world clock is present.\n\n  THE RUNNING LOOP NOW HAS A FIRST LEG. `background/flex_dispatch_triad.py::measure_l2` used to begin at a settlement statement: the world settled `FLEX_UNIT_1` -- a KEYWORD DEFAULT -- to a company that had never enrolled it, and the L2 gap was scored on that statement. It now registers through the production seam a day before the record opens, and reports `settlement_solicited`: the unit read off the DECODED settlement lines against the unit the VENUE said it registered. Two quantities from two sides, so an emitter that ignored its own `unit_id` argument cannot score solicited by agreeing with itself -- which is precisely the mutation that reds it.\n\n  NO PUBLISHED FIGURE MOVED, and it was measured rather than reasoned. HEAD's `measure_l2` was loaded from `git show HEAD:background/flex_dispatch_triad.py` into a module outside the package and run beside the new one over three parameter settings (no delivery model; a stochastic delivery model; a stochastic model with a biased baseline). All ten reported figures -- gap, gap_l1_belief, delivery_learning_gain, learned_delivery_ratio, baseline_error_frac, payment_at_risk_gbp, both revenue totals, both dispatch counts -- are IDENTICAL in every setting. A test pins the same claim inside the suite by recomputing the gap independently from truth and belief.\n\n  LANDED: `FlexVenueUnreachable` in `company/interfaces/sim_interface.py`\n\n  LANDED: `_FlexEnrolmentDesk` in `company/interfaces/sim_interface.py`\n\n  LANDED: `submit_enrolment` in `company/market/flex_participation.py`\n\n  LANDED: `solicit_registration` in `background/flex_dispatch_triad.py`\n\n  LANDED: `LOOP_UNIT_ID` in `background/flex_dispatch_triad.py`\n\n  LANDED: `test_the_seam_enrols_END_TO_END_and_hands_back_the_VENUES_OWN_reference` in `tests/company/interfaces/test_sim_interface.py`\n\n  LANDED: `test_MUTATION_a_seam_with_NO_VENUE_CLOCK_refuses_instead_of_using_the_SUBMITTERS` in `tests/company/interfaces/test_sim_interface.py`\n\n  LANDED: `test_ONE_unit_into_TWO_venues_over_ONE_day_gets_TWO_registrations` in `tests/company/interfaces/test_sim_interface.py`\n\n  LANDED: `test_the_LIVE_seam_runs_the_SAME_exchange_as_the_stub` in `tests/company/interfaces/test_sim_interface.py`\n\n  LANDED: `test_the_seam_publishes_no_door_onto_the_VENUES_OWN_book` in `tests/company/interfaces/test_sim_interface.py`\n\n  LANDED: `test_MUTATION_one_unit_in_TWO_VENUES_on_one_day_is_TWO_conversations` in `tests/company/test_flex_participation.py`\n\n  LANDED: `test_both_doors_into_the_book_mint_the_SAME_correlation_id` in `tests/company/test_flex_participation.py`\n\n  LANDED: `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_scores_UNSOLICITED` in `tests/background/test_flex_dispatch_triad.py`\n\n  LANDED: `test_the_request_leg_does_not_touch_the_SCORE` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15 EVIDENCE, three production mutations run in a detached git worktree at HEAD with this pass's six files copied in, each redding exactly its named test with the rest of the battery passing as the null control (the tree itself is the null: 72 passed unmutated). M1, the venue-clock guard replaced by a fallback to the sender's `as_of`: 1 failed, 33 passed. M2, the venue dropped from the correlation id (the seam's old private grammar restored): 2 failed -- one per side of the wall -- 48 passed. M3, the solicited check reading its own `LOOP_UNIT_ID` argument instead of the decoded settlement lines: 1 failed, 21 passed.\n\n  THE INDEPENDENT INSTRUMENTS, none of them edited here. `tools/wall_channel_census` reads channel C conversations 3 of 3 with the flex seam BOTH ROLES LIVE, surface pins 3 of 3 (flex still v2 = e9d4eb24a8d69735), and every frozen channel matching its list exactly -- no red opened and none newly cleared, which is the correct reading: pass 53 cleared the census's question, and this pass answers a question the census does not ask (whether the leg carries traffic). `tools.epistemic_verifier` PASS. `tools.company_network_isolation` still reports its four frozen routes and its R15 battery is 12 passed -- the new `company.interfaces.sim_interface -> sim.flex_dispatch` edge opens NO new route to an endpoint.\n\n  WHAT REMAINS, named and not claimed. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first. (b) The venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations`, so the world's own teeth are still missing and `settlement_solicited` is a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers, which is why it is not folded in here. (c) The mock counterparty and the company's book live in one `_FlexEnrolmentDesk` object; the control for that is on the PUBLIC surface (nothing the company can reach hands out `VenueRegistrations`) rather than on process separation.\n\n  LEVEL HELD AT 2, and not re-litigated: pass 53 recorded that Q9 and Q15 need an act in a RESERVED class, so the target is unreachable in this epoch. This pass inherits that reading rather than re-deriving it."
- "2026-08-21 pass 55 LAND, level HELD at 2, loop_stage stays build. PASS 54 WROTE ITS RECORD AND COMMITTED NOTHING, THE FIFTH PASS RUNNING -- AND IS THE FIRST WHOSE RECORD SURVIVED RE-MEASUREMENT UNALTERED. The tick drew EP6 and found six files dirty against HEAD (three production, three test) carrying the flex enrolment seam wiring, plus a finished pass-54 row describing a tree no commit held. Commits 131b86df7, 21c286c15, 4e8253db9 and 6f667b545 each wrote that sentence about passes 43, 44-45, 46 and 52. This pass is the landing. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 72d628afd.\n\n  WHY THIS ROW EXISTS AT ALL, since it lands no capability and corrects nothing. The landing-tick discipline this atom built for itself -- re-run the record's own mutations before committing it -- has fired four times and reported a defect every time: pass 45 found three real defects in pass 44's gap, pass 47 found two false measurements in pass 46's, pass 53 found 675 lines with no control in pass 52's, and pass 53's own addendum found three more in mine. A mechanism whose only recorded outcome is FIRED cannot be told from one that always fires. This is its null control, and it is the reason to write it down rather than land silently: pass 54's numbers were checked by someone who was not there, and they were right.\n\n  THE THREE R15 MUTATIONS, RE-RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo -- the census fails a tar extract closed and says so) with pass 54's six files copied in and only the named part swapped, never on the shared worktree, which carried 200+ other-lane modifications throughout. The unmutated tree is the null: 72 passed. M1, the venue-clock guard replaced by a fallback to the sender's `as_of`: 1 failed, 33 passed, redding exactly test_MUTATION_a_seam_with_NO_VENUE_CLOCK_refuses_instead_of_using_the_SUBMITTERS. M2, the venue dropped from the correlation id (the seam's old private grammar restored): 2 failed -- one per side of the wall -- 48 passed. M3, `settlement_solicited` reading its own `LOOP_UNIT_ID` argument instead of the decoded settlement lines: 1 failed, 21 passed. ALL THREE FIGURES MATCH PASS 54'S ROW EXACTLY, including which test reds and how many pass beside it.\n\n  THE NO-FIGURE-MOVED CLAIM, WHICH NO MUTATION CAN CHECK, VERIFIED INDEPENDENTLY AND IT IS STRONGER THAN CLAIMED. HEAD's `measure_l2` was loaded from `git show HEAD:` into a module outside the package and run beside the worktree's over pass 54's three settings (no delivery model; a stochastic delivery model; a stochastic model with a biased baseline). Pass 54 claimed ten identical figures; measured, all SIXTEEN shared keys are identical in every setting, no key was LOST, and the only new keys are the two this pass's subject adds (`enrolment_reference`, `settlement_solicited`). Run in the main repo deliberately and not in the detached tree: the tool halves differ but the DATA CACHE is one, which is the comparison the claim is about -- the detached tree carries no `sim/cache`, and a figure comparison across two caches would be this atom's own two-trees artefact, which pass 53 retracted before publishing.\n\n  A RED THAT IS NOT MINE, RESOLVED BEFORE REACTING TO IT. `python3 -m tools.company_network_isolation` exits 1 on this tree, reporting four company-side modules that can reach a real endpoint. That is the FROZEN FOUR the director's ruling names, not a new route: the same command exits 1 on a CLEAN HEAD tree, measured in the detached worktree with `git checkout -- .` first. The new `company.interfaces.sim_interface -> sim.flex_dispatch` edge opens nothing -- the venue codec shells no fetcher -- and the control's own R15 battery is 44 passed including test_MUTATION_a_new_route_fails_the_gate. Recorded because a bare exit code on a shared tree is the easiest thing on this project to misattribute to whatever lane read it last.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.epistemic_verifier --all` PASS on 544 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings, 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from pass 53, so this pass creates no wall crossing. tests/architecture/test_epistemic_wall_indirect_ratchet.py + test_epistemic_wall_ratchet.py + tests/tools/test_company_network_isolation.py 44 passed -- the indirect ratchet, the control that reds on a NEW indirect crossing, is green with its allowlist UNWIDENED. tests/design/test_simplifications_store.py + test_atom_notes_store.py 60 passed.\n\n  MAP EDIT AND THE COUNT, which is the control that refused pass 53. This append ROLLS the store (a two-file atomic write: the live file plus a new `archive/EP6_wall_protocol_typing.*.yaml` chunk), and the count invariant is TREE-WIDE, so a stale number here refuses every lane's commit and not only this one. Pass 54 already moved `simplifications_count` 49 -> 50 for its own row; this entry moves it to 51, and the archive chunks are committed in the same pathspec as the live file, because a roll landed half is two files disagreeing about one history.\n\n  WHAT DID NOT CHANGE. No published figure moved and none was recomputed -- verified above rather than asserted. No production line was written by this pass: the six files landing here are pass 54's, unmodified by me, and the only bytes this pass adds are this row and the count. THE LEVEL DOES NOT MOVE and is not re-litigated: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built, and `tools.discovery_pass_ceiling` says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS, inherited from pass 54 and not re-opinionated. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first. (b) The venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations`, so the world's own teeth are still missing and `settlement_solicited` is a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers. (c) Q3's BRANCHING conversation, the larger item passes 44, 47 and 53 all left. (d) The census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, filed by passes 48 and 50 and still filed.\n\n  THE LESSON, and it is the inverse of the one this atom has drawn four times running. The gap between a record and its commit is where the defects live -- but the discipline that closes it is only worth its cost if it can come back empty, and this is the first tick that proves it can."
- "2026-08-21 pass 56 LAND, level HELD at 2, loop_stage stays build. PASS 55 WROTE ITSELF DOWN AS THE LANDING AND DID NOT COMMIT EITHER, WHICH MAKES SIX PASSES RUNNING -- AND ITS FIGURES, RE-MEASURED AT A NEW HEAD BY A SEAT THAT WAS NOT THERE, ARE IDENTICAL. The tick drew EP6 and found the same six files dirty against HEAD (three production, three test, 578 insertions / 39 deletions), the store rolled to archive chunk 039 with the roll uncommitted, the map count already moved to 51, and TWO finished rows -- pass 54's and pass 55's -- both describing a tree no commit held. This pass is the commit. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD c43439739, one publish-provenance commit later than the HEAD pass 55 measured (72d628afd) and touching a single site data file, nothing in this atom's file_scope.\n\n\n  WHAT THIS PASS RE-MEASURED, AND WHY THESE AND NOT THE MUTATION BATTERY. Pass 55 was itself the landing-tick verifier of pass 54 and added no production byte, so re-running M1/M2/M3 would check pass 54's code against pass 54's claim a second time and say nothing about the only thing that has changed since: the HEAD underneath. What CAN move under a new HEAD is every instrument that reads the whole tree, so those are what this pass ran, and all four reproduce to the digit. The three file_scope test files: 72 passed -- the same number pass 55 reports as its unmutated null. `tools.wall_crossing_dispositions`: OK, 6 live crossings (4 direct, 2 indirect via a bridge package), 91 ruled (cut 85, owed 6, grandfathered 0), so the landing still creates no wall crossing and rules none away. `tools.epistemic_verifier --all`: PASS on 544 files. The store pair tests/design/test_simplifications_store.py + test_atom_notes_store.py: 60 passed.\n\n\n  THE ROLL LANDS WHOLE OR NOT AT ALL. Pass 55's append crossed ROLL_WATERMARK, so the live file and `archive/EP6_wall_protocol_typing.039.yaml` are one atomic write, and the count invariant reading them is TREE-WIDE -- half a roll refuses every lane's commit, not only this atom's. This row rolls the store again where the watermark demands it; every chunk moves in the same pathspec as the live file, and the map's `simplifications_count` moves in the same commit. The map edit landing here is pass 54's and pass 55's as well as mine: the file_scope widened by the four files pass 54 wrote in, and the count 49 -> 52.\n\n\n  WHAT DID NOT CHANGE. No production line in this commit is this pass's: the six files are pass 54's, unmodified by pass 55 and unmodified by me, and the only bytes pass 55 and pass 56 add between them are two rows and a count. No published figure moved and none was recomputed. THE LEVEL DOES NOT MOVE and is not re-litigated: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.\n\n\n  WHAT REMAINS, inherited unchanged and not re-opinionated. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first. (b) The venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations` -- so `settlement_solicited` stays a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers. (c) Q3's BRANCHING conversation, left by passes 44, 47 and 53. (d) The census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, filed by passes 48 and 50 and still filed.\n\n\n  THE LESSON, now measured twice rather than argued once. Pass 55's case for writing a row that lands no capability was that a landing-tick check whose only recorded outcome is FIRED cannot be told from one that always fires, and it supplied the first empty run. This is the second, at a different HEAD and from outside the build. The cost side is visible in the same place: six rows of prose have now been written about a body of work that took one commit to land, and the discipline only earns that cost while the commit follows in the SAME tick as the row. It did here."
- "2026-08-21 pass 57 BUILD, level HELD at 2, loop_stage stays build. THE WORLD COULD STILL DISPATCH A UNIT NOBODY HAD ENROLLED; ONLY THE HARNESS OBJECTED. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 7f94bae95, with all five touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing.\n\n  WHICH ITEM, AND WHY IT WAS ALREADY CHOSEN FOR ME. Passes 54, 55 and 56 each closed with the same four-item remaining list and the same sentence about its second item: \"the venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations`, so `settlement_solicited` stays a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers.\" Three passes named it and none took it, which is exactly the shape a deferred item takes on the way to becoming permanent. `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- with five payable rows and an explicit instruction not to record `infeasible_here`, so the payable half was taken again.\n\n  THE DEFECT, STATED AS THE DIFFERENCE BETWEEN A REPORT AND A RULE. Pass 54 gave the L2 loop a first leg and scored `settlement_solicited`: the unit read off the DECODED settlement lines against the unit the venue said it registered. Two quantities from two sides, and it is a real check -- but it is an OBSERVATION made after the fact by the one layer allowed to see both sides, and the world went on being able to produce the statement being observed. Nothing in `sim/**` consulted `VenueRegistrations` before putting a line on the wire, so `unit_id` remained a KEYWORD DEFAULT and a unit that had never enrolled was still settleable; the only thing standing between this loop and a payment nobody had asked for was a harness that remembered to look. A gap the harness can only report is not a law the world obeys, and the next loop written -- L1 and L3 both, today -- simply would not look.\n\n  WHAT LANDED, AND THE FOUR DECISIONS INSIDE IT THAT COST SOMETHING. (1) CONTAINMENT, NOT OVERLAP. `VenueRegistrations.covers` asks whether a declared availability window CONTAINS the delivery window, where the pre-existing `overlapping` asks whether two registrations collide. They are different questions and the class now holds both: overlap is right for \"may I register this?\" and wrong for \"may I call this?\", because an instruction that starts inside availability and runs past its end calls the unit over minutes it never offered. The mutation collapsing one into the other is run below and is the plausible mistake rather than an invented one. (2) THE BOOK IS A REQUIRED KEYWORD on both wire legs, not a defaulted one. A `registrations=None` that skips the check is this project's own fail-open pattern -- the control passes for every caller who forgot the argument -- so the legs refuse to be called without it and a test asserts the TypeError. (3) THE CHECK READS WHAT WAS EMITTED, not what was passed in: `unit_id`, `venue` and both window bounds come off the constructed payload, so an emitter that ignored its own `unit_id` argument is caught by the same check that catches a stranger. (4) AN EMPTY BOOK REFUSES. `covers` returns None for a venue that has registered nobody, and None is a refusal; the fail-open case has its own test because that is where this class of control usually dies.\n\n  THE OWNERSHIP MOVE THAT MADE IT POSSIBLE, and it is the part with a portability argument rather than a defect behind it. The venue's `VenueRegistrations` was minted INSIDE `_FlexEnrolmentDesk`, a company module, and died with the seam object -- so the counterparty's state was born on the wrong side of the wall and nothing else in the world could consult it. It is now injectable (`build_sim_interface(flex_registrations=...)`), and the HARNESS -- the one layer that holds the world -- constructs it, hands it to the seam as counterparty state, and hands the SAME instance to the venue's dispatch legs. What the venue registered and what the venue will honour became one fact instead of two that happened to agree. Nothing on the company's surface changed: `test_the_seam_publishes_no_door_onto_the_VENUES_OWN_book` is untouched and green, and `flex_registrations=None` keeps the old behaviour for every caller with no world to speak of.\n\n  A CONTROL REDDING ON ITS OWN SUCCESS CASE, MET AGAIN AND FLIPPED RATHER THAN DELETED. `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_scores_UNSOLICITED` asserted the harness SCORED a stranger's settlement unsolicited. With the world refusing, the stranger's lines never reach the wire to be scored, so the test reds -- this project's recorded class, and the correct move is the one pass 53's addendum used: its useful half was never \"the score is False\" but \"a unit nobody enrolled must not be settled\", and asserting the REFUSAL is strictly stronger than asserting the score. It is flipped. The observation is NOT thereby made unfalsifiable, which would be the quiet cost: a second test mutates the DECODER instead of the emitter (a mis-keyed feed, or the same statement read for the wrong party -- downstream of the law, which fires at emission) and `settlement_solicited` still scores False.\n\n  LANDED: `UnregisteredDispatch` in `sim/flex_dispatch.py`\n\n  LANDED: `covers` in `sim/flex_dispatch.py`\n\n  LANDED: `_require_registered` in `sim/flex_dispatch.py`\n\n  LANDED: `SolicitedRegistration` in `background/flex_dispatch_triad.py`\n\n  LANDED: `test_MUTATION_a_unit_this_venue_NEVER_REGISTERED_cannot_be_settled_at_all` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_an_EMPTY_book_refuses_rather_than_passing__the_fail_open_case` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_call_running_PAST_the_declared_availability_is_refused` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_registration_at_ANOTHER_VENUE_does_not_license_this_one` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_the_book_is_REQUIRED_and_not_a_defaulted_argument` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_is_now_REFUSED` in `tests/background/test_flex_dispatch_triad.py`\n\n  LANDED: `test_the_company_holds_the_SAME_reference_the_world_will_honour` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's five files copied in and only the named part swapped -- never on the shared worktree, which carried 200 other-lane modifications throughout. The unmutated tree is the null control: 62 passed, and it was re-run between mutations rather than assumed. M1, `covers` returns a reference unconditionally (the book is never consulted): 6 failed, 56 passed -- all four refusal tests plus the triad's flipped refusal and the same-book test, which is the correct blast radius for removing the consult itself. M2, containment collapsed to `overlapping`: 1 failed, 61 passed, redding exactly the boundary test. M3, `venue` dropped from the book's key so a Capacity Market registration licenses a Balancing Mechanism call: 1 failed, 61 passed, redding exactly its named test. M4, the fail-open shape -- `registrations` given a `None` default and the loop skipped when absent: 1 failed, 61 passed, redding exactly the required-keyword test. A NOTE ON M2, because the first version of it proved nothing and the correction is the lesson: the fixture originally shortened the registration by a WHOLE period, which leaves the last delivery window butt-jointed to the registration -- and overlap refuses a butt joint too, so the mutation passed. It is cut by HALF a period, which is the only shape where overlap and containment actually disagree. Every null control is stated with its test: the exactly-covering book accepts; the forged-venue book licenses the venue it was really made at; the same book returns None for a unit it never registered.\n\n  NO PUBLISHED FIGURE MOVED, measured rather than reasoned. HEAD's `measure_l2` was run in the detached worktree and this tree's beside it over three settings (no delivery model; a stochastic delivery model; a stochastic model with a biased baseline), with the SAME injected synthetic record on both sides -- injected deliberately, because a comparison across two data caches is this atom's own recorded two-trees artefact. All 15 reported keys per setting, 45 across the three, are identical; NO key was lost and NO key was added. Transport is not a belief and neither is a refusal that never fires.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.epistemic_verifier --all` PASS on 544 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-56, so this pass creates no wall crossing and rules none away. `tools.company_network_isolation` exits 0 on its four frozen routes and its R15 battery, with the two epistemic-wall ratchets, is 44 passed with the allowlist unwidened -- the harness-to-world edge added here opens no route. `tools.wall_channel_census` reads IDENTICALLY at HEAD and on this tree on every channel this pass could touch; the two places the readings differ are both another lane's and are named rather than glossed: channel D/F move because `docs/reports/run_output_latest.json` is uncommitted in the shared tree (which is also what takes the census exit code to 1), and the `paid down on C_envelope (1)` line is present at a CLEAN HEAD too, so it was neither opened nor cleared here.\n\n  EVIDENCE: tests/sim/test_flex_dispatch.py 38 passed (32 at HEAD); tests/background/test_flex_dispatch_triad.py 24 passed (22 at HEAD); 219 pass