simplifications:
- |
  2026-08-13 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3
  idle draw). No BUILD code written, nothing typed, no protocol designed -- this atom is
  epoch-3 BUILD-gated on director-reserved curriculum sequencing (R13), and
  EPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available while BUILD is not.
  `docs/design/maturity_map.yaml` deliberately NOT edited: nothing in the map moves for this
  pass, and another lane holds staged hunks in that file (`git diff --cached --stat` at draw
  time: 13 insertions, 5 deletions). Output is this record plus one queued finding.
  Everything below is `observed-with-evidence` unless labelled `inferred` (R9).

  MEASURED AT: HEAD d5916fd67. Live published artefact `docs/reports/run_output_latest.json`
  (mtime 2026-08-13 17:51:47, 3,568,564 bytes) read directly; shipped modules read as they
  sit on disk; nothing monkeypatched, nothing regenerated. Two of this atom's three cited
  evidence paths were DEAD (the known moved-path class) and are repaired above: the director
  ruling had been archived to `docs/staging/done/`, the counterparty-API research moved to
  `docs/design/refs/`. Six paths added -- the ones a reader of this atom actually needs.

  ==========================================================================================
  FINDING 1 -- THIS ATOM'S OWN `name:` POINTS AT THE WRONG ANCESTOR. The protocol layer EP6
  proposes to build ALREADY EXISTS, is live on three crossings, and is not the pattern this
  atom names. Nine downstream atoms inherit the wrong pointer through `depends_on`.
  ==========================================================================================

  The atom's `name:` says: "W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this
  is the protocol layer every named adapter below plugs into." Read that against the tree and
  it sends EP7-EP15 to the one family that implements none of C-S3.

  What is actually on disk, two disjoint families:

  FAMILY A -- `interface/contracts/wall_envelope.py`. `WallRequest[P]` / `WallResponse[R]` /
  `WallStatus`, frozen and generic. Its module docstring enumerates the same five properties
  this atom's origin note is about (C-S3 separate events in time, C-S2 at-least-once
  idempotency, C-S1 late/out-of-order/never, NOT_KNOWABLE_YET as a first-class answer, and
  restatement-not-mutation), and implements them: `correlation_id` is both the idempotency
  key and the ONLY link between request and response; `as_of` (decision clock) is kept
  distinct from `emitted_at` (transaction time); `observed_at`/`valid_time` are bitemporal by
  construction; `__post_init__` REFUSES a malformed envelope (an OK with no payload, a
  non-OK carrying one, an ERROR with no `ErrorDetail`) at construction rather than at some
  quieter later read. `schema_version: int` is a REQUIRED field on both request and response
  -- no default, structurally impossible to omit. Referenced by 11 non-test modules; three
  crossings are expressed in it (`payment_observable_seam.py`, `conversation_seam.py`,
  `flex_observable_seam.py`), live-wired at `simulation/conversation_response.py::
  respond_over_wall` (which contract-validates the pairing so "a same-step or mis-linked
  response can never leave this function"), `simulation/payment_seam_adapter.py`,
  `sim/flex_dispatch.py`, and consumed on the company side by
  `company/billing/payment_observation_consumer.py` and `company/interfaces/sim_interface.py`.
  Built under atom W4_4 per its own docstring -- NOT under W4_1.

  FAMILY B -- `tools/*_port.py`, the five ports W4_1 built and this atom's `name:` cites:
  `market_data_port`, `credit_bureau_port`, `meter_read_port`, `acquisition_funnel_port`,
  `contact_centre_port`. Every one is a `runtime_checkable` Protocol whose method RETURNS the
  answer in the same call frame -- `get_meter_reads() -> list[MeterReadMessage]`,
  `check_credit(applicant_id, segment, seed) -> CreditCheckResult`,
  `get_spot_elec_gbp_per_mwh(as_of) -> float`. Zero request objects. Zero correlation ids.
  Zero separation in time. Grepped for `correlation_id` across the five: one hit, in a
  `contact_centre_port.py` COMMENT explaining that the real crossing dict has no
  correlation_id and the sketch's illustrative guess did.

  So the origin note's fear -- "C-S3 is the thing most likely to be quietly dropped, because
  same-step is easier" -- has already come true, but in the opposite direction from the one it
  guards. C-S3 was not dropped from the DESIGN; it was designed properly in Family A and
  never picked up by the family this atom points its nine dependants at. And the sketch's own
  row 7 (`docs/design/WALLED_INTERFACES_SKETCH.md`, banking/payment rails) explicitly defers
  "full typed/versioned HARDENING of this seam (schema versioning, the reference-flow-
  conversion treatment given to the other rows)" to Epoch 3 -- i.e. to THIS atom -- and that
  is precisely the seam Family A already landed.

  WHAT FOLLOWS, recorded rather than asked (NEVER_ASK_WITHOUT_RECOMMENDING):

  1. This atom is not greenfield. `level_current: 0` and `file_scope: []` describe an atom
     with nothing built; the honest reading is that its deliverable exists in part, under a
     different atom, and its level must be re-derived from a CENSUS when it opens, not
     assumed from the record. Not changed here: a level move is a BUILD-side act on a
     BUILD-gated atom, and the map holds another lane's hunks.
  2. When EP6 opens, its first task is the census, not a design: enumerate every live
     SIM/company crossing and classify each as (a) envelope-borne, (b) same-step typed port,
     (c) bare dict. The measured starting point from this pass -- 9 known crossings (the
     sketch's 7-row table plus conversation and flex), 3 envelope-borne, 5 in Family B, 1
     (smart-meter comms) still not a real crossing at all. The denominator is NOT claimed
     complete: this pass enumerated from the sketch table and the `WallResponse` importer
     set, not from an exhaustive walk. Establishing that walk IS the census task.
  3. EP7-EP15 (`depends_on: ['EP6_wall_protocol_typing']`, 9 atoms, verified by grep) should
     be read as plugging into `interface/contracts/wall_envelope.py`. The Family B pattern is
     a transport-shape convenience for in-process logs; it is not a counterparty protocol,
     and an EP7 Elexon adapter or an EP11 GoCardless adapter built to it would have no
     representable answer for "the webhook arrived four days later" -- the exact physics
     those atoms' own `name:` fields say they exist to reproduce.
  4. The SIMPLICITY GUARD in the origin note is now the strongest argument AGAINST a new
     protocol layer: one already exists and is proven. EP6's honest shape is CONFORMANCE
     (migrate crossings onto the envelope, refuse new ones outside it), not construction.

  ==========================================================================================
  FINDING 2 -- LATENT, QUEUED NOT FIXED. The "versioned message" is UNVERSIONED ON THE WIRE
  in the live published artefact, and nothing can catch it, because the wall's only automated
  conformance control is IMPORT-shaped, not protocol-shaped.
  ==========================================================================================

  Filed as `docs/staging/WORKER_FINDING_THE_WALLS_CONFORMANCE_CONTROL_IS_IMPORT_SHAPED_2026-
  08-13.md` (LATENT, lane W4_the_wall). Summary of the measurement, which is EP6's problem
  rather than W4_1's because EP6 is the atom that would inherit it:

  Live `docs/reports/run_output_latest.json`, entries parsed not sampled:

      meter_read_log          1,600 entries   any schema_version: False
      contact_centre_log        392 entries   any schema_version: False
      acquisition_funnel_log      4 entries   any schema_version: False

  `to_log_entry(include_schema_version: bool = False)` defaults the version OFF so the round
  trip stays byte-identity; all three live call sites (`simulation/run_phase4c_on_phase2b.py`
  lines 237 and 324, `simulation/run_phase2b.py` line 1647) take the default. The only three
  occurrences of `include_schema_version=True` in the repo are test assertions. The version
  field exists on the object and has never crossed the seam.

  Worse than absent, and this is the R15 FAIL-OPEN part: `from_log_entry` reads
  `entry.get("schema_version", SCHEMA_VERSION)` -- the module constant AT READ TIME. Today
  that is harmless (one version, "1.0"). The first bump to "2.0" silently relabels every
  archived v1.0 entry as 2.0, because absence is indistinguishable from agreement. A version
  field that cannot disagree is not a version field, and version negotiation is exactly what
  EP6 exists to provide. Family A avoids this by construction -- `schema_version: int` is
  required, so there is no absent case to default.

  WHY NOTHING FIRED. `tools/epistemic_wall.py` (read directly): `WALL_DIRS = ('company',
  'saas', 'sim', 'simulation')`, `SEAM_PACKAGE = 'company.interfaces'`. Both `tools` and
  `interface` are UNCLASSIFIED -- `tests/architecture/test_epistemic_wall_ratchet.py`
  asserts this deliberately (`assert not _under_seam("interface.contracts.wall_envelope")`).
  The ratchet polices IMPORT EDGES between the two sides. It is sound for that subject and
  says so. But data crossing as a JSON list through an unclassified package is not an import
  edge, so the crossing below is invisible to every control in the repo:

      producer   simulation/run_phase4c_on_phase2b.py  -> meter_read_log (1,600 rows)
      consumers  company/billing/monthly_bill_assembly.py
                 company/compliance/population_sanity.py
                 saas/reporting/annual_report.py
                 saas/reporting/css_statement.py

  Same-step, unversioned, and -- as W4_1's own 2026-07-22 red-team already registered and
  this pass re-confirmed on the live artefact -- carrying `true_consumption_kwh`, SIM ground
  truth, in the published bytes. That last part is a KNOWN registered latent gap, not a new
  finding; it is repeated here only because it is the same blind spot: the accessor is
  enforced, the wire is not, and no control looks at the wire.

  THE CONSEQUENCE FOR THIS ATOM: EP6 cannot be exit-tested by "the crossings are typed" --
  they already are, and the typing is silent on the wire. Recommendation, acted on by
  recording it here for the draw that opens this atom: EP6's exit criterion is a CONFORMANCE
  CENSUS with a shrink-only allowlist, mirroring the ratchet's own proven shape -- every live
  crossing either carries a `WallRequest`/`WallResponse` or appears in a dated, shrink-only
  list of grandfathered same-step crossings, with the mutation proof being an injected
  same-step crossing that must red the suite. That control is protocol-shaped, it is the
  pattern this repo has already proven it can keep honest, and it makes "a mock counterparty
  and a real one are indistinguishable to the company" a testable claim rather than a hope.
