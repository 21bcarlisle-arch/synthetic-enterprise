- "2026-08-22 pass 66 LAND, level HELD at 2, loop_stage stays build. THE PUBLISHER TOOK THE MAP HALF OF PASS 65'S COUNT BUMP AND LEFT BOTH STORE HALVES BEHIND, AND ITS OWN GATE COULD NOT HAVE SEEN IT. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 33a2fb82a on entry, landing on 260aad3e2, commit `75b1745b0`.\n\n  WHY THIS PASS EXISTS. Pass 65 wrote its row and its three files and committed none of them: at entry `docs/design/simplifications/EP6_wall_protocol_typing.yaml` was rolled (pass 60's row moved out, pass 65's appended) with the archive chunk `.047` still UNTRACKED, `docs/design/maturity_map.yaml` carried the bump 59 -> 60, and `git diff HEAD` on the three code files carried 738 insertions and 1 deletion. That is the sixth EP6 pass in this run to leave its work in the shared tree, and pass 63 already wrote the same sentence. This pass took the payable half by landing it, not by adding to it.\n\n  THE WORK WAS RE-MEASURED BEFORE IT WAS TRUSTED, because a row is a claim and not a receipt (R7). `tests/tools/test_wall_channel_census.py` and `tests/tools/test_pre_commit_test_gate.py` together: 267 passed in 64s, which is exactly pass 65's claimed 229 + 38 and closes only if nothing else moved. `git diff` on `tools/pre_commit_test_gate.py` is 28 lines and every hunk is pass 65's; the map diff is one hunk and it is EP6's count; the census and its test are new-file additions. So no path needed a content swap and the landing was a plain pathspec.\n\n  THE FIRST LANDING GATED GREEN AND COMMITTED NOTHING. `tools.surgical_land` builds the resulting tree, runs the repo's own pre-commit hook against it, and only then takes `tree_lock` to compare-and-swap HEAD -- with a 60-second acquisition timeout. `process_run_complete.py` held the lock through its own commit, the acquisition timed out, and a multi-minute gate run was discarded with `TreeLockTimeout` and a traceback rather than a retry. Observed, with the traceback in hand; the second attempt (wait for the lock, then land) took it on the first try. inferred: this is a general shape rather than today's luck -- the gate is minutes and the lock window is 60s, so any publish cycle overlapping a landing loses the landing, not the publish.\n\n  AND WHILE THAT ATTEMPT WAS DYING, THE PUBLISHER SPLIT THE INVARIANT. `process_run_complete.py`'s commit pathspec names `docs/design/maturity_map.yaml` outright, so it adopted this lane's uncommitted `simplifications_count: 60` and committed it as `260aad3e2` -- without the live store row and without the untracked archive chunk, which were not in its pathspec and could not have been. MEASURED on a clean extract of that commit rather than inferred from the symptom: map declares 60, store holds 59. `main` carried a red tree-wide count invariant for exactly the span of one commit, closed by `75b1745b0`, whose own stat shows FIVE files and not six -- the map hunk was already gone when the landing ran, which is how a landing can be correct and still not contain the change it was written to carry.\n\n  THE PUBLISHER'S GATE CANNOT SEE THIS CLASS, and that is the point rather than a complaint. Its count-invariant nodes (`tests/design/test_atom_notes_store.py`, `tests/design/test_simplifications_store.py`) were running in the WORKING TREE at the moment of the commit, and in the working tree both halves were present and the count was 60/60. The commit it was creating held one half. That is precisely the tree-not-the-commit class `surgical_land` exists to close, with one addition worth naming: the count invariant is the case where the two halves live in DIFFERENT FILES, so a pathspec that takes one and not the other does not merely fail to notice a split -- it manufactures one. Commit `ccf61ad60` is the same event under a different lane, and `793c5808b` is the same event under this one.\n\n  WHAT THIS PASS DID NOT DO. It added no control and moved no level. Q9 and Q15 still need an act in a RESERVED class, so 2 -> 3 is unreachable in this epoch whatever is built; `python3 -m tools.discovery_pass_ceiling` still reports the atom in its fourth state and still instructs explicitly NOT to record `infeasible_here`.\n\n  WHAT REMAINS. (a) Pass 65's list is unchanged and stands: `company/comms/susceptibility_estimator.py` still decodes on the weaker entry point (`decode_response`, not `decode_framed_response`), unbooked AND unframed, Q13's other leg, still outside this atom's `file_scope`. (b) The payment consumer is unbooked because no equivalent holding exists to admit against. (c) NEW, and it is harness work rather than EP6 work, so it is named here and not taken: `surgical_land` discards a green gate on a 60-second lock timeout, and `process_run_complete.py` splits any in-flight count bump it happens to overlap. Both are queued rather than fixed on sight (SELF-INTERRUPT DISCIPLINE); neither blocks this atom."
map_notes:
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
