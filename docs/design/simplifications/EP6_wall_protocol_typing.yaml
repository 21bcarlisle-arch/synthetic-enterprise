  populate-and-prove, not design"). "Absent from every published key" is confirmed independently at a

  newer HEAD. "Populate-and-prove" is WRONG on the population half -- nothing needs populating; it was

  written against the possibility of default-valued fields and that possibility is now excluded. And

  "reaching the wire" is TWO moves, not one: ports are a 3-call-site default flip with a measured blast

  radius (plumbing), envelopes are the question of whether an envelope is ever serialised at all (protocol

  design, the BUILD-gated half, not closeable by a conformance pass).


