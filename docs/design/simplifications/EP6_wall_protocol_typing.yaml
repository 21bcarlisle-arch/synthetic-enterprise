laced by two); 1371 passed across the downstream consumers (tests/interface, tests/company/interfaces, the stacked flex truth, the payment observation consumer, the payment seam adapter, the flex dispatch triad, the wall channel census and the susceptibility wire); the four mutations above with the figures given; `ruff check` clean on all six changed files.\n\n  A RED THAT IS NOT MINE, RESOLVED BEFORE REACTING TO IT. `tests/architecture` reports 5 failed, 286 passed, 1 skipped: two nodes in `test_no_committed_store_claims_an_unlanded_falsifier.py` and three ruff-ratchet nodes in `test_static_quality_ratchet.py`. All five fail IDENTICALLY in a detached worktree at clean HEAD with none of this pass's files present (measured, not inferred), so they are pre-existing and another lane's -- the same five pass 60 recorded, and the ruff one matches this project's own filed finding that the ratchet is red at HEAD. Filed, not fixed (SELF_INTERRUPT_DISCIPLINE). Recorded because a bare red on a shared tree is the easiest thing here to misattribute to whoever read it last.\n\n  WHAT DID NOT CHANGE, said plainly. NO PUBLISHED FIGURE MOVED and none was recomputed: nothing in this pass is wired into a live run, no module that produces a figure was touched, and the enrolment leg's only production caller is `company.interfaces.sim_interface._FlexEnrolmentDesk.enrol`, which passes the answer straight from the venue to the company's reader and needed no edit at all -- the frame crosses it untouched. `tests/background/test_flex_dispatch_triad.py` passes unchanged, so the L2 gap instrument reads what it read before.\n\n  WHAT REMAINS. (a) Q13's OTHER half, now VISIBLE in the ratchet rather than hidden by it: `company/comms/susceptibility_estimator.py` still decodes a response with no participant check, and so does `observe_response_wire` -- the flex dispatch-instruction and settlement feeds -- which is why `flex_participation.py` is declared in both tables. Framing those feeds means giving the world's `emit_dispatch_instructions` / `emit_settlement_lines` wire legs the same operator identity, and it is a wider change than this one because those legs have in-process constructors beside them. (b) There is still no cryptography anywhere on this wall: what is modelled is the REFUSAL and the shape of a participant proving itself, not SMKI/DIP signing, and pass 60's statement of that is unchanged. (c) Give the switch exchange a production caller -- `CoSProcess` is a company-side state machine whose objection arrives by method call, so the company still objects to its own switches. Pass 60 named it first and this pass did not take it; measured here rather than carried on that record's word: `grep -rn \"cos_process\\|CoSRegister\" --include=*.py` outside the module itself returns exactly one hit, a coverage test, so it has no production caller of any kind today and wiring it to the register would join two dark things. That is worth saying before the next pass takes it as named. (d) Q5's no-response horizons at 1 min / 24 h / 5 working days, which `crossing_silence` answers in part and which no flex enrolment is aged by yet.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-60 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half. The target decision recommended at passes 38-60 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-22 pass 62 BUILD, level HELD at 2, loop_stage stays build. THE TWO FEEDS THAT CARRY THE MONEY WERE THE UNSIGNED ONES. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 973aa9ac6 -- pass 61's own landing -- with all eight touched files clean against HEAD before the first edit, on a shared tree carrying 250+ other-lane modifications throughout.\n\n  WHICH ITEM, AND IT IS THE ONE PASS 61 NAMED. Pass 61's \"WHAT REMAINS (a)\": `observe_response_wire` -- the dispatch-instruction and settlement feeds -- still decoded a response with no participant check, which is why `flex_participation.py` was deliberately declared in BOTH the framed and the bare crossing tables. `python3 -m tools.discovery_pass_ceiling` reports this atom in its fourth state, THE TARGET IS UNREACHABLE HERE **AND** BUILD WORK REMAINS, naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`; the payable half was taken again. Q13's OTHER remaining leg -- `company/comms/susceptibility_estimator.py` -- is untouched and stated below rather than left to be inferred from a count: its production module is not in this atom's `file_scope` and framing it means giving the comms world leg an operator identity it does not have.\n\n  THE DEFECT, AND WHY IT IS WORSE THAN THE ONE PASS 61 CLOSED. Pass 61 framed the ENROLMENT leg because a registration reference could be minted by anything that echoed two fields back. The same seam's two OBSERVABLE feeds stayed bare, and they are the ones that carry money: anything able to put bytes in front of `observe_response_wire` could tell this company it had been dispatched, over which window, and how much it had been paid. A registration a company wrongly believes it holds is a business that does not exist and shows up as a discrepancy; a settlement line it should never have been sent goes straight into revenue. Reproduced before a line was written, and it is what mutation M1 below restores.\n\n  ONE SIGNATURE PER MESSAGE, NOT PER FEED, and this is the part a single-venue seam could not have taught. `_frame_feed` reads the venue off `r.payload.venue` -- the WORLD'S own record of which market it is settling, being constructed here and not received, so there is no message to believe -- and signs each message with THAT venue's operator. The obvious implementation signs the feed once. It is wrong on the stacked feeds, because a stacked portfolio is called at several venues at once and the fixture is contended across the Balancing Mechanism and a local constraint market, which in GB are run by different parties. A once-signed feed stamps the local constraint line with the system operator's identity: a forgery the world itself commits, and one no company-side check could ever catch, because the company would be authenticating a claim that was already false when it left. `test_a_STACKED_feed_carries_TWO_DIFFERENT_signers_in_ONE_list` asserts the sender SET has two members and that each message's signer matches its own venue; M4 is that implementation, restored, and it reds.\n\n  READING THE VENUE OFF THE PAYLOAD IS NOT THE TAUTOLOGY PASS 61 REMOVED, and the difference is worth stating precisely because the shapes look alike. There, the ONLY evidence was field-vs-field: the message supplied both sides of the comparison, so nothing had to be HELD to pass it. Here the evidence is a credential fingerprint this module holds and the sender has to present; the venue named in the payload selects WHICH participant is entitled to have sent it. An impostor holding nothing is refused at the frame; one holding the system operator's genuine credential cannot mint a local constraint line by relabelling it, because moving the venue moves the operator the frame is then required to prove. The company reads its OWN `VENUE_OPERATORS`, never the world's table.\n\n  WHAT THIS LEG STILL DOES NOT ASK, said here rather than left for a later pass to discover: whether this company ever ENROLLED at the venue named. That answer lives in `FlexEnrolmentBook`, which the module-level feed readers do not hold. The world refuses an unregistered dispatch at emission (`UnregisteredDispatch`, pass 57) and the harness scores `settlement_solicited` downstream, so the hole is covered from both ends and not from the reader's own side. That is the next thing owed on this leg.\n\n  THE HAND-OVER CLOCK HAS NO DEFAULT ON ANY OF THE FOUR LEGS, inherited from `frame_venue_message` and now enforced where the feeds are emitted. The tempting default is the envelope's own `observed_at`, and a hand-over stamp read off the document it wraps could never disagree with it. The harness supplies TWO clocks rather than one (`_hand_over_clocks`): the instruction feed is handed over as the record closes, the statement when the settlement run for it completes `_SETTLEMENT_LAG_DAYS` later. One shared stamp would quietly re-merge the two events C-S3 exists to keep apart.\n\n  THE RATCHET'S MUTATION TEST WOULD HAVE DIED OF THIS PASS'S SUCCESS, and repairing that is half the work. Pass 61 wrote `test_MUTATION_a_file_with_ONE_framed_and_ONE_bare_leg_is_not_recorded_as_framed` against `flex_participation.py`, then genuinely mixed. Framing the feed leaves NO mixed file in this repository, so the version asserting `overlap == {that file}` had to be deleted the moment the wall got better -- a control that dies when its subject is repaired. What that control is really about is whether the SCANNER can express a mixed file, and that question survives having no mixed file left, so `_response_decode_sites` gained a `root` parameter and the test now writes a one-framed-one-bare module into a scratch tree and requires the scan to name it on both sides. Its null control asserts the real repository has no overlap today, so a green is the scanner working rather than the tree happening to be mixed.\n\n  THE HAND-WRITTEN ENVELOPE FIXTURES ARE NOW HAND-WRITTEN FRAMES TOO. `tests/company/market/test_flex_participation.py` builds its messages from the published schema and never from the world's encoder, which is what makes the round trip evidence rather than a handshake; that property is kept one layer up -- the sender, the credential and the hand-over stamp are written out from the frame form, not produced by calling `frame_venue_message`. Their `schema_version` moved 1 -> 2, and that is a fact rather than a fixture detail: `COUNTERPARTY_REGISTRY` has both flex operators on v2 only, so a v1 line -- readable by this build -- is now refused VERSION_NOT_SPOKEN as a message from a release that does not exist. Framing the feed is what made that distinction reachable at all.\n\n  A DUPLICATE TEST NAME WAS SHADOWING A REAL CONTROL, caught by `ruff` and not by the suite. The credential test added here first carried the same name as the enrolment leg's, and Python's later definition silently replaced the earlier one: the enrolment leg's control had stopped running and the suite was green. Renamed, both run, and the two are deliberately separate nodes -- the legs reach `_verify_frame` by different call paths, and one test proving the rule once would keep passing if either path stopped calling it.\n\n  LANDED: `_frame_feed` in `sim/flex_dispatch.py`\n  LANDED: `handed_over_at` required on all four `*_over_wire` legs in `sim/flex_dispatch.py`\n  LANDED: the framed + operator-checked `observe_response_wire` in `company/market/flex_participation.py`\n  LANDED: `_hand_over_clocks` in `background/flex_dispatch_triad.py`\n  LANDED: `test_every_message_on_BOTH_single_venue_feeds_is_SIGNED_by_the_venues_operator` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_STACKED_feed_carries_TWO_DIFFERENT_signers_in_ONE_list` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_feed_may_not_be_handed_over_without_saying_WHEN` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_a_feed_for_a_venue_NOBODY_OPERATES_cannot_reach_the_wire` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_an_UNFRAMED_settlement_line_is_REFUSED_however_well_formed_it_is` in `tests/company/test_flex_participation.py`\n  LANDED: `test_an_UNREGISTERED_sender_cannot_tell_this_company_it_was_PAID` in `tests/company/test_flex_participation.py`\n  LANDED: `test_a_KNOWN_participant_that_cannot_PRESENT_its_credential_is_refused_on_the_FEED` in `tests/company/test_flex_participation.py`\n  LANDED: `test_a_REGISTERED_participant_may_not_SETTLE_a_venue_it_does_not_OPERATE` in `tests/company/test_flex_participation.py`\n  LANDED: `test_the_INSTRUCTION_feed_is_checked_TOO_and_not_only_the_money_one` in `tests/company/test_flex_participation.py`\n  LANDED: `test_MUTATION_the_operator_table_has_NO_DEFAULT_on_the_FEED_leg` in `tests/company/test_flex_participation.py`\n  LANDED: the root-parameterised `_response_decode_sites` and its rebuilt mutation test in `tests/company/interfaces/test_wall_protocol.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's eight files copied in and only the named part swapped -- never on the shared worktree. The unmutated tree is the null control and was re-established after every mutation rather than assumed: 291 passed, and 291 passed again at the end. M1, the feed leg returned to a bare `decode_response` with its \"sender\" taken from the message the way the enrolment leg used to take its venue: 39 failed, 252 passed -- the six new company-side refusals, the eight framed-fixture tests, both ratchet nodes and the whole live L2/L3 loop, which is the correct blast radius for un-framing a leg the running loop crosses. M2, the wrong-operator refusal removed with the frame intact: 3 failed, 288 passed -- exactly the three authorisation tests, and nothing else, so the frame and the authorisation are separable belts rather than one belt tested twice. M3, that same refusal made FAIL-OPEN on a venue the company holds no operator for (`if expected_operator is not None and ...`): 1 failed, 290 passed, redding ONLY the no-default test -- which is what makes that test the fallback's own control rather than a copy of M2's, since the refusal is otherwise intact and still fires. M4, the whole feed signed by ONE participant: 15 failed, 276 passed -- the two-signer test, the unoperated-venue test and every L3 node, and NOT the L1/L2 single-venue ones, which is precisely the shape that says a single-venue seam could not have caught this.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because every refusal above would also pass on a seam that refused everything. The unframed-line test takes the bare envelope OUT of a frame the world really built, so the accepted and refused messages differ by the frame and nothing else, and asserts the framed one crosses. The wrong-operator test asserts the untouched feed is accepted first and only then moves the signer. The unoperated-venue test emits the same feed at an operated venue cleanly. `test_a_feed_may_not_be_handed_over_without_saying_WHEN` asserts each leg WITH a stamp returns messages, so the TypeError is the missing argument and not a broken leg. The ratchet's mutation asserts the real tree has no overlap, so its green is the scanner and not the tree.\n\n  THE INSTRUMENTS, none of them edited here, each run in TWO detached worktrees -- one at clean HEAD, one carrying this pass -- rather than on the shared tree, where `docs/reports/run_output_latest.json` is uncommitted and moves census channels D and F. `tools.wall_channel_census`: IDENTICAL on every channel, exit 0 both times, including the pre-existing `paid down on C_envelope (1)` line. Identical is the correct reading: the census scores whether both roles of a seam are live and whether a version still means what it says, and a transport frame around an unchanged envelope is neither. `tools.epistemic_verifier --all`: PASS on 544 files, both trees. `tools.wall_crossing_dispositions`: OK both trees, 6 live crossings (4 direct, 2 indirect via a bridge package), 91 ruled (cut 85, owed 6, grandfathered 0) -- this landing creates no wall crossing and rules none away. `tools.company_network_isolation`: IDENTICAL, exit 1 at HEAD and exit 1 here -- the four frozen routes, unchanged.\n\n  EVIDENCE: tests/sim/test_flex_dispatch.py 53 passed (49 at HEAD, 4 added); tests/company/test_flex_participation.py 28 passed (22 at HEAD, 6 added); tests/company/market/test_flex_participation.py 14 passed (unchanged count, every fixture reframed); tests/company/interfaces/test_wall_protocol.py 165 passed; tests/background/test_flex_dispatch_triad.py 30 passed; 3379 passed across the downstream consumers (tests/interface, tests/company/interfaces, tests/company/market, the payment observation consumer, the payment seam adapter, the wall channel census and the susceptibility wire); the four mutations above with the figures given; `ruff check` clean on all eight changed files.\n\n  A RED THAT IS NOT MINE, RESOLVED BEFORE REACTING TO IT. `tests/architecture` reports 5 failed, 286 passed, 1 skipped: two nodes in `test_no_committed_store_claims_an_unlanded_falsifier.py` and three ruff-ratchet nodes in `test_static_quality_ratchet.py`. All five fail IDENTICALLY in a detached worktree at clean HEAD with none of this pass's files present -- measured on both trees, 137s and 136s, same five names -- so they are pre-existing and another lane's, the same five passes 60 and 61 recorded, and the ruff one matches this project's own filed finding that the ratchet is red at HEAD. Filed, not fixed (SELF_INTERRUPT_DISCIPLINE).\n\n  WHAT DID NOT CHANGE. NO PUBLISHED FIGURE MOVED and none was recomputed: nothing this pass touches produces a figure, and `test_TRANSPORT_DOES_NOT_MOVE_THE_BELIEF` still holds -- two companies reading the same settlement run, one as objects and one as framed bytes, agree to the last float. The L2 and L3 gaps read exactly what they read before. `file_scope` gained ONE file, `tests/company/market/test_flex_participation.py`: its fixtures had to be reframed and the atom's scope named the module's other test file only.\n\n  WHAT REMAINS. (a) Q13's last leg: `company/comms/susceptibility_estimator.py`, the only bare response decode left in `company/**` and now the only entry in `_BARE_CROSSING_SITES`. Its production module is outside this atom's `file_scope` and framing it means giving `simulation/conversation_response.py` a participant identity, which is a wider change than this one. (b) The feed reader's own book-anchored refusal, described above. (c) There is still no cryptography anywhere on this wall: what is modelled is the REFUSAL and the shape of a participant proving itself, not SMKI/DIP signing. (d) Give the switch exchange a production caller -- pass 61 measured `CoSProcess` as having none at all, so wiring it to the register would join two dark things, and that measurement stands. (e) Q5's no-response horizons at 1 min / 24 h / 5 working days, which `crossing_silence` answers in part and which no flex feed is aged by yet.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-61 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half. The target decision recommended at passes 38-61 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
map_notes:
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
