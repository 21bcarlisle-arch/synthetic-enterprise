- "2026-08-19 pass 11 BUILD, level HELD at 2, loop_stage stays build. THE FOUR MISSING ENUMERATORS\nARE BUILT. Everything below is observed-with-evidence unless labelled inferred (R9).\n\nMEASURED AT: HEAD 84a3bc5f1, worktree, with this atom's file_scope clean before the pass.\n\nWHAT THIS PASS TOOK AND WHY IT IS THE ATOM'S OWN CRITERION AND NOT A NEW PROGRAM. The 2026-08-15\ncensus (docs/design/EP6_WALL_CONFORMANCE_CENSUS_DISCOVER.md) section 8 rejected the obvious exit\ncriterion in as many words -- \"an exit criterion of the form 'every crossing is envelope-borne or\ngrandfathered' is NOT directly testable at HEAD today, and an atom that adopted it would be\nadopting an unfalsifiable criterion\" -- and named the testable one: \"each channel gets its own\nenumerator and its own shrink-only list, and the exit criterion is that every channel HAS an\nenumerator\". Two of six had one. This pass built the other four.\n\n  tools/wall_channel_census.py, 6 enumerators, 159 previously-invisible crossings:\n    A  direct import edge      3 members   DELEGATED to epistemic_wall.crossings_at\n    B  indirect via a bridge   2 members   DELEGATED to epistemic_wall.indirect_crossings\n    C  the envelope           19 members   NEW  (importer module, interface.contracts seam)\n    D  the same-step port      7 members   NEW  (tools/*_port module, importer)\n    E  structural Protocol     2 members   NEW  (business-side file, Protocol class name)\n    F  published artefact    131 members   NEW  (run-output key, business-side reader file)\n\nA AND B ARE REPORTED AND DELIBERATELY NOT FROZEN. WALL_CROSSING_DISPOSITION_REGISTER.md plus\ntools/wall_crossing_dispositions.py already enforce a shrink-only rule on exactly that subject.\nFreezing them a second time here would put two controls on one subject, which does not double the\nsafety: it means an ordinary ruled change reds a gate whose owner is another file, and\nfeedback_control_that_can_only_fail_wedges says such a gate is routed around within a day. So the\ntool REPORTS all six (channels_without_an_enumerator() is the exit criterion as a function, and it\nreturns []) and FREEZES the four that had no owner.\n\nR15 -- 25 tests, and both directions shown for every guard.\n  MUTATIONS THAT MUST FIRE, one per frozen channel plus two shapes that a naive control misses:\n  a new envelope importer; a new port importer; A SIXTH PORT appearing; a new key reader; A SECOND\n  KEY READ BY AN ALREADY-LISTED READER; and a declared channel whose enumerator is removed. All\n  RED without the guard.\n  NULL CONTROLS THAT MUST NOT FIRE (move the sample, not the law): an unrelated module added to\n  the same trees; a WORLD-side module reading the same published key; a business-side literal that\n  is not a published key; a non-Protocol class. All leave the census byte-identical.\n  FAIL-CLOSED, six branches proven: empty artefact (an empty denominator makes channel F vacuously\n  conformant), artefact absent at the rev, bogus rev, missing baseline, baseline missing a frozen\n  channel, baseline with no `frozen` object. An unavailable check is a FAILED check.\n  TAUTOLOGY CHECK: the baseline is a committed FILE and the current reading is computed from a\n  tree. test_the_baseline_is_a_FILE_and_editing_it_changes_the_verdict moves ONLY the baseline\n  against a byte-identical tree and the verdict flips, so the comparison has a subject outside the\n  reading it checks.\n  ZERO IS NOT REFUSED, on purpose. A channel measuring zero members is a channel fully paid down,\n  and a control pinned to a non-zero count reds on its own success case\n  (feedback_a_control_pinned_as_a_count_reds_on_its_own_success_case). What IS refused is an empty\n  DENOMINATOR, which is a different fact wearing the same number.\n\nTHE CONTROL'S CALLER IS THE COMMIT, NOT A PERSON TYPING IT. pre_commit_test_gate now runs\n_wall_channel_census_check against `git write-tree` -- the tree the commit WOULD create -- placed\nbeside the wall-register step and before the pure-docs early return, because a commit that widens\nthe envelope or the artefact may select no test targets at all. HEAD would have been the wrong\nsubject for the reason this file already learned once: it reds the commit that REPAIRS a\ndivergence and passes the one that introduces it. Measuring the would-be tree also puts both sides\nof channel F on ONE ref -- the readers and the artefact their keys come from -- which is the\ndiscipline a two-sided census needs. Cost measured: 5.4s.\n\nTHE FIXTURE FOUND A REAL FAIL-OPEN IN THIS PASS'S OWN FIRST DRAFT. Channel D discovered its ports\nfrom the EDGE LIST (any module named tools.*_port that appeared as an import source). A port that\nimports nothing produces no edge, so the simplest port anyone could write was invisible to the\nchannel built to see ports. test_MUTATION_a_SIXTH_port_appearing built exactly that and got a\nclean bill of health. Ports are now discovered from the FILESYSTEM. Recorded because the shape is\ngeneral: deriving a population from a by-product of that population's behaviour makes the inert\nmembers invisible, and the inert member is usually the new one.\n\nTWO CORRECTIONS TO THE CENSUS ITSELF, both measured here:\n  1. CHANNEL A HAS SHRUNK 6 -> 3 since 2026-08-15 (KNIFE paydown). The three survivors are\n     simulation.customer_events -> {company.crm.churn_model, saas.churn_model,\n     saas.home_move_win_rate}. Reported, not filed as a finding: this is the programme working.\n  2. THE CENSUS'S CHANNEL-D READER LIST WAS PARTLY WRONG. Section 4 names\n     company/trading/credit_limits.py (via CreditCheckResult) and\n     company/interfaces/bitemporal_event_log.py (via MarketDataPort) as reaching the business side.\n     Neither imports a port: both only MENTION one in a docstring or comment. The AST enumerator\n     finds 7 real import edges and neither of those is among them. The census's prose was built\n     from references, not from edges -- the substring-census shape\n     (feedback_a_substring_census_can_be_100_percent_false_positives_from_a_longer_common_word).\n     The enumerator is now the authority and the census is the narrative.\n\nWHAT THIS PASS DOES NOT ESTABLISH, stated here rather than discovered later:\n  * Channel F's 131 is the CHANNEL WIDTH, not the count of SIM-origin crossings. Per-key\n    provenance is unanswerable for 38 of the keys by construction (FINDING 1, the 2026-08-15\n    walk): the orchestrator binds both sides' values into one row in one function scope. A\n    shrink-only width is the honest control that walk leaves available.\n  * Channel E's 2 is a SUPERSET -- every business-side Protocol declaration, not only those a\n    world object satisfies. Deciding satisfaction needs a type checker. Superset is the safe\n    direction for a ratchet: a new Protocol must be LOOKED at.\n  * Channel F's reader side is literal-access only. A computed key is unresolvable statically, so\n    the reader set is a LOWER BOUND rather than a total.\n\nL3 IS NOT CLAIMED, and the reason is sharper than pass 10's. The enumerator criterion is met for\nthe first time -- but (a) it was met by code written in THIS pass, with no HARDEN pass and no\nExpert Hour against it, and the map's own L3 definition is \"passed the full loop incl. HARDEN;\nExpert Hour: this is real\"; and (b) channel D's named substance is still undone. Section 8 said of\nthe ports: \"they already own a version field, and putting it on the wire is the whole of their\nconformance\". Re-measured this pass: `include_schema_version` appears in ZERO call sites across\nsimulation/, company/, saas/ and background/ -- every live call takes the False default, exactly as\nthe census found four days ago. Moving to L3 now would be claiming the criterion's letter while\nits stated content is unbuilt.\n\nNEXT MOVE, named so the next pass does not have to re-derive it: migrate the three live port call\nsites (simulation/run_phase4c_on_phase2b.py:237, :324, simulation/run_phase2b.py:1647) onto\ninclude_schema_version=True, so schema_version leaves the process on channel D for the first time.\nThat is channel D's whole conformance by the census's own definition, it is small, and it is\ncheckable on the published artefact rather than in a fixture."
map_notes:
  origin_note: 'C-S3 (asynchronous wall contracts: request and response are separate events in time, never same-step) is the whole point and the thing most likely to be quietly dropped, because same-step is easier and works until it doesn''t. The SIMPLICITY GUARD binds equally hard: no adapters-for-future-adapters, no protocol cathedral -- the wall already provides the seam. Gates every named adapter below.'
  name: 'Protocol typing of the wall: every SIM/company boundary crossing becomes a typed, versioned message with an explicit request/response separation in time, so a mock counterparty and a real one are indistinguishable to the company. The wall IS the go-live seam. Named in the ruling §1 as an Epoch-3 floor item. W4_1_typed_adapters (SATURATED) built the adapter PATTERN; this is the protocol layer every named adapter below plugs into.'
