- "2026-08-21 pass 56 LAND, level HELD at 2, loop_stage stays build. PASS 55 WROTE ITSELF DOWN AS THE LANDING AND DID NOT COMMIT EITHER, WHICH MAKES SIX PASSES RUNNING -- AND ITS FIGURES, RE-MEASURED AT A NEW HEAD BY A SEAT THAT WAS NOT THERE, ARE IDENTICAL. The tick drew EP6 and found the same six files dirty against HEAD (three production, three test, 578 insertions / 39 deletions), the store rolled to archive chunk 039 with the roll uncommitted, the map count already moved to 51, and TWO finished rows -- pass 54's and pass 55's -- both describing a tree no commit held. This pass is the commit. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD c43439739, one publish-provenance commit later than the HEAD pass 55 measured (72d628afd) and touching a single site data file, nothing in this atom's file_scope.\n\n\n  WHAT THIS PASS RE-MEASURED, AND WHY THESE AND NOT THE MUTATION BATTERY. Pass 55 was itself the landing-tick verifier of pass 54 and added no production byte, so re-running M1/M2/M3 would check pass 54's code against pass 54's claim a second time and say nothing about the only thing that has changed since: the HEAD underneath. What CAN move under a new HEAD is every instrument that reads the whole tree, so those are what this pass ran, and all four reproduce to the digit. The three file_scope test files: 72 passed -- the same number pass 55 reports as its unmutated null. `tools.wall_crossing_dispositions`: OK, 6 live crossings (4 direct, 2 indirect via a bridge package), 91 ruled (cut 85, owed 6, grandfathered 0), so the landing still creates no wall crossing and rules none away. `tools.epistemic_verifier --all`: PASS on 544 files. The store pair tests/design/test_simplifications_store.py + test_atom_notes_store.py: 60 passed.\n\n\n  THE ROLL LANDS WHOLE OR NOT AT ALL. Pass 55's append crossed ROLL_WATERMARK, so the live file and `archive/EP6_wall_protocol_typing.039.yaml` are one atomic write, and the count invariant reading them is TREE-WIDE -- half a roll refuses every lane's commit, not only this atom's. This row rolls the store again where the watermark demands it; every chunk moves in the same pathspec as the live file, and the map's `simplifications_count` moves in the same commit. The map edit landing here is pass 54's and pass 55's as well as mine: the file_scope widened by the four files pass 54 wrote in, and the count 49 -> 52.\n\n\n  WHAT DID NOT CHANGE. No production line in this commit is this pass's: the six files are pass 54's, unmodified by pass 55 and unmodified by me, and the only bytes pass 55 and pass 56 add between them are two rows and a count. No published figure moved and none was recomputed. THE LEVEL DOES NOT MOVE and is not re-litigated: Q9 and Q15 need an act in a RESERVED class, so level_target 3 is unreachable in this epoch whatever is built.\n\n\n  WHAT REMAINS, inherited unchanged and not re-opinionated. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first. (b) The venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations` -- so `settlement_solicited` stays a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers. (c) Q3's BRANCHING conversation, left by passes 44, 47 and 53. (d) The census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, filed by passes 48 and 50 and still filed.\n\n\n  THE LESSON, now measured twice rather than argued once. Pass 55's case for writing a row that lands no capability was that a landing-tick check whose only recorded outcome is FIRED cannot be told from one that always fires, and it supplied the first empty run. This is the second, at a different HEAD and from outside the build. The cost side is visible in the same place: six rows of prose have now been written about a body of work that took one commit to land, and the discipline only earns that cost while the commit follows in the SAME tick as the row. It did here."
- "2026-08-21 pass 57 BUILD, level HELD at 2, loop_stage stays build. THE WORLD COULD STILL DISPATCH A UNIT NOBODY HAD ENROLLED; ONLY THE HARNESS OBJECTED. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 7f94bae95, with all five touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing.\n\n  WHICH ITEM, AND WHY IT WAS ALREADY CHOSEN FOR ME. Passes 54, 55 and 56 each closed with the same four-item remaining list and the same sentence about its second item: \"the venue does not REFUSE to dispatch an unregistered unit -- `dispatch_and_settle` never consults `VenueRegistrations`, so `settlement_solicited` stays a harness observation rather than a world law. That is the next item and it is a change to dispatch physics with several callers.\" Three passes named it and none took it, which is exactly the shape a deferred item takes on the way to becoming permanent. `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- with five payable rows and an explicit instruction not to record `infeasible_here`, so the payable half was taken again.\n\n  THE DEFECT, STATED AS THE DIFFERENCE BETWEEN A REPORT AND A RULE. Pass 54 gave the L2 loop a first leg and scored `settlement_solicited`: the unit read off the DECODED settlement lines against the unit the venue said it registered. Two quantities from two sides, and it is a real check -- but it is an OBSERVATION made after the fact by the one layer allowed to see both sides, and the world went on being able to produce the statement being observed. Nothing in `sim/**` consulted `VenueRegistrations` before putting a line on the wire, so `unit_id` remained a KEYWORD DEFAULT and a unit that had never enrolled was still settleable; the only thing standing between this loop and a payment nobody had asked for was a harness that remembered to look. A gap the harness can only report is not a law the world obeys, and the next loop written -- L1 and L3 both, today -- simply would not look.\n\n  WHAT LANDED, AND THE FOUR DECISIONS INSIDE IT THAT COST SOMETHING. (1) CONTAINMENT, NOT OVERLAP. `VenueRegistrations.covers` asks whether a declared availability window CONTAINS the delivery window, where the pre-existing `overlapping` asks whether two registrations collide. They are different questions and the class now holds both: overlap is right for \"may I register this?\" and wrong for \"may I call this?\", because an instruction that starts inside availability and runs past its end calls the unit over minutes it never offered. The mutation collapsing one into the other is run below and is the plausible mistake rather than an invented one. (2) THE BOOK IS A REQUIRED KEYWORD on both wire legs, not a defaulted one. A `registrations=None` that skips the check is this project's own fail-open pattern -- the control passes for every caller who forgot the argument -- so the legs refuse to be called without it and a test asserts the TypeError. (3) THE CHECK READS WHAT WAS EMITTED, not what was passed in: `unit_id`, `venue` and both window bounds come off the constructed payload, so an emitter that ignored its own `unit_id` argument is caught by the same check that catches a stranger. (4) AN EMPTY BOOK REFUSES. `covers` returns None for a venue that has registered nobody, and None is a refusal; the fail-open case has its own test because that is where this class of control usually dies.\n\n  THE OWNERSHIP MOVE THAT MADE IT POSSIBLE, and it is the part with a portability argument rather than a defect behind it. The venue's `VenueRegistrations` was minted INSIDE `_FlexEnrolmentDesk`, a company module, and died with the seam object -- so the counterparty's state was born on the wrong side of the wall and nothing else in the world could consult it. It is now injectable (`build_sim_interface(flex_registrations=...)`), and the HARNESS -- the one layer that holds the world -- constructs it, hands it to the seam as counterparty state, and hands the SAME instance to the venue's dispatch legs. What the venue registered and what the venue will honour became one fact instead of two that happened to agree. Nothing on the company's surface changed: `test_the_seam_publishes_no_door_onto_the_VENUES_OWN_book` is untouched and green, and `flex_registrations=None` keeps the old behaviour for every caller with no world to speak of.\n\n  A CONTROL REDDING ON ITS OWN SUCCESS CASE, MET AGAIN AND FLIPPED RATHER THAN DELETED. `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_scores_UNSOLICITED` asserted the harness SCORED a stranger's settlement unsolicited. With the world refusing, the stranger's lines never reach the wire to be scored, so the test reds -- this project's recorded class, and the correct move is the one pass 53's addendum used: its useful half was never \"the score is False\" but \"a unit nobody enrolled must not be settled\", and asserting the REFUSAL is strictly stronger than asserting the score. It is flipped. The observation is NOT thereby made unfalsifiable, which would be the quiet cost: a second test mutates the DECODER instead of the emitter (a mis-keyed feed, or the same statement read for the wrong party -- downstream of the law, which fires at emission) and `settlement_solicited` still scores False.\n\n  LANDED: `UnregisteredDispatch` in `sim/flex_dispatch.py`\n\n  LANDED: `covers` in `sim/flex_dispatch.py`\n\n  LANDED: `_require_registered` in `sim/flex_dispatch.py`\n\n  LANDED: `SolicitedRegistration` in `background/flex_dispatch_triad.py`\n\n  LANDED: `test_MUTATION_a_unit_this_venue_NEVER_REGISTERED_cannot_be_settled_at_all` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_an_EMPTY_book_refuses_rather_than_passing__the_fail_open_case` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_call_running_PAST_the_declared_availability_is_refused` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_registration_at_ANOTHER_VENUE_does_not_license_this_one` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_the_book_is_REQUIRED_and_not_a_defaulted_argument` in `tests/sim/test_flex_dispatch.py`\n\n  LANDED: `test_MUTATION_a_world_settling_a_unit_NOBODY_enrolled_is_now_REFUSED` in `tests/background/test_flex_dispatch_triad.py`\n\n  LANDED: `test_the_company_holds_the_SAME_reference_the_world_will_honour` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's five files copied in and only the named part swapped -- never on the shared worktree, which carried 200 other-lane modifications throughout. The unmutated tree is the null control: 62 passed, and it was re-run between mutations rather than assumed. M1, `covers` returns a reference unconditionally (the book is never consulted): 6 failed, 56 passed -- all four refusal tests plus the triad's flipped refusal and the same-book test, which is the correct blast radius for removing the consult itself. M2, containment collapsed to `overlapping`: 1 failed, 61 passed, redding exactly the boundary test. M3, `venue` dropped from the book's key so a Capacity Market registration licenses a Balancing Mechanism call: 1 failed, 61 passed, redding exactly its named test. M4, the fail-open shape -- `registrations` given a `None` default and the loop skipped when absent: 1 failed, 61 passed, redding exactly the required-keyword test. A NOTE ON M2, because the first version of it proved nothing and the correction is the lesson: the fixture originally shortened the registration by a WHOLE period, which leaves the last delivery window butt-jointed to the registration -- and overlap refuses a butt joint too, so the mutation passed. It is cut by HALF a period, which is the only shape where overlap and containment actually disagree. Every null control is stated with its test: the exactly-covering book accepts; the forged-venue book licenses the venue it was really made at; the same book returns None for a unit it never registered.\n\n  NO PUBLISHED FIGURE MOVED, measured rather than reasoned. HEAD's `measure_l2` was run in the detached worktree and this tree's beside it over three settings (no delivery model; a stochastic delivery model; a stochastic model with a biased baseline), with the SAME injected synthetic record on both sides -- injected deliberately, because a comparison across two data caches is this atom's own recorded two-trees artefact. All 15 reported keys per setting, 45 across the three, are identical; NO key was lost and NO key was added. Transport is not a belief and neither is a refusal that never fires.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.epistemic_verifier --all` PASS on 544 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-56, so this pass creates no wall crossing and rules none away. `tools.company_network_isolation` exits 0 on its four frozen routes and its R15 battery, with the two epistemic-wall ratchets, is 44 passed with the allowlist unwidened -- the harness-to-world edge added here opens no route. `tools.wall_channel_census` reads IDENTICALLY at HEAD and on this tree on every channel this pass could touch; the two places the readings differ are both another lane's and are named rather than glossed: channel D/F move because `docs/reports/run_output_latest.json` is uncommitted in the shared tree (which is also what takes the census exit code to 1), and the `paid down on C_envelope (1)` line is present at a CLEAN HEAD too, so it was neither opened nor cleared here.\n\n  EVIDENCE: tests/sim/test_flex_dispatch.py 38 passed (32 at HEAD); tests/background/test_flex_dispatch_triad.py 24 passed (22 at HEAD); 219 passed across the downstream consumers (tests/interface, tests/company/interfaces/test_sim_interface.py, tests/company/test_flex_participation.py, tests/sim/test_flex_dispatch_stacked.py); the four mutations above with the figures given; ruff clean on all five changed files.\n\n  WHAT DID NOT CHANGE. `emit_dispatch_instructions_over_wire` is belted and still has NO production caller -- it is a leg with a control and no traffic, stated the same way pass 53 stated `FlexEnrolmentBook`, not counted as traffic. The in-process `emit_dispatch_instructions` / `emit_settlement_lines` are deliberately UNBELTED: they are constructors, they are what this module's own truth tests measure, and belting them would put the check on the object path as well as the wire without adding a refusal the wire does not already make.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-56 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS. (a) `measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first, and until they do the STACKED wire emitters cannot be belted -- belting them without a registration leg would refuse every stacked run, which is why they are not belted here. That is now the next item, and it is the same item as (a): one repair, not two. (b) Q3's BRANCHING conversation, left by passes 44, 47 and 53. (c) The census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, filed by passes 48 and 50 and still filed. The target decision recommended at passes 38-56 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-21 pass 58 BUILD, level HELD at 2, loop_stage stays build. THE LAST UNBELTED WIRE LEGS WERE THE STACKED ONES, AND THE LOOP THAT READ THEM HAD JOINED NO MARKET. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 2f2aed651, with all four touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing.\n\n  WHICH ITEM, AND IT WAS NAMED BY THE PASS BEFORE IT. Pass 57 closed with a four-item remaining list whose first item was its own: \"`measure` (L1) and `measure_l3` still begin at a dispatch instruction; only the L2 loop registers first, and until they do the STACKED wire emitters cannot be belted -- belting them without a registration leg would refuse every stacked run.\" `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again. This is Q13's axis: the crossings that do not check who is speaking, one layer in.\n\n  THE DEFECT, AND IT IS NOT THE PASS-57 ONE REPEATED. `measure_l3` is the loop that scores the STACKING over-claim -- the real failure mode of a real aggregator that books the same MW at two venues. It emitted both feeds for `FLEX_UNIT_1`, a KEYWORD DEFAULT, at venues nobody had enrolled with, and the company then formed a stacked belief about contention between markets it had never joined. So the measurement was of a world that could not have happened: a portfolio cannot contend at a venue that never registered it. The single-venue belt could not have caught this even had it been applied, and that is the whole content of the pass: the stacked question is (unit, VENUE), not unit. A party correctly registered at the Balancing Mechanism and instructed at a DSO local constraint is a KNOWN unit at an unjoined venue, and a check keyed on the unit alone waves it through -- then the party is instructed and paid at a market it never entered.\n\n  WHAT LANDED, AND THE THREE DECISIONS INSIDE IT THAT COST SOMETHING. (1) THE COMPANY REGISTERS FROM ITS OWN DECLARATION, not from `truth.venues`. They hold the same specs on the default path, so this buys nothing today and is the difference between a control and a tautology: a loop that registered from the world's own book could never be short a venue, which is precisely the defect the belt exists for. `venues` comes from the caller. (2) ONE BOOK, N REGISTRATIONS. Every venue is asked separately -- a real party signs a separate agreement per market function -- and the answers land in ONE `VenueRegistrations` handed to both emitters. `VenueRegistrations` already scopes by (unit, venue), so one unit into several venues over one window is accepted (the legitimate stacking this atom models) while a second registration at the SAME venue over an overlapping window is still refused UNIT_ALREADY_ENROLLED. Nothing in that class changed. (3) `unit_id` ON `StackedRegistration` RAISES RATHER THAN PICKING when the outcomes disagree: a stacked portfolio is ONE physical unit offered into several venues, which is what makes the MW contend at all, so two unit ids would mean the loop had silently become two portfolios and the conservation law it measures would be scoring an aggregate nobody owns.\n\n  WHAT L1 TURNED OUT TO BE, corrected against the code rather than carried forward from the sentence that named it. Pass 57's item named `measure` alongside `measure_l3`, and on inspection `measure` EMITS NOTHING OVER THIS SEAM AT ALL: it holds truth and belief in one process and its company side reads `outturn_price`, which is a different channel. There is therefore no wire leg in L1 to belt and no crossing for a registration to license; giving it one would be ceremony, and a registration nothing consults is exactly the shape this atom keeps catching elsewhere. The item was two loops in one sentence and only one of them had a crossing. L1 is struck from the remaining list on that ground rather than closed by having been done.\n\n  LANDED: `registrations` as a REQUIRED keyword on `emit_dispatch_instructions_stacked_over_wire` in `sim/flex_dispatch.py`\n  LANDED: `registrations` as a REQUIRED keyword on `emit_settlement_lines_stacked_over_wire` in `sim/flex_dispatch.py`\n  LANDED: `StackedRegistration` in `background/flex_dispatch_triad.py`\n  LANDED: `solicit_registration_stacked` in `background/flex_dispatch_triad.py`\n  LANDED: `_record_window` in `background/flex_dispatch_triad.py`\n  LANDED: `feeds_solicited` in `background/flex_dispatch_triad.py`\n  LANDED: `test_MUTATION_a_stacked_world_calling_a_unit_NOBODY_enrolled_is_refused` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_MUTATION_a_book_missing_ONE_venue_refuses_only_that_venues_feed` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_an_EMPTY_book_refuses_the_stacked_legs_too__the_fail_open_case` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_MUTATION_a_stacked_call_running_PAST_the_declared_availability_is_refused` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_the_stacked_book_is_REQUIRED_and_not_a_defaulted_argument` in `tests/sim/test_flex_dispatch.py`\n  LANDED: `test_MUTATION_a_stacked_world_calling_a_venue_the_portfolio_NEVER_JOINED_is_REFUSED` in `tests/background/test_flex_dispatch_triad.py`\n  LANDED: `test_the_L3_solicited_OBSERVATION_can_still_be_False__it_is_not_always_green` in `tests/background/test_flex_dispatch_triad.py`\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's four files copied in and only the named part swapped -- never on the shared worktree, which carried 280 other-lane modifications throughout. The unmutated tree is the null control: 73 passed, re-established between mutations rather than assumed. M1, the belt removed from both stacked legs (the shape this build shipped in until this pass): 5 failed, 68 passed -- all four new refusal tests plus the triad's, which is the correct blast radius for removing the consult itself. M2, `responses[:1]` -- check the first message and emit the rest, the plausible mistake on a multi-response leg: 1 failed, 72 passed, redding exactly the missing-venue test and nothing else, which is what makes that test the stacked-specific one rather than a copy. M3, the fail-open shape (`registrations` given a `None` default and the loop skipped when absent): 1 failed, 72 passed, redding exactly the required-keyword test. M4, `feeds_solicited = True` hardcoded -- the observation reporting its own intention: 1 failed, 72 passed, redding exactly the not-always-green test.\n\n  NULL CONTROLS, INSIDE THE TESTS RATHER THAN BESIDE THEM, because three of the four refusals above would also pass on a book that refused everything. The full book admits both stacked feeds. The PARTIAL book (one venue registered, two called) licenses its own venue's feed when handed a truth carrying only that venue -- so the refusal is the missing registration and not an inert book. The exactly-covering book accepts where the half-period-short one is refused; half a period, not a whole one, because a whole one leaves the window butt-jointed and `overlapping` refuses a butt joint too, so it would not discriminate (pass 57's recorded correction, reused rather than rediscovered). And the restored `solicit_registration_stacked` runs the same record clean.\n\n  THE FALSIFIABILITY OF `feeds_solicited`, which is where an observation sitting downstream of a law usually dies. The world now REFUSES at emission, so a check that read the emitted messages could only ever be True. This one reads the DECODED feeds, so the discriminating mutation is downstream of both: an instruction read for a venue the company never joined still scores False. It is the INSTRUCTION leg and not the settlement leg, and the reason is recorded because the first attempt proved nothing: `learn_delivery_ratio_from_lines` ALREADY refuses to learn from a settlement line at a venue the company has no offer in, so mutating that leg raises there and says nothing about this observation at all.\n\n  NO PUBLISHED FIGURE MOVED, measured rather than reasoned. HEAD's `measure_l3` was run in the detached worktree and this tree's beside it over three settings (perfect delivery; a stochastic delivery model; a SOURCED Capacity Market availability price, which is the only setting that exercises the AVAILABILITY venue and its registration). All 15 reported scalar keys per setting, 45 across the three, are IDENTICAL; NO key was lost. One key was added, `feeds_solicited`, and it is a structural fact rather than a figure -- a registration is not a belief and neither is a refusal that never fires.\n\n  THE INSTRUMENTS, none of them edited here, so each reading is an outside verdict. `tools.epistemic_verifier --all` PASS on 544 files. `tools.wall_crossing_dispositions` OK -- 6 live crossings (4 direct, 2 indirect), 91 ruled (cut 85, owed 6, grandfathered 0), unchanged from passes 53-57, so this pass creates no wall crossing and rules none away. `tools.company_network_isolation` exits 0 on its four frozen routes. `tools.wall_channel_census --worktree` was diffed line-for-line against HEAD's reading: channels A, B, C and E are IDENTICAL, including the `paid down on C_envelope (1)` line, which is present at HEAD too and was therefore neither opened nor cleared here. The two channels that differ (D and F) are another lane's and are named rather than glossed: `docs/reports/run_output_latest.json` is uncommitted in the shared tree, which is also what takes the census exit code to 1 on this tree and left it 0 in the clean worktree.\n\n  A CARRIED CLAIM THAT WAS FALSE WHEN I INHERITED IT, and correcting it is the more useful half of this paragraph. Passes 50 and 57 both closed saying the census's `LEG_ENVELOPE_NAMES` scores WallRequest and WallResponse only and is therefore blind to the interim and notification legs. IT IS NOT, and has not been since pass 51: the live lookup carries all four names, the finding that asked for it (WORKER_FINDING_THE_WALL_CENSUS_SCORES_TWO_LEGS_OF_A_FOUR_LEG_WALL_2026-08-21) is DISCHARGED with five named tests landed at e84b6d54c and sits in `docs/staging/done/`, and its four discharging nodes are green at this tick. Pass 57 restated pass 50's sentence without re-reading the tool -- the record outran the code, in the direction that costs an atom a repair it thinks it still owes. Struck from the remaining list on measurement, not on having been done here. What IS still true, and is a different and smaller thing: the census's leg model does not score the STACKED flex feeds separately from the single-venue ones, so this pass's belt is invisible to it either way -- the reading is unchanged by design and not by blindness.\nEVIDENCE: tests/sim/test_flex_dispatch.py 43 passed (38 at HEAD, 5 added); tests/background/test_flex_dispatch_triad.py 30 passed (24 at HEAD, 6 added); 311 passed across the downstream consumers (tests/sim/test_flex_dispatch_stacked.py, tests/company/test_flex_participation.py, tests/interface, tests/company/interfaces/test_sim_interface.py, tests/company/interfaces/test_wall_protocol.py); the four mutations above with the figures given; `ruff check` clean on all four changed files.\n\n  WHY THE LEVEL STILL DOES NOT MOVE, inherited from passes 38-57 and not re-litigated: Q9 and Q15 need an act in a RESERVED class (contacting real organisations, spending real money), so level_target 3 is unreachable in this epoch whatever is built, and the ceiling says explicitly NOT to record `infeasible_here` because that verdict would retire the payable half.\n\n  WHAT REMAINS, one item shorter and one item struck. (a) Q3's BRANCHING conversation, left by passes 44, 47 and 53 -- now the next item, and the oldest untouched one on the list. (b) STRUCK: the census's `LEG_ENVELOPE_NAMES` third/fourth-leg blindness, carried by passes 50 and 57 and measured false at this tick -- see the correction above. (c) Q13's own second half, and this pass did NOT move it -- said plainly, because a belt and a frame are easy to conflate and only one of them authenticates. `_UNFRAMED_CROSSINGS` in `tests/company/interfaces/test_wall_protocol.py` still names BOTH `company/comms/susceptibility_estimator.py` and `company/market/flex_participation.py`: the flex crossing reads `decode_response`, not `decode_framed_response`, so nothing on it checks WHO is speaking. What landed here is the venue's own registration law -- may this unit be called at all -- which is a different question from whether the message came from the venue it claims. And there is still NO cryptography anywhere on this wall: what is modelled is the REFUSAL, not SMKI/DIP signing. STRUCK: L1's registration leg, for the reason recorded above -- `measure` has no crossing to license. The target decision recommended at passes 38-57 -- retarget this atom to level 2 for epoch 3 and move Q9/Q15 to EP19_counterparty_qualification_paths -- is unchanged and still the director's (R13)."
- "2026-08-21 pass 60 BUILD, level HELD at 2, loop_stage stays build. Q3'S OTHER EXAMPLE IS NOT A LINE, AND THE REGISTER ANSWERED IT WRONGLY RATHER THAN NOT AT ALL. Everything below is observed-with-evidence unless labelled inferred (R9). MEASURED AT: HEAD 2a0568fab, with all six touched files clean against HEAD before the first edit and still this lane's only modifications on them at landing. (Numbering: the store's last row is pass 58's; 2a0568fab was the landing pass between, which wrote no row of its own.)\n\n  WHICH ITEM, AND IT HAS BEEN THE NEXT ONE FOUR TIMES. Passes 44, 47, 53 and 58 each closed naming Q3's BRANCHING conversation -- pass 53's phrasing was \"a switch with objection is an alternative continuation, not a later position on one path\" -- and pass 58 promoted it to first place: \"now the next item, and the oldest untouched one on the list.\" `python3 -m tools.discovery_pass_ceiling` still reports this atom in its fourth state -- THE TARGET IS UNREACHABLE HERE AND BUILD WORK REMAINS -- naming Q2, Q3, Q5, Q13, Q14 payable and instructing explicitly NOT to record `infeasible_here`, so the payable half was taken again.\n\n  THE DEFECT, AND IT IS NOT THE ONE THE ITEM DESCRIBES. Four passes filed this as missing expressiveness: the primitive could not SAY that an exchange branched. Measured on this build before writing a line, it was worse than that -- the register answered the question, silently, and got it wrong. `ConversationLeg.identity` was (kind, ordinal), and Q3's own second example puts both continuations at the SAME ordinal: a switch confirmed at leg 2 either has an objection raised at leg 3 or has its objection window close clean at leg 3. So the second continuation was not rejected and was not filed alongside -- it was deduplicated as a REDELIVERY of the first, and `_file`'s restatement rule keeps the LATEST arrival. The probe, run at HEAD before the first edit and reproduced as a test: an exchange told `ObjectionRaised` and then `ObjectionWindowClosed` reports `leg_count` 3, `restatements` 1, and `ObjectionWindowClosed` as the surviving leg. A company reading that register starts supplying a customer whose switch was objected, and WHICH OF TWO CONTRADICTORY MARKET OUTCOMES IT BELIEVES IS DECIDED BY NETWORK ARRIVAL ORDER. Nothing raises, no count looks odd, and the exchange reads as one that never diverged.\n\n  WHAT LANDED, AND THE FOUR DECISIONS INSIDE IT THAT COST SOMETHING. (1) THE COUNTERPARTY NAMES THE BRANCH AND THE COMPANY NAMES THE MENU. `WallInterim.branch` is a wire field because which continuation happened is a fact about the world, learned the way everything else on this wall is learned; a company that derived it from the message type would be keeping a private table of every counterparty's vocabulary and calling its own reading of it evidence. What the company supplies from its OWN book is the SET of branches its process has (`open_conversation(branches=)`), and a label outside that set is refused -- `UnaskedLeg`'s reasoning one level up: the wire may report a choice, never extend the menu. (2) CONFLICT IS REFUSED, NOT RESOLVED. The two fail-open shapes available are keep-the-first and keep-the-last, and this register did the second by accident for sixteen passes. Neither is admissible, because the company ACTS differently on the two outcomes -- one switch completes and the other does not -- and a contradiction the counterparty has to be asked about is not a value to be picked from a pair by arrival order. (3) THE BRANCH IS IN THE DEDUPLICATION KEY AS WELL, and this is the half the refusal cannot cover: a TRUNK leg is admissible on every path by design, so the conflict check waves it through, and on the old key a shared leg sharing an ordinal with a branch leg would overwrite it -- the objection would vanish and the exchange would quietly stop having diverged. (4) ONLY NON-TERMINAL LEGS CARRY A BRANCH, which is why `WallResponse` is untouched. Paths diverge before they end; if the first thing distinguishing two outcomes were the ending itself that is not a branch, it is two possible answers, and `WallStatus` plus the payload type already say it. `branch_taken` is read off the interim legs and the terminal closes whichever path the exchange was on.\n\n  A NEW WIRE RELEASE, BECAUSE THE MODULE'S OWN RULE SAID SO AND HAD NEVER BEEN EXERCISED. Adding `branch` to the interim changes a FIELD SET on a message an earlier release already spoke, and `wall_protocol`'s version-table comment has said since pass 47 what that must look like: \"it lands as a new row in this table rather than as an edit to the constants above, and both sets go on being read at once.\" Editing `INTERIM_WIRE_FIELDS` in place would have refused every interim already in flight from a counterparty that has not cut over -- the big-bang cutover Q10 names as the fail -- so v3 is a new row and v2 keeps its narrower set. This is the FIRST release in this build's history to change a field on an existing message: until now every version difference was a new message KIND, and the test asserting the table is not theatre said so in its own docstring (\"no release here has changed a field on an existing message, and inventing one to make the table look busier would be fabrication\"). A real one arrived, so that test now pins BOTH kinds of release difference and the one thing no release has ever touched -- request and response are byte-identical across all three, which is what makes \"no big-bang\" true for a participant that only transacts those two.\n\n  THE ENCODER REFUSES RATHER THAN DOWNGRADES, and it is the decision in the release with a fail-open on the other side of it. An interim on a branch stamped v2 is `FIELD_NOT_IN_VERSION`, not a v2 message with the label dropped: encoding it away would put well-formed bytes on the wire saying the exchange was progressing along the trunk when the sender said it had diverged, and nothing in a valid v2 message records that a field was removed in transit. In the other direction, on v3 the key is PRESENT AND NULL on the trunk and an omitted `branch` is MISSING_FIELD -- an absent field and a field agreeing with the default are the same bytes, so a branch that could be omitted would not be a branch.\n\n  LANDED: `branch` on `WallInterim` in `interface/contracts/wall_envelope.py`\n  LANDED: `INTERIM_WIRE_FIELDS_V3` in `company/interfaces/wall_protocol.py`\n  LANDED: `_V3_VOCABULARY` in `company/interfaces/wall_protocol.py`\n  LANDED: `BranchError` (reasons UNDECLARED_BRANCH, BRANCH_CONFLICT) in `company/interfaces/crossing_conversation.py`\n  LANDED: `TRUNK` in `company/interfaces/crossing_conversation.py`\n  LANDED: `_require_admissible_branch` in `company/interfaces/crossing_conversation.py`\n  LANDED: `branch_taken` in `company/interfaces/crossing_conversation.py`\n  LANDED: `is_branching` in `company/interfaces/crossing_conversation.py`\n  LANDED: `branches` on `open_conversation` in `company/interfaces/crossing_conversation.py`\n  LANDED: `test_the_FULL_SWITCH_WITH_OBJECTION_crosses_the_wall_as_FIVE_legs` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_the_OTHER_CONTINUATION_of_the_SAME_declared_process_ends_differently` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_the_BRANCH_IS_IN_THE_KEY_or_a_contradiction_is_filed_as_a_restatement` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_a_TRUNK_leg_at_the_SAME_ORDINAL_does_not_OVERWRITE_the_branch` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_MUTATION_a_branch_this_companys_PROCESS_DOES_NOT_HAVE_is_REFUSED` in `tests/company/interfaces/test_crossing_conversation.py`\n  LANDED: `test_ENCODING_a_branch_onto_a_release_that_cannot_carry_it_is_REFUSED` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_a_v3_interim_OMITTING_branch_is_MISSING_FIELD_and_never_a_trunk_leg` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_an_OLDER_dialect_is_a_SUBSET_of_the_contract_and_never_a_stranger_to_it` in `tests/company/interfaces/test_wall_protocol.py`\n  LANDED: `test_the_releases_actually_DIFFER_IN_TWO_WAYS_or_this_whole_table_is_theatre` in `tests/company/interfaces/test_wall_protocol.py`\n\n  THE WORKED CASE IS DRIVEN OVER A WIRE, NOT BETWEEN TWO OBJECTS. Every leg of the switch battery is built, passed through `encode_interim`, serialised with `json.dumps`, read back with `json.loads` and decoded before it reaches the register. A register checked against interims it was handed directly would prove the company agrees with itself, which is the R15 TAUTOLOGY for the one question a seam is asked -- the same reasoning pass 53 recorded for the flex round trip. The exchange reads: request, `css.registration_confirmed` (trunk), `css.objection_raised` (branch=objected), `css.objection_upheld` (branch=objected), `css.switch_cancelled`. FIVE LEGS, zero restatements, `branch_taken` = objected. The other continuation is driven from the SAME declaration and ends in `css.switch_completed`, which is the thing a register that could only express a line was unable to say at all.\n\n  R15, FOUR PRODUCTION MUTATIONS RUN AT THIS TICK, each in a detached git worktree at HEAD (`git worktree add --detach`, a real repo) with this pass's six files copied in and only the named part swapped -- never on the shared worktree, which carried 280+ other-lane modifications throughout. The unmutated tree is the null control: 234 passed, re-established between mutations rather than assumed. M1, the BRANCH_CONFLICT refusal removed: 1 failed, 233 passed, redding exactly the contradiction test. M2, `branch` dropped from `ConversationLeg.identity`: 1 failed, 233 passed, redding exactly the trunk-overwrite test -- which is what makes that test the key's own control rather than a copy of the refusal's, since the conflict check is untouched by it and still fires. M3, the UNDECLARED_BRANCH refusal removed: 2 failed