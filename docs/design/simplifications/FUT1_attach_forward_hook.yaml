  origin_note: 'WORK-THIS-CREATES #5 is folded in here as this atom''s acceptance test rather than minted separately, and that is a judgement worth stating: a hook with zero entries is the vacuity fail-open shape R15 names, so ''the mechanism exists'' and ''two real findings are attached through it'' are not separable claims. The R15 shape to hunt is a ledger that renders whatever it is told -- the attachment must be re-derivable from the finding, not merely stored. Simplicity guard: this is a declared field plus a rendering, not a graph database.'
