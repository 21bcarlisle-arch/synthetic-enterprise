atom_id: FUT1_attach_forward_hook
map_notes:
  origin_note: 'WORK-THIS-CREATES #5 is folded in here as this atom''s acceptance test rather than minted separately, and that is a judgement worth stating: a hook with zero entries is the vacuity fail-open shape R15 names, so ''the mechanism exists'' and ''two real findings are attached through it'' are not separable claims. The R15 shape to hunt is a ledger that renders whatever it is told -- the attachment must be re-derivable from the finding, not merely stored. Simplicity guard: this is a declared field plus a rendering, not a graph database.'
map_records:
  evidence:
  - docs/staging/DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08.md
  - '2026-08-09 BUILT L0->L2. Mechanism: background/forward_attachment_register.py -- a finding or DISCOVER mint declares `**Advances:** <atom_id>, ... -- note` on one line of its own body; the ledger is DERIVED from those docs on every read (LAW-C, the open_question_register discipline), never stored by hand. Renderings: docs/design/FORWARD_ATTACHMENT_LEDGER.md (generated, --check fails if it and the docs disagree) and per-atom forward_attachments in site/data/maturity_map.json, rendered as an `N BUILT TOWARD` badge with the source docs on hover in site/project/index.html::mmAtomRow. Parse anomalies are LOUD: unknown_atom / malformed_token / empty_declaration violations, exit non-zero -- never a silent drop. Payload bounded to its own line (the unbounded-field-swallow class). R15: verify_rendering() re-derives and compares; PROVEN both ways -- mutating the control to `return []` (renders whatever it is told, the exact defect the origin note names) fails 3 tests, unmutated passes 19; vacuity guarded (every mutation test asserts the honest derivation is non-empty first). WORK-THIS-CREATES #5 DONE: the heat-pump anchor (WORKER_FINDING_L1_TEXTURE_BAND_IS_GAS_SHAPED_2026-08-08 -> EP16_anchored_generators + EP17_varied_population_draw) and the Clayton misdating (D6_PAYMENT_AGEING_GAP_VALIDITY_DISCOVER -> EP4_collections_journey) are the first three ledger entries, attached by declaring in the findings themselves so they re-derive. Tests: tests/background/test_forward_attachment_register.py 19 passed; site/project/test_project_door.py 30 passed (2 new: badge renders the live value, and is independent of the render). Live derivation over 5,437 docs in 1.2s, 0 violations. Stops at L2 (mechanically real, happy path): no gate wires --check into pre-commit yet, and the count is 3.'
