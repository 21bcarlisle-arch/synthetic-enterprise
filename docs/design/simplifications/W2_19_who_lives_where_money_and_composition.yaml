atom_id: W2_19_who_lives_where_money_and_composition
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05, docs/staging/DIRECTOR_RULING_PEOPLE_MONEY_AND_WHO_THEY_ARE_PHASE1_2026-09-05.md,
    P1 product, third axis of the portfolio draw. THE TWO-LAYER STRUCTURE IS THE RULING: layer one is
    the household you would EXPECT given the postcode and the house (published at small-area level, therefore
    guessable by the company from an address); layer two is how this household DEVIATES from that (the
    single pensioner in the four-bed, the five people in the two-bed flat) -- private, and what the company
    must DISCOVER. GEOGRAPHY IS THE COHERENCE KEY across all three axes; the correlations that matter
    come from small-area data, NOT from an invented correlation matrix. The machine''s own D-SEGMENT pass
    (docs/market_research/segmentation_joint_structure.md) found the defect: twenty-one trait axes, overwhelmingly
    drawn INDEPENDENTLY, with only two couplings built. Build on the existing trait vector and docs/design/SEGMENTATION_WIRING_PLAN.md;
    do not mint a parallel one. Two named quantities STAY EMPTY as R13 curriculum slots -- the can''t-pay/won''t-pay
    split and household switching amplitude -- presented with evidence and a recommended default for the
    director to ratify, never filled. Carries the Spec-006 coverage test amendment from the July-steers
    ruling section 2. AMENDED AGAIN 2026-09-05 by DIRECTOR_RULING_AMENDMENT_MERIT_ORDER_PEOPLE_PHASES_AND_PRACTICE_BOOKS,
    which governs where it conflicts with the people ruling: phase 1 GAINS collections responses (the
    stressed standard-credit household is the largest per-customer swing in the book, minus 786 pounds
    badly managed against break-even well managed), vulnerability and disclosure (the flag GATES PAYG
    conversion and disconnection BY RULE, which makes C32_one_obligation_one_vulnerability_scorer a PRECONDITION
    rather than a sibling -- two scorers currently disagree on every shared term and the one deciding
    disconnection has no caller), moves and change of tenancy (the SIM emits NO move event at all and
    the change-of-tenancy register has no caller, yet renters churn by MOVING not switching), engagement
    archetype forward from phase 2, and expected length of stay. THIS ATOM IS NOW RUNG 1 of the fidelity-effort
    merit order; housing is rung 3 and the weather cells rung 3-4, which INVERTS the order all three were
    minted in this morning. SCOPE ADDED 2026-09-06 by DIRECTOR_RULING_SUPPLIER_USE_CASE_REGISTER_AND_SIM_FIDELITY,
    section 3.1, which folds the use-case fidelity gaps into the phases that already exist rather than
    minting new ones: (a) PAYMENT-ALLOCATION RULES made explicit in the arrears engine -- does a payment
    clear current consumption while arrears persist, or oldest-first -- because use case 1.1''s per-premise
    arrears trajectory is unmeasurable until the allocation is stated rather than implied; (b) GOING-COLD
    BEHAVIOUR, households under-heating relative to what their own physics says they need under stress,
    by vulnerability, which is the SIM-side truth use case 1.2 is scored against and the register marks
    as a straight gap; (c) PER-ASSET USAGE, jointly with the housing atom -- heating, hot water, EV, appliances,
    PV as a DECOMPOSITION of the existing totals, never a second model, with a sum-to-total control, because
    a bill explained by asset class cannot be scored against a total. THE DIRECTOR''S SEQUENCING, same
    day: the use cases themselves are STAGE 3 and none is built until the world and billing are done;
    this second half is STAGE 1 and proceeds now, and its purpose is to tell stage 1 what it is building
    FOR so the samples cover the variation the use cases will need rather than variation for its own sake.
    PRIOR-ART CHECK 2026-09-05, on the director''s instruction, because this atom''s NUMBER collided with
    closed atom W2_13_occupancy_consumption_volume_shape: THAT ATOM HOLDS AND THIS ONE EXTENDS IT, it
    does not rebuild it. Its two artefacts -- simulation/demand_model.py (753 lines) and simulation/dwelling_records.py
    (268 lines) -- are both imported by simulation/run_phase2b.py, the live run loop, verified by AST
    import scan rather than by grep (a grep counts docstrings and dict keys, which is how this seat mis-read
    the neighbouring atom twice today). Occupancy already reaches consumption. What is NOT there is the
    people JOINT on small-area geography -- today''s traits are drawn independently -- so the work is
    conditioning what exists, and any commit here that forks a parallel demand model is the defect, not
    the deliverable.'
