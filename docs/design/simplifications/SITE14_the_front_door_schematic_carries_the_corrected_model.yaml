map_notes:
  origin_note: 'THE FIRST LIVE FINDING OF THE CANON DRIFT CHECK ITSELF (A45, tools/canon_drift_check.py, 2026-08-28), which is the argument for the instrument as much as the work: THE_MODEL_ON_A_PAGE.md carried C1''s and C3''s corrections within hours, and site/index.html -- the rendered schematic a visitor actually reads, and the only version of the model most readers will ever see -- still describes a population ''drawn fresh every run with coupled hidden traits'' and a company that ''can be wrong, and it can die''. Two claims, both OVER_CLAIM against the code: green_stance and channel_pref are read by no response function (so ''coupled'' overstates two of three traits), and no collateral CALL exists anywhere in simulation/ (so nothing in the world can kill the company -- C3''s director correction is ''it does not have to die; it has to not be guaranteed to live''). R11 is the whole atom: correcting a canon file does not correct what a reader sees, so done means the fetched live surface says something true. The two claims are already registered in docs/design/canon_claims.yaml against site/index.html, so the check goes green on this atom''s completion and red again if the schematic drifts back.'
