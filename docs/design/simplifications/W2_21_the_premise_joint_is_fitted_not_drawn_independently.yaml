atom_id: W2_21_the_premise_joint_is_fitted_not_drawn_independently
map_notes:
  origin_note: 'HOUSING RULING section 3.1: the fitted joint of the quantities that carry the variance, WITH THEIR PUBLISHED CORRELATIONS -- flats are newer and smaller, pre-1919 is solid-wall, rural is detached and off-gas and has a drive. The machine''s own D-SEGMENT pass found the defect this closes: twenty-one trait axes drawn overwhelmingly INDEPENDENTLY. DEPENDS ON W2_20 AND THE FLOOR-AREA ANCHOR because a joint needs its margins first. THE NEED 50k SAMPLE IS THE FITTING SOURCE and it carries PROP_TYPE x PROP_AGE_BAND x FLOOR_AREA_BAND x REGION x metered consumption on one row per dwelling, so the correlations are measured rather than asserted. EXIT: every existing marginal recovers to the tolerance its current test enforces, AND at least one published correlation the independent draw could not produce is reproduced. THE FAILURE MODE TO REFUSE: an invented correlation matrix where a published cross-tab exists -- the ruling forbids it and the small-area data is what makes it unnecessary.'
