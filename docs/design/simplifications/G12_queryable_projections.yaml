atom_id: G12_queryable_projections
map_notes:
  name: 'MINTED FROM deliverables 1-2 of the WORK THIS CREATES block in DIRECTOR_INSTRUCTION_QUERYABLE_PROJECTIONS_2026-08-10. INTERNAL queryability only -- the external-dataset anchor philosophy (EPC/census cited, never ingested) is explicitly untouched by this atom. A query store derived from committed truth (run outputs, the event spine, observability ledgers), REBUILT-not-mutated each publish so it can never be a second source of truth. v1 scope is the worker''s judgement; a single-file query database is fine. EXIT: (1) projections derived from committed sources and queryable from the repo; (2) rebuild-not-mutate PROVEN -- an R15 mutation shows a hand-edit to the store is destroyed by the next publish rather than surviving as divergent truth; (3) fail-CLOSED on a source it could not read -- an unreadable ledger is an UNKNOWN, never an empty table silently published as zero rows (the fail-open shape R15 names); (4) the AO12 10k probe''s MEASURED figures set the scale ceiling and the graduation trigger, read from its report artefact, never re-derived (Postgres at product-time stays ruled). ANCHOR DISCREPANCY, carried deliberately: the instruction cites docs DATA_LAKE_OBSERVABILITY.md as the July design anchor and that file has never existed in this repo''s history (git log --all, only the instruction commit itself mentions it), so the INSTRUCTION TEXT is the anchor of record; further, docs/architecture/SAAS_COVERAGE_MAP.md classes BI/data-warehouse as bucket A eliminated-by-architecture on the grounds that generate_dashboard_data.py computes analytics directly off the operational model. DISCOVER/FRAME must reconcile that row with this atom before v1 lands -- either the row is restated or this atom''s scope is narrowed to internal queryability that does not contradict it.'
  build_note: "2026-08-11. v1 LANDS, level 0 -> 2. `tools/build_projections.py` rebuilds a single SQLite\nfile (`docs/observability/projections.sqlite`, gitignored) from four committed artefacts:\nthe maturity map, the run history, the coupled-gap ledger, and the AO12 probe report.\nMEASURED on the live repo, not asserted: 403 rows from 4 sources at 7ca016d3c in 0.32s,\n380,928 bytes. 26 passed in tests/tools/test_build_projections.py, ruff clean.\n\nTHE ANCHOR DISCREPANCY, RESOLVED THE NARROW WAY. The mint carried a deliberate fork: the\ninstruction cites `DATA_LAKE_OBSERVABILITY.md`, which has never existed in this repo, while\n`docs/architecture/SAAS_COVERAGE_MAP.md:71` classes BI/data-warehouse as bucket A\n\"eliminated by architecture\" -- a row `tools/generate_saas_coverage_data.py` computes a\nPUBLISHED 22.7% figure from. Of the two branches the mint named, this atom takes the second:\n**scope narrowed to internal queryability, the row left true as written, the published\nfigure not moved.** The row's claim is that board-grade analytics need no separate\nwarehouse/ETL, and that stays exactly true -- `generate_dashboard_data.py` still computes\nevery published figure directly off the operational model, and nothing in this store feeds a\npublished figure or a site surface. Restating the row would have moved a live percentage to\naccommodate a convenience tool, which is the tail wagging the dog. The instruction's own text\nis the anchor of record, as the mint decided.\n\nTHREE PROPERTIES, EACH R15 BOTH WAYS, MUTATIONS RUN:\n\n(a) COMMITTED, not working-tree. Sources are read with `git cat-file blob HEAD:<path>`, never\noff disk. `test_the_working_tree_does_not_reach_the_store` writes an uncommitted atom, builds,\nfinds it absent, commits it, rebuilds, finds it present. This is the class the capability\nindex already fell into (an index that reads the working tree grades what nobody else sees).\n\n(b) REBUILT, not mutated. `_open_new_store()` opens a new database beside the store; the\nfinished file is swapped in with `os.replace`. The live store is never opened for writing.\nMUTATION RUN, two variants of the one named defect: the naive in-place builder (reds with\n`table already exists`, hand-edit survives) and the dangerous one -- in-place made idempotent\nwith `IF NOT EXISTS` + `INSERT OR REPLACE`, which reports `status: ok` while a row nobody\nsourced sits beside the real ones. Under both, `test_a_hand_edit_to_the_store_is_destroyed_by\n_the_next_build` is FALSE. The control discriminates.\n\n(c) FAIL-CLOSED, never zero rows. A source that is missing, malformed, or parses to nothing is\nan UNKNOWN: the build refuses to promote, the live store is byte-identical afterwards, and no\ntable for that source is published. There is deliberately no `--allow-unknown` -- that door is\nthe defect wearing a flag. MUTATION RUN: `read_committed` defaulting to `b\"{}\"` plus the\nextractor's empty-guard removed makes the build report `ok` and publish `coupled_gaps` with 0\nrows, indistinguishable downstream from \"we looked, there is nothing\".\n\n(d) THE ENVELOPE IS READ, NOT RE-DERIVED. `scale_envelope` is copied verbatim from AO12's own\nreport: the store's seam (`run_output_serialize`, ceiling 1000 customers, graduation trigger\n5144, tear at 10000 memory_error under a 2048 MB cap) and, beside it, the probe's own\n`first_seam_to_tear` (`settlement_build`, 20/69). Tested with a PERTURBATION ORACLE, not an\nequality check: the fixture's figures are changed to 31337/424242 and the store must move with\nthem. A test that pinned 5144 would pass just as happily against a hardcoded constant, which\nis the re-derivation the exit forbids. A missing field fails the build closed and is\nparametrised over three fields -- a stage the probe never reached is an UNKNOWN, not a zero.\n\nTHE CLASS THIS NEARLY REPEATED, FIXED IN PASSING. `docs/design/scale_probe_10k_report.json`\nwas UNTRACKED -- not gitignored, simply never committed by anything; `tools/scale_probe_10k.py`\nwrites it and no code path lands it. G12's envelope is fail-closed on that artefact, so the\nstore would have failed closed on day one in any clean checkout. This is the SECOND instance\nin two days of a measurement tool that never lands the evidence its own control reads (the\nfirst wedged the publish gate ~1760 min: WORKER_FINDING_A_MEASUREMENT_TOOL_NEVER_LANDS_THE_\nEVIDENCE_ITS_CONTROL_READS_2026-08-10, class OPEN). Landed as 7ca016d3c, with\n`test_the_probe_artefact_the_envelope_reads_is_tracked` as the standing control. R10 says an\ninstance fix does not close an absurdity class -- the class stays open and is now two\ninstances strong, which is the evidence a class-level scanner needs.\n\nWHY THE STORE IS NOT COMMITTED. A projection in git history is precisely the second source of\ntruth this atom exists to prevent -- a copy that outlives its sources and can disagree with\nthem forever. It is gitignored, rebuilt in 0.32s, and `test_the_store_is_never_committed`\nasserts both halves (ignored AND untracked).\n\nRESIDUALS, filed not fixed:\n\n- NOT WIRED INTO THE PUBLISH PATH. The builder is a tool anyone can run; nothing calls it on\n  every publish yet. L2 is \"mechanically real, happy path\", which this is, and a new write in\n  the publish path enlists every publisher test -- a cost that belongs to its own draw, not\n  smuggled into this one. Until then the store's freshness is whatever `build_meta.head_sha`\n  says, which is why that key exists.\n- NO CALLER. The store has no consumer, which is the design-with-no-caller shape the\n  instruction was written to end. That is not an oversight: it is G13_projection_consumers,\n  split at mint because its file_scope is disjoint. G12 is not complete as a capability until\n  G13 lands; it is complete as an atom.\n- FOUR SOURCES, NOT THE EVENT SPINE. The instruction names \"run outputs, the event spine,\n  observability ledgers\". v1 covers run outputs and two ledgers. The event spine is a larger\n  read and v1 scope was explicitly delegated to the worker; adding a source is one `Source`\n  tuple, which is the point of the registry shape.\n- THE ENVELOPE GOVERNS NOTHING YET. `ceiling_customers` is recorded and unit-labelled\n  (customers), but no build compares it to a book size, because no committed artefact carries\n  a measured book size in that unit -- and comparing a customer ceiling to a row count would\n  be the unit error this repo has already been bitten by. Recorded state is not a control;\n  naming that here rather than letting the row imply otherwise.\n"
