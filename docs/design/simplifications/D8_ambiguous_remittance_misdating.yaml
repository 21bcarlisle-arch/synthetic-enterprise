atom_id: D8_ambiguous_remittance_misdating
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). The finding is REPORTED AS A MEASUREMENT, not a paragraph: a remittance-complete COUNTERFACTUAL company runs beside the real one inside background/live_payment_triad.py -- identical LedgerBook + PaymentObservationConsumer, fed the identical wall responses from the identical events with ONE field changed (every credit carries its invoice remittance reference, so AccountLedger.allocate never falls back to oldest-first). The DIFFERENCE is the attribution, so ''non-DD accounts age worse'' (confounded -- non-DD customers also fail more) is replaced by a subtraction that holds the world literally fixed. Scored through score_triad ITSELF, never a second implementation (the copy-against-copy tautology R15 names first, caught twice before in this repo''s own R15 tests). LIVE (150 customers x 6 periods, 160 ambiguous credits): THE MONEY IS EXACTLY RIGHT BOTH WAYS -- portfolio balance GBP 56,160.00 to the penny, delta 0.00 -- while the DATES are not: mean bucket displacement 0.2939 -> 0.0000 remittance-complete (the channel is the WHOLE of it), understated_arrears_rate 0.0980 -> 0.0000, false_flag_rate 0.2364 -> 0.0000. It DISCRIMINATES rather than charging everything: overstated_arrears_rate 0.2803 -> 0.2188, so only 0.0615 of the wrongful-dunning exposure is this channel and the rest is payment latency no reference can cure -- asserted, because a counterfactual that explained 100% of every measure would be a rubber stamp. UNLOOKED-FOR, and the reason the atom needed its own measure: D10''s wrongful-non-pursuit half is INVISIBLE to the detection headline after D11. Ever-flagged is right for that headline (a detection is a fact about the day it happened) but it is structurally blind to the company later UN-knowing it -- measured, detection.missed_failure_rate is 0.0000 both with and without the ambiguous channel. So `unpursued_arrears` asks the company''s OWN organ directly: 34 of 347 detected arrears cases (0.0980) have left its arrears view by as_of, and 0 of 347 in the counterfactual -- a real arrears case disappearing from the view that would have pursued it, 100% attributable. Filed as its own finding (docs/staging/WORKER_FINDING_EVER_FLAGGED_IS_BLIND_TO_UN_KNOWING_2026-08-09.md). R15, FIVE mutations each proven to fire on its own named defect: shadow carries the ambiguous reference (every attributed figure collapses to exactly 0.0 -- the construct''s own death, a counterfactual that stopped differing would publish ''costs nothing'' with total confidence); shadow scored over a different population (RAISES on the SAME-WORLD guard -- the most flattering possible error and undetectable in the published figure); shadow balance moved by 1p (fail-CLOSED, every figure blanked with premise_violated, NOT fail-loud: it runs inside run_phase2b and a diagnostic may not kill the run it measures); all-DD population (undefined, never 0.0 -- an unexercised channel is not a harmless one, the D7 vacuity rule); and a field-by-field seam comparison proving the second emission moves no clearing date, no ARUDD lag draw, nothing but bank_reference. Published twice (the D6 lesson -- both live callers replace `note`): interpolated into the ledger note AND as structure in components -> coupled_gap_ledger.json -> the Proof door. 119 tests green across every file touching the triad or gap_metric; ruff 3 -> 2 on the touched files vs a pristine HEAD extract (nothing added to the ratchet). R12 CLEAN: no published number was moved -- this adds a diagnostic beside them. L3 NOT claimed: no Expert-Hour pass, and the counterfactual is measured on the OFFLINE-shaped live wiring only; the mechanism''s cash-value (statutory interest, provisioning) is named, not yet costed.'
  discover_note: 'EVIDENCE WIDENED 2026-08-09 by atom D10, unlooked-for: this mechanism is not confined to the AGEING dimension, it is what the DETECTION residual is made of. Asking the company OWN reconciliation organ at each invoice due+grace date shows n_undetected == 0 on seeds 7/11/23 -- every truly-failed case was flagged ON TIME -- so the misses the published detection headline counts are detections the company later UN-MADE: a later period ambiguous non-DD payment carries no invoice reference, AccountLedger oldest-first fallback allocates it onto the FAILED invoice, and that invoice goes quiet while a genuinely-paid later invoice takes its place in the open-item view. Inspected directly, not inferred (R9): seed 7 C000024 p0 prepayment FAILED, flagged at due+5, and at as_of the open item is p2. Consequence for this atom SCOPE: the finding it reports is bigger than misdating -- the same seam defect makes a real arrears case DISAPPEAR from the company arrears view entirely, which is the wrongful-non-pursuit twin of the wrongful-dunning exposure D7 measures. R12: reported, not tuned -- no number moved. Level unchanged (0); this is evidence for the build, not the build.'
  origin_note: 'Minted 2026-08-08 by the D6 DISCOVER. Evidence already in hand (DISCOVER Evidence B/C): 0 of 19 misses land on Direct Debit -- the mechanism is isolated to the ambiguous-remittance channel -- and on ACC-D6C0038 the company believes the 12 OLDEST invoices settled and the 12 NEWEST open while the truth is scattered, with balance_gbp == open_sum == 1140.00. R12: this is a FINDING, not a defect to tune away; a real supplier meets exactly this and the gap should report it honestly.'
