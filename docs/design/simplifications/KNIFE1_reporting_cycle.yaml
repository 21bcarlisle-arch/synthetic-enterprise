e empty allowlist, recommended folded into KNIFE3''s shared-definition extraction. Deferred by design and named so: the 9,355-line annual_report.py split is a SIZE problem, not this CYCLE problem. Serial wall discharged -- hotspot 1 is now disjoint from all others, so KNIFE2/KNIFE3 no longer serialise against this pass (KNIFE_HOTSPOT_PASSES.md section 3a).'
