  \ Everything below is\n`observed-with-evidence` unless labelled otherwise (R9).\n\nWHAT IS ALREADY\
  \ SHIPPED, READ OFF HEAD RATHER THAN OFF THE ATOM'S PROSE. The atom's\n`name` ends with a list\
