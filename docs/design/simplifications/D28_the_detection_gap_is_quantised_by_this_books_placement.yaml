- "2026-08-14 DISCOVER/FRAME ONLY, level stays 0 (worker tick, LANE 3 idle draw). No BUILD\ncode\
  \ written and nothing in `file_scope` touched. This tick took the ONE item note 1 left\nlabelled\
  \ NOT ESTABLISHED -- whether the interior collapsed runs are predicted by the book's\n`days_late`\
  \ multiset -- and measured it. They are not, and the population that does predict\nthem is one\
  \ neither this atom's brief, the register's `why`, nor the shipped caveat\nmentions. Everything\
  \ below is `observed-with-evidence` unless labelled otherwise (R9).\n\nMETHOD. `build_scenario`\
  \ + `score_triad`, n=300, seeds 7/11/23, over the whole book-derived\ngrid `dense_drift_grid` =\
  \ -20..+88 (109 points, 108 adjacent pairs -- the honest extent note\n2 landed). At every drift\
  \ `k` the flagged set `D`, the truth set `S`, the never-flaggable set\n`N` and the published `detection`\
  \ gap were captured; `S` and `N` were asserted invariant in\n`k` at every point.\n\nFINDING 1 --\
  \ THE FLAGGED FAMILY IS NESTED, SO THE WHOLE REGISTER IS ONE MULTISET OF EXIT\nTHRESHOLDS. `|D|`\
  \ is monotone non-increasing across the grid (900 -> 69/61/83) and every case\nthat ever leaves\
  \ `D` leaves EXACTLY ONCE and never re-enters -- 831/839/817 cases, zero\nre-entries on any seed.\
  \ So each invoice has a single exit threshold `k*`, and\n\n    missed_failure_rate = |{s in S :\
  \ k*(s) <= k}| / |S|\n    false_flag_rate     = |{n in N : k*(n) >  k}| / |N|\n\nEvery reading\
  \ this register makes is a two-sided CDF read-off, and its entire content is the\nmultiset of exit\
  \ thresholds RESTRICTED TO `S | N`. That is what makes the rest of this note\nstatable as an acceptance\
  \ test rather than a description.\n\nFINDING 2 -- THE FIGURE MOVES IFF THE SET MOVEMENT TOUCHES\
  \ `S | N`, 324/324 PAIRS, NO\nEXCEPTIONS. Per seed, of 108 adjacent pairs: the flagged SET moves\
  \ at 74/76/70, the FIGURE\nmoves at 39/36/33, and the set moves with the figure still at 35/40/37.\
  \ The predicate\n`gap moves <=> (D_k ^ D_k+1) & (S | N) != {}` agrees on 108/108 pairs on ALL THREE\
  \ SEEDS with\nzero disagreements, and no pair anywhere moved the figure on an empty delta.\n\n\
  FINDING 3 -- EVERY ONE OF THOSE 112 SILENT MOVEMENTS LANDS 100% IN THE EXCLUDED BAND. For all\n\
  35+40+37 set-moves-figure-still pairs the symmetric difference is ENTIRELY inside `U - S - N`:\n\
  0 cases in `S`, 0 in `N`, on every pair, on every seed. That band is the D10/D11 exclusion --\n\
  an invoice paid late but past its grace date, which the company was RIGHT to chase -- and it\n\
  is 212/209/213 invoices, 23.6%/23.2%/23.7% of the book. It is also the DENSEST population in\n\
  the interior: it supplies a crossing at 63/63/61 distinct `k` spanning +1..+82/+79/+75.\n\nFINDING\
  \ 4 -- SO THE STATED CAUSE IS FALSE, AND IT SHIPS IN A COMPONENT.\n`DIMENSION_DRIFT_RESOLUTION[\"\
  detection\"][\"why\"]` says the reading is quantised \"because the\nnumber of invoices sitting\
  \ BESIDE the grace line at any one distance is small\". Measured\nfalse: 212 invoices sit past\
  \ the line at 63 distinct distances covering nearly every integer\nof the interior. What is small\
  \ is not the invoices beside the line but the invoices beside\nthe line THAT THIS HEADLINE'S DENOMINATORS\
  \ COUNT. And `detection_resolution_caveat`'s head --\nstamped into `det.note` AND `det.components[\"\
  drift_resolution_caveat\"]`, which is what the\nledger writer, the live wiring and the dashboard\
  \ read -- tells the reader the terms error\n\"moves it only where that error carries an invoice\
  \ across the grace line\". An invoice crosses\nthe line at 74/76/70 of the 108 steps and the number\
  \ moves at 39/36/33: crossing is NECESSARY\nAND NOT SUFFICIENT, and a reader running that sentence\
  \ backwards (\"it did not move, so\nnothing crossed\") is wrong at 35/40/37 steps. QUEUED, not\
  \ fixed on sight (SELF-INTERRUPT\nDISCIPLINE -- the fix is in this atom's `file_scope` and the\
  \ atom is `loop_stage: idle`),\nstaged as `docs/staging/WORKER_FINDING_THE_CAVEAT_BLAMES_PLACEMENT_AND_THE_MEASUREMENT_SAYS_DENOMINATORS_2026-08-14.md`\n\
  at BLOCKING/D_billing_metering with the two options and the recommendation.\n\nFINDING 5 -- THE\
  \ RESHAPE'S ACCEPTANCE TEST, AS NOTE 1 STATED IT, IS SATISFIABLE WITHOUT\nMOVING THE FIGURE. Note\
  \ 1 wrote it as \"a book whose settle-delay distribution has no gaps\nacross the swept span\".\
  \ Findings 2-3 make that test passable by filling the gaps with\nEXCLUDED cases -- which is exactly\
  \ what this book already does, at 63 distinct distances.\nThe corrected test, which follows from\
  \ finding 1:\n\n    the reshape must make the exit-threshold multiset RESTRICTED TO `S | N` contiguous\n\
  \    across the swept interior -- not the book's settle-delay distribution, and not the\n    flagged\
  \ set's change points.\n\nThat is a materially different build, and the two counted populations\
  \ show why it is a build\nrather than a tweak. Over the interior between the tails (-5..+81, 87\
  \ integers) `S | N`\nsupplies a change point at only 39/35/33 of them -- 48/52/54 barren. `N` is\
  \ a STEP FUNCTION:\n556/548/551 negatives (94.9%/92.1%/96.0%) exit at `k = -5` exactly and only\
  \ 17/26/11\n(2.9%/4.4%/1.9%) exit anywhere above 0. `S` mostly NEVER EXITS: only 33/35/30 failures\
  \ leave\nthe flagged set anywhere in the grid, so 69/61/83 of them (68%/64%/73%) stay flagged at\
  \ every\ndrift the book can be asked about. The interior resolution of a published headline therefore\n\
  rests on ~33 case-exits out of a 900-invoice book -- 3.7%/3.9%/2.7%. The reshape needs\nfailures\
  \ whose ages relative to `as_of` span the interior and negatives spread across their\ngrace distance;\
  \ MORE INVOICES BESIDE THE LINE WOULD NOT DO IT.\n\nTHE PREDICTOR (residual item 1) IS NOW HALF-SOLVED\
  \ AND HALF-OPEN, and the open half must not\nbe read as done. `N` side: `k* = days_late - grace`\
  \ is EXACT on 568/586, 566/595, 563/574\nnegatives (96.9%/95.1%/98.1%) -- note 1's arithmetic,\
  \ confirmed on the honest grid, and it is\nalso why the below-tail sits at -6. `S` side: NOT SOLVED.\
  \ `k* = (as_of - due) - grace + 1` is\nexact on only 22/33, 18/35, 18/30; the mismatches all exit\
  \ far EARLIER than predicted (16\nagainst a predicted 67) and all sit in 3-period accounts, which\
  \ suggests an account-level\nattribution effect. An account-newest-due cap was tried this tick\
  \ and made it WORSE (30%), so\nthe mechanism is UNIDENTIFIED and flagged rather than asserted (R9).\
  \ Whoever builds the\npredictor must derive the failure side, not adopt either candidate.\n\nWHAT\
  \ THE RESIDUAL IS AFTER THIS TICK. Item 1 THE PREDICTOR: negative side measured and exact,\nfailure\
  \ side open and its two obvious candidates refuted here. Item 2 (the upper edge) stayed\nCLOSED\
  \ by note 2. Item 3 THE RESHAPE: unchanged in kind, re-specified in target -- contiguity\nis owed\
  \ in `S | N`'s exit thresholds, not in the book's settle delays, and the test is now\ncheckable\
  \ before the reshape is built rather than after. NEW: the shipped `why` and caveat\nname the wrong\
  \ cause (finding 4), queued at BLOCKING.\n\nR12: no published number was moved, read or tuned by\
  \ this tick. The sweep scored\ncounterfactual companies (`organ_terms_drift_days != 0`) plus the\
  \ `k = 0` baseline, which is\nthe register's own probe; nothing was written to any artefact."
