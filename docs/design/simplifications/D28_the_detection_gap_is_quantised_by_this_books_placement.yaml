  name: 'SPUN OUT OF H27 EXPERT HOUR #10 (2026-08-11, worker tick, not fixed on sight -- SELF-INTERRUPT
    DISCIPLINE). `DIMENSION_DRIFT_RESOLUTION` derived its KEYSET from what `score_triad` publishes
    but built its GRID from its own declarations (drifts = {0} | declared invisible | declared visible),
    so the exactness rule was only ever applied at the points the band had already named -- the register
    was asked exactly where it had already answered, which is D23''s ORGAN_QUERY_GRID class escaped
    into the register built to close a resolution hole. MEASURED 2026-08-11 on a grid derived from
    the BOOK instead (every integer terms drift across one billing cycle either way, 43 counterfactual
    companies, n=300, seeds 7/11/23, every run identical on all three): the DETECTION dimension --
    declared blind to {+1}, sighted at {-1}, collapsing nowhere -- has SEVEN groups of companies
    publishing one bit-identical figure and BOTH TAILS SATURATED. Every supplier holding terms 6
    to 21 days SHORTER than the world publishes ONE number (sixteen companies, one figure, every
    seed) and every supplier 17 to 21 days LONGER publishes another; five further interior collapses
    ({-4,-3}, {0,+1}, {+6,+7}, {+9,+10}, {+11,+12,+13}) show the reading is quantised throughout
    rather than continuous. The -8d the old grid swept (it was in the AGEING band) and read as MOVED
    -- as evidence of resolution -- sits inside the saturated tail, indistinguishable from -21d.
    So a movement in the detection headline is not readable as days of company error, and a supplier
    flagging paying customers as in arrears cannot be told from one three weeks out. THIS ATOM IS
    THE RESHAPE: a scored population whose invoices sit BESIDE the company''s grace line at a contiguous
    span of distances (a book spread over more than one cycle, several `as_of` readings, and/or a
    grace line the book straddles), which moves every published detection figure on this pair and
    is therefore a mint rather than a fix on sight. It also owes the population-side PREDICTOR of
    these edges that D25 has for ageing and D27 has for the belief window -- the detection caveat
    says in as many words that no such predictor exists yet, and until it does the edges are a sweep
    reading rather than a claim about an unswept live book. ALREADY LANDED UNDER H27''s HOUR: the
    book-derived grid (`dense_drift_grid`, asserted against its own AST never to reach the register),
    the collapse/saturation measurement derived from the readings, the shared `_check_saturation_and_collapse`
    that BOTH checkers call -- so the saturation rule D27 built can no longer exist on one side of
    `in_causal_path` and not the other -- the undefined-reading fail-open (an absent reading compares
    unequal to the baseline and was counted as resolution), the differential (ageing publishes 43
    distinct readings and collapses nowhere), and `detection_resolution_caveat` stamped into the
    detection result''s note AND components with its edges interpolated from the register.'
