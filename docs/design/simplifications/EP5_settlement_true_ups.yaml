atom_id: EP5_settlement_true_ups
simplifications:
- '2026-09-21 DISCOVER pass 3 (LANE 3 self-refill draw, DISCOVER/FRAME only, no BUILD code per epoch gating Rule 1; level HELD at 0) -> docs/design/EP5_SETTLEMENT_TRUE_UPS_DISCOVER_PASS3_2026-09-21.md. THIS ATOM''S OWN STATED PRECONDITION IS DISCHARGED: pass 1 said the first owed artefact was not code but a sourced timetable, and that everything else was downstream of it. It exists and has landed in every reader -- 703e4dbb7 (2026-08-29) corrected the world+company constants to R1/R2/R3/RF = 2/4/7/14 months from an Elexon primary document (docs/market_research/elexon_settlement_run_timetable_verified.md), and 56fa3bd7b (2026-09-06) made bsc_settlement_run_register and the published Door-5 feed IMPORT settlement_reconciliation.ELEXON_RUN_MONTHS instead of hand-typing a copy, with tests/tools/test_the_published_settlement_timetable_is_the_sourced_one.py re-deriving the expectation every run. Stated in the checkable form, because the two sentences above assert landings and a reader should be able to refute them by grep rather than by trusting this prose -- LANDED: `ELEXON_RUN_MONTHS` in `company/regulatory/settlement_reconciliation.py` (the one sourced timetable, 703e4dbb7); LANDED: `ELEXON_RUN_MONTHS` in `company/market/bsc_settlement_run_register.py` (the import that ended the fourth hand-typed copy, 56fa3bd7b). Both are landings by OTHER commits, re-verified at HEAD this pass; THIS pass lands no code at all, which is the point of the claim being written where it can fail. Pass 1''s headline (three unsourced timetables disagreeing by up to eleven months) no longer describes the tree; its open questions 1 and 2 are CLOSED, the director''s framing and this atom''s own name (RF at 14 months) were the artefacts that turned out correct. WHAT BLOCKS EP5 NOW, AND NEITHER PRIOR PASS LOOKED HERE: company/finance/accounting_close.py::close_the_books is the ONLY live module on this atom''s subject (reached by the real run pipeline via company/interfaces/accounting_close.py from run_phase4c_on_phase2b.py:65) and it is ABSENT from pass 1''s caller census -- that survey looked where settlement is NAMED and missed where settlement LANDS; every module it did census is dark on the run path. The close takes `settled_records` = ''the whole run''s worth, deliberately'', and its POINT-IN-TIME NOTE argues explicitly that there is no `as_of` because ''a month-end close is an after-the-fact aggregation of records that have ALREADY SETTLED''. That argument is SOUND about the blindfold (no forward-looking decision is routed through it, so no foresight bug) and SILENT about FINALITY: its premise is true of this repo''s data structure and false of the industry it models, because under the now-sourced timetable no month has settled at its own close and 17% (the RF share) is still 14 months away. So EP5''s defect is not a missing restatement hook -- it is that the live close emits a FINAL number where the industry can only produce a PROVISIONAL one, and a figure that was never provisional has nowhere for a true-up to land. The note''s own escape clause (''if a future caller routes a DECISION through this output, that caller needs the bound'') misses by a category: EP5 is a caller of a second kind, one needing the output to be SUPERSEDABLE. The owed change is a run-stamped position, NOT an `as_of` on the close (the note is right to refuse that). CLAIMS RE-VERIFIED AT HEAD a4f2649cf RATHER THAN CARRIED FORWARD; two literals moved. HOLDS: revenue_accruals.py still zero non-test callers (the unbilled-income module this atom is named for, a month on); period_reconciliation.py still zero callers, with VarianceType already enumerating SETTLEMENT_DIFFERENCE and ACCRUAL_REVERSAL; account_ledger.py still carries transaction_time and never queries it (field decl :88, docstring :23, pass-through copy :602, no known_at, as_of filters valid_time alone); get_settlement_data still returns 0.0 + _stub:True in Stub/Live/Recorded alike AND tests/company/pricing/test_live_sim_interface.py:66 ASSERTS _stub is True, so a control holds the stub in place; zero importers of emit_settlement_timetable/build_settlement_revision_log anywhere in company/ saas/ tools/ site/, so W3_2''s own named L3 gap (2) is untouched 10 weeks on. MOVED: pass 1 found ''exactly two basis entries, both clock settled'' -- there are now THREE, treasury_end_gbp having joined net_margin_gbp and enterprise_value_gbp on the clock that has never met a settlement run, in the month since the finding was filed. Conclusion came back STRONGER, not stale; still no billed and no banked clock, so C2''s three clocks remain one. EXIT CRITERION 2 IS SUPERSEDED, NOT VIOLATED, and the reason is the finding. Pass 1 asked for a test asserting the company register''s expected arrival months and the world''s emission months are read from DIFFERENT sources, with ''point the company register at the world''s constants'' as its killer mutation. That mutation has since been APPLIED ON PURPOSE by 56fa3bd7b, to fix a real defect served under Poesys''s name for nineteen days. Two correct decisions a month apart in different lanes, disagreeing at the seam -- and it resolves in the landing''s favour: a run''s TIMING is published law, not a belief, so a real supplier does not guess it and criterion 2 asked for an independence that fidelity forbids. The falsifiable gap EP5 must publish is on the AMOUNT (cohort belief-at-close vs settled-at-RF), which build_settlement_revision_log already derives with final-value neutrality proven by construction, and which nothing reads. CARRIED TO THE BUILD, not settled here: the drift guard pins the world''s SHARE curve to the company module''s copy as well as the months -- not a live defect (the shares are Elexon''s published industry curve and the company-side model is an exposure estimate, not a peek at its own realised gap) but the concrete instance of the R13 hazard pass 1 s4 named abstractly, and the build must say which constants are physics and which are the company reading the published rulebook before it adds a reader. SIMPLICITY GUARD, re-ordered: (1) sourced timetable DONE; (2) NEW AND NOW FIRST -- the close emits a provisional run-stamped position, because 3 and 4 have nowhere to land without it; (3) second axis honoured in account_ledger.balance(as_of, known_at); (4) the world pair wired through the seam, which means get_settlement_data carries a run identity and publication date and the _stub is True assertion is the control that must go red first; (5) revenue_accruals given its first caller, not a second accrual module beside it. Four names now exist for one concept (RunName, SettlementRunType, superseded_by_run, ELEXON_RUN_MONTHS) -- the next pass adds a READER, not a vocabulary. NEW OPEN QUESTIONS: (7) does a restatement restate, or post as a fresh event against the prior period? (append-only log says the second, the P&L''s readers say the first -- the build''s first real fork). (8) which settlement constants are physics and which are the published rulebook? Pass 1''s q5 (which clock the front door publishes meanwhile) is more pressing, not less: a third figure joined the untrue label this month, so the cost of waiting is monotonically increasing; q3/q4/q6 stand. NOTHING FIXED ON SIGHT (SELF_INTERRUPT_DISCIPLINE) -- no code touched under company/ saas/ simulation/ sim/ tools/ background/, no level move, nothing owed to gate_authorizations.jsonl.'
map_notes:
  origin_note: 'R14 is the acceptance surface: every figure this atom restates must carry its clock (settled/billed/banked), and a restatement that silently replaces a published number rather than superseding it is the defect. C-S1 event-arrival tolerance binds -- true-ups arrive singly, late and out of order by nature, so any logic assuming batch completeness is wrong at birth rather than wrong at scale. Coupled to the world''s timetable atom: the world defeats the derivation or the pair is not done.'
  name: Settlement true-ups on the real industry timetable -- SF to R1 through to RF at 14 months -- landing as corrections on the bitemporal ledger, restating cohort margin and carrying unbilled income as the audited judgement it really is. THE_VALUE_CYCLE_FRAMING C2 (three clocks). Named in the ruling §1 as an Epoch-2 floor item. W3_2_settlement_timetable exists and is SATURATED, but it is the WORLD's timetable; this is the COMPANY's ledger coping with it.
  gain: The ledger restates on the real timetable instead of pretending the first number was the answer.
