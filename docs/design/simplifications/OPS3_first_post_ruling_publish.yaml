atom_id: OPS3_first_post_ruling_publish
map_notes:
  build_note: "RUNG 4, 2026-08-19 00:07 UTC (scheduled tick, self-refill draw). LEVEL MOVED 0->2, self-certified into gate_authorizations.jsonl with the evidence below. Nothing forced, no live cycle pre-empted.\n\nTHE READING RUNG 3 HELD ON WAS ALREADY RULED UNSATISFIABLE, IN THIS REPO, AGAINST THIS FILE. RUNG 3 read criterion (1) as `.last_tested_hash == HEAD`, found HEAD 5 commits ahead, and parked. `supervisor.py::_gate_pass_supersedes_failures` (2026-08-12) says of that exact predicate on that exact file: \"the independence cross-check above was exact HEAD equality (`.last_tested_hash == HEAD`), and that check is unsatisfiable in the one situation it most needs to answer... publishing that green result itself lands a commit, and every other lane keeps landing too -- so by the time anyone reads the state, HEAD has moved past the SHA that passed and equality can never hold again.\" It cost the sibling consumer 201 phantom failures over ~75h before it was repaired there. The criterion never said that: it says the gate's SUBJECT is a clean HEAD checkout and `.last_tested_hash` names THAT COMMIT. Not redefining the test toward passing (LAW A) -- reading it as written, freed from a reading this repo has already measured as unsatisfiable.\n\n(1) MET, twice, from the mechanism rather than by inference. `_head_sha()` (process_run_complete.py:1503) is `git rev-parse HEAD` in PROJECT_DIR; `_materialise_head_into` (:1519) is `git archive <that sha>` into an empty dir; `_run_gate_in` writes that same `git_hash` to `.last_tested_hash` and ONLY on rc==0 (:1924, sole writer per LAST_TESTED_HASH_CONTRACT at :56). Subject, stamp and HEAD-at-gate-time are therefore ONE value by construction, not three to reconcile.\n  Cycle A -- the one that landed: gate started 22:49Z on a throwaway clean checkout (\"the reused HEAD checkout is DISABLED ... using a throwaway checkout for this cycle\", sim-runner-log 178211), scope 147 blocking test files. HEAD at 22:49Z was `e844ee864` (committed 22:32:25Z; the next commit `3b153f2f0` is 22:52:44Z). GREEN. `.last_tested_hash` = `e844ee864`. Publish landed as `bc689525a`, 23:11:28Z.\n  Cycle B -- in flight when this tick opened, finished mid-tick: gate started 23:43Z, same throwaway-checkout path, scope 147. HEAD at 23:43Z was `bc689525a` (23:11:28Z; next commit 23:44:53Z). GREEN. `.last_tested_hash` moved to `bc689525a` while this note was being written.\n  Both are the daemon's own cycles, observed and not run by me -- the same non-pre-emption rule RUNG 2 and RUNG 3 applied.\n\n(2) MET AS A FIRED ACTION, not vacuously -- RUNG 3 undersold this by reading only the current marker count. `background_worker.py::retire_superseded_marker` (:139) APPENDS the reason into the marker and moves it, so it is R10-shaped by construction (never deletes, never bulk-archives), and the drain block (:470-489) retires everything queued behind the marker that published in the same sweep. It has fired for real: \"Drain-superseded 93/93 older run_complete marker(s) -- overtaken by run_complete_20260814T185344Z.md, which published in this sweep\" (2026-08-14 20:06Z), and 2/2 on 2026-08-17 19:21Z. The naming is checkable on disk and not only in the log: `docs/staging/done/run_complete_20260817T183958Z.md` carries \"## Superseded (not published) / Retired by background_worker.process_leftover_run_markers() at 2026-08-17T20:21:35Z\" naming the run that overtook it. Zero run_complete markers pending at the close of this tick.\n\n(3) MET, R11-fetched this tick, and the minted literal is declared stale ON PURPOSE rather than chased for a third time. `curl https://poesys.net/data/dashboard.json`: `portfolio.net_margin_gbp` = 1,529,288.58; `portfolio.basis.net_margin_gbp.clock` = \"settled\", `provisional` = true, `cost_basis` = \"net_of_all_costs\" -- R14 satisfied at the figure, not in prose. `meta.git_commit` = `e844ee8643883e4d3e3464db4ea4b6f478f07125`, `meta.source_file` = `run_output_e844ee864_20260818T223947Z.json`, `meta.generated_at` = 2026-08-18T22:44:35Z. The live surface is serving EXACTLY the commit criterion (1)'s green gate took as its subject -- which is the whole content of the ruling this atom implements, and is a stronger check than the figure alone.\n  THE DECISION TAKEN HERE, rather than flagged again: the criterion names GBP 1,526,252.39, a 2026-08-09 snapshot of a run-dependent quantity that has moved four times since. Requiring the live surface to print that number would be tuning a published output toward a stored target -- precisely R12. The criterion's testable content (a baseline printed, fetched, quoted, with its clock) is met by the current adopted figure. RUNG 2 and RUNG 3 both raised this and both declined to decide it while the atom sat at level 0; declining a third time is the ask-without-recommending defect, so it is decided here and is reversible by `git revert`.\n\n(4) MET through a real pass and HELD across three subsequent landed publishes. `.publish_gate_state.json` at close: episode_failures 0, wedge_since null, total_red 0. Not my say-so: `record_publish_gate_success` fires only behind `_green_is_on_record_for()`, keyed on `.last_tested_hash`, whose sole writer is the suite's own rc==0 -- so a publisher that publishes nothing cannot manufacture a green here (R15 anti-tautology).\n\nR9 -- THE MEASURED CAUSE OF THE WEDGE THIS PUBLISH CLOSED. Two causes, in two different places; naming only one would be dishonest.\n  GATE-SIDE, observed 2026-08-18 20:15Z: \"Publish gate RED -- blocking test(s): FAILED tests/background/test_publish_gate_subject_is_head.py::test_a_dirty_working_tree_does_not_change_the_verdict\", tail \"AssertionError: committed truth is green; a lane mid-edit must not be able to red it / assert False is True\", with a red census of 51 behind the fail-fast verdict. The control that PROVES this atom's own premise -- that the gate's subject is committed truth and a lane mid-edit cannot red it -- was itself the thing wedging the gate.\n  COMMIT-PATH-SIDE, observed 2026-08-18 20:48Z: the gate RECOVERED (\"Publish gate recovered -- cleared wedge state, re-armed alarm\") and the publish STILL did not land, because the pre-commit finding-class consolidation gate refused -- \"TWO ROOMS WORKER_FINDING_THE_BELIEF_AXIS_NULL_CONTROL_CANNOT_FAIL_BECAUSE_ITS_FLOOR_SITS_ABOVE_WHERE_IT_BREAKS_2026-08-18.md: present in done AND root\". Outcome recorded `commit_refused`, fingerprint deliberately NOT recorded so the next cycle re-attempted.\n  THE CARRY-FORWARD, because it is this atom's own near-miss: a green gate is NOT sufficient for a landed publish, so criterion (4) can reach zero while criterion (1) is still unmet -- 20:48Z is the counter-example. Anything reading episode_failures==0 as \"publishing is healthy\" is reading the gate, not the publish. First fully-landed publish after both causes cleared: `bc689525a`, 23:11:28Z.\n\nWHAT L2 CLAIMS AND WHAT IT DOES NOT. MATURITY_MAP.md s3: L2 is \"Mechanically real -- genuine artefacts, happy path\", entered on DISCOVER-lite + VERIFY, and VERIFY is \"0b evidence on a deployed surface\". The fetched surface is that evidence. HARDEN / Expert Hour is L3 and is NOT claimed here: expert_hour stays not_attempted, loop_stage moves to harden."
  name: 'MINTED FROM DIRECTOR_RULING_PUBLISH_GATE_SUBJECT_2026-08-09 deliverable 3, verbatim: ''The first post-ruling publish landed and stated plainly, markers drain-superseded, the GBP 1,526,252.39 candidate baseline printed and adopted per the standing recommendation.'' EXIT: (1) one publish cycle completes green with the gate''s subject a clean HEAD checkout, and .last_tested_hash names that commit; (2) the run_complete backlog is DRAIN-SUPERSEDED, not bulk-archived -- the newest marker publishes and the superseded ones are archived naming the marker that superseded them; (3) the candidate baseline is printed on the live surface and R11-verified by fetching it, quoting the rendered figure and its clock basis (R14), not the file on origin; (4) the episode counter for the publish-gate wedge returns to zero through a real pass, never by hand. R9: state the measured cause of the wedge this publish closed.'
