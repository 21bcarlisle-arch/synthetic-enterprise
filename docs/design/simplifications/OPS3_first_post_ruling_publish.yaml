map_notes:
  name: 'MINTED FROM DIRECTOR_RULING_PUBLISH_GATE_SUBJECT_2026-08-09 deliverable 3, verbatim: ''The first post-ruling publish landed and stated plainly, markers drain-superseded, the GBP 1,526,252.39 candidate baseline printed and adopted per the standing recommendation.'' EXIT: (1) one publish cycle completes green with the gate''s subject a clean HEAD checkout, and .last_tested_hash names that commit; (2) the run_complete backlog is DRAIN-SUPERSEDED, not bulk-archived -- the newest marker publishes and the superseded ones are archived naming the marker that superseded them; (3) the candidate baseline is printed on the live surface and R11-verified by fetching it, quoting the rendered figure and its clock basis (R14), not the file on origin; (4) the episode counter for the publish-gate wedge returns to zero through a real pass, never by hand. R9: state the measured cause of the wedge this publish closed.'
  build_note: 'RUNG 2, 2026-08-17 (worker tick). The RUNG-1 repair `cb82f3af5` is CORRECT and was NOT the reason the counter stayed at 257: the daemons that publish were still running the code it replaced. Observed-with-evidence -- sim-runner/background-worker booted 10:36:46 at `1f7fafc02`, which is not a descendant of `cb82f3af5` and in which `_marker_git_hash` does not exist; so the 14:10 UTC log line still read `git=unknown` for `run_complete_20260817T130225Z.md`, while at HEAD that same call returns `32ffa211a`, `.last_tested_hash` reads `32ffa211a`, and `_green_is_on_record_for(''32ffa211a'')` is True. R2: committed != running. DEPLOYED this tick by restarting both units; boot SHA now == HEAD `61d1f8daf` for both, and `evaluate_boot_sha_drift` dropped `background/process_run_complete.py` from their stale sets (23 -> 11 modules, the 11 being other lanes'' uncommitted files). EXIT STATE. (1) PENDING -- no cycle has completed since the restart. (2) MET as a matter of fact, not of action: `pending_run_complete_markers()` == 0, the backlog is drained, so there is nothing left to drain-supersede; the criterion''s ''not bulk-archived'' clause is satisfied vacuously and should be read as such, not as a pass. (3) PENDING -- untouched this tick, needs an R11 fetch of the live surface. (4) PENDING and DELIBERATELY NOT TOUCHED: `episode_failures` is still 257 and `wedge_since` still 2026-08-09, because the criterion says through a real pass, never by hand. The clear path is now reachable for the first time; the next green cycle is what closes it. Level NOT moved. R9 measured cause of the wedge this addresses, stated once: the clear branch was unreachable because a successful publish archives its marker before the router reads it (repaired in code at cb82f3af5), and then remained unreachable for four more hours because nothing restarted the processes holding the old function. QUEUED, not fixed (SELF_INTERRUPT_DISCIPLINE): the gate stamps `.last_tested_hash` with the MARKER''s commit while its subject is `git rev-parse HEAD` at gate time, so a lane landing during a long gate run makes the stamp name a commit that was not the subject. Both directions are real and the likely resolution -- materialise the marker''s own commit -- touches the director''s ruling on the gate''s subject, so it needs its own atom. Full record: docs/staging/done/WORKER_FINDING_THE_WEDGE_FIX_LANDED_AND_EVERY_DAEMON_THAT_PUBLISHES_WAS_STILL_RUNNING_THE_CODE_IT_REPLACED_2026-08-17.md'
