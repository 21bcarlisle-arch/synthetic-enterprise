  name: 'MINTED FROM DIRECTOR_RULING_PUBLISH_GATE_SUBJECT_2026-08-09 deliverable 3, verbatim: ''The first post-ruling publish landed and stated plainly, markers drain-superseded, the GBP 1,526,252.39 candidate baseline printed and adopted per the standing recommendation.'' EXIT: (1) one publish cycle completes green with the gate''s subject a clean HEAD checkout, and .last_tested_hash names that commit; (2) the run_complete backlog is DRAIN-SUPERSEDED, not bulk-archived -- the newest marker publishes and the superseded ones are archived naming the marker that superseded them; (3) the candidate baseline is printed on the live surface and R11-verified by fetching it, quoting the rendered figure and its clock basis (R14), not the file on origin; (4) the episode counter for the publish-gate wedge returns to zero through a real pass, never by hand. R9: state the measured cause of the wedge this publish closed.'
  build_note: 'RUNG 3, 2026-08-18 16:34 UTC (scheduled tick, self-refill draw). Re-verified all four criteria against real disk/git state; none forced, no cycle pre-empted.


    (1) PENDING, not forced. `.last_tested_hash`=`e4b1653b9` (green at ~15:25Z, subject of commit `54cda897b`); HEAD is `f1776d29d` (16:30:05Z), 5 commits ahead. A gate cycle has been live since 16:11:33Z (process_run_complete pid 2042167, nested pytest pid 2048036, still running at check time) -- that is the mechanism that would move the stamp to HEAD if it passes; not mine to pre-empt (same rule the 2026-08-17 RUNG 2 tick applied).


    (2) MET, vacuously, as a fact not an action: exactly one run_complete marker exists on disk (`run_complete_20260818T160624Z.md`) and it is the one the live cycle is already processing (repeatedly lock-skipped per background-worker-log.md, retried each cycle) -- there is no backlog to drain-supersede.


    (3) Intent MET, literal figure superseded a second time -- R11 fetch this tick (`curl https://poesys.net/data/dashboard.json`): net_margin_gbp=1,530,002.96, basis.clock=settled, meta.generated_at=2026-08-18T14:56:34Z, meta.git_commit=4e79c4c8f (a real ancestor commit). The GBP 1,526,252.39 named in the criterion was superseded 2026-08-14 (already recorded in WORKER_REPORT_THE_MARKER_QUEUE_WAS_A_FIFO...2026-08-14.md) and has moved twice more since. That report''s recommendation -- re-point criterion 3 at ''the current adopted baseline and its clock basis'' rather than a literal figure -- is still unactioned; not mine to edit unilaterally (LAW A: the exit test is the gate, not a target to redefine toward passing). Flagging again rather than re-deciding it.


    (4) MET, through a real pass, not by hand. Working-tree `.publish_gate_state.json` reads episode_failures=0, wedge_since=null at check time. Independent evidence this is a real clear, not a stale zero: sim-runner-log.md logs ''Publish gate recovered -- cleared wedge state, re-armed alarm.'' at 10:11Z and again at 14:10Z today, each only reachable from `record_publish_gate_success()` after `_green_is_on_record_for()` -- keyed on `.last_tested_hash`, whose sole writer is the suite''s own rc==0 -- confirmed the marker''s commit actually passed (R15 anti-tautology, per the router''s own docstring). The long-standing wedge this atom was minted against (257 failures, wedge_since 2026-08-09, per the 2026-08-17 RUNG 2 report) has therefore cleared for real since that tick.


    Net: 1 of 4 pending on the live cycle''s own outcome, 2 and 4 met, 3''s intent met with its literal figure stale by design (money moves). Level NOT moved -- criterion 1 is the load-bearing one and is not yet true at HEAD. No action taken that could race the live cycle. Next tick: re-check whether `.last_tested_hash` == HEAD once the in-flight cycle (started 16:11:33Z) has finished, one way or the other.'
