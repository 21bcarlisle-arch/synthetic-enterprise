map_notes:
  origin_note: 'ARCHIVE, NEVER DELETE is a standing rule and binds here hardest: this atom moves ~4,300 files, so a bug is a mass loss of the run record rather than a tidy-up gone slightly wrong. Do it as a MOVE with the old path recorded, never an rm, and prove the count before equals the count after. R15 shape to hunt: a retention policy that silently drops an INSTRUCTION misclassified as exhaust -- the classifier must be shown to fire on a real director doc, not just on run_complete_*.md. Note the mirror risk to the whole point: 78 instructions is a manageable record and 4,909 is an impenetrable one, but a policy that makes the exhaust UNFINDABLE has only moved the impenetrability.'
  name: 'ADVISOR_PROPOSAL_CAPABILITY_INDEX_AND_DEMO_2026-08-04 section 4, the ONE item of that proposal''s four with no home in the map: docs/staging/done/ holds ~4,909 files of which ~4,299 are run-completion markers and 78 are director/advisor instructions. Operational exhaust moves to its own location with a RETENTION POLICY; instructions and rulings are kept. The volume was never the problem -- the filing is.'
