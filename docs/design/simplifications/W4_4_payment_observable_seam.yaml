atom_id: W4_4_payment_observable_seam
simplifications:
- '2026-07-18 REGISTERED as DISCOVER proposal (director D5 ruling). The observable payment seam: company sees payments as a real supplier does (statements/remittances/settlement/DD notifications), never the generator internals -- epistemic wall preserved. This is a SCHEMA/sim-structure seam (a gated decision) -- FRAME/DISCOVER now, structural build is director-gated. Typed-flow-seam preference: the wall IS the go-live seam.'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, no code, no level move per §0 -- L1 PROPOSED). Designs the SEAM third of the D5 coupled triad (interface/). CONTRACT: a typed, versioned request/response envelope (same WallRequest/WallResponse shape as the existing sim/company seam) exposing OBSERVABLES ONLY -- the company reads payment EVENTS as a real UK supplier''s systems receive them, never the W2_11 generator internals (epistemic wall; the answer to "could a real supplier know this?" is yes -- it comes off their bank feed / Bacs reports). OBSERVABLE MESSAGE TYPES, anchored to REAL UK payment rails: (1) inbound-cash / remittance advice -- "payment received GBP X, ref Y, value-date Z" off the bank statement feed; (2) Bacs Direct Debit outcome reports -- DD collection SUCCESS/FAILURE with reason code (real Bacs services: ARUDD = returned-unpaid-DD, ADDACS = amendment/cancellation, AUDDIS = instruction/mandate status); (3) card/standing-order/open-banking payment notifications; (4) settlement/clearing confirmations. EACH is an observation with a reason/status, NOT the truth of why (the company INFERS arrears/ability-to-pay from the pattern -- that inference is D5, its gap vs truth is H27_payment_belief_gap). SCALE/TIME CONSTRAINTS (C-S1/C-S3, and they are REAL here not theoretical): Bacs runs a 3-working-day cycle, so a DD outcome arrives DAYS after submission, OUT OF ORDER vs other events, sometimes never (the no-remittance blind spot) -- the contract is ASYNC by construction (request-to-collect and outcome-notification are separate events in time), and any D5-side consumer MUST tolerate late/out-of-order/one-at-a-time arrival. POINT-IN-TIME: every observation carries observed_at/value_date (bitemporal), so the company cannot see a payment before it is notified (blindfold). GO-LIVE (the payoff of the typed-flow-seam preference): the SAME contract that the W2_11 sim adapter fills is the one a real bank/Bacs adapter fills at go-live -- swap the adapter, the D5 brain and the gap harness are unchanged. PORTABILITY: keyed by payment-RAIL/function, not a hardcoded counterparty; a second geography''s rails (e.g. SEPA DD) fit the same shape. DEPENDS/COUPLES: feeds D5 (consumption) + W2_11 (the sim adapter that fills it) + H27_payment_belief_gap (measures belief-vs-truth across it). BUILD (the structural schema) is director-gated (a sim-structure seam decision); this FRAME is the contract design. couples_with should be set [D5_account_hierarchy_payments, W2_11_payment_behaviour_source] at BUILD.'
- '2026-07-18 BUILD LANDED + epistemic PASS (level_current STAYS 0 per §0; L2 PROPOSED). The seam CONTRACT is built on origin (interface/contracts/wall_envelope.py generic WallRequest/WallResponse[+WallStatus incl NOT_KNOWABLE_YET] + interface/contracts/payment_observable_seam.py: PaymentRail, CollectionRequest outbound, 6 inbound observable payloads RemittanceAdvice/BacsArruddOutcome/AddacsAdvice/AuddisReport/PaymentNotification/SettlementConfirmation). 29 tests. EPISTEMIC-VERIFIER PASS (field-by-field: no inbound field leaks generator internals -- no segment/probability/propensity/hardship/arrears-risk/true-cause/future-date; imports only interface+stdlib, nothing from sim/simulation/company/saas; the wall test is load-bearing = import-allowlist + 16-substring forbidden-field scan enumerated over OBSERVABLE_RESPONSE_PAYLOAD_TYPES so future payloads are forced through the same scrutiny; mutation-proven live -- injected customer_segment -> RED). C-S3 async by construction (request/response distinct events; no-remittance blind spot modelled as ABSENCE not a placeholder PENDING); bitemporal observed_at/value_date (observed_at may post-date value_date by the 3-working-day Bacs cycle); rail-keyed portability (SEPA fits the same shape). HONEST simplifications (R10, disclosed not hidden): (a) Bacs exact numeric ARUDD/ADDACS code tables NOT fabricated -- BacsReasonCategory models coarse bank-reported categories, tied to W2_11 existing DD-failure-reason calibration gap; (b) valid_time not structurally forced == payload.value_date (kept envelope payload-agnostic per SIMPLICITY GUARD); (c) CollectionRequest outbound correctly NOT wall-scrutinised (company-authored data cannot leak a sim secret -- epistemic-verifier confirmed the reasoning). LEVEL: L2 PROPOSED (contract built+tested+epistemic-clean = BUILD-to-tested-design); blocked_on coupled_triad_gap -- L3 needs the triad to CLOSE around it: a W2_11 sim adapter FILLING this contract + a D5 consumer READING WallResponse to build allocation/ageing inference + H27_payment_belief_gap measuring belief-vs-truth across it. Landed by orchestrator (director console BUILD_OPEN; reconciler ON_FRONT). Fork branch salvage-tagged + worktree reaped via sanctioned no-force path. file_scope interface/ + tests/interface/.'
