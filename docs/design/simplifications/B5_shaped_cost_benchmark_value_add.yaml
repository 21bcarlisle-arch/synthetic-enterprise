atom_id: B5_shaped_cost_benchmark_value_add
simplifications:
- '2026-07-29 REGISTERED into the map (worker tick) from docs/design/BACKLOG.md item B5 on the director''s from_rich_20260729_173731 instruction (full quote + the no-blocked_on rationale in B3''s note). depends_on B4: a shaped-cost benchmark needs named tradable products to shape against, so it cannot build first -- the dependency encodes the ordering without a director gate. DoD (BACKLOG B5): shaped-cost benchmark computed per run; a value-add ledger reports trading P&L net of modelled friction against it; friction is non-zero and SOURCED (external bid-offer/shaping-premium anchors, not invented); reported as a diagnostic, never a target. R12 IS THE LOAD-BEARING RULE HERE and must be built as a mechanism, not a comment: a value-add number is exactly the shape of metric that invites tuning, so the exit test asserts the ledger is REPORTED and never READ BACK by any hedging/pricing decision path (a grep-guard of the CARBON_NOT_A_TARGET shape is the cheapest R15-failable control). No BUILD code, level_current 0.'
- '2026-07-29 DISCOVER (0->1) + FRAME (1->2) DONE on a lane-3 idle fork, no BUILD code, level HELD at 0. FRAME artefact: docs/design/B5_SHAPED_COST_BENCHMARK_FRAME.md (evidence-listed). DISCOVER verified against DISK this tick (R7), claims labelled observed/inferred (R9). (1) NO shaped-cost benchmark exists anywhere (repo-wide grep empty); the benchmark that DOES exist today is a DIFFERENT, narrower thing -- company/risk/hedge_policy.py:29-69 compares actual_net_gbp against naked_net_gbp, and simulation/run_phase2b.py:2026-2045 confirms naked_net is priced at REAL-TIME HALF-HOURLY SPOT (elec_price_lookup[settlement_date, settlement_period] / gas_spot_lookup), not any forward/tenor price -- a real desk is never judged against that. B5''s benchmark is a THIRD comparator, distinct from both actual_net and naked_net. (2) A LIVE R12 PRECEDENT FOUND, not hypothetical: this naked-vs-actual comparison is ALREADY read back into a decision -- run_phase2b.py:76 imports company_evolve_hedge_fraction as evolve_hedge_fraction and calls it every settled term at :2067, feeding next_hf[cid]; company/policy/decision_policy.py:16-19 documents this as the NAIVE_POLICY baseline with the live CURRENT_POLICY layering a VaR-forward decide_hedge_fraction ON TOP of it (":9-11, the backward-looking evolution"), not replacing it. A metric of exactly B5''s shape (benchmark-vs-actual) is ALREADY wired into a live hedge-fraction decision, in direct tension with this atom''s own stated intent ("never READ BACK by any hedging/pricing decision path") -- whatever R12 guard B5 builds must be proven against this NAMED file (hedge_policy.py), not a hypothetical. (3) A SHAPED COST IS COMPUTABLE TODAY, NOT BLOCKED ON B4: simulation/premise_demand.py gives each premise a real (not stub) 48-period half-hourly demand shape off local weather, reconciling to national by construction; sim/forward_curve.py:138-193 generate_forward_price already prices ARBITRARY tenor + start month via contract_length_months and acquisition_date (seasonal_shape + sqrt(tenor)-scaled term_premium) -- calling it once per calendar month with contract_length_months=1 already yields a real month-ahead price ladder. Shaped annual cost = Sigma over months of (monthly demand-shape MWh x that month''s generate_forward_price) is buildable NOW. Consumed from the sibling B4 fork''s DISCOVER: company/pricing/tariff_engine.py:137-182 already computes a wall-safe contango/backwardation slope that DOES invert sign, but company/trading/forward_book.py:184-187 books only ONE scalar price per customer term -- no named products exist (B4 level_current 0). CONCLUSION: B4 upgrades B5''s price-source DEPTH (named/tradable tenors, inversion) later; it is not a precondition to build the ledger at all -- depends_on should be read as "B4 deepens the price source", not "B5 cannot start." (4) FRICTION -- REUSABLE COMPONENTS ALREADY LIVE, none invented: bid-ask spread is modelled at company/trading/hedge_decision.py:26-28,93 (0.5% base + 0.2%/yr tenor, capped 1.5%) and tracked per-book at company/trading/forward_book.py:34,61,187,224-225,505 (total_bid_ask_cost_gbp); cost-of-capital/collateral at sim/risk_committee.py:77,158-159 (monthly_cost_of_capital_gbp, active_collateral_gbp) and company/risk/capital_adequacy.py:10, company/trading/initial_margin_register.py:5,37,60; imbalance cost at company/market/imbalance_ledger.py:62,81 and gas_imbalance_ledger.py:95,115 (net_imbalance_cost_gbp). MISSING: a distinct shaping premium (the value of delivering the actual demand shape vs. a flat block) has zero hits in the tree and must be added, sourced externally (R13), never invented as a round number. (5) THE FLATTERING-BENCHMARK DEFECT IS ALREADY LIVE IN THE SIBLING METRIC: saas/reporting/segment_report.py:150,188 computes hedging_value_add_gbp = actual_net - naked_net with NEITHER term netted of bid-ask cost, collateral cost, or imbalance cost -- reported GROSS, exactly the defect this atom''s DoD exists to avoid. B5''s ledger must be trading_pnl - shaped_cost_benchmark - friction_total by construction of the dataclass, not by a caller remembering to subtract friction. (6) R14 CLOCK: this is a SETTLED-clock figure (same clock as net_margin_gbp, tools/generate_dashboard_data.py:259,270), but the existing basis-label gate does NOT generically cover it -- tools/generate_dashboard_data.py:1691 hardcodes _BASIS_REQUIRED_PORTFOLIO_KEYS = ("net_margin_gbp", "enterprise_value_gbp") as a FIXED tuple; a new B5 figure needs an explicit key added at BUILD time, coverage is not inherited. (7) R12 MECHANISM TO CLONE, already proven both directions: tests/company/test_carbon_not_a_target.py is an AST-based (ast.ImportFrom/ast.Import, so comments/strings never false-positive) scan of named decision-surface globs (company/risk/*.py, company/pricing/*.py, etc., :64-74) asserting none imports the carbon module, self-tested to fire on synthetic import and stay quiet on clean code (:45-56) plus a non-empty-scan guard (:89-93) -- B5 must clone this exact shape scanning for imports of company.trading.shaped_cost_benchmark, with company/risk/hedge_policy.py (finding 2''s named file) as the live target the mutation test proves against. RECOMMENDATION (not a question): build B5''s first cut now or alongside B4 -- shaped_cost_benchmark.py with a pluggable tenor_price_fn defaulting to a thin wrapper over generate_forward_price, the R12 grep-guard and the R14 basis-label edit shipped in the SAME PR as the ledger (never ship the ledger before its own control exists), then swap tenor_price_fn''s default to the named product ladder when B4 lands without touching the dataclass or the R12/R14 wiring. Full detail, all file:line citations and the R15 mutation-test triad: docs/design/B5_SHAPED_COST_BENCHMARK_FRAME.md.'
