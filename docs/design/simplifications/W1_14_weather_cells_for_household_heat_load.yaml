atom_id: W1_14_weather_cells_for_household_heat_load
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05, docs/staging/DIRECTOR_RULING_WEATHER_CELLS_HEAT_LOAD_SEGMENTATION_PHASE1_2026-09-05.md, P1 product, transmitted as decisions. Director verbatim: ''What I am trying to do is divide the UK up into clusters of similar primary weather drivers... how much granularity is needed to capture, say 99%, versus 95 or 90% of the variation for households across these primary heat load variables.'' The weather hierarchy has defined four layers since 2026-07-13 and LAYER 2 HAS NEVER BEEN DEFINED -- the SIM carries four nodes (London, Manchester, Glasgow, Cotswolds) chosen by convenience. THE 72-HOUR TOKEN CLOCK IS ALREADY DISCHARGED: the HadUK-Grid pull landed 2026-09-05 in 8016f7176 with docs/market_research/haduk_grid_pull_receipt.json, so what remains is analysis and the knowledge page, not the pull. The answer is a CURVE not a number, computed separately for level and shape; clustering is blind to LDZ/GSP/SAP-21, which are comparators overlaid afterwards. Household weights come from the censuses, NEVER from the SIM''s own drawn population, and validation is DESNZ sub-national gas consumption -- generation and validation from separate sources.'
  gain: 'Phase 1 of weather: the smallest set of cells capturing household-weighted heat-load variation across GB, answered as a curve. The HadUK pull is complete; the derivation is bounded into W1_19-W1_22.'
  build_note: 'STEP 1 OF THE THREE IN block_reason, landed 2026-09-21. LANDED: `cell_weather_for_customer` in `simulation/weather_inputs.py`; LANDED: `weather_refusals_for_book` in `simulation/weather_inputs.py`; LANDED: `test_the_physics_leg_and_the_shape_leg_send_a_premise_to_the_same_cell` in `tests/simulation/test_weather_inputs.py`. (The record is docs/staging/WORKER_RESULT_THE_SHAPE_AND_PRICE_LEGS_READ_THE_WORLDS_OWN_WEATHER_NOW_AND_THE_HDD_LEG_IS_A_THIRD_RESOLVER_2026-09-21.md; the pre-registration is in staging/records/, written before the measurement). `weather_inputs.cell_weather_for_customer` resolves a premise with `WeatherWorld.cell_id_for` -- the SAME call the physics leg makes -- so which sky a household had is decided in one place. It was decided in two between 2026-09-17 (the fabric leg moved to the store) and 2026-09-21 (these legs did): one premise''s physics ran on its cell while its demand SHAPE and forward TEMPERATURE came from a per-property ERA5 CSV matched on `location`. MEASURED: 14/18 -> 16/18 of the book hold a mean-temperature series, 3,446 -> 3,653 days (the archive stopped 2025-06-07), the two misses Birmingham and the two gained Teesside. NOT AN EQUIVALENCE and must not be read as one: HadUK 1 km + level_c reads +1.19 C (London), +1.19 (Manchester), +1.27 (C3), +0.25 (C4) warmer than ERA5 on the mean, 1.31 C mean-absolute at London -- the urban heat island a ~9 km reanalysis cannot resolve, an R13 fidelity call taken blind to company results, which it will move. Cloud cover is ERA5 both sides and differs only by sampling point (+0.015 pp mean). CONTROLS: 9 legs in tests/simulation/test_weather_inputs.py; 6 die under the revert-to-archive mutation. The 3 that do not are EQUIVALENCES, established rather than assumed: two assert one-place-one-sky, which holds under BOTH designs (a shared `location` shared a CSV; a shared cell shares a series) -- which is exactly why nothing caught the four days when the two legs disagreed. The cross-leg agreement control is the leg that now would. Two pre-existing controls asserted the OLD source (`== 4.6`, and file identity against load_weather_cloud_cover) and were rewritten onto the property, old claim kept beside the new.

    STEP 3 IS PART-LANDED 2026-09-21, IN THE SAME COMMIT AS STEP 1 because step 1 was still uncommitted when the gas leg needed it. LANDED: `cell_weather_for_customer_id` in `simulation/weather_inputs.py`; LANDED: `adopt_shared_world` in `simulation/weather_inputs.py`; LANDED: `hdd_reading` in `sim/weather_hdd.py`; LANDED: `HddReading` in `sim/weather_hdd.py`; LANDED: `PremiseSky` in `sim/weather_hdd.py`; LANDED: `test_the_resolver_discriminates_a_premise_with_a_cell_from_one_without` in `tests/sim/test_the_hdd_leg_reads_the_premises_own_cell.py`; DELETED: `_resolve_source_cid` from `sim/weather_hdd.py`, with its per-property CSV reader. The gas/HDD leg was the THIRD resolver of which sky a household had, and the last one answering from a filename: strip a trailing `g`, else pass the id through, then look for one of four CSVs. MEASURED, whole book: 10 of 18 premises were reading the 1991-2020 England and Wales monthly normal -- the same number in 2018 as in 2022, biased high by a third to a half at an urban cell -- and C1 and C7, ONE COORDINATE, read annual HDD 12-20% apart purely because one id matched a filename. After: 16/18 read their own cell, annual HDD moves -2.5% to -34.5%, C1 and C7 are identical every day. TWO CAUSES IN THAT COLUMN AND THEY MUST NOT BE AVERAGED: ten premises moved off a flat normal onto weather at all; eight moved from ERA5 ~9 km to HadUK 1 km. The two the store holds no cell for (C_IC1, C_IC2, Birmingham, 7.4 km outside MAX_SNAP_KM) still get the normal and now NAME it -- `HddReading.from_normal` is the question and `basis` is the sentence; `get_hdd`''s bare float still cannot say it and its docstring says so. CONTROL: ONE test over the whole partition (a premise with a cell and a premise without, in one function), because a resolver returning the normal for everything passes every assertion about what the normal looks like and one returning a cell for everything passes every assertion about weather. Both one-way mutations red it, each on the leg written for it. STILL OWED under step 3: `_weather_source_customer_id`, `cell_matched_site` and `simulation/run_phase1b_weather_pull.py`. The record is docs/staging/WORKER_RESULT_THE_HDD_LEG_READS_THE_WORLDS_OWN_CELLS_NOW_2026-09-21.md.'
