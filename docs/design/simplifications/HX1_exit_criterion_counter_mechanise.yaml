atom_id: HX1_exit_criterion_counter_mechanise
simplifications:
- '2026-07-27 MINTED as a DRAWABLE ATOM from DIRECTOR_RULING_HARNESS_EXIT_CRITERION_RATIFIED_2026-07-27 (WORK THIS CREATES item 1). The director RATIFIED the exit criterion and COMMANDED its mechanisation -- this is director-COMMANDED (WORK THIS CREATES) but H_harness is off every open front with enforcement ON, so the BUILD draw EXCLUDES it until a per-atom BUILD_OPEN/H-lane FRONT_OPEN is ledgered (R16, director-console-only; general harness BUILD is demoted until the counter is met, decision 2a, so these three are the bootstrapping exception). See blocked_on. Deliverable: a counter organ (background/harness_exit_criterion.py + test) that computes, from PRIMARY STATE ONLY and never from the tick''s own enumeration (LAW C, coherence req 4): the count of consecutive product-content atoms that reached their next director-ratified level with declared exit criterion landed, across a span in which the STALL-class intervention count is ZERO. CONTENT-ADVANCE definition (ratified): a product-lane atom (W*/D/B/E/C/F/G-product/SITE, NOT H_harness, NOT a close_to_learn machinery atom) whose next level is director-ratified in the gate-authorizations ledger (R16) WITH a moved fidelity-register row against an unchanged baseline, OR a passing spec-tied acceptance test, OR an R11-verified live-surface change. FALSIFICATION (ratified): any stall-class event, or any claimed advance lacking its exit-criterion delta, resets the counter to ZERO. N=3 is the ratified dial (a director value, read not hardcoded-as-truth). EXIT CRITERIA (R15 pair, BOTH-WAYS mandatory -- coherence acceptance: third-party-computable from repo with NO machine access): (1) a SYNTHETIC STALL injected into the primary-state inputs RESETS the counter to zero (mutation: plant a stall-class event in the span -> counter drops); (2) THREE CLEAN CONTENT ADVANCES with zero stall-class across the span SATISFY it (counter reaches 3); (3) the counter is a PURE FUNCTION of primary state -- same repo state, same value, no dependence on tick memory or self-report (independence, R15 pattern TAUTOLOGY guard); (4) NON-FINITE / MISSING inputs REJECT (fail-closed, R15 pattern FAIL-OPEN guard -- a missing ledger/register does NOT read as zero-stalls-therefore-advancing). R12 BINDING: the counter is a GATE ON A DECISION (may harness investment resume), NEVER a quality score -- it must not appear in any fidelity/maturity/product-quality claim. Depends on HX2 (stall-set coverage) for its stall-class input completeness; level moves stay blocked_on director_level_up (R16 -- no self-bump). Splits into counter-compute + R15-pair sub-steps at build-draw.'
- '2026-07-29 blocked_on CLEARED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 1+2): director_build_open/director_level_up are abolished as BLOCK TYPES -- there is no such thing as needing a build opened, and levels are proposed+recorded (ledger-backed, self-certification via background.gate_authorization.record_level_up_self_certified now suffices, R16), never gated. Prior blocked_on/block_reason preserved above/below for the record; this atom re-enters the normal draw for whichever lane/loop_stage it already carries.'
- '2026-08-03 BUILT L0->L2 (worker tick). background/harness_exit_criterion.py + tests/background/test_harness_exit_criterion.py, 38 tests green. The counter walks a MERGED TIMELINE of content-advances and stall events: stall -> 0; advance whose exit-criterion delta is ABSENT -> 0; advance with CONFIRMED delta -> +1. Three statuses are kept apart deliberately -- confirmed / absent / UNCHECKED (evidence exists but could not be executed) -- because collapsing unchecked into confirmed is fail-open and into absent would call a real advance a falsification; unchecked neither increments nor resets, it makes the span unprovable. N is READ from the ruling doc (ratified_n), and conflicting or missing N REFUSES rather than picking a value on the director''s behalf. RAN ON REAL STATE, not fixtures only: 22 product-content advances in the ledger, and with a real pytest runner the trailing count is 2 -- reset by D_printed_figure_rederivation, which has no docstring-declared acceptance test and no fidelity row. That is a live, discriminating number, not a constant.'
- '2026-08-03 THE FIRST RUN AGAINST THE REAL REPOSITORY FOUND A DEFECT IN THIS ATOM''S OWN RESOLVER, which is the finding worth keeping. The spec-tie was originally whole-file substring match, and it immediately awarded W1_6b_merit_order_reconstruction two acceptance tests (test_staging_disposition.py, test_unmerged_work_draw_guard.py) in which the atom id is only a FIXTURE STRING in an unrelated test. That is the OVER-COUNTING direction -- the one that declares the harness done on evidence that does not exist -- so the spec-tie was tightened to the module DOCSTRING, which is where the genuine acceptance tests declare themselves (test_money_boundary.py line 1, test_payment_channel_dd_consistency.py line 2). It costs real matches and that is the acceptable half. DIRECTION OF ERROR is now stated in the module and holds everywhere: every unresolvable case makes the count SMALLER or the verdict LESS provable, never larger. An under-count delays a harness decision; an over-count declares the harness done on an unclean span, and only the first is recoverable.'
- '2026-08-03 R15 BOTH WAYS -- 15 SOURCE mutations, every one fired its named test, restore verified byte-clean by sha256 and the baseline re-run green 38/38. All three killer patterns: TAUTOLOGY (M1 score the advance from the mover''s own provenance prose -> test_provenance_prose_cannot_manufacture_an_advance; M9 hardcode N instead of reading the ruling), FAIL-OPEN (M2 missing ledger reads as zero advances; M3 non-finite ts coerced; M4 provability asserted regardless of open holes; M5 satisfaction stops requiring a provable span; M7 unexecuted tests read as passing; M12 empty product set; M14 a runner that RAISED reads as a pass), FAIL-SILENT (M13 conflicting N silently resolved; M15 a detector that exploded reads as a clean span). M6 re-plants the real over-count defect above and is caught. THE TAUTOLOGY GUARD IS THE LOAD-BEARING ONE: the counter never reads a ledger entry''s own `provenance` prose -- that is the mover''s self-report of its own evidence, so scoring by it would be checking the claim against the claim. Every evidence kind is resolved from an artefact the mover did not write in the same breath (fidelity register row with a NAMED baseline and a finite non-zero lift; a spec-tied acceptance test EXECUTED and passing).'
- '2026-08-03 L2 NOT L3, residuals named, and `satisfied` is structurally FALSE on today''s real state -- which is the honest output, not a broken one. HX2 left two stall classes with NO detector and stated the consequence in load-bearing terms: while either hole is open a zero stall count is not proof of a clean span. This module obeys that literally -- `provable` is False whenever a class is uncovered, whenever a point-kind class cannot be reconstructed over a past span, or whenever any detector reports UNAVAILABLE, and `satisfied` requires `provable`. So the reading is not ''the harness is not done'' but ''this span cannot yet be PROVEN clean''. THREE RESIDUALS HOLD L3: (a) point-kind sampling is NOT BUILT -- point state is overwritten in place and never committed, so it must be sampled each tick and until it is, its silence over a past span proves nothing; (b) the third ratified evidence kind, an R11-verified live-surface change, has no machine-resolvable trace here (a commit touching site/** is exactly the code-not-pixel evidence R11 forbids), so it is named UNIMPLEMENTED and under-counts rather than being quietly weakened; (c) THE COUNTER HAS NO CONSUMER YET -- publication and the derivability gate are HX3, so summary_line() is presently an orphan, which is the shape R11 forbids claiming as done. expert_hour not_attempted. R12 BINDING and mechanised in the verdict vocabulary: this gates exactly ONE decision (may harness investment resume), never a quality/fidelity/maturity number -- test_the_verdict_names_a_decision_not_a_score pins it.'
