atom_id: W2_30_per_household_half_hourly_electricity_and_seasonal_gas_shape
map_notes:
  map_comment_note: '# ITEM 4 of DIRECTOR_CANON_THE_DEMAND_VECTOR_2026-09-07, and the canon is explicit that this is

    # NOT AN ENHANCEMENT to the demand work -- it IS the deliverable. The world today rescales one

    # national profile, so every household has the same time-of-use cost profile and the price

    # signal is invisible to the model.

    #

    # THE TWO RESOLUTIONS DIFFER, AND THE PRICE SETS THEM, NOT THE PHYSICS. Gas: seasonal shape is

    # enough, because the price does not move within a month. Electricity: half-hourly is required,

    # because that is where the price and the settlement live. Two households at identical annual

    # kWh -- one with a sharp evening peak, one flat -- are a different cost to serve and a

    # different hedge.

    #

    # A DIRECTOR DECISION IS ALREADY TAKEN AND IT BOUNDS THE EXIT (canon section 6). The only

    # household shape artefact available is Elexon Profile Class 1 -- one population-average curve

    # on a 1997 reference year -- and NEED is annual. SERL has half-hourly with EPC linkage but is

    # accredited-access and is NOT pursued. So shape is published as MODELLED AND EXPLICITLY NOT

    # VALIDATED, said plainly on the page. A row that closes claiming validated shape has crossed

    # a director decision, not raised a level.

    #

    # EXIT: a per-household shape the draw actually carries, the not-validated statement on the

    # reader-facing surface (not a footnote), and W2_29''s acceptance re-run over the full vector

    # with this in it.

    #

    # 2026-09-08, LEVEL 0 -> 2. Evidence:

    # docs/staging/SEAT_RESULT_THE_GAS_HEATING_FRACTION_SPANS_0_25_TO_0_95_AND_EVERY_HOUSEHOLD_

    # WAS_HANDED_0_70_2026-09-08.md.

    #

    # THE ELECTRICITY HALF WAS ALREADY DONE and the row''s own premise above is stale on it:

    # `fabric_demand_path.fabric_providers_for_book` has driven every eligible premise''s

    # half-hourly electricity from W1_11/W1_12 since the settlement switch, and `run_phase2b`

    # settles money off it. `tools/book_shape_spread.py` measures it with the level divided out

    # (2022-01, 5,778 pairs): mean absolute half-hourly share difference 0.006463 on the fabric

    # path, and the LEGACY path''s closest pair at 1.6e-4 -- the collapse the switch removed. The

    # correct action was to establish that and NOT build a second copy.

    #

    # THE GAS HALF WAS THE REAL GAP and `run_phase2b` had refused it for a reason that answers a

    # different question: it assumed switching gas meant replacing the AQ LEVEL with fabric volume

    # (a 4x hedge mismatch). The canon asks for a seasonal SHAPE. `simulation/household_demand_

    # shape.py` fits each household''s own daily gas onto the two-term form `gas_settlement`

    # already settles and moves only the heating FRACTION, so the annual total is the AQ whatever

    # the fraction is -- level preserved by construction and mutation-tested as such.

    # MEASURED over 27 households (era x insulation x type, C1, 2021): the fitted fraction spans

    # 0.250 to 0.945, median 0.746, where the shipped code handed every household the DUKES

    # population figure of 0.70. The population figure is confirmed and was wrong per household.

    #

    # NOT AT TARGET, and both remaining criteria are exit criteria 2 and 3 verbatim:

    # `NOT_VALIDATED_STATEMENT` exists and is tested but reaches no reader-facing surface (it is

    # in the run''s stdout, which is not a page), and W2_29''s acceptance has not been re-run --

    # `population_coverage.REDUCES_OVER` still declares itself `blind_to` both of this row''s two

    # components. HARDEN when those two land and the fitted distribution survives a cold-eyes pass.'
  n17_year_on_year_slice_note: 'SLICE, filed 2026-11-07 from N17 (docs/staging/done/SEAT_FINDING_THE_EIGHTH_COLD_READ_FINDS_METERED_ELECTRICITY_USE_BARELY_MOVES_FROM_ONE_YEAR_TO_THE_NEXT_2026-11-04.md):
    a household''s electricity has no year-to-year term on the fallback shape. On the fd91027799 run, 519 of 712 electricity
    premises settle on legacy_pc1_rescaled, refused fabric with "no weather archive" (their cell is temperature-only; the
    ERA5 pull stood at 440 cells to go on 3 Nov, f763637d83). The world''s own metered month moves a median 0.56% on
    them, in every season and in 2022 (0.42%), against fabric premises 4.5% (summer 3.6%) and the four real HH-metered
    homes 7-17%. NEED (docs/market_research/how_far_a_settled_eac_sits_from_next_years_use.md) puts dwelling-level annual
    median |r-1| at 0.147 and SERL a same-household winter IQR of (-0.48%, 17.56%). Two remedies, separable: finish the
    ERA5 pull (W1_14), which moves premises onto fabric; and give the fallback and the fabric base load a household
    year-to-year term drawn from NEED/SERL, which INV_ELEC_MONTHLY_USE_MOVES_YEAR_ON_YEAR_LIKE_A_HOUSEHOLD grades
    (book median |r-1| in [0.05, 0.30]). Graded 0.0075 on fd91027799.'
  l3_gate_note: 'MEASURED 2026-11-19, on the published run 7f0723b46e (docs/reports/run_output_latest.json). Exit criterion
    1, "a per-household shape the draw actually carries", holds for about a quarter of the book. 538 of 722 electricity
    premises settle on legacy_pc1_rescaled, 180 on fabric_physics and 4 on half-hourly reads. 361 of 473 gas legs settle on
    population_70_30_split and 112 on fabric_seasonal_split. 541 of the electricity refusals give one reason: no weather
    archive for the cell. `build_weather_world --list` shows 454 of the book''s 596 cells without ERA5 (440 were owed on 3 Nov). The pull had
    no owner from 3 Nov to 19 Nov and ran again on 19 Nov. The mechanism in this row''s file_scope is built, so what
    remains is W1_14''s store, and the row is blocked on it.
    CRITERION 3 IS RESTATED. Criterion 3 was "W2_29''s acceptance re-run over the full vector". It is W2_29''s own exit,
    and W2_29 already depends_on this row, so the two rows were waiting on each other. The director parked W2_29 on
    14 Oct ("the N study is research, not clear-down"), and e0492757e6 found that the coverage population carries
    neither shape. Canon section 7 leaves the measurement design to the seat. The re-run therefore stays on W2_29 alone, and
    this row''s L3 asks for criteria 1 and 2 plus a cold-eyes pass on the fitted distribution. Criterion 2 landed in
    a698590552. To reverse: put the clause back in map_comment_note''s EXIT.
    TO UNBLOCK: once the store covers the book, rerun and count the providers again. Criterion 1 is met when the
    refusals that remain have reasons other than weather (no household record, HH-metered, non-domestic).
    RECOUNT 2026-11-20 on 67d454905c: 237 of 722 electricity premises on fabric_physics, 153 of 586 gas legs on
    fabric_seasonal_split, 483 refusals still for want of weather (541 before). All 41 gas legs that left the fallback
    since 6af7fd0bfd moved because their ERA5 cells were filled (37 shown cell by cell; 4 gas-only legs carry no
    verdict to show it). Record: SEAT_PREREG_W2_36_D48_THE_GAS_RESIDUAL_BY_SHAPE_PROVIDER_ON_THE_FIRST_BOOK_CARRYING_4ACCBB828_2026-11-19.md.

    SPLIT 2026-11-20, read-only, on book 67d454905c (433 gas legs on population_70_30_split) against
    the store at 3772531b8e (474 of 919 cells carry ERA5; 369 of the book''s 596 cells still owed). Method f165c9b1e''s:
    the run''s own fabric_eligibility over WeatherWorldSource on each store. CONTROL: the same probe over the store at
    67d454905c reproduces the book exactly (319 weather refusals, 0 eligible). THE PULL CAN FILL 319: 27 are already
    eligible on HEAD''s store (27 distinct cells filled since the book), and 292 wait on 289 cells, every one of them on
    `build_weather_world --list`''s incomplete list. Each of these 319 failed no other gate, because the weather check is the
    predicate''s last one. Its own trace can still refuse it ("does not rise with cold": 1 of the 154 fitted so far). THE PULL CAN
    NEVER FILL 114: 113 OCC- legs (an incoming occupier''s leg does not carry its premise''s split, so these settle
    on 0.70 whatever the store holds) and PROS-2019-0321g (fitted, refused on its own trace). What would move those 114
    has no published source: docs/market_research/the_domestic_gas_year_heats_on_about_85_percent_not_70_2026-11-19.md
    section 9. PREDICTION for the next book, if the book holds the same legs and nothing else touches gas shape: fabric_seasonal_split >= 153 + 27 = 180,
    and OCC- legs on the fallback stay 113.

    [Correction 2026-11-20, beside the claim: the "stay 113" half is withdrawn by the build below, which touches gas
    shape on purpose. It was written before that build was drawn.]
    BUILT 2026-11-20 (85-percent page s.8): `_admit_incoming_occupant` now carries the premise''s split, or its refusal
    with the premise''s reason, onto the OCC- gas leg (`carry_premise_split_to_occupier`). The leg already reads the
    premise''s fabric series and HDD cell, so a refit would return the premise''s fit; the s.9 GAP (whether an occupier''s
    fraction differs from its predecessor''s) is carried, not filled. On 67d454905c, via occupier_successions: 37 of
    the 113 OCC- legs have a fitted premise, 76 a refused one (75 no fabric trace, 1 no cold response).
    PREDICTION for the next book with the same legs on at least that store: OCC- legs on fabric_seasonal_split >= 37,
    and no OCC- leg carries SETTLED_WITHOUT_A_SPLIT_OR_A_REFUSAL. To reverse: remove the call in
    _admit_incoming_occupant.

    GRADED 2026-11-20 on book 6a588a832f (descends from 67d454905c and from 0b271e3fe5, checked with merge-base
    --is-ancestor). It holds all 586 of 67d454905c''s gas legs plus 3 new OCC- legs, so 589 in all. The predictions
    are kept above unrevised. (1) fabric_seasonal_split >= 180: HELD, at 287. Without the 58 OCC- legs it is still 229,
    so it held on the ERA5 pull alone. (2) "OCC- legs on the fallback stay 113": WITHDRAWN before the book (the
    correction above) and not counted. It reads 58, so it would have missed. (3) OCC- legs on fabric_seasonal_split
    >= 37: HELD, at 58. That is 21 more than the 37 premises fitted on 67d454905c''s store, because the pull has since
    fitted more premises. (4) No OCC- leg carries SETTLED_WITHOUT_A_SPLIT_OR_A_REFUSAL: HELD. 0 rows carry it, and each
    of the 302 fallback legs has a refusal row with its reason (243 no fabric trace, 58 the premise''s own refusal
