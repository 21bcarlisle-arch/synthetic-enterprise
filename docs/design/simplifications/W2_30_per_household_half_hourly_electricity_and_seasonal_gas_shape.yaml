atom_id: W2_30_per_household_half_hourly_electricity_and_seasonal_gas_shape
map_notes:
  map_comment_note: '# ITEM 4 of DIRECTOR_CANON_THE_DEMAND_VECTOR_2026-09-07, and the canon is explicit that this is

    # NOT AN ENHANCEMENT to the demand work -- it IS the deliverable. The world today rescales one

    # national profile, so every household has the same time-of-use cost profile and the price

    # signal is invisible to the model.

    #

    # THE TWO RESOLUTIONS DIFFER, AND THE PRICE SETS THEM, NOT THE PHYSICS. Gas: seasonal shape is

    # enough, because the price does not move within a month. Electricity: half-hourly is required,

    # because that is where the price and the settlement live. Two households at identical annual

    # kWh -- one with a sharp evening peak, one flat -- are a different cost to serve and a

    # different hedge.

    #

    # A DIRECTOR DECISION IS ALREADY TAKEN AND IT BOUNDS THE EXIT (canon section 6). The only

    # household shape artefact available is Elexon Profile Class 1 -- one population-average curve

    # on a 1997 reference year -- and NEED is annual. SERL has half-hourly with EPC linkage but is

    # accredited-access and is NOT pursued. So shape is published as MODELLED AND EXPLICITLY NOT

    # VALIDATED, said plainly on the page. A row that closes claiming validated shape has crossed

    # a director decision, not raised a level.

    #

    # EXIT: a per-household shape the draw actually carries, the not-validated statement on the

    # reader-facing surface (not a footnote), and W2_29''s acceptance re-run over the full vector

    # with this in it.

    #

    # 2026-09-08, LEVEL 0 -> 2. Evidence:

    # docs/staging/SEAT_RESULT_THE_GAS_HEATING_FRACTION_SPANS_0_25_TO_0_95_AND_EVERY_HOUSEHOLD_

    # WAS_HANDED_0_70_2026-09-08.md.

    #

    # THE ELECTRICITY HALF WAS ALREADY DONE and the row''s own premise above is stale on it:

    # `fabric_demand_path.fabric_providers_for_book` has driven every eligible premise''s

    # half-hourly electricity from W1_11/W1_12 since the settlement switch, and `run_phase2b`

    # settles money off it. `tools/book_shape_spread.py` measures it with the level divided out

    # (2022-01, 5,778 pairs): mean absolute half-hourly share difference 0.006463 on the fabric

    # path, and the LEGACY path''s closest pair at 1.6e-4 -- the collapse the switch removed. The

    # correct action was to establish that and NOT build a second copy.

    #

    # THE GAS HALF WAS THE REAL GAP and `run_phase2b` had refused it for a reason that answers a

    # different question: it assumed switching gas meant replacing the AQ LEVEL with fabric volume

    # (a 4x hedge mismatch). The canon asks for a seasonal SHAPE. `simulation/household_demand_

    # shape.py` fits each household''s own daily gas onto the two-term form `gas_settlement`

    # already settles and moves only the heating FRACTION, so the annual total is the AQ whatever

    # the fraction is -- level preserved by construction and mutation-tested as such.

    # MEASURED over 27 households (era x insulation x type, C1, 2021): the fitted fraction spans

    # 0.250 to 0.945, median 0.746, where the shipped code handed every household the DUKES

    # population figure of 0.70. The population figure is confirmed and was wrong per household.

    #

    # NOT AT TARGET, and both remaining criteria are exit criteria 2 and 3 verbatim:

    # `NOT_VALIDATED_STATEMENT` exists and is tested but reaches no reader-facing surface (it is

    # in the run''s stdout, which is not a page), and W2_29''s acceptance has not been re-run --

    # `population_coverage.REDUCES_OVER` still declares itself `blind_to` both of this row''s two

    # components. HARDEN when those two land and the fitted distribution survives a cold-eyes pass.'
  n17_year_on_year_slice_note: 'SLICE, filed 2026-11-07 from N17 (docs/staging/done/SEAT_FINDING_THE_EIGHTH_COLD_READ_FINDS_METERED_ELECTRICITY_USE_BARELY_MOVES_FROM_ONE_YEAR_TO_THE_NEXT_2026-11-04.md):
    a household''s electricity has no year-to-year term on the fallback shape. On the fd91027799 run, 519 of 712 electricity
    premises settle on legacy_pc1_rescaled, refused fabric with "no weather archive" (their cell is temperature-only; the
    ERA5 pull stood at 440 cells to go on 3 Nov, f763637d83). The world''s own metered month moves a median 0.56% on
    them, in every season and in 2022 (0.42%), against fabric premises 4.5% (summer 3.6%) and the four real HH-metered
    homes 7-17%. NEED (docs/market_research/how_far_a_settled_eac_sits_from_next_years_use.md) puts dwelling-level annual
    median |r-1| at 0.147 and SERL a same-household winter IQR of (-0.48%, 17.56%). Two remedies, separable: finish the
    ERA5 pull (W1_14), which moves premises onto fabric; and give the fallback and the fabric base load a household
    year-to-year term drawn from NEED/SERL, which INV_ELEC_MONTHLY_USE_MOVES_YEAR_ON_YEAR_LIKE_A_HOUSEHOLD grades
    (book median |r-1| in [0.05, 0.30]). Graded 0.0075 on fd91027799.'
