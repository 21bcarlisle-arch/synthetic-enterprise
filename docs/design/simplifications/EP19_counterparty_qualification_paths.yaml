atom_id: EP19_counterparty_qualification_paths
simplifications:
- '2026-08-13 L0->L1 CONSOLIDATION (worker tick, LANE 3 DISCOVER/FRAME only; no BUILD code, epoch-5 BUILD gating unaffected -- loop_stage stays idle). Produced docs/design/EP19_COUNTERPARTY_QUALIFICATION_REGISTER.md: the counterparty qualification register the atom''s origin_note names as its own ceiling, in 10 rows (B1 DCC via SEC accession -> SMKI -> CIO/UIT; B2 CSS/REC via REC Code Manager eligibility under the REC Data Access Matrix; B3 Xoserve/CDSP UK Link via the Data Services Contract / UK Link User Agreement with entitlement per the UK Link DPM; B4 the Shippers-only Supply Point Quantities surface; B5 direct Bacs via sponsoring bank -> Service User Number -> Bacstel-IP; B6-B9 the OPEN counterparties that carry no qualification at all; B10 the Ofgem licence, cross-referenced to Part A and deliberately not restated). The origin_note''s ''share one register rather than grow two'' is honoured as ONE register in TWO PARTS with no row duplicated across them -- a copied row is a second mirror that drifts -- and F5_LICENCE_READINESS_REGISTER.md gained the reciprocal Part-A/Part-B section this pass. NO NEW RESEARCH: autonomous runs have no network, so every external claim is consolidated from the single dated source (docs/design/refs/ADVISOR_RESEARCH_COUNTERPARTY_APIS_EPOCH3_2026-08-05.md) carrying that source''s own verification markers forward per R9 -- rows marked as verified live 2026-08-05, as unverified advisor knowledge, or as inferred by this pass, never flattened into one confidence. TWO FRAME FINDINGS BEYOND THE SOURCE. (1) The paths are a DEPENDENCY GRAPH, not the flat checklist the source''s ''the Epoch-5 checklist is writing itself'' implies: REC eligibility is the most load-bearing single qualification because Meter Asset Enquiry is a UK Link surface administered VIA RECCo, so REC gates part of B3 and not only B2; and SEC -> SMKI -> CIO/UIT is the only SERIAL chain (three sequential qualifications, three counterparties), so its lead time is not comparable to a single accession. (2) Two of the five gated paths have a real pre-qualification route and three do not -- DCC via the DCC Other Users route (n3rgy live+sandbox) and Bacs via the bureau/GoCardless sandbox, which are precisely the two the source calls the wall''s most failure-rich (''money and meters''); CSS/REC, UK Link and the ECVN/ECVAA trading channel have no named route, so THEY are the critical path to go-live. That is a sequencing statement about the register, not a recommendation to begin any path. OBSERVED THIS PASS, by import check at HEAD: company/market/css_performance_register.py, company/market/shipper_code_register.py and company/crm/supply_point_register.py each model the POST-qualification world (CSS 5WD/ET reporting, shipper codes + LDZ authorisations, supply points) while the company holds none of B2/B3/B4 -- and each has ZERO non-test importers, so no published figure asserts a qualification the company does not hold. The assumption is LATENT, not a live falsehood; same population as the 2026-08-13 ''gas industry-systems layer is eleven modules and no callers'' finding, which measured the wiring where this row records why the wiring should stay absent until B2/B3 are real. LEVEL MOVED 0->1 and not further: MATURITY_MAP.md section 3 gives L1 as ''been BUILT in any form'', and for THIS atom the register IS the deliverable rather than discovery about a separate one (contrast EP10_adapter_uk_link_xoserve, correctly held at 0 the same day, where the deliverable is an adapter). L2 IS EXPLICITLY BLOCKED BY THE ATOM''S OWN GAIN, registered rather than glossed (R10): the gain reads ''named qualifications WITH OWNERS'', and this register has the qualifications and no owners, no costs and no lead times -- none of the three derivable from the existing source. Four further open items named and not dropped: B7''s (ECVN/ECVAA) qualification path is NOT named by the source at all and the BSC-accession shape is this pass''s inference, not a finding; B1 and B5 rest on the source''s own unverified-knowledge markers and the SEC->SMKI->CIO/UIT ordering inherits that status; whether REC accession subsumes the older MRA/DCUSA obligations is unknown; and 2026-08-05 is the freshness ceiling on every verified row, with Project Trident mid-flight making B3''s surfaces the likeliest to have moved. THE RESERVED BOUNDARY IS HELD, not just cited: acting on any row means contacting a real organisation and spending real money (one_way_door classes 1 and 2), so no row carries an apply/start/contact/submit action or a target date, and nothing in this pass proposes unblocking the atom (pull-forward stays proposal-only per DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 section 3, and was not exercised). EVIDENCE PATH REPAIR (append, never rewrite -- the store refuses laundering): the record''s existing evidence entry docs/staging/ADVISOR_RESEARCH_COUNTERPARTY_APIS_EPOCH3_2026-08-05.md is DEAD -- the file was moved to docs/design/refs/ and the citation was never followed (the known ''archiving a document breaks every atom record that cited it'' class, 63 of 66 dead paths merely moved). The live path is appended alongside it rather than over it; the dead entry stays as history.'
- '2026-08-15 DISCOVER (worker tick, LANE 3 DISCOVER/FRAME only; no BUILD code for this atom -- file_scope stays [], loop_stage stays idle, epoch-5 BUILD gating untouched). Produced docs/design/EP19_QUALIFICATION_ACTS_AND_THE_WALL_DISCOVER.md. THE PASS WAS DRAWN TO DERIVE OWNERS AND FOUND A FAIL-OPEN WALL INSTEAD. The 2026-08-13 pass named this atom''s L2 blocker as owners + costs + lead times, all judged underivable from the source. Deriving an owner means asking who may perform each act, and in this project that has a mechanical answer -- background/one_way_door.py, which CLAUDE.md names as the SOLE enumeration of what is reserved. OBSERVED-WITH-EVIDENCE by running classify_action on one plain-English description of each register row''s qualifying act: SEVEN OF SEVEN GATED ACTS READ PROCEED, including ''Sign the Data Services Contract / UK Link User Agreement with Xoserve'' and ''Open a sponsoring bank relationship and apply for a Bacs Service User Number'' -- the textbook instances of reserved classes 1 and 2. Meanwhile this atom''s own block_reason, the SENTENCE describing the boundary (it contains the words ''spending real money''), classifies door=True/real_money. THE WALL FIRED ON THE PROSE ABOUT THE POPULATION AND NOT ON THE POPULATION -- R15 fail-open with a wrong-subject twist, and the MAKE_IT_STICK shape in its sharpest form: the rule lived in prose that NAMED a mechanism and the mechanism did not implement the prose. FAIR READING OF THE PREVIOUS PASS: its ''THE RESERVED BOUNDARY IS HELD, not just cited'' was true of the DOCUMENT (no row carries an action, by construction, still true) and false of the MECHANISM the atom points at; the correction is written into the register beside the original sentence rather than over it. WHY IT MISSED -- four near-misses of shape, not of intent: `sign (a|the) contract` needs that literal word pair, so every real instrument, which always carries a NAME between the article and the noun, fell through; `submit to ofgem` names one of the eight real bodies this project would ever write to; `accession`, the actual verb of every UK energy code, appeared in no pattern at all; and the money side of an accession is a FEE, not a subscription or a card (the third missed money-shape after 2026-07-29''s ''approve spend'' and 2026-08-03''s ''card payment''). REPAIR: six patterns added to background/one_way_door.py. Widening detection is safety-INCREASING, which that module''s own two prior widenings establish needs no authorisation. After: 7 of 7 gate, B1 as real_money and the rest as real_world_commitment. THE HARDER HALF WAS NOT JAMMING THE LANE THAT WRITES THE REGISTER -- two first cuts DID (pairing `accession` with apply/file/register fired on ''apply the filename convention to the accession register doc''; `register` as a verb fired on ''write the counterparty qualification register'', and this repo names ~50 registers), so the final patterns require what no DESCRIPTION carries: an acting verb beside a NAMED REAL BODY, or an instrument with no documentary sense (SMKI, CIO/UIT, Service User Number). The bare word `accession` is deliberately not a trigger and `call` is deliberately absent from the verb list (''call the Elexon Insights API'' is the commonest sentence in this repo, and B6/B8 are OPEN rows whose data qualifies nobody). R15 BOTH DIRECTIONS, SURGICALLY (tests/background/test_one_way_door.py, 3 new tests, 32 pass): removing exactly the six new patterns at runtime flips 7 of 7 gated acts back to PROCEED and moves nothing else; twelve open/descriptive actions stay PROCEED, including all three OPEN rows, this atom''s own register-writing work, and the simulated-domain phrasings (''paying an early exit fee'', ''sign the commit'') a lazier pattern would catch. BLAST RADIUS MEASURED, NOT ASSUMED: all 30 block_reason/blocked_on strings in maturity_map.yaml classified with and without the new patterns -- 0 newly gate, so no atom silently leaves the draw. WHAT THE REGISTER GAINED: an Owner column, DERIVED (RESERVED -> the director, necessarily and permanently, at any epoch; PROCEED -> the consuming company lane), exhaustive by construction and falsifiable -- run against the pre-repair classifier every gated row would have come back agent-owned. No internal name or team is invented: there is no org chart here to draw one from. LEVEL HELD AT 1, DELIBERATELY. One third of the named L2 blocker is closed and the search for it was simply in the wrong place (owners were never an external fact). Costs and lead times remain, are the ENTIRE remaining L2 gap, and cannot be closed here: both are live external facts and autonomous runs have no network. Nothing was inferred into those columns to make a level move look available -- moving to L2 on a third of the blocker would be greening a criterion by redefining it. NEXT STEP NAMED: one NETWORKED DISCOVER pass to price the five gated paths and record their published lead times. RESIDUE REGISTERED, NOT CLAIMED AS COVERED (R10): the wall''s real population is bigger than this register -- the same fail-open shape plausibly covers real-world engagement never written down here (an auditor, a hosting provider, a data vendor); this pass repaired only the shapes it could demonstrate a defect for. The register''s own open items 2-5 (B7''s inferred path, B1/B5''s ~ markers, MRA/DCUSA subsumption, the 2026-08-05 freshness ceiling) are UNCHANGED by this pass.'
map_notes:
  origin_note: 'Deliberately a REGISTER and not an action: the atom''s whole value is that the qualification paths are known and costed before anyone commits, and its whole risk is that building it looks like permission to start one. The boundary is written into blocked_on rather than left to judgement. F5_ofgem_licence_readiness is the sibling covering the licence itself; this covers the industry-systems side, and the two should share one register rather than grow two.'
  name: 'The qualification path for every gated counterparty, as a tracked register: SEC accession + SMKI + CIO/UIT (DCC), REC/RECCo eligibility via the Code Manager (CSS and switching), the Data Services Contract / UK Link User Agreement (Xoserve/CDSP), and a sponsoring bank + Service User Number (direct Bacs). The advisor''s research observes that every gated counterparty names its own qualification path, so ''the Epoch-5 checklist is writing itself''.'
