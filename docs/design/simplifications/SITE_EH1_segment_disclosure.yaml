simplifications:
- '2026-07-29 MINTED from the cold-eyes Expert Hour that FAILED SITE1 (its single most damaging finding). THE DEFECT: the /company/ finance panel LEADS with "Net margin / customer GBP 26,909.56" and "Revenue / customer GBP 67,578.98" -- correctly clock-labelled (2025, billed) and honestly showing its denominator (div 19) -- over a book that is 98.75pct I&C revenue, while the front door, mission, score, personalisation thesis and the one drilled-into account are all residential (I&C appears 0 times on the front door, 0 on /world/, 0 on /proof/). The result is a published figure ~450-1000x real domestic net margin per customer, sitting under a household-carbon narrative. R14 discipline is fully present and pointed at the wrong axis: the CLOCK is labelled on every figure and the SEGMENT on none. AGGRAVATED by BLOCKER-2, the benchmark-shopping half: /data/world.json rates a 2.5x churn miss (sim 5.5pct vs Ofgem 13.6pct, ratio 0.4) GREEN via the note "SIM portfolio is predominantly I&C" -- so the one disclosure of the books true composition exists ONLY where it excuses a failed benchmark, and nowhere it would change how a reader reads the money. SCOPE (fold, do not duplicate): the split data ALREADY EXISTS -- cost_to_serve.by_segment carries resi n=14 / ic n=5 -- so this is a disclosure/rendering atom, NOT a new analytics engine. (1) every per-customer tile splits by segment; (2) the revenue mix is stated before the mission claim on /company/ and the front door; (3) each anchors-register row states which population it benchmarks, so a residential benchmark can never be cleared by an I&C note. WALL: this atom changes DISCLOSURE only. It must NOT change the books composition -- which segments the company actually serves is CURRICULUM (R13, the directors instrument), and reweighting the population to make a published figure look better would be goal-seeking (R12). The mission-vs-book coherence question is ESCALATED to the director, not decided here.'
- '2026-08-03 LEVEL 0->1, STALE CELL CLOSED (worker tick). This atom was RE-DRAWN as fresh BUILD work by the scheduled tick even though its build had ALREADY LANDED in 93fbc41a7 ("SITE_EH1_segment_disclosure: adopt the rescued build") -- the code shipped and the cell was never stamped, so the draw kept handing back completed work. Same class as the abolished-block stale-cells finding (clearing a block never moved level_current). RE-VERIFIED rather than re-stamped, because a cell that passes for the wrong reason is not evidence: (a) site/data/company.json now carries a first-class book_mix block (available, clock=settled, an explicit basis string, per-segment n_accounts / revenue_share_pct / revenue_per_customer_gbp / net_margin_per_customer_gbp, and a per_customer_unavailable_reason where a segment cannot support the divide); (b) site/company/index.html renders the mix BEFORE the money and is FAIL-CLOSED -- with no readable segment mix there is NO per-customer tile at all rather than a blended one, which is the correct direction for a disclosure control; (c) R11 satisfied against the LIVE surface, not the repo: https://poesys.net/data/company.json returns i&c 98.8pct revenue share (n=5, 192,092.91 GBP/customer), resi 0.83pct (n=11, 510.53 GBP/customer), sme 0.37pct (n=2, per-customer null with a stated reason), generated_at 2026-08-03T06:28:02Z. L1 is "exists, simplified past realism" and is the correct and FULL level here (level_target 1): the disclosure is built and live. NOT claimed: the /world/ anchors-register half of scope item (3) -- each benchmark row stating which population it benchmarks -- was not verified this pass, so the benchmark-shopping half of BLOCKER-2 remains open and is the natural HARDEN draw for this atom.'
