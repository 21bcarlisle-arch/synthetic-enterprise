- '2026-07-29 REGISTERED into the map (worker tick) from docs/design/BACKLOG.md item B10 on the director''s from_rich_20260729_173731 instruction (full quote + no-blocked_on rationale in B3''s note). RECONCILED AGAINST TWO EXISTING COMPETITOR ATOMS BEFORE MINTING, because a duplicate here was the obvious risk: W2_3_competitor_field (world-side competitor supplier field, loop_stage: harden, L1/1 -- at its target, so it is DONE at the level it claims) and B4_competitor_field (company-side price ceiling / undercut pressure, idle, L0/1, epoch 4). NEITHER reaches BACKLOG B10''s DoD: what is missing is the SWITCHING RESPONSE -- a population that actually moves on relative price to a competitor tariff, and the company learning its win/loss only through acquisition/churn. This atom is that remainder; the two existing atoms stay as they are (no level or target edited -- levels are proposals and not mine to move, R16). DoD (BACKLOG B10): >=1 competitor prices tariffs the population can switch to; switching responds to relative price; the company''s win/loss is observable only through acquisition/churn (wall held); a test asserts a competitor price change moves the book. WALL: no competitor pricing internal or intent crosses sim_interface.py -- the company sees a published tariff and its own churn, exactly as it would in reality. R13: competitor aggressiveness is curriculum-adjacent (a price war is a named director scenario, MARGIN_REALISM.md''s own example), so the DEFAULT field is calibrated to observed GB market structure and any war is a named, versioned scenario, never agent-set drift. No BUILD code, level_current 0.'
- '2026-07-29 DISCOVER+FRAME pass (self-refill draw, epoch-3 BUILD still gated per the doorbell that assigned this work -- no BUILD code, level HELD at 0). Wrote this atom''s OWN doc, docs/design/B10_COMPETITOR_SWITCHING_RESPONSE_FRAME.md (learned from the prior fail-silent bug noted below -- do not cite a sibling''s FRAME doc here). DISCOVER re-verified the prior reconciliation against the actual code rather than trusting the summary: this atom''s registered file_scope (sim/competitor_field.py) does not exist -- there is no sim/ package at all, the SIM lives under simulation/, corrected in the FRAME''s BUILD decomposition. W2_3_competitor_field''s real ground truth, simulation/market_switching_propensity.py::market_switching_multiplier(renewal_year), takes ONLY a calendar year -- no company price, no competitor tariff object -- so two companies charging different prices in the same year get an identical multiplier; it is a real, DESNZ-anchored macro opportunity ceiling, not a relative-price mechanism, confirmed live-wired at simulation/customer_events.py:110. B4_competitor_field is confirmed still genuinely unbuilt (grep for CompetitorFieldObservation/get_competitor_field: zero hits outside its own two FRAME docs) and is the wrong side of the coin regardless -- it is the company''s OWN pricing decision responding to a ceiling, not the population''s switching decision responding to a relative-price gap. THE SHARPEST FINDING: the one place in this codebase with the right shape -- saas/home_move_win_rate.py::home_move_win_probability(), win_probability = base - price_differential_pct * epc_sensitivity -- is scoped only to the home-move channel and is fed PRICE_DIFFERENTIAL_PCT = 0.0 hardcoded at all three of its call sites (simulation/customer_events.py:36, run_phase4b_on_phase2b.py:28, run_phase4c_on_phase2b.py:86), so it has never taken a non-zero value in any run. No file anywhere makes an EXISTING customer''s churn depend on company-price-vs-competitor-tariff; that is the precise gap. Also found and distinguished (not absorbed): docs/design/ENGAGEMENT_MARKET_STATE_RESPONSIVENESS_PROPOSAL_2026-07-22.md, an unregistered proposal for disposition-mix responsiveness to market state -- adjacent (an opportunity-gate input the FRAME names as a future seam) but not the same mechanism as a per-customer relative-price switching function. R13 baseline anchors already in-repo and reused rather than re-derived: churn_price_elasticity.md''s real 2015-2025 3%-23% aggregate switching-rate series (the population-level calibration target) and ASSUMPTIONS.md''s Ofgem RMI Oct-2025 45/35/20 active/passive/disengaged split (the disposition weighting); the one genuine gap flagged for BUILD-time discovery, not fabricated here, is a per-customer per-percentage-point relative-price elasticity curve, which does not yet exist in either source. FRAME specifies: the mechanism shape (extend W2_3''s existing calibrated signal into a comparable price level, reuse B4''s already-designed CompetitorFieldObservation rather than minting a second wall schema, a new f(relative_price_gap_pct) switching-propensity function calibrated to the existing aggregate series); the WALL (company sees the published reference tariff and its own acquisition/churn flows only, and -- the B10-specific sharpest wall statement -- must never import or numerically reconstruct the world-side switching-propensity function itself, only its realised outcomes); two R15-failable controls each with a named killer mutation (Control A: mutate a company-side estimator to import the world-side f(...) directly -- must turn a wall test RED; Control B: hardcode f(...) to a constant, decoupling switching from the relative-price-gap input -- must turn the DoD''s own "does a competitor price change move the book" test RED); R12/R13 discipline (switch rate is a diagnostic against the external DESNZ/Ofgem series, never tuned to company P&L; competitor aggressiveness is director-authored curriculum). No BUILD code written anywhere (sim/company/simulation untouched). Level HELD at 0.'
