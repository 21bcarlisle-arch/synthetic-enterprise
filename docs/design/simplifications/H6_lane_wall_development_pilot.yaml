atom_id: H6_lane_wall_development_pilot
simplifications:
- '2026-07-12 BUILT, level 0->1 (GOVERNED_COMPANY_AND_THREE_LANES.md Part 2 item 1, director-decided, ''fork as enforcement, not risk''): a PreToolUse hook (Read|Glob|Grep matcher) that, when a session declares SE_LANE=supplier or SE_LANE=sim via env var, denies reads crossing to the other side of the sim/company wall -- extending the epistemic wall from RUNTIME into DEVELOPMENT itself (''builder blindness, not just runtime blindness''). No-op (SE_LANE unset) for every normal session, including this one -- deliberately opt-in, not a standing restriction. Demonstrated both directions for real (not just in the automated test suite): a supplier-lane Read of simulation/renewals.py denied and logged; a sim-lane Read of company/pricing/tariff_engine.py denied and logged -- both in docs/observability/lane_hook_denials.jsonl. Live harness-level self-test (setting SE_LANE in this session''s own environment to prove the REGISTERED hook fires via settings.json, not just the script directly) was deliberately NOT attempted -- correctly registering it in .claude/settings.json (schema-validated, matches the existing proven-working hook pattern exactly) plus direct pipe-testing was judged sufficient evidence without risking self-locking this session out of company/saas or sim/simulation reads mid-turn with no easy self-administered undo. NOT yet done (why level_current stops at 1, not higher): the full three-lane development model (separate contexts/worktrees per lane, typed-interface-only communication) is NOT this pilot -- that is the still-owed parallel-lanes proposal (docs/design/PARALLEL_LANES_PROPOSAL.md); Bash is out of scope for this pilot (Read/Glob/Grep only -- a `cat sim/foo.py` via Bash is not denied), registered as a known gap, not silently ignored. 14 new tests, epistemic PASS.'
- '2026-07-12 MARKER-FILE EVOLUTION, level 1->2 (self-refill, dial-weighted draw; closes PARALLEL_LANES_PROPOSAL.md section 3 gap 1, the most significant of the 3 registered): the env-var-only design worked for a single human-directed session but had no mechanism for the Agent tool''s own parallel-subagent-fan-out pattern (SUNDAY_WIDE''s own standing default) to propagate a custom env var into one spawned subagent''s own tool-call environment -- so a fork''s own lane could never be enforced at all under the old design. Added a second, independent activation path: a `.se_lane` marker file in the current working directory (checked via Path.cwd(), not walking up parents -- a worktree root IS the hook''s cwd for any tool call from within it), naturally scoping per-worktree (EnterWorktree/Agent(isolation:''worktree'')) without needing env-var propagation through subagent spawning at all. Env var still wins when both are present (the more explicit, harder-to-leave-behind-by-accident signal) -- verified directly, not just designed. 7 new tests (activation both directions, own-side still allowed, no-marker no-op, unrecognised-lane no-op, whitespace-stripped content, env-var precedence) plus a REAL live demonstration (not just the automated suite, matching this atom''s own evidentiary bar from its first build): a genuine subprocess invocation from a temp directory containing a .se_lane=supplier file, denied a sim/ read with exit code 2, zero env var involved. Level 2 (not 3) is the honest landing: this closes the single most consequential registered gap with real, demonstrated, tested code -- passing DISCOVER-lite+VERIFY per the map''s own L2 bar -- but no HARDEN/Expert-Hour pass has run on this atom, and gap 3 (Bash out of scope -- a `cat sim/foo.py` via Bash is not denied, a meaningfully harder command-string-parsing problem) remains registered, not closed. 24 total tests in tests/tools/test_lane_wall_hook.py now pass, epistemic verifier PASS.'
- '2026-07-12 HARDEN PASS, level 2->3 (self-refill, dial-weighted draw; genuine independent adversarial red-team, not self-graded -- same discipline as D3''s Expert-Hour loop, scaled proportionately to this atom''s dial=1): dispatched a fresh-context adversarial reviewer with no memory of the build, instructed to try to bypass the wall and execute every finding (not theorize). It found and CONFIRMED (by piping real adversarial payloads through the actual script) 7 real gaps, several severe: (1) ABSOLUTE PATH BYPASS, most severe -- Claude Code''s own Read tool spec requires absolute paths, and the old `path.lstrip(''./'')` normalization never touched an absolute path at all, meaning this hook''s Read-side protection was very likely dead on arrival against real Read calls, not a contrived edge case; every existing test fixture used bare relative paths, masking this entirely. (2) directory-traversal bypass (a `..`-resolving path evaded the un-resolved string match, including one disguised behind REGULATION_COMMONS_DOCTRINE.md''s own shared-readable docs/domain_artefact_library/ prefix, directly defeating that doctrine''s intent). (3) Glob/Grep calls with no explicit `path` (or Glob''s own path-shaped `pattern` argument, e.g. ''sim/**/*.py'', never inspected at all) recursed across the whole tree unchecked -- the easiest bypass to hit ACCIDENTALLY, not just adversarially, since omitting `path` is the idiomatic way to call these tools. (4) case-sensitivity bypass (`Sim/forward_curve.py` untouched by the regex). (5) a garbage/typo''d SE_LANE silently beat a correctly-configured .se_lane marker file via truthiness-not-validity precedence, disabling enforcement with zero signal. (6) marker-file content with mixed case or a stray extra line silently failed the lookup, indistinguishable from no marker configured at all. (7) an unreadable marker file (e.g. corrupted permissions) failed open with no warning. ALL 7 fixed same session: proper path resolution via a new _normalize_path() (absolute-or-relative, resolved against REPO_ROOT, lowercased) replaces the old bare lstrip; Glob''s pattern is now checked (combined with `path` per real Glob semantics, not as two independent fragments); an unscoped Glob/Grep call is now denied outright while a lane is active; lane resolution now validates SE_LANE before letting it override the marker file; the marker file reads only its first line, lowercased; an unreadable marker now logs a visible WARNING before falling open (still fails open by design -- this is a soft dev-time pilot, not the runtime wall, and R12/proportionate-rigor argues against over-engineering a fail-closed mechanism into a dial=1 atom). 12 new regression tests, one per confirmed finding, all passing (36 total in tests/tools/test_lane_wall_hook.py), epistemic verifier PASS. L3 genuinely earned: passed a real, executed, independent HARDEN pass with every finding fixed and tested, not merely designed.'
- '2026-07-27 HARDEN PASS, level 3->3 HELD (Rule-0 self-refill, dial=1 yielded -- no below-target work anywhere; at-target HARDEN draw). Sibling-half red-team of the 2026-07-12 Finding 3, which closed the UNSCOPED-recursion class (Glob/Grep with no path, path=., or a bare ** pattern with no path). Found the EXPLICIT-repo-root-base HALF of the same class was still open: a Glob with path set to the absolute repo root plus a recursive **/*.py pattern (or a Grep with path=repo-root) defeats BOTH gates -- _has_explicit_scope() sees a non-. path and calls it scoped, and the combined target normalizes to a bare **/*.py (or .) that anchors on neither side, so _LANE_DENIES misses it. Demonstrated LIVE returning rc=0 under SE_LANE=supplier -- a real silent read straight across into sim/** through the active wall. Closed as a CLASS (R10) at a single new locus _spans_whole_tree(normalized) := normalized==. or normalized.startswith(**), wired into main()''s deny loop BEFORE the regex match: any wall-active search whose normalized target recurses from the repo root across arbitrary depth is denied, whichever lane is active. Anchored allowed-side recursive globs (company/**/*.py, first segment company) stay allowed, false-positive-guarded by explicit non-regression tests. R15 both ways: neutering _spans_whole_tree to return False fails exactly the 4 new denial tests, restoring passes; 42 total in tests/tools/test_lane_wall_hook.py (was 36), 6 new. Same audit-the-sibling-half-of-a-hardened-class discipline this project already codified.'
- '2026-07-27 HARDEN PASS #2, level 3->3 HELD (Rule-0 self-refill, dial=1 yielded again -- no below-target work anywhere; at-target HARDEN draw). Fresh independent red-team of the CURRENT code found a NEW fail-open class distinct from every prior finding (absolute-path, traversal, unscoped-recursion, whole-tree-span): the deny anchors required a trailing SLASH (^(sim|simulation)/), but _normalize_path() resolves through Path.resolve()+relative_to().as_posix(), which STRIPS the trailing slash off a directory target -- so a target that IS the denied top-level directory itself (sim, sim/, simulation, sim/. and company/saas on the sim lane) all normalize to the bare dir name, and the slash-requiring anchor never matched. Grep with path=sim -- the single most idiomatic way to search the sim tree -- therefore read straight across the wall; demonstrated LIVE rc=0 under SE_LANE=supplier, and the same for path=company under SE_LANE=sim. FAIL-OPEN (R15 pattern 2) on the exact directory the wall exists to protect. Closed as a CLASS by anchoring both deny patterns on a segment boundary ($|/) instead of a literal /: the bare directory and everything beneath it match, while a sibling top-level name that merely starts with the denied prefix (simple/, companyx/) does not -- false-positive-guarded by explicit non-regression tests. R15 both ways: reverting the anchors to the trailing-slash-only form fails exactly the 5 new denial tests while the 2 false-positive guards stay green; restoring passes all 54. 54 total in tests/tools/test_lane_wall_hook.py (was 47), 7 new. The wall is now closed on bare-directory targets as well as file, span, and unscoped targets.'
- '2026-07-28 HARDEN PASS #3, level 3->3 HELD (Rule-0 self-refill, dial=1 yielded -- no below-target work anywhere; AT-target HARDEN draw). Fresh red-team of the CURRENT code found a NEW fail-open class distinct from every prior finding (absolute-path, traversal, unscoped-recursion, whole-tree-span, bare-directory): every prior normalization fix leaned on _normalize_path()''s Path.resolve() to collapse a `..` back to its true target so the deny regex catches the landing directory -- but pathlib does NOT expand brace alternations {a,b}, while the real Glob engine (minimatch/node-glob family) DOES, and a brace alternative can carry a ../ that escapes a concrete allowed first segment into the denied side. Glob(pattern=company/{compliance,../sim}/*.py) normalizes (pathlib) to a benign company/{compliance,../sim}/*.py -- first segment the concrete company, so _spans_whole_tree passes it and the deny regex misses it -- yet the engine expands the second alternative to company/../sim/*.py == sim/*.py, reading straight across the wall. OBSERVED at the hook: rc=0 (ALLOWED) on that payload under SE_LANE=supplier while the brace-free company/../sim/... form was correctly denied (rc=2); the end-to-end cross via the real Glob TOOL is INFERRED from standard brace-expansion glob semantics (the Glob tool was unavailable in this worker session to demo end-to-end -- per R9 labelled inferred-not-observed, not asserted as demonstrated). FAIL-OPEN (R15 pattern 2): the wall''s safety depended on the glob engine NOT supporting a standard feature. Closed as a CLASS by _expand_braces() -- expanding braces in-hook to the SAME path set the engine sees (cartesian product across nested/multiple groups; a single-alternative {x} with no top-level comma kept literal; capped at 256 so an unbounded expansion fails CLOSED as a span-denial, sentinel propagated through recursion not mangled), then normalizing+checking EACH expansion; one crossing alternative denies the whole call. False-positive-guarded: a pure own-side brace company/{crm,compliance}/*.py and a literal {x} both stay allowed. R15 both ways, not asserted: neutering _expand_braces to identity fails exactly the 4 new escape/explosion tests while the 3 false-positive guards stay green; restoring passes all 61 (was 54, 7 new). Harness-meta only, no SIM/company code touched. loop_stage stays build (at target, no further BUILD).'
- '2026-07-28 HARDEN PASS #4, level 3->3 HELD (Rule-0 self-refill, dial=1 yielded -- no below-target work anywhere; AT-target HARDEN draw). Fresh red-team of the CURRENT code found a NEW fail-open class, the SIBLING of the same-day brace-expansion finding: the real Glob engine (minimatch/node-glob family) expands EXTGLOB alternations -- @(a|b) exactly-one, +(a|b) one-or-more, ?(a|b) zero-or-one, *(a|b) zero-or-more, !(a) negation -- which pathlib does NOT, and whose operator chars (@ + ! ( ) |) are ALL absent from both _expand_braces (only {}) and _spans_whole_trees metachar set (*?[]{}). So an extglob alternative carrying a denied top-level dir or a ../ traversal slipped every gate: @(company|sim)/**/*.py, +(sim|company)/**/*.py, company/@(crm|../sim)/*.py and !(company|saas)/**/*.py all OBSERVED rc=0 (ALLOWED) at the hook under SE_LANE=supplier -- a real silent read straight across into sim/**; the end-to-end cross via the real Glob TOOL is INFERRED from standard extglob semantics (R9, Glob tool unavailable this worker session), labelled inferred not asserted. FAIL-OPEN (R15 pattern 2): the wall depended on the glob engine NOT supporting a standard feature. Closed as a CLASS by _extglobs_to_braces() rewriting extglob alternations into the SAME brace form the tested _expand_braces already expands+caps (@/+ -> {alts}, or the bare alternative when single so a one-element brace is not mis-read as literal; ?/* -> {alts,} with the empty option), then checking every expansion; a !() NEGATION matches an open-ended set that can include the denied side and cannot be enumerated, so it fails CLOSED via the explosion sentinel (denied as a span). False-positive-guarded: a pure own-side extglob company/@(crm|compliance)/*.py and a zero-or-more company/*(crm)/*.py both stay allowed. R15 both ways: neutering _extglobs_to_braces to identity fails exactly the 6 new crossing/negation/unit tests while the 2 own-side guards stay green; restoring passes all 69 (was 61, 8 new). Harness-meta only, no SIM/company code touched. loop_stage stays build (at target, no further BUILD).'
- '2026-07-28 HARDEN PASS #5 -> REST WITH PROOF, level 3->3 HELD, NO control accreted (Rule-0 self-refill; AT-target atom drawn, dial=1 yielded -- no below-target work anywhere; NTFY sent). RE-VERIFY: all 72 exit tests in tests/tools/test_lane_wall_hook.py green; control byte-identical (git diff empty after mutate+restore). R15 mutation ROTATED to a control NOT exercised by the four prior same-file passes (which rotated the GLOB-PARSING half -- brace/extglob/whole-tree-span/bare-directory anchor): the _resolve_lane() SE_LANE VALIDITY gate (the 2026-07-12 Finding 5 fix, truthiness-not-validity fail-open). Neutered `env_lane and env_lane in _LANE_DENIES` to bare `env_lane` -> reds EXACTLY test_garbage_env_var_no_longer_nullifies_a_valid_marker_file and NO other test (rc 2->0: a typo`d SE_LANE=typo_lane is returned as the lane, main() sees it not in _LANE_DENIES and no-ops, so a cross-wall Read of sim/ is ALLOWED straight past a correctly-configured supplier marker file); 71 others stayed green -- the gate fires only on its own named defect (R15 pattern 2, fail-open + independence). Restored byte-identical -> all 72 pass. HARDEN lane SATURATED within file_scope: 5 glob-parser red-team passes (absolute-path/traversal/case, unscoped-recursion, whole-tree-span, bare-directory, brace, extglob) PLUS the Bash-bypass PIN (H6b follow-up registered) -- no Nth guard warranted, this draw was a pure 6h cooldown-window elapse, not a code change. Harness-meta only, no SIM/company code touched. loop_stage stays build (at target).'
