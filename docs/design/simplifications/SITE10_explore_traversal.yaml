atom_id: SITE10_explore_traversal
map_notes:
  gain: 'The largest piece in the programme and the strongest available demonstration of the epistemic wall: a reader picks one customer and follows PRICED -> CHOSEN -> USED -> BILLED -> PAID -> JUDGED, seeing at every stage what the world knew against what the company believed, with the change of clock between stages made explicit on screen because that change IS the industry education. The brief sets a real presentation bar -- an operator''s working screen, not a six-part essay, with real artefacts (a rendered bill, a meter read history, a direct debit schedule). `site/customers/` (152KB, the existing wall exhibit) is the substrate: the brief''s own ''the earlier CRM-style view set the standard'' is describing a page that still exists, so the two are reconciled rather than built beside each other. Draws as its own commitment set. The wall''s treatment here is the one thing in the brief exempt from see-and-correct.'
