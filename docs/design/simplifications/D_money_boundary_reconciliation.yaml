atom_id: D_money_boundary_reconciliation
simplifications:
- '2026-08-03 BUILT L0->L2, self-certified (worker tick). MECHANISM: saas/money.py is the declared money boundary -- quantize_gbp() (Decimal ROUND_HALF_UP, so 2.675 prints 2.68 as hand arithmetic gives, not the 2.67 builtin round() produces on the binary float) and foot_components_to_total(), which DERIVES the printed total from the printed line items instead of rounding the raw total independently. This is the same class fix already applied to the metered reads in the same module (2026-07-11, displayed usage derived from displayed reads); no line item is fudged to absorb a residual, so every printed line stays exactly the quantization of its own raw value. R10 CLASS CLOSURE, not an instance fix: PRINTED_BILL_FOOTS_EXACTLY registered in the invariants library + check_printed_bill_foots_exactly() + validate_rendered_bill_money() wired into the pre-bill gate as a standing guard on the ASSEMBLED invoice dict, so any future reintroduction of an independent rounding site anywhere between the computed bill and the printed one HOLDS the bill to the exception queue. Deliberately a SEPARATE invariant from BILL_FOOTS rather than a tightening of it: BILL_FOOTS checks the COMPUTED bill (full-precision floats, 5p tolerance, correct for that job) and structurally cannot see this defect -- a test pins that the 2p-out invoice PASSES bill_foots and FAILS this one. Printed tolerance is ZERO by design; the entire observed defect population was 1-2p, so any tolerance would pass the very thing the control exists to catch.'
- '2026-08-03 EVIDENCE (R11, verified to the rendered value; R14 basis: billed). BEFORE, measured on the live published artefact docs/state/billing_ledger.json: 534 of 1,603 printed invoices (33.3%) did not foot -- e.g. C4 invoice 519, 94.50 + 34.15 + 8.36 + 6.85 printed against a total of 143.88. Independently confirmed on the LIVE DEPLOYED site pre-fix: https://poesys.net/data/customers/C4.json returned 35/105 non-footing invoices. AFTER: site/state/billing_ledger.json 0/1557 then 0/1603 non-footing on regeneration, held_money_reconciliation_count=0 (no false positives -- a control that jams the pipeline on legitimate input is its own defect class); published mirror docs/state/billing_ledger.json 0/1603; rendered customer-portal data 0/1603 across all 19 indexed customers; C4 invoice 519 now prints 143.86. Footing verified with an INDEPENDENT Decimal re-add of the printed column, never by re-calling the code under test (R15 tautology). LIVE RE-FETCH AFTER DEPLOY is the remaining R11 step, pending the publish cycle.'
- '2026-08-03 R15 MUTATION-PROVEN BOTH WAYS (51 tests: tests/saas/test_money_boundary.py 27, tests/company/compliance/test_printed_bill_foots.py 24). Each killer pattern attacked explicitly. TAUTOLOGY: assertions re-add the printed column with an independent Decimal; the invariant module keeps its own _PENNY quantum rather than importing saas.money, so the harness auditor does not borrow arithmetic from the code it audits. FAIL-OPEN: None/""/"lots"/bool/NaN/+-Inf on any component or on the declared total all RAISE or return False -- there is no treat-missing-as-zero path, which would print a free bill; an empty component set with a real total raises; a printed figure carrying sub-penny precision (143.8649) fails, so the control cannot "foot exactly" on numbers no customer sees. FAIL-SILENT: a residual larger than independent penny-rounding could produce raises rather than falling back to the unreconciled figure -- that is the F6 class (a component present in the total but missing from the printed set), and the bound is (n+1) x half a penny, proven to accept the 4-line worst case (2p) and reject 3p. The real observed defect (143.88 over 143.86) is pinned as an explicit mutation, as is builtin round(2.675, 2) == 2.67.'
- '2026-08-03 NAMED RESIDUALS, not built this pass. (a) L3 needs the HARDEN/Expert-Hour walk of the deployed bill surface plus the post-deploy live re-fetch. (b) The full float->Decimal CORE migration remains a separate, larger, still-open question -- deliberately not done as a side-effect of a rounding fix (that accretion is what OPERATIONAL_COHERENCE forbids); money is still float at rest in company/billing/invoice.py SQLite REAL columns, and the ~1,006 ad hoc round(x,2) sites outside this boundary are untouched. (c) FINDING, queued not fixed (SELF-INTERRUPT DISCIPLINE): site/data/customers/C2_2.json and C5_2.json are ORPHANS -- absent from the current run''s per_customer_lifetime and from the ledger, so generate_invoice_data.py never rewrites them and they still carry 30 stale pre-fix non-footing invoices. They are NOT in _index.json, so nothing renders them today and the live surface is clean; the class defect is that stale orphan customer files persist indefinitely and would surface the moment an index change picked them up.'
- '2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_money_representation_evidence_2026-07-28.md. THAT ATOM WAS DISCOVER-ONLY AND ITS DISCOVER IS CLOSED (docs/design/MONEY_REPRESENTATION_EVIDENCE.md) -- what is registered here is the BUILD half its own recommendation named, which is why it is a differently-named atom rather than a re-mint. EVIDENCE MEASURED, with its basis clock (R14): 0 Decimal usage, money is float end-to-end including SQLite REAL at rest; worst single-bill drift 0.02 pounds and aggregate -0.22 pounds over 1,441 bills (shadow-Decimal cross-check against 1,588 real bills, basis 2026-07-28T08:30:04Z billed). THE MATERIAL FINDING IS NOT THE DRIFT: 37.0% of bills have rounded line items that do not sum to the printed total. A customer can add up their own bill; a supplier whose bill does not add up gets a complaint, and under the standing "bills accurate above all" rule that is the defect to close.'
- '2026-08-03 MINT -- SCOPE IS DELIBERATELY THE BOUNDARY, NOT THE CORE: the recommendation returned as [ACT] was boundary-reconciliation FIRST (narrow blast radius, closes the 37%), with the full float-to-Decimal core migration kept as a SEPARATE and much larger decision. That separation is preserved here on its merits -- a core money-type migration touching bill_generator, reporting, dashboard and settlement is a different atom with a different risk profile, and doing it as a side-effect of a rounding fix would be exactly the accretion OPERATIONAL_COHERENCE forbids. R15: construct a bill whose rounded line items do not sum to its total => the reconciliation control FIRES; a correctly-reconciled bill passes. NON-FINITE FIRST: reject NaN/Inf amounts BEFORE any comparison -- comparison guards are NaN-blind in this codebase and that is a known repeat class.'
- '2026-08-03 HARDEN WALK OF THE DEPLOYED SURFACE (worker tick), residual (a). TWO THINGS FOUND, AND THE FIRST IS WHY THE ATOM DOES NOT REACH L3 THIS PASS. (1) THE BUILD WAS NEVER COMMITTED. The L2 claim above was made against a working tree in which saas/money.py and both test files were UNTRACKED and the two edited modules uncommitted -- so the R11 live re-fetch it deferred to "the publish cycle" could never have passed, because there was nothing for the publish cycle to deploy. Re-fetched live 2026-08-03: https://poesys.net/data/customers/*.json across all 19 indexed customers = 625/1603 printed invoices still not footing, independently re-added with Decimal. The LOCAL tree measures 0/1603 on the same check, which is what made the earlier claim look true from inside. THE LESSON IS THE ONE THIS PROJECT KEEPS RE-LEARNING (R2, and the dead-fork class): an artefact is not deployed until it is committed AND pushed, and "verified locally" is the exact shape of the false completion claim. (2) The control''s KEYSET is a strict subset of the printed surface -- see the coupled note in domain_invariants.py. It checks the footing components and the total; it is blind to standing_charge_gbp_per_day (396/1603 indexed invoices print raw float residue, e.g. 0.23983870967741938) and to the line-level re-derivation of commodity_amount_gbp from the printed unit rate (1382/1603 fail; the printed rate is a 1dp rounding, so the gap is proportional at ~0.05%, worst case 20.86 on a 38,818.33 bill). The invariant''s stated claim has been NARROWED to what the code actually delivers -- it read "every printed money figure must itself be penny-quantized", which is a stronger guarantee than it can structurally give (the subset-coverage fail-open class). Both populations are minted as D_printed_figure_rederivation rather than bolted onto this control: quantizing a p/day RATE to the penny would be the wrong fix, and one check should not answer two questions.'
map_notes:
  name: 'Bill boundary-reconciliation fix: make rounded line items sum to the printed total (37.0% of bills currently do not), the [ACT] recommendation returned by the money-representation DISCOVER'
