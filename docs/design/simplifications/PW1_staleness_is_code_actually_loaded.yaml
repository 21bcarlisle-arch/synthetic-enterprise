  level_note: 'L0->L2 self-certified 2026-08-09. (a) POPULATION: `_systemd_owned_sessions()` DELETED; `observed_launched_by`/`drift_population` derive the set from unit-active + MainPID + /proc cgroup cross-check, and `launcher_drift` turns a wrong manifest row into a LOUD MISDECLARED_LAUNCHER instead of a silent shrink. Live population 5 -> 12 sessions; sim-runner and background-worker are now in it. (b) SIGNAL: `loaded_code_drift` intersects each daemon''s own static import closure (`background/code_closure.py`) with `git diff <boot_sha> -> working tree`. Live: 12 observed, 5 red, 7 GREEN on a moved HEAD -- the signal discriminates instead of being always-red. R15 three mutations, each killing named tests: declaration-filter-shrinks-population -> 3 tests; signal-reverts-to-HEAD-comparison -> 2 tests; population-emptied -> 4 tests. Vacuity guard: `vacuous` flag + a live test asserting a non-empty daemon set. Named replay: sim-runner vs fa9a73c72 reads RED on background/sim_runner.py. 93 tests green in the three affected modules.'
  origin_note: 'The R15 shape to hunt is that this detector''s own INPUT is a hand-maintained manifest field -- a checker whose population is declared by the thing being checked can shrink itself to zero and still pass. That is the observed defect, not a hypothetical: the answer it returned on 2026-08-09 was correct for the population it was given and useless for the question asked. Do not fix the two rows; fix how the population is obtained.'
