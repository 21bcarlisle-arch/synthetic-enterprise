atom_id: PW1_staleness_is_code_actually_loaded
map_notes:
  level_note: 'L0->L2 self-certified 2026-08-09. (a) POPULATION: `_systemd_owned_sessions()` DELETED; `observed_launched_by`/`drift_population` derive the set from unit-active + MainPID + /proc cgroup cross-check, and `launcher_drift` turns a wrong manifest row into a LOUD MISDECLARED_LAUNCHER instead of a silent shrink. Live population 5 -> 12 sessions; sim-runner and background-worker are now in it. (b) SIGNAL: `loaded_code_drift` intersects each daemon''s own static import closure (`background/code_closure.py`) with `git diff <boot_sha> -> working tree`. Live: 12 observed, 5 red, 7 GREEN on a moved HEAD -- the signal discriminates instead of being always-red. R15 three mutations, each killing named tests: declaration-filter-shrinks-population -> 3 tests; signal-reverts-to-HEAD-comparison -> 2 tests; population-emptied -> 4 tests. Vacuity guard: `vacuous` flag + a live test asserting a non-empty daemon set. Named replay: sim-runner vs fa9a73c72 reads RED on background/sim_runner.py. 93 tests green in the three affected modules.'
  origin_note: 'The R15 shape to hunt is that this detector''s own INPUT is a hand-maintained manifest field -- a checker whose population is declared by the thing being checked can shrink itself to zero and still pass. That is the observed defect, not a hypothetical: the answer it returned on 2026-08-09 was correct for the population it was given and useless for the question asked. Do not fix the two rows; fix how the population is obtained.


    AS MINTED (moved verbatim from the map''s `name` field 2026-08-10, at the spine size ratchet -- the record is not lost, it is in the place the ratchet exists to push it):

    DIRECTOR_STEER_SECOND_PUBLISH_WEDGE_2026-08-09 DO-NEXT #3 (director: ''your own refinement; it is now the work, not the footnote'') and DECIDED #2 (''a detector for that failure mode that is always red will be ignored exactly as reliably as one that is blind''). Redefine the boot-SHA drift signal from repo-HEAD-moved to CODE-THIS-DAEMON-ACTUALLY-LOADS-moved, and first fix the population it is computed over, which today excludes the two daemons that caused the 10h outage. EXIT: TWO halves, both measured on the live daemon set, neither sufficient alone. (a) POPULATION, and it is an R10 class closure not an instance fix: process_reconciler._systemd_owned_sessions() filters on `e.get(''launched_by'',''tmux'')==''systemd''`, so sim-runner and background-worker -- user-scope systemd units whose own ExecStartPre wrote the boot stamps -- default to tmux and drop out of evaluate_boot_sha_drift()''s answer. The 2026-07-29 cutover patched two manifest rows and left seven identical ones standing, which silently chose which daemons the detector was allowed to watch. EXIT: the manifest''s launched_by is DERIVED from or reconciled against observed reality (/proc/<pid>/cgroup, systemctl --user is-active) rather than trusted, so a wrong row FAILS rather than shrinks the population; the seven double-launchable rows are resolved together; and a test asserts the detector''s population equals the observed running set, not a subset of it. (b) SIGNAL: `stale` is computed against the modules the daemon actually imported (its own file_scope closure), not against repo HEAD -- so a daemon whose loaded modules are unchanged reads GREEN while HEAD moves, and a daemon running pre-fix code for a module it imports reads RED. EXIT: the signal is green on a live tree with a moved HEAD and no relevant edit, and red for sim-runner replayed against the 2026-08-09 fa9a73c72 boot state. R15 both ways: a mutation that empties the population, and a mutation that reverts the signal to HEAD-comparison, must each kill named tests; a vacuity guard must prove the honest path evaluates a non-empty daemon set.'
  name: Is the code the process is RUNNING the code on disk? Closed L2/L2 -- full mint text, cause and exit criteria in origin_note.
