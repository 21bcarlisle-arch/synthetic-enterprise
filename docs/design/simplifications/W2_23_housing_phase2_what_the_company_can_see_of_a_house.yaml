atom_id: W2_23_housing_phase2_what_the_company_can_see_of_a_house
map_notes:
  origin_note: 'DIRECTOR RULING 2026-09-05 section 2 item 1, docs/staging/DIRECTOR_RULING_HOUSING_VALUE_CEILING_AND_SAMPLE_PHASE1_2026-09-05.md, verbatim: ''Phase 2: what the company can see of a house -- the observation layer (EPC as a dated, modelled, ~60%-coverage snapshot; postcode and address as free signals; what the meter reveals).''


    THIS PHASE IS THE EPISTEMIC WALL MADE CONCRETE for the housing axis, which is why registering it matters more than registering its siblings. Phase 1 (W2_18) builds the house''s HIDDEN TRUTH -- physics, ceilings, current settings -- and phase 2 is the only thing that says what a real supplier could ever learn of it. Without phase 2 the company either sees the truth, which is a wall crossing, or sees nothing, which is no product. The mission sentence needs both halves: ''automating ways to FIND individual customers we can create value for'' is a statement about the observation layer, not about the truth.


    THE THREE SIGNALS ARE THREE DIFFERENT EPISTEMIC OBJECTS and the ruling names each with its defect attached. The EPC is DATED (it goes stale as the house changes, which is phase 3), MODELLED (its own model-versus-metered gap is named as a phase-1 register gap), and PARTIAL (~60% coverage -- so ABSENCE IS ITSELF A SIGNAL to be modelled, never a missing value to impute, and imputing it is the defect this row exists to name in advance).'
