- '2026-07-13 BUILT to L3 -- THE ARCHETYPE (fork). Classifies cant/wont-pay from observables (part-payment, engagement, hardship disclosure, consumption) -- never the answer key; epistemic PASS. GATE: PURSUE iff p>R/(R+1), R=8 SIGNED single-sourced from HARM_RATIO_R, flip p/(1-p), strict-> so tie forbears; p=0.9/0.1 MUTATION TEST kills an odds-inverted gate that p=0.5 alone misses (the advisor-flagged trap). Closes W2_7: classification gap 0.128 (fn_ability 0.075 -- a disengaged cant-pay is indistinguishable from a strategic non-payer; fn_willingness 0.25); harm-averse under 8:1 (pursued 42 true cant-pays vs 2882 forborne wont-pays). Not tuned (R12/R13), 18 tests. || 2026-07-13 REGISTERED as a COUPLED-TRIAD company-side twin (COUPLED_TRIAD_DESIGN.md, director P1 THE_COUPLED_TRIAD.md, provenance proposal). W2_7 SME/household willingness -- THE ARCHETYPE coupled pair (design doc highest priority). SIM holds the hidden ABILITYxWILLINGNESS 2x2; the company must CLASSIFY each arrears account through the wall (payment behaviour, engagement, disclosure -- never told) and is ALLOWED to be wrong. GAP = cost-weighted 2x2 misclassification rate / majority-baseline, plus both directional false-negative rates (miss a can''t-pay -> wrongful enforcement harm; miss a won''t-pay -> revenue leak). The harm-cost matrix C is CURRICULUM (R13, director-authored, never agent-tuned toward the gap number) -- ship placeholder weights pending sign-off. Per the two binding rules (CLAUDE.md/A6): this company atom is not complete until it has faced the defeating world (W2_7_willingness_classification) with a non-degenerate gap measured; and W2_7_willingness_classification''s L3 blocks until this twin + gap exist. DECISION GATE (director-signed 2026-07-13, DIRECTOR_ANSWER_HARM_WEIGHTS.md): p = P(wont-pay | observables); PURSUE iff p > R/(R+1); at the signed R=8:1, pursue iff p>0.889 (>=89pct confident) else FORBEAR. The gate MUST be mutation-tested at p=0.9 AND p=0.1, NEVER only p=0.5 -- both p/(1-p) and its inverse (1-p)/p equal 1 at p=0.5, so a coin-flip-point test passes an inverted gate silently (advisor-caught; an inverted gate forbears-when-it-should-pursue and vice versa). loop_stage idle: DISCOVER/FRAME workable now (the company-side capability design), BUILD ranks per dial. The gap metric + harm-cost weights (CURRICULUM, director-signed) are defined in A6_coupled_triad_gap_metric.'
