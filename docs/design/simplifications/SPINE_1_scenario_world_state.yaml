  now binds before stamping. 5 R15 mutations RUN and proven to red the named test (baseline-fallback,
  duplicate-label, drift-guard, unratified-weight, bind-call-removed); 10 new tests in tests/background/test_rotation_curriculum_binding.py,
  adjacent suites 44 green, epistemic verifier PASS (528 files). DORMANCY HELD: all four real worlds still
  carry true_probability null and rotation_eligible False, so COMMERCIAL EV keeps refusing to weight --
  this adds a guard, it does not smuggle a weight into a previously-unweighted ledger. REVERSIBLE JUDGEMENT
  CALL flagged to the director: the label->artefact mapping (glut->supply_glut, crisis-replay->crisis_2021_22,
  NESO-central->neso_central, history-default->history_replay) is the agent''s reading of two director-authored
  name sets; correct it by editing grid_label in the artefact, no code change. STILL OPEN (why level_current
  stays 0, no self-bump): no SIM generator consumes paths_as_of yet, so no run actually LIVES through
  a non-baseline world -- the spine is resolvable but still not consumed; and SPINE_2 curriculum VALUES
  + ratification stay director-reserved (R13).'
- '2026-08-28 CONSUMED (worker tick): the spine is now READ by a generator on a live run path -- the open
  item this record itself named (''no SIM generator consumes paths_as_of yet, so no run actually LIVES
  through a non-baseline world''). BEFORE: `paths_as_of` had ZERO production callers; grep found it only
  in spine.py''s own docstring and its own tests. The spine loaded worlds, resolved grid labels and bound
  rotation cells, and selecting a world changed not one price -- the curriculum was inert and the four
  committed artefacts were unreachable. BUILT: `gas_scenario_generator.generate_gas_scenario_prices(spine=...)`
  re-anchors its regime level from the world''s `gas_trend` path, read per-day through `paths_as_of` so
  it is Blindfold-clean by construction; wired through `run_scenario.build_extended_price_feeds(world_id=)`
  -> `run_forward_scenario(world_id=)`, which stamps `world_id`/`world_version` FROM THE LOADED ARTEFACT
  (never from the argument, so a run cannot claim a world whose artefact says otherwise). UNITS, and the
  check it produced: curriculum gas_trend is p/therm (director, R13); the generator is GBP/MWh. They reconcile
  through the published therm definition (29.3071 kWh), NOT a fitted factor -- DESNZ''s 84 p/therm (2024)
  = GBP 28.66/MWh against this generator''s independently-written baseline_2025 upper-regime mean of GBP
  28.0/MWh, within 3%. Neither number was chosen to make that true, which is why it counts as a check
  on the seam rather than a calibration of it. MAPPING (mechanism = agent''s, per the R13 DECOMPOSE):
  means AND stds scale by one ratio, holding the coefficient of variation -- scaling means alone would
  make the crisis world RELATIVELY calmer than baseline, the opposite of the 2021-22 record, and would
  flatter any hedging result measured in it. The dunkelflaute premium is excluded from the anchor so raising
  a world''s gas trend does not silently reweight its storm days. `price_floor` is not scaled (an absolute
  realism statement, not a level). NO MAGNITUDE LIVES IN CODE: every value read comes from a committed
  director-authored artefact. BYTE-IDENTICAL BASELINE (FRAME A.5, DoD 4) is STRUCTURAL not argued: the
  no-override case returns the ORIGINAL params object, performing no arithmetic at all, so `history_replay`
  cannot drift by a float. RNG-neutral -- the spine changes only the ARGUMENTS to rng.gauss, never the
  number or order of draws. R15: 8 mutations RUN, each proven to red its named test (no-override falls
  through to a default level; spine never consumed = the exact pre-change state; paths_as_of loses its
  blindfold; scale means but not stds; non-positive level falls back to unscaled; no anchor>0 check; dunkelflaute
  folded into the anchor; generator imports saas.churn_model). Two honesty notes on that run: one mutation
  first reported GREEN and did NOT reproduce -- it coincided with a concurrent seat''s commit rewriting
  the tree, and direct rc=1 evidence confirms it fires; and the wall mutation was REDONE with a real module
  (saas.churn_model) after the first attempt used a non-existent one (saas.billing), which had only proven
  that an unresolvable import breaks collection. TESTS: tests/sim/test_scenario_spine_consumption.py (10);
  1237 passed across tests/sim/, tests/simulation/test_run_scenario.py, test_scenario_comparison.py, tests/background/test_rotation_curriculum_binding.py;
  epistemic_verifier PASS. LEVEL MOVE ATTEMPTED AND REFUSED, recorded rather than worked around: `record_level_up_self_certified(SPINE_1,
  2)` raised OPS11 LaneBlockedError -- lane W1_market_weather holds a live blocking finding, WORKER_FINDING_THE_PUBLISHED_SUPPLIER_CHECK_PASSES_ONLY_AGAINST_A_FILE_THE_AB_RUN_WROTE_2026-08-28.md,
  which carries NO severity header and so reads UNCLASSIFIED and blocks every lane. That finding is about
  tools/generate_value_arms_data.py (site publication), not W1, and it was in another seat''s active file
  family at the time; classifying or discharging someone else''s live finding to unblock my own level
  move is the self-serving move SELF-INTERRUPT DISCIPLINE forbids, so `level_current` STAYS 0 and this
  record carries the evidence instead. NOTE FOR THE QUEUE: one severity-less finding currently blocks
  level moves in EVERY lane -- that is a class-level finding about the header convention, not about this
