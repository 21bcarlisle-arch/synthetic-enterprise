- '2026-07-29 WIRED (worker tick): the rotation<->curriculum BINDING built -- the missing join between
  the two director-owned registries. SPINE_1 (curriculum artefacts: history_replay / neso_central / crisis_2021_22
  / supply_glut) and the stratified run-rotation grid (docs/design/run_rotation_grid.json: history-default
  / NESO-central / crisis-replay / glut) were built independently and NOTHING JOINED THEM -- a rotation
