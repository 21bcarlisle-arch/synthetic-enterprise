atom_id: SITE4_ia_register_and_nav
map_notes:
  origin_note: 'The brief reads ''five tabs, in a ruled order'' as one edit. It is sixteen hand edits against twelve distinct nav shapes -- and `site/evidence/index.html`, the largest content page after the wall exhibit, carries no `<nav>` element at all. Worse, the public surface is in THREE states, not two: 10 ADVERTISED (in sitemap.xml), 2 INTERNAL (served 200, deliberately absent from it, named in INTERNAL_DOORS), 5 RETIRED (301 to /proof/, kept in-repo per the retirement convention). The brief''s §7 control #1 has no slot for the third state and so is red on twelve of sixteen areas, with deleting pages we chose to keep as its only green. This atom extends the sitemap-derived register in `site/live_pixel_verify.py` to all three states, derives every nav from it, and lands the failable form of that control -- red-listing the six real orphans (customers, now, glossary, evidence, knowledge, privacy) without yet fixing them. No reader-visible change; it is what makes every later step one edit instead of sixteen.'
