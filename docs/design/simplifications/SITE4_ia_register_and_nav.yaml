map_notes:
  level_hold_note: 'CONTRADICTED AND CORRECTLY FROZEN, 2026-09-06 -- read this before drawing the row again. The evidence for L2 is IN HAND and the move was REFUSED, which is a real state and not a defect in either half. THE RUN: site/test_ia_register.py, 38 passed in 0.59s; and because that file does not cover the row''s second clause (''every page''s nav renders from it''), site/test_every_served_page_takes_the_canonical_nav.py + site/test_live_pixel_verify.py were run too -- 73 passed in 0.79s. The control is the atom''s own: git dates the row''s mint and the control''s birth to the SAME commit, 8a3e002d6 ''SITE4 BUILD (Step 0 of the website structure programme)''. THE REFUSAL: OPS11 in background/gate_authorization.py, because lane H_harness holds 17 live BLOCKING findings -- a new level here would be certified by instruments this lane''s own findings say may be wrong. NOT worked around: accepting 17 limitations to push one row through is marking your own homework at scale. The row moves when the lane''s findings are discharged or explicitly accepted; nothing else about it is outstanding.'
  gain: 'The brief reads ''five tabs, in a ruled order'' as one edit. It is sixteen hand edits against twelve distinct nav shapes -- and `site/evidence/index.html`, the largest content page after the wall exhibit, carries no `<nav>` element at all. Worse, the public surface is in THREE states, not two: 10 ADVERTISED (in sitemap.xml), 2 INTERNAL (served 200, deliberately absent from it, named in INTERNAL_DOORS), 5 RETIRED (301 to /proof/, kept in-repo per the retirement convention). The brief''s §7 control #1 has no slot for the third state and so is red on twelve of sixteen areas, with deleting pages we chose to keep as its only green. This atom extends the sitemap-derived register in `site/live_pixel_verify.py` to all three states, derives every nav from it, and lands the failable form of that control -- red-listing the six real orphans (customers, now, glossary, evidence, knowledge, privacy) without yet fixing them. No reader-visible change; it is what makes every later step one edit instead of sixteen.'
