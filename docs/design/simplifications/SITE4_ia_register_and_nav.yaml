  level_hold_note: 'NOT MOVED ON 2026-09-16, AND THE ELEVEN ARE NOW FOUR -- read this before drawing the row again. The previous note (2026-09-15) said this row "moves the moment that staging archival lands". THAT SENTENCE IS NOW FALSE AND IS WHY THIS ONE REPLACES IT: the archival was read document by document on 2026-09-16 before being committed, and FOUR of the eleven were not discharges at all. Seven were, and they are in the record; the four went back to the staging root, where they still hold H_harness at HEAD, which is the tree OPS11 refuses on.


    THE EVIDENCE IS STILL IN HAND AND UNCHANGED: site/test_ia_register.py + site/test_every_served_page_takes_the_canonical_nav.py + site/test_live_pixel_verify.py, 104 passed, re-run at e5b7a438c; a LEVEL_UP_SELF_CERTIFIED at 2 carrying that evidence is already in the ledger. Nothing about this atom''s own work is outstanding and no further measurement of SITE4 is owed.


    WHAT HOLDS IT NOW IS WORK, NOT A WAIT, and that is the change. The four are named, unbuilt repairs to this lane''s own instruments, not a sibling''s uncommitted rename: (1) stale_copy_refusal.gains_over still grades HOLDER WORK by counting names, with no REPLACEMENT state -- and it fired on background/supervisor.py on 2026-09-16, printing "reverts commit 2212d0eed" and "land this copy" three lines apart; (2) delivery_lane.record_landing is byte-identical to its pre-finding version, so a claim id containing a decimal point still binds nothing and the control its finding named exists nowhere; (3) refresh_to_head has no --superseded door, which is the same name-counting gap as (1) and discharges with it; (4) door_verdicts'' deferred import is still bare, so the census raises instead of answering whenever this tree is behind origin with a sibling module unarrived -- its instance was cleared by the tree catching up, which is the condition passing and not a class fixed.


    THE LARGEST THREE OF THE FOUR ARE ONE CLAUSE -- holder work iff some hunk adds a name HEAD lacks AND deletes no name HEAD has -- computable from the two symbol sets plus the hunk map isolate_hunks already builds. Do not accept the four as limitations to push this row through: the 2026-09-06 answer still holds at a count of four, and three of them are about the instrument that decides whether a landing reverts another lane''s work. The full read, finding by finding with what was run for each, is in docs/staging/WORKER_RESULT_SEVEN_OF_THE_ELEVEN_ARCHIVALS_BLOCKING_SITE4_WERE_REAL_DISCHARGES_AND_FOUR_WERE_NOT_2026-09-16.md.'
  gain: 'The brief reads ''five tabs, in a ruled order'' as one edit. It is sixteen hand edits against twelve distinct nav shapes -- and `site/evidence/index.html`, the largest content page after the wall exhibit, carries no `<nav>` element at all. Worse, the public surface is in THREE states, not two: 10 ADVERTISED (in sitemap.xml), 2 INTERNAL (served 200, deliberately absent from it, named in INTERNAL_DOORS), 5 RETIRED (301 to /proof/, kept in-repo per the retirement convention). The brief''s §7 control #1 has no slot for the third state and so is red on twelve of sixteen areas, with deleting pages we chose to keep as its only green. This atom extends the sitemap-derived register in `site/live_pixel_verify.py` to all three states, derives every nav from it, and lands the failable form of that control -- red-listing the six real orphans (customers, now, glossary, evidence, knowledge, privacy) without yet fixing them. No reader-visible change; it is what makes every later step one edit instead of sixteen.'
