map_notes:
  level_hold_note: 'NOT MOVED ON 2026-09-15, AND THE REASON IS NO LONGER THE ONE BELOW -- read this before drawing the row again, because the cheap probe and the gate disagree and the probe is the one that is wrong.

    THE EVIDENCE IS IN HAND AND WAS RE-RUN at e5b7a438c: site/test_ia_register.py + site/test_every_served_page_takes_the_canonical_nav.py + site/test_live_pixel_verify.py, 104 passed in 1.37s. The second and third are run because the first does not cover the row''s SECOND clause (''every page''s nav renders from it''), as the 2026-09-06 hold below had already established. The controls are this atom''s own build (row and control born in commit 8a3e002d6). VERIFY''s 0b leg is met directly and unusually well: the population is every index.html under site/ that a reader can reach, walked from the tree rather than filtered to the pages that already comply. A LEVEL_UP_SELF_CERTIFIED at 2 is in the ledger for this atom carrying that evidence. Nothing about the atom''s own work is outstanding.

    WHAT ACTUALLY HOLDS IT, which is a DIFFERENT fact from the 2026-09-06 hold. `gate_authorization.lane_blockers(''H_harness'')` returns [] -- and `tools.level_zero_contradicted_by_its_own_controls` therefore reported this row CONTRADICTED and MOVABLE NOW. It is not movable. The pre-commit OPS11 half runs against THE TREE THE COMMIT WOULD CREATE, and there it found NINE live BLOCKING findings in H_harness. Both readings are correct about different trees: another lane has moved those nine from docs/staging/ into docs/staging/done/ IN THE WORKING TREE and has not committed the move, so HEAD still holds them live. Verified per-file with `git cat-file -e HEAD:docs/staging/<name>` against `find docs/staging -name <name>`.

    SO THE MOVE IS DEFERRED, NOT REFUSED, and it was deliberately NOT forced. The discharge path on offer is `record_limitation_accepted` nine times, and the 2026-09-06 hold already answered that for this row at a count of 17: ''accepting N limitations to push one row through is marking your own homework at scale.'' The count changed; the argument did not. THE CONDITION IS NOW SHARP AND SOMEONE ELSE''S: this row moves the moment that staging archival lands. It needs no further work on SITE4 and no further measurement -- re-run the 104 and record. If you draw this row and `git cat-file -e HEAD:docs/staging/SEAT_FINDING_THE_PAIR_MOVE_PARTNER_WAS_HAND_LAUNCHED_INTO_THE_TICKS_OWN_CGROUP_AND_DIED_WITH_IT_LEAVING_NOTHING_2026-09-08.md` now fails, the hold has lifted.

    THE 2026-09-06 HOLD, kept because it is what this note supersedes: it recorded the same L2 evidence in hand, refused under OPS11 on 17 live H_harness blockers, and said the row moves when the lane''s findings are discharged or accepted with nothing else outstanding. That condition is still the right one. What is new is that the lane now LOOKS discharged to every working-tree probe while the committed record still holds it, which is a trap the next reader would otherwise spend a whole invocation walking into -- as I did.'
  gain: 'The brief reads ''five tabs, in a ruled order'' as one edit. It is sixteen hand edits against twelve distinct nav shapes -- and `site/evidence/index.html`, the largest content page after the wall exhibit, carries no `<nav>` element at all. Worse, the public surface is in THREE states, not two: 10 ADVERTISED (in sitemap.xml), 2 INTERNAL (served 200, deliberately absent from it, named in INTERNAL_DOORS), 5 RETIRED (301 to /proof/, kept in-repo per the retirement convention). The brief''s §7 control #1 has no slot for the third state and so is red on twelve of sixteen areas, with deleting pages we chose to keep as its only green. This atom extends the sitemap-derived register in `site/live_pixel_verify.py` to all three states, derives every nav from it, and lands the failable form of that control -- red-listing the six real orphans (customers, now, glossary, evidence, knowledge, privacy) without yet fixing them. No reader-visible change; it is what makes every later step one edit instead of sixteen.'
