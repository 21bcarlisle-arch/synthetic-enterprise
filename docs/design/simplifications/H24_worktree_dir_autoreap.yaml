atom_id: H24_worktree_dir_autoreap
simplifications:
- '2026-07-18 REGISTERED (proposal, director-flagged housekeeping). Finding: fork_reconciler.py classifies orphan BRANCHES (report-first by default, salvage+reap only under .fork_reap_enabled) but does NOT remove completed-fork WORKTREE DIRS -- MERGED forks are CLEANUP_ELIGIBLE but not reaped here, so .claude/worktrees/agent-* accumulate until a manual git worktree remove (orchestrator reaped 7->1 this session). Under a fast fan the manual reap cannot keep up = the director-flagged reap-rate gap. Mechanise: auto-remove worktree dirs for forks whose branch is MERGED-to-main or SALVAGE-TAGGED (never delete unmerged+unsalvaged work; salvage-first discipline, same as the branch reaper). DISCOVER/FRAME workable now; BUILD gated (director opens). Registered per SELF_INTERRUPT_DISCIPLINE (queue, do not fix on sight -- not machine-blocking, worktrees were reaped manually).'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, no code, L0->L1). Gap CONFIRMED against the live tree this session: fork_reconciler.evaluate_fork_lifecycle already IDENTIFIES merged worktree dirs (returns merged_eligible -- directly observed 11 listed earlier this session) but has NO reap ACTION for the DIRECTORIES; it is report-first (enforce=False) and BRANCH-focused, so a fast fan climbs (2->7 observed; 11 seen; manually `git worktree remove`d back to 3). DESIGN (BUILD slice, background/fork_reconciler.py, NOT built here): add an enforce-mode dir-reaper that removes a worktree dir ONLY when ALL hold -- (a) its branch is MERGED into main (merged_eligible: work landed, nothing lost) OR provably salvaged; (b) the worktree is NOT locked and NOT in-flight (an active fork holds a LOCKED worktree -- directly confirmed this session the 2 running forks show `locked`; skip locked, full stop); (c) `git -C <wt> status` is clean of un-merged work. REVERSIBILITY (Rule 0 / director move-dont-rm): `git worktree remove` is reversible (the dir re-adds; the merged branch preserves the commits) -- but keep it safe-by-construction: the three predicates above make an accidental reap of live work impossible, mirroring fork_reconciler''s existing report-first caution. Transition-only reporting (R5): a clean auto-reap is SILENT, only a skip-with-reason or an unexpected count is surfaced. CADENCE: trigger after each successful merge (per-atom, the natural point the dir becomes merged_eligible) AND as a backstop on the reconcile-watch timer, so the count self-limits under a fast fan without manual intervention. RELATES: H22_scheduled_housekeeping (the standing sweep -- this is its worktree-specific mechanised arm) and the H10/H26 worktree-safety line (worktree ops are safe now H24_precommit''s GIT_* leak is fixed). Level 0->1; BUILD gated (director opens); enforce-mode reaping is a lifecycle action so the director''s go-live caution applies to turning it on.'
- '2026-07-18 STEER FOLDED (ADVISOR_STEER_WORKTREE_ALARM_HYGIENE, director: "Still getting several undeclared worktree warnings. If they are fine, I don''t need to see them; if they need action we need to act!"). This atom absorbs the ALARM-hygiene half as ONE worktree-lifecycle mechanism (don''t-accrete): the reaper removes healthy MERGED worktrees SILENTLY (killing the noise source), and the WORKTREE-UNDECLARED page fires ONLY on genuine anomaly -- a worktree that PERSISTS beyond the normal fork lifecycle, is NOT merged/mergeable, or whose COUNT grows abnormally. Healthy in-flight transients (mid-lifecycle, declared-or-mergeable, about-to-reap) are LOGGED not paged (R5 transition-only; an always-fine alarm trains the director to ignore alarms). FAIL-CLOSED spirit preserved: genuine accretion (an orphan, an unbounded climb) must still page LOUDLY -- the fix is signal QUALITY, not deafness. The detector lives wherever the current per-scan WORKTREE-UNDECLARED ping is emitted (fork_reconciler / the mirror scan); the reaper + the page-predicate are the SAME mechanism''s two outputs. BUILD-gated (enforce-mode reap is a lifecycle action). No level change (§0: agent moves no cell).'
- '2026-07-18 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval (route_blocking_decision, item buildopen-h24worktree-2026-07-18, confidence high, DEFERS no) -- canon v2 §3a. 2nd concurrent Epoch-2 foundation fork (H24_precommit disjoint scope; <=3 bound). MAKE_IT_STICK: mechanises the worktree/branch reaping done BY HAND the last two turns (11 orphan branches + a stale a857 worktree). SAFETY (twin-noted): a dir-deleting reaper touches the irrecoverable-data-loss one-way door IF it runs against the live tree -- the door governs the destructive ACTION, not building the mechanism; walled off = fixtures-only, with a mutation test proving a LIVE/locked worktree is NEVER reaped and a merged one IS. Foundation-first (no Epoch-2 product lane; product Epoch-3-gated). Dispatching one worktree build fork on background/fork_reconciler.py. NO level_current change -- L2 stays PROPOSED per §0.'
- '2026-07-18 BUILD DONE, home on main (commit 527812232). Delivered in background/fork_reconciler.py: evaluate_worktree_reap()/classify_worktree_reap() (pure) + reap_worktree_dir() + its own arming flag (.worktree_reap_enabled, distinct from the branch reaper''s), report-first by default. 40 tests green on main; never-reap-live invariant MUTATION-PROVEN (locked / live-unmerged / dirty / main-worktree all NEVER reaped; merged-clean + salvaged reaped -- report AND enforce). SAFE: no arming flag set -> report-first no-op in production (no live deletion; the dir-deleting one-way door governs the ACTION, not the mechanism). LEVEL: build assessed L1->L2-quality; level_current STAYS 1 -- L2 PROPOSED (level_up_proposals.jsonl); blocked_on: director_level_up_L2. FINDING (register-not-fix): not yet wired onto the deadman/reconcile-watch timer (per file_scope), so it does not self-limit in production until that follow-on lands -- natural next atom.'
- '2026-07-18 HARDEN (L2->L2, advisor [STEER] ADVISOR_STEER_REAP_GUARD_MECHANISM; R3 strike-3 + MAKE_IT_STICK: mechanism not memory -- don''t-reap-a-fork-mid-build was already in memory when THREE live forks were destroyed this session by raw git-worktree-remove --force on false-death inference). BUILT: sanctioned single-worktree reap entrypoint reap_one_worktree(path,...) -- the guarded replacement for raw --force. Reuses classify_worktree_reap (no duplicated eligibility logic) + reap_worktree_dir (never --force); REFUSES LOUDLY (removed:False, refused:True, loud:True) a LOCKED or LIVE/IN_FLIGHT-unmerged worktree -- the two states that would have saved all three destroyed forks; eligible removes serialize through shared_tree_lock; never raises. R15: BOTH critical guards mutation-PROVEN to fire (delete the locked-guard OR the IN_FLIGHT-arm and the matching test FAILS; applied/run/confirmed-failing/reverted/confirmed-passing); 4 new tests, suite 44 passed. Landed cherry-pick e5b80fc6d -> main (44 green on main, origin 0/0). DOGFOODED LIVE: reap_one_worktree correctly REFUSED this very fork worktree (branch is IN_FLIGHT -- live/undecided fork, never reaped) on first offer. CAVEAT (logged, not silent): eligibility keys on branch MERGED-or-salvaged; orchestration CHERRY-PICKS fork commits (never makes the tip a main-ancestor) so reap_one_worktree always refuses a cherry-picked fork branch as IN_FLIGHT -- the honest bridge is salvage-tag then git-worktree-remove (NO --force, git dirty/locked net active) then branch -D (how this worktree was cleaned). Not a guard defect (refusing-unmerged IS the safety property); a workflow seam for a future DISCOVER (patch-id content-landed check, or standardize forks on merge-not-cherry-pick). file_scope: background/fork_reconciler.py + its test.'
- '2026-08-03 HARDEN FINDING REGISTERED, not fixed (orchestrator tick, SELF_INTERRUPT_DISCIPLINE = queue, do not fix on sight). THE REAPER CANNOT FIRE ON ITS OWN POPULATION, and reports GREEN while doing so. Measured live this tick, not inferred: evaluate_worktree_reap() over the real tree returned status WORKTREE_REAP_CLEAN, alarm False, eligible 0, reaped 0, kept 24 -- while 20 dead fork worktrees had accumulated, the oldest ~2 weeks. Refusal tally: 13 "uncommitted/untracked changes", 5 "branch is ORPHAN", 3 "branch is IN_FLIGHT", 3 locked (the 3 genuinely-live forks of this tick, correctly refused). ZERO eligible. THE CLASS DEFECT (this is a control SET hole, not a guard defect -- each guard in isolation is correct and R15-proven): eligibility requires MERGED-or-salvaged AND CLEAN, but the documented empirical fact about this project is that FORKS DIE DIRTY, so the conjunction is UNSATISFIABLE for the actual population the mechanism exists to bound. A predicate no real member of the population can satisfy is a control that cannot fire -- R15 doctrine, worse than none. AGGRAVATING, and the reason this went 16 days unseen: the report is FAIL-SILENT by construction -- status WORKTREE_REAP_CLEAN with alarm False is emitted for "nothing is eligible", which is indistinguishable from "nothing needs reaping". The operator sees green precisely while the unbounded-growth condition the atom was built to prevent is running unbounded. Compare the 2026-07-18 note above, which already recorded the mechanism as never wired to the deadman/reconcile-watch timer and its arming flag (.worktree_reap_enabled) never set -- confirmed still False this tick. So: built, never armed, never wired, and its idle report is green. MEASURED DOWNSTREAM COST (why this is not cosmetic): the accumulated unmerged fork branches made the UNMERGED-WORK guard fire on EVERY BUILD candidate in this tick self-refill draw ("every candidate overlaps unmerged work -- keeping full set"), so the guard degraded to a no-op under Rule 0 and contributed nothing to atom selection. Worktree cruft is therefore corrupting the DRAW, not just consuming disk. WHAT A FIX MUST DO (for whoever draws this, exit-criteria shape, R15 both ways): (1) an age-and-abandonment predicate that a dirty dead fork CAN satisfy, distinct from the merged-and-clean predicate -- e.g. no live lock AND no owning pid AND untouched > N days, with the dirty diff PRESERVED (salvage-tag or patch-dump) before removal so nothing is destroyed, only detached; (2) the never-reap invariants for LOCKED and genuinely-live worktrees stay mutation-proven exactly as they are -- those three refusals this tick were correct and must remain; (3) alarm must go TRUE on unbounded growth: a run that keeps N worktrees of which M are abandoned reports M, and WORKTREE_REAP_CLEAN must become unreachable while any abandoned worktree exists, so the green state means what it says; (4) arm the flag and wire it to the reconcile-watch/deadman cadence, else the mechanism stays a library nobody calls -- MAKE_IT_STICK: an unwired reaper is prose. NOT ACTED ON THIS TICK BY DESIGN: reaping 20 worktrees holding real uncommitted work is destructive and irreversible-shaped, was not the drawn work, and 3 live forks were mid-build in the same tree -- the honest act was to measure it, prove the control cannot fire, and register it drawable. Level HELD at 2; no code changed.'
map_notes:
  name: 'Auto-reap completed-fork WORKTREE dirs: fork_reconciler is report-first + BRANCH-focused, so merged/salvaged fork worktree DIRECTORIES have no automatic reaper -- they climb (observed 2->7 in one session) until a manual `git worktree remove`; mechanise a cleanup of CLEANUP_ELIGIBLE (merged) + salvaged worktree dirs so the count self-limits under a fast fan'
