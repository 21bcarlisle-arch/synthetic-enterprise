atom_id: D10_detection_headline_is_single_channel
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). The dimension now has a shape that can see latency, AND the published note states what the set-membership headline is determined by -- the atom asked for either; both landed. DELIVERED: a fourth dimension `detection_latency` on score_triad -- days from an invoice due date to the company FIRST knowledge, whichever channel got there first, with the DD-channel-deleted COUNTERFACTUAL beside it. Seeds 7/11/23 at 400 customers: mean 2.30/2.41/2.04 days with the channel, exactly 5.00 without -- the DD-observation channel buys 2.70/2.59/2.96 days of EARLIER detection while moving the detection gap by exactly zero. That is the finding as a number rather than a paragraph. PREMISE OF THE 2026-08-08 RESIDUAL WAS FALSE and is corrected at every site that repeated it: DD latency was called unmeasurable because the adapter emits `value_date == due_date`; the observation date is `observed_at` (the bank-feed report date), which the seam ALREADY lags 0..ARUDD_NOTIFICATION_LAG_DAYS. Wrong field, not a missing capability -- measured DD lags {0,1,2}. NO NORMALISER (D7 trap applied before it could bite): absolute days, no class-balance denominator, undetected COUNTED beside the mean never imputed into it. RETIRED not re-labelled: stats[detection_latency_days] was days-overdue at the single `as_of` asked at -- {30,51,72} on this period grid, a pure artefact -- now `reconciliation_days_overdue_at_as_of`, its characterization test REPLACED. SECOND FINDING, observed case by case (R9), correcting a sentence on every surface this instrument feeds: the residual is NOT failures the company never observes. n_undetected == 0 on all three seeds -- every truly-failed case was flagged on time at due+grace; the misses are detections the company UN-MADE when a later ambiguous non-DD payment was allocated oldest-first onto the failed invoice (Clayton Case; D8_ambiguous_remittance_misdating, whose evidence this becomes). R12 CLEAN: no published number moved -- the detection gap is byte-for-byte unchanged and only the sentence describing it did. R15: four mutations proven to fire on their own named defects (value_date misread; population defined at `as_of`, which moved the mean 1.96->1.80 for zero change in any detection date; DD-only cases folded into the counterfactual; both channels dead, proving the n_undetected==0 witness is not vacuous) plus two shape mutants of the metric (divide by the truth count, impute undetected at a cap) each swinging where the real measure is flat. 31 tests green in tests/tools/test_couple_w2_11_d5.py, 467 across every file touching the triad or gap_metric, ruff unchanged at 18 vs a pristine HEAD extract. L3 NOT claimed: no Expert-Hour pass, and the tick that finds a published sentence wrong is not the tick to certify the instrument as real.'
  origin_note: 'Minted 2026-08-08 when D7 landed. NOT new evidence -- the finding was MEASURED during the 2026-08-08 H27 HARDEN pass and written into H27''s harden_note, where it had no atom and so was not drawable. It is now H27''s SOLE remaining reason for holding at L2 (D7 removed the other), so it needs an id the draw can see: an unblockable reason living only in prose is how a hold outlives its cause. R12: the union-blindness is a MEASURED LIMIT reported honestly, never a number to tune -- a fix that moves the detection gap by making the DD channel ''count'' without the company detecting anything earlier would be goal-seeking. R15: whatever shape replaces it needs a mutation proving it distinguishes early detection from late.'
