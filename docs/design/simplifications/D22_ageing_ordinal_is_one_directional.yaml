atom_id: D22_ageing_ordinal_is_one_directional
map_notes:
  build_note: 'BUILT 2026-08-10 (worker tick, L0->L2): the ageing headline is RESHAPED onto `balanced_bucket_displacement` -- the mean of the ordinal displacement over the truly-overdue invoices and the ordinal displacement over the truly-current ones, each on its OWN denominator (D11''s balanced shape, D7''s denominator rule). THE DEFECT CLOSED: the headline was `mean_bucket_displacement`, a mean over the truly-overdue population alone, so the register''s own degenerate -- perfect on the overdue book, whole current book dumped in `90+` -- scored 0.000000, bit-identical to a perfect dater, with 10,758 cases changed at seeds 7/11/23. It now scores 1.5 against a perfect dater''s 0.0 on all three seeds, and an over-ageing of ONE bucket scores 0.5 where a stone-blind one scores 1.5: the off-by-one-vs-stone-blind distinction this dimension exists to make, previously available in one direction only, now holds in both. WHY THIS SHAPE AND NOT THE OBVIOUS ONE -- measured, not argued: averaging displacement over the WHOLE population also counts both directions, and re-imports D6 Defect 2, because its denominator counts the truth''s class balance. With company behaviour held LITERALLY FIXED (every overdue invoice one bucket out, 5% of the current book over-aged by two) it swings 0.1089 -> 0.5500 as arrears prevalence moves 1% -> 50%, a factor of 5.05; the balanced form is flat at 0.5500 across the same sweep (swing x1.00). That shape is pinned as `_MUTANT_headline_is_the_pooled_mean` and the prevalence property must reject it. R15 BOTH WAYS, and the mutations restore the REAL historical shapes rather than invented ones: `_MUTANT_headline_is_the_overdue_term_only` is the pre-2026-08-10 scorer, and the direction property must reject it naming the over-ageing direction; in the pair''s own suite a `_pre_d22_ageing_scorer` context manager puts that scorer back so the register''s lying-declaration, cover-claim-covering-nothing and unowned-hole mutations still have a genuinely one-directional dimension to fire on -- which is STRONGER than what they had before, when they reinstated the defect as a declaration over an already-blind scorer. THE CLASS CONTROL CAUGHT ITS OWN ENTRY ROTTING the moment the reshape landed (HEADLINE_DIRECTION_COVERAGE''s second rule: a debt entry that DOES tell its degenerate apart has been fixed and must be re-derived) -- the entry is re-derived to headline_counts_both_directions=True, debt_atom=None, and the register is still differential (detection_latency remains the conditional-population entry, so it is not a register whose every row lands on one side). PUBLISHED NUMBERS MOVED, which is why this was a mint and not a fix on sight: the offline pair''s ageing headline went 0.178744 -> 0.095732 at seed 7 (0.175119 -> 0.094125 at 11, 0.164791 -> 0.087894 at 23). R12: it moved because the measure was reshaped, never because a value was wanted. VACUITY WIDENED, and this is the fail-open the reshape could have introduced: the headline is None if EITHER truth class is empty -- never the surviving half, which would silently restore the one-directional headline on exactly the populations where nobody could check it. NON-COMPARABILITY IS STAMPED AT SOURCE: every ledger entry before 2026-08-10 carries the truly-overdue-only figure, so `ordinal_direction_caveat` says in words that the two are different measurements and must not be quoted as one, and `format_ageing_summary` prints the headline''s two halves beside it (the D7 anti-decay mechanism, extended). WHAT THE HEADLINE STILL CANNOT SAY, declared rather than discovered later: which DIRECTION the displacement came from -- a company one bucket out on every overdue invoice and one over-ageing half its current book score alike. Both terms are published beside it and interpolated into the caveat from the measurement. OPEN AND REGISTERED, not fixed here (the D19 precedent, one atom over): `background/live_payment_triad.py::_ATTRIBUTED_MEASURES` attributes the D8 remittance counterfactual over `ageing.mean_bucket_displacement` and the two rates. The over-ageing SEVERITY term did not exist when that list was written and now does; whether the ambiguous-remittance channel explains any of it is a D8 question this build declined to answer on its owner''s behalf, and adding a measure moves that pair''s published n_fully_attributed count. EVIDENCE: 259 green in tests/tools/test_d7_ageing_measures.py + tests/tools/test_couple_w2_11_d5.py (11 new/reshaped), 2,239 green across every suite touching the ageing dimension (live triad, billing, W2_11, the D6 characterization, the misapplication call-site register).'
  name: 'The W2_11<->D5 triad''s AGEING dimension publishes an ORDINAL headline -- `mean_bucket_displacement`, the term that exists so the dimension can ''''distinguish off-by-one from stone-blind, which an error rate cannot'''' -- taken over the TRULY-OVERDUE population alone, so no amount of OVER-ageing can move it. Measured 2026-08-10 (H27 Expert Hour #6, n=4000, seeds 7/11/23): a company that dates every truly-overdue invoice perfectly and dumps its ENTIRE truly-current book into `90+` scores 0.000000 -- bit-identical to a company that dates every invoice right, with 10,758 cases changed -- and so does one that over-ages every current invoice by exactly ONE bucket. The over-ageing direction is not invisible to the DIMENSION (`overstated_arrears_rate` counts it) but it is invisible to the ORDINAL term, which is the whole of what this dimension adds over a rate; in that direction the measure degrades to the error rate it was built to replace, and the distinction between a 30-60 and a 90+ wrongful ageing -- different collections paths in a real supplier -- is unavailable. NOT COVERED BY A SIBLING: D16 measured that detection''s false_flag_rate is a different quantity over a different population, so nothing in this instrument sees over-ageing SEVERITY. THIS ATOM IS THE RESHAPE (a headline covering both directions), which moves a published number on every pair calling `ageing_gap` and is therefore a mint rather than a fix on sight. Already landed under H27''s Hour: the class control HEADLINE_DIRECTION_COVERAGE (every published dimension''s own indiscriminate degenerate, scored through its own shipped scorer, keyset DERIVED from what is published so the detection-keying that let this class escape twice is gone), and the mirrored term `mean_overstatement_displacement` + `ordinal_direction_caveat` stamped AT SOURCE in gap_metric so every caller gets the severity the headline cannot express.'
