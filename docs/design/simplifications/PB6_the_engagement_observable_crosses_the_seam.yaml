atom_id: PB6_the_engagement_observable_crosses_the_seam
map_notes:
  gain: 'PB4 gave engagement an observable antecedent -- payment channel, anchored on Ofgem CIM w6 (standard credit 5.7%, prepayment 3.1%, base 5.3%) -- and measured it recoverable: held-out +0.1192 against a null of 0.0403, where the same instrument on the pre-PB4 world scored -0.0106 and did not clear. NONE OF THAT REACHES THE COMPANY. `company/interfaces/sim_interface.py` does not pass payment method; `company/crm/vulnerability_index.assess` takes a `has_ppm` argument and has NO CALLER anywhere in the tree. So the world knows something a real supplier plainly knows about its own billing arrangement, and the company cannot see it. R1s claim is that the company faces a world it could in principle learn from; a trait that stops at the wall satisfies the letter of that and none of it. THE EPISTEMIC QUESTION IS SETTLED AND EASY: how a customer pays IS the suppliers own record, not simulation ground truth -- a direct debit mandate is set up WITH the supplier. It crosses as an observable, through the seam, never by import.'
map_records:
  expert_hour_findings:
  - 'EXPERT HOUR 2026-09-29, HARDEN stage, blind pass via `tools/blind_review.py` (persona: veteran of UK domestic energy retail retention and customer analytics; capability restated blind-safe; packet + 15-question battery recorded verbatim in docs/observability/blind_review_ledger.jsonl, blindfold re-derived PASS by --audit; independence: false per 3c). VERDICT: FAIL at the L3 bar -- HELD AT 2. Graded against HEAD 629b6306f. PASSED: Q3 (only renewal departures book a loss -- the booking sits in the renewal-churn branch of `run_phase2b`, so deaths and home moves never reach the numerator), Q4 (exposure is renewal decisions, channel as priced, closed years only), Q5 (the survey is used only as a ratio to its own base), Q7/Q9 (weight is V_prior/(V_prior+V_evidence) on an effective n that shrinks for a thin channel; a near-zero-leaver year adds decisions to both ends of the ratio and leaves the factor anchored), Q14 (wave and table cited). The reviewer''s first doubt, formed on the description alone, was the one that landed.'
  - 'EH-1 OPEN (Q1+Q2, DISQUALIFYING -- "actual vs predicted, or raw per-method rate vs the book?"). RAW. `CompetitivePressureLedger.payment_method_engagement_reading` learns p_method/p_book, a MARGINAL ratio, and the factor multiplies an estimate that already carries CONDITIONAL signals correlated with channel: `churn_desk` places an account inside the SVT drift band by payment behaviour, justified by the debt-objection regime, and the CIM prepayment 3.1% already contains the indebted prepayment households that regime blocks. So a prepayment account in arrears is made less likely to leave twice, and a learned factor absorbs whatever the book''s own pricing does differently by channel. The published prior has the same property (a survey marginal), so the fix is not only the likelihood. REMEDY: learn the channel''s observed/expected against the PRE-factor belief, relative to the book''s O/E (the ledger already books `believed_p_leave`; it needs `expected_by_method` of the pre-factor estimate), and state the prior''s overlap with the arrears term or condition it. MAGNITUDE NOT MEASURED -- predict before running: the prepayment factor moves UP toward 1.0 under O/E. Cannot yet say by how much.'
  - 'EH-1 REMEDIED 2026-09-29 (company side, unit-proven; the real-run magnitude is still EH-2''s). The ledger books the PRE-factor belief (`expected_pre_by_year`/`_by_method`, from `churn_desk._pre_engagement_estimate`), and the likelihood is channel O/E over book O/E on it. A SECOND defect found while drawing it: the blend was `prior x ratio ** w` on a ratio that is itself a factor estimate, so it converged to prior x truth. A book confirming CIM read 0.344 against a prior of 0.585. Now `prior x (ratio/prior) ** w`. The prior is still a survey marginal; that gap is named in the docstring, not filled. Finding + pre-registration: docs/staging/done/WORKER_FINDING_THE_ENGAGEMENT_FACTOR_COUNTS_ITS_OWN_PRIOR_TWICE_AND_LEARNS_AGAINST_THE_WRONG_EXPECTATION_2026-09-29.md.'
  - 'EH-2 OPEN (Q8, DISQUALIFYING -- "plant 0.5x and plant nothing; does the company recover both?"). No such control exists on the company side. The engagement tests feed the ledger synthetic counts; PB4''s held-out +0.1192 is a WORLD-side recoverability measure and says nothing about what the company''s posterior converges to. A planted-effect run and a null run (channel propensity equal) through the real loop, grading the company''s end-of-run factor against the planted ratio, is the control. Run it after EH-1, since under the raw ratio the null arm will read the arrears correlation as engagement.'
  - 'EH-2 RUN 2026-09-29, FAIL: the company does not recover a planted channel effect, and the reason is structural rather than the rule. `tools/_pb6_engagement_recovery_arm.py`, one full-window run per arm at `ad3e03018`: null (world PPM multiplier 1.0) reads 0.537 on 20 prepayment decisions; planted (0.307) reads 0.584, the prior, because the plant cut prepayment decisions to 2, all in 2017. The world expresses shops-less as SVT exposure (`active_renewal_probability_for_customer` only decides SVT stints; the departure roll omits the channel), and the ledger counts fixed-renewal decisions only. CIM is per household-time; the ledger is per decision. Which one is meant is a definition to settle before any remedy. The book (84-91 closed decisions) is also too small to grade the rule. Pre-registration, results and the refuted null prediction: docs/staging/done/WORKER_FINDING_PB6_EH2_THE_PLANTED_CHANNEL_EFFECT_NEVER_REACHES_THE_DEPARTURE_BRANCH_2026-09-29.md.'
  - 'EH-3 OPEN, WORLD (Q11, DISQUALIFYING as asked). `payment_channel_for_customer` is "stable for the account''s whole tenure" and takes no date. Real books migrate ~1-3%/yr (failed DD to standard credit, debt to a prepayment install, smart meter switched to prepay mode). The seam reads the supplier''s record correctly; the record never changes. A sim-lane fidelity item, not a seam defect.'
  - 'EH-4 OPEN, MISSION (Q15, DISQUALIFYING). The factor gates retention offers: `company_est_pre > RETENTION_THRESHOLD` decides whether an offer is made, so a prepayment factor of ~0.58 withholds offers from exactly the channel least able to leave. Nothing checks whether that is value created or value transferred. This is the director''s frame to set, not a threshold to pick.'
  - 'EH-5 minor (Q10). The seam''s lookup-failure fallback to direct debit is silent: no count, and a defaulted account enters the learning step as a direct-debit renewal. Near-zero today (the lookup is deterministic), so it is a latent defect, not a live one.'
  - 'DEFINITION SETTLED 2026-09-29 (after EH-2): the factor is used per DECISION (it multiplies the at-this-renewal estimate that gates offers), so the ledger''s per-decision denominator is right. The CIM prior is per household-TIME = reach x per-decision, and nothing publishes the split: a declared gap. Measured: the world rolls one renewal twice on one seed (schedule with the channel, departure branch without), so a prepayment decision reached is active 100% vs DD 94%; the whole channel effect is in decisions reached, and SVT stints have no departure path. Next: the sim-lane repair (one roll + an SVT departure hazard), then re-centre the prior. docs/staging/WORKER_FINDING_PB6_THE_ENGAGEMENT_FACTOR_IS_USED_PER_DECISION_AND_ITS_PRIOR_IS_PER_EXPOSURE_2026-09-29.md.'
  - 'NULL ARM GRADED + EH-5 REMEDIED 2026-09-30. Under the prior centred at 1.0, the null arm (truth 1.0) reads prepayment 0.739 on 20 decisions (4 lost / 6.83), DD 0.984, and all three filed predictions held. The remaining gap is sampling at w 0.41, so the rule cannot be graded finer below PB1 scale. EH-5: the seam refuses a lookup with no account instead of booking it as direct debit. A sibling HEAD red is re-keyed to the property, with the live path reading no book declared as a gap. Open for L3: EH-3 (world, channel migration) and EH-4 (the offer-gating frame). Same finding file as DEFINITION SETTLED.'
  - 'PARKED 2026-09-30, NO BOUNDED-TICK WORK LEFT; each residual has a release outside this row. EH-3: PB8 (no normal-year channel-migration rate is published). EH-4: the premise it was asked on is gone. At the 1.0 centre, prepayment loses an offer only on the company''s own book (10 fixed decisions in nine years in the head world). The question under it is not PB6''s: the offer guard (`run_phase2b`, `expected_margin + acq_cost_saved > ret_cost`) scores the company side only, and EH-4 asks whether withholding is value transferred. That is the household side entering a decision surface, which `tests/company/test_household_share_is_not_yet_a_target.py` holds for the director''s decision on the two-sided objective (A47/R13). A threshold picked here would pre-empt that decision. EH-2: the planted arm''s 0.307 is per exposure. The per-decision truth in that world is about 1.0, and the arm reads 0.982, but on n=2 that grades nothing. Graded only on a book near PB1 scale; the real run books 84-91 decisions. EH-1 and EH-2 findings archived to docs/staging/done/; the per-decision finding stays in staging on the practitioner question.'
