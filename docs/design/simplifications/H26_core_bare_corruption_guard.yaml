atom_id: H26_core_bare_corruption_guard
simplifications:
- '2026-07-18 REGISTERED (proposal, real incident, observed-with-evidence R9). OBSERVED: mid-session, plain git in /home/rich/synthetic-enterprise returned is-inside-work-tree=false and worktree-list showed the main tree as (bare); `git config core.bare` = true. This silently breaks EVERY work-tree git operation (commit, publish, status) -- a publish-integrity/commit-integrity risk of the same family as the publish_gate wedge (site goes stale, no commits land). FIXED this session by `git config core.bare false` (verified restored). INFERRED (not yet root-caused): set by a worktree remove and/or a concurrent daemon running git outside tree_lock between the last clean push and the activation. HARDEN: root-cause the setter; add a cheap guard (tree_lock or the pre-commit gate asserts core.bare==false and repairs+alarms), since a bare main tree defeats the whole publish/commit chain. DISCOVER/FRAME workable; BUILD gated.'
- '2026-07-18 FRAME (Lane-3 DISCOVER, orchestrator, doc-only, BUILD-gated so NO code -- did NOT spawn a worktree fork, deliberately: spawning one to investigate a worktree/git-corruption incident is the very risk. L0->L1). ROOT CAUSE now DEFINITIVE (supersedes this atom''s own INFERRED worktree guess above): it was H24_precommit_gate_git_env_isolation. The pre-commit test-gate (tools/pre_commit_test_gate.py) ran the changed test files via pytest DURING `git commit`, inheriting the commit''s GIT_INDEX_FILE/GIT_DIR/GIT_WORK_TREE; git-touching gate-run tests (which init temp repos and run git config/init -- e.g. test_worktree_isolation.py, test_fork_reconciler.py, test_tree_lock) then operated on the SHARED main .git instead of their tmp repo, flipping core.bare=true (plus phantom index deletions and once a tree-deleting commit). VERIFIED FIXED + LIVE (R1/R2): H24 shipped commit 35d7ba64b and tools/pre_commit_test_gate.py:84-95 now scrubs every GIT_* key from the pytest subprocess env (gitless_env), comment naming this exact core.bare corruption -- read and confirmed present in the running hook this pass. So THE trigger is removed. H26''s remaining brief is therefore CAUSE-AGNOSTIC DEFENSE-IN-DEPTH: a bare main tree defeats the entire publish/commit chain regardless of what sets it, so make that state LOUD, never silent (R15 fail-silent family; same class as the deadman that could not fire and the transport LOOP_STALE gap). GUARD DESIGN (the BUILD slice, NOT built here -- file_scope background/tree_lock.py): (1) assert_repo_not_bare(repo_dir=None) -- `git rev-parse --is-bare-repository` (fail-safe: an undeterminable result logs+proceeds, never blocks all commits on a transient git hiccup); if bare, LOUD RepoBareError + auto-repair `git config core.bare false` (safe+reversible: a work tree''s core.bare must always be false) + transition-only notify(kind=real_alarm). (2) WIRE into tree_lock().__enter__ -- every commit serialises through tree_lock (CLAUDE.md), so a corrupted core.bare fails loud at the next commit attempt, cause-agnostic, cost = one git call (the common_git_dir pattern already pays it). (3) DETECTOR in health_check/process_reconciler (transition-only) so it is caught BETWEEN commits too. (4) R15 mutation test: tmp repo core.bare=true -> guard raises+repairs+alarms; false -> passes; git-unavailable -> logs not fail-open. HONEST MAP-HYGIENE NOTE (not this atom''s fix): H24 and H23 both read level_current 0 in the map though their code fixes SHIPPED (35d7ba64b live-verified for H24) -- a stale level-record, flagged for the level owner. loop_stage stays idle; BUILD of the guard awaits open per epoch gating.'
- '2026-07-18 BUILD OPENED (loop_stage idle->build) by DIRECTOR_TWIN approval (director_twin.route_blocking_decision, item buildopen-h26-openepoch-2026-07-18, logged director_twin_log.jsonl 2026-07-18T11:15, confidence high, DEFERS_TO_DIRECTOR no) -- canon v2 §3a delegates BUILD-within-the-open-epoch to the twin. Declared FOUNDATION-FIRST (draw-mix): no Epoch-2 product lane exists to run in parallel (product atoms are all Epoch-3-gated, already escalated as the D5/triad sequencing); this guard protects the commit + site-refresh chain that is the director''s window (R15 fail-silent family). Guard design already complete (assert_repo_not_bare in tree_lock.__enter__ + detector + R15 mutation test; file_scope background/tree_lock.py); dispatching one worktree build fork. NO level_current change -- L3 stays PROPOSED to the level owner on completed BUILD+VERIFY per the §0 gate.'
- '2026-07-18 BUILD DONE, home on main (commit 0b74104f2, cherry-picked from the twin-authorized fork so its stale daemon-file base never dragged back over main). Delivered: background/tree_lock.py -- RepoBareError + _is_bare_repo() (fail-safe detect) + assert_repo_not_bare() (auto-repair `git config core.bare false` + transition-only real_alarm) wired into tree_lock().__enter__ (every serialised commit checks); background/deadmans_switch.py -- _check_repo_not_bare() in run_cycle() so a bare-flip BETWEEN commits surfaces within one deadman poll (the real incident had no commit in flight when it flipped), sharing the guard''s transition key so per-commit + periodic never double-page; tests/background/test_core_bare_guard.py -- 7-test R15 mutation suite on an ISOLATED tmp repo (never the real .git). VERIFIED ON MAIN (R1/R2): 38 tests green (core_bare_guard+tree_lock+deadman), epistemic PASS. R15 proven BOTH directions + fail-safe: core.bare=true -> raises RepoBareError + repairs (reads back false) + exactly one real_alarm; core.bare=false -> silent pass; undeterminable (_is_bare_repo None / git missing) -> does NOT raise, does NOT alarm, logs ''undeterminable'' (fail-SAFE, not fail-open); a wiring test proves tree_lock().__enter__ itself raises on a bare repo and still releases the lock. LEVEL: build assessed L3-quality (fires on named defect via mutation test + wired into the real commit path + live between-commits detector) but level_current STAYS 1 -- L3 PROPOSED to the level owner (docs/observability/level_up_proposals.jsonl, AWAITING_DIRECTOR_ADVISOR); blocked_on: director_level_up_L3 so the BUILD draw stops re-offering (only gap = the ratification, which flows via the proposal + [ACT], not the build lane; R3 no re-bump). FORK FINDINGS registered (SELF_INTERRUPT, register-not-fix): (a) shared_tree_lock() (cross-worktree lock) left UNGUARDED per task scope -- a bare-flip during a shared-lock-only op before any tree_lock() call would only be caught by the periodic deadman (<=5min lag), not instantly; worth a follow-up atom if it bites. (b) _BARE_REPO_RE_ESCALATE_SECONDS (3600) is a local duplicate of deadmans_switch''s RE_ESCALATE_SECONDS by deliberate anti-coupling choice; a future refactor may want one shared constant. (c) health_check.py deliberately untouched -- deadmans_switch is the only periodic safety-net daemon (its own docstring), the correct host.'
