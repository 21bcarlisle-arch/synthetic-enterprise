atom_id: D27_belief_window_saturates_on_this_book
map_notes:
  name: 'The W2_11<->D5 triad''s two BELIEF dimensions read exactly ONE company parameter -- `PaymentObservationConsumer._dd_failure_window_days`, how far back `_arrears_risk_belief` still counts an observed failed collection -- and the harness builds the company with DD_FAILURE_WINDOW_DAYS=400 against a book whose oldest observed failure is 91 days old at `as_of`. So no event can EVER fall out of that memory: MEASURED 2026-08-10 (H27 Expert Hour #9), n=300, seeds 7/11/23 and bit-identical at all three, every window from the book''''s span to INFINITY publishes the same figure (+1d, +500d and -308d all read the baseline exactly), while a 310-day shortening -- precisely the headroom the population-side predictor names in advance -- is the smallest memory error the dimension can resolve at all. The published number therefore cannot distinguish the scored company from one that NEVER forgets a failure, which is the direction that keeps a recovered customer in collections; and the organ''''s OWN shipped default (90d) sits just below the band edge, publishing a different number (0.1519 -> 0.1709 at seed 7). The 400 was deliberate and its reason is still in the constant''''s comment -- generous on purpose, so the recency window would not confound the CHANNEL blind spot this scenario measures -- but what was never measured or declared is that the same choice costs the dimension all resolution on the only company parameter it reads: a design note stood in for a measurement. Same class as D25 and D26, one boundary further out again: the book has no event sitting BESIDE the line this dimension reads. THIS ATOM IS THE RESHAPE -- a scored population whose event span and company memory can actually resolve a memory error (a longer book, several `as_of` readings, and/or the harness building the company at the organ''''s own default) -- which moves every published belief figure on this pair and is therefore a mint rather than a fix on sight. ALREADY LANDED UNDER H27''''s HOUR: the declared counterfactual company `organ_failure_window_drift_days` (the third in this harness, and the first that reaches this organ at all), the class control that makes every OFF-PATH register entry owe a graded band on its own organ''''s knob rather than discharging itself with an indiscriminate degenerate, the population-side predictor `measure_belief_window_resolution` (derived from the world''''s event dates and the declared window, never from the organ''''s severity thresholds -- the D20/D21 tautology in the direction nobody checks), and `belief_resolution_caveat` stamped into BOTH belief dimensions'''' note and components.'
  frame_note: 'FRAMED 2026-08-14 (worker tick, DISCOVER/FRAME lane; NO BUILD code -- the atom is epoch-parked). Settled design: docs/design/D27_BELIEF_WINDOW_RESHAPE_FRAME.md. THE RESHAPE MOVES THE ORIGIN, NOT THE BOOK -- the census already says DD_FAILURE_WINDOW_DAYS is ''not a band constant, it is the ORIGIN the band is measured from'', the below-edge is D29''s and the above-edge is D30''s, and this atom owns only where the SCORED COMPANY sits (308-309d inside the blind band). MEASURED 2026-08-14, n=300, seeds 7/11/23, shipped build_scenario/score_triad/measure_belief_window_resolution with candidate constants monkeypatched in a scratch script: (A, shipped 3-period book + 400d window) headroom +309/+308/+308, saturated, and every drift from -5 to +500 bit-identical on both belief dimensions. (B, RECOMMENDED -- same book, company built at the organ''s OWN shipped default PaymentObservationConsumer(dd_failure_window_days=90)) headroom -1/-2/-2, NOT saturated, 3-4 of 96-113 observed failures fall outside memory, belief 0.1708861/0.2037037/0.1411765 and the predicted saturation edge moves from -308 to +1/+2/+2: a company that never forgets is a different number on every seed. AND THE EQUALITY THAT STATES THE FINDING: at window 90 the +500 column reads 0.1518987/0.1913580/0.1352941 -- bit-identical to what the pair publishes TODAY, so today''s figure IS the never-forgets company''s figure. R13 differential measured: ageing/detection/detection_latency bit-identical between A and B on every seed. (C, 13-period annual book + 400d window) STILL SATURATED at +98/+99 headroom on ~4x the scoring cost -- lengthening the book does NOT discharge this atom, which is the decisive negative result; (D, 13 periods + 90d) resolution bought by putting 78-80% of events outside memory, i.e. the CHANNEL blind spot this scenario exists to measure is destroyed; (E, 20 periods + 400d) works at ~6x cost but is D30''s lever and leaves the origin arbitrary. THE TENSION IS NAMED RATHER THAN SPLIT: the 400''s stated reason (keep recency from confounding the channel reading) and resolution are in direct conflict, because resolution REQUIRES events falling out of memory -- so the scored company takes the organ''s default and the old 400 stays as the declared never-forgets counterfactual, with the DIFFERENCE published as a recency component (0.0190/0.0123/0.0059 = 12.5%/6.4%/4.3% of the shipped figure). BUILD exit criteria + their R15 mutations are in the doc: window DERIVED from the organ''s signature (a hand-typed 90 is D20 one field over), scored-company-not-saturated control, differential world fingerprint, the recency component measured not frozen, and PER-DIMENSION bands (belief_population_mix resolves coarser -- seed 23''s -1 moves belief alone). NOT A TUNING (R12): the candidate was fixed on the only non-arbitrary value available (the organ''s own default) before B''s figures were read; the published belief figures move as a consequence and are reported, not selected for.'
  discover_note: 'DISCOVERED 2026-08-14 (worker tick, DISCOVER/FRAME lane; NO BUILD code -- the atom is epoch-parked). Doc: docs/design/D27_CONSTANT_PROVENANCE_CENSUS_DISCOVER.md, taking the FRAME''s own §7 third bullet (= Hour #9''s third lead): the census of constants chosen to remove a confounder did not exist. IT EXISTS NOW, and its headline is not the class the lead asked for. SCENARIO_CONSTANT_CENSUS measures each constant''s mechanical ROLE (`bounds_resolution`/`sets_edges`, by perturbing the age-span predictor); nothing anywhere records WHY THE VALUE IS THE VALUE, which is D27''s complaint one level up -- a design note standing in for a measurement. PROVENANCE, read off the source over `scenario_constants()`''s own 8-constant subject: 1 derived+argued (BILLING_CYCLE_SPREAD_DAYS), 1 organ-derived by hand (PAYMENT_TERMS_DAYS=14, verified against arrears_engine.py:100/186/408/796 -- correct today, unpinned tomorrow, i.e. the FRAME''s own criterion-1 hand-copy exposure one field over), 2 confounder-removal (AS_OF_BUFFER_DAYS=30, DD_FAILURE_WINDOW_DAYS=400), and FOUR WITH NO STATED REASON AT ALL -- N_PERIODS, PERIOD_SPACING_DAYS, FIRST_DUE_DATE, BILL_AMOUNT_GBP. The largest class is `unstated`, and it contains the two constants that set the band''s UPPER edge: D30 is positioned to change a value that has never had a recorded reason, so ''what does the new value buy'' has no baseline to answer against. THE SECOND CONFOUNDER-REMOVAL CONSTANT, MEASURED (2026-08-14, n=300, seeds 7/11/23, shipped build_scenario/score_triad, buffer monkeypatched in a scratch script): the stated reason for AS_OF_BUFFER_DAYS=30 is discharged at ~6 -- payment_terms is behind the due date BY CONSTRUCTION (`issue = due - PAYMENT_TERMS_DAYS`) so its term does no work at all, the ARUDD lag is 0-2d, and the binding requirement the comment never names (DEFAULT_RECONCILIATION_GRACE_DAYS=5) clears at 6. The 24 days past that buy ARREARS MATURITY: truly-overdue 64->102 (seed 7) from buffer 6 to 30, so a short buffer would score the company against a book whose arrears have not finished forming. The 30 IS defensible; its stated justification is not the reason it is defensible, and a reader auditing the constant against its comment would conclude 6 sufficed and be wrong for a reason never written down. AND IT IS NOT INERT ON A PUBLISHED FIGURE: `ageing` moves 0.1129626->0.0789263 (seed 7), 0.1915354->0.1682440 (11), 0.1193996->0.0805192 (23) across buffer 30->6 -- 30%/12%/33% of the shipped figure, monotone on all three seeds. The census records this constant as an edge-setter (true, D29''s) and nothing records that a third of a headline rides on the choice, because `sets_edges` is measured against the PREDICTOR and a constant inert on the edges can still move a headline (which is exactly what DD_FAILURE_WINDOW_DAYS is). R12: no value change is proposed or implied -- 6 is not proposed and 30 is not defended by its output; the finding is that the choice is unmeasured and the remedy is a recorded measured reason. Four BUILD exit criteria with their R15 mutations are in the doc (a closed `value_provenance` vocabulary where `unstated` is a VISIBLE answer; a confounder-removal entry owing a measured cost, discriminating in both directions; `organ_default` derived by `inspect` not hand-typed; and the moves-a-published-figure leg measured SEPARATELY from `sets_edges`). Owners handed over in writing: D29 for the buffer, D30 for the two unstated edge constants; D27 owns the census shape. LEVEL STAYS L0 AND THAT IS CORRECT, not a hold: L1 is ''been BUILT in any form'' (MATURITY_MAP.md §3) and this atom''s deliverable is a reshape of tools/couple_w2_11_d5.py, which is epoch-gated -- the doc is not this atom''s deliverable, so DISCOVER cannot move it.'
  scoring_side_discover_note: 'DISCOVERED 2026-08-14 (worker tick, DISCOVER/FRAME lane, second DISCOVER pass; NO BUILD code -- the atom is epoch-parked). Doc: docs/design/D27_SCORING_SIDE_CONSTANT_CENSUS_DISCOVER.md, taking the first DISCOVER''s own §6 second bullet: the scoring side, which `scenario_constants()` cannot reach BY CONSTRUCTION because its subject is derived from `build_scenario`''s AST. MEASURED off the AST: 21 module constants, 8 in the census subject, 8 more read by the score/measure/predict/check path and invisible to `check_scenario_constant_census` -- six of them prose/atom-id labels and TWO of them real choices, exactly the two the previous pass named. `RESOLUTION_SEEDS = (7, 11, 23)` entered in e6522928a (Hour #8) with NO STATED REASON, is read by five measurement functions and printed verbatim into six published caveats, and decides which worlds every resolution verdict is measured on. THE REGISTER''S OWN CLAIM PUT ON TRIAL: `DIMENSION_DRIFT_RESOLUTION` declares `structural: True` and `measure_dimension_drift_resolution`''s docstring says a band that holds on one seed and not another is a claim the register must refuse -- never tested, because it is checked on the three seeds it was derived from. MEASURED 2026-08-14, n=300, shipped measure/check pair unmodified, same book construction and an identical 109-drift grid on every seed (R13: a different customer draw, never a different world): the shipped triple returns 0 violations; adding ONE outside seed returns 2/4/5/6/10/11; the nine-seed prefix climbs 2, 7, 13, 14, 15, 19 without converging; and of the 83 OTHER triples drawable from the same nine seeds, NOT ONE is clean (min 9, median 27, max 39). The honest reading is not that the seeds were chosen to pass -- the declarations were DERIVED on them in Hour #10, so of course they describe them -- it is that a seed-invariance claim was carried for four days while being falsifiable in 33 seconds. What the 19 are: every one of the twelve declared `detection` collapse runs is split by an outside seed, and the splits are SUBSTANTIVE not float noise (measured magnitudes 1.0%-26.6% of the reading, e.g. 26.6% on (28,29) at seed 17) even though the predicate is bit-equality; five NARROWER undeclared collapses appear in their place, so the blindness moves rather than clearing; the declared `saturates_above: 82` measures 85; and `detection_latency` publishes NO reading at +86 on the wider set, which `None != baseline` counts as RESOLUTION -- the fail-open the three seeds never reach. THE STRICTNESS IS THE UNCHOSEN PART: `moved`/`unmoved` are intersections and the collapse runs a partition, so seed count sets how strict every declaration in the register is, and three is the most permissive end of the range available; the exactness rule (''the band must be EXACT, not merely true'') is the one leg that gets WEAKER as seeds are added. R12: no seed count and no seed value is proposed -- nine seeds is a falsification probe (~5min/sweep against ~100s today), and whether the answer is a wider sweep, a recorded reason for three, or re-derived declarations is D28''s (collapse runs, saturation edges) and D31''s (undefined-reading witness), handed over in writing. SECOND SCORING CONSTANT, MEASURED: `AGEING_RESOLUTION_TARGET_DAYS = 1` is met with ZERO slack on all eleven seeds tried (over/under both 1d, n_aged 81-113) -- which reads like a threshold set to what was achieved but is not: 1 is the INTEGER FLOOR, the strongest demand expressible over whole-day ages. The value is right, the reason is nowhere, and nothing holds it there: no census reaches it and no test pins it, so an edit to 5 would keep the control green over a book five times blinder. Four BUILD exit criteria with their R15 mutations are in the doc (a scoring-side census subject off the AST, with the revert-to-build_scenario-only mutation as its visible failure; a population-selecting constant owing a MEASURED stability reading; `structural: True` earned by one seed outside the constant, with the witness recorded; and a threshold constant declaring whether it sits at a derived floor). LEVEL STAYS L0 and that is correct, not a hold -- the deliverable is a reshape of tools/couple_w2_11_d5.py and BUILD is epoch-gated; the doc is not this atom''s deliverable.'
  render_site_population_discover_note: 'DISCOVERED 2026-08-15 (worker tick, DISCOVER/FRAME lane, third DISCOVER pass; NO BUILD code -- the atom is epoch-parked). Doc: docs/design/D27_RENDER_SITE_POPULATION_DISCOVER.md, taking the previous pass''s OWN criterion 1 -- the scoring-side census subject -- and running its worked AST rule against the module BEFORE anyone builds it. THE PROPOSED CONTROL IS FALSE TWICE OVER: the rule walks `ast.Assign` and filters `startswith(''_'')`, and measured on the shipped module that sees 21 of 71 constants -- 27 are `ast.AnnAssign` (including DIMENSION_DRIFT_RESOLUTION, ORGAN_QUERY_GRID, PUBLISHED_GAP_CONSUMERS and, with a straight face, SCENARIO_CONSTANT_CENSUS itself: the census''s own register is invisible to the subject rule proposed to extend the census) and 23 are `_`-prefixed, a statement about audience and not about whether the published path reads them. The two constants picking the D35/D36 render sweeps'' population sit one on each side: `_RENDER_SITE_SEEDS` (private) and `_PUBLISHED_BOOK_SPECS` (private AND annotated, invisible twice). FIRST, THE DEAD ONE: `_RENDER_SITE_SEEDS = (7, 11)` is read at exactly ONE call site tree-wide and it is a TEST -- no shipped function reads it, its comment still narrates the two-seed population D36 replaced with hand-built composer books carrying no seed at all, and its one live reader is the R15 mutation proving the reader walk''s epsilon control can fail, run on `_resolution_population(300, s)` -- a population the control never runs on (the harness-convenience subject shape: the mutation fires SOMEWHERE, not on the artefact the control grades). SECOND, AND IT IS MEASURED ON A SHIPPED CONTROL: both render sweeps reject any precision at which the two books print the same digits, which is sound, and its unstated premise is that the carrier moves with the book. THE HEADLINE''S DOES NOT. Measured 2026-08-15, shipped `_publish_one_book`/`published_books`/`measure_*_render_sites` unmodified with only the shipped spec parameter substituted, 61 books n_customers 140..200 months=6, 69s: `detection` -- the only figure `measure_and_write` hands downstream as a number and so the only one reaching the Proof door -- is a small-integer ratio taking SEVENTEEN distinct values across 61 books, piecewise constant in runs of 2 to 8, and the shipped first book n=150 sits in a run of SEVEN (150-156 all publish 13/110). Substituting the second book 170 -> 151, one customer''s difference, through the UNMODIFIED checks: `detection` sites=() and FIVE violations, every one phrased as a debt in the REGISTER (''a render site nobody can reach'', ''has never been confronted with an artefact'') when the register is correct and unchanged and the whole cause is that the two books landed in one quantisation cell. The control fails CLOSED, which is right, and names the WRONG SIDE, which is the finding -- and the message it reserves for a figure whose epsilon rests on nothing but an AST read is reachable by a one-customer edit to a private annotated constant no census sees and no test pins; the module''s own `raise` backstop fires only when NO dimension has ANY site, and the other four still do. BASE RATE: of 1,830 pairs over 140..200, 403 (22.0%) lose at least one shipped render site (detection_latency 277, detection 118, ageing 38, belief 19, belief_population_mix 8), 118 make detection bit-identical, and anchored on the shipped 150 the six nearest partners ALL break something (151-155 detection, 156 detection+detection_latency, 157 detection_latency, 158 ageing). ON THE SHIPPED PAIR IT DOES NOT BITE and that is stated, not buried: (150,170) is blind at 1dp on all five and 2dp on ageing, no published string renders any figure at a blind precision (checked with `_rendered_at` over all 27 shared published string keys), every declared site is found -- and detection_latency''s only site sits 2dp, ONE decimal from its blind edge. SAME CLASS AS D27 ITSELF with the note missing entirely: the 400 had a stated reason whose cost to resolution was never measured; `_PUBLISHED_BOOK_SPECS` has no stated reason at all (the `unstated` class already largest in the first DISCOVER''s provenance census) and its cost is not resolution in days but whether the HEADLINE has any render evidence -- the fourth constant in this module found to set an instrument''s resolution from outside every census built to find such constants. R12: no value change is proposed, 150/170 is not defended by its output and no other pair is recommended; picking a pair BECAUSE it gives detection a site would be selecting the population to green the control. Four BUILD exit criteria with their R15 mutations are in the doc (a subject derived over AnnAssign AND Assign, public AND private, with the revert-to-today mutations visible as failures; a population-selecting constant owing a MEASURED discrimination reading on the property the consuming rule needs -- different quantisation cells per dimension to that dimension''s declared precision; a ''site nobody can find'' violation that distinguishes an undischarged register from an undiscriminating population; and the R15 mutation moving onto the control''s OWN population). Handed over in writing: D28 keeps the register declarations, D31 the undefined-reading witness; D27 owns the census shape. STILL OPEN and named rather than absorbed: months=6 never varied, a third book unmeasured, the other four measurement functions confirmed to default to RESOLUTION_SEEDS but still unswept. LEVEL STAYS L0 AND THAT IS CORRECT, not a hold: L1 is ''been BUILT in any form'' (MATURITY_MAP.md section 3) and this atom''s deliverable is a reshape of tools/couple_w2_11_d5.py, which is epoch-gated -- the doc is not this atom''s deliverable, so DISCOVER cannot move it.'
