atom_id: D27_belief_window_saturates_on_this_book
map_notes:
  name: 'The W2_11<->D5 triad''s two BELIEF dimensions read exactly ONE company parameter -- `PaymentObservationConsumer._dd_failure_window_days`, how far back `_arrears_risk_belief` still counts an observed failed collection -- and the harness builds the company with DD_FAILURE_WINDOW_DAYS=400 against a book whose oldest observed failure is 91 days old at `as_of`. So no event can EVER fall out of that memory: MEASURED 2026-08-10 (H27 Expert Hour #9), n=300, seeds 7/11/23 and bit-identical at all three, every window from the book''''s span to INFINITY publishes the same figure (+1d, +500d and -308d all read the baseline exactly), while a 310-day shortening -- precisely the headroom the population-side predictor names in advance -- is the smallest memory error the dimension can resolve at all. The published number therefore cannot distinguish the scored company from one that NEVER forgets a failure, which is the direction that keeps a recovered customer in collections; and the organ''''s OWN shipped default (90d) sits just below the band edge, publishing a different number (0.1519 -> 0.1709 at seed 7). The 400 was deliberate and its reason is still in the constant''''s comment -- generous on purpose, so the recency window would not confound the CHANNEL blind spot this scenario measures -- but what was never measured or declared is that the same choice costs the dimension all resolution on the only company parameter it reads: a design note stood in for a measurement. Same class as D25 and D26, one boundary further out again: the book has no event sitting BESIDE the line this dimension reads. THIS ATOM IS THE RESHAPE -- a scored population whose event span and company memory can actually resolve a memory error (a longer book, several `as_of` readings, and/or the harness building the company at the organ''''s own default) -- which moves every published belief figure on this pair and is therefore a mint rather than a fix on sight. ALREADY LANDED UNDER H27''''s HOUR: the declared counterfactual company `organ_failure_window_drift_days` (the third in this harness, and the first that reaches this organ at all), the class control that makes every OFF-PATH register entry owe a graded band on its own organ''''s knob rather than discharging itself with an indiscriminate degenerate, the population-side predictor `measure_belief_window_resolution` (derived from the world''''s event dates and the declared window, never from the organ''''s severity thresholds -- the D20/D21 tautology in the direction nobody checks), and `belief_resolution_caveat` stamped into BOTH belief dimensions'''' note and components.'
  frame_note: 'FRAMED 2026-08-14 (worker tick, DISCOVER/FRAME lane; NO BUILD code -- the atom is epoch-parked). Settled design: docs/design/D27_BELIEF_WINDOW_RESHAPE_FRAME.md. THE RESHAPE MOVES THE ORIGIN, NOT THE BOOK -- the census already says DD_FAILURE_WINDOW_DAYS is ''not a band constant, it is the ORIGIN the band is measured from'', the below-edge is D29''s and the above-edge is D30''s, and this atom owns only where the SCORED COMPANY sits (308-309d inside the blind band). MEASURED 2026-08-14, n=300, seeds 7/11/23, shipped build_scenario/score_triad/measure_belief_window_resolution with candidate constants monkeypatched in a scratch script: (A, shipped 3-period book + 400d window) headroom +309/+308/+308, saturated, and every drift from -5 to +500 bit-identical on both belief dimensions. (B, RECOMMENDED -- same book, company built at the organ''s OWN shipped default PaymentObservationConsumer(dd_failure_window_days=90)) headroom -1/-2/-2, NOT saturated, 3-4 of 96-113 observed failures fall outside memory, belief 0.1708861/0.2037037/0.1411765 and the predicted saturation edge moves from -308 to +1/+2/+2: a company that never forgets is a different number on every seed. AND THE EQUALITY THAT STATES THE FINDING: at window 90 the +500 column reads 0.1518987/0.1913580/0.1352941 -- bit-identical to what the pair publishes TODAY, so today''s figure IS the never-forgets company''s figure. R13 differential measured: ageing/detection/detection_latency bit-identical between A and B on every seed. (C, 13-period annual book + 400d window) STILL SATURATED at +98/+99 headroom on ~4x the scoring cost -- lengthening the book does NOT discharge this atom, which is the decisive negative result; (D, 13 periods + 90d) resolution bought by putting 78-80% of events outside memory, i.e. the CHANNEL blind spot this scenario exists to measure is destroyed; (E, 20 periods + 400d) works at ~6x cost but is D30''s lever and leaves the origin arbitrary. THE TENSION IS NAMED RATHER THAN SPLIT: the 400''s stated reason (keep recency from confounding the channel reading) and resolution are in direct conflict, because resolution REQUIRES events falling out of memory -- so the scored company takes the organ''s default and the old 400 stays as the declared never-forgets counterfactual, with the DIFFERENCE published as a recency component (0.0190/0.0123/0.0059 = 12.5%/6.4%/4.3% of the shipped figure). BUILD exit criteria + their R15 mutations are in the doc: window DERIVED from the organ''s signature (a hand-typed 90 is D20 one field over), scored-company-not-saturated control, differential world fingerprint, the recency component measured not frozen, and PER-DIMENSION bands (belief_population_mix resolves coarser -- seed 23''s -1 moves belief alone). NOT A TUNING (R12): the candidate was fixed on the only non-arbitrary value available (the organ''s own default) before B''s figures were read; the published belief figures move as a consequence and are reported, not selected for.'
