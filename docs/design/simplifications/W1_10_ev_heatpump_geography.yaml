- '2026-07-21 L2 BUILD LANDED (worker tick; within standing authority -- open SIM_ACTORS front + KEEP_BUILDING_2026-07-21 names W1_10 priority; W1_4/W1_5 at L2, twin-open condition met). Built the regional adoption field in simulation/adoption_geography.py: a_{k,r}(t)=a_k(t)*m_{k,r} where m_{k,r} is a TIME-INVARIANT regional MULTIPLIER = 1 + covariate tilt (off-gas-grid fraction for heat_pump, affluence proxy for ev; centred on the demand-weighted mean) + a distance-keyed spatially-correlated Gaussian tilt (Cholesky of Sigma[i,j]=sd^2*exp(-haversine_km/length_scale), the same device weather_engine.py uses for W1_4 regional deviations). region_set = the 14 GB GSP/DNO areas (portability: keyed by region_set, not hardcoded), factual centroids + published-estimate household weights (w_r, sum 1) + covariates. INVARIANT A1 (aggregation consistency) enforced EXACTLY by a weighted-mean projection m_r <- m_raw_r/(sum_s w_s m_raw_s) => sum_r w_r a_{k,r}(t) = a_k(t) for all t -- a STRUCTURAL identity (measured A1 error 0.0), not a fitted fudge. A2 (monotone per region) inherited by construction (monotone national curve x non-negative constant multiplier), tested every region. C-S2: own :regional:<tech> sha256-seeded numpy substream, independent of the L1 national jitter and cross-tech (deterministic replay proven). R15: FAIL-CLOSED on unknown technology/region, empty field, bad weight-sum, empty region_set; A1 is R15-FAILABLE with a TAUTOLOGY guard (checker recomputes the national share from the independent fitted curve, never the field''s own aggregate) -- mutation tests prove it FIRES on an offset multiplier AND on a swapped weight vector. Spatial correlation verified real (adjacent regions covary more than distant). 46 tests green (was 21 at L1), epistemic PASS (521 files). R9/R10 HONEST LIMITATIONS (registered, not faked): (a) regional covariate/weight tables are order-of-magnitude published estimates at the knowledge-reference date (no live re-fetch); the independent held-out VALIDATOR (DESNZ sub-national / MCS regional counts, anti-marking-own-homework) is L3 work, deferred; (b) the multiplier is TIME-INVARIANT (regions differ in adoption LEVEL not TIMING) -- a genuinely time-varying m_{k,r}(t) with regional lead/lag is an L3 refinement, valid while a_k(t) sits well below its ceiling (true across 2016-2025 + near future), registered per R10. Level L1->L2 PROPOSED; level_current HELD at 1 (levels are proposals -- fronts_reconciler flags any agent bump as LEVEL_SELF_PROMOTION; director ratifies) + blocked_on: director_level_up SET to stop the build-redraw of this landed L2 work; batch the L2 level-up into the director [ACT]. REMAINING (L3, after ratification): premise covariate-weighted asset assignment (A3) + g_hp_load(T_r)/g_ev_charge signatures wired into W1_5 (A4 peak-coincident) + COUPLED_TRIAD gap to C13 (company regional-load-growth forecast vs SIM regional outturn). Depends additionally on W1_4_regional_weather_field (regional temperature for g_hp_load), per the FRAME''s noted missing dependency.'
