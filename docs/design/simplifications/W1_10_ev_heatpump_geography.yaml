- '2026-07-13 REGISTERED (WEATHER_PHYSICS_HIERARCHY.md, director P1, QUEUE -- DISCOVER/FRAME workable now, BUILD gated to Epoch 3 with W1_2_generate_futures). FOLLOW-ON, explicitly LATER per director sequencing (''Physics first'' -- do NOT build now; registered so the sequence is visible). EV + heat-pump adoption geography (spatially-varying load growth). loop_stage idle: FRAME design authored this session (docs/design/WEATHER_PHYSICS_HIERARCHY_DESIGN.md); BUILD opens in Epoch 3. Anchoring rule (anti-marking-own-homework): GENERATOR anchors (real historical weather/demand) and VALIDATOR anchors (independent published sub-national consumption stats / regional degree-days / published system demand) MUST be different sources; the company never validates against SIM ground truth.'
- '2026-07-16 FRAME LANDED (Lane-3 DISCOVER/FRAME, doc-only, no level move, BUILD-gated Epoch 3; docs/design/W1_10_FRAME.md). Genuine gap filled: WEATHER_PHYSICS_HIERARCHY_DESIGN.md frames W1_3/W1_4/W1_5 (national->regional->premise weather-driven demand) in depth but treats EV/heat-pump ownership as a STATIC per-premise flag; W1_10 owns the spatially-and-temporally-varying ADOPTION PROCESS that reshapes regional load growth. Design: a first-class stochastic subsystem with its OWN RNG substream (adoption_field, C-S2) layered BETWEEN W1_4 (regional weather) and W1_5 (premise demand), in three levels mirroring the weather hierarchy: L1 national logistic adoption S-curves per technology {ev, heat_pump} fit to real published history (DVLA/DESNZ EV registrations, MCS/DESNZ heat-pump installs), monotone; L2 regional adoption field a_{k,r}=a_k*m_{k,r} with spatial correlation (reusing W1_4''s Cholesky machinery) and an aggregation-consistency invariant I(adopt): demand-weighted regional adoption = national, enforced by weighted-mean projection (structural, not a fudge, the same device W1_4 uses); L3 (target) premise covariate-weighted asset assignment consistent with the regional rate + the load signatures wired into W1_5 -- g_hp_load(T_{r(i)}) TEMP-CORRELATED and PEAK-COINCIDENT (heat-pump geography reshapes the regional peak, not just annual volume) and g_ev_charge(t, smart_tariff_i) evening/overnight and TARIFF-TUNABLE (the company''s ToU products bite here). Four mutation-testable invariants (A1 regional->national, A2 monotone, A3 premise<->regional consistency, A4 hp-load peak-coincidence), R15 FAIL-OPEN/FAIL-SILENT forbidden (missing region / empty weights / unavailable validator = FAILED check), R15 TAUTOLOGY guard (checker recomputes vs independently-held national series / published stats, never the checked value). WALL: adoption is COMPANY-KNOWABLE at aggregate (published regional stats + the company''s own book) but the SIM''s per-premise ground truth is not -- company infers and is allowed to be wrong (COUPLED_TRIAD gap = |company regional-load-growth forecast - SIM regional outturn|, per region, per digest). Anti-marking-own-homework binding: GENERATOR fits historical curves, VALIDATOR uses a DIFFERENT source (independent published sub-national EV/HP stats not used in the fit). FRAME also identifies a real dependency the map was missing: W1_10 depends on W1_4_regional_weather_field too (heat-pump load is a function of REGIONAL temperature T_{r(i)}(t)), not only W1_5 -- recorded for BUILD sequencing. Ordered 7-step BUILD task list + proposed file_scope [sim/adoption_geography.py, sim/*, tests/sim] disjoint from W1_2/3/4 (shares only the region-set constant). loop_stage stays idle (Epoch-3 BUILD-gated); twin can open when W1_4/W1_5 reach L2.'
- '2026-07-21 L1 BUILD LANDED (worker tick; loop_stage=build + this atom is a member of the OPEN SIM_ACTORS front (epoch_ceiling 3, opened_by director console 2026-07-18) and KEEP_BUILDING_2026-07-21 names it the priority build within standing authority -- the 2026-07-13/16 ''do NOT build now'' Epoch-3-gate notes are SUPERSEDED by the open front + directive; W1_4 at L2, W1_5 at L2, twin-open condition met). Built simulation/adoption_geography.py: national logistic adoption S-curves a_k(t) per technology {ev, heat_pump}, calibrated to published GB household-penetration history (DVLA/SMMT plug-in parc; MCS/DESNZ heat-pump installs), monotone by construction (fitted rate>0 enforced at fit time = invariant A2). C-S2: sole named adoption_field RNG substream (stable sha256, midpoint-only timing jitter, mean curve RNG-free, deterministic replay proven). R15: is_monotone_nondecreasing + fit_logistic are FAIL-CLOSED (empty/singleton/degenerate-variance/decreasing/at-or-above-ceiling all RAISE, never silently pass) and the A2 mutation test proves an injected decrement FIRES. 21 tests green (tests/simulation/test_adoption_geography.py), epistemic PASS. R9/R10 HONEST LIMITATION (registered, not faked): anchor values are order-of-magnitude published estimates fixed at the knowledge-reference date (no live re-fetch -- autonomous runs have no network); the anti-marking-own-homework VALIDATOR against a DIFFERENT held-out sub-national source (A1/A3 checks) is L3 work, deferred. Level L0->L1 PROPOSED; level_current HELD at 0 (levels are proposals -- the fronts_reconciler flags ANY agent level_current bump incl. L0->L1 as LEVEL_SELF_PROMOTION, so the code lands but the cell does not move; director ratifies) + blocked_on: director_level_up SET to stop the build-redraw of this landed L1 work (same dial-defect fix as W1_5/W1_7); batch the L1 level-up into the director [ACT]. REMAINING (after ratification): L2 regional adoption field a_{k,r}=a_k*m_{k,r} + A1 aggregation-consistency weight