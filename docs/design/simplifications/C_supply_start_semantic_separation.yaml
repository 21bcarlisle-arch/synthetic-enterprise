atom_id: C_supply_start_semantic_separation
simplifications:
- '2026-08-03 BUILT L0->L2, self-certified (worker tick). MECHANISM: company/crm/supply_start.py is the declared seam between the two meanings. derive_supply_start() resolves in a stated order -- an activation observable for the account WINS always (the acquisition/registration event a real CRM records supply-start from, passed in by the caller as activation_by_account, so nothing here reads a SIM internal and the epistemic verifier PASSES); else a record with no successor_of keeps its own acquisition_date (base and fresh-market customers are genuinely acquired on the date the field carries, so the ~13 correct records are undisturbed); else UNKNOWN. derive_term_anchor() carries the 365-day renewal-grid anchor into its own NEW column term_anchor_date, so semantic A stays intact and independently addressable -- the registry no longer has to overwrite one meaning to store the other. The registry schema was rebuilt to make supply_start NULLABLE, because UNKNOWN had no representation under the old NOT NULL column and that absence is precisely what forced the back-dating.'
- '2026-08-03 UNKNOWN IS THE POINT, not a gap. A successor with no activation observable resolves to NULL, never to the anchor: the only date on such a record is the PREDECESSOR''s genesis date, so back-filling from it would invent a tenure -- the exact Historical Ground Truth shape the mint named. Same rule for a record carrying no acquisition_date at all: DEFAULT_TERM_ANCHOR ("2016-01-01") is an anchor convention and is deliberately NOT reused as a relationship start. Malformed activation/acquisition dates RAISE rather than falling back to the anchor; a silent fallback would reintroduce the phantom invisibly, which is the fail-open pattern this atom exists to remove.'
- '2026-08-03 MIGRATION EXECUTED AND MEASURED ON THE REAL POPULATION (the mint called the migration the risk, not the split). Legacy rows held ONE date fed from acquisition_date -- i.e. what the supply_start column actually contained was the anchor. The recorded split rule (migrate_legacy_supply_start): term_anchor_date := the legacy value; supply_start := the legacy value ONLY where successor_of IS NULL, else UNKNOWN. SQLite cannot drop NOT NULL in place, so create_schema() rebuilds the table, is idempotent (proven over three consecutive calls) and preserves the population. Run against the real company/data/registry.db (19 rows, gitignored local state, backed up first): 19/19 rows preserved; exactly the 6 successors C1_2/C2_2/C3_2/C4_2/C5_2/C6_2 became UNKNOWN -- which is precisely the successor set saas/customers.py SUCCESSOR_CUSTOMERS defines, matching the DISCOVER prediction on real data rather than on a fixture; the 13 base/gas-leg records kept their own dates unchanged (C1 2016-01-01, C2 2016-04-01, C3 2016-07-01, C4 2016-10-01, ...).'
- '2026-08-03 R10 CLASS CLOSURE, not an instance fix: SUPPLY_START_NOT_BEFORE_FIRST_OBSERVABLE registered in ALL_INVARIANTS with check_supply_start_not_before_first_observable(), which fails ANY account in ANY run whose supply_start predates the earliest thing ever observed about it (acquisition event / first meter read / first issued bill). R15 INDEPENDENCE IS MECHANISED, not asserted: the checker re-derives the bound from the observables and does NOT import company.crm.supply_start, and a test parses the invariant module''s actual import STATEMENTS via ast to prove it -- the first version of that test matched a SUBSTRING of the source and failed on my own docstring mentioning the module, which is the mention-vs-declaration fail mode; matching on a mention would have made it fail for the wrong reason.'
- '2026-08-03 R15 MUTATION-PROVEN, five mutations each fired on its own named defect (33 tests in tests/company/crm/test_supply_start_separation.py; 2,574 pass across tests/company/crm + tests/company/compliance). (1) re-couple the no-observable path (successor supply_start := anchor, today''s pre-fix behaviour) -> 2 FAIL. (2) migration back-dates successors instead of recording UNKNOWN -> 3 FAIL. (3) class guard returns True when no observable is present -> 2 FAIL. (4) class guard never fires -> 4 FAIL. (5) ignore the activation observable entirely -> 4 FAIL, which is the mutation that actually proves the COLUMN SEPARATION (mutation 1 alone only reaches the unknown path). FAIL-OPEN SWEEP, 10 parametrised cases: empty record, absent supply_start key, observable-but-no-field, no observables, all-observables-None, empty-string observable, unparseable/non-string observable, unparseable/non-string supply_start -- every one fails CLOSED. The deliberate line: the supply_start key ABSENT fails (malformed record) while an explicit None PASSES (an honest UNKNOWN cannot claim a phantom tenure); pinned in both directions so a later reader cannot collapse them.'
- '2026-08-03 NAMED RESIDUALS, not built this pass -- and the reason this is L2 not L3. (a) THE LIVE DAMAGE IS OUT OF THIS FILE_SCOPE AND IS STILL LIVE. The DISCOVER doc enumerated 11 wrong-meaning consumers of acquisition_date, of which 7 are LIVE-wrong for C1_2 today: churn-estimate tenure (simulation/customer_events.py:148, run_phase2b.py:1175), per-customer tenure_years and the acquisition-cohort bucket (saas/reporting/annual_report.py:4503,380,6725), and three rendered "Customer since / acquired {acquisition_date}" surfaces (site/customers/index.html:574,189, site/company/index.html:659), plus 6 generator conduits that publish the wrong value. NONE of those are touched here -- routing them needs saas/reporting, simulation/ and site/ and will MOVE published tenure-derived figures, so per R14 it owes an explicit before/after with its basis clock, and per SELF-INTERRUPT DISCIPLINE it is queued as C_supply_start_consumer_routing rather than fixed on sight. So NO R11 render-verification is claimed for this atom: nothing user-visible changed, and saying otherwise would be the false-completion shape. (b) seed_from_customers still has NO production caller (grep: tests only), so the registry defect closed here was DEFINITIONAL/LATENT -- real, and now structurally impossible to reintroduce, but it was not itself producing a wrong published number. (c) L3 additionally owes the coupled-triad gap measurement: the company has not yet been tested against a world that re-contracts a customer and then checks whether its believed tenure tracks the truth.'
- '2026-08-03 MINTED into the map (worker tick, sole-map-writer) from docs/staging/in_progress/PLANNER_MINTED_supply_start_semantic_separation_2026-07-28.md. Parked behind director_build_open (abolished 2026-07-29, swept 2026-08-03); registered here per R17. FIDELITY GAINED: one field is currently doing two jobs -- when the customer''s relationship with the supplier began, and when the current contract term is anchored. Overloading them means a renewal RESETS apparent tenure, which corrupts every tenure-derived number downstream (churn hazard, CLV, loyalty eligibility, vulnerability duration). A real supplier''s CRM distinguishes these because its retention economics depend on the difference.'
- '2026-08-03 MINT -- THE MIGRATION IS THE RISK, NOT THE SPLIT: existing records carry ONE date, so back-filling the second field requires a stated, recorded rule for what the historical relationship start was, and where that is genuinely unknowable it must be recorded as UNKNOWN rather than back-dated to the term anchor (a fabricated tenure is worse than an absent one, and it is the exact shape of a Historical Ground Truth breach). R15: a re-contracted customer''s supply_start must NOT move when the term anchor moves -- mutate the code to keep them coupled and the test FIRES. R14: any published tenure-derived figure that moves is republished as an explicit before/after with its basis clock, because these diffs are expected and are not regressions.'
