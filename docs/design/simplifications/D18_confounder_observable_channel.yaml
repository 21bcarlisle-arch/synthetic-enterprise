atom_id: D18_confounder_observable_channel
map_notes:
  build_note: 'L0->L2 SELF-CERTIFIED 2026-08-09 (worker tick). THE WORLD WAS NOT TOUCHED -- the confounder CAUSE stays answer key in simulation/self_rationing.py, and what crosses to the company is a supplier-held RECORD, which is the whole difference between paying this simplification and leaking the label the atom warned about. (1) THE CHANNEL IS A RECORD, NOT AN ENUM: `AccountRecord` carries a type (change_of_tenancy / void_notification / own_scheme_install), an EFFECTIVE date and a RECEIVED date, through three gates. COVERAGE -- a VOLUNTARY_CUT leaves no record in any system, ever (nobody registers a decision to use less energy), so an entire class of hard negatives is permanently unexplainable; moves are registered 0.55, voids 0.35, own-scheme installs 0.30, all [L] curriculum shapes fixed from the CoT scope brief BEFORE any rate was read. LATENCY -- a record counts only once received_date <= as_of, bands 7-240 / 14-150 / 1-75 days against a 60-day detection lag, because the brief''s point is that the occupier tells us in week 1 or month 6. MEANING -- a CoT or void record INVALIDATES THE BASELINE (the history is the previous occupier''s, so no drop is observable) and NEVER clears the case; the not_flagged_reason says ''NOT a finding of no hardship'' in as many words. An install record instead adjusts EXPECTED consumption by the SCHEME''S DEEMED saving (0.20 constant, never the household''s realised cut -- the deemed-vs-actual performance gap is real and stays), so a home that cut FURTHER than its retrofit explains is still flagged. (2) THE ATOM''S ACTUAL QUESTION IS ANSWERED WITH THREE NUMBERS, NOT ONE: every run scores TWO companies on ONE population (`flagged` vs `flagged_unaided`). At n=4000 -- 228 records exist, 187 arrive; the pre-D18 company''s 210 false flags on the settled negative (0.0560, the UPPER bound D14 registered) decompose into 90 a supplier COULD have explained (0.4286 -- the CEILING) and 70 it ACTUALLY did (0.3333), leaving a DISTANCE of 0.0952 that is pure coverage-and-latency. Published false-flag rate 0.0560 -> 0.0373. THE CEILING IS THE FINDING: even reading every record it holds, a supplier can explain away well under half, because the largest confounder class leaves no trace anywhere. (3) THE PRICE IS PUBLISHED BESIDE THE BENEFIT, NOT DISCOVERED LATER: 9 genuine rationers who also moved or had a void are now explained away and MISSED -- recall 0.6878 -> 0.6439, harm-weighted miss 0.3094 -> 0.3613, and the published pair GAP gets WORSE, 0.1787 -> 0.1993. R12 STATED BEFORE THE NUMBER WAS READ (module docstring, doc, this note): the gap is the unweighted mean of two rates on 205 vs 3752 denominators, so trading ~70 false flags for ~9 misses moves it up; the fix for disliking that is a cost-weighted instrument argued on its own merits, NEVER switching metric because this one moved against the atom that built it. The cost is also a real harm path -- a vulnerable household that moves house is invisible to consumption-based detection until a new baseline builds. (4) R15, BOTH OBLIGATIONS THE ATOM SET, as differentials against one textbook signature (2900->1200 kWh, below floor, clean payments) so a pass can only be the record''s doing: NOT A LABEL LEAK -- `test_mutation_a_record_that_has_not_arrived_explains_nothing` keeps a household with a real, existing, late-arriving CoT record FLAGGED, and on the population the explainable ceiling is asserted strictly below 1 with n_records_arrived < n_records_exist (without which latency would be untested by the measurement that cites it); MOVES THE RATE -- records-off reproduces the pre-D18 company EXACTLY (false_positive_rate_unaided, n_flagged_unaided agree with the separate off-build) and the aided rate is strictly lower. Also proven: an install record does not blanket-clear a deeper cut; an install record with no deemed figure adjusts NOTHING (missing number != free pass); the deemed saving is clamped so it can never swallow an arbitrary drop; a record predating the baseline period explains the baseline, not the fall; as_of=None means NO record has arrived (an unknown clock never silences a vulnerability flag); a voluntary cut yields no record across 2000 swept ids; all three record types occur AND arrive. (5) THE GUARD IS THE SHIPPED CODE, NOT A COPY: `check_channel_invariants` -- a record may only ever SUPPRESS a flag, and nothing is explained away with no record behind it -- is called by the real build and mutation-tested directly, so a regression fails the control instead of passing a re-implementation of it. (6) THE ASSERTION THAT HAD TO GO, NAMED: `test_missed_are_the_no_baseline_blind_spot` asserted missed == missed_because_no_baseline and is REPLACED (not repaired) by a two-term decomposition -- meter-coverage blind spot PLUS the channel''s own price -- with both terms asserted non-zero, because ''the channel lost us some hardship cases'' must not vanish into a rounding argument. 41 tests in the pair''s file; 2292 green across tests/tools + the sim atom + the register + the live payment triad (the 2 reds are tests/tools/test_knife_hotspot_measure.py, another lane''s IN-FLIGHT uncommitted KNIFE edit whose own fixture-pinning control is telling it to re-point, red before this change and not this atom''s). epistemic verifier PASS; ruff unchanged. L3 NOT claimed: no Expert-Hour pass on the changed detector, and the coverage/latency shapes have not been reviewed against a second source -- the tick that adds a channel is not the tick to certify its calibration.'
  origin_note: 'Minted 2026-08-09 by the D14 build as a REGISTERED SIMPLIFICATION, not a discovered defect: D14''s job was to give the world hard negatives, and it deliberately kept every confounder cause hidden so the atom stayed inside its own file_scope (the company-side detector was not D14''s to change). The direction of the error is stated and is the safe one -- hiding an observable makes the company look WORSE, so 0.0560 is an upper bound and nothing published rests on it being tight. WHAT THIS MUST NOT BECOME: a channel that hands the detector the confounder ENUM. That is the label leaking through a side door and would score the detector 100% on exactly the cases D14 built to be hard. The honest construct is a supplier-side RECORD with its own coverage and latency -- a CoT registration the occupier may not have made for six weeks, a void notification from a landlord, an install file that covers only the company''s own scheme customers -- so some confounded drops remain unexplainable and the detector must still decide. R15: the mutation must prove the channel is not a label leak (a household whose confounder fired but whose record has NOT arrived must still be flaggable) and must prove the channel actually moves the false-flag rate (a channel that changes nothing is not evidence of anything). R12: whatever rate results is a DIAGNOSTIC -- the atom does not get to prefer the lower one, and the point is the DISTANCE between explainable and explained, not the headline.'
