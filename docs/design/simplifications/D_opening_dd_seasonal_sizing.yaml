atom_id: D_opening_dd_seasonal_sizing
simplifications:
- '2026-08-03 MINTED from a measurement taken while verifying DD_seasonal_cashflow_physics, not from a review. simulation/dd_balance_book.py sizes a customer''s opening standing level DD as their FIRST BILL -- one seasonal month annualised flat -- so the DD they are put on is a function of the month they joined. Measured error against each customer''s own realised year-0 average on the real book: +33.2% (C2g, gas, April join), -46.3% (C3g, gas, July join), -6.6% (C4g, gas, October join), vs +2.1% / -1.0% / +2.6% on the weakly-seasonal electricity accounts. It is a GAS defect because gas is where the seasonality is, and it propagates: C2g alone carries 293.49 of spurious year-0 held credit against a portfolio peak of 1,812.20, which is the figure DD3 books as a liability and DD-H scores as the belief-vs-truth gap. REAL-WORLD SHAPE: a supplier does not gross up one month -- it sizes the opening DD from the EAC/AQ handed to it in the industry registration flows, or from a published seasonal profile, precisely so the answer does not depend on the join month. EXIT CRITERIA: (a) the strict xfail test_opening_dd_size_must_not_depend_on_the_join_month passes with the xfail marker REMOVED (a January joiner and a July joiner on the same annual consumption get the same opening DD within 10%); (b) the monthly shape or EAC source is a CITED published artefact under docs/market_research/ -- no fabricated coefficient, and per the agreeing-sources lesson its independence is checked, not inferred from a source count; (c) the point-in-time blindfold holds -- the estimate uses only what the company can see at supply start, never the customer''s own future twelve bills; (d) R15 both ways, mutations firing named tests. KNOWN COLLATERAL, not a regression: tests/simulation/test_dd_level_collection_book.py::test_collection_is_fixed_within_year_though_bills_vary and ::test_re_estimation_moves_the_fixed_amount_between_years both PIN the first-bill sizing and go red on the fix; they are expectation updates. SIBLING SITE, do NOT fix speculatively (remediation-on-touch): company/billing/eac_calibration.py::calibrate_eac annualises a billing window by pro-rating on DAYS COVERED, which is the same seasonality-blind annualisation one layer over -- harmless on a full-year window, wrong on a partial one. R10 says the class, not the instance, so the primitive this atom builds is the natural home for both callers.'
map_notes:
  name: Size the OPENING level direct debit from an annual estimate, not from one seasonal month's bill
map_records:
  evidence:
