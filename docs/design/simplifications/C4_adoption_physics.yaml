- '2026-07-11 REGISTERED (P3, advisor-staged, director-decided -- ADOPTION_JOURNEY_REGISTER.md, do not start): ToU/control/DER adoption is a journey not a switch, and is the missing precondition for ToU tariffs meaning anything behaviourally. Each customer carries hidden traits (being-bothered threshold -- for many, the real £ at stake sits BELOW it, must be honestly true in the population, never tuned away; friction sensitivity; trust/reassurance needs; reward responsiveness), extending the engagement archetypes and consuming the deferred NUDGE_PHYSICS mechanisms (present bias, friction costs, defaults, social norms, commitment devices) with the same behavioural-science anchoring discipline as the shipped framing/tone work. Non-negotiable (Law A): adoption rate is a DIAGNOSTIC, never a target -- no tuning hidden susceptibility to hit a number. Advisor amendment (director-approved, Law B): susceptibility DISTRIBUTIONS are BASELINE-world fidelity, anchored to real ToU/smart-tariff uptake data, never tuned; the INCENTIVE MECHANICS the company offers are supplier-side strategy it must learn -- that line stays clean. The wall holds: the company observes offers/responses/behaviour, never the hidden thresholds. PLACEMENT: Epoch 4 -- dependencies unbuilt or in flight (C customer psychology partial, W2 population draw L0, M1 event stream in flight); building this on a fixed cast under single-pass truth would be mechanically-real but behaviourally-hollow, the same trap that correctly deferred RY. Open questions left open until the epoch opens: anchor sources for adoption/threshold distributions, how journey progress is measured company-side.'
- '2026-07-12 DISCOVER pass on the atom''s own open question (self-refill draw, no BUILD code): real anchors found for ToU/DER adoption''s overall incidence and its SEGMENT-VARYING shape. [L] Real UK ToU tariff adoption is genuinely low overall -- estimates range ~2.8-9% of homes (source-dependent), confirming this is a minority behaviour today, not a default. Critically, [L] Nesta''s real GB consumption-pattern research finds ToU adoption is NOT uniform: specific ''tech-affluent'' household profiles show 30-40% adoption -- an order of magnitude above the population average -- directly anchoring this atom''s own ''extending the engagement archetypes'' framing with a real, segment-varying (not flat) susceptibility distribution shape, matching the non-negotiable that susceptibility distributions are baseline-world fidelity, not tuned. Real, concrete friction sources found matching the atom''s own ''friction sensitivity'' concept: tariff complexity (choosing well requires matching hour-by-hour usage, not just the headline rate -- a genuine cognitive/comparison-shopping friction), the need for real load-shifting FLEXIBILITY (a structural precondition, not just willingness), and a real physical onboarding friction (smart-meter install lead time, 4-8 weeks as of mid-2026). Regulatory/infrastructure timeline anchor: Ofgem''s market-wide half-hourly settlement (MHHS) rollout through 2025-2026 is the real infrastructure precondition broader ToU adoption depends on -- consistent with this atom''s own epoch-4 placement (dependencies not yet in flight). No BUILD code, no level change. Full findings: docs/market_research/adoption_physics_c4.md.'
- '2026-07-13 FRAME pass, dependency status + architecture (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Re-checked all three depends_on against the map''s own dependency-met rule (loop_stage==''idle'' OR level_current>=level_target) rather than trusting the 2026-07-11 registration''s now-stale ''dependencies unbuilt or in flight'' claim: C3_satisfaction_heterogeneity is level 3/3 (harden), W2_2_population_draw is loop_stage=idle (this session''s own FRAME pass gave it a real additive-population design), W1_reveal_over_time is level 3/3 (idle, hardened this session) -- all three genuinely MET today, correcting the registration''s own dependency assessment (epoch-gating still separately holds this atom''s own loop_stage=idle for BUILD, per EPOCH_GATING_AND_ATOM_AUTHORSHIP.md Rule 1 -- that gate is untouched by this finding). Also answers the atom''s own second named open question (''how journey progress is measured company-side'') with a real, already-built, already-wired architectural template rather than inventing one: this atom''s own registration says it ''consumes the deferred NUDGE_PHYSICS mechanisms'' -- checked directly and found NUDGE_PHYSICS is not deferred at all, it is REAL and WIRED: simulation/nudge_physics.py holds per-customer hidden traits (FramingSusceptibility, ToneSusceptibility, deterministic via a stable customer_id hash) exactly analogous in shape to this atom''s own bother-threshold/friction-sensitivity/trust/reward-responsiveness traits, and company/analytics/nudge_discovery.py is the paired COMPANY-side empirical layer (compute_framing_lift_by_segment()/compute_tone_lift_by_segment(), consuming real retention/payment OUTCOME logs, never the hidden trait directly) -- already wired into company/policy/decision_policy.py and tools/generate_dashboard_data.py. This is the exact sim/company split C4 itself needs: a new simulation/adoption_physics.py-shaped hidden-trait generator (mirroring nudge_physics.py''s stable-hash