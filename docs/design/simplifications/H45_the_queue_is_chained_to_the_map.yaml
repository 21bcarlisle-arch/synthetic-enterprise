atom_id: H45_the_queue_is_chained_to_the_map
map_notes:
  gain: 'LANDED: `chain_of` in `background/staging_rooms.py` -- restated at the head of this record on 2026-09-06 when H41''s drain renamed its key from `origin_note` to `gain`. The claim below is unchanged and was already in checkable form; it is repeated here because the landing-claim control reads ADDED lines, and a key rename makes only this first line new, which would otherwise present an assertion whose proof it cannot see.


    Director, 2026-08-28, having read all 49 files in docs/staging/: ''not one file carries a lane, an epoch or an atom id, so the queue is disconnected from the map entirely -- the same missing chain the guidance calls P8''. P8 in full: ''no systematic link from knowledge to discovery to atoms to epochs. Published evidence we already held sat unused while a 3.75x spread was invented. A July design document sat unread until a director question surfaced it. Discovery ran eight passes deep on atoms that could never build. Knowledge pages describe mechanisms with no link to the atoms implementing them, so page and code can disagree indefinitely and nothing notices.'' PART LANDED 2026-08-28: background/staging_rooms.py parses the chain off the header finding_severity already owns, counts the items carrying none, and separates ''nobody looked'' (absent) from ''looked, nothing yet'' (an explicit `unminted`); alarm_repetition stamps the chain on every document it files. REMAINING: the other three joints -- a knowledge page (docs/design/knowledge/, not yet created) that names the atoms implementing it and fails when they move; a discovery pass that cannot run deeper than the atom it is about can build; and the epoch attachment, so work accretes rather than scatters.


    LANDED: `chain_of` in `background/staging_rooms.py` -- with `unchained` and the explicit `UNMINTED` sentinel beside it, and the chain header stamped by `alarm_repetition`. Stated in the falsifiable form on 2026-09-06 by the seat that rehomed this text out of the map''s `gain` field: the prose asserted a PART LANDING and named no symbol, which the spine has no control for and the store does. Verified present before the line was written; the REMAINING three joints below are unchanged and still open.


    LANDED 2026-09-30: `_staging_chain_check` in `tools/pre_commit_test_gate.py`, over `unchained_filings` in `background/staging_rooms.py` -- the count is now REFUSED at the write. Measured before it landed: 28 of the 96 work items filed into the root in the week to 2026-09-30 carried no epoch or atom, while `unchained()` reported the gap and nothing held it. Scope is a FILING (absent from the parent commit), so the legacy gaps bill nobody; directives and console messages are exempt. Controls: `tests/tools/test_pre_commit_gate_staging_room.py` section 6, four mutations red (parent skip, never-refuse, unwired, directive owed). This holds the chain on NEW work; the three joints named above (knowledge page, discovery depth bound, epoch accretion) are still open.


    LANDED: `stamp_chain` in `background/staging_rooms.py` -- applied in 0ac9815b7 to the six root items it reported, so `unchained()` reads 0 (32 chained, 5 minted). LEVEL HELD AT 1, 2026-09-30, by the seat that brought `unchained()` to 0 (the four class registers and two findings, stamped `unassigned`/`unminted` after reading each against the live map). L2 is DISCOVER-lite + VERIFY, and VERIFY is evidence on a DEPLOYED SURFACE (MATURITY_MAP.md section 2; PB4''s hold note applies it). Nothing under `site/` reads `unchained`, `is_minted` or the refusal, so the count lives only in `staging_rooms` output and the commit gate. The cheapest honest L2 is a published figure: chained / minted / population over the root, with the unminted share beside it -- not a level recorded on gate evidence alone.


    LANDED 2026-10-01: `chain_census` in `background/staging_rooms.py`, lifted by `the_queues_link_to_the_map` in `tools/generate_delivery_page.py` into `site/data/delivery.json` and rendered as `#delivery-queue-chain` on /harness/. Counts are population / chained / minted / unminted / unchained (named, with what each is missing) / unreadable; the gaps ARE `unchained()`, so the page and the gate read one list. Controls: `test_the_published_chain_census_partitions_the_queue_into_all_three_states` (whole-partition) and the two queue tests in `site/test_harness_delivery_record.py`, both door mutations red (counts rendered unconditionally; the gap list dropped). LEVEL STILL 1: the committed feed predates the field, so the live page shows the stated absence until the delivery generator next runs; L2 is recorded once the deployed page shows the counts.


    LANDED: `existing_chain_fields` in `background/finding_classes.py` -- 2026-10-01. The class-register renderer wrote Severity + Lane only, so every `--render` wiped the chain 0ac9815b7 stamped and the census named the four registers again a day later; plus the chain header on `staging_watcher`''s monthly maintenance marker. `unchained()` 5 -> 0 of 66. The census reached origin''s feed in 4bc2cfda8, but the weekly publish hold opens 2026-10-05 04:00, so the LIVE page is not yet established: LEVEL STILL 1, and L2 is recorded against the deployed page after that publish.


    LEVEL 1 -> 2, 2026-10-03: the deployed page already shows it. The Pages deploy runs on every push touching `site/`, not on the weekly figures hold, so the 10-01 note waited on the wrong clock: the live `data/delivery.json` carries `the_queues_link_to_the_map` (76 / 76 chained / 49 minted) and the live /harness/ page carries `#delivery-queue-chain`. Recorded in gate_authorizations.jsonl. L3 is the three open joints above.


    LANDED: `_within_buildable_depth` in `background/supervisor.py` -- 2026-10-03, the discovery depth bound, wired into both idle DISCOVER/FRAME draws. An idle atom whose prerequisite is below the level it would step to (at its own target, or at `level_current + 1` -- the BUILD draw''s level-matched rule WITHOUT its idle exemption, which is exactly the hole) leaves the discovery draw; the discovery belongs to the prerequisite. Distinct from the pass ceiling, which bounds how LONG an atom is investigated, not how far ahead of the buildable frontier. Measured before: 6 of the 18 atoms the tier offered sat behind a prerequisite under the plain below-target reading; under the level-matched rule the filter holds 18 idle atoms, 4 of which the draw would otherwise have offered (PB6, PB7, SITE8, SITE9) -- the rest were already out on frame saturation or the ceiling -- so the offered set goes 18 -> 14. Control: `tests/background/test_discovery_within_buildable_depth.py` -- whole-partition first (keeps ROOT and STEPPED, holds CHILD and GHOST on one map), six mutations red (either draw unwired, idle exemption restored, missing prerequisite read as met, own-target-only rule, holds-all). One joint remains open for L3: epoch accretion.


    LANDED: `epoch_disagreement` in `background/staging_rooms.py` -- 2026-10-03, the epoch accretion joint. An item''s epoch is its ATOM''s, not the writer''s: `atom_epochs` reads every id on both halves of the map, a minted filing whose atom is on no map or whose epoch is not that atom''s is refused at the write by `unchained_filings` (an unreadable map refuses), and `chain_census` now splits `chained` three ways (`minted` = the atom resolves, `unminted`, `unresolved`) with `epoch_contradicted` named and `by_epoch` keyed by the atom''s epoch, rendered by `renderQueueEpochs` in `site/harness/index.html`. Measured before, over the 41 root items the census published as minted: 13 declared their atom''s epoch, 6 typed another, 2 said `unassigned` beside an atom that has one, 8 named an atom on no map (`none` among them) and 12 named `D_opening_dd_seasonal_sizing`, whose map row declares no epoch -- a map gap the census shows as `none on the map` -- so the published minted figure was 33, not 41. Controls: `tests/background/test_staging_rooms.py` (whole partition first; six mutations red: ghost counted as minted, `unassigned` read as agreeing, `by_epoch` keyed to the declared epoch, gate skips the epoch check, unreadable map passes, live-half-only read) and `site/test_harness_delivery_record.py::test_the_queue_panel_names_ghost_atoms_and_epochs_that_are_not_their_atoms` (three door mutations red). Legacy items are not restamped -- an edit is not a filing; the page names them. All three joints are now landed; LEVEL HELD AT 2 until the deployed /harness/ page carries the epoch fields, which needs the delivery generator to run.


    CORRECTED 2026-10-03, beside the epoch note above: it said all three joints were landed, and the knowledge joint was not -- `renderAtoms`, its feed field and its control sat UNCOMMITTED in the shared tree from 05:49 while the depth bound and the epoch joint landed past it at 08:13 and 08:31. Landed in this commit, with the note below. A mutation unwiring `renderAtoms` reds two tests, re-run before landing. All three joints are now on origin; LEVEL HELD AT 2 until the deployed /harness/ feed carries `epoch_contradicted` and `by_epoch` -- the generator at HEAD emits both (33 minted, 8 contradicted), and the delivery seat''s next run writes and commits the feed.


    LANDED: `renderAtoms` in `site/knowledge/index.html` -- 2026-10-03, the knowledge joint, as an `atoms` field on every topic in `site/data/knowledge_wholesale.json` -- a list of map atom ids, or `none -- <reason>` for looked-and-none -- rendered by `renderAtoms` on each /knowledge/ index card, with an absent field shown as the gap. Measured before: 21 of 23 topics named no atom anywhere in their record. Control: `site/knowledge/test_a_page_names_the_atoms_that_build_it.py` -- a named id on neither the live map nor the closed store reds (so a renamed or removed atom cannot leave a page pointing at nothing), plus both forms taken, and three door mutations red (renderer unwired, gap rendered blank, none-form ignored). Not yet in this row''s file_scope: the map was staged by another lane at landing.


    STAGE build -> harden, 2026-10-03, LEVEL STILL 2: the deployed feed now carries every joint. The delivery seat''s 09:02Z landing of its own feed lost the HEAD race on both attempts, so the epoch fields sat on disk only; re-landed through `commit_direction` as 8dcbaeb9f and pushed. Live `data/delivery.json`: 65 items, 33 minted, 8 `epoch_contradicted`, 8 `unresolved`, `by_epoch` {2: 10, 3: 11, none on the map: 12}; the live /harness/ page carries `renderQueueEpochs`. Doors and controls: 104 passed (`site/test_harness_delivery_record.py`, the knowledge atoms door, `test_staging_rooms.py`, `test_discovery_within_buildable_depth.py`). L3 is the full loop: HARDEN plus an Expert Hour, both not yet attempted.


    HARDEN 2026-10-03, EXPERT HOUR ATTEMPTED, FINDINGS OPEN, LEVEL HELD AT 2. Blind pass through `tools/blind_review.py` (a delivery-portfolio COO, plain-words packet only; record in `docs/observability/blind_review_ledger.jsonl`, `independence: false`), 12 questions, answered against the code after the battery was filed. PASS: the readiness bound holds and releases (`test_discovery_within_buildable_depth.py`, 4 real atoms held); the wrong-epoch refusal and the published count share `epoch_disagreement`; the census partitions (`chained` = minted + unminted + unresolved, 33 + 25 + 8 of 66; `epoch_contradicted` is a subset of minted). FIXED IN THIS PASS -- the edit back door: the gate refused only FILINGS, so an edit could strip a chain, which is how the 10-01 register re-render lost four. LANDED: `stripped_chain` in `background/staging_rooms.py`, called by `_staging_chain_check` in `tools/pre_commit_test_gate.py`: an edit that removes a chain the parent copy carried is refused; a legacy gap edited in place still passes. Control: `tests/tools/test_pre_commit_gate_staging_room.py::test_an_edit_may_not_strip_a_chain_the_item_carried` (whole partition), four mutations red (never refuse, refuse every edit, guard dropped, unwired). OPEN, and why the Hour fails: EH-1 VALIDITY -- the gate checks that the named atom exists, not that the item serves it. Read by title over the 33 minted items: about 19 name the atom their subject serves, and about 14 name the atom their THREAD began on. 12 name `D_opening_dd_seasonal_sizing` (DD opening sizing), and about 8 of those are cap, VAT or renewal pricing; 7 name PB4, and the EAC read-error items are not engagement-versus-elasticity. This is a title-level read, not a full read. EH-2 -- the none-yet share (25 of 66; 13 of them machine alarm repeats) has no trend and no named reason. EH-3 -- `D_opening_dd_seasonal_sizing` is the only row of 354 without an epoch, so 12 minted items accrete to `none on the map`. Smaller gaps, not refusals: no time series on the panel; no per-atom load; one epoch per atom by design; the knowledge joint checks that the name exists, not what it does. Items written to disk and never committed reach the census, not the gate.


    HARDEN 2026-10-03, EH-3 and EH-2 CLOSED, EH-1 OPEN, LEVEL HELD AT 2. EH-3: `D_opening_dd_seasonal_sizing` now declares `epoch: 3`, the epoch of the atom it was minted out of in e99debe6d (`DD_seasonal_cashflow_physics`, same lane and value stream), and `LEGACY_MISSING_REQUIRED` in `tests/design/test_maturity_map_contract.py` is emptied, so a row without an epoch now reds the contract with no exemption left. Predicted before the edit: none of its 12 items becomes epoch-contradicted. Held: the census reads `by_epoch` {2: 10, 3: 23}, with `epoch_contradicted` still the same 8. LANDED: `unminted_by_kind` in `background/staging_rooms.py` (a field of `chain_census`), rendered by `renderUnmintedKinds` in `site/harness/index.html`. EH-2 asked why the none-yet share is 25 of 66, and the answer is its kinds: alarm 13, finding 7, reference 4, unknown 1 (the monthly maintenance marker). Only 7 are findings that might want an atom. Controls: `tests/background/test_staging_rooms.py::test_the_none_yet_share_is_split_by_what_kind_of_item_each_is` and `site/test_harness_delivery_record.py::test_the_none_yet_count_says_what_kind_of_item_each_is`, with four mutations red (minted counted in the split, one kind for all, split dropped from the page, split rendered for a feed without the field). Still not done: a TREND, because the panel has no time series. The split names the reason; it does not show the share moving. EH-1 (an item can name an atom it does not serve) is design-sized and is what holds L3.


    HARDEN 2026-10-03, EH-1 PARTLY CLOSED, LEVEL HELD AT 2. Two instruments for "serves" were printed over the 34 minted items before choosing and both failed: cited paths inside the atom''s file_scope (1 of 34 -- scopes name controls, not subjects) and title words shared with the atom (wrong both ways: "PB4 swap landing" matches PB4 and is a draw-mechanics finding). What IS decidable: THE LANE IS THE ATOM''S, as the epoch is, and an item naming its thread''s atom often types its subject''s lane beside it. 21 of 34 do (draw-mechanics findings typed H_harness on PB4 and EP1; cap and VAT findings typed B_commercial on D_opening). LANDED: `lane_disagreement` in `background/staging_rooms.py`. With it `atom_lanes`; `chain_census` publishes `lane_contradicted`; `unchained_filings` refuses a new filing whose lane is not its atom''s, and the gate''s instruction says not the atom your thread began on; `renderQueueLanes` on `site/harness/index.html`. Controls: `tests/background/test_staging_rooms.py::test_a_minted_items_lane_is_its_ATOMS_over_the_whole_partition` (never/always disagree, lane-less atom counted, gate leg dropped -- all red) and `site/test_harness_delivery_record.py::test_the_queue_panel_names_items_whose_lane_is_not_their_atoms` (list dropped, unconditional, unwired -- all red). STILL OPEN, and it holds L3: a wrong atom IN THE RIGHT LANE (the PB4 EAC items, all W2) passes; the 21 legacy items are listed, not re-chained.


    HARDEN 2026-10-03, THE LEGACY RESIDUE RE-CHAINED BY HAND, LEVEL HELD AT 2. Every census partition is now empty over the 66 root items: `lane_contradicted` 21 -> 0, `epoch_contradicted` 8 -> 0, `unresolved` 8 -> 0, unchained 0; minted 34 -> 28, unminted 24 -> 38. Each header was re-read against its body, not its title, and only the first line changed. Six draw-mechanics findings (PB4 swap drawn twice and a fourth time, the lost dispatch claim, the SVT roll and 10-02c floor redraws, the standing-charge item drawn after landing) serve no atom on the map and now say `H_harness` / `unassigned` / `unminted`. The five DD-opening findings typed W2 keep `D_opening_dd_seasonal_sizing` and take its lane. The seven cap-ceiling findings join the two the 10-02 writer had already put on `W3_1b_intra_year_price_cap_granularity` (lane W3, epoch 2). The portfolio-premium foresight finding is `EP3_pricing_engine_late_truth`. The two acquisition-pricing findings keep PB3 and take its lane and epoch, and the two H49 findings take H49''s epoch. The eight `none` or claim-id atoms now say `unminted`. The PB4 EAC items were read in full and KEPT: they are the `settle-the-eac-against-demand-gap-before-pb4s-swap` prerequisite to PB4''s bill-shock swap, so EH-1''s title read (about 14 wrong) overcounted. No control changed and no count is pinned, so this moves data, not mechanism. STILL OPEN, and it still holds L3: a wrong atom in the right lane has no instrument. Today''s 28 have been read by hand; the next filing has not.


    HARDEN 2026-10-04, THE LANE REFUSAL HELD ON EVERY FILING SINCE IT LANDED, A THIRD INSTRUMENT FOR "SERVES" FAILED, LEVEL HELD AT 2. Measured over the 21 root items whose first commit came after `lane_disagreement` landed in b648ca7ec (2026-10-03 13:17): 13 minted, 8 `unminted`; every census partition still empty over all 77 root items (`unresolved`, `epoch_contradicted`, `lane_contradicted`, unchained all 0; minted 28, unminted 49, of which 15 alarm, 25 finding, 5 reference, 4 unknown). The 13 minted were read by title against their atoms and all serve them: 9 name `PB8_a_households_payment_channel_changes_over_its_tenure` (the DD stop, the seam following it, the own-book method register), 4 name `W2_payment_channel_dd_consistency_invariant`. The 8 `unminted` were read in their headers and opening sections. None plainly serves a live atom. The nearest is `PB7_the_company_learns_what_it_can_now_see` for the book-learned default belief, and PB7 is the churn and engagement coefficient, not bad debt, so `unminted` stands. The instrument tried this time: a minted item cites a path that sits in its atom''s `file_scope`. Printed over the 28 minted items before anything was built, it hits the item''s own atom on 2 of 28, and the shared hub files (`simulation/run_phase2b.py` among them) sit in 5 or more scopes. Like cited-paths-in-scope and shared title words on 10-03, it fails both ways, so nothing was built. Three instruments have now failed, and that is the evidence: "this item serves this atom" is a validity judgement that a reader makes, not a property the header or the cited paths carry. RECOMMENDATION for the seat, which owns the call: stop holding L3 for an instrument and close EH-1 as a stated limit. The /harness/ queue panel would say the gate checks that the atom exists, its lane and its epoch, and that whether an item serves its atom is read by hand, dated by the last read (this one, 21 of 21). The Expert Hour would then be re-run against that claim. Until the seat decides, the level stays at 2.


    HARDEN 2026-10-04, EH-1 CLOSED AS A STATED LIMIT, LEVEL HELD AT 2. The recommendation above is taken: it is reversible and its evidence is three failed instruments. LANDED: `serves_by_hand` in `background/staging_rooms.py` (a field of `chain_census`) over the append-only record `docs/design/queue_serves_reads.json`, rendered by `renderQueueServes` on `site/harness/index.html`. The panel now says the gate checks the atom exists and the lane and epoch are its, and that whether an item serves its atom is read by hand; it dates the last read and NAMES every minted item filed since it, so the limit rots visibly instead of silently. An absent record renders as not measured, never as all read. The first read (this tick, 28 of 28 minted) doubted one: the B8 per-method-slopes note names W2, the change it reports, while the work it asks for is B8''s -- recorded as questioned, not re-chained, because the hand-off is genuinely both. Controls: `tests/background/test_staging_rooms.py::test_serves_its_atom_is_a_dated_hand_read_and_the_unread_minted_items_are_named` (whole partition: read, unread, questioned and absent all reachable; four mutations red -- every minted counted read, unread list dropped, unminted items read in, missing record reported as recorded) and `site/test_harness_delivery_record.py::test_the_queue_panel_states_that_serving_an_atom_is_read_by_hand_and_names_the_unread` (three door mutations red -- unread list dropped, read rendered without a record, renderer unwired). NOT YET: the committed `site/data/delivery.json` predates the field, so the live page shows the stated absence until the delivery generator next runs; L3 is the Expert Hour re-run against the stated-limit claim, after the deployed page carries it.


    HARDEN 2026-10-04, EXPERT HOUR RE-RUN AGAINST THE STATED LIMIT, FAIL, LEVEL HELD AT 2. Same COO persona, a new plain-words packet that states the limit (`docs/observability/blind_review_ledger.jsonl`, 13:30Z, `independence: false`), 12 questions, answered against the code after the battery was recorded. FOUND FIRST, before the battery was answered: the 10-03 hand re-chain above was never committed. Its 30 first-line edits sat in the shared working tree from 13:57 that day, origin still carried the contradicted chains, and the census and the published feed were reading uncommitted disk. Landed as dccb6837f with a second hand read (the three EP4 plan items, all serve it; 31 of 31 minted read). LANDED: `serves_by_hand` in `background/staging_rooms.py` now takes each minted item''s CURRENT atom, and a read that records `atoms` covers an item only while it still names the atom it was read against, so a re-link puts it back in `not_yet_read` and its doubt goes with the old atom. This answers the battery''s Q4 (a re-link moved with no new read). Reads written before the field cover by name alone. Control: `tests/background/test_staging_rooms.py::test_a_read_covers_an_item_only_while_it_names_the_atom_it_was_read_against`, three mutations red (atoms ignored, legacy read covers nothing, doubt kept after a re-link). OPEN, and why it fails: Q2/Q11 the reader is a tick of the same machine that files the items, and nobody audits the read. That is the independence limit every blind pass here records, and more machinery cannot close it. Q5 the one doubted item (the B8 slopes note) has no resolution route and just stays on the list. Q1/Q3 neither the unread backlog nor the none-yet share has a trend (49 of 80 today: 16 alarm, 23 finding, 5 reference, 5 unknown; 25 of 66 on 10-03), so the reviewer''s "is it falling" cannot be answered. The cheapest next step is a doubted item''s disposition: re-chain it or record why it stays.


    HARDEN 2026-10-04, Q5 CLOSED, LEVEL HELD AT 2. LANDED: `serves_by_hand` in `background/staging_rooms.py` -- a `settled` disposition, published as `serves_by_hand.settled` and rendered by `renderQueueServes` on `site/harness/index.html`. A doubt now ends one of two ways: a re-link (which already took the doubt with the old atom, but only for reads that record `atoms`), or a LATER read covering the item against its current atom that lists it in `settled` with why. Reads apply in file order, so a later doubt re-opens it, and a later read that covers a doubted item and says nothing leaves the doubt standing. Control: `tests/background/test_staging_rooms.py::test_a_doubt_ends_only_when_a_later_read_settles_it_with_a_reason` (settled, silently re-read, re-doubted and never-doubted all on one record; four mutations red -- silence settles, `settled` ignored, re-doubt lost, never-doubted reported settled) and the extended `site/test_harness_delivery_record.py::test_the_queue_panel_states_that_serving_an_atom_is_read_by_hand_and_names_the_unread` (settled list dropped: red). The one doubt was disposed of on the live root: the B8 slopes note asks only for B8''s re-fit and touches no W2 code, so it is re-linked to `B8_discovered_price_sensitivity_holdout` (B_commercial, epoch 3). The first read had recorded no `atoms`, so the re-link alone left the doubt standing. The real case therefore needed `settled`, and the third read records it. Census after: 82 root items, 31 minted, 31 read, none doubted, one settled; every contradiction partition 0. STILL OPEN for L3: Q1/Q3, a trend for the unread backlog and the none-yet share (51 of 82 today), and Q2/Q11, independence, which the machine cannot close. The live feed carries `settled` once the delivery generator next runs.'
