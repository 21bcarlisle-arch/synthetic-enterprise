atom_id: H45_the_queue_is_chained_to_the_map
map_notes:
  gain: 'LANDED: `chain_of` in `background/staging_rooms.py` -- restated at the head of this record on 2026-09-06 when H41''s drain renamed its key from `origin_note` to `gain`. The claim below is unchanged and was already in checkable form; it is repeated here because the landing-claim control reads ADDED lines, and a key rename makes only this first line new, which would otherwise present an assertion whose proof it cannot see.


    Director, 2026-08-28, having read all 49 files in docs/staging/: ''not one file carries a lane, an epoch or an atom id, so the queue is disconnected from the map entirely -- the same missing chain the guidance calls P8''. P8 in full: ''no systematic link from knowledge to discovery to atoms to epochs. Published evidence we already held sat unused while a 3.75x spread was invented. A July design document sat unread until a director question surfaced it. Discovery ran eight passes deep on atoms that could never build. Knowledge pages describe mechanisms with no link to the atoms implementing them, so page and code can disagree indefinitely and nothing notices.'' PART LANDED 2026-08-28: background/staging_rooms.py parses the chain off the header finding_severity already owns, counts the items carrying none, and separates ''nobody looked'' (absent) from ''looked, nothing yet'' (an explicit `unminted`); alarm_repetition stamps the chain on every document it files. REMAINING: the other three joints -- a knowledge page (docs/design/knowledge/, not yet created) that names the atoms implementing it and fails when they move; a discovery pass that cannot run deeper than the atom it is about can build; and the epoch attachment, so work accretes rather than scatters.


    LANDED: `chain_of` in `background/staging_rooms.py` -- with `unchained` and the explicit `UNMINTED` sentinel beside it, and the chain header stamped by `alarm_repetition`. Stated in the falsifiable form on 2026-09-06 by the seat that rehomed this text out of the map''s `gain` field: the prose asserted a PART LANDING and named no symbol, which the spine has no control for and the store does. Verified present before the line was written; the REMAINING three joints below are unchanged and still open.


    LANDED 2026-09-30: `_staging_chain_check` in `tools/pre_commit_test_gate.py`, over `unchained_filings` in `background/staging_rooms.py` -- the count is now REFUSED at the write. Measured before it landed: 28 of the 96 work items filed into the root in the week to 2026-09-30 carried no epoch or atom, while `unchained()` reported the gap and nothing held it. Scope is a FILING (absent from the parent commit), so the legacy gaps bill nobody; directives and console messages are exempt. Controls: `tests/tools/test_pre_commit_gate_staging_room.py` section 6, four mutations red (parent skip, never-refuse, unwired, directive owed). This holds the chain on NEW work; the three joints named above (knowledge page, discovery depth bound, epoch accretion) are still open.


    LANDED: `stamp_chain` in `background/staging_rooms.py` -- applied in 0ac9815b7 to the six root items it reported, so `unchained()` reads 0 (32 chained, 5 minted). LEVEL HELD AT 1, 2026-09-30, by the seat that brought `unchained()` to 0 (the four class registers and two findings, stamped `unassigned`/`unminted` after reading each against the live map). L2 is DISCOVER-lite + VERIFY, and VERIFY is evidence on a DEPLOYED SURFACE (MATURITY_MAP.md section 2; PB4''s hold note applies it). Nothing under `site/` reads `unchained`, `is_minted` or the refusal, so the count lives only in `staging_rooms` output and the commit gate. The cheapest honest L2 is a published figure: chained / minted / population over the root, with the unminted share beside it -- not a level recorded on gate evidence alone.'
