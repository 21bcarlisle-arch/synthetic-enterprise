atom_id: H44_worker_tick_lock_toctou
map_notes:
  gain: 'WORKER_FINDING_TWO_LIVE_WORKER_INVOCATIONS_RAN_THE_IDENTICAL_DOORBELL_CONCURRENTLY_2026-08-24 observed two live `claude -p` invocations carrying byte-identical doorbell text at 2026-08-24 07:25, one already mid-git-commit while the other (this session) started cold on the same staging queue. `.worker_tick.lock` named only one holder, correctly, but that is consistent with a genuine race, not proof one never happened: `run_tick()` (background/worker_tick.py:379-397) checks `invocation_in_flight()` once, then does the origin-sync + find_work() draw (real I/O, non-trivial wall time), and only calls `_write_lock()` AFTER `spawn_invocation()` returns -- so two overlapping check-windows can both read the lock free and both spawn; the second `_write_lock()` simply overwrites the first''s entry, leaving exactly one apparently-legitimate holder even when two children ran. Cost: a second full context stream re-reads the whole repo/CLAUDE.md for work the first stream is already doing (direct token cost, zero marginal value) plus real tree-corruption risk from two uncoordinated agentic sessions editing the same shared tree -- exactly the class the docstring says the lock prevents. Fix: make invocation_in_flight() + _write_lock() one atomic critical section (e.g. os.open(LOCK_FILE, O_CREAT | O_EXCL) claimed BEFORE the draw, released/overwritten only by the same pid, stale lock still reclaimed on a dead pid as today) and add a test starting two run_tick() calls with an artificially slow _draw() that asserts only one spawns.'
