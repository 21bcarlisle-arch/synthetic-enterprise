atom_id: G13_projection_consumers
map_notes:
  name: 'MINTED FROM deliverable 3 of the WORK THIS CREATES block in DIRECTOR_INSTRUCTION_QUERYABLE_PROJECTIONS_2026-08-10 -- ''at least one site page and one lab query consuming it, as the proof-of-caller''. Split from G12 because the file_scope is disjoint (site/** and the lab, not the builder) and the SITE lane runs parallel to BUILD. EXIT: (1) at least one site page reads the projection store INSTEAD OF a hand-refreshed file, and the file it replaces is named; (2) at least one advisor-lab query answers a real question off the store; (3) R11 -- the LIVE page is fetched and the rendered value asserted, never the code or the deploy log; (4) the staleness subclass the instruction claims this deletes is MEASURED, not asserted: name the derived-artefact-staleness entries that this consumer removes from the register, and show the register short by exactly those.'
