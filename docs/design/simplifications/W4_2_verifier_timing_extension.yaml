atom_id: W4_2_verifier_timing_extension
simplifications:
- '2026-07-10 (fourteenth draw): this atom''s own claim was FALSE. expert_hour had been marked ''passed, findings: []'' since seeding, and level_current=2 implied the TOOL itself gained timing-detection capability. Read the entire 202-line tools/epistemic_verifier.py: it contains ONLY literal import-statement regex matching (FORBIDDEN_SOURCES), zero data-flow/timing detection logic -- confirmed unambiguously by this atom''s OWN cited evidence: docs/review_gates/done/HEDGE_VOLATILITY_LOOKBACK_FORESIGHT_BUG.md''s own contemporaneous text states plainly ''tools/epistemic_verifier.py does not catch this class of bug -- it scans for company/<->simulation.* import violations, not data-flow/timing bugs.'' What actually happened was CLAUDE.md''s Tier 1 POLICY definition being broadened to explicitly name timing violations as in-scope for classification purposes -- a real, true change -- but I conflated ''the policy now names this'' with ''the tool now detects this'' when originally seeding this atom. Corrected level_current down to 1 (the real progress: policy broadened, real incident understanding gained) and loop_stage to idle: actually building real detection into tools/epistemic_verifier.py is Tier 1 (CLAUDE.md names ''the epistemic verifier'' explicitly as a safety-control-modification category (b)) -- opened docs/review_gates/EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md rather than build it unilaterally.'
- '2026-07-11 GATE RESOLVED, stayed idle (verified against real disk state -- caught via the W4 charter-writing subagent finding this atom''s own text stale): the Tier 1 gate closed 2026-07-10, director decision Option B/C -- ''Verifier gate: B/C confirmed -- register + doc-fix, no build; the PreToolUse hook (adoption sprint) is the near-term detector, the as-of snapshot object the permanent fix. Close the gate.'' No automated data-flow/timing detection will be built into tools/epistemic_verifier.py -- a deliberate, director-ratified decision, not an open question. Practical detection burden is carried instead by two REAL, separate, already-built mechanisms: .claude/hooks/block_point_in_time_read.py (near-term) and the W1_reveal_over_time PointInTimeView/BitemporalEventLog structural fix (permanent, in progress under W1''s own charter). level_target=3 for THIS atom (the tool itself gaining detection capability) is therefore not the actual direction of travel -- the real fix lives in W1, not here -- flagging that level_target may be the wrong measure for this atom''s remaining scope rather than silently chasing it; loop_stage correctly stays idle, at rest, nothing further to build here absent a future incident reopening the question.'
- '2026-07-13 ADVERSARIAL VERIFICATION of the cited near-term detector (self-refill draw, no new code -- exercised the EXISTING .claude/hooks/block_point_in_time_read.py directly via real hook-payload simulation, no persisted test file added, matching DISCOVER/FRAME-only per this doorbell). Ran 10 real adversarial cases through main() directly: dangerous pattern with no bounding (correctly FLAGGED, both run_settlement(...) and bare all_records forms), same pattern WITH as_of/bisect bounding (correctly clear), tests/company/ near-miss path (correctly clear -- ^(company|saas) anchor does not match a tests/ prefix), sim/ path (correctly clear, out of scope by design), nested company/deep/nested/path/foo.py (correctly FLAGGED -- .* correctly matches depth), near-miss path prefixes notcompany/ and company_extra/ (both correctly clear), non-.py file (correctly clear). One minor, low-severity gap found: the regex is case-sensitive, so an ALL_RECORDS (uppercase) variable name would bypass detection -- confirmed via grep that no code in this codebase actually uses that casing, so this is a theoretical bypass, not a live one; registered, not fixed (this hook is a director-authorized, deliberately-narrow heuristic per its own docstring, and a case-insensitive tweak would be a real code change to a harness detector, out of scope for a DISCOVER pass). Net finding: the ''practical detection burden carried by two real mechanisms'' claim this atom''s own registration rests on is genuinely, adversarially verified for the near-term-detector half -- not just asserted. Does not change this atom''s own level/loop_stage (correctly still idle/at-rest; this verification concerns a sibling mechanism cited as evidence, not a build step on this atom''s own remaining scope).'
- '2026-07-15 DISCOVER pass, routes two concrete mutation-grounded scope items and separates them from the director-closed gate (self-refill draw, DISCOVER/FRAME only, no BUILD code -- the automated-timing-detection-into-the-verifier gate stays director-closed per the 2026-07-11 Option B/C decision; the verifier is a named Tier-1 safety control, untouched here). (1) The CONTROL_KILL_LIST (KL-2) already formally assigns THIS atom the verifier''s two real coverage gaps found by the harness mutation audit: (a) _scan_file returns [] on FileNotFoundError -- a MISSING FILE reads as clean = a FAIL-OPEN control defect (R15 killer-pattern 2), and (b) only line-start import syntax matched, missing importlib/getattr dynamic imports. KEY DISTINCTION prior passes did not draw: the FAIL-OPEN missing-file fix is NOT the director-closed ''automated data-flow/timing detection'' -- it is a mandatory R15 fail-open remediation on an existing control, separately rankable and NOT covered by the closed gate; flag for the orchestrator as a small, in-scope, non-gated build (make a missing/unreadable file ALARM, not read clean). (2) The ARCH1_internal_seams RecordedSimInterface built THIS turn adds a working blindfold data-flow gate (observed_at > as_of -> NOT_KNOWABLE_YET) with an R15 mutation test -- a concrete instance of the timing/data-flow detection this atom theorises, living AT THE SEAM (structural, matching the director''s ratified ''the structural fix lives in W1/the seam, not the verifier'') rather than as regex in the verifier. Confirms this atom''s own direction-of-travel note: the real detection is structural. No level change, no BUILD code.'
- '2026-07-16 BUILD, level_current HELD at 1 (honest, not bumped) -- built a real, mutation-tested, R15-compliant increment WITHIN the still-open ''static import-direction'' scope (KL-2b: importlib.import_module()/__import__() dynamic-import bypass, a literal-string-constant target smuggling a forbidden sim/simulation module past the AST scan that only walked ast.Import/ast.ImportFrom nodes), but explicitly did NOT build the atom''s own literal named target (automated data-flow/timing-violation detection -- e.g. catching a function receiving an unbounded historical dataset with no as-of cut). That specific dimension is a CLOSED Tier-1 safety-control gate (docs/review_gates/done/EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md), director-ratified 2026-07-10 via NTFY correlated with a staged doc: ''Verifier gate: B/C confirmed -- register + doc-fix, no build... Close the gate,'' explicitly resolving that ''tools/epistemic_verifier.py itself is NOT modified; no new static/AST timing-detection logic is built into it,'' with the practical burden instead carried by .claude/hooks/block_point_in_time_read.py (near-term) and the point-in-time snapshot/as-of interface object (permanent, W1/D2). CLAUDE.md''s own Authentication convention for safety-reducing changes states a Tier 1 change is only authorized by (a) Rich typing directly in a live console turn or (b) Rich clearing the gate file himself -- a build-delegation prompt from another agent turn is neither, so building the barred dimension now would have been an unauthorized reopening of a real, closed, director decision, not a genuine next increment. Built the smaller, genuinely still-open, NON-gated item instead: this atom''s own 2026-07-15 DISCOVER note had already named ''missing importlib/getattr dynamic imports'' (KL-2b) as a real remaining gap distinct from the closed automated-timing-detection gate -- confirmed by direct test BEFORE fixing that importlib.import_module(''simulation.x'')/__import__(''sim.x'') with a literal string target returned zero findings (a genuine FAIL-OPEN bypass of the H12/KL-2 AST scan, which only inspects ast.Import/ast.ImportFrom nodes, not ast.Call). FIX: tools/epistemic_verifier.py -- new _dynamic_import_target() (matches importlib.import_module(...) both the attribute and bare-name-imported forms, and __import__(...), literal string-constant argument only; a variable/f-string/concatenated target is a documented heuristic limit per the module''s own new docstring, not a false-clear) wired into _scan_source''s existing ast.walk loop (reusing the same _module_is_forbidden/APPROVED_ORCHESTRATION exemption logic, zero duplication) plus a regex fallback (_DYNAMIC_IMPORT_CALL_RE) in _scan_lines for the SyntaxError/unparseable-file path, matching the existing literal-import fallback discipline. R15 MUTATION-TESTED per the killer-pattern doctrine: test_verifier_fires_on_dynamic_import_of_sim_internals injects the exact defect (5 dynamic-import forms: attribute call, bare-name call, __import__, nested-in-function, sim vs simulation root) and asserts each FIRES; test_verifier_dynamic_import_pre_fix_baseline_did_not_fire PINS the regression by directly re-running the OLD ast.Import/ast.ImportFrom-only walk against the same source and asserting it found nothing (proves the control COULD fail before this fix, not just asserts the new behaviour); test_verifier_dynamic_import_does_not_false_fire_on_lookalikes_or_variables proves outcome-safety (simplejson/similarity lookalikes, the approved seam, approved orchestration, an unresolvable variable target -- all correctly clear); test_verifier_dynamic_import_syntaxerror_fallback_still_catches_it proves the regex fallback path also fires, not just the AST-primary path. 5 new tests, all in tests/controls/test_control_mutation.py (the file H12/KL-2 already established as this control''s own mutation-test home): 67 passed + 1 xfail (was 62+1 before this pass), zero regressions. tools/epistemic_verifier.py run directly against the live repo: PASS, 509 company/+saas/ files scanned, 0 violations -- confirms the new dynamic-import check does not false-fire anywhere in the real codebase. HONEST RESIDUAL: level_target=3 (data-flow/timing detection) remains correctly unreachable from THIS atom''s own file_scope per the closed gate -- unchanged from every prior pass''s own conclusion that ''the real detection is structural,'' living at the seam (ARCH1_internal_seams'' RecordedSimInterface), not as new logic in this file. The genuinely new evidence this pass adds is narrower: the *existing, ungated* import-direction remit (KL-2''s own class) had one more real coverage gap (dynamic imports), now closed and mutation-proven, same as KL-2''s literal-syntax gaps were. loop_stage stays idle -- no further BUILD available on this file_scope without either (a) a fresh, in-conversation Rich decision reopening the closed Tier-1 gate, or (b) a new, different, non-gated coverage gap being found by a future mutation audit.'
- '2026-07-16 DISCOVER/FRAME (Lane-3, H17 draw): framing artifact written (design exploration of data-flow/timing detection). Level UNCHANGED at 1 — real detection build is Tier-1 director-gated (EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md); no verifier code touched. Any future build must be R15 mutation-tested.'
- '2026-07-16 FRAME (Lane-3 H17, doc-only, HELD AT L1 -- already built in skeletal form; FRAME cannot move it and BUILD is barred): docs/design/VERIFIER_TIMING_DATAFLOW_EXTENSION_FRAME.md, a companion (not an override) to the existing FRAME. Adds concrete mechanism: AST-taint sources/sinks/one-hop propagation for data-flow detection, a structural pattern table for timing detection built on the bitemporal valid_time/transaction_time axes (not inferred time), >=5 R15 mutation tests per detector (incl. replanting the real hedge-volatility foresight bug), and an R10 registered-simplification list bounding honest coverage. BUILD is gated on the director REOPENING the closed Tier-1 gate EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md; the doc explicitly authorizes no build.'
- '2026-07-16 Lane-3 H17 RE-DRAW (doc-only, no BUILD code -- EPOCH_GATING Rule 1). FRAME already saturated (existing docs/design/frame/W4_2_verifier_timing_extension_FRAME.md); level HELD at 1, no honest FRAME-stage move possible (target requires BUILD-gated code). BUILD-unblock gate: director re-opens EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md (Tier-1 safety-control WALL, director-reserved) to build real data-flow/timing detection into a named wall control. See LANE3_H17_BUILD_GATE_SURVEY_20260716.md for the full 6-atom gate table.'
- '2026-08-26 CLOSED, level HELD at 1 and level_target lowered 3 -> 1 (scheduled-tick self-refill draw of this atom at loop_stage=build, the ninth pass). The atom kept being drawn at dial 3 for a build a CLOSED Tier-1 gate declined: docs/review_gates/done/EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md, director 2026-07-10 via NTFY correlated with docs/staging/done/from_rich_20260710_203008.md -- "B/C confirmed -- register + doc-fix, no build; the PreToolUse hook (adoption sprint) is the near-term detector, the as-of snapshot object the permanent fix. Close the gate." Eight prior passes each re-derived that from scratch and each wrote HELD at 1; the one record that would have stopped the draw -- level_target -- was never moved, so the map went on scheduling a build whose only honest outcome is refusing to do it. That is the defect closed here, and it is a RECORD defect, not a capability gap. Both carriers the ruling rehomed the burden to were verified on this tree this tick, not taken on the raising document''s word: .claude/hooks/block_point_in_time_read.py exists, is tracked, and is registered as a PreToolUse Edit|Write hook in .claude/settings.json (checked by parsing the real settings file, not by reading a docstring); company/interfaces/point_in_time_view.py exists and is tracked; and the routing control landed at 3002065ba, tests/tools/test_epistemic_verifier_timing_routing.py -- which asserts the near-term half is still WIRED rather than merely still tested, an unregistered hook keeping every one of its behavioural tests green while detecting nothing -- runs 8 passed. file_scope corrected to name all three real carriers instead of tools/epistemic_verifier.py alone, which by itself read as this atom being a verifier build. DEVIATION FROM THE RAISING SEAT''S RECOMMENDATION, stated rather than silent: WORKER_FINDING_W4_2_REDRAWS_A_BUILD_THE_CLOSED_GATE_DECLINED_2026-08-26.md recommended level_current 1 -> 2 on the rehomed carriers with an R16 self-certification. Not taken. This atom''s own expert_hour record IS a finding that a level-2 claim here was previously false and had to be corrected down, and eight register passes since have each independently landed on 1; redefining the atom''s file_scope and bumping its level in the same edit is the exact shape of that documented false claim. Closing at the level eight passes agreed on costs nothing -- a level is always raisable later on evidence -- while an unearned one repeats the failure this register exists to remember. The honest residual is unchanged and is not hidden inside a level: the near-term hook is a one-pattern, warning-only heuristic over run_settlement and all_records, case-sensitive per the 2026-07-13 adversarial pass in this same register, and point_in_time_view.py''s own docstring says it covers price and forward observables while weather, generation and demand are left unaudited. Reopen by raising level_target above 1, which means re-opening EPISTEMIC_VERIFIER_TIMING_DETECTION_TIER1.md and retiring tests/tools/test_epistemic_verifier_timing_routing.py::TestVerifierStaysImportDirectionOnly alongside it -- do not leave two registers disagreeing about who owns the burden.'
