the least right of all to ignore: THIS tick is the one that changed the instrument. D16 renamed a published quantity (the ageing dimension no longer publishes ''the wrongful-dunning exposure'' -- that name now has exactly one owner) and moved the number under it 0.0951 -> 0.0090 on seed 7, all reshape and no company change. An Expert Hour run by the tick that built the change is the reputation-of-the-old-instrument problem in its purest form. The next promoter runs the Hour fresh, and should start where this build declined to go: D17_d8_counterfactual_has_no_unattributed_residual, minted this tick, is a limit in a measure that rides in THIS atom''s own ledger note -- the D8 remittance counterfactual now attributes 100% of every measure it publishes, because the residual its anti-rubber-stamp guard rested on was made of the very cases D16 excluded. That guard currently guards nothing. == D17 LANDED 2026-08-09 (worker tick, L0->L2) AND THE POINTER THIS NOTE HANDED THE NEXT PROMOTER IS DISCHARGED: the anti-rubber-stamp control no longer rests on a residual the world happened to supply -- it rests on an INJECTED belief error no invoice reference can cure (a credit the bank feed never DELIVERS to either book), which leaves the ageing overstatement 0.4444 attributed and the false-flag rate 0.7059 rather than 1.0, and is R15-proven both ways against a shadow company clean BY CONSTRUCTION. The 100%-attribution reading is published AT SOURCE as a property of the observation channel, never a pass mark. THAT DOES NOT PROMOTE THIS ATOM: the Hour is still un-run on the corrected instrument, and D17 changed what this atom''s own ledger note says, so the reputation-of-the-old-instrument warning above applies to it too. NOT a wall, and NOT a reason to tune either number (R12). == D19 LANDED 2026-08-10 (worker tick, L0->L2) AND THE BELIEF HEADLINE IS A DIFFERENT MEASURE FROM THE ONE EVERY PRIOR EXPERT HOUR LOOKED AT. Hour #3 (2026-08-10, commit 0470e50f9) held this atom at L2 on a m