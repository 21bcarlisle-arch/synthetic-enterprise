atom_id: H27_payment_belief_gap
simplifications:
- 'EIGHTEENTH HOUR (2026-08-11), on Hour #17''s lead 1 -- the D35 reshape, that the render-site sweep stops at this process''s edge: THE DOOR''S DEPTH LIMIT SWALLOWED 53 PUBLISHED FIGURES. The precision question the lead asked is ANSWERED AND NEGATIVE, measured on the rendered pixel by driving the live payload through the page''s own JavaScript: the ledger''s detection figure 0.0859375 appears in its row at 3dp (`fmtGap`, the door''s headline -- UNDECLARED) and at 4dp (`format_detection_summary` inside the note -- the DECLARED site), and nowhere finer; the 1dp hits are five other numbers and the discrimination rule rejects them. So no downstream writer renders any of the five figures finer than declared, the one undeclared site is COARSER, and no epsilon, band, floor or collapse moves. Two things pinned on the way: `to_ledger_entry` writes the headline UNROUNDED into coupled_gap_ledger.json and `_coupled_gaps` carries it unrounded into proof.json -- a CARRIER, not a render, which the rule ''the epsilon is half a step of the FINEST render'' has no way to say, and applied literally to a JSON hand-off collapses to 1e-17; and the door renders every component number at 4dp, integer counts included (`caught: 31.0000`). THE DEFECT THE WALK FOUND INSTEAD: `fmtComponent` exists because this door was serving ''[object Object]'' for a nested component -- found by site/live_pixel_verify.py driving the LIVE page, its own comment setting the standard ''a component that renders as [object Object] is a figure that cannot be read at all'' -- and the repair''s depth limit (`if (depth >= 2) return "..."`) REINTRODUCED THAT FAILURE ONE LEVEL DOWN. Measured: of 618 numbers published in `components` across the 14 rows, 53 were elided from their own row''s block (W1_11 22, W1_12 22, W2_11 9) and 43 -- every `two_level.cells.*` value/worst_value/resolution on both fabric rows -- were readable NOWHERE on their row. It was invisible on the row anybody was reading because H27''s own six attributed measures are elided too and survive ONLY on an accident: `format_remittance_attribution_summary` happens to repeat them in the note prose. Nobody designed that safety net, no control knew it existed, and it does not exist on the fabric rows -- so the whole D8 attribution reached the door as several hundred words of caveat with every number it caveats replaced by an ellipsis, D17''s discrimination lists included. NOTHING ASSERTED OTHERWISE: the panel''s R11 test checks each row''s GAP renders at 3dp and no control had ever asked whether a published COMPONENT number reaches the reader at all. CLOSED AT THE CLASS (R10): the depth limit goes on bounding STRUCTURE and stops bounding NUMBERS (past it the numeric leaves are flattened path-qualified; raising the limit to 3 is the instance fix that comes straight back), the spin guard moves to an explicit NODE BUDGET because depth never could carry it (a two-deep cycle spins inside the limit, proven by building one), non-numeric leaves still elide so this is a narrowing not a removal, and the control is the population one: every finite number in a row''s components must appear in THAT ROW''s rendered block -- per-row deliberately, since a panel-wide search passes on a number legible two rows away, which is the accident that hid this. Both vacuity halves guarded (too-few-numbers raises; none-past-the-limit raises). R15 four mutations firing by name: the pre-repair `return "..."` restored in a mutated copy of the page and asserted to lose 53 numbers on both named fabric rows (a COUNT, so a change is a movement to re-read); a figure nested one deeper than anything shipped, legible; a numberless deep subtree, still elided; a cyclic payload, bounded. R11: 618/618 now render, verified before and after by executing the page''s own inline JS on the live payload. R12: no computed number moved -- this changes what the door PRINTS. site/proof 15 passed; site/proof + tests/tools/test_generate_proof_coupled_gaps.py 123 passed; site/test_live_pixel_verify.py 16 passed. Landed in site/** (L2 SITE lane), not in this atom''s file_scope: D35''s scoped build -- declaring the door''s sites in PUBLISHED_GAP_CONSUMERS and extending the sweep past this process''s edge, which must move TOGETHER or check_component_render_sites reds -- stays open.'
- 'NINETEENTH HOUR (2026-08-11), on Hour #18''s leads 1 AND 2, which turned out to be ONE repair -- THREE OF THE FIVE PUBLISHED FIGURES HAD NEVER MET AN ARTEFACT. Lead 1 (extend the render-site sweep past this process''s edge so the register can declare the door''s 3dp site) crosses the JSON hand-off lead 2 is about, so neither could be pulled alone: a walk to the door with no render/carrier boundary reads `coupled_gap_ledger.json`''s unrounded headline as an 18dp render and collapses every epsilon this instrument publishes to 5e-19. Building the walk found the defect. (1) THE ARTEFACT-SIDE CONTROL PASSED VACUOUSLY ON 60% OF ITS POPULATION. `measure_component_render_sites` finds ZERO sites for `belief`, `detection` and `detection_latency`, and `check_component_render_sites` says nothing about any of them, because every finding it can emit is keyed to a site it FOUND or a site the register DECLARED and those three declare no `component_renders`. So the half of D34/D35 whose entire purpose is independence from the AST read had never confronted those three figures'' precisions (4dp, 4dp, 2dp) with an artefact at all. Its only vacuity guard is a GLOBAL `any(row[''sites''])` -- Hour #18''s own panel-wide-substring finding, reappearing one level up inside the instrument that found it: it passes because SOME OTHER dimension has a site. Per-dimension vacuity was unsatisfiable in place, because those three reach their reader through the note `measure_and_write` composes and through the Proof door, both past this process''s edge. (2) THE SECOND FINDING: THE TWO-SEED RULE CANNOT SEE A SIBLING. It tells a figure from a CONSTANT (''0.0'' is a render of nothing) and not from a quantity that MOVES WITH IT. `belief_population_mix` (population TV distance) equals belief''s PER-CASE DISAGREEMENT rate on every book measured (seeds 7/11/23/101/999: 0.0800, 0.1033, 0.0767, 0.0867, 0.0767 on both sides), so its digits appear at 4dp inside `format_belief_summary`, which does not render it. They are two quantities -- the D19 note records that they separate under a permutation of which account holds which severity belief (TV held at 0.0713 while per-case agreement fell 0.9287 -> 0.6432) -- and no real book performs that permutation, so no value-only sweep can separate them. A value-only walk would have moved this figure''s epsilon on the strength of another figure''s render precision. WHAT LANDED: `measure_reader_render_sites` walks the two surfaces the component sweep structurally cannot see -- each figure''s OWN declared renderer''s output (the string `measure_and_write` concatenates verbatim into the ledger note) and the Proof DOOR, rendered by the page''s own inline JavaScript from the ledger carrier -- by calling the shipped code at every step (`to_ledger_entry` -> ledger -> `_coupled_gaps` -> the page''s script), because a hand-built row is the harness supplying the call list it is auditing. THE BOUNDARY IS A TYPE, NOT A DECLARATION: a RENDER is digits inside a STRING whose precision somebody chose, and sets the epsilon; a CARRIER is the figure as a NUMBER in a hand-off, whose serialised digits are the double''s and nobody''s choice, so it can never set one and must be walked THROUGH. No field declares which -- a declaration is the hand-typed keyset this module has been escaped by nine times. ATTRIBUTION IS BY PROVENANCE: a site in a figure''s own renderer, or on the door it was handed to as a carrier, is a render OF it; a match inside another figure''s renderer is CROSS-ATTRIBUTED and fails closed until the register resolves it as `reader_renders` (move the epsilon) or `value_collisions` (a different quantity, with the reason). Per-dimension vacuity now runs over the UNION of both sweeps, because the surfaces are complementary. The note-verbatim seam the renderer stage rests on -- Hour #18 verified it once by hand -- is now asserted every run. R15: seven mutations each firing a NAMED finding, plus one proving the carrier boundary load-bearing -- the carrier read as TEXT (the 18dp site returns, epsilon 5e-19, fourteen orders below the shipped one) and `fmtGap` moved to 6dp in a mutated copy of the page. R12: no published number moved -- the door''s 3dp is COARSER than the declared 4dp, so every epsilon is unchanged. STILL L2: nineteen Hours, nineteen defects; Hour #4''s two-consecutive-clean-Hours criterion is still not approached.'
- 'TWENTIETH HOUR (2026-08-12, worker tick, H27 2->3 HARDEN draw), on the instrument Hour #19 built, one level up: THE SWEEP''S POPULATION WAS EVERY STRING THE SCORER BUILDS, AND ONLY ONE DIMENSION''S EVER REACHES A READER. `measure_component_render_sites` walked `for owner in sorted(res)` -- every `note` and string component of all five GapResults -- and called them published strings on the strength of Hour #15''s finding that consumers read `components` and never the prose. That finding is about the ONE result which BECOMES the ledger entry: `measure_and_write` writes `to_ledger_entry(result["detection"])`, the HEADLINE''s components and no others, and the companion four ride in as renderer STRINGS inside the note. So the sweep''s sites were a SUPERSET of the reader''s, and "the epsilon is half a step of the FINEST render" was being fed strings nobody is handed. THE CONSEQUENCE, AND IT IS A THOUSANDFOLD: Hour #17 moved `ageing` 3dp -> 6dp (epsilon 5e-4 -> 5e-7) onto `ageing.ordinal_direction_caveat`, which `_ageing_direction_note` really does render at `.6f` -- into a component of the AGEING result, which nothing publishes. MEASURED ON THE LIVE FILE the Proof door reads, `docs/observability/coupled_gap_ledger.json`: 19 published component keys, every one of them detection''s; this figure rendered ONCE, at 3dp (`ageing displacement 0.887`); every 6dp-or-finer literal in the whole entry accounted for as one of three `remittance_attribution` measures or the `measured_at` timestamp, and `balanced_bucket_displacement` -- the ageing CARRIER -- not among them. The 6dp reader does not exist and never did. THE SECOND FIGURE, SAME SHAPE: `belief_population_mix`''s only declared coverage was `belief_population_mix.note`, also unpublished; where it actually meets a reader is the composer''s OWN inline `{...gap:.4f}`, which no sweep could see. Same precision, so no epsilon moved -- but the per-dimension vacuity guard Hour #19 built for exactly "this figure has never met an artefact" was passing it on a string nobody is handed. WHY NO WALK HAD SEEN IT: the composer is a METHOD, so every sweep stopped at this process''s edge and RE-WROTE the ledger itself from `result["detection"]` -- meaning the note Hour #19 carried to the door, and asserted verbatim every run, was the SCORER''s, not the one a reader is handed. A real seam, asserted about the wrong string. WHAT LANDED (atom D36). (1) `published_books` drives the SHIPPED composer -- `LivePaymentTriad.measure_and_write` -- on two books, substituting the BOOK and nothing else; both sweeps'' population is now the entry it wrote, walked RECURSIVELY and path-qualified with no length floor, because `remittance_attribution` nests reader text two levels down. (2) The register corrected FROM the measurement, not the other way: ageing 6 -> 3 with `also_rendered_at` and the caveat site dropped, and all five figures declared where they are in fact rendered (`note` at 3/4/4/4/2dp). (3) A SITE THE OLD WALK COULD NOT SEE: detection reaches the door at 4dp as well as `fmtGap`''s 3dp, because the door prints the composed note and `format_detection_summary` renders it at 4dp inside it -- invisible while the walk carried a note that did not contain that renderer''s output. (4) THE RENDERER -> NOTE SEAM ASSERTED EVERY RUN: a `renderer:` site is a reader site ONLY because the composer concatenates that exact string, and nothing checked it; a composer that reformatted, re-rounded or dropped a companion render would have left every site reading unchanged. (5) `note_verbatim` was comparing the RAW note against the door''s ESCAPED HTML, so it passed or failed on whether the first 60 characters happened to contain a `<`, `>` or `&`: the scorer''s note does not, the composed note does (`W2_11 payment TRUTH -> W4_4 seam`), and the seam read BROKEN the instant the walk carried the real artefact. It now inverts the door''s own escaping rather than growing a second escaper to drift from it. (6) THE GUARD IN THE OTHER DIRECTION, which is what let this stand three Hours: both checks only ever asked whether some site is FINER than the declaration. Neither asked whether the declaration is finer than EVERY site, so an epsilon moved onto a string nobody publishes passed both in silence. It now fires on the union of both sweeps with the factor named. R15, twelve mutations each firing a NAMED finding: the Hour-#17 register against the corrected population; a declared site the sweep cannot find; a book whose SCORING renders the figure at 6dp and whose published ENTRY does not (the defect itself, reproduced); the discrimination rule proven to REJECT a constant and ACCEPT the same site once the literal tracks the figure; a single book (RAISES); an inert sweep (RAISES); a carrier quantised coarser than its render; the composer no longer carrying a renderer''s string; the door no longer printing the note verbatim; an unreachable door; the carrier read as TEXT (18dp returns); and Hour #17''s shipped state, which now names itself "1000x too fine" and does NOT fire on the corrected register. R12: NO published number and no published string moved -- the live entry carries no `Ndp` claim anywhere, and the only verdict the ageing epsilon feeds, `carrier_is_the_gap`, was True at 5e-7 and is True at 5e-4. Hour #17 read that margin as sitting "within a hair of its own epsilon"; it is three orders INSIDE the step this figure''s reader is given, and the thinness was a property of the wrong epsilon rather than of the figure. R11: the door is still rendered by executing the page''s own inline JavaScript on the real payload. tests/tools/test_couple_w2_11_d5.py: 433 passed. STILL L2: twenty Hours, twenty defects; Hour #4''s two-consecutive-clean-Hours criterion is still not approached. TWO LEADS MINTED, NOT TAKEN. (1) D37_the_door_gate_decides_provenance_by_value -- `has_door_carrier` admits a figure to the door surface only where its carrier EQUALS the panel row''s value -- a value test doing provenance work, the shape Hour #19 named -- and it now excludes four figures from a surface that demonstrably renders them, since the door prints the whole composed note; they pass only because the `note` site carries the same precision, which is coverage by coincidence one level down. (2) D38_the_doors_numeric_render_is_a_surface_neither_sweep_can_express -- the door renders every NUMERIC component of that entry at 4dp (`fmtComponent`/`flattenNumbers`, integer counts included), a render surface neither sweep can express: the component sweep searches only strings the entry carries, and the door html is searched for `detection` alone.'
map_notes:
  harden_note: 'HARDEN PASS RAN 2026-08-08 (commit 72ecfff7d); recorded here 2026-08-08 because the pass fixed code and tests but left the map cell silent -- the work was invisible to the map, and a silent cell is why the self-refill kept re-drawing this atom for a level move it cannot make. Delivered, both mutation-proven: (1) the DD-channel LEAK WITNESS was VACUOUS -- `n_flagged_non_dd_failures == 0` passes identically when the channel observes nothing at all as when it observes cleanly, so a vacuity guard now carries it (test_leak_witness_is_vacuous_without_its_channel_guard pins the defect the guard closes); (2) three silent `.get()` JOIN DROPS had no witness -- `value_date`/`invoice_ref`/`reference` key drift would have pushed the measured gap toward the no-skill baseline with nothing firing, so n_unjoined_dd_failures / n_unjoined_collection_misses / n_ageing_refs_matched are now asserted against a deliberate key drift. 24/24 green. NEW FINDING from the pass, reported not tuned (R12): the headline DETECTION gap is INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL -- `flagged_set` is a UNION, `n_flagged_via_dd_channel_only == 0` across seeds 7/11/23, so killing the DD channel outright leaves the published number bit-identical. Structurally reasonable (a rail failure means the cash did not arrive, which reconciliation also sees) but it means set-membership detection is blind to the only thing that channel buys: EARLIER detection. That test is labelled CHARACTERIZATION deliberately -- it pins a measured limit, not a contract, and is expected to fire if the channel ever starts contributing.'
  level_hold_note: 'HELD AT L2, NOT PROMOTED TO L3 (2026-08-08 tick, self-refill drew this 2->3 and the honest answer is no). L3 means Expert Hour says ''this is real''. Two of this scorer''s THREE published dimensions cannot carry that claim today: the AGEING dimension publishes background.gap_metric.misapplication_gap, which the D6 DISCOVER proved is a metric-shape defect and NOT EVIDENCE (a company finding 100% of real arrears at a 1.5% false-positive rate scores 1.50; holding company behaviour literally fixed and moving only prevalence swings the score 3.00->0.15) -- D6 closed that at the CLASS by stamping the caveat at source, but a disclaimed figure is a disclaimed figure, and D7_ageing_gap_metric_reshape is the atom that gives the dimension a shape that can be believed; and the DETECTION headline is single-channel-determined per harden_note above. depends_on D7 added so this is MECHANISED rather than exhorted -- the draw can no longer offer this atom a 2->3 it cannot honestly take, which is the churn that produced this tick. Reversal is one line: drop the depends_on when D7 lands. NOT a wall, and NOT a reason to tune the ageing number (R12). == HALF RELEASED 2026-08-08: D7 LANDED (L2), so reason (a) is GONE -- the ageing dimension now publishes three prevalence-invariant measures and is citeable. Reason (b) is untouched and is the whole of the remaining hold, so depends_on is RE-POINTED at D10_detection_headline_is_single_channel rather than dropped: leaving it aimed at a satisfied D7 would be a block naming a dead mechanism (a measured failure class here), and dropping it outright would hand the draw back the same 2->3 it still cannot honestly take. When D10 lands, re-read this note before promoting -- it should then be a genuine 2->3. == RE-READ AND RELEASED 2026-08-09: D10 LANDED (L2), so reason (b) is GONE and depends_on is DROPPED rather than re-pointed a second time -- there is no third reason to aim it at, and a block naming a satisfied atom is the dead-mechanism class this note already fell into once. WHAT THAT DOES AND DOES NOT MEAN: the 2->3 is now DRAWABLE and nothing procedural stands in front of it, but it is NOT taken here. L3 is the claim that this harness measures what it says it measures, and the same tick that released the hold also proved a sentence published on every surface this instrument feeds was WRONG (the detection residual is misallocation, not never-observed -- see D10 build_note). A promoter must run the Expert-Hour pass on the CORRECTED instrument, not on the reputation of the old one. Reversal is one line: the depends_on can be re-added. == EXPERT HOUR RAN 2026-08-09 (worker tick) AND THE ANSWER IS STILL NO -- HELD AT L2, and this time the reason is NEW, not inherited. The prior note released the procedural block (D7 and D10 both landed) and said a promoter must run the Hour on the CORRECTED instrument rather than the reputation of the old one. It ran. It found two limits in the DETECTION headline itself, both MEASURED this tick, neither previously named: (1) THE HEADLINE IS AN as_of ARTEFACT. `truth_set` is `result == ''failed''` -- a settled fact that does not move with the clock -- while `flagged_set` is a belief held AT `as_of`. Holding the company AND the world literally fixed (same records, same consumer, nothing re-simulated) and moving only the date the scorer asks on walks the published figure 0.0725 -> 0.1232, +70% over 60 days, seed 7. The companion detection_latency dimension was built on an EVER-KNEW population for exactly this reason and is invariant under the same sweep -- so the fix was applied to the neighbour and the headline was left behind. (2) THE HEADLINE COUNTS ONE ERROR DIRECTION. `detection_gap` is pure recall (1 - |S&D|/|S|), so `flagged_set` enters only through the intersection and enlarging it can never hurt: a company that flagged EVERY invoice scores a perfect 0.0. Its published baseline names only the opposite degenerate (''flag nobody -> 1''), which reads as though 0 were earned. Measured on this population: 44-51% of everything the company flags is an invoice that truly SUCCEEDED (seed 7: 101 false flags, 0.0951 over the truly-current population) -- and that is the SAME 101/1062 D7''s `overstated_arrears_rate` already reports on the ageing dimension. The error direction was visible one dimension over and invisible here. L3 means ''no major flaws''; a headline that moves 70% when only the clock moves, and that cannot distinguish a precise company from an indiscriminate one, is two. WHAT THIS TICK DELIVERED INSTEAD OF THE PROMOTION (HARDEN work, R12: the detection gap is byte-identical at 0.09547325102880659 before and after -- nothing was tuned): the caveat is stamped AT SOURCE in `background.gap_metric.detection_gap` (the D6 precedent), so it lands on all THREE coupled triads that call it, not just this one; `n_false_flags`/`false_flag_rate` now ride beside the score on their own denominator (None, never 0, when the universe is unknown -- a 0 there would be the strongest possible claim handed out for free); both limits print with the headline at the CLI and in the LIVE ledger note the Proof door reads; and the ARTEFACT CLASS is closed per R10 by `DIMENSION_AS_OF_CONTRACT` + `test_every_dimension_declares_its_as_of_contract_and_the_declaration_is_measured`, which sweeps as_of for real and holds every dimension to ''truth invariant => gap invariant''. It is deliberately DIFFERENTIAL (ageing is exempt because an invoice really does age -- a blanket rule would false-positive there and teach everyone to skip the gate) and R15-proven by mutating the SOURCE twice: flipping detection''s declared invariance fires it with the real drift, and stripping the fix-atom name from its exemption fires the named-debt assertion. Also closed: `measure_and_write` -- the path that actually PUBLISHES to coupled_gap_ledger.json -- had NO test in this repo, so every word of its note was unexercised; it now renders under test. depends_on is re-pointed at D11_detection_gap_is_recall_only, which is the whole of the remaining hold. Reversal is one line: drop it when D11 lands. NOT a wall, and NOT a reason to tune the detection number (R12). == RELEASED 2026-08-09 (worker tick): D11 LANDED at L2, so the whole of the remaining hold is discharged and depends_on is DROPPED rather than re-pointed a third time -- there is no fourth reason to aim it at, and a block naming a satisfied atom is the dead-mechanism class this note has already fallen into twice. THE 2->3 IS NOW DRAWABLE AND IT IS NOT TAKEN HERE, for the same reason the 2026-08-09 release did not take it: the instrument changed again, and more than it did last time. The detection headline is a DIFFERENT MEASURE from the one every prior Expert Hour looked at -- a balanced error over an ever-flagged population, with a false-flag denominator that excludes legitimately-flagged late payers -- and the number it publishes went 0.0725 -> 0.0134 on seed 7 for reasons that are all reshape and no company change. An Hour run on the OLD instrument''s reputation would be exactly what the previous release warned against, so whoever takes this to L3 runs it on the CORRECTED instrument and should start at D11''s own registered open question: `missed_failure_rate` is structurally 0.0000 on every population this repo scores, so the headline is currently half a measurement, and whether that is acceptable at L3 is a judgement call this build declined to make on the promoter''s behalf. Reversal is one line: the depends_on can be re-added. == EXPERT HOUR RAN AGAIN 2026-08-09 (worker tick) ON THE CORRECTED INSTRUMENT, AS THE PREVIOUS RELEASE DEMANDED, AND THE ANSWER IS STILL NO -- HELD AT L2 on a NEW reason. It did start where D11''s registered open question said to (missed_failure_rate structurally 0.0000, so the balanced error is currently half a measurement), and that question is real but is NOT what holds this atom: it is a property of a world where reconciliation catches every failure at due+grace, honestly declared, and D11 already proved the direction CAN fire by mutation. What holds the atom is what the Hour found next, MEASURED case by case at seeds 7/11/23 and across two grace windows: THIS INSTRUMENT PUBLISHES ONE NAMED QUANTITY AS TWO DIFFERENT NUMBERS. ''The wrongful-dunning exposure'' is printed twice in a single output block -- detection''s false_flag_rate 0.0269 (21 of 782) and ageing''s overstated_arrears_rate 0.0951 (101 of 1062), 3.5x apart, sharing SEVEN cases -- and `background/gap_metric.py` asserted in prose that they were ''literally the same numerator''. They are not. The two denominators stand in an EXACT containment (1062 == 782 + 280) because D11 established that an invoice paid past its grace date really WAS unpaid past grace, so flagging it was CORRECT, and applied that exclusion to the DETECTION dimension only: 94 of ageing''s 101 false ageings land in the 280-case excluded band, i.e. 93% of one dimension''s published wrongful-dunning exposure is made of cases the sibling dimension of the same instrument holds the company was RIGHT about. The belief sides differ too (detection EVER-FLAGGED, 439; ageing the as_of snapshot, 229). L3 is the claim that this harness measures what it says it measures; an instrument that says one thing twice and means two different things does not carry that claim, and a director or Proof-door reader taking either figure as ''what wrongful dunning costs this company'' is misled by whichever one they read. NOTE ON PROVENANCE (R9, inferred not observed): the identity claim was recorded against the PRE-D11 instrument and D11''s own reshape moved one side of it in the same change without updating the sentence -- whether it held exactly before D11 has not been re-measured here. WHAT THIS TICK DELIVERED INSTEAD OF THE PROMOTION (HARDEN, R12: no published number moved -- the detection balanced error is 0.0134 and the ageing measures are unchanged): (1) the false identity claim is CORRECTED AT SOURCE with the case-level decomposition, not reworded; (2) the CLI `--write-ledger` path was still overwriting the measured note with the REFUTED ''fraction of true payment failures the company never observes -- the no-remittance blind spot'' sentence, into the SAME bare ledger key the live path writes correctly, so whichever ran last decided what the Proof door showed -- the live sibling was fixed on 2026-08-09 and this one was left behind (the sibling-half class again). It now APPENDS to the measured note instead of clobbering it, and has the test it never had; (3) the CLASS is closed per R10 by `SHARED_QUANTITY_CONTRACT` + its control, which derives both sides from the two SCORERS'' own components (no recomputation -- R15 independence), measures the declared containment across seeds AND grace windows, requires an undeclared divergence to name an owning atom, and sweeps the RENDERED summaries so a third dimension printing the phrase unregistered FAILS. R15 both ways: the register is proven falsifiable on two lies (declaring the populations coincident; declaring equal denominators), the phrase sweep is proven to fire on a de-registered real emitter, and a missing dimension RAISES rather than comparing what is left. The containment is declared EXACT deliberately so that D16 landing BREAKS the declaration and forces a rewrite rather than slipping past a loosely-phrased control. depends_on is re-pointed at D16_ageing_negative_population_is_unexcluded, which is the whole of the remaining hold. Reversal is one line: drop it when D16 lands. NOT a wall, and NOT a reason to tune either number (R12). == RELEASED 2026-08-09 (worker tick): D16 LANDED at L2 and depends_on is DROPPED and NOT RE-POINTED -- the note above has already fallen into the dead-mechanism class twice by aiming a satisfied block at the next thing, and there is no fourth reason to aim it at. THE 2->3 IS DRAWABLE, UNBLOCKED, AND NOT TAKEN HERE, for the reason every prior release gave and this tick has the least right of all to ignore: THIS tick is the one that changed the instrument. D16 renamed a published quantity (the ageing dimension no longer publishes ''the wrongful-dunning exposure'' -- that name now has exactly one owner) and moved the number under it 0.0951 -> 0.0090 on seed 7, all reshape and no company change. An Expert Hour run by the tick that built the change is the reputation-of-the-old-instrument problem in its purest form. The next promoter runs the Hour fresh, and should start where this build declined to go: D17_d8_counterfactual_has_no_unattributed_residual, minted this tick, is a limit in a measure that rides in THIS atom''s own ledger note -- the D8 remittance counterfactual now attributes 100% of every measure it publishes, because the residual its anti-rubber-stamp guard rested on was made of the very cases D16 excluded. That guard currently guards nothing. == D17 LANDED 2026-08-09 (worker tick, L0->L2) AND THE POINTER THIS NOTE HANDED THE NEXT PROMOTER IS DISCHARGED: the anti-rubber-stamp control no longer rests on a residual the world happened to supply -- it rests on an INJECTED belief error no invoice reference can cure (a credit the bank feed never DELIVERS to either book), which leaves the ageing overstatement 0.4444 attributed and the false-flag rate 0.7059 rather than 1.0, and is R15-proven both ways against a shadow company clean BY CONSTRUCTION. The 100%-attribution reading is published AT SOURCE as a property of the observation channel, never a pass mark. THAT DOES NOT PROMOTE THIS ATOM: the Hour is still un-run on the corrected instrument, and D17 changed what this atom''s own ledger note says, so the reputation-of-the-old-instrument warning above applies to it too. NOT a wall, and NOT a reason to tune either number (R12). == D19 LANDED 2026-08-10 (worker tick, L0->L2) AND THE BELIEF HEADLINE IS A DIFFERENT MEASURE FROM THE ONE EVERY PRIOR EXPERT HOUR LOOKED AT. Hour #3 (2026-08-10, commit 0470e50f9) held this atom at L2 on a m