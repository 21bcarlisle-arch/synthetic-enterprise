atom_id: H27_payment_belief_gap
simplifications:
- "THIRTY-SECOND HOUR (2026-08-15 UTC, worker tick, LANE 1 BUILD draw on this atom).\nTHE LEVEL DOES NOT MOVE. `level_current` stays 2. The Hour ran, it was the Hour\nthis atom's own record specified, and it ends with three BLOCKING findings, so\nthe promotion condition #31 wrote down is not met.\n\nWHY THIS HOUR EXISTED, AND WHY ITS ANSWER COUNTS. Hour #31 corrected a false\nCLAIM shipping on every surface the detection figure feeds, then refused its own\n2->3 on the reasoning that \"an Hour cannot be its own confirmation\", and wrote\nthe honest promotion condition BEFORE the next Hour ran: \"an Hour that ends with\nno BLOCKING finding against the corrected instrument\". That ordering is what\nmakes this outcome a measurement rather than a negotiation -- the bar could not\nbe moved after the result was known. It is also the reason this record does not\nargue the findings down: #31 pre-committed, and #32 is bound by it.\n\nRun as a FRESH read-only instance with no memory of the build (`Write`/`Edit`\nabsent, not merely unused), which is what a cold-eyes pass on one's own lane\nrequires. Measured at HEAD f4144b4f0.\n\nWHAT THE HOUR CONFIRMED, so a later Hour need not re-buy it. The instrument's\nNUMBERS are sound. Every headline #31 asserted was re-derived INDEPENDENTLY --\nswept from `build_scenario` / `dense_drift_grid` / `score_triad` without calling\nthe measurement under test -- and reproduces exactly: interior pairs 86/86/86;\ncounted change points 38/34/32; excluded 62/63/61; silent-set moves 34/40/37;\nthe move-iff-it-touches-`S u N` predicate 258/258 with zero disagreements;\nexcluded band 212/209/213 of 900. The correction is in HEAD (2a9ea1c76, gate\nreceipt rc 0), the suite is 471 green, the caveat's numbers really are\ninterpolated (forcing the register to (5,5) moves the rendered sentence), R12\nholds (no scorer arithmetic touched), and the R13 premise holds (truth-side sets\ninvariant across the drift on all three seeds). The two D28 residuals #31 ruled\nnon-blocking are NOT among the findings below; every one of them is something\nelse.\n\nTHE THREE BLOCKING FINDINGS, filed as\n`docs/staging/WORKER_FINDING_THE_CORRECTED_SENTENCE_NEVER_REACHED_THE_READER_AND_ITS_CONTROL_HAS_NO_CALLER_2026-08-15.md`\n(severity BLOCKING, lane H_harness, class `no_caller_and_never_runs` -- whose\nclass lane is H_harness too, so it consolidates as a MEMBER rather than being\nrefused out of lane).\n\n1. THE CORRECTED SENTENCE IS ON NO PUBLISHED SURFACE. Live fetch of\n   `https://poesys.net/data/proof.json` (HTTP 200, 747,008 bytes, generated_at\n   2026-08-14T06:04:08Z) serves the UNCORRECTED clause verbatim at\n   `coupled_gaps.pairs[5].components.drift_resolution_caveat`; the corrected\n   phrases score zero on the live payload. The corrected string exists only in\n   the git INDEX and working tree -- `git show :site/data/proof.json` finds it,\n   `git show HEAD:site/data/proof.json` does not. Staged, uncommitted,\n   unpublished: the consumer landed and the supplier did not, one day after this\n   atom's own record logged that exact shape as a defect. The test cited as\n   \"R11's shape on a sentence\" asserts against an in-process object, which is\n   why it could not catch this -- R11 wants the fetched surface.\n\n2. R15 FAIL-OPEN, and the control's own error message names the move it cannot\n   see. `tools/couple_w2_11_d5.py:8777` compares by CONTAINMENT\n   (`declared[0] <= got[0] and got[1] <= declared[1]`) while its docstring says\n   it \"requires that the DECLARATION match the BOOK\". Declaring all three bands\n   (0, 86) returns no violation, and the caveat then publishes the widened band\n   as its own cause -- \"steps at 0-86 ... and at only 0-86\" -- destroying the\n   entire contrast the sentence exists to draw. The string it cannot emit ends\n   \"never widen the band to fit\". All four band mutation cases narrow or shift;\n   NONE widens, so \"R15 both ways\" was proven only in the direction that cannot\n   hide a defect. Second fail-open on the same loop: `if declared is None:\n   continue` -- an omitted band is not a violation.\n\n3. NO CALLER ON ANY RUN THAT PUBLISHES THE SENTENCE, and R10 makes it a class\n   fix. Repo-wide, outside `tests/`, `check_detection_interior_change_points`\n   has TWO mentions and both are comments. AST census: 15 `check_*` defined, 10\n   called in `main()`, this one among the 5 that are not -- while its three\n   resolution siblings are all called, and print their verdicts BEFORE the\n   `if args.write_ledger:` branch that publishes the caveat. Two shipped\n   comments (:4120, :8864) assert it is \"re-derived every run\" / \"on trial every\n   run\"; both are false as shipped. The decay path is concrete: the pre-commit\n   gate selects by NAME STEM, so these tests run only when this module changes,\n   yet the bands are properties of a book built from\n   `simulation/payment_behaviour_source.py` and\n   `company/billing/payment_observation_consumer.py`.\n\nTHE R10 POINT, stated plainly because it is the reason this is not just wiring.\nHour #30's note in this very record calls a no-caller control on this instrument\n\"the SECOND ... a rate, not an incident\", and records the class CLOSED because\n\"the grader has a caller on every publish\". This is the THIRD, shipped one Hour\nafter that closure. R10 forbids closing an absurdity-class defect with an\ninstance fix, and the receipt for why is now on disk. The discharge is therefore\ntwo-part: wire the call AND add the automated census that every `check_*` in this\nmodule is reachable from `main()`. The 5-of-15 gap measured here is that\ncensus's first population, and the other four uncalled checks\n(`check_door_row_surfaces`, `check_published_figure_caveat_coverage`,\n`check_published_resolution_floor`, `check_scenario_constant_census`) must be\ndispositioned by it rather than left unnamed.\n\nALSO FOUND, not blocking. LATENT: `DIMENSION_DRIFT_RESOLUTION[\"detection\"][\"why\"]`\nstill hard-types \"61-63\"/\"86\"/\"32-38\"/\"34-40\" as literal prose beside the band\nfields it could interpolate from -- so of the \"two sentences now interpolated\nrather than typed\", only one is; LATENT rather than BLOCKING because `why`\nreaches no reader (zero hits in the live payload and under `docs/observability/`\nand `site/data/`). LATENT: half of \"258/258\" is arithmetic rather than evidence\n(a step wholly inside the excluded band cannot move either rate by\nconstruction) -- no action, the docstring already says so, recorded only so a\nlater Hour does not read it as stronger than it is. RECORDED: \"63 distinct\ndistances\" does not reproduce -- 212 past grace confirmed, but the distinct\ncount is 73 (70-73 under every reasonable restriction); 63 is the seed-11\nEXCLUDED CHANGE-POINT count, so the prose conflates two quantities. Narrative\nonly, nothing published moves.\n\nONE DISCLOSURE ABOUT THE HOUR'S OWN FOOTPRINT. A bare\n`pytest tests/tools/test_couple_w2_11_d5.py` rewrites\n`docs/observability/coupled_gap_ledger.json` -- a test run silently\nre-publishing into the supplier of a public door, a lead Hour #30 left open and\nwhich lives in this atom's own file_scope. The Hour's run did that. It was NOT\nrestored, deliberately: by the time the Hour reported, a concurrent lane had\nrewritten the file again (md5 ac003306d, matching neither the pre-run snapshot\ne50a5bf26, nor the post-run 10405d458, nor HEAD 29195a5e0), so restoring the\nsnapshot would have clobbered another lane's live write on the shared tree --\nthe worse defect. Snapshot preserved at `/tmp/ledger_before_expert_hour.json`\nfor whoever takes the isolation fix; the file should not be swept into a commit\nas-is.\n\nWHAT WOULD MAKE IT AN HONEST 3, unchanged from what #31 wrote and now with three\nnamed obstacles instead of none: an Hour that ends with no BLOCKING finding\nagainst the corrected instrument. Take finding 1 first and alone -- it is a\nregenerate-commit-publish-refetch with no design in it, it is the only one a\nreader is currently harmed by, and it discharges against a live fetch rather\nthan a test.\n"
map_notes:
  harden_note: 'HARDEN PASS RAN 2026-08-08 (commit 72ecfff7d); recorded here 2026-08-08 because the pass fixed code and tests but left the map cell silent -- the work was invisible to the map, and a silent cell is why the self-refill kept re-drawing this atom for a level move it cannot make. Delivered, both mutation-proven: (1) the DD-channel LEAK WITNESS was VACUOUS -- `n_flagged_non_dd_failures == 0` passes identically when the channel observes nothing at all as when it observes cleanly, so a vacuity guard now carries it (test_leak_witness_is_vacuous_without_its_channel_guard pins the defect the guard closes); (2) three silent `.get()` JOIN DROPS had no witness -- `value_date`/`invoice_ref`/`reference` key drift would have pushed the measured gap toward the no-skill baseline with nothing firing, so n_unjoined_dd_failures / n_unjoined_collection_misses / n_ageing_refs_matched are now asserted against a deliberate key drift. 24/24 green. NEW FINDING from the pass, reported not tuned (R12): the headline DETECTION gap is INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL -- `flagged_set` is a UNION, `n_flagged_via_dd_channel_only == 0` across seeds 7/11/23, so killing the DD channel outright leaves the published number bit-identical. Structurally reasonable (a rail failure means the cash did not arrive, which reconciliation also sees) but it means set-membership detection is blind to the only thing that channel buys: EARLIER detection. That test is labelled CHARACTERIZATION deliberately -- it pins a measured limit, not a contract, and is expected to fire if the channel ever starts contributing.'
  level_hold_note: 'HELD AT L2 (level_current 2, level_target 3). THIS NOTE WAS COMPACTED ON 2026-08-17 BY EXPERT HOUR #33 AND THAT COMPACTION IS ITSELF A FINDING. It had reached 54,930 chars -- 81% of this atom''s store file, which the append pushed to 67,812 B against the 65,536 B ROLL_WATERMARK, and `roll_for_atom` returned 0 because the roll chunks LIST entries and this is one string field the roll cannot split. The record of the atom had become unwritable: the wedge `test_the_live_store_has_roll_headroom` exists to catch, caught. Thirty-three Hours appending to one field is the cause; Hour #33 only tipped it. The store''s own contract is the authority for the fix (`set_note_for_atom`: a note is a CURRENT statement, revision is the correct semantics, and the durable history of what changed lives in git) -- so the full 54,930-char note is in this file''s git history and in the commit that landed Hour #33, nothing is deleted, and what follows is what is CURRENTLY TRUE. Hours #3-#32''s individual narratives are there, not here.


    WHY THE LEVEL IS HELD, which is EVIDENCE and not caution. L3 means ''Expert Hour says this is real''. Hour #31 pre-committed the promotion condition BEFORE #32 ran, so the bar could not be moved once results were known: ONE Hour against the corrected instrument that ends with NO BLOCKING finding takes the 2->3. Since then the per-Hour defect rate on this instrument has been 1.0 -- #28 (a mechanism asserted into this very note while HEAD carried none of it), #29 (the citation control, repo-wide refusal on its default path and no test), #30 (a grader with ten importers, all its own tests, that had never graded the live ledger), #31 (a published claim in `components["drift_resolution_caveat"]` that was measurably false), #32 (three BLOCKING: the corrected sentence on no published surface, an R15 fail-open comparing bands by CONTAINMENT, and a third no-caller control), #33 (below). Five... now six consecutive Hours each finding a real flaw is the strongest available evidence that the next one will too. An Hour cannot be its own confirmation: the Hour that corrects the instrument is not the Hour that clears it.


    EXPERT HOUR #33 (2026-08-17, worker tick, self-refill 2->3 HARDEN draw). THE DEFECT: `site/data/proof.json` was regenerated in the working tree at 15:54:44Z and EXACTLY ONE of its fourteen `coupled_gaps` pairs moved -- this atom''s own, 0.0833907649896623 -> 0.0311284046692607, with the whole book under it (caught 31->4, flagged_size 391->35, n_negatives 1451->257, n_excluded 118->15, n_false_flags 242->16, universe_size 1600->276, false_flag_rate 0.166782->0.062257): a 2.68x understatement of the company''s own payment belief-vs-truth gap. WHY THIS PAIR AND NO OTHER -- a mechanism, not an incident: this pair''s ledger entry is the only one of the fourteen written as a SIDE EFFECT of running the simulation (`simulation/run_phase2b.py:2448` -> `LivePaymentTriad.measure_and_write`, `ledger_path` defaulted to the real file), while every other pair is written by its own `tools/couple_*.py --write-ledger` invocation that no test runs -- and ten-plus test modules invoke run_phase2b. Observed twice in this tick rather than inferred: `pytest tests/tools/test_couple_w2_11_d5.py` moved the live ledger''s measured_at 16:34:19 -> 16:42:56 mid-run (md5 825330de9 -> e56aa515c), harmless to the figures because this module measures the full 1600-invoice book, but the same write path from a test process into the supplier of a public door. IT WAS INVISIBLE BECAUSE THE DEFECT IS ONLY IN THE RELATION: the door agrees with itself, the ledger agrees with itself, the generator did what it was asked, and the scorer is not involved at all -- every control here reads ONE side, including the SITE-lane control #32 built, which excludes the ledger as a subject on purpose. BUILT (this atom''s own file_scope): `measure_published_door_against_the_ledger` + `check_published_door_reproduces_the_ledger`, wired into `main()` on the default path with its verdict rendered, and 11 tests. The check-call census now reads 17 defined / 15 default-path / 2 declared-flag / 0 unreachable. R15 BOTH WAYS AGAINST REAL HISTORY, not a fixture: RED on the poisoned door as found (9 violations, the headline and 8 components), GREEN once restored, and four source mutations proven to fire -- unreadable-file-caught-into-{} (fail-silent), headline-only comparison (wrong subject), no vacuity guard (tautology), absent-door-pair-as-skip (fail-open). 500 passed (was 489). R12: nothing this instrument computes moved; the only figure that moved is the door''s and it moved BACK (`git checkout HEAD -- site/data/proof.json`, restoring the value the deployed site and the current ledger both carry; corrupted payload preserved at /tmp/h33_proof_poisoned.json). AND THE NEW CONTROL''S FIRST INDEPENDENT MEASUREMENT ANSWERED RECORDED 7, which had only ever been narrative: run against `git show HEAD:` on both files, THE COMMITTED PAIR HAS NEVER AGREED EITHER -- door 0.0833907649896623 vs ledger 0.0859375, n_negatives 1451 vs 1408, universe_size 1600 vs 1557, false_flag_rate 0.166782 vs 0.171875. The file the public door nominally derives from is not the file it was generated from, and has not been for five days. Filed: docs/staging/WORKER_FINDING_THE_ONLY_DOOR_PAIR_A_TEST_RUN_CAN_REPUBLISH_IS_THE_ONE_NOTHING_COMPARED_TO_ITS_LEDGER_2026-08-17.md.


    THE OWED WORK, ranked, so the next promoter does not re-derive it. (1) STOP THE WRITE at `run_phase2b.py:2448` (default `ledger_path` -> redirect or refuse under a test process). Outside this atom''s file_scope AND that file carried another lane''s uncommitted hunks at :160/:834 on 2026-08-17 -- the two-lanes-one-file shape. (2) THE SITE-LANE GATING TRIPWIRE for the door-vs-ledger relation, natural home `site/proof/` (that gate fires on a `site/data` change, exactly when a substitution lands). NOT shipped by #33 because it would be BORN RED on the HEAD divergence above -- landing it wedges the publish gate on a condition this atom cannot fix, and the repair moves published figures inside the publish lane''s live work. A control that must wedge a shared gate to be honest is a sequencing problem, not a reason to weaken the control. (3) THE NOTE-FIELD ROLL: this field will wedge again. The roll cannot chunk a string, so either notes get a size bound with an archive path of their own, or every Hour compacts as it writes. #33 chose the second because the first is a store change outside this atom. (4) #28''s surviving leads: the 14 undeclared live entries nothing re-measures on a schedule; #27''s clamp and six-unwalked-rows; D35''s scoped build; #21''s vacuous-in-isolation sibling control.


    WHAT DOES NOT BLOCK THE PROMOTION, stated so it is not re-litigated: the two open D28 residuals (the `S`-side exit-threshold predictor, unidentified; the reshape, unbuilt). Those are DISCLOSED limits, declared in the register and published in the sentence the reader meets -- an instrument that states its own limits accurately is what L3 epistemic cleanliness asks for, not an instrument with none. NOT a wall, and NOT a reason to tune any number (R12).'
  name: 'Payment belief-vs-truth gap (coupled-triad HARNESS of the D5 decomposition): the harness measures the company''s payment BELIEF (its allocation/ageing/cash-position inference from observed payments, D5) vs the world''s payment TRUTH (the W2_11 generator''s actual behaviour). No world payment-source reaches L3 until this gap is measured against the company''s consumption (COUPLED_TRIAD binding rule).'
map_records:
  evidence:
  - tests/tools/test_map_assertion_provenance.py
  expert_hour_findings:
  - 'EIGHTEENTH HOUR (2026-08-11), on Hour #17''s lead 1 (atom D35, the sweep stops at this process''s edge): THE DOOR''S DEPTH LIMIT SWALLOWED 53 PUBLISHED FIGURES. Lead 1''s precision question is ANSWERED AND NEGATIVE and now pinned -- driving the live payload through the Proof door''s own JavaScript, the detection figure appears in its row at 3dp (`fmtGap`, undeclared) and 4dp (`format_detection_summary`, declared) and nowhere finer, so the one undeclared downstream render is COARSER than declared and no epsilon, band, floor or collapse moves. What the walk found instead is a repair that reintroduced its own defect one level down: `fmtComponent` was built to end this door serving ''[object Object]'' -- ''a figure that cannot be read at all'', its own words -- and its depth limit served 53 of 618 published component numbers as an ellipsis, 43 of them (every `two_level.cells.*` reading on both fabric rows) readable nowhere on their row. It hid because H27''s own six attributed measures are elided too and survive only on an ACCIDENT -- `format_remittance_attribution_summary` repeats them in the note prose, a redundancy nobody designed and no control knew about, absent on the rows where it mattered -- so the D8 attribution reached the public door as hundreds of words of caveat with every number replaced by a dot. The panel''s R11 test asserts each row''s GAP renders; nothing had ever asked whether a published COMPONENT number reaches the reader. CLOSED AT THE CLASS: the depth limit bounds STRUCTURE and no longer NUMBERS (flattened path-qualified past it -- raising it to 3 is the instance fix that returns), the spin guard moved to a node budget because depth never carried it (a two-deep cycle spins inside the limit, proven), and a per-row population control now requires every finite component number to render on its own row, vacuity-guarded both ways. R15 four mutations by name, including the pre-repair page restored and asserted to lose 53 numbers on both named rows. R11 618/618 before-and-after on the live payload. R12 nothing computed moved. Leads handed on: D35''s scoped build (register + sweep must move together or the check reds); the RENDER/CARRIER boundary the epsilon rule has never defined (a JSON hand-off collapses it to 1e-17); and whose Hour the fabric rows'' 43 unreadable figures are, which nobody has asked.'
