  The ignored-file case measured directly: a tracked control de-indexed and .gitignore''d is

  invisible to --others --exclude-standard (0 hits) and this control names it.

  `pytest site/` 776 passed / 8 skipped (775 passed / 1 failed with the control red before

  the repair). R12: no figure this instrument computes was touched.


  LEFT OPEN ON PURPOSE, stated rather than implied. Ten untracked `tests/**/test_*.py` were

  on disk, all stamped 2026-08-17 -- other lanes'' live in-flight work on a shared tree,

  where untracked-at-this-instant is normal and transient. The tests/ publish gate collects

  from the working tree too, so the same fail-open exists there, and a repo-wide version

  would be BORN RED on another lane''s uncommitted work: the exact sequencing problem #33

  recorded and #34 showed had a landable form. The honest tests/ subject is not "untracked

  at this instant" but "untracked AND cited by a committed record as a discharge or as

  covered scope", which is what actually happened and is checkable without racing another

  lane''s editor. That is the next build. Filed:

  docs/staging/done/WORKER_FINDING_THE_SITE_GATE_COUNTS_AN_UNTRACKED_CONTROL_IN_ITS_OWN_GREEN_2026-08-18.md

  (publish_gate_and_wedge instance 32; title CONTESTED with uncommitted_and_orphaned_work,

  both H_harness so it consolidates either way; --check PASS).

  '
- 'RUNG-1c BLOCKING REPAIR (2026-08-18, worker tick, LANE 1 BUILD draw on this atom;

  the blocking finding drew ahead of the general disposition queue under OPS12

  clause 3). THE LEVEL DOES NOT MOVE: `level_current` stays 2. This is a targeted

  repair of a BLOCKING finding raised the same day, not the fresh cold-eyes Hour

  #31''s promotion condition asks for, and an Hour that works from the build''s own

  memory is not the Hour that clears the instrument.


  THE FINDING, discharged:

  `docs/staging/done/WORKER_FINDING_THE_BELIEF_BAND_CENSUS_IS_BLIND_TO_THE_POPULATION_THAT_SETS_THE_EDGE_2026-08-18.md`

  (class `controls_that_cannot_fail`, lane D_billing_metering -- refused

  consolidation out of lane, so it stays its own document and the class doc drops

  it on archive). It is the SIBLING HALF of what D28 repaired on the detection

  register that same morning, one register over, and its three legs were verified

  against the live module before any of this was written rather than taken from

  the document.


  LEG 1 REPRODUCED, not assumed. Swept through the shipped

  `measure_belief_window_resolution` over n_customers {12,24,40,60,120,200,300,

  600,1200} x seeds {7,11,23}: `own_saturates_above` takes SIX distinct values

  (-333,-328,-320,-313,-309,-308) and `own_saturates_below` FIVE

  (-371,-370,-367,-355,-342). The declared pair is the large-n ASYMPTOTE of a

  quantity the DRAW SIZE moves by 20d (above, seed 7) and 29d (below, seed 11).

  Cause, and it is the same sentence as leg 3: both edges are read off OBSERVED

  FAILURES, and a failure has to LAND on the extreme invoice for the span to

  reach it, which is a draw.


  BUILT (1) -- SCOPE AND AXIS, the shape D28 landed next door.

  `own_saturation_scope` (n=300, seeds 7/11/23) and `own_draw_size_axis` now sit

  on BOTH belief entries: the four literals rode every book the scorer was ever

  run over. The scope is per-entry deliberately -- `belief_population_mix` declares

  -309 against `belief`''s -308 and that one-day difference is its own bluntness on

  the n=300 book, so the number and the draw size that produced it are one claim.

  The axis is shared, because both dimensions read the same failure span and it is

  the span, not the dimension, the draw size moves.


  BUILT (2) -- THE AXIS THOSE CONTROLS CANNOT REACH.

  `measure_belief_band_population_axis` + `check_belief_band_population_axis`,

  21 books (7 draw sizes x 3 seeds), wired into `main()` on the DEFAULT path with

  its verdict and its null control rendered. This is leg 2''s answer:

  `measure_dimension_drift_resolution` and `measure_own_drift_resolution` are

  genuine measurements that would genuinely fire at n=300, but both are called

  with a HARD LITERAL 300 at their sole call site in `main()`, whose own

  `--customers` defaults to 4000 -- so the only population the declarations could

  fail on was the one that produced them. Affordable ONLY because it predicts:

  predictor-only, no `score_triad` call, 21 books in ~2s against the ~35 minutes

  the same sweep would cost as a re-scoring. That is why the question had never

  been asked of these two entries.


  BUILT (3) -- THE FAIL-OPEN, closed. `measure_scenario_constant_census` aged

  EVERY record (`ages = sorted((as_of - r.due_date).days for r in records)`) while

  the edges it guards are read off failures only. The invoice side is dense by

  construction -- every account draws every period -- so it hits the constants''

  band [30,92] at every n from 24 up, and `describes_this_book` therefore answered

  True with ZERO census violations on books whose failure-side edge was twenty

  days off the declaration (measured: n=24/40/60/120/300 seed 7, edges

  -328/-313/-309/-309/-309 against a declared -308). R15''s FAIL-OPEN pattern, in

  the control this atom''s own map note cites under "ALREADY LANDED" as the rule

  that stops an edge rotting unnoticed. The census now measures BOTH populations

  and publishes both switches; `_check_census_measured_the_edge_setting_population`

  fails closed on a measurement missing the failure-side keys, and on a book that

  presents invoices and no failure at all.


  AND IT REACHES THE READER, which is the half a register-only repair would have

  missed. `scenario_constant_census_caveat` published the INVOICE span as the

  sentence "Both belief dimensions resolve a company memory error only between Xd

  and Yd" -- false on every book where a failure misses the extreme invoice. It

  now reports the invoice span AS THE INVOICES'', states the belief dimensions'' own

  (failure-side) band beside it, and says out loud when the two differ.


  WHY `describes_this_book` WAS NOT SIMPLY REPOINTED. The constants genuinely do

  place the invoices, so that attribution is sound and must not be made to read

  red by a question it was never about. The dishonest part was a green verdict

  that READ as though it had covered the edge. Hence two switches, both published,

  rather than one switch with a moved subject.


  R15 BOTH WAYS, 15 new test CASES across 9 functions (7 of them the parametrised

  mutation matrix; counted by collection, not by hand -- the note first said 14).

  GREEN on the shipped register; RED on seven named

  mutations -- the shipped defect itself (scope removed, `belief`), the same rule

  reaching the SIBLING entry (the half D28''s repair left behind), a scope naming a

  draw size the axis never visits, each declared edge range narrowed, a literal

  outside every measurement, and the NULL CONTROL falsified. Plus the fail-open

  mutation whose input IS the shipped measurement (strip the failure-side keys ->

  "green about a band it never looked at"), the vacuity case (invoices, no

  failure), and the pinned-population case the finding specified by name: pin the

  sweep to n=(300,) -- exactly what the two resolution controls do -- and every

  seed''s spread collapses to 0 with the defect untouched, which the control now

  SAYS rather than passing quietly.


  THE NULL CONTROL, and the finding owed it. Over the identical sweep the two

  quantities that must NOT move do not: `predict_event_age_span_from_constants`

  returns (30,92) at every point (it reads no draw) and the census''s invoice-side

  span is (30,92) on all 21 books. The sweep moves the SAMPLE, not the LAW -- so

  the failure-side movement is a property of the realisation and not an artefact

  of the perturbation. It is declared in the register (`invoice_span_invariant`)

  rather than left in a test, and falsifying it is one of the seven mutations.


  R12: NO PUBLISHED FIGURE MOVED. Nothing this instrument computes was touched --

  only a register''s scope fields, a new axis, the census''s subject and the wording

  of a caveat. Checked at the draw the module actually publishes from (n=4000,

  seed 7): there the failure span and the invoice span COINCIDE at [30,92], so the

  divergence clause does not fire and the shipped sentence''s substance is

  unchanged. That is pinned in `test_the_census_caveat_names_the_edge_setting_population`,

  which asserts the clause fires at n=300 seed 7 (failures reach 91d, invoices

  92d) and does NOT at n=4000.


  LEFT OPEN, stated rather than implied. The two resolution controls are still

  called with `n_customers=300` hard-coded in `main()`. That literal was NOT

  removed: the axis is the answer to leg 2 (the same disposition D28 took on its

  sibling), because unpinning those two would buy a ~35-minute default run for a

  question the 2-second predictor axis now answers on 21 books instead of one. If

  a later Hour wants the scorer''s own opinion across the axis it is a declared-flag

  check, not a default-path one.

  '
map_notes:
  harden_note: 'HARDEN PASS RAN 2026-08-08 (commit 72ecfff7d); recorded here 2026-08-08 because the pass fixed code and tests but left the map cell silent -- the work was invisible to the map, and a silent cell is why the self-refill kept re-drawing this atom for a level move it cannot make. Delivered, both mutation-proven: (1) the DD-channel LEAK WITNESS was VACUOUS -- `n_flagged_non_dd_failures == 0` passes identically when the channel observes nothing at all as when it observes cleanly, so a vacuity guard now carries it (test_leak_witness_is_vacuous_without_its_channel_guard pins the defect the guard closes); (2) three silent `.get()` JOIN DROPS had no witness -- `value_date`/`invoice_ref`/`reference` key drift would have pushed the measured gap toward the no-skill baseline with nothing firing, so n_unjoined_dd_failures / n_unjoined_collection_misses / n_ageing_refs_matched are now asserted against a deliberate key drift. 24/24 green. NEW FINDING from the pass, reported not tuned (R12): the headline DETECTION gap is INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL -- `flagged_set` is a UNION, `n_flagged_via_dd_channel_only == 0` across seeds 7/11/23, so killing the DD channel outright leaves the published number bit-identical. Structurally reasonable (a rail failure means the cash did not arrive, which reconciliation also sees) but it means set-membership detection is blind to the only thing that channel buys: EARLIER detection. That test is labelled CHARACTERIZATION deliberately -- it pins a measured limit, not a contract, and is expected to fire if the channel ever starts contributing.'
  level_hold_note: 'HELD AT L2 (level_current 2, level_target 3). THIS NOTE WAS COMPACTED ON 2026-08-17 BY EXPERT HOUR #33 AND THAT COMPACTION IS ITSELF A FINDING. It had reached 54,930 chars -- 81% of this atom''s store file, which the append pushed to 67,812 B against the 65,536 B ROLL_WATERMARK, and `roll_for_atom` returned 0 because the roll chunks LIST entries and this is one string field the roll cannot split. The record of the atom had become unwritable: the wedge `test_the_live_store_has_roll_headroom` exists to catch, caught. Thirty-three Hours appending to one field is the cause; Hour #33 only tipped it. The store''s own contract is the authority for the fix (`set_note_for_atom`: a note is a CURRENT statement, revision is the correct semantics, and the durable history of what changed lives in git) -- so the full 54,930-char note is in this file''s git history and in the commit that landed Hour #33, nothing is deleted, and what follows is what is CURRENTLY TRUE. Hours #3-#32''s individual narratives are there, not here.


    WHY THE LEVEL IS HELD, which is EVIDENCE and not caution. L3 means ''Expert Hour says this is real''. Hour #31 pre-committed the promotion condition BEFORE #32 ran, so the bar could not be moved once results were known: ONE Hour against the corrected instrument that ends with NO BLOCKING finding takes the 2->3. Since then the per-Hour defect rate on this instrument has been 1.0 -- #28 (a mechanism asserted into this very note while HEAD carried none of it), #29 (the citation control, repo-wide refusal on its default path and no test), #30 (a grader with ten importers, all its own tests, that had never graded the live ledger), #31 (a published claim in `components["drift_resolution_caveat"]` that was measurably false), #32 (three BLOCKING: the corrected sentence on no published surface, an R15 fail-open comparing bands by CONTAINMENT, and a third no-caller control), #33 (below). Five... now six consecutive Hours each finding a real flaw is the strongest available evidence that the next one will too. An Hour cannot be its own confirmation: the Hour that corrects the instrument is not the Hour that clears it.


    EXPERT HOUR #33 (2026-08-17, worker tick, self-refill 2->3 HARDEN draw). THE DEFECT: `site/data/proof.json` was regenerated in the working tree at 15:54:44Z and EXACTLY ONE of its fourteen `coupled_gaps` pairs moved -- this atom''s own, 0.0833907649896623 -> 0.0311284046692607, with the whole book under it (caught 31->4, flagged_size 391->35, n_negatives 1451->257, n_excluded 118->15, n_false_flags 242->16, universe_size 1600->276, false_flag_rate 0.166782->0.062257): a 2.68x understatement of the company''s own payment belief-vs-truth gap. WHY THIS PAIR AND NO OTHER -- a mechanism, not an incident: this pair''s ledger entry is the only one of the fourteen written as a SIDE EFFECT of running the simulation (`simulation/run_phase2b.py:2448` -> `LivePaymentTriad.measure_and_write`, `ledger_path` defaulted to the real file), while every other pair is written by its own `tools/couple_*.py --write-ledger` invocation that no test runs -- and ten-plus test modules invoke run_phase2b. Observed twice in this tick rather than inferred: `pytest tests/tools/test_couple_w2_11_d5.py` moved the live ledger''s measured_at 16:34:19 -> 16:42:56 mid-run (md5 825330de9 -> e56aa515c), harmless to the figures because this module measures the full 1600-invoice book, but the same write path from a test process into the supplier of a public door. IT WAS INVISIBLE BECAUSE THE DEFECT IS ONLY IN THE RELATION: the door agrees with itself, the ledger agrees with itself, the generator did what it was asked, and the scorer is not involved at all -- every control here reads ONE side, including the SITE-lane control #32 built, which excludes the ledger as a subject on purpose. BUILT (this atom''s own file_scope): `measure_published_door_against_the_ledger` + `check_published_door_reproduces_the_ledger`, wired into `main()` on the default path with its verdict rendered, and 11 tests. The check-call census now reads 17 defined / 15 default-path / 2 declared-flag / 0 unreachable. R15 BOTH WAYS AGAINST REAL HISTORY, not a fixture: RED on the poisoned door as found (9 violations, the headline and 8 components), GREEN once restored, and four source mutations proven to fire -- unreadable-file-caught-into-{} (fail-silent), headline-only comparison (wrong subject), no vacuity guard (tautology), absent-door-pair-as-skip (fail-open). 500 passed (was 489). R12: nothing this instrument computes moved; the only figure that moved is the door''s and it moved BACK (`git checkout HEAD -- site/data/proof.json`, restoring the value the deployed site and the current ledger both carry; corrupted payload preserved at /tmp/h33_proof_poisoned.json). AND THE NEW CONTROL''S FIRST INDEPENDENT MEASUREMENT ANSWERED RECORDED 7, which had only ever been narrative: run against `git show HEAD:` on both files, THE COMMITTED PAIR HAS NEVER AGREED EITHER -- door 0.0833907649896623 vs ledger 0.0859375, n_negatives 1451 vs 1408, universe_size 1600 vs 1557, false_flag_rate 0.166782 vs 0.171875. The file the public door nominally derives from is not the file it was generated from, and has not been for five days. Filed: docs/staging/WORKER_FINDING_THE_ONLY_DOOR_PAIR_A_TEST_RUN_CAN_REPUBLISH_IS_THE_ONE_NOTHING_COMPARED_TO_ITS_LEDGER_2026-08-17.md.


    THE OWED WORK, ranked and CURRENT as of Hour #35 (2026-08-18), so the next promoter does not re-derive it. #33''s items (1) STOP THE WRITE and (2) THE DOOR-VS-LEDGER TRIPWIRE are BOTH DISCHARGED -- (1) by Hour #34''s empirical verification of `background/live_ledger_guard.py` (513 tests, live ledger md5 unchanged across the run) and (2) by `site/proof/test_the_published_door_reproduces_its_ledger.py` (c7a1fdab0), born green on the production ledger landed at e7a554d03. What remains: (A) THE `tests/` HALF OF HOUR #35''s CLASS -- the publish gate collects from the WORKING TREE exactly as the site lane did, so an untracked control counts toward its green there too; NOT built as a bare untracked census because it would be born red on other lanes'' live in-flight work, and the honest subject is ''untracked AND cited by a committed record as a discharge or as covered scope''. (B) THE NOTE-FIELD ROLL: the roll chunks LIST entries and cannot split one string field, so this note will wedge again if Hours resume appending to it; every Hour must compact as it writes until notes get a size bound and an archive path of their own (a store change outside this atom). (C) #28''s surviving leads: the 14 undeclared live entries nothing re-measures on a schedule; #27''s clamp and six-unwalked-rows; D35''s scoped build; #21''s vacuous-in-isolation sibling control.


    WHAT DOES NOT BLOCK THE PROMOTION, stated so it is not re-litigated: the two open D28 residuals (the `S`-side exit-threshold predictor, unidentified; the reshape, unbuilt). Those are DISCLOSED limits, declared in the register and published in the sentence the reader meets -- an instrument that states its own limits accurately is what L3 epistemic cleanliness asks for, not an instrument with none. NOT a wall, and NOT a reason to tune any number (R12).'
  name: 'Payment belief-vs-truth gap (coupled-triad HARNESS of the D5 decomposition): the harness measures the company''s payment BELIEF (its allocation/ageing/cash-position inference from observed payments, D5) vs the world''s payment TRUTH (the W2_11 generator''s actual behaviour). No world payment-source reaches L3 until this gap is measured against the company''s consumption (COUPLED_TRIAD binding rule).'
