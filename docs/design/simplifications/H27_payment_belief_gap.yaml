  A FAIL-OPEN FOUND BY RUNNING THE MUTATION RATHER THAN READING THE CODE, and my

  own first draft asserted the opposite. That draft justified its vacuity guard by

  claiming an all-components-dropped ledger returns zero violations. FALSE: #33

  already guards the empty case. What nothing guarded is the APPROACH to it --

  drop nine of ten components and leave `caught`, and the existing check returns

  ZERO violations while the headline assertion PASSES, because a non-empty

  `compared` satisfies the emptiness guard and `measure_published_door_against_the_ledger`

  `continue`s past any name absent from either side. Nine published figures sit

