  run. 15 guard tests green.


  OWED ITEM (2)''s BLOCKER WAS NOT A BAD DOOR, and this is the finding of the pass.

  #33 declined to ship the door-vs-ledger tripwire because it "would be BORN RED on

  the HEAD divergence" -- and it would have been: reading BOTH sides from the one

