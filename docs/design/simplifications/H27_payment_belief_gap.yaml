pointed at D11_detection_gap_is_recall_only, which is the whole of the remaining hold. Reversal is one line: drop it when D11 lands. NOT a wall, and NOT a reason to tune the detection number (R12). == RELEASED 2026-08-09 (worker tick): D11 LANDED at L2, so the whole of the remaining hold is discharged and depends_on is DROPPED rather than re-pointed a third time -- there is no fourth reason to aim it at, and a block naming a satisfied atom is the dead-mechanism class this note has already fallen into twice. THE 2->3 IS NOW DRAWABLE AND IT IS NOT TAKEN HERE, for the same reason the 2026-08-09 release did not take it: the instrument changed again, and more than it did last time. The detection headline is a DIFFERENT MEASURE from the one every prior Expert Hour looked at -- a balanced error over an ever-flagged population, with a false-flag denominator that excludes legitimately-flagged late payers -- and the number it publishes went 0.0725 -> 0.0134 on seed 7 for reasons that are all reshape and no company change. An Hour run on the OLD instrument''s reputation would be exactly what the previous release warned against, so whoever takes this to L3 runs it on the CORRECTED instrument and should start at D11''s own registered open question: `missed_failure_rate` is structurally 0.0000 on every population this repo scores, so the headline is currently half a measurement, and whether that is acceptable at L3 is a judgement call this build declined to make on the promoter''s behalf. Reversal is one line: the depends_on can be re-added. == EXPERT HOUR RAN AGAIN 2026-08-09 (worker tick) ON THE CORRECTED INSTRUMENT, AS THE PREVIOUS RELEASE DEMANDED, AND THE ANSWER IS STILL NO -- HELD AT L2 on a NEW reason. It did start where D11''s registered open question said to (missed_failure_rate structurally 0.0000, so the balanced error is currently half a measurement), and that question is real but is NOT what holds this atom: it is a property of a world where reconciliation catches ev