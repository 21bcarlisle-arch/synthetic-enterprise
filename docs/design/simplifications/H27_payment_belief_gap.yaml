metically FALSE. Alongside it, a `components` key was shadowing an entry-level field name, and the door rendered `basis UNDECLARED` beside `normalisation: majority-class prevalence` in one row of the live page. Closed as a class: the reserved set is derived from the dataclass, the write guard runs before the kind check, the audit grades the collision before every early `continue`, the grader has a caller on every publish, and its verdict is rendered -- six source mutations, all proven to fire. THE 2->3 IS NOT TAKEN: Hour #4''s two-consecutive-clean criterion is at zero, and this Hour is why. The next promoter runs Hour #31 against #28''s leads minus the collision, plus the 13 undeclared live entries the new alarm now names with no owner, and the fact that this is the SECOND control on this instrument found with no caller -- a rate, not an incident. NOT a wall, and NOT a reason to tune any number (R12). ONE MORE LEAD, MEASURED IN THIS TICK AND DELIBERATELY NOT TAKEN (SELF-INTERRUPT DISCIPLINE): running `tests/tools/test_couple_w2_11_d5.py` REWROTE the live `docs/observability/coupled_gap_ledger.json`. Evidence: the file''s mtime and the W2_11 entry''s `measured_at` both moved to 20:37:13, the second the 457-test module started, from the 19:02:54 the published `site/data/proof.json` was generated against. A test run silently re-publishes a gap measurement into the supplier of a public door -- which is also why this Hour did NOT commit a regenerated proof.json: it would have shipped a measured_at that no committed ledger carries. That is a test-isolation defect with its own blast radius, it is not the D44 class, and it outranks the remaining #28 leads. == RE-READ 2026-08-14 AND STILL HELD, WITH THE EXIT CONDITION NAMED. Hour #31 discharged the RUNG-1c BLOCKING finding `THE_CAVEAT_BLAMES_PLACEMENT_AND_THE_MEASUREMENT_SAYS_DENOMINATORS`: a claim shipped in `components["drift_resolution_caveat"]` -- the surface the ledger writer, live wiring and dashboard read -- was measurably false, and it is now corrected and re-derived per book by `check_detection_interior_change_points` with ten R15 mutation cases. By A2''s `passed_execute_after_fix` precedent that is an Hour discharged with its found defect fixed, which is why the status field moved. THE LEVEL DID NOT, for a reason that is EVIDENCE rather than caution: this instrument''s Hours have found a genuine published-claim defect at #28, #30, #30-addendum and #31 -- a per-Hour defect rate at or near 1.0 on the four most recent passes. L3 is "Expert Hour says this is real"; a run of four consecutive Hours each finding a real flaw is direct evidence that the next one will too, and it is the strongest evidence available either way. This note''s own 2026-08-09 release already said a promoter "must run the Expert-Hour pass on the CORRECTED instrument", and Hour #31 IS the pass that corrected it -- an Hour cannot be its own confirmation. THE EXIT CONDITION, so the next tick is not re-deriving it: ONE Hour against the corrected instrument that ends with NO blocking finding takes the 2->3. WHAT DOES NOT BLOCK IT, stated so it is not re-litigated: the two open D28 residuals (the `S`-side exit-threshold predictor, unidentified; the reshape, unbuilt). Those are DISCLOSED limits, declared in the register and now published in the sentence the reader meets -- an instrument that states its own limits accurately is what L3 epistemic cleanliness asks for, not an instrument with none.'
