  A SMALLER CORRECTION, made because the record is the deliverable. #39 wrote that `required_missing` and `_abbrev` were ''unbackticked and so outside the tokeniser, confirmed by hand''. Backticking a symbol IN ORDER TO REPORT IT UNBACKTICKED enters it into the population, so that sentence was false of the tree containing it. Both copies corrected rather than left to contradict themselves; the control now names all four by itself.'
map_notes:
  harden_note: 'HARDEN PASS RAN 2026-08-08 (commit 72ecfff7d); recorded here 2026-08-08 because the pass fixed code and tests but left the map cell silent -- the work was invisible to the map, and a silent cell is why the self-refill kept re-drawing this atom for a level move it cannot make. Delivered, both mutation-proven: (1) the DD-channel LEAK WITNESS was VACUOUS -- `n_flagged_non_dd_failures == 0` passes identically when the channel observes nothing at all as when it observes cleanly, so a vacuity guard now carries it (test_leak_witness_is_vacuous_without_its_channel_guard pins the defect the guard closes); (2) three silent `.get()` JOIN DROPS had no witness -- `value_date`/`invoice_ref`/`reference` key drift would have pushed the measured gap toward the no-skill baseline with nothing firing, so n_unjoined_dd_failures / n_unjoined_collection_misses / n_ageing_refs_matched are now asserted against a deliberate key drift. 24/24 green. NEW FINDING from the pass, reported not tuned (R12): the headline DETECTION gap is INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL -- `flagged_set` is a UNION, `n_flagged_via_dd_channel_only == 0` across seeds 7/11/23, so killing the DD channel outright leaves the published number bit-identical. Structurally reasonable (a rail failure means the cash did not arrive, which reconciliation also sees) but it means set-membership detection is blind to the only thing that channel buys: EARLIER detection. That test is labelled CHARACTERIZATION deliberately -- it pins a measured limit, not a contract, and is expected to fire if the channel ever starts contributing.'
  level_hold_note: "HELD AT L2 (level_current 2, level_target 3). COMPACTED AS WRITTEN (Hour #40, 2026-08-19) -- the store's contract is the authority: a note is a CURRENT statement, revision is correct semantics, and every Hour's full narrative lives in git and in the commit that landed it. Hours #3-#39's individual narratives are there, not here. THE NOTE-FIELD ROLL REMAINS THE STANDING CONSTRAINT: the roll chunks LIST entries and cannot split one string field, so every Hour must compact as it writes until notes get an archive path of their own (a store change outside this atom).\n\nWHY THE LEVEL IS HELD, which is EVIDENCE and not caution. L3 means 'Expert Hour says this is real'. Hour #31 pre-committed the promotion condition BEFORE #32 ran, so the bar could not be moved once results were known: ONE Hour against the corrected instrument that ends with NO BLOCKING finding takes the 2->3. The per-Hour defect rate on this instrument is now 1.0 ACROSS TWELVE CONSECUTIVE HOURS -- #28 (a mechanism asserted into this very note while HEAD carried none of it), #29 (the citation control, repo-wide refusal on its default path and no test), #30 (a grader with ten importers that had never graded the live ledger), #31 (a published claim in components['drift_resolution_caveat'] that was measurably false), #32 (three BLOCKING: the corrected sentence on no published surface, an R15 fail-open comparing bands by CONTAINMENT, a third no-caller control), #33 (the door-vs-ledger relation), #35 (a green control in no commit, with two committed records resting on it), #36 (the tests/ half of #35's class), #37 (the tripwire compared 10 of 19 shared fields), #38 (#37's whole deliverable in NO COMMIT while three records said it was built), #39 (#38's whole deliverable in NO COMMIT while its own note reported the class repaired), #40 (below). TWELVE consecutive Hours each finding a real flaw is the strongest available evidence that the next one will too. An Hour cannot be its own confirmation: the Hour that corrects the instrument is not the Hour that clears it.\n\nEXPERT HOUR #40 (2026-08-19) RAN #39's CONTROL INDEPENDENTLY AND IT WAS RED ON A FALSE POSITIVE. #39's deliverable was staged and never committed -- the next tick (e8834cf37) preserved the hunk and landed something else -- so the drawn HARDEN work was #39's own finding recurring a third time, and the first act was to RUN the shipped control rather than trust its reported result. It fired on OPS3_first_post_ruling_publish `git_hash`, whose file_scope is two artefacts a live daemon rewrites: the key entered the worktree minutes earlier, while the symbol has been committed at background/process_run_complete.py:828 for a long time -- the module OPS3's note actually cites. #39's premise was false in one clause (file_scope declares what an atom OWNS, not that those files are CODE), the verdict was non-deterministic on daemon timing, and the repair it prescribed fixed nothing. THE OBVIOUS FIX WAS MEASURED AND REJECTED: a repo-wide 'is it landed anywhere' backstop forgives BOTH founding violations (`door_only` in 6 committed files at HEAD, `dimension_caveats` in 11) and would have disarmed the control on the only case it has ever caught -- now pinned by a mutation so it cannot return as an improvement. What landed is `_is_code`, narrowing the VERDICT corpus to authored source while the LANDED corpus keeps every entry, because forgiving too readily can only remove a violation and never invent one. R15 both directions on REAL state: GREEN on the live index (22 passed, up from 18), RED against a throwaway copy of that index with this atom's two modules reset to HEAD, naming all four symbols, the real index untouched. The new exclusion carries its own floor (12 of 270), because pairs and resolved are computed off the LANDED corpus and would not have shown it dying.\n\n\n    THE OWED WORK, ranked and CURRENT as of Hour #40. (A) DISCHARGED by #39 and REPAIRED by #40 -- the symbol control above, landed with its `_is_code` guard and its rejected-alternative mutation; its parent, the discharge-population control, landed with #38. (B) THE `door_only` FOUR -- the door publishes `dimension_caveats`, `recon_collapsed_runs`, `recon_collapsed_runs_measured_on`, `recon_saturation_band_measured_on`, which the ledger has no record of; #37 measures them into `door_only` and deliberately does not judge them (firing needs a ledger schema change outside this file_scope), and a test pins that they stay recorded-not-judged so the lead can be neither quietly dropped nor quietly promoted. `door_only` is EMPTY on the landed pair -- the regenerated ledger carries all four -- so the lead is the SCHEMA guarantee, not a live divergence. (C) THE SIBLING DETECTION AXIS FLOOR -- docs/staging/WORKER_FINDING_THE_SIBLING_AXIS_FLOOR_IS_A_FREE_LITERAL_AND_ITS_CONTROL_CANNOT_FAIL_ON_IT_2026-08-18.md, LATENT: the belief floor is derived and the detection axis keeps 150 as a free literal, the fourth consecutive time this class was found one register over from where it was last fixed. R10 reading: make the checker's population every register entry declaring a draw-size axis, not an enumerated pair. (D) THE NOTE-FIELD ROLL (first paragraph). (E) #28's surviving leads: the 14 undeclared live entries nothing re-measures on a schedule; #27's clamp and six-unwalked-rows; D35's scoped build; #21's vacuous-in-isolation sibling control.\n\nWHAT DOES NOT BLOCK THE PROMOTION, stated so it is not re-litigated: the two open D28 residuals (the S-side exit-threshold predictor, unidentified; the reshape, unbuilt). Those are DISCLOSED limits, declared in the register and published in the sentence the reader meets -- an instrument that states its own limits accurately is what L3 epistemic cleanliness asks for, not an instrument with none. NOT a wall, and NOT a reason to tune any number (R12)."
  name: 'Payment belief-vs-truth gap (coupled-triad HARNESS of the D5 decomposition): the harness measures the company''s payment BELIEF (its allocation/ageing/cash-position inference from observed payments, D5) vs the world''s payment TRUTH (the W2_11 generator''s actual behaviour). No world payment-source reaches L3 until this gap is measured against the company''s consumption (COUPLED_TRIAD binding rule).'
