atom_id: H27_payment_belief_gap
simplifications:
- 'NINTH HOUR (2026-08-11), on the first of the three leads Hour #8 left: THE BELIEF DIMENSIONS CANNOT SEE A COMPANY THAT NEVER FORGETS. Both read exactly one company parameter -- `_dd_failure_window_days`, how far back `_arrears_risk_belief` still counts an observed failure -- and the harness builds the company at DD_FAILURE_WINDOW_DAYS=400 against a book whose oldest failure event is 91d old at `as_of`, so no event can ever fall out of that memory. Measured under a NEW declared counterfactual company (`organ_failure_window_drift_days`; world bit-identical record-for-record, asserted inside the measurement), n=300, seeds 7/11/23: every window from ~92d to INFINITY publishes one figure (+1d, +500d and -308d all read the baseline exactly), so the number cannot distinguish the scored company from one that never lets a failure go -- the direction that keeps a recovered customer in collections -- while the organ''s OWN shipped default (90d) sits just below the edge and publishes a different number (0.1519 -> 0.1709, seed 7). The 400 was deliberate and its reason is still in the constant''s comment (''generous on purpose'', so the recency window would not confound the CHANNEL blind spot); what was never measured is that it costs the dimension ALL resolution on the only parameter it reads -- a design note standing in for a measurement, Hour #5''s lesson. THE CLASS is the register''s OFF-PATH state, which discharged itself with `exercised_by` -- an INDISCRIMINATE DEGENERATE, the largest error there is, establishing non-inertness and measuring no resolution -- so 2 of 5 published dimensions had no measured resolution inside the register built to close that hole (fifth escape of a register''s own keying). CLOSED AT THE CLASS (R10): every off-path entry now owes a GRADED band on its own organ''s knob, with the D25 exactness rule, an unbounded-above violation class of its own, an `own_debt_atom`, a DIFFERENTIAL (the knob moves only the two belief dimensions, on every seed) and an R13 world-invariance witness. The population-side predictor `measure_belief_window_resolution` is derived from the world''s event dates and the declared window and never from the organ''s thresholds (the D20 hand-copy / D21 literal-import tautology, in the direction nobody checks): it predicted the smallest visible memory error at 310d and the sweep measured 310d. Caveat stamped AT SOURCE on both dimensions'' note AND components, re-derived per book so live populations carry their own. R15 both ways: 7 register mutations + 3 SOURCE mutations (inert probe, knob that moves everything, counterfactual world). The RESHAPE is atom D27, minted at L0 (it moves a published number). 302 green (was 271); 153 green across the sibling coupled-pair suites. FULL TEXT: docs/staging/WORKER_FINDING_THE_BELIEF_MEMORY_SATURATES_ON_THIS_BOOK_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6 and #7 recorded, still ATOM H41''s class. HELD AT L2: nine Hours, nine defects, and this Hour changed the instrument again.'
- 'TENTH HOUR (2026-08-11, worker tick, H27 2->3 HARDEN draw), on Hour #9''s second lead -- whether the ON-PATH entries had ever been asked the saturation question the off-path ones now owe. They had not, and the cause is one level up: THE REGISTER WAS ONLY EVER ASKED WHERE IT HAD ALREADY ANSWERED. `check_dimension_drift_resolution` DERIVES its keyset from what `score_triad` publishes -- D25 removed that keying -- while building its GRID from its own declarations (`drifts = {0} | declared invisible | declared visible | declared collapsed pairs`), so the exactness rule the register exists to enforce was applied exactly at the points the band had already named. Half the keying was removed and half was not. THE FINDING, measured not asserted, on a grid derived from the BOOK instead (every integer terms drift across one billing cycle either way = 43 counterfactual companies; `dense_drift_grid`, asserted against its own AST never to reach the register), n=300, seeds 7/11/23, every run identical on all three: THE DETECTION DIMENSION SATURATES IN BOTH TAILS. Declared blind to {+1}, sighted at {-1}, collapsing NOWHERE, it in fact has SEVEN groups of companies publishing one bit-identical figure -- every supplier holding terms 6 to 21 days SHORTER than the world publishes ONE number (sixteen companies, one figure, every seed), every supplier 17 to 21 days LONGER publishes another, and five interior collapses ({-4,-3}, {0,+1}, {+6,+7}, {+9,+10}, {+11,+12,+13}) show the reading is quantised rather than continuous. THE WITNESS THAT IT WAS UNREACHABLE AND NOT MERELY UNNOTICED: -8d WAS on the old grid (it was in the AGEING band) and the register read it as MOVED, i.e. as evidence of resolution -- it sits inside the saturated tail, indistinguishable from -21d; on its own grid the register could confirm exactly ONE of detection''s seven collapses. So a movement in this headline is not readable as days of company error, and the -6d direction -- a supplier flagging paying customers as in arrears and posting the dunning letter -- cannot be told from one three weeks out. WHY IT IS THE CLASS: D27, LAST HOUR, built the saturation rule and put it inside `_check_own_band`, reached only from `check_own_drift_resolution`, which iterates only entries declaring an `own_drift` -- the OFF-PATH ones. The register that refuses an unbounded-blind band off the causal path accepted one ON it. A rule keyed to a register STATE rather than to what the instrument publishes: the same keying, inside the control written to close the previous keying, sixth escape. CLOSED AT THE CLASS (R10): the grid''s PROVENANCE is the book (declared drifts still UNIONED in, so a declaration outside the grid is scored rather than skipped); every collapse is DERIVED from the readings and must be declared EXACTLY (undeclared collapse RAISES -- the defect; declared-but-read-apart RAISES -- a debt entry outliving its debt); and `_check_saturation_and_collapse` is ONE function that BOTH checkers call, once per entry, on the knob that reaches that entry''s organ, so a saturation rule can no longer exist on one side of `in_causal_path` and not the other. CROSS-CHECK THAT THE ABSTRACTION IS RIGHT: the generic rule, which knows nothing about failure events or `measure_belief_window_resolution`, re-derives D27''s finding from the readings alone and puts the belief saturation edge at the same -308. ALSO CLOSED: the undefined-reading FAIL-OPEN -- a dimension whose population empties publishes None, and None != baseline reads as MOVEMENT, an instrument that has stopped reading counted as resolution (reachable: `detection_latency` goes None at large positive drifts). DIFFERENTIAL ON PURPOSE: `ageing` publishes 43 DISTINCT readings and collapses nowhere -- the D25 reshape holding up under a grid it did not choose, which the sparse grid could only ever confirm on the four drifts D25 itself named -- and a register in which every on-path dimension saturated somewhere now fails as a blanket claim. Caveat (`detection_resolution_caveat`) stamped AT SOURCE on note AND components, interpolated from the register each call. DECLARED RESIDUAL, not implied away: there is no population-side PREDICTOR of detection''s edges (the D25/D27 shape); the caveat says so and it is the minted atom''s own debt. R15 both ways: 6 register mutations + 2 SOURCE mutations (the grid put back the way it was -> six of seven collapses become unconfirmable; an absent reading counted as resolution). The RESHAPE is atom D28_the_detection_gap_is_quantised_by_this_books_placement, minted at L0 (it moves a published number). 315 green (was 302); 122 green across the sibling/consumer suites. FULL TEXT: docs/staging/WORKER_FINDING_THE_REGISTER_WAS_ONLY_EVER_ASKED_WHERE_IT_HAD_ANSWERED_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6 and #7 recorded, still ATOM H41''s class. HELD AT L2: ten Hours, ten defects, and this Hour changed the instrument again.'
- 'ELEVENTH HOUR (2026-08-11, worker tick, H27 2->3 HARDEN draw), on Hour #10''s own first lead -- and the lead is the point: A LEAD IS NOT A CONTROL. Hour #10 removed the register''s grip on the TERMS grid, wrote the remaining half up as its top lead and shipped, so `measure_own_drift_resolution` went on building the MEMORY sweep the old way (`drifts = {0} | own_invisible_drifts | own_visible_drifts`). Every claim D27 made about what the belief dimensions can resolve was therefore checked at the points D27 had already named -- seventh escape of a register''s own keying. THE FINDING, measured not asserted, on a grid derived from the BOOK instead (`book_memory_grid`: the window values either side of every observed failure age, plus total amnesia and the shipped company = 70 counterfactual companies; asserted against its own AST never to reach the register), n=300, seeds 7/11/23, every run identical on all three. The grid is COMPLETE, not merely dense: an event at age `a` is counted iff `a <= window`, so the reading can only change as the window crosses an event age, and 70 points measure resolution over the whole real line. (1) BOTH BELIEF DIMENSIONS SATURATE BELOW AS WELL AS ABOVE. The book''s YOUNGEST observed failure is 30d old, so every company memory of 29d or less counts NOTHING and publishes one figure: a supplier that forgets a failed collection after three weeks and one that never remembers it are the same number. D27 measured `own_saturates_below = None` on this same instrument for a mechanical reason -- a collapsed run needs two points and the register''s own claims put exactly ONE below the book. The 30d is AS_OF_BUFFER_DAYS, which is Hour #10''s lead 3 arriving: the second harness constant chosen to REMOVE a confounder (''comfortably past'', in the same voice DD_FAILURE_WINDOW_DAYS=400 says ''generous on purpose''), and a silent resolution decision. THE WITNESS THAT IT WAS UNREACHABLE AND NOT MERELY UNNOTICED: -380d, which D27 declared VISIBLE as its evidence of resolution, takes the memory to 20d and therefore counts nothing -- it sits inside that tail, indistinguishable from total amnesia. Four interior collapses ({-358,-357,-356}, {-333,-332}, {-331,-330}) show the sighted region is quantised at exactly the window values where this book has no event. (2) THE REGISTER PUT ONE DIMENSION''S CEILING AT ITS SIBLING''S: `belief_population_mix` was declared to saturate above -308 like `belief` and in fact saturates at -309, one day blinder, because dropping the oldest events moves an account''s tier without moving the population MIX -- a real difference between two published numbers, asserted away by never scoring the point. CLOSED AT THE CLASS (R10): the memory grid''s PROVENANCE is the book (declarations still UNIONED in, so a declaration outside the grid is scored rather than skipped); `OWN_DRIFT_BOOK_GRIDS` RAISES for a knob nobody derived a grid for, because the fallback IS the defect and a silent one would put the next off-path entry straight back; BOTH edges are now predicted from the POPULATION (`predicted_saturates_below_drift`/`_above`) and cross-checked ONE-DIRECTIONALLY against the sweep -- beyond the predicted edge no event can change side so movement there is a violation, inside it a dimension may saturate EARLIER, which is a blinder measurement and not a lie (D27 had this pair on the upper edge only, which is exactly how the lower one read None with nothing to disagree); a drift declared VISIBLE may NOT sit inside a collapsed run (D28 observed that in prose -- ''the -8 the old grid read as MOVED sits inside the saturated tail'' -- and built no rule, so the shape survived one register field over); and a saturation OWNER PER EDGE, because these two tails stop for two different reasons (above: the company''s memory outruns the book, D27; below: `as_of` outruns it, D29) and one field could only name the one that had been looked at. The amnesia floor is stamped AT SOURCE on both belief dimensions'' note AND components (D22) and re-derived from the book each call, and both edges print in the CLI with their owning atoms (D25''s rule). R15 both ways: 5 register mutations (low edge declared absent = the pre-D29 state; an owner for one tail only; a dense-grid collapse undeclared; a declared collapse the sweep reads apart; a visible drift restored inside the run) + 3 SOURCE mutations (a sweep outrunning the book''s proof at either edge; a knob with no book-derived grid, which must raise). R12: NO PUBLISHED NUMBER MOVED -- the belief headline is unchanged; what moved is what the register admits about it. The RESHAPE is atom D29_the_as_of_buffer_floors_the_memory_grid, minted at L0 (giving the book events beside the short end of a plausible memory moves every published belief figure on this pair). FULL TEXT: docs/staging/WORKER_FINDING_THE_MEMORY_GRID_WAS_STILL_THE_REGISTERS_OWN_CLAIMS_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6 and #7 recorded, still ATOM H41''s class. HELD AT L2: eleven Hours, eleven defects, and this Hour changed the instrument again -- the next promoter runs Hour #12 on the corrected instrument, starting from the three leads in that document.'
- 'TWELFTH HOUR (2026-08-11, worker tick, H27 2->3 HARDEN draw), on Hour #11''s lead 2 -- the CENSUS of confounder-removing constants. D27 found `DD_FAILURE_WINDOW_DAYS = 400` by tripping over it and D29 found `AS_OF_BUFFER_DAYS = 30` by tripping over it; both comments say the constant was chosen to REMOVE A CONFOUNDER (''generous on purpose'', ''comfortably past''), both reasons are sound, and each is also a silent RESOLUTION decision -- so the set of constants bounding what this instrument can resolve was being enumerated BY ACCIDENT, one Hour at a time, with nobody able to say how many were left. THE FINDING, measured not asserted, n=300, seeds 7/11/23, every run identical on all three: THE TWO BELIEF DIMENSIONS RESOLVE A COMPANY MEMORY ERROR ONLY BETWEEN THE YOUNGEST AND OLDEST INVOICE AGE THIS BOOK PRESENTS -- [30d, 92d], a band 62 DAYS WIDE -- and that interval is not a sensitivity of the instrument but ARITHMETIC OVER FOUR HARNESS CONSTANTS (youngest = AS_OF_BUFFER_DAYS; oldest = AS_OF_BUFFER_DAYS + PERIOD_SPACING_DAYS x (N_PERIODS - 1) + BILLING_CYCLE_SPREAD_DAYS - 1), predicted from the constants alone and cross-checked against the BUILT book on every seed. (1) THE UPPER EDGE WAS ATTRIBUTED AWAY FROM THE HARNESS ENTIRELY. D29 built the right shape -- a saturation owner PER EDGE -- and filled the upper one in with ''the company''s memory outruns the book'' (D27), which is a restatement, not an attribution: the book stops at 92 days because N_PERIODS is 3 and PERIOD_SPACING_DAYS is 21, two constants no Hour had asked, so the HARNESS''S OWN CALENDAR was recorded as a property of the company being graded -- D25''s class, one register over. The arithmetic was already written out in that same entry''s `own_why` two lines below the owner field and NO RULE WAS EVER BUILT FROM IT: Hour #11''s ''a lead is not a control'', one register field over, eighth sighting. (2) THE INSTRUMENT CANNOT RESOLVE THE COMPANY IT SCORES. The scored company holds 400 days of memory against a band topping out at 92, so every published `belief` and `belief_population_mix` figure is read 308 DAYS INSIDE THE SATURATED TAIL, where the one company parameter those dimensions depend on is inert by construction -- arithmetic on this repo''s own two constants, no external-realism claim needed. CLOSED AT THE CLASS (R10): `SCENARIO_CONSTANT_CENSUS` with its keyset DERIVED from `build_scenario`''s AST (`scenario_constants`, asserted on its own AST never to read the census -- deriving the subject FROM the census is the D28/D29 asked-where-it-answered class), so a ninth scenario constant left uncensused RAISES rather than waiting for an Hour to trip over it; `bounds_resolution` and the edge each constant sets MEASURED by perturbing the predictor one day, both directions, never read from the declaration; `predict_event_age_span_from_constants` reading constants and no draw (AST-asserted) and cross-checked against the built book on every seed, because an ownership claim about a band nobody presents is worthless; `_check_edge_owners_are_censused`, which fails a saturation edge owned by an atom the census does not put on that edge -- this Hour''s defect as a rule -- with the upper-edge owner moved D27 -> D30 on both belief entries (D27 keeps `own_debt_atom`: it owns where the SCORED COMPANY sits, a different fact from where the EDGE is); the band, its owning constants and the 308d of headroom stamped at source on both dimensions'' note AND components (D22); and a LIVE-POPULATION GUARD so this scenario''s [30, 92] is never quoted over a `run_phase2b` book the constants do not describe (proven on the flat book, where the band is [30, 72] and the attribution is withheld). DECLARED RESIDUAL: the census says WHICH constants set the band, not what the band SHOULD be -- that is D30''s own question and it needs a view on what memory a real supplier holds, which this harness does not have offline. R15 both ways: 6 census/register mutations (an uncensused constant; an entry outliving its constant; a band constant declared inert, parametrised over all four; an inert constant declared to bound the band; a band constant with no owning atom; an edge owner outside the census, which is the pre-Hour state and fires with exactly 2 violations) + source mutations (the span arithmetic drifted off `build_scenario` in each of its four terms, caught by the cross-check against the built book; and an empty book, which must fail rather than read like an agreeing one). R12: NO PUBLISHED NUMBER MOVED -- what moved is what the instrument admits about itself. The RESHAPE is atom D30_the_belief_band_is_this_books_length, minted at L0 (giving the scored population a book whose ages straddle a plausible supplier memory moves every published belief figure on this pair). FULL TEXT: docs/staging/WORKER_FINDING_THE_BELIEF_BAND_IS_THIS_BOOKS_LENGTH_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6 and #7 recorded, still ATOM H41''s class. HELD AT L2: twelve Hours, twelve defects, and this Hour changed the instrument again -- the next promoter runs Hour #13 on the corrected instrument, starting from the three leads in that document.'
- 'THIRTEENTH HOUR (2026-08-11, worker tick, H27 2->3 HARDEN draw), on Hour #12''s lead 1 -- and following that pointer found something larger than the missing field it went looking for. THE SHARED SATURATION RULE REACHED TWO OF THREE SWEEPS. D29 built `_check_saturation_and_collapse` explicitly ''so a saturation rule can no longer exist on one side of `in_causal_path` and not the other ... because there is only one of it'', and called it from both checkers. There are THREE counterfactual-company knobs in this harness. The third, `organ_reconciliation_drift_days`, belongs to ORGAN_QUERY_GRID -- atom D23''s register, THE ONE THAT FOUND THIS CLASS -- and it still built its sweep from its own declarations ({0,1} | invisible | visible | collapsed pairs | distinct pairs), with no notion of a collapsed RUN, a saturation EDGE or an UNDEFINED reading at all. Eighth escape of a register''s own keying, on the origin register. THE FINDING, measured not asserted, on a grid derived from the BOOK (`book_recon_drift_grid`: one integer per day from below the earliest issue-date crossing to above the last `as_of` crossing = 110 counterfactual companies; COMPLETE rather than dense, because the reading is constant below the floor and absent above `as_of`; asserted against its own AST never to reach a register), n=300, seeds 7/11/23, every run identical on all three. (1) THE SET READING -- WHICH IS THE PUBLISHED `detection` GAP -- HAS SIXTEEN COLLAPSES, against the TWO pairs declared: it saturates BELOW -6d, where sixteen companies all publish the no-skill 0.5 because every one of them has flagged every invoice by `as_of` (a supplier reconciling a week early and one three weeks early are one number, and the two declared pairs were a 2-point sample of that tail), and ABOVE +82d; the interior runs {-4,-3}, {0,+1}, {+6,+7}, {+9,+10}, {+11,+12,+13}, {+17..+24} show the reading is quantised rather than continuous anywhere. THE WITNESS THAT IT WAS UNREACHABLE AND NOT MERELY UNNOTICED: +7d was DECLARED VISIBLE -- offered as this entry''s evidence that the reading resolves the company -- and it sits inside the collapsed run {+6,+7}, which is D29''s own rule (''resolution is being told apart from your NEIGHBOURS'') live one register over. It is replaced by +8d, which the sweep reads apart from both neighbours. (2) THE DATE READING STOPS READING AND THE ABSENCE COUNTED AS RESOLUTION: at +87/+88 the latency population empties and the mean is None, and `None != baseline` read as MOVEMENT -- an instrument that had stopped reading, scored as resolution; the exact fail-open D28 closed for the other two knobs, live here because the rule that closes it was never called. (3) THE FLOOR IS TWO HARNESS CONSTANTS, AND ONE WAS DISCHARGED ONTO THIS REGISTER: the date reading saturates below at -19d = -(PAYMENT_TERMS_DAYS + DEFAULT_RECONCILIATION_GRACE_DAYS), and D30''s census recorded PAYMENT_TERMS_DAYS as `bounds_resolution: False` with the discharge ''it bounds the DETECTION-LATENCY dimension instead (D23/D24) ... and is registered there''. It was not registered there; the grace window is not even in the census''s subject, which comes off `build_scenario`''s AST while the grace enters at `score_triad`. CLOSED AT THE CLASS (R10): COUNTERFACTUAL_KNOB_ROUTE, keyset DERIVED from `score_triad`/`build_scenario`''s own signatures so a knob with no book-derived grid and no checker RAISES (the fallback IS the defect), with each named checker AST-verified to REACH the shared rule TRANSITIVELY -- naming it is not running it, Hour #11''s ''a lead is not a control'' in the shape this route could itself have taken; `collapsed_runs`/`undefined_drifts` deliberately NOT unioned into the sweep (they are what it is FOR, and adopting them puts the answer back into the question -- the older declaration fields still are); an undefined region admitted only as a WITNESSED bound, `reading is None` exactly where the population is empty (D24''s bound-vs-debt distinction generalised into the shared rule, and the differential is real: one seed still has a case at +87, reads a number, and its witness is a NON-empty population); and the floor PREDICTED from the constants alone (`predict_recon_floor_from_constants`, no book, no draw, no seed) and cross-checked against the sweep at -19. CAUGHT BY R15 ON THIS HOUR''S OWN FIRST DRAFT: `edge_constants` was a LABEL, not a claim -- the prediction was a fixed call, so declaring (''N_PERIODS'',) fired nothing; it is now built from the constants the entry NAMES, each perturbed one day, with a subset-attribution rule (D30''s class) and an unknown-constant rule. R15 both ways: 9 register mutations fire by name (the pre-Hour +7; a dropped run = 15 undeclared collapses; an invented run; an understated edge; a tail with no owner; a dropped and an invented undefined region; a constant reaching no knob; a subset attribution) and 2 source mutations (the grid put back the way it was -- 8 points, neither edge reachable, the undefined region invisible, 16 declarations unconfirmable; and a route whose checker only names the shared rule). R12: NO PUBLISHED NUMBER MOVED -- the detection gap, the latency mean and both belief figures are bit-identical; what moved is what the instrument admits about itself. The RESHAPE is atom D31_the_recon_grid_saturates_beyond_this_books_window, minted at L0. FULL TEXT: docs/staging/WORKER_FINDING_THE_SHARED_RULE_REACHED_TWO_OF_THREE_SWEEPS_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6 and #7 recorded, still ATOM H41''s class. HELD AT L2: thirteen Hours, thirteen defects, and this Hour changed the instrument again -- the next promoter runs Hour #14 on the corrected instrument, starting from the three leads in that document.'
map_notes:
  harden_note: 'HARDEN PASS RAN 2026-08-08 (commit 72ecfff7d); recorded here 2026-08-08 because the pass fixed code and tests but left the map cell silent -- the work was invisible to the map, and a silent cell is why the self-refill kept re-drawing this atom for a level move it cannot make. Delivered, both mutation-proven: (1) the DD-channel LEAK WITNESS was VACUOUS -- `n_flagged_non_dd_failures == 0` passes identically when the channel observes nothing at all as when it observes cleanly, so a vacuity guard now carries it (test_leak_witness_is_vacuous_without_its_channel_guard pins the defect the guard closes); (2) three silent `.get()` JOIN DROPS had no witness -- `value_date`/`invoice_ref`/`reference` key drift would have pushed the measured gap toward the no-skill baseline with nothing firing, so n_unjoined_dd_failures / n_unjoined_collection_misses / n_ageing_refs_matched are now asserted against a deliberate key drift. 24/24 green. NEW FINDING from the pass, reported not tuned (R12): the headline DETECTION gap is INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL -- `flagged_set` is a UNION, `n_flagged_via_dd_channel_only == 0` across seeds 7/11/23, so killing the DD channel outright leaves the published number bit-identical. Structurally reasonable (a rail failure means the cash did not arrive, which reconciliation also sees) but it means set-membership detection is blind to the only thing that channel buys: EARLIER detection. That test is labelled CHARACTERIZATION deliberately -- it pins a measured limit, not a contract, and is expected to fire if the channel ever starts contributing.'
  level_hold_note: 'HELD AT L2, NOT PROMOTED TO L3 (2026-08-08 tick, self-refill drew this 2->3 and the honest answer is no). L3 means Expert Hour says ''this is real''. Two of this scorer''s THREE published dimensions cannot carry that claim today: the AGEING dimension publishes background.gap_metric.misapplication_gap, which the D6 DISCOVER proved is a metric-shape defect and NOT EVIDENCE (a company finding 100% of real arrears at a 1.5% false-positive rate scores 1.50; holding company behaviour literally fixed and moving only prevalence swings the score 3.00->0.15) -- D6 closed that at the CLASS by stamping the caveat at source, but a disclaimed figure is a disclaimed figure, and D7_ageing_gap_metric_reshape is the atom that gives the dimension a shape that can be believed; and the DETECTION headline is single-channel-determined per harden_note above. depends_on D7 added so this is MECHANISED rather than exhorted -- the draw can no longer offer this atom a 2->3 it cannot honestly take, which is the churn that produced this tick. Reversal is one line: drop the depends_on when D7 lands. NOT a wall, and NOT a reason to tune the ageing number (R12). == HALF RELEASED 2026-08-08: D7 LANDED (L2), so reason (a) is GONE -- the ageing dimension now publishes three prevalence-invariant measures and is citeable. Reason (b) is untouched and is the whole of the remaining hold, so depends_on is RE-POINTED at D10_detection_headline_is_single_channel rather than dropped: leaving it aimed at a satisfied D7 would be a block naming a dead mechanism (a measured failure class here), and dropping it outright would hand the draw back the same 2->3 it still cannot honestly take. When D10 lands, re-read this note before promoting -- it should then be a genuine 2->3. == RE-READ AND RELEASED 2026-08-09: D10 LANDED (L2), so reason (b) is GONE and depends_on is DROPPED rather than re-pointed a second time -- there is no third reason to aim it at, and a block naming a satisfied atom is the dead-mechanism class this note already fell into once. WHAT THAT DOES AND DOES NOT MEAN: the 2->3 is now DRAWABLE and nothing procedural stands in front of it, but it is NOT taken here. L3 is the claim that this harness measures what it says it measures, and the same tick that released the hold also proved a sentence published on every surface this instrument feeds was WRONG (the detection residual is misallocation, not never-observed -- see D10 build_note). A promoter must run the Expert-Hour pass on the CORRECTED instrument, not on the reputation of the old one. Reversal is one line: the depends_on can be re-added. == EXPERT HOUR RAN 2026-08-09 (worker tick) AND THE ANSWER IS STILL NO -- HELD AT L2, and this time the reason is NEW, not inherited. The prior note released the procedural block (D7 and D10 both landed) and said a promoter must run the Hour on the CORRECTED instrument rather than the reputation of the old one. It ran. It found two limits in the DETECTION headline itself, both MEASURED this tick, neither previously named: (1) THE HEADLINE IS AN as_of ARTEFACT. `truth_set` is `result == ''failed''` -- a settled fact that does not move with the clock -- while `flagged_set` is a belief held AT `as_of`. Holding the company AND the world literally fixed (same records, same consumer, nothing re-simulated) and moving only the date the scorer asks on walks the published figure 0.0725 -> 0.1232, +70% over 60 days, seed 7. The companion detection_latency dimension was built on an EVER-KNEW population for exactly this reason and is invariant under the same sweep -- so the fix was applied to the neighbour and the headline was left behind. (2) THE HEADLINE COUNTS ONE ERROR DIRECTION. `detection_gap` is pure recall (1 - |S&D|/|S|), so `flagged_set` enters only through the intersection and enlarging it can never hurt: a company that flagged EVERY invoice scores a perfect 0.0. Its published baseline names only the opposite degenerate (''flag nobody -> 1''), which reads as