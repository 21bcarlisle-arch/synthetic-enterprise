  and the LEDGER was six days STALE (measured 2026-08-12T06:10:09Z), while the

  working tree carried the real measurement the door was generated from (measured

  2026-08-18T00:46:01Z, six minutes before it) UNCOMMITTED. The published artefact

  had been committed and its source record had not -- so #33''s "the committed pair

