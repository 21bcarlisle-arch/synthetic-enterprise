  - 'FIFTH HOUR, on the corrected instrument (2026-08-10), taken on `ageing` -- the criterion Hour #4 set in advance, the only dimension never given an Hour of its own: THE AGEING DIMENSION''S TRUTH SIDE WAS THE COMPANY ORGAN''S OWN FUNCTION. Not a hand-copy like D20 but the literal import (`from company.billing.arrears_engine import age_bucket as company_age_bucket`), applied to a days-overdue the scenario constructs to be the organ''s own integer -- world `issue = due - 14`, organ `due = issue_date + 14`. So the dimension whose whole subject is debt DATING could not see a company dating error: `wrong_bucket` measured 0 at every seed and under every drift tried, by CONSTRUCTION, and an edit to `age_bucket` moved the harness''s ground truth with it. R15''s TAUTOLOGY pattern in the direction nobody checks -- the wall is enforced company->sim; this is harness->company, the ground truth computed by the thing being graded. It hid under a COVERAGE_ONLY_CLAIM_CONTRACT exemption reading ''two different rules, not one rule over two coverages'' while this module''s own docstring, four hundred lines up, said ''Both sides use the IDENTICAL bucket function'' -- the control believed the exemption, so D20''s control was switched off for the dimension with the strongest mirror of the three. Two leads Hour #4 handed over were checked and NOT taken (the two structurally-zero error directions; the unattributed belief directions, still D8''s). CLOSED AT THE CLASS (R10): TRUTH_SIDE_RULE_OWNERSHIP, a register that is the CALL PATH not a declaration, + a control refusing any truth-side labelling rule owned by `company.*`; ageing enrolled in the coverage-only control (residual 0.000000 at HEAD on seeds 7/11/23 non-vacuous; organ-only 60->75 dating drift takes it to 0.3627/0.3194/0.3333); the harness''s own `_ageing_bucket` PINNED against the organ''s across 126 day values so a drift on either side fails by name -- the `AGEING_BUCKET_ORDER` discipline gap_metric already wrote down for the bucket ORDER and this dimension never applied to the bucket RULE. R15 both ways, and the mutation that reinstates the defect moves NO published number, which is why the control is about ownership rather than a value. Atom D21.'
  - 'SIXTH HOUR (2026-08-10), on the two leads Hour #5 handed over, and it is the second: THE AGEING ORDINAL HEADLINE COUNTS ONE DIRECTION. `mean_bucket_displacement` is a mean over the TRULY-OVERDUE population, so a company that dates every overdue invoice perfectly and dumps its ENTIRE current book into `90+` scores 0.000000 -- bit-identical to a perfect dater (n=4000, seeds 7/11/23, 10,758 cases changed), and so does one over-ageing by exactly ONE bucket. Third sighting of the DETECTION_DIRECTION_CONTRACT class, escaping the same way it escaped into `belief` (the register is keyed to detection scorers), so the SWEEP was the defect: CLOSED AT THE CLASS by HEADLINE_DIRECTION_COVERAGE, keyset DERIVED from what score_triad publishes, each dimension scored against its own indiscriminate degenerate through its own shipped scorer, R15 both ways + vacuity guard. Reshape is atom D22. FULL TEXT: docs/design/simplifications/H27_payment_belief_gap.yaml and docs/staging/WORKER_FINDING_THE_AGEING_ORDINAL_HEADLINE_COUNTS_ONE_DIRECTION_2026-08-10.md -- kept there rather than here because appending it in full put this atom 397 B over the 12288 B per-atom budget, which is ATOM H41''s class, not a new one: `expert_hour.findings` is the map''s next unbounded narrative flow after the two H41 named, and H41''s own exit criterion (2) already anticipates this field. INTERIM, recorded as interim: no record was laundered -- the full text is in the store record and the staged finding, which is where the control''s own message says growing prose belongs -- but the flow is still running and the next faithful Hour will red this again.'
  - 'SEVENTH HOUR (2026-08-10), on the corrected instrument, taken on `detection_latency` -- the only dimension never given an Hour of its own: THE INSTRUMENT CANNOT RESOLVE THE QUANTITY IT PUBLISHES. The reconciliation first-knowledge date is read by asking the organ on a grid of ONE candidate date per period at the harness''s own `due + grace` -- the very re-derivation the docstring claims R15 independence for avoiding. So `recon_lag_days` is the CONSTANT 5 (= `reconciliation_grace_days`, a harness input echoed back): a company that reconciles instantly, or flags an invoice a fortnight before it is due, publishes the same 5.0, and a one-day-SLOWER one is published as +21.0 (+1/+7/+21 bit-identical, seeds 7/11/23). Seven tests fire on a +1d organ mutation and NOT ONE names latency; on every improvement drift, none fire at all. CLOSED AT THE CLASS (R10) by ORGAN_QUERY_GRID -- each grid reading declares which company drifts it can and cannot see, re-measured every run and in the CLI, differential across a date reading and a set-membership reading (both go blind together, which is the evidence the GRID is the defect and not the latency formula); R15-proven on an inert probe, a repaired grid and an unowned declaration, with the repair direction failing BY NAME so the entry cannot outlive its debt. Declared `organ_reconciliation_drift_days` counterfactual + resolution caveat stamped AT SOURCE. The RESHAPE is atom D23 (not fixed on sight: it moves a published number on three pairs). FULL TEXT: docs/staging/WORKER_FINDING_THE_INSTRUMENT_CANNOT_RESOLVE_ITS_OWN_LATENCY_2026-08-10.md -- kept there for the same per-atom-budget reason Hour #6 recorded, still ATOM H41''s class.'
  - 'EIGHTH HOUR (2026-08-10), first of the three leads Hour #7 left: THE AGEING DIMENSION''S RESOLUTION IS THE HARNESS''S CALENDAR. Every truly-overdue invoice in the scenario is 30, 51 or 72 days overdue at `as_of` (arithmetic over FIRST_DUE_DATE, PERIOD_SPACING_DAYS, N_PERIODS and AS_OF_BUFFER_DAYS), so an ordinal bucket headline can only see a dating error that crosses a 30/60/90 boundary. Measured against a new declared counterfactual company (`organ_terms_drift_days` -- the supplier holds the wrong payment terms; world and truth-side rule untouched), n=300, seeds 7/11/23: a company dating every debt ONE TO EIGHT DAYS OLDER than truth publishes a BIT-IDENTICAL headline, and +1d and +12d collapse to one number -- while the detection dimension moves on every drift the ageing one cannot see, so it is a blindness rather than an inert probe. D23''s register could not reach it because that register is keyed to the RECONCILIATION date grid; this is the fourth escape of a register''s own keying. Closed at the class by DIMENSION_DRIFT_RESOLUTION -- keyset DERIVED from the published dimensions, three declared states (on-path blind / on-path sighted / off-path, the last required to name a probe MEASURED to move it), R15 both ways plus a source mutation, and an exact-band rule added after the control''s own first draft passed an under-stated band. The reshape is atom D25, minted at L0. HELD AT L2: eight Hours, eight defects, and this Hour changed the instrument again.'
  - 'FOURTEENTH HOUR (2026-08-11), on Hour #13''s lead 1 -- whether the resolution these registers sweep ever reaches the READER of the number. It did not, twice over, in ONE dimension. (1) WRONG SUBJECT: `ORGAN_QUERY_GRID[''recon_lag_days'']` names `mean_lag_days_without_dd_channel` in its own `headline_key` -- the DD-channel-DELETED sub-reading -- and resolves it day for day (measured exactly 1.000000/day). `organ_query_grid_caveat` reported that 1.0 as what ''is published'', stamped on `detection_latency`, whose published figure is `mean_lag_days` and moves 0.323530/0.364583/0.265487 per drift day on seeds 7/11/23 (n=300) -- so a reader converting a movement into days of company error UNDERSTATES it ~3x, by a ratio that is not a constant but the recon arm''s share of the latency population. (2) MISSING KNOB: `organ_terms_drift_days` is declared `in_causal_path: True` for this dimension since D28 with a measured band, and was stamped on NOTHING -- and it moves the headline BIT-IDENTICALLY to the recon knob at -3/-1/+1/+3/+5 on every seed, so the dimension whose subject is HOW LATE the company learns cannot say WHICH company error made it late. The reach grid itself had never been measured: 3 knobs x 5 dimensions, seven cells move, and the nine inert ones were inert only in the sense that nobody had asked. CLOSED AT THE CLASS (R10) by PUBLISHED_FIGURE_CAVEAT_CONTRACT -- keyset DERIVED both ways (`published_dimensions` x `counterfactual_knobs`) so an undeclared cell RAISES; every cell''s moves/inert MEASURED each run; every moving cell owing a caveat component a real `score_triad` must RENDER (naming is not stamping); and any declared step checked against the PUBLISHED headline''s own measured step rather than the register sentence that supplied it. Plus `predict_published_latency_step_days` (book-derived, no sweep/seed/re-scoring, AST-asserted to read neither scorer nor register, agreeing with the sweep on all three seeds; None never 0.0 on an empty population), the corrected caveat stating BOTH numbers and whose each is, and `latency_terms_resolution_caveat`. R15 both ways on nine mutations incl. the pre-Hour step republished, a moving cell with no caveat, a caveat the consumer never renders, both declaration directions, an undeclared cell and a missing/orphan dimension (raises), and a vacuity guard proven on a probe inside D29/D30''s saturated band. R12: NO published number moved. The RESHAPE -- a latency measure that can SEPARATE a terms error from a detector error -- is atom D32, minted at L0, not fixed on sight. FULL TEXT: docs/staging/WORKER_FINDING_THE_CAVEAT_CARRIED_A_SUB_READINGS_RESOLUTION_2026-08-11.md -- kept there for the per-atom-budget reason Hours #6/#7 recorded, still ATOM H41''s class. HELD AT L2: fourteen Hours, fourteen defects.'
