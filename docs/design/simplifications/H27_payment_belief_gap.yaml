  figure. Landed as e7a554d03: universe_size 1600 is the production book (the

  2026-08-17 fixture substitution was 276), and exactly ONE of the fourteen pairs

  moves -- this atom''s own -- the other thirteen byte-identical.


  OWED ITEM (2), SHIPPED: `site/proof/test_the_published_door_reproduces_its_ledger.py`

  (c7a1fdab0), the AUTOMATED CALLER `check_published_door_reproduces_the_ledger`

  had never had -- zero callers outside its own module, Hour #32''s no-caller class

  in its third instance. Site lane because that step fires on site/**, on any

  `generate_*_data` producer, and on a site-consumed ledger, i.e. on either

  subject; the tests/ gate selects by NAME STEM and would never run it. Landed in

