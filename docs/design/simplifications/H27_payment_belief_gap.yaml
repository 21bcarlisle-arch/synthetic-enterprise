- 'THIRTY-FIFTH HOUR (2026-08-18, worker tick, self-refill 2->3 HARDEN draw).

  THE LEVEL DOES NOT MOVE. `level_current` stays 2. Like #34 this was a targeted HARDEN

  pass working from the build''s own memory, not the fresh cold-eyes Expert Hour #31

  pre-committed as the promotion condition -- and it ends with a real finding either way,

  so the per-Hour defect rate on this instrument is 1.0 across seven consecutive Hours.


  THE FINDING, and it is about the Hour before this one. `site/proof/test_the_committed_generator_reproduces_the_published_door.py`

  had been on disk since 2026-08-15 06:34, collected and GREEN on every `pytest site/` run

  for three days, and existed in NO COMMIT ON ANY REF (`git log --all` on it: empty;

  `git ls-files --error-unmatch`: "did not match any file(s) known to git"; not ignored, so

  `--others` would have listed it and nothing was looking). TWO COMMITTED RECORDS RESTED ON

  IT: the finding doc `WORKER_FINDING_THE_PUBLISHED_DOOR_WAS_GENERATED_FROM_AN_UNCOMMITTED_TREE_2026-08-15.md`

  is filed "DISCHARGED in the tick that found it" and names that path FIRST in its

  `**Discharged:**` line -- a finding about an uncommitted artefact discharged by an

  uncommitted falsifier -- and Hour #34''s own shipped tripwire (c7a1fdab0) cites it BY NAME

  as the reason its subject partition is safe: "the site-lane control in

  test_the_committed_generator_reproduces_the_published_door.py compares the artefact with

  the GENERATOR and excludes the ledger as a subject on purpose." The committed

  justification for a shipped control''s scope pointed at a file no clone contains. The

  irony is the reason this is a class defect and not a slip: that file''s ENTIRE PURPOSE is

  CLAUDE.md''s IaC wall, "reconstruct-from-repo-alone", and it was itself state outside the

  readable repo.


  WHY NOTHING WAS RED -- a property of the gate, not an oversight. `tools/site_lane_gate.py`

  runs `pytest site/` and PYTEST COLLECTS FROM THE WORKING TREE, so an untracked green test

  is indistinguishable from a tracked one at the only moment anyone looks: collected,

  passing, counted, and printed as `[site-lane] OK site tests green`. Every existing site

  control asserts something about a rendered door; not one asked whether the controls

  themselves are things the repository has. The assurance was real on exactly one machine.

  One level in from WORKER_FINDING_THE_SITE_LANE_GATES_THE_WORKING_TREE_NOT_THE_COMMIT_2026-08-13:

  that one is about the SUBJECT the gate judges, this one about the JUDGES.


  BUILT, R10 at the class rather than the instance. (a) 5bd74ff48 -- the repair, landed

