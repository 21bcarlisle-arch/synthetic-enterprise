simplifications:
- "THIRTY-SECOND HOUR (2026-08-15 UTC, worker tick, LANE 1 BUILD draw on this atom).\nTHE LEVEL DOES NOT MOVE. `level_current` stays 2. The Hour ran, it was the Hour\nthis atom's own record specified, and it ends with three BLOCKING findings, so\nthe promotion condition #31 wrote down is not met.\n\nWHY THIS HOUR EXISTED, AND WHY ITS ANSWER COUNTS. Hour #31 corrected a false\nCLAIM shipping on every surface the detection figure feeds, then refused its own\n2->3 on the reasoning that \"an Hour cannot be its own confirmation\", and wrote\nthe honest promotion condition BEFORE the next Hour ran: \"an Hour that ends with\nno BLOCKING finding against the corrected instrument\". That ordering is what\nmakes this outcome a measurement rather than a negotiation -- the bar could not\nbe moved after the result was known. It is also the reason this record does not\nargue the findings down: #31 pre-committed, and #32 is bound by it.\n\nRun as a FRESH read-only instance with no memory of the build (`Write`/`Edit`\nabsent, not merely unused), which is what a cold-eyes pass on one's own lane\nrequires. Measured at HEAD f4144b4f0.\n\nWHAT THE HOUR CONFIRMED, so a later Hour need not re-buy it. The instrument's\nNUMBERS are sound. Every headline #31 asserted was re-derived INDEPENDENTLY --\nswept from `build_scenario` / `dense_drift_grid` / `score_triad` without calling\nthe measurement under test -- and reproduces exactly: interior pairs 86/86/86;\ncounted change points 38/34/32; excluded 62/63/61; silent-set moves 34/40/37;\nthe move-iff-it-touches-`S u N` predicate 258/258 with zero disagreements;\nexcluded band 212/209/213 of 900. The correction is in HEAD (2a9ea1c76, gate\nreceipt rc 0), the suite is 471 green, the caveat's numbers really are\ninterpolated (forcing the register to (5,5) moves the rendered sentence), R12\nholds (no scorer arithmetic touched), and the R13 premise holds (truth-side sets\ninvariant across the drift on all three seeds). The two D28 residuals #31 ruled\nnon-blocking are NOT among the findings below; every one of them is something\nelse.\n\nTHE THREE BLOCKING FINDINGS, filed as\n`docs/staging/WORKER_FINDING_THE_CORRECTED_SENTENCE_NEVER_REACHED_THE_READER_AND_ITS_CONTROL_HAS_NO_CALLER_2026-08-15.md`\n(severity BLOCKING, lane H_harness, class `no_caller_and_never_runs` -- whose\nclass lane is H_harness too, so it consolidates as a MEMBER rather than being\nrefused out of lane).\n\n1. THE CORRECTED SENTENCE IS ON NO PUBLISHED SURFACE. Live fetch of\n   `https://poesys.net/data/proof.json` (HTTP 200, 747,008 bytes, generated_at\n   2026-08-14T06:04:08Z) serves the UNCORRECTED clause verbatim at\n   `coupled_gaps.pairs[5].components.drift_resolution_caveat`; the corrected\n   phrases score zero on the live payload. The corrected string exists only in\n   the git INDEX and working tree -- `git show :site/data/proof.json` finds it,\n   `git show HEAD:site/data/proof.json` does not. Staged, uncommitted,\n   unpublished: the consumer landed and the supplier did not, one day after this\n   atom's own record logged that exact shape as a defect. The test cited as\n   \"R11's shape on a sentence\" asserts against an in-process object, which is\n   why it could not catch this -- R11 wants the fetched surface.\n\n2. R15 FAIL-OPEN, and the control's own error message names the move it cannot\n   see. `tools/couple_w2_11_d5.py:8777` compares by CONTAINMENT\n   (`declared[0] <= got[0] and got[1] <= declared[1]`) while its docstring says\n   it \"requires that the DECLARATION match the BOOK\". Declaring all three bands\n   (0, 86) returns no violation, and the caveat then publishes the widened band\n   as its own cause -- \"steps at 0-86 ... and at only 0-86\" -- destroying the\n   entire contrast the sentence exists to draw. The string it cannot emit ends\n   \"never widen the band to fit\". All four band mutation cases narrow or shift;\n   NONE widens, so \"R15 both ways\" was proven only in the direction that cannot\n   hide a defect. Second fail-open on the same loop: `if declared is None:\n   continue` -- an omitted band is not a violation.\n\n3. NO CALLER ON ANY RUN THAT PUBLISHES THE SENTENCE, and R10 makes it a class\n   fix. Repo-wide, outside `tests/`, `check_detection_interior_change_points`\n   has TWO mentions and both are comments. AST census: 15 `check_*` defined, 10\n   called in `main()`, this one among the 5 that are not -- while its three\n   resolution siblings are all called, and print their verdicts BEFORE the\n   `if args.write_ledger:` branch that publishes the caveat. Two shipped\n   comments (:4120, :8864) assert it is \"re-derived every run\" / \"on trial every\n   run\"; both are false as shipped. The decay path is concrete: the pre-commit\n   gate selects by NAME STEM, so these tests run only when this module changes,\n   yet the bands are properties of a book built from\n   `simulation/payment_behaviour_source.py` and\n   `company/billing/payment_observation_consumer.py`.\n\nTHE R10 POINT, stated plainly because it is the reason this is not just wiring.\nHour #30's note in this very record calls a no-caller control on this instrument\n\"the SECOND ... a rate, not an incident\", and records the class CLOSED because\n\"the grader has a caller on every publish\". This is the THIRD, shipped one Hour\nafter that closure. R10 forbids closing an absurdity-class defect with an\ninstance fix, and the receipt for why is now on disk. The discharge is therefore\ntwo-part: wire the call AND add the automated census that every `check_*` in this\nmodule is reachable from `main()`. The 5-of-15 gap measured here is that\ncensus's first population, and the other four uncalled checks\n(`check_door_row_surfaces`, `check_published_figure_caveat_coverage`,\n`check_published_resolution_floor`, `check_scenario_constant_census`) must be\ndispositioned by it rather than left unnamed.\n\nALSO FOUND, not blocking. LATENT: `DIMENSION_DRIFT_RESOLUTION[\"detection\"][\"why\"]`\nstill hard-types \"61-63\"/\"86\"/\"32-38\"/\"34-40\" as literal prose beside the band\nfields it could interpolate from -- so of the \"two sentences now interpolated\nrather than typed\", only one is; LATENT rather than BLOCKING because `why`\nreaches no reader (zero hits in the live payload and under `docs/observability/`\nand `site/data/`). LATENT: half of \"258/258\" is arithmetic rather than evidence\n(a step wholly inside the excluded band cannot move either rate by\nconstruction) -- no action, the docstring already says so, recorded only so a\nlater Hour does not read it as stronger than it is. RECORDED: \"63 distinct\ndistances\" does not reproduce -- 212 past grace confirmed, but the distinct\ncount is 73 (70-73 under every reasonable restriction); 63 is the seed-11\nEXCLUDED CHANGE-POINT count, so the prose conflates two quantities. Narrative\nonly, nothing published moves.\n\nONE DISCLOSURE ABOUT THE HOUR'S OWN FOOTPRINT. A bare\n`pytest tests/tools/test_couple_w2_11_d5.py` rewrites\n`docs/observability/coupled_gap_ledger.json` -- a test run silently\nre-publishing into the supplier of a public door, a lead Hour #30 left open and\nwhich lives in this atom's own file_scope. The Hour's run did that. It was NOT\nrestored, deliberately: by the time the Hour reported, a concurrent lane had\nrewritten the file again (md5 ac003306d, matching neither the pre-run snapshot\ne50a5bf26, nor the post-run 10405d458, nor HEAD 29195a5e0), so restoring the\nsnapshot would have clobbered another lane's live write on the shared tree --\nthe worse defect. Snapshot preserved at `/tmp/ledger_before_expert_hour.json`\nfor whoever takes the isolation fix; the file should not be swept into a commit\nas-is.\n\nWHAT WOULD MAKE IT AN HONEST 3, unchanged from what #31 wrote and now with three\nnamed obstacles instead of none: an Hour that ends with no BLOCKING finding\nagainst the corrected instrument. Take finding 1 first and alone -- it is a\nregenerate-commit-publish-refetch with no design in it, it is the only one a\nreader is currently harmed by, and it discharges against a live fetch rather\nthan a test.\n"
map_notes:
  harden_note: 'HARDEN PASS RAN 2026-08-08 (commit 72ecfff7d); recorded here 2026-08-08 because the pass fixed code and tests but left the map cell silent -- the work was invisible to the map, and a silent cell is why the self-refill kept re-drawing this atom for a level move it cannot make. Delivered, both mutation-proven: (1) the DD-channel LEAK WITNESS was VACUOUS -- `n_flagged_non_dd_failures == 0` passes identically when the channel observes nothing at all as when it observes cleanly, so a vacuity guard now carries it (test_leak_witness_is_vacuous_without_its_channel_guard pins the defect the guard closes); (2) three silent `.get()` JOIN DROPS had no witness -- `value_date`/`invoice_ref`/`reference` key drift would have pushed the measured gap toward the no-skill baseline with nothing firing, so n_unjoined_dd_failures / n_unjoined_collection_misses / n_ageing_refs_matched are now asserted against a deliberate key drift. 24/24 green. NEW FINDING from the pass, reported not tuned (R12): the headline DETECTION gap is INSENSITIVE TO THE ENTIRE DD-OBSERVATION CHANNEL -- `flagged_set` is a UNION, `n_flagged_via_dd_channel_only == 0` across seeds 7/11/23, so killing the DD channel outright leaves the published number bit-identical. Structurally reasonable (a rail failure means the cash did not arrive, which reconciliation also sees) but it means set-membership detection is blind to the only thing that channel buys: EARLIER detection. That test is labelled CHARACTERIZATION deliberately -- it pins a measured limit, not a contract, and is expected to fire if the channel ever starts contributing.'
  level_hold_note: 'HELD AT L2, NOT PROMOTED TO L3 (2026-08-08 tick, self-refill drew this 2->3 and the honest answer is no). L3 means Expert Hour says ''this is real''. Two of this scorer''s THREE published dimensions cannot carry that claim today: the AGEING dimension publishes background.gap_metric.misapplication_gap, which the D6 DISCOVER proved is a metric-shape defect and NOT EVIDENCE (a company finding 100% of real arrears at a 1.5% false-positive rate scores 1.50; holding company behaviour literally fixed and moving only prevalence swings the score 3.00->0.15) -- D6 closed that at the CLASS by stamping the caveat at source, but a disclaimed figure is a disclaimed figure, and D7_ageing_gap_metric_reshape is the atom that gives the dimension a shape that can be believed; and the DETECTION headline is single-channel-determined per harden_note above. depends_on D7 added so this is MECHANISED rather than exhorted -- the draw can no longer offer this atom a 2->3 it cannot honestly take, which is the churn that produced this tick. Reversal is one line: drop the depends_on when D7 lands. NOT a wall, and NOT a reason to tune the ageing number (R12). == HALF RELEASED 2026-08-08: D7 LANDED (L2), so reason (a) is GONE -- the ageing dimension now publishes three prevalence-invariant measures and is citeable. Reason (b) is untouched and is the whole of the remaining hold, so depends_on is RE-POINTED at D10_detection_headline_is_single_channel rather than dropped: leaving it aimed at a satisfied D7 would be a block naming a dead mechanism (a measured failure class here), and dropping it outright would hand the draw back the same 2->3 it still cannot honestly take. When D10 lands, re-read this note before promoting -- it should then be a genuine 2->3. == RE-READ AND RELEASED 2026-08-09: D10 LANDED (L2), so reason (b) is GONE and depends_on is DROPPED rather than re-pointed a second time -- there is no third reason to aim it at, and a block naming a satisfied atom is the dead-mechanism class this note already fell into once. WHAT THAT DOES AND DOES NOT MEAN: the 2->3 is now DRAWABLE and nothing procedural stands in front of it, but it is NOT taken here. L3 is the claim that this harness measures what it says it measures, and the same tick that released the hold also proved a sentence published on every surface this instrument feeds was WRONG (the detection residual is misallocation, not never-observed -- see D10 build_note). A promoter must run the Expert-Hour pass on the CORRECTED instrument, not on the reputation of the old one. Reversal is one line: the depends_on can be re-added. == EXPERT HOUR RAN 2026-08-09 (worker tick) AND THE ANSWER IS STILL NO -- HELD AT L2, and this time the reason is NEW, not inherited. The prior note released the procedural block (D7 and D10 both landed) and said a promoter must run the Hour on the CORRECTED instrument rather than the reputation of the old one. It ran. It found two limits in the DETECTION headline itself, both MEASURED this tick, neither previously named: (1) THE HEADLINE IS AN as_of ARTEFACT. `truth_set` is `result == ''failed''` -- a settled fact that does not move with the clock -- while `flagged_set` is a belief held AT `as_of`. Holding the company AND the world literally fixed (same records, same consumer, nothing re-simulated) and moving only the date the scorer asks on walks the published figure 0.0725 -> 0.1232, +70% over 60 days, seed 7. The companion detection_latency dimension was built on an EVER-KNEW population for exactly this reason and is invariant under the same sweep -- so the fix was applied to the neighbour and the headline was left behind. (2) THE HEADLINE COUNTS ONE ERROR DIRECTION. `detection_gap` is pure recall (1 - |S&D|/|S|), so `flagged_set` enters only through the intersection and enlarging it can never hurt: a company that flagged EVERY invoice scores a perfect 0.0. Its published baseline names only the opposite degenerate (''flag nobody -> 1''), which reads as though 0 were earned. Measured on this population: 44-51% of everything the company flags is an invoice that truly SUCCEEDED (seed 7: 101 false flags, 0.0951 over the truly-current population) -- and that is the SAME 101/1062 D7''s `overstated_arrears_rate` already reports on the ageing dimension. The error direction was visible one dimension over and invisible here. L3 means ''no major flaws''; a headline that moves 70% when only the clock moves, and that cannot distinguish a precise company from an indiscriminate one, is two. WHAT THIS TICK DELIVERED INSTEAD OF THE PROMOTION (HARDEN work, R12: the detection gap is byte-identical at 0.09547325102880659 before and after -- nothing was tuned): the caveat is stamped AT SOURCE in `background.gap_metric.detection_gap` (the D6 precedent), so it lands on all THREE coupled triads that call it, not just this one; `n_false_flags`/`false_flag_rate` now ride beside the score on their own denominator (None, never 0, when the universe is unknown -- a 0 there would be the strongest possible claim handed out for free); both limits print with the headline at the CLI and in the LIVE ledger note the Proof door reads; and the ARTEFACT CLASS is closed per R10 by `DIMENSION_AS_OF_CONTRACT` + `test_every_dimension_declares_its_as_of_contract_and_the_declaration_is_measured`, which sweeps as_of for real and holds every dimension to ''truth invariant => gap invariant''. It is deliberately DIFFERENTIAL (ageing is exempt because an invoice really does age -- a blanket rule would false-positive there and teach everyone to skip the gate) and R15-proven by mutating the SOURCE twice: flipping detection''s declared invariance fires it with the real drift, and stripping the fix-atom name from its exemption fires the named-debt assertion. Also closed: `measure_and_write` -- the path that actually PUBLISHES to coupled_gap_ledger.json -- had NO test in this repo, so every word of its note was unexercised; it now renders under test. depends_on is re-pointed at D11_detection_gap_is_recall_only, which is the whole of the remaining hold. Reversal is one line: drop it when D11 lands. NOT a wall, and NOT a reason to tune the detection number (R12). == RELEASED 2026-08-09 (worker tick): D11 LANDED at L2, so the whole of the remaining hold is discharged and depends_on is DROPPED rather than re-pointed a third time -- there is no fourth reason to aim it at, and a block naming a satisfied atom is the dead-mechanism class this note has already fallen into twice. THE 2->3 IS NOW DRAWABLE AND IT IS NOT TAKEN HERE, for the same reason the 2026-08-09 release did not take it: the instrument changed again, and more than it did last time. The detection headline is a DIFFERENT MEASURE from the one every prior Expert Hour looked at -- a balanced error over an ever-flagged population, with a false-flag denominator that excludes legitimately-flagged late payers -- and the number it publishes went 0.0725 -> 0.0134 on seed 7 for reasons that are all reshape and no company change. An Hour run on the OLD instrument''s reputation would be exactly what the previous release warned against, so whoever takes this to L3 runs it on the CORRECTED instrument and should start at D11''s own registered open question: `missed_failure_rate` is structurally 0.0000 on every population this repo scores, so the headline is currently half a measurement, and whether that is acceptable at L3 is a judgement call this build declined to make on the promoter''s behalf. Reversal is one line: the depends_on can be re-added. == EXPERT HOUR RAN AGAIN 2026-08-09 (worker tick) ON THE CORRECTED INSTRUMENT, AS THE PREVIOUS RELEASE DEMANDED, AND THE ANSWER IS STILL NO -- HELD AT L2 on a NEW reason. It did start where D11''s registered open question said to (missed_failure_rate structurally 0.0000, so the balanced error is currently half a measurement), and that question is real but is NOT what holds this atom: it is a property of a world where reconciliation catches every failure at due+grace, honestly declared, and D11 already proved the direction CAN fire by mutation. What holds the atom is what the Hour found next, MEASURED case by case at seeds 7/11/23 and across two grace windows: THIS INSTRUMENT PUBLISHES ONE NAMED QUANTITY AS TWO DIFFERENT NUMBERS. ''The wrongful-dunning exposure'' is printed twice in a single output block -- detection''s false_flag_rate 0.0269 (21 of 782) and ageing''s overstated_arrears_rate 0.0951 (101 of 1062), 3.5x apart, sharing SEVEN cases -- and `background/gap_metric.py` asserted in prose that they were ''literally the same numerator''. They are not. The two denominators stand in an EXACT containment (1062 == 782 + 280) because D11 established that an invoice paid past its grace date really WAS unpaid past grace, so flagging it was CORRECT, and applied that exclusion to the DETECTION dimension only: 94 of ageing''s 101 false ageings land in the 280-case excluded band, i.e. 93% of one dimension''s published wrongful-dunning exposure is made of cases the sibling dimension of the same instrument holds the company was RIGHT about. The belief sides differ too (detection EVER-FLAGGED, 439; ageing the as_of snapshot, 229). L3 is the claim that this harness measures what it says it measures; an instrument that says one thing twice and means two different things does not carry that claim, and a director or Proof-door reader taking either figure as ''what wrongful dunning costs this company'' is misled by whichever one they read. NOTE ON PROVENANCE (R9, inferred not observed): the identity claim was recorded against the PRE-D11 instrument and D11''s own reshape moved one side of it in the same change without updating the sentence -- whether it held exactly before D11 has not been re-measured here. WHAT THIS TICK DELIVERED INSTEAD OF THE PROMOTION (HARDEN, R12: no published number moved -- the detection balanced error is 0.0134 and the ageing measures are unchanged): (1) the false identity claim is CORRECTED AT SOURCE with the case-level decomposition, not reworded; (2) the CLI `--write-ledger` path was still overwriting the measured note with the REFUTED ''fraction of true payment failures the company never observes -- the no-remittance blind spot'' sentence, into the SAME bare ledger key the live path writes correctly, so whichever ran last decided what the Proof door showed -- the live sibling was fixed on 2026-08-09 and this one was left behind (the sibling-half class again). It now APPENDS to the measured note instead of clobbering it, and has the test it never had; (3) the CLASS is closed per R10 by `SHARED_QUANTITY_CONTRACT` + its control, which derives both sides from the two SCORERS'' own components (no recomputation -- R15 independence), measures the declared containment across seeds AND grace windows, requires an undeclared divergence to name an owning atom, and sweeps the RENDERED summaries so a third dimension printing the phrase unregistered FAILS. R15 both ways: the register is proven falsifiable on two lies (declaring the populations coincident; declaring equal denominators), the phrase sweep is proven to fire on a de-registered real emitter, and a missing dimension RAISES rather than comparing what is left. The containment is declared EXACT deliberately so that D16 landing BREAKS the declaration and forces a rewrite rather than slipping past a loosely-phrased control. depends_on is re-pointed at D16_ageing_negative_population_is_unexcluded, which is the whole of the remaining hold. Reversal is one line: drop it when D16 lands. NOT a wall, and NOT a reason to tune either number (R12). == RELEASED 2026-08-09 (worker tick): D16 LANDED at L2 and depends_on is DROPPED and NOT RE-POINTED -- the note above has already fallen into the dead-mechanism class twice by aiming a satisfied block at the next thing, and there is no fourth reason to aim it at. THE 2->3 IS DRAWABLE, UNBLOCKED, AND NOT TAKEN HERE, for the reason every prior release gave and this tick has the least right of all to ignore: THIS tick is the one that changed the instrument. D16 renamed a published quantity (the ageing dimension no longer publishes ''the wrongful-dunning exposure'' -- that name now has exactly one owner) and moved the number under it 0.0951 -> 0.0090 on seed 7, all reshape and no company change. An Expert Hour run by the tick that built the change is the reputation-of-the-old-instrument problem in its purest form. The next promoter runs the Hour fresh, and should start where this build declined to go: D17_d8_counterfactual_has_no_unattributed_residual, minted this tick, is a limit in a measure that rides in THIS atom''s own ledger note -- the D8 remittance counterfactual now attributes 100% of every measure it publishes, because the residual its anti-rubber-stamp guard rested on was made of the very cases D16 excluded. That guard currently guards nothing. == D17 LANDED 2026-08-09 (worker tick, L0->L2) AND THE POINTER THIS NOTE HANDED THE NEXT PROMOTER IS DISCHARGED: the anti-rubber-stamp control no longer rests on a residual the world happened to supply -- it rests on an INJECTED belief error no invoice reference can cure (a credit the bank feed never DELIVERS to either book), which leaves the ageing overstatement 0.4444 attributed and the false-flag rate 0.7059 rather than 1.0, and is R15-proven both ways against a shadow company clean BY CONSTRUCTION. The 100%-attribution reading is published AT SOURCE as a property of the observation channel, never a pass mark. THAT DOES NOT PROMOTE THIS ATOM: the Hour is still un-run on the corrected instrument, and D17 changed what this atom''s own ledger note says, so the reputation-of-the-old-instrument warning above applies to it too. NOT a wall, and NOT a reason to tune either number (R12). == D19 LANDED 2026-08-10 (worker tick, L0->L2) AND THE BELIEF HEADLINE IS A DIFFERENT MEASURE FROM THE ONE EVERY PRIOR EXPERT HOUR LOOKED AT. Hour #3 (2026-08-10, commit 0470e50f9) held this atom at L2 on a measured flaw in a third published headline -- the belief dimension was a population-TV distance, so permuting which account held which severity belief moved it by exactly zero and the degenerate ''right mix, every individual wrong'' scored what the real company scored. That flaw is now CLOSED at the measure: the headline is a balanced PER-CASE error over both directions on their own denominators, the permutation sweep comes out MOVED (0.1338 -> 0.5007 at seed 7, i.e. the degenerate now scores the no-skill baseline), and the published number went 0.0700 -> 0.1338 for reasons that are all reshape and no company change. The TV figure is not deleted -- it is published as `belief_population_mix`, the question it was always answering. THE 2->3 IS DRAWABLE, UNBLOCKED, AND NOT TAKEN HERE, and this tick has the least right of any to take it: THIS is the tick that changed the instrument, which is the reputation-of-the-old-instrument problem in its purest form and the reason every previous release gave. No depends_on is added and none is needed -- there is no unbuilt blocker to aim one at, and pointing a block at a satisfied atom is the dead-mechanism class this note has already fallen into twice. The next HARDEN draw of this atom IS Hour #4, on the corrected instrument, and it should start where this build declined to go: (1) the belief dimension''s overcall direction is structurally 0.0000 on every population this repo scores -- honestly declared and mutation-proven able to fire, but it makes the balanced headline half a measurement, and whether that is acceptable at L3 is the same judgement D11 left open for detection, now open on two dimensions of one instrument; (2) the D8 remittance counterfactual''s _ATTRIBUTED_MEASURES still covers ageing and detection only -- the belief dimension now HAS per-case direction rates to attribute and none of them is attributed, so this instrument''s own ledger note explains less of itself than it appears to. NOT a wall, and NOT a reason to