  \ rule 7 makes DISCOVER/FRAME available on a parked atom\nwhile BUILD is not. Output is this record.\
  \ Everything below is `observed-with-evidence`\nunless labelled otherwise (R9).\n\nMEASUREMENT HYGIENE\
