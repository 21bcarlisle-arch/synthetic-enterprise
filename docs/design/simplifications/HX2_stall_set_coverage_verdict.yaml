simplifications:
- '2026-07-27 MINTED as a DRAWABLE ATOM from DIRECTOR_RULING_HARNESS_EXIT_CRITERION_RATIFIED_2026-07-27 (WORK THIS CREATES item 2; the director RETURNED this as a PROBLEM, not a prescription -- section 3). Director-COMMANDED but H_harness off-front with enforcement ON: BUILD-excluded until a per-atom BUILD_OPEN is ledgered (director-console-only, R16; see blocked_on). The proposed stall-class set (proposal doc: idle-turn-with-atoms, draw-failure/map_exhausted while work exists, director-hand-types-next-atom, HARDEN-while-content-unminted, later-ruled-reversible [ACT]) may NOT cover four events that ACTUALLY HAPPENED in the last four days. For EACH, produce a verdict backed by evidence: (E1) EMERGENCY CONSOLE RESCUE -- a granted terminal turn because the machine could not otherwise recover; the proposed set names "director hand-types the next atom" which may NOT cover a recovery rescue (arguably the single strongest stall signal). (E2) PUBLISH-GATE WEDGE >1h -- four occurred, two correlated with the tick going quiet behind them. (E3) ORIGIN FREEZE / PUSH-FAILURE >30min -- the phantom-push incident froze origin 3.5h while the machine believed itself healthy (see [[feedback_self_verifying_push]]). (E4) ADVISOR RULING WHOSE PURPOSE IS RESTARTING STALLED WORK -- binds the advisor (coherence ruling section 4): if the machine must be doorbelled awake by a staged document, the counter resets. EXIT CRITERIA (R15): (1) each of E1-E4 has a WRITTEN verdict -- detected (cite the existing detector), detector-added (cite the new detector + its test), or argued-not-stall-class (cite evidence); (2) any ADDED detector is R15 mutation-proven -- it FIRES on a synthetic instance of its named event and does NOT fire on the benign look-alike (e.g. a legitimate director DECISION-class touch, which is explicitly unrestricted, must NOT trip the console-rescue detector -- the stall/decision split the ruling praises); (3) the stall-class set consumed by HX1 is the UNION of prior detectors + these verdicts, enumerated in one place so HX1 cannot silently miss a class (FAIL-SILENT guard). This atom is HX1''s named dependency (feeds its stall-class input). Level moves blocked_on director_level_up (R16).'
- '2026-07-29 blocked_on CLEARED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 1+2): director_build_open/director_level_up are abolished as BLOCK TYPES -- there is no such thing as needing a build opened, and levels are proposed+recorded (ledger-backed, self-certification via background.gate_authorization.record_level_up_self_certified now suffices, R16), never gated. Prior blocked_on/block_reason preserved above/below for the record; this atom re-enters the normal draw for whichever lane/loop_stage it already carries.'
- '2026-08-03 BUILT, L0->L2 (worker tick). ADOPTED, NOT REBUILT: background/stall_class_register.py (693 lines) + tests/background/test_stall_class_register.py (447) were written in a fork that DIED BEFORE COMMITTING and were recovered as untracked files (WORKER_FINDING_DEAD_FORK_RESCUE_AUDIT_2026-08-03). Adopted but NOT merged blind -- every named detector was re-resolved against main''s real code, both UNCOVERED claims were re-verified against supervisor.py and action_needed.py rather than taken on the fork''s word, and all 8 mutations were re-run. Verdicts, with evidence, in docs/design/HX2_STALL_SET_COVERAGE_VERDICT.md: (E1) console rescue -- NOT directly detectable in this repo and that is STRUCTURAL, since director_input_log.py writes console turns to the PRIVATE ops repo, so covered by meaningful_progress_gap as a deliberately OVER-INCLUSIVE proxy (G5: never under-counts); (E2) publish-gate wedge >1h -- ALREADY DETECTED, supervisor._publish_gate_wedge_active fires at exactly the director''s bar (PUBLISH_GATE_WEDGE_MIN_AGE_SECONDS == 3600, verified live), ADAPTED not rebuilt so a second definition of wedged cannot drift from the one the supervisor acts on; (E3) origin freeze >30min -- DETECTOR ADDED, threshold == process_run_complete.PUSH_THROTTLE_SECONDS so a freeze at the bar means a whole push cycle produced no advance; (E4) advisor restart ruling -- DETECTOR ADDED, carrying channel so an advisor-bridge ruling is distinguishable from an NTFY steer.'
- '2026-08-03 THE DETECTORS WERE RUN AGAINST REAL HISTORY, not only synthetic fixtures, and recovered both known incidents UNPROMPTED. The 42h pending-batch deadlock: a 1786-min (29.8h) gap ended 25 min after the advisor-bridge input ''[DIRECTOR-RULING][ADVISOR-STAGED] EIGHTH CLASS -- pending-batch deadlock'' (9 stall events in the 07-24..07-28 window, 7 attributed to the bridge). The 4-day publish blackout: a 5907-min (98.4h) gap, 07-30 01:37 -> 08-03 03:05, unattributed to any director input, resumed by 1325f2bb9 ''fix(publish gate): an RNG-derived literal wedged publishing for 4 days''. Nothing told the detector either incident existed. ONE NON-OBVIOUS CORRECTION this required: a commit that merely STAGES a director/advisor document is INPUT, not the machine''s output -- without that exclusion the advisor''s own staging commit counted as the machine resuming work and so HID THE VERY RESCUE IT WAS. Counting a doorbell as progress makes a doorbelled stall undetectable by construction (test_a_staging_commit_is_input_not_progress).'
- '2026-08-03 R15 BOTH WAYS -- 8 mutations, each firing EXACTLY its own named test, baseline restored green 28/28. A register OF stall classes is itself a control, so this is the acceptance, not decoration: (M1) staging commit counts as progress -> test_a_staging_commit_is_input_not_progress; (M2) attribution window unbounded -> test_input_long_before_resumption_is_not_credited_as_the_rescue; (M3) git unreadable returns [] -> test_git_unreadable_is_unavailable_not_clean; (M4) vanished detector silently ignored -> test_registry_fails_loud_when_a_named_detector_vanishes; (M5) origin unreachable reads clean -> test_origin_unreachable_is_unavailable_not_clean; (M6) freeze threshold ignored -> test_origin_freeze_quiet_inside_the_push_throttle; (M7) uncovered classes omitted -> test_uncovered_classes_are_named_not_omitted; (M8) wedge adapter always fires -> test_wedge_adapter_quiet_below_the_bar. All three killer patterns are covered explicitly: FAIL-OPEN (M3/M5), FAIL-SILENT (M4/M7), TAUTOLOGY (the freeze detector reads git ls-remote and NEVER the local tracking ref -- the tracking ref is the very thing that goes stale in a phantom push, so reading it would be checking the phantom against the phantom; pinned by test_origin_freeze_never_reads_the_local_tracking_ref). The benign-look-alike half the ruling demands is test_quiet_on_a_director_decision_during_healthy_progress: an input arriving while meaningful commits flow produces NO event, which is the stall/decision split mechanised rather than exhorted.'
- '2026-08-03 THE PROPOSAL''S OWN CLAIM WAS FALSE, and that is the finding. HARNESS_EXIT_CRITERION_PROPOSAL_2026-07-27 section 2 listed five stall classes and asserted ''Each has an existing detector''. Checked against real code this tick, THREE of the five did not. The set is now 9 classes, 7 with a live detector, enumerated in ONE place (STALL_CLASSES) so HX1 cannot silently miss a class, with resolve_detectors() raising on a renamed/deleted detector so it fails LOUDLY instead of degrading into a quietly smaller set. TWO NAMED HOLES REMAIN OPEN, listed as detector=None and reported UNCOVERED rather than omitted (an omitted class is invisible; a named hole is auditable): harden_while_content_unminted -- supervisor.py:1957 _unconsumed_director_ruling_or_steer is a SUPPRESSOR gating the Rule-0 HARDEN tier at :3575, and suppression leaves NO event record, so a span cannot be audited for it; act_later_ruled_reversible -- action_needed.resolve_item stores the director''s answer text but no reversibility verdict, so ''later ruled reversible'' is not machine-readable. LOAD-BEARING CONSEQUENCE, deliberately not softened: while either hole is open, A ZERO STALL COUNT IS NOT PROOF OF A CLEAN SPAN and HX1 must not treat it as one.'
- '2026-08-03 L2 NOT L3, residuals named. Wired live and R11-verified to the RENDERED value, not the code: daily_self_note.render_note() was actually run and emits the line ''Stall-set coverage: 7/9 classes have a live detector -- UNCOVERED: harden_while_content_unminted, act_later_ruled_reversible'' in amber, so the hole is visible every morning rather than discovered when someone wants to claim the harness is done. THREE RESIDUALS HOLD L3: (a) expert_hour is not_attempted; (b) HX1 -- the only consumer -- DOES NOT EXIST YET, so criterion 3''s FAIL-SILENT guard is enumerated but its load-bearing effect is untested end-to-end, and an unconsumed register is exactly the orphan-transition shape R11 forbids claiming as done; (c) the two UNCOVERED classes above, which are HX1 scope by this atom''s own text but still cap what the count can prove. R12: nothing here is a fidelity/maturity/product-quality measure -- it gates ONE decision, may harness investment resume, and a count of stall classes is a DIAGNOSTIC never a target to drive to zero.'
