  evidence:
  - docs/staging/done/DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08.md
  - '2026-08-09 BUILT L0->L2. Mechanism: background/pull_forward_proposal.py. THE CASE is derived, never curated -- a parked atom (loop_stage: idle) that has accreted >=1 FUT1 forward attachment is ripe by construction, and its attachment ledger IS the case; ripeness is deliberately NOT a wording match on block_reason, because an under-reporting index authorises its own omissions. Rendering docs/design/PULL_FORWARD_PROPOSALS.md (generated, --check fails if it and the derivation disagree). THE DOOR has three properties, each mutation-proven: (a) SILENCE NEVER RELEASES -- there is no clock anywhere in the release path (release_verdict/verify_release/apply_release/director_sources accept no now/max_age/since/deadline/timeout, asserted structurally by test_no_clock_can_reach_the_release_path), so a proposal open forever resolves PENDING identically to one opened a second ago; (b) THE VERDICT IS RE-DERIVED, NEVER TRUSTED -- apply_release re-reads the director''s own docs and refuses a handed-in verdict that does not survive verify_release; (c) FAIL-CLOSED -- an absent/unreadable/undecodable source withholds the release and is reported as blind_scan (an unavailable check is a FAILED check, and for a true door failed means shut). NO NEW CHANNEL: the director''s word is read from docs/staging/from_rich_*.md (ntfy IS him) and any [DIRECTOR-RULING] doc incl. the advisor bridge -- no PIN, no signature, no syntax to learn; he names the atom and says unblock it. Negation is guarded (over-recognition is the dangerous direction for a door): ''do not unblock EP7...'' is not consent. R11 no-orphan-transition: the release moves the atom loop_stage idle->build (the draw''s own condition) and DELETES the now-false block_reason, by TEXT surgery reusing tools.merge_atom_status helpers so the other 229 hand-authored atoms keep their bytes. R15 PROVEN BOTH WAYS, three source mutations: a timeout branch that auto-releases on age kills 18 tests; verify_release->[] (the door opens on whatever