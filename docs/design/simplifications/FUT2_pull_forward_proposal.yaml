  - '2026-08-19 HARDENED at L2 (level STAYS 2, loop_stage stays verify). THE DOOR WAS BYPASSED, NOT DEFEATED, AND THE MAP HAD NO WAY TO SAY SO. EP6_wall_protocol_typing was moved idle->build by a hand-authored block_reason_discharged: citing the director''s instruction of 2026-08-19 naming EP6 for promotion. Measured by THIS module rather than by grep, which is the evidence that matters: release_verdict(EP6) = released False over 381 director sources with unreadable_sources [] -- a COMPLETE scan reporting silence, not a blind one reporting nothing. The transition never came through apply_release at all, and that is observable rather than inferred: a real release DELETES block_reason, and block_reason_discharged appears in ZERO .py files in the repo. The founding ruling section 3 says unblocking is the director''s word only, never silence, and R13 is a WALL, so the cell was RESTORED (loop_stage idle, original block_reason byte-restored from 02ada0701^); file_scope was deliberately left as the sweep set it, because file_scope declares ownership, not the gate. BUILT: discharge_violations(), the R10 class fix -- population is every block_reason* field on all 316 atoms, not the one cell. unknown_block_field keys on the field NAME, so the control CANNOT BE GREENED BY REWORDING the claim; unresolvable_discharge reuses this module''s own release_verdict rather than inventing a second authority channel. TWO PLAUSIBLE LEGS MEASURED AND REJECTED, which is the part worth keeping: epoch >= 3 and not parked is red on 109 of 164 epoch-3+ atoms (epoch is the NARRATIVE arc label, not the gate), and a live block_reason on a drawn atom is 10 at HEAD, none of them this defect -- reported as stale_park_cells, never enforced, and counted apart from the 11 EMPTY-valued keys that belong to the unstated_reason_block class so the number means one thing. R15 PROVEN RED ON THE REAL TREE BEFORE THE REPAIR, not on a fixture: the control named EP6, its field, and quoted the unresolvable claim verbatim across 316 atoms; after the repair, population 0 and 0 violations. Because that live population is legitimately ZERO -- a wall enforced over a rotation set of zero being this project''s own recurring defect -- the fire is pinned by mutation instead: the defect reproduced, three rewordings, an unreadable map (fail-closed to a violation, never an empty pass), a blind scan, and the honest-door NULL in which apply_release leaves nothing to find. LIMIT STATED RATHER THAN GLOSSED: an atom whose block_reason is DELETED by hand with loop_stage build is byte-identical to one released honestly, because the map carries no typed curriculum_gated facet -- queued as WORKER_FINDING_THE_MAP_HAS_NO_FIELD_THAT_SAYS_AN_ATOM_IS_CURRICULUM_GATED_2026-08-19.md, not invented on sight. Tests: 46 passed in this atom''s own file (up from 37), 91 across the three affected suites. This record''s own first evidence line is also repaired -- it pointed at docs/staging/ for a ruling archived to done/, the known moved-path class.'
