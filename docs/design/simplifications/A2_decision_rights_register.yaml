- '2026-07-12 BUILT, level 0->1 (GOVERNED_COMPANY_AND_THREE_LANES.md Part 1, director-decided in live conversation, ''Registration + thin-start + pilot -- NOT a big-bang build''): a versioned, director-owned register of 6 decision classes (pricing_move, hedge_mandate_change, credit_collections_policy, customer_harm_remediation, legal_contractual_commitment, spend_above_threshold), each with trigger/context-pack-requirement/approver/SLA/expected-effort fields (Part 1b''s rate-card addendum folded in from the FIRST event, not retrofitted). Only pricing_move is wired to a real call site this pass -- simulation/renewals.py::build_renewal_schedule(), the actual per-customer per-renewal tariff-rate decision, logging a real DecisionEvent on the bitemporal spine (company/interfaces/bitemporal_event_log.py, reused not reinvented) for every fixed-rate term across the full historical replay. valid_time=the term the rate applies to, transaction_time=notice_date (the real Phase-34a 42-day pricing-notice date, not term_start). actual_effort_minutes/actual_elapsed_seconds are honestly None throughout -- there is no sim-approver yet (A4, still level 0) to draw a realistic actual from, and fabricating one would violate the same R12 discipline BitemporalEventLog.as_known_at() already applies. The two honesty disciplines (sim-approver policy is director-authored curriculum, never agent-tuned; the approver sits OUTSIDE the wall, sees only the submitted context pack) are recorded verbatim in company/governance/decision_rights.py''s own module docstring, governing how A3/A4 must be built when their own work starts. NOT yet done (why level_current stops at 1, not higher): the other 5 decision classes are registered but not wired to any real call site; no approval interface exists to actually route a decision for review (that''s A3); no sim-approver exists to draw realistic actual-effort data (that''s A4); the FTE-required reporting surface Part 1b describes has no accruing data yet. 7 new