- '2026-07-13 HARDEN PASS + HONEST RE-HOLD, level_current STAYS at 2 (not bumped to 3), loop_stage build->idle (saas-engineer, BUILD-tier draw under DIRECTOR_TWIN''s 07:33:20 approval). Re-investigated option (a) FIRST, not assumed stale: grepped the current codebase directly for real call sites for all 4 remaining unwired classes -- company/risk/hedge_policy.py::COMPANY_MIN_HEDGE_FLOOR is still only ever READ (company/trading/hedge_decision.py, simulation/run_phase2b.py), never dynamically CHANGED anywhere; company/billing/account_adjustment_register.py''s GOODWILL/COMPLAINT_REMEDY/REGULATORY_REDRESS/DATA_ERROR_CORRECTION types confirmed still uncalled anywhere (simulation/run_phase4c_on_phase2b.py only calls AdjustmentType.BACK_BILLING_CREDIT, which is CREDIT_COLLECTIONS_POLICY-shaped, already counted; company/finance/customer_lifetime_revenue.py''s own GOODWILL_CREDIT is an unrelated P&L line label, not a call into the adjustment register -- checked directly, a false-positive grep hit); company/market/ppa_book.py and company/compliance/board_meeting_register.py remain orphan modules with zero non-test callers; company/regulatory/solr_exposure.py (renamed from the previously-checked solr.py) likewise has zero callers. simulation/run_phase2b.py''s retention/acquisition spend guards are unchanged and remain routine per-customer policy-gated spend (a few pounds to ~GBP150), not director-threshold escalation. Conclusion unchanged from the 2026-07-12 THIRD INVESTIGATION, now independently re-verified against today''s actual tree rather than assumed still true -- option (a) is genuinely not available this pass either. Did option (b) instead: a real adversarial HARDEN pass targeting exactly the 3 edge classes named in this turn''s own instruction -- bitemporal ordering under out-of-order transaction_times (proved as_known_at()''s precedence is transaction_time-based, not insertion-order-based, by inserting the LATER-transaction_time record FIRST/lower record_id and the EARLIER one SECOND/higher record_id and confirming both time-slices answer correctly), idempotency of a replayed decision event (an identical log_decision_event() replay and an identical submit_decision_request() replay both land as real append-only duplicate records -- never silently deduped on write -- while the OBSERVABLE as_known_at()/pending_decision_requests_as_of() answers stay unchanged, matching the C-S3 addendum''s own idempotency requirement), and a pending request that is never resolved (confirmed it reports status==''pending'' indefinitely, even queried 15 years forward, never auto-timing-out). Also found and tested a genuine non-obvious causality property for free: resolve_decision_request() called with a resolved_at STRICTLY BEFORE the real submission time raises the same honest ''no pending request found'' error rather than computing a nonsensical NEGATIVE actual_elapsed_seconds -- not because of an explicit guard clause, but because it falls directly out of as_known_at()''s own transaction_time<=decision_time filter (the submission itself is not yet visible at that decision_time); tested the true boundary too (resolved_at EQUAL to submitted_at succeeds with elapsed=0.0, not off-by-one excluded). Also tested that two DIFFERENT valid_times under the SAME (entity_id, decision_class) do not conflate -- resolving one leaves the other correctly, independently pending. 9 new tests, all passing on the FIRST run with zero bugs found in the mechanism itself (24 total in tests/company/governance/test_decision_rights.py; 116 total across company/governance + saas/test_ledger.py + simulation/test_renewals.py; epistemic verifier PASS). HONEST reason this does NOT earn L3 despite a real, evidenced HARDEN pass: (1) all 9 new adversarial tests exercise the generic decision_rights.py mechanism at the UNIT level using HEDGE_MANDATE_CHANGE/LEGAL_CONTRACTUAL_COMMITMENT purely as convenient enum labels -- neither is a real wired call site, so this is not ''proven across real decision types'' in the sense the map''s own L3 bar means (that phrase already covers the 2 genuinely wired classes, PRICING_MOVE and CREDIT_COLLECTIONS_POLICY, which had real integration tests before this pass and still do, unchanged by this pass). (2) The new submit/resolve/pending mechanism itself (this session''s own C-S3 addendum work) has ZERO real callers anywhere in the codebase today -- it exists purely as unconsumed machinery awaiting A3_approval_interface to actually drive it from a real approval queue; claiming this mechanism is ''proven'' at L3 while no real code ever calls it would be exactly the round-up R12 exists to prevent, no matter how many passing unit tests exist. (3) This was a self-authored adversarial pass (the same author who wrote the mechanism authoring its own adversarial tests), not an independent fresh-context cold-eyes/Expert-Hour review of the kind H6_lane_wall_development_pilot''s own L3 bump required and got (a dispatched reviewer with no memory of the build, which found and fixed 7 real bugs) -- zero bugs found here is real evidence the mechanism holds up under the specific dimensions tested, but is weaker evidence than an independent review would give, and expert_hour.status correctly stays not_attempted, not marked passed. PRECISE UNBLOCK CONDITIONS for L3 (unchanged in kind from the prior HELD entries, sharpened with this pass''s findings): either (a) a genuine independent Expert-Hour/cold-eyes dispatch on this exact mechanism (fresh context, no memory of this build, empowered to execute real adversarial payloads against decision_rights.py directly, matching H6''s own evidentiary bar) -- available to a session that can dispatch a sub-agent, which this build-lane draw could not do itself; or (b) A3_approval_interface actually lands and calls submit_decision_request()/resolve_decision_request() from a real approval queue, giving the pending/resolve mechanism its first genuine caller so ''proven across real decision types'' stops being purely hypothetical for it; or (c) a genuinely new company-side mechanism gets built for one of CUSTOMER_HARM_REMEDIATION/LEGAL_CONTRACTUAL_COMMITMENT/SPEND_ABOVE_THRESHOLD (materially bigger than this thin-wiring pass, per the 2026-07-12 THIRD INVESTIGATION''s own conclusion, still true today). loop_stage reset to idle (not build) -- re-investigating for the 4th time with no new mechanism landing first would be pure repetition, matching the exact reasoning the 2026-07-12 IDLE-HOLE FIX already used for this same atom.'
- '2026-07-13 INDEPENDENT EXPERT HOUR RUN (fresh-context phase-close-evaluator, no memory of the build, dispatched by the orchestrator per A3_GO_AND_MAP_CONTENTION.md -- discharges L3 condition (a) as a READ-ONLY review; the evaluator explicitly noted it lacks execute-payload capability so it is the LIGHTER of the two review standards the atom named, not the full H6 execute bar). VERDICT: NEEDS_WORK -- HOLD at L2, mechanism SOUND, no fix needed. Independently verified with file:line evidence: pending/latency model correct (resolve-before-submit structurally blocked by as_known_at()''s transaction_time<=decision_time filter -> honest ValueError, never negative elapsed; double-resolve blocked; zero-elapsed boundary, out-of-order precedence, multi-valid_time non-conflation, pending-surface dedup all hold, no hole found); epistemic wall intact by construction (approval_interface.py imports only company.governance.decision_rights + stdlib; approver verdict is an INPUT bool, never computed; no sim ground-truth path); test adequacy genuinely strong beyond happy-path. WHY L3 STILL NOT MET (the crux): L3 condition (b) ''real caller'' is unmet at the required level -- grepped for non-test callers of propose_hedge_mandate_change/request_governance_approval/record_governance_decision/submit_decision_request/resolve_decision_request: ZERO hits outside approval_interface.py itself and the two test files. A3''s caller exists only at MODULE level, driven exclusively by A3''s tests; no live run pipeline invokes it (COMPANY_MIN_HEDGE_FLOOR still a constant). A2 cannot leapfrog to L3 on the same evidence A3 itself honestly declined to promote on (A3 held at L1 for this exact live-integration reason) -- promoting now would be precisely the R12 round-up. The record_governance_decision no-resolved_by/role gap is NOT an A2/A3 defect -- it is F4_maker_checker_and_rbac''s scope (epoch 5, whose own FRAME names resolve_decision_request()''s missing role check as its integration point), correc