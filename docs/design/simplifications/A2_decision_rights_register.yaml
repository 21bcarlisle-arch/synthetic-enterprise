- '2026-07-28 HARDEN RE-VERIFY (Rule-0 dial=3 yielded, at-target self-refill draw -- no below-target work anywhere; re-proof pass, no behaviour change, level HELD at 3 -- a re-verify never promotes). Exit tests re-run GREEN on todays tree: tests/company/governance/test_decision_rights.py + tests/company/interfaces/test_bitemporal_event_log.py = 59 passed. Epistemic wall re-checked: decision_rights.py imports ONLY company.interfaces.bitemporal_event_log + stdlib (no sim/simulation), clean. R15 MUTATION ROTATED past the 2026-07-27 append-only-immutability proofs (copy-on-write/copy-on-read on the bitemporal spine) to the un-proven decision_rights.py-side control WITHIN A2s file_scope -- the resolve_decision_request() pending-guard (line 317: if pending is None OR pending.value.status != pending), the request/answer-split gate that encodes A2s C-S3 pending-latency thesis. The guard has TWO independent legs: the None-leg (catches resolve-with-no-submission) and the status-leg (catches DOUBLE-RESOLVE of an already-decided fact). Mutated the status leg to fail-open (dropped it -> if pending is None only) -> test_resolve_decision_request_raises_if_already_resolved fired RED (DID NOT RAISE: a second resolve of an already-decided request sailed through, recomputing a bogus second elapsed), while test_resolve_decision_request_raises_without_a_pending_submission (resolve-before-submit) + test_resolve_decision_request_records_a_real_revision_not_an_edit (legit first resolution) + test_as_known_at_shows_pending_before_resolution_decided_after ALL stayed GREEN -- proving the status leg is a real, INDEPENDENT, non-tautological guard (NEITHER fail-open NOR fail-silent: the None-leg and the legit path are unaffected). Restored byte-identical (git diff empty, 59 green re-run). RED-TEAM the resolve path for the comparison-guard-NaN-blind class (the residual flagged on A3s SLA flag the same day): decision_rights.pys resolve guard is NOT NaN-vulnerable -- the status check is STRING equality (not a magnitude comparison), pending is None is identity, and elapsed = (resolved_at - transaction_time).total_seconds() is a real datetime delta (always finite); resolving at a resolved_at STRICTLY BEFORE the submissions transaction_time is structurally blocked by as_known_at()s transaction_time<=decision_time filter (pending -> None -> honest ValueError, never a negative elapsed), the causality property already proven 2026-07-13 and unchanged. No new fail-open found; no Nth guard accreted (rest-with-proof per the A2/W1_2 at-target discipline). NOTE: the 2026-07-28T03:13Z A2 cooldown stamp carried NO matching map note (a prior at-target draw stamped WITHOUT documenting -- the stamp-before-note ordering class F6 flagged 07-28); this pass writes the note FIRST, then record_harden_pass stamps the post-note sha so recorded==committed and the at-target draw rotates past this atom (the cooldown-discipline fix). L3 conditions/scope UNCHANGED (4 of 6 decision classes remain unwired -- registered future scope, not an L3 gap); level HELD 3->3.'
