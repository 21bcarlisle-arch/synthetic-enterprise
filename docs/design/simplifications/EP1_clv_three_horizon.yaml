atom_id: EP1_clv_three_horizon
simplifications:
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, no CLV designed, nothing wired -- this atom is epoch-2\nBUILD-gated on director-owned curriculum sequencing (R13), and EPOCH_GATING_AND_ATOM_\nAUTHORSHIP rule 1 makes DISCOVER/FRAME available while BUILD is not. `maturity_map.yaml`\nNOT edited: nothing in the map moves for this pass, this atom's records are rehomed here\n(`records_rehomed: [evidence]`), and the mint text is director-ruling provenance that a\nworker tick does not rewrite. Output is this record plus two queued findings.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD de32e8c6b. Live published `docs/reports/run_output_latest.json`\n(4,152,276 bytes, mtime 2026-08-13 21:08) and `site/data/company.json` read directly;\nshipped modules read and, where stated, EXECUTED as they sit on disk; nothing\nmonkeypatched, nothing regenerated. One of this atom's two cited evidence paths was DEAD\n(the known moved-path class -- the director ruling had been archived to\n`docs/staging/done/`) and is repaired above. Eleven paths added: the code a reader of this\natom actually needs, none of which the record previously named.\n\n==========================================================================================\nFINDING 1 (FRAME) -- THIS ATOM IS NOT GREENFIELD. Six CLV implementations already exist.\nFive have zero non-test callers. The one CALLED \"three-horizon\" answers a different\nquestion from this atom's three horizons, and the live one is a seventh thing again.\n==========================================================================================\n\nThe mint says \"no atom on the map touches CLV today\". That sentence is TRUE OF THE MAP and\nwas checked: `grep -in clv docs/design/maturity_map.yaml` returns 5 lines and no more --\nthis atom's `id` and `name` (4077, 4080), two other atoms' notes ASSERTING the same\nabsence (4027, and 4543's \"zero atoms touching CLV\" measured at mint on 2026-08-08), and\none SITE2 exit criterion listing CLV among company-only figures (5154). No atom OWNS a CLV.\n\nIt is not true of the TREE. Caller census, whole repo, importers excluding each module's\nown file:\n\n    module                                   non-test importers\n    saas/clv_model.py                        4   (enterprise_value, home_move_win_rate,\n                                                  annual_report, generate_customer_data)\n    saas/enterprise_value.py                 19  (the live run, the site generators, the\n                                                  seam, board_dashboard, tournament_runner)\n    saas/clv_seed.py                         4   (tools/run_phase0c, run_phase1c x3)\n    company/core/three_horizon_clv.py        0\n    company/crm/clv_cohort_book.py           0\n    company/crm/clv_sensitivity_model.py     0\n    company/finance/segment_profitability.py 0\n    company/finance/portfolio_dashboard.py   0\n\nTHE LIVE CHAIN, one path only: `saas/clv_model.build_clv` -> `saas/enterprise_value.\nbuild_enterprise_value` -> `company/analytics/customer_value_view` -> the seam\n`company/interfaces/customer_value` -> `simulation/run_phase4c_on_phase2b.py:345` -> the\nrun output -> `site/data/company.json` -> `/company/` and `/customers/`. It is a\nshifted-Beta-geometric expected lifetime times an annuity factor at a hard-coded\n`DISCOUNT_RATE_ANNUAL = 0.10`.\n\nTHE FIVE ORPHANS are tested-only: each is imported by its own test file and nothing else.\nThey are not dead in the \"delete on sight\" sense -- `clv_cohort_book` is literally this\natom's third horizon (cohort summaries keyed by acquisition year/channel/segment) and\n`clv_sensitivity_model` is the CAC<CLV/3 acquisition-budget lens -- they are UNWIRED. The\nclass is the already-filed one: a capability's remedy already exists, orphaned, and the\ncommon failure here is an orphaned control rather than an absent one.\n\nTHE NAME COLLISION, which is the part that will mislead the draw that opens this atom.\n`company/core/three_horizon_clv.py` (149 lines, 263 lines of tests, \"Phase EC\") is NOT\nthis atom's three horizons. Its axis is TIME OF ESTIMATE:\n\n    H1Commitment  what was promised at the sale\n    H2Actuals     what has been earned since, from recorded revenue/cost events\n    H3Forecast    the re-forecast now, with an H3Signal of on_track/deteriorating/at_risk\n\nThis atom's axis is SCOPE OF VALUE: contract-term, tenure-expected, portfolio-cohort. The\ntwo are orthogonal and both are worth having -- an existing H1/H2/H3 tracker does not\nsupply a contract-term/tenure/cohort triple, and a reader who greps \"three horizon CLV\"\nwill find a module that answers the other question. `company/finance/portfolio_dashboard.py`\nalready cites \"Average CLV (H3 forecast) vs H1 commitment\" in its own docstring, so the\ncollision is already propagating inside the repo.\n\nA DEFECT INSIDE THAT MODULE, found while reading it and stated here because it is the\nnearest thing on disk to this atom's FIRST horizon. `H1Commitment` takes `contract_start`\nand `contract_end`, exposes `contract_years`, and then never uses it:\n\n    h1_clv_gbp = expected_annual_margin_gbp * retention / (1 + discount_rate - retention)\n\n-- a perpetuity. `contract_years` is reachable only in the `denom <= 0` branch. Executed\non the shipped class, margin £100, churn 0.20, discount 0.08:\n\n    1-year fixed    contract_years=0.9993   h1_clv=285.71\n    2-year fixed    contract_years=1.9986   h1_clv=285.71\n    1-DAY contract  contract_years=0.0027   h1_clv=285.71\n\nThe value of a commitment is invariant to the length of the commitment. If any EP1 build\nreaches for this class as its contract-term horizon, it inherits a perpetuity wearing a\ncontract's clothes. Filed here rather than as a third staging finding because the module\nhas no callers -- nothing published is wrong today, which is exactly RECORDED severity,\nand the repair belongs to whoever wires it.\n\n==========================================================================================\nFINDING 2 -- THE LIVE ESTIMATOR, TWO DEFECTS, BOTH QUEUED AS BLOCKING FINDINGS.\n==========================================================================================\n\nBoth filed to `docs/staging/`, both severity BLOCKING, lane B_commercial, because a\npublished figure may be wrong in each case. Neither fixed in this tick: each is estimator\nor population surgery inside a live publish chain on a BUILD-gated atom's file scope\n(SELF_INTERRUPT_DISCIPLINE -- queue by default).\n\n(a) `WORKER_FINDING_THE_LIFETIME_ESTIMATE_DOES_NOT_MOVE_WHEN_THE_BELIEF_DOES_2026-08-13.md`\n    -- R15 mutation on the shipped `build_clv`: two accounts, identical observed tenure,\n    opposite churn beliefs; SWAP the beliefs and neither estimate moves (SAFE 50.000 /\n    RISKY 23.926, both runs, three decimal places). The per-account inputs are only\n    `{customer_id, t_churn, T}`; alpha/beta are pooled across the whole book into one\n    scalar pair. The company's belief about a customer enters only through the portfolio\n    mean. In the live book: corr(expected_lifetime, latest_churn_probability) = +0.093\n    across 13 accounts, sign backwards, and the joint-highest-churn account carries the\n    longest projected life on the book.\n\n(b) `WORKER_FINDING_THE_BOOK_VALUE_COUNTS_CUSTOMERS_WHO_HAVE_ALREADY_LEFT_2026-08-13.md`\n    -- 5 of 13 accounts churned in-run (C3 2020-06-30, C5 2020-12-30, C1 2021-12-30, C6\n    2024-03-30, C4 2024-09-29), all `home_move_won: false`, all still carrying forward CLV\n    in every later snapshot and in the published `enterprise_value_gbp`. £35,597 = 51.8%\n    of the residential book's CLV. The valued population is \"has renewal history\", never\n    \"is still supplied\", though `churned_billing_accounts` sits in the same output file.\n    The `/company/` featured household is C1 -- churned -- rendered with `clv_gbp 2840.50`\n    and `expected_lifetime_periods 14.94` and no attribute saying it left.\n\n==========================================================================================\nFINDING 3 (FRAME) -- THE GAP THIS ATOM IS SCORED ON IS NOT MEASURED ANYWHERE, AND THE\nPATTERN TO COPY IS ALREADY RUNNING NEXT DOOR.\n==========================================================================================\n\nThe mint's own scoring rule is \"the company's OWN estimate ... allowed to be wrong and the\ngap is the score\" (COUPLED_TRIAD: no company capability is complete until it has faced a\nworld that can defeat it). Nothing in the repo compares a CLV estimate to realised value:\nno belief/truth CLV pair in the run output, none in `docs/observability/\ncoupled_gap_ledger.json` (checked by name), and `couples_with: []` on this atom.\n\nThe pattern EXISTS one field away. `run_output_latest.json::customer_events` already\ncarries, per renewal, the SIM's `churn_probability`, the company's `company_churn_estimate`\nand the derived `churn_estimate_error_pct` -- a belief/truth pair produced and published on\nevery renewal. CLV's realised counterpart is cheaper still: the run knows what each account\nactually earned after each snapshot date, and `clv_snapshots` already stores the belief at\neach year end for ten years. An ex-post CLV gap is assemblable from artefacts that exist\ntoday; it has simply never been assembled.\n\nWHAT FOLLOWS, recorded rather than asked (NEVER_ASK_WITHOUT_RECOMMENDING). For the draw\nthat opens EP1:\n\n1. FIRST TASK IS A CENSUS, NOT A DESIGN. `level_current: 0` and `file_scope: []` describe\n   an atom with nothing built; six implementations exist and one is live on a public\n   surface. The level must be re-derived from that census when the atom opens, not assumed\n   from the record. Not changed here: a level move is a BUILD-side act on a BUILD-gated\n   atom.\n2. THE THREE HORIZONS MAP ONTO WHAT EXISTS, WITH ONE HOLE. Tenure-expected = the live\n   `clv_model` chain (defective per Finding 2, repairable). Portfolio-cohort =\n   `company/crm/clv_cohort_book.py`, built and unwired. Contract-term = the genuine hole;\n   `three_horizon_clv.H1Commitment` is the nearest artefact and prices a term as a\n   perpetuity. EP1's honest shape is therefore REPAIR + WIRE + BUILD ONE, not build three.\n3. NAME THE COLLISION BEFORE WRITING A LINE. Either rename `company/core/three_horizon_clv`\n   to what it is (a commitment-vs-actual-vs-reforecast tracker) or name this atom's triple\n   something that cannot be confused with it. Two different \"three-horizon CLV\"s in one\n   repo is a defect a reader pays for repeatedly.\n4. THE EXIT CRITERION IS THE GAP, NOT THE ESTIMATE. Per COUPLED_TRIAD and R12: publish the\n   estimate, publish the realised, publish the error, and let the error be large. The\n   control that must be able to fail is the swap-the-belief mutation in Finding 2(a) --\n   an estimator whose per-customer output does not move when its per-customer input moves\n   fails it, which today's does.\n5. COST-TO-SERVE IS ALREADY PER-CUSTOMER AND MUST STAY THAT WAY. `site/data/company.json::\n   cost_to_serve` publishes n=19 with by_segment/by_payment_channel/by_tenure splits\n   (resi mean £446.92, I&C mean £3,418.46). The origin note's warning -- a CLV that\n   ignores customer-level cost-to-serve reproduces the flat-margin error -- is currently\n   satisfied by the live chain (`build_clv` divides `cost_to_serve['by_customer']` net\n   margin) and must not regress when the three horizons are assembled.\n"
- "2026-08-15 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing wired, `maturity_map.yaml` edited for the\n`simplifications_count` scalar ONLY (1 -> 2, the store/map invariant that\n`tools/migrate_simplifications.py --check` enforces). Measured at HEAD d323edc25.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nTHIS PASS RE-VERIFIED THE 2026-08-13 PASS AND FOUND ITS TWO BLOCKING FINDINGS REPAIRED.\nBoth are landed, not merely filed:\n  (a) the per-customer estimate now follows the per-customer belief --\n      `saas/clv_model.fit_theta_posterior_per_account` exists at HEAD (the portfolio prior\n      updated by each account's own renewal evidence), which is the estimator surgery the\n      swap-the-belief mutation demanded. Landed 14876d687, report archived.\n  (b) the valued book is now the SUPPLIED book -- `saas/enterprise_value.build_enterprise_value`\n      takes `ceased_accounts` as a REQUIRED keyword with no default, and its docstring states\n      why the default is absent: `set()` would have restored the defect silently at every call\n      site that forgot to think about it, which is the fail-open shape R15 names. Landed\n      66141b70c; the render/selection half landed since as c647726db + d323edc25 (SITE2).\nThe finding doc for (b) is still parked in `docs/staging/in_progress/` and its own body now\ndescribes a state that has been superseded on both legs. Disposition is owed there; not taken\nthis tick because the SITE-lane half is another lane's record to close.\n\nFINDING (BLOCKING, queued) -- THE CONTRACT-TERM HORIZON PRICES A TERM AS A PERPETUITY, ON BOTH\nHORIZONS, AND ITS TESTS CERTIFY THAT.\nFiled as `docs/staging/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\n(severity BLOCKING, lane B_commercial, parsed both ways this tick; class\n`no_caller_and_never_runs`).\n\nThis ESCALATES the defect the 2026-08-13 note kept in this record at RECORDED severity, with a\nreason rather than by inheritance. That note was right that no published figure is wrong -- I\nre-confirmed zero non-test importers of `company/core/three_horizon_clv.py` at HEAD (the only\ntwo mentions are prose docstring lines in `company/core/account_intelligence.py:3` and\n`company/finance/portfolio_dashboard.py:11`). It was wrong that this is therefore RECORDED,\nbecause the module's own suite -- 35 passed in 0.06s at HEAD -- CERTIFIES the defect:\n  * `test_h1_clv_formula` and `test_h3_clv` assert against a hand-written copy of the\n    implementation's own expression with the same literals. TAUTOLOGY, R15 killer pattern 1.\n  * the only two tests that put the term in an assertion (`test_h1_clv_fallback_negative_churn`,\n    `test_h3_clv_fallback_zero_denom`) reach it exclusively through NEGATIVE churn.\n  * no test in the file fails if both term fields are deleted outright.\n\"a control or instrument in this area is untrustworthy\" is the BLOCKING trigger verbatim, and\ndown-classifying to keep B_commercial open is the anti-pattern `background/finding_severity.py`\nnames in its own header.\n\nTWO THINGS THE 2026-08-13 NOTE DID NOT HAVE:\n1. THE H3 HALF. That note names `H1Commitment` only. `H3Forecast.h3_clv_gbp` has the identical\n   shape -- `remaining_contract_years` is used only in the `denom <= 0` branch -- so the\n   RE-FORECAST is term-blind too and the defect survives any repair touching only the\n   commitment side. Executed on the shipped classes (margin 100, churn 0.20, discount 0.08):\n   h1_clv_gbp = 285.7143 for contract_years in {0.0027, 0.9993, 1.9986, 4.9993, 29.9986};\n   h3_clv_gbp = 285.7143 for remaining in {0.0, 0.5, 1.0, 10.0}.\n2. THE BRANCH IS DEAD BY ALGEBRA, not by luck. denom = 1 + d - (1 - c) = d + c, so the\n   term-consuming branch needs d + c <= 0; for d >= 0 and c in [0,1] the sole solution is\n   d == c == 0. The term parameter is UNREACHABLE in the returned value for every account with\n   any churn risk or any positive discount rate. The 2026-08-13 note called it \"reachable only\n   in the denom <= 0 branch\"; the sharper statement is that the branch is arithmetically closed.\nCONSEQUENCE, executed: an account one DAY from expiry and one with nine years of term, same\nmargin and churn, both value 285.7143 on both horizons and both read `h3_signal` = on_track;\n`at_risk_accounts()` is empty. `h3_signal` compares two perpetuities, so it can never see a\ncontract running out.\nMAGNITUDE (`inferred`, a ceiling argument not a valuation): a fixed term delivers at most\nmargin x term undiscounted, so H1's 285.71 sits at 2.86x a 1-year ceiling of 100 and 1.43x a\n2-year ceiling of 200, reversing past ~3 years -- the signature of a perpetuity rather than a\nmispriced annuity.\n\nWHAT THIS CHANGES FOR THE DRAW THAT OPENS EP1. Item 2 of the 2026-08-13 \"WHAT FOLLOWS\" list\nsaid the three horizons map onto what exists with contract-term as \"the genuine hole\", with\n`H1Commitment` as the nearest artefact. That stands, but the artefact is worse than it looked:\nit is a perpetuity on BOTH its horizons behind a green suite that cannot say so. EP1's shape is\nstill REPAIR + WIRE + BUILD ONE, and the contract-term leg is REPAIR-THEN-WIRE rather than\nwire-as-is. Do not let the 35 green tests stand as evidence that the commitment side is sound.\nDischarge condition, either sufficient, both cheap while the caller count is zero: price the\nterm as an annuity and replace the two tautological tests with one that fails on today's code\n(recommended -- it is what the horizon actually needs), or document both classes as perpetuity\napproximations and delete the unused term fields from the value path so no reader believes a\nterm is being priced. Not fixed this tick: SELF_INTERRUPT_DISCIPLINE queues by default, and a\nvaluation formula inside this atom's own subject matter is BUILD work that LANE 3 may not write.\n\nUNCHANGED AND STILL OWED from the 2026-08-13 note: the name collision (item 3) is untouched --\n`company/core/three_horizon_clv` still answers commitment-vs-actual-vs-reforecast while this\natom's triple is contract-term/tenure/cohort, and `company/finance/portfolio_dashboard.py:11`\nstill propagates it. The CLV belief-vs-truth gap (item 4 / COUPLED_TRIAD) is still measured\nnowhere: `couples_with: []` on this atom, still no CLV pair in the coupled gap ledger."
- "2026-08-15 REPAIR (worker tick, RUNG 1c BLOCKING-FINDING draw on lane B_commercial), NOT an\nEP1 build: level stays 0, loop_stage stays idle, file_scope untouched, `maturity_map.yaml`\nedited for the `simplifications_count` scalar ONLY (2 -> 3). What was drawn is the discharge\nof this atom's own blocking finding, and the module repaired\n(`company/core/three_horizon_clv.py`) is not in EP1's file scope -- it is the artefact the\nfinding named. Measured at HEAD 75fd42288.\n\nDISCHARGED: `docs/staging/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\nnow carries a structured `**Discharged:**` field that `background.finding_severity.parse_discharge`\nRELEASES (checked this tick, and `false_discharges()` is empty). `blocking_by_lane` over the\nstaging root now returns NO blocking finding on any lane, B_commercial included.\n\nCONDITION 1 TAKEN, the one this record recommended: the term is priced rather than the module\ndemoted to a documented perpetuity. `_term_value_gbp` is now the single valuation both horizons\ncall -- sum over t=1..T of margin * retention^t / (1+d)^t, closed form\nmargin * retention * (1 - r^T) / (1 + d - retention) with r = retention/(1+d). That is the old\nexpression times (1 - r^T), so the perpetuity survives as its T -> infinity limit instead of as\nthe answer for every T. The dead `denom <= 0` branch is gone as a branch: the unit-retention case\n(retention == 1 + d) is now the algebraically correct degenerate value margin x T, reached by a\ntest rather than by a fallback.\n\nRE-RUN OF THE FINDING'S OWN TABLES (margin 100, churn 0.20, discount 0.08; ceiling = margin x term):\n  H1  1-day   years= 0.0027  clv=  0.2347  ceiling=   0.2738\n  H1  1-year  years= 0.9993  clv= 74.0306  ceiling=  99.9316\n  H1  2-year  years= 1.9986  clv=128.8793  ceiling= 199.8631\n  H1  5-year  years= 4.9993  clv=221.9831  ceiling= 499.9316\n  H1  30-year years=29.9986  clv=285.6791  ceiling=2999.8631   (was 285.7143 for all five)\n  H3  rem=0.00 clv=0.0000 - rem=0.50 clv=39.8106 - rem=1.00 clv=74.0741 - rem=10.00 clv=271.5043\nThe finding's two accounts (1 day vs 9 years of term, same margin and churn) now differ by three\norders of magnitude on both horizons where they were identical.\n\nONE THING THE FINDING DID NOT NAME AND THE REPAIR HAD TO FIX. Pricing the term makes\n`h3_signal` unsound in a new way: a part-term H3 forecast scored against a whole-term H1 value\nwould read every account as deteriorating merely because time had passed -- mechanical decay\ndressed as a signal, which is the defect class this project files against derived headlines.\nThe signal now scores H3 against `H1Commitment.clv_over_years_gbp` over the SAME remaining\nwindow, so an unchanged belief reads on_track at any point in the term and a worsened one still\nreaches at_risk. Both directions are tested.\n\nR15, BOTH WAYS, this tick. The two tautological assertions and the two negative-churn coverage\ntests are gone; value assertions now compare against a period-by-period loop (`discounted_sum`\nin the test module), never against the closed form the module evaluates -- independence, killer\npattern 1. With `git show HEAD:` restoring the pre-repair module, 12 of the 47 controls FAIL,\nincluding `test_h1_clv_rises_strictly_with_the_term`,\n`test_h1_clv_never_exceeds_what_the_term_can_deliver`,\n`test_h3_clv_rises_strictly_with_remaining_term`, `test_h3_clv_of_an_expired_contract_is_zero`\nand `test_an_expiring_contract_is_not_worth_the_same_as_a_ten_year_one`, each failing on the\nterm-blindness itself rather than on a new method being absent. On the repair, 47 pass.\n\nNO PUBLISHED FIGURE MOVED, re-confirmed rather than carried forward: zero non-test importers of\n`company/core/three_horizon_clv.py` at HEAD. This was repaired BEFORE EP1 wires it, which is\nthe cheap end of the finding's own argument.\n\nSTILL OWED, unchanged by this pass and deliberately not swept in with it: the name collision\n(item 3 of the 2026-08-13 list) -- this module still answers commitment-vs-actual-vs-reforecast\nwhile the atom's triple is contract-term/tenure/cohort, and `company/finance/portfolio_dashboard.py:11`\nstill propagates it; and the CLV belief-vs-truth gap (item 4 / COUPLED_TRIAD), still measured\nnowhere with `couples_with: []`. What item 2 of that list called REPAIR-THEN-WIRE for the\ncontract-term leg is now REPAIRED and still unwired: the wiring is EP1 BUILD and stays gated."
map_notes:
  origin_note: 'Activity-based pricing is a standing CLAUDE.md constraint -- flat margin makes some customers net-negative -- so a CLV that ignores cost-to-serve at the customer level reproduces the exact error the constraint names. R12 applies hard here: CLV is a DIAGNOSTIC, never a target, and no pricing or retention lever may be tuned to raise it. Coupled-triad shape when built: COMPANY estimates through the wall, HARNESS measures the estimate against SIM realised value.'
  name: 'Three-horizon customer lifetime value: contract-term, tenure-expected, and portfolio-cohort. The company''s OWN estimate assembled from observables (onboarding, flow events, payment behaviour, cost-to-serve) -- never a read of SIM truth -- so it is allowed to be wrong and the gap is the score. Named in DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 §1 as an Epoch-2 floor item; no atom on the map touches CLV today.'
