- "2026-08-19 DISCOVER/FRAME ONLY, pass 8, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (7 -> 8). Measured at\nHEAD 74ccddb57 against the working tree, `docs/reports/run_output_latest.json`, the committed\n`docs/reports/ANNUAL_REPORT.md` and the published `site/data/company.json`. Every module named\nbelow was EXECUTED as it sits on disk. Everything is `observed-with-evidence` unless labelled\n`inferred` (R9).\n\nWHAT THIS PASS DID THAT THE SEVEN BEFORE IT DID NOT. Passes 1-7 asked WHO IS COUNTED (five\npopulation/basis defects) and WHAT THE RECORD CAN HOLD (pass 7, the cohort record type). This\npass asks the question underneath both: WHAT DOES THE HORIZON ITSELF ASSUME. The tenure leg has\nbeen repaired four times and never read as a model. Read as one, it turns out to be exchangeable\nin exactly the signal it is built on -- and then the same question asked of the DEMAND side (the\nthree decisions this atom's own `gain` names) finds three different tenures for one customer.\n\n==========================================================================================\n1. THE TENURE HORIZON CANNOT TELL A DETERIORATING CUSTOMER FROM A RECOVERING ONE.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_TENURE_HORIZON_CANNOT_TELL_A_DETERIORATING_CUSTOMER_\nFROM_A_RECOVERING_ONE_2026-08-19.md` (LATENT, lane B_commercial; `classify_file` returns no\nclass, so no class doc is touched and nothing is owed a re-render).\n\n`fit_theta_posterior_per_account` (`saas/clv_model.py:162-208`) updates a Beta prior with SOFT\ncounts -- `alpha += sum(p_i)`, `beta += sum(1 - p_i)` over the account's own renewal points. The\nsufficient statistic is a SUM, so the posterior is exchangeable in the order of the renewals.\nExecuted on the shipped functions, two accounts with the same nine renewals in reversed order:\n\n    DETERIORATING  shocks 0,0,0,1,2,3,5,7,9   latest churn 0.32\n    RECOVERING     shocks 9,7,5,3,2,1,0,0,0   latest churn 0.05\n\n    posterior      both (3.035454545454545, 18.64636363636364)          IDENTICAL\n    lifetime       both 9.415901156198618                               IDENTICAL\n    clv_gbp        both 142.0649211867                                  IDENTICAL (bit-for-bit)\n\nA customer whose bill shocks are all in the most recent year and one whose shocks are all\nancient are the same customer to this horizon. That is not an arithmetic slip: it is the correct\nbehaviour of a conjugate update on i.i.d. Bernoulli trials, and therefore an ASSUMPTION -- theta\nis a fixed per-account propensity -- which this atom's record has never stated and which the\nworld in the same repo contradicts. `churn_probability(bill_shock_count)`\n(`saas/churn_model.py:40`) is a per-renewal-year function of a per-year shock count; the\ngenerating process is time-varying by construction and the estimator is not.\n\nTHE LIVE ARTEFACT SHOWS IT WITHOUT ANY MODEL AT ALL. Over the 8 valued accounts in\n`run_output_latest.json::by_billing_account`, `latest_churn_probability` against\n`expected_lifetime_periods`:\n\n    pearson(churn, lifetime) = -0.0169 over churn spanning 0.14..0.41 (2.9x)\n    C2 churn 0.41, C8 churn 0.35, C9 churn 0.14 -> lifetime 11.127618809847226 for ALL THREE\n    C_IC1 and C_IC2, churn 0.29 BOTH               -> 10.129852262166567 vs 10.139813815266979\n\nDifferent churn, identical lifetime to 17 significant figures; identical churn, different\nlifetime. The published pair is not a function in either direction, and both fields are on the\nlive site (`site/data/company.json::household` carries `latest_churn_probability` beside\n`expected_lifetime_periods` and `clv_gbp`). `inferred`: the 17-figure identity is the signature\nof equal soft counts (equal renewal count and equal summed churn); the alternative is two\naccounts landing on the same level set of the lifetime function by compensating differences.\n\nMAGNITUDE, in pass 7's honest form -- this is what the estimator AS IT STANDS TODAY yields when\nONLY the horizon is substituted, not a prediction of what a repair will produce. Conditioning on\neach account's own latest renewal instead of its whole history, everything else in the shipped\nestimator unchanged: every account falls 36.7% to 53.7%, and the book total goes\nGBP 1,283,074.77 -> GBP 703,246.56, **-45.2%**. The published `enterprise_value_gbp`\n(GBP 1,283,769.58 on the live site) is a first-order function of a choice nothing has argued.\n\nR15 -- AND THIS IS THE PART THAT MAKES IT A FINDING RATHER THAN A DESIGN NOTE. The control that\nexists for this exact estimator, `tests/saas/test_clv_model.py:186-207`, was written for\n`WORKER_FINDING_THE_LIFETIME_ESTIMATE_DOES_NOT_MOVE_WHEN_THE_BELIEF_DOES` (2026-08-13,\nBLOCKING) and is a real mutation test: swap two accounts' beliefs, the lifetimes must swap. It\npasses. But its fixture `_belief` (`:159-167`) gives every renewal of an account the SAME\nprobability -- so no account in the control's population HAS a trajectory, and the only mutation\nthe fixture can express is BETWEEN accounts. The mutation that matters here, permuting an\naccount's renewals WITHIN itself, leaves the output bit-identical and no test asks it. Its\nanti-vacuity clause is honest and still does not reach: two accounts must be distinguishable,\nwhich they are, on a statistic that is order-blind.\n\n==========================================================================================\n2. THE DEMAND SIDE: THIS COMPANY ALREADY HOLDS THREE TENURES FOR ONE CUSTOMER.\n==========================================================================================\n\nThis atom's `gain` is \"acquisition, retention and tariff decisions get a value number to argue\nwith\". Seven passes measured the SUPPLY of CLV (six implementations, five dark). None measured\nthe DEMAND. Import census at HEAD, non-test callers only: `channel_roi`, `acquisition_cost`,\n`acquisition_strategy_book`, `switching_cba`, `customer_profitability_scorecard` -- **zero\neach**; the single non-test hit is a COMMENT. So the demand side is not empty and not wired: it\nis five shipped decision modules that each brought their own CLV.\n\n    company/crm/channel_roi.py:80        clv = margin * annuity(1/effective_churn, r=0.10)\n    company/crm/acquisition_cost.py:63   clv = margin * avg_tenure_years    (UNDISCOUNTED)\n    company/crm/acquisition_strategy_book.py:36  expected_clv_gbp -- a bare float, hurdle CLV>3xCAC\n    company/crm/switching_cba.py:35      clv = margin * years * (1/1.08)**years  (r=0.08, and a\n                                         single TERMINAL discount factor, not an annuity)\n    company/crm/customer_profitability_scorecard.py:59  h3_clv_gbp -- a bare float, target GBP 500\n    saas/clv_model.py:357                clv = margin * annuity(sBG posterior lifetime, r=0.10)\n\nTwo discount rates (0.10 and 0.08) and three shapes (annuity, undiscounted product, terminal\nfactor) for one quantity, none of them labelled with which horizon it is.\n\nTHREE TENURES FOR THE SAME CUSTOMER, all computed from observables the company holds:\n\n    valuing the book (sBG posterior)        10.13 .. 11.13 years\n    deciding to acquire (channel_roi, 1/churn * channel factor)  1.68 .. 4.93 years\n    strategy book (`_TYPICAL_TENURE_YEARS`, a constant)  resi 3.2 / SME 2.8 / I&C 4.5\n\nPer live account, book lifetime over 1/churn: C2 4.56x, C7 4.16x, C8 3.89x, C_IC3 4.37x, C9\n1.56x. The company believes a customer lasts eleven years when it values them and under three\nwhen it decides whether to buy them.\n\nAND THE 3x HURDLE FLIPS ON WHICH ONE YOU ASK. Both shipped acquisition modules are run on the\nsame live observables (pcw / PRICE_COMPARISON, 2025, each residential account's own margin and\nchurn). They agree on the sign for all four accounts -- and on C2 they return CLV:CAC of 2.76\nand 6.15, which straddle the 3x hurdle `acquisition_strategy_book` publishes as `is_viable`. One\nof four live residential accounts changes acquisition verdict on the choice of estimator.\n\nTwo smaller measured items in the same seam. (a) The two CAC tables disagree: pcw GBP 48 vs\nGBP 65 in 2025 (+35%), direct GBP 30 vs GBP 28, referral GBP 20 vs GBP 20. (b)\n`acquisition_strategy_book.py:14` says \"CAC benchmarks by channel from\ncompany/crm/acquisition_cost.py\"; executed against every year 2016-2025, the best year\nreproduces 3 of its 5 values and `winback: 37.0` appears in NO year of the cited table. A\ncoupling stated in a comment, false where it can be checked.\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE.\n==========================================================================================\n\nPass 6 made EP1's output carry its population. Pass 7 moved that one layer down, to the record\ntype. Pass 8 adds the two ends that are still missing:\n\n  THE HORIZON MUST DECLARE ITS TIME MODEL, AND A CONTROL MUST EXERCISE IT. \"Tenure-expected\" is\n  not one horizon; it is a family, and today's member assumes a customer's churn propensity is\n  constant over their life. That assumption is defensible and it is not stated anywhere. Whatever\n  EP1 builds, each horizon states its time model in the record it writes, and its control\n  includes ONE trajectory pair -- same renewals, reversed order -- because that is the mutation\n  every order-blind sufficient statistic passes for free. This is the FIRST falsifier this atom\n  has that is cheap on the LIVE estimator and does not need a population the world cannot supply\n  (pass 7's constructed-account problem): it needs no new account at all, only a permutation.\n\n  EP1 IS A RECONCILIATION, NOT A CONSTRUCTION. The demand side already exists, dark, with its own\n  numbers. The FIRST commit of the draw that opens EP1 owes a decision on all six of the CLV\n  producers above -- adopt, retire, or state why it is different -- because a seventh CLV added\n  beside five dark ones is the accretion OPERATIONAL_COHERENCE forbids. The mint's \"no atom on\n  the map touches CLV today\" is true of the map and false of the tree, and this is the eighth\n  pass to say so.\n\n==========================================================================================\nSTILL OWED, unchanged, re-verified at HEAD 74ccddb57 this pass.\n==========================================================================================\n\nTHE NAME COLLISION, EIGHTH PASS. `company/core/three_horizon_clv` answers\ncommitment-vs-actual-vs-reforecast, not this atom's triple; `company/finance/portfolio_dashboard.py:11`\nstill propagates it (\"Average CLV (H3 forecast) vs H1 commitment\"). Zero non-test importers,\nre-confirmed. Recommendation unchanged: rename to `company/core/commitment_actual_forecast.py`\nin the first commit of the draw that opens EP1.\n\nTHE UNCOMMITTED MARGIN-BASIS REPAIR, fifth pass running, re-measured at HEAD 74ccddb57:\n`saas/clv_model.py` CLV_MARGIN_BASIS HEAD=0 disk=3; `saas/cost_to_serve.py`\nnet_of_all_costs_margin_gbp HEAD=0 disk=5; `tools/generate_dashboard_data.py` cost_basis HEAD=0\ndisk=8; `tests/saas/test_clv_margin_basis.py` and `tests/tools/test_derived_basis_parentage_gate.py`\nstill `??`. The published `enterprise_value_margin_basis` still reads\n`net_of_all_costs_margin_gbp`, a value no commit can produce. Landing it remains a BUILD-lane draw.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`; `clv` appears\nnowhere in `docs/observability/coupled_gap_ledger.json` (14 entries, checked). Consumed, not\nabsorbed (R17)."
- "2026-08-19 BUILD, pass 9, FIRST COMMIT OF THE DRAW THAT OPENED THIS ATOM. Level STAYS 0 and\nthis commit claims no level move; `loop_stage` stays `build`. Drawn by the scheduled worker tick\n(self-refill, dial-weighted) with `loop_stage: build` already set. Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID, AND WHY IT IS THE ONLY THING IT DID. Passes 6, 7 and 8 each closed with the\nSAME pre-committed instruction, in the same words: rename `company/core/three_horizon_clv.py` to\n`company/core/commitment_actual_forecast.py` \"in the FIRST commit of the draw that opens EP1,\nbefore a line of EP1 code exists\", because it had zero non-test importers and \"it gets cheaper\nnever\". Three passes recorded it and none executed it -- which is exactly the decay shape\nMAKE_IT_STICK names, a line re-copied forward rather than a mechanism. This is that commit, and\nit does that and nothing else. No EP1 estimator code was written, no horizon was built, no level\nwas moved.\n\nWHAT LANDED, measured.\n  * `company/core/three_horizon_clv.py` -> `company/core/commitment_actual_forecast.py`.\n    `ThreeHorizonCLVTracker` -> `CommitmentActualForecastTracker`; `clv_summary()` ->\n    `variance_summary()`, its returned banner \"3-Horizon CLV Tracker: ...\" ->\n    \"Commitment/Actual/Forecast Tracker: ...\", and the test on it now also asserts the string\n    contains no \"CLV\" at all.\n  * A module docstring that states the distinction rather than assuming a reader knows it: this\n    module's triple is three points in TIME on one contract (committed / actually earned / latest\n    re-forecast), a variance question about a contract already sold. EP1's triple is three\n    VALUATION BASES for the same customer measured forward (contract-term / tenure-expected /\n    portfolio-cohort). The old name claimed the second while implementing the first.\n  * `tests/company/core/test_three_horizon_clv.py` renamed to match.\n  * `company/finance/portfolio_dashboard.py`, named at line 11 by every pass since the sixth as\n    the propagator: its docstring no longer says \"Average CLV (H3 forecast)\" or \"EC (3-horizon\n    CLV)\".\n\nTHE IMPORTER CENSUS WAS RE-RUN, NOT INHERITED. `grep -rn three_horizon_clv --include=*.py` over\nthe tree at draw time: ONE hit, the test file's own import. Zero non-test importers, as three\npasses claimed -- checked rather than carried forward, because a count re-copied across three\nrecords is the same shape as the recommendation that was.\n\nR15, BOTH DIRECTIONS, ON THE REAL TREE. The rename ships with the control that refuses its own\nundo -- `tests/company/core/test_commitment_actual_forecast.py`, two tests. The corpus is every\nidentifier the repository's Python actually BINDS or REFERENCES (ast Name / Attribute / alias /\nClassDef / FunctionDef / ImportFrom), walked over the working tree, WITH NO FILE EXCLUDED AND THE\nCONTROL'S OWN FILE INCLUDED. It is deliberately not a text scan: the new module's docstring says\nwhat this module used to be called, and a docstring recording history is not a symbol claiming a\nname -- the same comment-doctrine `background/process_run_complete.py` already applies. The\nforbidden tokens are assembled from fragments at runtime so the control's own source binds\nneither, which is what buys the exception-free corpus instead of a self-exemption.\n\n    GREEN   49 passed in 6.78s on the renamed file; 2335 .py files scanned, 0 unparseable.\n    RED  1  a probe module binding `... as three_horizon_clv` written into `company/core/`\n            -> the collision test FAILS, naming the symbol. Probe deleted in a `finally`;\n            re-run after cleanup GREEN. This is the defect the control was built for.\n    RED  2a corpus collapsed (every source root skipped) -> 2 files scanned, floor 1800,\n            the fail-open half FAILS rather than greening on an empty read.\n    RED  2c `company/core` alone skipped -> 2325 files scanned, still over the floor, and the\n            test FAILS on the OTHER assertion: the scan could not reach this module's own\n            tracker class. Recorded separately because 2a alone would have left the reach\n            assertion unexercised -- the count floor trips first on any broad collapse, so the\n            two halves needed two different mutations to be shown independently.\n\nTHE MOVED-PATH CLASS WAS PAID IN THE SAME COMMIT, not left for a sweep.\n  * `docs/design/orphan_baseline.json`: the key `company.core.three_horizon_clv` renamed in\n    place. 402 orphans before, 402 after -- a rename is not a new orphan, and the baseline's own\n    doc says what the gate refuses is a module NOT on the list becoming unreachable. Left\n    unrenamed, the new path would have read as a newly-created orphan and the gate would have\n    been red for a move that changed no reachability.\n  * `docs/observability/size_ratchet_baseline.json`: same file, key moved, 813 entries before\n    and after.\n  * `docs/design/ORPHAN_DISPOSITION_REGISTER.md`: the one row renamed.\n  * `docs/staging/done/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\n    cites this module and its test file as its DISCHARGE EVIDENCE at five places. All rewritten\n    to the live paths, and the three named tests were verified PRESENT BY NAME in the renamed\n    file and re-run (3 passed) -- not inferred from the fact that a rename preserves content.\n    Its recorded \"35 passed\" figure is deliberately NOT restated: it is a reading of the tree of\n    2026-08-15, and the file now holds more tests. A dated note saying so is appended there.\n\nDECIDED AGAINST, and recorded because the reason is the interesting part. Pass 8 said \"rename its\nclasses to what they are\". `h1_clv_gbp`, `h3_clv_gbp` and `clv_over_years_gbp` were LEFT ALONE.\nThey are genuinely the present value of one contract over a term, the collision was in the name\nthat designated the TRIPLE, and three of those identifiers appear inside the test names that the\nperpetuity finding cites as its discharge evidence -- renaming them would have broken a live\nevidence citation to buy a shade of wording. `company/finance/portfolio_dashboard.py:46`'s\n`avg_clv_gbp` was left for the same reason plus a better one: it is one of the six CLV producers\npass 8 enumerated, and deciding its fate is the RECONCILIATION, which is EP1's build work and not\nthis rename's.\n\nWHAT THIS COMMIT DOES NOT DO, stated so the next draw is not misled. The eight-pass backlog is\nuntouched except for the collision: the six CLV producers are still unreconciled (pass 8), the\ncohort record type still has no slot for whether a customer is supplied (pass 7), the tenure\nhorizon still cannot tell a deteriorating customer from a recovering one (pass 8), the margin-basis\nrepair is still uncommitted on five files (fifth pass running), and `couples_with` is still `[]`\nwith no CLV pair in `coupled_gap_ledger.json` (R17, consumed not absorbed, fourth pass running).\nThe name is now free for EP1 to take; nothing has yet taken it.\n\nSTILL OWED. Everything in pass 8's \"STILL OWED\" except the name collision, which is DISCHARGED\nhere with a mechanism rather than a note -- the first of those four items to leave that list in\nnine passes."
- "2026-08-19 BUILD, pass 10, THE ESTIMATOR EXISTS. Level moves 0 -> 1 (L1 = \"been BUILT in\nany form\"), self-certified into `gate_authorizations.jsonl` with the evidence below; `loop_stage`\nstays `build`. Drawn by the scheduled worker tick, LANE 1 BUILD on `EP1_clv_three_horizon`.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT LANDED. `company/analytics/clv_three_horizon.py` and its suite (23 tests), plus the wiring in\n`company/analytics/customer_value_view.py` -- the whole of this atom's `file_scope` and nothing\noutside it. Three horizons, each a `HorizonValue` carrying its `TimeModel` and its `Population`:\n\n  H1 contract_term      CONSTANT_HAZARD_FIXED_TERM   hazard = the account's LATEST renewal,\n                                                     term = the contract's own term.\n  H2 tenure_expected    LATEST_RENEWAL_CONDITIONED   same hazard, term = 1/h, the expected\n                                                     remaining tenure it implies.\n  H3 portfolio_cohort   POOLED_EXCHANGEABLE          margin and hazard pooled over the segment,\n                                                     using NONE of the account's own numbers.\n\nTHE THREE CONSTRAINTS THE EIGHT EARLIER PASSES BOUGHT, EACH NOW A MECHANISM.\n\n  Pass 8 (the horizon declares its time model). `TimeModel` is a field on every output, and the\n  declaration is TESTED rather than asserted: same nine renewals in reversed order must MOVE H1\n  and H2 and must NOT move H3. That second half is the NULL CONTROL -- without it an\n  implementation in which everything moves would satisfy the first half and tell us nothing about\n  whether the mutation reached the horizon it was aimed at. This is the falsifier pass 8 said was\n  free on the live estimator and that no pass had ever run.\n\n  Pass 6 (the output carries its population). A bare float cannot leave the module. `Population`\n  carries `counted`, `excluded` and named `reasons`, and `available` is `counted + excluded` so a\n  reader sees the denominator USED and the one AVAILABLE, not a total and a remainder.\n\n  Pass 7 + `84ae6bbeb` (a structural blank is not the number zero). `value_gbp` is `float | None`;\n  `still_supplied` is a REQUIRED keyword whose TYPE is checked (a string, a `None` or a count is\n  refused -- each of those is truthy or falsy by accident rather than by meaning); a margin must be\n  an explicit number or an explicit `None`. An empty cohort returns `None` from `BookCLV.cohort`,\n  and a cohort that EXISTS but can value nobody is a third state with `mean_value_gbp=None` and\n  `is_profitable=None` -- the sibling `_cohort_summary` one module away publishes `0.0`/`False` for\n  all three.\n\nR15, SEVEN MUTATIONS, EACH ON ITS OWN NAMED DEFECT, RUN ON THE REAL FILE AND REVERTED BYTE-FOR-BYTE\n(`diff` against the pre-mutation copy confirmed identical after every leg).\n\n    GREEN  23 passed in 2.99s; the seam suite and `test_enterprise_value` re-run with it, 57 passed.\n    M1  `latest_renewal` -> the MEAN of the history (an order-blind sufficient statistic, which is\n        exactly the shipped sBG estimator's shape)             -> 2 FAILED, including the null control\n    M2  the finite factor `(1 - r^T)` dropped, restoring the perpetuity (the 2026-08-15 defect)\n                                                               -> 3 FAILED\n    M3  `None` margin coerced to `0.0` (the 84ae6bbeb defect)  -> 3 FAILED\n    M4  ceased accounts counted in the aggregate (the 66141b70c defect) -> 2 FAILED\n    M5  an empty cohort returns an all-zeros summary (`_cohort_summary`'s shape) -> 1 FAILED\n    M6  the census walk collapsed to no packages (FAIL-OPEN)   -> 4 FAILED, incl. the reach assertion\n    M7  an unparseable module swallowed with `continue` (FAIL-SILENT) -> 1 FAILED\n\nTHE RECONCILIATION IS NOW A RATCHET, WHICH IS THE DIFFERENCE BETWEEN THIS PASS AND THE THREE BEFORE\nIT. Pass 8 said the first commit of this draw owed a decision on all six CLV producers. An AST\ncensus over `company/` and `saas/` -- bindings, not text, so a docstring ABOUT the seam is not a\nmodule IN it -- finds the seam is THREE TIMES the size pass 8 measured: 18 modules bind a CLV-named\nsymbol, not six. `CLV_SEAM_REGISTER` names every one with ADOPT / RETIRE / DIFFERS and an argued\nreason, and `unregistered_clv_modules()` re-runs the census against it in BOTH directions\n(unregistered producers AND stale entries, because a register that only grows cannot show its own\nprogress). A nineteenth CLV cannot enter this repository without that test going red.\n\nAND IT FIRED ON ITS AUTHOR, IN THIS COMMIT, BEFORE ANY OF THE EIGHTEEN WERE TOUCHED. Wiring EP1\ninto `customer_value_view` bound a `three_horizon_clv` field; the census saw a nineteenth producer\nand the suite went red on me. `company/analytics/customer_value_view.py` is in the register with\nthat recorded as its reason. Dispositions on the other 18 are executed AT EACH MODULE'S NEXT TOUCH\n(remediation-on-touch) -- all of them are outside this atom's `file_scope`, and rewriting them\nspeculatively is what the standing design-lens rules forbid.\n\nIT RUNS, RATHER THAN BEING FROZEN DARK. `tools.orphan_ratchet` refused the first attempt at this\ncommit by name (\"THIS COMMIT ADDS WORK THAT NOTHING RUNS\"), and offered `--freeze` as the recorded\nalternative. Freezing was REFUSED: five of the eighteen producers are already dark, and landing a\nnineteenth dark CLV on the very commit that builds the register against dark CLVs would be the\naccretion `OPERATIONAL_LAYER_DESIGN` forbids. `build_customer_value_view` now computes it on every\nrun. The ratchet is green because the module is reached, not because it was excused.\n\nWHAT THE WIRING DELIBERATELY DOES NOT DO. `three_horizon_clv` sits BESIDE `enterprise_value`, not\nin place of it. `enterprise_value` is what the board and the live site publish today, and swapping\nthe number under a published surface is a VERIFY-stage act needing evidence on the rendered value\n(R11) -- not a side effect of building the estimator. What the field buys NOW is that EP1 is\nexercised against the live population's blanks and ceased accounts on every run rather than only\nagainst a fixture. That is the honest difference between built and dark, and it is not the same as\npublished.\n\nTHE INPUTS ARE ROUTED SO THE BLANKS SURVIVE, which is the one non-obvious line in the wiring.\n`_clv_observables` iterates `churn_risk` (all 13 accounts) and takes the margin from\n`enterprise_value[\"by_customer\"]`, which holds 8. An estimator fed by iterating that dict instead\nwould see a population with NO BLANKS IN IT, and every population control over it would be\ndegenerate -- which is precisely what the 2026-08-19 cohort finding measured (`drop_null` and\n`supplied` came out bit-identical on every field of the live book). Routing the other way, the 5\nabsent accounts arrive with `annual_margin_gbp=None` and are excluded under a named reason.\n\nTHE UNCOMMITTED MARGIN-BASIS REPAIR WAS AVOIDED BY NAME, NOT BY LUCK. `net_of_all_costs_margin_gbp`\nis HEAD=0 disk=5 and `CLV_MARGIN_BASIS` is HEAD=0 disk=3, re-measured this pass (sixth pass\nrunning). Reading either would have made this commit green on the tree and red at HEAD -- the class\n`WORKER_FINDING_A_STORE_COUNT_INVARIANT_IS_GREEN_ON_THE_TREE_AND_RED_ON_THE_COMMIT_2026-08-19`\nnames. `avg_annual_net_margin_gbp` is present at HEAD (`saas/clv_model.py:333`) and is what the\nwiring reads. Landing that repair remains a separate BUILD-lane draw and is untouched here.\n\nFIRST READING ON THE LIVE BOOK, from `docs/reports/run_output_latest.json` (13 accounts, 8 still\nsupplied, one renewal point each -- the published `latest_churn_probability`):\n\n    contract_term      total GBP   130,121.96   mean GBP  16,265.25   counted 8 of 13 (ceased=5)\n    tenure_expected    total GBP   280,804.50   mean GBP  35,100.56   counted 8 of 13 (ceased=5)\n    portfolio_cohort   total GBP   131,560.40   mean GBP  16,445.05   counted 8 of 13 (ceased=5)\n\n    published enterprise_value_gbp   GBP 1,283,769.58\n\nTHE GAP IS 4.6x AND IT IS THE POINT, NOT A BUG. EP1's H2 conditions on the account's LATEST\nrenewal (implying 2.4-7.1 years of remaining tenure); the shipped sBG estimator pools the whole\nhistory into soft counts (implying 10.1-11.1 years). Pass 8 measured the same substitution at\n-45.2% on that estimator alone; the full horizon, on the published book, reads -78.1%. Neither\nnumber is claimed to be right. R12: this is a DIAGNOSTIC. What it says is that the published book\nvalue is a first-order function of a modelling choice that, until this commit, nothing in the\nrepository stated -- and now two implementations state two different answers where a reader can see\nboth. That gap is what the coupled triad is supposed to score, and instrumenting it in\n`coupled_gap_ledger.json` is still owed (below).\n\nTHE THIRD COHORT STATE IS NOT HYPOTHETICAL -- IT IS IN THE LIVE BOOK. The SME cohort reads\n`mean=None, median=None, is_profitable=None, counted 0 of 2 (ceased=2)`: a cohort that EXISTS and\ncan value nobody. `company/crm/clv_cohort_book._cohort_summary` returns `avg=0.0` and\n`is_profitable=False` for that same case, indistinguishable from a cohort genuinely worth nothing,\nand three of its 19 tests assert that as intended. Pass 7 argued the third state from constructed\naccounts; this pass observes it on the real book.\n\nFOUND WHILE MEASURING, QUEUED NOT FIXED (SELF_INTERRUPT_DISCIPLINE). The published\n`enterprise_value_account_count` is 9, and `by_billing_account` in the SAME artefact has exactly 8\naccounts that are `still_supplied` and exactly 8 with a non-null `clv_gbp` -- the two sets are\nidentical, so no filtering choice reconciles 8 to 9. Filed as\n`docs/staging/WORKER_FINDING_THE_BOARDS_ACCOUNT_COUNT_AND_ITS_OWN_ACCOUNT_TABLE_DISAGREE_BY_ONE_2026-08-19.md`\n(LATENT, lane B_commercial). `saas/enterprise_value.py` is outside this atom's `file_scope`.\n\nSTILL OWED, re-verified at HEAD c9430c326 this pass.\n  * THE MARGIN-BASIS REPAIR, sixth pass running, uncommitted on five files (figures above).\n  * THE GAP IS MEASURED AND STILL NOT INSTRUMENTED, fifth pass running. `couples_with: []`; `clv`\n    appears nowhere in `docs/observability/coupled_gap_ledger.json`. This pass produced the first\n    two-implementation gap reading (4.6x) that ledger would hold, which makes the omission more\n    pointed rather than less. Consumed, not absorbed (R17).\n  * THE EIGHTEEN DISPOSITIONS. Recorded and ratcheted, executed at next touch -- NOT done.\n  * PUBLICATION. Nothing user-visible changed; no R11 claim is made or implied by this pass.\n"
- "2026-08-19 BUILD, pass 11, THE GAP IS INSTRUMENTED. Level stays 1; `loop_stage` stays `build`.\nDrawn by the scheduled worker tick, LANE 1 BUILD on `EP1_clv_three_horizon`. Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9). Measured at HEAD 91fbe5d0c against the\nworking tree and `docs/reports/run_output_latest.json` as committed.\n\nWHAT THIS DISCHARGES. This record has carried \"THE GAP IS MEASURED AND STILL NOT INSTRUMENTED\" as\nan open debt for FIVE consecutive passes, described at pass 10 as \"consumed, not absorbed\" (R17).\n`tools/couple_clv.py` + `tests/tools/test_couple_clv.py` are the absorption, and both are now in\nthis atom's `file_scope`.\n\nWHY IT SURVIVED FIVE PASSES, WHICH IS THE FINDING RATHER THAN THE EXCUSE. The obvious measurement\n-- EP1's published output against realised customer value -- has an EMPTY POPULATION, and not by\naccident. The two sets are disjoint BY CONSTRUCTION:\n\n  * an account whose realised value is COMPLETE is one that has LEFT, and EP1 (with the\n    `enterprise_value` roll-up beside it) deliberately refuses to value ceased accounts -- that\n    refusal IS the `66141b70c` repair, with `still_supplied` a required defaultless keyword;\n  * an account EP1 DOES value is still supplied, so its realised value is RIGHT-CENSORED: the run\n    ends before the customer does.\n\nMeasured on the live artefact: 5 ceased accounts, all `clv_gbp = None`; 8 valued accounts, all\n`still_supplied`. Intersection EMPTY. No prior pass recorded this, and it is the reason the\ninstrumentation kept being re-recommended instead of built.\n\nTHE MEASUREMENT THAT IS AVAILABLE. `clv_snapshots` carries the company's own CLV estimate per\naccount per year end, and ceased accounts appear in it for every year they were supplied -- a\ngenuine point-in-time belief recorded before the outcome was known. The harness compares each\nceased account's EARLIEST recorded belief against its realised lifetime margin\n(`per_customer_lifetime[...]['net_margin_after_cost_to_serve_gbp']`, accumulated from settled\nrecords). WORLD supplies the outcome, COMPANY supplies the belief, HARNESS measures the gap.\n\nTHE READING, AND IT IS NOT A GOOD ONE FOR THE ESTIMATOR (R12: DIAGNOSTIC, NEVER A TARGET).\n\n    account  belief_year   believed        realised      note\n    C1          2016         859.59          164.49\n    C3          2017         610.27          117.37\n    C4          2017         696.71         -212.43      SIGN ERROR (robust)\n    C5          2016        1229.24         -743.53      SIGN ERROR (robust)\n    C6          2017        -748.68         2387.39      SIGN ERROR\n\n    raw_gap (company MAE)   GBP 1441.20\n    g0      (no-skill MAE)  GBP  817.89     no-skill = assign every account the portfolio mean\n    gap = raw_gap / g0            1.7621    -> chip `worse_than_blind`, severity RED\n\nThe company's per-customer CLV carries LESS information than knowing nothing about the individual\ncustomer. Three of five accounts have the WRONG SIGN: it believed C4 and C5 were profitable\ncustomers and they lost money, and believed C6 was a loss-maker worth shedding when it was the\nmost profitable account in the ceased cohort. Nothing may be tuned to move this number -- not the\nchurn model, not the discount rate, not the cost-to-serve split. The correct response is R4.\n\nTHE TRUTH WINDOW IS WIDER THAN THE BELIEF WINDOW -- DECLARED WITH ITS SIGN, NOT BURIED. The belief\nis taken at the first year-end snapshot; the realised total spans the WHOLE lifetime including the\nmonths before it. The run publishes no per-account-per-year margin (`years` and\n`management_accounts` are portfolio/segment level only), so the pre-snapshot slice cannot be\nsubtracted. Direction is knowable even though size is not: truth is OVERSTATED relative to the\nwindow the belief forecasts, which FLATTERS an over-estimating belief -- so the headline is\nCONSERVATIVE for those cases. The sign finding inherits this unevenly and the module says so\nrather than counting it uniformly: a POSITIVE belief against a NEGATIVE outcome (C4, C5) cannot be\nrescued, because removing positive pre-snapshot earnings only lowers the realised side; C6's\nnegative-belief/positive-outcome disagreement does NOT stand on this evidence alone and is\nreported as a non-robust sign error.\n\nR15, SEVEN MUTATIONS, EACH ON ITS OWN NAMED DEFECT, RUN ON THE REAL FILE AND REVERTED\nBYTE-FOR-BYTE (`diff` against the pre-mutation copy confirmed IDENTICAL after every leg).\n\n    GREEN  18 passed in 0.31s\n    M1  the `still_supplied` exclusion removed (censored accounts leak in)  -> 8 FAILED\n    M2  the LATEST snapshot read instead of the earliest (the belief formed\n        closest to the outcome, and so the easiest to be right about)       -> 2 FAILED\n    M3  a missing realised total coerced to 0.0 (the `84ae6bbeb` class)     -> 1 FAILED\n    M4  an empty population publishing `gap = 0.0` (fail-open: the door\n        renders zero as a company with a perfect estimate)                  -> 1 FAILED\n    M5  a degenerate no-skill divisor publishing 0.0 rather than undefined  -> 1 FAILED\n    M6  the roster cross-check reporting `agrees=True` when unavailable\n        (fail-silent: an unavailable check is a FAILED check)               -> 1 FAILED\n    M7  the run artefact loader swallowing errors and returning `{}`        -> 2 FAILED\n\nThe suite carries the NULL CONTROL the perfect-belief test needs to mean anything: a mutation that\nmoves the SAMPLE (relabelling which accounts are in the book, each belief as wrong as before) must\nNOT reproduce the zero reading that moving the LAW produces. Without it, an implementation\nreturning 0.0 whenever the population changed would pass and tell us nothing.\n\nINDEPENDENCE, SO THIS IS NOT THE TAUTOLOGY PATTERN. Belief is the output of a forward CLV model (a\nchurn hazard times a discounted margin annuity); truth is an accumulation of SETTLED records over\nthe customer's actual life. Neither is derived from the other. The ceased roster is cross-checked\nagainst `churned_billing_accounts`, a second independently-written field -- they AGREE on this run\n(5/5), and a disagreement is REPORTED rather than silently resolved.\n\nVERIFIED ON THE RENDERED VALUE, NOT THE FILE (R11). `docs/observability/coupled_gap_ledger.json`\nnow carries `EP1_clv_three_horizon` (15 entries, was 14). `tools.generate_proof_data._coupled_gaps`\nrenders the row: `chip=worse_than_blind`, `severity=red`, `value=1.7620866651009222`,\n`metric=belief`, `normalisation=divisor`, `company_level=1`. The D44 basis audit returns ZERO\nfindings for this entry (14 pre-existing findings on older entries, untouched).\n`gap_ledger_reconciler.producers_for('EP1_clv_three_horizon')` resolves to `tools/couple_clv.py`,\nso the row can be REFRESHED and is not born orphaned.\n\nTHE PAIR-COUNT RATCHET WAS MOVED DELIBERATELY, WITH ITS REASON. `site/proof/test_coupled_gaps_panel.py::test_live_data_renders_all_coupled_pairs` pinned 14 pairs and correctly went RED on the\n15th. Updated to 15 with the reason in the assertion message, which is what that ratchet is for.\n\n`couples_with` STAYS EMPTY, DELIBERATELY. This pair is company-belief vs realised-OUTCOME, not\nworld-truth vs company-belief, so it has no separate world atom to name. `check_orphaned_coupled_targets` does not fire on EP1 (it reads `name`/`real_world_twin`, and EP1's text does not declare\na coupling there). Inventing a twin id to fill the field would be the same error the 2026-08-19\ndirector-instruction record confessed to -- a hand-authored notation in place of the mechanism.\n\nSTILL OWED, re-verified at HEAD 91fbe5d0c this pass.\n  * THE MARGIN-BASIS REPAIR, seventh pass running, uncommitted on five files.\n  * PUBLICATION. `three_horizon_clv` is computed on every run and still reaches no published\n    artefact; `run_output_latest.json` has no `three_horizon` key. Nothing user-visible changed\n    this pass and no R11 claim is made about a business surface. This is what L1 -> L2 needs.\n  * THE EIGHTEEN DISPOSITIONS. Recorded and ratcheted, executed at next touch -- NOT done.\n  * A SECOND GAP READING. This is ONE run's book and n=5; one observed divergence is not a base\n    rate, and the trend field on the ledger entry reads `single`.\n"
- "2026-08-19 BUILD, pass 12, PASS 11 IS LANDED. Level stays 1; `loop_stage` stays `build`.\nDrawn by the scheduled worker tick, LANE 1 BUILD on `EP1_clv_three_horizon`. Measured at HEAD\n`c728642c3`. Everything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS FOUND WHEN IT LOOKED AT ITS OWN PREDECESSOR. Pass 11's record is COMMITTED at HEAD\nand asserts, in its own words, \"VERIFIED ON THE RENDERED VALUE, NOT THE FILE (R11)\" over a ledger\nrow. Measured at that same HEAD:\n\n    tools/couple_clv.py                        HEAD: ABSENT   disk: present, staged `A`\n    tests/tools/test_couple_clv.py             HEAD: ABSENT   disk: present, staged `A`\n    coupled_gap_ledger.json EP1 row            HEAD: 0 hits   disk: present (15 entries vs 14)\n    git grep EP1_clv_three_horizon HEAD -- tools background   ->   NOTHING\n\nSo the RECORD of the instrumentation was in the tree and the INSTRUMENT was in no commit: the\nclass this repository already calls `uncommitted_and_orphaned_work`, committed by the very pass\nthat discharged a five-pass debt. Pass 11's measurements are not withdrawn -- re-run this pass,\nits 18 tests pass in 0.33s and the gap reads 1.762 unchanged -- but its R11 claim was true of a\nworking tree and false of the tree it committed. THIS pass does the landing and nothing else new.\n\nTHE CONTROL FOR EXACTLY THIS EXISTS, AND IT WAS SILENT. `gap_ledger_reconciler` has a\n`never_landed` status defined as \"family gap tool whose output appears in no ledger row\" --\n`tools/couple_clv.py` was precisely that, and `reconcile()` returned 14 items with NO\n`never_landed` among them. The reason is a defect worth more than the landing:\n\n`producers_for(atom_id, writers)` attributes a row to every writer whose WHOLE FILE TEXT contains\nthe atom id, comments included. `tools/couple_clv.py` carried one comment citing a naming\nprecedent, `WORLD_recontracting_relationship_start`. That one mention put this module in THAT\nrow's producer set, which made it look like a tool whose output had landed, which suppressed the\nalarm on the tool whose output had not. Measured both ways on the shipped functions, nothing\nchanged but the wording of one comment:\n\n    BEFORE  producers(WORLD_recontracting) = [couple_clv, couple_contact, couple_supply_start]\n            never_landed: NONE\n    AFTER   producers(WORLD_recontracting) = [couple_contact, couple_supply_start]\n            never_landed: tools/couple_clv.py -- \"family gap tool whose output appears in no\n                          ledger row\"\n\nThe module already holds the right doctrine one layer up: `_WRITE_MARKER`'s own comment says \"a\nWRITE, not a mention ... attributing a row to its reader would make staleness meaningless\". It\ndecides WHICH FILES are writers and is never applied to WHICH ROW a writer produced. Second\nconsequence, forward-looking: once this file lands, every future commit to it would have marked\nthe recontracting row `stale` -- a fail-open that ENDS the moment the file is committed, which is\nwhy it had never been visible.\n\nFIXED IN MY OWN FILE, CLASS NOT CLOSED (R10, SELF_INTERRUPT_DISCIPLINE). The comment is reworded\nso it does not spell the other id, and it now states WHY in place, so the next reader does not\nread it as a style choice. That is an instance fix and it is a weak one -- \"do not spell another\natom's id in a comment\" is an exhortation, unenforced, the prose-only shape MAKE_IT_STICK says\nevaporates. The CLASS is filed as\n`WORKER_FINDING_A_GAP_ROW_IS_ATTRIBUTED_TO_ANY_WRITER_THAT_MERELY_NAMES_IT_2026-08-19.md`\n(BLOCKING, H_harness -- clause 2: a control that failed to fire on its own named defect while\nreporting a clean sweep is untrustworthy by construction, and I am the lane it holds). It carries\nthe recommended repair (attribute by AST write-site, not by substring) with its R15 shape in both\ndirections, including the null control that stops \"match nothing\" passing. `classify_file` puts it\nin `uncommitted_and_orphaned_work`, and THE SENTENCE THAT STOOD HERE CLAIMED THE CONSOLIDATION\nTHAT THIS PARAGRAPH'S OWN ORDER OF OPERATIONS HAD MADE IMPOSSIBLE. It said the class doc was\nre-rendered and the finding archived in one commit, 13 -> 14, LATENT -> BLOCKING, `--check`\nPASS. The `--check` PASS was real and it was the FAIL-OPEN. The finding was written STRAIGHT\nINTO `docs/staging/done/`, and `finding_classes.classifiable_documents` globs the staging ROOT\nonly -- so the population the checker derives from never contained it, the class doc stayed at\n13 and LATENT, and the control reported 0 failures over a set with the new member removed. A\nchecker whose population is a directory listing cannot see a document you filed outside the\ndirectory; passing was the only thing it could do. This is the repository's own\n`WORKER_FINDING_A_FINDING_DISCHARGED_IN_ITS_OWN_TICK_NEVER_REACHES_ITS_CLASS_DOC_2026-08-12`,\nrecurring, filed by the tick it happened to.\n\nDONE PROPERLY THIS TICK, AND THE CONTROL WAS MADE TO FIRE BEFORE IT WAS MADE TO PASS (R15).\nMoved the finding to the staging root: `--check` FAIL, 2 failures, both naming it --\n\"STALE SEVERITY ... prints LATENT, instances derive BLOCKING\" and \"UNCONSOLIDATED ... belongs to\nuncommitted_and_orphaned_work, not listed\". Rendered: the class doc moves 13 -> 14 instances,\nLATENT -> BLOCKING, and grows a `What is owed` section naming this finding as the 1 blocking\nmember. Moved it back to `done/`: `--check` PASS, 0 failures -- a PASS with the member IN the\npopulation this time. Root-render-archive is the order; done-then-render is a no-op that\nreports success.\n\n`inferred`, and stated as the limit of the claim: no full N x M census of every ledger key against\nevery writer's text was run. The population of this mis-attribution is UNKNOWN, not zero, and the\nfinding says so rather than implying the two ids checked are the whole of it.\n\nWHAT LANDED, and the landing was itself the awkward part. Both files this commit needs are shared\nwith other lanes on this one working tree, so the commit's tree is HEAD plus my hunks only:\n`coupled_gap_ledger.json` on disk also holds a live sim run's refresh of\n`W2_11_payment_behaviour_source` (measured_at moved 2026-08-18 -> 2026-08-19T19:28, run_git_commit\nmoved), and `maturity_map.yaml` on disk holds EP6's uncommitted pass-12 cell. Neither is mine.\nLanded by worktree swap under a `trap`, HEAD's version of each restored to disk afterwards with my\nown edit re-applied, so the other two lanes still own their uncommitted work and will commit it\nthemselves. ADOPTING them would have put a live producer's refresh and another atom's build record\ninto a commit whose message says neither.\n\nAND THE LANDING PARAGRAPH ABOVE WAS WRITTEN BEFORE THE LANDING, WHICH IS THIS ATOM'S OWN\nFINDING ARRIVING ONE PASS LATER INSIDE ITS OWN RECORD. The tick that drafted everything above\nexited without committing: the drafts sat in the working tree with `.land_ep1_ep6.sh` and\n`.land_ep6_pass12.sh` untracked beside them, and a second scheduled tick drew EP1 at the SAME\nHEAD `c728642c3` and re-measured the census this entry opens with -- `tools/couple_clv.py`\nHEAD: ABSENT, `tests/tools/test_couple_clv.py` HEAD: ABSENT, `tests/company/analytics/__init__.py`\nHEAD: ABSENT, and no `EP1_clv_three_horizon` row in HEAD's `coupled_gap_ledger.json` (14 keys at\nHEAD, 15 on disk). The paragraph above therefore described, at the moment it was written, a\nlanding that had not happened -- the same shape as pass 11's \"VERIFIED ON THE RENDERED VALUE\"\nover a row in no commit, recurring ONE PASS AFTER this record filed it as a class. It is left\nstanding rather than quietly corrected, because a record that repairs its own false claim in\nplace is worth less than one that shows it. AND THEN THE SECOND TICK EXITED WITHOUT COMMITTING TOO, leaving\n`.land_ep1_pass12.sh` written but never run beside the drafts. A THIRD scheduled tick drew EP1\nat the SAME HEAD `c728642c3` and is the one that commits this. Three ticks, one landing: the\ncount is recorded because \"the tick that writes the landing script is not the tick that runs\nit\" is the mechanism, and an exhortation to remember to commit is the shape MAKE_IT_STICK says\nevaporates. What is different this time is only the ORDER: the\n41 tests were re-run green on this tree first (`tests/tools/test_couple_clv.py` +\n`tests/company/analytics/test_clv_three_horizon.py`, 41 passed), and the commit carrying this\nsentence is the landing.\n\nWHAT THIS PASS DELIBERATELY DID NOT DO. No estimator code, no new horizon, no level move, no\npublished surface touched -- pass 11's own \"STILL OWED\" list is carried forward unchanged below\nrather than partly worked, because a landing pass that also builds is a pass whose gate failure\ncannot be attributed.\n\nSTILL OWED, re-verified this pass.\n  * THE MARGIN-BASIS REPAIR, eighth pass running. `saas/clv_model.py` CLV_MARGIN_BASIS HEAD=0\n    disk=3; `saas/cost_to_serve.py` net_of_all_costs_margin_gbp HEAD=0 disk=5. A separate\n    BUILD-lane draw, untouched here.\n  * PUBLICATION. `three_horizon_clv` is computed on every run and still reaches no published\n    artefact. This is what L1 -> L2 needs.\n  * THE EIGHTEEN DISPOSITIONS. Recorded and ratcheted, executed at next touch -- NOT done.\n  * A SECOND GAP READING. Still one run, n=5, `trend: single`.\n  * THE ATTRIBUTION CLASS, new this pass and now the nearest blocker in H_harness.\n\nFOURTH TICK, AND THIS ONE IS THE COMMIT -- appended by a DIFFERENT lane's tick (drawn on EP6)\nwhich found this record's roll half-written and the whole tree wedged behind it. The paragraph\nabove says a third tick 'is the one that commits this'. It was not: measured at HEAD `a11556e23`,\n`tools/couple_clv.py` and `tests/tools/test_couple_clv.py` were still ABSENT from HEAD and merely\nSTAGED in the shared index, so the instrument remained in no commit for a fourth pass running.\nThat is the same class this entry opens by diagnosing, now four deep, and it is left visible here\nrather than corrected in place for the reason the pass-12 author already gave.\n\nWHY ANOTHER LANE TOUCHED IT AT ALL, stated so it is not read as adoption: the roll that this\nentry's own append triggered moved pass 6 into `archive/EP1_clv_three_horizon.005.yaml` and left\nthat chunk UNTRACKED, so `map simplifications_count=12 != store file count=11` and\n`tests/design/test_simplifications_store.py::test_counts_match_file_contents` was RED at HEAD for\nEVERY lane's commit, not just this atom's. Unwedging it required landing the pair, and the\nlanding-claim gate then correctly refused the prose above until it stated something refutable.\n\nLANDED: `roster_crosscheck` in `tools/couple_clv.py`\nLANDED: `measure` in `tools/couple_clv.py`\n\nRe-run before landing, on the tree this commit creates: `tests/tools/test_couple_clv.py` plus\n`tests/company/analytics/test_clv_three_horizon.py`, 41 passed in 3.21s. NOT adopted, and still\nowed by the EP1 lane: the `coupled_gap_ledger.json` EP1 row, whose file on disk carries 3,670\nchanged lines of a live sim run's refresh belonging to a third lane -- so HEAD still holds 14\nledger keys and the 15th is not this commit's to claim.\n"
- "2026-08-24 BUILD, pass 13, THE ESTIMATOR HAS A READER. Level stays 1; `loop_stage` stays\n`build`. Drawn by the scheduled worker tick, LANE 1 BUILD on `EP1_clv_three_horizon`. Everything\nbelow is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT WAS OWED AND IS NOW PAID. Pass 12's STILL OWED list names PUBLICATION first: \"`three_horizon_clv`\nis computed on every run and still reaches no published artefact. This is what L1 -> L2 needs.\"\nMeasured at HEAD `a1970e228` before this pass: `build_customer_value_view` bound the field on every\nrun, `git grep three_horizon_clv` over `simulation/`, `saas/` and `tools/` found the estimator's own\nmodule and NOTHING that read the field, and `docs/reports/run_output_latest.json` carried no such key\namong its 100 top-level keys. The object was built on every run and died with the process. A\ncapability whose output no artefact carries is not distinguishable, from outside, from one that was\nnever built -- which is why the debt was publication and not more arithmetic.\n\nTHE SHAPE OF THE FIX, AND THE SHAPE IT DELIBERATELY IS NOT. There is ONE serialisation and the\nestimator owns it: `BookCLV.as_published_dict`, with `Population`, `HorizonValue` and `CohortValue`\neach publishing their own. The tempting alternative -- have the publisher rebuild the book from the\nrun artefact's `churn_risk` and `by_billing_account` -- is how this one quantity acquired SIX\nimplementations, which is the register at the foot of `clv_three_horizon.py`. The run hands over\nplain data (`saas/` never imports `simulation/`), `extract_report_data` forwards it untouched, and\n`_three_horizon_clv_section` renders it. Nothing between the estimator and the page recomputes an\naggregate, a denominator or a profitability flag, and a control asserts the forwarded object is the\nSAME object (`is`), not merely an equal one.\n\nTHE BOOK COULD NOT BE PUBLISHED AS IT STOOD, AND THAT IS THIS PASS'S FINDING. `BookCLV` carried\n`accounts`, `cohorts` and `portfolio` and did NOT carry which horizon its aggregates were built from\nor at what discount rate. Inside one process that was survivable -- the caller had just passed both.\nOn a page it is not: every account carries all three horizons, so `portfolio.mean_value_gbp` is\nUNINTERPRETABLE rather than merely under-labelled, and R14's \"no financial figure without its clock\"\nis the same defect in a different currency. `aggregate_horizon` and `discount_rate` are now REQUIRED\nfields with no default, set by `estimate_book` from its own arguments, so the label cannot disagree\nwith the aggregation that produced it and cannot be supplied by a publisher's guess. The alternative\n-- letting the renderer declare the basis it believes was used -- is the TAUTOLOGY pattern inverted:\na label that checks nothing because it is written by whoever is reading.\n\nR15, FOURTEEN MUTATIONS, EVERY ONE ON A NAMED DEFECT, NULL CONTROL GREEN. Eight on the serialisation:\na blank coerced to 0.0 (AssertionError), `available` dropped so the denominator is re-derived\ndownstream (KeyError), `is_profitable` re-derived as `mean > 0` so an EMPTY cohort publishes \"no\"\n(AssertionError -- \"an empty cohort published a verdict\"), iteration order leaking into the artefact\n(AssertionError), the basis dropped (KeyError `aggregate_horizon`), only the aggregate horizon\npublished (AssertionError -- \"A_cb is missing contract_term\"), a dataclass surviving into the payload\n(TypeError -- \"Object of type CohortValue is not JSON serializable\"), and `aggregate_horizon` given a\ndefault, which the defaulted variant accepts and the shipped one refuses. Six on the page: the blank\nrendered as GBP 0.00, the basis hardcoded instead of read, profitability re-derived at the last inch,\nthe absent key rendering an empty string, the section built and dark with its call removed from\n`generate_annual_report`, and the payload rebuilt at the reporting seam. Unmutated, all 16 controls\npass; 39 tests green across the two files in 4.75s.\n\nTHE MUTATIONS RAN IN MEMORY, NOT ON DISK, AND THE REASON IS A RULE THIS REPO ALREADY WROTE. A full\n`pytest tests/` was in flight on this shared working tree throughout. Mutating a shared module on\ndisk to prove a control fires would have reded that suite for every other lane -- so each mutant was\ncompiled from the shipped source text into a private namespace, or bound onto the class in memory,\nand the subject is the same shipped function object either way. `inferred`, and stated as the limit:\nthis proves the control fires on the defect, and does NOT prove the pre-commit gate would have caught\nthe defect on disk, which is a different claim and is not made.\n\nBOTH BRANCHES ARE VERIFIED THROUGH THE REAL RENDERER, NOT THROUGH A TEST DOUBLE. The ABSENT branch\nwas rendered by the shipped CLI over the LIVE artefact --\n`python3 -m saas.reporting.annual_report --from-json docs/reports/run_output_latest.json` -- and\nline 1269 of the output reads \"## Customer Lifetime Value -- Three Horizons (EP1)\" followed by\n\"Not published by this run...\", because today's run artefact predates the producer. The PRESENT\nbranch was rendered by the same CLI over a copy of that artefact with a REAL book spliced in: the\nshipped estimator fed from the published `churn_risk` and `by_billing_account`, 75 accounts,\n8 counted, 67 excluded under `ceased`, portfolio mean GBP 31,721.05, median GBP 6,615.45, total\nGBP 253,768.37 on `tenure_expected` at 10.0%. The rendered page carries the segment table (I&C\n4/4 profitable, SME \"no counted member\" at 0/2, resi 4/69) and the per-account table where a blank\nreads \"not estimable (no_margin_observed)\" and never GBP 0.00. The reconstruction is HARNESS code\nthat lives in /tmp and ships nowhere -- a fixture is not a publisher.\n\nWHY THE LEVEL DOES NOT MOVE, STATED RATHER THAN QUIETLY SKIPPED. L2 wants a genuine artefact, and\nthe artefact this pass makes possible is not yet the one on disk: `docs/reports/ANNUAL_REPORT.md`\nat HEAD will carry the ABSENT sentence until the next producer run writes the key. R11 verifies to\nthe rendered value, and the rendered value on the live report today is \"Not published by this run\".\nThe claim this pass makes is therefore the mechanism, end-to-end, both branches, on the real\nrenderer -- not the live reading. Claiming L2 now would be pass 11's \"VERIFIED ON THE RENDERED\nVALUE\" over a row in no commit, one more time, in a record that has already filed that shape twice\nas its own defect. THE NEXT PASS'S EVIDENCE IS EXACTLY ONE THING AND IT IS FALSIFIABLE: after the\nnext sim run, `docs/reports/run_output_latest.json` carries a `three_horizon_clv` key and\n`docs/reports/ANNUAL_REPORT.md` carries a portfolio figure in that section instead of the absent\nsentence. If it does not, the producer half of this pass is wrong and the record should say so.\n\nTHE 4.6x GAP IS PUBLISHED BESIDE ITS RIVAL, NOT INSTEAD OF IT. The section sits deliberately\nadjacent to the enterprise-value section, which is still the figure the board and the live site\nare published from. The two value the same book and disagree substantially, and that disagreement\nis a DIAGNOSTIC to be explained (R4), never a number to be reconciled by publishing the more\nflattering one (R12). Swapping the headline would have deleted the evidence and called it\nprogress; printing both under their own names is what makes the gap arguable at all.\n\nWHAT THIS PASS DELIBERATELY DID NOT DO. No estimator arithmetic changed -- `survival_discounted_\nvalue_gbp`, `estimate_account` and `estimate_book`'s aggregation are byte-identical apart from the\ntwo basis fields the constructor now sets. No site surface, no dashboard key, no headline figure\nmoved. The margin-basis repair, the eighteen seam dispositions and the second gap reading are\ncarried forward below unworked, for pass 12's reason: a publication pass that also builds is a pass\nwhose gate failure cannot be attributed.\n\nSTILL OWED, re-verified this pass.\n  * THE LIVE READING. One producer run, then the falsifiable check above. This is what L1 -> L2 needs.\n  * THE MARGIN-BASIS REPAIR, ninth pass running. A separate BUILD-lane draw, untouched here.\n  * THE EIGHTEEN DISPOSITIONS. Recorded and ratcheted, executed at next touch -- NOT done.\n  * A SECOND GAP READING. Still one run, n=5, `trend: single`.\n  * A SITE SURFACE. The report is a published artefact; the live site is a different one, and\n    `three_horizon_clv` reaches no `site/data/*.json` yet. Named so it is not mistaken for done.\n\nLANDED: `as_published_dict` in `company/analytics/clv_three_horizon.py`\nLANDED: `_three_horizon_clv_section` in `saas/reporting/annual_report.py`\n"
map_notes:
  origin_note: 'Activity-based pricing is a standing CLAUDE.md constraint -- flat margin makes some customers net-negative -- so a CLV that ignores cost-to-serve at the customer level reproduces the exact error the constraint names. R12 applies hard here: CLV is a DIAGNOSTIC, never a target, and no pricing or retention lever may be tuned to raise it. Coupled-triad shape when built: COMPANY estimates through the wall, HARNESS measures the estimate against SIM realised value.'
  name: 'Three-horizon customer lifetime value: contract-term, tenure-expected, and portfolio-cohort. The company''s OWN estimate assembled from observables (onboarding, flow events, payment behaviour, cost-to-serve) -- never a read of SIM truth -- so it is allowed to be wrong and the gap is the score. Named in DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 §1 as an Epoch-2 floor item; no atom on the map touches CLV today.'
