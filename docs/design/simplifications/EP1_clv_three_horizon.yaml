gn for all four accounts -- and on C2 they return CLV:CAC of 2.76\nand 6.15, which straddle the 3x hurdle `acquisition_strategy_book` publishes as `is_viable`. One\nof four live residential accounts changes acquisition verdict on the choice of estimator.\n\nTwo smaller measured items in the same seam. (a) The two CAC tables disagree: pcw GBP 48 vs\nGBP 65 in 2025 (+35%), direct GBP 30 vs GBP 28, referral GBP 20 vs GBP 20. (b)\n`acquisition_strategy_book.py:14` says \"CAC benchmarks by channel from\ncompany/crm/acquisition_cost.py\"; executed against every year 2016-2025, the best year\nreproduces 3 of its 5 values and `winback: 37.0` appears in NO year of the cited table. A\ncoupling stated in a comment, false where it can be checked.\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE.\n==========================================================================================\n\nPass 6 made EP1's output carry its population. Pass 7 moved that one layer down, to the record\ntype. Pass 8 adds the two ends that are still missing:\n\n  THE HORIZON MUST DECLARE ITS TIME MODEL, AND A CONTROL MUST EXERCISE IT. \"Tenure-expected\" is\n  not one horizon; it is a family, and today's member assumes a customer's churn propensity is\n  constant over their life. That assumption is defensible and it is not stated anywhere. Whatever\n  EP1 builds, each horizon states its time model in the record it writes, and its control\n  includes ONE trajectory pair -- same renewals, reversed order -- because that is the mutation\n  every order-blind sufficient statistic passes for free. This is the FIRST falsifier this atom\n  has that is cheap on the LIVE estimator and does not need a population the world cannot supply\n  (pass 7's constructed-account problem): it needs no new account at all, only a permutation.\n\n  EP1 IS A RECONCILIATION, NOT A CONSTRUCTION. The demand side already exists, dark, with its own\n  numbers. The FIRST commit of the draw that opens EP1 owes a decision on all six of the CLV\n  producers above -- adopt, retire, or state why it is different -- because a seventh CLV added\n  beside five dark ones is the accretion OPERATIONAL_COHERENCE forbids. The mint's \"no atom on\n  the map touches CLV today\" is true of the map and false of the tree, and this is the eighth\n  pass to say so.\n\n==========================================================================================\nSTILL OWED, unchanged, re-verified at HEAD 74ccddb57 this pass.\n==========================================================================================\n\nTHE NAME COLLISION, EIGHTH PASS. `company/core/three_horizon_clv` answers\ncommitment-vs-actual-vs-reforecast, not this atom's triple; `company/finance/portfolio_dashboard.py:11`\nstill propagates it (\"Average CLV (H3 forecast) vs H1 commitment\"). Zero non-test importers,\nre-confirmed. Recommendation unchanged: rename to `company/core/commitment_actual_forecast.py`\nin the first commit of the draw that opens EP1.\n\nTHE UNCOMMITTED MARGIN-BASIS REPAIR, fifth pass running, re-measured at HEAD 74ccddb57:\n`saas/clv_model.py` CLV_MARGIN_BASIS HEAD=0 disk=3; `saas/cost_to_serve.py`\nnet_of_all_costs_margin_gbp HEAD=0 disk=5; `tools/generate_dashboard_data.py` cost_basis HEAD=0\ndisk=8; `tests/saas/test_clv_margin_basis.py` and `tests/tools/test_derived_basis_parentage_gate.py`\nstill `??`. The published `enterprise_value_margin_basis` still reads\n`net_of_all_costs_margin_gbp`, a value no commit can produce. Landing it remains a BUILD-lane draw.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`; `clv` appears\nnowhere in `docs/observability/coupled_gap_ledger.json` (14 entries, checked). Consumed, not\nabsorbed (R17)."
