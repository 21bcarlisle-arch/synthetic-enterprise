: this is real\", and this atom's coupled-triad\nscore is not a score OF this atom. Under the COUPLED TRIAD rule -- \"no company capability is\ncomplete until it has faced a world that can defeat it\", the gap being the score -- EP1 has not yet\nbeen graded once. A level moved on this evidence would be resting on another estimator's number.\n\nSTILL OWED, re-verified this pass.\n  * A POINT-IN-TIME SERIES FOR EP1'S OWN ESTIMATOR. This is now the binding L3 blocker and it is\n    the next draw. `three_horizon_clv` must be snapshotted per year end, from\n    `simulation/run_phase4c_on_phase2b.py` or the reporting layer, both outside this `file_scope` --\n    so it needs its own draw with its own before/after on a published surface. Until then\n    `GRADES_ATOM_ESTIMATOR` stays False and the test battery holds it honest.\n  * THE HORIZON HYPOTHESIS, untested. 18/19 magnitude inflation points at expected tenure being too\n    long on the ceased subpopulation. Testing it needs the per-account hazard the run does not\n    publish. This is a diagnosis to CONFIRM, never a correction to apply (R12).\n  * THE LEDGER ROW IS NOT REFRESHED, deliberately and for the same reason as pass 16:\n    `docs/observability/coupled_gap_ledger.json` still carries uncommitted insertions from another\n    lane's live sim-run refresh, and adopting them to restate a headline this pass did not move is\n    the trade pass 12 refused. The provenance fields travel with the entry at the next legitimate\n    refresh by whoever owns that publish. UNTIL THEN THE PUBLISHED ROW STILL CARRIES NO DECLARATION,\n    which is stated here rather than left to be discovered.\n  * L2 -> L3, THE EIGHTEEN DISPOSITIONS, THE MARGIN-BASIS REPAIR, and THE MEAN-VERSUS-MEDIAN\n    PRESENTATION HAZARD -- all carried forward unchanged from pass 16."
- "2026-08-25 BUILD, pass 18, THE ROW NOW GRADES EP1 -- AND EP1'S ONLY PUBLISHED OUTPUT HAD NEVER\nBEEN IN A COMMIT. Level STAYS 2; `loop_stage` stays `build`. Drawn by the scheduled worker tick,\nLANE 1 BUILD on `EP1_clv_three_horizon` (level 2 -> 3). Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS WAS DRAWN TO DO. Pass 17's STILL-OWED opens: \"A POINT-IN-TIME SERIES FOR EP1'S OWN\nESTIMATOR. This is now the binding L3 blocker and it is the next draw.\" That series is built,\nwired, published and graded. It is the first pass since this atom opened whose deliverable is the\nthing the previous pass named rather than a finding about the previous pass.\n\n==========================================================================================\nFINDING FIRST, BECAUSE IT UNDERMINES FOUR PASSES OF THIS RECORD.\nEP1'S ONLY PUBLISHED OUTPUT HAD NEVER BEEN IN A COMMIT.\n==========================================================================================\n\n`git log -S three_horizon_clv -- simulation/run_phase4c_on_phase2b.py` returned NOTHING. The twelve\nlines that put `three_horizon_clv` into the run output had sat UNCOMMITTED in the shared working\ntree since pass 13. `docs/reports/run_output_latest.json` carried the key the whole time because\n`background/sim_runner.py` executes the WORKING TREE every cycle, not HEAD.\n\nWhat rested on it: pass 13 closed as THE ESTIMATOR HAS A READER; pass 15 moved this atom 1 -> 2 as\nTHE PUBLICATION DEBT IS DISCHARGED; pass 17 mutated that very table to prove the coupled-gap row\nwas mis-subjected. Three passes read a live artefact and none asked whether the producer was in a\ncommit. Meanwhile HEAD's `saas/reporting/annual_report.py` already had `_three_horizon_clv_section`\n-- so a tree reconstructed FROM THE REPOSITORY ALONE, which is the IaC test\n`OPERATIONAL_LAYER_DESIGN` names, had a reader for a key it could never produce and would have\nprinted the absent branch while the live site showed the table.\n\nNOT landed as its own commit, and that correction is pass 19's, written here rather than in a\nnew note because a false landing claim belongs crossed out where it was made. The tick that\nwrote the paragraph above ended without committing anything, so on 2026-08-25 the one command\nit recommends -- `git log -S three_horizon_clv -- simulation/run_phase4c_on_phase2b.py` -- still\nreturned NOTHING. Both hunks therefore reach HEAD together in the commit carrying this note: the\ntwelve-line `three_horizon_clv` publication and the snapshot series built on top of it. A\nseparate commit was the better shape and is no longer available; what is checkable is that the\nproducer is now IN the repository, by that same command. The generalisable shape, `inferred` only in the attribution: an executor that runs the\nworking tree makes an uncommitted mechanism SURVIVABLE, and anything survivable long enough gets\nbuilt on. The check that would have caught it is one command and it is now in this record.\n\n==========================================================================================\nWHAT LANDED. THE BELIEF SERIES.\n==========================================================================================\n\n`company/analytics/customer_value_view.py::build_three_horizon_clv_snapshots` -- EP1's estimate\nrecorded at each year end from the records observable THEN, published by the run module as\n`three_horizon_clv_snapshots` and reached through the existing door.\n\nTHE POINT-IN-TIME BOUND LIVES IN THE CALLER, AND THAT MODULE HAD ALREADY SAID SO. Its docstring\nstates that `build_customer_value_view` deliberately takes no `as_of` and that \"if a future caller\never routes a point-in-time DECISION through this output, that caller needs the bound\". A backtest\nis that caller. Each year's view is built from the records truncated at `{year}-12-31` and nothing\nelse, so year Y's belief cannot contain a fact from year Y+1 -- the bound applied to the INPUT\nrather than filtered out of the output, because the latter is the 2026-07-10 hedge-volatility\nforesight shape.\n\nNOTHING IS RE-DERIVED. Each snapshot is a real `build_customer_value_view` call on the truncated\nwindow, so cost-to-serve, churn risk, cessation and EP1's observables are formed by the same code\nthe end-of-run table uses. A snapshot builder that assembled EP1's inputs itself would have been\nthe seventh fork of one quantity this atom's own reconciliation register exists to stop. Cost was\nMEASURED before it was designed around, on a synthetic 258-account / 18,684-record book: 0.2s for\nthe whole ten-year series against 0.08s for the single full build it sits beside.\n\n==========================================================================================\nWHY A SERIES AND NOT MERELY A SECOND TABLE. THE POPULATION WAS EMPTY BY CONSTRUCTION.\n==========================================================================================\n\nThis is the mechanism, and no prior pass had it. EP1 blanks `contract_term` and `tenure_expected`\nfor a CEASED account: the margin comes from `enterprise_value[\"by_customer\"]`, which drops ceased\naccounts, so `annual_margin_gbp` arrives as `None` and both forward horizons are unestimable under\na named reason. The counted population of this coupled pair is EXACTLY the ceased accounts -- they\nare the only ones whose lifetime completed. Graded on the terminal table alone the population is\ntherefore EMPTY BY CONSTRUCTION, which is the same disjointness pass 11 measured on the legacy\nfigures, one field along and never restated for EP1's own output.\n\nThe series dissolves it, and dissolves it for a reason rather than by luck: at an EARLY year end\nthat customer was still supplied, had an observed margin, and carries a real forward belief.\n`_earliest_belief` takes exactly that year -- which is also the year with the most forecasting left\nto be wrong about, so the grading is harder, not easier.\n\n==========================================================================================\nWHAT LANDED. THE GRADER, AND THE TWO FACTS IT KEEPS APART.\n==========================================================================================\n\nTHE CHECKABLE CLAIMS, so the next pass can refute them without trusting this prose.\nLANDED: `ep1_series_provenance` in `tools/couple_clv.py`\nLANDED: `select_belief` in `tools/couple_clv.py`\nLANDED: `flatten_ep1_series` in `tools/couple_clv.py`\nLANDED: `build_three_horizon_clv_snapshots` in `company/analytics/customer_value_view.py`\nLANDED: `three_horizon_clv_snapshots` in `simulation/run_phase4c_on_phase2b.py`\n\n`ep1_series_provenance()` resolves a FOUR-LINK chain from the source tree by AST, importing\nnothing: the run module binds the published key to a CALL of the declared callable; that callable\nis imported from the company door and not from the implementation behind it; the implementation\ncalls `build_customer_value_view`, so the numbers come from the shared builder and not a lookalike;\nand that module imports `estimate_book` from EP1's estimator. `grades_atom_estimator` is True only\nwhen all four hold, and each link fails independently (mutations below).\n\n`select_belief()` grades EP1's series whenever the tree wires it AND the run carries it, labelled,\nwith at least one year -- and otherwise falls back to the legacy `clv_snapshots` under one of four\nNAMED reasons. TWO FACTS ARE KEPT APART ON PURPOSE: `tree_wires_ep1` is about the repository,\n`grades_atom_estimator` is about THIS RUN. A tree that wires the series beside an artefact produced\nbefore it is the normal state for the first run after landing, and one conflated boolean would\neither claim a grading that did not happen or hide a wiring that did.\n\nTHE HORIZON IS READ, NEVER ASSUMED. `flatten_ep1_series` reduces on the `aggregate_horizon` the\nseries itself states, so changing the estimator's aggregate basis MOVES the graded number instead\nof silently grading a horizon the book no longer quotes; a series that states no horizon is refused\nrather than defaulted, and the producer's empty branch emits `null` for exactly that handshake.\nA blank travels as a blank and is excluded upstream by name, never entering the arithmetic as zero.\n\n==========================================================================================\nR15, NINE MUTATIONS ON THE REAL FILE, FIRES OBSERVED -- INCLUDING THE ONE THAT FIRED NOTHING.\n==========================================================================================\n\nApplied to `tools/couple_clv.py` itself, `diff` confirmed IDENTICAL after every leg.\n\n    M1  fail-open: `select_belief` always claims EP1                       29\n    M2  the horizon assumed rather than read from the series                1\n    M3  a blank enters the flattened series as 0.0                          2\n    M4  the note drops the sentence saying whose number it is               1\n    M5  the crosscheck keeps reading the legacy series               0 -> 1\n    M6  fail-silent: an unresolvable EP1 chain is swallowed                 1\n    M7  the fallback reason is dropped                                     27\n    M8  `build_observations` grades a series the ledger did not declare     4\n    M9  the door link is not checked                                        1\n\nM5 FIRED ZERO ON THE FIRST RUN. Reverting `roster_crosscheck` to read `clv_snapshots` while the\nheadline was graded on EP1's series passed all 59 controls, because every fixture had the two\nseries dropping the same accounts and the check could read either and agree. A ledger row would\nthen have published a cross-check about one belief beside a headline about another -- pass 17's\nmis-subjection, moved one field along, inside the very pass that repaired it. The new control makes\nthe two series disagree on purpose and carries its own null control that the legacy reading\ndisagrees.\n\nTHIS IS THE THIRD CONSECUTIVE PASS WHOSE REAL FINDING CAME FROM A MUTATION THAT FIRED ZERO (pass\n16's M5, pass 17's M3, now M5). `inferred`: the shared cause is a fixture built to make an\nassertion true rather than to isolate one variable, and the only thing that has ever caught it is\nRUNNING the mutation rather than reasoning about the assertion.\n\nTHE DECISIVE PAIR, because a re-subjection claim resting on the wiring would be worth nothing.\nPass 17's proof was that deleting EP1's whole output left the headline bit-identical while nudging\nthe legacy series moved it. Both are now pinned INVERTED, as tests:\n`test_moving_ep1s_belief_moves_the_headline` and\n`test_moving_the_legacy_belief_no_longer_moves_the_headline`.\n\nTests: 60 in `tests/tools/test_couple_clv.py` (was 42), 15 new in\n`tests/company/analytics/test_clv_snapshot_series.py`, and 185 passed across those plus\n`tests/company/analytics/test_clv_three_horizon.py`,\n`tests/company/interfaces/test_customer_value_seam.py`,\n`tests/background/test_gap_ledger_reconciler.py` and\n`tests/saas/reporting/test_three_horizon_clv_section.py`. `python3 -m tools.epistemic_verifier`:\nPASS.\n\nRESTATED RATHER THAN LEFT TO DRIFT. Pass 17 wrote\n`test_deleting_ep1s_entire_output_leaves_the_headline_identical` and said \"the day someone wires\nEP1's estimator into the graded belief this test FAILS -- which is the point\". Pass 18 wired it and\nthat test did NOT fail: its fixture carries no series, so it exercises the FALLBACK path. Its\ndocstring now says so. A control that quietly starts asserting something else is this atom's own\nrecurring defect and it does not get to happen silently in the pass that names it.\n\n==========================================================================================\nA PROCESS DEFECT OF MY OWN -- AND THE CONTROL THAT CAUGHT IT (R9, self-observed).\n==========================================================================================\n\nI tried to land the pass-13 recovery hunk alone, its gate ran for 37 minutes, and I edited\n`simulation/run_phase4c_on_phase2b.py` AGAIN while it was in flight. `surgical_land` gates a\nmaterialised tree but commits the WORKTREE, so an edit made during a gate can reach the commit\nwithout the gate having seen it. The standing rule -- never mutate a shared module while a long\nsuite is in flight -- exists precisely for this, and I broke it.\n\nIT WAS REFUSED, BY NAME, AND THE MESSAGE IS WORTH QUOTING BECAUSE IT IS WHAT A CONTROL THAT CAN\nFAIL LOOKS LIKE:\n\n    A REFERENCE THIS COMMIT CHANGES DOES NOT RESOLVE IN THE TREE IT CREATES -- COMMIT REFUSED.\n      - simulation/run_phase4c_on_phase2b.py:72:\n        `company.interfaces.customer_value.build_three_horizon_clv_snapshots` does not exist in\n        this tree -- the consumer landed and the supplier did not\n\n`tools/symbol_landing_check` gates the tree the commit WOULD CREATE, not the working tree, so the\nhalf-landing was structurally unreachable rather than merely unlikely. Nothing landed; the whole\npass went in as one commit instead, which is what it should have been. Recorded as a fire of an\nexisting control, not as a new rule -- the rule was already there and already mechanised, and the\nonly thing missing was my obedience to it.\n\n==========================================================================================\nWHY THE LEVEL DOES NOT MOVE.\n==========================================================================================\n\nThe draw was 2 -> 3 and L3 is NOT claimed. R11 governs: the live\n`docs/reports/run_output_latest.json` was produced before this key existed, so `select_belief`\nreports `grades_atom_estimator: False` with `fallback_reason: run_predates_ep1_belief_series` on\ntoday's artefact. EP1 has still not been graded ONCE against a real book. Claiming L3 on a wiring\nthat has never produced a number would be the exact move pass 15 made and pass 17 had to unpick.\n\nSTILL OWED.\n  * THE FIRST REAL GRADING. The next sim run publishes `three_horizon_clv_snapshots`; the ledger\n    row then carries EP1's own gap for the first time. That reading -- not this wiring -- is the\n    L3 evidence, and it is a fetch of a live artefact, not a re-reading of this record.\n  * THE HORIZON HYPOTHESIS, still untested, carried from pass 17. 18/19 magnitude inflation pointed\n    at expected tenure being too long on the ceased subpopulation. It now has a fair test for the\n    first time, because the belief being graded is EP1's own `tenure_expected`. A diagnosis to\n    CONFIRM, never a correction to apply (R12).\n  * THE LEDGER ROW IS NOT REFRESHED, for the third pass running and the same reason:\n    `docs/observability/coupled_gap_ledger.json` carries another lane's uncommitted sim-run\n    insertions, and adopting them to restate a headline this pass did not move is the trade pass 12\n    refused. UNTIL THEN THE PUBLISHED ROW STILL CARRIES THE PASS-17 DECLARATION, which is now one\n    run stale in the honest direction: it says the row does not grade EP1, and for that artefact it\n    does not.\n  * L2 -> L3 needs the HARDEN loop and an Expert Hour on top of the first real grading. THE\n    EIGHTEEN DISPOSITIONS, THE MARGIN-BASIS REPAIR and THE MEAN-VERSUS-MEDIAN PRESENTATION HAZARD\n    carry forward unchanged from passes 16 and 17."
- "2026-08-25 BUILD, pass 19, THE LANDING -- AND THIS ATOM'S OWN RECORD WAS REFUSING EVERY COMMIT ON\nTHE TREE. Level STAYS 2; `loop_stage` stays `build`. Drawn by the scheduled worker tick, LANE 1\nBUILD on `EP1_clv_three_horizon` (level 2 -> 3). `observed-with-evidence` unless labelled\n`inferred` (R9).\n\nWHAT THIS PASS WAS DRAWN TO DO, AND WHAT IT ACTUALLY HAD TO DO FIRST. Pass 18 wrote a finding --\nEP1's only published output had never been in a commit -- and then ended without committing\nanything, so at the start of this tick the check it recommends still returned nothing:\n\n    git log -S three_horizon_clv -- simulation/run_phase4c_on_phase2b.py   ->   NOTHING\n    git grep three_horizon_clv_snapshots HEAD -- simulation company tools  ->   NOTHING\n    disk: 722 changed lines across couple_clv, customer_value_view, the door,\n          the run module and four test files, plus 15 new tests in no commit\n\n186 tests green on that worktree. The code was finished, reviewed and unreachable from the\nrepository. THE LANDING IS THIS PASS'S DELIVERABLE and it goes in the commit carrying this note.\nThe check that refutes this paragraph is the one above: if it returns nothing, this note is wrong.\n\n==========================================================================================\nWHY IT COULD NOT HAVE LANDED, WHICH IS THE FINDING AND IT IS NOT ABOUT EP1'S CODE.\n==========================================================================================\n\n`background/sim-runner-log.md`, 03:49 UTC, on the publish path, not this lane's:\n\n    FAILED tests/design/test_simplifications_store.py::test_map_within_per_atom_budget\n    EP1_clv_three_horizon: 14501 B, above the 12288 B per-atom cap\n    [test-gate] TESTS FAILED -- COMMIT REFUSED.\n    [process_run] Commit/push failed (commit_refused)\n\nThe pre-commit gate is tree-wide, so EVERY lane's commit was refused by EP1's map entry. The\npublished figures not reaching origin, which sits in staging as its own repeating alarm, is the\nsame red seen from the other end. Nothing in `company/` or `tools/` was wrong. THE RECORD WAS.\n\nWHAT WAS ACTUALLY IN THOSE BYTES. The atom block carried the current `simplifications_count` line\nplus FOUR trailing `#` history comments -- passes 17, 16, 13 and 10, 9,534 B of them -- and all\nfour are verbatim duplicates of notes already in the sibling store (17, 16, 13 live in\n`EP1_clv_three_horizon.yaml`; 10 in `archive/...008.yaml`). Rehomed prose that never left. Dropping\nthem takes the atom 14,847 -> 5,313 B against a 12,288 B cap, map mean 1,048 -> 1,016 B over 298\natoms, and the store loses NOTHING: `generate_simplified_data` renders the site from\n`store.for_atom`, never from the map's comments, so the published register is byte-identical.\n\nTHE REMEDY WAS THE CONTROL'S OWN WORDS, and taking it rather than the other one is the point:\n\n    \"atoms are accreting prose; rehome the growing FIELD to the record store rather than\n     raising this number\"\n\nRaising the cap would have been one character and would have converted a working ratchet into a\nnumber that moves whenever it binds. R15 is satisfied by the control's existing battery --\n`test_per_atom_budget_fires_on_accretion_and_on_one_fat_atom` fires on both named defects and\n`test_per_atom_budget_is_invariant_to_atom_COUNT` pins that honest growth does NOT fire it -- so\nthis pass adds no control; it obeys one that already works. What it does add is the diagnosis of\nWHY this atom and not the other 297.\n\nTHE STRUCTURAL CAUSE, and it is a tension this project's own design created (`inferred` in the\nattribution, `observed` in the mechanism). Notes were rehomed to the store precisely so the map\nwould stay an INDEX -- but the convention of leaving a one-line `#` summary per pass in the map\nputs thorough note-writing in direct competition with the tree's commit budget. This atom writes\nthe longest notes in the repository (its store file is 63 KB), so it hit the cap first; SITE1 is\nat 10,495 B and is next. The map's line is not a shorter record, it is a SECOND record, and two\nrecords of the same fact is the thing the rehoming was supposed to end. THIS PASS THEREFORE LEAVES\nEP1 WITH EXACTLY ONE MAP COMMENT -- the current pass -- and the store holds the rest. A future pass\nthat appends a fifth history line to any atom is re-opening this defect.\n\n==========================================================================================\nWHAT LANDED, RESTATED AS CHECKABLE CLAIMS SO THE NEXT PASS CAN REFUTE THEM.\n==========================================================================================\n\nLANDED: `build_three_horizon_clv_snapshots` in `company/analytics/customer_value_view.py`\nLANDED: the same name re-exported by `company/interfaces/customer_value.py`\nLANDED: `three_horizon_clv` AND `three_horizon_clv_snapshots` in\n        `simulation/run_phase4c_on_phase2b.py` -- the first of those uncommitted since pass 13\nLANDED: `ep1_series_provenance`, `select_belief`, `flatten_ep1_series` in `tools/couple_clv.py`\nLANDED: `tests/company/analytics/test_clv_snapshot_series.py` (15 tests, previously untracked)\nTests: 186 green across `test_couple_clv`, `test_clv_snapshot_series`, `test_clv_three_horizon`,\n`test_customer_value_seam`, `test_three_horizon_clv_section`, `test_gap_ledger_reconciler`; plus\n154 green across `test_simplifications_store`, `test_atom_notes_store`,\n`test_map_assertion_provenance` for the map trim.\n\nA FALSE CLAIM IS CROSSED OUT WHERE IT WAS MADE. Pass 18's map summary ended \"so the whole pass went\nin as one commit\". It did not; the tick ended with nothing committed. That sentence is corrected in\nthe map rather than deleted, because a landing claim that was never true is the recurring defect of\nthis atom and hiding it would be the fourth instance.\n\n==========================================================================================\nWHY THE LEVEL STILL DOES NOT MOVE.\n==========================================================================================\n\nUnchanged from pass 18 and for the same R11 reason: `docs/reports/run_output_latest.json` still\ncarries `three_horizon_clv`, `clv_snapshots` and `clv_snapshot_as_of` and NOT\n`three_horizon_clv_snapshots`, so `select_belief` reports `grades_atom_estimator: False` with\n`fallback_reason: run_predates_ep1_belief_series`. EP1 has still not been graded ONCE against a\nreal book. What HAS changed is that the wiring is now in the repository rather than in one\nmachine's working tree, so the next sim run producing that key is a property of the project and not\nof this directory.\n\nSTILL OWED.\n  * THE FIRST REAL GRADING, unchanged and now genuinely one run away. The publish path was wedged\n    by the red above; with it cleared the next cycle can produce the key and the ledger row carries\n    EP1's own gap for the first time. That fetch, not this landing, is the L3 evidence.\n  * THE HORIZON HYPOTHESIS, carried from passes 17 and 18. Confirm, never correct (R12).\n  * THE LEDGER ROW IS NOT REFRESHED, fourth pass running, same reason: another lane's uncommitted\n    sim-run insertions sit in `coupled_gap_ledger.json`.\n  * L2 -> L3 needs the HARDEN loop and an Expert Hour on top of the first real grading. THE\n    EIGHTEEN DISPOSITIONS, THE MARGIN-BASIS REPAIR and THE MEAN-VERSUS-MEDIAN PRESENTATION HAZARD\n    carry forward unchanged from passes 16 and 17."
map_notes:
  origin_note: 'Activity-based pricing is a standing CLAUDE.md constraint -- flat margin makes some customers net-negative -- so a CLV that ignores cost-to-serve at the customer level reproduces the exact error the constraint names. R12 applies hard here: CLV is a DIAGNOSTIC, never a target, and no pricing or retention lever may be tuned to raise it. Coupled-triad shape when built: COMPANY estimates through the wall, HARNESS measures the estimate against SIM realised value.'
  name: 'Three-horizon customer lifetime value: contract-term, tenure-expected, and portfolio-cohort. The company''s OWN estimate assembled from observables (onboarding, flow events, payment behaviour, cost-to-serve) -- never a read of SIM truth -- so it is allowed to be wrong and the gap is the score. Named in DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 §1 as an Epoch-2 floor item; no atom on the map touches CLV today.'
