- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, no CLV designed, nothing wired -- this atom is epoch-2\nBUILD-gated on director-owned curriculum sequencing (R13), and EPOCH_GATING_AND_ATOM_\nAUTHORSHIP rule 1 makes DISCOVER/FRAME available while BUILD is not. `maturity_map.yaml`\nNOT edited: nothing in the map moves for this pass, this atom's records are rehomed here\n(`records_rehomed: [evidence]`), and the mint text is director-ruling provenance that a\nworker tick does not rewrite. Output is this record plus two queued findings.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nMEASURED AT: HEAD de32e8c6b. Live published `docs/reports/run_output_latest.json`\n(4,152,276 bytes, mtime 2026-08-13 21:08) and `site/data/company.json` read directly;\nshipped modules read and, where stated, EXECUTED as they sit on disk; nothing\nmonkeypatched, nothing regenerated. One of this atom's two cited evidence paths was DEAD\n(the known moved-path class -- the director ruling had been archived to\n`docs/staging/done/`) and is repaired above. Eleven paths added: the code a reader of this\natom actually needs, none of which the record previously named.\n\n==========================================================================================\nFINDING 1 (FRAME) -- THIS ATOM IS NOT GREENFIELD. Six CLV implementations already exist.\nFive have zero non-test callers. The one CALLED \"three-horizon\" answers a different\nquestion from this atom's three horizons, and the live one is a seventh thing again.\n==========================================================================================\n\nThe mint says \"no atom on the map touches CLV today\". That sentence is TRUE OF THE MAP and\nwas checked: `grep -in clv docs/design/maturity_map.yaml` returns 5 lines and no more --\nthis atom's `id` and `name` (4077, 4080), two other atoms' notes ASSERTING the same\nabsence (4027, and 4543's \"zero atoms touching CLV\" measured at mint on 2026-08-08), and\none SITE2 exit criterion listing CLV among company-only figures (5154). No atom OWNS a CLV.\n\nIt is not true of the TREE. Caller census, whole repo, importers excluding each module's\nown file:\n\n    module                                   non-test importers\n    saas/clv_model.py                        4   (enterprise_value, home_move_win_rate,\n                                                  annual_report, generate_customer_data)\n    saas/enterprise_value.py                 19  (the live run, the site generators, the\n                                                  seam, board_dashboard, tournament_runner)\n    saas/clv_seed.py                         4   (tools/run_phase0c, run_phase1c x3)\n    company/core/three_horizon_clv.py        0\n    company/crm/clv_cohort_book.py           0\n    company/crm/clv_sensitivity_model.py     0\n    company/finance/segment_profitability.py 0\n    company/finance/portfolio_dashboard.py   0\n\nTHE LIVE CHAIN, one path only: `saas/clv_model.build_clv` -> `saas/enterprise_value.\nbuild_enterprise_value` -> `company/analytics/customer_value_view` -> the seam\n`company/interfaces/customer_value` -> `simulation/run_phase4c_on_phase2b.py:345` -> the\nrun output -> `site/data/company.json` -> `/company/` and `/customers/`. It is a\nshifted-Beta-geometric expected lifetime times an annuity factor at a hard-coded\n`DISCOUNT_RATE_ANNUAL = 0.10`.\n\nTHE FIVE ORPHANS are tested-only: each is imported by its own test file and nothing else.\nThey are not dead in the \"delete on sight\" sense -- `clv_cohort_book` is literally this\natom's third horizon (cohort summaries keyed by acquisition year/channel/segment) and\n`clv_sensitivity_model` is the CAC<CLV/3 acquisition-budget lens -- they are UNWIRED. The\nclass is the already-filed one: a capability's remedy already exists, orphaned, and the\ncommon failure here is an orphaned control rather than an absent one.\n\nTHE NAME COLLISION, which is the part that will mislead the draw that opens this atom.\n`company/core/three_horizon_clv.py` (149 lines, 263 lines of tests, \"Phase EC\") is NOT\nthis atom's three horizons. Its axis is TIME OF ESTIMATE:\n\n    H1Commitment  what was promised at the sale\n    H2Actuals     what has been earned since, from recorded revenue/cost events\n    H3Forecast    the re-forecast now, with an H3Signal of on_track/deteriorating/at_risk\n\nThis atom's axis is SCOPE OF VALUE: contract-term, tenure-expected, portfolio-cohort. The\ntwo are orthogonal and both are worth having -- an existing H1/H2/H3 tracker does not\nsupply a contract-term/tenure/cohort triple, and a reader who greps \"three horizon CLV\"\nwill find a module that answers the other question. `company/finance/portfolio_dashboard.py`\nalready cites \"Average CLV (H3 forecast) vs H1 commitment\" in its own docstring, so the\ncollision is already propagating inside the repo.\n\nA DEFECT INSIDE THAT MODULE, found while reading it and stated here because it is the\nnearest thing on disk to this atom's FIRST horizon. `H1Commitment` takes `contract_start`\nand `contract_end`, exposes `contract_years`, and then never uses it:\n\n    h1_clv_gbp = expected_annual_margin_gbp * retention / (1 + discount_rate - retention)\n\n-- a perpetuity. `contract_years` is reachable only in the `denom <= 0` branch. Executed\non the shipped class, margin £100, churn 0.20, discount 0.08:\n\n    1-year fixed    contract_years=0.9993   h1_clv=285.71\n    2-year fixed    contract_years=1.9986   h1_clv=285.71\n    1-DAY contract  contract_years=0.0027   h1_clv=285.71\n\nThe value of a commitment is invariant to the length of the commitment. If any EP1 build\nreaches for this class as its contract-term horizon, it inherits a perpetuity wearing a\ncontract's clothes. Filed here rather than as a third staging finding because the module\nhas no callers -- nothing published is wrong today, which is exactly RECORDED severity,\nand the repair belongs to whoever wires it.\n\n==========================================================================================\nFINDING 2 -- THE LIVE ESTIMATOR, TWO DEFECTS, BOTH QUEUED AS BLOCKING FINDINGS.\n==========================================================================================\n\nBoth filed to `docs/staging/`, both severity BLOCKING, lane B_commercial, because a\npublished figure may be wrong in each case. Neither fixed in this tick: each is estimator\nor population surgery inside a live publish chain on a BUILD-gated atom's file scope\n(SELF_INTERRUPT_DISCIPLINE -- queue by default).\n\n(a) `WORKER_FINDING_THE_LIFETIME_ESTIMATE_DOES_NOT_MOVE_WHEN_THE_BELIEF_DOES_2026-08-13.md`\n    -- R15 mutation on the shipped `build_clv`: two accounts, identical observed tenure,\n    opposite churn beliefs; SWAP the beliefs and neither estimate moves (SAFE 50.000 /\n    RISKY 23.926, both runs, three decimal places). The per-account inputs are only\n    `{customer_id, t_churn, T}`; alpha/beta are pooled across the whole book into one\n    scalar pair. The company's belief about a customer enters only through the portfolio\n    mean. In the live book: corr(expected_lifetime, latest_churn_probability) = +0.093\n    across 13 accounts, sign backwards, and the joint-highest-churn account carries the\n    longest projected life on the book.\n\n(b) `WORKER_FINDING_THE_BOOK_VALUE_COUNTS_CUSTOMERS_WHO_HAVE_ALREADY_LEFT_2026-08-13.md`\n    -- 5 of 13 accounts churned in-run (C3 2020-06-30, C5 2020-12-30, C1 2021-12-30, C6\n    2024-03-30, C4 2024-09-29), all `home_move_won: false`, all still carrying forward CLV\n    in every later snapshot and in the published `enterprise_value_gbp`. £35,597 = 51.8%\n    of the residential book's CLV. The valued population is \"has renewal history\", never\n    \"is still supplied\", though `churned_billing_accounts` sits in the same output file.\n    The `/company/` featured household is C1 -- churned -- rendered with `clv_gbp 2840.50`\n    and `expected_lifetime_periods 14.94` and no attribute saying it left.\n\n==========================================================================================\nFINDING 3 (FRAME) -- THE GAP THIS ATOM IS SCORED ON IS NOT MEASURED ANYWHERE, AND THE\nPATTERN TO COPY IS ALREADY RUNNING NEXT DOOR.\n==========================================================================================\n\nThe mint's own scoring rule is \"the company's OWN estimate ... allowed to be wrong and the\ngap is the score\" (COUPLED_TRIAD: no company capability is complete until it has faced a\nworld that can defeat it). Nothing in the repo compares a CLV estimate to realised value:\nno belief/truth CLV pair in the run output, none in `docs/observability/\ncoupled_gap_ledger.json` (checked by name), and `couples_with: []` on this atom.\n\nThe pattern EXISTS one field away. `run_output_latest.json::customer_events` already\ncarries, per renewal, the SIM's `churn_probability`, the company's `company_churn_estimate`\nand the derived `churn_estimate_error_pct` -- a belief/truth pair produced and published on\nevery renewal. CLV's realised counterpart is cheaper still: the run knows what each account\nactually earned after each snapshot date, and `clv_snapshots` already stores the belief at\neach year end for ten years. An ex-post CLV gap is assemblable from artefacts that exist\ntoday; it has simply never been assembled.\n\nWHAT FOLLOWS, recorded rather than asked (NEVER_ASK_WITHOUT_RECOMMENDING). For the draw\nthat opens EP1:\n\n1. FIRST TASK IS A CENSUS, NOT A DESIGN. `level_current: 0` and `file_scope: []` describe\n   an atom with nothing built; six implementations exist and one is live on a public\n   surface. The level must be re-derived from that census when the atom opens, not assumed\n   from the record. Not changed here: a level move is a BUILD-side act on a BUILD-gated\n   atom.\n2. THE THREE HORIZONS MAP ONTO WHAT EXISTS, WITH ONE HOLE. Tenure-expected = the live\n   `clv_model` chain (defective per Finding 2, repairable). Portfolio-cohort =\n   `company/crm/clv_cohort_book.py`, built and unwired. Contract-term = the genuine hole;\n   `three_horizon_clv.H1Commitment` is the nearest artefact and prices a term as a\n   perpetuity. EP1's honest shape is therefore REPAIR + WIRE + BUILD ONE, not build three.\n3. NAME THE COLLISION BEFORE WRITING A LINE. Either rename `company/core/three_horizon_clv`\n   to what it is (a commitment-vs-actual-vs-reforecast tracker) or name this atom's triple\n   something that cannot be confused with it. Two different \"three-horizon CLV\"s in one\n   repo is a defect a reader pays for repeatedly.\n4. THE EXIT CRITERION IS THE GAP, NOT THE ESTIMATE. Per COUPLED_TRIAD and R12: publish the\n   estimate, publish the realised, publish the error, and let the error be large. The\n   control that must be able to fail is the swap-the-belief mutation in Finding 2(a) --\n   an estimator whose per-customer output does not move when its per-customer input moves\n   fails it, which today's does.\n5. COST-TO-SERVE IS ALREADY PER-CUSTOMER AND MUST STAY THAT WAY. `site/data/company.json::\n   cost_to_serve` publishes n=19 with by_segment/by_payment_channel/by_tenure splits\n   (resi mean £446.92, I&C mean £3,418.46). The origin note's warning -- a CLV that\n   ignores customer-level cost-to-serve reproduces the flat-margin error -- is currently\n   satisfied by the live chain (`build_clv` divides `cost_to_serve['by_customer']` net\n   margin) and must not regress when the three horizons are assembled.\n"
- "2026-08-15 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing wired, `maturity_map.yaml` edited for the\n`simplifications_count` scalar ONLY (1 -> 2, the store/map invariant that\n`tools/migrate_simplifications.py --check` enforces). Measured at HEAD d323edc25.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nTHIS PASS RE-VERIFIED THE 2026-08-13 PASS AND FOUND ITS TWO BLOCKING FINDINGS REPAIRED.\nBoth are landed, not merely filed:\n  (a) the per-customer estimate now follows the per-customer belief --\n      `saas/clv_model.fit_theta_posterior_per_account` exists at HEAD (the portfolio prior\n      updated by each account's own renewal evidence), which is the estimator surgery the\n      swap-the-belief mutation demanded. Landed 14876d687, report archived.\n  (b) the valued book is now the SUPPLIED book -- `saas/enterprise_value.build_enterprise_value`\n      takes `ceased_accounts` as a REQUIRED keyword with no default, and its docstring states\n      why the default is absent: `set()` would have restored the defect silently at every call\n      site that forgot to think about it, which is the fail-open shape R15 names. Landed\n      66141b70c; the render/selection half landed since as c647726db + d323edc25 (SITE2).\nThe finding doc for (b) is still parked in `docs/staging/in_progress/` and its own body now\ndescribes a state that has been superseded on both legs. Disposition is owed there; not taken\nthis tick because the SITE-lane half is another lane's record to close.\n\nFINDING (BLOCKING, queued) -- THE CONTRACT-TERM HORIZON PRICES A TERM AS A PERPETUITY, ON BOTH\nHORIZONS, AND ITS TESTS CERTIFY THAT.\nFiled as `docs/staging/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\n(severity BLOCKING, lane B_commercial, parsed both ways this tick; class\n`no_caller_and_never_runs`).\n\nThis ESCALATES the defect the 2026-08-13 note kept in this record at RECORDED severity, with a\nreason rather than by inheritance. That note was right that no published figure is wrong -- I\nre-confirmed zero non-test importers of `company/core/three_horizon_clv.py` at HEAD (the only\ntwo mentions are prose docstring lines in `company/core/account_intelligence.py:3` and\n`company/finance/portfolio_dashboard.py:11`). It was wrong that this is therefore RECORDED,\nbecause the module's own suite -- 35 passed in 0.06s at HEAD -- CERTIFIES the defect:\n  * `test_h1_clv_formula` and `test_h3_clv` assert against a hand-written copy of the\n    implementation's own expression with the same literals. TAUTOLOGY, R15 killer pattern 1.\n  * the only two tests that put the term in an assertion (`test_h1_clv_fallback_negative_churn`,\n    `test_h3_clv_fallback_zero_denom`) reach it exclusively through NEGATIVE churn.\n  * no test in the file fails if both term fields are deleted outright.\n\"a control or instrument in this area is untrustworthy\" is the BLOCKING trigger verbatim, and\ndown-classifying to keep B_commercial open is the anti-pattern `background/finding_severity.py`\nnames in its own header.\n\nTWO THINGS THE 2026-08-13 NOTE DID NOT HAVE:\n1. THE H3 HALF. That note names `H1Commitment` only. `H3Forecast.h3_clv_gbp` has the identical\n   shape -- `remaining_contract_years` is used only in the `denom <= 0` branch -- so the\n   RE-FORECAST is term-blind too and the defect survives any repair touching only the\n   commitment side. Executed on the shipped classes (margin 100, churn 0.20, discount 0.08):\n   h1_clv_gbp = 285.7143 for contract_years in {0.0027, 0.9993, 1.9986, 4.9993, 29.9986};\n   h3_clv_gbp = 285.7143 for remaining in {0.0, 0.5, 1.0, 10.0}.\n2. THE BRANCH IS DEAD BY ALGEBRA, not by luck. denom = 1 + d - (1 - c) = d + c, so the\n   term-consuming branch needs d + c <= 0; for d >= 0 and c in [0,1] the sole solution is\n   d == c == 0. The term parameter is UNREACHABLE in the returned value for every account with\n   any churn risk or any positive discount rate. The 2026-08-13 note called it \"reachable only\n   in the denom <= 0 branch\"; the sharper statement is that the branch is arithmetically closed.\nCONSEQUENCE, executed: an account one DAY from expiry and one with nine years of term, same\nmargin and churn, both value 285.7143 on both horizons and both read `h3_signal` = on_track;\n`at_risk_accounts()` is empty. `h3_signal` compares two perpetuities, so it can never see a\ncontract running out.\nMAGNITUDE (`inferred`, a ceiling argument not a valuation): a fixed term delivers at most\nmargin x term undiscounted, so H1's 285.71 sits at 2.86x a 1-year ceiling of 100 and 1.43x a\n2-year ceiling of 200, reversing past ~3 years -- the signature of a perpetuity rather than a\nmispriced annuity.\n\nWHAT THIS CHANGES FOR THE DRAW THAT OPENS EP1. Item 2 of the 2026-08-13 \"WHAT FOLLOWS\" list\nsaid the three horizons map onto what exists with contract-term as \"the genuine hole\", with\n`H1Commitment` as the nearest artefact. That stands, but the artefact is worse than it looked:\nit is a perpetuity on BOTH its horizons behind a green suite that cannot say so. EP1's shape is\nstill REPAIR + WIRE + BUILD ONE, and the contract-term leg is REPAIR-THEN-WIRE rather than\nwire-as-is. Do not let the 35 green tests stand as evidence that the commitment side is sound.\nDischarge condition, either sufficient, both cheap while the caller count is zero: price the\nterm as an annuity and replace the two tautological tests with one that fails on today's code\n(recommended -- it is what the horizon actually needs), or document both classes as perpetuity\napproximations and delete the unused term fields from the value path so no reader believes a\nterm is being priced. Not fixed this tick: SELF_INTERRUPT_DISCIPLINE queues by default, and a\nvaluation formula inside this atom's own subject matter is BUILD work that LANE 3 may not write.\n\nUNCHANGED AND STILL OWED from the 2026-08-13 note: the name collision (item 3) is untouched --\n`company/core/three_horizon_clv` still answers commitment-vs-actual-vs-reforecast while this\natom's triple is contract-term/tenure/cohort, and `company/finance/portfolio_dashboard.py:11`\nstill propagates it. The CLV belief-vs-truth gap (item 4 / COUPLED_TRIAD) is still measured\nnowhere: `couples_with: []` on this atom, still no CLV pair in the coupled gap ledger."
- "2026-08-15 REPAIR (worker tick, RUNG 1c BLOCKING-FINDING draw on lane B_commercial), NOT an\nEP1 build: level stays 0, loop_stage stays idle, file_scope untouched, `maturity_map.yaml`\nedited for the `simplifications_count` scalar ONLY (2 -> 3). What was drawn is the discharge\nof this atom's own blocking finding, and the module repaired\n(`company/core/three_horizon_clv.py`) is not in EP1's file scope -- it is the artefact the\nfinding named. Measured at HEAD 75fd42288.\n\nDISCHARGED: `docs/staging/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\nnow carries a structured `**Discharged:**` field that `background.finding_severity.parse_discharge`\nRELEASES (checked this tick, and `false_discharges()` is empty). `blocking_by_lane` over the\nstaging root now returns NO blocking finding on any lane, B_commercial included.\n\nCONDITION 1 TAKEN, the one this record recommended: the term is priced rather than the module\ndemoted to a documented perpetuity. `_term_value_gbp` is now the single valuation both horizons\ncall -- sum over t=1..T of margin * retention^t / (1+d)^t, closed form\nmargin * retention * (1 - r^T) / (1 + d - retention) with r = retention/(1+d). That is the old\nexpression times (1 - r^T), so the perpetuity survives as its T -> infinity limit instead of as\nthe answer for every T. The dead `denom <= 0` branch is gone as a branch: the unit-retention case\n(retention == 1 + d) is now the algebraically correct degenerate value margin x T, reached by a\ntest rather than by a fallback.\n\nRE-RUN OF THE FINDING'S OWN TABLES (margin 100, churn 0.20, discount 0.08; ceiling = margin x term):\n  H1  1-day   years= 0.0027  clv=  0.2347  ceiling=   0.2738\n  H1  1-year  years= 0.9993  clv= 74.0306  ceiling=  99.9316\n  H1  2-year  years= 1.9986  clv=128.8793  ceiling= 199.8631\n  H1  5-year  years= 4.9993  clv=221.9831  ceiling= 499.9316\n  H1  30-year years=29.9986  clv=285.6791  ceiling=2999.8631   (was 285.7143 for all five)\n  H3  rem=0.00 clv=0.0000 - rem=0.50 clv=39.8106 - rem=1.00 clv=74.0741 - rem=10.00 clv=271.5043\nThe finding's two accounts (1 day vs 9 years of term, same margin and churn) now differ by three\norders of magnitude on both horizons where they were identical.\n\nONE THING THE FINDING DID NOT NAME AND THE REPAIR HAD TO FIX. Pricing the term makes\n`h3_signal` unsound in a new way: a part-term H3 forecast scored against a whole-term H1 value\nwould read every account as deteriorating merely because time had passed -- mechanical decay\ndressed as a signal, which is the defect class this project files against derived headlines.\nThe signal now scores H3 against `H1Commitment.clv_over_years_gbp` over the SAME remaining\nwindow, so an unchanged belief reads on_track at any point in the term and a worsened one still\nreaches at_risk. Both directions are tested.\n\nR15, BOTH WAYS, this tick. The two tautological assertions and the two negative-churn coverage\ntests are gone; value assertions now compare against a period-by-period loop (`discounted_sum`\nin the test module), never against the closed form the module evaluates -- independence, killer\npattern 1. With `git show HEAD:` restoring the pre-repair module, 12 of the 47 controls FAIL,\nincluding `test_h1_clv_rises_strictly_with_the_term`,\n`test_h1_clv_never_exceeds_what_the_term_can_deliver`,\n`test_h3_clv_rises_strictly_with_remaining_term`, `test_h3_clv_of_an_expired_contract_is_zero`\nand `test_an_expiring_contract_is_not_worth_the_same_as_a_ten_year_one`, each failing on the\nterm-blindness itself rather than on a new method being absent. On the repair, 47 pass.\n\nNO PUBLISHED FIGURE MOVED, re-confirmed rather than carried forward: zero non-test importers of\n`company/core/three_horizon_clv.py` at HEAD. This was repaired BEFORE EP1 wires it, which is\nthe cheap end of the finding's own argument.\n\nSTILL OWED, unchanged by this pass and deliberately not swept in with it: the name collision\n(item 3 of the 2026-08-13 list) -- this module still answers commitment-vs-actual-vs-reforecast\nwhile the atom's triple is contract-term/tenure/cohort, and `company/finance/portfolio_dashboard.py:11`\nstill propagates it; and the CLV belief-vs-truth gap (item 4 / COUPLED_TRIAD), still measured\nnowhere with `couples_with: []`. What item 2 of that list called REPAIR-THEN-WIRE for the\ncontract-term leg is now REPAIRED and still unwired: the wiring is EP1 BUILD and stays gated."
- "2026-08-17 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing wired, `maturity_map.yaml` edited for the\n`simplifications_count` scalar ONLY (3 -> 4). Measured at HEAD 4276a179b against the\npublished `docs/reports/run_output_latest.json`, `docs/reports/ANNUAL_REPORT.md` and the LIVE\n`https://poesys.net/data/company.json`. Everything below is `observed-with-evidence` unless\nlabelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE THREE BEFORE IT DID NOT: it MEASURED THE GAP. Item 4 of the\n2026-08-13 \"WHAT FOLLOWS\" list -- the belief-vs-realised CLV gap that is this atom's stated\nexit criterion -- has been recorded as \"still measured nowhere\" by every prior pass. The\n2026-08-13 note argued it was assemblable from artefacts that already exist. It is, and it now\nhas been. That assembly is a READ, not a build: no estimator was written, nothing was wired,\nand `couples_with` stays `[]` because wiring it into the coupled gap ledger is BUILD.\n\nMETHOD, so it can be re-run (`/tmp` scratch only, nothing added to the tree):\n  * BELIEF: `clv_snapshots[Y][account]` from the run output. Point-in-Time verified by reading\n    `_build_clv_snapshots` rather than trusting its docstring -- records AND renewals truncated\n    at `Y-12-31`, `build_cost_to_serve` rebuilt on the truncated window, ceased accounts\n    excluded from the truncated window itself. These are genuine ex-ante estimates.\n  * REALISED: `years[y][\"per_customer\"][leg][\"net_gbp\"]` summed over both fuel legs of the\n    billing account for y > Y, discounted at the same DISCOUNT_RATE_ANNUAL = 0.10, PV struck at\n    the snapshot.\n  * UNCENSORED SUBSET: the five accounts that ceased inside the run (C1 2021-12-29, C3\n    2020-06-29, C4 2024-09-28, C5 2020-12-29, C6 2024-03-29). For these the whole post-snapshot\n    life is observed, so the comparison is complete rather than a lower bound. Every surviving\n    account's realised figure is censored at the 2025-06-07 run edge and is reported separately.\n\nTHE RAW GAP, uncensored subset, first snapshot per account:\n    acct  ceased      snap  belief GBP  realised GBP   ratio\n    C1    2021-12-29  2016     3004.63        786.66   0.262\n    C5    2020-12-29  2016    11967.53       -288.93  -0.024\n    C3    2020-06-29  2017     5277.81        350.35   0.066\n    C4    2024-09-28  2017     6420.17      -1834.56  -0.286\n    C6    2024-03-29  2017    22292.15       1964.76   0.088\nEvery one of the five delivered less than 27% of the value believed of it, two delivered\nNEGATIVE value against a large positive belief, and the ratio falls as the cessation\napproaches rather than rising (C1: 0.262 -> 0.228 -> 0.209 -> 0.143 -> 0.066 -> 0.000 across\nits 2016..2021 snapshots). C1's 2021 snapshot values it at 1849.22 two days before it stops\nsettling; C5's 2020 snapshot at 7141.31, one day before. That last pair is NOT a defect -- the\n35-day supply-continuity grace is why, and a real supplier learns of a loss with a lag. It is\nthe gap doing its job.\n\nTHE DECOMPOSITION, and it is the finding of this pass (`inferred` where marked). The raw ratio\nis dominated by a MARGIN BASIS defect, not by a belief error. `build_clv`'s margin input is\n`cost_to_serve[\"by_customer\"][cid][\"net_margin_gbp\"] = margin_gbp - cost_to_serve`, and\n`margin_gbp` is revenue minus WHOLESALE ONLY; the realised side above is the run's own\n`net_gbp`, after policy levies, network charges, capital charges and bad debt. Restating each\nbelief onto the realised basis by that account's own lifetime `(net - cts)/(gross - cts)`\nfactor (`inferred`: a linear rescale of a linear model, using a hindsight factor -- a\ndecomposition of the gap, never a proposed estimator):\n    acct  factor   raw ratio   matched ratio (first snap -> last)\n    C1     0.260       0.262   1.008 -> 0.000\n    C3     0.118       0.066   0.564 -> 0.287\n    C6     0.120       0.088   0.737 -> 0.239   (1.366/1.621/1.617 in 2018/2019/2020)\n    C5    -0.098      -0.024   0.246 -> 0.000\n    C4    -2.518      -0.286   0.113 -> 0.501\nOn a matched basis C1's 2016 belief was right to within 0.8%, and C6's mid-life beliefs\nUNDERstated what it delivered. So the honest reading is: this company's churn/lifetime belief\nis roughly the right order of magnitude, and its valuation is 4-10x too high because of what\nit counts as margin. C4 and C5 have negative net-of-cost margin against positive\ngross-of-cost margin, which makes their restated belief a negative number and their matched\nratio an object that should not be read as an accuracy score -- said plainly rather than\ndressed up.\n\nCONSEQUENCE FOR THIS ATOM'S EXIT CRITERION, which is why this belongs in the record and not\nonly in a finding: a CLV gap instrument that reports one number per account will score the\nESTIMATOR for an INPUT defect. Whatever EP1 builds must decompose the gap into (i) margin\nbasis, (ii) lifetime/churn belief, (iii) realised surprise, or its first reading will say \"the\ncompany's CLV model is 15x wrong\" when the model's belief was within 1% and its margin feed\nwas 4x. That is a NEW design constraint on the atom, discovered by measuring rather than by\ndesigning, and it is what item 4 of the 2026-08-13 list could not have known.\n\nTWO FINDINGS FILED, both BLOCKING, both lane B_commercial, neither fixed this tick\n(SELF_INTERRUPT_DISCIPLINE queues by default, and both repairs are BUILD code inside this\nBUILD-gated atom's own subject matter, which LANE 3 may not write):\n  (a) `WORKER_FINDING_THE_BOOK_IS_VALUED_ON_A_MARGIN_THAT_EXCLUDES_THREE_QUARTERS_OF_THE_COST_STACK_2026-08-17.md`\n      -- the basis defect above, at portfolio scale and on the live surface. `gross - net =\n      4,890,769.21` reconciles TO THE PENNY against the run's own cost lines (policy\n      3,404,188.65 + network 869,332.79 + gas policy 171,108.84 + gas network 393,759.19 +\n      capital 51,554.84 + bad debt 824.90, residual 0.00) and is 75.969% of gross margin, none\n      of which reaches the valuation. The live `enterprise_value_gbp` is 6,304,202.92 (fetched\n      2026-08-17T10:54:43Z, git 0a3b39ee9) and its published `enterprise_value_basis` says\n      \"Derived from the settled-clock net margin above\" -- a parentage that is FALSE: its\n      parent totals 6,414,533.34, 4.15x the stated one. Sharpest instance: C7 is published at\n      `clv_gbp 7771.10` while the same run's P&L gives it +117.83 net across ten years and\n      -401.30 after its own cost-to-serve. Restated on the run's own net-of-cts margin with\n      every lifetime and annuity held exactly as published, the eight named accounts total\n      1,138,265.43 against 6,298,818.09 -- 18.1% (`inferred`, a counterfactual).\n  (b) `WORKER_FINDING_THE_FINAL_YEAR_CLV_SNAPSHOT_IS_EMPTY_AND_THE_REPORT_PUBLISHES_IT_AS_A_THREE_MILLION_FALL_2026-08-17.md`\n      -- `_build_clv_snapshots` passes `as_of = \"{year}-12-31\"` to `ceased_billing_accounts`\n      while the run's observation edge is 2025-06-07 and the continuity grace is 35 days, so\n      every account reads as ceased and `clv_snapshots[\"2025\"] == {}`. `_section_clv_evolution`\n      then ranks that empty year against full ones and publishes \"Largest YoY fall: 2025\n      (GBP -3,255,946)\" and \"Earliest/lowest: 2025 (GBP 0)\" in ANNUAL_REPORT.md:1791-1795.\n      Structural, not data-thin: any run ending >35 days before 31 December does this.\n\nRE-VERIFIED, not carried forward. The 2026-08-13 ceased-account repair holds in the SNAPSHOT\npath too, which no prior pass checked: C3 is absent from the 2020 snapshot onward, C5 from\n2021, C1 from 2022, C4 and C6 from 2024 -- each first missing from the snapshot after its own\ncessation, and each still informing the churn prior. The per-account belief following the\nper-account belief (the 14876d687 repair) also holds: `fit_theta_posterior_per_account` is on\nthe live path and the eight valued accounts carry eight distinct `expected_lifetime_periods`\n(10.107 .. 11.099).\n\nSTILL OWED, unchanged by this pass. The NAME COLLISION (item 3 of the 2026-08-13 list) is\nuntouched for the fourth pass running: `company/core/three_horizon_clv` answers\ncommitment-vs-actual-vs-reforecast while this atom's triple is contract-term/tenure/cohort,\nand `company/finance/portfolio_dashboard.py:11` still propagates it. `couples_with: []`, and\nno CLV pair in `docs/observability/coupled_gap_ledger.json` -- the gap is now MEASURED but not\nINSTRUMENTED, and the distinction is exactly the \"consumed vs absorbed\" one R17 names. What\nitem 2 called REPAIR + WIRE + BUILD ONE now reads: the contract-term leg is repaired and\nunwired, the tenure leg is live and valued on the wrong margin line, the cohort leg is built\nand unwired, and the gap has a measurement method with no mechanism behind it."
- "2026-08-17 DISCOVER/FRAME ONLY, pass 5, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, nothing landed on another lane's behalf;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (4 -> 5). Measured at HEAD\n30b299ebc against the working tree, the stamped commit 3c1401df5, and the LIVE\n`https://poesys.net/data/company.json` fetched 2026-08-17T15:57Z. Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT PASS 4 DID NOT: it R2/R11-RE-VERIFIED PASS 4'S OWN TWO BLOCKING FINDINGS\ninstead of carrying their discharge forward on the record's word. Both were found archived in\n`docs/staging/done/` with structured `**Discharged:**` fields. One holds. The other is DISCHARGED\nIN A TREE THAT DOES NOT CONTAIN IT.\n\n  (a) THE PARTIAL-YEAR SNAPSHOT REPAIR HOLDS AND IS LANDED. `a87fdc1b9` carries it;\n      `tests/saas/reporting/test_partial_year_clv_headline_guard.py` is at HEAD. The empty-2025\n      snapshot no longer ranks against full years. Nothing owed.\n\n  (b) THE MARGIN-BASIS REPAIR IS REAL, GREEN, AND IN NO COMMIT. Measured, not inferred:\n        at HEAD `saas/clv_model.py:285` still indexes `entry[\"net_margin_gbp\"]`; `CLV_MARGIN_BASIS`\n          does not exist there.\n        at HEAD `saas/cost_to_serve.py` has 0 occurrences of `net_of_all_costs_margin_gbp` (disk: 5).\n        at HEAD `tools/generate_dashboard_data.py` has 0 occurrences of `cost_basis`/`margin_basis`\n          (disk: 11), and its basis registry `:294-303` still publishes the hand-written sentence\n          \"Derived from the settled-clock net margin above\" that the finding named as FALSE parentage.\n        `tests/saas/test_clv_margin_basis.py` and `tests/tools/test_derived_basis_parentage_gate.py`\n          are UNTRACKED (`??`). Together they hold THREE OF THE FOUR falsifiers the discharge names.\n        Both files run green on disk: 17 passed in 1.46s. This is finished work, not broken work.\n      The finding's ARCHIVE is committed (`32ffa211a`, at HEAD). The repair it archives is not. The\n      record outran the code, and `parse_discharge` released the B_commercial lane on test paths that\n      an untracked file satisfies exactly as well as a committed one -- fail-open in the R15 sense,\n      about the discharge mechanism rather than about this repair.\n\nTHE SHARPEST FORM, and it needs no inference at all. The live surface serves\n`enterprise_value_gbp 1288252.96` with `cost_basis: net_of_all_costs`, stamped `git_commit\n3c1401df5`. At 3c1401df5 the valuation indexes the OLD margin line and the generator cannot emit a\n`cost_basis` key at all. And:\n\n    $ git grep -l \"Discounted future margin of the supplied book\" HEAD\n    HEAD:site/data/company.json\n    HEAD:site/data/dashboard.json\n\nThe only place the published sentence exists at HEAD is inside the two data files that publish it.\nNo code at HEAD can write it. The artefact and its generator disagree about which tree they came\nfrom, by string comparison, with no model of staleness in between.\n\nCONSEQUENCE FOR THIS ATOM, which is why it belongs in the record and not only in a finding. Pass 4's\ncentral measurement -- that the belief-vs-realised CLV gap is dominated by a MARGIN BASIS defect\nrather than a belief error, C1's 2016 belief right to within 0.8% once restated -- now has its\nrepair on the live surface and NOT in the repository. The £6.3M -> £1.29M restatement that made\npass 4's decomposition actionable would be silently undone by a clean checkout, together with the\nparentage gate built to catch exactly that. So the design constraint pass 4 discovered (any EP1 gap\ninstrument must decompose into margin basis / lifetime belief / realised surprise, or it scores the\nestimator for an input defect) currently rests on an input repair that reconstruct-from-repo-alone\ndoes not reproduce -- CLAUDE.md OPS1's own stated test.\n\nONE FINDING FILED, LATENT not BLOCKING, lane B_commercial, not fixed this tick:\n`WORKER_FINDING_THE_LIVE_VALUATION_IS_SERVED_BY_AN_UNCOMMITTED_GENERATOR_AND_ITS_DISCHARGE_NAMED_UNTRACKED_FALSIFIERS_2026-08-17.md`.\nLATENT is deliberate and argued in the doc: no published figure is currently wrong (the live figure\nis the REPAIRED one, because the pipeline runs from the working tree), so BLOCKING would hold\nB_commercial for a risk rather than a red -- the false-blocker error\n`WORKER_FINDING_THE_POPULATION_DRAW_IS_LIVE_ON_DISK_WHILE_ITS_ROSTER_FIX_IS_UNCOMMITTED_2026-08-13`\nnamed and avoided. `background.finding_classes.classify_file` puts it in\n`uncommitted_and_orphaned_work`, uncontested (`also_matched` empty); its lane differs from that\nclass's `H_harness`, so it is REFUSED consolidation and stays live in the root -- the class doc is\nre-rendered in this same commit to list it, per the render-and-land-together rule.\n\nNOT TAKEN, and why. Landing the repair is a BUILD-lane draw, not this one: LANE 3 may not write\nBUILD code, the 137-line `tools/generate_dashboard_data.py` hunk set is a shared hot file wanting\n`tools.surgical_land` with an explicit pathspec, and `tools.run_annual_report` was live on this tree\n(pid 390652, started 15:56Z) -- landing a generator underneath a running generator is the wrong\ntick. The CLASS repair (a discharge must name a TRACKED falsifier) is recommended in the finding\nwith its own mutation.\n\nSTILL OWED, unchanged by this pass and now for the fifth time running: the NAME COLLISION --\n`company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast while this atom's triple\nis contract-term/tenure/cohort, and `company/finance/portfolio_dashboard.py:11` still propagates it.\n`couples_with: []` and no CLV pair in `docs/observability/coupled_gap_ledger.json`: the gap is\nMEASURED (pass 4) but still not INSTRUMENTED."
- "2026-08-18 DISCOVER/FRAME ONLY, pass 6, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (5 -> 6). Measured at\nHEAD 9718066ce against the working tree, `docs/reports/run_output_latest.json`, the committed\n`docs/reports/ANNUAL_REPORT.md`, and the LIVE `https://poesys.net/data/company.json` fetched\n2026-08-18. Everything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE FIVE BEFORE IT DID NOT: it ran a check another finding had\nexplicitly declined to run, and the answer escalated that finding. Passes 1-5 each measured\nsomething new about the estimator, the population or the tree. This one closed an open\nepistemic question that was sitting in the staging root with \"that check has not been run\"\nwritten into it -- which is the cheapest unclaimed evidence on this atom's subject matter.\n\n==========================================================================================\n1. R2 RE-VERIFICATION OF PASS 5, FIRST, BECAUSE ITS FINDING HAD A ONE-DAY SHELF LIFE.\n==========================================================================================\n\nPass 5 filed `WORKER_FINDING_THE_LIVE_VALUATION_IS_SERVED_BY_AN_UNCOMMITTED_GENERATOR_AND_ITS\n_DISCHARGE_NAMED_UNTRACKED_FALSIFIERS_2026-08-17.md` at LATENT, and argued LATENT on the\nground that the live figure is the REPAIRED one because the pipeline runs from the working\ntree. Re-measured at HEAD 9718066ce, one day and three published stamps later, EVERY LEG\nSTILL HOLDS and none of it has landed:\n\n    saas/clv_model.py            CLV_MARGIN_BASIS      HEAD: absent      disk: 3 occurrences\n    saas/cost_to_serve.py        net_of_all_costs_...  HEAD: 0           disk: 5\n    tools/generate_dashboard_data.py  cost_basis|margin_basis  HEAD: 0   disk: 11\n    tests/saas/test_clv_margin_basis.py                UNTRACKED (`??`)\n    tests/tools/test_derived_basis_parentage_gate.py   UNTRACKED (`??`)\n\nThe finding is still live in the staging root, undischarged. What is NEW is that the defect\nis no longer a snapshot: the artefact's stamp has moved three times (3c1401df5 at pass 5,\n6ed24044d on the live surface now, 2e15f420b in the local `site/data/company.json`) and NOT\nONE of those commits can produce the figure it stamps. The live surface serves\n`finance.enterprise_value_gbp 1284348.96` with `finance.enterprise_value_basis.cost_basis:\nnet_of_all_costs`; at 6ed24044d the generator cannot emit a `cost_basis` key at all. Pass 5's\nseverity call was right at the time and is now the thing to watch: LATENT rests entirely on a\nworking tree that no commit reproduces, and the population of stamps that misdescribe their\nown parentage grows by one per publish. Not escalated this tick -- no published figure is\nwrong BECAUSE of it, which is still the honest reading, and landing it is a BUILD-lane draw\nLANE 3 may not take.\n\n==========================================================================================\n2. THE CHECK THAT WAS DECLINED, RUN. A BOARD INSTRUCTION IS WRONG BY TWO ACCOUNTS.\n==========================================================================================\n\n`docs/staging/WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO_2026-08-17.md`\n(lane D_billing_metering) measured the mechanism -- `v.get(\"clv_gbp\") or 0.0` at seven sites\nin `saas/reporting/annual_report.py` -- and the exposed population (5 of 13 accounts publish\n`clv_gbp: null`), then stopped, in its own words, \"deliberately short of claiming a specific\npublished figure is wrong, because that check has not been run\". It is EP1's subject matter\nexactly: what the company believes a customer is worth, and what it publishes about it.\n\nTHE SITE THAT MATTERS IS NOT A STATISTIC, IT IS A BOUNDARY.\n`_section_customer_strategic_value` uses `clvs[n // 2]` as the CLV axis of the Customer\nStrategic Value Matrix, and the section ends in a board instruction whose count is decided by\nthat boundary. At HEAD, `docs/reports/ANNUAL_REPORT.md:2194` publishes\n`Median CLV: £791.98`, and `:2237` publishes:\n\n    **Board action: CRITICAL quadrant has 5 account(s). High CLV at risk from elevated churn\n    probability. Immediate retention offers recommended.**\n\nR15, THE MUTATION THE FINDING ITSELF PROPOSED, EXECUTED ON THE SHIPPED BUILDER. Calling\n`_section_customer_strategic_value` on the real run output, then again with all five nulls\nreplaced by explicit `0.0`: sha256[:12] d997858d414a both times, BYTE-IDENTICAL. The\ndistinction `build_clv` and `_round_or_none` are built to preserve -- `null` means NOT\nAPPLICABLE, `0.0` means WORTH NOTHING -- does not survive to the aggregation site. The\ncontrol the finding proposed fails on today's code, as it predicted it would.\n\nTHE EFFECT, DECOMPOSED SO TWO CAUSES ARE NOT CONFLATED (this is the part a one-line\n\"exclude the nulls\" rerun gets wrong):\n  * EFFECT A, the null substitution alone -- population held at 13, churn boundary held at\n    its published 0.29, only the CLV order changed: med_clv £791.98 -> £38,255.61 (48x), and\n    CRITICAL {C2, C8, C_IC1, C_IC2, C_IC3} -> {C_IC1, C_IC2, C_IC3}. C2 (£791.98) and C8\n    (£1,163.69) are published under \"High CLV, High Churn -- priority intervention\" and\n    inside a board retention recommendation. They are the 7th and 6th largest of the 8\n    accounts that HAVE a CLV. C2 clears the \"High CLV\" boundary by being EQUAL to it.\n  * EFFECT B, the population question -- deleting the five unvalued accounts (the finding's\n    own preferred repair) also moves the CHURN boundary 0.29 -> 0.35, because those five\n    carry real churn probabilities. Executed: `Median CLV: £38,255.61 | Median churn: 35%`\n    and `Board action: CRITICAL quadrant has 1 account(s)`.\nThe conclusion is ROBUST TO WHICH REPAIR IS CHOSEN: the boundary is £38,255.61 under Effect A\nalone and £38,255.61 under exclusion. Only the current silent zero yields £791.98. That is\nwhy it is stated as a defect and not as a preference.\n\nSIZED HONESTLY: the wrong figure is in the COMMITTED ANNUAL REPORT, not on the live site --\n`grep -rl \"Strategic Value Matrix\\|CRITICAL quadrant\" site/` returns nothing, and the live\n`company.json` publishes `enterprise_value_gbp` and a null `household.clv_gbp`, not the\nmatrix. `total_clv` is £1,283,652.65 either way; the sum was always the harmless case.\n\nACTION TAKEN, and it is the only edit this pass made outside its own record: that finding is\nESCALATED LATENT -> BLOCKING on lane D_billing_metering, with the measurement appended to its\nown body and the escalation dated in its header. \"A published figure may be wrong\" is the\nBLOCKING trigger verbatim; a board instruction naming two accounts that a manufactured zero\nput there is past \"may\". `parse_severity_file` re-read: BLOCKING / D_billing_metering.\n`blocking_by_lane` over the staging root was EMPTY before this edit (106 documents scanned),\nso this is now the only blocking finding and D_billing_metering level-raises are refused\nuntil it is repaired. Down-classifying to keep that lane open is the anti-pattern\n`background/finding_severity.py` names in its own header, and the lane the finding belongs to\nis not a reason to soften it. NOT REPAIRED here: deciding what an aggregate does with a\nstructural blank is BUILD work in another lane's file scope (SELF_INTERRUPT_DISCIPLINE).\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE FOR EP1, WHICH IS WHY THIS BELONGS IN THE RECORD.\n==========================================================================================\n\nCount the CLV defects this atom's six passes have found, by kind:\n\n    POPULATION / BASIS defects        estimator MATH defects\n    ---------------------------       ----------------------\n    valuing accounts that had left      the belief-swap (pass 1, repaired 14876d687)\n    (pass 1, repaired 66141b70c)\n    margin excludes 76% of the cost\n    stack (pass 4, repaired, uncommitted)\n    nine valued, eight published;\n    divisor is renewal points (filed)\n    empty final-year snapshot\n    (pass 4, repaired a87fdc1b9)\n    null-as-zero in the boundary\n    (this pass, escalated)\n\nFive to one. Every CLV number this project has published wrongly was wrong about WHO or WHAT\nWAS COUNTED, not about the arithmetic applied to them -- and the one estimator defect was\nfound by a mutation and repaired in a day. Pass 4 derived, from a single decomposition, that\nan EP1 gap instrument reporting one number per account would score the ESTIMATOR for an INPUT\ndefect. Six passes of evidence now says that constraint is not a caveat, it is the DESIGN:\n\n  EP1'S PUBLISHED OUTPUT MUST CARRY ITS POPULATION, NOT ONLY ITS NUMBER. Every horizon\n  figure -- contract-term, tenure-expected, portfolio-cohort -- publishes alongside it: how\n  many accounts it values, how many it EXCLUDED and why (ceased / no renewal history / no\n  CLV), and on which margin line. A CLV headline whose population is implicit is, on this\n  atom's own six-pass record, the shape that has been wrong five times out of six.\n\n  AND THE FALSIFIER IS AVAILABLE FOR FREE: for any aggregate EP1 publishes, swapping a\n  structural blank between `null` and `0.0` MUST move the rendered figure or the aggregate is\n  not population-aware. That is a mutation, not an assertion (R15), it is cheap on every\n  horizon, and it is the exact control that fails on today's code.\n\nThis sharpens, rather than replaces, item 4 of the 2026-08-13 \"WHAT FOLLOWS\" list (the exit\ncriterion is the GAP, not the estimate): the gap must be reported per-population as well as\nper-account, or a population defect will read as a belief error again.\n\n==========================================================================================\nSTILL OWED, unchanged and now for the SIXTH pass running.\n==========================================================================================\n\nTHE NAME COLLISION. `company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast\nwhile this atom's triple is contract-term/tenure/cohort;\n`company/finance/portfolio_dashboard.py:11` still propagates it. Six passes have recorded it\nand none has resolved it, which is itself the decay shape MAKE_IT_STICK names -- a line\nre-copied forward is not a mechanism. RECOMMENDATION, recorded rather than asked\n(NEVER_ASK_WITHOUT_RECOMMENDING), for the draw that opens this atom to execute in its FIRST\ncommit, before a line of EP1 code exists: rename `company/core/three_horizon_clv.py` to\n`company/core/commitment_actual_forecast.py` and its classes to what they are, leaving\n\"three-horizon CLV\" unambiguously this atom's. It is the cheaper side of the collision --\nzero non-test importers at HEAD, re-confirmed this pass -- and it gets cheaper never.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`, no CLV pair in\n`docs/observability/coupled_gap_ledger.json`. Consumed, not absorbed (R17)."
- "2026-08-19 DISCOVER/FRAME ONLY, pass 7, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (6 -> 7). Measured at\nHEAD bc689525a against the working tree, `docs/reports/run_output_latest.json` and the\ncommitted `docs/reports/ANNUAL_REPORT.md`. Every module named below was EXECUTED as it sits on\ndisk. Everything is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE SIX BEFORE IT DID NOT: it read the THIRD HORIZON. Passes 1-6\nmeasured the tenure leg (live, repaired four times), the contract-term leg (repaired pass 3)\nand the published surfaces. The portfolio-cohort leg -- `company/crm/clv_cohort_book.py`, named\nin pass 1 as \"literally this atom's third horizon\", built and unwired -- has been cited in six\nrecords and read in none. It is the cheapest unclaimed evidence left on this atom's own subject\nmatter, and it turns out to carry the atom's dominant defect class, un-remediated, twice.\n\n==========================================================================================\n1. R2 RE-VERIFICATION FIRST, AND PASS 6'S OWN PREDICTION WAS WRONG BY A FACTOR OF 1.93.\n==========================================================================================\n\nPass 6 escalated `WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO`\nLATENT -> BLOCKING and predicted the post-repair boundary in writing: \"the boundary is\nGBP 38,255.61 under Effect A alone and GBP 38,255.61 under exclusion. Only the current silent\nzero yields GBP 791.98.\" The repair landed (`84ae6bbeb`, finding archived to `done/`,\n`blocking_by_lane` empty over 89 documents this tick). What shipped:\n\n    ANNUAL_REPORT.md:2194  Median CLV: GBP 19,859.24 | Median churn: 32%\n    ANNUAL_REPORT.md:2246  Board action: CRITICAL quadrant has 1 account(s).\n\nThe board line moved 5 -> 1 exactly as pass 6 measured, so the finding was right about the\ndefect. The BOUNDARY is 19,859.24, not the 38,255.61 pass 6 twice computed. Reason, read at\n`saas/reporting/annual_report.py:8234-8265`: the repair fixed TWO things, and pass 6 modelled\none. It replaced `clvs[n // 2]` -- the upper of the two middle values -- with a real `_median`\nthat averages them for even n, and its docstring names that as a second defect in its own\nright. Pass 6 held the median CONVENTION fixed while varying the population, so its\ncounterfactual is an accurate reading of a code path that no longer exists.\n\nTHE LESSON IS ABOUT THE FORM OF THE PREDICTION, NOT THE ARITHMETIC. A counterfactual computed\nby re-running a shipped function with a substituted input predicts the world in which ONLY that\ninput changes. A repairer who sees the defect usually sees its neighbours too. Pass 6's number\nwas stated flatly as what the repair would yield; the honest form is \"under the estimator as it\nstands today\". Recorded here because this record is where this atom's passes check each other,\nand a prediction that missed is worth more written down than quietly superseded.\n\n==========================================================================================\n2. THE THIRD HORIZON, READ. IT HAS NO SLOT FOR THE FACT THE OTHER TWO WERE REPAIRED FOR.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_COHORT_HORIZONS_RECORD_TYPE_HAS_NO_SLOT_FOR_THE_\nPOPULATION_FACT_ITS_SIBLINGS_WERE_REPAIRED_FOR_2026-08-19.md` (LATENT, lane B_commercial,\nparsed both ways this tick; `classify_file` returns no class, so no class doc is touched and\nnothing is owed a re-render). Zero non-test importers at HEAD, re-confirmed, so LATENT is the\nhonest severity and BLOCKING would hold B_commercial for a risk rather than a red.\n\n`CustomerCLVRecord` declares seven fields and NONE of them says whether the customer is still\nsupplied -- grepped the annotations for `supplied|ceased|active|churn`: none. The tenure leg's\nrepair for the identical defect (`66141b70c`) is a REQUIRED keyword with no default, still that\nshape at HEAD (`saas/enterprise_value.py:153,174,202,211`), and the cohort leg has no slot to\nput it in. `clv_gbp` is annotated `float`; executed, `_cohort_summary` on a record carrying\n`None` raises `TypeError` from `sorted`. Loud, not silent -- to its credit -- but it means the\nboundary MUST resolve the blank and the record it writes cannot say which way it resolved.\n\nPASS 6'S \"FREE FALSIFIER\" CANNOT BE RUN HERE. Pass 6 declared, as this atom's design control,\nthat swapping a structural blank between `null` and `0.0` must move any aggregate EP1 publishes\n\"cheap on every horizon\". On this horizon that mutation raises before producing either figure.\nNot fail-open -- UN-RUNNABLE, which is worse in the R15 sense because there is no verdict to\nread at all.\n\nAND THE FALSIFIER THAT CAN BE RUN IS DEGENERATE ON THIS BOOK. Census of the 13 accounts in\n`run_output_latest.json::by_billing_account` on the 2x2 of (still_supplied, clv_is_null):\n\n    supplied=False null=True   n=5   C1 C3 C4 C5 C6\n    supplied=True  null=False  n=8   C2 C7 C8 C9 C_IC1 C_IC2 C_IC3 C_IC4\n    supplied=True  null=True   n=0   EMPTY\n    supplied=False null=False  n=0   EMPTY\n\nThe two discriminating cells are empty, so \"drop the nulls\" and \"keep only the supplied\" are\nindistinguishable. Executed, cohort book built from the live 13 under three policies:\n\n    policy        n      total_clv       avg_clv   profitable_pct\n    zero         13   1,283,074.77     98,698.06        53.8%\n    drop_null     8   1,283,074.77    160,384.35        87.5%\n    supplied      8   1,283,074.77    160,384.35        87.5%\n\nBit-identical on every field. A wiring of this horizon that never checks whether a customer is\nstill supplied WOULD PASS A POPULATION TEST ON TODAY'S BOOK -- for the same reason a stopped\nclock passes at noon, and the case that would separate them is exactly the bug the tenure leg\nhad. `profitable_pct` swings 33.7 points on the blank policy alone; on a residential split\n(`inferred` -- derived from the `C_IC` id prefix, a naming convention the run output does not\npublish as a field; the portfolio row above needs no such derivation) the cohort median is\nGBP 0.00 against GBP 976.92 and profitability 33.3% against 75.0%. Meanwhile the ONE\nqualitative accessor the class exposes, `is_profitable_cohort` (`avg_clv_gbp > 0`), reads True\nunder every policy: the boolean a reader would quote is blind to the choice that moves every\nnumber beneath it.\n\nTHIRD INSTANCE OF THE SAME CLASS, SAME MODULE: `_cohort_summary` returns an all-zeros summary\nfor `n == 0`, so a cohort that DOES NOT EXIST and a cohort that LOSES MONEY both publish\n`avg_clv_gbp=0.0` and `is_profitable_cohort=False`, distinguished by `customer_count` and by\nnothing else. That is the null-means-not-applicable vs zero-means-worth-nothing collapse\n`84ae6bbeb` repaired one module away, still live here.\n\nR15: 19 tests, green in 0.05s, ZERO mentioning `None`/`supplied`/`ceased`, all against one\nhand-written five-record fixture in which every `clv_gbp` is a concrete float -- the live book's\ndefining feature (5 of 13 unvalued) cannot arise in it. Three tests do not merely miss the\ncollapse, they PIN it: `test_by_acquisition_year_empty` asserts `avg_clv_gbp == approx(0.0)`\nfor a cohort that does not exist.\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE, WHICH IS WHY THIS BELONGS IN THE RECORD.\n==========================================================================================\n\nPass 6 counted this atom's defects five population/basis to one arithmetic and turned it into\na design constraint on EP1's OUTPUT: every horizon figure publishes its population, its\nexclusions and its margin line. Pass 7 says the constraint has to bind one layer lower.\n\n  THE POPULATION FACT MUST LIVE ON THE RECORD TYPE, NOT ON THE PUBLISHED SUMMARY. A horizon\n  whose per-customer record cannot express \"this customer is no longer supplied\" and cannot\n  express \"this customer has no CLV\" cannot publish an honest population no matter what the\n  renderer does, because the boundary that fills the record has already thrown the distinction\n  away. Two of this atom's three horizons were repaired at the record/boundary layer\n  (`ceased_accounts` required with no default; `_median` over a stated `placeable` population);\n  the third was never wired, and is the one that still cannot hold either fact.\n\n  AND THE FALSIFIER MUST BE CONSTRUCTED, NOT SAMPLED. Section 2 shows both discriminating\n  cells of the population 2x2 are empty in the live book. Any EP1 population control validated\n  against the current run passes without exercising its own subject. The test that must exist\n  is a deliberately built account that is supplied and unvalued, and one that is ceased and\n  valued -- neither of which the world currently supplies.\n\nThis does not replace pass 6's constraint; it names the layer at which it can be enforced, and\nsupplies the one falsifier shape that today's population cannot deliver on its own.\n\n==========================================================================================\nSTILL OWED, unchanged and now for the SEVENTH pass running.\n==========================================================================================\n\nTHE NAME COLLISION. `company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast\nwhile this atom's triple is contract-term/tenure/cohort;\n`company/finance/portfolio_dashboard.py:11` still propagates it. Seven passes, no resolution --\nthe decay shape MAKE_IT_STICK names. The pass 6 recommendation stands unchanged: rename it to\n`company/core/commitment_actual_forecast.py` in the FIRST commit of the draw that opens EP1,\nbefore a line of EP1 code exists. Zero non-test importers, re-confirmed this pass; it gets\ncheaper never.\n\nTHE UNCOMMITTED MARGIN-BASIS REPAIR, fourth pass running and still true at HEAD bc689525a:\n`saas/clv_model.py` CLV_MARGIN_BASIS HEAD=0 disk=3; `saas/cost_to_serve.py`\nnet_of_all_costs_margin_gbp HEAD=0 disk=5; `tools/generate_dashboard_data.py`\ncost_basis HEAD=0 disk=8; `tests/saas/test_clv_margin_basis.py` and\n`tests/tools/test_derived_basis_parentage_gate.py` still `??`. The published\n`enterprise_value_margin_basis` in the run output reads `net_of_all_costs_margin_gbp` -- a value\nno commit can produce. Its finding is live in the staging root at LATENT and landing it remains\na BUILD-lane draw.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`, no CLV pair in\n`docs/observability/coupled_gap_ledger.json`. Consumed, not absorbed (R17)."
map_notes:
  origin_note: 'Activity-based pricing is a standing CLAUDE.md constraint -- flat margin makes some customers net-negative -- so a CLV that ignores cost-to-serve at the customer level reproduces the exact error the constraint names. R12 applies hard here: CLV is a DIAGNOSTIC, never a target, and no pricing or retention lever may be tuned to raise it. Coupled-triad shape when built: COMPANY estimates through the wall, HARNESS measures the estimate against SIM realised value.'
  name: 'Three-horizon customer lifetime value: contract-term, tenure-expected, and portfolio-cohort. The company''s OWN estimate assembled from observables (onboarding, flow events, payment behaviour, cost-to-serve) -- never a read of SIM truth -- so it is allowed to be wrong and the gap is the score. Named in DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 §1 as an Epoch-2 floor item; no atom on the map touches CLV today.'
