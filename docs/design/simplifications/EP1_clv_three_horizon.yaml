- "2026-08-24 BUILD, pass 15, LEVEL 1 -> 2. THE PUBLICATION DEBT IS DISCHARGED.\nDrawn by the scheduled worker tick, LANE 1 BUILD on EP1. Everything below is observed-with-evidence\nunless labelled inferred (R9). Measured at HEAD 94c9b4123, on the committed artefacts, not the\nworking tree -- maturity_map.yaml, the EP1 store and gate_authorizations.jsonl were all CLEAN at\ndraw time, so no other lane's uncommitted work is adopted here.\n\nWHAT MOVED, AND IT WAS NOT MOVED BY THIS PASS. Passes 11, 12 and 13 each carried the identical\nSTILL-OWED line: \"PUBLICATION. three_horizon_clv is computed on every run and still reaches no\npublished artefact. This is what L1 -> L2 needs.\" Pass 14 (commit f4577c1d6) landed the reader.\nThis pass's contribution is the VERIFY and the level move -- the honest description is that the\nbuild debt was cleared one pass ago and the level did not follow it, which is the recurring\nshape this atom has now filed four times over.\n\nTHE ARTEFACT EXISTS AND IS RENDERED, CHECKED AT HEAD RATHER THAN ON DISK (R11).\n  docs/reports/run_output_latest.json    key three_horizon_clv    PRESENT\n  docs/reports/ANNUAL_REPORT.md line 1269   section \"Customer Lifetime Value - Three Horizons (EP1)\"\n  git status on that report               CLEAN, so worktree == HEAD\n\nThe section renders real values, not a placeholder: a portfolio line, a three-row segment table and\na 75-row per-account table on all three horizons. Structural blanks print as \"not estimable\" with\ntheir named reason (no_margin_observed, no_cohort_peers), never as 0.00 -- pass 7's constraint\nsurviving into the rendered surface, which is where it had never been tested before.\n\nTHE VERIFY, AND IT IS A RECONCILIATION RATHER THAN AN ASSERTION. The aggregate is recomputed from\nthe per-account rows the same artefact publishes, so this is not the tautology pattern of reading\none field and checking it against itself:\n\n  counted + excluded = available                     53 + 22 = 75          exact\n  sum of cohort totals vs portfolio total            268753.00 = 268753.00 diff 0.000000\n  sum of cohort counted vs portfolio counted         53 = 53               exact\n  accounts carrying a tenure_expected value          53, equals counted     exact\n  sum of the 53 per-account values                   268753.00              exact\n  that sum over 53 vs the published mean             5070.81 = 5070.81      exact\n\nTests: 49 passed in 3.20s across tests/company/analytics/test_clv_three_horizon.py and\ntests/tools/test_couple_clv.py.\n\nWHAT L2 DOES AND DOES NOT CLAIM, STATED SO THE MOVE IS NOT MISREAD. L2 in this map is \"mechanically\nreal, genuine artefacts, happy path\". It is a claim about the machinery, NOT about accuracy, and\nthis atom's own gap ledger says the estimator is bad: gap 1.7621, chip worse_than_blind, severity\nRED -- the company's per-customer CLV carries less information than assigning every account the\nportfolio mean, and three of five ceased accounts had the wrong SIGN. Nothing here is tuned toward\nthat number and nothing may be (R12). A level that measured accuracy would not be a level, it would\nbe the target R12 forbids.\n\nONE READING HAZARD ON THE PUBLISHED SURFACE, NAMED NOT FIXED. The portfolio mean is 5070.81 and the\nmedian is 221.85 -- a factor of 23, because 4 I&C accounts hold 252863.68 of the 268753.00 total\nagainst 49 residential accounts holding 15889.32. Both statistics are printed side by side and the\nsegment table separates them, so the page is honest; but \"portfolio mean value per account\" is a\nnumber a reader will quote, and on this book it describes no customer that exists. Registered as a\npresentation question for the next touch rather than fixed on sight (SELF_INTERRUPT_DISCIPLINE).\n\nSTILL OWED, re-verified at HEAD this pass.\n  * L2 -> L3 is the target and is NOT claimed here. What it needs is the gap moving on evidence,\n    which means R4 diagnosis of the estimator, not a better number.\n  * A SECOND GAP READING. Still one run, n=5, trend reads single. One divergence is not a base rate.\n  * THE EIGHTEEN DISPOSITIONS. Recorded and ratcheted, executed at next touch -- NOT done.\n  * THE MARGIN-BASIS REPAIR, tenth pass running. A separate BUILD-lane draw, untouched here.\n  * THE MEAN-VERSUS-MEDIAN PRESENTATION HAZARD, new this pass.\n"
- "2026-08-24 BUILD, pass 16, THE R4 DIAGNOSIS L3 ASKED FOR: THE HARNESS WAS GRADING THE\nESTIMATOR ON 5 OF 19 MEASURABLE ACCOUNTS. Level STAYS 2; `loop_stage` stays `build`. Drawn by the\nscheduled worker tick, LANE 1 BUILD on `EP1_clv_three_horizon` (level 2 -> 3). Everything below is\n`observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS WAS DRAWN TO DO, AND WHAT IT ACTUALLY FOUND. Pass 15's STILL-OWED list opens with\n\"L2 -> L3 ... needs the gap moving on evidence, which means R4 diagnosis of the estimator, not a\nbetter number\", and its second item asks for a SECOND GAP READING (`trend: single`, n=5). Taking\nthat second reading is what produced the finding: the gap came out\n**bit-identical to pass 11's, 1.7620866651009222**, on a committed artefact whose book had grown\nfrom 19 to 80 accounts since. A measurement that cannot move when its subject grows sixfold is not\nmeasuring the subject.\n\n==========================================================================================\nTHE DIAGNOSIS. THE POPULATION WAS PINNED TO THE SEED ROSTER.\n==========================================================================================\n\n`tools/couple_clv.build_observations` walked `by_billing_account`, and that table is built in\n`saas/reporting/annual_report.py:771` by iterating `CUSTOMERS` -- the hand-authored SEED roster --\nwhile every sibling population in the SAME run artefact is built over\n`CUSTOMERS + SUCCESSOR_CUSTOMERS + DRAWN_CUSTOMERS`. Measured on `run_output_latest.json` after the\n2026-08-24 20:38 run:\n\n    by_billing_account                            13     <- the harness's whole world\n    per_customer_lifetime                         80\n    clv_snapshots, distinct accounts ever valued  72\n    churned_billing_accounts                      22\n    three_horizon_clv.accounts (EP1's OWN table)  75\n\nAll 13 rows are seed ids (`C1`..`C9`, `C_IC1`..`C_IC4`). Not one `PROS-*` account has a row. The\ndrawn book settles from 2021, so the harness's population stopped growing exactly when the book\nstarted. Fourteen drawn customers had lived, been valued at a year end, churned, and been graded by\nnobody.\n\nTHE FIGURES, SAME ARTEFACT, THE TWO POPULATION SOURCES (R14):\n\n    walking by_billing_account   counted  5 / available 13   gap 3.7058   raw 1115.89  g0 301.12\n    walking the run's own union  counted 19 / available 80   gap 2.5955   raw  794.11  g0 305.95\n\nAND THE CHECK THAT MAKES THIS A REPAIR RATHER THAN A REDEFINITION. On the OLDER committed artefact\n(`git show HEAD:docs/reports/run_output_latest.json`, 19 accounts, roster of 5) the repair is a\n**no-op**: 5 counted, gap `1.7620866651009222`, bit-identical to the pre-repair reading. On that\nbook the seed roster and the real ceased set coincided, so there was nothing to un-pin -- which is\nwhy four passes of this record could measure the gap and never see the defect. The `available`\ndenominator does move there, 13 -> 19, because it now counts accounts the run knows about rather\nthan accounts one table holds.\n\n==========================================================================================\nTHE REPAIR, AND THE ONE PART OF IT THAT IS NOT OBVIOUS.\n==========================================================================================\n\n`known_accounts(run)` is the UNION of all four account-keyed populations the run publishes. Taking\nthe union rather than switching to the biggest single field is deliberate: each source omits\naccounts the others hold, and a denominator drawn from any ONE of them would silently inherit that\nomission -- the same defect, one field along.\n\n`ceased_roster(run)` makes `churned_billing_accounts` the ceased AUTHORITY, replacing\n`by_billing_account[...][\"still_supplied\"]`. The reason is the pair's own definition: this is a\nbelief-vs-OUTCOME backtest, the outcome side must come from the WORLD, and the roster is a churn\nEVENT in `run_phase2b`'s term loop while `still_supplied` is re-derived a layer up in the reporting\nlayer from settlement quiet, over seed accounts only. `saas/enterprise_value.py:48` already frames\nthe pair that way in its own comment.\n\nTHE CROSS-CHECK HAD TO CHANGE SIDES, AND THAT IS THE SUBTLE PART. The roster WAS the independent\ncross-check against a `still_supplied`-derived population. Promote it to authority and continue\nchecking it against the population it produced, and the check reads its own input -- the TAUTOLOGY\npattern, arriving as a side effect of a repair rather than as a design choice. So the check is now\nthe signal that was previously unused: an account the SNAPSHOT SERIES dropped (`_build_clv_snapshots`\nexcluding it once its own truncated window shows it ceased). A churn event firing and a meter going\nquiet are two different derivations, and neither is computed from the other.\n\nIts coverage went UP as a result, 13 -> 72 accounts, and it earns its keep immediately: on the live\nbook the two derivations agree on all 19 accounts the snapshots ever valued, ZERO false positives\neither way. The roster names 3 more (`PROS-2018-0002`, `PROS-2019-0082`, `PROS-2020-0081`) which\nappear in NO snapshot at all -- they churned before their first year-end -- and those are reported\nunder `never_snapshotted` rather than counted as disagreements, because a correctly-reported blind\nspot must not read as a data defect.\n\nAN ABSENT ROSTER IS NOW UNAVAILABLE, NOT EMPTY. With the roster as authority the tempting behaviour\n-- no roster, so nobody is ceased -- would let the entire book fall through as right-censored and\npublish a serene \"no completed lifetime to score\" over a book full of them. That is FAIL-OPEN, so\nit is a third state (`UNAVAILABLE_NO_ROSTER`) with its own note, distinguishable from a genuinely\nempty population.\n\nFOUND WHILE MUTATING, AND FIXED IN THE SAME PASS: the empty-population branch dropped the\ncross-check from its components entirely, so a run with nothing to score never said whether the\ncheck that would have FOUND accounts could even run. That is fail-silent in the one branch where it\nmatters most.\n\n==========================================================================================\nR15, EIGHT MUTATIONS, FIRES OBSERVED AND RECORDED -- INCLUDING THE ONE THAT FIRED NOTHING.\n==========================================================================================\n\nApplied to the real file, `diff` confirmed IDENTICAL after every leg. GREEN: 29 passed.\n\n    M1  restore the named defect (walk by_billing_account, still_supplied as authority)   6\n    M2  fail-open: an absent roster becomes an empty set rather than None                 1\n    M3  TAUTOLOGY: the cross-check reads the population it produced                       1\n    M4  over-reach: a never-snapshotted account counted as a disagreement                 1\n    M5  drop the SNAPSHOT source from the union                                     0 -> 1\n    M5b drop the LIFETIME source from the union                                          2\n    M5c drop the ROSTER source from the union                                             1\n    M6  fail-silent: an unrunnable cross-check reports agreement                          1\n\n**M5 IS THE ONE THAT MATTERED, AND IT FIRED ZERO TESTS ON THE FIRST RUN.** The fixtures gave every\nextra account a row in three sources at once, so removing any single source left it reachable by the\nothers and no control could tell the union from any one member. That is the identical blind-fixture\nshape the treasury finding's M2 exposed the same day, in a different atom, found the same way -- by\nrunning the mutation instead of reasoning about the assertion. `test_every_source_contributes_to_the\n_denominator` is parametrised over all four sources and closes it; M5 now fires. On the live book the\nsnapshot source is genuinely REDUNDANT today (every account it holds is also in\n`per_customer_lifetime`), so that test is the only place its contribution is visible at all, and the\ntest says so rather than implying the union is load-bearing four ways on this book.\n\nTests: 29 in `tests/tools/test_couple_clv.py` (was 25), and 120 passed across it plus\n`tests/company/analytics/test_clv_three_horizon.py` and `tests/background/test_gap_ledger_reconciler.py`.\n\n==========================================================================================\nWHY THE LEVEL DOES NOT MOVE, STATED SO THE DRAW IS NOT MISREAD.\n==========================================================================================\n\nThe draw was 2 -> 3 and L3 is NOT claimed. The gap DID move on evidence (5 -> 19 accounts,\n3.7058 -> 2.5955 on the same book), but it moved because the MEASUREMENT was wrong, not because the\nestimator improved -- and L3 in this map is \"faithful ... passed the full loop incl. HARDEN; Expert\nHour: this is real\". A pass that discovers its own grading instrument was reading a sixth of the\nbook has not passed a HARDEN loop; it has just earned the right to run one. Claiming L3 off this\nevidence would be the level-as-target shape R12 and LAW A forbid.\n\nWhat this DOES buy is that pass 15's second owed item is now answerable: the reading is no longer\n`trend: single` by construction, because the population can grow with the book.\n\n==========================================================================================\nFILED, NOT FIXED (SELF_INTERRUPT_DISCIPLINE + R10).\n==========================================================================================\n\n`by_billing_account`'s truncation itself is filed as\n`docs/staging/WORKER_FINDING_THE_PUBLISHED_ACCOUNT_TABLE_HOLDS_THE_SEED_ROSTER_WHILE_THE_BOOK_HAS_GROWN_SIXFOLD_2026-08-24.md`\n(LATENT, lane B_commercial; `classify_file` returns no class, so no class doc is touched and nothing\nis owed a re-render). `saas/reporting/annual_report.py` is OUTSIDE this atom's `file_scope`, and the\ntable has three other consumers (`generate_customer_data`, `generate_customer_sample`,\n`structural_blank_guard`) plus four published figures computed from it at line 800 -- so widening it\nmoves a published surface and is its own draw with its own before/after. The finding also names the\nCLASS, which an instance fix cannot close: a run artefact publishes several populations of the same\naccounts from different rosters and nothing checks that they agree.\n`WORKER_FINDING_THE_BOARDS_ACCOUNT_COUNT_AND_ITS_OWN_ACCOUNT_TABLE_DISAGREE_BY_ONE_2026-08-19` is\nalready the one-account version of exactly this; this is the 67-account version.\n\nSTILL OWED, re-verified this pass.\n  * THE LEDGER ROW IS NOT REFRESHED, deliberately. On HEAD's committed artefact the headline is\n    bit-identical (1.7620866651009222), so this repair owes no figure movement there; and\n    `docs/observability/coupled_gap_ledger.json` on disk carries 3,653 uncommitted insertions from a\n    live sim run's refresh belonging to another lane. Adopting them to restate an unchanged number\n    is the trade pass 12 already refused. The 2.5955 reading is measured on the NEWER artefact,\n    which is another lane's in-flight publish and not this commit's to claim.\n  * L2 -> L3. Needs the HARDEN loop and an Expert Hour, on an estimator whose grader is now\n    measuring the right population for the first time.\n  * THE EIGHTEEN DISPOSITIONS. Recorded and ratcheted, executed at next touch -- NOT done.\n  * THE MARGIN-BASIS REPAIR, eleventh pass running. A separate BUILD-lane draw, untouched here.\n  * THE MEAN-VERSUS-MEDIAN PRESENTATION HAZARD, carried from pass 15.\n"
- "2026-08-24 BUILD, pass 17, THE GRADER IS KEYED TO EP1 AND GRADES A DIFFERENT ESTIMATOR. Level\nSTAYS 2; `loop_stage` stays `build`. Drawn by the scheduled worker tick, LANE 1 BUILD on\n`EP1_clv_three_horizon` (level 2 -> 3). Everything below is `observed-with-evidence` unless\nlabelled `inferred` (R9).\n\nWHAT THIS PASS WAS DRAWN TO DO. Pass 16's STILL-OWED list opens: \"L2 -> L3. Needs the HARDEN loop\nand an Expert Hour, on an estimator whose grader is now measuring the right population for the\nfirst time.\" Starting that HARDEN loop is what produced the finding, and it is a harder one than\npass 16's: the grader is not measuring the right ESTIMATOR, and never has been.\n\n==========================================================================================\nTHE FINDING. THE LEDGER ROW `EP1_clv_three_horizon` DOES NOT GRADE EP1.\n==========================================================================================\n\nThe belief side of the pair is the run's `clv_snapshots`. That field is built in\n`saas/reporting/annual_report.py:143 _build_clv_snapshots`, which calls `build_clv` imported at\nline 43 `from saas.clv_model import build_clv` -- a churn-hazard annuity that predates this atom\nand is NOT in this atom's `file_scope`. EP1's own estimator,\n`company/analytics/clv_three_horizon.py`, publishes the separate `three_horizon_clv` table and\ncontributes nothing to the measurement. Both tables sit in the same artefact, which is what let\nfour passes read the row as EP1's.\n\nMEASURED, NOT ARGUED (`docs/reports/run_output_latest.json`, the 2026-08-24 20:38 run, 80\naccounts). Four mutations of the ARTEFACT, one interpreter, one file, one minute:\n\n    baseline gap                                        2.595540998141295\n    every `three_horizon_clv` value zeroed              2.595540998141295   UNMOVED\n    `three_horizon_clv` DELETED from the artefact       2.595540998141295   UNMOVED\n    legacy `clv_snapshots` series nudged +1%            2.624227839450484   moved\n\nA control that is bit-identical when its named subject's ENTIRE published output is deleted is not\nmeasuring that subject.\n\nTHE FAILURE SHAPE IS A FOURTH ONE, AND NAMING IT IS THE POINT (R10). R15's three killers are\nTAUTOLOGY, FAIL-OPEN and FAIL-SILENT, and this is none of them: the checker is correct, it can\nfail, it has a real null control, and it fails honestly -- about something else. MIS-SUBJECTED is\nthe name. It is structurally invisible to a mutation battery aimed at the CHECKER, because every\nsuch mutation fires exactly as it should; only a mutation aimed at the SUBJECT exposes it. Pass\n16's battery was eight mutations of the checker and all eight fired. That is why four passes of\nthis record measured, argued about and repaired this number without noticing whose it was.\n\nWHY IT IS DECLARED, NOT REPAIRED, AND THE REASON IS NOT CONVENIENCE. EP1's estimator cannot be\nbacktested at all today: a backtest needs a belief recorded BEFORE the outcome, and\n`three_horizon_clv` is a single END-OF-RUN table with no per-year series. Producing one means\nwriting a snapshot from `simulation/run_phase4c_on_phase2b.py` or the reporting layer, both OUTSIDE\nthis atom's `file_scope`, and it moves a published surface. So this pass makes the mis-subjection\nSTATED AND MECHANISED rather than leaving it implicit.\n\nNote this is a SECOND and independent obstacle from the right-censoring one the module already\ndeclared. The old note said the live comparison was impossible because the accounts EP1 values are\nexactly the ones whose outcome is unknown. That is true, and it explains why EP1's CURRENT values\nare unscoreable; it says nothing about the belief that got scored instead. A reader of a row keyed\n`EP1_clv_three_horizon` would reasonably take the number for EP1's. It is not.\n\n==========================================================================================\nWHAT LANDED. THE DECLARATION IS RESOLVED FROM THE TREE, NEVER ASSERTED.\n==========================================================================================\n\nTHE CHECKABLE CLAIMS, so the next pass can refute them without trusting this prose.\nLANDED: `belief_provenance` in `tools/couple_clv.py`\nLANDED: `magnitude_diagnostic` in `tools/couple_clv.py`\nLANDED: `GRADES_ATOM_ESTIMATOR` in `tools/couple_clv.py`\nLANDED: `BELIEF_PRODUCER_FUNCTION` in `tools/couple_clv.py`\n\n`belief_provenance()` reads `saas/reporting/annual_report.py`'s AST and reports which callable\n`_build_clv_snapshots` actually calls, which module it was imported from, and whether EP1's\nestimator is reachable by name inside that function. It imports nothing: importing the producer\nwould resolve names through whatever the interpreter had loaded, and the question is what the\nSOURCE says. `components.grades_atom_estimator` carries the answer onto the ledger entry and the\n`note` states it in a sentence, because a field a reader may not open is not a disclosure.\n\nFAIL-CLOSED AT BOTH ENDS. A missing producer file raises `FileNotFoundError`; a producer that no\nlonger defines the function raises `ValueError`; and `measure()` resolves provenance FIRST and lets\nboth through, because a measurement that cannot say whose estimator it graded does not know what it\nis measuring. Carried in all three branches including the empty and unavailable ones -- pass 16\nfound the empty branch silently dropping its cross-check, and that is exactly where a dropped\ndeclaration would hide longest.\n\nTHE R4 DECOMPOSITION, WHICH CHANGES WHAT `gap > 1` MEANS. `magnitude_diagnostic()` splits the\nheadline into scale error and information error, because a mean-absolute-error RATIO conflates\nthem: an estimator that ranks every customer correctly but is uniformly three times too large\nscores worse than no-skill while being far more useful than the mean. On the live population:\n\n    |belief| > |realised|                    18 of 19 accounts\n    best single scale (exact, MAE-optimal)   0.176\n    gap after that one scalar                0.9734   (headline 2.5955)\n\n18 of 19 is not noise -- under an unbiased estimator the sign of (|belief| - |realised|) is a coin\nflip, so one-sided p = 20/2^19 = 3.8e-5. Every positive belief but one over-shoots and EVERY\nnegative belief under-shoots: the belief is a magnitude-inflated image of the truth in BOTH\ndirections, which is the signature of a HORIZON that is too long, not of a ranking that is wrong.\nSpearman rank correlation is +0.367 -- weak, positive, and real. `inferred`: the counted population\nis by construction the accounts that CEASED, so an expected-tenure horizon of 1/hazard is\nsystematically too long for exactly this subpopulation, and a too-long horizon scales |value| up\nwhether the margin is positive or negative. That is the mechanism the next pass should test, and\nthe run publishes no per-account hazard series to test it with yet.\n\nTHE SCALAR IS FITTED IN-SAMPLE AND IS LABELLED AS SUCH IN THE CODE, THE FIELD AND THE OUTPUT. It is\nan ATTRIBUTION -- the share of the headline one constant absorbs, hence the share NOT attributable\nto per-account error -- and never a skill estimate. R12 with full force: multiplying the estimator\nby 0.176 to move the headline is precisely the goal-seeking R12 forbids, and it would leave the\nmechanism untouched. Note also that the truth-window bias already declared in this module runs the\nSAME way, so the real over-estimation is worse than 2.5955, not better.\n\n==========================================================================================\nR15, EIGHT MUTATIONS ON THE REAL FILE, FIRES OBSERVED -- INCLUDING THE ONE THAT FIRED NOTHING.\n==========================================================================================\n\nApplied to `tools/couple_clv.py` itself, `diff` confirmed IDENTICAL after every leg.\n\n    M1  fail-open inverted: `grades_atom_estimator` hard-wired False        1\n    M2  fail-silent: a missing producer returns a dict instead of raising   1\n    M3  `verified` drops the declaration-vs-tree comparison            0 -> 1\n    M4  the estimator matched by NAME only, import module ignored           1\n    M5  the empty-population branch drops the provenance                    1\n    M6  the note loses the sentence saying whose number it is               1\n    M7  the best scale pinned to 1.0 so the decomposition says nothing      1\n    M8  `measure()` swallows an unresolvable provenance                     1\n\nM3 FIRED ZERO ON THE FIRST RUN, AND IT IS THE SAME DEFECT PASS 16 RECORDED AS ITS OWN M5 -- found\nthe same way, by RUNNING the mutation instead of reasoning about the assertion. The fixture for\n`test_wiring_ep1_into_the_producer_flips_grades_atom_estimator` had the producer call EP1's\nestimator INSTEAD of `build_clv`, so `estimator_is_called` went False and `verified` came out False\nby a route with nothing to do with the declaration. The fixture now calls BOTH, so every other\ninput to `verified` is satisfied and only the declaration comparison can make it False. Two\nconsecutive passes of this atom have now shipped a blind fixture whose assertion was satisfied by\nthe wrong condition; `inferred`: the shared cause is fixtures built to make an assertion true\nrather than to isolate one variable, and the only thing that has ever caught it is the battery.\n\nTests: 42 in `tests/tools/test_couple_clv.py` (was 29), and 141 passed across it plus\n`tests/company/analytics/test_clv_three_horizon.py`, `tests/background/test_gap_ledger_reconciler.py`\nand `tests/saas/reporting/test_three_horizon_clv_section.py`.\n\n==========================================================================================\nWHY THE LEVEL DOES NOT MOVE.\n==========================================================================================\n\nThe draw was 2 -> 3 and L3 is NOT claimed, for a stronger reason than pass 16's. L3 is \"faithful\n... passed the full loop incl. HARDEN; Expert Hour: this is real\", and this atom's coupled-triad\nscore is not a score OF this atom. Under the COUPLED TRIAD rule -- \"no company capability is\ncomplete until it has faced a world that can defeat it\", the gap being the score -- EP1 has not yet\nbeen graded once. A level moved on this evidence would be resting on another estimator's number.\n\nSTILL OWED, re-verified this pass.\n  * A POINT-IN-TIME SERIES FOR EP1'S OWN ESTIMATOR. This is now the binding L3 blocker and it is\n    the next draw. `three_horizon_clv` must be snapshotted per year end, from\n    `simulation/run_phase4c_on_phase2b.py` or the reporting layer, both outside this `file_scope` --\n    so it needs its own draw with its own before/after on a published surface. Until then\n    `GRADES_ATOM_ESTIMATOR` stays False and the test battery holds it honest.\n  * THE HORIZON HYPOTHESIS, untested. 18/19 magnitude inflation points at expected tenure being too\n    long on the ceased subpopulation. Testing it needs the per-account hazard the run does not\n    publish. This is a diagnosis to CONFIRM, never a correction to apply (R12).\n  * THE LEDGER ROW IS NOT REFRESHED, deliberately and for the same reason as pass 16:\n    `docs/observability/coupled_gap_ledger.json` still carries uncommitted insertions from another\n    lane's live sim-run refresh, and adopting them to restate a headline this pass did not move is\n    the trade pass 12 refused. The provenance fields travel with the entry at the next legitimate\n    refresh by whoever owns that publish. UNTIL THEN THE PUBLISHED ROW STILL CARRIES NO DECLARATION,\n    which is stated here rather than left to be discovered.\n  * L2 -> L3, THE EIGHTEEN DISPOSITIONS, THE MARGIN-BASIS REPAIR, and THE MEAN-VERSUS-MEDIAN\n    PRESENTATION HAZARD -- all carried forward unchanged from pass 16."
map_notes:
  origin_note: 'Activity-based pricing is a standing CLAUDE.md constraint -- flat margin makes some customers net-negative -- so a CLV that ignores cost-to-serve at the customer level reproduces the exact error the constraint names. R12 applies hard here: CLV is a DIAGNOSTIC, never a target, and no pricing or retention lever may be tuned to raise it. Coupled-triad shape when built: COMPANY estimates through the wall, HARNESS measures the estimate against SIM realised value.'
  name: 'Three-horizon customer lifetime value: contract-term, tenure-expected, and portfolio-cohort. The company''s OWN estimate assembled from observables (onboarding, flow events, payment behaviour, cost-to-serve) -- never a read of SIM truth -- so it is allowed to be wrong and the gap is the score. Named in DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_2026-08-08 §1 as an Epoch-2 floor item; no atom on the map touches CLV today.'
