simplifications:
- "2026-08-18 DISCOVER/FRAME ONLY, pass 6, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (5 -> 6). Measured at\nHEAD 9718066ce against the working tree, `docs/reports/run_output_latest.json`, the committed\n`docs/reports/ANNUAL_REPORT.md`, and the LIVE `https://poesys.net/data/company.json` fetched\n2026-08-18. Everything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE FIVE BEFORE IT DID NOT: it ran a check another finding had\nexplicitly declined to run, and the answer escalated that finding. Passes 1-5 each measured\nsomething new about the estimator, the population or the tree. This one closed an open\nepistemic question that was sitting in the staging root with \"that check has not been run\"\nwritten into it -- which is the cheapest unclaimed evidence on this atom's subject matter.\n\n==========================================================================================\n1. R2 RE-VERIFICATION OF PASS 5, FIRST, BECAUSE ITS FINDING HAD A ONE-DAY SHELF LIFE.\n==========================================================================================\n\nPass 5 filed `WORKER_FINDING_THE_LIVE_VALUATION_IS_SERVED_BY_AN_UNCOMMITTED_GENERATOR_AND_ITS\n_DISCHARGE_NAMED_UNTRACKED_FALSIFIERS_2026-08-17.md` at LATENT, and argued LATENT on the\nground that the live figure is the REPAIRED one because the pipeline runs from the working\ntree. Re-measured at HEAD 9718066ce, one day and three published stamps later, EVERY LEG\nSTILL HOLDS and none of it has landed:\n\n    saas/clv_model.py            CLV_MARGIN_BASIS      HEAD: absent      disk: 3 occurrences\n    saas/cost_to_serve.py        net_of_all_costs_...  HEAD: 0           disk: 5\n    tools/generate_dashboard_data.py  cost_basis|margin_basis  HEAD: 0   disk: 11\n    tests/saas/test_clv_margin_basis.py                UNTRACKED (`??`)\n    tests/tools/test_derived_basis_parentage_gate.py   UNTRACKED (`??`)\n\nThe finding is still live in the staging root, undischarged. What is NEW is that the defect\nis no longer a snapshot: the artefact's stamp has moved three times (3c1401df5 at pass 5,\n6ed24044d on the live surface now, 2e15f420b in the local `site/data/company.json`) and NOT\nONE of those commits can produce the figure it stamps. The live surface serves\n`finance.enterprise_value_gbp 1284348.96` with `finance.enterprise_value_basis.cost_basis:\nnet_of_all_costs`; at 6ed24044d the generator cannot emit a `cost_basis` key at all. Pass 5's\nseverity call was right at the time and is now the thing to watch: LATENT rests entirely on a\nworking tree that no commit reproduces, and the population of stamps that misdescribe their\nown parentage grows by one per publish. Not escalated this tick -- no published figure is\nwrong BECAUSE of it, which is still the honest reading, and landing it is a BUILD-lane draw\nLANE 3 may not take.\n\n==========================================================================================\n2. THE CHECK THAT WAS DECLINED, RUN. A BOARD INSTRUCTION IS WRONG BY TWO ACCOUNTS.\n==========================================================================================\n\n`docs/staging/WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO_2026-08-17.md`\n(lane D_billing_metering) measured the mechanism -- `v.get(\"clv_gbp\") or 0.0` at seven sites\nin `saas/reporting/annual_report.py` -- and the exposed population (5 of 13 accounts publish\n`clv_gbp: null`), then stopped, in its own words, \"deliberately short of claiming a specific\npublished figure is wrong, because that check has not been run\". It is EP1's subject matter\nexactly: what the company believes a customer is worth, and what it publishes about it.\n\nTHE SITE THAT MATTERS IS NOT A STATISTIC, IT IS A BOUNDARY.\n`_section_customer_strategic_value` uses `clvs[n // 2]` as the CLV axis of the Customer\nStrategic Value Matrix, and the section ends in a board instruction whose count is decided by\nthat boundary. At HEAD, `docs/reports/ANNUAL_REPORT.md:2194` publishes\n`Median CLV: £791.98`, and `:2237` publishes:\n\n    **Board action: CRITICAL quadrant has 5 account(s). High CLV at risk from elevated churn\n    probability. Immediate retention offers recommended.**\n\nR15, THE MUTATION THE FINDING ITSELF PROPOSED, EXECUTED ON THE SHIPPED BUILDER. Calling\n`_section_customer_strategic_value` on the real run output, then again with all five nulls\nreplaced by explicit `0.0`: sha256[:12] d997858d414a both times, BYTE-IDENTICAL. The\ndistinction `build_clv` and `_round_or_none` are built to preserve -- `null` means NOT\nAPPLICABLE, `0.0` means WORTH NOTHING -- does not survive to the aggregation site. The\ncontrol the finding proposed fails on today's code, as it predicted it would.\n\nTHE EFFECT, DECOMPOSED SO TWO CAUSES ARE NOT CONFLATED (this is the part a one-line\n\"exclude the nulls\" rerun gets wrong):\n  * EFFECT A, the null substitution alone -- population held at 13, churn boundary held at\n    its published 0.29, only the CLV order changed: med_clv £791.98 -> £38,255.61 (48x), and\n    CRITICAL {C2, C8, C_IC1, C_IC2, C_IC3} -> {C_IC1, C_IC2, C_IC3}. C2 (£791.98) and C8\n    (£1,163.69) are published under \"High CLV, High Churn -- priority intervention\" and\n    inside a board retention recommendation. They are the 7th and 6th largest of the 8\n    accounts that HAVE a CLV. C2 clears the \"High CLV\" boundary by being EQUAL to it.\n  * EFFECT B, the population question -- deleting the five unvalued accounts (the finding's\n    own preferred repair) also moves the CHURN boundary 0.29 -> 0.35, because those five\n    carry real churn probabilities. Executed: `Median CLV: £38,255.61 | Median churn: 35%`\n    and `Board action: CRITICAL quadrant has 1 account(s)`.\nThe conclusion is ROBUST TO WHICH REPAIR IS CHOSEN: the boundary is £38,255.61 under Effect A\nalone and £38,255.61 under exclusion. Only the current silent zero yields £791.98. That is\nwhy it is stated as a defect and not as a preference.\n\nSIZED HONESTLY: the wrong figure is in the COMMITTED ANNUAL REPORT, not on the live site --\n`grep -rl \"Strategic Value Matrix\\|CRITICAL quadrant\" site/` returns nothing, and the live\n`company.json` publishes `enterprise_value_gbp` and a null `household.clv_gbp`, not the\nmatrix. `total_clv` is £1,283,652.65 either way; the sum was always the harmless case.\n\nACTION TAKEN, and it is the only edit this pass made outside its own record: that finding is\nESCALATED LATENT -> BLOCKING on lane D_billing_metering, with the measurement appended to its\nown body and the escalation dated in its header. \"A published figure may be wrong\" is the\nBLOCKING trigger verbatim; a board instruction naming two accounts that a manufactured zero\nput there is past \"may\". `parse_severity_file` re-read: BLOCKING / D_billing_metering.\n`blocking_by_lane` over the staging root was EMPTY before this edit (106 documents scanned),\nso this is now the only blocking finding and D_billing_metering level-raises are refused\nuntil it is repaired. Down-classifying to keep that lane open is the anti-pattern\n`background/finding_severity.py` names in its own header, and the lane the finding belongs to\nis not a reason to soften it. NOT REPAIRED here: deciding what an aggregate does with a\nstructural blank is BUILD work in another lane's file scope (SELF_INTERRUPT_DISCIPLINE).\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE FOR EP1, WHICH IS WHY THIS BELONGS IN THE RECORD.\n==========================================================================================\n\nCount the CLV defects this atom's six passes have found, by kind:\n\n    POPULATION / BASIS defects        estimator MATH defects\n    ---------------------------       ----------------------\n    valuing accounts that had left      the belief-swap (pass 1, repaired 14876d687)\n    (pass 1, repaired 66141b70c)\n    margin excludes 76% of the cost\n    stack (pass 4, repaired, uncommitted)\n    nine valued, eight published;\n    divisor is renewal points (filed)\n    empty final-year snapshot\n    (pass 4, repaired a87fdc1b9)\n    null-as-zero in the boundary\n    (this pass, escalated)\n\nFive to one. Every CLV number this project has published wrongly was wrong about WHO or WHAT\nWAS COUNTED, not about the arithmetic applied to them -- and the one estimator defect was\nfound by a mutation and repaired in a day. Pass 4 derived, from a single decomposition, that\nan EP1 gap instrument reporting one number per account would score the ESTIMATOR for an INPUT\ndefect. Six passes of evidence now says that constraint is not a caveat, it is the DESIGN:\n\n  EP1'S PUBLISHED OUTPUT MUST CARRY ITS POPULATION, NOT ONLY ITS NUMBER. Every horizon\n  figure -- contract-term, tenure-expected, portfolio-cohort -- publishes alongside it: how\n  many accounts it values, how many it EXCLUDED and why (ceased / no renewal history / no\n  CLV), and on which margin line. A CLV headline whose population is implicit is, on this\n  atom's own six-pass record, the shape that has been wrong five times out of six.\n\n  AND THE FALSIFIER IS AVAILABLE FOR FREE: for any aggregate EP1 publishes, swapping a\n  structural blank between `null` and `0.0` MUST move the rendered figure or the aggregate is\n  not population-aware. That is a mutation, not an assertion (R15), it is cheap on every\n  horizon, and it is the exact control that fails on today's code.\n\nThis sharpens, rather than replaces, item 4 of the 2026-08-13 \"WHAT FOLLOWS\" list (the exit\ncriterion is the GAP, not the estimate): the gap must be reported per-population as well as\nper-account, or a population defect will read as a belief error again.\n\n==========================================================================================\nSTILL OWED, unchanged and now for the SIXTH pass running.\n==========================================================================================\n\nTHE NAME COLLISION. `company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast\nwhile this atom's triple is contract-term/tenure/cohort;\n`company/finance/portfolio_dashboard.py:11` still propagates it. Six passes have recorded it\nand none has resolved it, which is itself the decay shape MAKE_IT_STICK names -- a line\nre-copied forward is not a mechanism. RECOMMENDATION, recorded rather than asked\n(NEVER_ASK_WITHOUT_RECOMMENDING), for the draw that opens this atom to execute in its FIRST\ncommit, before a line of EP1 code exists: rename `company/core/three_horizon_clv.py` to\n`company/core/commitment_actual_forecast.py` and its classes to what they are, leaving\n\"three-horizon CLV\" unambiguously this atom's. It is the cheaper side of the collision --\nzero non-test importers at HEAD, re-confirmed this pass -- and it gets cheaper never.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`, no CLV pair in\n`docs/observability/coupled_gap_ledger.json`. Consumed, not absorbed (R17)."
- "2026-08-19 DISCOVER/FRAME ONLY, pass 7, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (6 -> 7). Measured at\nHEAD bc689525a against the working tree, `docs/reports/run_output_latest.json` and the\ncommitted `docs/reports/ANNUAL_REPORT.md`. Every module named below was EXECUTED as it sits on\ndisk. Everything is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT THIS PASS DID THAT THE SIX BEFORE IT DID NOT: it read the THIRD HORIZON. Passes 1-6\nmeasured the tenure leg (live, repaired four times), the contract-term leg (repaired pass 3)\nand the published surfaces. The portfolio-cohort leg -- `company/crm/clv_cohort_book.py`, named\nin pass 1 as \"literally this atom's third horizon\", built and unwired -- has been cited in six\nrecords and read in none. It is the cheapest unclaimed evidence left on this atom's own subject\nmatter, and it turns out to carry the atom's dominant defect class, un-remediated, twice.\n\n==========================================================================================\n1. R2 RE-VERIFICATION FIRST, AND PASS 6'S OWN PREDICTION WAS WRONG BY A FACTOR OF 1.93.\n==========================================================================================\n\nPass 6 escalated `WORKER_FINDING_A_NULL_CLV_ENTERS_THE_PUBLISHED_MEDIAN_AS_THE_NUMBER_ZERO`\nLATENT -> BLOCKING and predicted the post-repair boundary in writing: \"the boundary is\nGBP 38,255.61 under Effect A alone and GBP 38,255.61 under exclusion. Only the current silent\nzero yields GBP 791.98.\" The repair landed (`84ae6bbeb`, finding archived to `done/`,\n`blocking_by_lane` empty over 89 documents this tick). What shipped:\n\n    ANNUAL_REPORT.md:2194  Median CLV: GBP 19,859.24 | Median churn: 32%\n    ANNUAL_REPORT.md:2246  Board action: CRITICAL quadrant has 1 account(s).\n\nThe board line moved 5 -> 1 exactly as pass 6 measured, so the finding was right about the\ndefect. The BOUNDARY is 19,859.24, not the 38,255.61 pass 6 twice computed. Reason, read at\n`saas/reporting/annual_report.py:8234-8265`: the repair fixed TWO things, and pass 6 modelled\none. It replaced `clvs[n // 2]` -- the upper of the two middle values -- with a real `_median`\nthat averages them for even n, and its docstring names that as a second defect in its own\nright. Pass 6 held the median CONVENTION fixed while varying the population, so its\ncounterfactual is an accurate reading of a code path that no longer exists.\n\nTHE LESSON IS ABOUT THE FORM OF THE PREDICTION, NOT THE ARITHMETIC. A counterfactual computed\nby re-running a shipped function with a substituted input predicts the world in which ONLY that\ninput changes. A repairer who sees the defect usually sees its neighbours too. Pass 6's number\nwas stated flatly as what the repair would yield; the honest form is \"under the estimator as it\nstands today\". Recorded here because this record is where this atom's passes check each other,\nand a prediction that missed is worth more written down than quietly superseded.\n\n==========================================================================================\n2. THE THIRD HORIZON, READ. IT HAS NO SLOT FOR THE FACT THE OTHER TWO WERE REPAIRED FOR.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_COHORT_HORIZONS_RECORD_TYPE_HAS_NO_SLOT_FOR_THE_\nPOPULATION_FACT_ITS_SIBLINGS_WERE_REPAIRED_FOR_2026-08-19.md` (LATENT, lane B_commercial,\nparsed both ways this tick; `classify_file` returns no class, so no class doc is touched and\nnothing is owed a re-render). Zero non-test importers at HEAD, re-confirmed, so LATENT is the\nhonest severity and BLOCKING would hold B_commercial for a risk rather than a red.\n\n`CustomerCLVRecord` declares seven fields and NONE of them says whether the customer is still\nsupplied -- grepped the annotations for `supplied|ceased|active|churn`: none. The tenure leg's\nrepair for the identical defect (`66141b70c`) is a REQUIRED keyword with no default, still that\nshape at HEAD (`saas/enterprise_value.py:153,174,202,211`), and the cohort leg has no slot to\nput it in. `clv_gbp` is annotated `float`; executed, `_cohort_summary` on a record carrying\n`None` raises `TypeError` from `sorted`. Loud, not silent -- to its credit -- but it means the\nboundary MUST resolve the blank and the record it writes cannot say which way it resolved.\n\nPASS 6'S \"FREE FALSIFIER\" CANNOT BE RUN HERE. Pass 6 declared, as this atom's design control,\nthat swapping a structural blank between `null` and `0.0` must move any aggregate EP1 publishes\n\"cheap on every horizon\". On this horizon that mutation raises before producing either figure.\nNot fail-open -- UN-RUNNABLE, which is worse in the R15 sense because there is no verdict to\nread at all.\n\nAND THE FALSIFIER THAT CAN BE RUN IS DEGENERATE ON THIS BOOK. Census of the 13 accounts in\n`run_output_latest.json::by_billing_account` on the 2x2 of (still_supplied, clv_is_null):\n\n    supplied=False null=True   n=5   C1 C3 C4 C5 C6\n    supplied=True  null=False  n=8   C2 C7 C8 C9 C_IC1 C_IC2 C_IC3 C_IC4\n    supplied=True  null=True   n=0   EMPTY\n    supplied=False null=False  n=0   EMPTY\n\nThe two discriminating cells are empty, so \"drop the nulls\" and \"keep only the supplied\" are\nindistinguishable. Executed, cohort book built from the live 13 under three policies:\n\n    policy        n      total_clv       avg_clv   profitable_pct\n    zero         13   1,283,074.77     98,698.06        53.8%\n    drop_null     8   1,283,074.77    160,384.35        87.5%\n    supplied      8   1,283,074.77    160,384.35        87.5%\n\nBit-identical on every field. A wiring of this horizon that never checks whether a customer is\nstill supplied WOULD PASS A POPULATION TEST ON TODAY'S BOOK -- for the same reason a stopped\nclock passes at noon, and the case that would separate them is exactly the bug the tenure leg\nhad. `profitable_pct` swings 33.7 points on the blank policy alone; on a residential split\n(`inferred` -- derived from the `C_IC` id prefix, a naming convention the run output does not\npublish as a field; the portfolio row above needs no such derivation) the cohort median is\nGBP 0.00 against GBP 976.92 and profitability 33.3% against 75.0%. Meanwhile the ONE\nqualitative accessor the class exposes, `is_profitable_cohort` (`avg_clv_gbp > 0`), reads True\nunder every policy: the boolean a reader would quote is blind to the choice that moves every\nnumber beneath it.\n\nTHIRD INSTANCE OF THE SAME CLASS, SAME MODULE: `_cohort_summary` returns an all-zeros summary\nfor `n == 0`, so a cohort that DOES NOT EXIST and a cohort that LOSES MONEY both publish\n`avg_clv_gbp=0.0` and `is_profitable_cohort=False`, distinguished by `customer_count` and by\nnothing else. That is the null-means-not-applicable vs zero-means-worth-nothing collapse\n`84ae6bbeb` repaired one module away, still live here.\n\nR15: 19 tests, green in 0.05s, ZERO mentioning `None`/`supplied`/`ceased`, all against one\nhand-written five-record fixture in which every `clv_gbp` is a concrete float -- the live book's\ndefining feature (5 of 13 unvalued) cannot arise in it. Three tests do not merely miss the\ncollapse, they PIN it: `test_by_acquisition_year_empty` asserts `avg_clv_gbp == approx(0.0)`\nfor a cohort that does not exist.\n\n==========================================================================================\n3. THE FRAME CONSEQUENCE, WHICH IS WHY THIS BELONGS IN THE RECORD.\n==========================================================================================\n\nPass 6 counted this atom's defects five population/basis to one arithmetic and turned it into\na design constraint on EP1's OUTPUT: every horizon figure publishes its population, its\nexclusions and its margin line. Pass 7 says the constraint has to bind one layer lower.\n\n  THE POPULATION FACT MUST LIVE ON THE RECORD TYPE, NOT ON THE PUBLISHED SUMMARY. A horizon\n  whose per-customer record cannot express \"this customer is no longer supplied\" and cannot\n  express \"this customer has no CLV\" cannot publish an honest population no matter what the\n  renderer does, because the boundary that fills the record has already thrown the distinction\n  away. Two of this atom's three horizons were repaired at the record/boundary layer\n  (`ceased_accounts` required with no default; `_median` over a stated `placeable` population);\n  the third was never wired, and is the one that still cannot hold either fact.\n\n  AND THE FALSIFIER MUST BE CONSTRUCTED, NOT SAMPLED. Section 2 shows both discriminating\n  cells of the population 2x2 are empty in the live book. Any EP1 population control validated\n  against the current run passes without exercising its own subject. The test that must exist\n  is a deliberately built account that is supplied and unvalued, and one that is ceased and\n  valued -- neither of which the world currently supplies.\n\nThis does not replace pass 6's constraint; it names the layer at which it can be enforced, and\nsupplies the one falsifier shape that today's population cannot deliver on its own.\n\n==========================================================================================\nSTILL OWED, unchanged and now for the SEVENTH pass running.\n==========================================================================================\n\nTHE NAME COLLISION. `company/core/three_horizon_clv` answers commitment-vs-actual-vs-reforecast\nwhile this atom's triple is contract-term/tenure/cohort;\n`company/finance/portfolio_dashboard.py:11` still propagates it. Seven passes, no resolution --\nthe decay shape MAKE_IT_STICK names. The pass 6 recommendation stands unchanged: rename it to\n`company/core/commitment_actual_forecast.py` in the FIRST commit of the draw that opens EP1,\nbefore a line of EP1 code exists. Zero non-test importers, re-confirmed this pass; it gets\ncheaper never.\n\nTHE UNCOMMITTED MARGIN-BASIS REPAIR, fourth pass running and still true at HEAD bc689525a:\n`saas/clv_model.py` CLV_MARGIN_BASIS HEAD=0 disk=3; `saas/cost_to_serve.py`\nnet_of_all_costs_margin_gbp HEAD=0 disk=5; `tools/generate_dashboard_data.py`\ncost_basis HEAD=0 disk=8; `tests/saas/test_clv_margin_basis.py` and\n`tests/tools/test_derived_basis_parentage_gate.py` still `??`. The published\n`enterprise_value_margin_basis` in the run output reads `net_of_all_costs_margin_gbp` -- a value\nno commit can produce. Its finding is live in the staging root at LATENT and landing it remains\na BUILD-lane draw.\n\nTHE GAP IS MEASURED (pass 4) AND STILL NOT INSTRUMENTED. `couples_with: []`, no CLV pair in\n`docs/observability/coupled_gap_ledger.json`. Consumed, not absorbed (R17)."
- "2026-08-19 DISCOVER/FRAME ONLY, pass 8, level stays 0, loop_stage stays idle (worker tick,\nLANE 3 idle draw). No BUILD code written, nothing wired, no estimator touched;\n`maturity_map.yaml` edited for the `simplifications_count` scalar ONLY (7 -> 8). Measured at\nHEAD 74ccddb57 against the working tree, `docs/reports/run_output_latest.json`, the committed\n`docs/reports/ANNUAL_REPORT.md` and the published `site/data/company.json`. Every module named\nbelow was EXECUTED as it sits on disk. Everything is `observed-with-evidence` unless labelled\n`inferred` (R9).\n\nWHAT THIS PASS DID THAT THE SEVEN BEFORE IT DID NOT. Passes 1-7 asked WHO IS COUNTED (five\npopulation/basis defects) and WHAT THE RECORD CAN HOLD (pass 7, the cohort record type). This\npass asks the question underneath both: WHAT DOES THE HORIZON ITSELF ASSUME. The tenure leg has\nbeen repaired four times and never read as a model. Read as one, it turns out to be exchangeable\nin exactly the signal it is built on -- and then the same question asked of the DEMAND side (the\nthree decisions this atom's own `gain` names) finds three different tenures for one customer.\n\n==========================================================================================\n1. THE TENURE HORIZON CANNOT TELL A DETERIORATING CUSTOMER FROM A RECOVERING ONE.\n==========================================================================================\n\nFiled as `docs/staging/WORKER_FINDING_THE_TENURE_HORIZON_CANNOT_TELL_A_DETERIORATING_CUSTOMER_\nFROM_A_RECOVERING_ONE_2026-08-19.md` (LATENT, lane B_commercial; `classify_file` returns no\nclass, so no class doc is touched and nothing is owed a re-render).\n\n`fit_theta_posterior_per_account` (`saas/clv_model.py:162-208`) updates a Beta prior with SOFT\ncounts -- `alpha += sum(p_i)`, `beta += sum(1 - p_i)` over the account's own renewal points. The\nsufficient statistic is a SUM, so the posterior is exchangeable in the order of the renewals.\nExecuted on the shipped functions, two accounts with the same nine renewals in reversed order:\n\n    DETERIORATING  shocks 0,0,0,1,2,3,5,7,9   latest churn 0.32\n    RECOVERING     shocks 9,7,5,3,2,1,0,0,0   latest churn 0.05\n\n    posterior      both (3.035454545454545, 18.64636363636364)          IDENTICAL\n    lifetime       both 9.415901156198618                               IDENTICAL\n    clv_gbp        both 142.0649211867                                  IDENTICAL (bit-for-bit)\n\nA customer whose bill shocks are all in the most recent year and one whose shocks are all\nancient are the same customer to this horizon. That is not an arithmetic slip: it is the correct\nbehaviour of a conjugate update on i.i.d. Bernoulli trials, and therefore an ASSUMPTION -- theta\nis a fixed per-account propensity -- which this atom's record has never stated and which the\nworld in the same repo contradicts. `churn_probability(bill_shock_count)`\n(`saas/churn_model.py:40`) is a per-renewal-year function of a per-year shock count; the\ngenerating process is time-varying by construction and the estimator is not.\n\nTHE LIVE ARTEFACT SHOWS IT WITHOUT ANY MODEL AT ALL. Over the 8 valued accounts in\n`run_output_latest.json::by_billing_account`, `latest_churn_probability` against\n`expected_lifetime_periods`:\n\n    pearson(churn, lifetime) = -0.0169 over churn spanning 0.14..0.41 (2.9x)\n    C2 churn 0.41, C8 churn 0.35, C9 churn 0.14 -> lifetime 11.127618809847226 for ALL THREE\n    C_IC1 and C_IC2, churn 0.29 BOTH               -> 10.129852262166567 vs 10.139813815266979\n\nDifferent churn, identical lifetime to 17 significant figures; identical churn, different\nlifetime. The published pair is not a function in either direction, and both fields are on the\nlive site (`site/data/company.json::household` carries `latest_churn_probability` beside\n`expected_lifetime_periods` and `clv_gbp`). `inferred`: the 17-figure identity is the signature\nof equal soft counts (equal renewal count and equal summed churn); the alternative is two\naccounts landing on the same level set of the lifetime function by compensating differences.\n\nMAGNITUDE, in pass 7's honest form -- this is what the estimator AS IT STANDS TODAY yields when\nONLY the horizon is substituted, not a prediction of what a repair will produce. Conditioning on\neach account's own latest renewal instead of its whole history, everything else in the shipped\nestimator unchanged: every account falls 36.7% to 53.7%, and the book total goes\nGBP 1,283,074.77 -> GBP 703,246.56, **-45.2%**. The published `enterprise_value_gbp`\n(GBP 1,283,769.58 on the live site) is a first-order function of a choice nothing has argued.\n\nR15 -- AND THIS IS THE PART THAT MAKES IT A FINDING RATHER THAN A DESIGN NOTE. The control that\nexists for this exact estimator, `tests/saas/test_clv_model.py:186-207`, was written for\n`WORKER_FINDING_THE_LIFETIME_ESTIMATE_DOES_NOT_MOVE_WHEN_THE_BELIEF_DOES` (2026-08-13,\nBLOCKING) and is a real mutation test: swap two accounts' beliefs, the lifetimes must swap. It\npasses. But its fixture `_belief` (`:159-167`) gives every renewal of an account the SAME\nprobability -- so no account in the control's population HAS a trajectory, and the only mutation\nthe fixture can express is BETWEEN accounts. The mutation that matters here, permuting an\naccount's renewals WITHIN itself, leaves the output bit-identical and no test asks it. Its\nanti-vacuity clause is honest and still does not reach: two accounts must be distinguishable,\nwhich they are, on a statistic that is order-blind.\n\n==========================================================================================\n2. THE DEMAND SIDE: THIS COMPANY ALREADY HOLDS THREE TENURES FOR ONE CUSTOMER.\n==========================================================================================\n\nThis atom's `gain` is \"acquisition, retention and tariff decisions get a value number to argue\nwith\". Seven passes measured the SUPPLY of CLV (six implementations