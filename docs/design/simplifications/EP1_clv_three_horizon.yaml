er the floor, and the\n            test FAILS on the OTHER assertion: the scan could not reach this module's own\n            tracker class. Recorded separately because 2a alone would have left the reach\n            assertion unexercised -- the count floor trips first on any broad collapse, so the\n            two halves needed two different mutations to be shown independently.\n\nTHE MOVED-PATH CLASS WAS PAID IN THE SAME COMMIT, not left for a sweep.\n  * `docs/design/orphan_baseline.json`: the key `company.core.three_horizon_clv` renamed in\n    place. 402 orphans before, 402 after -- a rename is not a new orphan, and the baseline's own\n    doc says what the gate refuses is a module NOT on the list becoming unreachable. Left\n    unrenamed, the new path would have read as a newly-created orphan and the gate would have\n    been red for a move that changed no reachability.\n  * `docs/observability/size_ratchet_baseline.json`: same file, key moved, 813 entries before\n    and after.\n  * `docs/design/ORPHAN_DISPOSITION_REGISTER.md`: the one row renamed.\n  * `docs/staging/done/WORKER_FINDING_THE_CONTRACT_TERM_HORIZON_PRICES_A_TERM_AS_A_PERPETUITY_2026-08-15.md`\n    cites this module and its test file as its DISCHARGE EVIDENCE at five places. All rewritten\n    to the live paths, and the three named tests were verified PRESENT BY NAME in the renamed\n    file and re-run (3 passed) -- not inferred from the fact that a rename preserves content.\n    Its recorded \"35 passed\" figure is deliberately NOT restated: it is a reading of the tree of\n    2026-08-15, and the file now holds more tests. A dated note saying so is appended there.\n\nDECIDED AGAINST, and recorded because the reason is the interesting part. Pass 8 said \"rename its\nclasses to what they are\". `h1_clv_gbp`, `h3_clv_gbp` and `clv_over_years_gbp` were LEFT ALONE.\nThey are genuinely the present value of one contract over a term, the collision was in the name\nthat designated the TRIPLE, and three of those identifiers appear inside the test names that the\nperpetuity finding cites as its discharge evidence -- renaming them would have broken a live\nevidence citation to buy a shade of wording. `company/finance/portfolio_dashboard.py:46`'s\n`avg_clv_gbp` was left for the same reason plus a better one: it is one of the six CLV producers\npass 8 enumerated, and deciding its fate is the RECONCILIATION, which is EP1's build work and not\nthis rename's.\n\nWHAT THIS COMMIT DOES NOT DO, stated so the next draw is not misled. The eight-pass backlog is\nuntouched except for the collision: the six CLV producers are still unreconciled (pass 8), the\ncohort record type still has no slot for whether a customer is supplied (pass 7), the tenure\nhorizon still cannot tell a deteriorating customer from a recovering one (pass 8), the margin-basis\nrepair is still uncommitted on five files (fifth pass running), and `couples_with` is still `[]`\nwith no CLV pair in `coupled_gap_ledger.json` (R17, consumed not absorbed, fourth pass running).\nThe name is now free for EP1 to take; nothing has yet taken it.\n\nSTILL OWED. Everything in pass 8's \"STILL OWED\" except the name collision, which is DISCHARGED\nhere with a mechanism rather than a note -- the first of those four items to leave that list in\nnine passes."
- "2026-08-19 BUILD, pass 10, THE ESTIMATOR EXISTS. Level moves 0 -> 1 (L1 = \"been BUILT in\nany form\"), self-certified into `gate_authorizations.jsonl` with the evidence below; `loop_stage`\nstays `build`. Drawn by the scheduled worker tick, LANE 1 BUILD on `EP1_clv_three_horizon`.\nEverything below is `observed-with-evidence` unless labelled `inferred` (R9).\n\nWHAT LANDED. `company/analytics/clv_three_horizon.py` and its suite (23 tests), plus the wiring in\n`company/analytics/customer_value_view.py` -- the whole of this atom's `file_scope` and nothing\noutside it. Three horizons, each a `HorizonValue` carrying its `TimeModel` and its `Population`:\n\n  H1 contract_term      CONSTANT_HAZARD_FIXED_TERM   hazard = the account's LATEST renewal,\n                                                     term = the contract's own term.\n  H2 tenure_expected    LATEST_RENEWAL_CONDITIONED   same hazard, term = 1/h, the expected\n                                                     remaining tenure it implies.\n  H3 portfolio_cohort   POOLED_EXCHANGEABLE          margin and hazard pooled over the segment,\n                                                     using NONE of the account's own numbers.\n\nTHE THREE CONSTRAINTS THE EIGHT EARLIER PASSES BOUGHT, EACH NOW A MECHANISM.\n\n  Pass 8 (the horizon declares its time model). `TimeModel` is a field on every output, and the\n  declaration is TESTED rather than asserted: same nine renewals in reversed order must MOVE H1\n  and H2 and must NOT move H3. That second half is the NULL CONTROL -- without it an\n  implementation in which everything moves would satisfy the first half and tell us nothing about\n  whether the mutation reached the horizon it was aimed at. This is the falsifier pass 8 said was\n  free on the live estimator and that no pass had ever run.\n\n  Pass 6 (the output carries its population). A bare float cannot leave the module. `Population`\n  carries `counted`, `excluded` and named `reasons`, and `available`