- '2026-07-12 DISCOVER pass (self-refill draw, no BUILD code). Registration was entirely blank; checked internal code directly before assuming zero prior art -- and found something more precise than either ''nothing exists'' or ''it''s mis-registered'': TWO separate, real, well-built, Ofgem/CMA-anchored modules that LOOK like they satisfy this atom''s own scope, and NEITHER is wired into the real pricing decision. company/market/tariff_benchmarking.py models competitor tariff snapshots (CompetitorTariff, SupplierRank, activation-energy perceived-savings) from real public sources (Ofgem comparison tool, uSwitch, BEIS DUKES) -- confirmed via grep: ZERO non-test callers anywhere. company/pricing/renewal_pricing_engine.py computes a renewal price using SVT as a competitive ceiling and a real CMA-2016-calibrated conversion-decay curve (_RENEWAL_CONVERSION_DECAY_PER_PCT_ABOVE) -- also confirmed via grep: ZERO non-test callers. Cross-checked the REAL live pricing pathway directly: simulation/renewals.py (the actual call site building the historical replay''s renewal schedule) has ZERO references to svt/competitor/ceiling of any kind. Conclusion: the real simulation''s pricing decisions today have NO competitor-aware ceiling/undercut logic at all -- not because nothing was ever built, but because two real, non-trivial, real-data-anchored attempts exist and were never connected to the live decision path (the same ''paper compliance'' class already found this session for company/crm/onboarding_journey.py and W2_10''s payment_channel/dd_fail pipelines -- a recurring pattern worth naming: this codebase has repeatedly built a real capability module in isolation without the final wiring step). Concrete next FRAME question (not decided here): which of the two orphaned modules (or a combination) should be the one actually wired into simulation/renewals.py, and whether renewal_pricing_engine.py''s SVT-only ceiling is sufficient for this atom''s own L1 bar or whether tariff_benchmarking.py''s fuller multi-competitor snapshot is needed. No BUILD code, no level change.'
- '2026-07-13 FRAME pass answers the named question above (self-refill draw, DISCOVER/FRAME only per epoch gating, no BUILD code). Read both orphaned modules'' real shapes closely rather than treating them as interchangeable alternatives: company/pricing/renewal_pricing_engine.py computes a single price against ONE reference figure (SVT), capped at SVT x 1.02 -- it answers ''price ceiling'' only. company/market/tariff_benchmarking.py''s SupplierRank (CHEAPEST/BELOW_AVERAGE/AVERAGE/ABOVE_AVERAGE/MOST_EXPENSIVE across a real CompetitorTariff snapshot set) is the only one of the two that models ''undercut pressure'' from actual named competitors, not a single regulated benchmark. This atom''s own name is literally two-part (''price ceiling / undercut pressure'') and its real_world_twin explicitly names a MULTI-supplier field (''~8 active suppliers''), not a single-benchmark market -- so the two modules are not competing alternatives to pick between, they are complementary halves of the same real build: renewal_pricing_engine.py''s SVT ceiling alone would satisfy only the ''price ceiling'' half of this atom''s own name and would misrepresent the real_world_twin (one regulated figure standing in for a genuine ~8-supplier field). FRAME conclusion: the L1 bar needs BOTH -- SVT-ceiling as the price floor/ceiling mechanism (already closer to wire-ready, since it directly returns a price simulation/renewals.py could consume) plus tariff_benchmarking.py''s SupplierRank as the genuine undercut-pressure signal (e.g. a MOST_EXPENSIVE rank tightening the ceiling further below SVT, matching real competitive behaviour more closely than a fixed SVT x 1.02 cap regardless of the company''s actual market position). Confirmed simulation/renewals.py (the real live call site) still has zero references to either mechanism, unchanged since the prior pass. Next BUILD question (not decided here, epoch-gated): the real wiring shape -- does SupplierRank feed as an input parameter into RenewalPricingEngine.price_renewal(), or does simulation/renewals.py call both independently and combine their outputs itself.'
- '2026-07-15 DISCOVER pass, corrects the prior FRAME''s ''wire BOTH modules'' conclusion on a decisive epistemic-wall check (self-refill draw, DISCOVER/FRAME only, no BUILD code). Read the actual world-side competitor field this atom depends on (W2_3_competitor_field, now L1/harden): the world PUBLISHES only an AGGREGATE single-scalar signal -- simulation/market_switching_propensity.py::MARKET_SAVINGS_BY_YEAR / market_switching_multiplier() (per-year GBP savings-available), already wired into churn -- NOT a per-competitor tariff field (W2_3''s own note states the multi-entity field does not exist, its L2+ gap). CONSEQUENCE the prior FRAME missed: company/market/tariff_benchmarking.py''s SupplierRank (CHEAPEST..MOST_EXPENSIVE across named CompetitorTariff snapshots) has NO world-side ground truth to observe -- wiring it would VIOLATE THE EPISTEMIC WALL (the company reading a competitor field the world does not generate). So the epistemically-honest L1 is: consume ONLY the published aggregate savings signal (W2_3''s observable) as the undercut-pressure input, reusing renewal_pricing_engine.py''s SVT-ceiling SHAPE, NOT tariff_benchmarking.py''s un-backed multi-competitor snapshot until W2_3 reaches L2+. Confirmed the live call site simulation/renewals.py::_route_pricing_move()/build_renewal_schedule() still take NO competitor/svt/ceiling parameter -- the L1 wiring threads the aggregate signal in as a new input (epoch-gated). This SHARPENS the prior FRAME (which would have wired an un-observable field). No level change, no BUILD code.'
