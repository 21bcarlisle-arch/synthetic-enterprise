nity.py, health/page-consistency R14 gates, other compliance trackers: green-claims/consumer-duty/social-obligation/crisis-bad-debt) + wire the kill list onto the LIVE Proof door (R11 pixel) + KL-2 (epistemic-verifier coverage gaps: missing-file reads clean, only line-start imports matched -- an AST scan, folds into W4_2_verifier_timing_extension). loop_stage build: continue to full coverage.'
