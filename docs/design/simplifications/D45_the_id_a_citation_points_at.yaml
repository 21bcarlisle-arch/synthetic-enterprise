  gain: Nine consecutive Hours wrote `atom D37` ... `atom D45` into shipped source, into the Proof door's supplier and into the hold record that answers this atom's own draw, and the map carried none of them; nothing asked, for nine Hours. `--citations` reports PHANTOM_ATOM and STALE_ATOM_SLUG in the DEFAULT integrity-findings list on exit 1 -- deliberately unlike D42 and D43's report-only codes, because a phantom id is neither a working-tree state nor an attribution judgement, and ANY lane can discharge it by minting the cell or dropping the citation. `_is_id_shaped` is the second population filter, derived from the map (every live id is lane+number or lane+slug, so a bare lane letter is a lane by construction) and pinned in the ADMITTING direction, because a filter quietly dropping a real citation reads exactly like a clean map. (HARDEN draw 2026-08-14.)
