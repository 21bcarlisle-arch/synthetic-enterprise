atom_id: W2_12_change_of_tenancy_debt_physics
simplifications:
- '2026-07-23 AUTHORED as a DISCOVER atom by director verdict (DIRECTOR_SEGMENTS_REVIEW_VERDICTS_2026-07-23.md section 3, item 1). provenance: proposal / loop_stage: discover -- non-blocking, the loop self-draws it; DOES NOT block generator wiring (touches the billing/lifecycle process model, not the population draw). Scope: home-move exists today as churn/acquisition MECHANICS (home_move_win_rate.py, churn_journey, customer_events) but the DEBT and REVENUE physics OF the move itself are NOT confirmed built -- move-out final-bill non-payment risk, move-in landing on deemed rates, the void-property problem (Board Spec 006 item 9 PARTIAL). Director frame, register VERBATIM: every tenancy change is ONE credit-risk exit PLUS TWO deemed-rate entries (double jeopardy), and simultaneously the prime acquisition moment for high-value low-churn customers. The atom UNIFIES three things currently held separately: acquisition (thin), deemed-tariff path (built), bad debt (built). DISCOVER first: read the three current mechanisms and name the exact seam where the debt/revenue physics of the move would attach; fold, do not duplicate. BUILD stays gated (EPOCH_GATING -- author now, BUILD when opened).'
- '2026-07-23 DISCOVER COMPLETE (docs/design/W2_12_CHANGE_OF_TENANCY_DEBT_PHYSICS_DISCOVER.md): all five components already exist separately (account_closure.py move-out exit + DEBT_REFERRED/SLC21B; deemed_contract.py + cot.py deemed-rate entries + void uplift; change_of_tenancy_register.py CoT orchestration; home_move_win_rate.py thin acquisition; life_events.py MOVE trigger). SEAM NAMED = change_of_tenancy_register.py: a life_events MOVE fans out to the three existing engines as ONE causal transaction. Two gaps to fold (no new engines): (1) DEBT physics = p(move-out final bill unpaid) as a modelled outcome at closure; (2) acquisition-VALUE physics = win outcome carries landed-occupant CLV (enterprise_value.py). Closes Board Spec 006 item 9. Level-1 PROPOSED (proposals log); level_current held at 0 -- the cell move is the director''s per the level-promotion gate. BUILD stays EPOCH-gated.'
- '2026-07-29 blocked_on CLEARED (DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md items 1+2): director_build_open/director_level_up are abolished as BLOCK TYPES -- there is no such thing as needing a build opened, and levels are proposed+recorded (ledger-backed, self-certification via background.gate_authorization.record_level_up_self_certified now suffices, R16), never gated. Prior blocked_on/block_reason preserved above/below for the record; this atom re-enters the normal draw for whichever lane/loop_stage it already carries.'
- '2026-07-29 BUILD COMPLETE + L1 SELF-CERTIFIED (commit f2fe0bde1; ledger LEVEL_UP_SELF_CERTIFIED atom=W2_12 level=1 channel=self -- honestly stamped as the agent''s own record, never as a director act). The prior block_reason (''the cell move is the director''s per the level-promotion gate; R16, no self-bump'') is superseded by DIRECTOR_RULING_RIP_OUT_PERMISSION_MACHINERY_2026-07-29.md item 2 and preserved here for the record. WHAT WAS BUILT, exactly as DISCOVER framed it -- the JOIN and only the join: all five mechanisms already existed (account_closure.py move-out exit + DEBT_REFERRED/SLC21B; deemed_contract.py + cot.py deemed entries + void uplift; change_of_tenancy_register.py orchestration; home_move_win_rate.py thin acquisition; life_events.py MOVE trigger) and every one of them fired INDEPENDENTLY -- nothing joined a move-out to the void that follows it, to the occupant who lands after that, to whether the departing occupant''s final bill was ever paid, or to what the landed occupant is worth. TenancyChangeCoupler is that join: no new register, no new deemed-rate engine, no new closure engine, no new win-rate model (fold-not-duplicate honoured). Both DISCOVER gaps closed: (1) DEBT physics = p(final bill unpaid) as a modelled outcome at closure, living in simulation/final_bill_outcome.py BEHIND the wall; (2) acquisition-VALUE physics = the win outcome carries landed-occupant CLV. WHY THE DEEMED LEGS ARE TWO: a move-out does not leave the property unsupplied -- supply continues unbilled under the Ofgem occupier account (VOID_PERIOD) before the new occupant lands on a fresh deemed contract from day 1 of possession (NEW_TENANT). Ofgem''s 30 Oct 2025 debt review puts GBP 1.1-1.7bn of the UK''s GBP 4.4bn historic energy debt inside that FIRST leg; modelling one leg and not the other is exactly what makes the void period invisible, the hole the regulator found. WALL POSITION: the company side RECORDS the exit outcome (paid/partially paid/unpaid/gone away) as observed and never computes it -- the probability is keyed off household truth a real supplier cannot read (epistemic_verifier PASS). C-S1 is load-bearing here, not decorative: a void period IS ''MOVE_OUT arrived, MOVE_IN has not'', so an INCOMPLETE tenancy change is the normal state rather than an error -- legs may arrive singly, late, out of order (a customer who registers only after moving in produces MOVE_IN first, which is the Ofgem occupier case) or twice (idempotent by event id). Fuel-agnostic: keyed by (supply_point_id, fuel), never MPAN alone. EVIDENCE: 72 new tests green, R15 mutation-proven both ways; 124 regression tests green across the 5 shared modules touched. SIMPLIFICATION REGISTERED (the L1 bar is ''skeletal'', and this is where it is skeletal): the final-bill outcome probability is a calibrated draw against aggregate Ofgem debt statistics, NOT a per-household collections-behaviour model -- there is no dunning-response, no payment-arrangement negotiation and no trace-and-collect path behind it yet, so recovery after a gone-away is modelled as a single outcome at closure rather than a process over time. Closes Board Spec 006 item 9. Remaining VERIFY leg: 0b evidence on a deployed surface (no site surface renders the tenancy-change join yet).'
- '2026-08-03 ORPHAN-TRANSITION FINDING, registered from the DD_seasonal_cashflow_physics tick (not fixed on sight -- machine not blocked). W2_12 is at its level_target, but TenancyChangeCoupler / ChangeOfTenancyRegister have NO production caller anywhere in the repo -- grep-verified, the only references outside this module are its own two test files and stale worktree copies -- and simulation/life_events.py emits NO move event of any kind, so there is no tenancy-change stream for the coupler to consume. The mechanism exists as a library and has never existed as a NUMBER. That matters beyond this cell: DD2''s parked residual (a non-zero opening level-DD balance) was recorded as waiting on W2_12, so W2_12 reaching its target looked like an unblock and is not one -- wiring it now would be a live mechanism with a permanently dead input. Two pieces of real work follow, in order: (1) the SIM emits MOVE_IN/MOVE_OUT life events (W2_5''s stream is where they belong); (2) the company''s run path drives TenancyChangeCoupler off them. Only after (2) does a deemed-supply opening balance exist to feed DD2 -- and note the domain law the DD2 note had backwards: SLC 27 / SLC 12.2 put debt on the PERSON, so the opening is the incoming occupant''s OWN deemed-supply arrears (DeemedLeg.NEW_OCCUPANT), never the departing occupant''s debt.'
