atom_id: EP14_adapter_published_cost_stack
simplifications:
- "2026-08-13 DISCOVER/FRAME ONLY, level stays 0, loop_stage stays idle (worker tick, LANE 3\nidle draw). No BUILD code written, nothing in `file_scope` touched, no adapter started --\nthis atom is epoch-3 BUILD-gated on director-reserved curriculum sequencing (R13) and\nEPOCH_GATING_AND_ATOM_AUTHORSHIP rule 7 makes DISCOVER/FRAME available while BUILD is not.\n`docs/design/maturity_map.yaml` deliberately NOT edited: nothing in the map moves for this\npass, and another lane holds a staged hunk in that file. Output is this record plus one\nqueued finding. Everything below is `observed-with-evidence` unless labelled otherwise (R9).\n\nMEASURED AT: HEAD f232c3480, live `docs/reports/run_output_latest.json` and the live\npublished `site/data/margin_bridge.json` (as_of_run `run_output_latest.json`, mtime\n2026-08-13 17:51). Shipped `simulation/policy_costs.py` functions called directly, nothing\nmonkeypatched. Both of this atom's cited evidence paths were DEAD (the known moved-path\nclass) and are repaired above: the counterparty-API research had moved to\n`docs/design/refs/`, the scope brief to `docs/domain_artefact_library/scope_briefs/`.\n\n==========================================================================================\nFINDING 1 -- THE \"~£4.9M RECONCILIATION GAP\" IN THIS ATOM'S OWN NAME IS NOT A MEASURE OF\nHOW WRONG THE COST STACK IS. IT *IS* THE COST STACK. It must never be this atom's exit\ncriterion, and an adapter that improves the stack will move it in either direction.\n==========================================================================================\n\nThe atom's `name:` says these adapters \"feed the non-commodity cost stack that the\nadvisor's scope brief puts in ~£4.9M reconciliation-gap territory\", and the scope brief\n(line 3) calls itself \"the anatomy under the £4.9M reconciliation gap\". Read against the\nlive bridge, that reads as a defect the adapters would repair. It is not.\n\nLive `site/data/margin_bridge.json`:\n\n    settlement_net_margin_gbp     1,559,115.61\n    ledger_net_margin_gbp         6,451,324.77\n    total_gap_gbp                 4,892,209.16     <- the \"£4.9M\"\n    item noncommodity_cost_no_revenue_recognition  4,845,911.07   (99.05% of the gap)\n    item revenue_basis_difference                     40,986.88\n    item residual (back-billing catch-up)              5,311.22\n    unexplained_remainder_gbp                              0.99\n\n`tools/generate_margin_bridge.py` computes that dominant item as\n`item1 = settlement_gross - settlement_capital - settlement_net`, which it documents as\nthe only reconciling residual and which is therefore the run's whole absorbed\npolicy+network cost. Checked against the run's own published component totals rather than\ntaking the comment's word (2026-08-13, `docs/reports/run_output_latest.json`, summed over\nyears 2016-2025):\n\n    policy_cost_gbp        3,404,188.65\n    network_cost_gbp         876,028.87\n    gas_policy_cost_gbp      171,108.84\n    gas_network_cost_gbp     393,759.19\n    ------------------------------------\n    sum                    4,845,085.56   vs item1 4,845,911.07   (delta 825.51, 0.017%)\n\nSo the headline is the stack's own total, to within two hundredths of a percent. The\nbridge's own item text already says why: on the ledger the non-commodity charge enters\nrevenue and leaves as cost and cancels, so `ledger_net` is provably invariant to its\nmagnitude; on the settlement side fixed-tariff records deduct the full real cost with no\noffsetting revenue line at all. THE GAP IS A MISSING REVENUE LINE, NOT A WRONG COST.\n\nTHE CONSEQUENCE FOR THIS ATOM, stated plainly because it inverts the obvious reading: if\nEP14's adapters raise the parsed stack by 10%, the published \"reconciliation gap\" GROWS by\n~£485k and this atom looks like it made the company worse; if they lower it, the gap\nshrinks and this atom looks like it fixed something it never touched. Either way the\nnumber moves for a reason unrelated to fidelity. `B1_margin_bridge` / `D2_three_clocks`\nown the revenue-recognition side; this atom must be scored on parse fidelity to the\npublication, never on the bridge headline. Recommendation (acting on it by recording it\nhere rather than asking): when EP14 is opened, its exit criteria cite the scope brief's own\nB1 test -- the build-up reconciles to the cap-annex allowance per period within materiality\nor every divergence carries a named driver -- and explicitly EXCLUDE `total_gap_gbp`.\n\n==========================================================================================\nFINDING 2 -- BLOCKING, QUEUED NOT FIXED. The dominant component of that stack is read on\nthe WRONG YEAR BOUNDARY for every January-March date, against its own table's documented\nkeying, and the error is forward-looking. £62,449.57 of the published £4,845,911.07.\n==========================================================================================\n\n`simulation/policy_costs.py::_NETWORK_COST_RESI_SME_BY_YEAR` states its own key in the\ncomment above it:\n\n    # Apr-Mar years mapped to calendar year of Q1 (the year the obligation year starts).\n    2021: 49.0,   # 2021/22: £49.42/MWh\n    2022: 66.0,   # 2022/23: £66.24/MWh -- BSUoS moved 100% to demand side Apr 2022\n\nKey 2022 is therefore the charging year running Apr-2022..Mar-2023. But the reader does\nnot use the Apr-start helper its four siblings use:\n\n    get_ro_cost_per_mwh        -> _ro_oy_start_year(date_str)   (Apr-Mar)\n    get_ccl_per_mwh            -> _ro_oy_start_year(date_str)   (Apr-Mar)\n    get_cm_levy_per_mwh        -> _ro_oy_start_year(date_str)   (Apr-Mar)\n    get_fit_levy_per_mwh       -> _ro_oy_start_year(date_str)   (Apr-Mar)\n    get_electricity_network_cost_per_mwh -> int(date_str[:4])   (CALENDAR)   <- the defect\n\nSo 2022-01-05 reads key 2022 = £66.00/MWh, when by the table's own documented keying that\ndate belongs to charging year 2021/22 = key 2021 = £49.00/MWh. Confirmed by calling the\nshipped function: `get_electricity_network_cost_per_mwh(\"2021-12-01\")` = 49.0 and\n`(\"2022-01-05\")` = 66.0 -- a £17/MWh step landing on 1 January for a change the table's own\ncomment attributes to April. `_DUOS_IC_BY_YEAR` is read by the same function and carries\nthe same error.\n\nQUANTIFIED on the live run, Q1 electricity kWh summed from `per_customer_monthly` (gas\naccounts, id suffix `g`, excluded), overstatement = Q1_MWh x (table[Y] - table[Y-1]):\n\n    year   Q1 elec MWh   calendar key   Apr-start key   delta      Q1 error GBP   yr network GBP\n    2016          11.8          43.0            43.0      0.0              0.00         2,899.57\n    2017         519.1          44.0            43.0     +1.0            519.13        25,686.85\n    2018         765.1          42.0            44.0     -2.0         -1,530.12        38,090.77\n    2019       1,766.8          45.0            42.0     +3.0          5,300.47        87,884.24\n    2020       2,524.0          46.0            45.0     +1.0          2,524.03       124,165.80\n    2021       2,462.4          49.0            46.0     +3.0          7,387.35       122,274.54\n    2022       2,424.4          66.0            49.0    +17.0         41,214.65       132,835.36\n    2023       2,433.5          75.0            66.0     +9.0         21,901.12       138,631.02\n    2024       2,477.8          69.0            75.0     -6.0        -14,867.08       142,680.11\n    2025       2,416.7          69.0            69.0      0.0              0.00        60,880.62\n    ------------------------------------------------------------------------------------------\n    TOTAL                                                            62,449.57       876,028.87\n\n7.13% of the run's whole electricity network-charge line; 31.0% of 2022's alone. It is\nBIDIRECTIONAL (2018 and 2024 are understated), so this is a mis-keying and not a one-way\ninflation -- worth stating because \"it always overstates\" would have been the convenient\nfinding. It is also FORWARD-LOOKING in the year that matters most: Jan-Mar 2022 is charged\nthe post-BSUoS-reform rate that the table's own comment dates to April 2022, i.e. the\nsettlement engine spends three winter months of the crisis paying a charge that had not\ncommenced. That is a Point-in-Time Blindfold breach inside the world layer, not merely a\nrounding choice.\n\nWHY BLOCKING (finding_severity clause 2, by construction): £62,449.57 of the published\n`total_gap_gbp` on the front door's Reconciliation Bridge is this mis-keying. A published\nfigure in this area is wrong. Filed as\n`docs/staging/WORKER_FINDING_THE_DOMINANT_COST_COMPONENT_IS_READ_ON_A_CALENDAR_YEAR_2026-08-13.md`.\n\nREPAIRED 2026-08-13 by the BUILD draw that took this blocking finding off the RUNG-1c lane.\n`get_electricity_network_cost_per_mwh` now derives its key with `_ro_oy_start_year`, matching\nits four siblings and both tables' own comments; `_DUOS_IC_BY_YEAR` gained the basis comment\nit never carried. Verified on the shipped function, nothing monkeypatched:\n`(\"2021-12-01\") -> 49.0`, `(\"2022-01-05\") -> 49.0` (was 66.0), `(\"2022-04-05\") -> 66.0` --\nthe £17/MWh step now lands on 1 April, where the table's comment puts it.\n\nThe instance fix alone would breach R10, so the CLASS is what was actually built:\n`policy_costs.YEAR_KEY_BASIS` declares the year convention of all 13 year-keyed tables, and\n`tests/simulation/test_policy_cost_year_basis.py` enforces it on three independent legs --\na census (a new table with no declared basis fails), a behavioural probe at a JANUARY date\n(the only date where the two conventions disagree, checked against each reader's OBSERVED\noutput), and a documentary leg that reads the source comments, so a table whose rows say\n\"2022/23\" cannot be declared calendar. NOTE the naive control the finding itself recommended\n-- \"every reader calls the same helper\" -- would have been WRONG: four tables here (CfD,\nmutualization, both standing charges) are genuinely calendar-published and their readers are\ncorrect. The subject is agreement with the table's OWN basis, not uniformity.\n\nR15 (mutation-proven, all four fire; re-run at LANDING 2026-08-13, unmutated baseline\n31 passed):\n  1. reader reverted to `int(date_str[:4])`  -> 3 tests fail (both network tables + the pin)\n  2. network table mis-declared \"calendar\"   -> 2 tests fail, on two INDEPENDENT legs\n  3. new undeclared year-keyed table added   -> census fails\n  4. calendar reader forced onto `apr_mar`   -> mutualization probe fails\nMutation 4 is the one that matters for tautology: the control is not \"always demand Apr-Mar\".\nMETHOD at landing: each mutation was applied IN-PROCESS (rebind the reader / the registry\nentry on the imported module, then invoke pytest in the same interpreter), so no mutated\nbyte ever existed on the shared tree and no concurrent lane could commit one -- the\nfile-write-then-restore method has been observed here to lose a concurrent edit. The\nprobes bind through the module attribute, so a rebound reader is what the control sees.\n\nTHE £62.4k WAS RE-DERIVED BEFORE BEING ACTED ON, and the original evidence path had ROTTED:\nfinding 2 cites `per_customer_monthly` in `docs/reports/run_output_latest.json`, and that key\nNO LONGER EXISTS in the artefact (later runs the same day changed its shape). The number was\ntherefore reproduced by a DIFFERENT method against a DIFFERENT key -- the `bills` list, each\nbill's kWh apportioned evenly across its period days and the Jan-Mar days bucketed by year,\ngas accounts (id suffix `g`) excluded:\n\n    yr      Q1 MWh   cal    apr   delta        err GBP\n    2017     502.0  44.0   43.0    +1.0         501.98\n    2018     760.5  42.0   44.0    -2.0      -1,520.95\n    2019   1,763.6  45.0   42.0    +3.0       5,290.81\n    2020   2,501.0  46.0   45.0    +1.0       2,501.05\n    2021   2,488.6  49.0   46.0    +3.0       7,465.83\n    2022   2,407.4  66.0   49.0   +17.0      40,925.10\n    2023   2,421.2  75.0   66.0    +9.0      21,790.97\n    2024   2,488.9  69.0   75.0    -6.0     -14,933.41\n    TOTAL                                    62,021.38\n\n62,021.38 vs the claimed 62,449.57 -- 0.7% apart, every year's SIGN and magnitude matching,\nincluding the two negative years. Independent method, independent key, same answer: the\nquantification reproduces. Recorded because the citation itself is now dead, so a later\nreader following finding 2's stated path would find nothing and could wrongly conclude the\nnumber was never evidenced.\n\nNOT CLAIMED: that the tables' VALUES are right (unchanged here, still Ofgem Annex 9 as\ncalibrated); that the gas-side tables were re-derived (their readers were already Apr-Mar\nkeyed and are now pinned by the same control, but the rates were not re-checked). The\npublished `total_gap_gbp` still carries the old figure -- it moves on the next sim run, and\nthat ~£62.4k fall is the repair landing, not a regression.\n\n==========================================================================================\nFINDING 3 -- LATENT. The CfD reader is the one levy keyed on the calendar year, and its\ntable is an ex-post ANNUAL AVERAGE, so a term priced in January is priced on the year's\noutturn -- including a rebate the module's own docstring calls unexpected.\n==========================================================================================\n\n`get_cfd_levy_per_mwh` uses `int(date_str[:4])` over `_CFD_LEVY_BY_YEAR`, documented as\n\"CfD Interim Levy Rate annual average (£/MWh) by calendar year ... Negative in 2022:\nwholesale prices exceeded CfD strike prices, so LCCC rebated suppliers\". The real\ninstrument is a daily ILR with quarterly reconciliation (scope brief, table row \"CfD\nsupplier obligation\"), so an annual average is only knowable after the year ends.\n\nThe pricing path reads it at term start. `simulation/renewals.py:133-139` builds\n`policy_cost = get_electricity_policy_cost_per_mwh(term_start_str) + cm + fit` under the\ncomment \"PUBLISHED schedules -- what any market participant can look up for this term\", and\nhands it to the renewal offer. Values returned at term start:\n\n    2021-12-01   cfd  +1.50   policy 26.50\n    2022-01-05   cfd  -5.00   policy 20.00        <- £6.50/MWh swing across 1 January\n    2022-06-01   cfd  -5.00   policy 21.00\n\nA fixed term starting 5 January 2022 is therefore priced £6.50/MWh CHEAPER on the strength\nof a rebate driven by wholesale prices that had not yet been observed -- 3.25x the whole\n£2.00/MWh `TARGET_MARGIN_GBP_PER_MWH` in `saas/tariff_pricing.py`, in the direction that\nmakes the crisis year look survivable. Run-wide `cfd_levy_gbp` is £262,856.80, so the\nmoney at stake is far smaller than finding 2; the reason it is recorded is that it is the\none component where the comment asserting look-up-ability is false rather than merely\nmis-keyed. LATENT, not BLOCKING: it moves priced rates, and no published figure has yet\nbeen shown to depend on it.\n\n==========================================================================================\nFINDING 4 -- FRAME. There is no belief-vs-truth gap to measure here yet, because one table\nserves both sides of the wall; and the company-side organ this atom would need ALREADY\nEXISTS, unwired.\n==========================================================================================\n\nThe COUPLED TRIAD requires the company to discover the cost stack through the wall and be\nallowed to be wrong about it. Today it cannot be wrong. `simulation/policy_costs.py` is the\nsingle source for both sides: `simulation/hedged_settlement.py` and\n`simulation/gas_settlement.py` deduct from it (truth), and `simulation/renewals.py` reads\nthe same functions to price the renewal offer (belief). `saas/tariff_pricing.py` only names\nthem in its docstring -- it takes `policy_cost_per_mwh` / `network_cost_per_mwh` as\narguments, and the caller that supplies them is the SIM. The company's forecast error on\nthe non-commodity stack is therefore ZERO BY CONSTRUCTION. This is the third instance of a\nfiled class in this project (`the world's churn ceiling was the company's belief`, `the\nworld's contact rate is the company's estimate`) and the same R15 tautology shape.\n\nThe company-side half is already written and has NO PRODUCTION CALLER (checked by import\ncensus over the repo excluding `tests/`, 2026-08-13):\n\n    company/pricing/ncc_forecast_register.py   importers: 2, both tests\n    company/market/duos_ledger.py              importers: 1, a test\n    company/market/tnuos_ledger.py             importers: 1, a test\n    company/market/bsuos_ledger.py             importers: 1, a test\n    company/pricing/ofgem_price_cap.py         importers: 18 production  <- the wired one\n\n`ncc_forecast_register.py`'s own docstring already draws the seam this atom needs\n(\"Distinct from: bsuos_ledger.py (actuals) ... This register tracks FORECASTS used for\npricing\") and already names under-estimation as the 2021-22 failure mechanism with a\n30-50% quarterly error. So EP14's build is not \"write the company's reading\" -- it is\nADAPTER -> forecast register -> pricing path, with the world keeping `policy_costs.py` as\ntruth, and the measurable gap being forecast-vs-outturn per component per period. This is\nthe same shape as `a class's remedy may already exist, unwired`: the risk on opening EP14\nis building a second NCC organ beside four dormant ones, not lacking one.\n\nWHAT THIS PASS DID NOT DO, so the next draw is not misled: no adapter, parser, or\nschema-drift work exists yet; the gas side of the stack (£564,868 combined) was not\ndecomposed; the scope brief's B1 cap-annex reconciliation was read but not run against the\ncompany's build-up. Finding 2's repair was NOT part of this DISCOVER/FRAME pass (a LANE 3\ndraw carries no BUILD); it was taken separately by the RUNG-1c BUILD draw recorded under\nfinding 2 above, and landed with this commit. Read the two together: the pass discovered,\nthe later draw repaired.\n"
map_notes:
  origin_note: 'Schema-drift tolerance is the requirement that makes this real: a published spreadsheet whose columns move between periods is the normal case, not the edge case, and a parser that fails silently on a moved column produces a cost stack that is confidently wrong. Fail-LOUD on an unparseable publication (R15: an unavailable input is a failed input, never a zero). Regulation-commons doctrine applies -- the TEXT is readable by every lane; the company''s READING of it stays its own and is allowed to be wrong.'
  name: 'File-ingest adapters, not REST clients, for the published cost stack: the Ofgem price cap level and full annex model (spreadsheets each period), DNO DUoS via CDCM tariff spreadsheets, TNUoS via NESO publications, and BSUoS as reformed under NESO. Access class OPEN, spreadsheet-shaped. These feed the non-commodity cost stack that the advisor''s scope brief puts in ~£4.9M reconciliation-gap territory.'
