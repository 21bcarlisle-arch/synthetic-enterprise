  `docs/design/refs/`, the scope brief to `docs/domain_artefact_library/scope_briefs/`.

  ==========================================================================================
  FINDING 1 -- THE "~£4.9M RECONCILIATION GAP" IN THIS ATOM'S OWN NAME IS NOT A MEASURE OF
  HOW WRONG THE COST STACK IS. IT *IS* THE COST STACK. It must never be this atom's exit
  criterion, and an adapter that improves the stack will move it in either direction.
  ==========================================================================================

  The atom's `name:` says these adapters "feed the non-commodity cost stack that the
  advisor's scope brief puts in ~£4.9M reconciliation-gap territory", and the scope brief
  (line 3) calls itself "the anatomy under the £4.9M reconciliation gap". Read against the
  live bridge, that reads as a defect the adapters would repair. It is not.

  Live `site/data/margin_bridge.json`:

      settlement_net_margin_gbp     1,559,115.61
      ledger_net_margin_gbp         6,451,324.77
      total_gap_gbp                 4,892,209.16     <- the "£4.9M"
      item noncommodity_cost_no_revenue_recognition  4,845,911.07   (99.05% of the gap)
      item revenue_basis_difference                     40,986.88
      item residual (back-billing catch-up)              5,311.22
      unexplained_remainder_gbp                              0.99

  `tools/generate_margin_bridge.py` computes that dominant item as
  `item1 = settlement_gross - settlement_capital - settlement_net`, which it documents as
  the only reconciling residual and which is therefore the run's whole absorbed
  policy+network cost. Checked against the run's own published component totals rather than
  taking the comment's word (2026-08-13, `docs/reports/run_output_latest.json`, summed over
  years 2016-2025):

      policy_cost_gbp        3,404,188.65
      network_cost_gbp         876,028.87
      gas_policy_cost_gbp      171,108.84
      gas_network_cost_gbp     393,759.19
      ------------------------------------
      sum                    4,845,085.56   vs item1 4,845,911.07   (delta 825.51, 0.017%)

  So the headline is the stack's own total, to within two hundredths of a percent. The
  bridge's own item text already says why: on the ledger the non-commodity charge enters
  revenue and leaves as cost and cancels, so `ledger_net` is provably invariant to its
  magnitude; on the settlement side fixed-tariff records deduct the full real cost with no
  offsetting revenue line at all. THE GAP IS A MISSING REVENUE LINE, NOT A WRONG COST.

  THE CONSEQUENCE FOR THIS ATOM, stated plainly because it inverts the obvious reading: if
  EP14's adapters raise the parsed stack by 10%, the published "reconciliation gap" GROWS by
  ~£485k and this atom looks like it made the company worse; if they lower it, the gap
  shrinks and this atom looks like it fixed something it never touched. Either way the
  number moves for a reason unrelated to fidelity. `B1_margin_bridge` / `D2_three_clocks`
  own the revenue-recognition side; this atom must be scored on parse fidelity to the
  publication, never on the bridge headline. Recommendation (acting on it by recording it
  here rather than asking): when EP14 is opened, its exit criteria cite the scope brief's own
  B1 test -- the build-up reconciles to the cap-annex allowance per period within materiality
  or every divergence carries a named driver -- and explicitly EXCLUDE `total_gap_gbp`.

  ==========================================================================================
  FINDING 2 -- BLOCKING, QUEUED NOT FIXED. The dominant component of that stack is read on
  the WRONG YEAR BOUNDARY for every January-March date, against its own table's documented
  keying, and the error is forward-looking. £62,449.57 of the published £4,845,911.07.
  ==========================================================================================

  `simulation/policy_costs.py::_NETWORK_COST_RESI_SME_BY_YEAR` states its own key in the
  comment above it:

      # Apr-Mar years mapped to calendar year of Q1 (the year the obligation year starts).
      2021: 49.0,   # 2021/22: £49.42/MWh
      2022: 66.0,   # 2022/23: £66.24/MWh -- BSUoS moved 100% to demand side Apr 2022

  Key 2022 is therefore the charging year running Apr-2022..Mar-2023. But the reader does
  not use the Apr-start helper its four siblings use:

      get_ro_cost_per_mwh        -> _ro_oy_start_year(date_str)   (Apr-Mar)
      get_ccl_per_mwh            -> _ro_oy_start_year(date_str)   (Apr-Mar)
      get_cm_levy_per_mwh        -> _ro_oy_start_year(date_str)   (Apr-Mar)
      get_fit_levy_per_mwh       -> _ro_oy_start_year(date_str)   (Apr-Mar)
      get_electricity_network_cost_per_mwh -> int(date_str[:4])   (CALENDAR)   <- the defect

  So 2022-01-05 reads key 2022 = £66.00/MWh, when by the table's own documented keying that
  date belongs to charging year 2021/22 = key 2021 = £49.00/MWh. Confirmed by calling the
  shipped function: `get_electricity_network_cost_per_mwh("2021-12-01")` = 49.0 and
  `("2022-01-05")` = 66.0 -- a £17/MWh step landing on 1 January for a change the table's own
  comment attributes to April. `_DUOS_IC_BY_YEAR` is read by the same function and carries
  the same error.

  QUANTIFIED on the live run, Q1 electricity kWh summed from `per_customer_monthly` (gas
  accounts, id suffix `g`, excluded), overstatement = Q1_MWh x (table[Y] - table[Y-1]):

      year   Q1 elec MWh   calendar key   Apr-start key   delta      Q1 error GBP   yr network GBP
      2016          11.8          43.0            43.0      0.0              0.00         2,899.57
      2017         519.1          44.0            43.0     +1.0            519.13        25,686.85
      2018         765.1          42.0            44.0     -2.0         -1,530.12        38,090.77
      2019       1,766.8          45.0            42.0     +3.0          5,300.47        87,884.24
      2020       2,524.0          46.0            45.0     +1.0          2,524.03       124,165.80
      2021       2,462.4          49.0            46.0     +3.0          7,387.35       122,274.54
      2022       2,424.4          66.0            49.0    +17.0         41,214.65       132,835.36
      2023       2,433.5          75.0            66.0     +9.0         21,901.12       138,631.02
      2024       2,477.8          69.0            75.0     -6.0        -14,867.08       142,680.11
      2025       2,416.7          69.0            69.0      0.0              0.00        60,880.62
      ------------------------------------------------------------------------------------------
      TOTAL                                                            62,449.57       876,028.87

  7.13% of the run's whole electricity network-charge line; 31.0% of 2022's alone. It is
  BIDIRECTIONAL (2018 and 2024 are understated), so this is a mis-keying and not a one-way
  inflation -- worth stating because "it always overstates" would have been the convenient
  finding. It is also FORWARD-LOOKING in the year that matters most: Jan-Mar 2022 is charged
  the post-BSUoS-reform rate that the table's own comment dates to April 2022, i.e. the
  settlement engine spends three winter months of the crisis paying a charge that had not
  commenced. That is a Point-in-Time Blindfold breach inside the world layer, not merely a
  rounding choice.

  WHY BLOCKING (finding_severity clause 2, by construction): £62,449.57 of the published
  `total_gap_gbp` on the front door's Reconciliation Bridge is this mis-keying. A published
  figure in this area is wrong. NOT DISCHARGED and deliberately NOT FIXED IN THIS PASS --
  SELF_INTERRUPT_DISCIPLINE queues a worker's own finding by default, and the repair is a
  baseline-world fidelity change (R13: legitimate, decided blind to company P&L) which is
  BUILD, which this draw does not carry. Filed as
  `docs/staging/WORKER_FINDING_THE_DOMINANT_COST_COMPONENT_IS_READ_ON_A_CALENDAR_YEAR_2026-08-13.md`.

  ==========================================================================================
  FINDING 3 -- LATENT. The CfD reader is the one levy keyed on the calendar year, and its
  table is an ex-post ANNUAL AVERAGE, so a term priced in January is priced on the year's
  outturn -- including a rebate the module's own docstring calls unexpected.
  ==========================================================================================

  `get_cfd_levy_per_mwh` uses `int(date_str[:4])` over `_CFD_LEVY_BY_YEAR`, documented as
  "CfD Interim Levy Rate annual average (£/MWh) by calendar year ... Negative in 2022:
  wholesale prices exceeded CfD strike prices, so LCCC rebated suppliers". The real
  instrument is a daily ILR with quarterly reconciliation (scope brief, table row "CfD
  supplier obligation"), so an annual average is only knowable after the year ends.

  The pricing path reads it at term start. `simulation/renewals.py:133-139` builds
  `policy_cost = get_electricity_policy_cost_per_mwh(term_start_str) + cm + fit` under the
  comment "PUBLISHED schedules -- what any market participant can look up for this term", and
  hands it to the renewal offer. Values returned at term start:

      2021-12-01   cfd  +1.50   policy 26.50
      2022-01-05   cfd  -5.00   policy 20.00        <- £6.50/MWh swing across 1 January
      2022-06-01   cfd  -5.00   policy 21.00

  A fixed term starting 5 January 2022 is therefore priced £6.50/MWh CHEAPER on the strength
  of a rebate driven by wholesale prices that had not yet been observed -- 3.25x the whole
  £2.00/MWh `TARGET_MARGIN_GBP_PER_MWH` in `saas/tariff_pricing.py`, in the direction that
  makes the crisis year look survivable. Run-wide `cfd_levy_gbp` is £262,856.80, so the
  money at stake is far smaller than finding 2; the reason it is recorded is that it is the
  one component where the comment asserting look-up-ability is false rather than merely
  mis-keyed. LATENT, not BLOCKING: it moves priced rates, and no published figure has yet
  been shown to depend on it.

  ==========================================================================================
  FINDING 4 -- FRAME. There is no belief-vs-truth gap to measure here yet, because one table
  serves both sides of the wall; and the company-side organ this atom would need ALREADY
  EXISTS, unwired.
  ==========================================================================================

  The COUPLED TRIAD requires the company to discover the cost stack through the wall and be
  allowed to be wrong about it. Today it cannot be wrong. `simulation/policy_costs.py` is the
  single source for both sides: `simulation/hedged_settlement.py` and
  `simulation/gas_settlement.py` deduct from it (truth), and `simulation/renewals.py` reads
  the same functions to price the renewal offer (belief). `saas/tariff_pricing.py` only names
  them in its docstring -- it takes `policy_cost_per_mwh` / `network_cost_per_mwh` as
  arguments, and the caller that supplies them is the SIM. The company's forecast error on
  the non-commodity stack is therefore ZERO BY CONSTRUCTION. This is the third instance of a
  filed class in this project (`the world's churn ceiling was the company's belief`, `the
  world's contact rate is the company's estimate`) and the same R15 tautology shape.

  The company-side half is already written and has NO PRODUCTION CALLER (checked by import
  census over the repo excluding `tests/`, 2026-08-13):

      company/pricing/ncc_forecast_register.py   importers: 2, both tests
      company/market/duos_ledger.py              importers: 1, a test
      company/market/tnuos_ledger.py             importers: 1, a test
      company/market/bsuos_ledger.py             importers: 1, a test
      company/pricing/ofgem_price_cap.py         importers: 18 production  <- the wired one

  `ncc_forecast_register.py`'s own docstring already draws the seam this atom needs
  ("Distinct from: bsuos_ledger.py (actuals) ... This register tracks FORECASTS used for
  pricing") and already names under-estimation as the 2021-22 failure mechanism with a
  30-50% quarterly error. So EP14's build is not "write the company's reading" -- it is
  ADAPTER -> forecast register -> pricing path, with the world keeping `policy_costs.py` as
  truth, and the measurable gap being forecast-vs-outturn per component per period. This is
  the same shape as `a class's remedy may already exist, unwired`: the risk on opening EP14
  is building a second NCC organ beside four dormant ones, not lacking one.

  WHAT THIS PASS DID NOT DO, so the next draw is not misled: no adapter, parser, or
  schema-drift work exists yet; the gas side of the stack (£564,868 combined) was not
  decomposed; the scope brief's B1 cap-annex reconciliation was read but not run against the
  company's build-up; and finding 2's repair is queued, not made.
