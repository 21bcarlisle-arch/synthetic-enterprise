- '2026-07-27 MINTED as a DRAWABLE ATOM from DIRECTOR_RULING_COHORT_ASSIGNMENT_ACTIVATED_2026-07-27 (WORK THIS CREATES item 3 + section 2 the pool-vs-book distinction). LANE G_data_learning = EPOCH2_CAMPAIGN front (OPEN, opened_by director console ts=1784462364) -> BUILD-drawable now; sibling to G2_fidelity_evidence_ledger. DELIVERABLE: for each volume-dependent segmentation capability (any belief-vs-truth score that needs a populated book to move -- e.g. the couple_cohort per-(axis,tenure-cell) belief_gap, which needs support>=N_MIN per cell), mark it UNTESTABLE-AT-CURRENT-BOOK in the fidelity ledger rather than scored as working, with the UNLOCK condition NAMED (acquisition becomes a decision variable at the director growth session, ruling section 2). This is the pool-vs-book wall: turning cohorts on gives the WORLD variety, NOT the COMPANY a book -- 14 customers cannot populate ~12 segments, so activation must NOT be read as segmentation becoming testable (a surface implying it is a claim-status defect under the derivation rule, ruling section 2). EXIT CRITERIA (R11+R15): (1) each volume-dependent segmentation ledger row carries an explicit untestable-at-current-book status + its named unlock condition, R11-verified to the published ledger/surface value; (2) R15 -- MUTATION: a surface (site/report/proof) that scores a volume-dependent segmentation capability as WORKING while the book is below the volume floor FAILS the coherence/claim-status gate (proves untestable-marking is load-bearing, not decorative); passes when the row honestly reads untestable (both-ways); (3) the marking is DERIVED from the book size / cell support, not hand-typed, so it auto-flips to testable when acquisition unlocks (no orphan transition, R11). R12: an untestable score must never be tuned to look testable. Depends in prose on the coverage machinery (CA2) for cell support; NOT a machine depends_on. Level moves blocked_on director_level_up (R16).'
- '2026-07-27 BUILT (worker tick; code L3-quality, level_current HELD at 0 per R16). DELIVERED a CLASS mechanism (R10), not an instance note: register docs/observability/segmentation_testability_ledger.json (5 volume-dependent segmentation capabilities -- ~12-cell book coverage, per-segment CLV / churn / cost-to-serve / pricing) each testable_at_current_book=false, min_book_for_testability=36 (=12-cell knee x >=3 tail floor) + a named UNLOCK (acquisition becomes a decision variable at the director growth/leverage session, its first item -- POOL_VS_BOOK ruling). GATE background/segmentation_testability_ledger.py::review_register(book_size) iterates the register and REDS on: claim-testable-below-floor (fail-open), stale-untestable-above-floor (both-ways), missing unlock, structural / non-finite floor, unreadable register (fail-closed). DESIGN DEVIATION (honest): a SEPARATE register+module rather than writing into fidelity_evidence_ledger.json (the originally-declared file_scope) -- that ledger''s schema (rel_id / relationship) and its live gate/consumers would choke on an untestable-marking row and could wedge publishing (that module''s own documented warning); file_scope updated to actual files. EXIT (2) R15 both-ways: 23 tests green, every guard mutation-proven to fire on its named defect and clear when removed; independence proven (the gate never reads the book -- the verdict flips purely on the passed size). EXIT (3) no orphan transition: the untestable->testable release is DEFINED+TESTED -- a book crossing the floor reds a frozen untestable marking, forcing the flip. WIRING STATUS honest (consumed != absorbed): the gate is importable + its contract proven, but NOT yet wired into the publish pipeline (named follow-on, avoids an un-wired-consumer wedge). Level moves blocked_on director_level_up (R16).'
