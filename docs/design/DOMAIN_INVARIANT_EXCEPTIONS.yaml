# The named, dated exceptions to DOMAIN_INVARIANTS.yaml (director ruling of 26 Oct, step 4:
# "A breach blocks the publish, or is recorded as a named, dated exception").
#
# Read by tools/domain_invariant_runner.py::gate, which background/process_run_complete.py runs on
# every completed run's book. An invariant with a BREACHED count that no exception below covers
# refuses the publish while `enforce: true`.
#
# Each exception needs every one of these, or it lifts nothing and the report names what it lacks:
#   invariant   the DOMAIN_INVARIANTS.yaml id
#   scope       which accounts, periods or terms it covers, in words a reader can check
#   reason      why the breach is explained rather than a defect still to find
#   filed       the date it was written
#   retired_by  the commit (or the named fix, until it lands) that will make it unnecessary
#   max_breached  optional: a ceiling; a count above it refuses again
#
# Seeded from the fresh 871f674a2a run's grade
# (docs/staging/SEAT_FINDING_THE_BLIND_INVARIANT_SUITE_ON_THE_67A893E749_BOOK_FINDS_PREPAYMENT_AT_THE_DD_CAP_A_JANUARY_STANDING_CHARGE_AND_METERS_THAT_CHANGE_REGISTERS_2026-10-26.md,
# section "Grade of the fresh 871f674a2a run"). Every ceiling is the count that run found: a defect
# that grows comes back as a refusal. "Partly diagnosed" means the reason covers the share stated and
# no more; the rest is an open defect, not an explanation.
#
# 2026-10-27: the two INV_STANDING_CHARGE_SVT_* exceptions are retired. Every one of their 2,237 breaches
# was the printed per-day rate of a period billed exactly at the cap and rounded to the penny. The
# invariants now carry a penny-per-period tolerance, and the same book grades 0 on both.
#
# 2026-10-27: the two INV_UNIT_RATE_SVT_* exceptions are retired. The fresh run at 2eeb3f0b32, which
# carries the company's clamp at the payment method's own column, grades 0 of 5,921 (elec) and
# 0 of 4,721 (gas), from 298 and 249. Grade beside
# docs/staging/records/SEAT_PREREGISTRATION_THE_FRESH_RUN_AT_2EEB3F0B3_CARRIES_THE_CLAMP_THE_OCCUPIER_CREDIT_UIG_AND_THE_SHARED_HUB_2026-10-27.md.
#
# 2026-10-27: the INV_RENEWAL_NOTICE_42_TO_49_DAYS exception (1,338) is retired. The run now sends the
# SLC 22C statement on day 42, and a fresh full run carrying it grades 0 of 1,170 domestic fixed
# terms owed one. The 2eeb3f0b3 book, graded by the same evaluator, still breaches 1,323 of 1,323.
# Grade beside docs/staging/records/SEAT_PREREGISTRATION_THE_SLC_22C_STATEMENT_ON_A_FRESH_RUN_2026-10-27.md.
enforce: true
exceptions:
  - invariant: INV_PPM_NOT_CREDIT_BILLED
    scope: account C6 only, 12 periods in 2016-2017; the SME leg, not a domestic account
    reason: >-
      Predicted by the pre-registration: one SME leg remains, 0 domestic. It is the leg the
      invariant's own carve-out does not cover.
    filed: 2026-10-27
    retired_by: a statement document type for the SME prepayment leg, or the invariant scoped to domestic accounts
    max_breached: 12
  # 2026-10-27: the two cold-read rows that gained evaluators graded 637 (MPAN) and 291 (EBSS) on
  # the 2eeb3f0b3 ledger. With one MPAN home and the whole credit on the invoice, the same run's
  # ledger, rebuilt, grades 0 and 12. The MPAN exception is retired. Causes per breach in
  # docs/staging/records/SEAT_PREREGISTRATION_THE_EIGHT_COLD_READ_ROWS_ON_THE_2EEB3F0B3_BOOK_2026-10-27.md.
  - invariant: INV_EBSS_CREDIT_EACH_MONTH_OCT22_MAR23
    scope: >-
      7 account-months on the 2eeb3f0b3 book, all on four unnamed-occupier accounts
      (OCC-a1e9ae835e65, OCC-bec72a04dec8, OCC-e3e94f81161b, OCC-eb8498f3f8aa). The five PROS
      joiner months that made it 12 (PROS-2022-0356, PROS-2022-0400, PROS-2023-0010, PROS-2023-0013,
      PROS-2023-0039) are fixed in code, not yet on a run
    reason: >-
      The row now reads "held at 00:00 on the 1st" (guidance 5.4 and 5.8, restated 2026-10-27 by
      its blind author), so the four first part-months it used to count are gone. The seven
      occupier months are the world's occupier path (run_phase2b, occupier_scheme_credit), which
      sized the credit by the occupier's debt; since 2026-10-27 it records the month's whole credit
      (`occupier_scheme_month_credit_gbp`), which no run has carried yet, so the ceiling stays at 7. The five
      PROS months were the other side of the same rule: the named-household path credited a joiner's
      first part-month (PROS-2022-0356 joined 12 Nov 2022 and was credited £66 for November), and
      the guidance gives that month nothing. Both paths now ask `held_at_midnight_on_the_first`.
    filed: 2026-10-27
    retired_by: a run carrying the occupier month credit
    max_breached: 7
  # 2026-10-27: four cold-read rows read the company's own dated acts (`raw_account_export.account_events`).
  # Grade and causes beside the pre-registration,
  # docs/staging/records/SEAT_PREREGISTRATION_THE_SIX_COLD_READ_ROWS_ON_THE_2EEB3F0B3_BOOK_2026-10-27.md.
  - invariant: INV_OVERDUE_WITHIN_BALANCE
    scope: 1,987 of 7,151 collections-journey openings on the 2eeb3f0b3 book (second leg only)
    reason: >-
      Partly diagnosed. The collections desk opens a journey on "a bill is unpaid past its due date"
      read from its own account ledger, and the billing ledger disagrees. In 1,769 cases, the last
      bill due before the opening was collected on or before its due date. In 136, no bill had yet
      fallen due. Traced by hand: SYN-2016-356's journey opens on 29 Oct 2016, but both fuels' bills
      due 16 Oct were collected that day. The two payment records disagree, and which one is wrong
      is NOT established.
    filed: 2026-10-27
    retired_by: one payment record read by both the billing ledger and the collections desk, and a run carrying it
    max_breached: 1987
  - invariant: INV_STATUTE_BARRED_WRITE_OFF_AGE
    scope: 25 of 41 statute-barred write-offs on the 2eeb3f0b3 book
    reason: >-
      24 are written off about six years after supply ended, but the household's final bill was
      paid two to four weeks after that bar date, and a part-payment restarts the six years (the
      row, and the company's own rule name "from the last payment"). The likely cause, NOT
      established: the collections desk's ledger does not carry a final bill's payment received
      after the account closed. One, "no bill old enough", is not yet traced.
    filed: 2026-10-27
    retired_by: the write-off rule reading the payment record that carries final-bill settlements, and a run carrying it
    max_breached: 25
