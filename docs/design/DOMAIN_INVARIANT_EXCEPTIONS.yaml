    filed: 2026-10-28
    retired_by: the raw export carrying each account's void and occupier window, as for INV_EBSS_CREDIT_EACH_MONTH_OCT22_MAR23
    max_breached: 6
  - invariant: INV_OVERDUE_WITHIN_PAGE_BALANCE
    scope: >-
      9,455 of 32,726 collections steps on the fresh b2fc50facf book, which carries the desk posted the
      issued bill (ec079776de). Each prints an overdue figure above what the household's pages say
      is owed that day.
    reason: >-
      Partly diagnosed. The main cause, the desk posted true-kWh revenue before VAT, is fixed and
      graded: 12,730 -> 9,455 on a fresh run.
      What is left, by class (/var/tmp/desk-wo-probe/lag.py):
      (a) 723 steps on 112 households fall after the page wrote the bill off. That is three write-off
      dates for one leaver's debt: the page at the final bill's due date, the company's sweep a year
      later and only after the loop, and the desk's journey at the six-year bar.
      (b) 2,985 are at most 2p above the page, where the desk's ask and the printed bill round apart.
      (c) 466 fall on a direct debit the page posts on its due date, which the desk has not yet seen
      cross.
      (d) 5,280 are NOT attributed. Traced 2026-10-28: 2,005 are on occupier (OCC-) accounts,
      whose bills carried no triad truth, so the page read a second draw (fixed in
      _build_behavioral_trajectories, not yet on a run; 448 of (c)'s 466 are the same defect).
      Of the other 3,275, up to 2,067 follow a credit bill the desk is never posted, 487 are the row
      netting one fuel's credit against the other's debt, and the rest are pennies adding up across
      open bills. Split and predictions in
      docs/staging/records/SEAT_PREREGISTRATION_AN_OCCUPIERS_BILLS_READ_THE_TRIADS_PAYMENT_TRUTH_2026-10-28.md.
      Only (b) and (c) are explanations. (a) and (d) are open defects, excepted rather than refusing
      the next publish, because the page has printed these figures since the cold read of 23 Oct
      and the row puts the count on the surface every run.
      Grade beside docs/staging/records/SEAT_PREREGISTRATION_THE_DESK_POSTED_THE_ISSUED_BILL_READ_ON_A_FRESH_RUN_2026-10-28.md.
    filed: 2026-10-28
    retired_by: docs/staging/SEAT_FINDING_THE_PAGE_PRINTS_MORE_OVERDUE_THAN_IT_SAYS_IS_OWED_ON_493_OF_752_HOUSEHOLDS_2026-10-28.md
