      not reach the usage panel, which reads the run's bill list. Leg 3 (a part year prints no
      figure) is not graded, because the in-memory page does not carry the panel's printed CO2e.
    filed: 2026-10-28
    retired_by: the usage panel reading only the bills the ledger issued
    max_breached: 10
