  # docs/staging/records/SEAT_PREREGISTRATION_THE_EIGHT_COLD_READ_ROWS_ON_THE_2EEB3F0B3_BOOK_2026-10-27.md.
  - invariant: INV_EBSS_CREDIT_EACH_MONTH_OCT22_MAR23
    scope: >-
      6 account-months on the 1691ec0ecd book rebuilt with the window share that counts credit-paid
      days. Three void on the 1st: OCC-bec72a04dec8 (2022-11), OCC-eb8498f3f8aa (2023-02),
      OCC-e3e94f81161b (2023-03). Three held on the 1st by the unnamed occupier's deemed account, the
      payer named later that month: OCC-25ff8966357a (2023-02), OCC-a1e9ae835e65 (2023-02),
      OCC-bec72a04dec8 (2023-02)
    reason: >-
      Rewritten 2026-10-28 for the 1691ec0ecd book, which carries the month credit this exception
      waited for (ff937d809e). The 2eeb3f0b3 reason ("no run has carried yet") is refuted, and the
      breach is not a run defect. Each account opened on a move-out
      (27 Oct, 17 Jan, 23 Feb) with a 21-day private-renter void, so the home was empty at 00:00 on
      the breached month's 1st. Annex C's vacant exception gives that month no credit
      (docs/market_research/energy_bills_support_scheme_delivery.md, "Vacant Properties"), and every
      later month is credited. The evaluator counts the month as on supply because the raw export
      carries no void window. The breach is the grader's.
      Widened 2026-10-28 (gas-leg re-measure): 2bef058eb stopped posting the deemed account's credit
      to the payer, which exposed a second grader's case. A month the unnamed occupier's deemed
      account held at 00:00 on the 1st is owed to that account (guidance 5.4), and the payer named
      later that month is owed nothing; the export carries no window, so the row counts it as the
      payer's. The other nine breaches on the same rebuild under 2bef058eb were a defect (a window
      month the credit paid read as share 0), fixed in bill assembly; a run before that fix grades 12.
    filed: 2026-10-28
    retired_by: the raw export carrying each account's void and occupier window, and the row exempting a month the payer did not hold on its 1st
    max_breached: 6
