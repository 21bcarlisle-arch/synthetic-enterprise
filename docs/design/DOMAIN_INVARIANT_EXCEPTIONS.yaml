      docs/staging/SEAT_FINDING_E1_BILLS_THE_REGISTRY_FIGURE_OVER_A_METERS_OWN_READS_AND_SETS_139_ESTIMATE_BREACHES_2026-10-29.md.
      (2) 78 carry over from 37abacdf42 outside that branch. Their open cause is the one filed there and
      still not traced: the gap between the estimator's reference windows and the row's.
    filed: 2026-10-29
    retired_by: the finding deciding which of E1 and the row describes a supplier's first six months, and the estimator's reference window traced against the row's on the 78
