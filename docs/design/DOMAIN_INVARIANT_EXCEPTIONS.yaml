      estimated 3.0 to 5.5 times the meter: PROS-2017-0336 electricity uses about 300 kWh a month in
      summer and was estimated at about 1,600. Both causes are hypotheses until a fix moves them.
    filed: 2026-10-28
    retired_by: the estimator falling back to the registry figure when one read is all it has, a trace of the summer heating overshoot, and a run carrying both
    max_breached: 13
