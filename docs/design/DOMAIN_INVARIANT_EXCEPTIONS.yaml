    reason: >-
      Traced 2026-10-29 (E2 in the printed-register finding). The estimator bills the annualised advance
      spread by the class-average shape, and the world's aggregate shape matches it (Jun to Aug: gas 7.8%
      against DESNZ 7.2%, electricity 17.6% against 20.5%). Three causes, each measured. (a) Four
