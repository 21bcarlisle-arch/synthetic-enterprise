# The named, dated exceptions to DOMAIN_INVARIANTS.yaml (director ruling of 26 Oct, step 4:
# "A breach blocks the publish, or is recorded as a named, dated exception").
#
# Read by tools/domain_invariant_runner.py::gate, which background/process_run_complete.py runs on
# every completed run's book. An invariant with a BREACHED count that no exception below covers
# refuses the publish while `enforce: true`.
#
# Each exception needs every one of these, or it lifts nothing and the report names what it lacks:
#   invariant   the DOMAIN_INVARIANTS.yaml id
#   scope       which accounts, periods or terms it covers, in words a reader can check
#   reason      why the breach is explained rather than a defect still to find
#   filed       the date it was written
#   retired_by  the commit (or the named fix, until it lands) that will make it unnecessary
#   max_breached  optional: a ceiling; a count above it refuses again
#
# Seeded from the fresh 871f674a2a run's grade
# (docs/staging/SEAT_FINDING_THE_BLIND_INVARIANT_SUITE_ON_THE_67A893E749_BOOK_FINDS_PREPAYMENT_AT_THE_DD_CAP_A_JANUARY_STANDING_CHARGE_AND_METERS_THAT_CHANGE_REGISTERS_2026-10-26.md,
# section "Grade of the fresh 871f674a2a run"). Every ceiling is the count that run found: a defect
# that grows comes back as a refusal. "Partly diagnosed" means the reason covers the share stated and
# no more; the rest is an open defect, not an explanation.
enforce: true
exceptions:
  - invariant: INV_UNIT_RATE_SVT_ELEC
    scope: 41 accounts, 298 SVT term x cap-window pairs; single-register electricity; 177 of them are 13-window runs on 2016 accounts; 1.8-4.1% over the cap-window upper bound (median 2.1%)
    reason: >-
      The pre-registration predicted 0 from 58af1fe57 (prepayment priced at the prepayment cap) and
      that prediction is refuted. The excess is small and stays on a few accounts across many windows,
      which fits a term struck once and not re-struck at later cap windows, but that is a hypothesis
      this grade did not test.
    filed: 2026-10-27
    retired_by: an SVT rate reset at each cap window, diagnosed by tracing one of the 13-window accounts (SYN-2016-061)
    max_breached: 298
  - invariant: INV_UNIT_RATE_SVT_GAS
    scope: 38 accounts, 249 SVT term x cap-window pairs; gas; 160 of them in 2016; 1.0-4.9% over
    reason: >-
      Predicted 0 from 58af1fe57; refuted. Same shape as the electricity row and the same untested
      hypothesis.
    filed: 2026-10-27
    retired_by: the same SVT rate reset as INV_UNIT_RATE_SVT_ELEC
    max_breached: 249
  - invariant: INV_STANDING_CHARGE_SVT_ELEC
    scope: 290 accounts, 735 SVT bill periods; electricity; 0.02-0.8% over the ceiling (median 0.04%, at most 0.0017 GBP/day)
    reason: >-
      Predicted 0 from 00c082202; refuted, though the size fell from 2,986. Partly diagnosed: of 735,
      267 equal the previous cap window's ceiling and 154 the next window's, which is a period
      straddling a cap change billed at the neighbouring window's charge. The other 314 are not
      explained.
    filed: 2026-10-27
    retired_by: a standing charge taken at the period's own cap window, then a re-grade on the next fresh run
    max_breached: 735
  - invariant: INV_STANDING_CHARGE_SVT_GAS
    scope: 224 accounts, 1,502 SVT bill periods; gas, DD-only windows; 0.04-0.4% over (median 0.05%)
    reason: >-
      Predicted 0 from 00c082202; refuted, though the size fell from 4,226. Partly diagnosed: 534 equal
      the previous window's ceiling and 102 the next window's. The other 866 are not explained.
    filed: 2026-10-27
    retired_by: the same window-boundary fix as INV_STANDING_CHARGE_SVT_ELEC
    max_breached: 1502
  - invariant: INV_PPM_NOT_CREDIT_BILLED
    scope: account C6 only, 12 periods in 2016-2017; the SME leg, not a domestic account
    reason: >-
      Predicted by the pre-registration: one SME leg remains, 0 domestic. It is the leg the
      invariant's own carve-out does not cover.
    filed: 2026-10-27
    retired_by: a statement document type for the SME prepayment leg, or the invariant scoped to domestic accounts
    max_breached: 12
  - invariant: INV_PERIODS_CONTIGUOUS
    scope: 3 accounts (SYN-2016-561, OCC-371b33ca4bdf, PROS-2017-0336), 4 gaps of 32-91 days, all between Nov 2016 and Feb 2018
    reason: >-
      Not predicted; no landed commit addressed it. Each gap sits before the first bill of a later
      period, so it looks like a missing bill rather than a mis-dated one. Not traced.
    filed: 2026-10-27
    retired_by: tracing one of the three accounts' missing period
    max_breached: 4
