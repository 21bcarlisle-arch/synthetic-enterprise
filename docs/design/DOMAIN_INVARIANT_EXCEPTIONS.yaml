# The named, dated exceptions to DOMAIN_INVARIANTS.yaml (director ruling of 26 Oct, step 4:
# "A breach blocks the publish, or is recorded as a named, dated exception").
#
# Read by tools/domain_invariant_runner.py::gate, which background/process_run_complete.py runs on
# every completed run's book. An invariant with a BREACHED count that no exception below covers
# refuses the publish while `enforce: true`.
#
# Each exception needs every one of these, or it lifts nothing and the report names what it lacks:
#   invariant   the DOMAIN_INVARIANTS.yaml id
#   scope       which accounts, periods or terms it covers, in words a reader can check
#   reason      why the breach is explained rather than a defect still to find
#   filed       the date it was written
#   retired_by  the commit (or the named fix, until it lands) that will make it unnecessary
#   max_breached  optional: a ceiling; a count above it refuses again
#
# Seeded from the fresh 871f674a2a run's grade
# (docs/staging/SEAT_FINDING_THE_BLIND_INVARIANT_SUITE_ON_THE_67A893E749_BOOK_FINDS_PREPAYMENT_AT_THE_DD_CAP_A_JANUARY_STANDING_CHARGE_AND_METERS_THAT_CHANGE_REGISTERS_2026-10-26.md,
# section "Grade of the fresh 871f674a2a run"). Every ceiling is the count that run found: a defect
# that grows comes back as a refusal. "Partly diagnosed" means the reason covers the share stated and
# no more; the rest is an open defect, not an explanation.
#
# 2026-10-27: the two INV_STANDING_CHARGE_SVT_* exceptions are retired. Every one of their 2,237 breaches
# was the printed per-day rate of a period billed exactly at the cap and rounded to the penny. The
# invariants now carry a penny-per-period tolerance, and the same book grades 0 on both.
#
# 2026-10-27: the two INV_UNIT_RATE_SVT_* exceptions are retired. The fresh run at 2eeb3f0b32, which
# carries the company's clamp at the payment method's own column, grades 0 of 5,921 (elec) and
# 0 of 4,721 (gas), from 298 and 249. Grade beside
# docs/staging/records/SEAT_PREREGISTRATION_THE_FRESH_RUN_AT_2EEB3F0B3_CARRIES_THE_CLAMP_THE_OCCUPIER_CREDIT_UIG_AND_THE_SHARED_HUB_2026-10-27.md.
#
# 2026-10-28: INV_OVERDUE_WITHIN_BALANCE lowered from 1,987 to 4 and INV_STATUTE_BARRED_WRITE_OFF_AGE from 25
# to 3, on the fresh run at 1691ec0ecd carrying one due date for the desk and the ledger. Grade beside
# docs/staging/records/SEAT_PREREGISTRATION_ONE_DUE_DATE_FOR_THE_DESK_AND_THE_LEDGER_ON_A_FRESH_RUN_2026-10-27.md.
#
# 2026-10-27: the INV_RENEWAL_NOTICE_42_TO_49_DAYS exception (1,338) is retired. The run now sends the
# SLC 22C statement on day 42, and a fresh full run carrying it grades 0 of 1,170 domestic fixed
# terms owed one. The 2eeb3f0b3 book, graded by the same evaluator, still breaches 1,323 of 1,323.
# Grade beside docs/staging/records/SEAT_PREREGISTRATION_THE_SLC_22C_STATEMENT_ON_A_FRESH_RUN_2026-10-27.md.
enforce: true
exceptions:
  - invariant: INV_PPM_NOT_CREDIT_BILLED
    scope: account C6 only, 12 periods in 2016-2017; the SME leg, not a domestic account
    reason: >-
      Predicted by the pre-registration: one SME leg remains, 0 domestic. It is the leg the
      invariant's own carve-out does not cover.
    filed: 2026-10-27
    retired_by: a statement document type for the SME prepayment leg, or the invariant scoped to domestic accounts
    max_breached: 12
  # 2026-10-27: the two cold-read rows that gained evaluators graded 637 (MPAN) and 291 (EBSS) on
  # the 2eeb3f0b3 ledger. With one MPAN home and the whole credit on the invoice, the same run's
  # ledger, rebuilt, grades 0 and 12. The MPAN exception is retired. Causes per breach in
  # docs/staging/records/SEAT_PREREGISTRATION_THE_EIGHT_COLD_READ_ROWS_ON_THE_2EEB3F0B3_BOOK_2026-10-27.md.
  - invariant: INV_EBSS_CREDIT_EACH_MONTH_OCT22_MAR23
    scope: >-
      6 account-months on the 1691ec0ecd book rebuilt with the window share that counts credit-paid
      days. Three void on the 1st: OCC-bec72a04dec8 (2022-11), OCC-eb8498f3f8aa (2023-02),
      OCC-e3e94f81161b (2023-03). Three held on the 1st by the unnamed occupier's deemed account, the
      payer named later that month: OCC-25ff8966357a (2023-02), OCC-a1e9ae835e65 (2023-02),
      OCC-bec72a04dec8 (2023-02)
    reason: >-
      Rewritten 2026-10-28 for the 1691ec0ecd book, which carries the month credit this exception
      waited for (ff937d809e). The 2eeb3f0b3 reason ("no run has carried yet") is refuted, and the
      breach is not a run defect. Each account opened on a move-out
      (27 Oct, 17 Jan, 23 Feb) with a 21-day private-renter void, so the home was empty at 00:00 on
      the breached month's 1st. Annex C's vacant exception gives that month no credit
      (docs/market_research/energy_bills_support_scheme_delivery.md, "Vacant Properties"), and every
      later month is credited. The evaluator counts the month as on supply because the raw export
      carries no void window. The breach is the grader's.
      Widened 2026-10-28 (gas-leg re-measure): 2bef058eb stopped posting the deemed account's credit
      to the payer, which exposed a second grader's case. A month the unnamed occupier's deemed
      account held at 00:00 on the 1st is owed to that account (guidance 5.4), and the payer named
      later that month is owed nothing; the export carries no window, so the row counts it as the
      payer's. The other nine breaches on the same rebuild under 2bef058eb were a defect (a window
      month the credit paid read as share 0), fixed in bill assembly; a run before that fix grades 12.
    filed: 2026-10-28
    retired_by: the raw export carrying each account's void and occupier window, and the row exempting a month the payer did not hold on its 1st
    max_breached: 6
  # 2026-10-27: four cold-read rows read the company's own dated acts (`raw_account_export.account_events`).
  # Grade and causes beside the pre-registration,
  # docs/staging/records/SEAT_PREREGISTRATION_THE_SIX_COLD_READ_ROWS_ON_THE_2EEB3F0B3_BOOK_2026-10-27.md.
  - invariant: INV_OVERDUE_WITHIN_BALANCE
    scope: 4 of 7,380 collections-journey openings on the 1691ec0ecd book (second leg only), on PROS-2017-0336, PROS-2024-0010, PROS-2025-0106 and SYN-2016-582
    reason: >-
      The due-date split behind the 1,987 is fixed (one due date home, 9ad5af9a7). The four residuals
      are exactly the four accounts in the billing ledger's exception_queue, all nine of its rows. Each
      is a household label with an SME-sized load. The ledger holds those months' bills for VAT
      review and issues none, but the run posts them to the company's ledger and the desk dunns them.
      This is an open defect with a named cause: one bill, issued in one record and held in the other.
    filed: 2026-10-28
    retired_by: a bill the billing ledger holds for review is not posted as due to the company's ledger (or the hold reaches the desk), and a run carrying it
    max_breached: 4
  - invariant: INV_STATUTE_BARRED_WRITE_OFF_AGE
    scope: 3 of 64 statute-barred write-offs on the 1691ec0ecd book, on OCC-6e59dd8b63e8 (2025-05-06), SYN-2016-016 (2024-03-24) and SYN-2016-611 (2024-09-14)
    reason: >-
      The 25 early write-offs from the due-date split are gone (9ad5af9a7). Each of the three residual
      households carries two limitation write-offs. The first is dated six years after a payment that
      is not the household's last: a final bill paid or part-paid 1 to 16 days later (the other fuel
      leg's, for OCC-6e59dd8b63e8 and SYN-2016-016; the same leg's final bill, for SYN-2016-611) did
      not restart the bar for it. Not established: whether the desk's ledger lacks the post-close
      payment or bars per fuel leg, and whether limitation runs per fuel contract (if it does, two of
      the three are the grader's household reading being wrong). SYN-2016-611 is single-fuel, so it
      is a defect on either reading.
    filed: 2026-10-28
    retired_by: the desk's bar reading every payment on the account, final-bill settlements after close included, and a run carrying it
    max_breached: 3
