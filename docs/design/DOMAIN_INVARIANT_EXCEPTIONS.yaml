      docs/staging/records/SEAT_PREREGISTRATION_THE_PRINTED_REGISTER_FIX_GRADED_ON_A_FRESH_RUN_AT_37ABACDF42_2026-10-28.md.
    filed: 2026-10-28
    retired_by: the estimator's reference window traced against the row's on the 114 carried bills and the 39 the window fix set, then a fresh book
    max_breached: 153
  - invariant: INV_OPENING_IS_THE_PREVIOUS_CLOSING
    scope: 13 periods on 13 accounts of the 37abacdf42 book with their ledger rebuilt, every one the first single-rate bill after a time-of-use stretch (C7, PROS-2016-0067, PROS-2018-0223, SYN-2016-325, ...)
    reason: >-
      Diagnosed. A ToU bill exports its band registers' readings and not the total register's, so the
      total's last exported closing is from before the ToU stretch and the next single-rate opening
      differs from it by the stretch's use (C7: 8,253 kWh). The ledger's total index itself chains.
      E4's class (band and total indices), back_billing_and_liability.md §13 Limit 1.
    filed: 2026-10-28
    retired_by: E4, the ToU bill exporting the total register beside its bands
    max_breached: 13
  - invariant: INV_ESTIMATED_RUN_CONSISTENT_WITH_THE_METER
    scope: 13 of 4,311 runs of estimated bills on the 37abacdf42 book, on 12 accounts, 7 below the 1/3 line and 6 above 3
    reason: >-
      Partly diagnosed. The zero-advance fix holds: none of the 13 is a zero run. Printing the
      meter's register exposed runs the printed register hid. 8 runs follow a single actual read,
      usually an occupier's short first month (OCC-f6813bf9f05eg gas: 138 kWh in Oct 2016, then
