# ===========================================================================
# THE FUTURES GO ON THE MAP -- E2..E5 commitment sets
# Minted 2026-08-08 (worker tick) from DIRECTOR_RULING_FUTURE_COMMITMENT_SETS_
# 2026-08-08 §1. The ruling's diagnosis, re-measured on this file before
# writing: 206 atoms, lane weights 82 harness vs 7 commercial, and no atom
# whose id touches CLV, a named counterparty adapter, or a forecast feed.
# Discovery reaches forward daily and had nowhere to file it -- "not blindness;
# homelessness". These atoms are the addresses.
#
# THREE FILING DECISIONS, all departures from the ruling's literal wording, all
# recorded here rather than made silently (the ruling's see-and-correct clause
# excludes the GATES, so each is reported to the director rather than settled):
#
# 1. THE E2 GATE THE RULING NAMES IS ALREADY SATISFIED. The ruling puts Epoch-2
#    "behind the ruled EVIDENCE_PASS" -- but that pass was DELIVERED on
#    2026-07-09 (`docs/design/EPOCH2_EVIDENCE.md`, 6 verdicts;
#    `docs/staging/done/EPOCH2_EVIDENCE_PASS.md` archived; recorded in
#    phase-history and PROJECT_OVERVIEW). Writing a satisfied gate into a block
#    field would manufacture a permanent phantom gate -- precisely the
#    abolished-block stale-cell class that has already cost this project weeks.
#
# 2. NO ATOM HERE CARRIES `blocked_on`; ALL TWENTY ARE `loop_stage: idle`.
#    Three findings forced this, each measured rather than assumed:
#    (a) the ruling's own §3 wording is self-defeating as a block. Fed to the
#        live predicate, `supervisor._names_abolished_permission_block("the
#        director opens the epoch")` returns True (the `director opens` token),
#        so `_is_externally_blocked` would IGNORE it and drop 15 unbuildable
#        future atoms straight into the BUILD queue.
#    (b) a releaser-token block cannot be expressed at all:
#        `test_maturity_map_contract.py::check_edges` requires `blocked_on` to
#        be a LIST OF EXISTING ATOM IDS, and an epoch gate is not an atom. The
#        two contracts are mutually satisfiable only for dependency blocks.
#    (c) `idle` is this map's established and doctrine-sanctioned way to say
#        "future epoch": ZERO of the 206 pre-existing atoms carry a `blocked_on`
#        and all 9 epoch-4/5 atoms are already idle, while CLAUDE.md's
#        epoch-gating rule states outright that an idle atom is parked FOR BUILD
#        ONLY and remains DISCOVER/FRAME-workable now.
#    `idle` delivers every operative property the ruling asked for: invisible to
#    the BUILD draw (proven -- the concurrent draw is byte-identical before and
#    after, bar this mint's own three machinery atoms), visible to the staleness
#    clocks (proven -- map_assertion_provenance went 205 -> 229 cells), and open
#    to forward discovery (§2). What it does NOT give is a mechanical stop at
#    the director; that is FUT2's job, where the ruling put it, and where it can
#    actually be R15-tested. The epoch gate is stated in `block_reason` on every
#    E3-E5 atom and reads as R13 CURRICULUM authorship -- which is why it
#    survives the 2026-07-29 permission rip-out, and how it must stay worded.
#
# 3. THE PREFIX IS `EP`, NOT `E`. `E` is lane-E (finance/treasury) and
#    E2_revenue_reconciliation, E3_accrual_restatement,
#    E4_supplier_reporting_standard and E5_carbon_three_ledger are real atoms in
#    it -- the first draft collided with all four and the id-grammar contract
#    caught it ("renumber, do NOT extend the allowlist").
# ===========================================================================

