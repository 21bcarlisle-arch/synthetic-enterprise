append_simplification:
  - 'CLASS INSTANCE CLOSED (2026-07-29, DIRECTOR_RULING_FIX_DOUBLE_MESSAGING, R10): a new
    fail-SILENT operational fault in this atom''s own file_scope, same family as the broken
    pull loop. CAUSE (observed, not inferred): ntfy-responder and staging-watcher each ran
    TWICE -- an installed+enabled+ACTIVE systemd unit AND start_worker.sh''s tmux launch,
    because their cutover installed the unit but never flipped `launched_by: systemd`. The
    responder log shows ONE ntfy message id (AK0UhbkAV2Ko) acked twice 11s apart and staged
    as two from_rich files, so one director instruction became two queued acts. The
    reconciler reported OK throughout: `running = unit_active or tmux_present` answers "is
    it up?" and is blind to HOW MANY launchers are up -- one and two read identically.
    FIX: (a) DOUBLE_LAUNCH status + alarm when both launchers are live -- counting launchers
    is a different question from liveness, so it gets its own status; (b) both live readers
    widened, since `_live_unit_states` only queried migrated units and `_live_tmux_running`
    only scanned un-migrated ones, so a half-migrated daemon was invisible to both (an unread
    source cannot alarm); (c) `_live_tmux_running` made PID-aware against the unit''s MainPID
    -- the first cut used a `match in ps_out` substring scan, so every migrated daemon matched
    its OWN systemd command line and DOUBLE_LAUNCH false-positived on all five healthy
    daemons. That false positive was caught by LIVE verification, not by the suite (the tests
    inject tmux_running directly), and is now pinned by its own regression test: a control
    that fires on healthy input is worse than none. R15 both ways, 4 mutations run and
    confirmed to fire. Live after fix: DOUBLE_LAUNCH none, alarms none.
    REGISTERED, NOT FIXED (queued per SELF_INTERRUPT_DISCIPLINE, one-at-a-time cutover is
    director-ruled 2026-07-17): SEVEN daemons -- background-worker, dispatcher,
    discovery-daemon, sim-runner, sanity-daemon, naive-organ, token-proxy -- still have
    systemd units `enabled` at boot while remaining in start_worker.sh''s tmux launch set.
    They are single-launcher only because those units happen to be inactive; each will
    DOUBLE at the next boot. The new alarm now makes that loud instead of silent.'
