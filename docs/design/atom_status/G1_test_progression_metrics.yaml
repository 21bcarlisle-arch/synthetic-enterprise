append_simplification:
  - "2026-07-29 HARDEN (R15, CLASS audit of the guard landed hours earlier the same day):
    the commits-retention guard was correct and mutation-proven, but it was keyed to 2 of the
    6 monotonic metrics `generate()` publishes -- an instance fix wearing a class fix's clothes.
    `generate()` swallows the PROJECT_OVERVIEW.md read exception and falls back to `text = \"\"`,
    so ONE unreadable or mid-write-truncated source file (CLAUDE.md documents concurrent writers
    on this tree) publishes total_phases 519->0, test_progression 17,214->[], phase_dates 468->0
    and timeline->[] to the live Project page -- while `commits_source` still reads \"measured\"
    and the publish reports success. Observed directly by driving the real generate() with a
    non-existent PROJECT_OVERVIEW, not inferred. Same two R15 killer patterns as the commits half
    -- FAIL-SILENT (unavailable source reported as a clean publish) and FAIL-OPEN (empty passing
    through metrics whose entire declared property is monotonic growth) -- reached through a
    DIFFERENT source, on four MORE metrics, one of them (test_progression) the very series whose
    16,358->221 collapse the director reported. Closed at the class, not the instance: a
    declarative `_GROWTH_METRICS` registry + one shared `_retained_value` primitive (the commits
    pair is now a caller of it rather than a second, driftable mechanism), holding any registered
    metric at its last PUBLISHED value when a fresh measurement is missing or has gone backwards,
    plus a `metrics_source` map labelling every metric measured/retained_previous/unavailable so
    no surface can present a retained figure as fresh. Companion fields derived from the same
    read (start_date, cumulative_tests_executed_since) are retained with their metric so the
    payload cannot self-contradict. Zero is treated as unmeasurable rather than as a measurement
    of nothing (consistent with the empty list, and true of every metric here), closing the
    first-ever-run case that would otherwise publish 0 labelled \"measured\". Four mutation tests
    run and OBSERVED to fail on their own named defect: sweep disarmed -> 5 failures; naive
    `is not None` -> 3; companion retention dropped -> 2; a metric left out of the registry -> 2,
    including `test_every_published_growth_metric_is_registered`, which asserts the registry
    against the REAL published keyset and is what makes this closure rather than a treadmill --
    a cumulative metric added later and left unguarded fails automatically. 58 tests in
    tests/tools/test_generate_phases_json.py (52 -> 58); live payload re-generated unchanged in
    substance, every metric labelled \"measured\" on the honest path (the guard is not a freeze).
    Rest with proof: both halves of this atom's guarantee, and now the class around them, are
    R15-proven -- a future draw should read this as a completed pass, not repeat it.
    KNOWN FOLLOW-ON (queued, not fixed on sight -- SITE lane, outside this atom's file_scope;
    raised by the epistemic verifier on this diff, which returned PASS): `metrics_source` and
    `commits_source` are published in phases.json but not READ by site/project/index.html, so a
    retained figure is machine-labelled yet renders indistinguishably from a fresh one. The
    fetchable payload carries the truth; the pixel does not. R11/R14-flavoured surface-honesty
    gap for a SITE-lane atom."
