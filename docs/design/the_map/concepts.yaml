# The map's concept register: the small, curated input. Everything else on the map is generated
# from it by tools/the_map.py (director steers of 24 Oct: "Do that", and "Yes" to borrowing SKOS's
# field names and one computable definition per measure). Design: the stretch log, 24 Oct.
#
# A field is filled only where a check or a reader uses it:
#   prefLabel, altLabel   -- the names. altLabel is what the two-names check and the module search
#                            read; one term on two concepts is a finding.
#   definition            -- one line, in the industry's own terms.
#   match                 -- the outside scheme the concept is taken from (licence condition, Bacs,
#                            BSC, or a named engineering source). A concept with no match is flagged.
#   placed                -- spine/step placements. SKOS's broader, read from the step.
#   page                  -- the published knowledge page (site/knowledge/<id>). Notes attach to it
#                            through their own `**Knowledge:** <id>` line or the page's citations.
#   world, wall, supplier -- the declared ONE home per layer, as dotted module names. Every other
#                            module whose name or first sentence carries one of the concept's names is
#                            generated as "also named here": a second home or a missing declaration.
#   machinery             -- (top level) [{prefix, reason}]: modules ruled plumbing, so the coverage
#                            count does not ask them for a concept. Empty until someone rules.
#   gap                   -- a layer that is empty on purpose, with the reason.
#   relations             -- ours, not SKOS: feeds, depends_on, graded_by, causes.
#   measure               -- a measure's one definition: what it counts, over whom, and the code.
#   kind: belief          -- a supplier forecast it decides on: built_from, decides, graded_by.
# For How it's built the four layers are practice (match), rule (canon id, whose enforcing code is
# read from docs/design/canon_mechanisms.yaml, not repeated here), enforced_by, and evidence (a
# figure computed by a named function in tools/the_map.py).

spines:
  world: {prefLabel: "The world", steps: [Weather, Demand, Generation and merit order, Wholesale price, Settlement, Who lives where, Home physics, Households, Choices]}
  supplier: {prefLabel: "The supplier's value chain", steps: [Acquire, Switch, Meter, Bill, Collect, Settle, Hedge, Renew or lose, Move, Advise, Optimise]}
  company: {prefLabel: "Running the company", steps: [Accounts, Capital, Trading risk, Regulation, Vulnerability, Complaints]}
  build: {prefLabel: "How it's built", steps: [Testing and controls, Delivery and CI, Agents and models, Data and lineage, Security, Observability]}

concepts:
  - id: collect.mandate
    prefLabel: Direct debit mandate
    altLabel: [dd mandate, direct debit instruction, AUDDIS]
    definition: The customer's instruction letting the supplier collect from their bank, which the customer can cancel at any time.
    match: ["Bacs Direct Debit scheme: Direct Debit Instruction"]
    placed: [supplier/Collect]
    page: payments-and-direct-debit
    world: [simulation.bacs_rails]
    supplier: [company.billing.direct_debit]
    gap: {wall: "a cancelled mandate is not an observable the seam carries"}
    relations: {feeds: [collect.collection]}

  - id: collect.amount
    prefLabel: Setting the direct debit amount
    altLabel: [dd review, direct debit review, dd amount, payment adequacy]
    definition: A fixed direct debit rests on the best current information and is reviewed when new information would change it materially.
    match: ["SLC 27.15 (Ofgem decision 26 Aug 2022)"]
    placed: [supplier/Collect]
    page: payments-and-direct-debit
    world: [simulation.dd_review_in_loop]
    wall: [company.interfaces.dd_review_outcome]
    supplier: [company.billing.dd_review]
    relations: {depends_on: [collect.consumption_forecast], causes: [collect.arrears]}

  - id: collect.collection
    prefLabel: Collection and its failure
    altLabel: [dd collection, payment collection, failed payment, ARUDD, ADDACS, dd failure, bacs return]
    definition: The supplier presents the debit on the agreed day; the bank pays it or returns it with a reason code.
    match: ["Bacs: ARUDD and ADDACS reason codes"]
    placed: [supplier/Collect]
    page: payments-and-direct-debit
    world: [simulation.world_payment_truth]
    wall: [company.interfaces.dd_collection_instructions]
    supplier: [company.billing.dd_collections_desk]
    relations: {causes: [collect.arrears], graded_by: [collect.dd_failure_rate]}

  - id: collect.arrears
    prefLabel: Arrears and collections
    altLabel: [arrears, debt collection, collections journey, debt referral]
    definition: Money owed past its due date, and the steps from reminder to payment plan to referral.
    match: ["SLC 27 and 28B; Ofgem debt and arrears indicators"]
    placed: [supplier/Collect, company/Vulnerability]
    page: debt-and-collections
    world: [simulation.arrears_engine]
    wall: [company.interfaces.collections_communication]
    supplier: [company.billing.collections_journey]
    relations: {feeds: [collect.payment_method]}

  - id: collect.payment_method
    prefLabel: Payment method and prepayment
    altLabel: [payment method, prepayment, ppm, pay as you go]
    definition: How a household pays; moving someone to prepayment for debt is tightly restricted.
    match: ["SLC 28B; Ofgem involuntary prepayment rules (2023)"]
    placed: [supplier/Collect]
    page: debt-and-collections
    world: [simulation.payment_method_dynamics]
    supplier: [company.billing.payment_method_register]
    gap: {wall: "a change of method is not an observable the seam carries"}

  - id: collect.cash_forecast
    kind: belief
    prefLabel: Forward cash forecast per customer
    altLabel: [cash forecast, cash flow forecast]
    definition: What the supplier expects each account to pay, and when, over the months ahead.
    match: ["Canon: payment, credit risk and forward cash forecasting"]
    placed: [supplier/Collect, company/Capital]
    supplier: [company.finance.cash_forecast_provision]
    built_from: "bills, payments and returns, payment method, the account's record"
    decides: "provision, payment plans, early warnings"
    gap: {graded_by: "no grade against the world's hidden payments yet"}

  - id: collect.consumption_forecast
    kind: belief
    prefLabel: Consumption forecast per property
    altLabel: [consumption forecast, annual consumption estimate, load forecast]
    definition: What one property will use over the next year, from its reads, registered consumption and the weather.
    match: ["SLC 27.15 best current information; MRA/REC estimated annual consumption"]
    placed: [supplier/Collect, supplier/Bill, supplier/Hedge]
    supplier: [company.billing.consumption_forecast]
    built_from: "reads, registered consumption, weather"
    decides: "direct debit amount, unbilled estimate, purchasing, CLV"
    gap: {graded_by: "no grade against the world's true consumption yet"}

  - id: collect.cant_pay_wont_pay
    kind: belief
    prefLabel: Can't pay versus won't pay
    altLabel: [affordability, ability to pay, cant pay]
    definition: Whether an account in arrears lacks the means to pay or the will to, which decides support or enforcement.
    match: ["SLC 27.5 and 28B ability to pay; Ofgem Consumer Standards 2023"]
    placed: [supplier/Collect, company/Vulnerability]
    supplier: [company.crm.affordability_inference]
    built_from: "payment history, contact record, declared circumstances"
    decides: "payment plan level, support referral, collections tone"
    gap: {graded_by: "no grade against the world's hidden finances yet"}

  - id: collect.dd_failure_rate
    kind: measure
    prefLabel: Direct debit failure rate
    altLabel: [dd failure rate, failure rate]
    definition: The share of presented direct debit collections that the bank returns unpaid.
    match: ["Bacs: ARUDD returns over presentations"]
    placed: [supplier/Collect]
    page: debt-and-collections
    measure: {counts: "collections returned unpaid", over: "collections presented in the period", computed_by: null}
    gap: {computed_by: "no function is named as its one definition yet"}

  - id: switch.loss_notice
    prefLabel: Loss notice
    altLabel: [invitation to intervene, secured inactive, registration loss, change of supplier notice]
    definition: The losing supplier is told a meter point is being registered away, first while the switch can still be stopped and then when it cannot.
    match: ["REC Schedule 23 Registration Services, paras 7.1.9 and 13.4"]
    placed: [supplier/Switch]
    page: switching-mechanics
    world: [simulation.registration_loss_feed]
    wall: [company.interfaces.supply_book]
    supplier: [company.crm.cos_process]
    relations: {feeds: [switch.save, switch.debt_objection]}

  - id: switch.debt_objection
    prefLabel: Debt objection
    altLabel: [objection, transfer blocking, debt block]
    definition: The losing supplier may stop a domestic credit customer's switch for charges outstanding more than 28 days after it asked for them.
    match: ["SLC 14.4(a); Ofgem decision on domestic objections (Jul 2016)"]
    placed: [supplier/Switch, supplier/Collect]
    page: switching-mechanics
    world: [simulation.debt_objection]
    gap: {wall: "the company raises no objection of its own; the world draws industry practice (EP12)", supplier: "the company raises no objection of its own; the world draws industry practice (EP12)"}
    relations: {depends_on: [collect.arrears]}

  - id: switch.save
    prefLabel: Save offer on a loss notice
    altLabel: [save offer, retention tariff, win-back]
    definition: An offer to a household that has asked to leave; it keeps the household only if the household cancels with the new supplier.
    match: ["SLC 22B retention derogation; REC R0287 (Feb 2026)"]
    placed: [supplier/Switch, supplier/Renew or lose]
    page: switching-mechanics
    world: [simulation.save_on_loss_notice]
    wall: [company.interfaces.save_offer]
    supplier: [company.crm.save_offer]

  - id: switch.erroneous_transfer
    prefLabel: Erroneous transfer
    altLabel: [erroneous switch, mistaken switch]
    definition: A switch of the wrong meter point or a customer who never agreed, returned to the old supplier with £30 compensation.
    match: ["SLC 14; Ofgem erroneous transfers paper (2016); GSoP (2020)"]
    placed: [supplier/Switch]
    page: switching-mechanics
    gap: {world: "the world has no failed or erroneous switch (registration_loss_seam GAPS)", wall: "no failed switch crosses the seam", supplier: "nothing to handle while the world sends none"}

  - id: capital.mcr
    prefLabel: Minimum capital requirement
    altLabel: [capital target, capital floor, adjusted net assets, mcr]
    definition: A domestic supplier holds at least zero, and aims for £115, of adjusted net assets per dual-fuel customer, from 31 March 2025.
    match: ["SLC 4B; Ofgem financial resilience decision (26 Jul 2023)"]
    placed: [company/Capital]
    page: suppliers-accounts-and-capital
    supplier: [saas.growth_mandate]
    gap: {world: "capital is the company's own; the world holds no rule for it", wall: "nothing crosses: the company reads its own balance sheet"}

  - id: capital.ccb_coverage
    prefLabel: Credit balance cash coverage
    altLabel: [cash coverage trigger, customer credit balances, ringfencing]
    definition: Ofgem may ringfence customers' credit balances when a supplier's cash falls below 20% of its gross fixed direct debit credit balances.
    match: ["Ofgem financial resilience decision (26 Jul 2023): Cash Coverage Trigger"]
    placed: [company/Capital, supplier/Collect]
    page: suppliers-accounts-and-capital
    gap: {world: "a direction is the regulator's; the world issues none", wall: "nothing crosses: cash and balances are the company's own", supplier: "no module computes cash against fixed-DD credit balances"}

  - id: accounts.segmental_statement
    prefLabel: Consolidated Segmental Statement
    altLabel: [segmental statement, segment profitability, supply ebit]
    definition: An audited statement separating supply from other activities down to EBIT, reconciled to the statutory accounts.
    match: ["SLC 19A; Ofgem CSS modification (Sep 2025)"]
    placed: [company/Accounts]
    page: suppliers-accounts-and-capital
    supplier: [company.finance.segment_profitability]
    gap: {world: "an accounting statement has no world rule", wall: "nothing crosses: the company's own ledgers"}

  - id: world.driver_mileage
    prefLabel: Annual mileage per driver
    altLabel: [annual mileage, miles driven, car miles per year]
    definition: The miles a household's car is driven in a year, skewed and set by who drives it rather than by its fuel.
    match: ["DfT National Travel Survey NTS0901, NTS0904"]
    placed: [world/Households]
    page: who-drives-how-far-and-where-they-park
    world: [simulation.premise_trace]
    gap: {wall: "mileage never crosses; a supplier can only ask, or bound it from charging kWh", supplier: "no module estimates a customer's mileage"}

  - id: world.offstreet_parking
    prefLabel: Off-street parking
    altLabel: [driveway, has_driveway, home charging access]
    definition: Whether a home's car can be parked, and so charged, on the home's own land overnight.
    match: ["DfT National Travel Survey NTS0908; DfT EV driver tracker"]
    placed: [world/Home physics, world/Households]
    page: who-drives-how-far-and-where-they-park
    world: [simulation.household]
    gap: {wall: "nothing crosses; a supplier asks or reads weak address signals", supplier: "no module holds a customer's parking"}

  - id: world.vehicle_energy_per_mile
    prefLabel: Vehicle energy per mile
    altLabel: [ev efficiency, wh per mile, miles per kwh, real-world fuel economy]
    definition: The energy a car uses per mile on the road, set by its model and the day's temperature, plus what is lost charging it.
    match: ["EV Database real-world consumption; ADAC charging-loss tests; ICCT Lab-to-Road"]
    placed: [world/Households]
    page: which-cars-households-run-and-what-they-use
    world: [simulation.premise_trace]
    gap: {wall: "nothing crosses unless the customer shares car data", supplier: "no module holds a car's efficiency"}

  - id: world.phev_electric_share
    prefLabel: Plug-in hybrid electric share
    altLabel: [utility factor, phev electric miles]
    definition: The share of a plug-in hybrid's miles or energy that is electric, set by how often its owner charges it.
    match: ["ICCT/Fraunhofer real-world PHEV use (2022); EU OBFCM (2025)"]
    placed: [world/Households]
    page: which-cars-households-run-and-what-they-use
    gap: {world: "the world has no plug-in hybrid; an EV is one flag", wall: "nothing crosses", supplier: "nothing to infer while the world draws none"}

  - id: world.ev_home_charging
    prefLabel: Home EV charging
    altLabel: [ev charging load, ev annual kwh, charging session, plug-in]
    definition: The electricity a household's car draws through the home meter, set by its miles, its efficiency and how often and when it is plugged in.
    match: ["Electric Nation trial (WPD); DfT EV driver tracker"]
    placed: [world/Households, supplier/Meter]
    page: ev-charging-and-the-saving-against-petrol-and-diesel
    world: [simulation.premise_trace]
    supplier: [company.crm.property_model]
    gap: {wall: "only the metered half-hourly total crosses; the car's own load is not separated"}

  - id: advise.ev_fuel_saving
    prefLabel: EV fuel saving
    altLabel: [ev saving vs petrol, pence per mile, fuel counterfactual]
    definition: What a household's electric miles cost against the same miles in its previous petrol or diesel car at that week's pump price.
    match: ["AA pence-per-mile; DESNZ GHG conversion factors 2026"]
    placed: [supplier/Advise]
    page: ev-charging-and-the-saving-against-petrol-and-diesel
    gap: {world: "no household holds a petrol or diesel car to compare against", wall: "mileage and the previous car never cross; the supplier must ask", supplier: "no module computes it"}

  - id: home.boiler_in_use_efficiency
    prefLabel: Boiler in-use efficiency
    altLabel: [seasonal boiler efficiency, condensing efficiency, sedbuk, erp efficiency]
    definition: The share of a gas boiler's fuel delivered as useful heat over a season in a real home, which falls as the return water temperature rises above about 55°C.
    match: ["BRE S10TP-12 (SAP 10 seasonal efficiency); GASTEC for EST in-situ condensing boiler trial (2009)"]
    placed: [world/Home physics]
    page: gas-boilers-and-heating-controls
    world: [simulation.fabric_physics]
    supplier: [company.pricing.thermal_inference]
    gap: {wall: "nothing crosses: the supplier sees only metered gas and must ask for the boiler's model and age"}

  - id: home.flow_temperature
    prefLabel: Boiler flow temperature
    altLabel: [flow temp, boiler flow setting, weather compensation]
    definition: The temperature a boiler sends water out to the radiators at, set on the boiler; below about 55°C return it condenses.
    match: ["Nesta Money Saving Boiler Challenge evidence (Oct 2022); BEIS Boiler Plus (Apr 2018)"]
    placed: [world/Home physics, supplier/Advise]
    page: gas-boilers-and-heating-controls
    gap: {world: "no home holds a flow temperature; boiler efficiency is fixed by age", wall: "not inferable from meter data; must be asked", supplier: "the advice is named in the offer book's comments and blocked on a source"}

  - id: home.heating_setpoint_and_schedule
    prefLabel: Heating setpoint and schedule
    altLabel: [thermostat setting, setpoint, heating schedule, heating hours, setback]
    definition: The temperature a household sets its thermostat to and the periods it heats in, which with the building set the temperature it actually lives at.
    match: ["EFUS 2017 heating patterns and occupancy (BEIS)"]
    placed: [world/Households, world/Home physics]
    page: heating-behaviour-comfort-and-health-floors
    world: [simulation.fabric_physics]
    gap: {wall: "only weakly inferable from the half-hourly gas shape; must be asked or read from a connected thermostat", supplier: "nothing in the company estimates a household's setpoint or schedule"}

  - id: advise.health_floor
    prefLabel: Health floor on heating advice
    altLabel: [minimum indoor temperature, cold home threshold, 18c floor]
    definition: The indoor temperature below which no advice may push a home; 18°C for a living room, higher for the old and ill, with any room-hour below 16°C flagged.
    match: ["WHO Housing and Health Guidelines (2018); PHE minimum home temperature thresholds (2014); NICE NG6"]
    placed: [supplier/Advise, company/Vulnerability]
    page: heating-behaviour-comfort-and-health-floors
    supplier: [company.pricing.fabric_intervention]
    gap: {world: "a health floor is a rule on advice, not a property of the world; the world produces the temperatures it is checked against", wall: "nothing crosses: the floor is the company's own rule"}

  - id: home.heat_pump_spf
    prefLabel: Heat pump seasonal performance factor
    altLabel: [spf, scop, heat pump efficiency, coefficient of performance]
    definition: The heat a heat pump delivers over a year divided by the electricity it uses, at a stated boundary; median 2.80 for air-source in the Electrification of Heat trial.
    match: ["Energy Systems Catapult, Electrification of Heat demonstration (2023); DECC RHPP final report (2016)"]
    placed: [world/Home physics]
    page: heat-pumps-and-fabric-measures
    world: [simulation.fabric_physics]
    supplier: [company.pricing.thermal_inference]
    gap: {wall: "only measurable with a heat meter or an assumed heat demand; the supplier sees the electricity"}

  - id: home.measured_insulation_saving
    prefLabel: Measured insulation saving
    altLabel: [need saving, insulation saving]
    definition: The median weather-corrected fall in a home's gas after an insulation measure, against a comparison group without one, as NEED reports it.
    match: ["DESNZ National Energy Efficiency Data-Framework (NEED) reports 2018-2026"]
    placed: [supplier/Advise]
    page: heat-pumps-and-fabric-measures
    supplier: [company.pricing.fabric_intervention]
    gap: {world: "the world's insulation changes the fabric; the measured saving is an output to grade it against", wall: "the supplier sees gas before and after and must build its own comparison group"}

  - id: asset.pv_self_consumption
    prefLabel: Solar self-consumption
    altLabel: [self-use factor, self-consumption, solar self-use]
    definition: The share of a home's solar generation used on site rather than exported, by month; SAP gives it as exp(-C1(C2 E/D)^C3) with coefficients that move with usable battery kWh.
    match: ["BRE S10TP-07, SAP 10.2 PV self-use factor"]
    placed: [world/Home physics, supplier/Advise]
    page: solar-pv-and-home-batteries
    world: [simulation.demand_model]
    supplier: [company.regulatory.seg_export_estimator]
    gap: {wall: "net import crosses; generation and self-use do not unless the household shares inverter data"}

  - id: asset.battery_operating_mode
    prefLabel: Home battery operating mode
    altLabel: [battery mode, reserve floor, battery schedule, grid charging]
    definition: How a home battery is set to run - self-consumption, timed grid charge to a target state of charge, timed export, and a reserve floor - which decides most of what it earns.
    match: ["manufacturer controls (GivEnergy, Tesla Powerwall 3); Octopus Flux and Intelligent Flux terms"]
    placed: [world/Choices, supplier/Optimise]
    page: solar-pv-and-home-batteries
    world: [simulation.run_phase2b]
    gap: {wall: "settings never cross; the supplier must ask or read an inverter API with consent", supplier: "the company holds no battery settings"}

  - id: asset.pv_array_orientation
    prefLabel: Solar array orientation and tilt
    altLabel: [azimuth, roof aspect, panel tilt, roof pitch]
    definition: The compass direction and slope of a roof plane carrying panels; with location it sets the share of the best possible yield an array can reach.
    match: ["PVGIS (EU JRC); MCS irradiance zone tables"]
    placed: [world/Home physics]
    page: pv-roofs-orientation-and-yield
    world: [simulation.household]
    gap: {wall: "orientation never crosses; the supplier asks, or infers it from generation data", supplier: "the company holds no orientation"}

  - id: asset.pv_specific_yield
    prefLabel: Solar specific yield
    altLabel: [kWh per kWp, solar load factor, yield per kWp]
    definition: Annual generation per kilowatt of installed panel; DESNZ publishes the Feed-in Tariff fleet's median as a load factor each year.
    match: ["DESNZ Feed-in Tariff load factor analysis"]
    placed: [world/Home physics, world/Weather]
    page: pv-roofs-orientation-and-yield
    world: [simulation.demand_model]
    supplier: [company.regulatory.seg_export_estimator]
    gap: {wall: "generation crosses only through a FiT generation meter or consented inverter data"}

  - id: network.connect_and_notify
    prefLabel: Connect and notify
    altLabel: [notify or apply, apply to connect, ENA connection form, G98 notification]
    definition: The route by which an installer may fit one EV charger, heat pump or small generator and tell the DNO within 28 days, open only when the home's supply passes the ENA form's conditions.
    match: ["ENA EV charge point and heat pump form v3.3; EREC G98, G99, G100"]
    placed: [world/Choices, supplier/Advise]
    page: network-limits-on-home-electrification
    gap: {world: "no connection step: every device installs instantly", wall: "an installer's notification goes to the DNO, not the supplier", supplier: "no module plans install lead time or conversion loss"}

  - id: network.looped_service
    prefLabel: Looped service
    altLabel: [looped supply, shared service cable, unlooping]
    definition: One service cable feeding two or more homes through a shared cut-out; it rules out connect and notify, and covers about 3.9 million GB homes.
    match: ["DESNZ Unlooping electricity network connections (Jan 2026)"]
    placed: [world/Home physics]
    page: network-limits-on-home-electrification
    gap: {world: "no home carries a looped flag", wall: "invisible to a supplier until a survey finds it", supplier: "none"}

  - id: network.cut_out_rating
    prefLabel: Cut-out rating and supply phase
    altLabel: [main fuse rating, cut-out fuse, fuse upgrade, three-phase supply]
    definition: The amp rating of the DNO's main fuse at the home (typically 60-100 A) and whether the supply is single- or three-phase; together they bound what can be added before an application.
    match: ["ENA form v3.3 (13.8 kVA / 60 A per phase)"]
    placed: [world/Home physics]
    page: network-limits-on-home-electrification
    gap: {world: "no home carries a cut-out rating or phase; a 22 kW charger is drawn regardless", wall: "not visible to a supplier", supplier: "none"}

  - id: optimise.third_party_flex
    prefLabel: Third-party flexibility capture
    altLabel: [virtual trading party, virtual lead party, vtp, deviation volume, supplier compensation]
    definition: An independent party trades or balances a supplier's customer's demand turn-down or turn-up, and the supplier is compensated for the resulting deviation at a reference price funded by all suppliers by market share.
    match: ["BSC P415 (live 7 Nov 2024); Supplier Compensation Reference Price Methodology v2.0; P444; P510 and P511"]
    placed: [supplier/Optimise, supplier/Settle]
    page: vpps-and-local-flexibility
    gap: {world: "no rival aggregator agent exists; no MSID is ever claimed by another party", wall: "no compensation or deviation volume crosses", supplier: "nothing books compensation or the mutualisation levy"}

  - id: optimise.dno_flexibility
    prefLabel: Local network flexibility
    altLabel: [dno flexibility, dso flexibility, flexibility zone, peak reduction, scheduled utilisation]
    definition: A distribution network buys demand turn-down or turn-up in named zones through standard products, paying availability per MW per hour and utilisation per MWh, settled per minute with a performance multiplier.
    match: ["ENA Open Networks standard products; Elexon Flexibility Market Rules FMR-VSM (30 Jan 2026) and FMR-SBM; DNO SLC31E reports"]
    placed: [supplier/Optimise]
    page: vpps-and-local-flexibility
    gap: {world: "no network zone map, call or local price exists", wall: "nothing crosses", supplier: "company.market.dso_flexibility_tender_register exists and has no caller"}

  - id: optimise.demand_flexibility_event
    prefLabel: Demand flexibility event
    altLabel: [demand flexibility service, dfs, saving session, turn-down event]
    definition: A called window in which a household is paid to use less (or more) than a baseline of its own recent similar days, with payment on delivered kWh.
    match: ["NESO Demand Flexibility Service terms (2022/23-2024/25); BSC P376 baselining"]
    placed: [supplier/Optimise, world/Choices]
    page: household-flexibility-and-the-advice-roadmap
    world: [sim.flex_dispatch]
    supplier: [company.market.flexibility_revenue_book]
    gap: {wall: "no event notice or delivered-volume settlement crosses the seam; the world dispatches and books its own events", graded_by: "no opt-in, notice, fatigue or baseline error is modelled; the world's baseline is the enrolled volume"}

  - id: optimise.wholesale_shaping
    prefLabel: Wholesale shaping under half-hourly settlement
    altLabel: [load shifting value, smart charging value, tariff-embedded shifting]
    definition: The fall in a supplier's own purchase cost when its customers' settled half-hourly demand moves from expensive to cheap periods.
    match: ["Ofgem MHHS decision (benefits £1.6-4.5bn to 2045); Elexon half-hourly settlement"]
    placed: [supplier/Optimise, supplier/Hedge]
    page: household-flexibility-and-the-advice-roadmap
    gap: {world: "households do not shift load in response to a price signal beyond the time-of-use peak window", wall: "half-hourly reads cross, but no shifting instruction goes back", supplier: "no module values a household's shifted kWh against the company's half-hourly costs", graded_by: "nothing yet"}

  - id: advise.measured_saving
    kind: measure
