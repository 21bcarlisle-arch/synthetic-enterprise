# THE CLAIM REGISTER — each canon claim bound to a predicate over the code.
#
# Read by `tools/canon_drift_check.py`. Atom A45_the_canon_is_a_standing_subject, from the
# director's 2026-08-28 guidance: "Every orientation should ask not only what is drifting in the
# work, but what the page claims that the code no longer supports."
#
# HOW TO ADD A CLAIM. Four fields carry the weight:
#   anchor   a VERBATIM sentence from the page (whitespace-normalised before matching). If the
#            page is edited and the sentence goes, the claim reports UNBOUND — the register
#            going stale is itself drift, not a silent skip.
#   claim    what that sentence asserts, in one line, in the register's own words.
#   expects  what the CODE must show for the page to be telling the truth: present | absent.
#   probe    the predicate. Deliberately small and greppable — all three of the 2026-08-28
#            corrections were findable this way; none of them needed judgement.
#
# THE EXPECTED STATE IS THE WHOLE POINT. A check that only asks "is the page over-claiming?"
# would have got C1 wrong: `price_sensitivity` gained a channel on 2026-08-27, the day before the
# guidance said it had none. `expects` lets the report say SUPERSEDED — the code moved, not the
# page — which is a different repair from an over-claim and must not be reported as the same
# thing.
#
# WHAT DOES NOT BELONG HERE: a claim whose truth needs a judgement call. If the predicate cannot
# be written down, the claim is not registerable and pretending otherwise builds a control that
# cannot fail on anything specific.
#
# HOW TO REMOVE A CLAIM — `_retired`, at the bottom of this file. Every verdict this register can
# produce is a refusal ON A ROW, so until 2026-09-05 deleting the row was the cheapest way to clear
# a red: fifteen claims with one drifting exits 1, and deleting the drifting claim exits 0 saying
# "all HOLD". `removed_claims()` compares this file against its copy at HEAD and refuses a claim
# that left without a reason. A claim may absolutely be retired — a page withdrawn, a capability
# genuinely gone — but the sentence saying so is written down, in git, and visible in the diff.

claims:

  # ---------------------------------------------------------------- C1: the drawn traits
  - id: C1_price_sensitivity_reaches_the_churn_decision
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "`price_sensitivity` reaches the world through the churn decision (landed 2026-08-27)"
    claim: "one drawn trait expresses — price_sensitivity is read by the world's churn decision"
    expects: present
    probe:
      kind: token_live
      token: price_elasticity_for_customer
      roots: [simulation]
      exclude: [simulation/population_draw.py]   # the definer; a channel needs a CALLER elsewhere
    note: >-
      Excluding the defining module is what makes this a channel test rather than an existence
      test. C2's lesson in miniature: a thing can exist and be wired to nothing.

  - id: C1_green_stance_carries_no_channel
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "`green_stance` and `channel_pref` are drawn, coverage-tested and read by no response function at all"
    claim: "green_stance is read by no response function in the world"
    expects: absent
    probe:
      kind: token_live
      token: green_stance
      roots: [simulation]
      exclude: [simulation/population_draw.py, simulation/population_coverage.py]
    note: >-
      The two exclusions are the DRAW and the COVERAGE TEST — the trait must exist somewhere to be
      drawn at all. Everything else under simulation/ reading it would mean a channel appeared.

  - id: C1_channel_pref_carries_no_channel
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "`green_stance` and `channel_pref` are drawn, coverage-tested and read by no response function at all"
    claim: "channel_pref is read by no response function in the world"
    expects: absent
    probe:
      kind: token_live
      token: channel_pref
      roots: [simulation]
      exclude: [simulation/population_draw.py, simulation/population_coverage.py]

  # ---------------------------------------------------------------- C2: the market
  - id: C2_a_rival_supplier_is_modelled
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "a rival that moves: `simulation/competitor_reference.py`"
    claim: "a module models a rival supplier AND the world's churn decision reads it"
    expects: present
    probe:
      kind: token_live
      token: competitor_reference_rate_gbp_per_mwh
      roots: [simulation]
      exclude: [simulation/competitor_reference.py]
    note: >-
      Registered on 2026-08-28 as the CORRECTION to a claim this check itself caught: the page
      still said "no module models a rival supplier" hours after `simulation/competitor_reference.py`
      landed and was wired into `customer_events`. The probe deliberately asks for the CALLER, not
      the file — eleven design documents named "competitor" were what the original C2 was about.

  - id: C2_market_position_is_a_run_level_constant
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "market position is a run-level constant"
    claim: "the run's own market position is a single module-level constant, not a per-customer state"
    expects: present
    probe:
      kind: literal_assign
      file: simulation/customer_events.py
      name: PRICE_DIFFERENTIAL_PCT
      value: 0.0

  # ---------------------------------------------------------------- C3: survival
  - id: C3_collateral_is_a_cost_line_never_a_call
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "collateral is a cost line sized once at term start and fixed for the term — never a CALL"
    claim: "nothing in the world demands collateral cash at a moment the company does not control"
    expects: absent
    probe:
      kind: call_site
      function: build_counterparty_collateral
      roots: [simulation]
      keyword: mark_date
      value: effective_end
    note: >-
      The named mechanism, not a proxy for survival generally: C3's verdict was that the collateral
      figure is subtracted from margin and never CALLED. When the world gains the call, this claim
      reports SUPERSEDED and the page's "none of them presses yet" is what has to change.
      RE-POINTED 2026-11-14 (Expert Hour): the probe searched for `collateral_call`, a token no
      source file has ever held, so it could not go red. The world does build a margin-call book
      (run_phase2b, through company/interfaces/counterparty_collateral), marked once at the run's
      end and written only to the report; its cash never reaches treasury. The probe now asks
      whether any world call marks that book at a date other than `effective_end` -- a mark inside
      the loop is the call becoming something the world can press with.

  - id: C3_the_world_cannot_reach_the_liquidity_organs
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "there is no mechanism converting a bad quarter into a liquidity constraint"
    claim: "no module in the world imports the company's risk organs, so it cannot apply a squeeze"
    expects: absent
    probe:
      kind: import_edge
      roots: [simulation]
      target: company.risk

  - id: C3_arrears_do_not_meet_the_bill
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "arrears do not yet arrive coupled to wholesale peaks"
    claim: "no world module on the run path reads the household's budget, so a bill raised by a wholesale peak does not raise the chance it is missed"
    expects: absent
    probe:
      kind: import_edge
      target: simulation.household_budget
      roots: [simulation]
      exclude: [simulation/household_budget.py, simulation/dd_attribution.py,
                simulation/willingness_classification.py, simulation/self_rationing.py]
    note: >-
      What "coupled" means, defined 2026-11-15 before binding (A45 MAJOR 3 residual): a missed
      payment is coupled to a wholesale peak when the world's per-bill outcome depends on the bill
      meeting the household's budget, so a bigger bill is likelier to fail. Today it does not:
      `arrears_engine.payment_outcome` draws from an income-stress tier set by life events
      (`household_demand.income_stress_trajectory`), never from the bill or W2_4's budget, which
      only three answer keys and the offline `tools/couple_*` scripts import. Those three are
      excluded; TF2 watches willingness_classification, and a run-path import of dd_attribution or
      self_rationing would bypass this probe (not transitive). Not counted as coupling:
      `bad_debt_incidence`'s scripted 2021-22 year uplift, which a full run overwrites with the
      arrears engine's outcome. The day a run-path module imports the budget, this reports
      SUPERSEDED and the page's debt clause is what has to change.

  # ---------------------------------------------------------------- the RENDERED surface
  # The two below are the same predicates as C1/C3 above, pointed at the published schematic
  # rather than the design page. They are separate claims on purpose: correcting the canon file
  # does not correct what a reader sees, and R11 says the rendered value is what "done" means.
  - id: SITE_the_schematic_says_survival_is_not_yet_at_risk
    page: site/index.html
    anchor: "It must not be guaranteed to live, and collateral does not press yet."
    claim: "the front-door schematic tells the reader no mechanism yet puts the company's survival at risk"
    expects: absent
    probe:
      kind: call_site
      function: build_counterparty_collateral
      roots: [simulation]
      keyword: mark_date
      value: effective_end
    note: >-
      Was SITE_the_schematic_still_says_the_company_can_die. C3's director correction — "the company
      does not have to die; it has to not be guaranteed to live" — reached the canon page on
      2026-08-28 and neither rendered surface; repaired 2026-08-29 on both. Still bound to the
      collateral CALL because that is the mechanism C3 names as the one that could kill it, so the
      day `B6_collateral_cash_death_loop` lands and the world can issue a call, this claim goes
      UNDER_CLAIM and the front door is told to stop saying survival is safe. Re-anchored 2026-10-24: the
      director's diagram steer narrowed "no mechanism presses yet" to collateral, because the
      defending rival now presses on price. The predicate is the same.

  - id: SITE_the_company_card_says_survival_is_not_yet_at_risk
    page: site/index.html
    anchor: "nothing in the world can yet push it under"
    claim: "the front door's company card tells the reader nothing yet puts the company's survival at risk"
    expects: absent
    probe:
      kind: call_site
      function: build_counterparty_collateral
      roots: [simulation]
      keyword: mark_date
      value: effective_end
    note: >-
      The third rendered copy of C3. The SVG and its alt-text were repaired 2026-08-29; the
      company card below them still said "it can die" until 2026-10-07 because no claim was
      anchored to it. Same probe as the schematic claim, for the same reason.

  # ---------------------------------------------------------------- the MISSION's three channels
  # Registered 2026-08-28 with the director's mission rewrite (THE MODEL ON A PAGE §The mission).
  # The page now says advice is "built everywhere except at the point where it would matter". That
  # is a CHANNEL claim of exactly C1's shape -- the module exists, and the question is whether
  # anything in the world calls it -- so it is registerable, and it must report SUPERSEDED the day
  # advice reaches a household rather than waiting for someone to re-read the page.
  #
  # The two mission claims once held back here as unregisterable are overtaken (2026-11-15):
  # "the score has no household side" was registered the day A47 landed its figure
  # (MISSION_the_household_side_of_money_is_instrumented, and ..._read_by_no_decision_surface);
  # the page's time sentences are settled in `_judged_negatives` as no_witness.
  - id: MISSION_switching_advice_has_no_recipient
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "nothing in `simulation/` consumes a recommendation"
    claim: "the world never reads the company's switching recommendation, so no household acts on it"
    expects: absent
    probe:
      kind: token_live
      token: switching_recommendation
      roots: [simulation]
    note: >-
      The company-side module and its portal render are deliberately NOT excluded here, because
      they are not under `simulation/` at all -- the probe asks only whether the WORLD reads it.
      That is the difference between a channel and a feature, and it is the same test C1 applies
      to `green_stance`.

  # The tariffs channel, the one the page calls LIVE. Bound 2026-11-15 from the Expert Hour's
  # per-section MINOR: its section was "watched" by the advice anchor alone.
  - id: MISSION_the_offered_rate_reaches_the_churn_decision
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "the rate reaches the customer's churn decision (`simulation/customer_events.py`)"
    claim: "the world's departure roll reads THIS customer's offered rate against the market reference"
    expects: present
    probe:
      kind: called
      function: _price_differential_vs_market
      roots: [simulation/customer_events.py]
    note: >-
      `called`, not `token_live`: the name's own `def` would hold a token probe green after the
      call was cut. Watches the second link only (the roll reads the rate it is given). The first
      link, the run loop handing over `unit_rate`, goes through `**_roll_kwargs` in run_phase2b,
      which no AST probe here can read; the per-customer price ladder is what would show it cut.

  # ---------------------------------------------------------------- A47: the household side
  # Registered the same day the figure landed, which is the point of the register: the canon
  # page now says money is instrumented on the household side, and that claim must be re-tested
  # by something other than a person re-reading the page.
  - id: MISSION_the_household_side_of_money_is_instrumented
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "computes what a household kept against the published SVT at its own metered volumes"
    claim: "a module computes the household's money share AND something outside it reads the figure"
    expects: present
    probe:
      kind: token_live
      token: build_household_value_share
      roots: [tools, company]
      exclude: [company/analytics/household_value_share.py]   # the definer; a figure needs a READER
    note: >-
      The probe asks for the CALLER, not the file, for the reason C2 was about: a module can exist
      and be wired to nothing. It deliberately does NOT accept `simulation/` as a reader -- a world
      module reading this figure would be the epistemic defect, not the evidence.

  - id: MISSION_the_household_share_is_read_by_no_decision_surface
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "read by no decision surface"
    claim: "no supplier decision module calls the household money-share builder; only measuring tools do"
    expects: absent
    probe:
      kind: token_live
      token: build_household_value_share
      roots: [company, saas]
      exclude: [company/analytics/household_value_share.py]   # the definer is not a reader
    note: >-
      Bound 2026-11-15 from the check's own list of unbound negatives. The witness is the three
      tools that do call it (price ladder, value-cycle A/B, seed_family), so the probe is not
      vacuous. A `company/` or `saas/` caller makes it SUPERSEDED: the page would under-claim, and
      `tests/company/test_household_share_is_not_yet_a_target.py` would want reading beside it.

  - id: SITE_the_front_door_says_the_household_saving_is_measured
    page: site/capabilities/index.html
    anchor: "its own metered volumes"
    claim: "the published site tells a reader the household's saving is measured, and it is"
    expects: present
    probe:
      kind: token_live
      token: build_household_value_share
      roots: [tools, company]
      exclude: [company/analytics/household_value_share.py]
    note: >-
      Re-pointed 2026-10-23: the sentence moved from the front door to Capabilities on 22 Oct
      (bee0abf1a, "the gaps move to Capabilities, none deleted") and was reworded there on 23 Oct
      (368673a80). The id keeps its old name because the test pins the register's membership.
      The same predicate as MISSION_the_household_side_of_money_is_instrumented, pointed at the
      RENDERED surface rather than the design page. Separate on purpose and for the reason SITE13
      and the two schematic claims exist: correcting a canon file does not correct what a reader
      sees, and R11 says the rendered value is what "done" means. If the figure is ever removed,
      this reports OVER_CLAIM against the front door specifically -- the sentence a visitor reads.

  # ---------------------------------------------------------------- the arm's reach
  - id: MISSION_the_pricing_arm_prices_both_fuels
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "the pricing arm prices\ngas renewals too"
    claim: "the per-customer pricing arm prices gas renewals as well as electricity"
    expects: present
    probe:
      kind: literal_assign
      file: company/crm/customer_profitability.py
      name: UPLIFTABLE_COMMODITIES
      contains: gas
    note: >-
      Registered 2026-08-28 against an electricity-only guard; RE-POINTED 2026-10-04 when 3088f8c71
      widened it. RE-POINTED AGAIN 2026-11-14 (Expert Hour): the 10-04 row expected
      `UPLIFTABLE_COMMODITY = "electricity"` to be absent, but that name was gone, so the row held
      whatever the guard did. It now reads the live guard, `UPLIFTABLE_COMMODITIES`, and reports
      OVER_CLAIM the day gas leaves it -- the moment the page's sentence and every published A/B
      coverage figure have to be restated.

  # ---------------------------------------------------------------- TIMEFRAME 1's unregistered lines
  # Registered 2026-10-09 by reading TIMEFRAME 1 line by line for anything a probe can hold. Two of
  # the three were stale when read, both in the direction the page UNDER-claims, and both had been
  # stale for weeks with this check green -- because a sentence nobody registered is a sentence
  # nothing asks. The pairs below are a correction and the claim that binds it.
  - id: CARBON_the_three_ledger_is_called_by_nothing
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "designed ledger (SAVED/SPENT/NET), honestly *not yet instrumented*"
    also_anchors: ["The ledger is still called by nothing"]
    claim: "no production module imports the SAVED/SPENT/NET carbon ledger"
    expects: absent
    probe:
      kind: import_edge
      target: company.carbon.carbon_ledger
      roots: [company, saas, simulation, sim, tools, background]
      exclude: [company/carbon/carbon_ledger.py]
    note: >-
      An import edge, not a token: `half_hourly_footprint.py` names the ledger in its docstring
      ("is untouched"), and a token probe would call that a caller.

  - id: CARBON_a_households_emissions_are_measured_and_published
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "multiplies NESO's half-hourly intensity by the half-hourly reads of the accounts that have them and profiles the rest, and Explore publishes it"
    claim: "the household footprint module is reached by the generator that publishes it"
    expects: present
    probe:
      kind: import_edge
      target: company.carbon.half_hourly_footprint
      roots: [tools]
      exclude: [tools/r3_carbon_score_ceiling.py]   # an analysis; the claim is that Explore publishes it
    note: >-
      The page said carbon was "not yet instrumented" while `tools/generate_explore_carbon.py`
      published measured emissions on Explore. The ledger half of that sentence was still true,
      which is why the two halves are two claims.

  - id: PRICING_the_renewal_desk_clamps_at_the_competitive_ceiling
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "a residential renewal still cannot be priced more than 2% above the cap"
    also_anchors: ["though a residential renewal is still clamped near the cap"]
    claim: "the renewal desk passes every struck rate through the competitive-ceiling clamp"
    expects: present
    probe:
      kind: call_site
      function: _apply_competitive_ceiling
      roots: [company]
      keyword: segment
      value: __no_name_is_this__
    note: >-
      Registered 2026-11-14 from the check's own unbound-negatives list (A45 MAJOR 3). The
      keyword/value pair matches no call, so every call to the clamp is evidence; the day the
      desk stops calling it, this reports OVER_CLAIM and the page's "cannot price above the cap"
      has to go. RE-ANCHORED 2026-11-15 (Expert Hour): the page said "cannot price above the cap
      at all", which the code never did -- the ceiling is 1.02x SVT, the cost floor overrides it
      and business renewals are unclamped; the page now says so. This probe sees the CALL only: a
      clamp that returns its input unchanged keeps it green. The two percentages the page now
      states are the next two rows.

  - id: PRICING_the_ceiling_is_102_pct_of_the_published_svt
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "clamps it at 102% of the published SVT"
    claim: "the competitive ceiling starts at 1.02 times the published SVT"
    expects: present
    probe:
      kind: literal_assign
      file: company/pricing/renewal_desk.py
      name: _SVT_CEILING_PCT
      value: 1.02

  - id: PRICING_the_ceiling_tightens_to_97_pct
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "tightening to 97% as the published switching signal rises"
    claim: "the competitive ceiling never tightens below 0.97 times the published SVT"
    expects: present
    probe:
      kind: literal_assign
      file: company/pricing/renewal_desk.py
      name: _MIN_CEILING_PCT
      value: 0.97

  - id: PRICING_the_forward_belief_window_adapts
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "which adapts between 30 and 180 days with recent volatility"
    claim: "the company's forward belief window is adaptive, not a fixed 120-day trail"
    expects: present
    probe:
      kind: literal_assign
      file: company/pricing/tariff_engine.py
      name: ADAPTIVE_LOOKBACK_ENABLED
      value: true
    note: >-
      The page said "120-day trailing"; `get_forward_price` defaults to an adaptive window and an
      EWMA mean. Reports OVER_CLAIM the day the adaptation is switched off.

  - id: OPEN_FINDINGS_no_simplified_redirect_survives
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "No /simplified redirect remains"
    claim: "the served site carries no /simplified -> /proof redirect rule"
    expects: absent
    probe:
      kind: text_in_file
      file: site/_redirects
      phrase: "/simplified /proof"
    note: >-
      F-MOAP-1 said `/simplified` was 301'd to `/proof`; on 2026-11-12 the redirect file held
      the favicon rule only and there was no `/proof` door. Binds the correction, not the old
      sentence, so a restored rule reports SUPERSEDED.

  - id: TF2_the_worlds_cant_pay_wont_pay_key_drives_nothing
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "cannot-pay/will-not-pay collections physics"
    claim: "the world's hidden ability x willingness key is read by nothing in the run loop"
    expects: absent
    probe:
      kind: import_edge
      target: simulation.willingness_classification
      roots: [simulation]
      exclude: [simulation/willingness_classification.py]
    note: >-
      Timeframe 2 lists this as not yet true. The answer key exists and only an offline
      coupling tool (`tools/couple_w2_7_c9.py`) imports it. The day a world module reads it,
      this reports SUPERSEDED and the line belongs in Timeframe 1.

  - id: PICTURE_the_svg_is_generated_at_publish
    page: docs/design/THE_MODEL_ON_A_PAGE.md
    anchor: "is generated at publish by `tools/model_on_a_page_picture.py` from the block below"
    claim: "the publisher calls the picture generator, so the SVG cannot drift from the YAML by hand"
    expects: present
    probe:
      kind: import_edge
      target: tools.model_on_a_page_picture
      roots: [tools]
      exclude: [tools/model_on_a_page_picture.py, tools/model_on_a_page_sheets.py]
    note: >-
      The sheets generator imports the picture's helpers and is not a publisher, hence the
      exclusion. Evidence today: `tools/generate_dashboard_data.py` imports `write`.

# THE JUDGED NEGATIVES -- named "not yet" sentences that no predicate can bind, each with its
# reason (`tools/canon_drift_check.JUDGED_SECTION`). Keyed to a verbatim excerpt holding the
# phrase, so an edited sentence is named again. A `summary` lapses when a claim it restates stops
# holding. Judged 2026-11-15; left NAMED on purpose because they need a judgement this pass could
# not settle: the spine's debt clause ("arrears do not yet arrive coupled to wholesale peaks") and
# the organs line's "moneyness trigger absent". The second needs a definition before a probe: churn
# already reads each renewal's own rate against the market (`customer_events`,
# `_price_differential_vs_market`), so whether a "moneyness trigger" is that, or a mid-term exit
# from a fix the market has undercut, is unsaid. "Abate ... not yet instrumented" was judged
# 2026-11-15, below.
_judged_negatives:
  - page: docs/design/THE_MODEL_ON_A_PAGE.md
    excerpt: "is designed as our £/tCO₂e and is not yet instrumented at all"
    kind: no_witness
    why: >-
      The score's Abate leg. Checked 2026-11-15: no module in company/, saas/, simulation/ or tools/
      computes a score term for it, and the household tonnes it would price are measured
      (half_hourly_footprint) but priced per tonne nowhere. With no symbol to watch, an absent probe
      would be VACUOUS; the counterfactual half is CARBON_the_three_ledger_is_called_by_nothing.
  - page: docs/design/THE_MODEL_ON_A_PAGE.md
    excerpt: "it is **absent**, and it is the only cell in the table that is"
    kind: no_witness
    why: >-
      The household time currency. Checked 2026-11-15: the only `effort_minutes` symbols are the
      company's own decision-rights rate card (staff minutes), not household minutes. With no
      symbol, an absent probe would be VACUOUS.
  - page: docs/design/THE_MODEL_ON_A_PAGE.md
    excerpt: "never converted to pounds (M3); not yet instrumented | not yet instrumented"
    kind: no_witness
    why: The table's time row, both sides; the cell the sentence above calls absent.
  - page: docs/design/THE_MODEL_ON_A_PAGE.md
    excerpt: "Time, household minutes: not yet instrumented"
    kind: no_witness
    why: The picture's copy of the time cell above; same reason.
  - page: docs/design/THE_MODEL_ON_A_PAGE.md
    excerpt: "Two of the three channels therefore cannot yet create the value"
    kind: no_witness
