      10% unproven, 16% open. Ofgem R0173: ETTOS leads 22%.
    basis_low: TEM, proactive investigations 15%.
    basis_high: TEM, reactive investigations 42%; Ofgem 2014 IA, 2011 domestic electricity 15,956 / 41,670 = 38%.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: tested
      detail: Published at source; the split by lead source is the company's lever, not a world draw.
    verdict: RESOLVED

