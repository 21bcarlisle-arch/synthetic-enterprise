    default: null
    default_reason: >-
      GAP. Not in Ofgem's 2015 inspection consultation, the 2018 back-billing decision, the 2014
      theft IA or the BSC material read; the 2015 consultation records only suppliers' statement
      that they read traditional meters "through a successful site visit every 6 months". A
      practitioner question: the third side.
    low: null
    high: null
    basis_default: None published.
    basis_low: None published.
    basis_high: None published.
    feeds: [W2_37]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        No code decides on it: the world has no read visit and the company no read lever. When
        W2_37 builds read-chasing, ask the director: of read visits to traditional credit meters,
