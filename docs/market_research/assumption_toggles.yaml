# Assumption toggles: quantities the published record does not establish, each with a range and
# the basis for each end. An atom that needs one READS it here and never types its own number.
# Reasoning, derivations and sensitivity results:
#   docs/market_research/practitioner_questions_as_assumption_toggles.md
# Sensitivity results: re-scored decision-probe rows (script not in the tree; its inputs are not).
# Director's ruling, 2026-10-05: "If it doesn't change any decision, the question doesn't matter.
# If it does, dig harder -- and only bring it to me if it's both decision-changing and unresolvable."
# Verdict vocabulary: RESOLVED | DOESNT_MATTER | MATTERS_AND_RESOLVABLE | MATTERS_AND_UNRESOLVABLE
# 2026-10-06: Q3 recovery toggle revised and prov_* provisioning toggles added from
#   docs/market_research/bad_debt_provisioning.md (sections 3 and 7). The prov_coverage_* verdicts
#   are MATTERS_AND_RESOLVABLE on mechanism (renewal pricing reads these rows); no sweep has run yet.
# 2026-10-08: the director's four practitioner points checked against the published record
#   (back_billing_and_liability.md s.9, read_access_and_theft_duties.md s.8-9,
#   bad_debt_provisioning.md s.9). No value any code reads was changed. Three null-default rows
#   added: q1_void_months_per_move_out, q2_persistent_unread_relative_risk_private_rented,
#   q3_debt_sale_price_share_of_face.
written: 2026-10-05
toggles:
  - id: q1_move_out_notice_share
    question: Q1 home moves
    meaning: >-
      Of move-outs at a premises we supply, the share where the departing occupier (or landlord)
      tells us by move day; the rest are learned later from a bounced final bill, a cancelled DD,
      returned mail or a new occupier.
    default: 0.7
    low: 0.5
    high: 0.9
    basis_default: >-
      Ofgem home-moves CfI summary of responses (OFG1164, Jun 2026) para 2.2: suppliers depend on
      consumer move-out and move-in notifications, which are often late. No published share; the
      default is the range midpoint, not a measurement.
    basis_low: Consumer-body case evidence and the 20-40% CoT share of debt (Ofgem CfI Dec 2025 para 2.5).
    basis_high: Owner-occupier sales, where conveyancing fixes the date and the read.
    feeds: [B7_customer_state_layer_moves_and_shocks, W2_38]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        B7 prints CoT debt per move (must land GBP 300-650 at 2024-25 prices), CoT share of all
        debt (must land 10-40%) and every company CoT decision it builds, at low/default/high.
    verdict: MATTERS_AND_RESOLVABLE

  - id: q1_unnamed_months_per_cot
    question: Q1 home moves
    meaning: >-
      Expected unnamed months per change of tenancy = P(move-in not named by move day) x mean
      months until named. Only the product is bounded by evidence, so only the product is a toggle.
    default: 3
    low: 1
    high: 6
    unit: months
    basis_default: >-
      Derived: Energy UK CfI response, five largest suppliers accrued GBP 740m CoT debt in a year;
      / ~78% share [M] = ~GBP 949m; / ~2.0m GB moves (EHS 2024-25 1.8m England scaled by households
      [M]) = ~GBP 474 per move = 3.3 months of a GBP 1,717/yr typical bill [M].
    basis_low: A few weeks for most moves (Citizens Advice 48-hour notice guidance mostly followed).
    basis_high: All GBP 474 unnamed and unrecovered at 70% of typical use = 4.7 months, plus later partial recovery.
    feeds: [B7_customer_state_layer_moves_and_shocks, W2_38, EP4_collections_journey, B11_forward_clv_backtested_on_held_back_history, W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        Same as q1_move_out_notice_share; graded against the GBP 300-650 per move band. Checked
        2026-10-08 (back_billing_and_liability.md s.9): STANDS. It bounds the incoming occupier's
        unnamed leg only; the void between occupiers is a different debtor (the owner, Electricity
        Act 1989 Sch 6 para 3(1)) and is q1_void_months_per_move_out.
    read_by: sim/customer_state_layer.py::unnamed_months_per_move (W2_36 slice 3, the change-of-tenancy gap)
    verdict: MATTERS_AND_RESOLVABLE

  - id: q1_move_hazard_multiplier
    question: Q1 home moves
    meaning: >-
      Multiplier on the English Housing Survey 2024-25 annual move rate by tenure (owner 3.8%,
      private rent 17.5%, social 4.6%), applied as a price-insensitive departure hazard.
    default: 1.0
    low: 0.5
    high: 2.0
    basis_default: EHS 2024-25 Annex Tables 1.1 and 3.7 (simulation/arrival_route.py).
    basis_low: EHS per-tenure flows carry only 1.62m of the 1.8m headline; Scotland/Wales unmeasured.
    basis_high: Generous upper bound covering per-person vs per-household confusion (2016 Ofgem 11% per person).
    feeds: [B7_customer_state_layer_moves_and_shocks, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: tested
      tool: tools/assumption_toggle_sensitivity.py
      detail: >-
        Renewal pricing (decision probe, 4 paths x 3 tenure seeds): no level or sign moved at 0.5
        or 1.0; at 2.0 one ex-ante year moved one grid step on one path in 2 of 3 seeds.
    verdict: DOESNT_MATTER

  - id: q1_void_months_per_move_out
    question: Q1 home moves
    meaning: >-
      Expected months a domestic premises stands empty between the outgoing occupier's contract
      ending (SLC 24.1) and an incoming occupier taking supply. Supply in that void is deemed to
      the OWNER for electricity ("the occupier (or the owner if the premises are unoccupied)",
      Electricity Act 1989 Sch 6 para 3(1)); for gas the deemed contract is "with the consumer"
      (Gas Act 1986 Sch 2B para 8(1)) and whether an empty home's owner is that consumer is a GAP.
      Not the incoming occupier's unnamed months (q1_unnamed_months_per_cot).
    default: null
    default_reason: >-
      GAP. No published domestic void length or void consumption: not in Ofgem's home-moves call
      for input (9 Dec 2025) or its summary of responses (June 2026), nor in Citizens Advice's
      consumer guidance (home_moves.md s.2.4; back_billing_and_liability.md s.9, 2026-10-08).
      A practitioner question: how long are voids on a domestic let, and are they billed to the
      landlord in practice or written off?
    low: null
    high: null
    basis_default: None published.
    basis_low: None published.
    basis_high: None published.
    feeds: [B7_customer_state_layer_moves_and_shocks, W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        No code draws a void length (sim/customer_state_layer.py VOID_GAP_UNKNOWN_REASON states
        why). When B7 bills the void leg to an owner separately from the unnamed occupier, it
        prints the void's standing charges and use at the practitioner's answer and at zero.
    verdict: DOESNT_MATTER until a void leg is billed separately; then a practitioner question

  - id: q2_persistent_unread_share
    question: Q2 persistent non-reads
    meaning: >-
      Share of read-exposed credit meters (traditional, or smart in traditional mode) in a
      hard-to-read state with monthly actual-read probability ~0.02; the remainder are read
      memorylessly at the rate solved to match q2_no_read_12m_share.
    default: 0.01
    low: 0.0
    high: 0.03
    basis_default: >-
      Smallest share that makes a 24-month gap ordinary among complaint back-bills (Ofgem 16 Nov
      2017 para 2.1: median length 24 months, n=203) while keeping Elexon's RF fit. Weaker than it
      looks (back_billing_and_liability.md s.1, 2026-10-06): all six published case studies behind
      that sample are billing failures, ignored reads or unloaded PPM debt, not no-access meters,
      so the 24-month median evidences supplier billing failure at least as much as persistent
      non-reading. No-access is evidenced only qualitatively (locked cupboards, landlord keys:
      Ofgem decision 5 Mar 2018 p.8). Kept, not raised.
    basis_low: Elexon 30/60/80/97% at 2/4/7/14 months fits a memoryless read at p~0.20 with no persistent class.
    basis_high: Elexon RF leaves 3% unread, so pi x 0.98^14 <= 0.03 gives pi <= 0.04; less a margin because the fit worsens with pi.
    basis_read_access: >-
      Ofgem 5 Mar 2018 p.8 names locked cupboards and landlord-held keys as causes of non-reading:
      a persistent class is partly a PREMISES trait, while the code keys it to customer_id. The
      invariance proof below assumes no 21BA.2(c) obstruction exception; it holds only while
      q6_obstructive_share_of_long_unread is 0 (read_access_and_theft_duties.md section 2.4).
      Checked 2026-10-08 (read_access_and_theft_duties.md s.9): value STANDS; independence is not
      supported. Read exposure is tilted to private renting (EHS 2022-23 AT3.7: 57.0% of private
      renters vs 43.9% of owner occupiers without an electricity smart meter) and pay-on-receipt,
      and every named no-access cause is a premises/building trait (Ofgem 5 Mar 2018 p.8; Alt HAN
      Co: HAN range issues in over 700,000 households). Draw the class keyed to the PREMISES;
      its tilt by tenure is q2_persistent_unread_relative_risk_private_rented (null).
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality, D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used, W2_37]
    solver_for_other_class: simulation/meter_reads.py::solve_easy_rate
    sensitivity:
      kind: tested
      tool: tools/assumption_toggle_sensitivity.py
      detail: >-
        Proved and printed: the share of consumption older than 12 months at the catch-up bill
        equals the 12-month no-read share for any calibrated mixture, so 21BA-barred revenue and
        renewal pricing are invariant in pi. The shape (count and size of back-bills, complaints,
        value of targeted read-chasing) is an acceptance criterion of W2_36/D48/W2_37 at pi = 0,
        0.01, 0.03.
    verdict: DOESNT_MATTER for aggregates and pricing; MATTERS_AND_RESOLVABLE for the shape

  - id: q2_no_read_12m_share
    question: Q2 persistent non-reads
    meaning: >-
      Share of domestic credit customers with no bill based on an actual read in the past 12 months.
      DENOMINATOR MISMATCH (read_access_and_theft_duties.md section 7): Ofgem's figure counts all
      domestic consumers; simulation/meter_reads.py calibrates it among READ-EXPOSED meters only
      (traditional, or smart not in smart mode). A pre-21BA (H1 2017) figure: no post-2018 series read.
    default: 0.07
    low: 0.054
    high: 0.085
    basis_default: Ofgem statutory consultation 16 Nov 2017 para 1.1 (Citizens Advice data, H1 2017) "just over 7%".
    basis_low: Ofgem decision 5 Mar 2018 p.10, median supplier 94.8% / 94.4% with a read in the year.
    basis_high: >-
      Derived: the 7% is over all domestic consumers, while the world applies it to read-exposed
      meters only, so it re-bases to 0.07 / (1 - smart share). With the H1 2017 smart share at
      0.10-0.22 by segment (saas/smart_meter_rollout.py) that is 0.078-0.090 (read_access_and_theft_duties.md
      section 7); back_billing_and_liability.md section 7 reaches the same restatement and bounds it at
      <= 0.082 for a smart share <= 0.15. 0.085 sits inside both.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality, D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used]
    sensitivity:
      kind: tested
      detail: >-
        Calibration target. The world's old 1/6 monthly read rate gave 11.2% and should be ~0.20-0.22;
        since W2_36 slice 2 (2026-10-05) simulation/meter_reads.py solves its rate to this share.
        Checked 2026-10-08 against MHHS (read_access_and_theft_duties.md s.8): STANDS. MHHS leaves
        SLC 21B.4's annual read duty unchanged and cuts RF to 4 months only from M16 (2 Jul 2027),
        after the window; the 14-month RF and 97% standard apply to every 2016-2025 settlement day.
    verdict: RESOLVED

  - id: q2_mean_under_estimate_on_a_catch_up
    question: Q2 persistent non-reads
    meaning: >-
      Mean positive part of (actual - estimated) / estimated consumption over an unread stretch.
      Since D48 slices 3-4 the company makes the estimate, so this is a check on the company's
      estimator, not a world input (no code reads it). It sets 21BA-barred revenue only for
      customers who pay on receipt: for a direct-debit customer the barred quantity is the
      collection shortfall older than 12 months at the next charge recovery action, not the
      estimate error (Energy Ombudsman backbilling stance, Scenarios A and B;
      back_billing_and_liability.md s.1).
    default: 0.10
    low: 0.05
    high: 0.20
    basis_default: >-
      Derived from docs/market_research/how_far_a_settled_eac_sits_from_next_years_use.md: EACs
      unbiased, median absolute year-on-year move 14%, so the positive part averages ~0.10.
    basis_low: Half the default; a supplier estimating from recent actuals rather than the EAC.
    basis_high: One in eight homes moves by more than 50% year on year.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality, D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: tested
      tool: tools/assumption_toggle_sensitivity.py
      detail: >-
        Barred revenue 0.27% (low) / 0.35% (default) / 1.4% (high): renewal pricing unchanged at
        low and default; at high one path's levels moved one grid step, no sign changed. That is
        within the probe's own path-to-path spread (hindsight 45/50/50/55).
    verdict: DOESNT_MATTER

  - id: q2_pre_2018_voluntary_cap_coverage
    question: Q2 persistent non-reads
    meaning: >-
      Share of domestic catch-ups billed before 1 May 2018 (when SLC 21BA took effect) to which a
      12-month limit applied in practice under Ofgem's 2007 principle and Energy UK's Billing Code
      (supplier at fault, 12 months back from the corrected bill).
    default: 0.83
    low: 0.0
    high: 1.0
    basis_default: >-
      Billing Code signatories (the six largest) held 83% of domestic electricity and 81% of gas
      customers, Q1 2017 (Ofgem statutory consultation 16 Nov 2017 para 2.43), treating an
      unread-meter under-estimate as the supplier's fault, since SLC 21B.4 puts the read duty on it.
    basis_low: >-
      No limit before 1 May 2018, which is company/billing/back_billing.py's current behaviour;
      equivalent to reading every estimate under-read as not the supplier's fault.
    basis_high: >-
      The Ombudsman applied the voluntary principle to all domestic back-billing cases (Ofgem
      decision 5 Mar 2018 p.12), and the large majority of non-signatories followed at least 12
      months (same decision, fn 11).
    feeds: [D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used, W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: not_run
      detail: >-
        Bounded, not run: it acts on 2016 to April 2018 only, on a barred share whose whole-decade
        high (q2_mean_under_estimate_on_a_catch_up at 0.20, about 1.4% of revenue) moved renewal
        pricing one grid step on one path. Expected DOESNT_MATTER for pricing; it moves D48's
        barred figure for those years. Untested until a reader exists.
    verdict: DOESNT_MATTER (expected, not run)

  - id: q2_obstruction_exception_share
    question: Q2 persistent non-reads
    meaning: >-
      Share of the persistent-unread class (q2_persistent_unread_share) whose unread gap would
      qualify under SLC 21BA.2(c), obstructive or manifestly unreasonable behaviour, given that the
      company has documented repeated access attempts AND warned the customer of the consequence.
      Zero for any account without that documented record.
    default: 0.0
    low: 0.0
    high: 1.0
    basis_default: >-
      Ofgem expects customers avoiding payment by passive non-cooperation "to be an issue in very
      few cases"; not supplying a reading is not obstruction (decision 5 Mar 2018 p.10). The Energy
      Ombudsman puts the burden on the supplier and grants the exception only in its worked case
      with repeated visits, letters, calls and an explicit warning (backbilling stance, Exceptions).
    basis_low: As default.
    basis_high: Bound only, with every hard-to-read household a documented refuser. No published count of successful 21BA.2(c) claims exists.
    feeds: [W2_37, D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        Conditional on a company action the code does not yet take: logging access attempts and
        warnings. Its effect is bounded by the persistent class's share of barred energy. W2_37
        (read-chasing) prints the value of documented access attempts at low and high.
    verdict: DOESNT_MATTER for pricing (bounded); MATTERS_AND_RESOLVABLE for read-chasing design

  - id: q2_persistent_unread_relative_risk_private_rented
    question: Q2 persistent non-reads
    meaning: >-
      P(a read-exposed premises is in the persistent hard-to-read class | private rented) /
      P(same | owner occupied). The class is a PREMISES trait (locked cupboard, landlord-held key,
      banks of meters in flats: Ofgem 5 Mar 2018 p.8), so it is drawn per premises and inherited at
      change of tenancy. Not the read-exposure tilt, which the smart rollout carries (EHS 2022-23
      AT3.7: no electricity smart meter 57.0% private rented vs 43.9% owner occupied, ratio 1.30;
      gas AT3.9 1.24) and which must not be applied twice.
    default: null
    default_reason: >-
      GAP. No published source measures the persistence or concentration of no-access by tenure,
      landlord, building type or vulnerability (read_access_and_theft_duties.md s.9, 2026-10-08).
      The evidence supports clustering in kind, not its size. Until filled, draw the class
      uniformly over read-exposed premises (relative risk 1 in effect), keyed to the premises.
    low: null
    high: null
    basis_default: None published.
    basis_low: None published.
    basis_high: None published.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality, W2_37]
    sensitivity:
      kind: argued
      detail: >-
        Shape only. The Q2 invariance (21BA-barred revenue invariant in pi for any calibrated
        mixture) is unaffected by which premises hold the class; what moves is which households get
        long back-bills and how they meet change of tenancy. Practitioner question: do long-unread
        meters sit in the same buildings and with the same landlords year after year, and how much
        more often in private lets or flats?
    verdict: DOESNT_MATTER for pricing; MATTERS_AND_RESOLVABLE for the shape (practitioner)

  - id: q3_plan_take_up_share
    question: Q3 debt
    meaning: P(household agrees an arrangement | supplier offers one at the SLC 27 ability-to-pay step).
    default: 0.32
    low: 0.20
    high: 0.42
    basis_default: Ofgem DRS impact assessment Nov 2025 fn 11, cost-neutral scenario "32% engagement" (E.ON Next Winter Support Scheme).
    basis_low: Same source, "20% changed payment behaviour".
    basis_high: Ofgem debt indicators Q2 2026 stock ratio 2.9/(2.9+4.0) = 42% of >91-day debtors on an arrangement (a stock, upper reference).
    feeds: [EP4_collections_journey, W2_38, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        W2_38 grades the world's repaying-to-arrears stock ratio and its 2019-2026 path against
        Ofgem's quarterly indicators, which jointly pins take-up x keep; EP4 prints its forecast and
        any company plan or DCA/sale decision at low and high. Re-checked 2026-10-06 against the
        provisioning record (bad_debt_provisioning.md): no supplier disclosure bears on take-up;
        Centrica's prepayment-recovery balance falling GBP 203m -> 103m (2022-2025) tracks the
        paused PPM route, not plan take-up. Unchanged.
    verdict: MATTERS_AND_RESOLVABLE

  - id: q3_instalment_miss_probability_monthly
    question: Q3 debt
    meaning: P(a single monthly instalment on an agreed plan fails, SOR 10-working-day definition).
    default: 0.03
    low: 0.02
    high: 0.045
    basis_default: >-
      Derived from Ofgem 2015 social obligations Fig. 13 (23%-41% of large-supplier plans with at
      least one miss in the year): 1-(1-a)^(1/12) = 2.2%-4.3% if independent; persistence would
      lower the typical household's rate.
    basis_low: 23% annual (under GBP 3/wk) -> 2.2% per instalment.
    basis_high: 41% annual (over GBP 9/wk) -> 4.3% per instalment.
    feeds: [EP4_collections_journey, W2_38]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        As q3_plan_take_up_share. Not the company's separate "default after 2 misses" rule.
        Re-checked 2026-10-06 against the provisioning record (bad_debt_provisioning.md): no
        supplier disclosure bears on it; unchanged.
    verdict: MATTERS_AND_RESOLVABLE

  - id: q3_post_write_off_recovery_share
    question: Q3 debt
    meaning: >-
      GBP recovered after write-off (DCA net of commission, or sale proceeds) / GBP written off,
      where the write-off is LATE: taken "only once a period of time has elapsed since the final
      bill" (Centrica Note 17, 2018-2025), after default at six to twelve months from the final
      bill. A write-off taken at the final bill's due date (the world's WRITE_OFF_DATE_CONVENTION)
      is a different event and is compared with 1 - prov_coverage_final_bill_over_90d instead.
    default: 0.05
    low: 0.02
    high: 0.086
    basis_default: >-
      Centrica ARA 2017-2025 Note 17: recoveries of previously written-off receivables GBP 68m
      against Group write-offs GBP 1,482m over the nine years = 4.6% pooled (same-year ratios,
      cohorts differ; derived). Lowell Group 2013 year-end report, 5.4p per GBP face value paid
      2004-2013 (all sectors), agrees.
    basis_low: Centrica ARA 2017 (GBP 5m / GBP 235m = 2.1%) and 2025 (GBP 3m / GBP 135m = 2.2%), the two lowest years.
    basis_high: >-
      Centrica ARA 2021, GBP 7m / GBP 81m = 8.6%, the highest same-year ratio of nine. (Was 0.10
      on "fresher debt fetches more", which had no source; lowered 2026-10-06.)
    feeds: [EP4_collections_journey, W2_38, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: tested
      tool: tools/assumption_toggle_sensitivity.py
      detail: >-
        Renewal pricing unchanged at r = 0.02, 0.05, 0.255 (the world's DCA constant) and 1.0 on
        all 4 paths. No company collections decision exists. CORRECTED 2026-10-06
        (bad_debt_provisioning.md section 7): the world writes off at the final bill's due date, so
        its DCA_RECOVERY_RATE 0.20-0.30 (0.17-0.26 net of its 0.15 commission) is properly compared
        with the final-bill >90-day complement 0.10-0.25 (Centrica 2019-2025), which it overlaps.
        Those constants remain unsourced; they are not shown to be above every published signal.
        Checked 2026-10-08 (bad_debt_provisioning.md s.9): STANDS. Published purchase prices
        bracket it: Lowell 5.4p per GBP face (2004-2013, all sectors) and Arrow Global 9.3p (2017,
        GBP 223.9m for GBP 2.4bn face, 40.7% secured). Net of Ofgem's 3p-per-GBP collection cost
        (DRS IA, 6 Nov 2025, fn 6) the post-write-off leg is near zero.
    verdict: DOESNT_MATTER

  - id: q3_debt_sale_price_share_of_face
    question: Q3 debt
    meaning: >-
      Proceeds / face value when written-off GB domestic energy debt is sold to a debt purchaser.
      A market price for a closed, late-stage book; not the regulator's valuation of debt still
      held (Ofgem DRS, ~20-25% of face), and not a recovery share (q3_post_write_off_recovery_share
      mixes DCA collections and sales).
    default: null
    default_reason: >-
      GAP. No energy-specific sale price is published (bad_debt_provisioning.md s.9, 2026-10-08).
      Centrica ARA 2017 Note 17 confirms sales of written-off energy debt (GBP 5m proceeds) but not
      the face value sold. The low and high are all-sector purchase prices, not energy ones.
    low: 0.054
    high: 0.093
    basis_default: None published for energy.
    basis_low: >-
      Lowell Group 2013 year-end report: face value ~GBP 11.0bn bought for GBP 597m, "an average
      price paid of 5.4 pence per pound", unsecured consumer debt, all sectors, May 2004-Sep 2013;
      first purchases from utilities in 2013.
    basis_high: >-
      Arrow Global ARA 2017: face value GBP 2.4bn for GBP 223.9m = 9.3p (derived); 40.7% of the
      price for secured accounts, so an upper bound for unsecured consumer debt.
    feeds: [EP4_collections_journey, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: argued
      detail: >-
        No company DCA-versus-sale decision exists, and renewal pricing was unchanged across
        recovery shares 0.02-1.0 (q3_post_write_off_recovery_share). The world's
        simulation/arrears_engine.py DEBT_SALE_HAIRCUT_PCT = 0.12 ("illustrative") sits above this
        band's high; not changed here (world code, out of scope).
    verdict: DOESNT_MATTER until a DCA-versus-sale decision is built

  - id: q4_retention_holdout_share
    question: Q4 offers
    meaning: Share of retention-eligible customers randomly held back from an optional retention offer.
    default: null
    default_reason: >-
      A derived design parameter, not a world fact: C34/B8 compute it from the uplift standard
      error at the run's real decision count and the smallest effect worth detecting.
    low: 0.05
    high: 0.50
    basis_default: tools/assumption_toggle_sensitivity.py::uplift_se.
    basis_low: Smallest share that still yields a usable control at ~50,000 decisions a year (SE 0.9pp).
    basis_high: Balanced design, the most precise for a fixed book.
    feeds: [C34, B8_discovered_price_sensitivity_holdout, W2_39]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        At ~80 decisions no holdout share measures uplift (SE >= 10pp against published effects of
        4-9pp). C34/B8 must log a randomised holdout on whether to offer, size it by power, fail
        closed ("not measurable at this book size") when SE exceeds the smallest effect that
        matters, and grade the estimate against tools/decision_probe.py's true counterfactual.
    verdict: RESOLVED

  - id: q4_pecr_soft_opt_in_scope
    question: Q4 offers
    meaning: Which cross-sell products may be emailed or texted to an existing customer without fresh consent.
    default: own_energy_tariffs_and_energy_services
    low: own_energy_tariffs_only
    high: own_energy_and_home_services_same_entity
    basis_default: >-
      ICO, How do we comply with the PECR electronic mail marketing rules: "reasonably expect"
      test; "only covers your own similar products and services". EV, ToU and export tariffs are
      the supplier's own and sold in the same context.
    basis_low: Strictest reading of "similar".
    basis_high: >-
      Contested; requires the same legal entity. Never third-party insurance or broadband (the
      ICO supermarket example excludes banking and insurance). Consumption-data marketing needs
      SLC 47 consent at every setting.
    feeds: [C34]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        C34 holds a per-customer consent state reading this scope and prints its NBA ranking at
        low and high; a change in any customer's TOP action comes back to this register. Today the
        scope only changes the reachable population of the last-ranked lever.
    verdict: DOESNT_MATTER

  # Q6 read access and theft: docs/market_research/read_access_and_theft_duties.md (2026-10-06).
  # Theft reaches a supplier's PRICES only through the market-share smear (UIG, GSP Group
  # Correction); its OWN book's theft reaches only the revenue-protection (detection) decision.
  - id: q6_theft_share_of_electricity_consumption
    question: Q6 read access and theft
    meaning: >-
      Electricity stolen in GB a year / electricity generated (the TEM's own denominator). All
      sectors, including cannabis farms; the domestic split is not published.
    default: 0.009
    low: 0.005
    high: 0.025
    basis_default: >-
      RECCo/Capgemini Theft Estimation Methodology (2023): 1,703-2,837 GWh, "0.5-0.9%" of 2019 UK
      generation; the upper end is the figure RECCo and Ofgem (R0173, 22 May 2025) publish.
    basis_low: TEM lower end, 0.5%.
    basis_high: AUG Statement 2024-25 p.30, studies of electricity theft at "1%-2.5% of throughput across 5 sources".
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: argued
      detail: >-
        Undetected theft is smeared by market share (Ofgem 2014 IA para 2.19), so a supplier's cost
        is share x market theft whatever its own book holds; pricing sees only the smear. The
        revenue-protection shape (detections, assessed kWh) is graded against TRAS/TDIS counts when
        the world generates theft.
    verdict: DOESNT_MATTER for pricing (argued, not run); MATTERS_AND_RESOLVABLE for revenue-protection shape

  - id: q6_theft_share_of_ldz_gas_throughput
    question: Q6 read access and theft
    meaning: Gas stolen in GB a year / LDZ throughput (~500 TWh a year, derived from AUGE GY21/22, 12.5 TWh = 2.50%).
    default: 0.0021
    low: 0.0013
    high: 0.0148
    basis_default: >-
      TEM upper end, 1,059 GWh / ~500 TWh. The only estimate built from GB gas theft data (TRAS
      confirmed cases); the TEM itself says "0.1%" of 859.8 TWh total 2019 demand.
    basis_low: TEM lower end, 636 GWh / ~500 TWh.
    basis_high: >-
      AUG Statement 2024-25 pp.29-30: theft 6,362 GWh, "1.48% of total consumption", an
      assumption "driven largely by the views of electricity theft" studies, not a measurement.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: argued
      detail: >-
        As q6_theft_share_of_electricity_consumption. The gas smear is UIG, whose actual level is
        published (q6_uig_share_of_ldz_throughput) whatever share of it is theft. The 7-11x gap
        between the ends is the published state of knowledge.
    verdict: DOESNT_MATTER for pricing (argued, not run); MATTERS_AND_RESOLVABLE for revenue-protection shape

  - id: q6_theft_prevalence_domestic_electricity
    question: Q6 read access and theft
    meaning: Share of domestic electricity meter points with a theft in progress at any time.
    default: 0.01
    low: 0.0012
    high: 0.016
    basis_default: >-
      Ofgem, Tackling Electricity Theft IA (Mar 2014) Table 4: 275,000 domestic cases at any time,
      "approximately 1 per cent of domestic MPANs", calibrated to ~GBP 250m a year of electricity theft.
    basis_low: >-
      Detected floor (derived): 15,956 domestic detections a year (same IA, 2011 questionnaire) x
      ~2-year average detected duration (TEM section 3.1) / ~27.5m MPANs (the IA's 1% implies it).
    basis_high: >-
      Derived: the default scaled by TEM upper (2,837 GWh) / the IA's implied electricity theft
      (~GBP 250m at 2013 prices, ~1.8 TWh), assuming the same per-case volume and domestic share.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: argued
      detail: >-
        Sets the stock a world-side theft draw starts from; reaches only the company's detection
        decision (no company code yet). Graded against TRAS-era investigation and confirmation counts.
    verdict: DOESNT_MATTER for pricing (argued, not run); MATTERS_AND_RESOLVABLE for revenue-protection shape

  - id: q6_theft_annual_detection_hazard
    question: Q6 read access and theft
    meaning: >-
      Detections a year / thefts in progress, domestic electricity: a stock-and-flow ratio of
      modelled figures, not an observed per-case probability.
    default: 0.058
    low: 0.035
    high: 0.10
    basis_default: Derived, Ofgem 2014 IA Table 4, 15,956 detections a year (2011) / 275,000 cases (2014).
    basis_low: >-
      Derived, TEM section 3.1: ~300,000 TRAS investigations 2014-Mar 2021 / ~7 years x 23%
      confirmed ~ 10,000 a year / 284,500 electricity cases (IA). The numerator includes gas and
      commercial, so the electricity-domestic TRAS-era hazard is lower still. With Ofgem R0173
      ("suppliers currently meet 40% of their TDIS targets") it says detection fell after 2014.
    basis_high: Ofgem 2014 IA design cap of 28,000 domestic detections a year / 275,000.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        Not a world constant once the company investigates: detections must EMERGE from the
        company's investigation choices x q6_theft_confirmed_per_investigation, and the emerged
        hazard is graded against this range.
    verdict: MATTERS_AND_RESOLVABLE

  - id: q6_theft_confirmed_per_investigation
    question: Q6 read access and theft
    meaning: P(an opened theft investigation ends confirmed theft), all lead sources pooled.
    default: 0.23
    low: 0.15
    high: 0.42
    basis_default: >-
