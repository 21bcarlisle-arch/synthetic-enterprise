    verdict: DOESNT_MATTER until a read-visit lever exists

  - id: q6_obstructive_share_of_long_unread
    question: Q6 read access and theft
    meaning: >-
      Share of 12-month-plus unread catch-ups where the supplier holds evidence of obstructive or
      manifestly unreasonable behaviour, so SLC 21BA.2(c) lifts the 12-month limit.
    default: 0.0
    low: 0.0
    high: null
    basis_default: >-
      Structural, not evidential: the exception needs the supplier's own documented access requests
      (Ofgem 5 Mar 2018 pp.9-10), and the world has no access request, so it cannot be earned.
    basis_low: Ofgem 5 Mar 2018 p.10, not providing a read is never obstruction.
    basis_high: GAP. No published share.
    feeds: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality, D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used]
    sensitivity:
      kind: argued
      detail: >-
        While 0, the Q2 invariance (21BA-barred revenue invariant in pi) holds. Any positive value
        breaks it, so the Q2 verdict must be re-run when a read-access mechanism or theft lands.
    verdict: DOESNT_MATTER while the world has no access request
