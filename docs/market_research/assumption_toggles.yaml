    read_by: company/pricing/value_based_renewal.py (RECEIVABLE_PROVISION_RATE_*, 2025 column) and simulation/arrears_engine.py::LIVE_ARREARS_PROVISION_RATES (same rows) -- neither reads the register yet
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        Acceptance criterion: the world's own book, provisioned with this row, prints coverage by method and live/final at low, default and high; W2_38 grades the world's bad-debt CHARGE against prov_charge_share_of_revenue_resi. Renewal pricing reads only the 2025 column today; a sweep on tools/assumption_toggle_sensitivity.py is owed. One supplier only.
    verdict: MATTERS_AND_RESOLVABLE

  - id: prov_coverage_prepayment_recovery
    question: Provisioning
    meaning: >-
      Debt being recovered through a prepayment meter: provision / gross balance at a year-end,
      unaged (Centrica Note 17 footnote (i), excluded from the aged table as "low residual credit
      risk amounts").
    default: 0.63
    low: 0.63
    high: 0.81
    unit: fraction of gross receivable
    basis_default: Centrica ARA 2025 Note 17 (i), GBP 65m / GBP 103m.
    basis_low: As default; 2025 is the lowest of 2019-2025 (71, 75, 68, 68, 76, 81, 63%).
    basis_high: Centrica ARA 2024 Note 17 (i), GBP 92m / GBP 114m.
    feeds: [W2_38, EP4_collections_journey, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        Today company/pricing/value_based_renewal.py and default_belief.py read prepayment as "no
        published live row" and charge nothing. This is a published (unaged) row. Whether to read
        it is the seat's call once the world carries prepayment debt (it carries none today,
        debt_and_collections.md section 7).
    verdict: MATTERS_AND_RESOLVABLE

  - id: prov_forward_looking_overlay_share
    question: Provisioning
    meaning: >-
      The forward-looking "macroeconomic provision" a supplier adds on top of its matrix (IFRS 9
      5.5.17(c), B5.5.52), as a share of its total credit-loss provision at a year-end.
    default: 0.006
    low: 0.0
    high: 0.134
    unit: fraction of total provision
    basis_default: Centrica ARA 2025, overlay GBP 11m / total provision for credit losses GBP 1,818m (derived; the overlay covers billed and unbilled debt).
    basis_low: No overlay disclosed for 2019; Centrica's 2024 report says the overlay shrinks as "the initial matrix model starting to more accurately reflect" the same challenges.
    basis_high: Centrica ARA 2023, overlay GBP 175m / GBP 1,309m (derived).
    feeds: [W2_38, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        Nothing in the code models an overlay. A company provision learned only from its own past
        collections lags a shock by construction; the overlay is how a real supplier closes that lag.
        Print the company's provision at low and high in 2022-2023 when one exists.
    verdict: MATTERS_AND_RESOLVABLE

  - id: prov_charge_share_of_revenue_resi
    question: Provisioning
    meaning: >-
      The residential bad-debt CHARGE (change in provision + write-offs - recoveries) over a year,
      as a share of that year's revenue. A ratio of two flows. A grading target, not an input.
    default: 0.022
    low: 0.011
    high: 0.031
    unit: fraction of revenue
    basis_default: >-
      Centrica UK Downstream energy supply, bad-debt charge / revenue 2019-2025: 1.2, 2.2, 1.1,
      2.1, 2.9 (2023 as restated), 2.6, 2.6%; median 2.2% (Audit and Risk Committee reports).
    basis_low: Centrica 2021, 1.1% (UK Downstream).
    basis_high: Centrica 2023 residential only, 3.1% of customer revenue (2024 Strategic Report).
    feeds: [W2_38, B11_forward_clv_backtested_on_held_back_history]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        W2_38 grades the world's charge, by year, against this band, and against its shape (a
        2022-23 rise, a 2021 low). The world's write-off-only series (0.0-14% by year on the site)
        and the ledger's flat 2% haircut are not this quantity. One supplier with a heavy
        standard-credit book; Ofgem's per-method cap allowance is context, not this ratio.
    verdict: MATTERS_AND_RESOLVABLE

  - id: prov_final_bill_default_months
    question: Provisioning
    meaning: >-
      Months after a final bill is issued at which an unpaid closed-account balance is treated as
      in default. Not the write-off date, which is later and unpublished.
    default: 9
    low: 6
    high: 12
    unit: months
    basis_default: The midpoint of the published range, not a measurement.
    basis_low: Centrica ARA Note 17 (2018-2025), "ranging from sixty days past the due date to six to twelve months from the issuance of a final bill".
    basis_high: As low.
    feeds: [EP4_collections_journey, W2_38]
    sensitivity:
      kind: acceptance_criterion
      detail: >-
        EP4 needs a dated write-off exit (collections_journey.UNREACHED_EXITS). The write-off follows
        "a period of time" after the final bill and that period is a GAP; this toggle bounds only
        the default point before it.
    verdict: MATTERS_AND_RESOLVABLE

no_toggle:
  - question: Q5 carbon
    verdict: RESOLVED
    answer: >-
      A supplier can tell its own meter removal (it orders the job; RGMA ONJOB/ONUPD to Xoserve;
      SMP status DE/EX; CSS RMP status Terminated; its own CSS deactivation) from a switch away (a
      CSS loss on an Operational RMP). Capped-in-place isolation (RMP Dormant) stays ambiguous.
    code_finding: >-
      company/carbon/half_hourly_footprint.py reads both as gas_closed; the harness shows a
      switch-away household published with net_fall True and -2,173 kg, larger than a real heat
      pump's -1,738 kg. gas_leg needs a closure cause (meter_removed / isolated / lost_on_switch)
      from the company's own registration events, and household_change must refuse net_fall for
      lost_on_switch and isolated.
    feeds: [carbon footprint (tools/generate_explore_carbon.py)]

