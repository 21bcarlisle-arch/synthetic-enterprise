# The director's priority order, expressed in the map's terms. The order and its wording are the
# director's: docs/staging/done/DIRECTOR_CANON_THE_PRIORITY_ORDER_2026-10-05.md. Which atoms carry each
# step is the delivery seat's ("how the map expresses it"), and this file is that expression.
# `tools/draw_follows_the_order.py` grades the live draw and the landed work against it.
# 2026-10-05: amended by the director's approval of SEAT_PROPOSAL_WHAT_STEP_ONE_TAUGHT_ABOUT_THE_ORDER
# (home moves and billing complaints into step 2; world debt graded before step 3's CLV; step 4 opens
# with households that respond to contact; next best action as one CLV-judged decision).
# 2026-10-24: the director's ruling (17:22) moves forward years ahead of the long-horizon levers, after the
# basics: docs/staging/advisor/done/DIRECTOR_RULING_FORWARD_YEARS_COME_RIGHT_AFTER_THE_BASICS_2026-10-24.md.
# Step 5 keeps the levers a short run can judge; the long-horizon ones (adoption, EV and heat-pump
# geography) move to step 7 behind forward years.
canon: docs/staging/done/DIRECTOR_CANON_THE_PRIORITY_ORDER_2026-10-05.md
since: "2026-10-05"
# 2026-10-26: the director's ruling (18:30, "Ok do it") puts a correctness stretch ahead of every
# remaining step from 6 on: no new feature work (forward years, the asset world, advice) is drawn until
# its exit test holds; work already landing may finish. It is held here; the draw does not read it yet.
correctness_stretch:
  ruling: docs/staging/advisor/DIRECTOR_RULING_CORRECTNESS_BEFORE_THE_NEXT_FEATURE_2026-10-26.md
  ahead_of_steps: [6, 7, 8, 9, 10, 11, 12, 13]
  work: [the Explore slots pass validity checks or are honestly empty (landed 26 Oct),
         SVT unit rates against cap and wholesale per fuel per period (cap side measured 26 Oct, at the cap),
         root causes -- life events by fuel held, prepayment billed as prepayment, the read duty bounding
         estimate runs, EV effects on electricity and normalised, storage heating and the household count,
         a domain-invariant suite written from the Knowledge pages by an agent that has not read the code,
         run over every household on every run,
         a cold reader after every publish]
  exit_test: >-
    The suite runs on the full book of a fresh run with zero unexplained breaches; all eight Explore
    slots are filled validly or are honestly empty; one cold read finds no new class of error. Reported
    in a reading, and only then is the ruled order resumed.
steps:
  1:
    name: knowledge, now and wide
    atoms: []   # knowledge pages in their own folder; drawn as Lane 0 work, not atoms
  2:
    name: unbilled energy and billing accuracy
    atoms: [W2_36_unbilled_energy_arises_the_way_it_does_in_reality,
            D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used,
            B7_customer_state_layer_moves_and_shocks,
            B13_a_dual_fuel_household_is_one_account_across_both_fuels,
            W2_37_complaints_arise_from_billing_failures_and_the_silent_unhappy_are_modelled]
  3:
    name: forward CLV
    # C9 (canon v4, 11-12 Oct): steps 3 and 5 run through one payment and debt engine; supplier
    # levers first, the world's bill-shock response before the engine is graded (ruled 12 Oct).
    atoms: [E6_a_forward_cash_forecast_per_customer_charges_expected_loss_as_arrears_build,
            W2_41_a_household_cancels_its_mandate_as_its_own_act,
            W2_42_debt_reaches_prepayment_only_by_the_legal_route,
            B11_forward_clv_backtested_on_held_back_history, EP1_clv_three_horizon,
            W2_38_the_worlds_debt_is_graded_against_ofgems_quarterly_series]
  4:
    name: per-customer decisions
    atoms: [W2_39_households_respond_to_contact_including_badly,
            C34_next_best_action_is_one_decision_across_debt_retention_upsell_and_carbon_judged_by_clv,
            C35_the_supplier_finds_the_share_of_value_it_prices_by_optimising_joint_value_against_the_households_response,
            C29_decisions_stop_being_lookup_tables, PB4_engagement_separated_from_elasticity,
            PB5_pounds_or_percent_resolved,
            B12_writer_one_reads_its_margin_on_the_unit_rate_so_a_renewal_floor_is_its_true_unit_cost,
            W3_3_the_network_charge_splits_per_unit_and_per_day]
  5:
    name: the levers, in merit order
    atoms: [EP4_collections_journey,
            C30_advice_reaches_a_household,
            W2_34_the_company_has_one_piece_of_advice_that_costs_the_customer_nothing,
            G14_half_hourly_grid_carbon_intensity_aligned_to_settlement,
            C5_key_moment_conversion]
  6:
    name: forward years, once the basics work
    atoms: [EP16_anchored_generators, SPINE_1_scenario_world_state]
    # The basics' definition of done (ruling item 2), graded by `tools/the_basics.py` in the Monday
    # step. Forward runs start when every gate atom is at its target; the lines say where the work is.
    # A line's state is read, never typed: absent if a named test is missing, partial if its atom is
    # below target, done otherwise.
    starts_when:
      gate: [E6_a_forward_cash_forecast_per_customer_charges_expected_loss_as_arrears_build,
             W2_41_a_household_cancels_its_mandate_as_its_own_act,
             PB8_a_households_payment_channel_changes_over_its_tenure, EP4_collections_journey,
             B7_customer_state_layer_moves_and_shocks, W2_40_voids_tied_to_move_outs,
             EP12_adapter_css_rec_switching,
             B13_a_dual_fuel_household_is_one_account_across_both_fuels]
      lines:
        - {basic: payment and debt, line: a failed DD is re-presented and later repaid,
           tests: [tests/simulation/test_the_dd_failure_level_reads_the_register_and_a_return_is_re_presented.py]}
        - {basic: payment and debt, line: the supplier reviews DD amounts in the run,
           tests: [tests/simulation/test_dd_review_in_loop.py]}
        - {basic: payment and debt, line: the collections desk works arrears to its journey, atom: EP4_collections_journey,
           tests: [tests/company/billing/test_dd_collections_desk.py,
                   tests/tools/test_the_household_record_shows_the_desks_collections_journey.py]}
        - {basic: payment and debt, line: a stopped DD stops the household paying by DD,
           atom: PB8_a_households_payment_channel_changes_over_its_tenure,
           tests: [tests/simulation/test_a_stopped_dd_is_paid_on_receipt_by_the_money_side.py]}
        - {basic: payment and debt, line: a household cancels its own mandate,
           atom: W2_41_a_household_cancels_its_mandate_as_its_own_act,
           tests: [tests/simulation/test_a_household_cancels_its_mandate_as_its_own_act.py]}
        - {basic: payment and debt, line: the forward cash forecast charges expected loss as arrears build,
           atom: E6_a_forward_cash_forecast_per_customer_charges_expected_loss_as_arrears_build,
           tests: [tests/company/finance/test_the_provision_charges_expected_loss_as_arrears_build.py]}
        - {basic: payment and debt, line: a dual household's credit on one fuel offsets its debt on the other,
           tests: [tests/simulation/test_a_dual_household_may_offset_one_fuels_credit_against_the_others_debt.py]}
        - {basic: dual fuel, line: the bill carries both fuels, tests: [tests/test_dual_fuel_bill.py]}
        - {basic: dual fuel, line: a dual mover's gas follows it or is refused,
           tests: [tests/simulation/test_a_dual_fuel_movers_gas_follows_it.py]}
        - {basic: dual fuel, line: a mover's final bill and the end of supply,
           atom: B7_customer_state_layer_moves_and_shocks,
           tests: [tests/simulation/test_a_movers_final_bill_is_the_exit_draw.py,
                   tests/simulation/test_a_home_move_ends_supply_in_the_run.py]}
        - {basic: dual fuel, line: one atom grades dual fuel as a whole,
           atom: B13_a_dual_fuel_household_is_one_account_across_both_fuels,
           tests: [tests/simulation/test_a_dual_fuel_household_is_one_account_across_both_fuels.py]}
        - {basic: switching, line: a loss notice reaches the company for every leg on supply,
           tests: [tests/simulation/test_registration_loss_feed.py, tests/interface/test_registration_loss_seam.py,
                   tests/company/crm/test_cos_process.py]}
        - {basic: switching, line: the company decides an objection in the CSS window,
           atom: EP12_adapter_css_rec_switching, tests: [tests/simulation/test_debt_objection.py]}
        - {basic: switching, line: a save on the loss notice, atom: EP12_adapter_css_rec_switching,
           tests: [tests/simulation/test_a_save_is_not_paid_for_by_the_stayers.py,
                   tests/tools/test_the_world_decides_who_a_save_offer_keeps.py]}
        - {basic: switching, line: a dual household switches as one with one save decision,
           tests: [tests/company/crm/test_a_dual_household_is_one_save_decision.py]}
  7:
    name: the long-horizon levers
    atoms: [C4_adoption_physics, W1_10_ev_heatpump_geography]
  # 2026-10-25: the advice roadmap after the forward years, ruled by the seat as the steer asks
  # (docs/staging/advisor/DIRECTOR_STEER_THE_ADVICE_ROADMAP_NEEDS_ITS_KNOWLEDGE_FIRST_2026-10-25.md, "Rule it").
  # The advisor's order is kept. Steps 8-12 hold no atoms yet: each is minted when its knowledge pages
  # and docs/design/PERSONALISED_ASSET_WORLD.md exist (K8). Communications stays last, renumbered 8 -> 13.
  8:
    name: the personalised asset world, drawn per home (L0)
    atoms: []   # person, then asset, then half hour: boiler, EV, PV, battery, heat pump, fabric
  9:
    name: the supplier's inference of each asset, graded against the world's truth
    atoms: []
  10:
    name: the savings grader
    atoms: []   # its first case is tariff-choice advice, which needs no asset world
  11:
    name: advice products, in the roadmap scan's order
    atoms: []   # tariff choice, data consent, Economy 7 and storage heat, prepayment safeguards, grants, settings
                # (thermostat, timer, flow temperature) under the health floor; then budget-first advice;
                # then EV, PV and battery, heat pump, fabric
  12:
    name: flexibility and the network layers (L1 and above), each with its trigger
    atoms: []   # options, not commitments; L0 (devices, cut-out amps, ENA notify-or-apply) is part of step 8.
                # L1 DFS and CM events: when an L0 smart-shift book exists to bid. L2 DNO policies, G98/G99/G100:
                # when the company sells installs. L3 local flex zones: when L2 regions are drawn. L4 rival
                # aggregators: when L1 pays households. L5 BM and load-control licence: SSES from Mar 2028.
                # Layer table: docs/design/PERSONALISED_ASSET_WORLD.md
  13:
    name: communications, sentiment and NPS
    atoms: []
