# 2026-10-26: the director's ruling (18:30, "Ok do it") puts a correctness stretch ahead of every
# remaining step from 6 on: no new feature work (forward years, the asset world, advice) is drawn until
# its exit test holds; work already landing may finish. The BUILD draw and Lane 0 refuse its held
# steps (supervisor.correctness_stretch_refusals) until `exit_met:` names the reading that met it.
# 2026-11-11: amended, not withdrawn, by his ruling (07:27, "Go ahead"): the full freeze ends, features
# get about a third (`feature_share`, read by supervisor.correctness_stretch_feature_share), correctness
# keeps first claim, the publish gate is unchanged, and the exit test is narrowed to SERIOUS classes.
# docs/staging/advisor/done/DIRECTOR_RULING_END_THE_FEATURE_FREEZE_A_THIRD_TO_FEATURES_AND_A_WEEKLY_BALANCE_REVIEW_2026-11-11.md
correctness_stretch:
  ruling: docs/staging/advisor/done/DIRECTOR_RULING_CORRECTNESS_BEFORE_THE_NEXT_FEATURE_2026-10-26.md
  amended_by: docs/staging/advisor/done/DIRECTOR_RULING_END_THE_FEATURE_FREEZE_A_THIRD_TO_FEATURES_AND_A_WEEKLY_BALANCE_REVIEW_2026-11-11.md
  # The fraction of BUILD draws taken from the held atoms below. Set to 0 to restore the full freeze,
  # e.g. while a book is refused and correctness needs every turn.
  feature_share: 0.33
  ahead_of_steps: [6, 7, 8, 9, 10, 11, 12, 13]
  # Atoms in NO step that the stretch also holds (seat, 2026-11-09). The test: it builds a new
  # capability (a use case, forward years, the asset world, advice) and corrects nothing already in
  # a book. Correctness and harness work is never held here -- a blanket hold would starve the draw.
  holds:
    G15_forward_curve_series_to_backtest_hedging_by_physics: a forward series to backtest hedging, a use case the ruling defers
    A50_the_supplier_use_case_register_is_published_with_a_status_per_item: publishes the use-case register, no book figure changes
    A51_the_plain_english_report_on_the_use_case_register_reaches_the_director: reports the use-case pulls, and depends on G15
    B8_discovered_price_sensitivity_holdout: a retention-campaign holdout, a new supplier capability
    W1_14_weather_cells_for_household_heat_load: asset-world phase 1 (step 8); its L3 extends cells to other seeds, the published book already reads its own
    W2_18_the_housing_joint_the_sample_and_the_ceiling: asset-world phase 1 of housing (step 8), new per-home ceilings
    W2_19_who_lives_where_money_and_composition: asset-world phase 1 of people (step 8), a new population model
  work: [the Explore slots pass validity checks or are honestly empty (landed 26 Oct),
         SVT unit rates against cap and wholesale per fuel per period (cap side measured 26 Oct, at the cap),
         root causes -- life events by fuel held, prepayment billed as prepayment, the read duty bounding
         estimate runs, EV effects on electricity and normalised, storage heating and the household count,
         a domain-invariant suite written from the Knowledge pages by an agent that has not read the code,
         run over every household on every run,
         a cold reader after every publish]
  exit_test: >-
    The suite runs on the full book of a fresh run with zero unexplained breaches; all eight Explore
    slots are filled validly or are honestly empty; one cold read finds no new SERIOUS class of error
    (narrowed 11 Nov). Reported in a reading, and only then is the ruled order resumed.
  # The dividing rule, applied the same way to every read. A class is SERIOUS when fixing it would
  # change money -- an amount billed, owed, paid or refunded, a balance, a payment's size or date, or a
  # P&L figure -- or a customer outcome: whether or when a dunning step, a refund, a supply event or a
  # switching event happens. Otherwise it is presentation (how a right figure is shown) or diagnostic
  # (what an internal reading reports): still fixed, still given a gate row, but it does not hold the
  # exit. A class that cannot yet be shown to leave money and outcomes unchanged counts as serious (F11).
  serious_class_rule: changes money (billed, owed, paid, refunded, a balance, a payment's size or date, a
    P&L figure) or a customer outcome (whether or when a dunning step, refund, supply or switching event
    happens); unproven either way counts as serious
