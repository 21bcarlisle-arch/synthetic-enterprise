- id: c34-s-debt-decision-cannot-be-graded
  raised: '2026-10-10'
  kind: strategy
  what: 'C34''s debt decision cannot be graded: the world answers every plan offer None (no published take-up or keep rate), no payment-method change crosses the seam, and withholding the SLC 27.8 offer
    is unlawful, so a per-customer debt rule and the flat plan rule are identical by construction on any book.'
  proposal: 'Name a curriculum world carrying a stated plan take-up and instalment keep rate, marked as curriculum and set blind to company results; the debt decision is then wired and graded inside that
    named world. Until you do, C34 stays at level 1 and the module stays in the orphan baseline. Also: tell me if a company-initiated payment-method change is a debt action a GB supplier takes at the 27.5B
    trigger; I read it as needing the household (DD mandate) or the regulated involuntary-PPM route.'
  status: answered
  resolution: 'Director, 2026-10-11T04:20Z: ''Merge debt management as a next best action with a new capability, a personal payment plan per customer, and design them as one.'' Supplier-controlled levers
    for customers already on a fixed DD (amount, review trigger, size of change, refund of surplus credit, contact timing, debt-plan terms within the rules) are tested as results now. Customer-chosen levers
    (changing payment method, seasonal plan, opt-in buffer, moving the collection date) have no published take-up, ''so run only as sensitivities across a take-up range, never as findings.'' ''Label anything
    unpublished as a toggle with a range.'' Design comes to him before it is built into the run.'
