      suspicion. The arm now receives all twenty observables, the cap binds inside its search, the
      control reproduces bit-identically, and it still loses net GBP 91,742 and GBP 110,731 of
      enterprise value over ten years. It also chooses freely on 21 of 69 renewals; the rest are
      the ceiling, the floor or the support bound. Wiring a mechanism that has been measured
      losing, whose objective is flat on the axis it is supposed to discriminate on, would push a
      worse pricing decision behind the wall for the company to rediscover.
      `active_policy().renewal_margin_arm` stays "flat_rules".
  - what: Applying the 0.204 rescale that would take the CLV gap from 2.529 to 0.806.
    why: >-
      Rejected for the third record and now on stronger ground than R12 alone: it would be fitting
      a constant in-sample to the exact comparison it is then judged by, AND it would be correcting
      a level that has since been measured as roughly right. Believed hazard 0.05 against a
      realised 0.053 over 263 decisions, and portfolio believed tenure running short of realised
      rather than long. Dividing by five would move the published gap and make the estimator worse.
  - what: Re-running the A/B again before anything upstream of it changes.
    why: >-
      It is cheap and it is the reflex, so it needs an explicit rejection. The 12:35Z and 13:58Z
      runs return identical realised figures to six decimal places -- the run is deterministic, so
      another one buys nothing until an input moves. The next re-run happens after focus item two
      changes the belief the arm maximises against, and its value is that it will be a genuine
      before-and-after rather than a repetition. Focus item one re-runs it only to populate the
      roster diff.
  - what: Explore's remaining stages with real data, the director's third console priority.
    why: >-
      Deferred a third time and I am naming the expiry rather than deferring again by reflex.
      Publishing is live, the observables fix has landed and the A/B figures are now honest, so
