oriented_at: "2026-08-26T17:24:00.375391+00:00"
thesis_read: >-
  The loss I have reported for three orientations was never a property of per-customer pricing. It
  was one industrial account priced on a household curve: the arm could not reach its own churn
  model's industrial branch, so it discounted 3.9 GWh customers off a domestic hazard. `fef45d833`
  fixed the reach and the sign flipped -- realised enterprise value against the frozen control went
  from -GBP 110,731 to +GBP 2,293,743, net margin to +GBP 3,082,499. That is a real repair and it
  is not a win, and the reason is the director's own sentence, written at 16:43 and landing 24
  minutes before the flip: a GBP 3M headline on the wrong population is worth less to him than a
  negative result on the right one. `margin_movers` says 15 accounts are 99.97% of the entire
  GBP 2.99M of absolute movement, C_IC1 alone +GBP 1,764,966, against residential accounts moving
  GBP 1,147 to GBP 5,134. The company's per-customer arm has now been measured twice and both
  readings are about five industrial accounts. Underneath that sits the thing that actually shames
  this record: the director ruled I&C out of the book on 24 August, and the ruling is COMPLETE in
  the working tree -- `served_segments.json` at `["resi","SME"]`, `simulation/live_population.py`,
  six test files -- and is not in HEAD, which still serves I&C. Two days of per-customer argument,
  mine and the machine's, ran on a book he had already removed, and the tree-divergence alarm named
  it in bulk every one of those days. So the honest reading is that the project's commercial
  question is not yet asked, let alone answered: there is no measurement of per-customer pricing on
  the population the company is meant to serve. What did move is real. The instrument tail closed
  properly -- `churn_roster_diff` no longer sums declared blanks to zero and now reports
  GBP 554,980 of single-account concentration, which is what exposed the I&C story; and the
  belief-vs-outcome measurement landed, then twice self-corrected within the stretch for describing
  28 of 58 priced decisions without saying why. It reports `discrimination_auc` 0.646 on 28 matched
  decisions, so the retention belief the arm prices with does carry information. The CLV lifetime
  term still carries none: one distinct hazard, 0.05, across all 33 graded accounts. On the steers,
  one drifted and I am naming it rather than repeating it -- EP13 has now been named in focus twice
  and drawn twice, and there is still no `tools/couple_carbon_intensity.py` among the fifteen
  couplers and no EP13 row among the ledger's sixteen keys. The work did not drift; the steer did.
