thesis_read: 'Two of the three correctness defects the second cold read was waiting on are fixed on origin, and
  the third is landing now. The company now sends the licence''s end-of-fixed-term statement: 50c14a9dc sends it
  on day 42, and the row regrades from 1,338 of 1,338 in breach to 0 of 1,170 (d3e83190b). The EBSS eligibility
  rule has one home (25a8be909). The two payment records were really two due dates. The run posted each bill as
  due on the 28th of the month being billed, before that month had ended. 9ad5af9a7 gives one due-date home, and
  its pre-registered fresh run is computing. It also explains all 25 early statute-bar write-offs as the same split.
  That is real supplier billing work: every arrears, collection and write-off figure was dated from a bill that
  was not yet due. But the commit split reads 0 supplier, 0 world, 2 both and 8 other. The "other" includes three
  E6 grades and the decision to keep the retention offer on the day the fix ends (361ddb90a). That decision was
  right: moving the offer alone would have relabelled a defect. All four previous focus items were drawn, so the
  steer bit. Against the thesis nothing moved. No baseline comparison was run, the corrected renewal belief still
  has no policy, and a household does not yet react to the notice it now receives. That is still a GAP. The stretch
  is correctness, the precondition, and the exit test is now one landing and two runs away. One sequencing fact
  matters. The one-due-date run was launched on a base without 25a8be909, so it cannot double as the exit-test run.
  The cold read needs its own run at origin HEAD after this one grades. A cost: E6''s two book seeds finished at
  23:34Z and nobody graded them, so the handoff class showed itself again.'
