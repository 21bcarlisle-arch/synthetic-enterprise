thesis_read: >-
  THE LOSS IS NOW LOCATED, AND IT IS ON THE CHURN SIDE, NOT THE CREDIT SIDE. I had that wrong. Last stretch
  I steered credit-side inference first. The console seat's probe (585ea9746) then scored rule against rule
  on three reference paths. Value against a flat level at its own median: -2,668 / -3,046 / -2,146. Letting
  the price see who pays (value minus value_blind): +147 / +213 / +291. The oracles split the remaining
  gap: perfect payment knowledge is worth +191 to +393, perfect churn knowledge +2,175 to +2,620. The company's
  believed P(stay) misses the world's with sd 0.42 per decision. It applies one price slope of 0.08 per
  +10%, against a world median of 0.036 that varies seventy-fold, and some of that variation is observable
  by payment method. So the thesis's inference gap is the churn belief. The console seat is building B8
  on the director's own instruction: per-method price sensitivity learned from the company's own closed
  renewals. The credit work was still worth doing, and it found real things. The default table is right
  on level and wrong on shape (no_debt 0.42%, worsening 5.55%, table 2.0% flat). The persistence term
  that prices every DD and standard-credit account is about 3x high (6.48 believed against 2.17 charged).
  A book-learned belief is closest in every arrears state (42b0a43f1, 28bc126f4). It sits behind a switch
  that is off by default. TWO FIDELITY DEFECTS SIT UNDER THE INSTRUMENT, and the first one bites B8 directly.
  (1) A household's payment method has two independent homes in the world, and they agree on about half
  the book (153 of 300). The triad draws the method that produces the ledger's payment events. The seam
  reports a different one to the company. B8 will key its learned slopes on the seam's method, and nobody
  has asked which of the two the world's churn response actually follows. The atom that claims this invariant,
  W2_payment_channel_dd_consistency_invariant, sits at L2. (2) The company's ledger posts one settlement
  record a month as the month's bill, so the median bill is GBP 0.023. Every absolute GBP figure, including
  the renewal's stock term, is near zero. A director ruling is also being broken on the default path. Since
  e0370bf94 a clean prepayment household is priced GBP 2.00-2.75/MWh above an identical clean DD one, and
  the control that guards the ruling is red at HEAD. The gate never selected it, because selection goes
  by module stem. THE STEER BIT, ALL THREE. The default belief landed in two commits. The September 15
  worktree was dispositioned as superseded (326dc55e9). The DD stopping rule was drawn as a Lane 0 key
  and BUILT. That corrects my PB8 routing error. But PB8 is not landed. Its holder, pid 2590080, is dead.
  Its L0->L1 edit and the code sit uncommitted in the shared tree, where the next sweep or reset can lose
  them. THE MACHINE GOT WORSE. 15 of 31 commits carried nothing, and three base-advancing surgical_land
  merges were running at the same time at orientation.
