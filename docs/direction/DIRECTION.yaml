  raised: '2026-10-04'
  kind: strategy
  what: 'Whether per-customer pricing beats a flat price a supplier could have set in advance cannot be answered on one book:
    the four probe paths share their households, and their SNR ceiling is about 0.95 however often they are re-run. Only independent
    books separate it. Varying the book seed is EP17_varied_population_draw, which is your curriculum.'
  proposal: 'Authorise book seeds 61101-61112 for EP17 by recording docs/design/curriculum/varied_population_draw_activation.json
    in the shape of population_draw_activation.json. I would run 12 books at about 36 min and 5.1 GB each, 7.2 box-hours serial,
    after the QEP refit lands, and only after a 2.4 h re-take on the default book. Projected SNR is 1.8-2.4. If you decline,
    the result stands as: not separable on this book.'
  status: answered
  resolution: 'Director, 2026-10-10: "Yes to the seed-family runner: 40-founder books settling every win, four side by side
    on distinct seeds under the box budget ... This also answers my open request on independent books (EP17, seeds 61101-61112):
    authorised under this runner. Close that concern with this ruling." Recorded in docs/design/curriculum/varied_population_draw_activation.json.'
