thesis_read: 'This stretch moved the supplier forward by one real step and exposed one real risk. The step: the DD book''s single-levy net debit at 2018-06 (-GBP 20.6k over 288 accounts,
  88% electricity) is now split into legs that sum to it (336b789fc). Most of it, -GBP 17.8k, is a company behaviour: the annual review resets to last year''s spend at last year''s prices
  and never sees the rates in force. That is the first time a billing-accuracy gap in this book has been traced to a supplier decision rather than to the world or to the levy, and it
  gives DD_seasonal_cashflow_physics a concrete L3 build. It also raised a practitioner question, and I am proceeding on the seat''s recommendation (focus three) because the rule is
  reversible and SLC 27.15 supports it. The risk: the size control landed (f235d64c8, wrong row corrected), but the file the Monday publish will read is still the double-levied 02:45
  run at 123.6 MB, written by the old code. sim-runner has yielded to resident long jobs for six hours, so unless a current run reaches the shared tree, the site quotes 10-05 figures
  for another week. That is focus one, and the miss was my DONE. The per-customer-versus-flat question did not move at all. The renewal-population item, which decides whether that comparison
  has anything to compare after 2018, was refused 26 times on a week-old draft (/var/tmp/se-legC) held by the same 370-hour worker session whose other draft (se-cap) was only cleared
  at 18:24. So the steer was drawn but walked past, and the thing drifting is not the steer, it is a long-lived session whose leases outlive its edits. Balance: 3 commits, 2 substantive,
  and the brief tags all 3 ''other''. By content, 336b789fc is supplier billing work and f235d64c8 is publish plumbing; there were no world commits. Two of three focus items are supplier.'
