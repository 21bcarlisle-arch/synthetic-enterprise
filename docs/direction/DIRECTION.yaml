  - id: the-catch-all-class-ranks-first-because-it-is-a-catch-all
    what: >-
      **Read `docs/design/CLASS_DEBT_AND_CLOSURE_2026-09-01.md` before anything and do not redo it.**
      `adf4bed6e` and `bfc43b427` wired cumulative cost into `background/class_debt.py`, and
      `background/staging_rooms.work_queue()` reads `class_debt.drawable()` for the within-band
      order.

      **(a) Close `figures_on_a_superseded_clock` first — it moved 3 → 4 instances this stretch with
      nobody working it, which makes it the fastest-accruing class on the board and still the
      smallest.** CLAUDE.md already names the rule — *every financial figure carries its clock* —
      enforced by the basis gate in `tools/generate_dashboard_data.py`. Every instance got past it
      because **the gate is keyed to that generator's own field names** and the instances are A/B
      and treasury surfaces that never pass through it. Extend the requirement **from the fields to
      the property**, and key the leg to the property, not to today's four instances: a control
      pinned to the current state goes red when the code becomes more honest. Mutation-prove with
      `python3 -B`.

      **(b) Then split `publish_gate_and_wedge`**, which stands at **55 instances against a ruling
      covering 18**. Its patterns grew it by matching **mechanisms** rather than a family
      (`\btmpfs\b|\boom\b`, `surgical_land`), so it holds two families with no shared repair — and it
      ranks first in the draw **partly because it is a catch-all**, which is the ranking being fooled
      by the thing it was built to rank. Establish the boundary by **reading the instances, not by
      pattern**. **Do not bulk-reclassify 55 archived documents on an unverified boundary** — that is
      a larger version of the defect being fixed. Split the patterns, state which instances each new
      class would claim, and move them only where the reading supports it.

      **The consolidation question is answered and stays answered.** §4 of that document rules **no
      merge**: a merged class has no single closing mechanism, and *a class you cannot close is not a
      class, it is a theme*. The warranted consolidation is a **split**. Do not re-litigate it and
      do not build a register of registers.
    why: >-
      Fourth, and reordered internally from last time because the evidence moved:
      `figures_on_a_superseded_clock` accrued a fourth instance in three hours while ranked behind a
      class fifty-five wide, which is the cost ranking's own argument for doing the small closable
      one first. It is the direct continuation of what the director asked to have built — *"cumulative
      cost should rank a class against other work in the draw"* — and the ranking's first output was
      the finding that its top class is top for the wrong reason; fixing that is what makes the
      mechanism a decision rather than bureaucracy. It also checks item two from the opposite end:
      **the shock series is a member of the superseded-clock class** — a summary computed over rows
      whose populations make the summary meaningless. It ranks last because it is machinery, and
      machinery outranking the world has been my ranking error in six of the last eight
      orientations; the one exception I am making this time is item one, and I am making it on
      thirty-one measured stand-downs rather than on a preference for mechanism. **Done means:**
      `figures_on_a_superseded_clock` either recorded closed with a property-keyed control landed and
      mutation-proven, or recorded as **not** closable with the reason; `publish_gate_and_wedge` split
      with the boundary argued from read instances and the patterns landed, no bulk reclassification;
      and the registers re-rendered so the draw order reflects it. If it produces a new register or
      an inventory, it has gone wrong.
