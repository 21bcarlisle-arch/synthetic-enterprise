focus:
  - id: focus-must-not-be-preempted-forever-by-a-self-refilling-continuation-queue
    what: >-
      Repair `background/delivery_lane.next_item` so a live continuation store cannot make the
      focus loop unreachable. Today the function returns the first unheld entry of
      `seat_continuation.live()` and only walks `direction.unreachable_focus(...)` when that loop
      yields nothing. Measured at this orientation: five live entries aged 4.1h, 3.0h, 2.1h, 1.9h
      and 0.2h against `seat_continuation.STALE_AFTER_SECONDS = 6*3600`, an arrival rate near one
      per 49 minutes, so the store empties never and the second loop runs never. Call `next_item()`
      before you start and put what it returns in the commit message; it should be
      `census-loader-sweep-continue-2026-09-05` and if it is not, say what changed and re-derive.
      DO NOT WEAKEN THE CONTINUATION CHANNEL AND DO NOT SHORTEN ITS WINDOW: it is the only channel
      that delivered anything this stretch — all eight substantive commits came through it — and
      its freshness argument in the `next_item` comment is correct and stays. What is wrong is that
      preemption is UNBOUNDED. Make it bounded: interleave, or let a continuation preempt only
      until some draw must go to the head of focus, or any shape where both stores are reached
      under a permanently non-empty continuation queue. THE CONTROL IS THE POINT AND MUST FIRE
      OVER THE WHOLE PARTITION, not on today's answer: build a store that is non-empty at EVERY
      instant across a long run of draws, and assert that the head of focus is returned on at least
      one of them AND that a fresh continuation is still returned on at least one — one assertion
      covering both sides, so a fix that simply inverts the starvation fails it too. Mutate the
      bound away and prove the control goes red. Then check `seat_executor._promote_to_handoff`
      and `hand_off_focus` on the write side and say in the commit message whether the refill rate
      is a second defect or a healthy channel that merely needs the reader fixed — state which,
      with the count, rather than fixing both blind.
    why: >-
      Because this is the channel my own steer travels down and it has swallowed six consecutive
      stretches of direction, and because it explains the apparatus error I have carried open for
      five: apparatus was never out-ranking thesis work, it was refilling the queue that preempts
      it, and a tick working apparatus writes the next apparatus continuation. It ranks above the
      atom-draw repair I put first last stretch on measurement, not preference — the atom floor
      rose 1413 to 1504 in three hours and closes the 380 to PB4 in about half a day unattended,
      while the continuation queue's arrival rate exceeds its own expiry and therefore clears on
      no timescale at all. Finished when the control above fires on its mutation and the NEXT
      orientation's `previous_focus_drawn.drawn` is non-empty. That last clause is the real test
      and it is not gradeable by the tick that does the work — so if the repair lands and `drawn`
      is still empty at the next orientation, the cause is a THIRD layer nobody has read, and
      finding it outranks everything in this file including this item.

  - id: r1-give-elasticity-observable-antecedents
    what: >-
      Build R1 — the PB4 work — as a slug, now, without waiting on focus item 1 or on the atom
      draw. Give a household's price elasticity OBSERVABLE ANTECEDENTS instead of a hash of the
      customer id, in `simulation/population_draw.py` and `simulation/customer_events.py` (PB4's
      own file scope). Start from the published record, not a shape that feels right: what
      household characteristics the evidence associates with switching behaviour — Ofgem's Consumer
      Survey engagement segmentation and the Retail Market Indicators read FROM THE DATA TABLES,
      per fuel, plus payment method, consumption band, tenure and prior switching where the record
      carries them — and file that read in `docs/market_research/` BEFORE writing the trait. PB4's
      own gain statement is the design and it is two gates, not one weight: an ENGAGEMENT gate
      (does this household look at all, and what makes it look) and, conditional on looking, an
      ELASTICITY (how far the gap moves it), with the gate taking a comparison offer as an argument
      so a responding competitor changes what is on offer without changing the decision's shape.
      HOLD THE MARGINAL DISTRIBUTION OF ELASTICITY FIXED: re-plumbing where the trait comes from is
      a fidelity correction and yours; changing how many households are highly elastic is
      curriculum, is the director's, and is reserved. If the honest version leaves our position
      unchanged or worse, make it and say so afterwards. FILE THE PREDICTION FIRST, then re-run
      `tools/r1_inference_ceiling.py` on a book drawn after the build and publish the verdict
      whichever way it falls, beside the prediction.
    why: >-
      The thesis says the advantage must come from inference and never from access, and the ceiling
      measured on 2026-09-04 says there is currently nothing to infer: at full coverage neither
      available observable clears its own null. Until households differ for reasons a supplier
      could in principle observe, every comparison against the flat-rules baseline returns "the
      level is everything" and is right — the claim is not unproven, it is unfalsifiable, and R2 is
      bounded at the floor before a line of it is written. This is the director's first-ranked item
      and it has now gone six stretches without being touched. Finished when the antecedents are
      sourced and filed, the build holds the marginal and says so, and the ceiling re-run's verdict
      sits in the record next to a prediction written before the answer was known. A re-run that
      still reads "noise" is a complete result and must be published as one.

  - id: the-books-ceiling-is-our-serializer-and-not-the-world
    what: >-
      FIRST ACT, unchanged and still undone after three stretches:
      `tools/settlement_ceiling_probe.py` carries 226 uncommitted lines, last written
      2026-09-03T07:10 and in no commit; `git status` still shows it modified at this orientation.
      Read them, say in the commit message whether they are finished work or an abandoned attempt,
      and land or discard before writing a line beside them — do not write a second probe. Then the
      work: in `simulation/premise_population.settled_book_ceiling`, `bytes_per_record` ADDS
      `settlement_build` (363.5 B) to `run_output_serialization` (411.4 B), because the
      serialization baseline is taken after `run_settlement` returns while the settlement working
      set is still held, so one build-then-serialize process pays for both. Change the path so one
      working set is paid once — stream records out and free them as they are written, or split
      build from serialize across the process boundary — then RE-RUN the probe and let the ceiling
      fall out of the new measurement. Do not edit the number, and do not touch the 1/sqrt(n) curve
      or the null.
    why: >-
      This is what makes item 2 testable, which is why it outranks the rest. The ceiling probe is
      R1's falsifier, and its own finding says nine of the eleven observables are carried by 102
      households or fewer and that at those sample sizes it cannot tell a real effect from its
      noise floor — so a book too narrow to see an effect returns "noise" and reads exactly like an
      R1 build that failed. The width is bound at 632 accounts against a detection floor near 806
      by our own RSS accounting rather than by the world or the method. Finished when the ceiling
      is re-derived from a re-run probe and the published bound's binding constraint is something
      other than our own output path.

  - id: a46-the-priced-menu-goes-to-the-director
    what: >-
      Discharge work-item 4 of the director's canon: return R5 to him as a curriculum question with
      its cost re-measured against TODAY's book.
      `docs/design/A46_THE_PRICED_MENU_2026-08-30.md` is the vehicle and already exists — read it
      first, and note it still carries an uncommitted modification, so establish whether that is
      finished work before adding to it. Its headline column is stale in the direction of good
      news: it says that at every publish interval the number of accounts the method could actually
      price is ZERO for a structural reason, and `site/data/value_arms.json` now reports priced
      decisions against renewals offered. Re-take the menu's two columns from the live records it
      already reads (`docs/observability/book_growth_campaign.json`, the settlement ceiling slope
      artefact), state what each option costs in wall-clock and in settlement budget, carry the
      recommendation, and send it to him on NTFY as one message. Do NOT decide it: book age moves
      the P&L, which makes it curriculum and his. If item 3 has already re-run the probe, take the
      slope from that rather than from the stale artefact, and say which you used.
    why: >-
      He asked for exactly this and it is the only one of the canon's five work-items still open —
      the re-rank, the R1/R2 sequencing, the EP7–EP14 unblock and the ceiling-before-programme
      discipline all landed. It is the cheapest item here and the one where HE is blocked on US: 37
