thesis_read: >-
  In money, the thesis has not moved. The per-customer supplier still trails its flat-rules baseline by
  GBP 1.35 per household-year on A's better belief, and the mechanism blamed for it, a retention offer
  that under-values the households the per-customer view finds, is still untested. The pair-2 read that
  would test it has been possible since 17:41Z, takes minutes, and was not drawn for a third record. What
  did move is billing. The D5-on book finished on 18f201c5bf and was graded (3bf458895). It refuses on two
  named rows where the 16 Nov book refused on five. Row 4, gas and VAT held. Row 7 reads 20 against a
  prediction of 2 or 0, so that prediction is refuted, and three of its four households are leavers. The
  closing-refund row reads 24 against an exception of 23 that was keyed to one book's count. Each row has
  an owner and a queued continuation. The same grade found that settlements_behind_the_walk and
  final_month_nets never reach the run output, because annual_report whitelists its keys. So the
  18:22 record's promise that this book would "name the walk" was never possible, and that is the seat's
  error, listed below. Step 6 relaunched at 20:04:47Z with both finished pairs kept. That corrects the
  06:21 seat row. Step 6 now holds the box again, and its remaining pairs would block the next book for
  days, so this record decides the order: the next book goes ahead of step 6's later pairs. The steer is
  still drifting. Focus drew 2 of 5: the golden-set steer (d69b99e4b, 4e260bf6b, now in done/) and the
  D5 grade. Both leave focus as finished. The offer-gate item lost to continuations again, this time to
  row7 and n29, which the D5 grader queued 0.4h before this record. The fix for that ordering is undrawn
  for a third record. Another written_at-only banner landed (893a243d6). The commit split reads 0 supplier
  and 9 other, but the classifier counts the D5 grade as other. Two of nine commits were substantive, and
  both were harness. The publisher stands at 52 failures over 40.7h, and the site serves a 9 Nov book.
