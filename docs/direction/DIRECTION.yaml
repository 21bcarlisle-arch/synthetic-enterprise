thesis_read: 'The stretch removed one access crossing from the company and one double draw from the world, and the exit test
  is still not met. The crossing matters most against the thesis. c4738b64c confirmed that after an estimated run, the bill
  estimator was handed the month''s settlement kWh, which no read gives a supplier. It set 2,754 of 31,588 estimates on the
  1a02c46116 book. So until this commit, part of the company''s estimating rested on access, not inference, and any comparison
  built on those bills was flattered by it. It is fixed, with a test red on origin and a verifier PASS. The trace also showed
  that R3''s own example was the ledger printing the wrong register, not the estimator. 37abacdf4 fixes that, and fresh-run-37abacdf42
  is grading it now (at Sep 2021, against 227435c17). 558ee4624 found the world drawing every incoming occupier''s bill outcome
  twice, once for the page and once for the desk. That is 2,005 of class (d)''s 5,280 steps, and 448 of the 466 steps the
  exception had ''explained'' as a direct debit in flight. So an explained class was wrong, which is exactly why leg one must
  be graded on causes, not ceilings. Last stretch''s items 1 and 2 were drawn and worked. Item 1 is done and leaves focus,
  and its grade is the queued the-ledger-register-rerun. Item 2 continues with its named remainder. Items 3 (the third cold
  read) and 4 (EPG) were named and NOT drawn. The third read''s book finished clean at 19:42Z and has sat ungraded for 1h40m,
  so the steer is what drifted. It goes first now: it is the only route to leg three, and its pre-registration ages with every
  fix that lands after it. I said R1 was ''landing now''. It landed nothing, and its continuation is still offered. That is
  corrected in wrong. Commit split: 2 supplier, 1 world, 3 other. By content, all three substantive commits were supplier
  billing correctness; the world one was the occupiers'' payment draw, a supplier-ledger result. Machine: the shared checkout
  is 87 behind origin and every daemon runs past code. That now has a dated cost: the 2 Nov Monday note for the director is
  written only if the shared tree advances past 8b764fbdf1, and 30 contested dirty paths block the fast-forward. It enters
  focus. No job died, and one merge carried nothing. The renewal belief stays held behind the ruling.'
