focus:
  - id: the-half-hourly-shape-reaches-four-customers-of-two-hundred-and-ten
    what: >-
      Two legs. (a) Fix `simulation/weather_cell_siting.cell_matched_site`, which accepts NOTHING on
      this working tree while HEAD's artefact matches the Cornish coast to C1 — the uncommitted
      artefact that kills it is named in Part 2 of
      `docs/staging/SEAT_FINDING_THE_HALF_HOURLY_SHAPE_REACHES_FOUR_CUSTOMERS_AND_AN_UNCOMMITTED_ARTEFACT_KILLS_THE_ONE_MECHANISM_THAT_WIDENS_IT_2026-09-16.md`,
      and it is live on the shared tree so it reaches the book on any lane's next broad landing.
      (b) Then widen coverage: `sim/weather_data/` is four CSVs (C1–C4) and
      `weather_inputs._weather_source_customer_id` resolves a premise by exact `location` dict
      identity, so a customer shares a site only on a coordinate matching to the fourth decimal.
      Derive cells for the premises the eligibility pass refuses and re-run settlement. Prior draws
      exist under `the-weather-cells-reach-the-world-or-w1-14-says-why-not` — bind to the work, do
      not mint a rival.
    why: >-
      The thesis permits advantage only from INFERENCE, and per-customer demand inference reaches
      1.9% of the book: the newest run artefact carrying provenance settles 203 of 210 customers on
      `legacy_pc1_rescaled`, 3 on `hh_metered_reads` and 4 on `fabric_physics`, with 213 of 228
      premises refused for "no weather archive for this customer's location". That is the largest
      gap in the project between what we claim and what we do, and `coverage_refusals`' own
      docstring warns that a wholly coverage-refused book satisfies the provider-match control
      perfectly while the whole book stays on the shape the switch exists to replace. Finished when
      a fresh run artefact's provider table shows `fabric_physics` reaching customers the four
      coordinates do not contain, and the coverage-refusal count has fallen for a reason the
      artefact names.
  - id: the-publish-gates-own-tests-are-red-at-head-and-the-finished-repair-is-unlanded
