thesis_read: >-
  One doubt is gone this stretch, and the thesis has not moved. 90a8721db graded the s.2 published pair (a): seed
  20260724 through the re-draw harness reproduces the published 8 Oct run to the penny on every arm. So the one published
  figure was its own seed, ordinary noise, and not some state the harness cannot reproduce. Its extreme price-level leg
  came from a high CONTROL arm at that draw. Every comparison between runs can now be trusted, and nothing after the
  reset waits on it. The standing position is unchanged. There is still no evidence that per-customer inference beats
  the flat baseline: the family mean is GBP 5.24 per household-year (-3.34 to +14.35), and the live renewal belief ranks
  leavers at AUC 0.53 to 0.57. cfd82d868 wrote s.6a, the post-reset order. Candidate A, switching on the corrected belief
  (7a7ad95dc), comes first under all four churn_roll outcomes, and the grade only sets whether it runs as one draw or
  twelve. The churn_roll family is running (pid 3469089, its first pair 2h30m in) and should read about 08:00 to 09:30Z
  on 15 Nov. All three of last stretch's focus items were drawn and are met (90a8721db, cfd82d868, 06b56187b and
  b63e49b60), so all three leave focus. 16 commits, 5 substantive, split 0 supplier, 0 world, 16 other. The classifier
  calls the value-test commits 'other', but they are the supplier's thesis work, all in docs. No commit touched
  company/, saas/ or simulation/, so the freeze held. Two carried wrong rows are now corrected. The stranded
  seat-executor work is on origin by other routes: the chain died at leg 1, but 2fa5c27ac re-landed as 31a49789f and
  mechanism D as cfd1b980c. And the Monday review's section 1 now opens with the graded family. The stretch's machine
  cost was landings: the collision census took four launches because the commit gate outlasts the gap between origin
  commits. Brief readings I checked and do not act on: staging-watcher's 'absent' was deploy_restart's restart (the unit
