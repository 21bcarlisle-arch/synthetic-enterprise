  two advisor files arrived. Externals read the site tomorrow, the panel said 11 questions waited on him,
  and he ruled the four reserved questions. They outrank everything else today, and the seat has already
  split them into three claimed slices (site-steer-correctness-and-capabilities, site-steer-knowledge-and-mobile,
