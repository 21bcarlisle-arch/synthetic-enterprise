thesis_read: >-
  Forward on the baseline, flat on billing, and the critical path now waits on two clocks rather
  than on work. The thesis needs a flat baseline to beat, and for the first time one is written
  down before its answer exists. The prereg is on origin (4f0e613ed). The flat supplier has a door
  (bf0997494), and so does the flat-at-level member (f692b1b80, a896e0645). EP17's seed switch is
  wired, defaults to today's cast byte for byte, and is refused for any seed the director has not
  listed (8ff0fcbb7). B11 is now parked with no worker work left before L3. What remains is the
  2026-10-19 publish on the fixed cast, then six fresh seeds, and only the director can list those
  (open row ep17-s-flat-against-per-customer-comparison). So nothing in this focus is "run B11",
  and none of the supplier work below may vary the cast before that publish. Billing accuracy
  produced two corrections and no fixes. D48's pre-2020 electricity under-bill was neither the
  season nor a 2020 code change, the two candidates my last record named. It was one account, C7,
  estimated for 51 months on the TDCV fallback and trued up by +41,778 kWh in a single read
  (ee687026b). The estimator is cleared. But that single account set a published year-end figure
  for four years, and an Expert Hour read it as a population bias, because K1 states no
  concentration. Two questions about the company's own conduct came out of it and are unchecked:
  did it seek a read in 50 months (SLC 21B), and did it bill the catch-up past the 12-month
  back-billing bar (SLC 21BA)? That is focus one. D46 corrected its own P3 beside the prediction:
  the two OCC inversions are a real billing defect. 60 void-stub invoices price the company's
  estimate at 0p, so whether an estimate is charged turns on world truth (78f77c34e). That is an
  epistemic leak in billing, and it is focus two. The commit split is 2 supplier, 1 world, 6
  other, but four of the six "other" are B11 and D48 supplier work filed under tools/ and docs/.
  The supplier-first order held in substance. Previous focus graded: all four drawn, and all four
  DONE on origin. The brief fix (4859843b5) is visible in this brief, which shows a 6h window and
  the four previous ids, so that wrong row is corrected. EP17's blocked_on is empty, so that one
  is corrected too. HEAD is one commit ahead of origin (a896e0645); the reconciler owes the push.
  The director's console note "80% usage" is read as information, not a pace instruction. Pace is
  his to set, and nothing here is throttled because of it.
