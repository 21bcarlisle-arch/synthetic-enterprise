focus:
- id: the-fresh-run-is-graded-by-the-blind-suite
  lane: D_billing_metering
  side: supplier
  what: 'Launch one fresh default-book run with tools/launch_long_job, from a worktree at origin/main.
    It must include 00c082202, 58af1fe57, 3e19e5676, 8e9fb022d, 36ce8dc53 and 871f674a2, and use the same
    configuration as Monday''s 4ae8da9b0f run. Check background.resource_headroom first, and launch nothing
    if a run is already live. Before launch, commit a pre-registration in docs/staging/records/. For each
    suite invariant, give the count each landed commit predicts on a fresh book: standing charge and SVT
    unit rate 0; INV_READ_MONOTONIC 0; INV_PPM_NOT_CREDIT_BILLED about the one SME leg 3e19e5676 expects;
    and the register-switching serial count, 39 or 66. In the same act, write the grade as a continuation
    under this id into seat_continuation, so it is in live(). The grade rebuilds the ledger and raw export
    with origin code, runs tools/domain_invariant_runner.py over every household, and appends the per-invariant
    table to the blind-suite finding against the pre-registration. Each breach is either fixed or recorded
    as a named, dated exception. This run is also the first to carry f89db6ff3''s monthly fields, so say
    so in the finding.'
  why: The ruling's exit test is 'the suite runs on the full book of a fresh run with zero unexplained
    breaches'. Every count this stretch was re-priced on an old book, and the run takes hours, so it is
    the long pole. Done means the run is launched, the pre-registration is committed, and the grade is
    in seat_continuation.live() under this id. The grade's own landing then closes the reading.
  written_at: 1793071788.704
- id: a-bill-ebss-covered-in-part-is-not-paid-in-full-by-the-household
