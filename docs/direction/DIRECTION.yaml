version: 1
oriented_at: "2026-11-19T00:21:41.085386+00:00"
thesis_read: >-
  The thesis test read this stretch, and the news is bad and not yet clean. skip1 finished at 23:53Z and
  vts-branch-watch read it at 00:02Z (/var/tmp/vts-driver/read_threshold_skip.skip1.out). The reader exited 2,
  so it is UNREADABLE: 2 of s.12c's 9 flip renewals (SYN-2016-581 and SYN-2016-468, seed 11111) are absent or
  unlogged. The watch therefore took neither branch, which is what s.12e says to do. But the count is bounded
  whatever those two say. Of the 7 logged flips, 0 were re-offered and only 2 were even weighed under the cutoff,
  so k is at most 2. That is inside s.12e's REFUTE band (0 to 3): skipping the 0.30 cut on save odds is not the
  lever. The money agrees, and it is worse. On the value arm, skip1 minus A reads -GBP 4.57 per household-year
  (-7.26 to -2.24), and skip1 minus its twin reads -GBP 5.77, with both seeds negative. So the two switches cost
  money rather than recovering the -GBP 1.35 against the flat baseline. skip1 differs from A in two switches,
  so this cannot yet be attributed to the skip alone. skip0, the one-variable comparator, started at about 23:53Z
  (pid 341142) and reads around 12:30Z on 19 Nov. Against the thesis, then, the supplier's per-customer method
  still trails the flat rules, and the first lever the value test named has been ruled out on a bound. That is
  a step backwards in what we hoped and a step forwards in what we know. The next lever (the cut's own scale,
  s.12e as amended) is neither built nor pre-registered, so it is the work. The previous focus reached the draw
  on 1 of 3 items. D48 was drawn, and its landing ("billed equals metered on every read and only estimates carry
  a gap; the W2_30 <-> D48 shape gap is measured") is on its third surgical_land attempt now (pid 276185). skip1's
  grade was correctly not drawn because it was not ripe. KNIFE3 was not drawn at all, so that steer is drifting
  and is re-issued below. The commit split reads 1 supplier, 2 world and 7 other. The world pair is EPC-register
  work on W2_18/W2_19, which blocks no supplier result named anywhere, and the supplier side landed only C32's
  wording class. That is the imbalance the director's supplier-first order exists to stop. The post-publish reader
  red on 6af7fd0bf (3 E7 fix-to-SVT crossing bills charged above the every-kWh-at-highest-rate ceiling, plus one
  SVT rate 0.05p above the cap level) is a billing-accuracy defect with no owner, and it goes into focus. H48 moved
  0 to 3. That is harness work, and it does not move the thesis.
