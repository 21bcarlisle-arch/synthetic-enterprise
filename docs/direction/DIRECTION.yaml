thesis_read: >-
  The thesis did not go backwards this stretch, but it did not advance either: the per-customer
  arm's edge over the flat baseline is still unproven, and the one obstacle to proving it has now
  gone. Two of the three previous focus items were drawn and both finished. The third was
  correctly never drawn because its trigger never fired, and its premise is now spent. The
  +£2,464 "moved where nothing was decided" on seed 88888 was not the model. It was the harness.
  The two-seed run re-read sim/weather_world from the shared tree for every arm, and f0ba399a4
  swapped that store on disk while the sixth arm was running. The 42 premises that moved to fabric
  physics carry +£2,484 of the +£2,464 (db50d434c). The one-seed capture bills PROS-2024-0082 16
  times in every arm, and the elasticity redraw never reaches it (acb2d1732). So my framing last
  stretch, which named three candidate paths (acquisition, hold gate, unlogged renewal), was wrong
  in all three. The bisect between fcba478b7 and 5f05e0068 was chasing a commit that opened
  nothing, and it leaves focus as spent. The defect has been fixed as a class, not an instance. Each
  arm now carries a weather-store digest, and the run refuses when two arms differ (c39e01693). A
  noise floor refuses seeds that ran on different stores (e297d1169). Both controls were
  mutation-proven. What stands from the 5cbbad968 grade: 69 of the 70 priced accounts were decided
  differently, and they carry +£900 and +£1,331. But the sign tests give p=0.77 and p=0.90, so
  we still cannot tell whether the decisions made money. Two seeds were never enough power, and the
  run that settles it can now be trusted. That is item one. On the machine: the pin census landed
  (f9023293a), which closes my carried deferral row on its own terms. Every reconciler merge died at a
  1,500 s timeout, while f997f8bf7's own receipt records 1,570 s of tests. The merge budget now
  extends by the slowest incoming receipt's test leg. The census names one class-(c) path still
  holding the shared tree: a withdrawn sanity-daemon draft in background/process_manifest.yaml,
  whose bytes are preserved on origin in that result. HEAD is still 4 ahead and 38 behind. The
  reconciler is merging now from /var/tmp/se-seat-executor. That worktree carries the new budget;
  the shared tree does not. Clearing the draft is my decision, not another lane's: its content was
  deliberately withdrawn on origin (0afe22631) and its only unique bytes are preserved. It is item
  two. The director's two console questions (mode control, the Monday publish) were answered in
  SEAT_REPLY_2026-09-29 with commits d6d6a2619 and 77e9db44a, and the cadences were lifted in
  2bf220c5f. Nothing is owed him.
