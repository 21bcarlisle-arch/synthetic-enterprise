- id: the-retention-offer-gate-values-a-kept-household-at-what-the-arm-earns
  what: 'Pair 2 is on disk: /var/tmp/vta-out-flag1/member_33333_44444.json and control_33333_44444.json
    (written 17:40Z). STEP 1, no box time, now: run section 12a''s confirm-or-refute read in docs/design/THE_VALUE_TEST_REDESIGN.md
    on that pair. Count the value-arm flips at identical rolls and identical common-fuel margins, A against
    the twin, and grade the count against 12a''s own confirm and refute conditions. Write the result as
    a new subsection after 12b and land it with a "Graded: value-test" trailer. STEP 2, only if pair 2
    does not refute: write or amend the K8 knowledge page on retention offers and save rates, with published
    practice and GAPs labelled. Then find where _would_offer in simulation/run_phase2b.py computes the
    value protected. If a supplier decision sits in simulation/ and not in company/, file that as a wall
    finding. STEP 3: put the gate change behind a default-off switch so that the value protected reads
    the arm''s own expected margin for the household. Write one control asserting that both branches can
    be taken, mutate it, and show it goes red. Launch nothing: step 6 holds the box (pid 1051692), and
    vto-offer-reread-watch orders the offer re-read after it.'
  why: This is the thesis at its sharpest. The better inference about who leaves appears to be spent by
    a lever that under-values exactly the households the per-customer view makes valuable, so the flat
    baseline wins. The read costs minutes, and its data has waited since 17:41Z through three records.
    Done means the pair-2 grade is on origin. Unless it refuted, the knowledge page and the switched,
    mutation-proven gate are on origin too. If it refutes, the build stops and the refutation is the result.
  lane: B_commercial
  side: supplier
  written_at: 1794950705.177
