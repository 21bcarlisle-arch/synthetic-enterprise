      variance evaluated at the realised proportion, 200 decisions predicting 0.30 gave 0.542 on 30
      observed losses and 0.594 on zero — a belief reading MORE competitive pressure from FEWER
      departures. Caught by printing the table across real sample sizes before shipping the formula,
      not by thinking about it; evaluating under the null fixes it.
