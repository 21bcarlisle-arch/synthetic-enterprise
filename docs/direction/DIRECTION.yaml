focus:
  - id: the-tree-has-two-histories-and-every-alarm-reads-the-shorter-one
    what: >-
      **Lane 0. Make `origin/main` and local `main` one history again, and unwedge the route to it.**
      Measured this orientation, after `git fetch`: **14 commits on local HEAD not on origin, 20 on
      origin not on local.** All eight of this stretch's commits are local-only.
      **First, the publish, because it is why the fork is growing.** The refusing gate is named in
      `docs/observability/sim-runner-log.md`: the orphan-ratchet refuses
      `tools.promote_worktree_landing` as *"work that nothing runs"*. It is run — by
      `background/seat-executor.service`, committed in `0bc78cf14`, which invokes it as a subprocess
      the ratchet's import graph cannot follow. The ratchet's own message states the two legal moves:
      wire it so the runner is visible, or `python3 tools/orphan_ratchet.py --freeze` **in the same
      commit** so the decision is on the record. **Take that decision and say which and why** —
      freezing the project's own promotion route as deliberately-dormant is the flattering answer and
      is probably wrong; a subprocess-visible runner is the honest one. Then run a publish and
      confirm a commit reached origin, because the wedge detector counts refusals, not intentions.
      **Second, the reconciliation.** `python3 -m tools.surgical_land`, never `git merge`, never
      `git checkout <path>`, never `git stash` — the shared tree carries three lanes' dirt and the
      wall is not negotiable. Land the 14 local commits onto the trunk that already holds the 20.
      Where a locally-modified file turns out to be a superseded draft of what is already upstream
      (`background/fork_salvage.py` and `background/fork_reconciler.py` are both confirmed instances —
      the live-writer fix is on origin, the local edit is the earlier draft), **take the upstream
      copy and record that you did**; do not re-land a decision already taken.
      **Third, and this is the part that keeps it from recurring: nothing anywhere tells a reader
      that `git status` on this machine answers against a stale base.** One leg or one surface line
      that reads `origin/main..HEAD` and `HEAD..origin/main` and refuses to report "uncommitted work"
      without them. Mutation-prove it; if it does not fire, establish whether that is a missing test
      or an equivalence and do not assume the flattering one.
      **Fourth, grade the prediction that is already on the record.**
      `WORKER_FINDING_THE_UNCOMMITTED_GUARD_I_WAS_TOLD_TO_DECIDE_ON_HAD_ALREADY_LANDED_ON_ORIGIN`
      predicts, before anyone checked, that re-deriving the 19 `uncommitted_and_orphaned_work`
      instances against `origin/main` rather than local HEAD resolves **more than a quarter** to
      "already landed upstream". Re-derive them and write the result beside the prediction whichever
      way it falls. While you are there, the four paged reds in
      `tests/background/test_autonomous_runner.py` (usage-limit legs, RED for two consecutive
      operational-layer signals) are either this same artefact or real — establish which; do not
      carry them as "known".
    why: >-
      First, because it is the only item whose failure mode is that **nothing else in this file can
      be believed**. Seven substantive commits this stretch — the executor and its units, the handoff,
      the red-count provenance, the EAC scaling, the churn-cap rename — are in a history no other lane
      can fetch, while twenty commits of other lanes' work are invisible to every reader here. That
      is not a tidy-up: it is the measuring instrument. My own last direction ordered a worker to
      land-or-park a change that had been on the trunk for hours, and the tick spent its turn proving
      the premise false instead of doing the work — the direction was reachable at last and what it
      reached was a lie, and the lie came from this. **Done means:** one history, verified by
      `git rev-list --count` both ways reading zero-and-something rather than 14-and-20; a publish
      commit demonstrably on origin; the orphan-ratchet decision on `promote_worktree_landing` taken
      and recorded either way; one leg, proven able to fail, that stops a reader here mistaking a
      stale base for uncommitted work; and the 19-instance prediction graded in writing. **No
      register, no census, no watcher** — four instances of a class justify one leg, not a subsystem.
      If the output is a document rather than commits on origin and a failing assertion, it has not
      been done.
  - id: the-svt-route-still-cannot-see-the-market
    what: >-
      **Give `svt_inertia_hazard` a parameter the market can arrive through. The measurement is done,
      the refusal is built, and it lifts by construction the moment the parameter exists — read
      `18a09617d` on `origin/main` FIRST, because this machine cannot see it and it changes the job.**
      That commit filed three predictions before measuring and confirmed all three: Spearman **-0.26**
      between the SVT floor and the published midpoint 2017-2024 (near zero, wrong sign); at the
      **bottom** of both published bands 2022's floor is still **8.99%** against the record's
      **4.30%**, and clearing it needs the pair scaled to 0.354x where the band bottom is only 0.750x
      — so it is a mechanism result and not a constant at the wrong end; CV ratio **0.336** where the
      record swings **5.3x**. `svt_inertia_hazard(years_on_svt, segment_days)` takes nothing else,
      while every renewal-route hazard already carries `market_switching_multiplier` — the record's
      own level ratio inside 2016-2025. **Read that existing mechanism before minting a second one.**
      **Knowledge first, and the world's own source already answers it**: `svt_rates` §3 — *"customers
      did not voluntarily churn: no competitive fixed alternatives existed"*. Establish from
      `docs/domain_artefact_library/` and `docs/market_research/` what the published record says
      actually suppressed switching in 2022 — whether there were acquisition tariffs to switch *to* —
      and write it down with its source **before** any term is written. **Pre-register the predicted
      MOVE per year, never an invariance**: an invariance measured on the old code embeds the defect
      being removed, and this project has paid for that. Grade on
      `tools/departure_population.book_departure_level` — the one implementation both instruments read
      — and print all ten years at real inputs beside the prediction, not the year you aimed at. Then
      re-run the whole-book anchor re-fit and report whether the refusal lifted. **Never a widened
      band, never a clamp on 2022, and it must not finish with a fitted constant.** Two things do
      **not** happen in this commit: re-pointing
      `tests/architecture/test_switching_rate_commons.py` off its renewal-only subject (rewriting what
      a control measures inside the commit that repairs the measurement makes the move
      unattributable), and repairing `population_anchor._churn_by_year`'s blindness to 2022 by
      inserting a `sim_churn_rate` of 0.0 — that publishes a measured zero-churn crisis year; fail-close
      its five arithmetic consumers instead.
    why: >-
      Second, and it is the thesis item — the only item here that moves fidelity rather than
      plumbing. The company's advantage must come from inference about a world that can press back,
      and **61% of departures** run through a route that runs the same 0.20/0.10 through the 2020
      switching peak and the 2022 collapse alike. Every belief graded on that population this week was
      graded on a mechanism the record contradicts most sharply in the year the record makes
      unmistakable. It is also blocking real work now rather than notionally: with both routes sharing
      one anchored total they are zero-sum, so the SVT route's market error lands in the renewal anchor
      — 2023's floor consumes 12.43 of the 12.50 available and the fit returns **0.03**, near-total
      extinction of the one route the company can actually price against. And the anti-flattering
      tie-break that put the SVT floor at the top of its band **became a flattering choice** the moment
      the denominator was unioned, because a higher SVT floor now hands the company less churn on the
      route it can price. **Done means:** the record's own account of 2022 written down with its
      source before any code; the predicted per-year move filed before the run; the term landed and the
      ten-year table printed at real inputs beside the prediction; and 2022 either inside its band for
      a stated mechanical reason, **or explicitly still out with the reason named on the surface** —
      *"the world departs 12.09% in a year the record says 3%, and here is what we have not modelled"*
      is an acceptable and better finish than a number that fits.
  - id: the-published-page-must-be-rebuildable-from-the-commit-it-ships-in
    what: >-
      **Carried, still BLOCKING, and a tick is holding it — so establish the state before doing
      anything.** `seat-executor-log.md` records `RUNNING
      the-published-page-must-be-rebuildable-from-the-commit-it-ships-in` at 23:06 on `51d6159f4`,
      and two lanes drawing one Lane 0 item already happened once today
      (`WORKER_FINDING_TWO_LANES_DREW_THE_SAME_LANE_0_DELIVERY_ITEM_AND_BOTH_PRE_REGISTERED_IT`).
      Read the handoff claim/discharge record first: **if it discharged, do not re-derive** — verify
      the leg exists and is mutation-proven, and that is the whole remaining job. Also check origin
      before assuming the instance is live: `31def55aa` (*"the public page said 'verified, showing run
      X' for a month, and X is in no commit"*) is on the trunk and this machine cannot see it, so the
      finding may already be discharged upstream. What is owed either way: **run each
      `site/data/*.json` generator against the artefacts committed beside it and compare the
      population it produces to the one published** — counts, not bytes, because timestamps move.
      `customers.json` first. The finding says the leg will be red on landing and that this is a
      decision about the publish gate's blocking set; **take that decision and record it** rather than
      landing the leg unwired. His words at 19:47 settle the only judgement in it: *"if the honest
      answer is that the site shows 19, show 19 and say why it moved."*
    why: >-
      Third — a control rather than a measurement, so it must never outrank the two above, but it is
      the one instance of item one's class that is already **BLOCKING**, already on a live public
      surface, and already carries his explicit instruction. It is also the cheapest to close
      permanently: `publish_provenance`, the banner adoption control and the basis gate each check
      that a figure carries its *clock*, and not one of them checks that the figure's *input* is the
      input in the same commit. That is one missing assertion, not a new subsystem. **Done means:**
      the `customers.json` instance measured against origin and stated either way; one
      generator-versus-committed-input leg, mutation-proven, with its blocking-set decision recorded;
      and if the published book is smaller than the page has claimed, the smaller number published
      with the sentence that says why it moved.
not_now:
  - what: >-
      Reconciling the two histories with `git merge` or a fast rebase, on the grounds that 14-and-20
      is small and the tree is mostly the same code.
    why: >-
      It is the fastest route and it is the wall. The shared tree carries three lanes' uncommitted
      work right now, and `git merge` on a dirty shared index is precisely what sweeps another lane's
      hunks into a commit nobody wrote — `tools.surgical_land` exists because that has happened here.
      The cost of the legal route is minutes; the cost of the illegal one is unattributable, because
      the evidence it destroys is the evidence you would need to notice.
  - what: >-
      A census or register of every artefact and alarm computed against the stale local base — the
      full re-derivation of all 19 orphan instances plus a standing watcher over the divergence.
    why: >-
      The re-derivation of the 19 stays, because a prediction is already filed against it and an
      ungraded prediction is worse than none. The **watcher** goes: this repository has 117 harness
      atoms and 34 alarm documents as evidence of where the census instinct leads, and item one
      already ships one leg against the shape that demonstrably happened plus the reconciliation that
      removes the cause. A control that only guards our own controls is usually not worth having.
  - what: >-
      Measuring what fifty departures can resolve — the permutation sweep from chance to the 0.6091
      oracle, to establish whether 0.5482-inside-its-null means the company finds no signal or that
      nothing short of the oracle is detectable at n=50.
    why: >-
      Stays out for the same reason as last orientation and the reason has hardened, not softened.
      `18a09617d` did not merely find the SVT route insensitive to the market — it **refused the
      whole-book anchor re-fit** until the mechanism changes. Characterising the resolving power of a
      population whose departure mechanism the record contradicts, on an anchor the tree itself now
      declines to fit, would establish precisely what a broken world can resolve. Focus item two is
      what makes this question answerable, and it is cheap when it comes.
  - what: >-
      Re-pointing `tests/architecture/test_switching_rate_commons.py` off its renewal-only subject,
      and repairing `population_anchor._churn_by_year`'s blindness to 2022, alongside focus item two.
    why: >-
      Both are real and both are named inside item two as things that must **not** happen in that
      commit. Rewriting what a control measures inside the commit that repairs the measurement makes
      the move unattributable, and this project has paid for that class more than once. They are a
      separate day's work, immediately after, and they are cheap then.
  - what: >-
      Re-running the value-cycle floor decomposition against the 31 August legs — the artefact
      asserting `larger_settled_book_would_resolve_it: True` beside a `selection_sem_gbp: 0.0`.
    why: >-
      Dropped last orientation and it stays dropped, for a sharper reason than fatigue: its two legs
      were produced by different commits, and we have now established that "different commits" here
      can mean *different histories*. Re-reading it before the tree has one trunk would produce a
      third number nobody can reproduce either. It comes back the moment item one lands, at which
      point it is hours of compute already spent and a morning's read.
  - what: >-
      Giving `sim_satisfaction` a driver that income stress cannot explain — the world's service risk
      cancelled by a modulator sharing its driver.
    why: >-
      Out for the fourth orientation, on unchanged reasoning: the SVT hazard is
      `svt_inertia x action_propensity` and carries no satisfaction term, so this repair cannot move
      the route item two is about. It remains a genuine rung-3 fidelity defect blocking
      `C3_satisfaction_heterogeneity` and through it `C4` and `C5`, and it returns when the
      choice-and-channel build is genuinely next.
  - what: Starting generative futures — running the world past 2025.
    why: >-
      The prize is that a generated world is the first place the company's predictions meet something
      the model was not fitted against. It is worth nothing while the in-sample departure level reads
      out of band in eight years of ten and the tree's own refusal declines to fit the ninth. Item two
      is what makes the prize real; running futures on this world first would produce an
      unattributable result at ten times the cost.
  - what: >-
      Working the staging root down — 72 files, 47 open findings, 38 LATENT — before taking new work.
    why: >-
      An unknown share of it is the same artefact item one is about: findings about work that looks
      uncommitted because this machine reads a stale base. Sweeping the queue before the base is
      correct would archive real findings and re-file phantom ones, and the sweep is cheap and honest
      afterwards. Item one's re-derivation of the 19 is the measurement that tells us how large the
      phantom share is.
