      so leaving it is not neutral.

  - id: ten-of-eighteen-premises-get-a-climate-normal-instead-of-the-worlds-weather
    what: >-
      Make the gas/HDD leg resolve a household's sky the same way the other two legs already do.
      `sim/weather_hdd.py::_resolve_source_cid` is a string rule with no notion of location: it
      strips a trailing `g` and otherwise passes the id through, so any premise whose own id is not
      one of the four archive filenames finds no CSV and `get_hdd` silently returns
      `REFERENCE_MONTHLY_HDD[month] / 30.0` — the 1991-2020 England and Wales monthly normal, flat
      within the month and identical in every year. Route it through
      `WeatherWorldSource.site_for` / `WeatherWorld.cell_id_for`, the per-cell store the fabric leg
      and (since 2026-09-21) the demand-shape and forward-price legs both use. Where the store
      genuinely holds no cell, fail closed with a return that NAMES the substitution rather than
      returning a climatological number that reads like weather. The finding is in `docs/staging/`
      under the name on the next line, which must not be re-wrapped:
      `WORKER_FINDING_THE_HDD_LEG_IS_A_THIRD_RESOLVER_AND_TEN_OF_EIGHTEEN_PREMISES_GET_A_CLIMATE_NORMAL_INSTEAD_OF_WEATHER_2026-09-21.md`
      (BLOCKING, atom
      `W1_14_weather_cells_for_household_heat_load`) has the measured evidence: 10 of 18 premises
      affected (C5, C6, C7, C8, C9, C_IC1, C_IC2, C_IC3, C_IC4, C_IC3g), five of them in cells the
      store holds every day of; C7's annual HDD reads 1560.1 from its own cell against 2086.1 from
      the normal in 2018 (+33.7%) and 1367.4 against the same 2086.1 in 2022 (+52.6%); C1 and C7
      share a cell and sit 12-20% apart purely because one id matches a filename. Write ONE control
      over the whole partition — a premise the store has a cell for and a premise it does not, in a
      single test — because a resolver that returns the normal for everything passes every assertion
      about what the normal looks like.
    why: >-
      2022 is a fact, not a scenario, and this leg structurally cannot see it — a premise on the
      normal reads the same number in the coldest year of the record as in the mildest, so the world
      cannot press back on any inference built over it. That is the fidelity precondition, not a
      nicety, and it is now load-bearing: W2_34 moved to L2 this stretch and the advice leg it made
      live infers heat load for thirteen households. FINISHED means no premise the store holds a
      cell for reads the normal, any remaining use of the normal says so by name in its return, and
      the partition control reds when the resolver is made to answer one way for everything.

