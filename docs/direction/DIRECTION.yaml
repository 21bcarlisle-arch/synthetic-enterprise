    why: >-
      `finding_classes --check` passes, BLOCKING is 0 (21 LATENT, 23 RECORDED), and none of it wedges
      a commit. One change since last direction that resolves the loudest part rather than deferring
      it: the orphan branch `c3-shown-price-measure` is **intentionally** unmerged — C3's own
