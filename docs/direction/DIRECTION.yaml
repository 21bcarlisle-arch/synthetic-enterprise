  - id: measure-whether-the-product-gate-is-the-real-ceiling-on-the-methods-reach
    what: >-
      ANSWER THE QUESTION MY LAST THESIS READ GOT WRONG, BY MEASURING, NOT BY RELAXING ANYTHING.
      `UPLIFTABLE_TARIFF_TYPES = frozenset({"fixed", "pass_through"})`
      (`company/crm/customer_profitability.py:316`) is applied at that file's line 381 and at
      `company/pricing/value_based_renewal.py:1317`, and under it 2,490 of the 2,824 term boundaries
      the world puts in front of the value arm class `product_not_upliftable`, all of them SVT.
      Establish, on the current world and stating separately what each number counts: (a) how many
      of those 2,490 boundaries are annual decision points at which `rolls_active_renewal` actually
      decides — i.e. a household that ROLLED onto SVT mid-tenure and gets its anniversary back —
      versus stints with no decision in them; (b) whether the arm has any observable at such a
      boundary that a real supplier could act on, or whether the decline is correct because no rate
      is being struck; (c) what the decision count would be if the gate admitted only class (a),
      against the 107 decisions and 54 scored decisions the arm has today. File the answer as a
      finding with the three counts and their definitions. DO NOT change
      `UPLIFTABLE_TARIFF_TYPES`, do not build a conversion or targeting desk, and do not touch the
      arms page under this item — `docs/staging/done/SEAT_DECISION_AN_SVT_HOUSEHOLD_IS_NOT_A_DECISION_THIS_ARM_DECLINES_2026-09-07.md`
      §3 stands until a measurement refutes it, and this item is that measurement, not its verdict.
    why: >-
      The thesis needs a population of decisions large enough for inference to be distinguishable
      from noise, and `method_skill` at a concordance of 0.482 over 54 scored decisions against an
      exact two-sided null of 0.407-0.591 says we cannot yet tell whether the method carries any
      information. I told the director last stretch that the constraint was world-side and the tree
      refutes me, so the constraint is now UNLOCATED and this is the only remaining candidate that
      can be checked without building anything. It is also the honest order: last stretch's mistake
      was writing a company-side instruction before establishing whether the world could express the
      outcome, and the symmetric mistake available now is relaxing a company-side gate before
      establishing whether there is a decision behind it. DONE is: a filed finding that states which
      of (a) or the §3 decision is right, with the counts and what each one counts, and either
      refutes the product gate as the ceiling or names it as the ceiling with evidence. A
      measurement that says "the decline is correct" is a complete and valuable answer.
  - id: a-swept-claim-whose-paths-carry-uncommitted-work-is-built-unlanded-not-not-done
