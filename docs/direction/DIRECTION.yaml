- id: a-dual-household-answers-its-anniversary-offer-once
  what: 'Fix docs/staging/SEAT_FINDING_A_DUAL_HOUSEHOLDS_TWO_FUELS_ANSWER_THEIR_ANNIVERSARY_OFFERS_APART_2026-10-26.md.
    Batch 3 triage (dfd53e8bf, #5) rated it real (medium): the riding fuel leg still answers its own fix
    offer, and B13 closed at L2 with this defect open in its own comment. First read c5a3e96fee and b7b17b8bf3,
