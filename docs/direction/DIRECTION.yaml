- id: canon-d11-says-the-public-site-exists
  raised: '2026-11-19'
  kind: canon_intent
  decision_kind: strategy
  what: Canon D11 says the public site exists so that an intelligent stranger can understand the project
    and follow its progress. Your 19 Nov ruling puts poesys.net behind a login, so a stranger can no longer
    reach it. The repo and the github.io copy stay public. Page copy that calls the site public is unchanged
    until D11 says what the site is for now.
  proposal: 'Amend D11 by adding one sentence after its first: ''Readers reach it by invitation, behind
    a login. The repository and its github.io copy stay public, so the login keeps out search engines
    and casual visitors, not a determined reader.'' The rest of D11 (no house vocabulary, weekly Monday
    publish, the banner) stays as written, because an invited reader is still a stranger to the project.
    Once you agree, the machine updates the site pages that call it public to say ''by invitation''.'
  recommendation: I recommend you approve that one added sentence, and keep the newcomer test for invited
    readers.
  based_on: 57a89f463f
  status: open
  resolution: ''
  evidence: docs/design/DIRECTOR_CANON.md (D11); docs/staging/advisor/DIRECTOR_RULING_REPO_STAYS_PUBLIC_AND_THE_WEBSITE_GOES_BEHIND_A_LOGIN_2026-11-19.md
- id: the-bsc-smoothing-parameter-spar-value-it
  raised: '2026-11-19'
  kind: strategy
  decision_kind: outside_source
  what: 'The BSC Smoothing Parameter (SPAR) value: it is the one number between us and fixing the electricity
    unbilled residual, and no public source states it'
  proposal: 'Measured since (19 Nov, same book): the choice no longer turns on SPAR''s exact value.
    At every SPAR from 0.5 to 4 the blend lowers the electricity gap (0.407 today; 0.379 at 0.5, 0.289
    at 3) and leaves the E1 estimate-run guard exactly as it is (the same 8 breaches and 27 flags). Only
    from about 6 upward does it re-open breaches (13 at the limit). So I can build the D0019-shaped
    blend with SPAR as a stated range, [0.5, 3], run at both ends, with the gap published as a range.'
  recommendation: I recommend you reply with SPAR's value only if you know it offhand, and that we do
    not seek MDD access (a licence is G5). Silence now means I build the blend at both ends of [0.5, 3]
    and publish the range; the hold is beaten everywhere in it. Reply "hold" to keep the 182-day hold.
