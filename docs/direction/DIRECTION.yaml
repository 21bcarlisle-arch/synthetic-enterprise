focus:
  - id: publish-once-cleanly-and-take-the-refusal-at-the-instant-it-fires
    what: >-
      Drive one publish cycle by hand, in the foreground, from the shared tree — not on a tick.
      HEAD, the cached `origin/main` and the real remote all read `60bcdec35` right now
      (`git ls-remote origin refs/heads/main`, read-only), so the recorded `behind_origin` cause in
      `docs/observability/.publish_gate_state.json` is spent, as it was spent the last two times I
      named it. If the cycle refuses again, capture the refusal from `background/publish_cause`'s own
      observation AT THE MOMENT IT FIRES, with the `git rev-list`/`ls-remote` reading taken in the
      same second, and file that — never the cause written by the previous attempt into the state
      file. Then act on what it says rather than on what the file says. One structural suspect is
      already visible and is worth settling in the same sitting: `episode_failures` has counted 31
      refusals whose cause was, on every reading I have taken, expired before anyone read it, so the
      count measures races lost rather than publishes prevented. If the run confirms that, the fix is
      that a refusal is re-tested before it is counted and before it is notified — a spent refusal
      that pages is worse than no page, because it is what routed me into the wrong diagnosis three
      times.
    why: >-
      Everything else on this list ends at a page, and no page has changed in 32.0 hours. 31
      failures, `last_clean_publish: null`, `wedge_since` older than every commit in this stretch —
      and the single most consequential result this project has produced (the concordance falls below
      chance when departures are admitted) is sitting in `docs/observability/` where nobody reads it.
      I have named a cause for this three stretches running and been wrong three times in the same
      way, so the done-condition here is deliberately not a diagnosis and cannot be satisfied by
      having one: it is `last_clean_publish` non-null in `.publish_gate_state.json`, with the git
      hash of a publish that actually reached origin.
  - id: promote-the-09-08b-pair-and-give-the-fixed-horizon-cut-its-own-interval
    what: >-
      `docs/observability/value_cycle_ab_s1_three_arm_20260908b.json` is committed and is the only
      run on disk carrying `method_skill.survivorship` and `method_skill.fixed_horizon` as
      `available: true`. Its matching noise floor is genuinely in flight, not missing — PID 2900491,
      1h51m elapsed at 23:22Z, writing `value_cycle_ab_s1_noise_floor_20260908b.json`. When that
      file exists, promote the PAIR to the canonical `value_cycle_ab_s1_three_arm.json` /
      `value_cycle_ab_s1_noise_floor.json` paths (a file copy — `THREE_ARM_PATH` and
      `NOISE_FLOOR_PATH` do not move), regenerate `site/data/value_arms.json`, and grade
      `SEAT_PREREGISTRATION_WHAT_PROMOTING_THE_09_08b_RUN_MAKES_THE_PROOF_PAGE_SAY_2026-09-08.md`
      beside where it was written, right or wrong. One thing must be built BEFORE the fixed-horizon
      figure renders: it has four bridge legs, a `bound` and a `reading`, and no `null_95_low`,
      `p_two_sided`, `inside_the_null` or `what_it_could_have_detected`. Give it a permutation null
      computed on ITS OWN n and its own tie structure — the pounds outcome ties every zero-scored
      decision against every other, so the survivor cut's interval cannot be borrowed. Hold it with a
      door test keyed to the property and not to tonight's number: no concordance of any cut renders
      anywhere on the page without an interval computed on that cut's own sample.
    why: >-
      The page currently tells a reader two different things about one quantity — selection is
      £2,574.37 in the `realised` block and £270.21 in `current_world` — and the larger, more
      flattering one is the stale one. Behind that, the run that answers the thesis question is on
      disk and invisible: admitting the departures moves the concordance from 0.5338 to 0.4209, with
      −0.0921 of the move attributable to the population term alone. Publishing 0.4209 without an
      interval would break this project's own rule on the same page where we are correcting a
      survivor-conditioned figure, which is why the interval is inside this item rather than after
      it. Finished when the page shows ONE selection figure, the survivorship split, and the
      fixed-horizon concordance with its own bound beside the survivor one, and the pre-registration
      is graded in the record.
  - id: the-published-drop-out-prose-is-refuted-by-the-block-directly-under-it
    what: >-
      `tools/run_value_cycle_ab.py` still generates, around lines 1412, 1522, 1547 and 1553, the
      sentences "THE SAMPLE CANNOT BE WIDENED FROM THIS BOOK: {scored} is what the method has earned,
      and only a larger settled book adds to it", "THE SAMPLE CANNOT BE WIDENED BY ..." and "the
      concordance genuinely needs it" — and the SAME artefact's
      `method_skill.survivorship.reading` says "A LARGER BOOK DOES NOT FIX THIS: the same share
      leaves at any book size." Both strings are live in `site/data/value_arms.json` today. A re-run
      is hours and the 09-08b run predates any fix, so compose the published sentence in
      `tools/generate_value_arms_data.py` FROM that artefact's measured `survivorship` counts rather
      than passing the runner's inlined string through, and make the runner derive its own version
      too so the next run does not reintroduce it. Keep the wrong sentence in the source beside its
      refutation as a comment if that helps the next reader; do not keep it in the feed.
    why: >-
      This was previous focus item three, named and never drawn. It is a false cause published on the
      flagship page and it is the expensive kind of false: it points a reader at the one remedy that
      cannot work, telling them to wait for a bigger book when a bigger book drops the same share.
      Finished when no live sentence in `site/data/value_arms.json` describes the drop class as a
      sample-size bound, and the replacement is computed from the run's own split rather than
      written.
  - id: is-the-observed-effect-attainable-on-the-estimand-that-admits-departures
    what: >-
      `method_skill.what_it_could_have_detected` concludes `the_observed_effect_is_attainable: false`
      with `accounts_short: 174`, and every number in it is computed on the SURVIVOR cut: a scale
      constant of 0.663 measured from that cut's permuted interval, over 86 scored decisions, against
      a `settled_book_ceiling` of 632 accounts whose `what_binds` names "the settlement path's memory
      budget on this machine, not the world's housing stock". The fixed-horizon cut scores 161 where
      the survivor cut scored 86, on a different outcome. Recompute the whole block on the
      fixed-horizon estimand's own null and say plainly, in the feed, whether the effect it reads is
      attainable at the ceiling. Then, separately, test the ceiling itself: it is asserted from a
      machine limit, so measure the two per-unit costs behind
      `simulation.premise_population.settled_book_ceiling` at real inputs and print the table before
      concluding anything, because a limit that is really about this box is not an epistemic bound
      and must not be published as one.
    why: >-
      This is the thesis's own testability and nothing else on the map answers it. If no book we can
      afford can read the effect, that sentence is the most important thing this project could
      publish and it belongs on the page in those words. If the fixed-horizon cut's larger n makes it
      readable, then the instrument works and the question becomes what it says. Either answer is
      worth having and the current one is neither, because it was computed on a different estimand
      and inherited unchanged. R12 binds throughout: this is a bound on what the instrument can see
      and never a book size to grow towards — a book enlarged until the arm returns a direction is
      the failure the block was written to refuse.
