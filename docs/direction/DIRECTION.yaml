    with how a supplier applied the EBSS credit to a bill it covered only in part, and mark what is unknown
    as GAP. Then, in tools/generate_billing_ledger.py and company/billing/raw_account_export.py, net the
    scheme credit on a part-covered bill. The household''s payment becomes the bill less the credit, and
