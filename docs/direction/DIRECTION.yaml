thesis_read: >-
  The book now holds households GB actually has, and the published run will carry it. That is the
  stretch's result, and it is a precondition rather than progress on the thesis. The dual-fuel
  correction (c136809f5, 01:14Z) is on origin before the 19 Oct publish: drawn founders open 220
  homes, 73.6% dual and 83.6% on gas, against the published 72-90%. The previous record predicted
  about 220 and about 74%. The collections-journey test is green on the landed code (0697a37a8).
  The live book now draws 788 supply points in 447 households, 341 of them dual. Two supplier doors
  followed. C35 now decides a dual household once instead of per leg (d96d33f3d). Per leg, it
  charged a household two retention rises for one advice benefit, leaving it GBP 55.8 worse off at
  the median legs. The SLC 21B.4 read instruction now reaches the published run (301ab175b), and
  its switch-on predictions at both access ends are filed. Both doors default off. So, against the
  thesis: the supplier has more correct per-customer doors than a day ago, and the published run
  still makes no decision from inference, because none of them is switched on. The baseline
  comparison has not moved either: EP17 still waits on the director's seed row. The census in
  d96d33f3d also shows that every other customer route still decides per leg: the save on a loss
  notice, renewal pricing, the DD review, collections and the move-with-us offer. Those routes are
  this focus. Nothing went backwards. Balance: supplier 1, both 1, world 1, other 4. The world
  commit was the director's rung-zero book correction, and the B7 page is world knowledge. All
  three previous focus items were drawn and landed, so all three leave focus, and the three wrong
  rows they carried close below. Tick mode is slow until 2026-10-19T03:00Z: worker-tick spawns at
  most every 4h. The focus is therefore three items, each finishable in one tick without a full run.
  The sim-runner's run at 316fbe5cd (pid 2603248, 51 min in) is the first on the dual book. It also
  carries the held-estimate fix, so its figures move on several variables at once. Only the book
  census can be attributed to the book alone. That is why item 1 files the supplier figures'
  predictions before anyone reads that output. The C34/C35/B11 figures carried in the seat's own
  wrong row are re-counted from it after the publish, and that row stays open until they are. The
  BLOCKING crisis bad-debt finding is unchanged; its cause's build is the first world change after
  the publish. naive-organ has been quiet for 5h14m while the other seven daemons wrote within 3h,
  so this is not a frozen guest. A new LATENT alarm (supervisor granting turns, HEAD red register 15
  owed) is noted and not worked under slow mode.
