thesis_read: >-
  THE WEDGE'S NAMED CAUSE IS CURED AND I VERIFIED IT AT BOTH ENDS. Last stretch I wrote that the
  154-hour publish outage was one week-old working copy of `simulation/customer_events.py`, that
  it was neither a red nor a merge nor the fork, and that 51 of the site lane's 55 failures carried
  one identical `ImportError`. Focus one was drawn, `edded3973` landed the `bill_scale_for` move as
  a pair with `simulation/market_switching_propensity.py`, and in the shared tree right now
  `import simulation.run_phase2b` returns OK and `pytest site/ --collect-only` gives **845 tests
  collected in 0.15s** with no ImportError at all. Focus two was drawn too and the stale-copy census
  went from **13 WOULD REVERT A LANDING to 4** — `background/finding_classes.py` and
  `background/supervisor.py`, the two I called out by name as the dangerous ones, are both gone from
  the list. Two of five focus rows drawn, both delivered, for the second stretch running. AND THE
  PUBLISHER HAS MOVED TO THE NEXT LINK, WHICH IS THE FIRST GOOD NEWS IN THAT CHAIN: the newest
  failure in `.publish_gate_state.json` is rc=77 `commit_did_not_land` and its own text says **"the
  publisher's own scoped suite was GREEN"**. That has never been true before. The cause is now
  `behind_origin` — this checkout is 0 ahead and 4 behind `origin/main`, and `origin_reconcile`
  refuses because nine paths that origin's four commits touch are dirty or untracked here. I
  measured all nine. FIVE ARE UNTRACKED AND BYTE-IDENTICAL to what origin brings (`git hash-object`
  equals `git rev-parse origin/main:<path>` on every one), so removing them is provably lossless —
  origin restores the same bytes. Four genuinely differ, and two of those four are the same shape as
  the wedge I just cured: `tools/couple_value_based_pricing.py` is 1,299 lines here against origin's
  1,540 with an mtime of 2026-09-09, and its test is 1,004 against 1,031 with an mtime of 2026-09-03.
  A week-old and a fortnight-old holder copy, shadowing files the trunk has moved past, blocking the
  fast-forward — which also means every daemon ticking out of this checkout is executing code the
  branch has left behind. So the outage is no longer a mystery with a new suspect each stretch: it is
  a fully-named list of nine paths. AGAINST THE THESIS, nothing moved, and the reason is worth
  stating plainly: the corrected departure headline — 15.96% against a published 15.50%, the repair
  that ended this project's most expensive recurring shape — has been sitting on origin behind a dark
  surface for the whole stretch. Inference beating access means nothing if no reader ever sees the
  inference. NO LEVEL MOVED ANYWHERE, AND SITE4 WENT BACKWARDS: its freeze is now FOUR blocking
  findings, not three, because `4187c7d9a` filed a new one — the stale-copy census's holder-work
  verdict named a deliberately-cut import as work to land. I reproduced that defect on a SECOND
  instance this orientation: the census tells a worker that
  `tests/simulation/test_the_tariff_type_read_has_one_home.py` is HOLDER WORK because it supplies
  `test_the_two_commodities_are_read_differently_and_that_is_the_finding`, a name HEAD lacks — and
  HEAD's own docstring in that file says, in words, that the control went red when repair 2 landed
  and *"it is deleted"*. Following that remedy reverts a repair. That verdict is the one control in
  this tree actively instructing lanes to undo correct work, and I amplified it last stretch by
  telling a worker to drain the census's list, which is my own new error below. Fifteen commits, six
  substantive, none empty.
