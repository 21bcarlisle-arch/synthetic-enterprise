focus:
  - id: the-world-departs-out-of-band-in-every-year-of-the-record
    what: >-
      **Re-fit the departure level anchor so the world's expected departure rate lands inside the
      published GB band, and let the strict xfail flip.** Start from the measurement; do not
      re-derive it. `PYTHONPATH=. python3 tools/measure_departure_level.py` prints, at HEAD today:
      renewal route **OUT OF BAND in 7 of 7 years that have a reading** (2022 has zero renewal
      decisions and is named, not dropped), whole book **OUT OF BAND, high, in 8 of 8**, 2017–2024
      mean expected **22.35%** against a published midpoint of **17.20%**. Four acts, in order.
      (a) **Clear the red in front of you first.** `tests/architecture/test_switching_rate_commons.py`
      — the file this work must edit — is **green at HEAD and red in this shared tree**:
      `test_every_document_this_file_cites_is_a_document_that_exists` fails because three findings
      have been **deleted from `docs/staging/` without being committed**, with untracked copies in
      `docs/staging/done/`
      (`WORKER_FINDING_THE_BAND_CONTROL_IS_GREEN_ON_A_POPULATION_THE_BAND_IS_NOT_ABOUT_2026-08-31.md`
      and two siblings), so the xfail reason's citation resolves nowhere. Land the archive move and
      the citation update **in one commit**; committing the move alone reds the control for every
      lane.
      (b) **Re-capture, then re-fit with `tools/fit_year_level_anchor.py`.** The anchor is fitted on
      a captured run and the current capture is 148 renewals — thin. Re-capture before fitting, and
      say how many decisions the new fit stands on.
      (c) **Read the margin, never the verdict — the instrument says so itself.** Its resolution is
      −15.90 to +9.70pp; a year whose room above is 0.00 exits its band on any upward move at all,
      which is a property of the fit and not a finding about the world. 2020 (out by 15.9pp) and
      2017 (out by 1.10pp) are not the same claim and must not be reported as one.
      (d) **Re-register the trap detector in the right direction BEFORE the run.** §8 prediction 3
      of `docs/market_research/gb_switching_rate_denominators.md` says any headline company result
      improving after the change is a defect in the change. It was written for a move that *raises*
      churn. This move *lowers* it toward the record, so the book gets easier to hold and that
      detector fires on a correct change. Write the replacement prediction down first, with the
      direction and rough size you expect the book to move, and grade it beside itself afterwards.
      A prediction filed after the answer is not a prediction. **Decide the fit blind to company
      results** — this is baseline, not curriculum, and the level comes from the published record.
    why: >-
      "There has to be a BASELINE to beat — the same book run by a supplier applying flat rules with
      no per-customer view — or 'it performed well' means nothing," and "the world must be able to
      defeat the company." Both are being measured right now inside a world that departs 1.3× harder
      than the GB record in every year the record covers. Every advantage figure we publish, the
      £157,913 against £153,245 included, inherits that. This is not a new question needing a new
      instrument: it is measured, the tooling to fit it exists, the remedy is written in the anchor's
      own docstring, and a strict xfail is already waiting to flip. It is first because everything
      else in this file is a claim *about* results this makes trustworthy or not. Finished when
      `measure_departure_level.py` reports the years in band with their per-year margins stated, the
      whole-book xfail has come off because it XPASSed, the re-registered prediction is graded beside
      itself whichever way it went, and `knowledge_map.md:114` says what is now true.
  - id: SITE13_the_baseline_comparison_carries_its_bound
    what: >-
      **Put the bound on the published baseline comparison, on the rendered page.** Measured, not
      assumed: `/capabilities/` renders the error bar well already — "Read the error bar before the
      number", the spread at 1.42× the estimate, and which figure the band belongs to, all of it
      served. What is absent is the other bound. `react`, `flat rules`, `internal polic` and
      `opponent` return **nothing** across `site/data/capabilities_door.json`, `site/data/method.json`
      or the page's own markup. The sentence C2 requires — that this compares **two internal policies
      in a market that could not react to either**, which makes it a valid internal comparison and
      not evidence about a supplier's performance — is nowhere a reader can see it. Write it into the
      generator, publish, and then **fetch the served artefact and assert the sentence renders**, not
      that the generator emits it. If item 1 has landed by the time you take this, the bound must
      also say which world the comparison was run in; if it has not, say that the world's departure
      level is under repair and cite the measurement. Do not soften it into a footnote — "we cannot
      yet tell you what this is worth against a real competitor" is a result and belongs on the
      surface.
    why: >-
      An unbounded comparison published under Poesys's name is a claim the evidence does not carry,
      and this is the correction of one rather than a new claim — retractable by construction, so it
      is mine to make and not reserved. `SITE13` sits at level 0 with a planned 2 and is the atom
      that exists for precisely this, so it moves a level rather than tidying. It ranks second only
      because item 1 changes what the honest bound has to say. Finished when the reaction bound
      renders on the live deployed page, verified by fetching it, and SITE13 carries the level its
      evidence earns.
  - id: the-false-licence-citation-is-still-served
    what: >-
      **Finish the SLC 27B correction. It did not land last stretch, it was never drawn, and the
      count in the previous direction was short again.** `git grep -n "SLC 27B"` at HEAD returns the
      correct negation in `company/billing/dd_review.py:17` and `dd_review_runner.py:50`, and the
      claim still asserted **as fact** in **six** places, not the five previously named:
      `docs/design/simplifications/DD_seasonal_cashflow_physics.yaml:5`, `docs/PROJECT_OVERVIEW.md:5451`,
      `docs/claude/phase-history.md:591`, `docs/design/M2_PAYMENTS_AUDIT_DD_RAILS.md:15`, and
      `docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md` at **2908, 3648 and 4014** — the last of
      these missing from both previous counts. The first reaches a reader: its text is served verbatim
      and `27B` is in `site/data/simplified.json` on origin today. Replace each with the established
      position — the duty is **SLC 27.15**, the ±5% band is a modelling convention of ours, and there
      is no SLC 27B — citing `docs/market_research/what_a_supplier_holds_to_size_a_direct_debit.md`.
      **Do not simply delete the string**: check what replaces it says the right thing, and verify on
      the served artefact after a publish. **Take the count with `git grep -c` and paste the number**,
      because this figure has now been undercounted twice by greps whose exclusions were never stated.
      Leave the occurrences in `site/data/delivery.json` and this file alone — those are the record
      quoting its own correction.
    why: >-
      One legal claim, eight implementations, corrected in two, and this is the third consecutive
      direction to name it. It is a false statement about the law published under the company's name,
      which is the category we hold ourselves careful about, and it is the exact one-rule/many-
      implementations shape `CLAUDE.md` holds up as this project's most expensive recurring defect
      with the VAT rule as its evidence. It ranks third because it is cheap and bounded, not because
      it is small — but it has now survived two stretches of being ranked third, which is itself the
      argument that whoever takes item 1 or 2 should finish this in the same pass rather than leave
      it to be ranked third a fourth time. Finished when all six source files carry the SLC 27.15
      wording, the grep count is pasted, and `27B` does not appear in `site/data/simplified.json` on
      origin.
not_now:
  - what: >-
      Moving `D_opening_dd_seasonal_sizing` up the maturity map to record the two-arm comparison, the
      precedence repair, the treasury clock and the published arms surface — four substantive landings
      on one atom in one stretch, and its level did not move.
    why: >-
      It genuinely deserves a move and `CLAUDE.md` says to prefer level changes over tidying, so this
      is the closest call in this file. It loses because a level is a claim about a program, and item 1
      says the world those results were measured in is out of band in every year of the record. Moving
      the atom now would declare the DD organ proven against a world we are three acts from admitting
      was wrong — the same mistake as promoting it to level 1 for being on the route, which is the
      first `wrong` entry of the previous direction. It moves after item 1, on the re-fitted world,
      and then it moves on evidence rather than on effort.
  - what: >-
      Giving `BASIS_ORDER`'s excluded rungs a caller — supplying a customer declaration at
      registration so `CUSTOMER_DECLARED` becomes reachable, as §7.3 of the opening-DD finding invites.
    why: >-
      The module already says the right thing: a declaration is a **world gap**, reachable in principle
      and absent in fact, and it returns to `BASIS_ORDER` on the day the registration flow carries one.
      That is a fidelity decision for the world side, taken blind to company results — so it belongs in
      a world change with its own evidence, not bolted on to make a precedence look deeper. And the
      standing prize is small: 142 of 142 estimated accounts resolved on `registry_eac` and every one of
      the 82 refusals failed for **no published rate**, not for want of a consumption basis. A
      declaration would have changed nothing for any account in this book.
  - what: >-
      Researching a published GB domestic rate before January 2019, which would lift the 82 fail-closed
      refusals — **46% of the DD book** — that currently have no annualisation basis.
    why: >-
      The most tempting new work in the stretch and the one I most expect to be picked up by mistake.
      It loses on sequence, not on merit: it is a knowledge-layer question (pre-cap, there was no single
      published GB rate — there were Big Six standard variable tariffs and Ofgem's own average-bill
      series, and which of those is the honest anchor is exactly the kind of question that must be
      established rather than picked). Doing it now would widen the book's coverage at the same moment
      item 1 changes the world that book runs in, fusing two subjects and making the next movement
      unattributable. The fail-closed refusal is working correctly meanwhile: 82 accounts declining with
      one named cause is the honest `None`, not a defect bleeding value.
  - what: >-
      Sweeping the staging root — 87 live documents, 39 LATENT findings, the 2022 anchor cluster, and
      the ungraded preregistrations from last night.
    why: >-
      Rejected again, and zero BLOCKING findings still means nothing here holds a landing. But the
      rejection is now **partial**, and that is the change: item 1(a) requires committing the three
      band-control findings whose uncommitted deletion is arming a red in this tree. That much of the
      sweep is not bookkeeping, it is clearing an obstacle in front of the first item. The other 84
      documents wait.
  - what: >-
      Writing a fourth and fifth focus item, and building anything that watches for stale rows in the
      knowledge map after the `knowledge_map.md:114` staleness found this morning.
    why: >-
      On the first: three was right and the evidence improved — the machine landed 2 of 3 last stretch
      against 1 of 4 the stretch before, with every draw still arriving through `lane_0` and none
      through the atom channel. Three ordered items is the honest read of that capacity; four would
      dilute the record of what I judged mattered. On the second: a watcher over the knowledge map is a
      control guarding our own controls, the shape `CLAUDE.md` names and this file has now rejected in
      four consecutive stretches. The map row was caught by following a thread from one constant, which
      is the method that is supposed to catch it, and item 1 repairs the row itself.
