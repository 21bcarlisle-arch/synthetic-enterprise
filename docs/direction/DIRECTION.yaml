  - id: the-worlds-service-risk-is-cancelled-by-a-modulator-that-shares-its-driver
    what: >-
      **Lane 0. Repair downward at the individual model, which is what the canon requires of a
      rung-3 failure — not a re-tune of the multiplier.** `WORKER_FINDING_THE_WORLDS_SERVICE_RISK_IS_
      CANCELLED_BY_A_MODULATOR_THAT_SHARES_ITS_DRIVER_2026-08-31.md` measures it: realised churn runs
      **0.243 / 0.200 / 0.083** across low / moderate / high income stress — backwards —
      `corr(sim_dissatisfaction_response, sim_action_propensity) = −0.5188`, and the term alone reads
      **0.3806 inside a null of [0.3794, 0.6206]**, on the wrong side of chance by an interval that
      cannot yet call it. The cause is structural: `simulation/sim_satisfaction` builds satisfaction
      from income stress, bill shocks, tenure and payment channel, and `action_propensity` is income
      stress × tenure. **The world damps a risk it also generates.** The repair is to give
      satisfaction a driver income stress cannot explain — service failures, contacts, complaints —
      and it is **knowledge-first, not a chosen number**: establish from the published record (Ofgem
      complaints data, Citizens Advice supplier ratings, the commons in
      `docs/domain_artefact_library/`) what a domestic book's service-failure rate and its
      distribution across households actually look like, and through which channel a supplier sees
      it. If nothing establishes it, that is a finding and the code carries the gap — an honest
      `None` with a named reason, never a plausible dose. Pre-register what the repair must show
      **before** running it, as the satisfaction-continuity work correctly did, and score the
      predictions against the result whichever way they land.
    why: >-
      Third, and it is the only item here that changes the WORLD rather than measuring it. It ranks
      below the two measurements because the last repair in this exact place was predicted to buy
      rung 3 and bought **0.0000** — making the satisfaction response continuous moved ties from
      92.0% to 0.2% and moved the whole-book reading from 0.6760 to 0.6760 — so acting on a causal
      story ahead of a measurement is precisely the error this stretch already paid for once. It
      ranks this high because it is a genuine fidelity defect with a real-world referent that is not
      in dispute: dissatisfied customers switch MORE, financially stressed customers switch LESS,
      these are different axes in the world and one axis here. **C4_adoption_physics and
      C5_key_moment_conversion both depend on `C3_satisfaction_heterogeneity`**, so every advice and
      channel result the next month produces would be graded against a world that rewards bad
      service. **Done means:** satisfaction carrying at least one driver that income stress does not
      generate, sourced or explicitly declared unsourceable with the gap in the code; the
      correlation with `action_propensity` re-measured and reported whichever way it moves; the
      realised-churn-by-stress-tier table re-run and published beside the old one rather than
      replacing it; and — if the repair does not move the reading — that stated as plainly as the
      last one was, because a second null result here is itself worth knowing.
  - id: churn-has-no-rung-0-and-no-legal-way-to-refit-its-level
    what: >-
      **Two halves of one gap, both knowledge-first, both about the LEVEL rather than the
      discrimination.** (a) **Rung 0 does not exist for churn.** The canon's rung 0 is a wide
      feasible range from published evidence, outside which the world is wrong and the run fails —
      *"wide on purpose: this rung stops crazy answers; it does not tune."* The only control on the
      departure level is the rung-1 band, 0.6pp wide in 2016, and it is doing both jobs, so a world
      that moved to a **defensible but different** level and a world that went **insane** fail
      identically. C3 proved it on real numbers: a +0.11pp move that shifted **zero** departures
      "left the published band", and so would a move ten times larger. Build the wide range from the
      published record's own extremes across a longer window and comparable markets — **never by
      widening the band we have.** (b) **The year anchor now has no legal route to be re-fitted.**
      `fit_year_level_anchor` correctly REFUSES to emit a `YEAR_LEVEL_ANCHOR` block off a population
      that is not the book, so the world's level is held by ten numbers solved against a run where
      the renewal roll was the only way out, on a population that has since lost 69% of its rows.
      What is owed is the finding's own item 1: **a whole-book departure target both routes are
      fitted against together.** Capture → refit → capture, across both routes, never a widened band
      and never scaling the aggregate — or the anchor declared unfittable with the reason on the
      surface, which is a legitimate outcome and better than a refit onto the selected subset of
      households that reach a renewal roll.
    why: >-
      Fourth, and the ranking is a judgement I want on the record because it contradicts the obvious
      reading of the canon. The canon names the year anchor as top-down debt and it IS debt — but
      the measurement says a 20× sweep of it moves rung 3 by **0.002**, so repairing it and
      expecting the company results to move would be a prediction made against a measurement that
      already exists. It is a **level** problem, not a discrimination problem, and the level problem
      is real: without rung 0 no level change anywhere in this world can be **sized**, which is why
      the departure-level control has no headroom above and cannot express an upward change at all.
      That blocks generative futures more than the anchor does — past 2025 every year returns the
      same numbers forever, and a frozen world with no wide range around it cannot be told from a
      broken one. **Done means:** a wide feasible range for domestic churn sourced from the published
      record and landed as a rung-0 control that fails on absurdity and stays quiet on defensible
      difference; and the whole-book target either existing so the refit can run across both routes,
      or the anchor's unfittability stated where a reader of the level meets it.
  - id: close-the-two-canon-questions-that-are-decisions-rather-than-work
    what: >-
      **Small, and it is the survivable half of the item that was never drawn last time — so it is
      written as two concrete edits and nothing else.** (a) **Register the generative-futures anchor
      question CLOSED.** The director asked on 2026-08-30 for a choice between *"preserves the
      statistical shape"* and *"honestly unanchored"* before that work began, called them *"different
      projects and I'd rather choose than drift"*, and his own canon of 2026-08-31 answers it:
      *"anchored to mechanism, validated on history where we have it, and applied where we don't."*
      Record the closure in `docs/design/WHAT_AN_ANCHOR_MEANS_BEYOND_THE_RECORD_2026-08-30.md`
      citing the canon, and carry the caveat rung 2 earned: the price mechanism holds on
      **direction** (+100.75pp / −53.99pp by price side) and is **unidentified on magnitude**
      (`_SENSITIVITY_SCALE`, flat likelihood from 0.87 down), so a mechanism-anchored future can
      hold its shape past 2025 and still be wrong by a factor of two on level. That is the caveat
      generative futures must carry, and it is sharper than "the future is unanchored". Do not
      re-open the choice. (b) **Adopt the ladder as the stated validation standard in
      `DIRECTOR_BRIEF_CHOICE_AND_CHANNEL_2026-08-30.md`**, so C2–C6 are built against the four rungs
      rather than retrofitted onto them. Two edits. Nothing else in this item.
    why: >-
      Fifth because it is decision-recording rather than measurement, and it must never outrank the
      measuring half. It is here at all because (a) closes a director-registered question that is
      currently the stated blocker on the generative-futures capability, closes it **with his own
      words rather than my judgement**, and costs an hour; and because (b) is the cheapest available
      defence against the failure the canon exists to prevent — the choice-and-channel work is the
      next large build, and a validation standard adopted before the build is worth more than the
      same standard applied to it afterwards. **What is deliberately NOT in this item, and why:** a
      machine-readable register of every world variable's rung standing. The ladder page argues
      against it and I am ratifying that argument — one variable is assessed, a second is in
      progress under item three, and building the register now would be building the watcher before
      the work, which is the habit this project has 117 harness atoms' worth of evidence against.
      **Done means:** the anchor question recorded closed against the canon that closed it, with the
      magnitude caveat attached; and the choice-and-channel brief naming the ladder as its standard.
not_now:
  - what: >-
      Publishing the difference between the ceiling (0.6760) and the company's belief AUC (0.4653)
      as the company's shortfall — the single most quotable sentence available on this board today.
    why: >-
      New this stretch and it is the sharpest trap on it, because the two numbers are now both real,
      both published, and both sitting in the same document. They are computed **over different
      populations from different runs**, and two true figures whose legs are different populations
      do not have a difference. The ladder page refuses it explicitly and I am ratifying that
      refusal as the seat's. Focus item one exists precisely to make the comparison legal; making it
      before then would be this project's most-repeated failure — a subtraction between two figures
      that do not count one entity — committed on its most important claim.
  - what: >-
      Re-running the value-arms A/B on more seeds so the ±£3,776 comes down and the selection
      contrast resolves.
    why: >-
      Carried for the third direction running and now refuted a third time, by a mechanism that the
      re-measurement made unmistakable: **the bound WIDENED 46% when it was measured properly**
      (£2,577.80 → £3,776.27). The spread is the instrument's sensitivity to the per-household
      price-sensitivity draw, not sampling error around a mean, so re-drawing the dice measures this
      spread again rather than shrinking it. The legitimate route to resolution is denominated in
      the priced count, not the seed count, and that route is focus item two. It stays on this list
      because it is the most tempting move on the board and because doing it and reporting a
      resolved contrast would manufacture the result item two exists to price honestly.
  - what: >-
      Rebuilding the year-level anchor from the individuals FIRST, on the strength of the canon's
      diagnosis that a top-down world contains no per-customer signal.
    why: >-
      The most defensible-looking move available and the measurement says it buys nothing for the
      thing it is being proposed for. A **20× sweep** of the anchor — 0.5 through 10.0 — moves the
      within-year oracle AUC across the range 0.6226 to 0.6248, and flattening it to 1.0 on the
      two-route capture moves the renewal route from 0.7412 to 0.7436. The reason is structural, not
      lucky: the anchor is a within-year multiplier and AUC is a rank statistic. Agreeing with the
      canon here would have been free and wrong. The anchor keeps its slot as **level** debt under
      item four, at the rank the measurement earns it, and any future proposal to rebuild it must
      predict a movement in something other than rung 3.
  - what: >-
      Choosing `_SENSITIVITY_SCALE` / `a_shock` to close the 99.9%-to-56.6% reason-mix interval,
      from the published mover-mix, from a prior, or from whatever makes the mix look sensible.
    why: >-
      Carried verbatim for the sixth direction running because it gets more tempting each time and
      the argument has not weakened: the population mean is reproduced exactly by every value from
      0.87 down, so the constraint cannot see the parameter and **choosing it IS choosing the
      answer**, which would then be published as a measurement of the world. The canon now backs
      this from a second direction — a mix fitted to look right is an aggregate clamped to pass a
      check. Its consequence is instead carried honestly under item five: rung 2 is established on
      direction and unestablished on magnitude, and that is the caveat generative futures inherits.
  - what: >-
      `EP13_adapter_carbon_intensity` — carbon, the second of the mission's three currencies.
    why: >-
      Deferred for the fourth direction running and the reason has changed from "the lane is busy"
      to "the lane is delivering better than a focus slot would make it". It retired its own build
      target this stretch on a measurement — *the model knows WHEN gas runs and not HOW MUCH* — and
      landed the per-fuel oracle bound and the CCGT swap ceiling with pre-registrations scored
      against them. A lane that retires its own targets on evidence does not need steering, and
      putting a second writer on its live file set is this tree's documented way of losing work.
  - what: >-
      `C31_time_is_the_currency_that_does_not_exist` — the third of the mission's three currencies.
    why: >-
      Carried, and the case for waiting is now stronger rather than weaker, which is unusual. In the
      one currency built to the end we have this stretch established that the world contains signal
      (rung 3 passes), that the money advantage is real at the headline (£12,071, clears its floor)
      and that the per-customer half of it **still cannot be resolved** and is 79% level. Opening a
      third currency at the exact moment the first one's central claim became answerable would be
      breadth bought against the only depth we have, one item short of the answer.
  - what: >-
      The unranked accretion — forty-plus documents in the staging root, the orphan-branch alarm's
      sixth firing, the undeclared-worktree alarm, and the two red controls that predate today.
    why: >-
      `finding_classes --check` passes, BLOCKING is 0 against 20 LATENT and 25 RECORDED, publishing
      is live and figures reached origin 0.9 hours ago. None of it wedges a commit. The orphan-branch
      alarm fires because it is keyed to the branch name rather than to whether the work is
      reachable — answerable rather than actionable, and re-keying it is the kind of control-on-a-
      control this project has been told to stop building. The one LATENT I am not leaving in the
      pile is the service-risk cancellation, and it is focus item three.
