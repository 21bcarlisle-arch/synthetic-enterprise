thesis_read: 'The correctness stretch made its first exit attempt and did not exit. Every fix the attempt waited
  on was graded on one fresh run at origin 1691ec0ecd. One due date took the desk-ledger split from 1,987 to 4 and
  the statute bar from 25 to 3 (1470776471), so that wrong row is corrected. The second cold read (2cf3201c5) then
  met leg one (zero unexplained breaches on 1,293 accounts) and failed legs two and three. The mover slot is empty
  by a hard-coded return None under a reason the pages contradict. The blind reader found seven new classes. The
  worst is N1: the suite grades the ledger while the page prints the invoice, so a credited 2022 bill shows no EBSS
  credit and every row stays green. That is the same failure CLAUDE.md names for undefined quantities: two records
  of one bill, and the control reads the one the customer never sees. It means leg one''s ''met'' is weaker than
  it reads, because a green suite over the wrong record says nothing about the page. The stretch also corrected
  my own cause for the five refunded leavers: the run repaid a settled gas bill on its electricity twin (f805a9483),
  not a DD balance. That fix and the part-window cut (2bef058eb) are pre-registered (753c3d874) and wait on a run
  queued behind the census. Against the thesis nothing moved, and that is the ruled order working. No baseline comparison
  was run and no policy carries the corrected renewal belief, because the director put correctness first and its
  exit test is not met. The commit split is 1 supplier, 1 world and 9 other, with 5 substantive. Every substantive
  commit was billing correctness on the supplier''s books, the gas-leg fix included, though the classifier counts
  most as other. All four previous focus items were drawn. Three landed (one due date, the cold read and the leavers''
  refund), and the fourth, reading tests/simulation whole, is landing now (surgical_land pid 748021, simsuite-whole-2cf3201c5c),
  so the steer bit. The seat''s own error, grading 1691ec0ecd before its amendment was filed, cannot now be corrected.
  Both grades say the moved rows are void, and it is folded into its class in wrong_triage.yaml. The next exit attempt
  needs N1 and the mover slot fixed, the seven classes written as rows, and a third cold read. If those fixes stay
  in tools/, the third read can rebuild the pages of the 20e7d66234 run, which is already queued, instead of needing
  a run of its own. The shared checkout is now 40 commits behind origin, and all eight daemons run code 12 commits
  old, billing code included. That does not change a graded result, because every run and grade here works from
  origin worktrees.'
