thesis_read: 'Three hours: 9 commits, 7 carrying work, and the split is again almost all ''other'' (knowledge pages, the one-work-system
  cut-over, a promotion-route fix, the bill-shock media reading). One supplier move landed: B8''s blind retention holdout
  is on origin behind a default-off switch at the power-derived share 0.272 (318d042e7). That gives the retention lever its
  own held-out twin when switched on, so the lever can sign its own effect instead of borrowing the book''s. Against the thesis
  nothing was graded and nothing moved a level. The honest standing answer is still ''not shown'': the only comparison with
  the flat-rules twin is -GBP 0.33, in-sample. The stretch''s real loss is the stayers control. The fix is built and traced
  to one channel: a saved account''s smaller bill moved the money-weighted bad-debt belief, 0.162094 to 0.166133, and that
  ratio of 1.00348 is the whole 0.35% July 2018 raise. Its 8 controls pass (/var/tmp/se-exec-stayers/control.log). But both
  landings died on avoidable mistakes. The first passed surgical_land a -F it does not accept. The second named docs/staging/done/<the
  finding>, which exists nowhere: the finding is still at the staging root on origin. So the director''s own retention condition
  is still red at origin with the answer sitting on disk. That is item 1, as a landing and not a rebuild. The replication
  child for pair 55555/66666 is at its 2025 prospect desk, about an hour late against the 15:00Z estimate and still alive,
  so items 2 and 3 stay embargoed on its file. The shared checkout is now 66 behind origin. Because of that the head-green
  census cannot test the plugin fix (4b9c82701), and every daemon runs code the branch has moved past. Last record left the
  checkout alone ''under a live pinned run'', but the pinned run executes from /var/tmp, so I now treat that caution as unverified
  and make the check itself an item. The three Lane 0 rows drawn with nothing landed: the-0-12-replication-is-read-out-of-sample
  was spent by 300302799 and eb41172a1. The B8 and KNIFE3 grades were drawn before any book carried their commits, and they
  are premise-not-ripe (their re-queued rows wait for item 3''s book). The previous focus did reach the draw: the B8 item
  was drawn and landed.'
