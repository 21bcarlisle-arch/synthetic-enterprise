      swept while no draw was ever recorded for it. Make the two stores answer the same question or
      make the sweep read the one the claim is written to.
    why: >-
      Third stretch open, and this stretch it cost a finished repair its landing:
      `the-publisher-grades-by-equality-...` was drawn 1.8h ago, recorded `not_done` with empty
      evidence, and 207 lines of its repair are in the working tree unlanded — the exact shape that
