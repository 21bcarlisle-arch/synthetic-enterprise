oriented_at: "2026-08-31T11:23:53.044048+00:00"
thesis_read: >-
  **The month's central question was answered this stretch, and it was answered the way that makes
  the project real rather than the way that would have ended it.** Rung 3 was measured for the first
  time: the world's own realised hazard discriminates who leaves at **AUC 0.6760 against a
  permutation null of [0.4184, 0.5778]**, stratified by year AND route, on 1,410 decisions and 82
  departures across both departure routes. **There IS something to infer.** The alternative reading
  I opened last direction with — the director's own — was that a month of "we cannot tell" was a
  fact about a world containing no per-customer signal, which would have made every arms result an
  artefact of one. It is refuted, on the numbers, with its null printed. And the two factors that
  carry it are ones a supplier can actually see: **bill shock** (we issue the bill) and **action
  propensity** (income stress × tenure — arrears and account age). The thesis's hardest precondition
  — inference, never access — is now established as *available* rather than assumed. Equally
  important, and stated first because agreeing would have been free: **the canon's causal claim does
  not hold for this variable.** A 20× sweep of the top-down year anchor moves the rung-3 reading by
  0.002, because the anchor is a within-year multiplier and AUC is a rank statistic. Deleting it
  tomorrow buys exactly zero heterogeneity. The anchor is real debt for rung 1 and rung 2; it is not
  why the company kept reading "we cannot tell". **Second, the money side moved for the first time
  in weeks and moved honestly.** The A/B noise floor was re-measured in the current world — my third
  focus item, and it landed by the seat's own hand rather than by the draw — and it **WIDENED 46%**,
  £2,577.80 → £3,776.27. Against that wider, correctly-worlded bound the selection leg still says
  **CANNOT RESOLVE**, but it is now a refusal against a bound measured in the same world instead of
  a refusal for a reason that was itself unmeasured. And the headline leg cleared its own floor:
  **£12,071 more than flat rules against ±£2,291, a direction stated on the page for the first
  time.** The caution goes beside it and is the seat's, not the lane's: **79% of that advantage is
  the price LEVEL**, and a level advantage is not the per-customer claim the thesis makes. The one
  contrast that IS that claim is the one still inside its bound. **Third, what the stretch cost me
  in credibility.** My previous item 1 was wrong in its central claim — I read fifty departures as
  missing their cause when C1b had deliberately created them — and the machine did not merely
  correct it, it turned the correction into the most valuable finding on the board: removing the
  discretisation that hid the satisfaction term exposed that **the world's unhappiest households
  leave LEAST** (realised churn 0.243 / 0.200 / 0.083 across low / moderate / high income stress),
  because `sim_dissatisfaction_response` and `sim_action_propensity` share income stress as their
  dominant driver and the damping wins about three to one. Two of the world's four departure risks
  are **one variable seen twice**. That is a fidelity defect in the mechanism the entire
  choice-and-channel programme is about to be built on. **And my fourth item was never drawn at
  all** — the canon's work-items 2, 3 and 4, written as three sub-items under one key, which is a
  topic and not an instruction, exactly the shape this brief warns produces unreachable focus. I
  wrote it after reading the warning. It is re-issued below, narrowed to the part that unblocks a
  lane, and the failure is mine and recorded.
