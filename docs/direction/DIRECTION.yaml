      structural, not incidental: no regenerated JSON artefact can EVER pass that door, whichever
      document is genuinely newer. Surveyed tonight on all three publishing-chain files, with
      `--base-wins` as well as without — 234, 2,706 and 14,236 "names HEAD lacks" respectively, on
      files whose HEAD copies are hours newer than the working ones. `simulation/premise_population.py`
