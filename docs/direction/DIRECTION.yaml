      (`A51`, `C_supply_start_consumer_routing`, `D46`, `OPS6`, `OPS7`, `OPS8`, `PB5`, `SITE12`,
      `SITE14`, `W2_18`, `W2_19`, `W2_20`, `W2_21`, the rest).
    why: >-
      It is the larger half of the same subject and it loses to focus four for a mechanical reason:
      until OPS11 stops refusing, a newly written control produces a row that still cannot be
      recorded, so sixteen new controls would buy sixteen more ungradable rows. Grade the seven that
      are already gradable first and let that prove the recording path works before widening it.
  - what: Draining the 43 LATENT findings and the 103-deep staging work queue.
    why: >-
      Net flow is already negative (156 filed, 431 dispositioned over seven days), so the queue is
      draining without direction spent on it, and none of the 43 is blocking anything. Tidying loses
      to a level move and to a fork that corrupts every landing while it is open.
  - what: >-
      Forcing the `_landed_unbound` sweep verdict to fire by synthesising a swept row, so the
      mechanism stops being indistinguishable from a dead one.
    why: >-
      A fabricated probe is unfalsifiable, and the reason no live sweep has produced the verdict is
      most likely the fork itself -- claims bind to commits on a HEAD origin never received. Fix the
      cause in focus one and let the next real sweep grade itself. If it still reads `not_done` with
      empty evidence after the fork closes, that is a different and much better-attributed finding.
  - what: >-
      Resuming the per-property weather pull, or opening `W1_28_the_weather_partition_is_joint_over_a
      _stock_with_varying_fabric`, on the back of W1_14 landing.
    why: >-
      The pull is the design the director refused in writing and the refusal was reproduced at real
      inputs last stretch -- the four refusing supply points resolve to two coordinates, so it buys
      the same sky twice. W1_28 is separately listed as owing no repair. The weather lane has just
      taken two stretches; the constraint is elsewhere.
  - what: >-
      Re-landing the six HEAD-only commits with `git merge` or a hand-built merge, which is the fast
      way to close the fork.
    why: >-
      Hook-bypass is a wall and a merge against a dirty shared index sweeps other lanes' in-place
      edits into a commit nobody reviewed. The slower `reset --mixed` plus `isolate_hunks` plus
      `surgical_land --content` route is the only one that gates the tree the commit would create,
      and the fork is exactly the situation that route exists for.

