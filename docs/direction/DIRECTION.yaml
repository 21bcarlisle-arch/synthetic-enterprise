thesis_read: >-
  This stretch went sideways on the thesis and decisively forward on whether we could ever tell,
  and the second is worth more than the first. Last stretch's first error is closed on evidence:
  `site/data/value_arms.json` now states the creation leg with its own live-world floor beside it —
  centre −£1,861, range −£8,634 to +£2,350, 1 of 3 re-draws clearing a £5,923 spread — against the
  single draw of +£2,177 the page publishes, with the verdict withheld in the same grammar the
  advantage leg already used. The fifth error closes with it: the level leg's share is now refused
  because its numerator changes sign (−£882 to £9,085) rather than published as 6.8%, and
  `contrast_bounds` refuses outright with the reason on the page because the floor it would come
  from names no world. Four controls carry it (`test_the_creation_leg_carries_its_own_live_world_
  bound_and_not_the_advantages`, `..._level_leg_carries_its_own_bound_measured_in_this_world`,
  `..._level_share_is_refused_when_its_numerator_has_no_sign`, `..._bound_whose_floor_names_no_
  world_is_refused_and_the_refusal_reaches_the_reader`). What that honesty now says out loud is
  that the leg carrying the thesis — per-customer CHOOSING, the only leg that can be creation
  rather than transfer — is a single draw sitting near the top of a re-draw family whose centre is
  negative. That is not evidence against the thesis. It is the statement that at 3 seeds and 120
  priced decisions out of 1,953 renewals offered — 6.1% — we cannot tell, and the page finally says
  so where a reader sees it. The transfer leg is settled in the other direction and stays settled:
  £9,497 collapsed to £159 the moment the world lets customers respond to price, which is the
  mission's first consequence arriving as a measurement. The departure surface all of this sits on
  moved too, and only halfway. `docs/reports/departure_level_rung1_verdict.json` now measures the
  world at `NO_LEVEL_CORRECTION` — no fitted anchor at all — and it fails: 6 of 7 fitted years LOW
  by 3.3pp to 9.0pp, 1 in band, where the fit achieves the published rate to four decimals in all
  seven by construction. So the band is at last a check the world can fail, and the world fails it;
  what the fitted per-year scalar has been carrying is 3 to 9 percentage points of departure the
  household mechanism does not produce. That is the reading half of the steer, delivered. The
  repair half is owed and is a knowledge question before it is a code one, which is why it is
  first below and why it must not be answered with a constant. Of my four steers, one was fully
  delivered and one half; `drawn` reported one of them, so the instrument is still under-reporting
  at the same rate as last stretch, and it still grades the local checkout rather than the branch
  work lands to — `background/delivery_seat.py` line 172 runs every git call at `cwd=str(PROJECT_
  DIR)` and `grep -n origin` over the module still returns nothing, a fifth stretch open. Eleven
  commits, six substantive, none empty; the machine's shape is not the finding this time. Where
  this leaves the thesis: the apparatus is now trustworthy enough that the next real gain cannot
  come from the page. It has to come from the world — a departure level that emerges from
  households instead of a solver, and a book that contains the standard-variable product 62.6% of
  our unpriced renewals are missing.
