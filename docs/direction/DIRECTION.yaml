      PB6: graded" section of
      docs/staging/records/SEAT_PREREG_THE_NEXT_AB_ON_THE_SINGLE_ROLL_WORLD_WHAT_A_SEED_VARIES_2026-09-30.md:
      grade R1, R2, R2b, R3, R4 against their filed bands, and state the plain answer under the
      answer rule already fixed there. If fewer than six seeds completed, the answer is "cannot say"
      and the section says which seeds are missing and why, from the log. Land it through
      tools.surgical_land.
    why: >-
      The predictions were filed before launch, so this is a real test of whether PB6 reaches the
      ranking, and the interim seed already says it probably does not. DONE when origin's copy of
      the prereg carries the six-seed table and one of the four plain answers.
  - id: name-the-input-that-anti-ranks-the-retention-belief
    lane: B_commercial
    what: >-
      A measurement, with no company/ code change. At pin a322166cc, split the value arm's retention
      belief at each account's first renewal into its terms, as computed in
      company/crm/enriched_churn_estimate.py::enriched_churn_estimate: rate_estimate,
      payment_estimate, which of the two wins the max(), the market-pressure multiplier and the
      engagement factor. Use the rosters in /var/tmp/se-ab6-out (runP1/P2/X1.json and
      pb6rank_C0_pin.json). If a term is not carried there, recompute it by calling that term's
      function with the logged inputs; do not start a new sim run. For each term, over the pooled six
      seeds and within direct debit (n=338), report its correlation with the world's p_retain at
      the same offer, and the belief's correlation after holding that term at its book mean. File
      predictions for which term carries the -0.383 before computing, in a new section "What
      orders the belief" in the same prereg record. Then name the inverted term, state which
      published source or company observable sets its direction, and file a finding in
      docs/staging/ that PB7_the_company_learns_what_it_can_now_see can be released against, or
      say plainly that no single term carries it.
    why: >-
      The thesis puts the advantage in inference, and the inference is inverted in one estimator
      whose engagement term has now been shown not to be the cause. The next build, a fix to a
      rate term or PB7's learning rule, cannot be chosen until the inverted input is named. The
      artefacts to name it already exist. DONE when the section is on origin with predictions,
      the per-term table, and a named term or an explicit "none alone".
  - id: re-establish-boot-sha-drift-against-origin
