thesis_read: >-
  The machine came back level this stretch, and the world's debt got worse news, not better. The
  shared tree is on origin again: 0 behind and 0 ahead after 0c7389aa9, and sim-runner was restarted
  at 09:24 BST onto code that carries the director's box memory budget. My 07:00 diagnosis of what
  held the advance was wrong. By 09:05 the direction files matched origin byte for byte, and 3191ba2ae
  landed this seat's record. What held it was six live copies under 48h, each an earlier draft of a
  later origin revision. The reconciler has no class for those, and that gap is still open. On the
  company side, the flat 0.20 retention effect is retired: a retention offer now reaches the world
  as its discounted rate, and a kept customer is billed what they were offered (b922911b7). That
  supersedes bf52e72e6, which is disposable. The kind count is in. 57 of 81 retention offers, carrying
  84% of retention cost, fall on renewals the world never rolls (36 SVT-to-fix conversions and 21
  declined fixes), and 0 fall on rolled terms. The company holds the kind before it offers, because
  it billed the previous tariff. On landed code a discount can also flip a near-parity decline into
  a conversion. That is the alternative the director's open retention row names, and it is not yet
  counted. On the world side, the arrears half of the director's hold is NOT MET, HIGH. On the triad's
  truth, 11.1% of electricity accounts are more than 91 days behind in 2019 (8.3-14.7%), against a
  matched 5.1%. The old "about 2x" and the new 2.2x sit on different instruments: the correction
  moved this instrument from 38% to 11%. 54dbd5650's "10% to about 1%" was read on an instrument
  nobody can now reproduce. 10 of the 11 accounts behind hold a bill the world never settles, and
  the likeliest cause is LATER_SETTLEMENT_REPAID_SHARE = 0.5. That figure is the repayment share of
  debt-blocked switchers, a selected population, applied here to every failed domestic bill. The
  debt results are re-graded on that world (b109f7af9): the objection's reach halves, and the chosen
  book's "excess bad debt" story no longer holds. The 400-founder end-to-end run is running now in
  the interactive lane (pid 1367745). I treat it as a measurement of arrears at scale, not as a licence
  to raise the book. So against the thesis, the baseline comparison is no closer. The world that
  would grade inference against flat rules still over-holds debt 2x, and every per-customer debt
  or retention reading inherits that. The previous focus was steered, three of four drawn. The
  fourth, the direction-files item, was spent by its premise and is dropped here.
