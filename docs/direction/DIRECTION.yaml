focus:
- id: the-box-runs-the-skip-pair-before-another-book
  what: 'The book on 7f0723b46e (run_annual_report pid 484274, started 11:04Z) is the only thing between
    the box and the skip pair. Let it finish; do not kill it. Before it exits, stop sim-runner admitting
    another book until the skip pair has read. Use the mechanism background/next_book_requires.yaml already
    documents: add one row with `commit: null`, `what: skip pair read (/var/tmp/vts-out-skip1/control_11111_22222.json
    and /var/tmp/vts-out-skip0/control_11111_22222.json)` and `owner: B_commercial`, with a REVERSE comment
    beside it. Then confirm that `python3 -m background.sim_runner`''s book_admission defers, and that
    /var/tmp/box-plan/box_free.py would return 0 with 484274 gone. Confirm that /var/tmp/value-test-threshold-skip
    still exists and is `git worktree lock`ed, and that vts-threshold-skip-watch is still armed. When
    484274 exits, check that longjob-value-test-threshold-skip launches within one watch cycle (600 s).
    If it does not, read vts-threshold-skip-watch.log and launch it per THE_VALUE_TEST_REDESIGN s.12d.
    Never run a second copy. Make the step that grades skip1 also delete the null row once both control
    files exist, so the W3_3 book builds next, alone. Land the YAML by pathspec.'
  why: 'The per-customer-versus-flat comparison is the thesis''s only live test, and this stretch it lost
    its turn twice: a deleted tree, then a book admitted 34 minutes before the row that would have held
    it. Done means longjob-value-test-threshold-skip is running on the box, and next_book_requires holds
    a null row that keeps every book behind the skip pair''s two control files.'
  lane: B_commercial
  side: supplier
  written_at: 1795004974.471
- id: skip1-is-graded-against-s12es-branches
  what: 'DO NOT DRAW BEFORE /var/tmp/vts-driver/read_threshold_skip.skip1.out EXISTS. vts-branch-watch
    is armed on that file (deadline 30 Nov). Once it exists, grade skip1 in docs/design/THE_VALUE_TEST_REDESIGN.md
    s.12f against s.12e''s table exactly as pre-registered: k of the 9 flips re-offered, with every s.12e
    row marked held or missed beside its prediction. Name the flags that differ between the arms compared.
