  - id: the-arms-reach-is-a-missing-world-product-not-a-company-choice
    what: >-
      Read `decisions.why_the_rest_were_not_priced` in `site/data/value_arms.json` — as published it
      attributes 1,223 of 1,953 renewals (62.6%) to `product_not_upliftable` because the term's
      `tariff_type` is `None`, and `docs/design/DRAWN_BOOK_TARIFF_TYPE_FIDELITY_DETERMINATION.md`
      settles that this is an honest silence about a product the world lacks: `build_renewal_
      schedule` settles fixed, flex, deemed and pass-through, and SVT exists only as a comparison
      benchmark. Establish from the published record what share of the GB domestic book actually
      sat on a standard-variable or default tariff in each year 2016–2025 — and NOTE,
      2026-09-04: this sourcing is THE SAME JOB the re-aimed
      `departure-level-emerges-from-the-household-not-the-solver` above now needs for its
      composition half, after `d76262701` moved that item's repair onto the SVT route.
      Whichever of the two is drawn first does the sourcing ONCE and records it on the other;
      two lanes sourcing the same Ofgem series a week apart and reconciling them afterwards is
      this repo's VAT shape and is what this note exists to stop — then make the world
      settle an SVT product at that sourced share, recorded as a versioned world change in the file
      the director reads and decided on the record alone. Do not touch the arm's pricing rules, its
      uplift bounds or its churn model, and do not look at what the change does to the margin
      before deciding it.
      **THE SOURCING IS DONE, 2026-09-04, by the other item — do NOT re-source it.**
      `docs/market_research/gb_domestic_default_tariff_share_2016_2025.md` is the write-up and
      `tools/published_tariff_mix.DEFAULT_TARIFF_SHARE` is the one code home. Three things this item
      needs to absorb before it starts. (1) TWO SENTENCES ABOVE ARE NOW STALE: SVT does NOT exist
      "only as a comparison benchmark" — `simulation/svt_product.py` settles it and accounts ARE
      assigned, since ~2026-08-31, and `tools/svt_generated_share_check` measures the resulting
      share. What is short is the SHARE, not the product. (2) The world sits BELOW the published
      share in every comparable year — 42.6% against ~62% in 2017, 55.0% against 80-86% in 2024 —
      so this item's own direction of travel is confirmed and its size is measured. (3) Ofgem's
      headline figure for 2017-2019 EXCLUDES PREPAYMENT and this world models no prepayment meter,
      so decide which published population the book is meant to be before settling terms at a
      share; the two bases differ by ~6pp and disagree about the SIGN of the 2018 and 2019 gap.
      2020 and 2021 have NO established figure and must not be interpolated.
    why: >-
      Every "cannot tell" on that page is a sample-size statement, and the largest single cause of
      the small sample is a product most of the real GB book was on and this world does not have.
      I ruled this out last stretch on the wrong ground — I read "widen the arm's reach" as tuning
      the company until it wins, which the `not_a_target` note rightly forbids, when the actual
      cause published beside it is a world fidelity gap and changing the world for fidelity reasons
      is not only allowed but required. Finished when the world settles SVT terms at a sourced
      share and the arm's reach is re-measured, whatever that does to the margin — including if the
      creation leg gets worse.
  - id: a-prereg-states-what-it-could-have-detected
    what: >-
      Change the pre-registration format used in `docs/staging/records/` and by this seat so a
      prediction must state, before the run, the smallest effect its chosen statistic could
      distinguish at the n it will actually have, and so the write-up grades that clause beside the
      prediction rather than only the prediction. Where a prediction is categorical rather than
      statistical — as the 2026-09-04 remedy-clause one in the staging root is — the clause says so
      and says why detectability is not at issue, so dodging the class is visible as dodging it.
      Apply it to the two statistical cases already in the tree rather than to a hypothetical one:
      the Spearman over seven fitted years, and any selection-leg reading taken at three seeds.
    why: >-
      This project files predictions honestly and then measures them with instruments that could not
      have refuted them. The Spearman's exact permutation null needed |rho| at least 0.75 and the
      measurement returned +0.32; the live creation leg is a £2,177 figure carrying a £5,923 spread
      at n=3. Both are ours, one is the thesis's own leg, and focus items 1 and 3 above will both
      produce readings that want pre-registering — so this is worth having before them rather than
      after. Finished when a pre-registration that cannot detect its own effect is visible as such
      before it runs, instead of in its own grading.
