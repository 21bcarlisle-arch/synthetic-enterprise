    money figure on the billing page. Recovering the balance is also a per-customer trade-off: a bigger
    direct-debit step-up is the household''s bill shock, so both sides of M2 show up in one number. DONE:
    the knowledge page answers the question, sourced or GAP; the switch and its control are on origin;
    the two-arm table and the graded prediction are in the finding; and the finding states whether the
    default should flip after the publish, with the reason.'
