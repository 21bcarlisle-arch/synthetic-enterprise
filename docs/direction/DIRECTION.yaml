focus:
  - id: rerun-the-ab-and-publish-the-three-unread-instruments
    what: >-
      Run `python3 -m tools.run_value_cycle_ab` on the book as it now stands, ONCE, before anything
      else on this list. That is the instruction -- do not re-derive why, do not read the ledger, do
      not write analysis first. If `cross_section_reconciliation` refuses because the coupler
      artefact predates its `population` block, run `python3 -m tools.couple_value_based_pricing`
      first and re-run. Then edit the headline table in `docs/design/THE_VALUE_CYCLE_REALISED_AB.md`
      so the current row names the book it ran on -- account count, segment split, git commit -- keep
      every superseded row with its supersession note, and state the delta whichever way it moved,
      including smaller or negative. R14: every figure carries its clock.
    why: >-
      Owed for three stretches, about 23 minutes of machine time, no judgement, and it is the only
      published answer to the question the director actually asked. It describes a book the company
      stopped having on 26 August. Three instruments were BUILT for this reading and none has ever
      emitted a number -- `gross_to_net_bridge` (the named decomposition of the GBP 30,924 gap where
      control gross GBP 433,174.76 fell to arm GBP 419,023.25 while net rose GBP 16,773.28, with
      `unexplained_residual_gbp` and a reconstruction error so a decomposition that does not close
      says so), `bound_attribution` and `cross_section_reconciliation`. It is first because two seats
      have now written it as the cheap clause of a long instruction and both times it was the clause
      that got lost; the fix is a short instruction at the top, not a longer one lower down. Finished
      when the newest `value_cycle_ab*.json` on the tree carries all three keys with live figures and
      the artefact's current row names its own book. The residual is the deliverable whatever it is;
      a bridge that does not close is a finding, not an embarrassment.
  - id: separate-price-from-prediction-with-a-ladder
    what: >-
      Build and run the price ladder that the 2026-08-27 section of
      `docs/design/THE_VALUE_CYCLE_REALISED_AB.md` names as the thing that would separate the two
      explanations, and publish the two slopes side by side. Concretely: re-run the value arm over
      the same book and the same seed at several fixed margin multipliers, and compare the SLOPE of
      realised non-renewals against price with the slope the company's own
      `company/crm/churn_model.py::estimate_churn_probability` predicts over the same rungs. Fixed
      rolls are what make this work where the 42-renewal comparison did not -- it needs no matched
      pairs, so the 18 accounts the world rolled no decision for stop being a hole. Two cheap things
      travel with it. Publish `rate_vs_svt_pct` beside `rate_increase_pct` per decision, because that
      section established the company keys on a delta against its own prior rate while the world keys
      on a level against SVT and both call sites are cited there -- those are different questions and
      the artefact currently reports only one of them. And either close the 18-unmatched hole or
      state per account why no decision was rolled. THE OUTPUT IS A MEASUREMENT. If the slopes
      disagree, the company's belief is the company's own affair and is allowed to be wrong; changing
      the WORLD's switching response is a baseline fidelity change under R13, must be decided blind
      to what it does to this delta, and is not this seat's to make -- record it for the curriculum if
      that is where the arithmetic lands.
    why: >-
      This is the only remaining route to the director's actual question. The advantage must come
      from INFERENCE and not from ACCESS; the ceiling reconciliation established last stretch that it
      must not come from a BOUND either; and this stretch added a fourth way for it to be hollow that
      nothing has measured -- it can come from PRICE. The realised comparison can no longer settle
      that, and the verdict it returned was explicitly the third option: the sample cannot separate
      them, effective n is 4. A ladder measures response to price directly, on a population that
      cannot dodge it. It is second only because item one is 23 minutes and refreshes the population
      this would be read against. Finished when two slopes are published beside each other --
      realised non-renewal against price, and believed against the same price -- each with the number
      of decisions behind it, and the section says which of the three verdicts the ladder now
      supports. If it supports "the win is price, not prediction", say that in the headline where a
      reader hits it.
  - id: EP1_clv_three_horizon
    what: >-
      Fourth naming, and this time a short instruction: MAKE THE CHANGE, do not restate the
      diagnosis. `company/analytics/clv_three_horizon.py` takes `hazard = latest.churn_probability`
      at H2 and the term `1.0 / hazard`; that resolves to `saas/churn_model.py::churn_probability`, a
      step function of one integer that is zero for every graded account, which is why 33 of 33 sit
      at 0.05 and 20.0 years. The richer sibling already exists and already takes the right
      arguments: `company/crm/churn_model.py::estimate_churn_probability(old_rate_gbp_per_mwh,
      new_rate_gbp_per_mwh, tenure_years, annual_consumption_kwh, fuel, hedge_fraction,
      hangover_periods_remaining, segment, market_move_pct)`. So the work is to feed H2's hazard from
      per-account observables through that signature rather than to invent a model, widening only
      where a real supplier could see: payment method and payment behaviour, tenure to date, the
      account's own rate against the market it could switch to, consumption volatility, contact and
      complaint history, and whether the account carries a gas leg -- 395 of 397 accounts are
      residential and the funnel now wins gas legs, so dual-fuel is a live per-account observable.
      Name every new input with the observable it comes from and clear it against the wall;
      `company/interfaces/sim_interface.py` is the only door. Then re-measure with `python3 -m
      tools.couple_clv` and report the ledger's next reading whichever way it moves.
    why: >-
      "Decisions customer-by-customer on LIFETIME VALUE" and a lifetime term taking exactly one value
      across the entire graded population are the same claim and its refutation, sitting in one file.
      The level is not the problem -- `hazard_calibration` shows 0.05 believed against 0.0532 realised
      over 263 decisions, and 13 distinct believed hazards exist elsewhere in that block, so the
      estimator CAN take other values and the graded constant is a fact about the input, not the
      model. This is DISPERSION, and R12 forbids tuning anything toward a smaller gap. It is third
      rather than first because it has now been ordered second twice and first once and the position
      is clearly not the variable -- the instruction is, so this one is a quarter the length and
      names the function to call. Finished when the graded population shows more than one distinct
      hazard and the ledger's next entry comes from a changed estimator rather than a changed sample.
      A move to level 3 is available on that evidence if the coupled rung is genuinely met --
      self-certify with `record_level_up_self_certified`, never `--no-verify` a `level_current`
      change. If the gap worsens, that is the result and saying so is the deliverable.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Two acts, in this order. FIRST, unwedge: EP13's raw block in `docs/design/maturity_map.yaml`
      measures 11,953 B against the 12,288 B per-atom cap -- 335 B left, and the commit that landed
      the oracle bound states that the next pass on this atom wedges EVERY lane without this. Rehome
      its history to the simplifications store the way `H27_payment_belief_gap` was rehomed after it
      crossed the same cap (`tools/simplifications_store.py` records that precedent), and confirm the
      entry is back under budget before writing anything else. SECOND, close the level claim. The map
      records `level_current: 2`, but there is no `tools/couple_carbon_intensity.py` among the fifteen
      `couple_*.py` and no EP13 row among the sixteen in `coupled_gap_ledger.json`. Either build the
      coupler, grade the company's believed emissions against the world's outturn and put the row in
      -- or correct the map entry down to what the evidence supports and record why. Read
      `docs/design/EP13_CARBON_INTENSITY_DISCOVER_FRAME.md` first: it holds the level at 0 for a
      stated reason and warns that `company/sustainability/carbon_intensity_register.py` had zero
      non-test importers, so check who consumes the register TODAY before grading a belief nothing
      reads. R15: mutation-test whatever control you build, both ways.
    why: >-
      A level 2 with no coupler and no ledger row is a level claim resting on evidence nobody has
      taken, and under the coupled triad no SIM atom reaches its target until the company has been
      tested against it and the gap measured. Correcting a level down is as good an outcome here as
      moving one up, and both beat a fifth naming. The director asked for this atom in his own words
      on 2026-08-25 -- "say plainly what it does and does not yet include" -- and the publish half is
      real while the say-plainly half is still ungraded; the stretch that just closed did genuine
      science on it and retired the outage model as the next gap, but that was the SIM side again.
      The unwedge comes first inside this item because it is 335 B from blocking every other lane,
      which makes it the one piece of housekeeping on this list that outranks analysis. Finished when
      EP13 either has a ledger row grading a real company belief against the world's outturn, or a
      map entry that no longer claims a level it cannot show -- and in both cases an entry back under
      the byte budget.
