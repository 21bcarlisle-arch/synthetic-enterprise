  what: 'Canon step 2, world half, FIRST SLICE ONLY. Create simulation/unbilled_energy.py with one kind of unbilled
    energy: estimated reads. Use a persistent per-household read state (actual or estimated, carried month to month),
    not independent monthly draws, so that billed volume drifts from used volume and trues up when an actual read
    arrives. Size the share of estimated reads only from docs/market_research/unbilled_energy_and_revenue_assurance.md.
    Where the note does not establish a rate, carry it as a named None and refuse to run that leg, rather than picking
    a number. Write tests/simulation/test_unbilled_energy.py, which asserts that used minus billed is non-zero during
    an estimated run and closes on a true-up, and that the rare true-up branch can be reached. Do not wire settlement,
    theft or the company seam in this slice.'
