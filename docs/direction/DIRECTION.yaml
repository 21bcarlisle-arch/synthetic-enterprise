focus:
  - id: weather-cells-phase1-pull-the-haduk-grids
    what: >-
      Do the CEDA pull the director's ruling puts first, today. Read
      `~/.config/synthetic-enterprise/.env.ceda` (`CEDA_USERNAME`, `CEDA_PASSWORD`, `CEDA_TOKEN`).
      First try to self-mint at `https://services.ceda.ac.uk/api/token/create/` with basic auth — it
      returned 500 for this account this morning; if it works, wire self-minting and never depend on
      a hand-pasted token again, and if it does not, use `CEDA_TOKEN` and record the 500 as a finding
      with its response body. Then pull HadUK-Grid v1.3.2.ceda at 1 km for GB: monthly `tas`,
      monthly wind speed and monthly sunshine duration over the published climate-normal span, plus
      DAILY `tas` (persistence in §2.4 cannot be computed from monthlies). Raw grids go to a local
      cache on Skynet OUTSIDE the repo — several GB, and §4 forbids them in the tree. Commit only a
      committed inventory artefact: for each file, the variable, temporal resolution, spatial
      extent, byte count, SHA-256 and the URL it came from, plus a named gap row for anything the
      archive did not have. Proof the pull is usable, not merely present: open one monthly `tas`
      file and print GB-mean temperature by month for one year against the published normal. If the
      token dies mid-pull, NTFY him for a fresh one — §4 says two minutes for him — do not
      improvise a substitute source.
    why: >-
      This is the only item in this file with a window that closes: the token expires ~2026-09-08 and
      HadUK-Grid is a once-a-year release, so a missed pull is not a delayed item, it is a stalled
      phase. It is also the director's own instruction, given directly and an hour before this
      orientation, and it is product — the cells become both a public knowledge page and an artefact
      the SIM consumes when the weather hierarchy's BUILD opens. Done when the grids are on local
      disk, the inventory artefact is committed and checked, the token question (self-mint or
      manual) is answered in writing, and the GB-mean print matches the published normal. Do NOT
      wait for the publish wedge in item 3, and do NOT start the analysis before the pull is proven
      — §5 fixes that order.
  - id: weather-cells-phase1-curve-and-knowledge-page
    what: >-
      Derive the cells and write the page, per §§2–3 of the ruling. Cluster GB on the three phase-1
      drivers at house height (elevation-corrected per postcode from OS open terrain data, not the
      1 km cell mean), weighted by HOUSEHOLDS from the 2021 E&W and 2022 Scotland censuses via
      postcode — never from the SIM's drawn population, which §4 forbids. Produce the two
      explained-variation curves the ruling asks for, level (annual heat load) and shape (cold-and-
      still versus mild-and-windy months), and name the cell sets at 90/95/99%, each overlaid
      afterwards with LDZ, GSP and SAP-21 as comparators with a stated figure for how well each
      approximates the derived cells. Report cold-spell persistence and cross-cell synchrony per
      cell — §2.4 puts both in phase 1. Validate against DESNZ sub-national gas consumption at
      small-area level, which is a different source from the one that generated the cells. Then the
      knowledge page: all six rungs, cells as a versioned Choice-class claim, rate-of-change
      settled/slow, an expected-shape block stating the findings falsifiably, stubs minted for the
      phase-2 and phase-3 topics, external register (no atom ids, rung numbers or lane labels), and
      rows added to `docs/market_research/ASSUMPTIONS.md` and
      `docs/institutional/knowledge_map.md`. HadUK publishes sunshine duration, not irradiance:
      choosing the irradiance source is yours and must be registered as a Choice naming its
      alternative. Finish with the plain-English NTFY in §3.4 — the curve, the recommended cell
      count, the fidelity cost of going coarser, and where the data forced a choice.
    why: >-
      This is where the value actually is, and it is the first product work of any size the file has
      carried in weeks: a stated fidelity cost for a chosen simplification, rather than four weather
      nodes picked by convenience. It also feeds the thesis directly — household-weighted heat-load
      cells are an inference substrate the company can condition on without any access it should not
      have. Register phases 2 and 3 on the map as decided-not-authorised with their opening
      conditions, and do not start them; §4 is explicit. Done when the curve, the cell definitions
      and the page are committed and the director has had the plain-English report. If the page
      thins into machinery, the content wins — the ruling's DoD 0.
  - id: unwedge-the-shared-tree-and-the-publish-path
    what: >-
      Clear the wedge at its named cause rather than by hand-merging. `.publish_gate_state.json`
      records `total_red: 4` (one in `tests/background/test_an_exit_code_is_not_a_landing.py`, three
      in `tests/tools/test_generate_dashboard_data.py` on the opex ledger's per-household
      arithmetic) and a `liveness_surface_refusal` naming 7 tracked paths that this tree has edited
      and origin also changes, `background/delivery_lane.py` among them, against 831 dirty paths
      overall. Two separate jobs. (a) Fix the 4 reds at HEAD — the three opex-ledger ones are the
      unfinished half of the prepayment split and should be checked against
      `saas/opex_ledger.py`'s already-cited Ofgem prepayment allowance before anything is
      re-baselined. (b) Land the contested hunks: run `python3 -m tools.isolate_hunks --survey`,
      and for each path, land the hunks that belong to a finished piece of work via
      `surgical_land --content` and leave the rest. Separately, dispose of
      `WORKER_FINDING_THE_SHARED_TREE_HOLDS_A_SUPERSEDED_DRAFT_...` — a superseded draft of
      `background/self_clearing_alarm_census.py` sits dirty in this tree deleting `removed_dispositions`
      and `shared_loader_answers`, both landed at HEAD, and holds 23 tests red for every lane that
      runs them. Do NOT run `git merge` or `surgical_land --merge origin/main` in the shared tree,
      and do not close the fork with another seat merge: the standing error condition on transport
      requires two consecutive orientations level with no hand reconciliation between them, and a
      hand merge would destroy the only evidence that the automatic route works.
    why: >-
      The director's own ruling says it: "do not let this ruling be the reason the wedge is skipped —
      reconcile that as its own item." A knowledge page nobody can publish is not a deliverable, and
      the fork widened from 6 to 10 this stretch while daemons run from a checkout the branch has
      moved past. This also sits under the weather work rather than above it because it blocks the
      LANDING, not the doing. Done when `git rev-list --left-right --count HEAD...origin/main`
      returns 0 and 0 having got there through `background.origin_reconcile` alone, when
      `.publish_gate_state.json` shows `total_red: 0` with a clean publish recorded, and when the
      23 shared-tree reds are gone because the superseded draft was disposed of rather than
      overwritten silently.
  - id: continuations-preempt-focus-unconditionally
    what: >-
      Make `background/delivery_lane.next_item()` able to reach `focus`. Today it walks
      `seat_continuation.live()` first and returns the first unclaimed entry unconditionally; the
      `focus` loop beneath it runs only when that store is empty, and it is never empty because
      every interactive seat writes continuations faster than `live()`'s window expires. Five are
      live right now, two of them the same low-water convergence work filed under two ids
      (`converge-three-low-water-implementations`, `register-low-water-three-implementations-one-mechanism`).
      Make the precedence conditional rather than absolute — the smallest version that can fail: a
      continuation only outranks `focus` while it is younger than the current direction's
      `oriented_at`, so a freshly-oriented seat's ranked head is taken before continuations derived
      before it existed, and the freshness argument in the existing docstring (a continuation is
      minutes old, a focus item up to three hours) is preserved exactly where it is true. Add the
      one control that would have caught nine stretches of this: assert over the whole partition
      that BOTH branches are reachable — a continuation can win and a focus item can win — not one
      leg per branch. Then settle the open question beside it: PB4 was BUILT on 2026-09-04 without
      ever being drawn, and `seat_executor._promote_to_handoff` writing a focus item into the
      continuation store is the leading candidate for how; establish whether that route fires and
      whether it records a draw, and file what you find either way.
    why: >-
      Nine consecutive stretches of direction and `previous_focus_drawn.drawn` empty every time. A
      steer nothing reads is not a steer, and this is the first orientation that can name the
      mechanism in one sentence instead of theorising about dials — so it is cheap now and has cost
      nine stretches of the director's attention already. It ranks fourth and not first deliberately:
      six stretches of putting the delivery apparatus above product is a graded error of mine, and I
      am not repeating it to fix the apparatus that would have delivered the product. Done when a
      test proves both branches reachable, when the duplicate low-water continuation is retired via
      `--release` from the SHARED tree, and — the real acceptance — when a later orientation finds
      `previous_focus_drawn.drawn` non-empty. That last is not mine to grade.
