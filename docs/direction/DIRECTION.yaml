thesis_read: >-
  This stretch moved the thesis more than the last four, and it did it in reading rather than in money. The
  supplier still trails its flat-rules baseline by GBP 1.35 per household-year on A's better belief. But the
  cause is now read, not guessed, and it is not the one the last record named. d5d097e72 read pair 1's
  desk_belief_by_arm with no box time. On 9 of the value arm's 10 flips, A's belief sits at 0.11 to 0.14 and
  the twin's at 0.30 to 0.36. A fixed RETENTION_THRESHOLD of 0.30 sits in simulation/run_phase2b.py with no
  declared origin. It decides who is even considered for a save offer, so A, which ranks leavers better but
  states lower levels, moves about 185 renewals per seed under it and never offers. That is the thesis's own
  failure mode: an inference advantage spent by a flat rule the per-customer view still passes through. The
  value test the last record wanted to switch is never reached at those flips, so its step 3 was correctly not
  built. The fix is a default-off switch that skips the cutoff where the save odds carry the belief, with the
  selection moved into company/interfaces/growth_desk.py, which also pays down the wall half. It was in its
  landing gate at this record (pid 2152551). Nothing has run it. Billing also moved. 153a675ad keys the
  closing-refund exception to its class, so the 18f201c5bf book now refuses on one row, not two. 594ed8239
  fixes 18 of row 7's 20 at the world's final-bill read. d645233e8 puts the walk counters in a file beside
  each run, so the next book can name SYN-2016-001's last 2. No book carries either yet. Step 6's pair 3 holds
  the box, and at 23:25Z a tick declined to pause it for a book that is predicted to be refused on row 7's 2.
  I agree, and that reverses the last record's order. The site serves a 9 Nov book, and the publisher is at
  55 failures over 43.8h. The steer bit once: of 4 named items, the offer-gate item was drawn and read. The
  continuation-ordering and banner items went undrawn for a fourth and second record. faa1fea4f is another
  banner commit that changed only written_at. The commit split reads 0 supplier and 17 other, but
  d5d097e72 and 594ed8239 are supplier substance the classifier files as other. Two of last stretch's
  instructions asked for reads of artefacts that did not exist: pair 2's flag-0 twin, and the walk counters
  before d645233e8. Before naming the reads below, this record checked /var/tmp/vta-out-flag0 and
  /var/tmp/vta-out-flag1 on disk.
