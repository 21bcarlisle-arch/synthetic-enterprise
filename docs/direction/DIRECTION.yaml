thesis_read: 'The supplier''s bills are now lawful on the two classes the suite found, and the exit test''s first leg is running. 2eeb3f0b3 fixes
  the company''s real overcharge: writer 4 clamped a prepayment default tariff at the direct-debit cap, so 298 elec and 249 gas SVT windows sat
  above the customer''s own cap column. Its knowledge page came first (K8) and its pre-registration was filed before any run carried it. The same
  commit corrects the suite''s own error, a per-day tolerance that could not hold a printed penny, and retires both standing-charge exceptions.
  d2be04371 gives an unnamed occupier''s deemed account its EBSS credit. 894503ba4 builds the check whose absence cost the last fresh run three
  hours: a continuation is held while the artefact it names is absent. So two carried errors are corrected this stretch (see wrong). The fresh
  run at 2eeb3f0b3 was launched with its grade queued under the-fresh-run-at-2eeb3f0b3-is-graded, but it took half the instruction (see wrong).
  The pre-registration speaks only to the SVT invariants, and the two register rows were never added, so item 1 files both before DONE.json exists.
  Against the thesis, this is correctness, not inference. No baseline comparison moved, and the renewal belief still ranks leavers backwards.
  That is the ruling''s order, and it is right while bills breach the licence. The split reads supplier 0, world 0, both 2, other 2, and both
  ''both'' commits are fixes to the supplier''s bills. No world-only work landed, which is the balance the director asked for. Of the previous
  focus, three of five were drawn and two landed (the handoff check and, under the run''s launch, most of item 1). Item 3 is landing now. Items
  4 and 5, the EV timeline and the cold read, have now gone two stretches undrawn: that is my steer drifting, and they stay in focus, in order,
  behind the grade. Two queued continuations have spent premises and should be retired by the seat, not drawn: the-svt-residue-is-traced (2eeb3f0b3
  traced both residues) and the-fresh-run-carries-both-fixes-and-retires-the-exceptions (the launch is done, and its remainder is folded into
  item 1). The second has been refused 46 times because /var/tmp/se-seat-executor holds DOMAIN_INVARIANTS.yaml.'
