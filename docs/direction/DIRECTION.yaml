focus:
  - id: put-the-company-beside-the-ceiling-on-the-route-its-own-belief-did-not-seed
    what: >-
      **Lane 0, and it is `LADDER_APPLIED_TO_CHURN_2026-08-31.md` item 4 made specific.** Compute the
      world's oracle AUC (**the ceiling, 0.6760**) and the company's own belief AUC on **ONE
      capture, one population, both nulls** — and split the reading by route, because the two routes
      are not the same experiment. **The renewal leg is partly tautological and
      `tools/grade_renewal_churn_belief.py` says so in its own docstring**: `roll_lifecycle_event`
      seeds `effective_p_retain` from the same `build_churn_risk` number it then grades, so a belief
      graded there measures whether the world's adjustment chain preserves the ordering of the base
      rate it was handed — a weaker claim, and it must be published as that. **The SVT leg is the
      one that matters and nobody has noticed it is available.** An SVT segment decision carries no
      `churn_probability`, no `sim_price_response` and no `sim_bill_shock_base` — the company's
      belief is not an input to that hazard anywhere. So the SVT route is **1,266 decisions and 50
      of the book's 82 departures whose outcome the company did not cause**, which is the first
      population in this project on which a belief can be graded against a world it did not seed.
      Grade it. The likely answer is that the company has **no belief to grade** — `build_churn_risk`
      is renewal-shaped and a household drifting off a fixed deal onto SVT is invisible to it — and
      **that answer is the finding**, not a blocker: 61% of departures happen through a door the
      company's churn model cannot see. Use `tools/measure_churn_heterogeneity.py` for the oracle
      leg and `grade_renewal_churn_belief` for the company leg; do not build a third instrument.
    why: >-
      First, and it displaces the money instrument deliberately. The thesis says the advantage must
      come from **inference**, and until this stretch there was no denominator: a company AUC of
      0.4653 read as "the company is poor" only if you know what was there to be found. Now the
      ceiling is measured — 0.6760 — and the comparison is finally *possible*, which the ladder page
      correctly refuses to make today because the two figures come from different populations and
      different runs. **Two true numbers whose legs are different populations do not have a
      difference**, and putting 0.6760 beside 0.4653 is the exact move this repository has published
      wrongly before. This item exists to make the comparison legal, and it is worth more than the
      £ instrument because it is measured per DECISION on 1,410 of them rather than per contrast on
      3 seeds, and because the SVT split answers the independence objection that has hung over every
      belief reading here since July. **Done means:** both AUCs computed on one capture with the
      shared null printed; the renewal leg's non-independence stated **on the surface a reader
      meets, not in a footnote**; the SVT leg either graded or its absence stated plainly as "the
      company forms no belief on the route carrying 61% of departures"; the exposure offset applied
      on the SVT route before any per-factor figure from it is quoted again (segment length alone
      reads 0.5868 against a null topping out at 0.5842); and **no ratio, share or "fraction of the
      ceiling captured" published unless both legs count one population** — if they do not, say so
      and publish the two readings side by side with their populations named.
