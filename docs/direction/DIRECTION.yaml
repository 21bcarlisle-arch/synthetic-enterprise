focus:
  - id: PB6_the_engagement_observable_crosses_the_seam
    what: >-
      Return PB6 to its Expert Hour now. Run a fresh blind pass with tools/blind_review.py, the same
      shape as the 2026-09-29 retention-analytics pass. Give it the current
      docs/staging/WORKER_FINDING_PB6_THE_ENGAGEMENT_FACTOR_IS_USED_PER_DECISION_AND_ITS_PRIOR_IS_PER_EXPOSURE_2026-09-29.md,
      and disposition each of EH-1, EH-2, EH-5 and the declared "live path reads no book" gap. For
      EH-2 planted, state whether its failure to recover 0.307 is a build defect or sample
      thinness: 2 prepayment decisions at w 0.036 cannot identify a factor. If it is thinness, it is
      a declared "cannot tell on this book", not a reason to hold. Record the verdict in the PB6
      simplification yaml under expert_hour. If it passes, move the level to 3 through the level
      gate. If it fails, name the fail that stops it and mint or point at the atom that owns it.
      Do not hand on to PB8, which is blocked on an unpublished rate.
    why: >-
      Every build step the last Expert Hour asked for has now landed (the null arm, the
      re-centring, EH-5), and nothing is drawing the review that grades them. This is the one item
      here that can change a level while ab6 holds the box's memory. DONE when the PB6 row carries a
      dated Expert Hour verdict newer than 2026-09-29, and either level 3 or a named fail pointing
      at its owner.
  - id: grade-the-ab6-bridge-leg
    lane: B_commercial
    what: >-
      If /var/tmp/se-ab6-out/runB6.json does not exist (it is due about 07:35Z), release this item
      with no staging file and stop. Otherwise run /var/tmp/se-ab6-out/seed_census.py on runB6.json
      against ab5's runs for 33333 and 44444. Grade B1 (|Δ D_lin| < £300 per seed) and B2 (fewer
      than 120 identical lineages), each beside its prediction. Append the grade to
      docs/staging/records/SEAT_PREREG_THE_NEXT_AB_ON_THE_SINGLE_ROLL_WORLD_WHAT_A_SEED_VARIES_2026-09-30.md
      and land it by pathspec. If B1 misses by more than £1,000, write that the ab5 line closes as
      "graded at a superseded world". Never stop or restart longjob-ab6-single-roll.
    why: >-
      The bridge decides whether anything ab5 found still describes the code ab6 runs, and so how
      the pilot is read. It costs minutes once the file exists. DONE when origin's ab6 record
      carries B1 and B2 graded.
  - id: prereg-the-book-varying-design-before-the-pilot-answers
    lane: B_commercial
    what: >-
      Before /var/tmp/se-ab6-out/runP2.json exists, write
      docs/staging/records/SEAT_PREREG_THE_AB_THAT_VARIES_THE_BOOK_NOT_THE_SEED_2026-09-30.md. It is
      the design ab6's prereg says follows if n* > 12. Read the REDRAW_KEYS note in
      tools/run_value_cycle_ab.py and the renewal funnel (only ~70 of 164 settled accounts ever
      renew). Name the one variable it changes: a longer window, a wider renewal funnel, or more
      books. Justify that choice against what a real supplier's book would expose, and ask the
      knowledge layer, not invention, for any size. Price it in box-hours from measured seed times.
      File its predictions and the rule that decides between it and simply extending ab6. Do not
      launch. If you judge that the n* > 12 branch does not need a new design, write that refusal
      with its reason into the same file and land it instead.
    why: >-
      P2 already puts about 70% on "stop, vary the book". A successor designed after the pilot has
      answered is fitted to the answer. Written now, it is a prediction. DONE when origin carries
      the record, timestamped before runP2.json's mtime, or the named refusal.
  - id: grade-ab6-bridge-and-pilots
    lane: B_commercial
    what: >-
      If /var/tmp/se-ab6-out/runP2.json does not exist (it is due about 13:45Z), release with no
      staging file and stop. Otherwise run /var/tmp/se-ab6-out/grade_lineage.py runP1.json
      runP2.json. Compute n* as the ab6 prereg defines it, and grade P1, P2 and P3 beside their
      predictions. Confirm that churn_rolls_redrawn > 0 on every pilot seed. List the commits
      between a322166cc and origin/main that touch company/ or simulation/, and state that the
      answer describes the pin. Append all of it to
      docs/staging/records/SEAT_PREREG_THE_NEXT_AB_ON_THE_SINGLE_ROLL_WORLD_WHAT_A_SEED_VARIES_2026-09-30.md
      and land by pathspec. Then apply the prereg's own rule. If n* ≤ 12, launch the extension legs
      (61005...) through background.launch_long_job with --peak-mb 11200. If n* > 12, write the
      plain answer "cannot say on this book" and point at the book-varying prereg.
    why: >-
      This is the first measurement of whether per-customer beats flat rules under the world's own
      renewal noise, which is the thesis's baseline question. DONE when origin's ab6 record carries
      P1-P3 graded and either an extension unit is active or the plain answer is written.
