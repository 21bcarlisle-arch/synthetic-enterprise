      `docs/observability/.publish_landing_in_flight.json`, and `background/live_ledger_guard`
      refuses a live-record write inside a test process — the guard's own error names the repair,
      an injectable path, and says there is no env override by design. (b) Land the 207 uncommitted
      insertions already in `background/process_run_complete.py` implementing
      reachability-not-equality plus the verdict-after-reconcile, via `tools/isolate_hunks.py` and
      `surgical_land --content`, and commit the `git mv` archiving
