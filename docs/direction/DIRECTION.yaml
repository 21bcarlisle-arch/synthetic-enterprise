thesis_read: 'The stretch was all supplier and it was honest, but it went backwards on the thesis''s central claim, and that is what it means. B11 took three slices, each with predictions landed first (60c3a92f2
  to ec9e19927). They say the per-customer rule does not yet know its customers better than the flat rule. On held-back departure neither ranks: AUC about 0.52, and the paired difference holds zero at every
  cut. Both rules over-predict the level after 2020, and the whole miss is the switch term (+0.243, +0.143, +0.049 at cuts 2020, 2022 and 2023). That is the post-2021 switching collapse, a regime no fit
  from earlier years could learn. The move term transfers and holds zero at all three cuts. Per-customer looks calibrated at 2022 only because its oldest contract year is fitted on the cut year alone. That
  makes it a recency estimator, not tenure knowledge, and slice 8 (landing now, pid 3863752) tests exactly that. So on this book the company has nothing to infer: departure p varies by sd 0.03. Inference
  cannot beat the flat baseline until the population varies, and that is EP17, the director''s curriculum call. Saying so plainly is worth more than a calibrated constant. B11 stays at L1, and its L2 needs
  a production caller (focus three). commit_split reads 5 supplier, 0 world and 2 other, and the 2 are B11 result files, so the stretch was fully supplier. The previous focus named four items and one was
  drawn. B11 was drawn and landed. The provision item was never drawn. The movers'' grade waited on B7 slice 7 reaching origin, and the slice never did: it gated green at 01:38 in /tmp/wt_b7s7 (9a7449b4b),
  its owner exited, and it sits on no remote. That is the first thing to fix. The long-job overrun ended by itself at 23:49. Nothing that would catch the next one was built, and I am letting that wait.
  My own 23:20 record never reached origin either. No level moved, for a fourth stretch. D48''s L2 lands with Monday''s publish (2026-10-12 03:00 UTC) and is recorded after it, not now.'
