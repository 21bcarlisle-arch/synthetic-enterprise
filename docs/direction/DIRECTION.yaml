focus:
  - id: the-company-estimator-learns-from-its-own-book
    what: >-
      **Lane 0. Make the company's competitive-pressure belief answer to what the company OBSERVED,
      and make the guard grade what the company ACTS on rather than the table it starts from.**
      Two increments, and the first is cheap — do it first and report it before building anything.
      (1) `tools/couple_value_based_pricing._SIDE_TABLES` reads the company side as
      `company.crm.market_conditions:MARKET_SWITCHING_RATE_PCT_BY_YEAR` — the PRIOR. The company
      does not renew on the prior: `company/crm/competitive_pressure.py` already carries the
      posterior machinery (`reading()`, `PressureReading.moved_from_prior`,
      `derived_market_pressure_multiplier`, `weight = PRIOR_LOG_VARIANCE / (PRIOR_LOG_VARIANCE +
      v_evidence)`). Point the guard's company leg at the posterior, keep it fail-closed when there
      is no decidable reading, and **run it**. (2) Then answer the question that first run poses,
      honestly and whichever way it comes out: **does the posterior move off the prior at all on
      this book?** `value_arms.json` says the arm priced 20 of 1,369 renewals, so the evidence
      weight is around 0.5 at best and may be 0 for most years — in which case the company's acted
      belief IS the published series, the guard's verdict is unchanged by construction, and the
      discharge is a book-depth problem that lands on item two rather than a re-fit. Say that in
      those words if it is what the numbers say. **Do not manufacture independence.** Adding noise,
      a free offset, or a second source chosen because it disagrees would be fitting the world to
      the claim; the only legal route is the one the guard names — the company's own realised
      departures. If the posterior does move, measure by how much, in which years, and whether the
      divergence it creates is inference or just a thinner sample.
    why: >-
      First, because it is the only item on this list that is about the thesis itself rather than
      about evidence for it, and because THIS STRETCH CREATED THE HOLE. The director's standing rule
      — *"Independence is not inference… the belief-versus-truth gap may be published as a
      measurement, never as evidence of skill"* — was written when we had independence and no skill.
      We now have neither, measured: `co_calibrated: true`, `indistinguishable: true`, max
      divergence 1.80pp in 2023, zero years further apart than the band is wide. A supplier whose
      competitive-pressure prior is the published market series knows exactly what every other
      supplier knows, and the thesis says the advantage must come from inference and never from
      access. The route is not speculative: it is written in the guard's own
      `what_would_discharge_it`, the posterior code already exists, and the correcting finding filed
      it as the open question. It goes first ahead of the cheaper items because a bounded tick will
      otherwise do the cheap ones and leave this, and it has now been the named next step in two
      artefacts without being anyone's item.
      **Done means:** the guard's company leg reading the posterior and fail-closed when it cannot;
      the verdict re-run and stated with both readings side by side; and a plain answer to whether
      the posterior moves on this book, INCLUDING the answer "it does not, and here is why" —
      which is a finding, not a failure, and hands the discharge to item two.
  - id: the-value-arms-ab-runs-in-the-world-as-it-now-is
    what: >-
      **Lane 0, and it is now THREE things at once — that is why it is here rather than fourth.**
      Re-run `tools/run_value_cycle_ab.py` against the world as it stands and read the result.
      (1) The published comparison is stale in a way the page itself cannot show: `generated_at`
      is 2026-08-31T00:56:24Z but `run_generated_at` is **2026-08-30T10:37:06Z** — re-rendered, not
      re-run, so every headline on that page predates the departure-level anchor, C1a/C1b's SVT
      product AND last night's switching correction. Three world changes, one unmoved baseline.
      (2) Its own headline names its blocker: *"that growth is NOT reachable by acquiring customers…
      drawn households' renewals stop for want of a standard-variable product to be moved off. The
      lever is a PRODUCT, not a size."* `simulation/svt_product.py` landed at `067a00dfd`. **Nobody
      has re-measured whether the lever worked.** It said ~27 priced renewals against this book's 20
      would bring the bar under the gap, ~41 against the published bound — so report the priced
      count first, before the money, because it is what decides whether any headline is readable.
      (3) This is C3's named blocker, verbatim from its own write-up: *"C3 remains NOT LANDED. The
      blocker is now specific and testable: the value-arms A/B run."* The arm is two files against
      `915bfab9b` — **cite the salvage tag `salvage/c3-shown-price-measure` (`f93fd1ea9`)**, not the
      branch (the orphan reaper's enforce mode deletes the name) and not the `/tmp` worktree.
      Whatever the money does, write it down: an improvement is as suspect as a loss here, because
      three changes moved at once and single-variable attribution is not available — say "I cannot
      yet attribute this" rather than picking the flattering cause.
    why: >-
      Second, and it collapses three separate owed things into one run, which is why it outranks a
      live wrong number. The thesis is explicit — *"there has to be a BASELINE to beat… or 'it
      performed well' means nothing"* — and ours is currently computed in a world that no longer
      exists, published, with a caveat that reads as provisional rather than as obsolete. It is also
      the director's own named roadmap position (*"carry on: C1b, then the rest of the
      choice-and-channel roadmap"*), and C3 is the only step left blocked, on exactly this. And it
      is the honest place item one's second increment lands: if the posterior cannot move because
      the arm priced 20 renewals, then book depth is the constraint on the whole thesis and this run
      is what establishes it. It sits below item one only because item one's first increment is an
      hour and this is a run plus a careful read.
      **Done means:** two arms re-run in the current world; the priced-renewal count reported before
      any money figure; the published page carrying the new run's identity rather than a re-render;
      C3 either landed with its sign bounded across price positions or its blocker re-stated with
      what specifically is still missing; and any direction of movement recorded, including one that
      flatters us, marked as unattributable if three changes moved at once.
  - id: the-board-facing-copy-of-the-refuted-table
    what: >-
      **Lane 0. `tools/population_anchor.py` carries both shapes of the defect item two of the last
      direction just closed, it is board-facing, and it is outside every census in this repository.**
      Line 45 `CALIBRATED_MULTIPLIER` is a **byte-identical copy** of the ten numbers refuted last
      night (`2016: 2.17 … 2020: 0.95 … 2022: 0.44`). Line 37 `OFGEM_SWITCHING_RATE` is rate-shaped,
      cited to "Ofgem Retail Market Indicators", and reads **14% for 2020** against a published
      22.5–23.0 and **9% for 2021** against 17.9–18.4. This gate runs on every sim run, writes
      `site/state/population_anchoring.json`, and reaches
      `saas/reporting/annual_report._section_population_anchoring` and the published project state.
      **Knowledge first, and this is the whole reason it was deferred rather than done fast:**
      `OFGEM_SWITCHING_RATE`'s own comment says "% of **dual-fuel** accounts", and the commons
      states in terms that a both-fuel count over an electricity account base reads about **1.8x
      high**. Settle the denominator from
      `docs/domain_artefact_library/regulatory/gb_domestic_switching_rate.json` and the published
      record FIRST; if the record cannot settle it, that is a finding to file and the constant
      carries an honest refusal, not a number overwritten to make a band go green. Then repair both
      declarations against whatever the record establishes, and widen the census: both existing
      censuses are scoped to `company/`, `saas/` and `simulation/`, which is precisely the
      enumerator blindness `test_year_keyed_rate_table_census` was written to fix, one directory
      over. Add a leg that fires when a level-shaped reading appears in `tools/` unregistered.
    why: >-
      Third. It is a wrong number on a page a board reads, produced every run, and the only reason
      it is not first is that item one is the thesis and item two unblocks the director's roadmap —
      not that this is tidying. It is the direct continuation of the thread the last direction
      opened: the old docstring claimed the multiplier *"matches the calibration already published
      for board-facing population anchoring"*, and it does — which is the problem, not the
      reassurance. Correcting `company/crm/market_conditions.py` alone leaves the company's belief
      and the board's anchoring gate asserting different things about one published series, which is
      the VAT class the director named on 2026-08-30 (one rule, several implementations, one of them
      repaired and the rest live) reproduced within twenty-four hours of the rule being written.
      The seat is the only place that can see it, because each lane's census is correctly scoped and
      correctly blind.
      **Done means:** the dual-fuel denominator settled from the record or an explicit refusal filed
      with its reason; both `tools/population_anchor.py` declarations answering to whatever that
      establishes; the census reaching `tools/` with a mutation leg proved firing on a new
      unregistered reading; and the moved board-facing figures reported, including if the anchoring
      verdict changes.
  - id: what-the-guard-now-refuses-must-reach-a-reader
    what: >-
      **Lane 0, small, and it is the surface half of item one.** `tools/inference_claim._sentence`
      derives its prose from the flags rather than carrying a hand-written claim beside them — that
      is good design and it is why the reversal should self-correct. **Verify that it did, from the
      reader's side, not from the producer's.** Run `python3 -m tools.inference_claim`, then find
      every published artefact whose text descends from `shared_calibration_holds` (`proof.json`,
      `value_arms.json`, `capabilities_door.json`, `delivery.json`, `simplified.json` are where to
      start) and establish what a reader actually sees today. Three outcomes and each needs a
      different action, so do not assume the first: the sentence has flipped to the
      "measurement and not evidence of skill" branch and needs only a verified publish to origin;
      or a page still asserts *"the two sides are independent"* — in which case it is a live wrong
      public claim and goes to the front of this item; or the verdict reaches **no reader at all**,
      in which case the honest finding is that a fail-closed guard the director made his priority
      publishes nothing, and that is worth more than the check. Verify by SHA on origin and by the
      rendered string, never by the publisher's own report. Note while you are there that four
      commits (`6168ae6bf`, `27a646701`, `2b9fb79d9`, `ae12a334e`) are local-only — `origin/main` is
      `c9d0dab6d` — so a publish must carry them before any of this is readable.
    why: >-
      Fourth because it is half an hour, not because it is optional. CLAUDE.md's rule is *"fail
      closed, and say so ON THE SURFACE — 'we cannot tell' is a result, it belongs on the page, not
      in a footnote."* The single most consequential thing this stretch produced is a REDUCTION in
      what we may claim, and it currently lives in one staging document. The claim grammar here can
      express its own negation, which is the failure class this project has been caught by before,
      so the likely answer is that it works — and a check that confirms a good design is cheap and
      is how the design stops being a hope. The director's most expensive class this month is his
      own words: *"'in the tree' and 'on origin' are different claims and you reported the first as
      the second."*
      **Done means:** the derived sentence read off origin rather than the working tree; whichever
      of the three outcomes holds stated plainly; and if the answer is that no reader ever sees this
      verdict, that filed as the finding rather than quietly satisfied by the check passing.
