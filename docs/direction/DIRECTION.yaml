  - id: read-selection-with-and-without-arrears-write-offs
    lane: B_commercial
    what: >-
      From the existing artefacts, with no new run, split the selection leg into a churn-pricing part
      and a credit part. The artefacts are /var/tmp/se-retake-belief/value_cycle_ab_s1_three_arm_20261002c.json
      and the 1002b three-arm. Report selection per account with and without arrears write-offs,
      and name every account whose sign flips. For PROS-2016-0098 and each such account, record what
      the company could see at its renewal date. Did the arrears state that ae101f936 routes to the
      renewal reach the value arm's price for that account, and with what effect? Write the result
      as a finding in docs/staging/records/. If the value arm sees arrears and does not price them,
      file it as a defect against company/pricing/value_based_renewal.py. If the arm cannot see
      them, file it as a gap. Do not change any pricing code in this item.
    why: >-
      The thesis reading says the flat rule beats the per-customer view by £4,208. 193% of that is
      one account the flat rule priced out by luck. A seed mean will average that, not explain it,
      and it will be read as the value arm choosing badly, which is the wrong cause. Settling the
      cause costs no compute and decides what the floor's verdict means. DONE when the split and
      the arrears-visibility answer are on origin as a finding.
