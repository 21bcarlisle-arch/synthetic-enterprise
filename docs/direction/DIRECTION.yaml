  kind: strategy
  what: 'Does a retention discount offered to a household fixing off our SVT buy anything? Our world says no: at that term it gives the household no exit
    (svt_conversion_event, P(depart)=0), yet 32 of 60 retention offers (59% of retention spend, GBP 1,765) go there.'
  proposal: I recommend we treat the world as right and stop offering a retention discount at an SVT-to-fix conversion; it is a fact the supplier holds,
    so it needs no estimate. Then the C29 engagement weighting gets graded on rolled terms only. If the industry instead sees the offer as what wins the
    conversion, tell me and I will file it as a world-fidelity defect instead. I will carry on with everything else meanwhile.
  status: withdrawn
  resolution: 'Withdrawn by the seat 2026-10-10, because its premise moved. Re-read on run 224e4af02, after b922911b7 and aac535f08 (addendum in docs/staging/done/SEAT_FINDING_C29_THE_BOOK_ARM_SURVIVES_THE_REFIT_AT_HALF_ITS_LIFT_2026-10-05.md,
