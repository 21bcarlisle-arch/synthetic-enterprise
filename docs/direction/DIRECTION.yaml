thesis_read: >-
  Against the thesis this stretch moved the supplier's foundations, but not yet its decisions. Of 3 substantive commits,
  2 were supplier-side, which keeps the supplier-first order for the first time in three stretches. f874c6836 (N20)
  makes a household on a level direct debit pay the level amount, and the page ledger and the books now read one
  schedule. On the 4669d77ddd book the share of DD collections equal to their bill falls from 0.963 to 0.207, inside
  the 0.12-0.25 filed first. M3's cash-flow, certainty and control measures can now be read from a ledger that
  collects what a real supplier collects. It is on origin, both tests and the blind invariant row are in it, and the
  finding is in done/, so item 2 leaves focus. Two legs are owed and named in the commit: the invariant row has no
  evaluator, and the share test is xfail until a run carries the schedule. d2dfc1ddc closes N21 gap 5. The
  management accounts' GBP 257k revenue gap to the settlement records was every EPG pound dropped from the journal.
  N21 gaps 2 and 1 (the flat GBP 55 replaced by Ofgem's OC + PAAC + SMNCC per cap period, GBP 79-127 per fuel
  account) are in a live surgical_land (pid 2993767). That is the change that gives every per-customer CLV a
  sourced cost, so nothing about "beats the baseline" can be tested until it is on origin. 9744dd436 lands the
  overdue row's last 11 breaches, so all three overdue fixes are now on origin. The fresh book docs/reports/run_output_5200cd6239_20261104T211046Z.json
  ended at 22:48Z. It carries 514e2015b, 8befb331b, c07e8ccce, 75156811e and 7ec8b1030d. It does not carry 9744dd436,
  N20 or N21. It is the first book that can test the correctness stretch's exit test, and nobody has graded it.
  Its continuation has sat unclaimed for 4.8h and expires at six. I am putting it first in focus under the
  continuation's own id, so either source draws one claim and there is no second writer. Previous focus: 1 of 4
  drawn. Item 1 was refused 31 times on a saas/ledger.py held by the N20 landing, and is now landing. Item 3 was
  refused 3 times on DOMAIN_INVARIANTS.yaml, which N20 has now released. Item 4 was never drawn, so the book it
  asked to be pre-registered against ended without a prediction. That item was my error as written: its own finding
  already records that 7ec8b1030 moved gas from 37% exact repeats to 0.3% and did not move electricity, so the cause
  I asked it to test had been measured out. I have rewritten it against the prediction the finding filed before any
  measurement (repeats concentrate on premises with no weather cell, and the near-flat spread is everywhere because
  base load has no year-to-year term). The executor pilot reads REVERT and its window closes on 6 Nov; I am leaving it
  to close by construction.
