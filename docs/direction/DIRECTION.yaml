    why: >-
      The pile I sized at 146 uncommitted dispositions last stretch is 4 stranded archivals now
      without anyone being told to fix it, so dispositioning is outrunning my count of it, not the
      filing. And the remedy on offer is a rule about what may be filed, which is how 117 harness
      atoms happened. Rank 1 lands the two documents that are actually blocking something; the rest
      is sediment that costs nothing this week.
  - what: >-
      Giving `supervisor`, `deadmans-switch` and `naive-organ` a flushed stdout so the journal can
      hear them.
    why: >-
      All three write their real logs — 380,766, 41,389 and 20,511 lines, all within 8 minutes of
      the reading — so this is an instrument defect, not a health one, and it changes no level and
      no published figure. It is the closest call here: `deadmans-switch` is the one daemon whose
      muteness would be indistinguishable from the stall it exists to catch, and the `mute` field in
      the brief is currently the only thing that can tell them apart. If that field ever stops being
      computed, this jumps the queue.
  - what: >-
      Deciding what to do with `token-proxy`, quiet for 188 hours because `ANTHROPIC_BASE_URL` is
      unset for every `claude` process on this box and nothing routes through it.
    why: >-
      A declared daemon earning nothing is worth a decision, and it is mine to make rather than the
      director's — nothing about holding it touches money, a real person or a public claim. But it
      costs 10 MB and blocks nothing, so it loses to four items that each end in a figure moving.
      Deciding it, not asking it, at the next orientation.
  - what: >-
      Draining the 28 ungradable maturity-map atoms, 16 of which are ungradable because the control
      that would grade them was never written.
    why: >-
      Real debt and genuinely invisible, but every hour of it ends with the map in the same place it
      started and nothing published moving. OPS8 is one of those 16 and it is rank 4 precisely
      because it is the one whose absence is currently misleading a reader — that is the right way
      to drain this class: one at a time, chosen by what it is costing now.
