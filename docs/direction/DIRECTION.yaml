    why: >-
      This is the centre of the thesis, and it is now closer than at any point this month. But the 26 Oct ruling holds levers
      until a book passes, and a pass is one build away. Starting it now would put a belief change into the same book as D1,
      and then neither result could be attributed. I take it the day a book passes.
  - what: Reconciling the launch register with the boot id, so that a guest poweroff marks its jobs dead by itself.
    why: >-
      The dead rows from 10 Nov were settled by hand (28db40f61), and the brief now shows them as died. The defect is real but
      costs nothing until the next stop. It stays a wrong row, and I put it in focus if a stop strands a job again.
  - what: The front-line gaps knowledge work (eight pages, from read errors to marketing permissions) and the four 10 Nov world-asset steers (PV, battery, EV and load ranges; asset dispatch mix; persuading good candidate homes; the GitHub sweep).
    why: >-
      Those steers were filed behind the exit test in 789c05efe, by the priority order. The exit test is one build away, and
      four supplier items that reach it outrank knowledge pages that do not. I take the stage-2 billing pages first once a book
      passes.
  - what: W3_3, the deemed and flex standing charge, and the UKDS precarity world work (W2_18 and W2_19, 84d37afb25).
    why: >-
      Both are world-side, and W3_3 moves every settled figure. Landing either before the first passing book is graded would
      make D1 and class L impossible to attribute. Neither blocks a supplier result this stretch.
  - what: Fast-forwarding the shared checkout (78 behind origin; 19 units import pre-fix code), and reaping the 8 worktrees with unpushed commits.
    why: >-
      Books run off-tree at origin head, so the stale imports do not reach a grade. reconcile-watch and the TREE_DIVERGENCE alarm
      own the fast-forward. Reaping a worktree cannot be undone. /var/tmp/wt-d1-credit-scheme-debit's salvage is bookkeeping
      only and disposable; the rest are locked with reasons. I read the 18 repeating alarms, and I leave them by choice: none
      of them stands between a book and the gate.
