  - id: the-decision-count-is-the-thesis-reading-and-the-world-changed-under-it
    what: >-
      The world gained the SVT exit at `05684780e` (`simulation/renewals.py` — the household that
      ARRIVED on the default tariff now reaches a fixed term). The funnel figures on
      `site/data/value_arms.json` — 2,824 offered / 2,490 `product_not_upliftable` / 227
      `acquisition_term` / 107 decisions that existed / 104 scored — were measured on a feed produced
      BEFORE that edge existed. After the next completed run publishes, re-read those five counts
      from the live feed and state, in a filed finding, whether `decisions_that_existed` moved off
      107 and in which direction, and what the discrimination reading is on whatever n results. Say
      separately what each number counts: the 54-decision `inference_claim` population and the
      104-scored `decisions.discrimination_auc` population are two censuses and must not be
      differenced. If the count did not move, say so and name what in `renewals.py` stops the new
      edge reaching a priced boundary. Do not build a targeting or conversion desk under this item.
    why: >-
      The thesis needs the advantage to come from inference, and inference cannot be told from noise
      at n=54 or n=104 — both readings sit inside their own nulls. The product-gate finding removed
      the company-side explanation for the small n, so the only remaining lever anyone has actually
      changed is the world-side edge that landed this stretch. This is the first time a live causal
      change sits upstream of the number the thesis is judged on, and it is a prediction that can
      refute itself. DONE is a filed finding carrying the re-read counts and saying plainly whether
      the reachable surface grew.
  - id: the-sweep-cannot-see-a-finding-that-names-its-own-claim-id
    what: >-
      In `background/delivery_lane.py`, `_claim_paths` returns the paths a draw stamped from the
      ITEM'S PROSE, so the 02:24Z sweep asked git about three clean paths and then attributed 23
      unrelated ones BY TIME. The by-NAME discriminator already exists in the artefacts: a filed
      finding's header carries `**Claim id:** <id>`. BEFORE WRITING ANYTHING, grep
      `background/delivery_lane.py` and `background/` for an existing content-side claim-id reader —
