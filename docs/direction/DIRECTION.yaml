thesis_read: 'The supplier-first item was answered, and the correctness stretch did not exit. 1eaf19d78 settled
  the debt-after-the-last-rung question knowledge first: a supplier may act on a stale arrears balance but need
  not, and on the published book 0 of 35 accounts holding a bill more than a year overdue went 12 months without
  a desk act, so no step was built. That is a supplier decision recorded with its reason, and the brief counts it
  as ''other''. The seventh cold read (3ba98b87b), in a new trade (consumer protection and collections), graded
  leg one met as the gate reads it, and legs two and three not met. It found three new classes, and two are supplier
  defects a real customer would feel. N14: 8 pay-on-receipt customers were back-billed beyond 12 months, GBP 111
  in all, because billing reads an undated payment method. N15: the desk told 222 accounts that they had missed
  a bill they paid. N16: the Explore tariff label ignores the term in force, so the renewal slot tells a four-year
  SVT customer that their fix is ending. The storage slot tests a meter, not heating. So the exit test is further
  away than the 03:20 record implied. Its own leg one is green only because no invariant row asks N14-N16, which
  is the instrument''s blindness again: the reader missed N14, and only the seat''s named check found it. Two machine
  fixes landed. 4f7468e1d makes a billing landing run tests/company/billing whole, so its triage row is retired
  as fixed and leaves wrong. Its simulation half is deliberately not built (13 of 79 importers took 1,447s). d3888b81b
  stops the sim-runner tests clobbering the live dashboard. d56b52dee explained the naive organ''s silence: 104
  open questions hold its debounce. It is readable now, not repaired. Against the thesis, nothing moved. No per-customer
  decision exists that a flat-rule baseline could fail to make, and the live renewal belief still ranks leavers
  backwards. The split was 0 supplier, 4 world and 20 other of 24, with 8 no-work merges. The world''s 4 were the
  weather store: N13''s HDD rebuild and three ERA5 increments, which is fidelity work owed under the ruling. But
  zero supplier commits is a stretch that went sideways for the company, and the supplier''s work this stretch was
  a read and a knowledge page. Of the previous focus, 4 of 5 were drawn and finished. The fifth (the last two notices
  before the miss) was not drawn, for the second stretch running at the tail. It now sits in not_now behind N15,
  which is the same file and the larger instance. This record puts the two supplier defects first, the page label
  third, and the three blind invariant rows the ruling owes fourth, so a fresh run can grade all of them, and N13''s
  HDD rebuild, at once. Two loose ends. The ERA5 pull needs one run per UTC day for about eight days, and nothing
  owns it, because its continuation retired at 05:22Z. It feeds only fabric eligibility, so it is in not_now. The
  at-risk worktrees are unchanged, plus a new unlocked fork salvage (agent-a2883773f258c8d08, 05:01Z) that nobody
  has read.'
