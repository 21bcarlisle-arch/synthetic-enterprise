thesis_read: 'This stretch moved the basics forward for the first time in two days, though no gate level moved. Both previous
  items that could be drawn are finished, and they leave focus. E6''s arrears overlay is off on origin, because the second
  seed failed leg (c) of the rule filed before it ran (994c87103). The held-cash order fix landed (12246cbae), and a default-book
  full run finishes at origin again. Its grade (4ae8da9b0) holds every leg it can read. Closure refunds are on time (0 of
  28 late). No dual household has two ledgers. The company decides the debt objection itself, 1 raised of 101 asked, and the
  world draws none. 0 of 24,442 default-tariff bills are over the ceiling. So two rows in wrong close. But the gate reads
  0 of 8 at target. The run cannot show leg (d): no output key carries ADDACS, so a household''s own mandate cancellation
  still changes nothing the company can see. That is W2_41''s level 2, and PB8''s level 2 behind it. PB8 was named twice and
  drawn neither time. Its stage is idle, and an atom-id focus item only reaches build-stage atoms, so the steer itself was
  the drift. This record re-keys it. B8''s per-channel offer read now needs a difference as well as power (e847cd123). 12,096
  of 16,788 channel reads fall to 0, and acquisition P1-P3 still fail. That is the honest direction: per-customer reads that
  were only powered noise are gone, and nothing priced moved. Against the thesis, inference has still not beaten the flat
  baseline anywhere it has been graded. The corrected renewal belief carries no policy, and the ruling keeps it behind the
  basics. The split reads supplier 3, world 2, other 17. Seven of the 22 commits were re-gate merges with no work, inside
  the accepted rate. Monday''s publish opens at 04:00Z on a run graded clean, and the publisher re-grades whichever run it
  is offered.'
