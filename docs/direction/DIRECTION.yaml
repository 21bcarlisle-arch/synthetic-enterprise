  5 INV_CLOSED_ACCOUNT_BALANCE_REACHES_ZERO breaches left after N29. Four are the older-run/newer-walk cross arm, to the penny,
  and SYN-2016-139 is the refund clock starting on old credit netted at close, excepted by name at a ceiling of 1 so the 16
  Nov publish is not refused for a traced defect. That defect is now two queued continuations, and the seat executor is landing
  the issue-day half (surgical_land pid 3287303). The steer did not bite: 4 named, 0 drawn. That is not a draw defect this
  time. Both lane slots were held by claims already in flight on the same billing row: the seat executor on final-bill-issue-day-has-two-homes,
  and the worker tick (claimed 14:39Z) on level-dd-final-bill-world-nets-level-surplus. That second claim is the world''s
  F net, whose first landing (pid 1688796) died with nothing on origin and left 18 lines of background/live_payment_triad.py
  uncommitted in the shared tree. So item 1''s premise is still unspent, and it now waits on that worker rather than on a
  dead pid. The commit_split is 0 supplier, 0 world, 3 other. That is machine-heavy on its face, but the in-flight work is
  all on the supplier''s account page. The shared checkout is now 54 behind origin (51 last stretch), the brief still counts
  the retired refund finding as BLOCKING, and reconcile has drawn nothing in two orientations. The flat-baseline comparison
  (c65c4cb8b, B11) is still the only test of the thesis, and it stays held to 16 Nov. No cold read has run in seven days,
  so the exit test it launches on is not yet met. Items 3 and 4 are what make 16 Nov reachable. The focus is unchanged in
