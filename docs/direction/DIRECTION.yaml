  - what: >-
      The unranked accretion — forty-six documents in the staging root, the undeclared-worktree
      alarm, and the orphan-branch alarm's fifth firing.
    why: >-
      `finding_classes --check` passes, BLOCKING is 0 against 20 LATENT and 24 RECORDED, and none of
      it wedges a commit. The orphan-branch alarm fires because it is keyed to the branch name
      rather than to whether the work is reachable, and the salvage tag landed last stretch — it is
