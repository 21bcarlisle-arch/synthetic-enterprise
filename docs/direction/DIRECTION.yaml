- id: c7-fifty-months-unread-is-graded-against-the-read-duty-and-the-back-billing-bar
  lane: D_billing_metering
  side: supplier
  what: Knowledge first (K8). Read SLC 21B (a read at least once a year) and SLC 21BA (no charge for energy
    used more than 12 months before the bill, unless the customer obstructed) in docs/domain_artefact_library/,
    and amend or create the knowledge page that states them. Then, over the committed run output and billing
    ledger in a fresh origin worktree, take a census of every account with an estimated run over 12 months.
    For each, record what the company did to get a read, and what share of its catch-up kWh and pounds
    was billed for energy used more than 12 months before the catch-up bill. Start with C7 (51 months,
    +41,778 kWh billed 2020-03-31, per docs/staging/WORKER_FINDING_D48_ELECTRICITYS_PRE_2020_UNDER_BILL_IS_ONE_UNREAD_EV_HOME_BILLED_ON_THE_TDCV_FALLBACK_2026-10-16.md
    section 4). Pre-register the counts before running. If the company bills past the bar, fix it in company/billing/
    by writing the barred amount off as the supplier's cost, and add a control that reds on a catch-up
    charging energy older than 12 months. If it makes no read attempt, file that as a finding on D48,
    naming the smallest company mechanism. In the same item, add the largest single run's share of the
    graded net beside K1's published figure, the fix that finding proposes, so a one-account figure can
    no longer read as a population bias. Do not commit a regenerated ledger.
  why: 'Back-billing is named in the director''s supplier order, and a supplier that bills four years
    of catch-up in one letter breaks the licence and lands the shock on a real household. The census says
    whether C7 is one account or a class. DONE: the knowledge page is published. The census table is in
    a finding. Either the 21BA write-off is on origin with its control, or the finding shows no catch-up
    crosses the bar. K1 carries its concentration figure.'
