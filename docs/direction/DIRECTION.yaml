  side: supplier
  what: 'Write the coupled gap-ledger row in docs/observability/coupled_gap_ledger.json for W2_36 (unbilled
    energy) against D48. Before measuring, write down in the row''s baseline text what the gap is: the
    company''s company/billing/billing_accuracy.py estimate of each account''s billed-minus-used energy,
    against the world''s true consumption over the same period. Say whether it is in kWh or as a share
    of use, and name the no-skill baseline (every account assigned the book''s mean unbilled share, formed
    from what the company could know at belief time, not from the graded outcome). Compute it on the newest
    fresh book through background/gap_ledger_reconciler.py, with the population''s size and an interval.
    Then do the same for W2_30 and W1_14 if the same definition holds for them; if it does not, say why
    in their rows and leave them unmeasured.'
  why: Billing accuracy is first in his priority order, and this is the supplier knowing how wrong its
    own bills are, measured against the truth it cannot see. That gap is the inference-not-access test
    applied to billing. It is also the one missing number holding three world atoms at the L3 wall. Done
    means W2_36's hold reason no longer reads "unmeasured", and the number sits with its definition and
    its bound.
