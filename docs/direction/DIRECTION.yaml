focus:
  - id: give-the-company-an-observable-channel-for-competitive-pressure
    what: >-
      `company/crm/market_conditions.market_conditions_multiplier(renewal_year)` is a ten-entry
      hardcoded table (2016: 2.17 … 2025: 0.93) and is the ONLY competitor signal reaching
      `company/crm/enriched_churn_estimate.py` (lines 104, 139) and `company/crm/churn_model.py:217`.
      Give the company a competitive-pressure belief it DERIVES from observables it actually
      receives at `company/interfaces/sim_interface.py` — its own realised renewal losses, its quote
      win rate, gross adds against losses per period — and let that derived quantity move the
      estimate, keeping the published year series as the prior it updates from rather than the
      answer. `simulation/competitor_reference.py`, `chase_per_quarter` and
      `docs/design/COMPETITOR_AGGRESSION.yaml` must not cross the wall, directly or transitively;
      the epistemic verifier is the check. Then re-run the chase-on / chase-off pair exactly as
      `docs/staging/WORKER_FINDING_THE_LADDER_RESOLVES_THE_DEFENDING_MARKET_AND_THE_COMPANY_CANNOT_SEE_IT_2026-08-28.md`
      documents it (one tree, identical book and seeds, `docs/observability/aggression_chase_off.yaml`,
      asserting `aggression()["chase_per_quarter"] == 0.0` before the run) and report whether
      `believed_p_leave` now differs between the two worlds and by how much against the gap it is
      trying to close.
    why: >-
      This is the thesis itself, and it is now measurable for the first time. The world presses at
      every rung and the belief does not move at all, so "the advantage comes from inference" has no
      subject on this dimension — the company holds the same view of competition whether or not a
      rival is chasing its book. It is also B10's remaining L3 leg and the finding names it as
      company-side, so this is the one item here that can record a level move rather than tidy
      something. Done means: the belief demonstrably moves between the two worlds, a control fails if
      the channel goes back to being a constant, the verifier passes on the wall, and B10's level move
      is RECORDED with the measured belief-vs-truth gap — or the refusal is recorded carrying its
      numbers. A belief that still does not move is a publishable result, not a failure, provided it
      says why.
  - id: bind-a-reissued-claim-to-the-work-that-already-landed
    what: >-
      In `background/delivery_lane.py`, `record_landing`'s `if when <= since: return []` is correct
      for a CONTINUING claim and wrong for a RE-ISSUED one. When a focus id is re-drawn, seed the new
      claim's comparison instant from the prior claim's rather than from the moment of the re-draw,
      so a commit that landed before the re-draw is still bindable; leave the guard intact for a
      first draw, where an older commit genuinely is somebody else's work. Leave a control, mutation-
      proven, that fails if a re-drawn id can never bind any commit — the FAIL-OPEN shape pointing
      the wrong way, where the progress reading is zero because the evidence is out of reach of the
      check. Then run `python3 -m background.delivery_lane --landed
      wire-the-sourced-acquisition-and-retention-costs --commit 0850eadcd` and confirm it binds, and
      do the same for `land-the-80-founder-book-the-director-already-ruled` against whatever commit
      the tick in flight produces.
    why: >-
      Two ticks this stretch were spent on work that was already at HEAD — the household column on
      2026-08-28 16:56, and the sourced costs, re-drawn 8m39s after `0850eadcd` landed them
      including their control. The trap is permanent once sprung: the re-draw writes a fresh
      `claimed_at`, and from that instant the satisfying commit is unbindable by anyone, forever, so
      the brief keeps returning the same finished item and a tick obeying it literally re-implements
      the work on top of itself. This is second and not first because the lane still DELIVERS while
      miscrediting — the founder book is landing right now — but it is what makes every other item on
      this list creditable, and it is what makes the record the director reviews agree with git. Done
      means a re-drawn id can be credited with the commit that satisfied it, and this file's own
      `previous_focus_drawn` stops reporting a no-op over work that landed.
  - id: re-run-the-arms-on-the-sourced-cost-basis-and-answer-the-filed-prediction
    what: >-
      `docs/observability/value_cycle_ab_s1_three_arm.json` carries `generated_at`
      2026-08-28T14:08:48Z; `0850eadcd` deleted `saas/growth_mandate.COST_PER_ACQUISITION` at 20:46.
      Run `python3 -m tools.run_value_cycle_ab --level-arm` to a NEW path
      (`docs/observability/value_cycle_ab_s1_three_arm_sourced.json`, never over the published
      artefact — a publish runs concurrently in this tree), diff it against the published one, and
      then do one of two things. If the arms moved, promote the new artefact, restate `/capabilities/`
      and re-derive `0850eadcd`'s attribution split, which was measured under conditions that would
      not then hold. If they did not move, say so on the page in terms: the sourcing repaired the
      company's P&L and moved the comparison by nothing, because acquisition cost was never one of
      `GROSS_TO_NET_LINES`. Either way write the outcome BESIDE the prediction in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_SOURCED_COST_RERUN_MUST_SHOW_2026-08-28.md`,
      not over it, and read no delta smaller than the 2026-08-27 noise floor's £4,402 sd as an
      effect.
    why: >-
      The site currently publishes a baseline comparison denominated in constants the tree has
      deleted, and the thesis says the comparison is the whole point of the exercise — "or 'it
      performed well' means nothing". A pre-registration with no answer beside it is the one artefact
      this project cannot leave lying around, because its entire value is that it was written before
      the result was known and that value decays the moment somebody could have seen the answer. Done
      means the artefact exists, the prediction is graded in its own file, and a reader of
      `/capabilities/` is told which cost basis the figures stand on.
  - id: put-the-bound-on-the-rendered-capabilities-page
    what: >-
      `site/capabilities/index.html` renders `arms-split`, `arms-errorbar` and the Provisional pill
      and contains no sentence bounding the comparison. Add to the door's render, and to the live
      surface, that this compares two internal policies in a market that could not react to either.
      Assert it the way `site/test_the_baseline_comparison_reaches_the_reader.py` already does —
      drive the real door through `site/_live_harness.mjs` and read the rendered DOM, never the
      generator output or the feed — and carry a mutation that deletes the sentence and reds the
      test, with the existing unavailable-feed null rung staying green through it. This is
      `SITE13_the_baseline_comparison_carries_its_bound`, level 0, file scope `site/capabilities/`.
    why: >-
      Fifth consecutive direction naming it. The director corrected this claim himself in
      `DIRECTOR_GUIDANCE_THE_WORLD_MUST_PRESS`; a caveat is retractable by construction, so it is
      mine to land and not his to approve, and it is the honesty half of publishing the comparison at
      all — which was right to do. It sits fourth because the three above change what is true and
      this one changes what is said about it, but it does not get to keep sliding: it is small, the
      test shape already exists in the same directory, and item one will only make the omission worse
      by giving the page a competitor story to tell. Done means the sentence renders on the fetched
      live page and a control fails if it stops.
  - id: land-or-delete-the-untracked-settlement-clocks-pair
    what: >-
      `simulation/settlement_clocks.py` and `tests/simulation/test_settlement_clocks.py` are now
      UNTRACKED, while `tools/run_annual_report.py:69` and `simulation/run_phase4c_on_phase2b.py:96`
      sit modified-unstaged in this tree carrying `from simulation.settlement_clocks import …`.
      Decide it: either commit supplier, test and both consumers as one pathspec, or revert the two
      import hunks and delete the pair. Do not leave it a sixth time.
    why: >-
      The danger changed shape and got worse rather than better. While it was staged, supplier and
      consumers moved together; untracked, any lane that commits those two consumers by pathspec —
      which is the normal, correct way to commit here — ships an import of a module that exists in
      nobody's clone. It has been named in six consecutive directions, which means nobody has
      decided it rather than that it is hard; it is a decision, not a build, and it is last because
      it is minutes of work. Done means `git status` shows neither the untracked pair nor the
      orphaned import lines.
