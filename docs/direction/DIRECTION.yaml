- id: practitioner-question-at-an-annual-direct-debit
  raised: '2026-10-10'
  kind: strategy
  what: 'Practitioner question: at an annual direct-debit review, does a GB supplier set the new amount from last year''s spend, from last year''s
    consumption at the rates in force now, and does it add recovery of the balance? Nothing published says. On the single-levy run, the company''s
    review resets to last year''s spend at last year''s prices and never recovers the balance. That review lag is -£17.8k of the DD book''s -£20.6k
    net debit at 2018-06, and it is why the book never shows the summer credit a real one holds.'
  proposal: 'I recommend sizing the review from last year''s consumption at the rates in force (SLC 27.15''s ''most current information''). CORRECTED
    2026-10-10 after measuring: I wrote that this was about -£11k of the debit, and it is £3.4k (lag -£17.8k to -£14.4k). About half of each year''s
    price rise comes after the review, which no rule can see. The rule is built and selectable, and the run''s default is unchanged because it
    missed its pre-registered £4k bar. The sharper question: does a supplier lift the debit by price changes it has already planned, or re-review
    when the price moves? Balance recovery stays your existing toggle until you say what the practice is.'
  status: answered
  resolution: 'Director, 2026-10-11T04:20Z: ''Your DD review question was answerable. Ofgem''s August 2022 decision strengthened SLC 27.15: a
    fixed DD must be set on the best and most current information in all cases, taking account of reads and of customer and third-party information,
    and reassessed when new information would change it materially. Close the practitioner question with this.'' He also set the shape: the DD
    amount comes from the company''s own twelve-month forecast for the property, priced at known rates where fixed and forecast rates beyond,
    plus the balance to be cleared.'
  evidence: tools/dd_book_legs.py; docs/staging/SEAT_FINDING_EVERY_SETTLED_BILL_CHARGED_THE_LEVIES_TWICE_2026-10-10.md (Prediction 2's residual,
    split and graded)
- id: the-capital-target-binds-from-2025-but
  raised: '2026-10-11'
  kind: canon_intent
  what: The run applies Ofgem's Capital Target from 2016, but it was decided on 26 July 2023 and binds from 31 March 2025; a supplier in 2016-2022
    faced no such target. The code also carries GBP 130 per account where the decision set GBP 115 (GBP 130 was the April 2023 consultation figure).
    saas/growth_mandate.py bounds the campaign's quote budget by capital per account, so both the figure and its start date shape how fast the
    book can grow. The figure is a factual correction the seat is landing as its own measured step; the start date changes which world the company
    lives through, so it is yours.
