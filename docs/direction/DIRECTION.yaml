  side: supplier
  what: 'CARRIED, never drawn. Write the pre-registration that EP17''s switch fires into, before any varied-draw
    run exists. Read EP17_varied_population_draw''s block_reason on origin (all four conditions are now
    closed: B12 badd57e8e, held estimate 650fdcdd7 graded in bdd6d1657, E6 slice 738b3f0ab, stayers),
