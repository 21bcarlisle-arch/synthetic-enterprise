      head=dcfa91f3d)", and origin reached `dc5968e8e` minutes afterwards via a reconcile merge. So
      the publisher creates its commit, loses the push to a concurrent lane's reconcile, records a
      refusal, and the content lands anyway under someone else's merge. The prior refusal in the
      same file was `fatal: cannot lock ref 'HEAD': is at aff4b153f but expected 56d746816` — the
      same concurrency fault at a different seam. Establish whether the publisher's post-reconcile
      verdict (9c4ce323f, already at HEAD) is reached on this path at all, or whether the refusal is
      recorded before the reconcile it was written to wait for, and make the publisher either win
      the push or read its own content's arrival at origin rather than its push's rc.
    why: >-
      `episode_failures` 43 → 46, `episode_clean_publishes` 0, `last_clean_publish` null,
      `wedge_since` unmoved — and I have now watched three different causes clear in sequence without
      the publisher grading one clean cycle itself, which is what tells me the causes are a queue and
