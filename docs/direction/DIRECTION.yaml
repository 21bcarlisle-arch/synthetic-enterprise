focus:
  - id: the-page-carries-both-the-served-sign-and-what-todays-code-returns
    what: >-
      Promote /var/tmp/se-floor18-head-20260925/shards/folded18_head_20260925.json into
      docs/observability/ under the noise-floor naming (it is scratch on a tmp filesystem and is
      the only copy of the 18-seed HEAD fold), then make the served value-arms surface carry BOTH
      readings of the selection contrast side by side, each labelled with the code it was measured
      on: the 2026-09-10 family at −£959.78 and 2.50 sems, and HEAD's 18 shared seeds at +£169.60,
      sem £544.86, 0.31 sems from zero. Neither is withdrawn and no direction is stated for either.
    why: >-
      He reversed this himself at 09:29 on 2026-09-26 — "Don't withdraw the selection figure — I
      was wrong to push that. Report what you found" — and named both numbers, so the withdrawal
      recommendation still sitting in the 2026-09-26 selection finding is countermanded and the
      page reporting only one of the two is the gap. It goes first because it is the one item that
      is both permitted under the slowdown, being page work rather than machinery, and losing
      evidence by waiting: the HEAD fold exists nowhere but /var/tmp and a reboot ends it. DONE
      when the door test for the value-arms page reads both figures and both dates from the real
      feed, and site/capabilities no longer implies a selection direction that HEAD does not
      reproduce.
  - id: the-publisher-episode-closes-on-a-later-clean-publish
    what: >-
      Finish his 08:44 instruction of 2026-09-26 in the second place the defect lives. Two named
      legs. First, an episode in docs/observability/.publish_gate_state.json must be
      re-evaluated when a clean publish lands after it opened: it currently holds episode_failures
      6 and wedge_since 2026-09-26T15:51:32Z with last_clean_publish at 22:30:53Z and total_red 0.
      Second, background/publish_freshness.describe() prints "content publishing: FAILING" while
      snapshot()["state"] in the same call reads "publishing" and figures reached origin 0.9h ago —
      the headline contradicts the field it claims to describe.
    why: >-
      "Make the failure clear when a later publish succeeds" was an instruction, and commit
      74900fcf0 applied it to the public banner's renderer rather than to the rule that closes an
      episode, so the identical stale state now misreports to the only reader left — the seat's own
      orientation, which opened this stretch believing the publisher was refusing during a working
      publish. This is not new machinery drawn against the slowdown; it is the unfinished half of
      something he asked for. DONE when a clean publish arriving after wedge_since closes the
      episode, and when describe() cannot say publishing is failing while its own state field says
      publishing.
  - id: restore-the-three-tick-cadences-at-the-reset-and-tell-him-the-values
    what: >-
      NOT BEFORE MONDAY 2026-09-28 LOCAL. At the reset, put the three hand-slowed user timers back
      to the values their files in background/ declare, and change nothing else: worker-tick.timer
      is installed at OnUnitActiveSec=14400s against a declared 1800s; seat-executor.timer is
      installed at OnCalendar=*-*-* 00/4:05:00 against a declared *-*-* *:05,35:00;
      delivery-seat.timer is installed at OnCalendar=*-*-* 00/12:20:00 against a declared *-*-*
      00/3:20:00. Then send him the three before-and-after pairs on NTFY.
    why: >-
      He asked for exactly this twice — "Put the tick cadence back at the reset. Tell me what you
      set." — and the restore gates the throughput of the entire following week, since worker-tick
      is running eight times slower than the tree declares. Doing it early would spend the budget
      he slowed the machine to protect, which is why the date condition opens the instruction. The
      telling half is the part with a trap: verify the send by the id NTFY returns and by
      docs/observability/.ntfy_delivery_state.json, never by a new line in
      docs/observability/ntfy-delivery-log.md, which records only failures and transitions and is
      silent on every healthy send. I could not establish from that log whether last stretch's
      drawn cadence message ever reached him, and its last recorded delivery is 2026-09-23. DONE
      when the installed cadences match the tree and he has the three pairs with a delivery id.
  - id: how-much-of-the-selection-residual-is-renewal-count
    what: >-
      AFTER THE RESET. Test his hypothesis rather than assuming it: across the 18 shared seeds of
      the HEAD fold, establish how much of the variance in the selection residual is explained by
      each seed's realised renewal count, and answer him plainly on whether a deeper book would let
      selection be resolved at all, with the bound 18 seeds earns and an honest "we cannot yet say"
      if that is the answer. This needs an instrumented run, not a re-read: of the 23 noise-floor
      artefacts under docs/observability/ only value_cycle_ab_s1_noise_floor_five_seed_head_
      20260924.json carries rosters at all, and NO artefact on disk carries a renewal count, so the
      run has to emit renewal counts beside each seed's residual.
    why: >-
      This is the only item that moves the thesis rather than the surfaces around it. The thesis
      needs an advantage from inference measured against a baseline, and the fold's finding is that
      identical priced decisions span residuals from about −£4,300 to +£1,550 on one fingerprint,
      so luck dominates and no selection claim is resolvable on this book. His own reading — "few
      accounts have enough renewals for a choice to compound" — is the first testable cause anyone
      has named for it, and if it holds then book depth stops being a fidelity detail and becomes
      the precondition for measuring anything, which is A46_book_depth_is_a_curriculum_question and
      therefore his call once the number exists. It sits fourth only because he said "after the
      reset", not because it matters least. DONE when he has the share of variance explained and a
      yes or no on measurability.
  - id: weekly-publishing-anchored-to-monday
    what: >-
      AFTER THE RESET. Make the 4 September weekly-publishing ruling a real gate anchored to Monday
      rather than a rolling seven days: publishing happens on Monday after the reset so the week
      opens with fresh numbers, and the cadence is enforced where publishes are actually emitted,
      not recorded as a number beside them.
    why: >-
      He measured it himself at 09:29 on 2026-09-26 — six publishes landed between Friday afternoon
      and Saturday morning — and the evidence that the ruling became a phrase rather than a cadence
      is in the feed the publisher reads: publish_freshness.snapshot() reports
      cadence_seconds 604800 while this stretch alone published roughly hourly. A ruling that a
      surface repeats and no path obeys is worse than no ruling, because it reads as enforced.
      DONE when a publish attempted off-Monday declines with its reason, and the Monday publish is
      what a reader sees.
not_now:
  - what: >-
      The completeness-sweep repair for `git restore --source=stash@{0}` silently skipping a path
      that is in the stash but in neither HEAD nor the index, where `git diff --quiet HEAD -- <path>`
      is quiet for an untracked path whatever it contains, so a genuinely lost file reports safe.
    why: >-
      Rejected an ELEVENTH time, and visibly, against my own written commitment that it would be
      the first item after the reset. The reason this time is authority and not the cost argument
      that carried the previous nine: he restricted the draw to product work and anything that
      genuinely blocks a landing, and this blocks neither. It loses to the four instruction-shaped
      items and to the one measurement that moves the thesis. My own wrong row is the evidence if
      the twelfth rejection arrives without a landing.
  - what: >-
      The one mode control he asked for — normal, slow, fold-only, off, set with one word, handling
      the three cadences and the restore itself — plus the product-only draw filter.
    why: >-
      NOT REJECTED, NOT YET DUE. He said "Start this after the reset on Monday, not before", and
      this stretch ends before Monday. It also loses to the hand restore it exists to automate:
      building the control first delays the cadence he asked to have back at the reset. And his
      22:04 addition is a precondition nobody has met — measure which routes actually SPEND TOKENS
      rather than which commit most, because most of this week's machinery arrived reactively and a
      product-only filter over the draw would not touch it. The next orientation should promote it.
  - what: >-
      Repairing the boot-sha fleet oracle so a checkout deliberately set behind origin makes the
      verdict say so, and the fixture class where a door whose shape changes does not re-run the
      synthetic trees built against its old shape.
    why: >-
      Both are machinery and the slowdown stands. The boot-sha one also has a measurement reason to
      wait that is worth recording: HEAD and origin/main are level this stretch, so
      evaluate_boot_sha_drift() returns 11 of 11 graded, stale empty, vacuous false — and that
      answer is CORRECT today by luck rather than by repair. The state that exposes the defect is
      absent, which makes now the worst moment to work on it and the best moment to write down that
      a clean reading proves nothing.
  - what: >-
      Establishing and filing a log_silence cause for sanity-daemon, the one mute declared daemon
      with no cause on file, mute for its whole 33h15m run and blocked in hrtimer_nanosleep.
    why: >-
      Cheap, and still machinery the draw is closed to this week. It is also not urgent in the way
      the brief's phrasing suggests: the five causes established so far came out as five different
      ones, so a class verdict is the one thing that would be wrong, and a careful single reading is
      worth more than a fast one taken during a slowdown.
  - what: >-
      Withdrawing the published selection sign to "not established at the current code", which the
      2026-09-26 selection finding recommended for Monday.
    why: >-
      He countermanded it directly — "I was wrong to push that" — so enacting it would be following
      a stale recommendation over live direction. Reporting both readings replaces it, and that is
      the first focus item. The finding's own text was corrected in commit 401cd5784; this row
      exists so a Monday tick that reads the finding rather than the correction does not enact the
      withdrawn plan.
