thesis_read: >-
  The steer bit this time. Last stretch's thesis item was drawn. A prereg was written before any
  output (a3b1ae3c5), and both legs launched at 08:51Z from a worktree pinned at origin b79e2c0e8,
  on one weather store (digest e11451b5…). That corrects my "never drawn" row. Then half of it
  died. The kernel OOM-killed run A (seeds 11111, 88888, 22222) at 10:01Z (the journal's 11:01 is
  BST), after 1h10m, at an 8.7 GB cgroup peak. It left no artefact, and nothing in this stretch
  recorded the kill. The brief does not mention it. Only run B (33333, 44444) is still alive, at
  8.2 GB. So the question the thesis turns on, whether the per-customer arm beats the flat baseline
  because of what it decided, is still where it was. At best this stretch yields two new seeds of
  five. The cause was not bad luck. The admission check that let both legs start prices a
  noise-floor leg at FLOOR_RUN_PEAK_MB = 6,400 MB (tools/run_value_cycle_ab.py). That figure is
  the MemoryPeak of a run that was itself OOM-killed, so it is a floor used as a ceiling. The same
  defect was found and fixed on the paired-leg constant on 2026-09-23, and it was left live on its
  sibling. A real --level-arm leg costs 8.2–8.7 GB. So I put the thesis item first again, reshaped
  to finish from what survived. The mispriced admission comes second, because it will kill the
  relaunch the same way. The phase4c short-window item is finished. The fixture runs to
  2018-12-31, and its wiring tests go red on an empty log (568ec4fe8, on origin). It leaves focus.
  The 14 fast-forward paths turned out to be copies origin supersedes (19286b105). That
  disposition also retires the not_done lane-0 row judge-the-stale-fold-noise-floor-test-copy…,
  which is the same subject under a second id. A reconcile merge is running now (surgical_land pid
  3989327). The shared tree is 50 behind, and its origin_reconcile.py still has 0 merge_budget
  hits against origin's 3, so that row stays open. Net: the machine served the thesis this stretch
  instead of competing with it, and the result is still owed.
