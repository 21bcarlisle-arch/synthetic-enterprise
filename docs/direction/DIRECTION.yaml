focus:
  - id: the-qep-value-arms-are-retaken-at-origin-one-leg-at-a-time
    lane: W2_customer_generator
    what: >-
      Finish the QEP level-anchor refit's arms in the existing worktree /var/tmp/se-qep-arms2 (origin
      96517e68c, locked, digest cdba75ebb9197b33). The three-arm artefact
      docs/observability/value_cycle_ab_s1_three_arm_20261004r.json is already written there. Check that
      it parses and is not a refusal, and do not re-run it. The floor died because the tool refuses
      fewer than two seeds per run (noise_floor's AssertionError, in
      /var/tmp/longjob-qep2-arms-floor-s11111.log). So launch ONE floor run with
      --noise-floor-seeds 11111,22222,33333 --redraw-mode all and an --out with suffix 20261004r. Launch
      it through background.launch_long_job with --peak-mb 11200, and only when no other heavy run holds
      memory. It takes about 8 hours. Its single artefact IS the floor, so the doc's --fold step drops
      out. Amend docs/design/UNLANDED_QEP_LEVEL_ANCHOR_REFIT_2026-10-04.md to say so, and to say why the
      per-seed plan could not run. Park the landing continuation rather than embargoing it past 6 hours.
      When the floor exists, follow that doc's landing sequence and land the refit with its arms in one
      commit.
    why: >-
      This is the only route that retires the switching artefact its own publisher refuted on 2026-09-07,
      and it brings 2024 departure back from 16.28% to 8.75%, against QEP's 9.03%. Focus item two's
      baseline comparison is only as good as the world it runs in. One leg already succeeded, and the
      remaining failure was a wrong instruction, not a wrong world. DONE when the refit commit is on
      origin with both arms artefacts from a base that contains ba320e2d2, or when a written refusal on
      origin names why the floor cannot run on this guest.
  - id: the-value-rule-against-a-flat-price-set-in-advance
    lane: B_commercial
    what: >-
      Ask the question docs/staging/records/SEAT_PREREG_A_DECISION_IS_CHARGED_ONLY_THE_BAD_DEBT_OF_ITS_OWN_TERM_2026-10-04.md
      names as the next test of the thesis. Score the capped value rule against a flat margin fixed IN
      ADVANCE from the company's own pre-period book: for each decision year, the flat level that would
      have been best on the decisions the company had already closed before that year, chosen with no
      look-ahead. Score both out of sample, on the same term basis and the same four paths as T1-T4.
      Pre-register the predictions in a new docs/staging/records/ prereg, and commit it BEFORE any run
      starts. Report the SNR beside every difference. Re-use the existing term probe outputs in
      /var/tmp/se-probe-out where the rows suffice, and re-run only when they do not. If the hindsight
      level and the ex-ante level coincide on a path, say so. That would be a finding about how little
      the book teaches, not a win.
    why: >-
      The thesis needs a baseline a flat-rule supplier could actually have run. Parity with the
      hindsight-best flat price (+341, -37, +79, +40, SNR at most 1.3) is an upper bound on what flat
      rules can do, so it cannot show that inference beats average. This item was held in not_now until
      T1-T4 graded, and they graded at f746cd4f5. DONE when the graded prereg is on origin and states,
      per path with its SNR, whether choosing per customer beats the ex-ante flat price, ties it, or
      loses to it. It may run on the current world. Say which world it ran on, and that the QEP refit
      will move it.
  - id: the-world-answers-a-plan-offer
    lane: C_customer_ops
    what: >-
      EP4 now records a plan offer (49ce42e6c), but the world never answers one. The arrangement,
      write-off and disconnection exits are unreachable. Knowledge first. Start from
      docs/market_research/company_debt_management.md (SLC 27.8, and debt by plan or no plan). From
      Ofgem's debt and arrears publications, establish what share of domestic debtors offered a
      repayment plan take one up and keep to it. File it as a sourced anchor with a **Knowledge:**
      topic. Then, in simulation/, have the household answer a plan offer at that rate. Pass only the
      observable answer (accepted, and each payment made or missed) through
      company/interfaces/sim_interface.py. Where no published rate exists, the world carries an
      explicit None with a named reason, and the gap is filed.
    why: >-
      This is carried, and it was never drawn: it sat fourth in a 3-hour stretch. On the debt side the
      world cannot yet press back on the company's main lever after a miss, so its collections
      decisions are not being tested at all. And the term-basis result in focus item two rests on how
      debt resolves. DONE when a plan offer gets a sourced, world-side answer that the company sees
      through the seam, and a test reaches an EP4 exit beyond the plan offer. Or DONE when the gap is
      filed with the evidence that no rate is published.
  - id: the-head-red-register-names-the-commit-and-the-selection-miss
    lane: H_harness
    what: >-
      A worker is carrying this now; the second bisect sweep was running at 05:20Z. Finish the census:
      for every red at origin first seen since 2026-09-17, name the turning commit and why the
      pre-commit selection missed it. The causes to choose from are a stem mismatch, a data-file subject,
      a world-digest dependency, a generated artefact, or a control that writes a tracked file. The
      first sweep died because a control in the extract rewrote a tracked opening-arms data file and
      dirtied the checkout (/var/tmp/headred-bisect.log). Restore the extract to a clean state between
      bisect steps. This item changes no file but the finding. Record that
      control as a cause row of its own. File the table as a docs/staging/ finding with a cause on every
      row. Do not edit the test-selection gate in this item. The selection change for the largest cause
      is a follow-on item, filed in the finding.
    why: >-
      Origin keeps going red by routes the gate does not select. The prepayment ruling's own control was
      red at HEAD for days and was missing from the register (92b55f41a). The fix should be chosen by
      the largest measured cause, not by the latest instance. DONE when the finding is on origin and
      every owed red has a turning commit and a cause, or a stated reason why bisect could not reach one.
not_now:
  - what: Re-run the term probes on the QEP-refitted world before the ex-ante comparison.
    why: >-
      That would make the ex-ante comparison wait about 9 more hours on a world fix that moves departure
      timing, not the debt mechanics the term basis scores. It runs on the current world and says so.
      The re-run on the refitted world is a follow-on once the refit lands.
  - what: Fix the launch path itself, so a long job's invocation is dry-run against the tool's own argument checks before hours are committed.
    why: >-
      This is the mechanism behind this stretch's floor death and the earlier resource_headroom.admitted()
      driver. But both instances were hand-written drivers, and the instance here costs one corrected
      launch. A general dry-run door needs a design for how a tool declares its cheap pre-checks. It
      waits on a third instance, or on the launch-time check already in not_now.
  - what: Build a launch-time check that refuses a long job whose worktree base lacks a commit named as a constraint, or whose peak the guest cannot hold beside live jobs.
    why: >-
      The QEP re-take did both by hand this stretch, and the three-arm leg survived because it did. The
      general check still needs a design for how a commit declares a constraint. Carried from last
      stretch, and it still loses to work that moves the thesis.
  - what: Cut the no-work base-advance merges themselves.
    why: >-
      They are now 11 of 26 commits. Each is cheap since selection follows the combined diff. A red
      origin costs every lane more, so the head-red census comes first, and its causes may share a fix
      with the merges.
  - what: Learn the price slope further (capped_learned).
    why: >-
      On all four paths it adds nothing or loses (-10 to -140 a path). More learning machinery on a rule
      that has not yet been shown to beat an ex-ante flat price is depth before the question that decides
      whether depth is worth having.
  - what: Give worker-seat-manager a heartbeat line.
    why: It is mute by construction, with the cause on file and its wait channel ordinary. It changes no level.
