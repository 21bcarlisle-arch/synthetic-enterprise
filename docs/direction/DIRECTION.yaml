- id: the-dd-books-pre-crisis-net-debit-is-traced-on-single-levy-bills
  what: 'Find out why the direct-debit book is GBP 20k net debit by mid-2018 and holds only GBP 2-6k of
    summer credit across about 600 DD customers (about GBP 5-10 each), on the single-levy run /var/tmp/single_levy/run_output_abb925ec7.json
    (stamp 7379375f6). Before measuring anything, write into the levy finding''s Prediction 2 section
    which DD quantity is meant (the balance per account, by month), and file one prediction per candidate
    cause. Candidates: the DD amount setting (annualised estimate / 12 against the account''s actual consumption),
    first-review timing, the collection-failure path, accounts that start in winter, and estimate-versus-actual
    reads. Then decompose the 2018-06 balance per account into those legs from the run''s dd_collection_book,
    bills and meter_read_log. First check the knowledge layer (docs/market_research/, the DD knowledge
    pages) for the published per-account summer credit and what a GB supplier sets a DD from; if nothing
    establishes it, file that as a gap and do not pick a number. Land the decomposition as a tracked tool
    beside its control, and land the finding.'
  why: Billing accuracy is the director's step 2, and the DD book is where a household meets it. The levy
    fix removed GBP 40-45k of the gap and DD first reviews now land within +/-5% a year, yet the book
    still never builds the summer credit a real DD book holds, and 7252e8d72 says it cannot yet say why.
    Done means the 2018-06 balance is split into named legs that sum to it, each leg is graded against
    its prediction, and the leg that is a company defect (if one is) is named for DD_seasonal_cashflow_physics
    L3. It is not done by fitting a DD scalar.
  lane: D_billing_metering
  side: supplier
  written_at: 1791642476.458
- id: considered-renewals-falling-from-53-to-3-is-explained
  what: 'Explain why the run''s considered renewals fall from 53 in 2017 to 25 in 2018 and 3 in 2019 in
    both B8 L3 arms (SEAT_FINDING_B8_L3_THE_RUNS_OWN_HOLDOUT_CANNOT_DECIDE_AT_THE_FOUNDERS_SCALE_2026-10-09.md,
    ''New, not explained''), when 17 below-threshold leavers left in 2019 against 2 offers. Before running,
    write in that finding one prediction per candidate cause, saying what each would show: the 10-10 conversion
    gate, the founders'' term structure (how many fixed terms end each year), the churn estimate''s offer
    threshold, and book attrition. Then count, per year on the single-levy run: accounts whose fixed term
    ended, accounts reaching the renewal decision, accounts the decision considered, and accounts offered.
    Take one count per step of company/pricing/renewal_rate_chain.py and company/pricing/value_based_renewal.py,
    read from the run''s svt_decisions and account_state_log, so the year the population drops out names
    its step. Land the counting tool with its control, and the finding.'
