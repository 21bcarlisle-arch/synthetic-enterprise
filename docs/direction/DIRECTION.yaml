thesis_read: 'STEPS 2 AND 3 HAVE ATOMS AND NO CODE. THE STEER REACHES THE DRAW AND STOPS THERE. Against the thesis,
  the stretch''s real movement was in the world, not the company. C29 refitted the world''s engagement tail to Ofgem''s
  control-arm rate with the 35% mean held (ae552db75). The company''s per-account engagement lift survives the refitted
  world, and the retention guard can now weigh it, off by default (e4acfab81). That is inference graded against
  a truth the company never touches, and it is the most thesis-relevant result here. It is still not value: no live
  decision reads it, and the value-arms re-take that would say whether it beats the flat rule is running now (pid
  267247, longjob-c29-arms-retake, direction filed first in c36a87d49, landing queued for 13:15). Carbon moved from
  reconstruction to the published record. The company''s annual grid intensity is NESO''s level (824fc5efe, 2024
  now 133 g/kWh, was 196), the figure a customer is shown counts gas (0074cd746), and the explore page names its
  units truly (ad00e36e0). Step 1 paid for itself again: eight plain errors in company/ were corrected (65329aa39).
  Steps 2 and 3 have not moved. W2_36, D48 and B11 have been on origin as loop_stage build since 03:23 (77bf72bab),
  and simulation/unbilled_energy.py, company/billing/billing_accuracy.py and company/analytics/forward_clv.py exist
  in no worktree. B11 has been drawn repeatedly (the supervisor log names it 62 times, as the product draw at 08:22)
  and D48 is in the live worker''s prompt, yet nothing lands. W2_36 is in no draw at all. So the three focus items
  I set at 05:24 reached the draw and produced nothing, and nothing says why. That is the steer drifting, and this
  record shrinks each item to a first slice that can land in one tick. The flat baseline is no closer to being beaten
  than last stretch, but the world is closer to being able to press back. CORRECTIONS, beside the claims. (1) My
  05:24 record said no figures had published for a week. That was wrong. Four of the five markers were held by the
  weekly window the director asked for on 2026-09-26. The real fault was about four hours old: Monday''s publish
  was refused behind_origin because the shared tree could not fast-forward (worker finding, 872361644). The count
  is now keyed to the last landed publish, and the stranded hand edits that held the tree were landed (ab9a8b39f).
  Monday''s figures are still not on origin, and the shared tree is now 25 behind, up from 10. (2) The heartbeat
  binding was retired as finished by the tick that held it (e392446a0, 07:43), so that wrong row closes. (3) The
  brief again read the behind checkout''s record: its previous_wrong and previous_for_the_director came from the
  02:22 record, not origin''s 05:24 one. This record carries origin''s 26 wrong rows and 6 open concerns by hand,
  and the row saying so stays open. (4) The draw-follows-the-order change acff52923 is still on no remote ref. Its
  worktree is locked to pid 1364549, which is no longer running, and the continuation that would land it is queued.
  The G14 continuation is spent, because G14 reads L2 on origin, and the path check says so. 34 commits, 14 substantive,
  9 that changed nothing, all of them base-advance merges.'
