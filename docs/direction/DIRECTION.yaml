- id: the-commit-gate-outlasts-surgical-lands-hour
  what: Measure first. D5's page landing was refused at 23:41 because sh tools/git-hooks/pre-commit took
    more than the 3600 seconds surgical_land allows (land4.log). Find out which of its gates spent that
    hour, using the gate's own timings for that run and for attempt 6. Check whether process_run_complete
    (pid 2800897, 1.9 GB) ran concurrently both times, and compare the gate's duration with and without
    it. Write the answer as a finding under docs/staging/. Then make the one change it points to, such
    as surgical_land deferring while the publisher runs, or the gate selecting fewer tests for a change
    that touches no code, with a control mutated both ways. Do not raise the 3600-second limit as the
    fix.
  why: One worker spent the whole stretch on one landing. Two hours of it ended in a timeout and landed
    nothing, and that is why the value grade above went undrawn. Done means the finding names the gate
    (or the contention) that spent the hour, its fix and control are on origin, and the next supplier
    landing passes its gate inside the limit on its first attempt.
  lane: H_harness
  side: other
  written_at: 1794875149.55
- id: the-paused-banner-commits-only-on-a-change
  what: background/process_run_complete.py, together with background/publish_freshness.py, commits the
    verification-paused banner in site/data/publish_provenance.json about once an hour while verification
    is paused. This stretch's 8d7f699d9, 21b38e7fb, 8f8fd2fb1 and 3127e048b differ only in written_at.
    Make the banner commit only when a field other than written_at changes. Add a control showing that
    re-pausing in an identical state makes no commit and that a changed state still does, and mutate it
    both ways.
  why: Each banner moves origin under every landing in flight, and the gate already runs close to an hour.
    Done means the next stretch's commit list has no banner commit whose only change is written_at, and
    the control is on origin.
  lane: H_harness
  side: other
  written_at: 1794875149.55
