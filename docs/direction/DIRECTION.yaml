thesis_read: 'The retention lever is now known to be nearly inert at the roll, and the money per-customer retention made against flat is transfer and noise. 10 commits, 8 carrying work, 5 substantive. The
  brief''s split (0 supplier, 2 world, 1 both, 7 other) is by file. Read by subject, it is even: the holdout (fdec35bd9) and the section 14 seed grader (bc1e6ad78) are supplier. The dual-leaver fix (2b81e1466)
  is a billing-accuracy defect in the world, which is first in his order. The held-money flip (6b81d3b25) is what the BLOCKING crisis bad-debt finding waits on. The roll-offer trace (f3dae1d50) is a read
  of the world. All four items in the last focus were drawn and three landed. The fourth, D48''s practice-or-defect table, was spent before I filed it: e885e30ff and f2db4aa45 had already graded PROS-2017-0336''s
  catch-up as two held months, the screen doing what section 4d intends. D48 is also not a BUILD-stage atom, so the draw cannot classify it, and an atom-id focus item cannot reach it. That is the seat''s
  error, listed in wrong. No level moved. WHAT IT MEANS. (1) The lever: a roll offer does reach the leaving household''s choice, with no ordering defect. It is too small to move it. A 3% median discount
  lifts P(stay) by 0.77 points, which is one save in 101 offers (f3dae1d50). On the default dice, section 12''s +GBP 111 against flat is one extra departure (-GBP 2,035) against seven stayers moved onto
  fixes (+GBP 2,308) (bc1e6ad78). So on this world the per-customer company''s retention money is M2 transfer plus one coin. The thesis survives only if the company can LEARN that from what it holds and
  then stops paying stayers. The holdout is how a real supplier learns it. It is built, default off, and its arm is running (s15). But at 27% of about 83 offers a year it resolves the break-even difference,
  not a 1% save rate. So the next supplier question is what the guard does while its save rate cannot be told from zero (item 3). (2) Inference: the ending-term belief still ranks leavers at 0.806 in the
  run. Section 14''s four dice seeds are running, and no policy carries the belief yet. (3) Billing accuracy: a departed dual household is now billed no gas after it leaves (9 households, 70,599 kWh, GBP
  2,284.97 on 2016-17, now 0), and each leg''s departure has its own row. The s1 and s15 arms were launched before 2b81e1466, so their levels still carry that gas. Their paired differences stand. (4) The
  BLOCKING crisis finding: both world switches it waited on are now default on (shortfall on the month''s demand; held money as a part payment). As pre-registered, held money moved Q4 2023 pounds further
  from Ofgem (GBP 710 to 452, record GBP 1,303). Its validator grade needs a full HEAD run. The sim-runner has deferred every five-minute cycle since at least 04:35Z to the long-job queue, so no run carries
  either switch. I am putting that HEAD run ahead of section 14''s seed 2 (item 2). (5) The publisher''s FAILING line is stale. The figures reached origin on 19 Oct 09:15Z, and the next window opens on
  26 Oct 04:00Z (.publish_gate_state.json publish_hold). Nothing is wedged.'
