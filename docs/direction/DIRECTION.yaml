version: 1
oriented_at: "2026-08-26T20:24:51.620750+00:00"
thesis_read: >-
  For the first time the project's own question has been asked on the right book and answered out
  loud. The I&C suspension the director ruled on 24 August landed (`4e884cdbf`), the comparison was
  re-run on the book it creates, and the answer is written where he can read it: on resi + SME the
  value arm earns net GBP 96,461.44 against the frozen flat-rules control's GBP 79,688.17 --
  +GBP 16,773.28, +21.0% -- and on households alone +GBP 11,828.26. Per-customer pricing beats flat
  rules on this supplier's residential book. That is the sentence three orientations could not say,
  and I want to be exact about how much it is worth, because the artefact is more honest about
  itself than a headline would be. It is thin in three ways that all point at the same thing.
  `concentration_top_n_share_of_absolute_movement` is 0.9941 -- of 211 accounts compared, 60 moved
  and 15 are 99.4% of all movement, every one of them a SEED account; the ~200 the funnel grew are
  rounding errors. Of the 42 renewals the arm priced, 20 ended at the ceiling and none at the floor,
  at a median chosen margin of GBP 57.75/MWh against the control's GBP 2.00 -- so roughly half the
  arm's answers were decided by where the grid was cut, not by anything it inferred about the
  customer, and GBP 57.75 is seven to fifteen times the EBIT allowance Ofgem grants an efficient
  supplier. And gross margin FELL by GBP 14,151.51 while net ROSE by GBP 16,773.28, a GBP 30,924
  divergence of which lower bad debt explains GBP 2,591.09; the artefact records that as observed
  and unexplained (R9) and says plainly that until it is attributed, the mechanism behind the win
  is not established. Against the thesis -- advantage from INFERENCE, never ACCESS -- what has been
  shown is that the arm beats flat rules on about seven households and two small businesses, by a
  mechanism nobody has yet named. Then the ground moved again 3.4 hours later and by our own hand:
  `fb8a8fda5` made the funnel win gas legs, the book went 226 -> 419 accounts and 91.5% dual fuel,
  and every account inside that A/B's window is single-fuel. The reading is correct for its book and
  its book is already superseded. On the inference axis specifically the news is worse and it is
  mine: EP1 was named in focus for the second time and drawn, and the estimator did not change.
  `saas/churn_model.py::churn_probability` is still `min(0.05 + 0.03 * bill_shock_count, cap)`, and
  `coupled_gap_ledger.json` still reports `distinct_hazards: 1`, `hazard_histogram {"0.05": 33}` and
  a believed tenure of 20.0 years for every graded account. The company still has no per-customer
  view of lifetime on the only population it now serves. What went right beyond the measurement is
  the disease itself: tree divergence fell from 436 files to 31, origin went from 46 heads to 1 with
  every deleted branch's tip recorded first in `BRANCH_DISPOSITION_2026-08-26.md`, and the checker
  crash that had refused every staging commit for six days was fixed, clearing a 419-file archive
  backlog. And the steering mechanism worked -- last orientation four of five focus items were
  unreachable by any draw; this time three of four landed and the fourth was drawn. The direction is
  now reaching the work. What it is pointing at is still half-measured.
