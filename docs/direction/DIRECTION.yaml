      Tuning anything so that R6 fires — acquisition spend now reaches the collateral desk and the
      company sits £316,009 from the trigger without crossing it.
    why: >-
      This is the most tempting item on the board and the most dangerous. The director called R6 the
      prize and it is now reached; the mechanism is wired, the CMA's sentence is modelled, and it
      does not fire. Moving any number to make it fire is precisely the failure CLAUDE.md names — a
      constant chosen because a number was needed — and it would be load-bearing within a week. If
      R6 should fire, that has to come out of knowledge about what real suppliers' collateral
      actually did, not out of the gap between £316,009 and zero. The finding is RECORDED and the
      right next move on it is discovery, not a dial.
