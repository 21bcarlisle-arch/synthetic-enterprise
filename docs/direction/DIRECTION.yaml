  four focus items were drawn. Two are finished and leave focus. First, the carbon page now reproduces from the
  repository (3a26ca9fa). The publisher commits the market-data feeds it builds from, and the page refuses an
  uncommitted input. Its wrong row is corrected below, and the director's CO1 line can now render through a clean
  regeneration. Second, the repayment shortfall was read on its own on the published book (804e627de). It is
