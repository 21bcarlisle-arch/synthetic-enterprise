focus:
  - id: tell-the-director-the-three-cadences-that-were-set
    what: >-
      Send ONE NTFY message with `python3 -m background.ntfy_utils` (or `send_ntfy`) answering the
      question he asked at 2026-09-25 13:57 and nothing has answered: the three installed units that
      were slowed at 14:58, old value and new value each -- `worker-tick.timer` OnUnitActiveSec 1800s
      to 14400s, `seat-executor.timer` OnCalendar `*:05,35:00` to `00/4:05:00`, `delivery-seat.timer`
      OnCalendar `00/3:20:00` to `00/12:20:00` -- that `background/*.timer` in the tree still holds
      the fast values so the restore is `cp` plus `systemctl --user daemon-reload`, and that the
      restore is queued for Monday after the reset with the mode-control item he asked for on
      2026-09-25 14:13. Verify it left: `docs/observability/ntfy-delivery-log.md` must gain a
      `[DELIVERED]` line, and its last one before this is 2026-09-23T09:16Z. No code, no commit.
    why: >-
      A direct question from the director, unanswered for 22 hours, is the seat failing at the one
      duty that is only its own -- what reaches him. He is budget-constrained at 78% weekly usage
      with the reset on Monday, he set a dial by hand for the third time, and he asked to be told
      what it was set to so he could steer. Minutes of work. Done when the delivery log shows the
      send landed; if the send fails, that failure is itself the finding and goes in the staging root
      rather than being retried silently.
  - id: what-besides-the-priced-decisions-moves-the-selection-residual
    what: >-
      The director's ask of 2026-09-26 09:29, verbatim: "how much of the residual variance is
      explained by renewal count, and tell me whether a deeper book would let selection be measured
      at all". Read the 18 seeds already on disk in
      /var/tmp/se-floor18-head-20260925/shards/folded18_head_20260925.json -- no new run, this is an
      analysis of an artefact that exists -- and decompose the per-seed selection residual against
      renewal count per account, then against whatever else the shard records that could carry it.
      Pre-register the prediction in `docs/staging/records/` BEFORE computing, print the table at
      real inputs, and land the result with `python3 -m tools.surgical_land`. State the fraction of
      variance with the bound eighteen seeds earns, and if it cannot be established from what the
      shards hold, say that and name what would have to be recorded per run instead.
    why: >-
      This is the only product work the slowdown licenses and the director named it as what he wants:
      the root cause of the sign that did not reproduce. It is also the thesis question underneath
      the whole baseline leg -- if luck dominates because too few accounts have enough renewals for a
      choice to compound, then "beats average by inference" is not measurable on this book at this
      depth, and every selection figure we have published or will publish inherits that. His guess is
      book depth and he asked for it tested rather than assumed. Done when the answer is a number
      with its bound, or an honest refusal naming what is missing, filed beside a prediction written
      before it.
  - id: advance-the-checkout-so-a-publish-can-reach-a-reader
    what: >-
      The shared checkout is 32 commits behind origin/main and 2 ahead (one of the two is the
      heartbeat commit 2630b9770), and `docs/observability/.publish_gate_state.json` holds
      `episode_failures` 1 with `wedge_since` set and cause `behind_origin` for
      run_complete_20260926T094401Z.md. Close the fork and nothing else: `python3 -m
      background.origin_reconcile`, and on REFUSED_CONFLICT the door is `python3 -m
      tools.surgical_land --merge origin/main --resolve`. Do not repair the reconciler, do not write
      a control, do not touch the heartbeat -- those are machinery and the slowdown excludes them.
      Done when `git rev-list --count HEAD..origin/main` reads 0 and the next publish records a clean
      publish rather than `behind_origin`.
    why: >-
      "Anything that genuinely blocks a landing" is the second half of what the director licensed
      during the slowdown, and this is the only thing in the tree that qualifies: the public page is
      dark, so the selection finding he asked to have reported cannot reach a reader, and every
      daemon on this box is running code the branch has moved past. Scoped to the advance alone
      because the reconciler's own defects are real, filed, and machinery -- fixing them this week
      spends the budget he told us to protect.
  - id: the-page-carries-both-the-served-sign-and-what-todays-code-returns
    what: >-
      `site/data/value_arms.json` still serves -959 as the selection direction and nothing on the
      page says today's code returns +£169.60 at 0.31 sems from zero. Per the director at 09:29 --
      "Don't withdraw the selection figure -- I was wrong to push that. Report what you found" --
      make the served family the record of what the 2026-09-10 runs returned AND state the re-run
      beside it, in one plain sentence a reader can use, with the eighteen-seed bound. Regenerate
      through `tools/generate_value_arms_data.py` rather than editing the feed, prove the RENDERED
      value changed with the page's own door test under `site/`, and land with `python3 -m
      tools.surgical_land`. Avoid every here-relative pointer -- `tools/here_relative_vocabulary.py`
      is the vocabulary the site lane refuses on.
    why: >-
      A published claim that the running code contradicts is the one thing on our public surface that
      is not fidelity-as-precondition but a straightforward falsehood, and the director has already
      ruled on the remedy: report, do not withdraw. It needs the checkout advance to reach a reader,
      which is why it is ordered after it. Done when the rendered page states both numbers and the
      re-run's sample size; a silently unchanged page, or a withdrawal, is not done.
not_now:
  - what: >-
      Restoring the three tick cadences to what `background/*.timer` declares in the tree.
    why: >-
      His dial, his instruction, his timing: "Put the tick cadence back at the reset" -- Monday, and
      he asked for a named-mode control to be built then, not now. Restoring early would give me back
      the throughput to work the queue I want to work, at the exact cost he set the dial to avoid,
      and it is the clearest case in this record of a decision that is genuinely his rather than
      mine. What is mine and is done instead: the record he reviews now states what was set.
  - what: >-
      Building the completeness control for the `git restore --source=stash@{0}` class -- a path
      present in the stash but in neither HEAD nor the index is silently skipped, and
      `git diff --quiet HEAD -- <path>` is quiet for an untracked path whatever its content, so the
      sweep would report a genuinely lost file safe.
    why: >-
      THIS IS THE TENTH REJECTION AND I SAID A TENTH WAS NOT AVAILABLE. I am taking it anyway and
      recording that I broke my own commitment, because the reason is not the one that carried the
      previous nine: it is not cost, it is that building a control is machinery and the director has
      instructed that machinery is not drawn this week. That is authority, not preference. It is the
      first item in focus on the first orientation after the reset, ahead of anything else due, and
      the counter now reads ten rather than being reset by this stretch.
  - what: >-
      The four machinery items the previous direction named and none of which was drawn: the
      reconciler's success condition, the fleet-drift oracle reading local HEAD, the published
      refusal that does not re-ask the ref, and the `sanity-daemon` mute cause.
    why: >-
      Every one is real and three of them are in `wrong` as still open. All four are machinery, and
      the director's measurement of where the week's budget went -- 46 of the last 100 commits
      machinery, 27 merges, 20 publish or chores, 7 product -- is exactly the argument against
      drawing them now. They are not forgotten; they are what the first post-reset orientation is
      already carrying, and the fleet-drift item's path check already reads "nothing to land".
  - what: Sweeping the 15 BLOCKING findings, and the 23 ungradable maturity-map rows that owe a repair.
    why: >-
      Same reason and one more: at least four of the blocking findings are downstream of the fork,
      so the minimum advance in focus removes their cause rather than their instances, and grading
      them before that would be paying for a diagnosis the advance invalidates.
  - what: >-
      Writing five focus items, or anything like five.
    why: >-
      The consumer is measured: `seat-executor.timer` fires every four hours, `background/
      seat_executor.py` stands down on roughly one tick in three because
      `_interactive_seat_is_live` is true whenever any session runs, and 145 of its 448 finished
      turns bound no landing at all. That is one to two items delivered per stretch against five
      asked for, so three of every five were decoration and the brief has now reported them undrawn
      twice as though the steer were broken. Four is still probably one too many; it is what the
      director's own instruction leaves, and the smallest of the four is minutes of work.
  - what: >-
      Giving `worker-seat-manager` a heartbeat line, and holding `token-proxy` rather than leaving
      it enabled.
    why: >-
      Both carried unchanged from the previous record for the reasons it gave, and both are now also
      machinery inside a slowdown. `token-proxy` costs 9.6MB and I am leaving it enabled; a declared
      process moving between enabled and held is a dial reversible in a line and it is not the
      director-facing call the brief files it as.
