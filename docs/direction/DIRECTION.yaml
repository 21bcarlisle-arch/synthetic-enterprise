thesis_read: 'This stretch produced the first thesis measurement in days, and it does not flatter us. 7c613a1bd graded the
  12-draw family. The per-customer arm''s whole advantage runs from GBP 3.06 to GBP 6.88 per household-year across 12 elasticity
  re-draws. The published GBP 5,244 (GBP 2.86) sits below that range, so (b) is refuted, narrowly (2.46 family sd), and (a)
  or (c) holds. The belief''s skill against who actually left is AUC 0.53 to 0.57 on every seed, which is about a coin. Across
  households the mean is GBP 5.24 with an interval of -3.34 to +14.35, so zero is still inside. P6 missed: roll noise is
  4.6% of household variance, which is a lower bound, so the reading is "not shown". A GBP 3 effect needs about 4,860 households.
  Plainly, there is still no evidence that per-customer inference beats the flat baseline. The arm''s edge is a few pounds
  a household-year, inside noise, and it comes from a belief that does not rank leavers. 22b06c6c2 pre-registered the renewal
  retrain before any code, and it found my framing wrong: a corrected belief (renewal_belief_by_ending_term, 7a7ad95dc, AUC
  0.819 on 2019) already exists, default off, and nearly all of its skill is one fix-end split. The retrain is now defined
  as a learned level and a price slope on top of that split, and it waits for the churn_roll family. 13 commits, 4 substantive,
  split 0 supplier, 0 world, 13 other. The classifier calls the grade and the pre-registration "other", but they are the
  supplier''s thesis work. Four of five previous focus items are met. The 06:23 record reached origin at 06:50 (a23001d35),
  and the shared checkout is now level with origin, with no unit lacking origin. That corrects two machine rows. dc53f3311
  put the advisor''s cloud stall check on the control stack and added the [FOR-THE-DIRECTOR] title marker, which corrects
  a third. 81a1a4935 measured reading tokens: 37% go to always-loaded context and 39% to shell output, and no few files dominate.
  The balance proposal (35078209d) landed 40 minutes BEFORE the grade it was told to open with, so its section 1 still says
  the family is running. One thing went backwards. Two finished commits sit in /var/tmp/se-seat-executor on no remote ref,
  and both the landing (pid 1205973) and the mutation battery (pid 3797273) that held them are gone. 524ae1f5b names the
  03:54 red test (site/knowledge/test_the_reading_log_door.py, red on origin alone) and fixes the site lane''s selection.
  2fa5c27ac records the linking-findings measurement (0 of 3 families, so the idea is dropped) and the reading-token release.
  Until they land, the draw refuses the reading-token item every time it is offered. No ruling breach this stretch. Every
  commit was the value test, the director''s steers, the rhythm or a map hold. The 45 hours to the 16 Nov reset are best
  spent on compute: the two runs that decide whether the retrain and a larger book are worth building.'
