focus:
  - id: rerun-the-ab-on-the-dual-fuel-book-and-attribute-the-divergence
    what: >-
      Re-run `python3 -m tools.run_value_cycle_ab` on the book as it now stands and, in the SAME
      reading, attribute the gross-fell-while-net-rose divergence. Both are owed in the artefact's
      own words: `docs/design/THE_VALUE_CYCLE_REALISED_AB.md` carries a note saying its current
      figures predate `fb8a8fda5` and are owed a re-run, and its closing section names attributing
      the divergence as "the next step, ahead of any further mechanism repair". The book changed
      materially, not cosmetically -- 226 to 419 accounts, 222 electricity and 197 gas, 91.5% of won
      homes now dual fuel, `TOTAL_GAS_AQ` 1,959,100 kWh -- and one household is one billing account
      via `saas.customer_reaction._billing_account_id`, so cost-to-serve, churn and lifetime value
      all move. The divergence to attribute is precise: control gross GBP 433,174.76 against arm
      GBP 419,023.25 (-GBP 14,151.51) while net went +GBP 16,773.28, a GBP 30,924 gap of which bad
      debt explains GBP 2,591.09. `total_gross` is revenue minus wholesale; `total_net` is after
      levies, network, capital and bad debt -- so decompose the difference line by line from the
      run's own ledger rather than from the summary, and check the two extra churned accounts
      (32 -> 34) as a volume explanation rather than asserting it. The candidate explanations are
      currently recorded as inferred and must not be promoted to measured without the arithmetic.
      Rewrite the artefact's headline table so the current row names its book -- dual fuel, account
      count, commit -- and keep the superseded rows and their supersession notes; nothing here is
      rewritten. R14: every figure carries its clock.
    why: >-
      This is the only number in the project that answers the director's question, and right now it
      is correct about a book the company no longer has, for the second time in three days. That is
      the failure mode this whole stretch was spent escaping, and it recurred inside twelve hours by
      our own hand rather than by neglect. The attribution matters more than the re-run: an arm
      charging a median GBP 57.75/MWh against GBP 2.00 that ends the run with LESS gross margin is
      not obviously winning by pricing at all, and until the GBP 30,924 is attributed, "+GBP 16,773"
      is a result without a mechanism -- which is exactly the shape that let a GBP 3.08M figure stand
      for two days as a fact about five accounts. It is first because items two and three are both
      measured by this instrument and neither can be read until it names its own book. Finished when
      the artefact's current row states the dual-fuel book and its account count, the delta is
      re-reported whichever way it moved -- including smaller, or negative, said plainly -- and the
      gross-versus-net divergence is either decomposed into named cost lines with figures, or
      recorded as still unexplained WITH the candidates that were tested and ruled out. Do not
      soften a fall: the director's standing instruction is that a negative result on the right
      population is worth more than a headline on the wrong one.
  - id: EP1_clv_three_horizon
    what: >-
      Give the tenure horizon per-account dispersion from observables the company can actually know.
      Named for the third time and unchanged since the second, so the instruction is the same and
      the diagnosis is settled -- do not re-derive it. `coupled_gap_ledger.json`
      `components.lifetime_level`: `distinct_hazards: 1`, `hazard_histogram {"0.05": 33}`,
      `hazard_is_constant_across_graded_population: true`, median believed tenure 20.0 years for
      every graded account, measured 11:46:22Z. Cause: `saas/churn_model.py::churn_probability` is
      `min(0.05 + 0.03 * bill_shock_count, cap)`, a step function of one integer that is zero for
      42% of renewal decisions, consumed by `company/analytics/clv_three_horizon.py` at H2 as
      `hazard = latest.churn_probability` with the term `1.0 / hazard`. The LEVEL is about right --
      `hazard_calibration` reads 0.05 believed against 0.053 realised over 263 decisions -- so this
      is dispersion, not calibration, and nothing may be tuned toward a smaller gap (R12); the 0.204
      scalar is not to be applied. Widen the propensity to use what a supplier observes about a
      household: payment method and payment behaviour, tenure to date, the account's own tariff
      against the market it could switch to, consumption volatility, contact and complaint history --
      and now, because it exists as of `fb8a8fda5`, whether the account carries a gas leg, which the
      director named as a driver of churn and lifetime value in the same breath as cost-to-serve.
      Check every input against the wall before using it: if it needs a simulation internal it is a
      violation, and `company/interfaces/sim_interface.py` is the only door. Re-measure with
      `python3 -m tools.couple_clv` and report the ledger's next reading whichever way it moves; a
      level move to 3 is available on this evidence if the coupled rung is genuinely met -- self-
      certify with `record_level_up_self_certified`, never `--no-verify` a `level_current` change.
    why: >-
      The thesis names inference and this is the axis it is named after: a supplier deciding
      customer-by-customer on LIFETIME VALUE, whose lifetime term takes exactly one value across
      every graded account, is not deciding per customer on lifetime at all. Item one will now report
      a win or a loss on households, and either way the reading is unattributable while this term is
      a constant -- the arm's advantage, whatever its sign, cannot be coming from a belief that does
      not vary. The contrast is already published and sharpens the point: `belief_vs_outcome.
      discrimination_auc` is 0.6944 on 24 matched decisions, so the RETENTION belief the arm prices
      with does carry information about who stays, while the LIFETIME belief carries none. It is
      second rather than first only because item one is a few hours and gates the reading everything
      else is judged by. Finished when the graded population shows more than one distinct hazard, the
      ledger's next entry comes from a changed estimator rather than a changed sample, every new
      input is named with the observable it comes from and cleared against the wall, and the new gap
      is recorded whichever direction it went. If it worsens, that is the result and saying so is the
      deliverable.
  - id: the-ceiling-priced-half-the-book
    what: >-
      Establish why the value arm's maximiser still runs to its own bound on half the book, and
      either make the optimum interior for a reason that is about the customer, or report in the A/B
      artefact that the arm's win is a bound's and not an inference's. The measurement is in
      `docs/observability/value_cycle_ab_resi.json` `decision_shape`: 42 priced, 8 declined,
      `endpoint_at_ceiling` 20, `endpoint_at_floor` 0, `ceiling_bound` 20, `extrapolation_bound` 2,
      `median_margin_gbp_per_mwh` 57.75 against a control of 2.00. Start from the already-filed
      diagnosis rather than a fresh one:
      `docs/staging/WORKER_FINDING_THE_CHURN_MODELS_CAP_MAKES_THE_PROFIT_MAXIMISING_PRICE_UNBOUNDED_2026-08-25.md`
      names the root cause as `company/crm/churn_model.py::estimate_churn_probability` calibrating
      its rate sensitivity on GB MARKET-WIDE switching, which is the wrong curve for a single
      supplier moving its own price while the market does not -- and records that the two captive
      floors are already gone and interior optima exist on 255 of 263 accounts, which the A/B's 20
      of 42 appears to contradict. Reconcile those two figures first: they are measured on different
      populations and one of them is describing a book the company no longer serves. Any change to
      the sensitivity is a fidelity change and must cite a published source (Ofgem switching data,
      an academic or regulatory elasticity estimate), never a chosen number, and must be decided
      blind to what it does to the arm's result (R13, R12). If the honest answer is that no defensible
      curve makes the optimum interior, say that in the artefact instead of moving the ceiling.
    why: >-
      This is the thesis test stated as arithmetic. "The advantage must come from INFERENCE, never
      ACCESS" fails just as completely when the advantage comes from a BOUND -- a price set by the
      lawful/competitive ceiling is a price the arm did not choose, and roughly half of its priced
      answers are that. It also runs straight into the director's standing priority, which is
      credibility rather than profit: "every customer and segment is individually credible and free
      of inconsistencies ... a household that couldn't exist is not." A household on a GBP 57.75/MWh
      retail margin -- seven to fifteen times the GBP 3.73-8.54/MWh EBIT allowance Ofgem grants an
      efficient supplier -- is close to that line, and this is the arm we would eventually wire to
      the renewal desk. It is third because item one determines whether these particular numbers
      survive the dual-fuel book and item two is the belief the arm reasons from; it is on the list
      because without it a positive A/B cannot be attributed to inference no matter how many times it
      is re-run. Finished when the 20-of-42 and the 255-of-263 are reconciled with their populations
      named, and either the arm's answers are interior for a sourced reason or the artefact states in
      its own headline section that the bound decided.
  - id: land-the-alarm-that-was-written-about-this-tail
    what: >-
      Land the remaining 31 diverged files by walking them, starting with the two that are about this
      defect itself. `background/tree_divergence.py` has 52 uncommitted lines adding `severity()` and
      `ESCALATION_MULTIPLE = 5.0` -- the repair for "an alarm that fires and cannot be heard" -- and
      `background/process_run_complete.py` is modified alongside it, presumably its routing half.
      That fix is sitting uncommitted in the tree it measures. Land it with its own tests, and check
      the mutation both ways (R15): a breach at 29x routes as itself, a breach two files over stays
      batched, and an UNMEASURABLE tree routes as severe rather than being swallowed.
      `tests/simulation/test_policy_cost_coverage.py` is still untracked seven days on, but the
      report I gave last orientation is out of date -- its subject WAS built this stretch and it now
      passes 10 of 10 against the GBP 391,531.72 of published 2025 policy stack priced on silently
      clamped tables, so this is finished work to land, not a decision to take. `PRIORITIES.md` at
      159.27h is the oldest file in the tree and it is the sole priority authority under P-1; land it
      or say what it is waiting for. For the rest, disposition by lane -- land what is finished,
      delete what is residue, and note which group each fell in. Do not bulk-commit: a sweep that
      makes the count fall without anyone reading the files is the same defect wearing a smaller
      number.
    why: >-
      Two-thirds of this is already done and done well -- 436 files to 31, 46 origin heads to 1 with
      every tip recorded before deletion, the checker crash fixed and a 419-file six-day archive
      backlog cleared -- so this is the last third rather than the campaign, and it is short. It
      keeps a slot because of what the remainder is: the fix for the alarm that let a 29x breach be
      absorbed for six days is itself unlanded, which is the disease diagnosing itself and losing.
      Until it is committed, nothing has changed about how the NEXT breach of this size reaches a
      reader, and the last one cost two days of per-customer argument on a book the director had
      already ruled out. Finished when the severity routing is in origin with its mutation test, the
      policy-cost tests are tracked, the oldest file is landed or explained, and the walk is written
      down with what each group was.
