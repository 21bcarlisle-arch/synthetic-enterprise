thesis_read: >-
  Three hours: 18 commits, 13 carrying work, 9 substantive. The split reads 1 supplier, 0 world and
  17 other, and 5 of the 18 are merges that changed nothing. Two of the "other" landings did supplier
  work: the value test's attribution and the KNIFE3 remittance crossing. Even so, supplier-first slipped
  a second stretch running, mostly to the director's two 20 Nov steers (the blind audit, and gates judged
  from the base). Both of those finished, and they were rung zero, so the slip was chosen. The thesis
  moved forward on one point, still in-sample. The 0.12 cut's +GBP 1.00 on the value arm is now
  attributed (9e7cf29d4). All of it is on added-offer households (+GBP 0.996, CI +0.24 to +2.07),
  carried by nine (seed, household) units that A lost and the cut kept to the end of the window. The
  knock-on redraws carry +GBP 0.000 across 78 penny moves. So the gain is not redraw noise. It is the
  company retaining customers it had a reason to retain, which is the kind of advantage the thesis asks
  for: inference, not access. My pre-registration missed all four lines, and the miss is informative.
  The offer prices one term of margin (+GBP 0.088), but the value is retention beyond one term
  (+GBP 1.041). So the company's own decision rule undervalues what its inference finds. Against the
  flat-rules baseline it still reads -GBP 0.33 (-1.77 to +0.96) on the pair the cut was fitted to. The
  replication on 33333/44444 and 55555/66666 died in 60 ms at 11:41Z: fork_salvage committed into its
  pinned worktree. It is re-armed (vtc-cut012-rep-watch), but box_free says "a book is owed". That
  book cannot start. Since 12:02Z, sim-runner has deferred every cycle, because company/billing/ledger_store.py
  holds origin's bytes and not HEAD's. The shared checkout is 43 commits behind origin, and 137 paths
  stop its fast-forward. That one stall now holds every grade the supplier is waiting on: KNIFE3 I1-I6
  (the remittance crossing, 7d99949ce), the D48 blend, the gas-fallback split, and through the box the
  value-test replication. It also leaves every daemon running pre-6aaec3c8b code. So it is item 1, even
  though it is not supplier work itself. The previous focus was drawn on 4 of 5 items. The blind audit,
  the base-judging gate (observe mode), the attribution and the KNIFE3 remittance all finished and
  disappear from focus. D48 was dated to 20:00Z and stays, because company/policy/decision_policy.py
  on origin still has the blend at None. Draw-ledger hygiene is still owed. the-0-12-pair-is-read-...
  is spent by b1e04fab3. poesys-net-goes-behind-a-login landed as ff5b0224b and 5be769d15. Neither
  is bound yet.
