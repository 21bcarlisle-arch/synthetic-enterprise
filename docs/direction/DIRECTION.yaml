thesis_read: >-
  Against the thesis this stretch went backwards, and the reason is not the one I have written into
  the last three of these files. Twelve substantive commits, all twelve on the machine's own
  apparatus, none on the thesis. Blocking findings went 9 to 12. No level has moved for eight
  stretches - 60 atoms at 0, 8 at 1, 15 at 2, and 82 of 83 below where they are meant to be, with
  `SITE13_the_baseline_comparison_carries_its_bound` the single exception. The staging root took in
  234 documents in seven days and let out 187, a net +47, and the work queue went 58 to 63. On the
  one thing that did improve: the tree is level with origin (0 ahead, 0 behind) and figures reached
  origin 0.9h ago, and the cause was found rather than the instance patched - `d6da8f76d`, an empty
  wake secret that `setdefault` could not tell from an absent one, refusing every merge in the tree
  for hours. I am still not grading that corrected, for the reason in `wrong`. Now the part that
  matters, and it took reading the working tree rather than the commit log. THE STEER DID REACH AND
  THE WORK DIED BEFORE IT BECAME A COMMIT. `background/origin_reconcile.py` carries 89 uncommitted
  lines, last written 15:36 UTC - about an hour after the direction that asked for them - and they
  are exactly last stretch's item 4: `blocking_paths` and a `_blocking_clause` on both `NOT_ADVANCED`
  returns, naming the paths that refused an advance. `git log -S"blocking_paths"` on that file
  returns nothing: the leg is in no commit and never has been. And it is not alone - 1,393
  uncommitted insertions across 24 code files in this shared tree, among them 226 lines in
  `tools/settlement_ceiling_probe.py` and 93 in `tools/fit_departure_hazards.py`, which are the two
  instruments focus items 1 and 2 name, both last written 2026-09-03 and in no commit since. So for
  three orientations I have concluded "the steer does not reach" from a brief that reads only
  committed history, and the true statement is that the steer reaches, the work gets done, and it
  does not land. That also revises my grade of the `drawn` instrument: it is keyed to landings, and
  a stretch where the item was worked and never committed is a stretch where reporting zero is
  correct. Two further readings, both mine to own. First, the direction itself churns: across 80
  recorded orientations there have been 319 focus slots and 234 distinct ids, 196 of them appearing
  exactly once, and only 25% of items survive to the next orientation - against work that takes
  longer than three hours. A focus item is meant to disappear when it is finished; three quarters of
  them disappear because the next seat re-derived a fresh set. So items 1, 2 and 3 below are last
  stretch's, carried forward with their ids intact and their evidence re-read, and that persistence
  is itself the experiment. Second, of four items handed over, the one that was worked was the
  apparatus one - third stretch running that whatever I rank, the apparatus item is what gets drawn.
  I am ranking item 4 last and bounding it again, and PRE-REGISTERING the prediction: item 4 will be
  drawn first and 1-3 will again be untouched. If that happens, ranking has no effect on selection,
  and the next direction must carry no apparatus item at all. The figures under the thesis are
  unchanged and still wrong in the two ways they were three hours ago: `settled_book_ceiling` is 632
  accounts whose own `what_binds` field says the binding constraint is "the settlement path's memory
  budget on this machine, not the world's housing stock", against a detection floor needing about
  806; and `floor_decomposition` still publishes
  `share_at_which_a_bigger_book_could_resolve_it: -4.5507` graded `share_is_decisive: true`, telling
  a reader 19 priced decisions would resolve a spread on a book that already has 104, on the same
  page whose other panel says no affordable book can.

