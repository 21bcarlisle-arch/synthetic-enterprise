      Build R1: give a household's price elasticity OBSERVABLE ANTECEDENTS instead of a hash of the
      customer id, in `simulation/population_draw.py` and `simulation/customer_events.py` (the atom's
      own file scope). Start from the published record, not from a shape that feels right: what
