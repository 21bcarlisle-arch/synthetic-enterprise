thesis_read: 'The thesis did not move this stretch, but the obstacle in front of it changed. The book that every
  queued supplier result reads was finally built, run_output_f2c6979d01 at 23:46Z, after about 104 hours. That happened
  because f2c6979d0 and 9f2afe0c9 stopped waiting long jobs from declaring memory against it, which corrects the
  memory-budget row and the seat''s own box-order row. Its readers are moving on their own: land10 has been gating
  the MSC replacement-win since about 23:51Z, b11m7''s order log shows the post-book step firing, and A4 waits on
  B11 M7. So nothing in focus needs to push them. But the book was then REFUSED for publishing. Its bills fail the
  EPG receipt grade: GBP 213,447.29 paid on settled kWh against GBP 212,109.23 booked. The site has shown 18 Nov
  figures since verification paused on 23 Nov, and the previous book was refused on a different billing gate (estimate
  against meter, 9 breaches over an exception of 8). This is the director''s first priority, billing accuracy, failing
  on the company''s own ledger. A supplier whose ledger cannot account for a Treasury receipt cannot claim an advantage
  from inference, so this focus is three billing items and nothing else.


  Against the thesis itself: rankq''s BELOW was split from its own records (60ef7ed87). The -GBP 2.45 is the offers
  it dropped, and whether A ranks better at equal volume cannot be read from those records. No retention gate on
  A''s belief has beaten the flat-rules twin out of sample, and the director''s row s-12g-rank-at-q-run-graded still
  holds the next lever. The supplier has still shown no advantage from inference.


  The previous focus was all drawn and all landed, so all three items leave focus. The owed book was built (f2c6979d0,
  9f2afe0c9, 05559f04a). rankq was split (60ef7ed87). The D48 wall now quotes its ledger row, and the missing weather
  belief is a work item with a K8 section (f2cf05c14). The commit split reads 0/0/18 ''other''. By content, about
  6 commits are Item 5 CfD primary-text reads (world, on the director''s weather-to-price steer, and the brief''s
  one BLOCKING finding), about 8 are supplier records and the harness, and none is supplier code. A world lane that
  takes a third of the commits while the supplier''s own ledger fails its grade is the imbalance this focus corrects.
  Item 5 is left to the ordinary draw, not to lane 0.'
