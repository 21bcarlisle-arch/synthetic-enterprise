thesis_read: >-
  The model advanced and the EVIDENCE for it went dark, and the second is the reading that
  matters: the site has served no new figure for 80.7 hours, the publisher has refused 57
  consecutive attempts, three completed runs are queued, and the entire blocker is one test that
  reproduces red in 0.09 seconds -- `test_wedge_adapter_fires_past_the_directors_one_hour_bar`,
  which is the alarm for "the publish gate has been wedged over an hour". The trim-on-read screen
  that landed 2026-09-24 is a real repair and it made `>= 3 failures inside the last hour`
  necessary to fire, so a wedge whose retries have slowed reads as over -- which is what every
  LONG wedge looks like, including this one: the live record carries 57 episode failures and
  exactly ONE inside the window. The detector is therefore silent on the condition it exists for,
  and no rung-1 draw has fired in 80 hours. Against the thesis nothing is wrong with the model
  here; what is wrong is that "it performed well" has had no route to a reader for three and a
  half days. What did advance is real: `value-arms-error-bar` was drawn and landed (44a8629a4),
  so the baseline comparison now says what its draw count was WORTH and not only how many draws
  the seeds bought, and an 18-seed re-run at HEAD is in flight against five predictions filed
  before its first leg finished. PB4 landed the bill-shock seam in `simulation/` the right way --
  structure with its amplitude a declared `None` and a shocked household REFUSED rather than
  handed back the unmodified probability -- which is the first domain commit in two stretches and
  is knowledge-first rather than a number picked to clear a refusal. Two of last stretch's grades
  close with evidence. The direction commit `dc87135ca` IS an ancestor of `origin/main`, so a
  record written by the seat after the `_refuse_if_ungated` repair has now actually passed the
  door, which is the effect I refused to grade on the code's existence alone. And cause 1 of the
  fork is repaired: `background.origin_reconcile._split_generated` now classifies the regenerated
  `WORKER_FINDING_REPEATING_ALARM_*` family as GENERATED, and the behind leg has fallen from 12
  to 4. The fork itself is not closed -- 3 ahead, 4 behind, `push_never_landed` with origin at
  `d4244a93f` past our `31112ddf2` -- but only one of the three ahead commits is daemon liveness
  now, so my "daemon output refills it as fast as any drain empties it" is a third of the cause
  and the rest is a lost merge-to-push race. What drifted is my own steer: `H41` was named and
  never drawn because I ranked it third and the window closed after two, and the map now has
  5,844 bytes of headroom with 3,796 to the per-atom reserve against a median map-touching commit
  of ~695 bytes -- roughly five level moves from a line that reds `tests/design/` in every lane.
