  - id: reprice-the-noise-floor-leg-admission-from-a-completed-run
    lane: H_harness
    what: >-
      In tools/run_value_cycle_ab.py, FLOOR_RUN_PEAK_MB = 6400.0 prices a --noise-floor-seeds leg
      from the MemoryPeak of a run the OOM killer took, so it is a floor, not a peak. Re-derive it
      from completed runs only. Use the MemoryPeak systemd reports for longjob-ab5-runb once it
      exits (read `systemctl --user show -p MemoryPeak` or the journal's "memory peak" line). Also
      use run A's kill line: 8.7G peak, OOM-killed at 1h10m, which is a second floor. Write the
      origin in the comment the way PAIRED_FLOOR_RUN_PEAK_MB's sibling comment already does:
      completed versus killed, cgroup versus VmHWM, and rounded in which direction. Add one control
      that the admission REFUSES the 08:51Z shape: a second --level-arm floor leg with one already
      running, against the MemAvailable the box had then (about 20 GB). Add a partition leg proving
      a single leg on an idle box is still ADMITTED. Mutation-prove the refusal against the old
      6,400. Leave the edit in a worktree until run B has exited, so its gate does not starve the
      run.
    why: >-
      This number admitted the pair that killed run A. Without the fix, item one's relaunch is
      admitted into the same death. The paired-leg constant beside it was corrected for exactly this
      defect on 2026-09-23 and this sibling was missed, so fixing the one constant is the whole job;
      no new register. DONE when the constant on origin cites a completed run's peak, and a
      mutation-proven control refuses two concurrent --level-arm floor legs at about 20 GB free
      while still admitting one.
