thesis_read: >-
  The stretch did one thing and did it properly: the arms page no longer states a direction it
  cannot carry. `3f6c29525` and `d3225dd5b` put both inputs on one book on one day, tracked the two
  dated artefacts, gated every directional clause on the contrast's own measured seed spread, and
  kept the withdrawn sentence — *"the per-customer choosing is worth less than nothing"* — on the
  page beside the reading that replaced it. The control is keyed to the property, not to today's
  answer: `test_a_contrast_outside_its_seed_spread_gets_its_direction_back` is the leg that proves
  the gate is not a machine for printing "we cannot tell". That is the first time the recurring
  class — a published figure separated from its real input by the index — has actually closed rather
  than been renamed. Against the director's thesis condition, this is where we stand: the baseline
  exists and is provably the same supplier this site publishes (£154,164.43 to the penny, gap
  6.5e-09), the comparison is honest, and the comparison **cannot answer his question**. Both
  contrasts are inside their floor. And the page's own escape clause is now the weakest sentence on
  it. It tells the reader *"what would resolve it is a larger SETTLED BOOK — more renewals actually
  priced by the arm"*, and nothing has tested that. The floor artefact argues the other way: each
  seed re-draws elasticity for **2,020–2,074 households** while the arm prices **20**, so the
  £2,578 spread on `selection_gbp` is plausibly the whole book's cascade re-rolling and not the 20
  decisions' sampling noise — and if it is, a larger book does not shrink it and we have swapped a
  directional claim beyond its evidence for a remedy claim beyond its evidence. That is the same
  defect one level up and it is in front of a reader now. Underneath both sits the thing that has
  drifted worst. The director named his top item in his own words at 05:55Z today — *"fix the
  settlement ceiling so the campaign's wins actually reach the book"*, with the explicit rider that
  its time argument is circular and *"needs a non-circular basis, not a bigger number"*. Three
  directions have gone by. `SETTLEMENT_CUSTOMER_YEAR_BUDGET` is still 1,200, still refuses **340 of
  386** funnel wins, and my own last direction wrote "nothing here supplies that basis" and then did
  not make supplying it a focus item. The allocation repair at `248a6368e` was real — 45 accounts
  across two years became 90 across ten on fewer settled customer-years — but it improved the
  distribution of a book that is still 88% refused, and that refusal is a compute budget on this
  box, not a fact about commerce. The arm prices 20 renewals because the book is 167 accounts
  because a wall-clock budget refuses the rest. Not a step backwards, but three stretches of
  correct, careful work on the instrument while the thing throttling it sat unnamed.
