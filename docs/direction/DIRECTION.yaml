  - what: >-
      Naming PB4, PB5 and EP17 as focus items again. All three sit in lane `W2_customer_generator`
      and were excluded from candidacy entirely by RUNG 1c until this stretch's exemption for
      product-priority atoms; they are drawable now for the first time.
    why: >-
      They are good work and the ordinary draw can now reach them without my help, which is the whole
      point of the rung 1c repair. Spending focus slots on atoms the draw can take is how lane 0 —
      the only consumer of this file — ends up carrying nothing it alone can deliver. The shortage
