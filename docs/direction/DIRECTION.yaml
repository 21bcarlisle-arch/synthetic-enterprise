- id: the-won-first-term-is-contracted-at-the-strike-it-was-quoted
  lane: B_commercial
  side: supplier
  what: 'Make the won account''s first term carry the strike the company quoted. Read docs/staging/SEAT_FINDING_A_WON_FIRST_TERM_IS_CONTRACTED_ON_A_STRIKE_IT_WAS_NOT_QUOTED_2026-11-24.md
    and docs/staging/records/SEAT_PREREG_THE_FIRST_TERM_CAP_HOLD_DELETED_2026-11-24.md. K8 first: amend
    §7 of docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md with what a real
    supplier contracts a won fixed first term at, sourced from SLC 22/31E and published practice, plus
    the measured gap. Then build one path: either the quote from growth_desk.quote_first_term is carried
    onto the account, or the first term and the quote are struck through one function. It goes behind
    one named switch, default off, with a control that asserts the switch CAN be taken. Before landing,
    at the run seed and real inputs, print per year (2017-2025) the quoted strike, the contracted strike
    and the market''s cheapest fix, with the switch off and on. Re-run the cap-hold pre-registration''s
    probe with the switch on, and write a prediction for P2 and P3 with ranges. Do not flip it before
    the post-s.12g book has been read: B8''s five grades read that book, and two changes in one book cannot
    be told apart.'
  why: 'A won first term is billed on a strike nobody quoted: up to 1.54 times the cap in 2021, and 31%/18%
    under the market''s cheapest fix in 2023-24 against a quote at 4.5%/5.1% under. So the book''s first-year
    margin cannot test the price decision the company made per customer, and the cap hold cannot be deleted
    while this stands. Done means the amended §7, the switched-off build and the per-year table are on
    origin, with the prediction written before any book carries it on.'
  written_at: 1795490907.594
- id: the-msc-replacement-win-lands-or-releases-the-book
  lane: E_finance_treasury
  side: supplier
  what: 'land8 (/var/tmp/se-msc-keep/land8.sh, pid 916978) waits on s.12g (pid 65649, ~06:00Z). Do NOT
    launch another copy while it lives. When /var/tmp/se-msc-land7-ended-20261123.txt appears, read the
    land7 log. IF IT LANDED: run surgical_land --verify on the origin sha and confirm fill_hold.sh wrote
    it into origin''s MSC row of background/next_book_requires.yaml. Then confirm the b8-msc-hold-row-follow
    unit mirrored it into the shared copy (its follow_hold_row.log in /var/tmp/se-msc-keep/shared-tree-20261124/),
    and that sim-runner''s next cycle stops logging "has not landed". IF IT DID ANYTHING ELSE: in that
    same turn, delete the MSC row on origin AND in the shared copy (sim-runner reads the shared one),
    and land the deletion. Then grade da44381d2''s prediction (a timeout at 90-95%, no red) in its finding,
    keeping the wrong figure beside the result. Before any land9, take the next setup lever the finding
    names. Never raise GATE_TIMEOUT_SECONDS.'
  why: Without MSC the post-s.12g book's 2022-24 P&L omits a real levy on won switches, in the years the
    thesis is hardest, and the campaign patch (msc9) cannot land before it. The row is now the book's
    only live hold, so leaving it unresolved costs every queued supplier grade. Done means sim-runner's
    log shows the book admitted (MSC on origin with its sha in the row, or the row gone) and da44381d2
    is graded.
  written_at: 1795490907.594
