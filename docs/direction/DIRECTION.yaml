for_the_director:
  - >-
    EP17, the one question that can decide whether the thesis test gets an answer. At about 13:40Z
    today ab6's pilot says whether one book's own renewal noise can show per-customer choosing
    beating flat rules. The prereg puts about 70% on "it cannot" (n* > 12 seeds). If so, the only
    variable left inside the compute ceiling is running the same A/B over several different casts
    of households. A longer window does not exist, and a wider renewal funnel would make the book
    less like a real one. A different cast is EP17, which you reserved. My recommendation: release
    EP17 for measurement only. Four casts first (about 6 box-hours), at most 12. The published
    baseline world stays at its current cast, untouched. The seeds used go in a curriculum file
    you can read, and no result changes which world the company lives in. I am building the flag
    now behind a refusal that names EP17, so nothing launches without you. If you say nothing, I
    publish "cannot say on this book" as the answer and the four-cast pilot stays unlaunched.
