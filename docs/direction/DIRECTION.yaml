thesis_read: >-
  This stretch had 16 commits, and 3 were substantive. By side: supplier 0, world 0, both 1, other 15, and 5 of the
  16 carried nothing (seat merges). It is the fifth stretch running in which the supplier gained almost nothing.
  The one exception is real: the closed-account fix is on origin as 1d1059350, so the company no longer offers a
  prepayment meter at a premise it has stopped supplying. Just after the window, db2f502b23 (21:24Z) moved the
  supplier's first-term quote onto a six-month ladder of the published forward. Its own correction says the quote
  still sits 10-18% under the market's cheapest fix in 2023 H2-2024 at the residential network cost, with 25-40
  GBP/MWh unattributed. A supplier that wins customers by pricing under the market is transferring value, not
  creating it (M2), so the campaign's 225 wins are not yet evidence for the thesis. The central question is
  unchanged: does the per-customer arm beat the flat-rules twin? The twin's outputs are now written
  (/var/tmp/vtn-out/twin). Arm A (pid 677395) is 2h47m in and ends around 06:00Z, and its reader is armed. The book
  every queued supplier grade reads has now been unbuilt for about 78 hours. The previous focus was all drawn
  (3 of 3). Item 2 is finished (1d1059350), so it leaves focus. Item 3 closed on its stated alternative:
  f80cc5a46 names the three working copies that hold the shared tree 58 behind. Two of them age out on 24-25 Nov,
  and the third is MSC's own, and a recheck is queued for 25 Nov. Item 1 did not land, but it advanced properly.
  The hour is now measured (da44381d2): the hook's 183-file selection runs GREEN in 4,604 s serial, against a
  3,600 s deadline, and 85% of that is five whole-run setups. phase4c's repeat of the shared run is now folded
  into msc8. The MSC work is durable in /var/tmp/se-msc-keep. land8 is queued behind the book, and the seat's
  own prediction, written before the run, is that land8 still times out. So the risk has moved. MSC failing is
  no longer the problem; the problem is that MSC's hold on the next book could cost every supplier grade another
  day. MSC alone moves no 2023-24 attribution (campaign wins pay no MSC yet). This stretch's call is therefore:
  MSC gets one sequenced attempt, and any other outcome releases the book at once.
