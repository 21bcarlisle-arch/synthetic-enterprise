  - id: an-instrument-that-reports-success-without-checking-its-subject
    what: >-
      **Make the executor's `rc=0` and the direction's `drawn` field mean what they say. One class,
      two instances, and both were load-bearing this stretch.**

      **Instance one, and it cost six discharges.** `background/seat_executor.py` logged
      `FINISHED <id>: rc=0` six times for work that landed nothing —
      `land-the-dd-inference-organ-and-unwedge-every-lanes-publish` at 15:36 and 16:35, and four
      earlier under its atom id. A bounded session that produced no commit and no filed finding
      exited zero, and the downstream register read that as done. **The executor must verify its own
      subject before it reports.** Key the control to the property — *a discharge names what it
      landed, or it is unfinished* — never to today's item ids or to a list of expected paths. The
      honest exits are: a commit sha it can name, a finding it filed saying why not, or a non-zero
      rc. **Prove it by mutation under `python3 -B`** (never a stale `.pyc`): an edit that lets a
      no-op discharge report `rc=0` must red a named test whose message says which of the three
      outcomes was missing.

      **Instance two, same shape, one level up.** `previous_focus_drawn` reported `drawn: []` while
      `seat-executor-log.md` showed the exact id `RUNNING` twice in the window. It is now the fifth
      consecutive stretch of that false negative, and this time it did real damage: it hid that the
      non-atom-id fix had **worked**, and my predecessor spent a `wrong` entry on a routing problem
      that was already solved. Make the field read the executor log for the window it covers.
      **Also make it refuse a focus id that is a maturity-map atom** — `delivery_lane.next_item`
      builds from `direction.unreachable_focus(_atom_ids())` and excludes every atom by
      construction, so an atom id routes work to the weakest channel there is and says nothing.

      **Done means:** a source mutation on each instance reds its own named test with its own stated
      reason; a no-op executor discharge exits non-zero or files a finding; `drawn` reflects the
      executor log; and a focus id that is an atom is refused at write time with a message naming
      why. Prefer one leg that fires over a register that watches — if a one-leg check catches it,
      ship the leg and delete the register you were about to write.
    why: >-
      Three instruments reported success or absence without checking their subject this stretch, and
      together they are the entire reason nothing landed: the executor's `rc=0`, the direction's
      `drawn: []`, and a stretch review that reads HEAD in a tree twenty-four commits behind it.
      That is R15's fail-silent killer with three live instances in one afternoon, and it is the
      class that makes every other item on this list unverifiable — including whether ranks one and
      two actually got done. It sits behind them because they are bleeding now and this stops the
      bleeding recurring; it sits ahead of everything else because without it the next orientation
      cannot tell whether they happened.
