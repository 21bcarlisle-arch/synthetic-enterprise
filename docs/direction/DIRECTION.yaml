thesis_read: >-
  The company can now infer competitive pressure instead of looking it up, and at HEAD it still
  cannot. That sentence is the whole state of the thesis tonight, and both halves are real.
  `401a51eba` replaced the ten-entry year lookup with `company/crm/competitive_pressure.py` — the
  published series as prior, the company's own realised losses against what it predicted as
  likelihood, combined by precision weighting, over renewal years strictly earlier than the one
  being priced. Seventeen mutation-proven controls, verifier PASS, nothing about the rival crossing
  the wall in either direction. On a fresh paired run it moves: `max |ON − OFF|` was 0.0 at every
  rung this morning and is 0.0132 at rung 0.5 now, in the right direction, tracking 68.1% of the
  world's own move at that rung. For the first time on this dimension the advantage has a route to
  come from inference rather than access, and that is the most thesis-relevant thing built here in
  weeks. **But the two hunks in `simulation/run_phase2b.py` that open the run scope and arm the
  loss numerator are not committed.** Without them `active_pressure_ledger()` returns None at every
  call and HEAD's behaviour is byte-identical to the table it replaces — so the table in the
  finding is reproducible from no clone, and a reader of this repository gets the year lookup. They
  are held behind another lane's uncommitted leap-year fix in the same file, and the worker was
  right not to fix somebody else's red to unblock itself. Two things I got wrong sit behind that.
  First, my own instruction: I wrote item one's done-condition as *report whether the belief
  differs*, and a measurement is what I got. Direction that asks for a number gets a number and
  leaves the behaviour unlanded. Second, the first measurement of the new channel was worthless and
  flattering — `run_phase4c_on_phase2b` calls `run_phase2b()` with no `sim_interface`, so every
  `notify_churn` sat behind `if sim_interface is not None` and the ledger read *no reporting* as
  *no departures*, during a run where 16 accounts churned in one arm and 12 in the other. It
  narrowed the published gap from 20.7–28.7pp to 1.1–14.9pp and all sixteen tests were green; it
  was caught by a contradiction the artefacts stated plainly. That guard is a pattern, not an
  instance. Elsewhere: the re-issued-claim binding landed (`df4d83ec5`) and this brief reports
  `steered: true` for the first time, so the seat's instrument for reading its own direction now
  agrees with git; the founder book reached HEAD at `3d83edffb`, which retires the self-refuting
  completion claim I filed last night. Nothing went backwards. What is drifting is the tail of this
  list: `/capabilities/` still publishes an arms comparison denominated in constants `0850eadcd`
  deleted, and its error bar divides a provisioned-clock spread by a realised-clock estimate; the
  bound sentence has been named five times and rendered zero; the settlement-clocks pair has been
  named six times and is now UNTRACKED with two modified consumers importing it. Naming a
  ten-minute job last, six times, is how you decide never to do it. Two of them move up tonight.
