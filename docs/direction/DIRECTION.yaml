thesis_read: >-
  THE INVERTED INPUT IS NAMED, AND THE QUESTION HAS CROSSED THE WALL. The value arm's loss runs
  through a retention belief that anti-ranks the world. This stretch settled where that inversion
  lives, using existing artefacts and no new run. Among direct-debit first renewals, the whole
  -0.383 sits in enriched_churn_estimate's rate term. Holding that term at its book mean turns
  the correlation to +0.331 (8dc8dcd97). payment_estimate is a flat 0.05. The engagement factor is
  never read, because decide_margin passes no payment_method. The market multiplier is correctly
  signed. The six-seed PB6 grade on filed bands says PB6 changes neither ranking nor level
  (AUC 0.487, corr -0.256, every seed within 0.001 of the pin; b45d9a5c6), and that closes
  PB6 as the lever. PB7's learning rule cannot reach it either: it is one scalar per channel, and
  the inversion is within a channel. The thesis question is now sharper than it has been, and it
  is no longer only the company's. Inside the rate term, the inverted inputs are the account's
  standing features. Within a renewal year, the WORLD's p_retain falls as tenure and bill size
  rise (-0.32, -0.27), and published evidence (CMA 2016 inertia) says longer tenure switches
  less. Before the company is taught to fit that, someone must ask whether the world is right.
  The world's switching code uses the word "tenure" for HOUSING tenure (owner, private renter,
  social renter in simulation/switching_propensity.py), not years on supply, so the -0.32 may be
  a confound and not a term. That is the first item. A company that learns a world artefact would
  "beat average" by access to a defect, which is the opposite of the thesis. EP1 gave the same
  shape from the other side. The derived renewal record reproduces every decision the world rolled
  (37/38 churns, 68/68 stays), but the world decides at only 106 of ~520 anniversaries. So
  "per-renewal hazard" has three readings, 0.36, 0.09 and ~0.17, and the definition must come
  before the build. The published record should settle most of it (a default-tariff customer is on
  an evergreen product), so it goes to research first, not to the director. ON THE MACHINE: all
  four previous focus items finished and disappear. The ledger fix ebc9af681 is on origin. It
  reached origin through origin_reconcile's push, about 70 minutes late because the reconcile
  worktree was held; surgical_land never pushes (dab06dea3). Boot-sha drift now reports two legs
  (12a67dfc8). Running it showed my carried diagnosis was wrong: it grades the DISK, not HEAD. It
  showed 0 stale while 4 of 10 daemons ran code the trunk had replaced. This stretch went
  backwards on one point. The shared checkout is now 0 ahead and 31 behind origin, and every
  5-minute reconcile logs NOT_ADVANCED, refused by 9 uncommitted shared-tree copies that origin
  also changes (maturity_map.yaml, EP1's simplification yaml, tests/background/conftest.py among
  them). That is the second time in two days; the 2026-09-30 clearance was by hand. So the
  daemons run stale code, and nothing has raised it past its own log. It is the second focus
  item. A surgical_land titled "EP1 pass 20" was gating at orientation (pid 3300519), after
  d77ff33d5, "EP1 pass 20 lands", reached origin at 02:06. If it lands, it is a live instance of
  the land-twice row. 20 commits, 8 substantive by the brief's count; the 5 empty ones are
  reconcile merges.
