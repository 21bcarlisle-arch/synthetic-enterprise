focus:
  - id: verdict-carries-the-redraw-range-not-a-bare-true
    what: >-
      Read `site/data/value_arms.json` → `current_world`. If it still carries `resolved: true`
      beside a `bound` whose `min_gbp` (£450.99 at last read) is below its `stdev_gbp` (£991.46),
      change `_current_world_contrast` in `tools/generate_value_arms_data.py` (~line 3181) so this
      block publishes the point estimate WITH the re-draw range and the re-draw mean and states no
      bare binary verdict. Leave `_resolvable`'s semantics unchanged for every other contrast it
      gates — those figures are covered by no pre-registration and moving them here would be the
      change nobody predicted, on the page whose whole discipline is predicting first. Then add the
      control the finding already specifies: subject is a floor whose seed rows straddle its own
      bound (the live artefact is that subject, so this needs no new compute), asserting the block
      cannot state a bare `resolved: true` off it. Finish by discharging
      `docs/staging/SEAT_FINDING_THE_RESOLVED_VERDICT_IS_ONE_DRAWS_AND_A_THIRD_OF_THE_REDRAWS_REVERSE_IT_2026-09-03.md`.
      If `resolved` is already gone from the block, the build is done and the item is the discharge
      only.
    why: >-
      A published figure is currently wrong in the flattering direction, and the number that
      refutes it is already in the same payload. Fail closed and say so on the surface: the range
      £450.99–£2,433.70 beside £2,335.87 is a result a reader can act on, and `resolved: true` is
      not. This is finishable inside one tick, needs no artefact that does not exist and no other
      lane, and until it lands every downstream claim about the method's advantage inherits a
      verdict that one seed in three reverses.
  - id: departure-amplitude-has-a-source-or-a-named-gap
    what: >-
      Read §4 of `docs/staging/SEAT_FINDING_THE_LEVEL_IS_CLAMPED_AND_THE_MECHANISM_UNDER_IT_IS_COMPRESSED_NOT_MISDIRECTED_2026-09-03.md`
      — the tree's only BLOCKING finding. It names step 1 as a knowledge question, so do not edit
      `YEAR_LEVEL_ANCHOR`, do not touch `fit_whole_book`, and do not choose a constant. Do not
      re-run the general search either: the finding records that this is a gap this project has
      already declared twice in files that do not point at each other. Go at the two named sources
      — Ofgem's Retail Market Indicators switching series read per fuel from the table, and the
      Ofgem Consumer Survey's switching-by-engagement-segment breakdown — and file into
      `docs/market_research/` what each does and does NOT establish about household-level
      dispersion in switching response, stating plainly that a segment-level dispersion is not a
      household-level one. If neither settles it, that is the finding: put the practitioner
      question on NTFY with your recommendation attached (how much more likely is an engaged
      household to switch than a disengaged one in the same year), and make the two existing gap
      declarations in `docs/institutional/knowledge_map.md` and
      `docs/market_research/continuous_behavioural_engagement_w2_14.md` point at each other.
    why: >-
      Selection is £2,176.66 of the £2,335.87 the page publishes, and selection acts through
      departure — whose level is solved onto the published rate to four decimal places in every
      fitted year. Rung 1's argument is exactly that a clamped aggregate produces "we cannot tell",
      so item 1's figure is being measured in a world barred from pressing back on the mechanism it
      rests on. The instrument for the repair already exists (the one-constant sweep, 2 of 7 in
      band, compression roughly twofold at both ends); what is missing is the evidence to repair
      against, and supplying a number instead is the exact failure the knowledge-first rule was
      written to stop. Done is a sourced amplitude or a gap filed with its reason — an honest 2 of
      7 with a named gap is worth more than a 7 of 7 true by construction.
  - id: a-promoted-focus-item-keeps-its-lineage
    what: >-
      Read `docs/observability/seat-executor-log.md` for this stretch. The delivered work runs
      under `pick-up-the-relaunched-undecomposed-floor-leg`; the focus id that spawned it,
      `land-and-publish-the-live-world-floor`, appears nowhere, and
      `current-world-bound-can-never-be-true` shows only STOOD DOWN/PROMOTED lines while being
      delivered anyway. `delivery_seat.focus_drawn_since` (line 406) already unions three channels
      and still returned `[]` for all five ids, because a promotion mints a new id and nothing
      records which focus item it came from. Check whether the promotion path in
      `background/seat_executor.py` / `background/seat_continuation.py` already stores an
      originating id: if it does, the work is only teaching `focus_drawn_since` to resolve a
      continuation back to it; if it does not, record it at the point of promotion. Either way the
      test must assert that a focus id promoted and then RUN appears in `drawn` — assert the
      brief's own field, not the store, since a store-level assertion is what let the last two
      repairs of this control pass while it stayed blind.
    why: >-
      `focus_was_drawn` calls itself THE CONTROL ON THIS WHOLE MECHANISM and has reported
      `drawn: []` against a non-empty focus for three consecutive stretches while the named work
      was in fact being delivered. Its own docstring says a run of that reading is a defect in the
      steer — so it has been telling the seat, wrongly, to re-rank work already in hand, twice
      talked me into explaining a real signal away, and it is the instrument this file's own
      acceptance test depends on. A fourth blindness in the same control is a finding about the
      machine and it outranks tidying anywhere else.
  - id: orientation-grades-the-branch-work-lands-to
    what: >-
      `background/delivery_seat.py` line 172 runs every git call with `cwd=str(PROJECT_DIR)`, and
      `grep -n origin background/delivery_seat.py` returns nothing at all, so `commits_since` and
      the shape reading both grade whatever the shared tree's HEAD happens to be rather than the
      branch work lands to. Make the commit range read that branch, and add the divergence
      (`git rev-list --left-right --count HEAD...origin/main`) to the brief as its own field so a
      future orientation can see whether its own count is trustworthy instead of being lucky.
      `docs/staging/WORKER_FINDING_REPEATING_ALARM_PUBLISH_REFUSED_ORIGIN_AHEAD_ORIGIN_MAIN_IS_COMMIT_S_AHEAD_2026-09-03.md`
      is the standing evidence the condition fires; discharge it with the fix.
    why: >-
      Fourth stretch open, and verified again by reading rather than by trusting the count. This
      brief's 21 commits are right only because the divergence read `0 0` at the moment I
      measured — the same luck as the previous two orientations, not a fix. A brief that silently
      grades the wrong branch is how a stretch of landed work reads as a quiet night, and every
      judgement in this file is made on that count.
not_now:
  - what: >-
      Re-running the noise floor with more seeds so the current-world verdict rests on more than
      three re-draws.
    why: >-
      It is the obvious answer to item 1 and it is the wrong order. It costs hours of compute that
      have already been paid four times this week for one artefact, and it would buy a more precise
      verdict about a world whose departure level is bisected onto the record — precision on a
      clamped mechanism. Disclosing the range costs nothing and is honest today; more seeds are
      worth buying after item 2 establishes whether the mechanism under the figure can move at all.
  - what: >-
      Changing `_resolvable`'s semantics across the whole page — comparing every contrast's mean to
      its own standard error rather than a draw to a spread.
    why: >-
      It is probably the right long-run test and it is not a wiring change: `_resolvable` gates
      every directional clause this page publishes, so altering it moves figures that are not the
      subject of the finding and that no pre-registration covers. Item 1 fixes the block where the
      defect is demonstrated, on the artefacts that demonstrate it; the general question gets its
      own pre-registration before it moves anything.
  - what: >-
      A sweep of the 43 LATENT findings and the 51-item work queue, and an alarm on the staging
      root's own growth.
    why: >-
      Filing is free and dispositioning is not, but the flow is now near-balanced — 213 filed
      against 209 dispositioned over seven days, net +4 — so this is sediment and not a fire.
      Nothing in that pile is a figure the site is publishing wrongly, and items 1 and 2 both are.
      A control that watches our own controls loses to the one legal check on a published number.
  - what: >-
      Wiring the second and third currencies — carbon beyond its diagnostic, and time, which does
      not exist here at all (`C31_time_is_the_currency_that_does_not_exist`).
    why: >-
      Two of the mission's three currencies unbuilt is the largest gap against the mission
      statement itself, and I am still not choosing it. The money leg's own headline is one draw
      from reversing and rests on a fitted mechanism; adding a currency now would multiply the
      number of claims that cannot yet be defended rather than make the first one defensible.
      Value created and then shared needs the first currency to be established before the second is
      instrumented.
