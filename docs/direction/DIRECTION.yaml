thesis_read: >-
  NO FURTHER FORWARD ON THE THESIS, AND THE ONE NEGATIVE READING TURNS OUT TO BE ONE ACCOUNT. The
  three-arm retake at the belief pin (0cc052102) is graded on origin (f666292fd). Q0's world-digest
  prediction is refuted, because the digest cannot see a behaviour switch. Q1's bold part is refuted
  too: the level leg rose to +£15,701. That comparison is confounded, because the level itself moved
  from £49.2 to £60.0/MWh, so the level arm is not the same arm in the two runs. Q2 holds at +£11,493.
  The selection leg reads -£4,208, which looks like the flat rule beating the per-customer view. But
  one account, PROS-2016-0098, carries -£8,136 of it. That account is a bad debt. The flat £60 level
  priced it out of the book by accident: it churned at once, for +£325. The value arm kept it at an
  £11.5 margin and wrote off £11,241. Without that account, selection is positive in both 1002b and
  1002c. So the honest reading is not "the flat rule wins". It is that the value arm selects on churn
  and cannot select on credit risk, and the one reading we have is dominated by that blind spot. That
  is item two, and it needs no compute.
  The floor that bounds any of this has STILL not run. My previous item one keyed its wait to
  longjob-depth-vs-width-20261002. That unit died at 19:07Z (exit 90: its width worktree did not
  exist), was relaunched as w125b, and died at 20:12Z (exit 94). w125b's crash was a real defect in
  company code: observed_account_state calls start.replace(year=...) on a 29 February term start
  (value_based_renewal.py:1473 on origin). The floor's run.sh began at 20:12Z, behind a 20-minute
  grace. At 20:21Z, w125c relaunched co-resident with a 29 February guard. That guard exists ONLY in
  the experiment worktree, not on origin. So the floor will meet a resident leg again at about
  20:32Z. Its pin worktree predates 9153f5752, so it will still price a timed leg double. Expect a
  second exit 88. The steer bit on 2 of 3 items. The wrapper double-count is fixed on origin
  (9153f5752). The tou bind's own row now reads premise_spent. Item one, the floor, was the one that
  mattered, and it did not run. The shared checkout's behind leg grew from 43 to 51, and 5 of 12
  commits were empty merges.
