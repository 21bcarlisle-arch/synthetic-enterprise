focus:
  - id: churn-roster-diff-reports-nulls-as-zero
    what: >-
      Land the churn-roster-diff instrument and make it capable of reporting a number. Three
      things are uncommitted in the working tree right now and they are the whole instrument:
      `tools/run_value_cycle_ab.py` (modified -- `git show HEAD:tools/run_value_cycle_ab.py |
      grep -c churn_roster_diff` returns 0), `tests/tools/test_run_value_cycle_ab.py`
      (untracked), and `docs/observability/value_cycle_ab.json` (modified -- the 13:58:01Z run,
      identical in every realised figure to the committed 12:35:29Z one, differing only by
      carrying the new block). Commit them by pathspec. Then fix the defect the output shows:
      `churn_roster_diff` names five accounts -- C1_2, C3, C6, C7 lost under the value arm and
      PROS-2019-0003 under the control -- and every one has `segment: null` and
      `realised_lifetime_margin_gbp: null`, while `only_in_value_arm_realised_gbp`,
      `only_in_control_arm_realised_gbp` and `largest_single_difference_gbp` all read 0.0. The
      per-account entries correctly declare a blank; the aggregation collapses those blanks to
      zero, so the verdict is a constant no run can move, and it is published beside a `reading`
      that instructs the reader to divide it into `realised_delta.gross_margin_gbp`. Two halves,
      both needed: make the arms publish `per_customer_lifetime` so the figures exist at all
      (`tools/run_value_cycle_ab.py:163` reads `result["per_customer_lifetime"]` and falls back
      to `phase2b`; `margin_movers` is unavailable for the same reason), and make the aggregates
      unavailable rather than 0.0 when they are summing blanks. R15 both ways: a mutation proving
      a genuine single-account concentration is reported, and a null control proving an all-blank
      input reports unavailable instead of zero. Then re-run and say which accounts moved the
      GBP 123,006.
    why: >-
      The only measurement this project has of its own thesis is -GBP 110,731 of enterprise value,
      and nobody can currently say whether that is a portfolio property or one decision. The arm
      loses GBP 123,006 of gross margin on 3 extra churns -- GBP 41,000 each, against domestic
      accounts whose whole-life margin averages about GBP 420. This book carries five I&C accounts
      averaging GBP 221,491 of lifetime margin and the four accounts the value arm lost differently
      are all C-prefixed. If the delta is one large account then "the value arm loses" is a case
      study and n=1 is not a thesis; if it is spread, the loss is a portfolio result and everything
      downstream reads differently. This is first because it is the cheapest item here and it
      decides how to read every other item, and because the instrument that would answer it is a
      control whose verdict cannot vary -- the fourth R15 shape, on the measurement that matters
      most. It is also the same lesson this stretch already learned twice: `6089f90a9` and
      `5a2caf338` landed because a paired reading was only as committed as its weaker half, and
      two commits later the entire instrument is sitting in one worktree again. Finished when the
      tool, its test and its output are in origin, an all-blank input reports unavailable rather
      than 0.0, both directions are proven by tests, and the record names the accounts behind the
      GBP 123,006 or states with figures that no single account dominates it.
  - id: EP1_clv_three_horizon
    what: >-
      Give the tenure horizon per-account dispersion it does not have, from observables the
      company can actually know. The measured fact to work from, not to re-derive:
      `docs/observability/coupled_gap_ledger.json` `components.lifetime_level` reports
      `distinct_hazards: 1`, `hazard_histogram {"0.05": 33}`,
      `hazard_is_constant_across_graded_population: true`, median believed tenure 20.0 years for
      every graded account. The cause is `saas/churn_model.py::churn_probability` --
      `min(0.05 + 0.03 * bill_shock_count, cap)`, a step function of one integer that is zero for
      42% of the run's 622 renewal decisions -- consumed by
      `company/analytics/clv_three_horizon.py` at H2 as `hazard = latest.churn_probability`, with
      the term `1.0 / hazard`. Do NOT re-diagnose the level: `hazard_calibration` grades belief
      against a tally of `event_type` and the 0.05 bucket reads 0.05 believed against 0.053
      realised over 263 decisions, so the level is right and the dispersion is what is missing.
      Widen the propensity to use more of what a supplier observes about an account -- payment
      method and payment behaviour, tenure to date, the account's own tariff against the market it
      could switch to, consumption volatility, contact and complaint history -- and check every
      input against the wall before using it: if it needs a simulation internal it is a violation,
      and `company/interfaces/sim_interface.py` is the only door. Then re-measure with
      `python3 -m tools.couple_clv` and report the ledger's next reading whichever way it moves.
      Nothing may be tuned toward a smaller gap (R12), and the 0.204 scalar is not to be applied.
      If the gap worsens, that is the result and saying so is the deliverable. A level move to 3
      is available on this evidence if the coupled rung is genuinely met -- self-certify with
      `record_level_up_self_certified`, and never `--no-verify` a `level_current` change.
    why: >-
      This is the thesis, stated as a defect. The director's thesis is a supplier deciding
      customer-by-customer on lifetime value, beating a flat baseline through better prediction
      and nothing else -- and on the lifetime half of that sentence the company currently predicts
      the same 20-year life for every customer it grades. A constant cannot rank anything, so
      whatever per-customer view the value arm has today comes entirely from the margin term, and
      the arm that loses GBP 110,731 is maximising against a belief that is flat on the axis the
      thesis names. It is second only because item one decides whether that loss is a portfolio
      property, and it is not fourth because every other measurement in this project ultimately
      grades this estimator. It is also the first lead here that is a real inference problem rather
      than an instrument repair: the hazard is not wrong, it is uninformative, and making it
      informative from observables alone is exactly the work the thesis says the advantage has to
      come from. Finished when the graded population shows more than one distinct hazard, the
      ledger's next entry comes from a changed estimator rather than a changed sample, every new
      input is named with the observable it comes from and cleared against the wall, and the new
      gap is recorded whichever direction it went.
  - id: no-skill-baseline-fitted-on-the-graded-population
    what: >-
      Decide the divisor and then ratchet the class. I decide the first half here so nobody has to
      ask: the published no-skill baseline moves to the point-in-time-fair one -- the mean realised
      value of accounts that had ALREADY ceased when each belief was formed -- and the in-sample
      figure is published beside it, not deleted, so the two readings stay comparable and the
      change is legible in the record. Both numbers already exist for EP1: 2.529 in-sample against
      2.193 point-in-time-fair, so about 13% of the headline is the yardstick and the belief is
      still worse than no-skill either way; this is not an acquittal and must not be presented as
      one. The reason it is a decision rather than a diagnosis is that it moves a published figure,
      which is mine to take and is taken. Then do the class work
      `WORKER_FINDING_THE_CLV_GAP_IS_GRADED_ONLY_ON_THE_CUSTOMERS_WHO_LEFT_2026-08-26.md` leaves
      open under R10: `tools/couple_supply_start.py` normalises against "predict the mean tenure",
      and `couple_pb3_book_growth.py` and `couple_value_based_pricing.py` also publish an in-sample
      `g0` -- none has been checked for whether its graded population is selected on the outcome it
      predicts. Walk all fifteen `tools/couple_*.py`, and make the general rule enforceable rather
      than remembered: a no-skill baseline computed on the graded population is not no-skill, so
      any coupler publishing a `g0` must publish the selection profile beside it or fail. Reuse
      `tools/clv_gap_selection.py`, which already does this for EP1 and already has its six
      proven mutations.
    why: >-
      The coupled-triad doctrine says the gap IS how this project judges itself, and sixteen atoms
      are graded by that ledger. EP1 has just shown what a contaminated one looks like: a perfectly
      calibrated hazard scored as a five-fold over-estimate because the harness graded the model on
      precisely the 5% who left, and that single artefact aimed a whole stretch of thesis-critical
      work at the wrong term -- mine, and the closing report to the director. If any other coupler
      grades an outcome-conditioned population, the number the director reads as "the company's
      belief against the world" is partly the yardstick, and we would not know which. This is third
      rather than first because EP1's contamination is now measured and declared, so nothing is
      currently being misread; but it is on the list rather than in the tail because it is the
      instrument every other item is measured with. Finished when the published EP1 divisor is the
      point-in-time-fair one with the in-sample figure beside it, every `couple_*.py` has been
      walked and its answer recorded, and a control fails a coupler that publishes a `g0` without
      the selection profile that lets a reader judge it.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Build the coupler. There are fifteen `tools/couple_*.py` and none is carbon;
      `docs/observability/coupled_gap_ledger.json` has sixteen keys and none is EP13; the atom is
      still `level_current: 2`. The independent truth series exists -- `sim/neso_carbon_intensity.py`,
      NESO's published half-hourly number, deliberately a separate module from
      `sim/grid_carbon_intensity.py` so the two routes stay independent -- and it has never been
      used to grade anything. Write `tools/couple_carbon_intensity.py` in the shape of its
      siblings, measure the gap between the company's reconstructed intensity shape and NESO's
      published series, and write the row into the ledger. Read focus item three before choosing
      the divisor: do not publish a `g0` fitted on a population selected by the thing it predicts.
      The specific claim to confirm or correct in figures is the one `sim/grid_carbon_intensity.py`
      makes about itself in its own L2 ledger entry -- that its quietest half hours sit near 0.05
      of average against NESO bottoming out nearer 0.16, because no coal and no interconnector
      imports are dispatched, so any time-shifting benefit computed from it is an upper bound.
      That sentence is a recollection written in the grammar of a measurement. Move `level_current`
      to 3 and self-certify with `record_level_up_self_certified` only if the gap is measured and
      the atom's three named L2 reservations are answered; if the gap is large the level stays at 2
      and saying so with the figures is the deliverable. Never `--no-verify` a `level_current`
      change.
    why: >-
      This atom was named last orientation, drawn, and two substantive commits landed against it --
      the biomass envelope measured and deliberately not dispatched, the actionable forecast graded
      as a ceiling -- and the rung that actually gates the level was not the one built. Under the
      coupled-triad rule no world atom reaches 3 until the company has been tested against it and
      the gap measured, so this is the one atom on the board whose level can move on real evidence
      rather than on a landed file. It is fourth because it is world fidelity rather than the
      supplier's per-customer inference, and the three items above are all on the thesis itself.
      It is on the list at all because it is the same discipline in a cleaner instance: a number
      published without the independent comparison that could refute it, with the refuting series
      already built and sitting unused. Finished when the ledger carries a carbon row produced by
      a coupler that reads both series, the 0.05-against-0.16 claim is confirmed or corrected in
      figures, and the level either moves with that evidence cited or is explicitly held with the
      reason written down.
