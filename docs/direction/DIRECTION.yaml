thesis_read: >-
  The stretch did what the last record asked first, and the base under the retention result is
  now one thing rather than two. 7981270d0 put both departure findings on one definition (per
  fixed-term ender, left the supplier within 42 days or 12 months) and corrected both beside their
  claims. The 7.8% was a prorated expectation; realised, it is 14.2% at 2017-2021 (29/204) on a
  full run, above EFTC's 6%, which turns out to be a floor because its control arm excludes
  households who had already acted. At 2017-2021 the world sits inside the published switching
  total, and the gap is withdrawn there. At 2024-2025 it is reopened: 30.4% within 42 days on 46
  enders (CI 19-45%) would take 2025's term-enders to about 9.5% of accounts against a 10.4%
  total. One seed and 46 households cannot say whether that is a defect, so the multi-seed count
  now leads, because the director's hold on the 400 founders waits on it. The gas home's evening
  peak moved for the right reason: electronics came to its dated 2022 level (6987325ae, the meter
  fell 294 kWh as pre-registered), and the SERL control the record asked for is on origin
  (3ff16bada). It is honestly red: the peak is 0.626 against 0.445-0.485 and the season 1.291
  against 1.36-1.47, with the trough passing. What is left is a level term, not a shape term. The
  value arms republished at 45122d156 (cb54420a0), with R5 holding and the page's verdicts still
  withheld, because 22 imported paths have moved since. Against the thesis the position is
  unchanged. The one place inference beats a flat rule is the reactive save, and its settled-run
  wiring with the director's fairness checks is in surgical_land right now, after claims at 14:19
  and 17:21. Its three arms are running on the box. Nothing from it is on origin, so the thesis
  has not yet advanced past the grading tool. Of the previous focus, the reconciliation is done,
  the gas home moved to its control, the save offer is landing, and the voids split is being
  offered from 21:04Z, which is the first time in three stretches; whether the held-work check
  explains the earlier misses is still not shown. The machine went backwards again. HEAD is 50
  behind origin, from 41. The last orientation's record (17:21) never reached origin, whose
  DIRECTION.yaml is still the 14:22 one (3e8c847a4). Two long jobs were OOM-killed this stretch,
  with the director's memory budget on origin but not in the checkout sim-runner runs.
