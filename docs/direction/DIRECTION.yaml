  - what: >-
      Choosing `a_shock` to close the 99.9%-to-56.6% reason-mix interval — from the published
      mover-mix, from a prior, or from whatever makes the mix look sensible.
    why: >-
      Carried forward verbatim for the third direction running, because it gets more tempting each
      time rather than less, and the argument has not weakened: P0 is satisfied to +0.0000% by every
      value from 0.87 down, so the constraint cannot see the parameter and **choosing `a_shock` IS
      choosing the answer**, which would then be reported as a measurement of the world. The
      published mover-mix is reserved as a check on the OUTPUT; spending it as an input buys a number
      and destroys the only test of it we have. The interval carrying its own bound on the page is
      the honest form. It stays until an instrument separates "my own bill rose" from "someone else
