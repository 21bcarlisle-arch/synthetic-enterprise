focus:
- id: say-why-the-median-renewal-contributes-minus-3-91-a-month
  lane: B_commercial
  side: supplier
  what: 'Measure, without changing code, why the median renewing household''s term contribution is -GBP
    3.91 a month (85.8% of 324 households negative, b8c665948), when the book is positive on the same
    run. First say what each number counts: term_contribution_per_year in company/crm/renewal_advice_desk.py
    (the costs it nets, per year of the coming term, at the renewal price) against the book''s provisioned
    net margin (cd1f976c7 fixed that clock: every leg, whole window, provisioned bad debt). Split the
    324 households'' contribution, from /var/tmp/se-ret-margin/on_arm.json or a rerun of its reader, into
    revenue at the renewal price, wholesale and pass-through costs, cost to serve and expected bad debt.
    Print the table by renewal year and by fuel at real inputs. Name the term that makes it negative,
    and say whether the renewal price sits below the term_cost_floor that writer one (B12, now L1) computes
    at the same roll. Write the result as a SEAT_FINDING in docs/staging/ with its severity, and file
    a fix only for the term the evidence names. This item READS renewal_advice_desk.py and changes nothing
    in it. If /var/tmp/se-seat-executor still holds that file, it is C35''s landing (surgical_land pid
    847333), not this work: wait for that landing, then measure on its base.'
  why: Every per-customer renewal decision (C34, C35, the save offer, the retention guard) reads this
    one quantity. If most households read negative because of an allocation or a mispriced renewal rather
    than the world, every decision built on it advises nobody, for a reason that has nothing to do with
    the customer. Last stretch it was refused 49 times by a holder doing other work. DONE when a finding
    on origin names the term, with the table, and says whether the C34 concern's premise (our side negative)
    is the world's or ours.
