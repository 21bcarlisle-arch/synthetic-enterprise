thesis_read: >-
  For the first time in ten stretches the direction reached work, and the reason it did not register
  as such is worth more than the fact. `previous_focus_drawn.drawn` is empty for the tenth
  consecutive orientation — and yet focus item 1, the HadUK-Grid pull, was BUILT and LANDED at 12:09Z
  as 8016f7176, and focus item 3's subject, the tree standing behind origin, is repaired:
  `git rev-list --left-right --count HEAD...origin/main` reads 0 and 0 at 14:24Z against 0 and 10 at
  the last orientation. So my predecessor's open sub-question — how a focus item gets built without
  being drawn — now has a demonstrated answer rather than a candidate: the staging queue delivered it.
  `staging_rooms.work_queue()` ranks the weather ruling 2nd of 76 and an interactive seat worked it
  from there, while `delivery_lane`'s ledger, which is the only thing `drawn` reads, never saw it.
  The steer is not a no-op in effect; it is a no-op in the record, and those are different failures
  with different fixes. What is NOT fixed is the precedence: `next_item()` at 14:24Z still returns
  `fork-alarm-transition-state-keyed-on-behind-which-moves-every-cadence-2026-09-05`, one of five
  live continuations, so the `focus` loop beneath it is still unreachable — and I can now say
  something sharper than "the store never empties". One of those five,
  `register-low-water-three-implementations-one-mechanism`, describes work that LANDED this stretch
  in fc950dda6, cbfb12f1b and 029c21452. `live()` retires an entry that expires or is refuted and has
  no channel for one that was DONE, so a finished continuation preempts the seat's order forever.
  Against the thesis proper the stretch was the usual shape and I will not dress it up:
  `tools/product_machinery_split.py` at 14:23Z reads 3.33% over 50, 4.84% over 100, 2.33% over 200,
  3.30% over 400 — below the declared floor at every horizon, as it has been every time it has been
  run. Nineteen of 44 commits were substantive and the great majority were register rungs, alarm
  keys, banner rows and publish causes. The one genuine product movement is the weather pull, and it
  is unfinished in a way nothing is watching: `/home/rich/.cache/synthetic-enterprise/haduk_grid`
  holds 5.3 GB and 123 files, the committed receipt declares 124 MB and three, and
  `pull.log` stops at `[120/315]` at 12:27Z with no process alive — the monthly tier complete at 105
  files, the daily tier at 15 of 210, and nothing retrying. That is a tick-bound job that died with
  its tick, which this project has filed before. The stretch also produced its own best finding:
  `WORKER_FINDING_THE_GATE_EXHAUSTS_TMP_AND_THE_ENOSPC_IS_RECORDED_AS_TWELVE_TEST_REGRESSIONS`
  establishes that 12 of the 50 reds in `.publish_gate_state.json` were `/tmp` at 0 MB, pass green on
  re-run at the same HEAD, and are indistinguishable in the state file from real defects — so a tick
  drawn on that state repairs passing tests, which is a machine that manufactures its own machinery
  work. The instance was swept; the mechanism was not. Every figure above was read live between
  14:23Z and 14:26Z — `product_machinery_split` run, `next_item()` and `seat_continuation.live()`
  called, the cache walked with `find` and `du`, the receipt and `pull.log` opened, `git rev-list`
  run — and every one of them will be stale for whoever reads this. Re-run before relying on any.
