  - id: canon-w3-leaves-open-how-far-the
    raised: "2026-10-13"
    kind: canon_intent
    what: "Canon W3 leaves open how far the world's price responsiveness may correlate with signals a supplier holds (section 15, owed item 4). Published evidence puts the large correlations on whether a household LOOKS at prices: 2.8x for fixed against default, 3.4x for credit against traditional prepayment, 0.54x for 3+ years on the default tariff. The world already carries those. Nothing published sizes a correlation with how far a household MOVES once it looks."
    proposal: "Two changes, smallest first. (1) Selection at acquisition, with no new number: a prospect enters the market weighted by its own active-renewal probability, so the link between acquisition channel and later responsiveness emerges from draws the world already has. Recommended. (2) Optionally, couple the price-sensitivity segment to the engagement rank, run at both ends (independent and fully coupled) with the strength kept as a GAP, never a midpoint. Not recommended: a past-switching term, which the only trial puts at x0.94. Your decision 6 already settles the adjacent pricing question. Both are graded on fresh seeds with predictions filed first."
    status: open
    resolution: ""
    evidence: "docs/market_research/observable_correlates_of_price_responsiveness.md section C"
  - id: the-clv-discount-rate-and-terminal-value
    raised: "2026-10-13"
    kind: strategy
    what: "The CLV discount rate and terminal-value method (canon section 15, owed item 9). The code carries a flat 0.10, labelled a simplification. Published GB evidence: CMA 2016 retail WACC 9.3-11.5% (2007-14 data); CEPA for Ofgem 2022, 9.28-10.88% in normal conditions and 12.23-14.94% stressed; Ofgem's adopted cost of capital 12.3% from October 2023. Marketing science: a tenure-varying survival curve to a long horizon, since a hard cutoff and a flat rate to infinity each bias it."
    proposal: "Keep 0.10 as the normal-conditions anchor for 2016 to September 2023, since it sits inside the CMA and CEPA bands. From October 2023 use Ofgem's 12.3%, so the rate follows the record rather than one number for ten years. Report every published CLV at both ends of the band, 9.3% and 12.3%. Move the terminal value to the survival-curve form when CLV is next touched. It is a company parameter, so this changes no world value."
    status: open
    resolution: ""
    evidence: "docs/market_research/clv_discount_rate_and_terminal_value_for_a_gb_supplier.md"
