thesis_read: >-
  Three of the four previous focus items were drawn, worked and landed -- `13ecd0186` scoped the
  switching curve to its evidence, `703269e51` landed the widened world's three-arm reading,
  `7af34caa0` widened the discoverability scan from three axes to five -- and the fourth, EP1,
  was drawn and not repaired. Correcting the brief once more: it reports `drawn: [EP1]`, the one
  item that did NOT land, and is blind to the three kebab-slug items that did. So the loop my
  three predecessors left open is now closed: the instrument exists, it was pointed at the
  widened world, and it produced a reading with an error bar. Here is what it says, and it is the
  most important paragraph this project has written. On the widened S1 world the control (flat
  rules) nets GBP 113,282.62, the per-customer value arm GBP 120,648.84, and the level arm -- the
  same flat rule charging the value arm's own realised median of GBP 44.50/MWh -- GBP 120,823.40.
  The selection leg is therefore MINUS GBP 174.57 and the level explains 102.4% of the advantage.
  Against four seeds on the narrower world the selection leg has a standard deviation of GBP
  3,121.20 about a mean of MINUS GBP 165.83, so the point estimate is roughly a twentieth of the
  band it sits in: the per-customer advantage is not distinguishable from zero, and never has
  been. The mechanism is now visible and it is not flattering. The value arm's win is that it
  shed 433,602 kWh (5.4% of volume) whose gross margin per kWh ran below its own network and
  policy cost per kWh; 87.3% of the gross-margin difference sits on FIVE differentially-churned
  accounts, and 6 of its 25 priced decisions were set by the lawful price cap rather than by
  anything about the customer, on one account carrying 43% of the money that moved. The level arm
  gets the same money by charging everyone more and letting the same marginal volume go. Read
  against the director's thesis, the honest statement is: a BASELINE now exists, it is winning,
  and the advantage that does exist comes from a LEVEL move any supplier could make without
  knowing anything about a customer. That is not backwards -- it is the first real answer -- but
  the experiment cannot currently support a stronger claim in either direction, because it
  contains 25 renewal decisions across a decade on a book of 210 settled accounts, and because
  the artefact publishes two irreconcilable net margins for the same arm, GBP 39,962.17 apart.
  Every item below exists to make the next reading say something a reader can rely on.
