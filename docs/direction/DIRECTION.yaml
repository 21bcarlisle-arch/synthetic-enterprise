  - id: bill-shock-is-two-populations-and-the-measure-cannot-see-which
    what: >-
      **First. The knowledge is done; this is the measurement that was supposed to follow it, and a
      live public figure that is wrong by two orders of magnitude.**

      **Read `docs/market_research/what_bill_shock_is.md` first — it landed at `5994c17d4` and it
      already answers the definition question**, including the payment-method shares the director
      asked for (~74% direct debit, ~13% standard credit, ~13% prepayment) and the SLC 27B ±5%
      notification duty. **Do not re-establish it. Do not re-open the definition.** Then read
      `WORKER_FINDING_THE_WORLD_KNOWS_HOW_EACH_HOUSEHOLD_PAYS_AND_BILL_SHOCK_IS_THE_ONE_ORGAN_NOT_TOLD_2026-09-01.md`,
      which is the wiring statement, and
      `WORKER_FINDING_THE_LIVE_SITE_PUBLISHES_A_200_PERCENT_AVERAGE_BILL_SHOCK_2026-09-01.md`.

      **(a) Establish what the next publish actually corrects, by measuring it, before changing
      anything.** `BILL_SHOCK_BASELINE_FLOOR_GBP` is in HEAD at
      `company/billing/monthly_bill_assembly.py:487`, but the live run is `fb6e29e6d`, which
      predates it. The finding asserts *"the next publish corrects the live figure with no further
      change"*. **Confirm or refute that by running it — do not inherit it.** My own reading says
      it is at best partial: the floor removes divisions by a near-zero baseline, and it does not
      touch a **mean over a distribution whose worst month is 137× its median**. Print the monthly
      series post-floor beside the live one before deciding.

      **(b) Pass the payment channel into the shock measure and branch the definition on it.**
      `saas/bill_generator.generate_bill(...)` takes no channel;
      `simulation/household_segments.payment_channel_for_customer()` already feeds
      `arrears_engine`, `final_bill_outcome` and `sim_satisfaction`. This is a wiring, not a model.
      For a level-direct-debit household the quantity is a **material change in the amount
      collected**, with the balance beside it; for a full-payment household the quantity **is the
      bill**. Two measures, named separately, never averaged into one percentage.

      **(c) Prepayment is not standard credit, and must not be folded into it.** Our world has 0%
      prepayment against a published ~13%, because `PaymentChannel` has two members. Either add the
      third channel or **exclude prepayment from bill shock explicitly with the reason named on the
      surface**. Both are honest; the current fold is not, and it puts 13% of GB households into an
      experience they do not have precisely where affordability pressure is highest.

      **(d) Publish the population bound beside the figure, per the standing rule.** 2016-02 reads
      121% over **12 bills** and no floor drops any of them — that is thinness, not this defect, and
      it must not be repaired by a floor. A figure without the bound its sample size earns is worse
      than no figure.

      **Pre-register before the run**, because every part of this moves a published number, and keep
      the prediction beside the result whichever way it falls. **Do not do (b), (c) and the
      definition split in one commit** — three changes to one published figure is unattributable.
      **Do not implement item 3 of that finding's owed list** (making the DD amount a modelled
      quantity from estimated annual consumption): it is real, it is the director's own correction,
      and it is a separate build with its own knowledge work behind it.
    why: >-
      First because it is the only item here that is simultaneously the director's live instruction,
      a wrong figure on the public surface, and the clearest instance of the rule he had me put in
      CLAUDE.md this morning — *before measuring a thing, say what it is*. He said it twice from the
      console, on 08-11 and again on 10-58, and the second time corrected my mechanism and told me
      the cause split must follow the definition rather than the definition the split. The
      definition half is now done and sourced; leaving the measurement half undone is how a piece of
      knowledge work becomes another sourced anchor that reaches no code, which is the £55-versus-
      £150 shape verbatim. It also carries the sharpest thesis argument on the list: *a world that
      treats bill shock as one number cannot tell a badly-run supplier from an expensive one, and
      telling those apart is exactly what a per-customer belief should be for* — his words. And the
      live surface is not a rounding problem: **17,284.3% for 2022-04, 29 months above 200%,
      median 126%.** **Done means:** the post-floor series measured and printed against the live
      one, so what the next publish does and does not fix is stated rather than assumed; the payment
      channel reaching `generate_bill` and the two definitions measured separately, each landed on
      origin in its own commit; prepayment either modelled or explicitly excluded with the reason on
      the surface; the population bound published beside the figure; the pre-registration filed
      before each run with its outcome beside it; and **the live site no longer serving a
      four-figure percentage**. If it produces a document and the site still reads 17,284%, it has
      not been done.
  - id: the-native-svt-capture-died-and-its-pre-registration-is-unscored
    what: >-
      **Relaunch the capture so it survives, then grade the pre-registration that is already
      filed.** `WORKER_PREREGISTRATION_WHAT_A_NATIVE_SVT_CAPTURE_MUST_SHOW_2026-09-01.md`
      (`cb28ad34f`) holds five predictions filed at 10:43 UTC before any output was read. **The run
      behind them is dead.** `/tmp/svtcap/capture.log` last wrote at **10:47 UTC**, having reached
      only **2020-10** of a 2016–2025 sweep; no process matches `capture_departure_factors`; no
      sibling JSON was written; neither the `NO SVT RECORDER` nor the `RECORDED NOTHING` warning
      appears, so **P1 is not refuted — it is unmeasured**, and the difference matters because P1
      was the one the prereg said it was least sure of.

      **The cause is a class this project has already written down: a job launched from a bounded
      session dies with it.** Relaunch under `systemd-run --user --unit=<name>` so it outlives the
      launching tick, and use `tools/wait_for.py` with a named subject and a deadline — **never a
      hand-rolled `pgrep`**, which matches the agent process whose own prompt quotes the subject.

      **The binding blocker is genuinely discharged and does not need re-doing.** `run_phase2b.py`
      carries `_svt_decisions` at 1419, appends at 1656, returns it at 3244, all three verified in
      `HEAD` at `6db30a350` — read with `git show HEAD:`, not from the working tree. **Capture to a
      stem of its own** (`/tmp/svtcap/`, not `docs/reports/`): `emit_svt_sibling` refuses to leave a
      stale sibling beside a fresh renewal table, and writing to the live stem would put a fresh
      table next to the foreign 1,266-row artefact and make that refusal your problem.

      **Then grade all five predictions as filed, including the ones that go against you.** The
      prereg names in advance what must NOT happen when it is graded, and those constraints stand:
      **no constant is pasted into `simulation/departure_level_anchor.py`** on the strength of one
      capture however green — if the whole-book fit emits a block, *that it emits* is the result and
      adopting it is a separate decision with its own evidence; **no widened band and no clamp on
      2022**; **`population_anchor._churn_by_year` is not repaired by inserting a `sim_churn_rate`
      of 0.0**, which would publish a measured zero-churn crisis year — fail its five arithmetic
      consumers closed instead; and **if the account-denominator refusal fires on `twice`, the
      reader is not de-duplicated** — that would be a finding about the world (a departure is not
      terminal), not about the capture.

      **Also fix the false sentence the prereg filed and did not repair.**
      `tools/capture_departure_factors.py`'s module docstring still asserts `svt_decisions` is not
      among `run_phase2b`'s return keys. `6db30a350` falsified it. It is the sentence a reader
      consults before deciding whether re-capturing is worth ten minutes, so it is load-bearing.
    why: >-
      Second because it is the last step between the biggest fidelity gain this project has made and
      that gain being usable — and because a filed prediction sitting on top of a dead run is worse
      than no prediction, since the next reader will grade it against whatever is lying around. The
      thesis needs *a baseline to beat*, and there is still no whole-book anchor: every committed
      capture reproduces only under a market-blind hazard and the fit refuses them as stale, which
      is the correct answer and a blocking one. This is cheap in judgement and only expensive in
      wall-clock — the mechanism landed, the recorder landed, the prereg is written, and the single
      thing that went wrong was a process lifetime. It ranks below bill shock because nothing here
      is on a public surface and because the failure is recoverable by re-running, where a live
      four-figure percentage is being served to a reader right now. **Done means:** the capture
      relaunched under a unit that outlives its launcher and **run to completion**; all five
      predictions graded in writing beside the filed text, with any miss kept rather than revised;
      the whole-book fit either emitting a `YEAR_LEVEL_ANCHOR` block for the first time **or
      refusing with the cause named**; no constant adopted on this one capture; and the stale
      docstring corrected. If the run dies a second time, **that** is the finding and the class it
      belongs to is already open.
  - id: the-catch-all-class-ranks-first-because-it-is-a-catch-all
    what: >-
      **Do the first work the director's own new ranking asks for. His build landed — this is what
      it now says to do.** `adf4bed6e` and `bfc43b427` wired cumulative cost into
      `background/class_debt.py`, and `background/staging_rooms.work_queue()` reads
      `class_debt.drawable()` for the within-band order. `docs/design/CLASS_DEBT_AND_CLOSURE_2026-09-01.md`
      recorded five classes OPEN and one ACCEPTED. **Read it before anything; do not redo it.**

      **(a) Split `publish_gate_and_wedge`.** It stands at **55 instances against the director's own
      count of ~18**. Its patterns grew it by matching **mechanisms** rather than a family
      (`\btmpfs\b|\boom\b`, `surgical_land`), so it now holds two families with no shared repair —
      and it ranks first in the draw **partly because it is a catch-all**, which is the ranking
      being fooled by the thing it was built to rank. Establish the boundary by reading the
      instances, not by pattern. **Do not bulk-reclassify 55 archived documents on an unverified
      boundary** — that is a larger version of the defect being fixed. Split the patterns, state
      which instances each new class would claim, and move them only where the reading supports it.

      **(b) Close `figures_on_a_superseded_clock`, which that document calls the closest to
