  - id: ninety-nine-dispositioned-staging-docs-were-never-committed-out-of-the-root
    what: >-
      `git status` shows 102 tracked paths missing from the working tree; 99 are `docs/staging/*.md`
      and all 99 exist on disk under a `docs/staging/` subdirectory — they were archived and the move
