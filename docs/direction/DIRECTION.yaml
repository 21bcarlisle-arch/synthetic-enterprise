thesis_read: 'Backwards on what we can claim, and that is the most useful result of the stretch. 8 commits, 3 substantive.
  The classifier reads 0 supplier, 1 world, 7 other, because the stretch''s supplier work landed as grades and the classifier
  files grades as other. No level moved. The first full-book engine reading of a per-customer decision came back (86f1ef8f4):
  C34 at the renewal roll advised 11% of rows, P1-P3 refuted and P4 held. The grade then found why. The caller hands C34 (unit_rate
  - company_fwd) x EAC as ''margin'', and that is the all-in tariff rate less the wholesale forward. It still carries network,
  policy and operating costs. The advised rows were all above GBP 30 a month, and 0 of 495 at or below GBP 30 were advised,
  so C34 advised because the margin was inflated, not because it inferred anything. That means the director''s open C34 concern
  is still untested on the real book. Reading simulation/run_phase2b.py this orientation shows the same expression is the
  LIVE retention guard''s expected_margin (~L3542), the riding leg (~L3330), the C34 roll (~L3521) and the missed-retention
  log (~L4064). Meanwhile company.interfaces.renewal_offer.term_cost_floor (forward + capital + locked policy + locked network)
  is already computed at the same roll, through _price_match_inputs. So every retention decision the company has made in production
  weighed an overstated value at stake. That is the VAT shape again: one quantity, four implementations, all wrong the same
  way. Elsewhere: the save offer''s P1a was refuted on 9 decided rolls, P1b held, and the household carry was never exercised
  (bb93b4e8d). Its control is in surgical_land now (pid 3959362). The budget''s shared-shortfall ordering removed the pre-crisis
  Q4 excess on one seed (2c361b329), and a second seed is owed before either switch can default on. Leg (c)''s HH files were
  regenerated (6de3afb10), and its grading run (run_annual_report on 27cb8d183, pid 3677477) is 52 minutes in. The baseline
  comparison the thesis needs (EP17, flat against per-customer) still waits on the director''s seed listing. NONE of the previous
  focus was drawn under its own id. Items 1 and 3 were done anyway, under the live continuations they duplicated (read-the-c34-on-arm-r4-and-grade-p1-p4
  and the-budget-orders-energy-...), so that steer was redundant rather than ignored. That was the seat''s error, and it is
  corrected here: no focus row restates a queued continuation, and item 1 subsumes c34-renewal-margin-net-of-pass-through
  explicitly. C35, the one genuine ask, went undrawn behind the continuations. It stays in focus, now behind the margin fix,
  so it is not built on the wrong quantity.'
