thesis_read: >-
  THE NEXT INFERENCE STEP IS ABOUT TO BE GRADED AGAINST A WORLD THE KNOWLEDGE LAYER ALREADY SAYS IS
  OFF THE RECORD. This is the reading that matters most this stretch. B8 landed (4e17d1247, step 2 1d84fa8cb).
  The console seat graded it honestly: learning the slope per method was refuted (B3' at -37, SNR 0.5).
  Its decomposition then moved the loss to the LEVEL of the churn belief, and that level error is a
  pattern by YEAR. Believed minus true P(stay) is -0.21 in 2017 and -0.33 in 2018, then +0.24 (2019),
  +0.64 (2020), +0.29 (2021) and +0.44 to +0.51 (2024-25). The console seat's stated next step is to
  calibrate the belief's level to that truth. But the "truth" is the world's departure draw. docs/institutional/knowledge_map.md
  records that the switching artefact the world is captured against was REFUTED by its own publisher
  on 2026-09-07 in 8 of 10 years. DESNZ QEP 2.7.1 gives 20.2% for 2020, 3.1% for 2022, 9.0% for 2024
  and 10.4% for 2025. The map also records the world's departure gap at 3.15x and the level move as
  not made. Twenty-six days on, the correction is still unlanded, because it needs a coupled re-capture.
  The map also cautions that the 3.15x is over the renewal sub-population, for which nothing published
  exists. So I CANNOT YET SAY whether the year pattern is an inference failure or a fidelity one. If
  the company's belief is tuned to an over-churning world, that is precisely the advantage-from-the-wrong-source
  the thesis forbids, and it would read as a win. Settling that is the first focus item. It is a measurement
  of the world against the published record, decided blind to company results, so it does not compete
  with the console seat's work. ON THE OTHER FRONTS the stretch moved real levels. PB8 went L0->L1 and
  its money side went to L2 (1c34f6ef1, dd7bbce0f), so my dead-holder worry ended with the work landed.
  SP2_1 and D_money_boundary_reconciliation closed at L3. The debt-respite seam and the gsop wall-clock
  fix landed. THE STEER HALF-BIT. Two of four were drawn. PB8 landed. The one-payment-home change is
  in its own surgical_land (pid 121436, 27 min in at orientation). The company-ledger bill fix was never
  drawn: the console seat built it in parallel in /var/tmp/se-bill (6e9025e9b, unpromoted), so my item
  was a second claim on the same work. The prepayment-ruling item was never drawn. Both controls guarding
  that ruling are still red at HEAD, re-run at orientation: payment_method and three stock-term fields
  reach decide_margin undeclared. THE MACHINE GOT WORSE AGAIN. 23 of 38 commits carried nothing, so
  work-carrying commits fell to 39%. That trips the release condition I wrote last stretch on base-advance
  merges ("returns if work-carrying commits fall below half"). It is promoted to focus, re-asked by hand
  again, which the not_now row in wrong still covers. The launch register calls payment-history-pc-legs
  DIED. The log and C_61001_61002.STOPPED show the seat stopped it deliberately, superseded by the per-decision
  probe. It is not to be relaunched. Three worktrees hold unlanded commits. All are owned by live seats
  (2197437, 4180790) whose landings are in flight, so none is disposable and none is mine to land.
