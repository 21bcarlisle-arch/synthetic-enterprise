focus:
  - id: land-the-arms-code-and-rerun-the-comparison-on-todays-book
    what: >-
      The baseline-to-beat instrument, in one visit, in this order. (1) LAND FIRST, before running
      anything: `tools/generate_value_arms_data.py` and
      `site/test_the_baseline_comparison_reaches_the_reader.py` are modified and uncommitted since
      18:28Z yesterday, and `site/data/value_arms.json` on origin already carries the
      `market_reaction` block that the uncommitted `_market_reaction()` produces. Read the diff — it
      is good work, it probes the world's own `simulation.competitor_reference` at 2019-04-01,
      2022-04-01 and 2024-04-01 rather than typing a bound, and it fails closed — then land the pair
      as ONE commit through `python3 -m tools.surgical_land`, with the REUSE block from
      `tools/write_time_gate.py --explain`. The director flagged "17 newly failing tests at HEAD at
      03:30Z, mostly test_generate_value_arms_data"; `tests/tools/test_generate_value_arms_data.py`
      is 31 passed against the WORKING TREE copy, so establish whether the uncommitted hunk is that
      repair or is independent of it, and say which in the commit message. If any of it cannot be
      landed, revert exactly that part and the finding is which published sentence depends on code
      HEAD does not contain. (2) THEN re-run both legs to NEW paths in ONE session, never over the
      published artefacts: `python3 -m tools.run_value_cycle_ab --level-arm` for the three arms and
      the noise floor immediately after. Today's book is 90 campaign wins across ten cohorts and 172
      on the book; `value_cycle_ab_s1_three_arm.json` was measured at 2026-08-28T14:08:48Z on 210
      settled accounts and `value_cycle_ab_s1_noise_floor.json` at 2026-08-27T23:32:17Z. One clock,
      both legs, and the `staleness_caveat` and `clock_caveat` strings should have nothing left to
      say. (3) Grade the prediction BESIDE it, never over it, in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_SOURCED_COST_RERUN_MUST_SHOW_2026-08-28.md`; read
      no delta smaller than the new floor's own spread as an effect, and the old floor's £4,402 sd
      against a £504 mean is the reason to expect that bar to bind. (4) In the same edit put ONE more
      sentence on the render: that the published book is a 17.89% uniform sample of what the company
      won (`settlement_sample_rate` = 0.1789, 90 settled of 505 won), so a reader dividing by 172
      accounts is dividing by a sample and not by the business. Assert it the way that file already
      asserts its siblings — through `site/_live_harness.mjs`, against the rendered DOM, with a
      mutation that deletes the sentence and reds its own test while the unavailable-feed null rung
      stays green.
    why: >-
      This is first because it is the one published surface the director's own thesis condition
      names — a baseline to beat, or "it performed well" means nothing — and every number on it
      describes yesterday's company while its bound is generated by code in no commit. The landing
      half is not a chore bolted onto the front: it is the same class the last stretch just proved
      and closed on the run path, standing untouched here because that item's subject was one
      filename instead of the property. Landing it also makes the re-run worth doing, because a
      measurement published from an uncommitted generator cannot be cited by anyone who checks out
      main. Done means: the arms pair is in a commit or explicitly reverted with a stated reason;
      both artefacts carry one clock from today on today's book; the preregistration file holds the
      outcome beside the prediction with the correction, if there is one, written next to it rather
      than over it; and the fetched live page carries the sample sentence under a control that goes
      red if it stops. If the re-run cannot finish inside the tick, land part (1) and say so — a
      landed generator with a stale artefact is strictly better than the reverse, which is what is
      live right now.
  - id: what-does-each-published-account-count-actually-count
    what: >-
      `docs/reports/run_output_latest.json` holds `by_billing_account` with **13** entries and
      `enterprise_value_account_count` = **113**, in the same file, from the same run. The arms
      artefact's `book` block says 210 settled in window and 128 at the end. The growth page says
      172 on the book from 90 settled wins. The company plans against 587. That is five populations
      and no statement anywhere of what each one counts. It is load-bearing and not cosmetic:
      `WORKER_FINDING_R6_JOINS_ACQUISITION_SPEND_TO_COLLATERAL_AND_THE_COMPANY_IS_316K_FROM_THE_TRIGGER_2026-08-28.md`
      §4 reads `accounts` = 13 to form the Ofgem MCR claim of £1,690 against £337,305.65 of net
      assets, and £130 × 13 against £130 × 587 is a ~£76,000 swing in the capital the free-equity
      calculation is netted against. Do three things. Print the five counts side by side with the
      selection that produces each. Name which population the collateral desk is entitled to see and
      answer the epistemic-wall question of it out loud — it is a company-side figure, so the test is
      what a real supplier's own finance function would have in front of it, not what the sim knows.
      Then repair R6's basis to that population if it is the wrong one, and if it is the right one,
      say in the artefact why 13 is right so the next reader does not re-open it.
    why: >-
      "Before dividing two numbers, say out loud what each one counts" is this project's own rule and
      this is the largest live instance of breaking it — a published solvency claim denominated on a
      population nobody has defined, sitting under a headline that says the company is £316,009 from
      a collateral trigger. It is also the thing blocking the PB2 capitalisation question from
      reaching the director at all: I cannot put a free-equity figure to him while its two sides
      count different things. Done means one named population per figure, written where the figure is
      produced rather than in a note, the wall question answered in a sentence, and R6's MCR input
      either changed or explicitly defended.
  - id: land-the-founder-book-discharge-that-says-it-already-landed
    what: >-
      `docs/design/held/README.md` in the working tree has been rewritten to say "DISCHARGED
      2026-08-28 — Landed in HEAD", and the three `.held` artefacts it describes are deleted, and
      **none of it is committed**. Alongside it sit `docs/design/FOUNDER_BOOK.yaml` modified and
      `tests/simulation/test_founder_book.py` (+39), `test_live_population_seam.py` (+46) and
      `test_customer_events.py` (+55), all uncommitted since between 18:02Z and 20:35Z yesterday.
      `simulation/live_population.py` IS in HEAD, so the code landed and its record and its tests did
      not. Verify each of those three test files is green against the tree the commit would create,
      land the set as one commit by pathspec, and if any test does not belong to the landed code say
      which and hold exactly that file rather than the set.
    why: >-
      A claim written in the working tree that says the work is committed is self-refuting, and this
      one is worse than the usual shape: the code it describes really did land, so the missing half
      is the controls. Landed code whose tests are in no commit has no control at all from any other
      checkout, which is the same hole as an unwired control and harder to see because the tree is
      green. It is third rather than second because it is bounded and mechanical — thirty minutes,
      one pathspec — and neither of the two above it can be done in that time, so this is the item
      that fits when a tick finishes early rather than the one worth spending a whole tick on.
  - id: attribute-the-net-fall-and-remeasure-the-headroom-on-todays-book
    what: >-
      Two measurements on the post-allocation run. (1) Attribute the £10,378 fall in published net
      (£164,542 → £154,164) across the same commits that raised campaign spend £46,408 → £60,839.
      Write the prediction down before running it: the spend rise alone accounts for most of it, and
      whatever it does not account for is either the 45 new accounts' cost to serve or something
      nobody has named. Run the one-variable version — more than one thing moved, so an unattributed
      difference is not a result. (2) Re-measure R6's headroom rather than projecting it: the
      £316,008.84 and the £19,606.81 peak net exposure were taken on the pre-change book. Report free
      equity, peak net exposure and the distance to the first collateral demand on today's run, and
      say plainly if the mechanism still does not fire. "The distance IS the answer" is a result and
      nothing may be tuned to make it fire.
    why: >-
      The director's sentence was *"acquisition spend cannot weaken a balance sheet through a book
      nothing reaches"* — the ceiling was the obstacle, not the point. The book now reaches, and in
      the first run afterwards the company earned £10,378 less while spending £14,431 more to grow.
      That is either the growth loop working exactly as the thesis says, or a cost the machine
      imposed, and nobody has separated them. It sits last only because item two decides what its
      account denominator means, and a free-equity figure I would have to withdraw is worse than no
      figure. Done means an attribution that either closes or explicitly refuses to close, and a
      headroom figure measured on this morning's book printed beside the £316,009 it replaces.
not_now:
  - what: >-
      Running the three-point ceiling probe at budgets 1200/2000/2800 and resizing
      `SETTLEMENT_CUSTOMER_YEAR_BUDGET` from its slope. Off the board for the second direction
      running, and now on a second independent ground.
    why: >-
      Its first premise was refuted by the work it commissioned — the defect was the first-come
      allocation rule, not the budget's size. Its second premise has now also gone: the publish
      interval it was supposed to be sized against needed a non-circular basis, and `703e4dbb7`
      found one by reaching Elexon's own timetable through ofgem.gov.uk. RF is 14 months, not the
      28 the code carried, so `REPORT_END` (2025-06-07) reached Final Reconciliation on 2026-08-07
      and no new settlement data can revise any published figure. The external constraint the probe
      was going to be justified by does not exist. The remaining case for it is that 17.89% of what
      the company wins is all the machine can settle — a real limit, now published as a uniform
      sample rather than as a censoring rule. That becomes worth forty minutes of a contended box
      when the sample rate is what a reader objects to, and the page does not carry the sentence yet.
      It is focus item one, part four.
  - what: >-
      The affordability xfail decision in
      `WORKER_FINDING_TWO_RED_CONTROLS_THAT_PREDATE_TODAY_AND_ONE_IS_A_STALE_XFAIL_2026-08-29.md`:
      `test_live_run_output_shows_crisis_step_up_headline` is marked strict-xfail until W2_4 builds
      affordability physics, and it passes, so a control designed to stay red until a mechanism
      exists is green while the mechanism does not exist.
    why: >-
      The question underneath it is genuinely good — what produces a ×1.28 crisis step-up in a model
      that is not supposed to be able to produce one — and it is exactly the kind of thing this seat
      should want answered. It loses for two reasons. The repair to the control's own arming defect
      landed in the working tree at 10:54Z, thirty minutes before this orientation, so a lane is on
      it right now and a second writer would collide. And the substantive half belongs to W2_4 with
      the affordability evidence in front of it, not to a lane-0 slot; the finding says so itself and
      is right. What I am NOT deferring is the finding's own correction — that the marker's three
      different answers all came from `run_output_latest.json`, a tracked file every run rewrites in
      place, read as if it were a fact. That is the trap `64eaa102f` had paid for two commits
      earlier, walked into from the other side within the hour, and it is in `wrong` below because it
      is a pattern and not an incident.
  - what: >-
      Re-running the B10 ladder chase pair, PB4 and PB5, on the new ten-cohort book, and item 2 of
      the chase-population finding (`run_price_ladder` retaining every rung's settlement records,
      which forces sequential arms and an ~11 GB peak).
    why: >-
      The ladder builds its own founder book and asks a between-arm question at a fixed rung, so its
      result is a measurement of the join and not of the campaign book — that was this week's
      finding, and the join is now repaired with per-rung populations printed at the source.
      Re-running it would spend forty minutes of sequential arms to reproduce a result whose
      insensitivity to the book is the established fact. The retention fix is a speed repair for an
      instrument nothing is currently blocked on; it earns a slot the moment a lane needs a chase
      pair inside one tick. The arms artefacts are the exception and they are focus item one, because
      those ARE denominated on the campaign book and they are on the live page.
  - what: >-
      The ten repeating-alarm findings in the staging root, and H45, the systematic
      knowledge-to-discovery-to-atom chain.
    why: >-
      The repeating alarms move no level and close no finding, and the staging root is a work queue
      by design, so files sitting in it is the mechanism working rather than a backlog. H45 keeps
      losing to its own instances and this stretch produced two more good ones than an argument for
      the general form: the growth page's refusal was found naming a cause its generator cannot
      observe, and the arms generator was found publishing from no commit — both by looking at one
      artefact and asking where its words came from. Build the chain after its instances.
  - what: >-
      Writing five focus items, or writing three and calling the shortening a fix.
    why: >-
      Lane 0 was drawn once in three hours and the direction is rewritten every three hours, so the
      list length was never the variable — anything below position one is standby, not sequence. I
      have written four anyway, and the reason is deliberate rather than hopeful: item three is
