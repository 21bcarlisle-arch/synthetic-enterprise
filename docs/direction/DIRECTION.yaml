      working tree. But the suite is not green, and it is not deterministically red either, which is
      the actual finding: a full-file run under the default random ordering failed
      `TestRepair::test_repair_restores_a_corrupted_rendering_and_reports_convergence` (1 failed, 8
      passed, 302s), and that exact test run ALONE with `-p no:randomly` PASSES in 33s. So one of
      the publisher's five blocking tests is ORDER-DEPENDENT — it shares state across the
      `head_checkout` / `head_checkout_running_tree_code` fixtures — and an intermittently red gate
      is why this wedge keeps getting rediagnosed and keeps coming back. Resolve that before you
      declare the road open: run the whole file the way the gate runs it, find what the earlier test
      leaves behind in the shared checkout, and either isolate the fixture per test or make the
      repair converge from a dirtied baseline. A single green test is NOT evidence the gate will
      pass, and committing on that basis is how the last three wedges were "fixed". Budget for it:
      a deterministic full-file run of this one test file exceeded 400 seconds in my hands and was
      killed, so run it in the background behind `python3 -m tools.wait_for --pid` rather than in a
      foreground call that dies at the ceiling with nothing landed. Then land the payload.
      `git diff --cached --name-status` shows it:
      `background/blocked_atom_visibility.py` (+95), `background/process_run_complete.py` (+45),
      `docs/design/BLOCKED_ATOM_VISIBILITY.md`, `tests/background/test_blocked_atom_visibility.py`
