- id: b11-slice-11-the-switch-hazard-keyed-on-months-on-default
  lane: B_commercial
  side: supplier
  what: 'Lane 0 work on the PARKED atom B11. Do not unpark it or touch its map row. File the predictions
    first, in docs/staging/records/. In company/analytics/forward_clv.py, two steps, one variable at a
    time, on the same book slice 10 used (docs/reports/run_output_latest.json read through tools/run_output_store).
    Step one: fix slice 10''s P2 level drift by freezing each account''s months-on-default band at the
    cut. Grade that change ALONE first by printing mean per-customer p minus flat p at cuts 2020, 2022
    and 2023. Step two: key the SWITCH hazard (moves censored, using the existing _fit_hazards censoring)
    on months on default alone. Use the 0.54 prior with its published range, shrunk by the existing n/(n+k)
    weight. Grade it on switchers at the three cuts, paired against flat AND against the contract-year
    rule, each with the existing DeLong 95% interval. Label every result DEVELOPMENT.'
  why: 'This is the one supplier-held observable that ranks, and slice 10''s addendum shows it ranked
    through the wrong quantity: on switches alone it reads 0.68 and 0.50 against the published 0.54. Inference
    is the thesis, and this is the cheapest test of whether a key a real supplier holds tells its leavers
    apart. DONE: the fix and the switch key are on origin, each with a control that a named mutation turns
    red, and each prediction is graded beside its result, wrong ones kept. The finding says one of three
    things on switchers (ranks better, cannot tell, ranks worse) and whether the key goes into EP17''s
    arm by the rule the prereg writes down. EP17''s fresh-seed verdict stays reserved to the director''s
    open row.'
  written_at: 1792214838.169
- id: the-worlds-switching-gradient-by-payment-and-tariff
  lane: W2_customer_generator
  side: world
  unblocks: B11 and EP17's per-customer key on payment method and tariff type. Until this is read, a "cannot
    tell" on those keys cannot be told apart from a world that never produced the gradient.
  what: 'A measurement only. Change no world value before the 19 Oct publish. File predictions first in
    docs/staging/records/. Harness-side, with truth used as an instrument, read the same run slice 10
    graded (run_output_latest, run at 78f77c34e). Report the world''s own switch-away rate by payment
    method (prepayment, direct debit, standard credit) and by tariff, with fixed split into a customer''s
    first term and a fixed chosen at renewal. Report the active-renewal probability each group carries
    in the world''s draw, and compare both with docs/market_research/observable_correlates_of_price_responsiveness.md.
    Say where the published gradient is lost: (a) the draw never assigns it, (b) the engagement axis does
    not reach switch timing, or (c) the observable selects a different population here (first-term fixed).
    Give counts and bounds for each.'
  why: 'Slice 10 found prepayment switching at about DD''s rate (0.98 and 1.16, against the published
    0.55) and fixed below one on both causes. The research note says the world carries these correlates,
    and the departures do not show them. If the world cannot produce what the record says real customers
    carry, per-customer targeting is graded in a world rigged against it, and the "cannot tell" means
    nothing. DONE: a finding in docs/staging/ that names (a), (b) or (c) for each gradient with its evidence.
    Any world change it implies is filed with a pre-registration for after the publish and not built.'
  written_at: 1792214838.169
