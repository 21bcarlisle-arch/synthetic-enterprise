thesis_read: 'The supplier''s per-customer view now ranks leavers better than chance, and it does so in the run. That is the
  thesis''s inference, measured for the first time. It has not yet turned into money against flat. 21 commits, 19 carrying
  work, 7 substantive. The brief''s split (1 supplier, 1 both, 19 other) is by file. Twelve of the ''other'' are grades and
  censuses filed as staging records: five supplier, seven world. All four items in the last focus were drawn and landed (7a7ad95dc,
  e885e30ff, c95f28d8a, 983ff2e22), and so were their continuations. No level moved. WHAT IT MEANS. (1) The renewal churn
  belief, conditioned on the term now ending (7a7ad95dc, default off), ranks leavers at AUC 0.819 [0.757, 0.877] out of sample
  from 2019, where the current belief reads 0.333. It uses only a field the company already held. In the run (f16695c2a) the
  aim carries through: in-run AUC 0.819, and default-term states lower on 216 of 222. But the design had no prior, so two
  closed 2016 fix-ends set a multiplier of 3.39 for 2017. Offers rose from 113 to 134 and cost rose by GBP 544. The +GBP 1,125
  against flat is five households trading places on one seed, so it is not attributable. e856ddc69 shrinks the multiplier
  by a width the record gives (Ofgem EFTC against CMOC, prior variance 0.28 in log space), and section 12''s rerun is live
  and claimed. So the inference is real. Whether it creates value still needs seeds, and the EP17 seed listing is the director''s
  open row. (2) The F11 check came out in our favour. Blind to company results, 983ff2e22 puts the world''s default-tariff
  drift (0.107 a year realised) and its no-roll-at-anniversary rule inside both published bands. So the roll-type gain is
  not the world flattering the company. (3) Retention netting does nothing to debtors (df9792c57: 6 offers withdrawn, none
  from a debtor, +GBP 29). It surfaced one real company defect: default_belief goes negative on thin cells. That is focus
  item 2. (4) Billing: the catch-up premise was wrong. The fields were already on the published row (e885e30ff). 371 catch-ups
  reach back more than 12 months and 168 of them are undercharges. None breaches SLC 21BA: the pay-on-bill ones are capped
  or predate May 2018, and the direct-debit ones are barred at the recovery action. D48 held 9 bills, none for more than three
  months. D48 L3 now waits only on the world''s smart-meter exchange flip, and its four-arm trigger is met with df9792c57.
  (5) The BLOCKING crisis bad-debt finding narrowed to one world rule. Indebted leavers are not selection: their fall is the
  switching freeze, sized like the record (c95f28d8a). Arrears sit about two bills deep, x4-6 short of Ofgem''s series, because
  ENERGY_SHARES_THE_SHORTFALL shares money pro rata with the debt stock. That fixes depth at C/(A-B), a median of 1.67 bills
  (3e52f2baf, predicted 1-3). The stock-versus-demand one-variable pair is running, claimed as W2_shortfall_shared_on_demand,
  so it is not in focus: a second claim would be a second writer. The publisher has been FAILING for 62h and is held to 26
  Oct. Nothing went backwards. The money comparison against flat stands where it stood: tied on one seed, waiting on seeds.'
