  - id: the-bill-shock-split-has-one-implementation-and-it-is-in-the-wrong-layer
    what: >-
      **Dissolve the duplicate. And correct the finding first, because it describes code that never
      landed.**

      `docs/staging/FINDING_THE_BILL_SHOCK_SPLIT_HAS_ONE_IMPLEMENTATION_AND_IT_IS_IN_THE_WRONG_LAYER_2026-09-02.md`
      says *"`saas/reporting/annual_report.py` now imports all three, lazily"*. **It does not.** The
      wall refused that import — `tools/generate_dashboard_data.py` reaches
      `simulation.live_population` and `simulation.household_segments`, so a lazy import put
      `saas -> simulation.*` back on the graph and `tools.wall_crossing_dispositions` refused the
      commit. What landed instead is a **second copy, knowingly**:
      `saas/reporting/annual_report.py:1481` (`SHOCK_DEFINITION_POPULATION`), `:1612` (`_shock_stats`),
      `:1646` (`_annual_shock_by_population`, whose own docstring says *"A SECOND COPY … knowingly"*),
      plus the bootstrap parameters at `:1574`. **A worker who reads the finding will go looking for a
      lazy import, not find it, and conclude the finding is stale. Fix the finding's "What is wrong"
      section against the code as it actually is, then do the repair.**

      The repair the finding names is still the right one and the wall refusal is the argument *for*
      it, not against: move `_annual_shock_by_population`, `_shock_stats`, `_bootstrap_mean_interval`,
      `SHOCK_DEFINITION_POPULATION` and `UNMEASURABLE_SHOCK_POPULATION` into `saas/` beside
      `BILL_SHOCK_POPULATION_BY_PAYMENT_CHANNEL` and `UNKNOWN_BILL_SHOCK_POPULATION`, which are
      already in `saas/bill_generator.py` — a new `saas/bill_shock_populations.py` or into
      `bill_generator.py` itself. **Both** `tools/generate_dashboard_data.py` and
      `saas/reporting/annual_report.py` then import from there. `tools/` may import `saas/`; `saas/`
      importing `saas/` crosses nothing. The duplication dissolves **and** the wall is satisfied,
      which is not true of any other arrangement.

      `test_the_defined_population_matches_the_dashboards_own_constant` holds the coupling until then
      — **run it before and after and confirm it still discriminates**, because a control over one
      copy is not a control over two.

      **Pathspec:** `saas/`, `tools/generate_dashboard_data.py`, `tests/saas/`, `tests/tools/`, and
      the finding document. **This one needs the dashboard generator in the pathspec — that absence is
      the entire reason it was not fixed in `e264e0305`.**
    why: >-
      **Fourth and it is genuinely fourth, not parked.** It is LATENT — verified: no published figure
      is wrong as a result, the two copies agree today, and a coupling control reds if they diverge.
      So it loses to a fidelity precondition, to the only item that creates, and to an index hazard
      that is doubling. But it is **this project's most expensive recurring shape with a name and a
      price already attached**: one legal requirement, five implementations, a defect fixed in one in
      July and still live in another in August. One published quantity — *what counts as a bill shock,
      and for whom* — now has two implementations across two layers, with the derived half sitting
      **above** the raw half in a publishing tool the business layer is forbidden to reach. The seat
      that created it named it in the same hour and said exactly why, which is the machine behaving
      well; leaving it a second stretch is how *knowingly duplicated* becomes *nobody remembers*.
      It is also small and completely specified. **Done means:** one implementation, in `saas/`,
      beside the constants it derives from; both readers importing it; the lazy-import comment
      deleted with the lazy imports; the coupling control either retired with its reason stated or
      re-keyed to something it can still discriminate; the finding's "What is wrong" section corrected
      to describe the code that actually landed, and then archived; and the wall re-checked, not
      assumed — *"it reads artefacts and opens no socket"* is not a wall check.
