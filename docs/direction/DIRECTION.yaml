- id: the-clv-discount-rate-and-terminal-value
  raised: '2026-10-13'
  kind: strategy
  what: 'The CLV discount rate and terminal-value method (canon section 15, owed item 9). The code carries a flat 0.10, labelled
    a simplification. Published GB evidence: CMA 2016 retail WACC 9.3-11.5% (2007-14 data); CEPA for Ofgem 2022, 9.28-10.88%
    in normal conditions and 12.23-14.94% stressed; Ofgem''s adopted cost of capital 12.3% from October 2023. Marketing science:
    a tenure-varying survival curve to a long horizon, since a hard cutoff and a flat rate to infinity each bias it.'
  proposal: Keep 0.10 as the normal-conditions anchor for 2016 to September 2023, since it sits inside the CMA and CEPA bands.
    From October 2023 use Ofgem's 12.3%, so the rate follows the record rather than one number for ten years. Report every
    published CLV at both ends of the band, 9.3% and 12.3%. Move the terminal value to the survival-curve form when CLV is
    next touched. It is a company parameter, so this changes no world value.
  status: open
  resolution: ''
  evidence: docs/market_research/clv_discount_rate_and_terminal_value_for_a_gb_supplier.md
  recommendation: 'I recommend the dated rate: 0.10 to September 2023, Ofgem''s 12.3% from October 2023, every published CLV
    at both ends (9.3% and 12.3%), and the survival-curve terminal value when CLV is next touched. Evidence: CMA 2016 9.3-11.5%,
    CEPA 2022 9.28-10.88% normal and 12.23-14.94% stressed, Ofgem 12.3% from October 2023. Trade-off: CLVs either side of
    October 2023 stop being directly comparable, and the published CLV figures double; a flat 0.10 is simpler but sits about
    two points under the post-2023 cost of capital. Holding position: flat 0.10, labelled a simplification. Would change it:
    an Ofgem revision of the allowance, or evidence that a challenger''s own cost of capital sits outside the band.'
