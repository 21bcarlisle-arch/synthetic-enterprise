    (pid 2793485) is grading the 7c34f48a64 marker docs/staging/run_complete_20261102T104522Z.md now,
    and that run predates both fixes. If it is refused only on rows those two commits fix, move its marker
    to docs/staging/done/ as superseded, naming the rows, so it stops holding the publisher''s slot. (2)
    When the 65bbdc6787 book is graded, quote the publisher''s refusal string or publish commit from its
    log before naming any cause. If it publishes, name the commit and check that the live site/data generated
    stamp reads 2 Nov or later. (3) If any row breaches, trace each breach to its accounts and its cause.
    Fix what can be fixed today, with a test that reds on the old code. A breach that is traced, confined
    to named accounts and moves no published figure materially may be recorded as a named, dated exception
    under docs/staging/advisor/DIRECTOR_RULING_CORRECTNESS_BEFORE_THE_NEXT_FEATURE_2026-10-26.md''s rule,
    with its accounts, its cause, why it moves no figure, and the commit that will retire it. Never except
    an untraced breach. Then start the next run at once. (4) Move the chase to docs/staging/advisor/done/
    with a ## Done section, in the commit that does the work. It says what was done and either when the
    site became current or, if it cannot be today, the earliest realistic time.'
