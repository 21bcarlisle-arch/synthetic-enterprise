thesis_read: 'The split was 0 supplier, 1 world and 18 other, but the ''other'' hides where the substance went. Supplier: B12''s hypothesis 1
  was pre-registered, run on two arms and refuted (836ec06fa). Reading fixed terms only removes the default book''s excess, as predicted. But
  it overshoots: fixed terms read -2.39% against a 1.86% target, and 2023-24 sit at -34% to -38% because the lookback learns from the 2021-22
  crisis strikes and pins the premium at +15%. So the code did not land, and B12 is still one of the two conditions EP17 waits on. The write-off
  run graded predictions 1 and 2 (136e0eda3): write-offs move the IFRS 9 charge by GBP 47.37 over the decade, exactly the 12.2% of each that was
  not provided for. Its share prediction went vacuous a second time, because the grader read an empty block. World: a storage home now charges
  off-peak (025ca62ae), and three W1_29 texture readings landed. The world again got more change than the supplier. Against the thesis this stretch
  is learning, not progress. No level moved, there is still no evidence that a per-customer view beats the flat baseline, and B11''s comparison
  is still held behind EP17''s two open blockers (B12, E6). It did not go backwards. The refutation was filed against a prediction locked before
  the arms ran, which is the method working. The previous focus was named and drawn, two of two. B12''s DONE is met by the refutation record,
  so it leaves focus and its successor arm takes the place. The held-estimate grade is not met: its one-variable run (pid 605426) had reached
  2024-06 at 11:2xZ, inside its declared 120 minutes. The machine had one event that outranks the rest. The guest''s user session shut down at
  08:29:34Z (journal: shutdown.target) and came back at 08:53Z. That killed the 08:20 orientation nine minutes in, so its record never reached
  origin and the stretch log stopped at 05:47Z, which is what the director''s steer saw. It also killed every in-flight landing chain: the parked-atom
  fix 7bfd6fea3 now exists only on a local salvage tag. Meanwhile the shared checkout is 109 behind origin, so every daemon still runs without
  the hold, tombstone and overlap fixes that are on origin. Its one local commit bb5276856 is a byte-identical second landing of 068928f47 (git
  diff on its two paths is empty), which is the land-twice class recurring. The director''s 05:52Z order puts these machine classes first this
  week. Closing the fork is cheapest and makes four landed fixes live at once, so it leads. Two supplier items follow, as SUPPLIER FIRST requires.
  388 failed sudo calls in delivery-seat''s journal since 10-09 were read and are the brief''s own probes. They did not cause the shutdown and
  are not a finding.'
