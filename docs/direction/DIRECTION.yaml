focus:
- id: the-value-arm-loses-money-on-the-better-belief
  what: 'Read why the value arm with A''s belief loses GBP 1.21 per household-year where the flat book
    with the same belief gains GBP 0.14, using only the pair already on disk: /var/tmp/vta-out-flag0/member_11111_22222.json
    and control_11111_22222.json, and the flag-on pair in /var/tmp/vta-out-flag1/ as step 6 writes it.
    Launch nothing long. Step 6 holds the box for about 53h and peaks near 11.5 GB. FIRST file a new section
    12 of docs/design/THE_VALUE_TEST_REDESIGN.md that pre-registers, before any read, a predicted share
    of the loss for each of the three candidates section 10 names. (a) Retention offers move to households
    the value arm''s pricing already kept. (b) Offers it used to make by accident to leavers worth keeping
    are lost. (c) The dice. THEN, for the 101 households that moved, write each one''s decision difference
    (offer or price, by date) and its money difference. Attribute the GBP 1.21 across (a), (b), (c) and
    a residual named "unexplained", and grade the prediction with a Graded value-test trailer.'
  why: It is the thesis question in its sharpest form. Inference improved (ranking 0.361 to 0.819), and
    the per-customer supplier lost money with it, so either a lever spends good inference badly or the
    value arm's objective is wrong. Step 6 sizes that loss and does not explain it, and the renewal retrain
    (B) would stack on top of whatever it is. Done means section 12 is on origin with its prediction filed
    before the read, the 101-household attribution, the grade trailer, and one named next change (a lever,
    the objective, or "we cannot tell, the dice") that step 6's read can confirm or refute.
  lane: B_commercial
  side: supplier
  written_at: 1794896709.83
- id: d5-switch-on-lands-and-a-book-publishes
  what: D5's switch-on is in its gate now (d5-land9 step C2, surgical_land pid 240018, log /var/tmp/d5land9/land.log,
    which turns FINAL_BILL_ASKS_THE_LEVEL_DEBIT on in background/live_payment_triad.py). Do not relaunch
    it while the unit lives. If C2 is refused, read the refusal and relaunch C2 alone exactly once, with
    no other surgical_land running. Once C2 and C3 are on origin, let continuation d5-land9-verify-next-book-row
    check background/next_book_requires.yaml. Then read sim-runner's next book against the publish gate.
    Grade rows 4 and 7 against docs/staging/SEAT_FINDING_D5_SWITCH_ON_PRE_REGISTRATION_ROWS_4_AND_7_2026-11-17.md.
    For each other refused row (the 16 Nov refusal named 2, 5 and 1), name its cause and owner in the
    BLOCKING VAT finding or a new one.
  why: Billing accuracy is first in the director's order. Every published-book check (the cold read, the
    Capabilities strip on f4f825b8b, the final_month_nets grade, then W3_3) waits on a book newer than
    9 Nov. Done means the switch-on is on origin with its control, rows 4 and 7 are graded on a D5-on
    book, and either a verified publish carries that book or every row still refusing it is named with
    its cause and an owner.
  lane: D_billing_metering
  side: supplier
  written_at: 1794896709.83
- id: the-paused-banner-commits-only-on-a-change
  what: background/process_run_complete.py, together with background/publish_freshness.py, commits the
    verification-paused banner in site/data/publish_provenance.json about once an hour while verification
    is paused. 0ad9d831a this stretch, like 3127e048b, d67d02a4b and 67ba0b694 before it, differs only
    in written_at. Make the banner commit only when a field other than written_at changes. Add a control
    showing that re-pausing in an identical state makes no commit and that a changed state still does,
    and mutate it both ways.
  why: Every step of d5-land9 lost its first race to an origin move ("attempt 1/3 lost the race" on GH,
    C1 and C2), and each lost race costs about 36 minutes of re-gating. A banner that carries no change
    is the one origin move we can remove for nothing. Done means the control is on origin, and the next
    stretch's commit list has no banner commit whose only change is written_at.
  lane: H_harness
  side: other
  written_at: 1794896709.83
