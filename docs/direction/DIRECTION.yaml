thesis_read: 'This stretch moved the thesis forward on evidence for the first time in days, but it has not yet been
  earned. The first held-back grade of forward customer value on six fresh books is on disk, unread against its
  pre-registration (/var/tmp/b11m7/readout.json, 02:50Z). Within segment, the corrected key ranks better at the
  2020 cut (+0.035, 0.010 to 0.059) and the 2023 cut (+0.057, 0.023 to 0.091), and cannot tell at the 2022 cut (+0.002,
  -0.035 to +0.040). That is the first out-of-sample sign that the supplier''s per-customer view knows something
  a segment average does not, which is the INFERENCE the thesis asks for. It is not yet an advantage over the baseline:
  the belief is default off, no policy carries it, and every retention gate on A''s belief (0.12 cut, 0.30, rank-at-q)
  has lost to the flat-rules twin, which the director''s open row holds. A ranking that beats the segment and a
  decision that beats the twin are different claims. Until focus 1 grades the first claim under SEAT_PREREG_B11_M7_HELD_BACK_GRADE_ON_SIX_FRESH_BOOKS_2026-11-14.md,
  I will not say it holds.


  Billing accuracy: the previous focus was all drawn and all finished, so all three items leave. The EPG gap was
  two held bills of one won switch (b14889688), and the rerun through the fixed close shows a gap of 0.00. The estimate-against-meter
  gate reads 7 of 4,250 on f2c6979d01, inside its 8 (e23ecbaa2). The C5 VAT alarm closed, with both bills right
  and the comparison wrong (f5ece3ac2, 465b4d5ec). But the site still shows 18 Nov. No book carrying b14889688 exists:
  sim-runner has deferred it since 03:11Z because A4 and land11 hold 18,000 MB declared. next_book_requires.yaml
  lapsed on 24 Nov, so that file no longer holds it. A book is owed until it PUBLISHES, so that is focus 2.


  The commit split reads 1 supplier and 11 other. By content, b14889688 and f5ece3ac2 are supplier billing fixes
  and dd6901041 is a test fix that cleared origin''s own red. Two commits are Item 5 CfD primary-text reads (world,
  ordinary draw). Three are merges that carry no work (the race row), and the rest are records. No world code was
  built, and the gas-AQ world landing is in flight. The machine''s errors this stretch are two known classes recurring:
  a promotion lost its race, and a landing was relaunched onto the same refusal. Both are carried rather than re-filed.'
