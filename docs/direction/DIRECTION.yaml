version: 1
oriented_at: "2026-09-28T17:21:48.049122+00:00"
thesis_read: >-
  All three steers from last stretch were drawn, and each landed once: 875322e5a (what
  PROS-2016-0098's £4,218 is), 8924da6ec (run (c) graded) and 27aba4242 (sanity-daemon's silence
  has a cause on file). No hand merge was needed. faf691609 refiled the write-off chain under
  D_billing_metering. Against the thesis, this stretch went BACKWARDS in what we can claim, and
  that is the honest result. The only signal separating the per-customer arm from the flat-rules
  baseline is one household (1.01 effective accounts). 875322e5a shows that household leaves in
  every run, and what changes is WHEN. The level arm's elasticity re-draw moves its first-renewal
  p_retain from 0.63 to 0.27. In seed 11111 that drives it out in 2017, before it runs up the
  £5,660 write-off it books by 2020. The value arm's net on that account is identical in both
  seeds. So the whole selection figure is the flat arm's luck on one coin, and the per-customer arm
  has shown no skill in it at all. The C1 bracket then showed that C1 cannot move the sign (the
  state distance moved £0.05 across a £11,300 level bracket). That settles a nuisance parameter,
  not the question. The thesis's central question, whether the per-customer view beats flat rules
  by INFERENCE, has no evidence either way. It has never been asked in a form that could answer
  it: nothing yet counts the accounts where the two arms DECIDE differently, and the value arm's
  sd of £129 against the level arm's £2,310 is consistent with both "it decides robustly" and "it
  decides nothing the flat arm does not". Every run graded so far was also at fcba478b7. That
  predates 254b4c1e4 and e83d571c3 (scale-held bills now issue) and the held-bill, credit-bill and
  credit-netting fixes to the arrears engine. The account's write-off is known to move at HEAD, and
  875322e5a filed the prediction that it grows. So focus goes to the inference question first and
  a HEAD re-measure second. One level moved, SP2_2 from 0 to 1. The steer did not drift. The
  machine did: 3 of 10 commits were heartbeat-only, and my carried attribution of that is still
  ungraded, which is why it is item three.
