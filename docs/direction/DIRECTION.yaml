thesis_read: >-
  THE INFERENCE WORK NOW HAS A CLEAN READING, AND THE QUESTION OF WHETHER ITS "TRUTH" IS FAITHFUL IS
  STILL OPEN. The console seat's probe now records the company's believed P(stay) beside the world's
  at every offer (ac465ac38). Its new pre-registration (c822e470e) splits the belief's error in two.
  The LEVEL error is by regime: too pessimistic before the cap, and from 2019 near 0.9+ while the world
  keeps 0.2-0.7. The SLOPE is about 1.7x too steep. Its argument that the slope, not the level, holds
  the price down is sound: a level error that scales every candidate alike leaves the argmax where it
  is. So the next inference step is B8's learned slope under the stayer-pays cap, being run now (pids
  1538042, 1542480). That is the thesis working as designed: an advantage sought from inference over
  the company's own renewals, against a flat-level baseline, with predictions filed first. BUT the world's
  P(stay) at margin 10 in 2020 is 0.37. That is 63% of renewing households leaving in a year whose published
  whole-market switching rate is 20.2%. The renewal sub-population has no published comparator, so this
  is not a conviction, but it is the number the slope is being learned against. The departure-rate item
  is in hand and has a pre-registration on file (/var/tmp/se-seat-executor, executor pid 1758163, untracked).
  The pre-registration itself says the book's 45-50 electricity accounts a year earn a +-8-12pp bound,
  so it cannot convict any single year. That is my error in how I framed the item, recorded in wrong.
  The item stays first and now asks for the pooled measurement. ONE ITEM IS FINISHED AND LEAVES FOCUS.
  The one-payment-method home landed as 067ade9ac. Ledger and seam agree 178 of 178, where 112 of 178
  agreed before. The control reds at 71/178 and 21/178 under its two mutations. world_identity gained
  a payment_methods part. W2_payment_channel_dd_consistency_invariant was re-graded and held at L2 with
  a named reason (non-DD failures still carry DD_FAILED), and the console seat has its re-read note.
  So the W2 row in wrong is now corrected. THE STEER HALF-BIT AGAIN. The prepayment-ruling item has gone
  two stretches undrawn, and so has the base-advance item. Both controls guarding the ruling are unchanged
  on origin since 0cc052102, so still red. The machine is no better: 15 of 31 commits carried no work,
  and three base-advancing surgical_land runs are live now. HEAD is 82 behind origin. My last direction
  commit, 543dcff6d, is on no remote ref 2.9h after it was written. The base-advance item moves to second,
  ahead of the ruling, because its cost taxes every other lane's landing including the ruling's. The ruling's
  own-book flip has a release condition that is now MET: four probe_capped files exist and the stayer-pays
  landing is on origin (3475058ef). I am holding the flip one step more, until the console seat grades
  its learned-slope run, because flipping the default path under a live pre-registration would make its
  L1-L4 unattributable. That hold is written into the item so it is re-asked, not remembered. Eight worktrees
  hold unlanded commits. The executor's (4ec466d6c, salvage) holds the departure finding, and it is locked
  and live. The three agent-* SALVAGE worktrees are owned by the console seat's agents, so they are not
  mine to reap or land.
