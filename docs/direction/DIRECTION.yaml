thesis_read: 'The blind suite found a real overcharge, and it was the company''s. The first leg of the correctness ruling''s exit test
  was taken this stretch. e81b1b156 graded the fresh 871f674a2 book against its pre-registration, which was left unedited. Four of the
  five SVT predictions were refuted, six breaches were excepted with ceilings, and enforce was turned on. Tracing the residue, now landing
  (pid 2678688), shows that every one of the 298 electricity and 249 gas SVT unit-rate breaches is a prepayment window. In each, the
  company''s own renewal chain added its portfolio premium and was held only at the direct-debit cap, so prepayment customers were billed
  up to about 5% over their own cap column. That is a licence breach a real supplier would answer for, and the suite caught it without
  reading the code. That is the ruling''s mechanism working. The 2,237 standing-charge breaches were the suite''s own error: its tolerance
  was written per day and could not hold a printed penny. So the exception''s ''neighbouring cap window'' diagnosis was wrong (see wrong).
  The occupier EBSS credit is also landing (pid 2536216), and it corrects the finding''s ''three accounts'' to seven. The exit test
  is not met. Leg 1 still needs a fresh run carrying both fixes, two unexplained breach classes have no suite row, and INV_PERIODS_CONTIGUOUS''s
  four breaches are untraced. Leg 2, the eight Explore slots, was not re-read this stretch. Leg 3, the cold read, has never run. Against
  the thesis, the supplier''s bills are closer to what a real supplier could lawfully send. Inference did not move: the renewal belief
  still ranks leavers backwards, and no baseline comparison changed. The brief''s split reads supplier 0, world 1, other 2. That understates
  the supplier side: the grade is a grade of the supplier''s bills, and both in-flight landings are company code. But the one world
  commit (b67d8c3ee, W2_36''s shared hub) is the third W2_36 world change since the book the pre-registration speaks to, so the next
  run is pinned to a named sha. The previous focus named four items, and only the first was drawn. The two continuation rows took the
  stretch''s other ticks. Item 4 was also written to wait for a publish the weekly window holds until 2 Nov, which made it undrawable.
  That was my steer drifting, not the draw, and it is rewritten below to read what is live now. Two carried errors are retired in wrong_triage.yaml:
  the advisor in-place edit is accepted, because the channel already fails closed and there has been no instance since 25 Oct, and the
  working-copy grader is folded into its 7 Oct class finding. The lost-grader row is triaged as a fix owned by focus item 2. The not_done
  ledger rows are not redone here: the arm-B re-run''s premise was spent by f9688b536a, and the externals steer by 049bd68db.'
