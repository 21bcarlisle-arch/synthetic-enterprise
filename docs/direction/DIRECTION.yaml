  side: supplier
  lane: B_commercial
  what: 'Make the reactive save on the CSS loss notice live in the run. The authority is the director''s words of 2026-10-10: ''make the reactive save on the loss
    notice a live supplier capability in the run''. (a) Set activated.value true in docs/design/curriculum/save_on_loss_notice_activation.json, with his words and
    the date as its basis. world_save_response_scale stays 1.0. (b) No figure establishes a save''s size (q4_save_offer_cost_share_of_annual_bill, GAP), so do not
    set a share. In company/crm/save_offer.py, size each save from the company''s own per-customer retention ladder: DecisionPolicy.retention_discount_for_risk on
    that account''s churn estimate, the same ladder b922911b7 sends to the world as a rate. Offer nothing where the ladder gives zero. The current policy offers,
    and naive stays off. (c) Write predictions first in a new staging finding. Then run tools/save_on_loss_notice_arms.py off and on, on the 400-founder book to 2024-12-31,
    one seed, through launch_long_job. Report on-minus-off total net, offers, saves, stayer price moves against off, and known-vulnerable twin shortfalls. If turning
    the switch on reds the value-arms controls through the world digest, file that re-take as its own item and never freeze the controls.'
  why: This is first on the director's list of supplier work. The save was built and graded fair on 10-08 and has been off ever since, so the company never uses it.
    DONE when the switch is on in origin, the current policy makes saves sized by its own ladder, and the off/on pair on the corrected world is on origin beside its
    predictions, with stayer moves graded, whichever way net falls.
- id: home-mover-retention-is-the-companys-decision-at-the-move-out-notice
  side: supplier
  lane: B_commercial
  what: 'Make home-mover retention a supplier decision. Today, whether a mover''s new home stays with us is the world''s flat home_move_won roll at a parameter rate,
    delivered through SUCCESSOR_MAP. The company decides nothing. It already receives the move-out notice (9b0e3594c, SLC 24.1, two working days before the move).
    Discovery first: read docs/market_research/home_moves.md and the regulation commons for what is published on movers taking their supplier with them and on what
    a supplier may offer at a move. File a gap where nothing establishes it. Then build the company''s per-customer choice at the notice: offer to follow the customer
    to the new address, or not, and on what terms. Decide it from the company''s own forward value of the account and its own debt and churn beliefs. The world answers
    on the same roll whether the household follows. Put it behind a DecisionPolicy field that naive leaves off. The flat baseline is today''s rule, every mover alike.
    Pre-register, then run both arms on the 400-founder book.'
  why: This is second on his list, and home moves are now on in the run. The notice is something a real supplier sees, the choice is ours, and the flat rule already
    exists to beat. DONE when the choice is wired into the run, a partition control shows that both offer and no-offer are reached, and the pre-registered two-arm
    result is on origin.
