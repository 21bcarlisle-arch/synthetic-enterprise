    why: >-
      8dd7794bd showed the anti-ranking it would correct is mostly a world artefact. Any company-side
      fit before item one lands would learn the defect, which is the reverse of the thesis.
  - what: Putting "legs, then rate" into EP1's ranking input, or rebinding _DEFAULT_BASE_SEED by hand to replicate it.
    why: >-
      Two dice-redraw runs held every prediction but cannot vary a household trait, so they cannot
      license the rule (2acb617d4). A different book is EP17, which is R13 curriculum and the
      director's; the worker already sent him the recommendation. Going round the door would be
      deciding his call.
  - what: Swapping the bill-shock base and adding the passive-term-end roll in one change.
    why: >-
      Both move departure levels and gradients. Together they cannot be attributed, and the swap's
      run is already in flight. Item two waits for item one.
  - what: Re-running the ab6 value-cycle A/B or the EP17 four-book pilot now.
    why: >-
      Any result is scored against a world whose retention gradients are known to be artefacts. It
      would price the defect again; run it after items one and two.
  - what: Binding the lane-0 not_done row grade-ab6-pilots-once-runp2-exists, and a heartbeat for the mute worker-seat-manager.
    why: >-
      The bytes attributed to that row by time (a done run_complete and the director console) are
      not its work, and both items move no level. The mute daemon's wait channel is still its
      ordinary sleep.
