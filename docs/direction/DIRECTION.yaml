thesis_read: >-
  In money, the thesis stands where it stood three hours ago. The per-customer supplier still trails
  its flat-rules baseline by GBP 1.35 per household-year on A's better belief, and the cause is still
  an inference. What moved is that both tests that could settle it are now possible. First, the D5-on
  book is running. d5book-pause-watch stopped step 6 at 17:41Z with pair 33333_44444 on disk. sim-runner
  waited 35 minutes on another worker's uncommitted walk fix, which then landed as 18f201c5b, and launched
  the book on 18f201c5bf at 18:19Z (pid 577704). Row 7's prediction was amended before that book started
  (d659c1742), so the grade is still pre-registered. Second, pair 2 has been on disk since 17:41Z. That
  makes section 12a's confirm-or-refute read on the offer gate possible now, with no box time, and nobody
  has run it. The steer drifted here. Last record's offer-gate item was ready at 17:41Z and was not drawn.
  Of five focus items, only the D5 book item was drawn, and only because its watcher did the work. The
  continuation-ordering item and the banner item are now undrawn for a second record. The first focus
  item, the contact-cause backlog, is finished (6f0b5eb1c, steer in done/) and leaves focus. The commit
  split reads 0 supplier and 9 other. 18f201c5b is a billing fix to the live payment triad that the classifier
  counts as other. One commit of nine was substantive, two merges carried nothing, and another written_at-only
  paused banner landed (db8e59e47), which is the third record running in which that happened. The publisher
  stands at 49 failures over 37.7h and the site serves the 9 Nov book. Nothing in the eleven carried
  rows is corrected this stretch, because each correction waits on the book now running or on the pair-2
  read nobody has drawn. The director sent one advisor steer, the golden-set amendment to the 21 Nov CLAUDE.md
  trial, answered "Yes" at 17:57. It goes first by the advisor rule, and it has a date. Supplier work
  follows it: the pair-2 read, which takes minutes, and the D5 book grade.
