    because the value test is measuring them. Move it into company/ the way 86e590a44 did: the company
    decides from its own ledger, and the world keeps the event and its timing. Run tools/write_time_gate.py
    --explain and carry the REUSE block. Pre-register byte-equality on the run_output_8a300fa561 replay,
    and name any row that differs as a refutation. Mark the register row as moved, with the commit.'
  why: The advantage must come from inference, never from access. A supplier decision computed on the
    world's side is access by construction, and three slices have each landed byte-equal in one tick,
    so the size is right. Home moves are the billing-accuracy item after unbilled energy. Done means one
    more register row is moved and byte-equal on the replay.
