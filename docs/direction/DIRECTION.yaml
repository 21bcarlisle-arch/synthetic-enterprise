      and to the only available level move. It stays a debt this seat owes the director, and the
      thing it degrades is his view of whether my direction reaches the work, which is why I keep
      writing it down instead of letting it fade.
  - what: >-
      Re-running the A/B across many seeds to try to resolve the selection leg statistically.
    why: >-
      The arithmetic refuses it and it is worth stating once so no future seat reaches for it. At
      the observed spread it would take on the order of forty full decade runs to resolve an effect
      the size of the one we are chasing, and every one of those runs would be measuring a
      25-decision surface that item three may show is 25 only because a field is unset. Changing
      the experiment is cheaper than repeating it, and repeating it first would spend days to learn
      that the answer was in the plumbing.
  - what: >-
      The concentration in the A/B's bounds -- six of 25 priced decisions set by the lawful price
      cap, on one billing account carrying 43% of the realised margin movement.
    why: >-
      Already measured and already written into the artefact's `bound_attribution` block, so it is
      on the record and not lost. It stays downstream of item three: if the decision surface widens
      on fidelity grounds the concentration dilutes on its own, and if it does not, this becomes a
