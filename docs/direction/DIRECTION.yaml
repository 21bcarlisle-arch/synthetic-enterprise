focus:
  - id: the-settlement-ceiling-can-move-now-that-its-curve-has-landed
    what: >-
      Move `SETTLEMENT_CUSTOMER_YEAR_BUDGET` in `simulation/net_new_acquisition.py` (1200.0, line
      740 at origin/main) off its historical value, DERIVING the new one from the four-point curve
      that landed at `c4bee75e3` in `docs/observability/settlement_ceiling_slope_20260921.json` and
      the weekly interval the director named on 2026-09-04
      (`background/publish_freshness.PUBLISH_CADENCE_SECONDS` = 604800). Do not pick a number; fit
      one and show the fit. Three things the artefact forces you to handle and the instruction will
      not let you skip. (a) Points 2, 3 and 4 carry `clean: false` with
      `campaign_record_agrees: false` — another process wrote `book_growth_campaign.json` mid-run,
      so their `customer_years_committed` is NOT their own; `customer_year_budget_seen` and
      `peak_rss_mb` are the probe's own measurements. Fit on the x-values the probe can vouch for
      and say in the note which you used. (b) Point 4 took all 500 funnel wins with 0 refused by the
      budget, so it is funnel-bound, not budget-bound, and is not a point about this constant's
      ceiling. (c) The memory budget is a share of the LIVE guest, read from
      `background.resource_headroom.sample()["total_mb"]`, never a quoted figure and never the scale
      probe's 2026-08-12 box budget. Then check the consequence the constant does not own: the
      probe's 13,920.9 MB peak already EXCEEDS the 13,824 MB `sim_run` declares in
      `process_manifest.yaml`, so if your value lands anywhere near that book the declared weight
      drifts and must be re-declared in the same commit. Rewrite the constant's note to name which
      leg binds at the value you chose, what share of guest memory the run then claims, and delete
      the sentence saying the interval is unstated — it was stated seventeen days ago. DO NOT TOUCH
      `simulation/premise_population.py` or `tools/generate_value_arms_data.py`: a live lane was
      writing both at 21:22 and 21:24 local on 2026-09-21, repairing the published memory bound, and
      a second writer there buys nothing.
    why: >-
      This constant is the only thing between the book we have and a book that can sign the
      per-customer arm against the flat-rule baseline, which is the thesis's own acceptance test —
      and the measurement that was supposed to justify holding it at 1,200 has now refuted the
      reason. FINISHED means the constant's value is a consequence of the landed curve rather than
      of its own history, its note names the binding leg and the guest share at that value, the
      `sim_run` declared weight agrees with the peak the new value implies, and the next producer
      run completes at it without opening a `resource_headroom` episode.

  - id: twenty-three-named-refusals-and-their-control-are-finished-and-uncommitted
    what: >-
      Land the completed work for Lane 0 claim
      `name-the-35-remaining-bare-keyerror-refusals-on-raise-on-missing-registers`, which the draw
      ledger records as `not_done` and which is in fact done. It is: eleven dirty files under
      `company/` carrying 23 named refusals (`billing/payment_deferral.py`, `billing/prepayment.py`,
      `crm/campaign_tracker.py`, `crm/change_of_tenancy_register.py`, `crm/lifecycle_tracker.py`,
      `crm/solr_intake.py`, `crm/tpi_book.py`, `finance/credit_facility.py`, `market/dsr_book.py`,
      `market/switch_governance.py`, `risk/risk_appetite.py`, all written 15:36-15:38 local); the
      UNTRACKED control
      `tests/company/test_a_register_that_can_refuse_names_the_key_the_book_and_the_registrar.py`
      (13.5 KB, 23 cases, each serving a registered key and refusing an absent one in the same
      test); the regenerated `docs/observability/conditional_registration_survey.json`; and the
      untracked result doc, whose full name is on the next line and must not be re-wrapped:
      `docs/staging/WORKER_RESULT_TWENTY_THREE_REGISTERS_NAME_THEIR_REFUSAL_AND_THE_THIRTEEN_LEFT_CANNOT_REFUSE_AT_ALL_2026-09-21.md`.
      Read the result doc before touching
      anything — it already establishes that the brief's "35 accessors" was wrong (13 of them cannot
      be reached with an absent key at all) and names the two mutations it ran. Commit by pathspec,
      never `-A`; the survey JSON is a shared generated artefact, so if another lane is dirty on it
