thesis_read: >-
  Billing accuracy moved this stretch. The thesis did not. N29 is on origin (3af02a2dd). A closing dual-fuel household's
  credit on one fuel is now set against its debt on the other before anything is refunded, and the change is in
  company/billing/credit_refund.py and its seam, so it is the supplier's own work. Over the 6fe7827ab2 run,
  INV_CLOSED_ACCOUNT_BALANCE_REACHES_ZERO falls from 33 to 5 breached against clean origin, and the blind row reads 29 of
  124 refunds past the household credit (the published ceiling is 60). A landing that names a cause for each of the 5
  breaches is in flight (surgical_land pid 1919862). Repayment-posting was graded at origin (eb89cfd46). Dating and
  assignment read clean: own-late is 0, and the 16 left were our reader keeping cash the seam had dropped. The 28
  desk-written-off accounts that still print owed (GBP 1,130.68) are two traced shapes. F is a leaver's final bill that
  the page nets and the world collects at face (24 accounts, GBP 633.16). R is a per-leg refund made while the other
  leg owes (18, GBP 497.52), and that is N29's shape. The world's final-bill net is landing now (pid 1688796). The steer
  bit completely: 3 items named, 3 drawn, 3 done. The N29 port landed, the repayment grade landed, and the retire guard
  landed (9fd94625f) with its triage row closed already_fixed (f84e362ed). All three leave focus. There is a catch the
  brief makes plain. The retire guard is on origin but running nowhere. The shared checkout is 51 behind, and every
  daemon lacks 4 to 16 commits, delivery_lane.py among them. origin_reconcile has read NOT_ADVANCED every five minutes,
  refused by 1,470 paths, and 1,314 of the 1,540 paths origin changed already hold origin's bytes in the tree. So the
  machine is landing fixes it does not execute. That is item 3. The commit_split (0 supplier, 0 world, 1 both, 6 other)
  is machine-heavy, and the one 'both' commit was the stretch's real product. Against the thesis, the flat-baseline
  comparison (pre-registered at c65c4cb8b, B11) is still the only test, and it stays held to 16 Nov. Its launch condition
  needs the 26 Oct ruling's exit test on origin, which includes one cold read that finds no new class. No cold read has
  run in the learning loop's window, and the meter-serial row says why that matters. Item 2 runs it now, against the
  current pages, so whatever it finds can be fixed before the 16 Nov book, rather than discovered on it.
