  decision_kind: harness
  what: K8 (knowledge before build) covers supplier capabilities only; two world models were closed at
    target with no knowledge page beneath them, the weather-to-price chain and the cold-and-still tail
    demo
  proposal: 'Extend K8 to the world: a world model reproduces a published mechanism, so the page naming
    that mechanism comes before the build and the module''s docstring cites it (or a named Knowledge:
    GAP). One-leg test over L3+ world modules, no baseline list.'
  recommendation: 'I recommend adopting the one-sentence extension: the chain loses to a gas-only null
    in every regime, and a page would have named its missing carbon and interconnector terms before the
    first arm ran.'
  based_on: bfad11e9fa
  status: open
