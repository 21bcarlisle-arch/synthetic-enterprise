- id: the-msc-replacement-win-lands-or-releases-the-book
  lane: E_finance_treasury
  side: supplier
  what: 'land8 (unit longjob-land8-msc-replacement-win: /var/tmp/se-msc-keep/land8.sh execs land7.sh,
    which applies msc8.patch, that is msc6 plus phase4c reading the shared run) is queued behind the s.12g
    book (pid 65649, arm A pid 677395, ending about 06:00Z 24 Nov). Do NOT launch another copy while it
    lives. When /var/tmp/se-msc-land7-ended-20261123.txt appears (land7.sh''s EXIT trap writes it on every
    path), read /var/tmp/se-msc-keep/land7.log. IF IT LANDED: run surgical_land --verify on the origin
    sha, write that sha into the MSC row of background/next_book_requires.yaml, and retire verify-msc-replacement-win-landing-v6.
    IF IT DID ANYTHING ELSE (timeout, a red, an apply conflict): in that same turn, delete the commit:
    null MSC row from background/next_book_requires.yaml and land the deletion, so the post-s.12g book
    starts without MSC. Then grade da44381d2''s written prediction (a timeout at 90-95%, no red) in that
    finding, with the wrong figure kept beside the result. Before any land9, take the next lever the finding
    names (the collections_journey live_run / answered_live_run setups, or the flat-supplier arm''s) and
    re-run the hook''s selection serially with --durations=40. Never raise GATE_TIMEOUT_SECONDS and never
    drop a test from the selection.'
  why: Every grade queued for 24-25 Nov reads the book and none of them reads MSC (B8's five, D48, KNIFE3,
    dual-household, supplied-won switches). MSC alone moves no 2023-24 first-term attribution, because
    the campaign's wins pay no charge yet. One sequenced attempt costs the book about 75 minutes. A failed
    attempt that keeps the hold costs it a day. Done means MSC is on origin with its sha in the row, OR
    the hold row is gone and sim-runner has started the post-s.12g book, and in either case da44381d2's
    prediction is graded.
  written_at: 1795469286.085
- id: the-first-term-strike-gap-to-the-cheapest-fix-is-attributed
  lane: B_commercial
  side: supplier
  what: 'db2f502b23 strikes the first fixed term on a six-month ladder of the published forward. At the
    residential network cost, that strike sits 10-18% under the market''s cheapest fix in 2023 H2-2024,
    and 25-40 GBP/MWh is unattributed (docs/market_research/cheapest_fix_against_the_default_tariff_gb_2016_2025.md
    section 8). KNOWLEDGE FIRST (K8): from Ofgem''s cap methodology (the wholesale allowance''s shaping,
    imbalance and backwardation terms, operating cost, EBIT, headroom, policy and payment-method allowances)
    and from published supplier accounts, establish what a real supplier adds between the forward and
    its fixed price. Compare it component by component with the ladder for the same months, and write
    each component into section 8 as sourced or GAP. Print the 2023-07 to 2024-07 position against the
    cheapest fix at real inputs after each component. Only then wire into renewal_desk.quote_first_term
    the components the evidence establishes, each with a mutation-proven control. Whatever is still unattributed
    stays a named None, never a fitted number.'
  why: A quote 10-18% under the market's cheapest fix wins customers by giving margin away. That is value
    transferred, not created (M2), and it would let the campaign book wins the flat-rules twin cannot
    match for the wrong reason. Done means section 8 carries every component sourced or GAP with the reprinted
    position, and any build that follows names the component that justifies it.
  written_at: 1795469286.085
- id: campaign-wins-pay-the-market-stabilisation-charge
  lane: E_finance_treasury
  side: supplier
  what: Build MSC's next increment WITHOUT landing it yet. msg8 says the growth campaign's net-new wins
    (campaign_acquisition_spend_events) pay no Market Stabilisation Charge, because their quotes carry
    no annual volume. Work in a fresh worktree under /var/tmp (lock it with an owner and a reason), detached
    at origin/main, with /var/tmp/se-msc-keep/msc8.patch applied. Carry the prospect's EAC/AQ through
    the campaign quote (simulation/live_population.py to company/interfaces/growth_desk.py). A real supplier
    reads these from industry data at registration, so the company receives the charge amount and never
    the rate table. Make each campaign win between 14 Apr 2022 and 31 Mar 2024 book book_market_stabilisation_charge
    exactly as a replacement win does. Test that margin falls by exactly the charge and acquisition spend
    does not move. Print the 2022-24 charge count and total at the run's seed. Save the result as /var/tmp/se-msc-keep/msc9-campaign.patch
    with its message. Land it only after MSC is on origin, as its own landing, after re-reading the gate's
    durations.
  why: msg8 says campaign wins are most of 2022-24's wins. Until they pay the charge, the supplier's 2022-24
    P&L overstates the campaign's margin in exactly the years the thesis is hardest. Building it now uses
    the gate's quiet hours. Holding the landing keeps a second ledger change out of a gate that does not
    yet fit one. Done means the patch is durable and tested with the 2022-24 figures printed, and it is
    landed once MSC is on origin.
  written_at: 1795469286.085
not_now:
  - what: Deleting the MSC hold row now, so the book starts the moment s.12g ends whatever happens to MSC.
    why: >-
      land8 and the book would then start together, and gating beside a book is what killed land2 to land5. One
      sequenced attempt of about 75 minutes costs less than a contested attempt that fails anyway. Focus item 1
      releases the hold on the first non-landed outcome, so the most the book can lose is that one attempt.
  - what: Raising GATE_TIMEOUT_SECONDS to about 5,400 s, now that the ledger selection is measured green in 4,604 s.
    why: >-
      Green but slow is now a known fact, but a longer deadline on the money modules lengthens every lane's hold on
      one serial gate, and the whole reason landings lose their race to origin is gate length. The finding names
      the setups that spend the hour, so the cost can come out of the selection instead.
  - what: Re-focusing the shared checkout, which is now 58 behind origin.
    why: >-
      f80cc5a46 names the three working copies that hold it. Two are superseded 6C drafts that age out on 24-25 Nov,
      and the third is MSC's own source copy, which becomes a twin when MSC lands. The recheck is queued for
      2026-11-25T06:30Z (shared-tree-advance-recheck-after-age-lines). Forcing it sooner would mean moving a live
      lane's bytes.
  - what: PB3_book_growth_as_earned_outcome, which db2f502b23 names as its NEXT.
    why: >-
      Book growth cannot be called an earned outcome while the wins are priced 10-18% under the market's cheapest
      fix. The price gap is attributed first (focus 2), and PB3 then reads wins whose price means something.
  - what: B7 home moves and W2_36 unbilled energy (both DRAWABLE, both on the billing-accuracy priority).
    why: >-
      Both are world-side and unblock no supplier result graded tonight. Both need a book to grade, and the gate's
      quiet overnight hours are better spent on the supplier's price and P&L.
  - what: Switching the conditioned renewal belief on before B8's five grades.
    why: >-
      Its pre-registration gates it on the coming book (25 Nov). Flipping it early spends the blind holdout's
      evidence.
  - what: Reaping the 10 worktrees whose commits no remote ref keeps.
    why: >-
      A reap cannot be undone, and losing se-msc-wt is exactly how MSC lost its tree on 23 Nov. Nothing is reaped
      until MSC is on origin.
