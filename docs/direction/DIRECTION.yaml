- id: the-run-s-company-cannot-learn-whether
  raised: '2026-10-09'
  kind: strategy
  what: The run's company cannot learn whether its own retention offers work. Its own holdout sees about 30 offer decisions a year in 2017-2018
    and far fewer after (correction 2026-10-10 -- about 14 considered and 5 offered a year over 2019-2025, because the founders renew together,
    most roll passively to the default, and cheaper 2019 renewals fall below the offer threshold), and the real effect needs about 19,600 per
    arm to tell from nothing. Meanwhile its standing guard treats every offered household as saved, which B8 measured as a loss at every cut size.
  proposal: I am keeping the holdout off on every standing policy and recording 'an offer a small book cannot evaluate' as the named limit of
    a 400-household company. Unless you object, I will not let the company price offers on evidence from outside its own book, because that changes
    what a supplier this size is allowed to know. If you would rather it use published retention trials, say so and I will build that next.
  status: answered
  resolution: 'Director, 2026-10-12, ''Agree all'' to the fourteen decisions in canon v4 section 15 (staged in e89a7728a; docs/staging/DIRECTOR_STEER_CANON_V4_ALIGNMENT_2026-10-12.md,
    step 4): the director says so. Published retention trials are design-time knowledge, and the company may run its own randomised holdout and
    read it, never the world''s truth (C8). Build what you offered.'
  evidence: docs/staging/SEAT_FINDING_B8_L3_THE_RUNS_OWN_HOLDOUT_CANNOT_DECIDE_AT_THE_FOUNDERS_SCALE_2026-10-09.md
