  - what: >-
      Opening a separate investigation into the three red `test_extract_opex_ledger_*` tests, which
      look like the unfinished prepayment work from the previous stretch rather than a fresh
      regression.
    why: >-
      They are folded into item 3(a) instead. They are red at HEAD and wedging the publisher, so they
      have to be fixed regardless; giving them their own slot would rank a four-test repair above the
      director's ruling, and splitting the wedge across two items is how one half gets done.
