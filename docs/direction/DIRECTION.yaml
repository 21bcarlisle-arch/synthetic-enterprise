thesis_read: >-
  This stretch set up the thesis test and did not run it. The supplier still trails its flat-rules baseline
  by GBP 1.35 per household-year on A's belief, and no money figure moved. That is not a step backwards. Every
  item now has a date on the box, and the box is the only thing it waits on. The threshold switch
  (ff4fe0f3e) is on origin, default off, and the per-customer save selection moved into growth_desk.py.
  4f98206d9 re-planned the box as follows. Flag 1 stops at pair 3, and flag1-stop-at-pair3-watch reads the
  boundary from both output files parsing as JSON, never from an mtime. Then the owed book runs, then the
  skip pair, and vts-threshold-skip-watch launches it. Pair 3 is past its 07:30Z estimate per fe0993b5a but
  working. That puts skip1's read near 21:00Z today and skip0's near 08:30Z on 19 Nov. The re-plan also caught
  an error in the last record. Its focus 1 called skip1-against-A "the switch as the only variable", but the
  switch is refused without the save-odds weighing, so that comparison changes two things. 12d keeps skip0 for
  that reason. Billing moved further than predicted. 20d4cbecc named and fixed row 7's last 2 (a delivery's
  walk ran past its own `through` and crossed SYN-2016-001's 15 Aug lump) with no book. So the next book
  carries all three row-7 fixes (594ed8239, d645233e8, 20d4cbecc), and next_book_requires.yaml enforces that.
  That book is the first that could publish since 6fe7827ab2. The publisher is at 56 failures over 46.7h, and
  the site's figures are 150.9h old. f34f100d7 landed the banner fix, so a written_at-only banner no longer
  commits. Whether the landing race shrinks is read next stretch. The steer bit 4 of 4, the first full draw in
  five records. Three items are spent. The continuation-ordering item is claimed and building now (03:16Z).
  The commit split reads 0 supplier, 1 both and 12 other, but 20d4cbecc (live payment truth) and ff4fe0f3e (the
  save gate) are supplier substance that the classifier files as other. Two carried rows are corrected.
  vto-offer-reread-watch is retired under 12d's re-plan, and its salvage 870201d1e7 survives as the base of
  the skip tree. The mtime-trusting pause is replaced by a file-parse boundary, and row7book-pause-watch is
  stopped. The weak point is the order. Every supplier result now sits behind one 11.5h pair, one book and two
  more 11.5h pairs on a single box. So this record puts the next lever's code in place before skip1 reads,
  rather than after.
