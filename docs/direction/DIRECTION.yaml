focus:
  - id: EP1_clv_three_horizon
    what: >-
      Sixth naming, and a SMALLER act than any of the five before it: do not fix the hazard, LOCALISE
      the collapse, and stop when you know where it is. The measurement is one script and it cannot
      fail to produce a finding. Take the 33 account ids in
      `coupled_gap_ledger.json -> EP1_clv_three_horizon.components.lifetime_level.per_account`. For
      each, rebuild the company's own `churn_risk` map the way `customer_value_view.py:141` does
      (`build_churn_risk(settlement_records, customers)`) and print, side by side: every
      `churn_probability` in that account's renewal trajectory, the trajectory length, the value at
      `[-1]` (which is what `AccountObservables.latest_renewal` returns), and the 0.05 the ledger
      recovered. Then branch, and say WHICH branch you are in before doing anything else. (a) If the
      trajectory's last point really is 0.05 for all 33 while earlier points vary, the collapse is the
      TIME MODEL: `clv_three_horizon.py:580`'s `LATEST_RENEWAL_CONDITIONED` reads one renewal out of
      up to thirteen and the dispersion is thrown away one line before it is used -- the act is to
      give H2 a term formed from the trajectory the company already holds (its own mean or
      trailing-window hazard, your call, argued in the commit message), leaving H1 and H3 alone.
      (b) If the trajectory DOES vary at `[-1]` and the ledger still recovers 0.05, then the collapse
      is downstream -- in `build_three_horizon_clv_snapshots`, in the published H1/H2 pair, or in
      `tools/clv_gap_selection.recover_hazard`'s inversion -- and the act is to fix the instrument,
      not the company, because then the ledger has been reporting a belief the company does not hold
      and every EP1 reading for five stretches has been wrong about its own subject. Either way
      publish the per-account table as a finding under `docs/staging/` before touching any code, so
      the next reader inherits the measurement even if the fix does not land. Re-measure with
      `python3 -m tools.couple_clv` and bind the paths with `delivery_lane.record_landing` as each
      piece lands.
    why: >-
      This is the thesis's centre and it has resisted five instructions, all of which proposed a cure
      without a diagnosis. The evidence now says the premise under all five was false: the company's
      churn estimator produces 13 distinct hazards over 622 decisions (mean 0.183, only 263 at the
      base), and EP1 recovers 0.05 for all 33 graded accounts across nine belief years. Thirty-three
      independent draws from that distribution all landing on the base is a one-in-a-trillion event,
      so this is a mechanism and not a population accident, and it is localisable in minutes. Branch
      (b) matters as much as (a): if it fires, the harness has been grading a belief the company never
      formed, which is a tautology-class instrument defect under R15 and a bigger finding than the
      gap. Finished when the per-account table exists as a named artefact and the document says which
      branch is true with the evidence attached. Moving the gap is NOT required for this item to be
      finished, and moving it in the wrong direction does not make the item unfinished -- R12, the gap
      is a diagnostic. What IS required is that nobody has to ask again where the collapse is. If a
      changed estimator then puts more than one distinct hazard into the graded population and the
      coupled rung is genuinely met, a level move is available on that evidence: self-certify with
      `record_level_up_self_certified`, never `--no-verify` a `level_current` change.
  - id: size-then-run-the-full-window-instruments
    what: >-
      Before running anything, MEASURE what the full-window run costs and write the number down. Time
      one `run_phase4c` pass at full window (or read a wall-clock from the last such run in
      `docs/observability/`) and compare it against what a worker tick can hold. Then act on what you
      find, and record which case you were in. If it fits: run `python3 -m tools.run_value_cycle_ab`
      with no `--end-year`, land it, then run `python3 -m tools.run_price_ladder` with no `--end-year`
      (or `--rungs 0,0.5,1,2` at FULL window -- keep rung zero, it is the null control the whole
      reading rests on), and land that. Land after EACH, never batched, binding paths with
      `delivery_lane.record_landing` as they land. If it does NOT fit, that is the deliverable and it
      is a better one: file the measured duration as a finding, say plainly that the full-window
      instrument is not runnable inside the tick that keeps being asked to run it, and name the
      cheapest thing that would make it runnable (checkpointing, a resumable pass, a longer-lived
      lane). Either way, edit the headline table in `docs/design/THE_VALUE_CYCLE_REALISED_AB.md` so
      the current row names the book it ran on -- account count, segment split, git commit -- keeping
      superseded rows with their supersession notes. R14: every figure carries its clock. If a tool
      errors or refuses, the verbatim error IS the deliverable; land the other one.
    why: >-
      Five stretches, two first-place namings, two Lane 0 claim-and-drops, and an explicit escape
      hatch that did not help. Restating a six-line command a third time is the definition of R3's
      second strike, so this stretch asks a different question: what does it COST. The nearest working
      analogue is right there -- the 2019 ladder ran to completion in one tick at 04:45 and produced
      141KB of artefact -- and the only diff is the window, which makes this R4's "name the nearest
      working analogue and state the diff" rather than a discipline problem. The measurement matters
      beyond this item: if the full-window instruments genuinely cannot run inside a tick, then every
      future direction that names them is unbuildable by construction and the seat has been setting
      traps for its own workers. It is second, not first, because item one changes the belief these
      instruments measure, and numbers published before that change describe a company that stops
      existing -- the exact defect the 26 August book caused once already. Finished when the duration
      is written down somewhere a reader will find it, AND either the newest artefacts carry
      `report_end: null` with live figures, or a finding states why they cannot.
  - id: reconcile-the-directors-red-census
    what: >-
      The director's console at 2026-08-27T05:39Z reports "33 newly failing tests at HEAD since
      03:16Z". The stretch closed "28 of 28" and that census was `tests/tools`. Run the tree-wide
      collection at HEAD, produce the actual current red list, and reconcile it against both numbers.
      Three outcomes, all acceptable, and you must say which: the five are closed as collateral of the
      28 (name them); the five are still red (fix them, or file each as a finding with the reason it
      stands); or the director's 33 and the machine's 28 counted different things (say what the
      difference is, in one line, so the next census does not repeat it). One red is already known to
      be standing deliberately -- `tests/tools/test_year_spotlight.py::test_crisis_year_2022_worse_than_2020`
      is `xfail(strict=True)` against a finding document that argues the Ofgem cap is why 2022 is not
      worse than 2020 -- and that one is CLOSED, not owed; do not reopen it. Reply to the director's
      report by NTFY with the reconciled census when it exists.
    why: >-
      He reported a number and nobody has answered it with a number. He gets an "all clear" from the
      commit messages and the arithmetic does not support one, which is exactly the shape of false
      completion this project has R1 and R3 for. It is small, it is his, and it is the only thing on
      this list where the seat currently owes an answer rather than a decision. It sits third rather
      than first because the publisher is live and pushed figures to origin 0.9 hours ago, so the
      commit gate is passing and no landing is blocked -- if that had not been true this would be
      first. Finished when the red list at HEAD is written down and each of the director's 33 is
      accounted for as closed, standing-with-a-reason, or never-real.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Fourth stretch, and the instruction is unchanged because it has never been attempted: name the
      COMPANY belief a coupler would grade. Not more SIM-side science. The EP13 work that landed this
      stretch (49387e0ce, the embedded-generation bound whose fixture turned out to be 92% fallbacks,
      so the instrument's blindness check was reading the fixture rather than the instrument) is real
      and good and is the third consecutive time this atom was given the company half and did the
      world half. Check what `company/carbon/half_hourly_footprint.py` publishes and whether anything
      under `company/` reads it; `company/sustainability/carbon_intensity_register.py` still has no
      non-test importer. If a real company belief about emissions exists, build
      `tools/couple_carbon_intensity.py`, grade it against the world's outturn, and put the row in
      `coupled_gap_ledger.json` beside the sixteen already there. If it does not exist, write that
      into the map entry and `docs/design/EP13_CARBON_INTENSITY_DISCOVER_FRAME.md`: EP13's L3 is
      unreachable until something in the company consumes the carbon number, and building that
      consumer is the real owed work. Keep the framing my predecessor corrected -- L2 is "mechanically
      real, happy path" and the coupled rung binds L3, so `level_current: 2` with no coupler is a
      supported level with no path to 3, not a false claim. R15: mutation-test whatever control you
      build, both ways. Stay under the 12,288 B per-atom map cap.
    why: >-
      The coupled triad says no world atom is complete until the company has been tested against it,
      and the director asked for this atom in his own words on 2026-08-25 -- "say plainly what it does
      and does not yet include." The publish half is live; the say-plainly half is ungraded for the
      fourth stretch running. It is last because the three above are on the thesis's spine or are a
      direct answer owed to him, and because writing down that the path to 3 is blocked is a
      legitimate and cheap close here. Finished when EP13 has either a ledger row grading a real
      company belief against the world's outturn, or a map entry and frame document stating plainly
      that no such belief exists and naming what would create one. A fourth stretch of SIM-side work
      does not finish it, however good that work is.
