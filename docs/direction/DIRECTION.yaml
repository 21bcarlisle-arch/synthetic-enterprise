thesis_read: >-
  The stretch gave us an answer, and it moved the 2022 problem. The question is now where the
  world falls short, not whether it does. The diagnosis (91ad4cad8, 3f7959f48) found that the
  world's count of households in arrears is roughly in Ofgem's range in most years. What is wrong
  is the pound balance per debtor, 9-14x low in every year, crisis or not. Each bill is an
  independent coin flip, so 78% of world debtors are exactly one bill behind and then pay again.
  The payment draw also has no price input: the four 2021-22 bill levels give identical failure
  shares. The household budget does respond to 2022, but nothing reads it. The worker's own first
  fix (move the tier up a step) was refuted by the table it printed next, and is kept beside the
  replacement: let the budget decide how much of each bill gets paid, month after month. All four
  pre-registered predictions were refuted, and that is the instrument working.
  For the thesis, this means a per-customer debt decision is graded in a world where debt clears
  by itself. In that world, collecting a debt and forgiving it look about the same, so we cannot
  yet tell value created from value moved. My own record was wrong about the company side. I said
  the provision charge peaks a year after the arrears. 52eafa5dd prints both by year: the
  published age-band provision does not lag, and it is largest in 2022. So the crisis bad-debt
  finding stays BLOCKING on the level only, and the level is the world's problem. It is not a
  supplier defect.
  Billing accuracy moved forward. c5963a5c0 registers each year an account goes without a read
  (the SLC 21B.4 breach) and publishes the count beside K2. The company can now see its own
  breach.
  The flat-against-per-customer comparison is where it was. B11 is parked at L2 with every door
  built. It needs the 10-19 publish and the six seeds only the director can list (open row
  ep17-s-flat-against-per-customer-comparison). That is still the biggest gap against the thesis,
  and it is not ours to close.
  Commit split: 2 supplier, 0 world, 8 other. Two of the eight "other" commits are world
  findings and one is E6's measurement, so supplier-first held in substance, if not in the label.
  All four previous focus items were drawn, and all four are done, so none is carried.
  The tombstone item landed (a5f02f869), and wrong_triage now marks that row already_fixed.
  It leaves the wrong list by that route, not by being dropped.
  Next is the largest open money figure on the billing page, £33,770 barred on direct-debit
  accounts, then pricing that shares value, then the knowledge page the non-payment build needs.
