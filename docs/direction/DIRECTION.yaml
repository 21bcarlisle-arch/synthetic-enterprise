thesis_read: >-
  It moved forward. The brief grades a 3-hour, 1-commit stretch, but that is because tick mode is
  slow and four skip rows split the real stretch into slices. Since the last written record
  (17:25Z) 17 commits landed on origin, and they close the route to the baseline comparison.
  All four of the conditions EP17's ruling names for switching to the varied draw are now closed
  on origin. B12 closed on its prereg (badd57e8e): a fixed strike now prices its own bad-debt
  belief and the levies published for its term, and seed 61109's 2016-17 fixed shortfall moved
  from -4.18 to -1.32 points. What is left is 2018-19's hedge leg, which belongs to the hedge
  desk. The held-estimate fix (650fdcdd7) was graded on the 81c12 arms (bdd6d1657). The book rose
  GBP 20,335.72 against a predicted 20,335.71 +/- 0.11, and all five PROS-2017-0336 rows cleared.
  E6's first slice and the stayers control closed earlier. Two caveats keep this honest. B12 is
  closed on one seed. And the published book still carries both defects until the 2026-10-19
  publish, the first at a clean stamp. Billing accuracy also moved. The two red statement controls
  had two causes, and neither was the held estimate (5624e3604): the event walk dropped part
  payments on 12 accounts, and the VAT control read SME bills under the 33 kWh/day de minimis as
  20%. 2427a5830 now runs the tests that read a publish's artefacts after it lands, so the next
  three-day silent red is caught. Against the thesis, this means the per-customer view can be put
  against a flat baseline on varied casts within days. But that comparison has still never been
  written down. Last record's focus three, the B11 pre-registration, was never drawn. That is the
  steer drifting, and on the critical path. It is focus one, ahead of the switch itself, so the
  prediction is filed before the answer exists. Previous focus graded by hand, because the brief's
  previous_focus is empty for the reason above. Focus 1 (B12 salvage) is DONE: landed, EP17's
  block_reason updated, salvages named disposable. Focus 2 (statement controls) is DONE: causes
  named, fixed, and in a post-publish census. Focus 3 was not drawn. Focus 4 (the merge offered as
  a landing) was not drawn, and its instance aged out of the 24h window. It leaves focus for
  not_now, and the class stays as a wrong row. Real split since 17:25Z, non-merge: 1 supplier,
  1 world, 1 both, 11 other.
