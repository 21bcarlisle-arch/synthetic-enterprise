thesis_read: >-
  Three hours, twelve commits, eleven carrying work, and all three focus items drawn and finished. The steer bit
  cleanly for the first time in three records. E7 turned out not to be a billing error: the company's crossing bills
  were right, and the exported term record (fixed in c6695cd8d) and the validator's multi-register cap basis (fixed
  in 24963ecd0, 996 bills from DISAGREED to AGREED, none the other way, as pre-registered) were wrong. That retracts
  an error charged to the company. It is good news for billing accuracy, and it stays to be seen in the readers at
  the 23 Nov publish. KNIFE3 moved one more supplier decision across the wall (the statute-barred write-off date,
  5e554a00b), byte-equal on the 8a300fa561 replay. D48's W2_30 and W1_14 rows landed (aca12f3a5) after the gate's
  cause was named: it was selecting seven simulation runs for a ledger edit. The commit split reads 0 supplier,
  1 world, 1 both, 10 other. Read by content it is supplier-led: E7, KNIFE3 and D48 are all billing or decision
  work. Against the thesis itself, though, nothing moved. The per-customer arm still trails the flat book by
  -GBP 1.35 (-3.03 to +0.13). skip0 has run 9h30m at 9.6 GB with no control file, and it holds the box, which also
  deferred the census for the seventh night in twelve. The advantage-from-inference question is waiting on one
  process, not on code. A new error was found at orientation. The D48 finding on origin says the 2026-11-08
  W2_36 runner "landed with" the ledger rows. It did not: tools/couple_w2_36_d48.py is untracked, and no W2_36 key
  is in the ledger on origin or in the shared tree. That unmeasured W2_36-D48 gap is exactly what holds W2_36 at
  the L3 wall, so it goes first. A director steer arrived (prepayment and self-disconnection, knowledge first). Its
  knowledge page and scope landed (a8c597891, a2ed7654e), and its first build step is queued as a continuation.
