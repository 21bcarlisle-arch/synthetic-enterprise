    the number of accounts with money barred, and the size of the direct-debit step-up the recovery causes,
    in pounds a month. Pre-register the barred share before you run it; today it is 153 of 422 accounts,
    £33,770. Do not flip the default before the 2026-10-19 publish lands. Add one control that drives
    an account with a balance through the review under both settings and asserts, in one statement, that
    both outcomes (recovered, barred) can happen.
