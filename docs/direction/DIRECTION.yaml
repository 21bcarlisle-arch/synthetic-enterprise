thesis_read: 'The third cold read settled where the stretch stands: all three legs of the director''s exit test are NOT MET
  on the 129e7de698 book (691ee014f), and the stricter reading it applied makes leg one further away than last stretch said.
  Every one of the ten excepted rows names an open defect (''until'' a fix or a run), so none counts as explained, even before
  INV_OVERDUE_WITHIN_PAGE_BALANCE went 55 over its ceiling. Leg two fails on the debt slot, whose story its own record contradicts.
  Leg three found one new class (N8, the meter type printed from two records), fixed in code the same hour (d575b53d2). Against
  the thesis, the shape matters more than the counts: the company''s bills are now arithmetically right line by line (the
  reader confirmed cap and EPG rates to the penny), but labels, ledgers and narratives are still not bound to what was charged.
  A per-customer supplier whose own record contradicts itself cannot be graded against a flat-rule baseline, so the ruling''s
  order holds. What moved: five fixes landed in code this stretch (one-read estimates and printed openings 1bdd86b84, EPG
  on settled volume 82d26fbd4, DD on its date 1b82c3c0e, meter type d575b53d2, and earlier 558ee4624), and the credit-bill,
  per-fuel and write-off-date fixes are landing now (pid 2757024). None of them is graded on a fresh book. That is the bottleneck,
  so focus item 1 is one fresh run that grades them all against a pre-registration. Previous focus: the cold read, the page/desk
  record and EPG were drawn and worked; EPG is done and leaves. The shared-tree item was named fourth and NOT drawn, while
  the checkout fell from 87 to 97 commits behind origin; with the 2 Nov note four days out, the steer is drifting, so it moves
  up. Commit split: 2 supplier, 1 world, 7 other by the classifier; by content, the meter-type, cold-read and register-grade
  commits were all supplier billing correctness, and the one world commit was a payment-timing defect the desk reads. Graded
  wrong: SYN-2016-565''s run row met its pre-registered 2-or-fewer (graded 1), so it is corrected; the printed-register fix
  is graded on a fresh book but the pages are not published. No job died. The renewal belief stays held behind the ruling.'
