focus:
  - id: what-drives-the-worlds-retention-at-a-first-renewal
    lane: W2_customer_generator
    what: >-
      A measurement, with no simulation/ or company/ code change. File predictions first, in a new
      section "What drives the world" in
      docs/staging/records/SEAT_PREREG_THE_NEXT_AB_ON_THE_SINGLE_ROLL_WORLD_WHAT_A_SEED_VARIES_2026-09-30.md.
      Then split the world's p_churn at each first renewal into the terms that compute it in
      simulation/customer_events.py, simulation/departure_risks.py and
      simulation/switching_propensity.py. Use the same rosters in /var/tmp/se-ab6-out (pin
      a322166cc, runP1/P2/X1 and pb6rank_C0_pin.json). Where a term is not carried there,
      recompute it from the logged inputs; do not start a sim run. Answer three things. (1) Does
      any world term depend on years on supply? Note that `tenure` in switching_propensity.py is
      HOUSING tenure, not years on supply. (2) Is the within-year -0.32 against supply tenure and
      -0.27 against bill size each carried by a term, or by a confound (housing tenure, income
      stress, consumption), shown by holding each term at its book mean as 8dc8dcd97 did on the
      company side? (3) Re-grade the company belief's -0.383 with each dual-fuel account paired
      leg-for-leg or at household level, not whichever leg was scored last (61 of 317 rows). Check
      the result against the published record on inertia and years on supply (CMA 2016 energy
      market investigation, Ofgem consumer engagement surveys; look in docs/market_research/ and
      docs/institutional/knowledge_map.md first). File one finding in docs/staging/ that says
      which: a world-fidelity gap, against the W2 atom that owns departure risk, or a real
      feature the company must learn, against B8_discovered_price_sensitivity_holdout.
    why: >-
      The rate term is the named lever. Fixing it toward the world is only inference if the world
      is right, and the one published anchor (CMA inertia) points the other way. Teaching the
      company a world artefact would be an advantage from a defect, which is the reverse of the
      thesis. DONE when the section (predictions, the per-term table and the re-paired grade) and
      the finding are on origin, and the finding names which atom the next build belongs to.
  - id: the-shared-checkout-reaches-origin-and-stays-there
    lane: H_harness
    what: >-
      First wait on any running tools.surgical_land with tools/wait_for.py (pid 3300519 at
      orientation), and never kill it. Record whether it put a second "EP1 pass 20" commit on
      the shared HEAD after d77ff33d5 was already on origin, with its sha and a byte-diff against
      d77ff33d5. Then clear every path that origin_reconcile's latest NOT_ADVANCED line in
      docs/observability/reconcile-watch-log.md names, by the 2026-09-30 method in
      docs/staging/SEAT_FINDING_THE_ORIGIN_FORK_ALARM_WRITES_THE_FILE_THAT_BLOCKS_THE_FAST_FORWARD_IT_REPORTS_2026-09-30.md.
      Preserve each one first as a refs/preserved/ blob, then use tools.surgical_land
      refresh_to_head; three-way merge any copy with novel bytes and land it. For each path, name
      the writer and the door that left it: which lane or commit wrote the bytes, and whether its
      subject landed from an isolated worktree with the shared copy left behind. Append that table
      to the same finding as a dated 2026-10-01 section. If two or more paths share one door,
      file the mechanism that would have refreshed them at landing time as a map row under
      H_harness, after asking tools.maturity_map_store for headroom.
    why: >-
      At 31 behind, four of ten daemons run code the trunk has replaced. The recurrence is the same
      class as the open untracked-sibling and land-twice rows, and a second hand-clearance without
      the per-path door is a third clearance next week. DONE when shared HEAD equals origin/main,
      `evaluate_boot_sha_drift()` reports behind_trunk empty, and the dated section names a door
      for every path.
  - id: say-what-a-renewal-decision-is-before-ep1-values-it
    lane: B_commercial
    what: >-
      Knowledge first, then the build. Establish from the published record what a GB domestic
      customer's decision points actually are: Ofgem's rules on fixed-term end notices and
      roll-off to the default tariff, exit fees, and the evergreen nature of the default tariff
      (SLC 22C / 22D and the CMA 2016 remedies; check docs/domain_artefact_library/ and
      docs/market_research/ first). Write the result to docs/market_research/ with sources. Then
      read the world's renewal roll in simulation/run_phase2b.py and simulation/customer_events.py
      and record which anniversaries it decides at, and why, against that evidence. Choose the
      reading EP1's H2 tenure horizon needs (per world decision 0.36, per anniversary 0.09, or
      all-cause annual exit ~0.17) and make that change in company/analytics/clv_three_horizon.py
      with a control. If the published record does not settle whether a default-tariff customer
      faces an annual decision, send one NTFY to the director with the recommended reading and
      proceed on it.
    why: >-
      EP1 is the per-customer lifetime value the thesis decides on, and its horizon now rests on a
      hazard with no agreed denominator: a fourfold spread between readings. CLAUDE.md's rule is to
      say what the thing is before differencing it. DONE when the sourced note is on origin and H2
      values on a named reading, or the gap is carried as an explicit None with its reason.
not_now:
  - what: Changing the rate term in enriched_churn_estimate.py, or starting B8's learned price response, now.
    why: >-
      Its direction depends on whether the world's tenure and bill-size slopes are real. A fix
      before the world read could teach the company an artefact, and the read costs no sim run.
  - what: Building PB7's per-channel learning rule.
    why: >-
      8dc8dcd97 showed that a scalar per channel cannot reorder accounts within direct debit, and
      the value arm does not read it. PB7 is released against that finding; building it now moves
      no ranking.
  - what: Re-sending the EP17 four-book pilot ask, or re-running the full ab6 A/B at origin/main.
    why: >-
      The belief still anti-ranks within direct debit. A book-varied or re-pinned run would price
      the same inversion again, and with PB6, W1_14, D27 and EP13 all moved it could not be
      attributed.
  - what: Writing EP1's ledger row (couple_clv --write-ledger).
    why: >-
      It waits on the premise-two-level reds and on the denominator question in item three. A row
      written on the 0.09 reading would be read as established.
  - what: Binding the lane-0 not_done rows, and a heartbeat for the mute worker-seat-manager.
    why: >-
      Bookkeeping and a daemon behaviour change that move no level. The ledger no longer
      misattributes them, and the mute daemon's wait channel is still its ordinary sleep.
  - what: Putting the tenure or default-tariff questions to the director as practitioner now.
    why: >-
      Both may be settled by the published record and a world-side measurement, which cost his
      attention nothing. Item three sends one NTFY with a recommendation only if the record leaves
      it open.
