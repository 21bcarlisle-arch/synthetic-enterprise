focus:
  - id: the-objection-and-qep-runs-measure-the-company-at-head
    lane: B_commercial
    what: >-
      Two long runs are measuring a company older than HEAD. Fix that before either is graded. First read
      tools/decision_probe.py and tools/run_value_cycle_ab.py, and establish whether each one reaches DecisionPolicy.renewal_default_belief,
      or the clean-account price path that ba320e2d2 changed in company/pricing/value_based_renewal.py and
      discovered_price_sensitivity.py. Then, for the QEP value-arms retake: its waiter chain (pids 3008005
      and 3021528, both waiting on pid 2873381) runs in /var/tmp/se-qep-arms. That worktree is based at
      24ece7adb with the QEP re-site uncommitted, and its owner pid 3002863 is dead. If the arms reach the
      changed path, stop both chains before they fire. Copy that uncommitted diff, including the two untracked
      qep_g reports, into a fresh worktree at origin/main. Re-launch the same three-arm run and the three
      floor seeds through background.launch_long_job, and declare the new worktree's owner. For the objection
      probes in /var/tmp/se-objrun, which are the console seat's live run: do not stop them. Write a note
      for the console seat in docs/staging/. It must say whether the probe reaches the changed path, with
      the evidence, and if it does, that the result grades the pre-flip company and the post-flip re-run
      is owed.
    why: >-
      The thesis is graded on these two runs. The objection re-run asks whether, once the world fidelity
      gap is closed, the rule still sits at parity with the flat baseline. The arms retake is what lets
      the QEP world fix land at all. A run on a superseded company yields a number that reads as current
      and is not. ba320e2d2's own message named this constraint, and nothing enforced it. DONE when the
      reach question is answered in writing for both tools, the arms retake is running on a base that contains
      ba320e2d2 (or the note shows it does not reach the changed path), and the console seat's note is on
      origin.
  - id: the-direction-record-lands-on-origin
    lane: H_harness
    what: >-
      The last two direction commits are 543dcff6d and 7234966b2. Both are on the shared HEAD only, which
      is 105 behind origin, and origin's docs/direction/DIRECTION.yaml still reads oriented_at 2026-10-03T14:21.
      Land their docs/direction/decisions.jsonl and docs/status/SEAT_STRETCH_LOG.md rows on origin with tools.surgical_land
      --content. Land this record's DIRECTION.yaml the same way. Do not replay the stale one. Then change
      background/delivery_seat.py so the seat's direction commit is made by surgical_land onto origin/main,
      not as a local commit on the shared HEAD. _push_direction_or_say_why already refuses a diverged push
      and says why, but it has no route that lands. Add one control: in a synthetic repo whose HEAD is
      behind and diverged from its origin, the seat's commit reaches origin. Mutation-prove it. Run it in
      a linked worktree and in the shared tree.
    why: >-
      The direction record is the thing the director reviews, and for two stretches it has not been on
      the branch he reads. The divergence is a standing state of the shared tree, not a moment, so a push
      that refuses on divergence will refuse every time. DONE when origin carries this record and both
      stranded decisions rows, and the next orientation's commit appears on origin without a hand landing.
  - id: a-commit-that-reds-origin-is-named-at-the-commit
    lane: H_harness
    what: >-
      Twice this stretch origin was found red by a later lane. In d9a2f26cc, 14 legs had been red since
      c3939e7b1 repointed a DEFAULT_TABLE. In b660d3a46, the settlement-evidence control went red when the
      world digest moved. Census it first. Run the whole suite once in a clean extract of origin/main,
      backgrounded through launch_long_job with a declared peak. For every red, find the commit that turned
      it red with git bisect inside the extract, and record why tools/pre_commit_test_gate.py did not select
      it: stem mismatch, a data-file subject, or a world-digest dependency. File the table as a docs/staging/
      finding. Then build the smallest selection change that would have selected the largest cause. For
      example, a test that reads a data file is selected when that file changes, or SUBJECT_TESTS gains
      the edges the census finds. Give it one control, mutation-proven. Do not fix reds belonging to another
      lane's live work; list them.
    why: >-
      ba320e2d2 fixed one instance by hand with a SUBJECT_TESTS alias. The class is unrefused, and each recurrence
      costs a later lane a red origin it did not cause, plus a full cycle to clear it. The census says which
      cause is largest, so the fix is chosen by measurement, not by the last instance. DONE when the red-at-origin
      table is on file with a cause for every row and the selection change for the largest cause has landed
      with its control.
  - id: bind-the-three-landed-unbound-lane-0-rows
    lane: H_harness
    what: >-
      Three Lane 0 draws are recorded as landed_unbound: land-the-unlanded-dd-stopping-rule (dd7bbce0f),
      grade-the-payment-history-p-c-legs-on-exit (1dba82e95) and the-value-arm-prices-the-arrears-its-own-ledger-holds
      (e0370bf94). Read each commit against its item. Then run background.delivery_lane --landed <id> --commit
      <sha> where it is the work, or --landed-under or --premise-spent where it is not. Write one line per
