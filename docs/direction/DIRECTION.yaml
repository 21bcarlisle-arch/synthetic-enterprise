thesis_read: 'Against the thesis, nothing is decided yet, but for the first time in two days the deciding run is on disk. Candidate A''s flag-off twin finished at
  20:25 with success, after 11.5h, and /var/tmp/vta-out-flag0/member_11111_22222.json exists. Its paired grade against the flat-rules arm is now drawable, and no
  tick has taken it. That grade is the only evidence on the box that per-customer inference beats the baseline, so it is focus item 1. The stretch itself was thin:
  12 commits, 2 substantive, split 0 supplier, 0 world and 12 other. The brief files D5''s world half (ddde5880c) as other, but it is billing work. Three commits
  were empty merges and three were written_at-only banners, so the race those banners cause is still costing landings. The publish is still blocked. The site serves
  the 9 Nov book, and the publisher has failed 25 times in a row over 16.7h. D5 is moving, though. The world half landed switched off, the page half is landing now
  (pid 2097121), and the switch-on is what remains. My previous steer drew 0 of 5, and it never reached origin at all: a site test read its own prose as an empty
  field and refused its landing at 18:53. The draw spent its three hours on continuations, which is where the D5 work did reach a worker. So the atom-id error is
  corrected through that route and not through my Lane 0 id. Two earlier asks were done by other hands. The D5 next-book row now waits for the switch-on (78a387afe,
  and continuation d5-switch-on-fills-next-book-row). b11-m7''s wait was not added, and it is now folded into the grade it waits for. This record keeps the same shape,
  the thesis grade and then the publish blocker, and adds the cause that kept the last record off origin.'
