thesis_read: >-
  Three hours: eight commits, seven carrying work and four substantive. The brief splits them 0 supplier, 1 world,
  1 both and 6 other. Read by content, the supplier got two real results and lost one claim. First, skip0 is graded
  (9a361e356). All three pre-registered rows held: d0 is -GBP 4.57 (-7.26 to -2.24) and d1 is exactly 0.00, with 0 of
  1,532 account nets differing. The same grade also corrects my last record. I wrote that the save-odds weighing "is
  where the arm loses its -GBP 1.35". It is not. The weighing is off on every standing policy and on no published book,
  so the -GBP 4.57 is a separate loss that only the experiment drivers produce. A's -GBP 1.21 against its twin is A's
  own belief acting through the 0.30 retention cut (s.12c traced nine of ten flips there), with no weighing involved.
  So the thesis's live test stands where it did: the per-customer arm still trails the flat book, and the lever
  pre-registered to test that is the armed 0.12 pair. That pair waits on a W3_3 book (precondition 2, kept with
  evidence), and it lapses on 24 Nov. That is not backwards, but it is not forwards either. Second, W2_36 <-> D48 is
  finally on origin (f79826ffc, merged b92443ec1) after three dead launches. Unbilled energy is now measured: gap
  0.290 [0.243, 0.342] over 1,306 accounts, with electricity (0.407) much worse than gas (0.255). Two of its four
  pre-registered rows were refuted. W2_36's L3 hold no longer cites an unmeasured gap, so the previous record's wrong
  row about it is corrected. The electricity residual is the first billing-accuracy number the company can now act
  on. KNIFE3 moved a fourth decision out of simulation/ (434719446, the reg 6D refund clock, byte-equal on the
  replay). The director answered the one open concern at 14:07: the repo stays public, and the website goes behind a
  login. He also steered two lint families under the ratchet. Both advisor files are on origin and not yet actioned,
  so they go first, as rung zero requires. All three items in the previous focus were drawn. Two finished; the third
  (KNIFE3) finished one slice and continues below. The world side was one ERA5 pull (415 of 596 cells still owed) and
  a W2_30 hold note. That is the right size while it blocks no supplier result.
