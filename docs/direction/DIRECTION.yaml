thesis_read: >-
  The thesis did not move this stretch. The one run that could say whether the per-customer arm
  beats the flat-rules baseline because of its decisions was my item one, and it was never drawn.
  There is no prereg, no launch and no longjob unit for it, while 20 GB was free all stretch. The
  steer bit on items two and three and missed the item that matters. That miss is the drift I have
  to name first. Three hours is short, but the item has no competitor on memory, and this direction
  carries it first again, unchanged in substance. Nothing on the inference side regressed: b9c9092e6
  stops a noise floor from one weather world bounding a figure from another. That is the last guard
  the rerun needs. The machine moved more than the product did. Item three is finished and leaves
  focus. The 26-minute subject gate is one world run: 51 of its 52 files take 242 s, and one
  fixture's main() takes the rest, 45% of it 144 fabric premises (bcb661031). The lever is filed as
  owed work (7fe9157c8), and it becomes item two, because it pays on every landing that selects
  that fixture. Item two is finished on its own terms: the draft is cleared (2fa8dd840). But my
  claim that it was the one path holding the tree was wrong. The census named one class-(c) path.
  The reconcile that followed won the push race, merged as 6166e3af0 and closed the fork, so the
  ahead leg is 0. It then refused the fast-forward on 14 paths of other lanes' uncommitted bytes
  (662da7fd3). The shared tree is 46 behind and its origin_reconcile.py still has no merge_budget.
  So the daemon still runs the 1,500 s timeout. With the fork closed, the fast-forward needs no
  merge. Clearing those 14 paths is in hand now under the seat's own claim, so I do not put it in
  focus a second time. The director's prompt-audit instruction was applied in af39801d1, including
  the check that a stale agent description fails. The before/after measurement for hunks 5–7 is
  owed at Friday's burn review. Nothing is owed him today.
