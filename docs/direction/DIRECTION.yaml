thesis_read: >-
  This stretch the company made its first genuine per-customer commercial decision: the value
  arm priced 263 accounts individually on expected value, and the world gained the ability to
  punish it for getting that wrong -- until yesterday a supplier 200% above the market lost the
  same third of its book as one 25% above, so a flat-rules baseline could be neither beaten nor
  lost to. Against the thesis that is real movement, and the belief-vs-truth gap on price moving
  from -7.8pp to +0.5pp is the wall doing exactly what it exists to do. But the honest read is
  that an inference advantage still cannot be claimed, for two separate reasons and neither is
  small. The two organs the advantage must come from both measure WORSE than no-skill: the CLV
  estimator carries 1.76x the error of simply assigning every account the population mean, and
  the win-rate learning loop is at 1.23x never updating at all -- the company's belief about
  itself is currently anti-informative. And the control it would be compared against is a flat
  £2/MWh margin lifted from `saas/tariff_pricing.py`, while the value arm chose £100-160/MWh on
  213 of 263 accounts; the arms record's own verdict already asks whether an arm beating that
  rule has demonstrated its inference or merely the control's implausibility. So: the machinery
  of per-customer decision exists, the instrument that would tell us it works does not yet mean
  anything, and it reports `fit_to_run: false` on itself. Not backwards -- five atoms
  self-certified to L2 and the price cap, the journal sign and 6,747 phantom drawdowns were all
  genuinely fixed -- but the project is closer to the thesis in machinery than in evidence. Two
  things are drifting. The director named the 117 H_harness atoms twice on 24 August, once at
  20:45 and again at 21:24 ("the map should be half the size and true"); it is still exactly 117
  and nothing has read them. And publishing has been down 11.8 hours with the publish commit
  refusing to land on 12 consecutive episodes against a green scoped suite, so the carbon figure
  he called the entire point of this project is stale on the live surface.
