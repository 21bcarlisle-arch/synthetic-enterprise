thesis_read: >-
  Against the thesis this stretch went backwards in what we can claim and forwards in what we know.
  a189c2824 found that the harness answered a retention offer on a die the noise floor had not re-drawn,
  so an offered leaver stayed about 60% of the time instead of about 5%. That voids every graded
  comparison where offers decide the result: the s.12g family, A4's EP1 grade (20b14f3ed), and, which
  the void list missed, the six-seed ending-term-against-flat arms. Those run on e6be5fec8, which is
  before the fix, and one side offers while flat does not, so the bias runs one way, toward the
  per-customer arm. So the honest position is not "the per-customer arm loses to the flat twin".
  It is that NO valid out-of-sample comparison against the flat baseline exists yet. The decomposition
  backs the director's intuition: on the world's real dice, offering less makes more. The fidelity
  check he asked for came first (cb93f7760): the world's 2021 end-of-fix rise is a withdrawal window that
  starts a quarter late, plus a price term against our own default. Fix 0 is queued. On billing,
  D48's own-season estimate landed default off (11a4387c6), and a won switch's dwelling is now looked
  up (f0c0e7889). But no book has published since 18 Nov. 3d3a8ee691 was refused on 475 invariant breaches,
  now decomposed into five ordered causes, and the cb93f7760c book is in process_run_complete now. The
  commit split was supplier 0, world 2, both 1, other 13. The two world commits were the die fix and
  a dwelling lookup that block supplier results, but the supplier itself got one substantive commit.
  Of the previous focus, 2 of 4 were drawn. D48 landed. The book item retired with its refusal named
  but not published. The four unattributed final bills were never drawn, and that steer is drifting.
  The direction record now reaches origin (48320dc39, 351da8e3f). I am proceeding on the director's
  open row by silence, in the order he was told: fidelity fix first, then one re-grade on fixed code.
