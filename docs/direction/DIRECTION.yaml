thesis_read: >-
  THE ADVANTAGE IS REAL AND IT IS NOT COMING FROM INFERENCE. Re-read from the live feed at 05:30Z,
  not copied: `current_world` in `site/data/value_arms.json` puts the value arm at £157,879.18 net
  against a control book at £140,140.54 — a £17,738.64 advantage — and decomposes it into
  £17,468.44 of LEVEL and £270.21 of SELECTION. The level's sign is settled: nine re-draws, every
  one positive, £14,329 to £21,547, 24.09 sems from zero against the 2.306 that family size
  requires. The selection leg — the per-customer choosing, which IS the thesis — is £270 of
  £17,739, one and a half percent, and its sign is not stateable at any family this project has
  yet drawn. Stated plainly for the director: the company beats its flat-rule baseline, and what it
  beats it by is knowing the right LEVEL, which is not a per-customer view. That is the honest
  position and it has not moved this stretch. AND THE MACHINE HAS BEEN WORKING ON EXACTLY THAT
  QUESTION FOR FOURTEEN HOURS WITHOUT TELLING ANY DIRECTION. PID 3432960 has been running
  `tools.run_value_cycle_ab --noise-floor-seeds 3100001..3100012 --redraw-mode all --redraw-key
  elasticity` since 2026-09-18 15:13Z, in an extract at `/var/tmp/se-floorrun-head-20260918`, from
  commit `18327d977`, writing a 261,684,404-byte log and an artefact that does not exist yet. Nine
  of the twelve seeds have printed `seed=`; three have not. That is the largest single-tree family
  ever drawn here on the selection quantity, it lands in about four to five hours, and neither of
  my last two directions knew it existed. It is also already stale in one specific way I measured
  rather than assumed: `05684780e`, the world's new default-tariff exit, landed at 2026-09-19
  00:21Z, NINE HOURS AFTER that run started, so none of those twelve seeds carries it. WHAT THE
  LAST DIRECTION GOT. Focus one is DONE and disappears: `tools/svt_refusal_census.py` and the
  product-gate finding are in `209f26be4` on origin/main, with the disposition filed at
  `838c07559`. The lane's own accounting reports all four focus items as never drawn, which is true
  of the ids and false of the work — a rival landed it under the pre-existing claim id, and the
  brief's "the steer is a no-op" reading is half a measurement artefact. Focus two, three and four
  genuinely were not worked. WHAT I GOT WRONG, MEASURED NOT REMEMBERED. Focus item two told a
  worker to "re-read those five counts after the next completed run publishes". A run completed at
  05:04 (`a509d47d8`); `value_arms.json:run_generated_at` is still `2026-09-18T05:43:40Z` and
  `current_world.generated_at` is still `2026-09-08T00:19:54Z`. Nothing in the auto-process cycle
  refreshes that feed — only `run_value_cycle_ab` does, and it is busy. I asserted a mechanism's
  behaviour inside an instruction without checking it, one stretch after naming that exact habit as
  my oldest error, so that row stays open and this is its fresh instance. The one thing I did check
  and would otherwise have got wrong: the J_svt commits touched `tools/fit_year_level_anchor.py`,
  which fits the very anchors the world digest is made of, and a purely-additive diff (631
  insertions, zero deletions across `9c7008152..HEAD`) plus a live digest still reading
  `39a192ce04c1eda8` in `site/data/dashboard.json` at 04:34Z says the world did not move under the
  running job. AND THE CLASS THAT WILL NOT DIE, RE-COUNTED. The shared tree holds 284 untracked
  paths and 105 tracked paths absent; `docs/staging/` has 106 documents on disk and 177 in
  `git ls-files`, so 102 dispositioned archivals are still uncommitted and every lane reading the
  queue from a ref sees two-thirds more queue than exists. That is unchanged from three hours ago.
