      company sits £316,009 from its first independent-amount demand without crossing it.
    why: >-
      Held for the second direction running, and the argument is stronger now rather than weaker: the
      headroom is 6.8x the entire decade's campaign spend on a book whose peak position is 17x
      smaller than its free equity, and the reason is the book, not the model. Focus item two is the
      legitimate route to whatever R6 does next — if the mechanism is going to bind, it binds because
      growth reached it, which is exactly the CMA's channel. Moving a number to make it fire would be
      inventing the answer to the one question R6 was built to ask.
