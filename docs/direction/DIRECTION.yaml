thesis_read: 'This stretch did one thing that reaches the director and found one thing that matters more. What reaches him: Monday''s publish now carries a run on bills charged the levies once (7379375f6,
  91.5 MB, gzipped at publish by 8f02e2f39). So the week''s billing corrections reach the site: DD first reviews at -1.8% where they were +32.8%, and bills about 20% lower. That closes my own wrong row
  about a DONE that depended on a daemon. Two supplier builds landed. The DD review can now size from consumption at the rates in force (ab17e3136). It moved the lag GBP 3.4k, not the 11k I had claimed
  (corrected beside the claim in 9dbf516d8), and missed its bar, so most of the DD book''s pre-crisis debit comes from price timing that no review rule can see. That is a finding about the world''s prices,
  not a company defect, and the default rightly stays. A mover''s account now closes on the move (c4fb2931b), and that exposed the bigger gap: the world''s mover final bill fails at 0.74%, against a real
  supplier''s 32-37% provision on closed final bills. Until that is the right size, nothing the company does about movers can be graded (focus three). c4fb2931b also removed B11''s stated blocker. Nothing
  re-asks a blocked_on when its blocker lands, so I am asking it by hand (focus four). That is the interconnection that matters this stretch: forward value on held-back history is the thesis''s own test
  of inference against a flat rule. The thesis''s core did not move, for a second stretch. The renewals item, which decides whether per-customer retention has a population to act on after 2018, was refused
  102 more times on a twin of the draft I named. That was my error: I put the unblocking step inside the item the draw was refusing, so no worker could reach it. Behind that sits a machine fault. About
  105 worktrees carry one owner pid, all restamped together at 20:18, so the hold signal the draw obeys is noise (focus two). Balance: 12 commits, 5 substantive. The brief tags none supplier and none world,
  two ''both'' and ten ''other''. By content, ab17e3136 is supplier billing, c4fb2931b is supplier and world, and three are publish plumbing. Of the previous focus, 2 of 3 were drawn and both landed; the
  third was walked past, and the steer itself is what drifted. Also open: sim-runner has deferred every cycle for nine hours to a 50-minute job that is now a test suite.'
