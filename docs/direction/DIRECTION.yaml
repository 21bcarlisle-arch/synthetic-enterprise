focus:
- id: skip1-is-graded-against-s12es-branches
  what: 'skip1 has read: /var/tmp/vts-driver/read_threshold_skip.skip1.out exists, rc=2, with SYN-2016-581
    and SYN-2016-468 (seed 11111) absent or unlogged. First, establish why, from /var/tmp/vts-out-skip1/control_11111_22222.json
    and the reader /var/tmp/vts-driver/read_threshold_skip.py. Either the household had left before the
    flip date (then it is not re-offered by construction and the reader should say so, not exit 2), or
    the log dropped the row (then it is a logging defect: name it). If it is the reader, fix the reader
    and re-run it on the SAME files, as s.12e requires. Then write s.12f in docs/design/THE_VALUE_TEST_REDESIGN.md:
    k against s.12e''s table, every s.12e row marked held or missed, and the bound stated (k <= 2 even
    if both missing flips were re-offered, so REFUTE whatever they say). Record the value-arm money: skip1
    minus A is -GBP 4.57 (-7.26 to -2.24), and skip1 minus its twin is -GBP 5.77. Do NOT launch launch_hold_pairs.sh.
    Before skip0 reads (about 12:30Z on 19 Nov), pre-register in s.12f what skip0 minus A will show if
    the loss is the skip''s, and what it will show if it is the weighing''s. Then pre-register the next
    lever, the cut''s own scale (s.12e''s amended REFUTE text: 0.30 on calibrated units, or a cut on rank),
    with its bar written before any build. Never kill the running skip0 unit. When /var/tmp/vts-out-skip0/control_11111_22222.json
    exists, read skip0, grade the attribution in s.12f, and delete the skip-pair null row from background/next_book_requires.yaml
    so the W3_3 book builds next, alone. Carry `Graded: value-test held=<n> missed=<n>`.'
  why: This is the thesis's live test, and it has just ruled out its first lever on a bound while costing
    GBP 4.57 a household-year. The two missing flips decide whether the reader or the run is wrong. skip0
    decides whether the loss is the skip's or the weighing's. Neither the AUC 0.333 row nor the -GBP 1.35
    row can move without both. Done means s.12f is on origin with skip1 graded (or the reader fault named
    and re-run), skip0's attribution read against a prediction filed before it, the next lever pre-registered,
    and the null row gone.
  lane: B_commercial
  side: supplier
  written_at: 1795047936.357
- id: e7-fix-to-svt-crossing-bills-are-counted-then-caused
  what: 'Work docs/staging/WORKER_FINDING_AN_E7_FIX_ROLLING_TO_SVT_MID_PERIOD_IS_CHARGED_ABOVE_EVERY_RATE_IT_WAS_SOLD_AT_2026-11-18.md
    on the book already on disk (run_output_6af7fd0bfd, the published one). Do not build a book. First
    the denominator: count every E7-to-SVT crossing bill period in the billing ledger and grade each as
    AGREED, BOUNDED or DISAGREED by the validator''s range. Before reading the biller, pre-register in
    the commit message which line carries the excess. The candidate the finding names is the network-and-policy
    line added on top of an SVT stub energy line that already carries it. Then read the biller''s term-crossing
    path in company/billing/, name the cause, and fix it if it is the company''s. If the validator''s
    crossing ceiling is what is wrong, say so instead, fix the validator, and keep the bill. Separately,
    grade PROS-2021-0313''s SVT rate of 25.4557 p/kWh against the published 25.41 p/kWh. Say whether it
    is a rounding or pro-rating artefact or a charge above the cap level, and fix it if it is the latter.'
  why: Billing accuracy is the director's first supplier priority. A customer charged more than every
    kWh at the highest rate they were sold, or above the cap, is value transferred and not created, which
    is M2's failure exactly. The finding has no atom and no owner, and it is the only post-publish reader
    red. Done means the crossing periods are counted with their grades, the cause is named, the fix (biller
    or validator) is on origin with a test that names the defect, the cap row is graded, and the reader
    red is gone on the next verified publish.
  lane: D_billing_metering
  side: supplier
  written_at: 1795047936.357
- id: KNIFE3_wall_crossing_paydown
  what: 'Take the next supplier DECISION still living in simulation/ from docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md.
    Exclude the retention guard''s _would_offer in simulation/run_phase2b.py, which the value test is
    measuring until skip0 reads. Prefer a billing or home-move row (a final-bill, back-billing or unbilled-energy
    choice). Move it into company/ the way 1c5351d18 moved the dual-fuel close set-off: it decides from
    the supplier''s own ledger, and the world keeps only the event and its timing. Before writing, run
    the write-time gate with --explain and carry the REUSE block. Pre-register a pure move: the regenerated
    output on run_output_8a300fa561 is byte-equal on every affected field, and any differing row refutes
    it and is named. Mark the register row moved, with the commit.'
  why: The advantage must come from inference, never from access. A supplier decision computed on the
    world's side of the wall is access by construction, and it makes any per-customer result unattributable,
    which matters more now that the value arm is losing and we need to know why. It needs no box time.
    Last stretch it was in focus and was never drawn, so this is a re-issued steer. Done means one more
    register row is moved and byte-equal on the replay, and KNIFE3's map row records it.
  side: supplier
  written_at: 1795047936.357
