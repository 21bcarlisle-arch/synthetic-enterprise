focus:
  - id: the-dd-estimate-changes-no-published-number
    what: >-
      **Establish whether the opening direct debit estimate has any consequence at all in the run,
      and if it has one, put it on a surface. Nothing else in this file matters until this is
      answered.** Start from the measurement, do not re-derive it: publish `1c4f64733` (run at
      `4013b1de1`, before `company/billing/annual_consumption_estimate.py` landed at 9760fc7a5) and
      publish `b6b3c3fa8` (run at `19f226e46`, after) carry identical net margin, gross, capital,
      treasury start and end, enterprise value, net after CTS and bills issued. Three acts, in this
      order.
      (a) **Run the book twice over one seed** — direct debit opened from
      `opening_monthly_amount`, and direct debit opened from the flat rule it displaced (the first
      issued bill, `seq[0][1]`) — and diff the two run outputs *whole*, not by headline. Report
      which keys differ and by how much. If the answer is "none", say so plainly; that is a
      finding, not a failed experiment.
      (b) **Record what separates the two arms per account**: the distribution of end-of-year
      balance drift with credit and debit shown separately and never summed as one absolute; the
      count of accounts whose estimate resolved to an honest `None` and what the arm does with
      those; the count where both rules chose the same amount; and the split **by which basis each
      estimate came from**.
      (c) **If (a) shows nothing published moves, the repair is the surface, not the organ.** The
      headline treasury end equals treasury start plus net margin exactly, so the published cash
      figure cannot express payment timing. Establish whether that is an accounting identity in
      `saas/reporting/annual_report.py` or a coincidence of this book, and then publish the thing
      that does move — per-account opening amount and balance drift, the two arms side by side —
      **with its clock attached and with the bound its sample size earns**, because a new published
      figure without a basis label is what the basis gate exists to refuse. "We cannot yet tell the
      two arms apart" is an acceptable published result; a figure without its bound is not.
    why: >-
      The thesis says the advantage must come from inference and that there must be a baseline to
      beat or "it performed well" means nothing. The flat rule IS that baseline, it is sitting in
      the code this organ displaced, and it will never again be this cheap to run against. And the
      measurement above says the organ currently clears that bar by exactly zero on every figure a
      reader can see — which means either it does nothing, or we publish nothing that could tell.
      Both answers are worth having and neither is known today. Finished when both arms exist as
      runnable code over one book, the per-basis and per-account counts are stated, and a reader can
      see the difference — or a named refusal saying the book cannot carry the reading — on a
      surface that carries its clock.
  - id: the-declared-precedence-is-twice-the-reachable-one
    what: >-
      **Make the estimator's declared precedence and its live reachable set the same set.**
      Measured, not assumed: `BASIS_ORDER` in `company/billing/annual_consumption_estimate.py:81`
      names four rungs — `METERED_HISTORY`, `REGISTRY_EAC`, `CUSTOMER_DECLARED`, `TDCV_TYPICAL` —
      and the sole production caller, `_opening_dd_by_customer` at
      `simulation/run_phase4c_on_phase2b.py:160-166`, passes `as_of_iso`, `commodity`,
      `registry_eac_kwh` and `band` and nothing else. Two of four rungs cannot be entered on the
      live route. Settle it in one direction and land the evidence either way. **Check the
      epistemic wall on every input before you widen it**: at registration a supplier holds registry
      data and whatever reads it has taken, and NOT a year of half-hourly consumption — so if the
      honest answer is that metered history does not exist at the instant the direct debit is set
      for most accounts, that is the finding, and the repair is to make the unreachable rungs
      unreachable *by construction*, with the reason beside them, rather than leave a precedence
      that reads four deep and walks two. If a subset of accounts genuinely does hold prior
      metering at that instant, supply it for those and say how many.
    why: >-
      "The advantage must come from INFERENCE, never from ACCESS." A registry EAC and a typical-
      consumption band are both numbers handed to the company; metered history is the only rung in
      that list the company would have to reason from — and it is one of the two that cannot be
      reached. A precedence whose top branches never execute reports a constant verdict, which is
      the failure class this machine catalogues more often than any other, and here it is doing it
      to the module the thesis rests on. Finished when the declared set and the walked set are
      identical, whichever direction that is settled in, and a test fails if they diverge again.
  - id: the-false-licence-citation-is-still-served
    what: >-
      **Finish the correction to the false licence citation: it reached two of seven places and one
      of the five it missed is served to readers right now.** `git grep -n "SLC 27B"` returns the
      negation, correctly, in `company/billing/dd_review.py:17` and
      `company/billing/dd_review_runner.py:50` — and it is still asserted **as fact** in
      `docs/design/simplifications/DD_seasonal_cashflow_physics.yaml:5`,
      `docs/PROJECT_OVERVIEW.md:5451`, `docs/claude/phase-history.md:591`,
      `docs/design/M2_PAYMENTS_AUDIT_DD_RAILS.md:15`, and twice in
      `docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md` (lines 2908 and 3648). The first of those
      is the one that reaches a reader: its text is served verbatim, and `site/data/simplified.json`
      **on origin** contains `27B` today. Replace each with the established position — the duty is
      SLC 27.15, the ±5% band is a modelling convention of ours, and there is no SLC 27B — citing
      `docs/market_research/what_a_supplier_holds_to_size_a_direct_debit.md`. **Do not simply delete
      the string**: check that what replaces it says the right thing, and verify on the served
      artefact after a publish, not in the source. Leave the occurrences in
      `site/data/delivery.json` and this file alone — those are the record quoting its own
      correction, which is the record working.
    why: >-
      One legal claim, seven implementations, corrected in two — the exact shape CLAUDE.md holds up
      as this project's most expensive recurring defect, with the VAT rule as its named evidence,
      and it has now survived a second stretch after that rule was restated. It is a false statement
      about the law published under Poesys's name, which is the one category of public claim we hold
      ourselves to be careful about. It ranks third because it is cheap and bounded, not because it
      is small: whoever takes item 1 can finish this in the same pass. Finished when the five source
      files carry the SLC 27.15 wording and `27B` does not appear in `site/data/simplified.json` on
      origin.
