focus:
  - id: the-publish-loop-is-rejecting-its-own-push-and-widening-the-fork-it-rejects-over
    what: >-
      **Lane 0. Stop the publisher manufacturing the divergence it is blocked by, then make one
      history.** Measured this orientation after `git fetch`: `git rev-list --count
      origin/main..HEAD` = **3**, `HEAD..origin/main` = **23**. Two of the three local commits are
      `Auto-process run complete` — produced by the very loop whose push is refused. The publisher
      log names the cause exactly: `! [rejected] HEAD -> main (non-fast-forward)` … `Updates were
      rejected because the tip of your current branch is behind its remote counterpart`, then
      `throttle left untouched, will retry next cycle`.
      **First, the ordering, and it is the whole item: integrate BEFORE the next publish commit is
      created, not after.** The reconciliation is `python3 -m tools.surgical_land` — never
      `git merge`, never `git pull`, never `git checkout <path>`, never `git stash`, never
      `--force-with-lease`. Three lanes have uncommitted work in this tree right now and the wall is
      not negotiable. The third local commit, `fe3b78009`, is a finding that exists nowhere else —
      it goes onto the trunk, it is not discarded. Where a locally-modified file turns out to be a
      superseded draft of what is already upstream, take the upstream copy and record that you did:
      `background/fork_salvage.py` and `background/fork_reconciler.py` were confirmed instances last
      orientation and the tree still shows both modified.
      **Second, the leg that stops it recurring, and it is one leg.**
      `background/process_run_complete.py` treats a non-fast-forward rejection as a transient to
      re-attempt identically. It is not transient — it is a *state*, and the retry deepens it.
      Make the publish path, before it commits, refuse or integrate when `HEAD..origin/main` is
      non-zero, and say which on the surface. **Mutation-prove it against a behind-origin tree**; if
      it does not fire, establish whether that is a missing test or an equivalence and do not assume
      the flattering one.
      **Third, confirm with the only evidence that counts**: `git rev-list --count HEAD..origin/main`
      reading zero, and an `Auto-process run complete` commit visible on `origin/main` with the site
      snapshot moving. The wedge detector counts refusals, not intentions.
      **What does NOT happen here:** no watcher over the publisher, no divergence register, no
      dashboard panel. Two commits of evidence justify one leg.
    why: >-
      First, because it is the only item on this list that is getting worse while nobody touches it,
      and because it is the reason nothing else in this file can reach the world. Every surface the
      publisher regenerated in the last nine hours is local; the public page serves a snapshot; and
      the loop's own retry is what keeps the fork ahead of the reconciliation. My last direction
      ordered the landing and did not order the engine stopped, so the landing target moved every
      twelve minutes — that is my defect, not the tick's. **Done means:** `HEAD..origin/main` reads
      zero; `fe3b78009` on the trunk rather than discarded; a publish commit demonstrably on origin
      with the live snapshot moved; and one mutation-proven leg that makes a behind-origin publish
      refuse or integrate instead of committing-then-being-rejected. If the output is a document
      rather than commits on origin and a failing assertion, it has not been done.
  - id: the-disposition-said-the-control-landed-and-it-is-in-no-commit
    what: >-
      **This is minutes, not a stretch. Do it, then go to item three.** Verified this orientation:
      `tests/tools/test_a_published_surface_is_reproducible_from_its_committed_input.py` is
      **untracked — `git log --all` returns nothing for it** — as is
      `docs/staging/SEAT_DISPOSITION_THE_PUBLISHED_CUSTOMER_SURFACE_AND_ITS_MISSING_INPUT_2026-09-01.md`,
      which asserts under *"What landed"* that the control landed and was mutation-proven three ways.
      Both sit on disk in a shared tree with daemons writing to it, one `reset` away from being gone
      with no reflog. **Land them, by pathspec, together** — the control and its own disposition, so
      the claim and the code arrive in one commit.
      **Then re-run the measurement before believing either.** The disposition's core claim is that
      `docs/reports/run_output_latest.json` was repaired so the property is true at the commit it
      lands in. That was 00:21; the publisher has rewritten `run_output_latest.json` on every cycle
      since. **Run the control at the commit you are about to make, not at the commit the disposition
      was written against**, and if it is red, the honest finish is to land it red with the
      blocking-set decision recorded — not to hold it back until it is green.
      **Then grade the record.** The disposition states the finding's open question is answered: the
      published 164-household surface is honest and the *committed input* was a stale interconnector
      probe from `e9cdef112`. If that survives re-measurement, say so and archive the BLOCKING
      finding properly. If it does not, the disposition's own conclusion is the thing to correct,
      beside the claim, and it stays open.
      **The class, in one line and no more than one leg:** a staged disposition can describe work
      that is in no commit. If a cheap assertion can make a `SEAT_DISPOSITION_*` naming a landed
      artefact fail when that artefact is untracked, write it. If it cannot be made to fail, say so
      and write nothing.
    why: >-
      Second because it is the cheapest permanent close on this list and because it is currently
      making the record lie about a live public surface. `site/data/customers.json` publishes 164
      households; the tree cannot derive them; the finding is one of two BLOCKING; and the staging
      root says it is disposed of. Everything the seat does rests on dispositions being true — I read
      that one this orientation and would have carried it forward as done. It is also the same defect
      as item one seen from the other end: there, code that never reached origin; here, a claim that
      never reached a commit. **Done means:** the control and its disposition in a commit that is on
      origin; the control run at that commit and its verdict stated whichever way it falls; the
      BLOCKING finding either archived with the measurement beside it or explicitly still open with
      the disposition's conclusion corrected; and at most one leg against the class.
  - id: the-svt-route-still-cannot-see-the-market
    what: >-
      **Give `svt_inertia_hazard` a parameter the market can arrive through. The measurement is done,
      the refusal is built and keyed to the property, and it lifts by construction the moment the
      parameter exists.** Confirmed unchanged this orientation:
      `simulation/departure_risks.py:175` still reads
      `def svt_inertia_hazard(*, years_on_svt: float, segment_days: float)` and nothing else, while
      every renewal-route hazard already carries `market_switching_multiplier` — the record's own
      level ratio inside 2016-2025, live in fourteen modules. **Read that existing mechanism before
      minting a second one.** Read `18a09617d` on `origin/main` first: three predictions filed before
      measuring, all three confirmed — Spearman **-0.26** between the SVT floor and the published
      midpoint 2017-2024 (near zero, wrong sign); at the bottom of both published bands 2022's floor
      is still **8.99%** against the record's **4.30%**, needing the pair scaled to 0.354x where the
      band bottom is only 0.750x, so it is a mechanism result and not a constant at the wrong end;
      CV ratio **0.336** where the record swings **5.3x**.
      **Knowledge first, and the world's own source already answers it**: `svt_rates` §3 —
      *"customers did not voluntarily churn: no competitive fixed alternatives existed"*. Establish
      from `docs/domain_artefact_library/` and `docs/market_research/` what the published record says
      suppressed switching in 2022 — whether there were acquisition tariffs to switch *to* — and
      write it down with its source **before any term is written**.
      **Pre-register the predicted MOVE per year, never an invariance**: an invariance measured on
      the old code embeds the defect being removed, and this project has paid for that class. Grade
      on `tools/departure_population.book_departure_level` — the one implementation both instruments
      read — and print all ten years at real inputs beside the prediction, not the year you aimed at.
      Then re-run the whole-book anchor re-fit and report whether the refusal lifted.
      **Never a widened band, never a clamp on 2022, and it must not finish with a fitted constant.**
      Two things do **not** happen in this commit: re-pointing
      `tests/architecture/test_switching_rate_commons.py` off its renewal-only subject, and repairing
      `population_anchor._churn_by_year`'s blindness to 2022 by inserting a `sim_churn_rate` of 0.0 —
      that publishes a measured zero-churn crisis year; fail-close its five arithmetic consumers
      instead.
    why: >-
      Third on this list and **first in value** — the only item here that moves fidelity rather than
      plumbing, and it has now been third or later for four orientations while the machine repaired
      itself. That is the drift I am naming, and it is mine. The company's advantage must come from
      inference about a world that can press back, and **61% of departures** run through a route that
      runs the same 0.20/0.10 through the 2020 switching peak and the 2022 collapse alike. Every
      belief graded on that population is graded on a mechanism the record contradicts most sharply
      in the year the record makes unmistakable. It blocks real work now: with both routes sharing
      one anchored total they are zero-sum, so the SVT route's market error lands in the renewal
      anchor — 2023's floor consumes 12.43 of the 12.50 available and the fit returns **0.03**,
      near-total extinction of the one route the company can actually price against. And the
      anti-flattering tie-break that put the SVT floor at the top of its band **became a flattering
      choice** the moment the denominator was unioned, because a higher SVT floor hands the company
      less churn on the route it can price. **Done means:** the record's own account of 2022 written
      down with its source before any code; the predicted per-year move filed before the run; the
      term landed and the ten-year table printed at real inputs beside the prediction; and 2022
      either inside its band for a stated mechanical reason, **or explicitly still out with the
      reason named on the surface** — *"the world departs 12.09% in a year the record says 3%, and
      here is what we have not modelled"* is an acceptable and better finish than a number that fits.
  - id: a-focus-item-stood-down-six-times-is-a-steer-that-does-not-reach
    what: >-
      **Read `docs/observability/seat-executor-log.md` before deciding anything here — it is the
      evidence and it is unambiguous.** Six consecutive ticks, 23:35 through 02:05, each identical:
      *"STOOD DOWN: an interactive seat is live and
      'the-tree-has-two-histories-and-every-alarm-reads-the-shorter-one' was not handed off to a tick
      — a re-derived focus item may be work that seat is already part-way through."* Two and a half
      hours in which the top-ranked Lane 0 item was re-derived, recognised and declined, every time,
      for the same reason, with nothing anywhere counting the repetition. **The guard is right and
      its termination is missing**: standing down once because a live seat may be mid-work is
      correct; standing down the sixth time is the guard asserting a hypothesis it has never checked.
      **Take the decision and record which**: either the stand-down escalates after N consecutive
      declines of the *same* item — NTFY, per `background/recommendation_guard.py`, never a question
      in the interactive pane — or the handoff store is written when the item is re-derived so a
      later tick can take it without re-deriving. **Recommend the second and say why if you choose
      otherwise**: a stand-down that pages is still a stall wearing an alert's clothes.
      **Key the leg to the property, not to today's answer.** The property is *"a focus item declined
      for the same reason repeatedly is not being worked"*, not *"this item is stuck"*. Mutation-prove
      it; a leg that cannot go red against six identical stand-downs in a fixture is not a leg.
    why: >-
      Fourth because the evidence says work still reaches the trunk despite it — three commits on
      `origin/main` this stretch are titled after my last direction's items — so it degrades the
      steer rather than severing it. But it is the fourth consecutive orientation at which I have
      reported focus items named and the drawn-count reading empty, and each time the mechanism was
      one layer further in: nothing converted a focus item to a handoff, then the brief read the
      shorter history, now the conversion exists and declines to fire. **The steer itself is the
      thing drifting, and the pattern is that each repair reveals the next gate rather than a working
      route.** **Done means:** the decision recorded either way with its reasoning; the chosen
      mechanism landed; one mutation-proven leg keyed to repeated identical stand-down rather than to
      this item's name; and the executor log showing a subsequent tick either taking the item or
      escalating it, not declining it a seventh time. **No register of stand-downs** — a counter and
      one branch is the whole mechanism.
not_now:
  - what: >-
      Clearing the wedge the fast way — `git reset --hard origin/main`, or `git pull`, or a
      `--force-with-lease` push — on the grounds that only three local commits stand in the way and
      two of them are regenerable auto-publish artefacts.
    why: >-
      It is the fastest route and it is the wall, twice over. `reset --hard` and `checkout` destroy
      three lanes' unstaged work in this tree with no reflog to recover it, and `git pull` on a dirty
      shared index is exactly what sweeps another lane's hunks into a commit nobody wrote. The third
      commit, `fe3b78009`, is a finding that exists on no other ref — "only auto-publish commits"
      is true of two of three and the exception is the one that matters. Minutes for the legal route
      against an unattributable loss, where the evidence destroyed is the evidence needed to notice.
  - what: >-
      A watcher, register or dashboard panel over the publish divergence — something standing that
      reports ahead/behind and the publish-gate failure streak continuously.
    why: >-
      117 harness atoms and 34 alarm documents are what the census instinct has already cost here,
      and the divergence surface leg landed on origin this stretch (`16fe54aa4`) — the reader is
      already told. Item one ships one leg against the specific shape that demonstrably happened, a
      publish that commits while behind origin, plus the reconciliation that removes the cause. A
      control that mostly guards our own controls is not worth its upkeep.
  - what: >-
      Working the staging root down — 72 files, 47 open findings, 41 LATENT — before taking new work.
    why: >-
      Sharper reason than last orientation, and it now cuts the other way for one file. An untracked
      "what landed" claim in one disposition means the queue's dispositions cannot be trusted by
      reading them, and a sweep that archives on the strength of a disposition would bury exactly the
      class item two is about. The sweep is cheap and honest *after* item two establishes whether
      that instance is unique or a class; before it, it is a shredder.
  - what: >-
      Measuring what fifty departures can resolve — the permutation sweep from chance to the 0.6091
      oracle, to establish whether 0.5482-inside-its-null means the company finds no signal or that
      nothing short of the oracle is detectable at n=50.
    why: >-
      Out for a third orientation and the reason has hardened again. `18a09617d` did not merely find
      the SVT route insensitive to the market, it **refused the whole-book anchor re-fit** until the
      mechanism changes. Characterising the resolving power of a population whose departure mechanism
      the record contradicts, against an anchor the tree itself declines to fit, would establish what
      a broken world can resolve. Item three is what makes the question answerable, and it is cheap
      the moment it lands.
  - what: >-
      Re-pointing `tests/architecture/test_switching_rate_commons.py` off its renewal-only subject,
      and repairing `population_anchor._churn_by_year`'s blindness to 2022, alongside item three.
    why: >-
      Both are real and both are named inside item three as things that must **not** happen in that
      commit. Rewriting what a control measures inside the commit that repairs the measurement makes
      the move unattributable, and this project has paid for that class more than once. A separate
      day's work immediately after, and cheap then.
  - what: >-
      Starting generative futures — running the world past 2025 — and giving `sim_satisfaction` a
      driver that income stress cannot explain.
    why: >-
      Both wait on item three and neither is idle-worth. A generated world is the first place the
      company's predictions meet something the model was not fitted against, and that prize is worth
      nothing while the in-sample departure level reads out of band in eight years of ten. The
      satisfaction driver cannot move the route item three is about at all: the SVT hazard is
      `svt_inertia x action_propensity` and carries no satisfaction term. It stays a genuine rung-3
      defect blocking `C3_satisfaction_heterogeneity`, and it returns when choice-and-channel is
      genuinely next.
  - what: >-
      Re-running the value-cycle floor decomposition against the 31 August legs — the artefact
      asserting `larger_settled_book_would_resolve_it: True` beside a `selection_sem_gbp: 0.0`.
    why: >-
      Dropped twice and it stays dropped for the same sharpened reason: its two legs were produced by
      different commits, and "different commits" here has meant *different histories* for a day.
      Re-reading it before the tree has one trunk produces a third number nobody can reproduce. It
      comes back the moment item one lands, by which point it is compute already spent.
