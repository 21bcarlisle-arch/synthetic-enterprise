thesis_read: 'The per-customer view now aims, and the lever it aims does not work. 19 commits, 16 carrying
  work, 7 substantive. The brief''s split (1 supplier, 3 world, 1 both, 14 other) is by file. Of the 14
  ''other'', the section 12 and 13 grades are supplier and five are world grades or records, so the world
  still had more commits than the supplier. That is defensible only because those world builds (the shortfall
  shared on the month''s demand, now default on at 5c0eeeb48; money held toward a bill as a part payment,
  seed 1 graded) are what the BLOCKING crisis bad-debt finding waits on. All three items in the last focus
  were drawn. Two landed: the retention guard weighing its save odds (0674199b8, graded 67186eb59) and
  the bad-debt belief read by vintage (793989589). D48''s practice-or-defect table did not land. No level
  moved. WHAT IT MEANS. (1) Inference: with the shrinkage prior, the ending-term belief keeps its aim
  in the run (AUC 0.806 [0.745, 0.860], a7fc5c728) and the 2017 fix-end multiplier reads 1.215, not 3.39.
  So the K2 defect is gone and the company now ranks leavers using only what it holds. (2) Lever: at the
  roll it priced, a retention offer kept nobody: 0 of 37 in section 7, and 0 of the 32 offers section
  13 withdrew. The company''s save rate read 0.19 all the same, because it is 1 minus observed over expected
  on offered accounts. That measures the belief''s calibration on the offered tail, and the code''s own
  docstring says only a holdout separates the two. (3) Money: section 12''s +GBP 810 over section 13 came
  from five stayers whom the discount moved onto a fix that later cost them more than the default. Under
  M2 that is transfer, not creation. So on this seed the only money per-customer retention made against
  flat was taken from households who were staying anyway. That is backwards against the thesis, and it
  is the most important thing this stretch found. Against flat the result is a tie (+GBP 111 for section
  12, -GBP 699 for section 13), on one seed. (4) Billing accuracy: 187c2a999 found that a dual household
  which leaves on its electricity leg goes on being billed gas for 82 to 345 days. It bisects to c136809f53,
  the commit that made the book 73.6% dual. Every arm since then bills energy to households that have
  gone and books debt on accounts nobody holds, so it comes first. (5) The bad-debt belief can no longer
  go negative. It is fixed as a class at both doors (793989589), and its before/after table on the net
  arm is running (probe r2; the first probe died on an import path). (6) The ''director inputs'' in this
  brief are not his. They are a peer session''s cross-session messages, recorded as his console. They
  are listed in wrong and treated as data.'
