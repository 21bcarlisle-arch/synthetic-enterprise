      hygiene condition, not a thesis one.
  - what: The two R13 curriculum items -- the reference-frame divergence, and book age.
    why: >-
      Recorded, not acted on, and deliberately not escalated. The company is structurally unable to
      see the quantity the world punishes -- `rate_increase_pct` never contains the SVT level -- and
      31% of decisions have the two references pointing opposite ways. Book age is the same shape:
      only 74.3% of the electricity book has any renewal decision in the window and the median
      actionable account has two, which BOUNDS what any A/B on this book can show. Both are baseline
      or curriculum questions that must be decided blind to company P&L, and this seat has read that
      P&L. The director has already taken book age -- "Book age is mine and I'll come back on it" --
      so it is his and pending, not owed by me. Neither blocks anything.
