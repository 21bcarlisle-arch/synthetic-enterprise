      changed the arrears engine and the gas bill, so a baseline from there answers nothing. THEN
      pin ONE commit at or after 6f83977ca, in a clean detached worktree under /var/tmp, and run
      three runs there one after another, never together, each launched with setsid via
      launch_long_job: (a) the write-off rule as HEAD has it; (b) leg 4b of
      simulation/arrears_engine.py wired with the failed-DD stayer's bucket as an explicit
      parameter set to "still in DD"; (c) the same parameter set to "fallen out of DD". Both rates
      come from docs/market_research/dd_failure_basis_and_live_arrears_provision_rates.md. There is
      no default, and the C1 gap is named in the code. File the pre-registration for (b) and (c)
      in docs/staging/records/ BEFORE (a) launches. Send the director ONE NTFY in practitioner
      form, with your recommendation: "does 35% read as a first-presentation bounce rate or a
      net-of-retry unpaid rate?" Verify it by the returned id, not the log.
