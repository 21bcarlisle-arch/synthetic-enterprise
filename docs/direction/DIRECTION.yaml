  - id: land-the-unlanded-dd-stopping-rule
    lane: W2_customer_generator
    what: >-
      Land PB8's supplier-authored DD stopping rule. It is built and uncommitted in the shared tree, and
      its holder, pid 2590080, is dead. The paths are company/billing/dd_collections_desk.py, simulation/dd_collection_book.py,
