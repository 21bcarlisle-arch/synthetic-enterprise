focus:
  - id: land-the-run-path-that-produced-this-mornings-figures
    what: >-
      Land or revert the uncommitted run-path work, and then prove the published book reproduces from
      the resulting HEAD. Check HEAD first — nine directions have named this and a lane may have
      landed it. If `simulation/settlement_clocks.py` is still untracked, the pathspec is that file,
      `tests/simulation/test_settlement_clocks.py`, `tools/run_annual_report.py` and
      `simulation/run_phase4c_on_phase2b.py`, landed as ONE commit through `python3 -m
      tools.surgical_land` with the REUSE block from `tools/write_time_gate.py --explain`. Read the
      diff before you decide: it is not a chore. `run_annual_report.save_run_output_json` now RAISES
      rather than publishing a run whose `starting_treasury_gbp + total_net_gbp` disagrees with its own
      `final_treasury_gbp` — the £39,962.17 discrepancy that reached the live site for two days — and
      `run_phase4c_on_phase2b` calls `refresh_settlement_scalars` after the last stage that mutates
      `all_records`, which is what stops one run dict carrying two clocks under one set of names. The
      same hunk also adds the R2 broker-commission accrual. If any of it cannot be landed, revert
      exactly that part, and the finding is which repair the published figures depend on that HEAD
      does not contain. Then, from a clean checkout of the new HEAD in a detached worktree, run the
      annual report and report whether 90 booked / 172 on the book / rate 0.1789 / net £154,164
      reproduce. A figure that does not reproduce from HEAD is the finding and is worth more than the
      landing.
    why: >-
      This is first because everything else on this board is a measurement, and every measurement
      taken on this box this week ran through code that is in no commit. The producer executes the
      working tree, so the live site's figures were produced by it too. That inverts the rule this
      project already learned in the other direction: the record can outrun the code, and here the
      code has outrun the record, which is worse, because the repair that stops a two-day published
      treasury discrepancy would be undone by anyone who checked out main. It has now failed at
      first, third, fourth and fifth position across nine directions, and last night I moved it INTO
      focus item one as a dependency and told myself that was different from listing it last. It was
      not. It is its own item this time with its own subject — the reproducibility of this morning's
      headline — because it has never been anybody's actual subject and that is the whole diagnosis.
      Done means the tree is clean of that pair one way or the other, the commit says which, and there
      is a stated result for whether HEAD reproduces the published book. Fifteen minutes if it goes
      well; if it does not, what it uncovers outranks the rest of this list.
  - id: capabilities-one-clock-one-basis-one-bound
    what: >-
      One pass over `site/capabilities/`, three things, one visit to one page. (1) Re-run both legs of
      the arms comparison in one session to NEW paths, never over the published artefacts:
      `docs/observability/value_cycle_ab_s1_three_arm.json` still carries `generated_at`
      2026-08-28T14:08:48Z and `value_cycle_ab_s1_noise_floor.json` 2026-08-27T23:32:17Z — both
      measured on the 45-win, two-cohort book that stopped existing at 07:47Z this morning, and the
      three-arm leg also predates the sourced acquisition costs landing at 20:46. `python3 -m
      tools.run_value_cycle_ab --level-arm` for the arms, the noise floor immediately after, one
      clock. (2) Write the outcome BESIDE the prediction in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_SOURCED_COST_RERUN_MUST_SHOW_2026-08-28.md`, never
      over it; read no delta smaller than the old floor's £4,402 sd as an effect, and use the new
      floor once it exists. (3) In the same edit put TWO sentences on the render and on the live
      surface: that the arms comparison is between two internal policies in a market that could not
      react to either, and that the published book is a 17.89% uniform sample of what the company
      won, so a reader dividing by 172 accounts is dividing by a sample and not by the business.
      Assert them the way `site/test_the_baseline_comparison_reaches_the_reader.py` already does —
      through `site/_live_harness.mjs`, reading the rendered DOM, with a mutation that deletes each
      sentence and reds its own test while the unavailable-feed null rung stays green.
    why: >-
      It moves from position three to position two because that is the only thing I have not tried and
      the only thing the record supports: named in four consecutive directions at positions three,
      four and five, drawn zero times, while positions one and two were drawn every time. If it is not
      drawn from here, the fault is not the ordering and I will stop writing it as an ordering problem.
      The substance also got worse rather than staler overnight: the page publishes a comparison
      denominated in constants the tree has since deleted, beside a 25.2 spread-to-estimate ratio that
      divides a spread taken on the provisioned clock by an estimate taken on the realised one — two
      correct figures whose ratio is not a quantity, disclosed by `clock_caveat`, and a disclosed hole
      is still a hole — and its arms now describe a book with half the accounts and two of the ten
      cohorts the company actually holds. The sample sentence is new and is the reason this cannot wait
      another stretch: this morning's change made the published book honestly uniform, which is a real
      improvement, and it also made it a sample that a reader will otherwise read as the company.
      Done means both artefacts carry one clock from today, the prediction is graded in its own file
      with the correction beside it, and the fetched live page carries both sentences under controls
      that fail if either stops.
  - id: does-growth-now-press-the-balance-sheet
    what: >-
      Answer the question the ceiling work was for, on the book it now produces, and say first what
      each account count counts. Three parts. (1) R6's measurement reads `accounts` = 13 for the
      Ofgem MCR claim of £1,690 against £337,305.65 of net assets. The tree now holds at least four
      account populations — 587 held in the company's plan, 172 on the book, 90 campaign wins, 13 in
      R6 — and £130 × 13 against £130 × 587 is a £76,000 swing in the capital requirement. Name which
      population the collateral desk is entitled to see (it is a company-side figure, so ask the
      epistemic-wall question of it explicitly), and if it is the wrong one, that is the finding and
      the repair. (2) Re-measure the headroom on the post-allocation run rather than projecting it:
      the £316,008.84 was taken on the pre-change book. Report free equity, peak net exposure and the
      distance to the first collateral demand, and say plainly if the mechanism still does not fire —
      "the distance IS the answer" is a result and nothing may be tuned to make it fire. (3) Attribute
      the £10,378 fall in published net (£164,542 → £154,164) across the same commits that raised
      campaign spend £46,408 → £60,839. More than one thing changed, so run the one-variable version:
      the spend rise alone should account for most of it, and whatever it does not account for is
      either the 45 new accounts' cost to serve or something nobody has named. Write the prediction
      down before you run it.
    why: >-
      The director's sentence was *"acquisition spend cannot weaken a balance sheet through a book
      nothing reaches"* — the ceiling was the obstacle, not the point. The book now reaches, and in
      the very first run afterwards the company earned £10,378 less while spending £14,431 more to
      grow. That is either the growth loop working exactly as the thesis says it should, or it is a
      cost the machine imposed and nobody has separated the two. This is third rather than first only
      because both of the other items are preconditions for believing its output: item one decides
      whether the numbers it would quote exist in any commit, and a headroom re-measured through an
      unlanded reconciliation check is a number I would have to withdraw. The account-denominator half
      is the more valuable half regardless of what the headroom does — a capital requirement
      denominated on 13 accounts while the company holds 587 is the "say out loud what each number
      counts" defect sitting under a published solvency claim. Done means one named account
      population with the wall question answered, a headroom figure measured on this morning's book
      beside the £316,009 it replaces, and an attribution of the net fall that either closes or
      explicitly refuses to close.
not_now:
  - what: >-
      Running §6 of `SETTLEMENT_CEILING_REMEASURED_2026-08-29.md` — the three-point probe at budgets
      1200/2000/2800 — and setting `SETTLEMENT_CUSTOMER_YEAR_BUDGET` from its slope. This was focus
      item one three hours ago and I am taking it off the board rather than demoting it.
    why: >-
      Its premise was refuted by the work it commissioned. I ordered that probe because I believed the
      ceiling's size was what booked zero from 2018; it was the first-come allocation rule, and the fix
      doubled the book on FEWER customer-years, which no larger ceiling could have done. The ceiling
      is still a real resource limit — 22.4% of what the company wins is all the machine can settle,
      and that is now published as a uniform sample rather than as a censoring rule — so the probe
      would still tell us something true. It would just cost forty minutes of a contended box to
      resize a constant whose shape no longer distorts anything, and §5's own finding is that the
      time argument for raising it is circular. The right moment for it is when the sample rate is
      what a reader objects to, not while the page does not yet say there is one.
  - what: >-
      Putting the PB2 capitalisation question — a £337,305 balance sheet against a book with a peak
      position of £19,607 — to the director as a curriculum decision. Fourth direction running that I
      have considered and rejected this.
    why: >-
      The reason changed this stretch, which is why it is worth writing down rather than repeating.
      Last night it lost because the book was sized by our own engine and capitalisation only matters
      against a balance sheet growth is pressing on. Growth now presses it. What stops it today is that
      I do not yet know what the number denominates: R6's own measurement reads 13 accounts where the
      company holds 587, so the free-equity figure I would put to him is a ratio whose two sides count
      different things. Asking him to rule on a world parameter using a number I cannot define would
      be the exact failure the "say what each number counts" rule exists to prevent. Focus item three
      resolves it, and then it is genuinely his and goes to him with a number attached.
  - what: >-
      Re-running the B10 ladder chase pair, PB4 and PB5 on the new ten-cohort book, on the argument
      that every measurement taken before 07:47Z was taken on a book that no longer exists.
    why: >-
      Tempting and mostly wrong, and the distinction is worth stating because the tempting half is
      real. The ladder builds its OWN founder book and asks a between-arm question at a fixed rung, so
      it is not denominated on the campaign book at all; the finding this stretch was that its result
      is a measurement of the join and not of the book, and the join is now repaired with per-rung
      populations printed at the source. Re-running it would cost forty minutes of sequential arms —
      they cannot run in parallel, one peaks near 11 GB — to reproduce a result whose insensitivity to
      the book is the established finding. PB4 and PB5 were drawn by the ordinary dial-weighted lane
      this stretch without being steered, and lane-0 slots are the scarce resource: two or three per
      stretch, measured over four directions. The capabilities artefacts are the exception and they are
      focus item two, because those ARE denominated on the campaign book and they are published.
  - what: >-
        Item 2 of the chase-population finding — `run_price_ladder` retaining every rung's settlement
        records, which is what forces sequential arms and the 11 GB peak — and the ten repeating-alarm
        findings sitting in the staging root, and H45.
    why: >-
      The ladder retention is the best of the three and it is still a speed fix for an instrument
      nothing is currently blocked on; it becomes worth a slot the moment a lane needs a chase pair
      inside one tick, and not before. The repeating alarms move no level and close no finding, and
      the staging root is a work queue by design, so files sitting in it is the mechanism working
      rather than a backlog. H45 — the systematic knowledge-to-discovery-to-atom chain — keeps losing
      to its own instances and this stretch produced two more good ones than an argument for the
      general form: the allocation defect was found by pricing one win by the year it was won in, and
      the mislabelled population was found by grepping a number through prose rather than through
      imports. Build the chain after its instances, and while the live page still describes a book
      that changed under it this morning, none of these outrank that.
