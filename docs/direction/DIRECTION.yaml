focus:
  - id: EP1_clv_three_horizon
    what: >-
      Give the tenure horizon per-account dispersion from observables the company can actually know.
      Third naming, first time first, and the diagnosis is settled -- do not re-derive it, and do not
      spend the tick re-reading the ledger. The subject is one function:
      `saas/churn_model.py::churn_probability` returns
      `min(BASE_ANNUAL_CHURN_PROBABILITY + bill_shock_count * CHURN_UPLIFT_PER_BILL_SHOCK,
      MAX_CHURN_PROBABILITY)`, a step function of one integer, consumed by
      `company/analytics/clv_three_horizon.py` at H2 as `hazard = latest.churn_probability` with the
      term `1.0 / hazard`. `coupled_gap_ledger.json` `components.lifetime_level` reads
      `distinct_hazards: 1`, `hazard_histogram {"0.05": 33}`, median believed tenure 20.0 years,
      measured 11:46:22Z. Note that `components.hazard_calibration` reports 13 distinct believed
      hazards over 263 decisions -- the estimator CAN take other values, and every one of the 33
      graded accounts had zero bill shocks, which is why the graded population is a constant. So the
      defect is that the only input is an event most accounts never have. Widen the propensity to
      what a supplier observes about a household: payment method and payment behaviour, tenure to
      date, the account's own tariff against the market it could switch to, consumption volatility,
      contact and complaint history, and whether the account carries a gas leg -- 395 of the 397
      accounts on the book are residential and the funnel now wins gas legs, so dual-fuel status is a
      live per-account observable rather than a hypothetical. Note the richer sibling before you
      write anything: `company/crm/churn_model.py::estimate_churn_probability` already takes tenure,
      bill stress, hedge fraction, segment and market move, so the shape you need may be a matter of
      reading the account's own signals through the wall rather than inventing a model. Check every
      input against the wall: if it needs a simulation internal it is a violation, and
      `company/interfaces/sim_interface.py` is the only door. The LEVEL is about right --
      `hazard_calibration` shows 0.05 believed against 0.0532 realised over 263 decisions -- so this
      is DISPERSION, not calibration, and nothing may be tuned toward a smaller gap (R12). Re-measure
      with `python3 -m tools.couple_clv` and report the ledger's next reading whichever way it moves;
      a move to level 3 is available on this evidence if the coupled rung is genuinely met --
      self-certify with `record_level_up_self_certified`, never `--no-verify` a `level_current`
      change.
    why: >-
      This is the sentence in the director's thesis stated as code. "Decisions customer-by-customer
      on lifetime value" and a lifetime term with one value across the whole graded population are
      the same claim and its refutation, sitting in one file. It is first because I have put it
      second twice, on the reasoning that a cheaper item gated it, and both times the cheaper item
      took the whole stretch and did not produce the reading it was supposed to gate -- a drawn item
      that leaves its named subject byte-identical twice running is drift, and this is the third
      naming. It is also first on merit rather than on penance: items two and three both report a
      number whose mechanism cannot be attributed while the belief behind it is a constant, and item
      three should be run ONCE, after the beliefs it scores have stopped moving. Finished when the
      graded population shows more than one distinct hazard, the ledger's next entry comes from a
      changed estimator rather than a changed sample, every new input is named with the observable it
      comes from and cleared against the wall, and the new gap is recorded whichever direction it
      went. If it worsens, that is the result and saying so is the deliverable.
  - id: the-world-answered-a-28x-price-rise-with-two-churns
    what: >-
      Measure what the world actually did when the arm raised prices, against what the company
      believed it would do, and report which side is wrong. The observation is already on the tree
      and needs no new run: `docs/observability/value_cycle_ab_resi.json` (17:09:29Z) has the value
      arm repricing 42 renewals at `median_margin_gbp_per_mwh` 57.75 against
      `control_margin_gbp_per_mwh` 2.00, and `churn_roster_diff` records 32 churn events under the
      control against 34 under the arm, on a book ending at 131 and 130 accounts. Take the arm's own
      renewal roster, recover the believed churn probability
      `company/crm/churn_model.py::estimate_churn_probability` produced for each of those 42
      decisions at the price the arm actually chose, and compare the sum of those probabilities with
      the realised count of non-renewals among the same accounts. `RATE_SENSITIVITY` is 0.8 and
      `GAS_RATE_SENSITIVITY` 0.6 with a hedge reduction and a tenure discount, so the belief is not
      inert and the expected number is computable. Then say which of the three it is, with the
      arithmetic beside it: the company's belief over-predicts churn, or the world's switching
      response under-punishes a supplier-specific rise, or the sample of 42 is too small to separate
      them -- and if it is the third, say what would separate them. Read `belief_vs_outcome`
      (`discrimination_auc` 0.6944 on 24 matched decisions) beside it rather than instead of it: an
      arm can rank who leaves correctly while being wrong about how many. THE OUTPUT IS A
      MEASUREMENT, NOT A REPAIR. Changing the company's belief afterwards is the company's own affair
      and it is allowed to be wrong. Changing the WORLD's switching response is a fidelity change to
      the baseline, must be decided blind to what it does to this delta (R13), and is not this
      seat's; record it for the curriculum if that is where the arithmetic lands. Write it into
      `docs/design/THE_VALUE_CYCLE_REALISED_AB.md` as its own dated section.
    why: >-
      This decides whether the only number that answers the director's question means anything. The
      arm's advantage is supposed to come from INFERENCE and not from ACCESS, and the ceiling section
      landed this stretch establishes that it must not come from a BOUND either. There is a fourth
      way for it to be hollow that nothing has checked: it can come from a world that does not
      punish price. Forty-two renewals repriced at roughly 28x the control's commodity margin
      produced two extra churn events. If that is faithful, the arm's win is real but small and the
      lever is price rather than prediction; if it is the world being too forgiving, then every
      realised A/B result to date is a fact about the switching curve and the +GBP 16,773 headline
      cannot be attributed to inference no matter how many times it is re-run. This is the coupled
      triad on the pair that matters most -- company belief against world truth, gap reported -- and
      it is cheap, because both sides are already published. It is second rather than first only
      because item one changes a belief this measurement should be taken against once.
  - id: rerun-the-ab-once-and-publish-the-three-unread-instruments
    what: >-
      Run `python3 -m tools.run_value_cycle_ab` on the book as it now stands, ONCE, at the END of
      this stretch and after whichever of items one and two have landed -- and publish the three
      instruments that were built for it and have never produced a number. Grep confirms it: no
      `value_cycle_ab*.json` on the tree contains `gross_to_net_bridge`,
      `bound_attribution` or `cross_section_reconciliation`; the newest A/B artefact is 17:09:29Z and
      its keys stop at `how_to_read_this`. So the reading owes three things at once. The book changed
      materially and not cosmetically -- 131 accounts at the scored end against 397 now (395 resi, 2
      SME, `site/data/company.json` 23:07:37Z, git 3a4324aac), the funnel wins gas legs, and one
      household is one billing account via `saas.customer_reaction._billing_account_id`, so
      cost-to-serve, churn and lifetime value all move. The GBP 30,924 divergence -- control gross
      GBP 433,174.76 against arm GBP 419,023.25 while net went +GBP 16,773.28, bad debt explaining
      GBP 2,591.09 -- gets decomposed by `gross_to_net_bridge` into named lines from the run's own
      settled ledger, and `unexplained_residual_gbp` plus the reconstruction error say plainly
      whether the decomposition closes. Report the residual whatever it is; a bridge that does not
      close is a finding, not an embarrassment. `cross_section_reconciliation` refuses to reconcile
      against a coupler artefact that predates its `population` block, so re-run
      `tools/couple_value_based_pricing.py` first if that refusal fires. Rewrite the artefact's
      headline table so the current row names its book -- dual fuel, account count, commit -- keep
      every superseded row and its supersession note, and re-report the delta whichever way it moved,
      including smaller or negative, said plainly. R14: every figure carries its clock.
    why: >-
      The published answer to the director's question describes a book the company has not had since
      20:35Z on 26 August, for the second time in three days, and the fix is one command that takes
      about 23 minutes of machine time and no judgement. It is third rather than first because I put
      it first last time and the stretch spent itself on the four analytical clauses of that item
      while the one mechanical clause went unexecuted -- and because ordering it first is what caused
      the supersession in the first place. The dependency runs the other way from the one I asserted
      last time: the re-run does not gate the belief work, the belief work gates the re-run, and the
      lesson of the 3.4-hour supersession is MEASURE ONCE, AFTER THE GROUND STOPS MOVING. If items
      one and two do not land, run it anyway before the stretch ends -- the book supersession is
      independent of the beliefs, and a stale headline is worse than an early one. Finished when the
      artefact's current row states its book and account count, the three instruments each carry a
      live figure, and the gross-to-net divergence is either decomposed into named cost lines or
      recorded as still unexplained WITH the residual the bridge computed and the candidates ruled
      out. Do not soften a fall: a negative result on the right population is worth more than a
      headline on the wrong one.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Close the gap between what the carbon atom has built and what it has proven, and correct its
      level either way. The SIM side is substantially there -- `sim/neso_carbon_intensity.py`,
      `sim/grid_carbon_intensity.py`, `sim/elexon_fuel_outturn.py`,
      `tools/generate_grid_intensity_feed.py`, and `docs/market_data/grid_intensity_feed.json`
      publishing at 23:22:13Z with its basis string attached. What does not exist is any measurement
      of the company against it: there is no `tools/couple_carbon_intensity.py` among the fifteen
      `couple_*.py`, and `coupled_gap_ledger.json` holds sixteen rows of which exactly ONE is an EP
      atom. The map records `level_current: 2`, `loop_stage: build`, `level_target: 3`, with the
      block discharged 2026-08-25 by the director's own instruction quoted in the entry: "Wire the
      carbon ledger to live meter reads and grid intensity, publish it with its provenance, and say
      plainly what it does and does not yet include." Two days on, the publish-with-provenance half
      is real and the say-plainly half is not measured. So: build the coupler, grade the company's
      believed emissions against the world's outturn, and put an EP13 row in the ledger. Read
      `docs/design/EP13_CARBON_INTENSITY_DISCOVER_FRAME.md` first -- it holds the level at 0 for a
      stated reason and warns that `company/sustainability/carbon_intensity_register.py` had zero
      non-test importers, so CHECK who consumes the register today before grading a belief nothing
      reads. If the honest finding is that level 2 rests on nothing measured, correct the map entry
      down and record why; that is a legitimate outcome and a better one than a fourth naming. R15:
      whatever control you build, mutation-test it -- a coupler that cannot fail is the exact defect
      the ceiling reconciliation caught one lane over this stretch.
    why: >-
      The director asked for this directly and by name, it is the only item on this list he asked for
      in his own words, and I have held it out of focus twice on the grounds that the value cycle
      outranked it. Twice is the limit: a third deferral of a directly-asked item is how a request
      turns into a backlog entry. It also carries a live falsehood, which is the part that makes it
      focus rather than backlog -- an atom recorded at level 2 with no coupler and no ledger row is a
      level claim resting on evidence nothing has taken, and under the coupled triad no SIM atom
      reaches its target until the company has been tested against it and the gap measured. Fixing
      that changes a level or corrects one, which is what this list is for. It is fourth because the
      three items above are the one measurement the whole thesis rests on. Finished when either an
      EP13 row exists in `coupled_gap_ledger.json` with the company's carbon belief graded against
      the world's outturn, or the map entry says level 2 was unearned and now reads what the evidence
      supports.
