  - id: a-focus-item-is-structurally-unreachable-by-the-executor
    what: >-
      **Read `background/seat_executor.py:340-361` and the comment block above the guard before
      deciding anything.** The guard is `if _interactive_seat_is_live(now) and not
      _is_handed_off(item, now=now)`. Its own comment records that the presence check was narrowed
      to contention on 2026-08-31 **for continuations only**, deliberately leaving a focus item
      outside that narrowing. `_interactive_seat_is_live` is true whenever any session is running
      and one always is — including the session writing this file — so a focus item is not
      *sometimes declined*, it is **structurally unreachable**. `docs/observability/seat-executor-log.md`
      now shows **twenty-four consecutive identical stand-downs**, unbroken from 2026-08-31 23:35
      to 2026-09-01 11:06, the last six naming a top item that then closed through another route.

      **Take the decision and record it.** The recommendation is to make a focus item reachable the
      same way a continuation already is — **write the handoff at derivation**, so
      `direction.unreachable_focus` produces a claimed handoff a later tick can take rather than an
      unclaimed decision that always loses to a live heartbeat. Choose otherwise only with the
      reason written down. **Do not** choose *"escalate after N declines"*: that is a stall wearing
      an alert's clothes. If contention is genuinely the worry,
      `seat_work_in_hand.refuse_if_duplicated` three lines below already answers it — on paths,
      which is where contention actually lives, rather than on presence.

      **Key the leg to the property**: *a focus item the executor re-derives is reachable by some
      tick* — never *"this item is stuck"*. Build the fixture with an **explicit heartbeat time,
      never wall-clock `now`**: a fixture built from `now` has a red window and self-heals before
      the drawn worker arrives, and no amount of paging fixes that. Mutation-prove it with
      `python3 -B` — a leg that cannot go red against twenty-four identical stand-downs is not a
      leg. **No register of stand-downs.** A reachable path and one control is the whole mechanism.
    why: >-
      Fourth, and I am ranking it here for the second time with better evidence than last time
      rather than out of habit. The evidence says work reaches the trunk without it: the top item
      last orientation closed in three commits while the executor declined it six times, so this
      **degrades the steer rather than severing it**, and three items that move the world or the
      published surface outrank it. It stays on the list because it has stopped being a mechanism
      problem and become **a claim the code makes that is not true** — the comment argues the
      executor stands down on *possible* contention, and it stands down on *certainty of a
      heartbeat*, which is a different thing and is never false. Each repair so far has revealed the
      next gate rather than a working route: nothing converted a focus item to a handoff, then the
      brief read the shorter history, then the conversion existed and declined to fire, and now the
      decline turns out to be unconditional. Seven orientations of `previous_focus_drawn: []` is
      enough to stop calling it an instrument fault. **Done means:** the decision recorded with its
      reasoning either way; the chosen mechanism landed on origin; one mutation-proven leg keyed to
      reachability rather than to any item's name; and `seat-executor-log.md` showing a subsequent
      tick **taking** a focus item rather than declining it a twenty-fifth time.
