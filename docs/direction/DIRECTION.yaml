thesis_read: 'Last stretch''s focus was worked, and the exit test is closer and still not met. Items 1 and 2 are done and
  leave focus. dd4216618 graded the desk fix on a fresh run (overdue breaches 12,730 -> 9,455, held-bill 4 -> 0), and 6bdf08992
  made the second cold read''s six classes into blind-written rows, with three fixes in the same commit. The third cold read
  is pre-registered (7643712f8) and its run (fresh-run-129e7de698) is waiting for the 5 GB annual report, pid 3070363. Item
  3, W2_36''s opening read, was drawn and landed nothing. I take it out of focus on purpose, below. Reading the exceptions
  file rather than the commit subjects, leg one is not met, and the pre-registration''s ''MET at about even odds'' reads the
  test too generously. It counts a breach under its ceiling as explained. But INV_OVERDUE_WITHIN_PAGE_BALANCE''s own reason
  says that of its 9,455 steps, 723 (three write-off dates for one debt) and 5,280 (the page and the desk reading different
  payment records) are open defects. R2 has 50 open residuals, and R3 says it is not explained. An excepted defect is visible,
  not explained. So the third read can settle leg three, but leg one waits on the causes. One finding outranks the rest because
  it is the thesis itself. R3''s lead checks out in code: after an estimated run, the estimator''s window is handed the true
  month''s settlement kWh, not the read advance the supplier holds (monthly_bill_assembly.py:859-862). If that holds, part
  of the company''s estimating rests on access, not inference, and every beats-average claim built on its bills would be built
  on it. It goes first. It is a plain error, so it is fixed now and not escalated. The commit split reads 2 supplier, 1 world
  and 8 other, but by content the stretch was supplier billing correctness (ec079776d, dd4216618, 6bdf08992, 971a37583). The
  world commit was the desk fix''s run side. Machine facts. The shared checkout is 81 behind origin, and every daemon runs
  code origin has moved past. No job died. One merge commit carried nothing. The renewal-belief row is unchanged, and it stays
  held behind the ruling.'
