  - what: Raising the world's gas heating fraction from 0.70 to DESNZ's ~85% now (W2_30 step 2).
    why: >-
      It is sourced and probably right, and D48's gas-shape gap points the same way. But it changes the world under
      a value test whose pairs (skip0, then the 0.12 pair) are compared against A on a fixed world. Changing it
      mid-series would make the next grade unattributable. It goes after the 0.12 pair reads, and it is world work
      that unblocks no result before then.
  - what: Building the rank form of the cut, or "0.30 in calibrated units", alongside 0.12.
    why: >-
      s.12f refuted the calibrated form offline (it reaches 0 of 9), and the rank cut selects the same set as 0.12
      on this book. One switch answers the question, and two would split one box.
  - what: Running the 0.12 pair before the W3_3 book.
    why: >-
      The book grades the standing-charge fix (c71d2521d) and must exist before the 23 Nov publish window, and
      next_book_requires already orders it next, alone. Both fit before 23 Nov. Reordering the box for a test that
      is not yet built would cost the publish its grade for no gain in time.
  - what: launch_hold_pairs.sh, and s.12c's candidate 2.
    why: >-
      k = 0 of 9 refutes the skip, and s.12e found that candidate 2 moves the flips further under the cut. Neither
      is worth a day of the box.
  - what: B8's holdout, B11's forward value backtest, and more EPC-register work on W2_18 and W2_19.
    why: >-
      B8 and B11 need the box, and B11 would backtest a belief whose cut is the subject of the live test. The EPC
      work unblocks no named supplier result. Supplier first.
  - what: The site and canon atoms (SITE1, SITE11, SITE12, SITE15, OPS7, A45) and the 21 live repeating alarms.
