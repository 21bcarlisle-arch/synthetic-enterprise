  - id: the-slc-27b-citation-does-not-exist-and-is-published
    what: >-
      **Correct the "SLC 27B" attribution in the sites rank two does not reach, and close the class
      rather than the instance.**

      `docs/staging/SEAT_FINDING_THE_DD_REVIEW_BAND_CITES_A_LICENCE_CONDITION_THAT_DOES_NOT_EXIST_2026-09-02.md`
      establishes from Ofgem's own material that **there is no SLC 27B**: the direct-debit
