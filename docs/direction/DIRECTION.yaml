thesis_read: >-
  Three hours, five commits, four carrying work, three substantive. The stretch's main result is not a commit. skip0
  finished at 10:31Z, and its read is on disk (/var/tmp/vts-driver/read_threshold_skip.out). skip1 minus skip0 is
  exactly GBP 0.00 on both seeds, and skip1 minus A is -GBP 4.57 (-7.26 to -2.24). So d0, the save-odds weighing
  without the skip, carries the whole loss, and the skip carries none. That is what s.12f pre-registered at 01:10Z
  (d0 -4.5, range -7.3 to -2.2; d1 0.0). The prediction held. Against the thesis, this is the first attribution the
  value test has produced. The per-customer arm loses to the flat book because of one switch the company added, the
  weighing, and not because of the per-customer view as such. That makes the negative advantage a lever to remove,
  not a refutation. It is not yet graded where the director can read it, and nothing in the live queue would have
  drawn it: the continuation the triage named as owner does not exist, so it goes first. The 0.12-cut pair is armed
  but waits on a W3_3 book that has not built since arming (vtc-cut012-watch log, 10:31Z), and it lapses on 24 Nov.
  The commit split reads 0 supplier, 0 world, 2 both, 3 other. Read by content, KNIFE3's third slice (86e590a44,
  bill due dates now come from the supplier's own payment terms, byte-equal on the 8a300fa561 replay) is supplier
  work. The prepayment meter build (f0445b2dc) is world work, and it landed from its continuation although the last
  record's not_now held it behind skip0. It draws on its own streams, and no company code changed, so it should not
  move the value pair. The steer slipped, and on the evidence it did no harm. The W2_36 row has not landed:
  w236-d48-land and -2 died REFUSED with the test leg green (1899 passed), and a third surgical_land is in its gate
  now (pid 3245175). The primary checkout carries one fork commit (a2ed7654e0), which f0445b2dc says it carried to
  origin. The census fix is on origin but not in this checkout, so the 20 Nov firing runs old code unless the
  checkout advances.
