- id: three-blind-invariant-rows-for-n14-n15-n16
  lane: D_billing_metering
  side: other
  what: 'The ruling''s step 6 owes three rows in company/compliance/domain_invariants.py, written by an
    agent that has not read the code under test, from docs/market_research/back_billing_and_liability.md,
    company_debt_management.md and the tariff knowledge pages only. The rows are: a catch-up on an account
    paying on receipt at the bill date that recovers more than 12 months is a BREACH, not a flag (it supersedes
    INV_BACK_BILLING_12M''s flag for that case); a ''further bill missed'' collections event must follow
    a bill not paid by its due date; and a printed tariff label must agree with the billed term at the
    same date (graded on site/data/explore_cast.json and the customer pages, since the runner cannot see
    the page). Each row cites its source. First show that each row CAN fire: run it on the published 0a6391d186
    book and print its breach count (expect 8, about 3,772 and 19 on today''s book). Land the rows whatever
    the order of items 1 to 3. A row that reds origin''s book is the evidence, so give it a named, dated
    exception until its fix lands, rather than holding the row back.'
  why: Leg one of the exit test reads green only because no row asks these three questions, and the ruling
    turns each confirmed objection into a row so that the next book is graded on it. Done means the three
    rows are on origin, each with its source and a printed non-zero count on the published book, and a
    fresh run grades them.
