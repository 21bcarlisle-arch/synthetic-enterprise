thesis_read: >-
  This stretch had 13 commits. 7 were substantive (supplier 2, world 1, both 1, other 9), and 3 were merges that
  changed nothing. No level moved. Against the thesis it was the best stretch of the day: the defect that killed the
  thesis test is fixed as a class, and three of last stretch's five focus items are done. e09f1640a judges a dunning
  step on the ledger it was issued on, with a control, and 817453da0 ported that fix into the s.12g pin as a stated
  deviation and re-queued s.12g on book 61118 with its predictions unchanged. So the EP4 row is corrected. B8's blind
  holdout is on origin default-off (318d042e7e) and shown taken in a run: in 2017 it held out 16 of 72 considered
  renewals (e2515972e). The work item is closed (1af94c513). e1af282d6 flags by name every continuation embargoed
  on a book that ends unwritten, and the d48 row is re-armed on the first book descending from 59cd5ebda, so the
  dead-book row is corrected. My 15:23Z record reached origin on its first attempt (72539d22e), so the seat-record
  row is corrected. Two of last stretch's items did not land. supply-a-win-from-a-gas-only-household-as-gas has a
  worker on it now (two pytest runs over won_switch/gas_only in the reg 6C tree), so it stays in focus.
  a-bounded-turn-cannot-start-a-landing-it-cannot-outlive is now a queued continuation, so it leaves focus to keep
  one home. The book is now the one thing holding everything up, and the hold is a queue nobody chose. No book has
  been written for 51 hours. profile-book-run-cprofile finished its simulated window ("SURVIVED -- full window
  completed"), but at 18:24Z it has not written cprofile.json. I predicted it would end around 17:00Z, and that was
  wrong. Next in line is s.12g, which declares 11,800 MB and 2,100 minutes, and sim-runner defers every book to it
  because the box cannot hold both. Left alone, the five supplier grades (D48, KNIFE3 I1-I5, the dual-household
  answers, won-switch P2-P5 and the ending-term belief) wait about 35 hours more. I decide the order: the book goes
  first. It takes about two hours, it is the first test of the roster fix, and it feeds five grades. Giving it the
  box first delays the thesis test by about 8% of that test's own run. Two readers are missing. The ending-term
  belief grade (read-the-ending-term-belief-grade-on-the-coming-book) is not in the live queue, and no continuation
  reads s.12g's artefact when it ends. Both are now supplier focus items, because a 35-hour thesis test with no
  reader, or a belief fix with no grade, is wasted work.
