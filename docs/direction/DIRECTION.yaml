focus:
  - id: settlement-ceiling
    what: >-
      Run the measurement specified in §6 of `docs/design/SETTLEMENT_CEILING_REMEASURED_2026-08-29.md`
      and set the constant from it. Three things, in order. (1) FIRST resolve the untracked
      settlement-clocks pair, because your own probe depends on it: `tools/settlement_ceiling_probe.py`
      calls `tools.run_annual_report._run_and_extract`, and the working tree's
      `tools/run_annual_report.py:69` imports `simulation.settlement_clocks`, which is untracked and
      in no clone — so both recorded probe points were taken through a reconciliation check that
      exists on this box only. Check HEAD first, since a lane claimed this at 05:03 and may have
      landed it. If it is still untracked, either land `simulation/settlement_clocks.py`,
      `tests/simulation/test_settlement_clocks.py` and both modified consumers
      (`tools/run_annual_report.py`, `simulation/run_phase4c_on_phase2b.py`) as one pathspec through
      `python3 -m tools.surgical_land` with the REUSE block from
      `tools/write_time_gate.py --explain`, or revert the two import hunks and delete the pair. Ten
      minutes, then move on. (2) Stand the live producer down for the duration — it assembles a book
      every ~1,500s and that is what collided with the last attempt — then run
      `python3 -m tools.settlement_ceiling_probe --budgets 1200 2000 2800 --publish-interval 3600
      --time-share 0.9`, and restore the producer afterwards. Write down before you start what you
      expect the slope to say, and grade it beside the result. Every point must report `clean: true`
      or the tool refuses a slope, which is the correct outcome and not a failure to work around.
      (3) Set the ceiling from the MEMORY bound against the guest read live from
      `background.resource_headroom.sample()`, never from the measured publish cadence — §3 shows
      that cadence is set by run duration, so a ceiling argued against it raises its own allowance
      and silences the gate-speed alarm at the same time. Then re-run the live campaign and report
      what booked, what the ladder's per-rung paired populations become when re-run (do not project
      them from win counts — rung 2.0 has no book after 2019 and two mechanisms compose), and what
      happens to R6's £316,009 headroom. While the runs are in flight, fix the class the probe's own
      finding named: `tools/couple_pb3_book_growth.py` reads
      `docs/observability/book_growth_campaign.json` by absolute path, exactly as the probe did, and
      will adopt whatever the producer wrote last.
    why: >-
      This is the last standing claim from last night's board that the correction did not take away,
      and it is the largest gap between this company and the thesis. The measurement of 2026-08-29 is
      386 funnel wins, 46 booked, 340 refused by a constant whose own header calls it "THIS MACHINE's
      budget… not a commercial limit", with the settlement engine binding in nine years of ten. A
      supplier whose enterprise value is the automated method of finding customers is publishing a
      book that its engine, not its method, sized — and every pound of the published net figure
      inherits that. The provenance question is already answered and the answer is that it went stale:
      1,200 cost 746.8s and 3,117 MB when it was slack and costs 1,018.7s and 4,193 MB now that the
      founder book made it taut, and nothing reported the drift. Note what this is: an engineering
      artefact with no counterpart in the world, so lifting it removes an artefact rather than
      changing the curriculum, and it moves the experiment toward being MORE refutable. Done means
      three clean points or a stated refusal with the reason, the constant carrying a measurement
      taken this week beside its artefact, a live re-run reporting what booked, and the report saying
      in terms that the published figure moved because the ceiling lifted and not because the method
      worked — those are the two things a reader will otherwise confuse. If the probe says 1,200 is
      right, say so; "the ceiling is real" is a different and equally useful answer.
  - id: the-slope-population-is-a-selection-effect-everywhere-it-is-reused
    what: >-
      Discharge item 1 of WORK THIS CREATES in
      `docs/staging/WORKER_FINDING_THE_CHASE_COMPARISON_WAS_ASKING_ITS_QUESTION_ON_THE_SLOPES_POPULATION_2026-08-29.md`.
      `slopes.common_population` is the set of decisions priced and rolled at EVERY rung; it is
      correct for a slope and wrong for any question asked at a fixed rung, and it silently confines
      that question to 2016–2018 because rung 2.0 prices its book away by 2019. Two moves. (1) Audit
      every reader of `common_population` and of `run_price_ladder`'s
      `world_curve_vs_belief.per_decision` block — the finding says the latter is built on the same
      set and carries only each decision's lowest and highest rung, so anything reading it inherits
      the blindness. For each reader, state whether its question is cross-rung (keep) or fixed-rung
      (must pair on that rung's own priced-and-rolled set, the way `compare_chase_belief` now does),
      and repair the fixed-rung ones. (2) Land a control keyed to the PROPERTY, not to today's
      answer: a fixed-rung comparison must not draw its population from a cross-rung intersection.
      Mutate it by re-imposing the wrong join and show it goes red — that mutation is available and
      cheap, because it is exactly the code that was just removed. Record the per-rung n beside every
      figure the ladder publishes, so a population of 16 can never again be read as a fact about the
      book. If while auditing you find a reader whose n collapses under the correct join, that is a
      finding and it is more valuable than the repair.
    why: >-
      This defect cost two days of direction and three held atoms. It produced a result that did not
      move when the window grew by two years and the ledger deepened to 453 renewal decisions — a
      number identical to eight decimal places across that much added evidence — and both the lane and
      I read that as "the book is too small" instead of "the join is wrong". A result that does not
      respond to added evidence is the tell, and the general shape is that a population selected for
      one question is a selection effect in every other question asked of it. It sits second because
      it is the only work on this board that protects future measurements rather than producing one,
      and every remaining thesis question — PB4, PB5, B8, the calibration gap — is a fixed-rung or
      between-arm question that will draw from this same machinery. Fixing it after the next
      measurement is built on it costs that measurement. Done means every reader of the intersection
      is classified as cross-rung or fixed-rung with the fixed-rung ones repaired, a mutation-proven
      control refuses the wrong join, and the per-rung n is published beside the figures rather than
      recoverable only from an artefact.
