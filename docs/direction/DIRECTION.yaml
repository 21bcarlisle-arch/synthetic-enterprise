thesis_read: 'The baseline question has not moved: per weighted win against the count-matched cull52, the chosen per-customer
  book is inside the flat-rule blind span on net (d27a2a227). On this book, per-customer neither beats flat nor loses to it,
  and only the director''s EP17 row can separate them. What moved this stretch is what the company can LEARN. The retention
  netting is on origin (6870d3c8b) and the on-arm read its flag on 73 of 73 passes (49f2587f1). It withdraws no offer, because
  the guard''s value test never binds: the largest netted bad debt is 8.9% of margin. So the transfer my last record called
  live is closed in code and had little effect on the book. 3811342db is the harder result: the company offers exactly when
  belief > 0.30, so its own record can never show what an offer does. A decidable bound needs about 392 renewals per side
  in band, and ten years gave 31. On a book this size, the advantage the thesis asks for cannot come from learning the effect
  of the company''s own actions. It has to come from published trials used as priors (EFTC: 6% switching in both arms) or
  from more independent books, which is EP17 again. The machine went BACKWARDS on its own steering. The 11:24 orientation
  never ran: the spawn failed with ''Argument list too long'', because the brief is passed as one argv string. Its decision
  row still reads ''oriented'', and its fallback landed the shared working copy''s stale 40-row record (a42daa6a0) over 1cd4bda0e''s
  triaged 19-row one. That undid, within 90 minutes, the change the director asked for that morning. A worker then graded
  the run a success (17f17b338). As a result, the live focus named two finished items (W2_20 at L2 is bbc434fff; the netting
  is 6870d3c8b) for three hours. This record restores the triage: retired problems are dropped, and the 13 fix-open ones are
  carried. The brief I received ended in the middle of a row, so I read the remaining rows from origin. The world moved: W2_36
  smart meters can now drop out of smart mode and go unread (d149ad168), and G15 registered Ofgem''s weekly forwards (101aa4048).
  W2_18''s move to L1 is gated (0a4d5324a), but it is a local commit on the shared HEAD and on no remote, and the checkout
  is diverged again (1 ahead, 16 behind). C34 was steered three times and landed nothing. It depends on B11, which is parked,
  and on W2_39''s world response, so I steer upstream to W2_39. Of the 4 items in the previous focus, 2 were drawn in this
  stretch, and 2 had finished before it began. 10 commits, 4 substantive, 4 empty merges. Disposable: acff52923 (/var/tmp/se-draw-order,
  dead owner pid 1364549; its supervisor.py is on origin as 20c9c52c9).'
