focus:
  - id: reconcile-the-two-net-margins-the-ab-publishes-for-the-same-arm
    what: >-
      `docs/observability/value_cycle_ab_s1_three_arm.json` publishes two net margins for the
      SAME control arm on the SAME run and they differ by GBP 39,962.17. Observed:
      `control_arm.total_net_gbp` = 113,282.617135 with `total_bad_debt_gbp` = 46,428.5849 and
      `final_treasury_gbp` = 363,282.617; `gross_to_net_bridge.control_arm.net_margin_gbp` =
      153,244.792 with `bad_debt_gbp` = 6,466.41 and `unexplained_residual_gbp` of 8e-4. The
      difference between the two net figures equals the difference between the two bad-debt sums
      to the penny. `simulation/run_phase2b.py:2502` computes `total_net` as the sum of
      `net_margin_gbp` over `all_records`, which is the 153,244.79 basis and is the GBP 153,245
      the site and every auto-process commit message publishes. Inferred, not yet observed:
      `final_treasury_gbp` = 250,000 + `total_net_gbp` exactly, so the arm block reads a
      treasury-derived (banked) figure. Whatever the cause, `level_vs_selection.basis` currently
      reads "settled net margin (R14) -- `net_margin_gbp` from the world's own settled records"
      while the numbers it sums are the 113k block, so at least one label is false and R14 is
      breached inside the artefact that carries the thesis. Do three things. FIRST, name each
      figure's true clock -- settled, billed or banked -- from the code that produces it, and fix
      the labels rather than the numbers. SECOND, decide which basis the arms are scored on and
      say why in the module; this is not cosmetic, because on the arm-block basis the value arm
      avoids GBP 2,481 of bad debt and on the records basis it incurs GBP 216 MORE, so the two
      bases disagree on the SIGN of bad debt's contribution to the headline advantage. THIRD,
      make it impossible to reintroduce: a control that fails when the artefact publishes two net
      margins for one arm without a declared clock on each, R15-proven by mutating one label.
      Then re-derive `level_vs_selection` on the declared basis and say in the artefact whether
      MINUS GBP 174.57 moved.
    why: >-
      Everything downstream is a number read off this file, including the only comparison the
      thesis has, and one of the two figures it publishes for the same arm is mislabelled. It
      goes first because it is cheap -- two call sites and a docstring -- and because it is the
      one defect here that could make a published figure wrong rather than merely imprecise: a
      reader who sees GBP 153,245 on the site and GBP 113,283 in the experiment has no way to
      know both describe the same run. Finished when each net figure in the artefact carries its
      own clock traced to the code that produced it, the arms' basis is declared with a stated
      reason, the sign of bad debt's contribution is settled, and a control fires on an
      unclocked pair. If the two figures turn out to be a legitimate settled-versus-banked pair
      -- which is the likeliest answer -- that is a complete result and the repair is the label
      and the control, not the arithmetic. R12 applies without qualification: do not let the
      choice of basis be made by which one flatters the arm.
  - id: measure-the-decision-surface-the-ab-actually-has
    what: >-
      The experiment that grades per-customer decision-making contains 25 decisions. Observed in
      the same artefact: `decision_shape.priced` = 25 with `declined` = 0 for the value arm, and
      `level_arm_decision_shape.priced` = 34 -- a 36% larger denominator for an arm that is
      supposed to differ from the value arm in `renewal_margin_arm` and nothing else, over a book
      of 210 billing accounts settled in the window and 127 alive at its end. Renewals are
      annual: `churn_model._renewal_periods` derives them from acquisition_date + 365n, and
      `company/pricing/renewal_rate_chain.py` records that an earlier ten-year A/B saw 66. Build
      the funnel and publish it as a first-class block in the artefact: how many renewal events
      the world generates across the window, how many reach `decide_renewal_rate`
      (`simulation/run_phase2b.py:1344`), how many reach `renewal_margin_uplift` with an arm set,
      and how many are priced versus declined -- with the drop at each stage named. Then answer
      the two questions it raises. (a) Is the small population a WORLD property -- most of the
      book on evergreen or variable tariffs that never present a renewal decision -- or a gate in
      the chain? If it is the world, that is a finding about how much of the book per-customer
      pricing can touch at all, and it must be written down in those words rather than fixed.
      (b) Why do two arms differing only in `renewal_margin_arm` see different numbers of
      renewals? The likely answer is that divergent churn moves the roster and therefore the
      renewal schedule, which is legitimate sequential-A/B behaviour -- but it is currently
      unstated, and `arm_identity` guards the POLICY fields while nothing guards the decision
      POPULATION. State the mechanism with evidence and add the count difference to the artefact
      beside the advantage, so no reader takes a per-decision claim from two different
      denominators.
    why: >-
      This is the reason the headline cannot be resolved, and it is upstream of every proposal to
      widen the world further. A selection effect worth a few hundred pounds spread across 25
      decisions, five of which carry 87% of the money and six of which were priced by the price
      cap, cannot be separated from noise by any amount of re-running -- at the observed seed
      spread it would take on the order of forty full decade runs to resolve a GBP 1,400 effect,
      which is the honest arithmetic and the reason to change the experiment rather than repeat
      it. Second rather than first only because item one may change the numbers it reports.
      Finished when the artefact carries the funnel with the drop named at each stage, the
      arms' differing denominators have a stated and evidenced mechanism, and there is a written
      answer to whether the decision surface is small by construction or by plumbing. If it is
      small by construction, say so plainly and stop -- do not raise the count by relaxing
      something in the world to make the experiment easier, which would be R13 straight through
      the wall. R12: the funnel is a diagnostic.
  - id: EP1_clv_three_horizon
    what: >-
      Carried forward unchanged and unrepaired: the atom was drawn this stretch and
      `tools/couple_clv.py:606` still defines `_earliest_belief`, and
      `docs/observability/coupled_gap_ledger.json` still records "The belief taken is the
      EARLIEST year-end snapshot". Fix the coupler's belief-selection rule so EP1 grades a belief
      capable of varying. The diagnosis is landed and correct (`4b6e1b29f`,
      `docs/observability/EP1_GRADED_SLICE_WHAT_IT_IS_EVIDENCE_FOR_2026-08-27.md`): the earliest
      year-end snapshot is exactly the point where `churn_probability = BASE + 0 x UPLIFT`
      (`saas/churn_model.py:39`, `company/analytics/clv_three_horizon.py:580`) because no
      bill-shock history has accrued, so the hazard is 0.05 for 154 of 154 accounts by
      construction and `distinct_hazards: 1` measures the rule, not the company. The stated
      justification -- that a ceased account has no other snapshot -- is false for 14 of the 20
      graded accounts still present. Replace it with a rule that grades a belief the company
      actually held while the account was live, write the new rule AND its reason into the module
      docstring beside the one it replaces, and keep the existing fallback for accounts that
      genuinely have one snapshot. R15 both ways: the mutation that must go red is reverting to
      the earliest snapshot with an assertion that `distinct_hazards` stays above one; and the new
      rule must not pass by reading a field the belief producer also writes -- trace the FIELD,
      per this project's own lesson that a cross-layer import is not automatically a tautology.
      Then run `python3 -m tools.couple_clv` and land the row. The headline `gap = 2.529` stays
      unpublished until the row is honest.
    why: >-
      This is the company half of the thesis -- whether the supplier's per-customer lifetime-value
      belief is worth anything -- and it is the only instrument that grades it. The atom's own map
      entry says "EP1 has not been graded ONCE" at level 2 against a target of 3, so it is also
      the only level move currently available on evidence. It is third and not last on purpose:
      it has been named on six lists and reached on two, it is independent of the A/B artefact and
      of the tree lock so it can proceed alongside items one and two, and its two owed halves are
      now fully diagnosed with nothing left to think about. Finished when the ledger row is
      measured under the new rule and states how many distinct hazards the graded population
      contains. If that is more than one and the coupled rung is met, self-certify the level with
      `record_level_up_self_certified` -- and never `--no-verify` a `level_current` change. R12:
      the gap is a diagnostic. A belief that turns out badly calibrated once it can vary is a
      finding, not a defect in the fix.
  - id: publish-the-baseline-comparison-to-a-reader
    what: >-
      The single most important thing this project has established reaches no reader. Observed:
      `grep -rl "level_share_of_advantage|value_cycle_ab|selection_gbp"` across `site/`,
      `tools/generate_dashboard_data.py`, `saas/reporting/` and `docs/reports/` returns one file,
      `site/data/delivery.json`, which carries a lane claim and not a figure. The site and the
      annual report publish a profitable supplier at GBP 153,245 net and say nothing about the
      flat-rules baseline that matches it. Put the comparison in front of a reader on a business
      surface: the three arms with their net margins, the selection leg, the seed spread beside
      it, the number of decisions it rests on, and the clock from item one. Label the reading
      PROVISIONAL, which keeps it retractable and therefore squarely inside this seat's authority.
      Write the finding in the same voice the artefact already uses -- that a selection worth
      nothing is a complete answer and not a cue to tune the arm. Then verify to the rendered
      value per R11: fetch the LIVE deployed surface and quote the actual rendered figure, not the
      data file, not origin, not the deploy log; assert both the data stamp and the visible
      number. Update
      `docs/staging/done/WORKER_FINDING_THE_VALUE_ARMS_ADVANTAGE_IS_THE_LEVEL_NOT_THE_SELECTION_2026-08-27.md`
      to match what is published, and archive
      `docs/staging/in_progress/LANE0_THREE_ARM_AB_ON_THE_S1_WORLD_2026-08-27.md`, whose block is
      now dead.
    why: >-
      The director's thesis contains the requirement in terms: "there has to be a BASELINE to beat
      -- the same book run by a supplier applying flat rules with no per-customer view -- or 'it
      performed well' means nothing." We built that baseline, it is currently beating the
      per-customer arm, and a reader of our own published surfaces cannot tell. Publishing a
      profitable-looking supplier while withholding the comparison that qualifies it is the
      closest thing to a misleading claim on this project, and the remedy is ours to take, not
      his: PROVISIONAL figures are explicitly retractable and therefore not one of the four
      reserved classes. Last of the four because items one and two determine what the number and
      its caveat should say. Finished when the live surface renders the three arms, the selection
      leg, its seed spread and its decision count, and the fetched evidence is quoted. It must
      NOT wait for a better number: publish the current reading with its error bar. A negative
      result about our own arm, published honestly, is worth more to this thesis than a positive
      one we cannot resolve.
