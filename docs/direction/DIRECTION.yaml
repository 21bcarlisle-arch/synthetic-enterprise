    why: >-
      This is third and not fifth for a reason I can now measure rather than assert: two consecutive
      stretches named four lane-0 items and drew three, so position four has been a decision that the
      work does not happen, taken eight times while I told myself it was a priority call. The
      substance has not improved with the delay — the page publishes a comparison denominated in
      constants the tree has since deleted, beside an error bar whose 25.2 spread-to-estimate ratio
      divides a spread from the provisioned clock by an estimate from the realised one, which is two
