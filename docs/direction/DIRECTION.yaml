  - id: store-the-worlds-standing-charges-ex-vat
    lane: W2_customer_generator
    what: >-
      Knowledge first. Use Ofgem's published cap level tables in docs/domain_artefact_library/ or
      docs/market_research/ to establish whether
      simulation/policy_costs._ELEC_SC_PENCE_PER_DAY_BY_YEAR (46p/53p/61p for 2022 onward) and its gas twin
      are inc-VAT. If they are, store them ex-VAT through the named VAT rate (the class control landing now
      will refuse a bare 1.05). Declare the basis in the table. For the pre-2022 "typical market averages",
      find a source or carry them as an explicit named gap (None plus a reason), not as a number that looks
      established. Run it as one variable in its own run, and measure the 2023-2025 electricity DD opening
      move against
      docs/staging/SEAT_FINDING_THE_DD_BOOKS_NOW_OPEN_AT_THE_STANDING_CHARGE_SOLD_AND_THE_WORLDS_CHARGE_MAY_CARRY_VAT_TWICE_2026-10-01.md
      (where 2023 opens at 55.65p against a printed 53p). Also confirm that the in-flight class control
      ("a price crosses the VAT line only through a named rate") reached origin. Do not rebuild it.
    why: >-
      This is the last known VAT-basis defect in the world. It inflates every 2022+ household's fixed cost
      by 5% in the record the company is graded against. The value-arm re-grade is held behind it. DONE
      when the table's basis is sourced and declared and the fix is on origin with its run, or the source
      says they are ex-VAT already and the finding says so, and the class control is on origin.
  - id: size-the-registry-eac-read-error-from-the-published-record
    lane: W2_customer_generator
    what: >-
      Knowledge only, no world change in this claim. From BSCP504/505 and Elexon or Ofgem publications on
      EAC/AA accuracy, read-estimation and smart-meter read frequency, establish how far a settled
      domestic EAC typically sits from the next year's actual use, by meter type (smart, traditional,
      E7/storage). Answer two more in the same finding. (a) Does the Ofgem cap bind a ToU/multi-register
      tariff at its benchmark split, or at the household's realised average rate? Five ToU first bills now
      sit above the flat ex-VAT cap (SEAT_FINDING_THE_SOLD_RATE_NOW_WEIGHTS_THE_TOU_DAY_..._2026-10-01.md).
      (b) Is 28-41 MWh/yr plausible for a GB direct-electric home (PROS-2016-0098, PROS-2024-0082)? Where
      the record is silent, file it as a named gap and a practitioner question. Do not pick a number.
    why: >-
      Year-one bill shock, and so year-one churn, is now set entirely by a read error the model holds at
      zero because no one has looked it up. The swap in item one carries that dependence straight into
      the gradients the company is ranked on. DONE when a finding gives a sourced distribution, or a named
      gap with the practitioner question put, for each of the three. Any world change is then a separate
      pre-registered item.
