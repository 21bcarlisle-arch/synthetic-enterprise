- id: focus-outranks-a-continuation-chain-of-any-author
  what: In background/delivery_lane.py, the continuation-before-focus swap (SELF_HANDOFF_CHAIN_LIMIT,
    _self_issued_chain) counts only continuations written by a tick that held a claim. Add a second leg.
    When the current DIRECTION.yaml's first undrawn focus item has gone undrawn through SELF_HANDOFF_CHAIN_LIMIT
    or more consecutive continuation draws since the record's oriented_at, the next draw takes that item
    ahead of any continuation, whoever wrote it. Continuations that are date-gated or held on waits_for
    are unaffected. Write one control over the whole partition that asserts, in one statement, both that
    a continuation can still win the first draw and that focus wins after the limit. Mutate the leg off
    and show the control goes red. Replay the 17 Nov 15:22Z to 18 Nov 00:24Z draw ledger through it, and
    record in the commit which focus items it would have drawn earlier.
  why: It has gone undrawn through four records. Focus reached the draw once this stretch, but only after
    two continuations queued 0.4h before the last record had run. Done means the leg and its mutation-proven
    control are on origin with the replay's answer in the commit.
