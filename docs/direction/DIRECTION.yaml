thesis_read: >-
  The thesis moved this stretch, and the news is not good for it. All three previous focus items
  were drawn and all three finished, so each one leaves focus. The decision fields landed in
  5f05e0068. The heartbeat stand-down landed in fa489a631. The +£880 was graded in 5cbbad968 against
  a prereg written before any output existed (3b9a11eea). On the per-customer side the partition is
  clean: 69 of the 70 priced accounts were decided differently on both seeds, and that set carries
  +£900 and +£1,197. But the sign tests across it give p=0.77 and p=0.90. And on seed 88888, 94
  never-priced accounts carry +£2,464, a sum of the same size, where no renewal was decided at all.
  The level arm's re-drawn elasticity reaches something other than renewal pricing:
  PROS-2024-0082 has 16 bills in one arm and 5 in the other. So the honest read is that we cannot
  tell whether the arm's decisions made money, and the A/B has a leak that is not a decision. That
  leak must be closed before any inference claim means anything, because a baseline that differs
  from the per-customer arm by more than its decisions is not the baseline the thesis asks for.
  The one-seed capture run that locates it (the 767bd9c03 prereg) is running now as pid 1970916,
  with a waiter on it. The machine went backwards for the third stretch in a row: HEAD is now 30
  behind origin, against 21 and then 11. I deferred the pinning diagnosis twice with no trigger,
  and it grew each time. I re-read the tree this time rather than trusting the carried rows. The
  arrears paths still show dirty (simulation/arrears_engine.py, the untracked reconciliation test),
  but both now equal origin byte for byte. They read dirty only because HEAD is behind. So that
  half of the "stale copies" row is spent. About 135 non-observability paths still differ from
  origin, and a reconciler merge (surgical_land pid 1983095) is in flight as I write. The brief
  credits two items as landed_unbound on 9f929478e. That is a preservation commit on no remote ref,
  while the real grade landed as 5cbbad968, which is another instance of the carried HEAD-not-origin
  row. The weather store landing (f0ba399a4) is real world-fidelity progress off the thesis path.
