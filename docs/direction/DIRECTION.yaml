  - id: PB4_engagement_separated_from_elasticity
    what: >-
      Build PB4 to the four ordered steps in
      `docs/staging/SEAT_FINDING_THE_ENGAGEMENT_ANTECEDENT_R1_NEEDS_IS_DESTROYED_BY_A_COLLAPSED_PAYMENT_BUCKET_2026-09-05.md`,
      AS CORRECTED BY ITS OWN CORRECTION SECTION — read that section before step 1, because step 1 as
      first written is wrong. The correction: `simulation/payment_behaviour_source.generate_payment_method`
      ALREADY draws payment method three ways, anchored on Ofgem 74/13/13 via `dd_attribution`, with a
      live PREPAYMENT branch — and it has ZERO consumers outside its own tests, while the two-way
      `payment_channel_for_customer` (no prepayment at all) is wired into six: `arrears_engine`,
      `final_bill_outcome`, `sim_satisfaction`, `run_phase2b`, `run_phase4c_on_phase2b` and by
      reference `opex_ledger`. So (1) MIGRATE those live consumers onto the anchored three-way draw
      and retire the two-way one; do NOT add a third consumer beside two definitions, which is the
      trap the correction exists to close — the two draws are statistically independent
      (`paychannel_{cid}_{fuel}` against `_base_seed_for`) and measured 41.2% disagreement over 400
      households, so a second consumer picking the other one makes that a LIVE inconsistency the same
      day. (2) Unblend `FUEL_POVERTY_RATE_BY_CHANNEL` onto the two published rates it currently
      averages — prepayment 22.3%, standard credit 18.5% — which stops being a blend the moment (1)
      lands. (3) Give `household_segments.active_renewal_probability_for_customer` its observable
      antecedent, anchored on the CIM ratios in
      `docs/market_research/what_a_supplier_can_observe_about_switching_propensity_cim_w6.md`
      (traditional PPM 1.7% against standard credit 5.7%, base 5.3%), mean-preserving over the
      74/13/13 mix so it cannot re-level the book — the same discipline
      `price_elasticity_for_customer` already keeps. Today that function is
      `random.Random(f"engagement_{customer_id}")` at `household_segments.py:60`, a hash, which is
      the canon's own complaint verbatim in code. (4) Re-run `tools/r1_inference_ceiling.py`, which
      is the falsifier and is currently sitting at its own null. THE CONTROL IS THE POINT: before
      wiring anything, assert the three-member partition is REACHABLE — that a generated population
      contains all three channels and that the engagement multiplier is NOT ~1.0 across it. A
      two-member enum makes this build run, pass and encode no signal, which is exactly what it would
      look like if it had worked. Write that one assertion over the whole partition, not a leg per
      branch, and mutate the antecedent back out to prove it goes red.
    why: >-
      Because it is the only piece of product work in the tree that is fully specified, sits behind a
      gate that already exists, and ends in running the falsifier that decides whether the thesis is
      testable at all. R1's ceiling says the best function of our observables recovers nothing of a
      household's true elasticity that its own noise floor does not also reach — so advantage-from-
      inference is untestable rather than unproven, and it stays untestable while the population has
      no observable to condition on. It is also the answer to the director's canon in the only
      currency that counts: 0 product commits in the last 100, zero lines of `company/`, `saas/` or
      `simulation/` this whole stretch, and PB4 is one of the three atoms rung 1c was silently
      excluding. DONE is `r1_inference_ceiling` re-run with a full-coverage observable and its answer
      published whichever way it falls — a ceiling still at the null is a complete result and gets
      said plainly, not buried.

