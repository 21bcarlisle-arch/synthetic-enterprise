thesis_read: >-
  Three hours, 21 commits, nine substantive, and the thesis got its first honest answer on the right
  population: it is NEGATIVE, and that is the stretch working rather than failing. The director asked
  at 09:23Z to "fix the renewal schedule and rerun the A/B" and both landed. The schedule bug was
  real and large -- `roll_lifecycle_event` returned `None` for every renewal whose month fell past
  the settled window, so whether a customer ever got a churn decision depended on whether their
  anniversary fell on the 31st or the 1st, and six of the nine residential seed accounts were priced
  at eighteen renewals and produced not one lifecycle event. Repaired, `scored_share_of_priced` goes
  57.1% to 100.0%, the arm's advantage survives and more than halves to +£7,066 settled, and the
  belief-quality result does not survive at all: `discrimination_auc` falls from 0.6944 to 0.4653 --
  below a coin flip -- and it is not uniform noise, it is INVERTED in the middle of the arm's own
  range (believed p_retain 0.346 realised 0.818 on n=11; believed 0.616 realised 0.000 on n=4). Read
  beside the same artefact's other fields -- a median margin of £44.50/MWh against the flat rule's
  £2.00, 24% of priced renewals decided by a bound rather than by the model, and 15 of 211 accounts
  carrying 99.3% of the movement -- the honest sentence is that this company raised prices 22x on a
  handful of accounts whose staying-or-leaving it could not predict. That is a claim about the book's
  price elasticity, not about the company's belief, and the advantage is therefore NOT yet
  attributable to inference. It is exactly the result the director said he wanted: a negative result
  on the right population is worth more than a £3M headline on the wrong one. Two of the four focus
  items are finished and gone from this list -- the full-window instruments were sized (559.8s per
  pass measured, 2.85 GB peak, against a 632s upper bound) and the full-window A/B ran and now names
  its book; and the director's 33 reds are reconciled to the node id, all closed, with the reason his
  33 and the machine's 28 were never the same population. The machine also caught two of its own
  errors before either was published -- a 9.4x level-vs-selection headline that was two confounds,
  and a 15.8% "cap breach" that was fixed-term contracts running lawfully through a cap change. What
  has not moved: EP1 was named for the sixth time and not worked, and its instruction went stale
  within the hour, because `353fe96b8` changed the very estimator its ledger grades while that ledger
  still reads `measured_at: 2026-08-26T11:46:22Z`. EP13 was given the company half for the fourth
  time and delivered SIM-side work for the fourth time, and its own cheap close was unbuildable as
  written. And one claim published this morning at 04:45 -- "the ladder: the win is NOT price" -- was
  measured on the broken schedule, over a common population of six decisions, and nothing in the
  document says so. Correcting that is the first thing this direction owes a reader.
