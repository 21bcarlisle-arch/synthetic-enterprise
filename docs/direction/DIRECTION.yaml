    it through tools/isolate_hunks.py first. THEN explain why the run''s considered renewals fall from
    53 (2017) to 25 (2018) to 3 (2019) in both B8 L3 arms, while 17 below-threshold leavers left in 2019
    against 2 offers (SEAT_FINDING_B8_L3_THE_RUNS_OWN_HOLDOUT_CANNOT_DECIDE_AT_THE_FOUNDERS_SCALE_2026-10-09.md).
