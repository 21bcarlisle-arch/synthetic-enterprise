focus:
  - id: land-or-delete-the-untracked-settlement-clocks-pair
    what: >-
      `simulation/settlement_clocks.py` and `tests/simulation/test_settlement_clocks.py` are still
      UNTRACKED, and `tools/run_annual_report.py:69` and `simulation/run_phase4c_on_phase2b.py:96`
      are still modified-unstaged carrying `from simulation.settlement_clocks import …`. Do this
      first and do not start anything else until `git status` shows neither the pair nor the orphaned
      imports. Two legal moves and either is acceptable: commit supplier, test and both consumers as
      one pathspec through `python3 -m tools.surgical_land`, or revert the two import hunks and
      delete the untracked pair. If you commit it, the commit message needs the REUSE block — run
      `tools/write_time_gate.py --explain simulation/settlement_clocks.py` before you write it. If
      you cannot tell which move is right in ten minutes, take the delete: the module is in nobody's
      clone, so nothing is lost that cannot be rewritten, and the hazard is removed either way.
    why: >-
      Seventh consecutive direction naming it, and the hazard is no longer theoretical. Any lane
      committing either of those two consumers by pathspec — the normal and correct way to commit in
      this tree — ships an import of a module that exists in no other clone, and takes the annual
      report down for everybody. That exact failure mode materialised tonight from a different cause:
      `8452695d1` records the annual report crashing on the first miss it could not price and wedging
      publishing for over three hours. It is first not because it is important but because placing it
      below important work is a decision I have now made six times and it has produced nothing each
      time. Done means `git status` is clean of all four paths.
  - id: settlement-ceiling
    what: >-
      `SETTLEMENT_CUSTOMER_YEAR_BUDGET = 1200.0` in `simulation/net_new_acquisition.py:457` refuses
      335 of 380 funnel wins and binds the book in nine of ten years. Its own note says it is 60% of
      the 465 measured in AO12's scale probe — so the ceiling has provenance, and the question is
      whether that provenance is still true. Re-run AO12's probe on this machine, at the run shape
      the live path actually uses, and measure two things directly: wall-clock and peak RSS per
      settled customer-year, and what
      `background.resource_headroom.sample()["total_mb"]` says is available now. Then set the ceiling
      from what the probe supports and record the probe artefact as its evidence beside the constant,
      the way the existing note does. Do not pick a round number, and do not pick one that makes the
      book look a particular way — if the probe says 1200 is right, say so and the finding is that
      the ceiling is real, which is a different and equally useful answer. Then re-run the live
      campaign and report three things: how many wins book, what the gradable ladder population
      becomes (the worker on the item below has the current figure — sixteen decisions, term starts
      all 2016-2018, and the per-rung by-year census that explains it), and what happens to R6's
      £316,009 headroom. The re-run will move the published net figure; whatever it does, the report
      must say in terms that the change is the ceiling lifting and not the method working, because
      those are the two things a reader will otherwise confuse.
    why: >-
      This is the binding constraint on everything else on this board and two separate findings named
      it as their top item last night before any direction did — the founder-book ruling
      ("**the bigger finding this exposes, and it outranks the one this document was opened for**")
      and R6's WORK THIS CREATES item 1 ("**this is the top item**"). I read both and put it nowhere,
      which is the miss of the stretch. Follow the thread: B10 cannot be graded on sixteen decisions;
      PB4 and PB5 build heterogeneity models against a population that cannot reject them; R6's
      mechanism works through growth and has no growth to work through; and nine of ten published
      growth years are a constant in one file expressed in customer-years. The founder book was the
      bet that deepening the book would fix `n` and tonight's measurement says it did not, because
      the ceiling and not the window is the bottleneck. Note what this is and is not: this is an
      engineering ceiling with no counterpart in the world, so lifting it removes an artefact rather
      than changing the curriculum, and it moves the experiment toward being MORE falsifiable, not
      less — more gradable decisions is more chances to be refuted. If the probe comes back saying
      the machine cannot support more, that is a real answer and it changes what the next direction
      is about. Done means the constant carries a measurement taken this week, a live re-run reports
      what booked, and the gradable population is stated as a number beside the old sixteen.
  - id: B10_competitor_switching_response
    what: >-
      A worker had the ON arm on disk at 02:57 (`docs/observability/ladder_chase_on_founder_2021.json`
      plus its `ledger_census.json`) and filed the prediction before the OFF arm finished
      (`docs/observability/ladder_2021_prediction_before_the_off_arm.md`, 03:03). Pick it up from
      there: confirm the OFF arm completed, run the comparison, and write the outcome BESIDE that
      prediction in its own file, never over it — it predicts one moved rung, at most two, and names
      exactly what would refute it. Then close the item one way or the other. Either RECORD B10's
      move from level 2 with the measured belief-versus-truth gap, or file the fourth refusal, and if
      it is a refusal it must name the ceiling above as the specific missing thing rather than "more
      data" — which, on tonight's census, is what the numbers actually say.
    why: >-
      The level move is the thesis made checkable, and this is the run that decides it. The third
      refusal was right and said there was no design question left, only an `n` question; the founder
      book was the answer to the `n` question and the ON arm's own census says it did not reach the
      measured population. That makes this item's real output a diagnosis with numbers attached, and
      it is what turns the item above from my judgement into the run's. A preregistration with no
      answer beside it is the one artefact this project cannot leave lying around — its whole value
      is that it was written before the result was known, and that value decays from the moment
      somebody could have looked. Done means B10 moves and is RECORDED, or the refusal is filed with
      the per-rung by-year table in it, and the prediction is graded in its own file either way.
  - id: crm-reconciliation-that-cannot-fail
    what: >-
      `saas/reporting/annual_report.py:3566-3612` publishes a "SIM ground truth vs company CRM
      reconciliation" whose CRM side is built by replaying the SIM's own event list
      (`run_phase2b.py:2934` ← `_build_company_event_log`, a SIM-side function), under a section
      headed "Company CRM — Event Log" that never reads
      `LiveSimInterface.event_log`. Three moves, in this order. (1) Rename the section to what it is,
      or rewire it to the company's log — it cannot be titled as the company's and sourced from the
      world's. (2) The Match column is a one-sided containment check between two projections of one
      write and cannot read "mismatch" for the failure it exists to catch; delete it or make its two
      sides independent, and a published control that cannot fail is worse than no control. (3)
      Dispose of the five surviving `if sim_interface is not None` guards at `run_phase2b.py:1777,
      1821, 1853, 1953, 1983` — no production entry point passes an interface, so each observable is
      present only in tests. Whichever has a real consumer moves out from behind the guard the way
      the pressure ledger's did; the rest get deleted, because a seam only tests satisfy documents an
      intention nobody implemented. Whatever you land, key the control to the property — assert the
      reconciliation's two sides do not share a writer — because a control pinned to today's "yes"
      goes red exactly when the report becomes more honest. The finding carries a prediction about
      what happens if you do (3) without (2); grade it beside itself.
    why: >-
      A published artefact carries a "Match: yes" column over a ledger with nothing in it, and the
      two defects are one defect seen twice: the guard starves the real CRM, and because the report
      reconstructs the CRM from the world the starvation never surfaces. This is also the cleanest
      available statement of the epistemic wall — the company's record of what it saw versus what
      actually happened is exactly the comparison this project exists to make honestly, and right now
      it is a mirror. It sits fourth rather than higher because it is a claim inside a report rather
      than a headline figure and because the finding is filed and legible in the meantime; it sits
      this high because it is a false statement we are publishing today. Done means the section's
      title matches its source, the Match column is either falsifiable or gone, and each of the five
      guards is either plumbed or deleted with the reason written down.
  - id: capabilities-one-clock-one-basis-one-bound
