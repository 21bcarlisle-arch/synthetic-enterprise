  - id: the-capacity-that-refuses-the-thesis-book-stands-on-nothing
    what: >-
      Establish what actually bounds `simulation.net_new_acquisition.SETTLEMENT_CUSTOMER_YEAR_BUDGET`,
      and re-rule the ratio it refuses. Two halves of one subject. (a) TAKE THE MEASUREMENT THE
      CONSTANT HAS BEEN WAITING FOR SINCE AUGUST. §6a and §7 of
      `docs/design/SETTLEMENT_CEILING_ALLOCATION_2026-08-29.md` specify it and say why it was not
      taken: seconds and MB per marginal customer-year, on a QUIET box with the live producer stood
      down, against the stable ~1,000s baseline of the eight runs before the allocation change — a
      wall clock taken under contention measures the contention. Launch it with
      `background.launch_long_job`, because a job started from a bounded tick dies with its cgroup, and
      record wall clock and peak RSS per customer-year at each book size the run reaches, plus whether
      the two existing cost points still lie on the curve. (b) THE TWO PUBLISHED DENOMINATORS DISAGREE.
      `site/data/value_arms.json` renders `this_book_customer_years: 1122.0` from 164 accounts, giving
      `required_customer_years_smallest_leg: 3163.87` and a multiple of 2.64x against the 1,200; the
      result filed with `c58350e2e` establishes that the promoted control arm settles 154 accounts and
      computes 1,029 customer-years and 2,902 required, a multiple of 2.42x. One denominator is a run
      stale. Establish which, and make the feed and the document read the same book before either
      number is compared to a capacity again.
    why: >-
      This is the whole remaining lever on the thesis and it is currently held shut by a number the
      code itself declares undefended. `what_would_settle_the_sign` prices the smallest leg at 2.82x
      this book and states that bound is ATTAINED, so it will not fall when the missing floor legs run;
      the memory ceiling re-ruled to the records the book actually retains is 38,275 customer-years,
      about twelve times what that leg needs; and the feed's own `what_is_not_established` says the
      open question is now "why that capacity is where it is". PREDICTION, FILED BEFORE THE RUN SO IT
      CAN REFUTE ME: at the probe's own two cost points — 796.1 customer-years at 746.8s on 2026-08-24
      and 1,200.0 at 1,018.7s on 2026-08-29 — the marginal cost is ≈0.67s per customer-year on a ≈215s
      fixed component, so the smallest leg's book should settle in roughly 2,300s on a quiet box, and I
      predict wall clock will not bound it either and that 1,200 will turn out to be bounded by
      nothing. Against that prediction: the run completing on this box today took 1,450s at 1,122
      customer-years, about 1.5x what that curve predicts, so either the curve is stale or the box was
      contended — which it is, is the first thing this measurement settles, and if the curve is stale
      my prediction is probably wrong. FINISHED means either the constant carries an origin naming a
      measured cost curve and a stated interval, or a finding says plainly that no evidence bounds it
      and records what the code should carry instead of 1,200 — and the two published denominators
      agree. A measured "this world cannot reach it" is a complete answer; what is not acceptable is
      the current state, where the thesis is refused by an interval preference nobody has stated.
  - id: a-merge-that-authored-nothing-is-not-this-lanes-work
    what: >-
      Make `background/commit_narrative._carries_work` ask the COMBINED DIFF of a merge instead of
      comparing trees. It returns True whenever the commit's tree differs from EVERY parent's tree,
      which a reconciliation merge always does: `f56852e25` carries tree `bb737f158` against parent
      trees `8b58f2e8e` and `e38e670da`, so it scored as work, while `git show --name-only` on it — the
      combined diff, which is exactly the set of paths differing from ALL parents — is empty, and the
      brief's own `commits[]` field computed that and marked it `files: []`, `substantive: false`. For
      `len(parents) > 1`, a merge carries work only where the combined diff is non-empty. Keep the
      three-valued answer: an unreadable diff stays None, because "I could not read it" and "it
      changed nothing" are different answers and only one is a defect report. Write the control as ONE
      assertion over the whole partition — a reconciliation merge that authored nothing, a merge that
      resolved a conflict and therefore did, and a plain single-parent commit — so the rare branch is
      provably reachable rather than a guard that refuses everything and passes every leg.
    why: >-
      This is the instrument I grade the machine's liveness from, and last stretch it reported 100%
      work-carrying across a stretch in which 43% of the commits were the machine reconciling with
      itself and nothing reached a reader. Second listing in `wrong`, and a reconciliation merge is the
      most common commit this box produces. A control keyed to the tree comparison is blind to the
      merge that authored nothing, and the repair needs no new vocabulary — the correct reading is
      already computed elsewhere in the same brief. FINISHED means `commit_narrative` and the brief's
      `substantive` field return the same verdict for every merge in the last two hundred commits, and
      a test that names the disagreement it closes.
