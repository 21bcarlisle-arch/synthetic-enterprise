  off-day rows trace to one line: generate_billing_ledger.py:1118 dates a no-case level return's repayment by the
  netting day. The other two items moved but are not finished. N29's knowledge (3c3e3d59d) and blind row (c933ba6c1)
  are on origin. The row reads 60 of 149 on 6fe7827ab2, held by a ceiling exception. The set-off build was replayed
  and stopped before landing: it took the row to 31, but it posted the set-off beside the debt case instead of netting
  it, which pushed 4 case write-offs past the page balance and would have refused the publish. Catching that before
  landing is the method working. The level-DD reader is landing now (surgical_land pid 3339985, not yet on origin). It
  reads 33 holds on 15 accounts, against the map's 36 on 18. The miss is the prediction's arithmetic, and it is
  written beside the prediction. Cause B is traced on SYN-2016-380 to a different place than the map assumed. The cash
  was not posted late. The ledger walk gave it to the next failed bill's case (generate_billing_ledger.py:1192-1196),
  and arrears_engine.py:798 dates it at that case's opening. So two learning-loop STOP areas, level-dd and
  repayment-posting, now point at the same thing: how the billing ledger dates and assigns a repayment. They are one
  area, and the next item maps it as one rather than fixing either half. The commit_split reads 0 supplier and 9
  other. That is the classifier reading docs and tools paths, not the work: five of the eight working commits grade or
  change supplier billing. Against the thesis itself nothing moved. The flat-baseline comparison (c65c4cb8b) is still
  the only test of "beats average by inference", held by the ban on model arms until 16 Nov. It is first for that
  review, on a book carrying N28 and the N29 set-off if the set-off lands before the 16 Nov 04:00 publish. The checkout
  is 24 behind origin and every daemon lacks 2 to 7 commits. That stays as it was: three writers share the tree. It
  does bite in one place. The brief's BLOCKING count still lists the 205-of-238 refund finding, which 63ede2e3b retired
  on origin, because the shared tree holds a stale copy. That is filed as wrong below.
