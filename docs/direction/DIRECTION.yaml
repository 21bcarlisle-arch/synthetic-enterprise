    corrected: false
  - what: >-
      I published, as the lead sentence of my last thesis read, that the world *"quietly lost a year
      of the historical truth that is supposed to be the precondition"* — a wall-breach claim about
      2022, stated with confidence, on evidence that equally supports the world's crisis mechanism
