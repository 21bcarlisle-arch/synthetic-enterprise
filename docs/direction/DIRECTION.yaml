thesis_read: >-
  The thesis did not move this stretch, and for the second stretch running the record's first item
  was not drawn. With the better desk belief, the per-customer supplier still loses GBP 1.35 per
  household-year against its flat-rules baseline (-3.03 to +0.13). That is better inference failing
  to become value, and it is still the most important unread question in the project. It needs no
  box time and nobody has opened it. The executor spent the stretch on five continuations instead.
  They covered the director's acceptance rate and answer codes, the decision kinds, and two
  commit-gate selection censuses. The censuses then fed an evidence-page repair. All of it is
  reasonable harness work, and while it ran the supplier read waited. The split is 0 supplier, 1
  world and 21 other. 8 of 22 commits were substantive and 10 carried no work: eight merges and two
  verification-paused banners. Last record said that if the first item went undrawn again while
  continuations held the executor, that would be the moment to change the order. It has happened,
  so the order change is focus 3. The cause is mechanical. SELF_HANDOFF_CHAIN_LIMIT in
  background/delivery_lane.py counts only continuations a tick wrote for itself. Continuations
  written by a session that held no claim never trip it, however many of them sit ahead of focus.
  Two such rows are drawable now (advisor-recommendation-decision-kind and
  c2-level-after-archive-4b), so without the change focus 1 waits at least two more ticks. The one
  real step toward a supplier result was the D5 book. 870cfa8a4 armed d5book-pause-watch. It waits
  for step 6's pair 33333_44444 (its log reads 2018-09 in that pair), stops step 6, lets sim-runner
  run the next book, and relaunches step 6 when that book's run_complete lands. 317b1d56c found that
  the shared tree's D5 switch held pre-switch-on bytes, which would have deferred every next book,
  and fixed it. So the mechanics of last stretch's focus 2 are done, and the grading is not. The
  focus item now covers only what remains: read the D5-on book, grade rows 4 and 7, and get a
  publish or name each refusing row. The publisher has failed 47 times over 31.7h, still on the
  16 Nov book. 870cfa8a4 names the refusal as domain invariants 7 (overdue within page balance) and
  5 (gas repeating last year), and e2f615589 adds that every cycle regrades the refused book and
  redraws the wedge. Corrections: none of the ten open rows is corrected. The seat's "fits beside"
  row is half remedied, because the pause is armed but no D5 book has run. One seat error is added
  below: last record pre-committed to an order change and wrote no item to make it.
