not_now:
  - what: Raising surgical_land's 3600 s gate deadline, or trimming the MSC selection by hand, to get the MSC win landed.
    why: >-
      Both weaken the one gate that most needs to be strong (it covers changes to the money modules) to land one
      change. The flock and a measured selection duration come first. A slower MSC landing costs a day; a gate that
      can be bypassed costs every later ledger change.
  - what: Switching the conditioned renewal belief on now, on the strength of 0.857 against 0.452.
    why: >-
      The comparison was pre-registered as a baseline, and B8's pre-registration gates the switch-on on five grades
      from the coming book (25 Nov). Flipping it before then would spend the blind holdout's evidence in order to
      win two days. The pre-flight item makes those grades read the first time instead.
  - what: Letting the book share the box with s.12g.
    why: >-
      About 18h of s.12g remain. Running both together saves at most that, and it risks the run that measures the
      thesis, which the director said not to kill. I withdraw the concern below for this reason.
  - what: A heartbeat line in the mute worker-seat-manager.
    why: >-
      Its cause is on file and its wait channel is still hrtimer_nanosleep. It is a behaviour change to the daemon
      that seeds the worker seat, and no supplier result waits on it.
  - what: Reaping the 11 worktrees that hold commits no remote keeps, and the stalled site atoms.
    why: >-
      A reap cannot be undone, and each worktree except wt-closedacct is locked with a named owner. wt-closedacct is
      focus item 1's source, and its branch goes only after that work is on origin. The site atoms are waiting on a
      book to publish.
  - what: PB4/PB5 (C29's blockers) and G15 follow-on grading.
    why: >-
      Neither changes a per-customer decision this week. Turning the better renewal belief on, through the pre-flight
