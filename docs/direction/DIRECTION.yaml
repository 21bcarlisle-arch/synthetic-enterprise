focus:
  - id: the-only-control-holding-the-level-anchor-is-red-and-reports-a-constant-pass
    what: >-
      **Two tests are red at clean HEAD and they are the accountability route for the quantity every
      other item on this list depends on.** Verify before acting and do not take my word for it —
      extract with `git archive HEAD` into a clean stem rather than disturbing this tree, and run:

      ```
      tests/architecture/test_switching_rate_commons.py::test_the_worlds_realised_departure_rate_is_inside_the_published_band
      tests/architecture/test_switching_rate_commons.py::test_the_instrument_prints_the_distance_to_both_band_edges_and_not_only_the_verdict
      ```

      Expect `2 failed, 24 passed, 1 xfailed` with
      `AssertionError: only 7 years had their margins checked -- a control over an emptied subject
      reports a constant PASS`. That message is the catalogued shape, written by the control about
      itself: **a control over an emptied subject cannot fail, so its PASS carried no information.**

      **Establish WHY the subject emptied before repairing the count.** Eight years of margin became
      seven; the question is whether a year stopped being produced, stopped being read, or stopped
      being classified — three different defects wanting three different repairs, and only one of
      them is in the test. `test_switching_rate_commons.py` classifies `YEAR_LEVEL_ANCHOR` and
      `year_level_anchor` under `_HELD_INDIRECTLY`, explicitly *"held through its EFFECT — the
      world's realised departure rate, which is `_PRINCIPAL_SUBJECT` above and is band-checked every
      run"*. If the emptying is upstream in the run, the register's indirection claim is the thing
      that is wrong and it must be corrected in the register, not patched in the assertion.

      **Do not repair it by asserting seven.** Keying the leg to today's subject size is the exact
      move that makes a control go green when the code becomes more honest. Key it to the property —
      *every year the record publishes has its margin checked, and a year that cannot be checked is
      named and refused rather than dropped* — and make the refusal say which year and why.
      Mutation-prove with `python3 -B`; two same-size edits inside one second match on
      `(mtime, size)` and the harness reports SURVIVED off a stale `.pyc`.

      **Pathspec:** `tests/architecture/test_switching_rate_commons.py` and whatever single producer
      the investigation names. Nothing under `saas/reporting/` or `tools/generate_dashboard_data.py`.
    why: >-
      First because it is small, it is red **now**, and everything else in the anchor lane is
      unsafe while it is red. `WORKER_PREREGISTRATION_WHAT_MAKING_THE_LEVEL_ANCHOR_FALLBACK_MATCH_ITS_JUSTIFICATION`
      grades it G4-CONFIRMED as pre-existing, records it as owed and — correctly, given its pathspec
      — did not repair it, then says the thing that promotes it to first: *"the single indirection the
      register relies on to hold this quantity accountable is, at HEAD, not holding it. That is what
      made a silent 1.98x on 2022 survive a capture, a fit and two preregistrations."* Item three
      re-runs the capture and may emit a block that looks adoptable; **a fit whose only accountability
      control reports a constant PASS is a number with nothing behind it**, and this project has been
      burned by adopting exactly that shape before. It is first rather than third because it is
      minutes of work standing in front of hours of other people's, and because a pre-existing red at
      clean HEAD is a tax on every lane that touches the file. **Done means:** both legs green at
      clean HEAD with the cause of the emptying named in writing; the leg keyed to the property, not
      to a count; the refusal naming the missing year and its reason on the surface rather than
      dropping it; one mutation-proven leg; and the `_HELD_INDIRECTLY` classification either
      re-justified against what was found or corrected. If the honest answer is that the indirection
      never held it, **say that** and file it — that is a bigger finding than the repair.
  - id: one-field-is-published-a-hundredfold-apart-in-two-tables-of-one-report
    what: >-
      **Unchanged in content, still live on origin, and promoted from third because ranking it third
      bought it zero ticks.** Verified this orientation against the served file, not the generator:
      `git show origin/main:docs/reports/ANNUAL_REPORT.md` line 2447 reads
      **`Worst bill shock: **2022** (0.58%)`** and line 2430 attributes the band to Ofgem —
      *"bill shock <0.20% (GREEN) / <0.30% (AMBER) / ≥0.30% (RED)"*. The same
      `financial.annual[].avg_bill_shock_pct` is a **fraction** (2022 = `0.58`), rendered ×100 as
      **`57.5%`** by *Bill Shock Analysis* and raw as **`0.58%`** by *Customer Service Quality*.
      Read `saas/reporting/annual_report.py` at **7123, 7136, 7166, 9004, 9020** at HEAD before
      changing anything.

      **Three separable defects wanting three different repairs — establish which before you touch
      one.** (i) The **units**: one rendering is wrong and it is not a formatting preference. Decide
      what the field is, name it so it cannot be misread, and fix the renderer rather than the callers
      one at a time. (ii) The **comparison**: a mean shock *magnitude* is being judged against a band
      whose own wording reads as an *incidence rate*, and the report publishes an incidence in the
      same rows (`Shock Rate`, 16%–23%). **Before comparing two numbers, say out loud what each one
      counts.** If they are not the same subject the comparison does not become right by rescaling it.
      (iii) The **band's origin**: check `docs/market_research/` and `docs/domain_artefact_library/`
      for whether Ofgem publishes anything of this shape at all. **If nothing establishes it, that is
      a finding to file and the code carries the gap explicitly** — an honest refusal with a named
      reason beats a plausible band, and this one is attributed to a regulator in the company's own
      published report.

      A verdict that is RED in all ten years and HIGH in all ten **has no reachable other branch**.
      Key the control to the property — *the bands are reachable in both directions on the real
      series* — never to "2022 is the worst year", which pins today's answer.

      Both `7123` and `9020` read the field as `... or 0.0`, so **a missing year currently publishes
      a measured zero**. Fail it closed and say so on the surface.

      **Note what changed underneath it since I filed this:** `docs/reports/run_output_latest.json`
      was regenerated at 20:06 and the 20:20 run at `69f2f4058` carries the signed shock. The
      hundredfold split is a rendering defect and is invariant to that, but **read the current figures
      rather than quoting mine**.

      **Pathspec:** `saas/reporting/annual_report.py`, `tests/saas/`, `docs/reports/ANNUAL_REPORT.md`.
      Nothing under `tools/generate_dashboard_data.py` or `simulation/`.
    why: >-
      Second, and it is here rather than third because **I ranked it third last orientation on merit
      and the lane delivers one item per stretch, so "third on merit" is "not done".** That is my
      ranking error to own, not the machine's. It is still the only item on this list where a **wrong
      number is served right now under Poesys's name**, in the document `site/data/proof.json`,
      `evidence.json` and `simplified.json` all point a reader at. It is this project's most
      expensive recurring shape twice over in one screen: *before measuring a thing, say what it is* —
      a magnitude and an incidence given one name and then compared; and *a control whose PASS branch
      is unreachable reports a constant verdict* — ten years of RED that no state of the company could
      change. **A supplier's own annual report telling its reader that 2022's worst bill shock was
      0.58% when the same file says 57.5% is not a rounding disagreement**, and the epistemic argument
      the whole project rests on does not survive a reader finding it. It sits below item one only
      because item one is minutes and guards the lane below it. **Done means:** one quantity, one
      name, one rendering across both tables, with the mean and the incidence named separately where
      both are published; the Ofgem attribution sourced from the commons or removed and replaced with
      a stated refusal; the RAG demonstrated reachable in both directions or withdrawn; the `or 0.0`
      defaults failed closed; and a mutation-proven control keyed to the property. If the tables agree
      because one was deleted, **say so explicitly** — that is a legitimate answer and a silent
      deletion is not.
  - id: the-whole-book-fit-is-unblocked-and-has-never-been-run-against-the-repaired-world
    what: >-
      **Both pre-registrations named the same blocking owed item and it has landed. Nothing has been
      re-run since.** `WORKER_PREREGISTRATION_WHAT_A_RERUN_FROM_THE_CLEAN_TREE_MUST_SHOW` owes
      *"wire the ASSIGNMENT — thread `rolls_active_renewal`'s answer into `build_renewal_schedule`"*;
