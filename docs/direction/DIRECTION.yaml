      favour. All three exist. `run_output_latest.json` carries `svt_departures` with **exactly 50**
      entries — 82 churned accounts minus 32 churn events lands on it precisely — each with cause
      `svt_inertia`, its hazard and its roll, added deliberately by C1b. I read a mechanism landing
