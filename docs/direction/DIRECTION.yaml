  - id: PB5_pounds_or_percent_resolved
    what: >-
      Settle from published evidence whether the household switching decision keys on a PERCENTAGE
      saving or on POUNDS PER YEAR, then wire whichever the evidence supports into the switching
      decision and say in the commit message what the other branch would have implied. Research
      first and from the commons — the same route that produced the CIM banner this stretch, which is
      the proof the route works: every GB price comparison site and the Ofgem cap headline itself
      present an annual GBP figure, never a percentage, so a supplier modelling the decision in
      percent is modelling a number the customer is never shown. Establish that against the published
      record rather than asserting it; if the evidence does not settle it, that is a finding to file
      and the code carries an explicit gap, not a plausible constant. This is the same lane and the
      same population as PB4 and `couples_with` it in the map, so land it on top of PB4's three-way
      channel rather than beside it.
    why: >-
      Because it decides who is worth chasing, and the two answers are commercially opposite: on
      percentage every household is equally worth chasing per point of margin; on pounds a large home
      is far cheaper to win because the same percentage buys more visible saving. That is a
      per-customer commercial decision made on what the supplier can observe, which is the thesis
      stated exactly. It is at level 0 against a level 2 intent, it is product-priority and now
      exempt from the rung that was excluding it, and it is stalled at 1883 unchanged draws. DONE is
      the decision made from a cited source and live in the switching path, with the losing branch's
      implication recorded beside it.

