      the strength of a fix whose confirming run has not been done, is pushing an unmeasured
      pricing decision behind the wall for the company to rediscover.
  - what: Applying the 0.204 rescale that would take the CLV gap from 2.529 to 0.806.
    why: >-
      It is one line and it would look like four fifths of a fix. It is a constant fitted
      in-sample to the exact comparison it would then be judged by -- R12's goal-seek and R15's
      tautology in a single edit, with the answer written into the input. The decomposition is a
      diagnosis and the third focus item uses it as one: it says the error is a single systematic
      magnitude, which is a place to look and not a number to subtract. Rejected for the second
      record; recorded again because it stays tempting for exactly as long as the gap stays above
      one.
  - what: Moving EP13 to level 3 on the strength of the landed fetcher, which is what I asked for last night.
    why: >-
      The atom's own L2 entry refuses it in three places and I did not read it before writing the
      instruction. A level move that ignores the reservations the previous self-certification
      wrote down is the record outrunning the code one step along -- the exact error that entry
      was written to prevent. Replaced with the coupled rung, which is the work that would
      genuinely earn the level.
  - what: Explore's remaining stages with real data, the director's third console priority.
    why: >-
      Deferred a second time and the reason has changed rather than weakened. Publishing is live
