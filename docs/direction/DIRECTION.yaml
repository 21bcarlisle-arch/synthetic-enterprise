  - id: the-segment-dial-generates-a-population-rather-than-selecting-one
    what: >-
      Discharge the tree's only BLOCKING finding,
      `docs/staging/WORKER_FINDING_THE_SEGMENT_DIAL_CHANGES_WHICH_HOUSEHOLDS_EXIST_NOT_JUST_HOW_MANY_2026-08-30.md`.
      `SE_SERVED_SEGMENTS="resi"` yields 257 residential households where `"resi,SME,I&C"` yields
      238, at the same seed, and the sets are not nested in either direction. The mechanism is
      located and named: in `simulation/live_population.py` the growth campaign filters its WINNERS
      correctly but plans against `_pre_growth_book(seed)`, which is itself segment-filtered, so
      suspending a segment changes the book the campaign plans against, which changes its stochastic
      funnel, which changes which residential prospects it wins. Make the campaign plan against the
      unfiltered book and filter only at the output, so the dial selects from a fixed population
      instead of generating a different one — and **prove the repair is inert on the live world**,
      which it should be, because the published book serves all segments and the filter is then the
      identity. Print the two censuses before and after. Then key the control to the property rather
      than to today's answer: the invariant is that the served set is a subset relation across any
      pair of dial settings, not that some particular count is 257.
    why: >-
      Third because it is the only BLOCKING finding open, because a curriculum dial that cannot be
      moved and attributed is a broken instrument belonging to the director, and because it is
      cheap and provably inert on anything published — the finding says so itself: *"no published
      figure is known to be wrong; it is the measurement that is unsafe, not the current number."*
      It is below the two items above precisely because of that: nothing downstream is wrong today,
      so it costs nothing to sit one slot lower, and the two above are respectively the thesis and an
      answer already computed. It earns its place in the file rather than the backlog because
      `served_segments` appears in `book_identity` on the artefact item two is about to promote, and
      because C1's SVT assignment will change which households exist along a second axis — doing that
      on top of a dial that already moves the population is how two changes land at once and neither
      can be attributed. **Done means:** the campaign's input unfiltered, the subset property holding
      across dial settings with a test that fails on the old code, both censuses printed, and the
      finding archived to its class.
