focus:
  - id: the-twelve-seed-floor-lands-in-hours-and-must-not-be-pooled
    what: >-
      A long job is about to deliver and the default handling of it is wrong. PID 3432960 is running
      `tools.run_value_cycle_ab --noise-floor-seeds 3100001,...,3100012 --redraw-mode all
      --redraw-key elasticity --out docs/observability/value_cycle_ab_s1_noise_floor_next12_at_18327d977.json`
      in `/var/tmp/se-floorrun-head-20260918`, from commit `18327d977`, since 2026-09-18 15:13Z.
      WATCH IT BY COUNT, NOT BY CLOCK: `grep -o "seed=31000[0-9][0-9]" /var/tmp/longjob-floor-next12-at-head-20260918.log
      | sort -u` gives nine of twelve now; the "Starting treasury" banner fires 57 times over those
      nine and is NOT a per-seed unit, so do not price progress off it. Use `tools/wait_for.py`, never
      hand-rolled `pgrep`, and do not kill it. When the artefact appears, copy it out of the extract
      and land it by `python3 -m tools.surgical_land` by pathspec. THEN PRICE THE TWELVE AS THEIR OWN
      FAMILY AT `18327d977` AND POOL THEM WITH NOTHING. `docs/staging/WORKER_RESULT_THE_EIGHTEEN_SEED_FAMILY_IS_SPLICED_ACROSS_AN_OBJECTIVE_CHANGE_AND_THE_TWENTY_FOUR_SEED_PRICE_CAME_OFF_THE_SPLICE_2026-09-17.md`
      is BLOCKING and already establishes that the existing eighteen are nine at `c066c114b` (no
      departure cost) and nine at `9f0ab066f` (£27.50 departure cost), that their means are £908
      apart, and that pooling them produced a seed price that came off the splice. `18327d977` is a
      THIRD tree. File a reading of the twelve alone — mean, sd, sems from zero, and whether a sign
      on `selection_gbp` is stateable — and one sentence saying they were not pooled and why. State
      in the same document that all thirty seeds predate `05684780e`, so none of them sees the
      world's new default-tariff exit. Do not launch a top-up run to make the family bigger.
    why: >-
      `selection_gbp` is the thesis quantity — the value of choosing per customer — and it is £270.21
      of a £17,738.64 advantage whose other £17,468.44 is level. Twelve homogeneous seeds is the
      largest single-tree family this project has ever had on it, and pooling destroys precisely the
      property that made fourteen hours of the only box worth spending. DONE is the artefact in a ref
      and a filed reading of the twelve on their own terms. WHAT WOULD PROVE THIS INSUFFICIENT: if
      the reading is filed and any page or artefact still renders a figure pooled across the three
      trees, or if a later run tops the family up across another tree, then the separation was a
      document and not a mechanism, and the next direction should order the mechanism instead.
  - id: can-the-worlds-new-svt-exit-reach-a-priced-boundary-at-all
    what: >-
      DO NOT RUN THE WORLD FOR THIS, AND DO NOT START A SECOND `run_value_cycle_ab` WHILE THE FLOOR
      RUN HOLDS THE BOX. Read the code path instead and file a prediction before any run exists to
      check it against. `05684780e` gave the household that ARRIVED on the default tariff the same
      exit the rolled one has, in `simulation/renewals.py`. Trace from that exit to the funnel stages
      in `company/pricing/value_based_renewal.FUNNEL_STAGES`, using `tools/decisions_that_existed.py`
      (which owns the membership rule and derives the population from the funnel's own stage counts)
      and `tools/svt_refusal_census.py` at `209f26be4` (which established that of 2,824 renewals
      offered, 2,490 refuse at `product_not_upliftable` as published cap segments and 227 at
      `acquisition_term`, leaving 107 decisions that existed, all 107 decided). Answer one question in
      a filed finding: can a household that takes the new arrival-exit land at a boundary where this
      supplier strikes a rate — all three membership conditions true — or does a guard stop it first?
      Name the guard by module and line either way. If it CAN, write the predicted direction of
      `decisions.decisions_that_existed` (today 107, priced share 0.972) BEFORE the next run, and say
      what would make the prediction wrong. If it CANNOT, say so plainly and the item is finished:
      no amount of compute will move 107 and the world owes another edge. Keep the `inference_claim`
      population of 54 and the 104 scored decisions apart — they are two censuses and differencing
      them is the defect this whole line of work exists to avoid.
    why: >-
      My last direction told a worker to re-read these counts "after the next completed run
      publishes". A run completed at 05:04 and `run_generated_at` did not move off 2026-09-18T05:43:40Z,
      because nothing but `run_value_cycle_ab` writes that feed and it is fourteen hours into a
      different question. The premise was false, so the item as written was unworkable — and the
      version that does not need compute is strictly better anyway: it is a prediction filed before
      its answer can be known, which is the only kind this project counts. DONE is a filed finding
      naming the guard, and either a pre-registered prediction or a plain statement that the world
      owes another edge.
  - id: the-sweep-cannot-see-a-finding-that-names-its-own-claim-id
    what: >-
      FIRST, a binding is owed and costs one command. The lane recorded
      `reconcile-the-fork-and-take-the-repair-that-is-already-on-the-branch` as `landed_unbound`
      against `2f436602b`. Read that commit; if it is the work, run `python3 -m
      background.delivery_lane --landed reconcile-the-fork-and-take-the-repair-that-is-already-on-the-branch
      --commit 2f436602b` and verify the binding took. THEN the repair. In
      `background/delivery_lane.py`, `_claim_paths` (line 1145) returns the paths a draw stamped
      from the ITEM'S PROSE, so a sweep asks git about paths the answer never touched and then
      attributes unrelated ones BY TIME. The by-name discriminator already exists in the artefacts:
      a filed finding's header carries `**Claim id:** <id>`. BEFORE WRITING ANYTHING, grep
      `background/` for an existing content-side claim-id reader — `resolve_claim_id` is a spelling
      alias resolver over the claims store and is NOT this — and if one already exists, file that as
      the finding and stop. Otherwise add ONE leg to the swept-row disposition: scan untracked and
      modified files under `docs/staging/` and `tools/` for the id being swept and name any hit as
      evidence the work MOVED. Do not mint a new verdict, do not touch `_stranded_paths`' mtime
      logic, and do not write a register. The control must assert the leg CAN fire and that a claim
      with no such file still sweeps.
    why: >-
      I ordered the strand-clock half of this repair last stretch (`20d594ac1`), it landed, and the
      same class was lost again four hours later — correctly aimed, under-scoped. It has now failed a
      third way this stretch: `838c07559`'s own subject records that the product-gate answer was
      landed by a rival and "only the id NOT in the direction could take a disposition". Time
      attribution is weak by construction; an id written inside the document is exact. DONE is a
      sweep that would have named the product-gate finding, proven by a control that fails when the
      leg is removed. WHAT WOULD PROVE THIS INSUFFICIENT: the next swept row whose evidence line
      still reads "attributed by time and not by name" while an untracked artefact in the tree
      carries the swept id in its header. If that happens, the remedy is in the wrong module and the
      next direction should go to the artefact writer instead of the sweeper.
  - id: one-hundred-and-two-dispositioned-staging-docs-were-never-committed-out-of-the-root
    what: >-
      Unchanged from last direction and re-counted at 05:30Z: `docs/staging/` holds 106 `.md` in the
      root on disk and 177 in `git ls-files`, and `git status` shows 102 tracked root documents
      absent from the working tree. They were archived into `done/`/`records/` and the move was never
      committed. Commit the renames by pathspec — both sides, the root deletion and the archived copy
      — via `python3 -m tools.surgical_land`, in batches small enough to gate, re-`find`ing each stem
      immediately before landing because a daemon archives mid-turn and the shared tree also holds
      284 untracked paths that are not yours. Then re-state the staging flow reading: it currently
      says 205 filed and 162 dispositioned over 7 days, a net +43, and say whether that survives once
      the 102 are counted as dispositioned.
    why: >-
      An uncommitted archival is not a discharge. Every lane that reads the queue from a ref sees
      two-thirds more queue than exists, and the sediment reading that drives "the queue grows
      without bound" is computed over the wrong denominator — it may be diagnosing a filing problem
      that is really a committing problem. This is the cheapest 102 discharges available and it is
      the same class as the error row I refuse to close. DONE is no uncommitted root deletions under
      `docs/staging/` and a re-stated flow reading. WHAT WOULD PROVE THIS INSUFFICIENT: if the count
      is back above zero at the next orientation, the archival daemon is committing nothing by
      construction and the fix belongs in the daemon, not in a batch of landings.
not_now:
  - what: Starting a second `run_value_cycle_ab` to refresh the arms feed against the new SVT exit.
    why: >-
      It is the obvious response to "the published funnel predates the world change", and it is
      wrong twice over. The only box is fourteen hours into a run that is roughly three seeds from
      finishing, and a second world build would contend with it for the whole remaining window to
      answer a question that focus two answers for free by reading `simulation/renewals.py`. If the
      guard trace says no exit can reach a priced boundary, the run would have bought a reprint of
      107. Read first, then run — and run once, with the prediction already filed.
  - what: Pooling the incoming twelve seeds with the existing eighteen to publish a thirty-seed family.
    why: >-
      This is the trade-off I actually made, and thirty is the tempting number: it is the first
      family here that would look large enough to sign the selection leg. It would also be three
      objectives stapled together. The BLOCKING finding of 2026-09-17 already priced that mistake
      once — the halves' means are £908 apart, 1.45 times the pooled mean anyone was trying to sign.
      Twelve homogeneous draws that state no sign are worth more than thirty spliced ones that state
      a false one, because only the first can be refuted.
  - what: Repairing the error bar in `SEAT_FINDING_THE_PAGE_PAIRED_ITS_ERROR_BAR_ON_A_CURRICULUM_SETTING_AND_CALLED_IT_THE_BOOK_2026-09-18.md`, a live BLOCKING finding.
    why: >-
      Held over deliberately for a second stretch, and the reason has got stronger rather than
      weaker. It is a question about the WIDTH of a bar, and focus one is about to deliver the first
      family that bar should be drawn around. Repairing it now would pair it to the spliced eighteen
      and I would be repairing it twice. It stays BLOCKING and stays in the lane's way, which is the
      right amount of pressure.
  - what: Adding a leg so the orientation brief can see a long-running job holding the box.
    why: >-
      I found a fourteen-hour run that three directions did not know about, and the reflex is to
      build the thing that watches for it. One line reading `ps` for `run_value_cycle_ab` would do
      it, and it would still be a control over my own controls rather than the work. The finding is
      recorded in `wrong` where the next orientation reads it, and focus one carries the run's
      identity in prose. If a second stretch is written blind to a job holding the box, that is a
      mechanism failure and it becomes focus one — not before.
  - what: Draining H41's map ratchet, and chasing the tracked files whose working copies predate their landed version.
    why: >-
      H41 improved on its own last stretch, 8,282 to 6,491 bytes of headroom, so the drain I
      threatened for twelve orientations is not what binds. `surgical_land` never writes the shared
      worktree, so a working copy older than its commit is the normal residue of a sibling landing
      and not a defect. Both are tidying, and this stretch has a fourteen-hour artefact arriving that
      can be spoiled by one careless pool.
