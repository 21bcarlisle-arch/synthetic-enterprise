  - id: read-what-the-ep1-ledger-already-says-before-re-running-it
    what: >-
      Do NOT start by re-running the coupler -- start by reading the row that is already there, because
      two directions including mine have described it wrongly. In
      `docs/observability/coupled_gap_ledger.json -> EP1_clv_three_horizon`, `components.lifetime_level`
      does show `distinct_hazards: 1` with `hazard_histogram {"0.05": 33}` and
      `median_believed_tenure_years: 20.000000000000004`. But `components.hazard_calibration.by_believed_hazard`
      in the SAME row lists seven distinct believed hazards -- 0.05, 0.08, 0.11, 0.14, 0.17, 0.20, 0.23 --
      over 401 decisions, and the 0.05 bucket alone carries 263 of them with 14 churns and
      `believed_over_realised: 0.939`, i.e. nearly right, while 0.08 carries 95 decisions at 7.6x too
      pessimistic. And `components.population_selection` records `like_for_like_excluded_over_graded:
      2.964`, `excluded_side_is_censored: true`, and a graded population of 33 against 230 excluded but
      still supplied. Write the correction: the constant hazard is a property of the 33-account graded
      SLICE -- selected on the outcome, drawn from the floor bucket, and materially poorer than the book
      it was drawn from -- and not a demonstration that the estimator cannot tell accounts apart. Then
      decide, and say why, whether the headline gap of 2.529 computed on that slice should be published
      at all in its current form, given the baseline is fitted on an outcome-selected population and the
      ledger's own `baseline` field already says so. Only after that, if a re-run still earns its cost,
      run `python3 -m tools.couple_clv` at a commit at or after `353fe96b8` (the row is measured at
      `8afa34ceb`, before the estimator changed) and land the new row.
      WORKED AND CLOSED 2026-08-27 -- AND THIS ITEM'S OWN DIAGNOSIS WAS WRONG. Do not obey the instruction
      above to write that "the constant hazard is a property of the graded SLICE": measurement refutes it.
      At each account's EARLIEST snapshot -- the belief this measurement grades -- the hazard is 0.05 for
      154 of 154 accounts, the whole book, so selection contributes nothing to the constant. This item
      also miscounts its own evidence: THIRTEEN distinct believed hazards over 622 decisions, not seven
      over 401 (401 is the sum of the first seven rows; the table was read to `0.23` and no further, and
      the two largest omitted buckets, 0.41 at n=135 and 0.38 at n=56, are more pessimistic than the 0.08
      bucket the item singled out on a single churn event). The cause is this measurement's
      belief-selection rule -- grading every account at the one year-end where its bill-shock count is
      structurally zero -- not the estimator and not the slice. See
      `docs/observability/EP1_GRADED_SLICE_WHAT_IT_IS_EVIDENCE_FOR_2026-08-27.md`, which also records why
      the gap is not published in its current form, why the re-run was not run, and why no level move is
      available.
    why: >-
      This is the company half of the director's steer and it has been misdiagnosed for six stretches,
      which is worse than being unworked -- the machine has been reasoning from a fact it did not have.
      It also matters to the thesis directly and separately from world richness: the thesis is
      decisions customer-by-customer on lifetime value, and if the money-side belief is well calibrated
      on two thirds of decisions and 7.6x pessimistic on the next bucket, that is a calibration problem
      with a shape, not the flat degeneracy we have been describing. Ranked third and not last this time
      on purpose: it has been last on six lists and was reached on none of them, and a ranking that never
      gets reached is the same as not naming it. It is cheap -- the evidence is already on disk and the
      first act is reading, not computing. Finished when a document states plainly what the graded slice
      is and is not evidence for, the two prior direction records are corrected rather than quietly
      superseded, and either a fresh ledger row exists or there is a written reason it was not worth the
      hour. R12: the gap is a diagnostic and never a thing to move. If the re-measure genuinely puts more
      than one distinct hazard into the graded population with the coupled rung met, a level move is
      available on that evidence -- self-certify with `record_level_up_self_certified`, and never
      `--no-verify` a `level_current` change.
  - id: make-every-curriculum-discoverability-claim-falsifiable
    what: >-
      Land and then generalise the control the director asked for in his own words at 16:36Z: *"if a
      trait has no channel the company can observe, either give it one or mark it hidden. Don't leave it
      claiming discoverable and don't wait for me to say so."* The instance work is in the tree and
      untracked -- `tests/simulation/test_discoverability_claims_are_enforced.py` -- alongside the
      `segmentation_curriculum_v1.json` edit that flips `channel_pref` to `hidden_truth_only: true` with
      the reason recorded (`simulation/contact_propensity.py` keys on the ENGAGEMENT archetype and never
      reads `channel_pref`, which no live module reads at all) and rewrites the `price_sensitivity` note
      to describe the channel that now genuinely exists. Land that as part of item two, then close the
      CLASS per R10: the control must enumerate EVERY axis the curriculum declares, and for each one with
      `hidden_truth_only: false` assert that the drawn value reaches a live decision, so that a future
      axis added with a fabricated channel note fails on arrival rather than at the next audit. Two R15
      traps to avoid, both catalogued in this project's own record: the check must not pass when an axis
      is missing, absent or malformed from the curriculum file, and it must not pass by importing the
      function it is meant to prove is called -- prove the wiring from the decision's side, the way the
      S1 test does. Note also that `segmentation_curriculum_v1.json` came back re-serialised with
      escaped unicode (`—` for the em dashes, `0.3` for `0.30`); check that a round-trip through a
      writer is intended and is not incidental churn hiding the real edit in a large diff.
    why: >-
      A curriculum that promises a discovery channel which does not exist is the single most
      thesis-corrosive defect available here, because it makes the company look weak for failing at
      something that was impossible -- a supplier that tried to learn `channel_pref` would have been right
      to try and would have failed forever, and we would have read that as a poor model. The thesis says
      the advantage must come from INFERENCE and never ACCESS; the mirror of that is that a declared
      inference route must be real. The director delegated this explicitly, so it needs no further word
      from him, and my previous direction told a tick NOT to touch this file under R13 -- that instruction
      is superseded and I am recording the reversal rather than letting it sit as a live contradiction.
      Fourth because it is a control rather than a measurement and nothing above it waits on it. Finished
      when the control is committed, covers every declared axis rather than the two just fixed, is
      mutation-proven to fire on a fabricated channel note, and the curriculum file contains no
      discoverability claim that the build does not implement.
not_now:
  - what: Running the three-arm A/B twice, to attribute S1 separately from the within-segment elasticity and the absolute-pounds rescale.
    why: >-
      This is the trade I actually made and it reverses my predecessor's. Per-change attribution was the
      stated reason S2 and S3 were held back, and it is a good reason in general. It loses here on cost
      and fragility against a question that does not need it: each pass is tens of minutes, the last one
      was killed at 4m28s with no traceback, the OOM counter reads 105, and two three-arm passes are
      already resident. The live question is whether a widened world creates anything to select on AT
      ALL. If the composite answers yes, decomposing which axis did it is a cheap and well-motivated
      follow-up; if it answers no, the decomposition was never worth the hour. One run, world named by
      commit, composite stated honestly.
  - what: Wiring the value arm to the live renewal desk.
    why: >-
      Rejected an eighth time, and this stretch supplies a new reason rather than repeating the old one.
      The old reason stands -- selection measured at -£1,388.80 over the decade and -£991.38 on 2019,
      mildly value-destructive on both windows, against a belief grading 0.5586 on 478 renewals. The new
      reason is stronger: item one shows we do not yet know that figure's error bars, because the only
      instrument measuring them is patching a symbol the decision no longer calls. Wiring a live desk to
      a chooser whose measured advantage is negative and whose measurement error is unmeasured is the one
      move this evidence forbids twice over. `renewal_margin_arm` stays "flat_rules".
  - what: Correcting the churn belief's level or its dose by editing the constants in `saas/churn_model.py`.
    why: >-
      Rejected again, and the ledger reading in item three sharpens why. The belief is not uniformly
      wrong -- it is nearly right on the 263-decision floor bucket (0.939) and 7.6x pessimistic on the
      next one, so a single constant edit would break the part that works. Beneath that is the
      architecture: the company is ALLOWED to be wrong, its models are approximations built from observed
      outcomes, and a constant hand-set by the harness that measured it is ACCESS wearing the clothes of
      inference, then graded by the very instrument that set it. The repair that counts is the company
      LEARNING the level from what it observes.
  - what: S3 -- the weighted trade-off across price, service, product, carbon and reputation that replaces the multiplicative stack.
    why: >-
      This is the item the director's own words point at most directly and the one that most raises the
      ceiling, because it is what creates preference reversals and makes per-customer pricing genuinely
      winnable. It still loses this stretch, and the reason has changed: it is no longer attribution, it
      is that we would then have THREE unscored world changes and a scoring instrument known to be
      broken. Widening the world is now cheaper than measuring it, which is exactly the imbalance that
      produced this stretch's stall. Score what has landed, then take S3 with a working instrument. The
      roadmap he asked for already exists in `WHAT_A_HOUSEHOLD_DECIDES_ON.md`, so nothing is lost by
      sequencing it next rather than now.
  - what: A new watcher for detached runs that die without an END line.
    why: >-
      Tempting after a 2h12m blind spot, and wrong. The mechanism already worked: the START/END wrapper
      made the death visible, and the alarm fired and is on disk in the staging root right now. What
      failed was DISPOSITION -- nobody drew it. Adding a watcher to patch a symptom whose existing
      mechanism functioned is precisely the accretion that OPERATIONAL_LAYER_DESIGN forbids and that
      caused the 6h blackout. The fix is item two actioning the alarm that fired, plus binding the
      relaunch to a `tools.wait_for` with a named subject and a deadline, which is R18 and already built.
  - what: EP13 carbon intensity, and building `tools/couple_carbon_intensity.py`.
    why: >-
      Rejected a seventh time and I will keep saying why rather than dropping it silently. There is real
      work there -- three grid-intensity tables disagreeing by up to 55.6%, the published one being
      neither what the company reads nor what an adapter would feed -- and EP13 sitting at level 2 with
      no coupler is a supported level with no route to 3. It is off the spine the director drew this
      afternoon, and the last five namings each produced correct SIM-side work and never the asked
      question. It stays off until the world-versus-instrument imbalance above is closed.
  - what: The ~45 findings in the staging root, including the five repeating uncommitted-docs alarms.
    why: >-
      Left queued under SELF_INTERRUPT_DISCIPLINE, because the supply is infinite: 44 LATENT, 4 RECORDED,
      none BLOCKING. One exception, and it is deliberate: the re-run alarm about the dead A/B is NOT left
      queued -- it is item two's opening act, because it is the one alarm in the pile whose subject is a
      measurement the whole stretch depends on. The rest are mostly auto-filed notices about docs that
      mid-work sessions left uncommitted, and the durable answer to those is landing work promptly, not
      processing the notices.
  - what: The seat's own steer-effectiveness control, which reported no focus items drawn while three of four were built and landed.
    why: >-
      Wrong in the same direction for a fourth consecutive stretch, and the diagnosis is already written
      up in the staging root -- it keys on maturity-map atom ids and cannot see a Lane 0 kebab slug at
      all. I am again choosing to USE the signal rather than repair it: I have read past it here and
      corrected the record in `thesis_read`, and the actionable lesson this time is about RANK, not
      lever -- EP1 failed seven times while sitting last, so it has moved up. Repairing the control would
      tell me what I have already worked out, and it competes with measurement work that is currently the
      binding constraint.
