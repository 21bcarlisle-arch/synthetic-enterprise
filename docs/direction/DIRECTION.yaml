- id: a-direction-item-s-why-claimed-the
  raised: '2026-10-12'
  kind: strategy
  what: 'A direction item''s WHY claimed the capital target ''throttles for nine years the growth the thesis is judged on.'' Measured on seed
    42 (campaign-only resolve, 403-founder book, 2016-2025): binding is prospect_ceiling or market in every single year, at £0, £115 and £130
    alike -- capital has never been the constraint this book''s growth is sized against, before or after the capital-115/C14 dating fix.'
  proposal: Land the capital-115 correction and the C14 dating fix on their own merits (they are correct factual corrections regardless), but
    do not treat them as having unthrottled growth -- they haven't. If growth is meant to be capital-judged, the lever to look at is PROSPECTS_PER_YEAR
    (400) or the founder book size, both of which bind in every year of the shipped run.
  status: open
  resolution: ''
  evidence: 'docs/staging/done/SEAT_FINDING_SEVERAL_CONSUMPTION_FORECASTS_A_WALL_LEAK_IN_HEDGE_VOLUME_AND_THE_CAPITAL_TARGET_IS_115_2026-10-11.md
    §3b: _resolve_campaign(_pre_growth_book(42), 42, persist=False) run twice in one process (flat £115 from 2016 vs C14-dated), by_year binding
    is prospect_ceiling (8 years) or market (2 years) in BOTH arms, never capital.'
- id: canon-w3-leaves-open-how-far-the
  raised: '2026-10-13'
  kind: canon_intent
  what: 'Canon W3 leaves open how far the world''s price responsiveness may correlate with signals a supplier holds (section 15, owed item 4).
    Published evidence puts the large correlations on whether a household LOOKS at prices: 2.8x for fixed against default, 3.4x for credit against
    traditional prepayment, 0.54x for 3+ years on the default tariff. The world already carries those. Nothing published sizes a correlation with
    how far a household MOVES once it looks.'
  proposal: 'Two changes, smallest first. (1) Selection at acquisition, with no new number: a prospect enters the market weighted by its own active-renewal
    probability, so the link between acquisition channel and later responsiveness emerges from draws the world already has. Recommended. (2) Optionally,
    couple the price-sensitivity segment to the engagement rank, run at both ends (independent and fully coupled) with the strength kept as a
    GAP, never a midpoint. Not recommended: a past-switching term, which the only trial puts at x0.94. Your decision 6 already settles the adjacent
    pricing question. Both are graded on fresh seeds with predictions filed first.'
  status: open
  resolution: ''
  evidence: docs/market_research/observable_correlates_of_price_responsiveness.md section C
- id: the-clv-discount-rate-and-terminal-value
  raised: '2026-10-13'
  kind: strategy
  what: 'The CLV discount rate and terminal-value method (canon section 15, owed item 9). The code carries a flat 0.10, labelled a simplification.
    Published GB evidence: CMA 2016 retail WACC 9.3-11.5% (2007-14 data); CEPA for Ofgem 2022, 9.28-10.88% in normal conditions and 12.23-14.94%
    stressed; Ofgem''s adopted cost of capital 12.3% from October 2023. Marketing science: a tenure-varying survival curve to a long horizon,
    since a hard cutoff and a flat rate to infinity each bias it.'
  proposal: Keep 0.10 as the normal-conditions anchor for 2016 to September 2023, since it sits inside the CMA and CEPA bands. From October 2023
