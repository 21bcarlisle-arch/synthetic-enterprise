thesis_read: >-
  Billing moved forward and the comparison did not. The thesis needs a flat baseline to beat. That
  comparison is exactly where it was at 14:22. Both doors are built and the predictions are filed.
  It still waits on the 2026-10-19 publish and on six fresh seeds that only the director can list
  (open row ep17-s-flat-against-per-customer-comparison). Billing accuracy produced real company
  results this stretch. C7 is graded (c3f015034). It sits at the far end of a class of 287 runs of
  estimates longer than twelve months, on 245 accounts. None of them is billed past the 12-month
  back-billing bar. The 21BA write-off works on both payment routes. K1 now carries its
  concentration, so one account can no longer pass for a population bias. That wrong row is
  corrected. The same census found the company never asks for a read. Nothing in company/ acts on a
  run of estimates, so the company cannot see its own SLC 21B.4 breach. That is focus one. D46 closed
  a leak in billing (e6785dce5). A void stub's estimate is now priced at the account's own tariff, so
  world truth no longer decides whether the company charges for its own estimate. The P3 wrong row is
  corrected in code. Its two OCC rows leave KNOWN_OPEN_INVERSIONS when the next published ledger is
  billed by this code. The draw ledger now credits an item only through a commit that binds it, and it
  reads a landing in flight as mid_landing (1961c22d5). The instrument that grades whether the steer
  bit is honest at last. Both of its carried wrong rows are retired in wrong_triage.yaml as
  already_fixed, so they leave this list by that route rather than by being forgotten. What has not
  moved, and matters most for the thesis, is 2022. The world books crisis bad debt at about a tenth of
  the published share: 0.10% of revenue in 2021-22 against 1.3% to 2.8% published. The company's
  provision charge peaks in 2023, a year after the arrears. Any per-customer debt or retention decision
  is graded inside a world that forgives non-payment, and in that world value created and value
  transferred look alike. That BLOCKING finding has had no work for two days, so it becomes focus two
  (supplier timing) and focus three (world level, diagnosis only before the publish). Commit split: 3
  supplier, 1 world, 7 other. Four of the seven "other" commits are seat records and merges, so the
  supplier-first order held. The previous focus is graded. Two of three Lane 0 items were drawn
  (the C7 census, and the legacy PC1 item, which landed as finding and prereg in 91038fa91). The draw-ledger
  item was not drawn but landed anyway, and so did the D46 atom (the draw never took it; e6785dce5
  did the work). All four are done, so none is carried. One correction to my own record: last
  stretch I listed C35 in not_now as a director-ruled row. Its map row quotes him: "not a ruling from
  me". A worker built it to L1, dormant (1bf415a14). That was right, and my rejection was wrong.
