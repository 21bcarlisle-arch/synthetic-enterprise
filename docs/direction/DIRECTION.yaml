thesis_read: >-
  Forward, and the steer bit again: all four focus items were drawn, and three are on origin. The result
  that matters is that B11 slice 3 reached origin (27d0d3065, landed by the re-issued continuation, so
  the stranded c5770c404 is now disposable). With the published 2021-22 crisis regime excluded from the
  per-customer deviation fit, 2022's 'flat beats per-customer' margin cannot be told apart from zero.
  That is honest, but it is not a win: per-customer still beats a flat-rule supplier in no year we can
  separate on one book, and only the director's EP17 row can change that. B11 slice 4 (3d9c4fb84) built
  the switch/move split from what a supplier sees at a move-out, then found the world has no moves to
  split, because home moves are off in the curriculum until B7 slice 3 supplies the incoming deemed occupant.
  So the next inference gain on B11 is blocked in the WORLD, not the company. PB4 reached L2 with a reader
  (87f7d62b8, aa38800a1), and the page says plainly that the near-zero engagement/elasticity correlation
  is BUILT IN by independent draws, not discovered. The triad gate no longer refuses it. D48 is parked
  until the 2026-10-12 publish puts its L2 figures on the page (1504343eb). C34's first slice, one next-best-action
  decision priced on forward CLV and graded against a fixed ranking, is in surgical_land now (pid 3936904).
  Knowledge-first earned its keep twice. A sourced boiler pump/fan load (8fe730297) was landed even though
  it tips one home under the L1.1 texture floor, and that floor was never read at source, so a live world
  red now rests on an unsourced number. The back-billing knowledge pass (fbe24afea) found that the company
  writes off the wrong money for direct-debit customers, which is a value-transfer error in both directions.
  Those two are this record's focus. Four of 17 commits were no-work merges. Origin still carries the
  14:22 direction record, not this lane's last two.
