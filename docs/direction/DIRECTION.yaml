focus:
  - id: does-the-value-arm-decide-anything-the-flat-arm-does-not
    lane: A_strategy_governance
    what: >-
      Read only the value-cycle artefacts that already exist, and launch no run. That means the
      C1 bracket's /var/tmp/se-c1-bracket-{a,b,c}/value_cycle_ab.json, plus the 18-seed HEAD family
      that
      SEAT_RESULT_RENEWAL_COUNT_EXPLAINS_NONE_OF_THE_SELECTION_RESIDUAL_AND_THE_VARIANCE_IS_ONE_DISCRETE_EVENT_IN_THE_LEVEL_ARM_2026-09-27.md
      and tools/selection_residual_decomposition.py read. For each seed and each billing account,
      establish whether the value arm and the level arm made a DIFFERENT decision: renewal price
      offered, retention action, or tariff. Only then count where their outcomes differed. Report
      three things: how many accounts the arms decide differently on, the value arm's net minus the
      level arm's net on exactly those accounts, and the same quantity on the accounts where they
      decide alike. The second number is attributable to inference. The third is luck and draw
      noise. Give each with the bound its count earns (exact binomial on a count, not sd/√n). Write
      your prediction before opening the artefacts. If the artefact does not record per-account
      decisions, that absence is the answer. File it as a finding naming the fields
      tools/run_value_cycle_ab.py must add, so that the HEAD run in the next item carries them.
      File the result as a SEAT_RESULT_ headed A_strategy_governance.
    why: >-
      The thesis says the advantage must come from inference. Every selection figure so far has
      been an OUTCOME difference, and 875322e5a shows the only non-trivial one is the flat arm's
      churn roll on a household the value arm treats identically in both states. Until someone
      separates "decided differently" from "happened differently", no figure can say the
      per-customer view did anything. DONE when a SEAT_RESULT_ states, per seed, how many accounts
      the arms decide differently on and the value-minus-level net on that set, with its bound or a
      plain "we cannot tell". Alternatively, DONE when a finding names the decision fields the
      artefact lacks.
  - id: re-measure-the-selection-at-head-with-per-account-arrears-lines
    lane: A_strategy_governance
    what: >-
      In tools/run_value_cycle_ab.py, add per-billing-account arrears lines to the artefact for
      each arm: gross write-off at close, DCA recovery, placeholder bad debt released, and leg 4b
      stayer provision. Also add every per-account decision field the previous item's result or
      finding names. Write a control that the new lines plus the pre-4c trading net reconcile to
      level_arm_net_by_account_gbp / value_arm_net_by_account_gbp to the penny, and mutation-prove
      it. Land that change. Then, at the landed HEAD, write a SEAT_PREREG_ before launch. It must
      carry 875322e5a's filed prediction (PROS-2016-0098's arrears line grows in magnitude past
      −£5,659.81), whether that account still leaves at different dates in the two seeds, and
      whether the state distance stays within £500 of −£4,214.93. Then run seeds 11111 and 88888
      with leg 4b at its HEAD default. Use tools.launch_long_job under setsid, wait with
      tools.wait_for --pid (never --pattern), and grade in a SEAT_RESULT_ beside the prereg.
      Launch nothing while another value-cycle run holds memory.
    why: >-
      Every graded run is at fcba478b7, which predates the held-bill release (254b4c1e4,
      e83d571c3), the held-bill and credit-bill write-off fixes, and credit netting. Those are
      exactly the rules that make up the one account the selection sign hangs on. The C1 bracket
      could not split the −£5,659.81 into write-off, recovery and placeholder, because the artefact
      carries no per-account arrears lines. A result read at a stale commit through an instrument
      that cannot decompose its only material account cannot be published. DONE when the
      artefact carries the lines under a mutation-proven reconciliation control, and a SEAT_RESULT_
      at a named HEAD commit grades the prereg, including 875322e5a's prediction.
  - id: grade-the-heartbeat-attribution-with-a-one-variable-reading
    lane: H_harness
    what: >-
      Take the last 7 days of origin/main. For every "chore(liveness): publish heartbeat" commit,
      record the gate cycles and publish or reconcile attempts it started (from
      docs/observability/.publish_gate_state.json history, the reconciler's log and the
      surgical_land receipts), and how long the shared tree stayed behind origin afterwards,
      against the same readings after non-heartbeat commits. Also name every reader of
      site/data/tick_heartbeat.json and say whether any of them needs the heartbeat to be a COMMIT
      rather than an unversioned write. Write the prediction first. If that reading cannot
      attribute the reconciler lag, run the one-variable version. Suspend only the heartbeat
      publisher for one fixed window through whatever dial it already has (build none), and compare
      the lag with the window before it. Record how to reverse the suspension, and reverse it
      when the window ends. File a SEAT_RESULT_ that grades my carried claim.
    why: >-
      For three stretches I have carried the claim that heartbeat-only commits manufacture the gate
      cycles the reconciler cannot keep up with, and I have never measured it. They were 3 of 10
      commits this stretch, and HEAD is behind origin again right now. A claim I keep listing and
      never test is the exact failure the wrong list exists to catch. DONE when a SEAT_RESULT_
      says, with the numbers, whether heartbeat commits cause measurable reconciler lag, and names
      whether the heartbeat needs to be a commit. The carried wrong row can then be graded true or
      withdrawn.
not_now:
  - what: >-
      Widening the seed family, whether more seeds at fcba478b7 or a larger family at HEAD, to get
      the selection sign out of one household.
    why: >-
      The residual is a binomial switch, so more seeds only price the rate of the flat arm's churn
      coin more tightly. That says nothing about inference. Item one asks the question the thesis
      actually needs, and item two re-measures the one account at HEAD. Seeds wait until an
      instrument can separate decision from outcome.
  - what: >-
      Pinning C1 or leg 4b's level bracket, including chasing an answer to NTFY N8U7crm2DRQP
      (whether a sim DD failure is a first bounce or net of retries).
    why: >-
      8924da6ec shows C1 cannot move the sign. Leg 4b is off at HEAD by default, so no published
      figure carries the £11,300 bracket. The director has already been asked, so asking again is
      pressure, not information.
  - what: >-
      Re-issuing the 203 held bills, including the 195 summer resi gas bills held as implausibly
      low.
    why: >-
      It is a real fidelity gap with its own finding in staging. It changes write-off amounts,
      which item two re-measures at HEAD whatever the held-bill rule is. It is not on the
      inference question's path.
  - what: >-
      A heartbeat line for worker-seat-manager (mute by construction).
    why: >-
      That is a behaviour change to the daemon that seeds the worker seat, and its cause is on
      file. No reader is misled while the brief shows the cause.
  - what: >-
      evaluate_boot_sha_drift against origin, re-asking cached refusals against the remote, the
      same-subject-sibling check at landing, and the stash-completeness atom.
    why: >-
      All four stay in wrong. HEAD is behind origin by one commit (27aba4242), which the reconciler
      will take. That is not the reconcile-time divergence the drift row describes. The function now
      diffs boot blobs against disk, so that row may be a misdiagnosis of code that has since
      changed. I have not re-read it closely enough to withdraw it, and it does not outrank the
      thesis question.
