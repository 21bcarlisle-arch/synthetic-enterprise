focus:
  - id: the-noise-floor-must-patch-the-symbol-the-decision-calls
    what: >-
      The level-vs-selection noise floor is being measured with a patch that reaches nothing, and the
      repair is to make it a committed mode rather than fix the scratchpad. Observed, from the code:
      `simulation/population_draw.py` now defines BOTH `price_sensitivity_for_customer` (line 997, at
      HEAD, now unused by the churn decision) and `price_elasticity_for_customer` (line 1055, working
      tree); `simulation/customer_events.py:313-315` imports and calls the second; and the in-flight
      measurement at
      `/tmp/claude-1000/-/16aaaff2-7e7e-417f-83d5-80457b2eaadb/scratchpad/noise_floor.py:40` reassigns
      `pdraw.price_sensitivity_for_customer`. `price_elasticity_for_customer` calls
      `_draw_curriculum_axis` directly and never routes through the old name, so the seed never reaches
      the decision. FIRST, cheaply: if those two PIDs are still alive, read their `SWEEP` lines when they
      land and check whether the two seeds returned IDENTICAL nets -- identical output across two seeds
      is the confirmation, and a non-identical one refutes this whole item, in which case say so and
      close it. THEN build the durable form: add a noise-floor mode to `tools/run_value_cycle_ab.py`
      that re-draws the elasticity assignment across N seeds and reports the spread in
      `selection_gbp` and `level_share_of_advantage`, resolving the symbol through the SAME import the
      decision uses so a future rename disconnects the runner loudly instead of silently. Two further
      defects to carry across while you are in there: the scratchpad pins the level arm at the remembered
      `renewal_margin_flat_level_gbp_per_mwh=44.5`, which is not the arm the committed runner runs (it
      reads the value arm's own realised median off the same run), so it is the noise floor of a
      different instrument; and the delete-the-dead-symbol question -- `price_sensitivity_for_customer`
      should either lose its last caller and go, or keep one and be documented as the segment-level draw,
      never sit there as a live-looking name nothing calls. R15 both ways: the mutation that must go red
      is patching the OLD name and asserting the spread stays zero.
    why: >-
      Every money reading this project has published in two days rests on a difference of £1,388.80
      between two arms over roughly thirty renewals, and nobody has ever measured what that difference
      does when nothing changes but the draw. That is the number the director will be shown, and the
      instrument measuring its error bars is currently disconnected in a way that returns the most
      flattering possible answer. It goes first because it is minutes of reading plus a contained change,
      because the wrong reading is due to arrive within the hour, and because it makes item two's re-run
      worth running at all -- a second row whose error bars are unknown is a number, not evidence.
      Finished when a committed mode exists that a commit can reproduce, its symbol resolution cannot
      silently detach, a mutation on the old name reds it, and the spread across seeds is stated beside
      the -£1,388.80 so a reader can see whether the selection leg is distinguishable from zero. If the
      spread turns out to be wider than the effect, that FINISHES this item and it is the most valuable
      outcome available -- it means the level-vs-selection instrument cannot yet resolve what we have
      been asking it, and every reading built on it needs the caveat.
