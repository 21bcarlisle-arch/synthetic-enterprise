thesis_read: >-
  **The steer bit again, and the brief's detector is wrong again — same false negative, second
  consecutive stretch, and I am correcting it here rather than acting on it.**
  `previous_focus_drawn` reports `drawn: []`; `docs/observability/seat-executor-log.md` records
  `RUNNING the-direct-debit-is-set-from-the-first-bill-and-nothing-estimates-what-it-should-be` at
  **06:35 on a621edb15**, DISCHARGED and `rc=0` at **08:05** — ninety minutes, the longest lane-0 run
  in the log. Rank one was worked; ranks two, three and four were not touched. That is now three
  stretches with the same shape, so **rank is the entire mechanism** and I have ranked accordingly,
  and the detector itself is a defect I am filing rather than a fact I am reading.
  **What rank one bought is the first genuine piece of per-customer inference this company has ever
  made.** `company/billing/annual_consumption_estimate.py` (313 lines) exists: a precedence ordered
  by **SLC 27.15**'s actual words — the supplier's own metered reads, then the registry EAC/AQ handed
  over at registration, then what the customer declared, then Ofgem's published TDCV — every input
  something a real supplier holds, the household's true annual usage not a parameter of any function
  in the module and named as forbidden. The opening DD is annual cost over twelve. The
  first-issued-bill artefact is gone from both modules that carried it, mutation-proven under
  `python3 -B`, and the strict xfail that pinned this exact defect since 2026-08-03 is discharged
  through the real estimator rather than a literal. It stopped at level 1 and said why in measured
  terms: **115 of 257 customers get no opening at all**, because `get_cap_unit_rate_for_date` returns
  `None` before the cap began in January 2019, so pre-cap acquisitions are refused and counted rather
  than opened from a bill. That is exactly the honest `None` the rules ask for, and it is the first
  time the DD path has told the truth about who it cannot serve.
  **And none of it is on origin.** `git rev-list --left-right --count HEAD...origin/main` returns
  `0 0`, and the entire payload — the new module, the three seam files, the three test files, the
  research page, and a **level move 0 -> 1 written into the shared `docs/design/maturity_map.yaml`**
  — sits staged in the index of a tree three other writers share. The run finished, discharged its
  claim, and committed nothing. Meanwhile publishing has been down since roughly 05:53 on a wedge
  **this stretch's own work created**: `bc57c8e30` added `background/head_red_register.py` and wired
  it into `background/staging_rooms.py`, which gives
  `supervisor -> staging_rooms -> head_red_register -> head_green_census -> process_run_complete` —
  I ran the control and it fails on exactly that chain. So the most valuable thing built in weeks is
  invisible, unlanded, and sitting behind a door that a sibling commit closed.
  **The director's 830-red is answered and not yet demonstrated.** It was not the reaper: `/tmp` on
  this box is a 12 GB tmpfs on a 24 GB machine, the census ran pytest with `TMPDIR` unset, and 820 of
  830 reds were one directory dying at fixture setup — reported as 820 defects. The exclusion in
  `repo_copy_scratch` had never evaluated its own stated reason, so a `.git` with zero refs made
  378 MB immortal while the guard logged "nothing reapable". Both are fixed. But
  `docs/observability/head_red_observed.json` still holds **exactly one run**, at 04:30 on
  `ec2e0b1a4`, before the fix. We have a diagnosis and no measurement, and a diagnosis goes stale the
  same way a green does.
  **Against the thesis: fidelity moved forward, inference moved forward for the first time in a
  fortnight, and delivery went backwards.** The advantage-from-inference side finally has one real
  organ; the baseline-to-beat is still declared unjudgeable; and the director's newest direction —
  that the arithmetic has never been checked against anything outside itself — names the thing that
  makes every figure above provisional. The bottleneck this stretch was not thinking. It was landing.
