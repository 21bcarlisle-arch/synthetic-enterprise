thesis_read: >-
  The steer bit this stretch, and the supplier moved. All three of its focus items reached Lane 0 and landed. It
  is still not ahead of the baseline, and the thesis test it is waiting on has, as of this orientation, no reader.
  Of 20 commits, 19 carried work. About three were supplier work and about twelve were the weather-to-price
  chain's arms and records, which run on the director's 24 Nov steer through their own BLOCKING finding.
  ed62c5b28 graded B11 M7 honestly: all six fresh books are GAP, because no run on seeds 61113-61118 carries
  per-customer monthly records. They are armed in b11m7-watch behind rankq and the owed book, and B11's park now
  names that live wait. 63f7faeba dated the CLV discount rate (0.10, then Ofgem's 12.3% from 1 Oct 2023). Every
  published aggregate is also stated at 9.3% and 12.3%, and at real inputs that moves 2023-2025 year-end value
  per account by about -10%. Decisions take the dated rate only behind a switch that is off. 971dc9738 named
  both of land9's deaths. The 07:18Z death was a cgroup kill when its parent worker-tick unit ended (setsid does
  not leave a cgroup). The 13:29Z death was tools/wait_for.py --pattern, whose '.' matches '/', so any shell that
  merely names tools/run_annual_report.py reads as FINISHED. land10 is armed on artefacts. So the B11 Lane 0 row
  and the land9 row are CORRECTED. That is the good half. The bad half is that every supplier result is now
  parked on box time. rankq (s.12g rank-at-q) is on its fourth Phase 2b pass, in mid-2019, 8h43m into an
  800-minute estimate, so it is running long. The book every queued grade reads is about 99 hours unbuilt. B12,
  C34, D48, B11 and EP1's next slice all wait on books, and about six default-off supplier switches are each
  pre-registered to be the only change in "the next book". At one book per 13+ hours, that queue serialises the
  supplier for a week, so the order of those flips is now the supplier's binding decision (focus 3). WORSE, and
  found only by reading the store: the continuation that grades rankq (s12g-rankq-is-graded-when-it-ends) fell
  out of seat_continuation.live() at about 09:26Z. live() expires a row 6 h after it is written unless its
  embargo is a DATE, and a hold on a FILE gets no window, so the reader of the thesis's live test expired while
  its run was still going. b11-m7-grade-the-six-fresh-books-readout and land10-outcome-is-read expire the same
  way tonight (about 21:54Z and 22:22Z), hours before their files can exist. My 15:22 record named that rankq
  continuation as its reader without checking it was live. The per-customer arm still reads -GBP 0.14 (-1.39 to
  +1.03) against the flat-rules twin, a straddle and not a beat. There is a second interconnection defect: land10
  and b11m7's first wave both fire on the same artefact (the first post-rankq book), and land10's busy check does
  not see seed_family runs. So a full gate would start beside three parallel Phase 2b runs, which is the very
  co-residence that timed the MSC gate out at 3600 s. The shared checkout is 165 behind origin, and every daemon
  runs 18-20 commits old.
