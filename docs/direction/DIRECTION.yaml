thesis_read: 'Forward on inference, sideways on levels: no level moved. There were 13 commits, 11 carrying work and 6 substantive. The brief''s split reads supplier 1, both 1, other 11, because it sorts
  by file. Read by subject, seven of the eleven are grades and pre-registrations of supplier experiments, three are the director''s front-door steer, and one is D48 billing (c6c09641e). No world build landed.
  THE STEER: two of four focus items were drawn and landed: the lower-bound retention guard (766d26fc6) and the HEAD run with its grades (4eb192b60). The bill estimator and the meter-exchange prereg were
  not drawn. Lane 0 works in order, and the first two items filled the stretch. Both are carried, and the estimator now goes first, because billing accuracy is first in his order and got one commit this
  stretch. WHAT IT MEANS. (1) The company learned something from its own data, and the thing it learned is that its lever does nothing. Section 15''s holdout (4d82dce3b): the holdout lost 8 of 21 and the
  offered group 26 of 62, so the learned save rate is 0, where section 13''s belief ratio read 0.19. changed_a_departure is 0 in both arms. On this book, retention offers are transfer, not creation (M2).
  That is the thesis working as designed, inference refusing a lever, but it removes one place the per-customer company could beat flat. The lower-bound guard now refuses to offer while the interval includes
  zero (-0.089 [-0.986, +0.403]). It is raised for the director because, from a cold start, it can never learn. Section 16 launched at 11:24Z (4d94422536). (2) Per-customer against flat has its first valid
  seed. Seed 2 holds P14a''. After the grader fix (9fc114520), ending_term minus flat parity reads +GBP 2,866, not the -GBP 25 first graded. The one save (+GBP 5,190) is a household the save-odds guard
  made no offer to. One seed of four is not a comparison. Seed 3 is running. (3) The BLOCKING crisis finding moved, and it is still open. On the HEAD run 989ce4f1c2 (unpublished), the IFRS 9 crisis share
  is 0.70%, inside the 0.50-0.80% prediction, but the step-up is x0.96, against a predicted x1.1-1.5. The pre-crisis 2016-19 charge rose x3.3, and the crisis charge lands almost all in 2023, a year after
  the real step. Whether that is the world''s arrears or the matrix''s ageing, I cannot yet say. Item 2 reads it. It is not an attribution run, because three world changes moved together. (4) Billing: post-departure
  gas billing falls from 147 bills (GBP 4,715.70) to none on the HEAD run. Gas prepayment read instructions now follow UNC M5.9.14. D48''s held bills are 9, as before. The catch-up driver (the three-read
  re-level) is untouched. Corrected this stretch: the seat''s save-rate instruction is now refuted on the run and superseded, and the section 14 grader''s parity edge is fixed (both in wrong).'
