thesis_read: >-
  The steer held: four of the five items were drawn and every one landed work. The exit test is still not met,
  but its first leg now has a known size and its third leg has fewer open classes. N19 is closed (06266f4f1,
  55eee3e72). A two-register default bill is graded at SLC 28AD's 58/42 against the multi-register cap. The newest
  book records 3 cap excesses, against 626 on b3ce2a4e73, and both Explore slots it named record 0. The 3 left are
  named in their finding as graded against an EPG level that was never published. N20 is read (a6b7a0fd4): the
  ledger collects the bill (33,996 of 35,306 DD collections), and the balance book only narrates a level amount.
  The record ends with a build design and its red tests named. N21 is taken apart (af33608f4). About 5.7 of its
  14.5 points are a page definition: ledger costs the page leaves out. Most of the rest is a GBP 55-per-leg
  operating placeholder, against the cap's GBP 297.92 per dual-fuel customer. So the margin every per-customer
  CLV inherits is overstated by a cost the company is never charged. That is the thesis's most serious open
  defect, because a decision graded on value that is not there cannot beat the baseline honestly. The gate rows
  moved less than the retirement suggests. On the 4669d77ddd re-grade, 514e2015b took 78 of the 128 overdue
  breaches: the desk was chasing the uncapped catch-up the page had already capped. 6f9976757 cleared
  SYN-2016-604g's held bill. A landing for 39 of the remaining 50 is in flight now (surgical_land pid 40377), and
  continuation overdue-row-credit-bill-and-cross-fuel-residual holds the residual. But the estimated-run row (53)
  refuted its pre-registered cause and has no named one. The revenue row reads 4, and the carbon-panel row moved
  14 -> 12 against a prediction that it would not move. The seven-gate-rows continuation retired at 17:38 with
  those three rows open, so that focus row stays live. The 15:23 record pointed the overdue trace at
  company/billing/collections_journey.py. The cause was in simulation/dd_collection_book.py, and the worker
  followed the evidence there. The fresh run at a6b7a0fd47 carries N18, the desk fix and the 604g fix. It is
  running, with a promote unit behind it and N21's prediction (15.4%) filed before it ends, so the 9 Nov publish
  has a book. N17 (flat electricity) was not drawn: it was fifth and the stretch was 3 hours. That is ordering,
  not drift. The commit_split reads 1 supplier, 1 world and 11 other. Five of the "other" commits are the
  company's billing builder, grader and cast, so the substance was supplier-side, but the classifier cannot see
  that. Against the thesis nothing moved: no per-customer decision changed, and the renewal belief still ranks
  leavers backwards. That is correct under the 26 Oct ruling, and it is the reason the ruling has to end. Both
  automatic merges carried nothing, and neither is a stall.
