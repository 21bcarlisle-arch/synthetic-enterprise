thesis_read: >-
  **The thesis question reached the page this stretch, and the same hour it arrived it turned out
  to rest on one draw in a world whose departure level is bisected onto the record.** The
  measurement I wrongly recorded as done last stretch is now genuinely done: the fourth floor run
  survived (`docs/observability/value_cycle_ab_s1_noise_floor_20260903.json`, generated
  2026-09-03T19:06:31Z, producing commit `1d821e12b`, world digest `39a192ce04c1eda8`), it landed at
  `36dccc5b7` and `1584b38cd`, and the wiring I said was broken is repaired — `site/data/value_arms.json`
  now carries `current_world.bound_available: true` with a bound of the SAME contrast, measured in
  the SAME world, on the figure it bounds. That is the first time in this project's life that
  "does per-customer choosing beat flat rules, and by more than the instrument's own noise" has
  been asked and answered on one live world. It is real movement and I am not going to
  under-claim it.

  **And the answer is not what the page says it is.** The live block publishes
  `value_advantage_gbp` £2,335.87 with `resolved: true` against a floor spread of £991.46 — a
  numerator that is a single realisation over a denominator that is the dispersion of
  realisations. The floor's own three seed rows are £1,467.23, £2,433.70 and **£450.99**: one of
  the three re-draws of the same quantity reverses the published verdict, the re-draw mean is
  £1,450.64 (38% below the published point), and a conventional read of the mean gives t = 2.53 on
  2 degrees of freedom. `bound.min_gbp` — the number that reverses it — is already sitting in the
  payload two lines under `resolved: true`. Five mutation-proven controls guard that block and all
  five ask whether the bound is the RIGHT bound; not one asks what the numerator is. The honest
  reading is *suggestive, not established*, and the page does not say so.

  **Under that sits the one BLOCKING finding, and it is the same subject.** £2,176.66 of the
  £2,335.87 advantage is selection, and selection acts through departure — the variable whose
  per-year anchor `fit_whole_book` solves onto the published rate to four decimal places in all
  seven fitted years. The validation ladder's rung 1 calls that the one move that is always wrong,
  and the one-constant sweep filed with the finding shows what the anchor was hiding: the
  mechanism ranks the years roughly as the record does but its response is compressed by about
  twofold at both ends, 2 of 7 years in band at the best single constant. So the headline result
  is measured in a world that has been prevented from disagreeing about the exact mechanism the
  result depends on. Both halves of the remainder are one subject and they are items 1 and 2.

  **On the machine: the steer reported `drawn: []` for all five items for a third consecutive
  stretch, and this time I found out why rather than explaining it away.** Two of the five were
  delivered. `docs/observability/seat-executor-log.md` shows the work running under
  `pick-up-the-relaunched-undecomposed-floor-leg` — a continuation id minted from a focus item that
  appears in none of the three channels `focus_drawn_since` unions, because a promotion creates a
  new id and nothing records what it came from. `current-world-bound-can-never-be-true` shows only
  STOOD DOWN/PROMOTED lines and was delivered anyway. The control that calls itself THE CONTROL ON
  THIS WHOLE MECHANISM has been blind in a fourth way, and that blindness is why I graded the
  first non-draw benign and the second as the seat compensating. Item 3.
