thesis_read: >-
  THE THESIS RUN HAS ITS FIRST HONEST ANSWER, AND IT POINTS THE WRONG WAY. 749c0a290 graded the ab6
  pilots at pin a322166cc. The renewal-roll re-draw reached all four seeds (346 to 393 draws each,
  held 0), and the per-customer arm lost to flat rules on every one of them: 0 of 4 positive, mean
  -£3,067.58, sd £2,610.41, 95% CI [-£7,221, +£1,086]. So the ab5 and bridge positives (+£813 and
  +£284) were one favourable realisation of the fixed rolls, not a property of the method. P2's
  prediction (n* > 12, so "cannot say") was refuted: n* = 6. The prereg's rule therefore launched
  one extension leg, X1 (seeds 61005 and 61006, pid 313621, 44 minutes in at 14:26Z, due about
  16:40Z). The plain answer was written down before X1 reads. If the six-seed CI excludes zero on
  the negative side, the answer at the pin is NO: on what it decided differently, choosing
  customer-by-customer loses to flat rules. Three single-account switches carry most of the variance
  (C6, SYN-2016-034 and account 0098, all on seed 61002). Why the value arm loses is not yet known,
  and that is now the most important question on the thesis. It also describes the pin and not
  origin, because 4380002bd carried the PB6 churn-prior re-centring and the gas-leaver fix into
  company/ and simulation/ after the pin. On the machine, last stretch's first item landed
  correctly. 4380002bd put the content of all 19 stranded receipted commits on origin, in order,
  including five level moves, three parks and the world fix. That corrects my not_now error. But the
  fork is NOT closed. The follow-up `surgical_land --merge origin/main` (pid 349380) printed "landed
  MERGE 1918a0820" and exited rc 0, yet no ref contains 1918a0820. HEAD is still bc0df4b9e, 26 ahead
  and 18 behind, and reconcile-watch logged REFUSED_CONFLICT on 7 paths again at 14:21Z. A land that
  says it landed and is on no ref is probably what happened to pid 837396 too. Item three last time
  (the brief counts stranded landings) was named and never drawn. I am withdrawing it rather than
  repeating it, because its instrument is now wrong: a squash replay like 4380002bd is never
  patch-equivalent, so `git cherry` would count those 19 as stranded forever. The director's
  console turn at 14:09Z outranks both of those. The stretch log has been silent since 25 September,
  121.7h and 330 commits, the fifth stoppage. He asked for the pattern, not another patch.
  7cc2e0e69 found it. The log has one writer, the interactive seat, which runs only when he is
  present. The alarm pages once and then suppresses by design, and it routes its escalation to the
  pull-loop, which is that same absent session. Meanwhile this orientation writes the same
  reflection every 3h into decisions.jsonl, 14 times since 25 September, and it is not the file the
  check reads. That is my error as much as the machine's. I wrote `wrong` fourteen times over those
  five days and never listed the silent log. He also said budget is ample and to spend more where
  the lanes can use it. The box is the binding constraint while X1 runs, not the budget.
