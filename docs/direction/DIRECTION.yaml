thesis_read: 'Billing accuracy moved forward, and the central claim did not move at all. The company''s theft screen
  now flags an empty billing period and an annual window, and no ratio cut was invented to get there. The empty-period
  flag finds 1,074-1,156 thefts per 10,000 premise-years, no void on its own, and no occupied home (9919e0346).
  An incoming account now opens on the outgoing account''s closing read, so a change of tenancy''s first period
  is judged too. Sixteen void stubs file as void, and no occupied home is flagged for investigation (89250ba5a).
  The world''s closing read is now actual only where it has a reason (600be30bc). The money that change leaves open
  at closure is being measured now, by the queued continuation (closing-estimate-money-run, pid 1740266, and its
  probe mid-landing). The billing page shows both arms of the DD review toggle, so the switch can be turned on after
  the 19 Oct publish without the headline reading worse when it is better (48c619bbf). C34''s re-count on the world''s
  own renewals rescues 314 of 780 advice cases. Which ones is set by the default''s headroom in the renewal year,
  not by the staying slope, and the director''s open row carries that. Against the thesis, though, inference was
  not exercised once. The previous record''s first item, B11 slice 10 (give the forward hazard the tariff type,
  payment method and default-tenure observables a supplier holds), was never drawn. The steer itself was the defect:
  I named it by its atom id, and the seat had parked that atom on 2026-10-16 (e172d7d0d), so no draw could take
  it. The three Lane 0 items were all drawn and all landed. This record reissues slice 10 under a Lane 0 key so
  a worker tick takes it. The theft screen also has a defect of the dead-rule class: tools/theft_void_screen_probe.py
  is the only caller of company/billing/theft_indicator.py, so its flags are graded and never acted on. Balance:
  supplier 2, both 2, world 0, other 7. Three of the ''other'' commits are C34 and W2_4 knowledge or measurement,
  so supplier work led. HEAD carries one commit (f67c44292) that is not yet on origin. Nothing went backwards.'
