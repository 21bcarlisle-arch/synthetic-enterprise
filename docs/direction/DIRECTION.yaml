      is the worst possible moment. `renewal_margin_arm` stays "flat_rules";
      `company/policy/decision_policy.py` keeps defaulting to it. Ask again once item one has landed.
  - what: The discrimination question -- whether the arm actually ranks customers correctly.
    why: >-
      Still the biggest genuinely open question after the price ladder, and the ladder says so in its
      own words: removing price "says nothing about whether the arm ranks customers correctly ... the
      AUC of 0.694 carried entirely by one bucket is still the honest reading there". It is exactly
      the thesis -- advantage from inference, not access -- and it is exactly what I would name first
      if items one and two land. It loses this stretch for a reason that got sharper: ranking is a
      statement about DISPERSION, and item one exists because the graded population currently has
      none. Measuring discrimination over 33 accounts that all hold the identical belief would
      measure nothing at all, and would produce a number that reads like an answer.
  - what: Re-levelling the shared `company/crm/churn_model.py` so the pricing arm stops under-pricing.
    why: >-
      The measured level error -- the arm believes 0.328 at the flat rule where the world realised
      0.055 -- biases every value-arm decision, so fixing it at source and letting both consumers
      benefit is tempting and may well be right eventually. Rejected on sequencing twice over. It
      re-prices the whole book mid-measurement and would strand item two's numbers the moment they
      land; and item one may show that EP1's problem is a time model rather than a level at all, in
      which case a level fix at source would have been a change made for the wrong reason and would
      have masked the real one. Item one leaves the shared estimator untouched deliberately.
  - what: The publish gate's actual speed -- 399s median commit hook against an 840s ceiling it has touched.
    why: >-
      Inherited from the previous seat's own list, where it was named as the one thing he told the
      director he would do next and had not done. It cost four refused landings on 26 August and it is
      real. It loses because the evidence says the pain has receded rather than persisted: the
      publisher reached origin 0.9 hours ago, nine commits landed in three hours without a wedge, and
      `PUBLISH_CADENCE_SECONDS` was already re-measured from 330 to 1500 against a 200-marker window.
      A gate that is slow but not currently blocking loses to a gap sitting at 2.529 at the centre of
      the thesis. It returns the moment a landing is actually refused for time, and if that happens
      twice in one stretch it goes first.
  - what: Fixing the seat's own steer-effectiveness control so it can see a Lane 0 focus item.
    why: >-
      Rejected a fourth time on the same arithmetic, and the brief proved the defect a fourth time:
      `previous_focus_drawn` handed me `steered: true` and "the previous direction named work the draw
      then took", crediting EP1 -- which is byte-identical at `clv_three_horizon.py:580` and whose
      ledger has not moved since 26 August -- and EP13, which did SIM-side work again. It reads a
      tracker keyed by maturity-map atom id, so a Lane 0 slug cannot appear in it and the item that
      actually consumed the stretch (the director's red sweep) is invisible to it. I reconstructed
      this stretch from nine commits and eight artefact reads in less time than the repair would take,
      and the reconstruction is better than the signal would be. It returns to focus the moment a
      stretch stops being reconstructable from the commits alone.
  - what: Working down the ~40 open findings in the staging root, and the one BLOCKING class file.
    why: >-
      Left queued under SELF_INTERRUPT_DISCIPLINE, which exists precisely because the supply of
      harness findings is infinite. Most of these are auto-filed repeating alarms about docs a
      mid-work session left uncommitted -- the working tree carries 134 dirty paths right now and that
      is what generates them. Two are already answered inside the focus items rather than worked
