thesis_read: >-
  This stretch the thesis moved for the first time in four, and the way it moved is the finding.
  At 17:53 the director filed `DIRECTOR_CANON_RERANKING_THE_ARC_2026-09-04` — the adapters are
  plumbing for a launch not decided, and five things outrank them: something to infer (R1),
  decisions that use it (R2), the carbon figure (R3), products beyond price (R4), book depth (R5).
  By 18:19 the map was re-ranked to it, EP7–EP12 and EP14 were unblocked, and R1's inference ceiling
  had been measured before a line of R1 was written (`fa6ea8c7d`). Twenty-six minutes from his
  instruction to a landed measurement against it. My own direction landed at 17:30, twenty-three
  minutes AHEAD of his, named four items, and three hours later not one of them has been touched:
  `tools/settlement_ceiling_probe.py` still carries the same 226 uncommitted lines,
  `tools/fit_departure_hazards.py` the same 93, `site/data/value_arms.json` still publishes
  `share_at_which_a_bigger_book_could_resolve_it: -4.5507` graded `share_is_decisive: true`, and
  `background/origin_reconcile.py` still carries the 89 lines of `blocking_paths` that
  `git log -S` says are in no commit. So my predecessor's pre-registration is REFUTED, and worse than
  refuted: the prediction was that item 4, the apparatus one, would be drawn first and 1–3 left
  alone. Item 4 was not drawn either. NOTHING from focus was drawn. Six of nine substantive commits
  were still apparatus — the publisher's lost race, a torn import, the episode carriers' cannot-read
  vs nothing-here, the cold-start hoist — so the outcome the pre-registration predicted held while
  every mechanism named for it was wrong. Here is the mechanism, and it is checkable rather than
  inferred: all four of last stretch's focus ids were kebab-case slugs, a slug reaches the tick only
  through Lane 0, and Lane 0 delivered nothing in three hours; meanwhile the twenty atoms the
  ORDINARY draw offered were EP*, C* and SITE* ids, and the one piece of thesis work that landed came
  through the director's own staging document, which is the queue every tick already polls. Direction
  written as an atom id enters a channel that demonstrably runs. Direction written as a slug enters
  one that has now failed four stretches running. THE REMEDY IS APPLIED IN THIS FILE RATHER THAN
  BUILT: three of the five items below carry real maturity-map atom ids —
  `PB4_engagement_separated_from_elasticity`, `A46_book_depth_is_a_curriculum_question` and the two
  book-width instruments' own atoms — where last stretch carried none. If the atom-named items are
  worked and the slug-named ones are not, the cause is established and the next seat can stop
  guessing at it. The substance the canon leaves us is stark and I am taking it at face value. R1's
  ceiling says the best possible function of the company's eleven observables recovers nothing of a
  household's true elasticity that its own noise floor does not also reach: at full coverage
  (n=214) neither available feature clears its null, and nine of the eleven are carried by 102
  households or fewer, where the instrument cannot tell a real +0.26 from a +0.38 null. That is the
  thesis stated as a measurement — the advantage must come from inference, and today there is
  nothing to infer. It also makes the book's width a first-class part of the thesis rather than a
  tidy-up: the same instrument that would falsify an R1 build is the one whose power is bounded at
  632 accounts by our own serializer's double-counted working set, against a detection floor near
  806. Elsewhere: no level has moved for the ninth stretch running, blocking findings went 12 to 14,
  the staging root took 239 in and let 186 out for a net +53 with the work queue at 69, and the tree
  is level with origin for the second orientation — but `2d8ff0683` at 18:08 is a hand merge whose
  own message says neither daemon could clear the divergence, so the transport grade stays open on
  exactly the condition my predecessor set for it.

