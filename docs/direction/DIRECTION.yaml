  what: 'This is a Lane 0 slice of KNIFE3_wall_crossing_paydown. The dual-fuel set-off (1c5351d18), the
    statute-barred write-off date (5e554a00b) and the bill due date (86e590a44) are done. From docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md,
