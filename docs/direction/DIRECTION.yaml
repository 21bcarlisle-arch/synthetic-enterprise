    guard) must reach origin, and it now lives only in /tmp/msc_land/msc6.patch and salvage ae573846b1,
    because /var/tmp/se-msc-wt is gone. FIRST, before anything else, copy msc6.patch, msg6.txt and land6.sh
    somewhere durable that is not /tmp (for example /var/tmp/se-msc-keep/) and lock a fresh worktree detached
    at origin/main. Do NOT relaunch land6.sh as it stands. land5 timed out at 3600 s at 88% with the flock
    live, so a seventh unchanged attempt will die the same way. Instead, run the hook''s own selection
    for that pathspec with --durations=40 (one run, logged), name the tests and fixtures that spend the
    hour, and make the two run_phase2b fixtures that 52dba1ade''s finding names read the one shared 2016-2018
    run, the way 83570bd1c did for the event-log tests. Do not raise the deadline and do not drop tests
    from the selection. Then apply msc6.patch on that worktree and land with surgical_land. In the same
    landing, correct docs/staging/SEAT_FINDING_A_LANDING_THAT_TOUCHES_THE_LEDGER_OUTRUNS_THE_GATE_DEADLINE_UNDER_ORDINARY_LOAD_2026-11-23.md:
    the hook''s selection is 181 files, and 1,074 is select_impacted_tests'', which no gate calls. Keep
    the wrong figure beside the correction.'
  why: The coming book is the first in 75 hours, and every supplier grade queued for 24-25 Nov reads it
    (B8's five, D48, KNIFE3, the gas-only wins). If MSC misses it, the supplier's P&L in that book books
    a 2022-24 charge wrongly, and the next chance is a day later. Done means MSC is on origin before the
    post-s.12g book starts, and the durations table that shows where the hour went is in the finding.
    If it cannot land in time, done means a filed finding naming the test that holds the gate, and a seat_continuation
    row holding the book until MSC lands.
