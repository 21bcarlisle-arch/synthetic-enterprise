thesis_read: 'All three correctness fixes the exit test was waiting on are now on origin. These are the renewal
  notice, one EBSS eligibility home and one due date for the desk and the ledger (9ad5af9a7). The occupier-window
  fix landed beside them (7cec44a4b): a bill inside the window is the deemed account''s, so the two never-chased
  failed DDs are gone. E6''s two book seeds are graded (1aeabeacb). S2 holds and the crisis bad-debt finding is
  LATENT, which closes the lost-grader instance. The brief still counts that finding BLOCKING because it reads the
  shared checkout, and the checkout is 29 commits behind origin. All four previous focus items were drawn and three
  landed, so the steer bit. The stretch also lost its run. The one-due-date run was killed unfinished at June 2025,
  with no exit line and no cause found. So no exception moved and the exit test is still not read. One run at origin
  HEAD 1691ec0ec now carries every fix. It has simulated the full window to SURVIVED and is writing its outputs.
  That run is both the due-date grade and the cold read''s run. One sequencing defect is mine to fix. The run was
  launched before its pre-registrations were amended, but nobody has read its grade, so the amendment comes first.
  The commit split is 0 supplier, 0 world and 10 other, with 2 substantive. The substantive two were supplier billing
  (the occupier window) and the E6 grade, and four commits were base-advance merges. Against the thesis nothing
  moved. No baseline comparison was run, and no policy carries the corrected renewal belief. That is deliberate
  under the correctness ruling, and the next item that could move it is the exit-test read. The residue the occupier
  fix exposed is a second two-homes defect. The run refunds five leavers under reg 6D from a DD credit the ledger
  never held, one of them GBP 435.60. In a real supplier that is money paid out that was not owed, so it is the
  next billing item.'
