- id: say-whether-this-book-can-ever-tell-the-key-from-flat
  lane: B_commercial
  side: supplier
  what: Measure, without changing code, whether B11's within-segment test can resolve the key against
    flat at the book's real size. On the 8b6fea024 run, read Backtest.departure_ranking_within_segment
    (company/analytics/forward_clv.py). For 2020, 2022 and 2023, print departers, stayers, same-segment
    pairs, segments excluded, the estimate and the interval half-width. State what each count counts before
    dividing anything. From the stratified DeLong variance, compute how many same-segment pairs would
    put an effect of the size measured (+0.061 to +0.075) clear of zero. Then read the departures a year
    expected on the 400-household founder book (8927e9345, docs/staging/records/SEAT_PREREG_THE_SETTLEMENT_CURVE_AT_400_FOUNDER_HOUSEHOLDS_AND_A_BUDGET_OF_7700_2026-10-20.md).
    Say whether one seed, or the six fresh seeds the EP17 concern asks for, reaches that pair count. Print
    the table before writing any prose, and write it as a SEAT_FINDING in docs/staging/.
  why: The thesis is judged on whether inference beats the flat rule, and on that test the only reading
    we have is 'cannot tell' in two of three years (27ca9dc7a). If the book is too small to tell at any
    plausible effect size, then EP17's six seeds cannot answer either, and what has to change is the book
    or the test, not the key. That changes what the director is being asked to authorise. DONE when a
    finding on origin gives the table and says, per year, how many seeds or households would resolve the
    measured effect.
  written_at: 1792539097.931
