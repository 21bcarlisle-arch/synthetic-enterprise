focus:
  - id: rerun-the-value-cycle-ab-on-one-weather-store-with-more-seeds
    lane: B_commercial
    what: >-
      Write a SEAT_PREREG_ in docs/staging/records/ before any output exists. Per seed, predict
      three things: the sign of the decided-differently set (D) ex-PROS-2016-0098; the decided-alike
      set (A) staying within ±£25, which is the line seed 88888 refuted only because of the store
      swap; and the pooled sign test across all seeds on D. Then create a git worktree at the
      current origin/main, which must contain c39e01693 and e297d1169. If the noise-floor follow-on
      being landed from /tmp/wt-floorwx is on origin by then, use the commit that has it; do not
      wait more than one tick for it. From that worktree, run tools/run_value_cycle_ab.py
      --level-arm with --noise-floor-seeds 11111,88888 plus three new seeds. Launch it via
      background/launch_long_job.py under setsid. Launch only when
      background.resource_headroom.sample() shows room and no other value-cycle run is on the box;
      a gate pytest can take 3 GB. Grade every prereg line in a SEAT_RESULT_ beside it, one row per
      prediction. Include each arm's weather_store digest and the same_weather_store verdict as the
      first row.
      Nothing in code changes: launch_long_job.py is used, not edited. What lands is the two new
      records in docs/staging/records/.
    why: >-
      This is the thesis's own question: does the per-customer arm beat the flat-rules baseline
      because of its decisions? The last grade could not say. It had two seeds, p=0.77 and p=0.90,
      and one seed was contaminated by a mid-run store swap that is now refused by construction.
      DONE when a SEAT_RESULT_ on origin grades every line over at least five seeds that share one
      weather-store digest, and says plainly whether D's sign is distinguishable from zero. "Cannot
      yet say, with the bound" is a finished answer; a run that refused on digests is not.
  - id: clear-the-withdrawn-sanity-daemon-manifest-draft-from-the-shared-tree
    lane: H_harness
    what: >-
      First wait on the reconciler's in-flight merge (tools.surgical_land pid 2756499, running from
      /var/tmp/se-seat-executor) with tools.wait_for --pid, and do not start a rival merge. Then, in
      /home/rich/synthetic-enterprise, confirm that git diff HEAD -- background/process_manifest.yaml
      is exactly the 16-line sanity-daemon log_silence hunk preserved verbatim in
      docs/staging/records/SEAT_RESULT_THE_SHARED_TREE_IS_PINNED_BY_A_MERGE_BUDGET_ONE_RECEIPT_OUTGREW_AND_BEHIND_IT_BY_ONE_WITHDRAWN_MANIFEST_DRAFT_2026-09-29.md
      on origin. If it is, refresh that one path to HEAD with the seat's decision cited (origin
      withdrew the row in 0afe22631, and the bytes are preserved). If it has any other bytes, stop
      and preserve them first. Then let the next reconcile cadence run, and check whether
      git merge-base --is-ancestor origin/main HEAD holds in the shared tree. Record the outcome as a
      SEAT_DISPOSITION_. If the tree is still behind, name the next refusal's path and class.
    why: >-
      HEAD is 38 behind origin, so every daemon runs code the branch has moved past. That includes
      the merge budget in f9023293a, which is inert in the shared tree until the tree advances. The
      census names this draft as the one class-(c) path left. DONE when the shared tree contains
      origin/main, or a disposition on origin names the single path and refusal still holding it.
  - id: name-the-tests-that-make-a-subject-gate-take-26-minutes
    lane: H_harness
    what: >-
      Trigger: only when no value-cycle run from item one holds memory. In a worktree at origin,
      rebuild the pre-commit test selection that f997f8bf7's receipt recorded (1,570 s). Run it with
      pytest --durations=30 via background/launch_long_job.py under setsid, so the durations print
      even on a slow box; the last attempt was killed at 1,500 s before they printed. Write a
      SEAT_RESULT_ naming the slowest tests, their share of the leg, and why the selection picked
      each one (subject-stem match or its own file). Then, per test, either mark it for the slow
      lane with its reason or file a finding. Do not raise any timeout.
      launch_long_job.py is used, not edited. What lands is the new SEAT_RESULT_, plus any slow-lane
      marks on the named test files.
    why: >-
      Every commit here takes over ten minutes. One 26-minute subject gate was enough to pin the
      shared tree 37 behind, and the merge budget treats that symptom without explaining it. The
      cheaper mechanism is a faster selection, not a bigger budget. DONE when a SEAT_RESULT_ on
      origin names the tests behind the 1,570 s, or says "cannot yet say" with the run that
      failed to separate them.
