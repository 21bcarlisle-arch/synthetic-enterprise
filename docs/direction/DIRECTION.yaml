thesis_read: 'Four of last stretch''s five focus items landed, and the fifth landed only its first half, which is the half
  that mattered most. The money record is now right where it was wrong. A bill the EBSS covered in part no longer counts government
  credit as the household''s payment (a8d80fda6: GBP 73,353 on 1,100 bills down to GBP 804 on 12 occupier bills), and the
  company''s own balances were already right. The suite is wired into every completed run, report-only until its exceptions
  register is seeded (9d6ea2ead). The shared checkout is level with origin, so the director''s correctness refusal now runs
  on the box (65e1af5f8). An EV''s effect is read on our electricity leg over a full year, or said to be not ours to see (26cc72f7b).
  But the exit test has still not been taken. The fresh run on the fixed code finished at 04:47Z, and nothing graded it, because
  its grade continuation was released at 04:00Z by the tick that only launched it. That is the tenth shape of the lost-grader
  row, and this time it held up the ruling''s long pole. Against the thesis, the supplier''s bills and money record are closer
  to what a real supplier could lawfully send and could know, and 26cc72f7b found one more place where the supplier shows
  what it could not know: 14 of 21 EV arrivals fall after the household left us, yet our customer timeline shows them. That
  is truth crossing the wall on a page labelled as ours. Inference did not move: the renewal belief still ranks leavers backwards,
  and no baseline comparison changed. The brief''s split reads supplier 2, world 1, other 8. The ''other'' is the ruling''s
  own work (the suite gate, the checkout, the EV reader), so this is not drift. The one world commit, c688a5e61''s Unidentified
  Gas charge, is legitimate W2_36 work, but it means the f0d04dd72 run now on the box is not the book the pre-registration
  speaks to. So this focus grades the fresh book first and seeds the register from it. It then closes the timeline''s wall
  crossing, builds the check that would have held the grade, and takes the first cold read on the next publish. Those are
  the exit test''s three legs, plus the defect that delayed it.'
