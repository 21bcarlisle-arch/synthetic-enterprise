  lane: D_billing_metering
  side: supplier
  what: 'Fix both causes traced in docs/staging/WORKER_FINDING_THE_TWO_CLEARED_WHILE_OWED_DEBT_STORIES_HAVE_TWO_CAUSES_2026-11-02.md.
    (a) PROS-2025-0013: the reaction chain prints the arrears case''s ''repaid'' of 2025-07-07 past the
    page ledger''s as_of of 2025-07-04. Make every timeline writer cut at the ledger''s as_of, as tools/generate_payment_ledger_data.py
    already does, and do not weaken the debt check. Add a test that a case repaid after as_of prints no
    ''cleared'' moment, and that it reds on today''s code. (b) PROS-2020-0191: the desk (company/billing/collections_journey.py:461)
    cures on 2025-01-16 over GBP 40.73 the arrears engine still holds from INV17575. Read how the desk''s
    overdue view is built before choosing which record is wrong. Payment allocation on a domestic account
    is regulated practice, so read SLC 27 in the commons (docs/domain_artefact_library/) and the debt
    knowledge page (docs/market_research/debt_and_collections.md) first, and write the allocation rule
    there if it is absent (K8). Then make the two records agree, or make the page show the case the desk
    leaves out, with a test that reds on the old code. Run tests/company/billing whole before landing,
    and move the finding to done/ in the landing commit.'
