thesis_read: >-
  Three hours ago this project had a measured answer to the thesis and it was a loss. It no
  longer has one. `8b450a839` established that the per-customer arm's answers came from a bound
  because `renewal_margin_uplift`, its only production caller, passed six of `decide_margin`'s
  twenty company observables and let fourteen default -- and two of those defaults did the whole
  damage. The billed `revenue_gbp` includes the standing charge, so the arm compared an all-in
  GBP/MWh rate against a commodity-only offer and saw roughly GBP 55/MWh of headroom that does
  not exist on a small domestic account; and no ceiling reached the search at all, so the price
  cap landed afterwards as the fourth chain writer and `ceiling_bound` was structurally unable to
  fire. On one real account shape the chosen margin moved GBP 193.00 to GBP 60.00/MWh. That means
  the -GBP 93,555 net and -GBP 118,252 enterprise-value delta in
  `docs/observability/value_cycle_ab.json` is a measurement of a wiring defect and not of
  per-customer inference, and the same is true of the 20 ceiling cases, the 16 floor cases and the
  27 cap clamps I read as the losing mechanism last night. The honest sentence is therefore not
  "the company loses to its flat rules" and not "it beats them" -- it is that the thesis is
  currently UNMEASURED, and knowing that is a step forward in epistemics bought at the cost of the
  only number we had. The confirming re-run has not happened: the parked record says it was
  started, no `value_cycle_ab_2026-08-26_observables_threaded.json` exists, no process is running,
  and the only new artefact is `value_cycle_ab_prior_2026-08-26T0802Z.json`, byte-identical to the
  08:02Z original. Beside that, the belief half moved for real. `tools/couple_clv.py` was crashing
  on success, which had frozen EP1's coupled gap at a seven-day-old 1.7621 over five completed
  lives; repaired at `18e8d215e`, it re-reads 2.529 over 33 accounts -- mean belief GBP 473.71
  against mean realised GBP 100.20, 27 of 33 magnitude-inflated, 7 sign disagreements, and one
  scalar absorbing four fifths of it in-sample. Above 1 means the per-customer estimate carries
  less information than handing every account the population mean, so on the one quantity every
  per-customer decision maximises against, the company is beaten by the crudest baseline
  available, and three of my own direction records reasoned from the stale 1.76 without noticing.
  On the previous focus the record is better than the brief says: all four items moved, and the
  brief credits only two because the two non-atom items were Lane 0 claims whose draw record is
  the very signal focus item two below exists to repair. The two stale BLOCKING findings are
  discharged and the register reads zero blocking. The value-arm diagnosis is finished. EP1's
  instrument is repaired though its estimator is untouched. And EP13 did not move, correctly:
  its own L2 ledger entry names three unmet L3 conditions, so my predecessor's instruction to
  move it was unsound and is withdrawn below.
