  proposal: 'I recommend sizing the review from last year''s consumption at the rates in force (SLC 27.15''s ''most current information''). CORRECTED 2026-10-10 after measuring: I wrote that this was about
    -£11k of the debit, and it is £3.4k (lag -£17.8k to -£14.4k). About half of each year''s price rise comes after the review, which no rule can see. The rule is built and selectable, and the run''s default
    is unchanged because it missed its pre-registered £4k bar. The sharper question: does a supplier lift the debit by price changes it has already planned, or re-review when the price moves? Balance recovery
    stays your existing toggle until you say what the practice is.'
