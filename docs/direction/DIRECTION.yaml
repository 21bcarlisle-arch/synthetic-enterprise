thesis_read: >-
  Delivery went backwards for the third stretch running and the reason is now named rather than
  guessed. The baseline arm — the thing the thesis actually rests on, a flat-rules book to beat —
  got materially more honest: `6f040e8d2` and `2ed53bcaf` make a noise-floor family publish the
  DRAWS it is entitled to beside the seeds it ran, and `f9c1bf956` regrades all three terms and
  turns out to be a 2.74x correction that changes no verdict, which is the best possible outcome
  for a correction of an instrument. A reader has seen none of it. Figures last reached origin
  71.1h ago, the publisher has now refused 50 consecutive times over 68.7h with cause
  `behind_origin`, and `git rev-list` reads 29 commits on origin that this checkout does not have,
  against 20 when the previous record was written. So the honest read is that the company's
  evidence surface has been dark for three days while the machine kept improving what it would
  have shown. MY OWN DIAGNOSIS OF WHY IS REFUTED AND I AM CORRECTING IT RATHER THAN REPEATING IT.
  I wrote that the cause was my ranking the tree-advance work fourth. I ranked it second, the draw
  took it, a session worked it for a full turn — and the gap grew by nine commits anyway. Rank was
  never the binding constraint; it was an untested cause that happened to fit. The binding
  constraint is a broken door, and `ffa14f065` established it ON THE TRUNK by asking directly
  rather than assuming a stale checkout: `tools/refresh_to_head.py` builds its `-S` probe from
  `verdict.discarded`, which under `--base origin/main` is computed against the JUDGEMENT base, so
  the probe is a line that exists at HEAD, `git log --all -S` cannot find it against a commit
  parented on HEAD, and `verify_recoverable` raises PRESERVATION FAILED on a preservation that is
  sound. One call site, line 792, byte-identical on origin and on disk. The advance over the five
  residue paths is all-or-nothing, and that door is the only route for three of them, so nothing
  about the publisher could have moved this stretch whatever I had ranked first. A SECOND THING I
  GOT WRONG, and it is cheap to fix: the fourth focus item has now gone undrawn in two consecutive
  stretches — `value-arms-error-bar` and the two ahead of it were taken, `the-sanity-daemons-
  silence-has-no-cause-on-file` was not, exactly as the fourth slot went undrawn the stretch
  before. A fourth item is not a priority statement in a three-hour stretch, it is a write-off, so
  this record names three and says plainly what it dropped. On the boot stamper, the first half of
  the error I filed is now established and the second half is untouched: `ec667ff1e` proves the
  command does stamp, and proves the item's premise false in a way I would not have predicted —
  the stamper never died on 2026-09-04, it ran for two more weeks off a working-copy blob in no
  commit that carried both `dirty_blobs` and the deleted `__main__` block, and stopped when the
  checkout was refreshed to HEAD. The stamping population (12 long-lived daemons that restart
  rarely) and the restarting population (short units that never stamp) are disjoint, so the signal
  goes dark by construction. What is still true is the half I actually filed: nothing anywhere can
  tell a working stamper from a dead one, the `-` prefix keeps every failure silent, and the
  finding's own prediction is unchecked at the cost of one `stat`. Five of nineteen commits carried
  work and six changed nothing at all; as before that is the wedge's shadow and not idleness — a
  tree 29 behind produces merges that author nothing — but two of the six were liveness-only,
  landing a heartbeat into a checkout that cannot reach origin, and they should not be read as
  productivity by anything counting commits.
