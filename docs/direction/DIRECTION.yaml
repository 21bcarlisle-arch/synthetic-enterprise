    lane: W2_customer_generator
    what: >-
      Re-take the world-D value arms from a clean origin/main worktree: the three-arm run, then the
      3-seed noise floor (11111/22222/33333, --redraw-mode all), using the commands behind
      docs/observability/value_cycle_ab_s1_three_arm_20261001.json. Launch when item one has landed,
      or at the latest by 2026-10-03T18:00Z, whichever comes first. Launch the legs ONE AT A TIME
      through launch_long_job, with no other world run on the box. arms-d-head-1002 was OOM-killed
      at 8G running beside other work, and its floor was refused at the 11,200 MB price. Before
      either leg returns, supersede
      docs/staging/records/SEAT_PREREG_THE_WORLD_D_VALUE_ARMS_RETAKEN_AT_HEAD_0BAC2B8BE_2026-10-02.md
      with a pre-registration at the launch commit. It must predict the sign of the whole advantage
      and of the level leg, now that 9cfb1817f has uncapped fixed renewals. Then move
      CURRENT_WORLD_THREE_ARM_PATH and CURRENT_WORLD_NOISE_FLOOR_PATH together, regenerate
      site/data/value_arms.json, and grade the pre-registration. Remove /var/tmp/wt-arms-retake-1002
      and /home/rich/wt-pb4-land once nothing holds them.
    why: >-
      The value arm against the flat baseline is the thesis's own test. The page still reads it from
      0407ce0e3, which is four lawful-pricing and foresight repairs behind. DONE when
      site/data/value_arms.json's current-world reading comes from a run at or after 6aa3653d7, the
      world-stamp guard accepts it, and the pre-registration is graded beside it, whatever the sign
      turns out to be.
  - id: the-value-arms-churn-belief-calls-a-x2-renewal-optimal
    lane: B_commercial
    what: >-
      Measure first and change nothing. Use /var/tmp/se-fixed-cap/ (value_landed vs value_base) and
      company/pricing/value_based_renewal.py. For each of the 46 renewals the uncapped arm repriced,
      tabulate the belief's predicted churn at the struck price, the world's realised churn
      probability for that decision (from customer_events), and the price ratio to the capped rate.
      Then say where the belief's price response departs from the world's: the curve's shape, its
      extrapolation beyond the ratios the company has ever observed, or its inputs. Before proposing
      any remedy, look in docs/market_research/ and the knowledge map for a published switching
      response at large renewal price gaps. File the finding with a pre-registered remedy. Do NOT land
      a behaviour change while item two's runs are in flight.
    why: >-
      9cfb1817f showed that the cap had been doing the arm's inference for it. Uncapped, the arm's
      belief priced renewals at up to x2.4, the world churned 7 more accounts, and value net fell
      3,587 pounds. An advantage that a legal ceiling props up comes from access, not inference, and
      that is the thesis failing. DONE when the finding names which part of the belief is wrong, with
      the per-decision table, and a pre-registered remedy is on file for the next one-variable run.
