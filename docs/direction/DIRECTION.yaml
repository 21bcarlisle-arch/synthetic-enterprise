      `docs/staging/`. Nothing else.
    why: >-
      Fourth because it is the smallest thing here and because it is the **same defect as last
      stretch's, one layer up**: the split was computed and not published, and now the control that
      catches exactly that is written, mutation-proven and not committed. Recording the shape twice in
      two stretches without landing it is how a class becomes a theme. It ranks below the three above
      it because nothing is currently wrong on a served surface as a result — the split **did** reach
      `origin/main:site/data/dashboard.json`, verified this orientation, with
