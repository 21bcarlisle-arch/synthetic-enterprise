thesis_read: 'The supplier half of the thesis did not move this stretch, and that was the seat''s steer, not the machine''s drift. All four focus items were drawn
  and three are done or in flight. The held-work check no longer refuses on a stale sibling copy (af0f60f68). A seat record that misses origin is named in the next
  brief (820a2f31b), and the cause of the lost 17:23 record is on origin. The arrears captures on two dice seeds are queued, and their pooled grade is a continuation
  at 10:30. W2_38 is still L0 after 71 unchanged draws, so that steer drifted and leaves focus. But I had put no supplier item in focus, and the commits show it:
  19 commits, 11 carrying work, 7 substantive. Six of the seven were harness and one was a world tool (61526f0ef). None was supplier. The director named the imbalance
  at 04:22 and set the order: the reactive save on the loss notice made live, then home-mover retention, then debt as a next best action. Each is a per-customer decision
  against a flat rule on information a real supplier holds, which is the thesis exactly. All three are half-built and switched off. The save was graded fair on 10-08:
  0 of 4,898 stayer prices moved, and it beat never offering by GBP 1,679 at the top of the published range, on the pre-correction world. It still never runs. C34''s
  debt branch is dormant in the orphan baseline. A mover''s next home is a flat world roll the company never decides. So the company can still not show it beats the
  flat baseline on anything live. This record turns the next three ticks onto exactly that. Separately, the shared checkout is 25 behind origin, so every fix above
  is inert in the processes that run it, this seat''s brief included. That is fourth, because the director''s balance comes first and nothing in the three supplier
  items depends on it.'
