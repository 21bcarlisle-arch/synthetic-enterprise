thesis_read: >-
  **The world got materially more honest this stretch and the published surface did not — and for
  the first time in seven orientations the top item closed.** `c628cb37d` gave
  `svt_inertia_hazard` a required, keyword-only `market_switching_multiplier`, re-referenced from
  2024 into the 2019–20 window the 0.20/0.10 constants were inferred in, applied to the annual rate
  before the constant-hazard conversion. 2022's SVT floor moves **12.80% → 2.33%** against a
  published 4.30%, having been unreachable at *every* point in the published band including its
  bottom (8.99%); Spearman against the published midpoint moves **−0.26 → +0.9048**; the CV ratio
  **0.368 → 1.0387**; and 2023's renewal anchor moves **0.03 → 2.44**, so the one route the company
  can actually price against stopped being near-extinct. Nothing was fitted and no band moved.
  `7df525a10` then re-ran the whole table at a denominator that had shifted underneath it (2022:
  55 → 52 accounts) and the conclusion survived a population change nobody arranged for it. That is
  the first genuine rung-2 repair on the route carrying **61%** of departures, and it is the largest
  single step this project has taken toward *a baseline to beat*. **The step is not banked, because
  the baseline still cannot be fitted.** Every committed capture reproduces only under a
  market-blind hazard, so `svt_composition_refusal` correctly calls them stale and no whole-book
  anchor is emitted. The capture that would clear it was launched, its pre-registration was filed
  at 10:43 UTC before a line of output was read — and **the run died four minutes later at 2020-10
  of a 2016–2025 sweep, wrote no SVT sibling, and thirty-seven minutes on nothing had noticed.** A
  filed prediction with a dead run behind it is the exact shape this project files findings about.
  **And against the thesis the published side went backwards.** `site/data/dashboard.json` right
  now serves `avg_shock_pct = 17,284.3` for 2022-04, with **29 of 113 months above 200%** and a
  median month of **126%** — figures that say the typical household's bill more than doubled every
  month for a decade. It is live, it predates today's work, and it was found only because a worker
  asked whether a bug it had just made itself had older siblings. Underneath it sits the real
  defect the director named twice from the console: `bill_shock_pct` is definition B's quantity —
  the difference between two bills — applied to a book that is **68.1% direct debit**, for whom the
  bill is not the thing they pay. `payment_channel_for_customer()` exists and already drives three
  organs; the shock measure is the fourth and is the only one not told. So the machine improved, the
  world improved, and the one surface a reader actually sees is publishing a number two orders of
  magnitude wrong about a quantity nobody had defined. **The previous focus was named and, for a
  seventh stretch, drawn by nothing** — `previous_focus_drawn` reads empty while the top item
  demonstrably closed in three commits. The steer is reaching the trunk through the interactive
  seat, not through the executor, which has now stood down **24 consecutive times** unbroken since
  2026-08-31 23:35. I am treating that as measured fact rather than as the headline it was last
  time: the delivery path works and the redundant one does not.
