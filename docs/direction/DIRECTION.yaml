  /var/tmp/vta-driver differs from the churn_roll driver by one flag. 67fac7f61 settled which arms read which belief:
  the ending-term flag reaches the desk belief on every arm and never the pricing belief that A's 0.549 AUC reads. All
  three previous focus items were drawn and met (67fac7f61, b060dd719, 01e597d65), so they leave focus. churn_roll
  (pid 1162351, pair 33333/44444 at 2h29m) is still running, and its grade is a queued continuation stamped not before
  15 Nov 09:30. 13 commits, 9 substantive, split 1 supplier, 0 world, 12 other. The value-test commits are the
  supplier's thesis work, written in docs. One supplier commit touched company/ while the book is frozen: e6134becd,
  the C32 decider fix. It is the fix the Expert Hour asked for, so it sits inside the ruling's "the fix", but it rides
  into the 16 Nov book. I cannot yet say whether it moves any graded continuation, because PSR disconnection does not
  enter the refund, VAT or final-bill reads by any route I know, and nobody has checked that. G14 reached L3 under G16,
  a world-side level move that unblocks no supplier result this weekend. W2_21's founder step was measured and held,
  which is world fidelity with no supplier result named. The next 15 hours wait on two events (the 09:30 grade and the
  16 Nov 04:00 book), and nine continuations already own those reads. So the focus is supplier work that neither
  event can inform. First, C32 is one blind pass from L3 now that its decider and crosswalk are fixed. Second, B11, the
