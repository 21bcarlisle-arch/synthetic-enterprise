thesis_read: >-
  Fixes kept landing, and the exit test has not moved. The last accepted record is 09:21. The 12:23 record was
  refused because one lane was an atom id, but its items were worked anyway. Of its five items, two landed. The
  DD balance book now reads the dated spells (4669d77dd), which moves GBP 2,475.43 of review bars that sat off
  DD. N18 is closed (667a12d10, 6a026b67d): the world's 2016-2018 default bills now meet Ofgem's published ones
  (GBP 1,068 / 1,115 / 1,173 against 1,071 / 1,117 / 1,175), and the N18 row (818fee571) fires on the old book.
  The 12:23 record called N18 the company's. That was wrong: it was the world's SVT table, and the row in `wrong`
  says so. N15 is corrected on the book. The blind row reads 0 of 1,234 re-offers on the first post-ba868134c book
  (796808ace), as pre-registered. It survives only on the household page's bill tally, and continuation
  n15-page-bill-tally-counts-credit-as-missed holds that fix as 77c6bb11f in /var/tmp/se-seat-executor. That commit
  is not on origin, so it is the at-risk shape that `wrong` already carries. N13 stays corrected (92e949025: 10 of
  2,387 gas pairs repeat, against 1,635 of 4,413). No new in-place advisor edit is known: both 4 Nov knowledge steers
  moved to advisor/done/ in their closing commit (e65298c5f), so that row is corrected. Three items were not touched:
  the seven gate rows, N19's false cap breaches and N17's flat electricity. Two of them are legs one and two of the
  exit test, and the 9 Nov publish is the gate's next refusal. Against the thesis, this stretch moved the world
  closer to the published record, and it made no per-customer decision that a flat baseline could fail to make.
  The renewal belief still ranks leavers backwards. N18 also raises 2017 and 2018 revenue, so N21's 14.5% margin
  will probably get worse, not better, and nothing has measured it. The commit_split is 1 supplier, 3 world and
  20 other. Supplier grading counts as other, but even so, 3 world fixes to 1 supplier fix is the wrong way round,
  and this focus puts four supplier items ahead of the one world item. Six commits carried no work, all of them
  automatic merges, and each focus item landed around them, so this is noise and not a stall. No book on origin
  yet carries N18, so this focus owns a fresh run before the window.
