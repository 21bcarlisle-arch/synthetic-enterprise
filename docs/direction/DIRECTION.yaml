focus:
  - id: unjam-the-build-draw-so-the-directors-dial-can-reach-r1
    what: >-
      Repair `_prefer_least_stalled` tier 2 in `background/supervisor.py` so that a starved atom can
      actually rejoin. Today it returns `least = [a for a in candidates if streaks[a] <= floor]`,
      which REPLACES the candidate set with the minimum-streak atoms and drops
      `PB4_engagement_separated_from_elasticity` (1884), `PB5_pounds_or_percent_resolved` (1883),
      `EP1_clv_three_horizon` (1973) and `E5_carbon_three_ledger` (1973) against a floor of 1413 —
      every cycle, deterministically, and the gap widens each time a rival is drawn and moves. Its
      docstring's promise ("an atom rejoins the moment every rival has been drawn up to its own
      streak") is what to make true. The director's 2026-08-19 ruling it implements says "make it
      impossible for the system to run indefinitely on work that cannot change its own state", and
      the reading it was given inverts that: the atoms that cannot change their state are precisely
      the ones it now guarantees are never offered. HONOUR THE RULING AND THE DIAL BOTH — the ruling
      forbids re-drawing an atom that keeps not moving, it does not license permanently starving the
      highest-dial work — so the shape to reach for is one where the stall streak orders WITHIN the
      dial rather than deciding membership ahead of it, or where the floor is a rotating window
      every candidate enters. Do not delete the guard and do not touch the dials: this is one
      function. THE CONTROL IS THE POINT AND IT IS WHERE THE MUTATION MUST FIRE: write it over the
      whole partition, asserting that a candidate set in which every atom is flagged and the
      streaks differ by 400+ still yields the high-dial atom on some draw — not that today's answer
      is a particular id. Then re-read the 23:24 ANTI-LIVELOCK line's successor and say in the
      commit message whether PB4 is now reachable, with the evidence. THIS IS THE ONE APPARATUS ITEM
      AND THERE ARE NO OTHERS — see `not_now`.
    why: >-
      Because it is the gate on everything else in this file and on the director's canon. He
      re-ranked the arc on 2026-09-04 and expressed it as `dial_inherited: 45` on eleven atoms,
      derived to give R1–R5 roughly three quarters of a weighted draw; the measured outcome is 0 of
      21. His instruction is currently unable to execute, and no amount of better direction-writing
      changes that, because the seat's only steering surface sits BELOW the filter that removes the
      subject. Four stretches of ranking apparatus below thesis work were right in spirit and did
      not help, because this is not apparatus in the ordinary sense — it is the channel the thesis
      work has to arrive through. Finished when a stalled high-dial atom can be shown to reach the
      picker, the control fires on a mutation that restores the replacement semantics, and the
      supervisor log shows an R1–R5 atom drawn on the BUILD lane. If the repair lands and PB4 is
      still not drawn within the next stretch, the cause is somewhere else again and THAT is the
      finding — file it and say so rather than re-writing this item a sixth time.

  - id: r1-give-elasticity-observable-antecedents
    what: >-
      Build R1 — the PB4 work, carried here as a SLUG on purpose so it reaches Lane 0 rather than
      the jammed atom draw; do not wait on focus item 1. Give a household's price elasticity
      OBSERVABLE ANTECEDENTS instead of a hash of the customer id, in
      `simulation/population_draw.py` and `simulation/customer_events.py` (PB4's own file scope).
      Start from the published record, not a shape that feels right: what household characteristics
      the evidence associates with switching behaviour — Ofgem's Consumer Survey engagement
      segmentation and the Retail Market Indicators read FROM THE DATA TABLES, per fuel, plus
      payment method, consumption band, tenure and prior switching where the record carries them —
      and file that read in `docs/market_research/` before writing the trait. PB4's own gain
      statement is the design and it is two gates, not one weight: an ENGAGEMENT gate (does this
      household look at all, and what makes it look) and, conditional on looking, an ELASTICITY (how
      far the gap moves it), with the gate taking a comparison offer as an argument so a responding
      competitor changes what is on offer without changing the decision's shape. HOLD THE MARGINAL
      DISTRIBUTION OF ELASTICITY FIXED: re-plumbing where the trait comes from is a fidelity
      correction and yours; changing how many households are highly elastic is curriculum, is the
      director's, and is reserved. If the honest version leaves our position unchanged or worse,
      make it and say so afterwards. Then FILE THE PREDICTION FIRST, re-run
      `tools/r1_inference_ceiling.py` on a book drawn after the build, and publish the verdict
      whichever way it falls, beside the prediction.
    why: >-
      The thesis says the advantage must come from inference and never from access, and the ceiling
      measured on 2026-09-04 says that today there is nothing to infer: at full coverage neither
      available observable clears its own null, so the best possible model recovers nothing. Until
      households differ for reasons a supplier could in principle observe, every comparison against
      the flat-rules baseline returns "the level is everything" and is right — the claim is not
      unproven, it is unfalsifiable, and R2 is bounded at the floor before a line of it is written.
      This is the director's first-ranked item and it has now gone five stretches without being
      touched. Finished when the antecedents are sourced and filed, the build holds the marginal and
      says so, and the ceiling re-run's verdict sits in the record next to a prediction written
      before the answer was known. A re-run that still reads "noise" is a complete result and must
      be published as one.

  - id: the-books-ceiling-is-our-serializer-and-not-the-world
    what: >-
      FIRST ACT, unchanged and still undone after two stretches:
      `tools/settlement_ceiling_probe.py` carries 226 uncommitted lines, last written
      2026-09-03T07:10 and in no commit. Read them, say in the commit message whether they are
      finished work or an abandoned attempt, and land or discard before writing a line beside them —
      do not write a second probe. Then the work: in
      `simulation/premise_population.settled_book_ceiling`, `bytes_per_record` ADDS
      `settlement_build` (363.5 B) to `run_output_serialization` (411.4 B), because the
      serialization baseline is taken after `run_settlement` returns while the settlement working
      set is still held, so one build-then-serialize process pays for both. Change the path so one
      working set is paid once — stream records out and free them as they are written, or split
      build from serialize across the process boundary — then RE-RUN the probe and let the ceiling
      fall out of the new measurement. Do not edit the number, and do not touch the 1/sqrt(n) curve
      or the null.
    why: >-
      This is what makes item 2 testable, which is why it outranks the rest. The ceiling probe is
      R1's falsifier, and its own finding says nine of the eleven observables are carried by 102
      households or fewer and that at those sample sizes it cannot tell a real effect from its noise
      floor — so a book too narrow to see an effect returns "noise" and reads exactly like an R1
      build that failed. The width is bound at 632 accounts against a detection floor near 806 by
      our own RSS accounting rather than by the world or the method. Finished when the ceiling is
      re-derived from a re-run probe and the published bound's binding constraint is something other
      than our own output path.

  - id: a46-the-priced-menu-goes-to-the-director
    what: >-
      Discharge work-item 4 of the director's canon: return R5 to him as a curriculum question with
      its cost re-measured against TODAY's book.
      `docs/design/A46_THE_PRICED_MENU_2026-08-30.md` is the vehicle and already exists — read it
