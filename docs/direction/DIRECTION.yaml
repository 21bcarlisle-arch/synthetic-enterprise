focus:
  - id: finish-the-floor-split-and-mark-the-prediction-that-is-losing
    what: >-
      The second floor leg (`--redraw-mode except`) is running now, started 23:07Z, and the first took
      81 minutes, so expect it around 00:28Z; the pickup steps are already written in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_ARMS_FLOOR_DECOMPOSITION_MUST_SHOW_2026-08-29.md`
      and you should follow them. **Three things that document does not say, and they are the work.**
      (a) **The reconciliation number, filed here before the leg lands so it cannot be re-read after
      the fact:** if the two legs are two halves of one variance, the except leg's `selection_gbp`
      stdev must come out near **£1,506** — that is `sqrt(2577.80² − 2092.29²)`. Write that
      expectation beside the result whichever way it goes. (b) **Prediction (1) in the preregistration
      — "the priced side is the SMALL half" — is already refuted by the leg that landed**, 65.9%
      against a 50.4% bar. Mark it wrong, in that file, beside the number, and do not let the
      surrounding prose quietly re-read as though it had been agnostic. (c) **Then do not publish the
      share as if it were resolved.** Each stdev is three seeds — two degrees of freedom a side — so
      65.9% against 50.4% is a direction, not a resolution, and the honest branch may be that the
      remedy clause returns hedged or stays absent while more seeds are bought. Before any of that
      reaches a reader, **fix the denominator**: the leg re-drew **10 accounts**, the arm took **20
      priced decisions**, and the patch fired on **90–103 elasticity draws** per seed — three
      different numbers, and the price table in
      `docs/observability/value_arm_floor_decomposition_prediction_20260829.md` runs a 1/sqrt(n)
      argument through all of them and then divides again into *"renewals the world must offer"*. Say
      what each number counts, pick the one the shrinkage actually indexes, and reprint the table
      before it is composed onto the page.
    why: >-
      This is first because the page is live and currently says it has no remedy while the evidence
      for one is sitting in an artefact written twenty minutes ago, and because a preregistered
      prediction that is losing is worth exactly as much as the honesty with which it is marked — a
      prediction filed after the answer is not a prediction, and one quietly re-read after it is
      contradicted is worse than none. It is also the item that decides the queue behind it: if the
      priced side really does dominate, "the lever is a product, not a size" — the prereg's own
      closing claim — is not established, and the lifted-budget re-run comes back into scope. **Done
      means:** the except leg reconciled against £1,506 or explicitly failing to, with the
      pass/fail band stated as the prereg's 0.3–3.0×; prediction (1) marked refuted beside its number;
      the denominator named and the price table reprinted on it; and the page's remedy clause either
      restored with its price and its n=3 caveat, or held absent with the reason on the surface. A
      permitted result is *"the split is priced-heavy and three seeds cannot resolve it against the
      bar"* — that is a finding about the instrument and it belongs on the page, not in a footnote.
  - id: establish-why-no-drawn-household-has-ever-been-priced
    what: >-
      In `docs/observability/value_cycle_ab_s1_three_arm.json` the world offered **1,369 renewals
      across 168 accounts** and the value arm priced **20**, and the priced roster in the floor leg's
      `redraw_scope.accounts` is ten founder ids — `C1, C1_2, C2 … C9`. **No `SYN-*` account, none of
      the 90 the funnel won, has ever been priced by the per-customer arm.** Establish whether that is
      structural or incidental, from the artefact and the code, with no long run. `renewal_funnel`
      already groups every renewal by the stage it stopped at; break the drop-out down **by account
      class** — founder versus won — rather than only by stage, so `product_not_upliftable`, the gas
      leg and `term-0` are each attributed to a population. Then read the gate in the rate chain
      (`simulation/run_phase2b.py`'s `decide_renewal_rate` call site and whatever sets
      `renewal_margin_arm`) and answer one question in one sentence a reader can check: **is there any
      book size at which a won household reaches the arm, or does a won household fail a gate it can
      never pass?** If it is a gate, name the gate and file it — do not fix it on sight, and above all
      do not change the world to open it. If it is size, say how many won households would have to
      settle before the first one is priced, and hand that number to the third item, which is where it
      gets priced into a menu.
    why: >-
      The thesis says the advantage must come from inference over individual customers, and the
      baseline exists to prove it. Right now the method has inferred about ten customers, all of them
      the ones the company was founded with, and every argument this project is having about book
      size, seeds, error bars and settlement ceilings is downstream of a question nobody has asked:
      whether the customers the company *finds* can be reached by the method at all. It is second
      rather than first only because item one is on a live page and this is not yet. It costs no box
      time, which matters when two long runs are already contending. **Done means:** a funnel
      decomposition by account class, the gate named or ruled out, and the sentence — structural or
      size — written where the arms page's reader can find it, because *"the method has never priced a
      customer the company won"* is a fact about the enterprise value claim and not an internal note.
      **If the answer is that no won household can be priced because the world has no standard
      variable product, that is a curriculum question and it goes to the director as one; it is not a
      commit.**
  - id: price-the-book-depth-menu-off-the-slope-and-put-it-to-him
    what: >-
      `settlement-ceiling-slope.service` is running and its four predictions are filed in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_CLEAN_CEILING_SLOPE_MUST_SHOW_2026-08-29.md`. It
      is **waiting on the arms leg from item one**, and its wait has a hard deadline of
      **2026-08-30T03:11:49Z**; the arms leg should clear around 00:28Z, leaving it roughly two and a
      half hours for two probe points, which fits. **Therefore: do not start another
      `tools/run_value_cycle_ab.py` leg — more seeds, a re-run, anything — until that service has gone
      inactive.** Its waiter greps the module-dotted spelling of that path across full command lines,
      so a new leg re-arms the wait and a worker whose own prompt merely quotes that spelling can hold
      it open until it gives up having measured nothing, for the second time, on the director's top
      item. When it lands: mark all four predictions beside their results, right or wrong; replace
      `NOT YET KNOWN` in `tools/generate_book_growth_data.py::engine_bound_basis` with what the slope
      established, because that string is the reader's only copy of this answer; and confirm
      `docs/review_gates/.sim_runner_hold` is gone. **Then move `A46_book_depth_is_a_curriculum_question`
      off level 0 by building the thing the atom says it exists to build** — the priced menu: for each
      publish interval we could choose, the settlement ceiling it affords, the customer-years and
      settled accounts that buys, and — taking the number item two hands you — how many of those are
      accounts the arm could actually price, plus which published comparisons stay bounded until it
      lands. Put the menu in front of the director with a recommendation attached, never a bare ask.
    why: >-
      He named the settlement ceiling his top item at 05:55Z on 2026-08-29 and ruled on 2026-08-28
      that book depth is curriculum and therefore his, *"flagged, not delegated"* — so the basis and
      the menu are mine to build and the choice is his to make, and last stretch's preregistration was
      about to send him the interval question when what the atom owes him is the priced menu. It is
      third because it is gated on a run that is gated on item one, and because item two supplies the
      column that makes the menu answer the question he actually cares about rather than a table of
      wall-clock. It is also the only work in this direction that moves a level: `A46` is at 0 against
      a bar of 2, provenance `director_ruling`, and zero levels moved this stretch. **Done means:** four
      predictions marked, `engine_bound_basis` carrying the measured answer instead of a placeholder,
      the menu built with a recommendation, and `A46` moved — or, if the slope gave up at its
      deadline, that written down as the outcome with the contention that caused it named, which is a
      result about this box and not a reason to re-run blind.
not_now:
  - what: >-
      Adjudicating the £22,788 pre-2021 loss as a focus item. Carried three times, at position four
      every time, and drawn zero times.
    why: >-
      Dropped rather than carried a fourth time, and this is a correction of my own ordering rather
      than a judgement that the question stopped mattering. The evidence is from this stretch: the
      founder-book controls sat at position four for three directions and landed within hours of being
      moved to position three. Position four is not a lower priority here, it is a place work goes to
      not happen, and re-filing it there again would be deciding by omission for the third time while
      appearing to decide. The substantive reason it loses to the three above is the box: two long
      runs are contending right now and the ceiling slope's deadline is inside four hours, so a third
      two-hour run is the one thing most likely to cost the director his own top item. It returns at
      position one or two once the box is quiet — and its re-specification stands, `248a6368e^`
      against `248a6368e`, both historical, never against HEAD.
  - what: >-
      Launching the lifted-`SETTLEMENT_CUSTOMER_YEAR_BUDGET` arms re-run, now that the priced side
      looks like the large half rather than the small one.
    why: >-
      Held one more stretch, and for a new reason rather than the old one — this is the temptation
      item one creates by winning. If the split reconciles, a bigger settled book does buy the
      variance down, and the instinct will be to launch immediately. But item two may show that not
      one won household can reach the arm at any size, in which case a bigger book adds churn cascade
      — the half that never shrinks — and no priced decisions at all, and the run would be two hours
      of a box that OOMs spent making the floor wider. The order is deliberate: establish who can be
      priced before buying more of them.
  - what: >-
      Giving the drawn book a standard variable product so that won households become upliftable.
    why: >-
      Refused again, and item two makes it more live rather than less, which is exactly when the
      refusal has to be restated. 662 of 1,369 renewals stop at `product_not_upliftable` and if item
      two finds that the won households are the ones stopping there, this becomes the single lever on
      the whole experiment. It is still a change to the baseline world, still R13, still the
      director's, still decided on fidelity evidence blind to company results — and
      `docs/design/DRAWN_BOOK_TARIFF_TYPE_FIDELITY_DETERMINATION.md` settled it on 2026-08-28. An
      argument for it that begins "our experiment needs a larger n" is the disqualifying argument.
      Internal consistency is not a fidelity case for a world change that enlarges the experiment
      making it.
  - what: >-
      Building `tools/detached_launch.py`, the shared detached-launch helper.
    why: >-
      Fifth deferral, and this time the trip-wire genuinely tripped — so I am recording that it
      tripped and still refusing the helper, because the defect it would have prevented is not the one
      that happened. What happened is under `wrong` below: a lane hand-rolled a `pgrep` waiter into a
      `/tmp` shell script, which CLAUDE.md forbids by name. The fix for that is one line — use
      `tools/wait_for.py`, which already exists and already names its subject and carries a deadline —
      not a new module. Prefer doing the work to building the thing that watches the work; here,
      prefer using the waiter we have to writing the launcher we do not.
  - what: >-
      Reopening `H27_payment_belief_gap` on the grounds that twenty-one consecutive Expert Hours have
      not moved its level.
    why: >-
      Considered and dropped after reading the map rather than the log. `level_current` is 2 and its
      bar is 2 — the atom is where it is meant to be, and twenty-one Hours at a level it has reached
      is hardening by design, not a stall. Recorded because the pattern reads like drift from the
      status page and is not, and the next seat should not spend the hour I nearly spent.
  - what: >-
      Putting the book-depth question to the director now, unpriced, or sending him the free-equity
      and R6 headroom results.
    why: >-
      Both held, both mine to hold. Book depth is genuinely his by his own ruling, which is precisely
      why the thing that reaches him must be the priced menu `A46` describes and not the question on
      its own — a bare ask on his path is a defect, and an unpriced one wastes the only scarce
      resource here. The R6 headroom result is still a co-movement rather than an attribution because
      the run that would separate it is the item I have just dropped for contention. Both go together,
      in one paragraph, when items two and three answer.
