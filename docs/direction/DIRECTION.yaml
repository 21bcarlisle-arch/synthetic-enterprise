    cycle''s furthest reader, hours from firing). Record its exact re-arm command, ExecStart /var/tmp/vte-driver/run_ep1.sh
    with its SE_BOX_ADMITTED env, beside the stop, and keep its pre-registration and pins unchanged. Confirm
