thesis_read: >-
  Three of last stretch's four focus items landed and the fourth is correctly waiting on a clock —
  but the headline of this orientation is that MY OWN FIRST ITEM WAS FACTUALLY WRONG ABOUT THE TREE,
  and the correction inverts what I published last stretch. I wrote "SVT is absorbing; `tariff_type`
  is resolved once per customer and there is no reverse edge", and concluded that the company was
  short of DECISIONS because the world could not express the outcome. Measured through the world's
  own builder on the real SSP feed — 120 real-grammar households, 2016-06-01 to 2023-12-31, BEFORE
  anything was written — the edge was already there: `svt->fixed` 61 transitions over 590.28
  SVT-account-years, 0.1033 per SVT-account-year, where that quantity counts transitions from a cap
  segment to a fixed term per year an account spent on the cap, and counts neither households nor
  offers nor decisions. It landed on 2026-08-30 with C1b and `simulation/renewals.py` argues against
  the absorbing draft in its own comment. So the wall I said I had located and placed on the world
  side of the seam was not there, and the sentence I published — "no seeds, no arms and no
  publishing repair can move a verdict limited by how many decisions the world creates" — rests on a
  premise the tree refutes. What IS absorbing is narrower and real: a household that ARRIVES on the
  default tariff rather than rolling onto it, via early returns at `renewals.py:103` and
  `run_phase2b._build_gas_renewal_schedule`. Two routes onto one product and only the mid-tenure one
  had an exit. No caller reaches that branch today — nothing in `simulation/`, `tools/` or `company/`
  sets a record's `tariff_type` to `"svt"` — so it is dead code with an absorbing state in it,
  inert on every live run, and the day a SoLR intake or an acquired default book mints one it
  absorbs that household for its whole tenure silently. That repair is built and IS SITTING
  UNLANDED IN THIS TREE right now: `simulation/renewals.py` (+70 lines), `simulation/run_phase2b.py`
  (+29), `tools/published_route_split.py`, a modified `tests/simulation/test_svt_product.py`, and an
  untracked reachability control `test_the_svt_origin_household_can_reach_a_fixed_term.py`, with its
  result document untracked beside them and nothing bound to the claim in the lane ledger. It is
  good work — the exit is the existing C1b roll with no new rule and no new constant, the warrant is
  DERIVED not picked (Ofgem CIM C4 internal switching above the entire fixed-term population's
  ceiling in six waves of six, giving a binding lower bound of 0.0449 conversions per SVT household
  per six months, which is a bound and is carried as one, with `SVT_INTERNAL_CONVERSION_RATE = None`
  and a named gap because no published series cuts internal switching by the tariff the respondent
  was on before the move), and the first draft was caught by PRINTING it: recursing into
  `build_renewal_schedule` arrives with `first_term = True`, the one condition that skips the roll,
  so every SVT-origin household would have converted at probability 1. After the change, 79 of 120
  SVT-origin households reach a fixed term and 41 never do, at 0.1671 per SVT-account-year against
  the 0.0449 floor. None of that is worth anything until it is committed, and finished work that
  never leaves the tree is worse than work not started, because the ledger says the item was drawn.
  The machine's two carried errors are both closed with evidence. `_back_referenced_start` now has
  a caller inside the DRAW: `background/delivery_lane.py:2889`, in `embargoed_until`, anchored on
  when the prose was written (896a286d8) — so the draw can now withhold an item naming a future
  instant instead of only explaining the burned window afterwards. And the error bar answers one
  question once: `error_bar.distinguishable_reconciliation.agree` is `true` on the live feed, the
  fixed 2.0 is gone from all three homes in favour of the family's own two-sided t on n-1 degrees of
  freedom (376499319), and the two keys that remain — `distinguishable_from_zero: true` and
  `selection_leg.sign_is_stateable: false` — are now DIFFERENT questions rather than opposite
  answers to one, the second adding the publishing conditions the first does not carry. What that
  publishing condition turned out to be is the sharpest thing found this stretch and it was found by
  re-measuring a drawn item's premise: `_floor_admission` paired the floor to the figure on
  `served_segments: ["resi","SME"]` with `served_segments_resolved_from: "curriculum"` — a constant
  every run this company has ever done declares — so the rule NAMED for the book could not separate
  any two runs, and it admitted an 18-seed spread drawn over a 164-account book as the error bar on
  a figure from a 154-account one, where `billing_accounts_settled_in_window` counts accounts that
  appeared in the settlement window and is distinct from `accounts_at_end_of_window` (54..55), the
  only one of five realised fields that elasticity re-draws actually move. The producer's own
  instruction not to pair on realised counts was true of one field and had been generalised to all
  five, throwing out the working discriminator with the broken one — this project's recurring shape
  exactly. The disjoint-range guard is landed and both legs are reachable from the feed's own
  artefacts. The measurement that closes it is in flight: twelve seeds at `18327d977` over the 09-18
  book, launched 16:12:55 BST, ETA 2026-09-19 08:20Z, writing to a `/var/tmp` extract and not to
  this repo — and my own focus item for reading it named 02:00 and the repo path, both wrong, which
  is the same habit as the SVT claim and is recorded below. Against the thesis: this stretch did not
  go backwards, but it did not go where I said it went. The honest reading is that the constraint on
  the method's reach is still unlocated — I published a world-side answer that is refuted, and the
  company-side candidate (`UPLIFTABLE_TARIFF_TYPES = {"fixed", "pass_through"}`, applied at
  `company/crm/customer_profitability.py:381` and `company/pricing/value_based_renewal.py:1317`,
  under which 2,490 of 2,824 term boundaries class `product_not_upliftable`, all SVT) has never been
  measured against a world in which those households DO reach annual decision points. Definitions
  beside the remaining quantities, which my oldest open error owes: staging flow is documents filed
  into the tracked root over 7 days against documents dispositioned out of it, 183 against 160, net
  +23, on a work queue of 115 with 9 BLOCKING findings; H41's headroom is map bytes remaining under
  a 409,600-byte ceiling, 401,318 used and 8,282 free, the ELEVENTH consecutive orientation at a
  figure I once estimated would be gone inside a day; and this checkout stands 3 ahead and 14 behind
  origin/main, which is not a quantity about the book but about the machine reading it.
