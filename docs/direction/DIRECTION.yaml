  - id: make-the-per-cell-weather-store-reproducible-then-wire-it
    what: >-
      Work §6 of
      `docs/staging/SEAT_RESULT_THE_ARCHIVE_BREADTH_PULL_IS_THE_REFUSED_DESIGN_AND_ITS_PER_CELL_SUCCESSOR_CANNOT_BE_REPRODUCED_2026-09-16.md`
      in its stated order, and DO NOT pull one archive per property — that design is refused in
      writing in `sim/weather_world.py` and the refusal reproduces at real inputs (4 refusing supply
      points, 2 distinct coordinates). In order: (1) fix `build_weather_world._write()` to emit
      `level_c`, `decomposition` and `regimes.json`, and make `build()` either call
      `extract_temperature` or stop shipping it as dead code — answer first where the on-disk
      store's SUMMER temperature came from, since HadUK daily is October–March only and the store is
      complete for twelve months, and the two docstrings disagree with each other; (2) re-derive the
      store from the fixed tool and DIFF it against the 7.9 MB on disk — equality is the exit
      condition and a difference is the finding, not a reason to overwrite; (3) pull wind, cloud and
      precipitation for the 18 of 156 cells that carry temperature only, because the fabric path
      reads cloud cover; (4) only then wire `sim/weather_world.py` into
      `simulation/weather_inputs.py` behind the refusal that now names its site. `tools/validate_weather_world.py`
      is cited by both modules and does not exist — a path in a comment is a reachability edge, so
      either write it or stop citing it.
    why: >-
      The thesis permits advantage only from INFERENCE, and per-customer demand inference reaches 4
      of 210 settled customers while 203 take their shape from the rescaled national profile. This
      store is the only thing in the tree that moves that number by an order of magnitude — 156
      cells over the full 2016–2025 window, already built, already complete — and the single reason
      it cannot be used is that no committed code regenerates it, which is the 09-07 unreproducible-
      artefact defect at 7.9 MB. Step 2 is what makes this landable at all; skipping to step 4
      publishes a book whose demand shape rests on bytes nobody can re-derive. Finished when
      `build_weather_world` re-derives the on-disk store and the diff is empty (or the difference is
      filed as a finding), and a fresh run artefact shows `fabric_physics` reaching customers the
      four C1–C4 coordinates do not contain.
  - id: the-publisher-now-loses-the-push-race-and-that-is-a-different-fault-from-the-reds
    what: >-
      Do NOT re-diagnose the 17 reds — another lane is landing that fix right now and the result is
      already written. The live fault is the next one: `.publish_gate_state.json`'s
      `liveness_surface_refusal` reads `cause: push_never_landed`, "the commit was created here and
