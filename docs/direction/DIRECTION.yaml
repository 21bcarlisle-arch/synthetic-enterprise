thesis_read: >-
  THE BASELINE QUESTION NOW HAS AN HONEST ANSWER, AND IT IS PARITY, NOT A WIN. The term probes were
  graded on all four paths (f746cd4f5). With each decision charged only the bad debt of its own term,
  the capped value rule minus the best flat price in hindsight is +341, -37, +79 and +40, at SNR 0.1 to
  1.3. All four pre-registered tests held. Every earlier "the choosing loses" turned out to be two
  instrument defects (3475058ef, ddfbc61f6), and the world gaps found on the way were fixed on
  published law and rates, not on these results. That is real progress on the thesis: the per-customer
  rule needs no hindsight to match the best flat price that hindsight could pick. But that comparator is
  biased toward flat, because it is chosen on the very rows it is scored on, and the thesis asks for a
  baseline a flat-rule supplier could actually have run. So whether inference BEATS average is still
  not established. Last stretch I put the ex-ante flat comparison in not_now until T1-T4 landed. They
  have landed, so it is promoted to focus item two. THE PREPAYMENT RULING IS NOW HELD BY MEASUREMENT AS
  WELL AS BY CONTROL. On the real book, the channel-blind price change (92b55f41a) kept the payment
  channel off 36 of 70 clean renewals. With B8 on, keeping the channel would have charged clean
  prepayment households up to GBP 37.50/MWh more. The director's ruling was not a formality. QEP, HALF
  RECOVERED, AND THE OTHER HALF FAILED ON MY OWN INSTRUCTION. The arms were re-taken from origin
  96517e68c, which contains ba320e2d2, and the world digest reproduced as cdba75ebb9197b33. The three-arm
  --level-arm leg declared an 11,200 MB peak, queued behind another lane's run, and FINISHED (artefact
  value_cycle_ab_s1_three_arm_20261004r.json in /var/tmp/se-qep-arms2). So last stretch's OOM row is
  corrected. The rebuilt handoff deletes and retries a refusal artefact, and STOPPED correctly on a
  missing artefact, so the refusal-read-as-exit row is corrected for this chain too. The floor then
  died in 8 seconds. tools/run_value_cycle_ab.noise_floor refuses fewer than two seeds by construction,
  and my focus item said to run the seeds one at a time. The worker followed the instruction exactly,
  and the instruction asked for an invocation the tool cannot run. The refuted switching artefact is
  still load-bearing, now since 2026-09-07. The fix is one launch away, and the launch is focus item
  one. THE STEER BIT. Three of four items were drawn. The landed_unbound rows were dispositioned as
  premise_spent with evidence (d06af26a5, 244c04249), so that item leaves focus. The head-red census is
  in flight: its first bisect died when a control in the extract rewrote a tracked file
  (site/data/dd_opening_arms.json), which dirtied the checkout, and a second sweep is running now. The
  plan-offer item was fourth and never drawn in a 3-hour stretch, so it carries. THE DIRECTOR'S
  OPERATING MODEL LANDED: CLAUDE.md, the concerns list, the weekly-rhythm lapse (f69d60ab5), and the
  startup-anchor page, which now refreshes on change, as he corrected at 04:46 (4aadc11bc). The one
  open concern is his (canon intent) and is carried below. MACHINE: 11 of 26 commits carried no work,
  three of them consecutive empty merges. The shared HEAD is 161 behind origin, up from 134, and a
  surgical_land --merge has been running on it for 55 minutes. The two local direction commits,
  543dcff6d and 7234966b2, are disposable: their content is superseded on origin.
