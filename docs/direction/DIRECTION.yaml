- id: m3-names-three-currencies-money-time-carbon
  raised: '2026-10-30'
  kind: canon_intent
  what: 'M3 names three currencies (money, time, carbon). Your 30 Oct steer asks if that is the whole
    set of needs energy products serve. Payment-method and fix choices say it is not: in Ofgem''s 2022
    survey, control is the top reason standard-credit payers give and budgeting the top reason prepayment
    payers give, and only 10-24% cite price.'
  proposal: 'Amend M3 (not a new rule): ''M3. Money, time and carbon, above a floor. Money, time and carbon,
    and the ways money is shaped. Money is two things, measured apart: cost (what is paid) and cash flow
    (when, and how much at once). Peace of mind is two things, measured apart: certainty (not being surprised)
    and control (deciding when money leaves). Time means household effort, in household minutes per kind
    of activity. Carbon is what customers have saved and could save in CO2. Each is measured in its own
    unit and never converted to pounds. Comfort and health are a floor, not a currency: no gain in any
    need justifies a breach.'' The fix premium stays booked as value moved until the note''s three-leg
    test (section 6.1) is run.'
  recommendation: I recommend amending M3 with the wording above rather than adding a new M-rule, because
    a separate rule would leave the three-currency wording standing beside it; the build waits for the
    correctness exit test, as your steer says.
  status: answered
  resolution: Yes (director, 31 Oct 08:54 GMT; docs/staging/advisor/done/DIRECTOR_RULING_YES_TO_THE_THREE_30_OCT_QUESTIONS_2026-10-31.md).
    M3 amended in DIRECTOR_CANON.md with the row's wording verbatim, as an amendment, not a new M-rule;
    CLAUDE.md's M3 quote and THE_MODEL_ON_A_PAGE.md's v4 quote updated; canon drift check 17 claims 0
    drifting, 84 served pages hold.
  evidence: docs/design/CUSTOMER_NEEDS_BEYOND_THREE_CURRENCIES.md (DISCOVER/FRAME, 10 GAPs named, none
    filled with a guess)
  resolved: '2026-11-02'
  no_action: the amendment is landed in the same commit; the build that follows waits for the correctness
    exit test and is sequenced in the roadmap the 30 Oct corpus steer owes
