- id: time-is-scored-in-minutes-not-converted-to-money
  raised: '2026-10-04'
  kind: vision
  what: The mission names three currencies, and time does not exist in the model. The C31 frame (70ea47ac5, docs/design/C31_TIME_AS_A_CURRENCY_DISCOVER_FRAME_2026-10-04.md,
    Q1) has to decide whether household time is scored in its own unit or converted to money at a value of time. Converting it would fold one
    of your three currencies into money. The only regulator pricing found (GSOP, GBP 30 or 15) prices failure events, not hours, and it is a transfer.
  proposal: 'Score time in its own unit: household minutes, per class (shopping, servicing, recovery, routine admin), never summed across classes
    and never converted to GBP. A GSOP payment stays a money transfer and is not a measure of time. This does not block L1, which counts events
    in minutes either way, so work carries on unless you rule otherwise.'
  status: answered
  resolution: 'Director, 2026-10-12, ''Agree all'' to the fourteen decisions in canon v4 section 15 (staged in e89a7728a; docs/staging/DIRECTOR_STEER_CANON_V4_ALIGNMENT_2026-10-12.md,
    step 4): approved (M3).'
- id: whether-per-customer-pricing-beats-a-flat
  raised: '2026-10-04'
  kind: strategy
  what: 'Whether per-customer pricing beats a flat price a supplier could have set in advance cannot be answered on one book: the four probe paths
    share their households, and their SNR ceiling is about 0.95 however often they are re-run. Only independent books separate it. Varying the
    book seed is EP17_varied_population_draw, which is your curriculum.'
  proposal: 'Authorise book seeds 61101-61112 for EP17 by recording docs/design/curriculum/varied_population_draw_activation.json in the shape
    of population_draw_activation.json. I would run 12 books at about 36 min and 5.1 GB each, 7.2 box-hours serial, after the QEP refit lands,
    and only after a 2.4 h re-take on the default book. Projected SNR is 1.8-2.4. If you decline, the result stands as: not separable on this
    book.'
  status: answered
  resolution: 'Director, 2026-10-10: "Yes to the seed-family runner: 40-founder books settling every win, four side by side on distinct seeds
    under the box budget ... This also answers my open request on independent books (EP17, seeds 61101-61112): authorised under this runner. Close
    that concern with this ruling." Recorded in docs/design/curriculum/varied_population_draw_activation.json.'
- id: no-atom-can-reach-l3-while-an
  raised: '2026-10-04'
  kind: canon_intent
  what: 'No atom can reach L3 while an Expert Hour counts reviewer independence as a finding against it: the blind-review tool records independence
    false on every pass by construction, and reserves external review for the few verdicts you choose. H45 (the queue chained to the map) has
    closed every other question its two blind passes raised -- edit back door, re-link, doubt route, trend -- and is held at L2 on that one alone.
    Its specific form: whether a queue item serves its atom is read by a tick of the same machine that files it, and nothing outside audits that
    read.'
  proposal: Rule that an Expert Hour whose only open disqualifying question is reviewer independence passes for L3, with the limit carried in
    the atom's simplification record, and that external review stays at your choosing for the highest-stakes verdicts. On that ruling I would
    record H45's move to L3 through the level gate. If you want H45 audited from outside instead, the read record (serves_by_hand on the harness
    page) is what you or a relayed model would sample. Meanwhile H45 parks so it stops being drawn for a question no build can answer.
  status: answered
  resolution: 'Director, 2026-10-12, ''Agree all'' to the fourteen decisions in canon v4 section 15 (staged in e89a7728a; docs/staging/DIRECTOR_STEER_CANON_V4_ALIGNMENT_2026-10-12.md,
