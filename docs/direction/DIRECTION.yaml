focus:
- id: the-hedge-volume-reads-only-what-the-company-holds
  what: 'Close the wall crossing in the hedge volume. simulation/run_phase2b._company_eac_estimate''s
    first-term fallback multiplies the declared EAC by household_demand_register.eac_multiplier_for_date
    (the household''s own EV, solar and heat-pump assets). The gas leg multiplies the AQ by gas_eac_multiplier_for_date,
    and the trailing sum reads the settled fold''s true kWh on months the company billed as estimates.
    The evidence is section 2 of docs/staging/SEAT_FINDING_SEVERAL_CONSUMPTION_FORECASTS_A_WALL_LEAK_IN_HEDGE_VOLUME_AND_THE_CAPITAL_TARGET_IS_115_2026-10-11.md
    and finding 4 of docs/staging/SEAT_FINDING_THE_COMPANY_HOLDS_SIX_CONSUMPTION_FORECASTS_AND_THE_WORLD_IS_TOO_STEADY_TO_RANK_THEM_2026-10-11.md.
    Route the volume through a call in company/interfaces/sim_interface.py that returns only what a supplier
    holds: actual reads annualised, the registry EAC or AQ before a year exists, and the trailing-12-month
    forecast the finding measured best. Also correct demand_estimation_log.error_pct, which is published
    as demand_estimation_annual. Write the prediction for the hedge-volume error and the run''s hedge
    cost first, then measure before and after on one seed. Add a control that reds when the volume reads
    a world multiplier or settled kWh. This is the queued continuation hedge-volume-reads-settled-kwh-on-estimated-months.
    Run python3 -m background.seat_work_in_hand first, and if a worker holds that id, leave it to them.'
  why: The thesis allows an advantage only from inference. The hedge volume has been reading the world's
    own household multipliers and overshooting by 8-12% on year 1 and gas, so every hedge-cost figure
    so far rests partly on access. Done means the volume reads only supplier observables on origin, a
    control reds on a world-side read, and the before/after on one seed sits beside the prediction in
    the finding.
  lane: E_finance_treasury
  side: supplier
  written_at: 1791707447.153
