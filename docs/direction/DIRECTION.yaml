focus:
  - id: land-the-competitive-pressure-hunks-so-the-channel-is-live-in-head
    what: >-
      `simulation/run_phase2b.py` is `MM` and its working diff carries TWO lanes: the leap-year call
      site at `@@ -767` (`from simulation.customer_events import twelve_month_window_open`, feeding
      `_company_eac_estimate`) belongs to the customer-events lane, and the import at `@@ -28`, the
      `arm_loss_reporting()` call at `@@ -1798` and the churn-branch booking at `@@ -2819` are the
      competitive-pressure channel. Land them as TWO commits in that order, each attributable.
      First: `simulation/customer_events.py`'s `twelve_month_window_open` plus that one call-site
      hunk, with a control that fails on a 29 February term start — that fix, uncommitted since
      19:02 tonight and in nobody's clone, is what makes
      `tests/simulation/test_run_phase2b_event_log.py::test_sim_interface_none_still_works` pass, and
      it is presently blocking every commit that touches `run_phase2b.py`. Second: the three pressure
      hunks. Use `python3 -m tools.surgical_land` for both — it gates the tree the commit would
      create, which is the only tree that matters here. Then re-run
      `tools._ladder_chase_arm on|off` and `tools.compare_chase_belief` FROM THE LANDED TREE and
      confirm the finding's table reproduces; if it does not, the finding's numbers are corrected
      beside themselves, not over them. Then sweep the pattern: grep every call site of
      `if sim_interface is not None` — `notify_acquisition` and `notify_retention_attempt` sit
      behind the same guard — and for each say whether the observable is silently absent in every
      `run_phase4c` run, in a finding.
    why: >-
      The channel is the thesis and it is inert. `company/crm/competitive_pressure.py` is at HEAD,
      its consumers read it, and it returns the prior unchanged at every call because the site that
      fills its numerator is not committed — so a clone of this repository contains a company whose
      competitive belief is a hardcoded year table, exactly as it was this morning, while the record
      says otherwise. That is the record outrunning the code on the single most thesis-relevant
      capability here, and it stays that way until somebody lands another lane's four-hour-old fix as
      its own attributable commit, which is a decision and not a build. The guard sweep is second
      because the dead wire proved that an unplumbed seam reads as a quiet market: absence of an
      observation channel read as observation of absence, in the flattering direction, past sixteen
      green tests. Done means `git show HEAD:simulation/run_phase2b.py` contains `arm_loss_reporting`,
      the paired run reproduces from a clean export of HEAD, and every other observable behind that
      guard has been checked and its state written down.
  - id: re-run-the-chase-pair-on-the-founder-book-and-record-b10-or-refuse-it-with-numbers
    what: >-
      The derived channel responded at one rung in four, and the finding states the mechanism rather
      than inferring it: the ledger reads years strictly earlier than the renewal being priced, the
      extra departures in three of four rungs fell in 2019 — the last year of the window — and a
      departure only becomes evidence if something is priced after it. The founder book is now at
      HEAD (`3d83edffb`, `docs/design/FOUNDER_BOOK.yaml`, 80 accounts seeded into 2016). Re-run the
      same controlled pair on that deeper book and on a window whose final year is not the only place
      the count can cross — same tree, identical seeds, one declared parameter differing,
      `chase_per_quarter` asserted before each arm as `tools/_ladder_chase_arm.py` already does — and
      report `max |ON − OFF|` per rung against the world's own move, with the realised loss counts per
      arm per year printed beside it so the reader can see where evidence was available and where it
      was wasted. Then either RECORD B10's level move with the measured belief-vs-truth gap, or file
      the fourth refusal carrying its numbers and naming what is still missing.
    why: >-
      This is the level move and it is now ten minutes of run plus a judgement. The structural half
      of B10's L3 leg is discharged — `COMPETITOR_FIELD_FRAME` §5 component 2 returns a number for
      the first time instead of "no response exists" — and the third refusal was right, because one
      crossing of an integer count on a 16-decision intersection is an observation and not a curve.
      The finding says plainly what would settle it and says there is no design question left, only
      an `n` question, and the founder book landing is exactly the thing that changes `n`. This is
      also the answer to the shape the last prediction got wrong: the effect is not
      small-and-everywhere but absent-or-substantial, so the fix is more chances for the count to
      cross, not more signal. Done means B10 moves and the move is RECORDED with the gap, or the
      refusal names a specific missing thing that is not "more data".
  - id: land-or-delete-the-untracked-settlement-clocks-pair
    what: >-
      `simulation/settlement_clocks.py` and `tests/simulation/test_settlement_clocks.py` are
      UNTRACKED as of 12:02 today, while `tools/run_annual_report.py:69` and
      `simulation/run_phase4c_on_phase2b.py:96` sit modified-unstaged carrying
      `from simulation.settlement_clocks import …`. Decide it in one move: either commit supplier,
      test and both consumers as a single pathspec, or revert the two import hunks and delete the
      untracked pair. `git status` showing neither the pair nor the orphaned imports is the whole
      exit condition.
    why: >-
      Third from the bottom for six consecutive directions and never done, which is evidence about
      my ordering rather than about the work — it is minutes, and naming it last again is deciding
      it never happens. The hazard also got worse rather than better: while the pair was staged,
      supplier and consumers moved together; untracked, any lane committing those two consumers by
      pathspec — the normal and correct way to commit in this tree — ships an import of a module that
      exists in nobody's clone, and takes the annual report down for everyone. It sits above the
      publishing work because it can break another lane's commit at any moment and because it costs
      almost nothing to remove.
  - id: put-the-bound-on-the-rendered-capabilities-page
    what: >-
      Before starting this, launch item five's runs in the background so the two proceed together.
      Then: `site/capabilities/index.html` renders `arms-split`, `arms-errorbar` and the Provisional
      pill and contains no sentence bounding the comparison. Add to the door's render and to the live
      surface that this compares two internal policies in a market that could not react to either.
      Assert it the way `site/test_the_baseline_comparison_reaches_the_reader.py` already does —
      drive the real door through `site/_live_harness.mjs` and read the rendered DOM, never the
      generator output and never the feed — and carry a mutation that deletes the sentence and reds
      the test, with the existing unavailable-feed null rung staying green through it. This is
      `SITE13_the_baseline_comparison_carries_its_bound`, file scope `site/capabilities/`.
    why: >-
      Sixth consecutive direction naming it and it has never been rendered. The director corrected
      this claim himself in `DIRECTOR_GUIDANCE_THE_WORLD_MUST_PRESS`; a caveat is retractable by
      construction, so it is mine to land and not his to approve, and it is the honesty half of
      publishing the comparison at all — which was right to do. Item two makes the omission worse by
      giving the page a competitor story to tell, so this is the last orientation where it can
      reasonably slide. It is placed here because it is minutes of work that fits inside the wait for
      item five's run, not because it ranks below it. Done means the sentence renders on the fetched
      live page and a control fails if it stops.
  - id: re-run-the-arms-and-the-noise-floor-on-the-current-basis-and-grade-the-prediction
    what: >-
      `docs/observability/value_cycle_ab_s1_three_arm.json` still carries `generated_at`
      2026-08-28T14:08:48Z and `value_cycle_ab_s1_three_arm_sourced.json` does not exist — the run
      the preregistration says is running produced no artefact. Re-launch
      `python3 -m tools.run_value_cycle_ab --level-arm` to the new path, never over the published
      artefact, and in the same session re-run the noise floor
      (`value_cycle_ab_s1_noise_floor.json`, `generated_at` 2026-08-27T23:32:17Z, nine passes
      measured beside the superseded `settled-provisioned` panel) so both legs of what the page
      publishes stand on one clock. Then: diff, and if the arms moved, promote, restate
      `/capabilities/` and re-derive `0850eadcd`'s 4.4%/78.0% attribution split; if they did not,
      say on the page in terms that sourcing repaired the company's P&L by £111,576 and moved the
      comparison by nothing, because acquisition cost was never one of `GROSS_TO_NET_LINES`. Write
      the outcome BESIDE the prediction in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_SOURCED_COST_RERUN_MUST_SHOW_2026-08-28.md`,
      never over it. Read no delta smaller than the old floor's £4,402 sd as an effect, and once the
      floor is re-measured, use the new one.
    why: >-
      The thesis says the baseline comparison is the whole point — "or 'it performed well' means
      nothing" — and the page currently publishes that comparison denominated in constants the tree
      deleted, beside an error bar whose 25.2 spread-to-estimate ratio is a provisioned-clock spread
      divided by a realised-clock estimate. Two figures, each correct in its own world, whose ratio
      is not a quantity. The `clock_caveat` discloses it, which is why this is fifth and not first,
      but a disclosed hole is still a hole and the re-measurement is the repair. The two runs are
      folded into one item because they are the same instrument and running them separately pays the
      wall-clock twice. A preregistration with no answer beside it is the one artefact this project
      cannot leave lying around: its entire value is that it was written before the result was known,
      and that value decays the moment somebody could have looked. Done means both artefacts carry
      tonight's clock, the prediction is graded in its own file with the correction beside it, and a
      reader of `/capabilities/` is told which cost basis the figures stand on.
not_now:
