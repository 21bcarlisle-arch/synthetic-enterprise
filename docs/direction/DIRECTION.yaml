      graded in the record next to itself, whichever way it falls.

  - id: one-page-answers-would-a-bigger-book-help-in-both-directions
    what: >-
      Re-read from the live feed before changing anything, then fix it.
      `site/data/value_arms.json` still publishes `floor_decomposition.
      share_at_which_a_bigger_book_could_resolve_it` as -4.5507, grades it `share_is_decisive: true`
      with a margin of 5.5507 over a bar of 0.15, and reports `priced_decisions_needed: 19` on a
      book that already priced 104 - so `tools/generate_value_arms_data.py` takes the branch telling
      the reader a larger settled book is what resolves the spread. Make the producer REFUSE a share
      outside [0, 1] rather than grading it, and make it say plainly that a partition whose
      `rest_of_book_sd_gbp` is exactly 0.0 and whose `priced_share_of_variance` is exactly 1.0 has
