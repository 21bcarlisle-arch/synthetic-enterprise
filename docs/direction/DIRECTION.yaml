thesis_read: 'Level, not backwards. The machine got safer, and the thesis comparison is half run and not yet graded.
  9 commits, all carrying work, 5 substantive. The brief splits them 1 supplier, 1 world, 7 other; read by subject,
  the supplier share is larger, because two of the ''other'' commits are D48''s and the retention-netting prereg''s.
  No level moved. Every one of the previous focus''s five items was drawn, and four finished. The per-customer worktree
  is locked (1ac35d918). The meter exchange landed behind a switch that is off (a60376f88). The retention-netting
  prereg landed (c0b75a932), and its arm pair has a live driver. A queued long job now waits in a unit of its own
  (26a030c8f), which corrects the vanished-arms row. D48 was drawn and built nothing (0f8048366), correctly, because
  its L3 waits on a run and not on code. WHAT IT MEANS. (1) The test of the thesis is running, not graded. The current
  arm finished in 2h26m (rc 0), all_on is 1h34m in, and flat follows, so the grade lands near 14:40Z. Its continuation
  is embargoed to exactly then, which is why item 3 makes it wait for flat.rc. That book is a diagnostic only; the
  real grade still needs the director''s six EP17 seeds. (2) Compute, not code, is now the supplier''s bottleneck.
  Four arm sets queue one after another until about 01:00Z tomorrow: per-customer, scopex (the opex credit that
  decides whether the -GBP 3.91 renewal figure is real), baddebt (the BLOCKING crisis bad-debt control), and retention
  netting. The sim-runner defers to all of them, so D48''s held-bill run cannot happen today. Item 1 makes the netting
  pair''s off arm that run, for free. Item 2 is supplier work that needs no compute: E6''s early warning, landed
  off. (3) The seat''s own error this stretch: it ordered D48''s Expert Hour before the review''s inputs existed.
  That is recorded and corrected. The publisher has said FAILING for 50h, and the publish is held to 26 Oct.'
