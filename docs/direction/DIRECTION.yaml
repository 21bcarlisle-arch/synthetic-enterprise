    why: >-
      Still the right general mechanism, still losing to its own instances, and H45 was drawn by the
      ordinary lane anyway so it is not idle. This stretch produced yet another instance rather than
      an argument for the general form: the derived-pressure channel exists because one specific
      lookup was chased to its source. Building the chain before its third instance is repaired
