- id: the-shared-checkout-actually-reaches-origin
  lane: H_harness
  side: other
  what: The reconciler fix (b0b05661f) is on origin, but the shared checkout is 42 behind and has not
    fast-forwarded since it landed at 15:31Z. Read reconcile-watch's log and background/origin_reconcile.py's
    last verdicts since 15:31Z, and name, PATH BY PATH, what refuses the advance. For each path, say whether
    it is a byte-identical twin of origin (carry it), a live lane's bytes (name the lane and its pid or
    claim), or orphaned bytes with no lane (record them in the class register and say so). Note that the
    shared tree's working copy carries edits to background/bounded_landing.py, background/origin_reconcile.py,
    company/finance/accounting_close.py and company/finance/double_entry.py, and that some of these may
    be MSC's or the reconciler's own copies. Never stash, check out a path or reset. If a code defect
    stops the advance, fix it with a test and land it. If only a lane's bytes stop it, do not move them;
    file the finding naming them.
  why: Every daemon, including the one that launches landings, is running code that origin replaced 6
    commits ago. That includes the one-gate flock and the in-job retry, so landings from the shared tree
    still race and gate side by side. The previous item for this was retired on its LANDING, not its effect,
    and that is this stretch's error. Done means HEAD equals origin/main at one reading and the brief's
    units-lacking-origin list is empty. If that cannot be done, a filed finding names the bytes that block
    it and whose they are.
  written_at: 1795458495.263
