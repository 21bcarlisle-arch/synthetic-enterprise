    a supplier in 2016-2022 faced no such target. The code also carries GBP 130 per account where the decision set GBP 115
    (GBP 130 was the April 2023 consultation figure). saas/growth_mandate.py bounds the campaign's quote budget by capital
    per account, so both the figure and its start date shape how fast the book can grow. The figure is a factual correction
