thesis_read: 'Two supplier commits, no world commits and three other commits this stretch (2/0/3), plus one supplier merge
  after the brief. Supplier work moved forward on honesty, not on the thesis comparison. The director''s own save condition
  is green again at origin: the stayers fix was preserved, re-applied as cc258be0a with the control''s lines 76 and 95 green,
  and merged as 4492d17bd. The roll-rate provision is on origin, shipped off (870f3e78a). The crisis bad-debt control now
  actually runs, where it had skipped silently for four days. Its window was corrected to 2022-23 after the anchor it quoted
  turned out to be a 2025 figure (c0e383908). The provision now returns None with a reason, not 0.00, on a book that has not
  seen the tail. Those are three corrections to what the company may honestly claim. None of them is evidence that a per-customer
  view beats the flat baseline. At the one live per-customer retention lever, the save has been offered 23 times and taken
  0 times. The tiers-against-flat comparison is no evidence either way (9ab9b7959, and seed 61112 grades the same, cc1a2e637).
  The trace in flight finds the published P&L bad-debt line is a flat 2% of every bill. So the published loss is a flat rule
  too, not the company''s belief about each customer. Against the thesis the project is standing still. It is not going backwards,
  and two of last stretch''s three red supplier blockers are gone. The held-estimate fix, billing accuracy and the director''s
  first priority, was undrawn for a second stretch, and four days remain before the 19th''s publish, so it leads. Last focus:
  five named, two drawn, and both landed. The shared-HEAD item has now gone five stretches undrawn. I treat that as my steer
  drifting and have cut it to the step that removes the loss risk. The stayers-control and crisis-skip rows are graded corrected
  on that evidence. The new anchor error is recorded corrected beside c0e383908.'
