    to 0.5 on the standing policies. It is still None on origin 9e7cf29d4. 0.5 is the end of [0.5, 3]
    that claims least (F11). Keep 3.0 as the other published bound, through tools.d48_spar_blend_counterfactual
    --ends on each new book. Before landing, pre-register in the D48 prereg record what the first book
    built with the switch on should show. 617ec5faa9 read 0.276 to 0.361 against the hold''s 0.388 on
