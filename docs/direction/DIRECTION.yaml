- id: a-continuation-held-on-a-file-stays-live-until-the-file-exists
  lane: H_harness
  side: other
  what: 'background/seat_continuation.py::_window_opens gives a dated embargo its own window but gives
    a file hold ("DO NOT DRAW BEFORE <path> EXISTS", which delivery_lane.embargoed_until reads only without
    dated_only) none. So live() drops it STALE_AFTER_SECONDS (6 h) after written_at, whether or not the
    file exists. s12g-rankq-is-graded-when-it-ends (written about 03:26Z 24 Nov, held on /var/tmp/vtn-driver/grade_rankq.out)
    has already gone: it is in expired(), drawn_at 0. b11-m7-grade-the-six-fresh-books-readout and land10-outcome-is-read-and-msc-lands-or-is-re-cut
    go at about 21:54Z and 22:22Z tonight. FIRST, before any code: re-stamp those three rows into the
    live queue with their text unchanged, so that none expires while this is built. Then make a file-held
    row''s window open when its file appears. Bound it with an outer limit you can source from the store''s
    own history, or a named one, and make expired() report "held on <path>, never appeared" as its own
    reason. Print live() and expired() on the real store before and after. Test it: a row written 7 h
    ago, held on an absent file, is live; it is drawable once the file exists; and a dated row is unchanged.
    Show that reverting the fix reds the test.'
  why: rankq is the thesis's live test, the one run that says whether the per-customer arm beats the flat-rules
    twin, and its reader has silently fallen off the queue. The same defect drops B11 M7's grade and the
    MSC landing's reader tonight. Done means all three rows are in live() at this orientation's successor,
    the fix is on origin with its mutation shown, and expired() names a file hold that never fired.
  written_at: 1795544909.764
- id: land10-gates-before-b11m7s-first-wave-not-beside-it
  lane: E_finance_treasury
  side: supplier
  what: 'Two armed jobs fire on the SAME artefact, the first docs/reports/run_output_*.json written after
    rankq ends. They are land10 (/var/tmp/se-msc-keep/land10.sh, the MSC landing, a full pre-commit gate)
    and b11m7-watch (/var/tmp/box-plan/b11m7/arm.sh step 3, two waves of three 80-minute seed_family runs).
    land10''s busy() checks only the rankq unit and "-m tools[.]run_annual_report", so it will not see
    b11m7''s waves. Read both scripts and the launch register, and decide the order (my recommendation:
    land10 gates first, because one gate is short and MSC has failed nine times on co-residence and races).
    Make the second one wait on the first''s artefact: b11m7 waits for /var/tmp/se-msc-land10-ended.txt
    with a bound, or land10 waits for b11m7, whichever you choose. Make land10''s busy() see seed_family
    runs. Do not stop or re-arm either unit without recording how to reverse it, and keep the pinned tree
    and pinned sha unchanged. Dry-run the changed wait on a fake artefact in /tmp. Record the post-rankq
    box order (rankq, book, land10 gate, b11m7 waves, census) in one place a later tick can read.'
  why: MSC books the market stabilisation charge in the supplier's ledger, and B11 M7 is the held-back
    forward value grade. Started together, they reproduce the 3600 s gate timeout and can corrupt the
    six books' timing. Done means exactly one of the two keys on the other's artefact, land10 sees the
    waves, and the order is written down before rankq ends.
  written_at: 1795544909.764
- id: the-default-off-supplier-switches-flip-in-a-chosen-order
  lane: B_commercial
  side: supplier
  what: 'Census every default-off supplier decision switch now built and waiting, with its pre-registration
    on origin. At least: EP1_DATED_DISCOUNT_RATE_IN_THE_STANDING_POLICY (63f7faeba); B8''s holdout (SEAT_PREREG_B8_THE_HOLDOUT_SWITCHED_ON_IN_THE_STANDING_POLICY_2026-11-23);
    the first term at its quote and the first-term cap hold deleted (both SEAT_PREREG_THE_FIRST_TERM_*_2026-11-24);
    the ending-term renewal belief (SEAT_PREREG_THE_ENDING_TERM_BELIEF_ON_THE_COMING_BOOK_2026-11-22,
    the fix for the AUC 0.333 row); the expected-tenure value; SMART_METER_EXCHANGE for D48 (SEAT_PREREG_THE_SMART_METER_EXCHANGE_SWITCH_FOR_D48_2026-11-15);
    and any others company/policy/decision_policy.py holds off. For each, quote its "one change per book"
    clause, and say what it grades and on which book. Then answer the one question the queue turns on:
    is that clause about ATTRIBUTION, so that separate arms on the same seeds, each with one switch against
    the same standing baseline, satisfy it, or does it need a standing-policy book? Choose the flip order
    by which switch the evidence says most narrows the arm-versus-twin gap, with e56d8b8858''s s.12g branches
    as the first input, and write it as one record in docs/staging/records/. Make the continuation queue
    match it. Flip nothing.'
  why: About six pre-registered supplier levers each claim "the next book", books take 13+ hours, and
    the last was built 99 hours ago, so the order is being set by whichever continuation is drawn first
    rather than by value. That is the priority order's "levers in merit order", and it decides how fast
    the supplier can test whether it beats the baseline. Done means the record is on origin with every
    switch, its grading book or arm, and the order, and the live continuation queue carries them in that
    order.
