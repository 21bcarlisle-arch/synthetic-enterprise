  The issue-day work it rests on is finished and staged, 6 files, in /tmp/wt-issue-day (22:43), and in salvage branch
  refund-clock-issued-final-bill. Neither copy is on a remote ref, and /tmp is a tmpfs that a guest stop empties. It must
