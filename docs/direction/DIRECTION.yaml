thesis_read: >-
  **I found out why rank one did not get done, and it was my defect, not the worker's.** The
  lane-0 executor runs in `/var/tmp/se-seat-executor` — `git worktree list` shows it as a linked
  worktree at a detached `017589785`, and a linked worktree has **its own index**. My rank-one
  instruction opened by quoting `git status --porcelain` of the main tree and told the worker to
  land what was staged there. That payload is not visible from the executor's worktree at all. The
  tick ran the item for seventeen minutes at 08:37, discharged, exited zero, and landed nothing,
  because the thing it was told to land does not exist where it was standing. **A focus item whose
  subject is the main worktree's uncommitted index cannot be handed to lane 0.** That is a fact
  about the machine I did not know when I wrote the last direction and it invalidates the shape of
  the instruction, not the priority.
  **The steer detector is wrong for the third consecutive stretch, and this time it is provable
  from a string match.** `previous_focus_drawn` reports `drawn: []`;
  `docs/observability/seat-executor-log.md` contains `RUNNING the-830-red-was-diagnosed-and-never-re-measured`
  at **09:35** and again at **10:36**, character-for-character the id in the last focus list. Lane 0
  is drawing focus items. It is discharging them rc=0 whether or not they delivered.
  **What actually moved.** Four substantive commits, and two of them are the director's own asks
  discharged: the conflict door (`908726d24`) now lets a resolution through the front door and the
  hole he named in the wall is closed, and the raw account export (`145d48345`) is the first leg of
  the bill-validation brief, with a refusal that rejects a derived field **by its unit**. The census
  bound was found fixed *below* the run it had just measured — `SUITE_TIMEOUT_SECONDS` was 3300
  against an observed 3537 s — and raised to 7200 with the unit at 7500 (`1bfed77ff`). All real
  work. None of it was rank one.
  **What did not move, and it is the same thing as last stretch.** `annual_consumption_estimate.py`
  — this company's first genuine per-customer inference organ — is in **no commit anywhere**
  (`git log --all` on the path returns nothing) and has now sat staged for roughly four hours,
  beside a `0 -> 1` level move in the shared `docs/design/maturity_map.yaml` and beside
  `background/head_red_baseline.py`, also new, also unlanded. `HEAD...origin/main` is `0 0`. The
  830-red still has exactly **one** observation, at 04:30 on `ec2e0b1a4`, and that row carries
  `"passed": null`, which the register's own `_record_observation` is written to refuse — so the
  only measurement we hold was not produced by a completed run. And publishing has been refused for
  over four hours; the gate names eight blocking tests, I ran all eight at HEAD this orientation and
  **all eight pass**, so the doorbell is dispatching workers at a set that has already cleared.
  **Against the thesis: inference is built and invisible, fidelity gained a real checking organ, and
  delivery went backwards for the second stretch running.** The advantage-from-inference side has
  one organ and it reaches nothing. The baseline-to-beat is still unjudgeable. The bottleneck is not
  thinking and it is not priority — it is that finished work is not becoming landed work, and the
  one instruction I wrote to fix that could not be executed by the machine I handed it to.
