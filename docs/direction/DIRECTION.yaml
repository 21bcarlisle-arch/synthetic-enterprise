  a1eee4d92 (S1). It got there because the stretch's three substantive commits were publish-wedge fixes:
  bbc9c1a8e (the renewal dice count per calling module), 214241ed8 (a full sha written into the ledger checkout's
  HEAD) and 44bf4cd13 (the Channel F re-freeze). The 19:28 merge (0f1057120) levelled the checkout, so HEAD now
  carries fcd2facdc and is 1 ahead and 0 behind origin. The re-driven publisher (pid 4171222) graded the book with
  that code. That corrects two machine rows. But the verification exists only in this working tree. Its provenance
  commit and 44bf4cd13 are not on origin yet, so the book is still owed until it reaches origin. The steer did not
  bite for a second stretch: 0 of 4 focus items were drawn, and no Lane 0 or atom draw happened at all. The cause
  this time looks different. One worker tick (pid 3899464) has been running for 1h48m on the publish wedge, rather
  than the queue starving focus. I cannot yet say which explanation holds, and the next stretch is the test. The
  commit split was 0 supplier, 0 world and 13 other. Read honestly, it was all publish plumbing and parks, none of
  it supplier decisions. The verified book is what converts that into supplier results. It unparks the BLOCKING
  billing findings and S1's R1-R5 grade, which is why both lead this focus.
