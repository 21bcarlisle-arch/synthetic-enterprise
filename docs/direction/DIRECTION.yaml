  - id: the-direct-debit-is-set-from-the-first-bill-and-nothing-estimates-what-it-should-be
    what: >-
      **Give the direct debit an estimate to be set from. Sixth orientation, every stated blocker
      cleared, still verified unchanged this morning — so this time it is first, and first is the
      only rank that gets worked.**

      The director's correction, 2026-09-01, verbatim: *"There's no such thing as a half-month direct
      debit — an annualised plan divides estimated annual cost by twelve whatever the start date. The
      real defect is that the DD is only as good as the estimated annual consumption behind it: when
      that estimate is wrong the account drifts into credit or debit, and the correction arrives
      later as a change the customer didn't expect."*

      Measured at HEAD, this orientation, not recalled:
      `company/billing/dd_review_runner.py:155` still reads
      `standing_dd = seq[0][1]  # initial estimate = first issued bill`, and
      `grep -rn annual_consumption_kwh company/billing/ saas/` still returns **only**
      `company/billing/exit_fee.py` and `company/billing/renewal_engine.py`. There is no estimated
      annual consumption anywhere in the direct-debit path. Definition A of bill shock — *the change
      in the amount COLLECTED, plus the balance the household is carrying* — has nothing to compute
      from, while the site and the annual report now publish, correctly, that the DD household's
      shock is **not** their bill. We publish that the figure is not the thing, and we have nothing
      that says what the thing is.

      **Knowledge first, and this is the £150 shape if you skip it.** `docs/institutional/knowledge_map.md`
      and `docs/domain_artefact_library/` return **nothing** for the SLC 27B review duty or for annual
      consumption estimation — I grepped both. So this starts as research, not as a build: what does a
      real supplier actually hold at registration from which it sets a first monthly amount, and what
      does the review duty require of it afterwards? Establish it from the published record and file
      it in the knowledge map. **If the published record does not establish the method, that is the
      finding, and the code carries an honest `None` with a named reason rather than a number picked
      because a number was needed.**

      **The epistemic wall decides the shape.** The estimate must be built only from what a supplier
      holds — what is handed over at registration, what the customer declares, what has been metered
      since — and never from the household's ground-truth annual usage. `company/interfaces/sim_interface.py`
      is the seam; ask the wall question of every line. Reuse before you mint: `annual_consumption_kwh`
      already has two callers and `simulation/dd_balance_book.py` already models the cash physics —
      `tools/write_time_gate.py --explain` before any new module, and a REUSE block in the message.

      This is the maturity-map atom **`D_opening_dd_seasonal_sizing`** (level 0, `loop_stage: build`,
      `blocked_on: null`, file scope `simulation/dd_balance_book.py`, `company/billing`,
      `docs/market_research`), whose own `real_world_twin` is exactly this defect. **It is keyed here
      as a lane-0 instruction on purpose**: the ordinary draw has not reached it in six orientations
      and biasing that draw again would be doing the same thing a seventh time. Record the level move
      under the atom when it lands — recorded, never authorised.

      **Pathspec:** `company/billing/`, `simulation/dd_balance_book.py`, `saas/`,
      `docs/market_research/`, `docs/institutional/knowledge_map.md`, `tests/`, and the finding and
      pre-registration documents. Pre-register before any run and before reading its output.
    why: >-
      **Because it is the mission's own sentence and it has lost the rank fight five times.** *Saving
      them money, time and carbon* — a household whose direct debit is set from an accident of when
      its first bill fell drifts into credit or debit and meets a correction it did not expect, and
      that is the harm the company exists to remove. It is also the **only** item on this list on the
      value-CREATION side; everything below it is a precondition or a control. And it is the
      director's own correction — the third side of knowledge, the practitioner telling us a frame
      was wrong — which makes deferring it a seventh time a failure of this seat and not of the
      queue. **Done means:** an estimated annual consumption exists in the DD path, sourced and with
      its origin declared, or an honest refusal naming what the published record does not establish;
      the first-bill artefact at `:155` gone; definition A either computed and published with its n
      and the bound its sample earns, or refused with that reason **on the surface, not in a
      footnote**; a control that goes red if the standing DD is ever set from the first issued bill
      again, mutation-proven under `python3 -B`; the knowledge map carrying what was established and
      what was not; and the level recorded against `D_opening_dd_seasonal_sizing`.
  - id: no-capture-can-judge-the-live-anchor-block-and-the-module-primes-its-reader-backwards
    what: >-
      **Two things, and the cheap one is hazardous so do it first.**

      **(a) Correct the backwards prime. It is live and it points the next repair the wrong way.**
      `docs/staging/WORKER_FINDING_NO_CAPTURE_ON_DISK_CAN_JUDGE_THE_LIVE_ANCHOR_BLOCK_AND_THE_RENEWAL_ROUTE_OVERSHOOTS_2026-09-02.md`
      measured the readable renewal route at **six years ABOVE the published band and one below** —
      2020 is 15.9pp **over**, not short. `simulation/departure_level_anchor.py` still says *"the
      world still ran 3.45x below the published GB domestic switching record"* (`:8`), *"the book goes
      from losing 4.50% per renewal to losing the record's 15.50% … 3.4x more revenue at risk"*
      (`:31`) and *"fails toward the record rather than toward the 3.45x-short world"* (`:190`). The
      last direction repeated that framing verbatim. A reader meeting a bare `-15.90pp` in that frame
      reads *15.9pp short* and, following the marker's own discharge instruction, moves **six of
      seven anchors the wrong way**. Correct all three sites to carry the direction, and say which
      population each claim is about — the whole-book union over ACCOUNTS versus the mean over
      renewal DECISIONS. **A disclosure landed on the `xfail` reason only, in the working tree, and
      it belongs to another lane** (see item three) — do not assume the docstring got it too.

      **(b) Run the re-capture, because it is the only thing that discharges the whole-book leg.**
      Measured across every capture on disk from a clean `git archive HEAD` stem: `c2_departure_factors.json`
      matches the live block on **7/7** fitted years and has **0** SVT sibling rows; `ladder_churn_factors.json`
      has **1266** sibling rows and matches on **0/7**. The fit's input and the fit's judge are one
      step out of phase, permanently, until a capture runs **under HEAD's seven-year block WITH its
      SVT sibling**. Produce that capture, then discharge
      `test_the_whole_book_departure_level_is_inside_the_published_band` on it — or state in writing,
      on a surface a reader meets, why it still cannot be produced. **"We cannot tell" is a result
      and it is the current honest answer; replacing it with a green one requires the capture, not an
      argument.**

      **What must not be done, each named because the finding measured why.** Do not widen the band.
      Do not re-key either leg to today's readings; both stay strict `xfail` and both must break
      loudly on the day they are genuinely fixed. Do not clamp, interpolate or borrow 2022. **Do not
      lower the block to close the renewal leg's overshoot** — that leg reads a mean over decisions,
      the block is fitted on a mean over accounts, and the overshoot is a population mismatch rather
      than a miscalibration; lowering it fits the world to the shoppers, which is the exact defect
      the whole-book union was built to remove.

      **Method.** Check free space before you start — `/tmp` filled to zero during a recent
      orientation and silently broke tooling. Long runs under `systemd-run --user --unit=<name>`;
      wait with `tools/wait_for.py` naming its subject and carrying a deadline, never a hand-rolled
      `pgrep`. **File a pre-registration predicting the MOVE before the run and before reading any of
      its output**, and grade every clause beside its filed text — the last worker's refuted
      prediction is the most valuable thing this stretch produced.

      **Pathspec:** `simulation/departure_level_anchor.py`, `tools/population_anchor.py`,
      `tests/simulation/`, `tests/architecture/test_switching_rate_commons.py`, the capture artefact,
      and the finding and pre-registration documents.
    why: >-
      **Because the thesis says there must be a baseline to beat, and right now we cannot read it.**
      The level anchor is the external, published, decided-blind quantity that makes the book's
      departures a fact the company must beat rather than a dial it sets; until a capture exists that
      can judge it, *"the world can defeat the company"* is a claim and not a measurement. It ranks
      second rather than first only because its honest verdict is **filed, disclosed and stable** —
      nothing rots while it waits — whereas item one has been rotting for six orientations. The
      backwards prime is the part that does rot, which is why it leads the item and is deliberately
      small. **Done means:** the three docstring sites carry the direction and name their population;
      a capture exists on disk with both a readable SVT sibling and an as-run `sim_level_anchor`
      matching the live block, or a written statement of why it cannot be produced; the whole-book leg
      either discharged against it or refused with the reason on a published surface; neither
      `xfail` re-keyed and no band widened; the pre-registration graded clause by clause with misses
      kept beside their filed text. **If the answer is still "we cannot tell", say so and finish —
      that is a result, and this project's habit of preferring it to a flattering green is the
      strongest thing it has.**
  - id: the-sanctioned-merge-route-must-name-the-paths-it-left-behind
    what: >-
      **The move CLAUDE.md names as the legal one arms a silent revert, and it was caught by luck.**
      `docs/staging/WORKER_FINDING_THE_SANCTIONED_MERGE_ROUTE_ADVANCES_HEAD_PAST_THE_WORKTREE_AND_ARMS_A_SILENT_REVERT_2026-09-02.md`,
      filed on itself immediately after use.

      `tools/surgical_land` computes every tree in a throwaway index and a throwaway checkout — that
      isolation is what stops it sweeping another lane's staged work, and **it must not be traded
      away.** The consequence for `--merge` is that the shared working tree is never updated: `HEAD`
      advances, `git push` succeeds, `HEAD...origin/main` verifies `0 0`, and the worktree still holds
      the **pre-merge** content of every file the merge brought forward. Here
      `tests/architecture/test_switching_rate_commons.py` sat **89 lines behind HEAD**, missing two
      whole test functions. The next lane to commit that file **by pathspec** — the practice CLAUDE.md
      mandates — silently deletes origin's leg. The only thing that gave it away was a suite count
      that did not move.

      **Build the disclosure, not a behaviour change.** `--merge` already knows both trees. After a
      successful merge it must name every path in the merged commit whose worktree copy differs from
      the commit it just made, loudly enough that an operator reconciles instead of discovering it
      from a line count. **Key the control to the property, never to today's tree:** after a
      `--merge`, no path in the merged commit may be behind the worktree copy without being named in
      the tool's own output. Prove it on a constructed two-tree fixture — deleting the disclosure
      must turn the test red, and a clean merge must still pass, or you have built a control that
      reports a constant verdict.

      Note what the worker did **not** do and preserve it: it did not commit the 13 lines of another
      lane's uncommitted prose, and the pre-disarm blob is at `refs/preserved/commons_worktree_20260902`.
      Neither `git checkout <path>` nor `git stash` on this tree, ever.

      **Pathspec:** `tools/surgical_land*`, `tests/tools/`, and the finding document. Archive the
      finding with a structured `**Discharged:**` line naming the test node that holds it.
    why: >-
      **Because it is a defect in the wall's own sanctioned route, and every lane uses it.** The wall
      says a hand-built merge is never a judgement call and `surgical_land` is the legal move; a
      legal move that silently arms the destruction of work already on origin is the most expensive
      class of defect this project has, and it is one commit away from firing every time two lanes
      touch a file. It is third rather than first only because it is **small and completely
      specified** — the mechanism is understood, the fix is a disclosure the tool can already compute,
      and it will not consume a stretch. It outranks the index work below it because that work is
      exactly the pathspec-commit pattern that triggers it. **Done means:** `--merge` names the
      divergent paths in its own output; a test that goes red when the disclosure is removed and green
      on a clean merge, mutation-proven under `python3 -B`; the isolation untouched; the finding
      archived with a `**Discharged:**` field the filesystem accepts; and a line in the record saying
      what an operator should now do when it fires.
  - id: land-the-finished-control-and-attribute-every-remaining-staged-path
    what: >-
      **Fourth stretch, and the count barely moved: 45 last orientation, 40 now** — `git status
      --porcelain | grep -cE '^[MARCD]'`, verified this orientation.

      `tests/tools/test_the_published_artefact_carries_the_split_the_code_computes.py` is **still**
      `A ` — mutation-proven, in no commit, fourth stretch running. Its docstring records it was run
      against the artefact *before* the regeneration that fixed it: RED on the annual series, GREEN on
      the monthly one — a discrimination proof, not an assertion of today's state. **Confirm that
      record is real rather than recalled**, then land it in a commit of its own naming what it
      guards. `tools/artefact_rerun_diff.py` + `tests/tools/test_artefact_rerun_diff.py` are staged as
      a new module with its test: establish whether it is wired or orphaned, then land it with a REUSE
      block or withdraw it explicitly.

      The rest is not one case and must not be treated as one: an **`AD`** (staged added, deleted in
      the worktree — unrecoverable by reading the worktree), a **`D `** on a `done/` finding, an
      **`R `** rename, **17** `A docs/staging/done/run_complete_*.md` back to 2026-08-30, and `MM` on
      `coupled_gap_ledger.json`, `value_based_pricing_arms.json` and `tools/couple_value_based_pricing.py`.
      Land what is finished, by pathspec, one thing per commit; leave what a live lane is holding
      alone; and **say in writing which is which.**

      **New constraint from item three, and it applies to every commit in this item:** before
      committing any path by pathspec, check the worktree copy is not *behind* HEAD
      (`git diff HEAD --stat -- <path>`). A file whose worktree copy is stale from a `--merge` is
      reverted, not landed, by exactly the discipline that protects against `-A`. Never
      `git checkout <path>` and never `git stash` — both destroy unstaged work belonging to lanes
      running right now. If a path holds a newer table and an older function, **compose**; preserve
      what you displace under `refs/preserved/`.
    why: >-
      **Because the trend is the argument, not the state, and this stretch it stopped falling.** It
      went ~24 → 45 → 40 over three orientations: no longer accelerating, not yet clearing. Nothing
      is wrong on a served surface as a result, which is why it sits below three items that are — and
      CLAUDE.md is right that level-moving work outranks tidying. But it is not costless: 40
      unrelated staged paths is one careless pathspec from a commit nobody can explain, this tree has
      already produced a finding titled *the shared index holds a branch that would silently revert
      three landed controls*, and item three has just shown a second, quieter route to the same
      outcome. The recurring shape is still exact and still embarrassing: the original defect was
      *computed and never published*; the control that catches it is *written, mutation-proven and
      never committed*, four stretches running. **Done means:** the split control in a commit of its
      own; `artefact_rerun_diff` landed with its wiring named or withdrawn with its reason; the
      `run_complete_*` group disposed as a group; every remaining staged path attributed in writing
      to a live lane or to a person; the count recorded so the next orientation can read the trend;
      and no path recovered by a command that destroys unstaged work.
