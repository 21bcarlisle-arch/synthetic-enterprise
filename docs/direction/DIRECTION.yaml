  hold, four actual-read bills at founder C8''s home, is in surgical_land now (pid 644310). D48 failed its L3 Expert
  Hour on 14 Oct because the accrual its title claims was not built. That accrual is now built and graded (75aff1401,
  d4af471a1), so the reason for the failure may be gone. Nobody has re-asked, which is focus item 3. (2) The licence
  duty is being measured. All three read-instruction arms are running at 8927e9345 (2h35m in, about 11 GB), and
  their grade is queued for 04:45. So last stretch''s item 1 was drawn, handed on and leaves focus. (3) The comparison
