thesis_read: >-
  The inference channel is live in HEAD and the population it exists to be graded on is capped by
  our own machine, and those two sentences are the whole state of the thesis tonight. The first is
  good: `c5641b12f` carries the import at `run_phase2b.py:31`, `arm_loss_reporting()` and the churn
  booking at `:1812-1815`, so a clone of this repository now contains a company that infers
  competitive pressure from its own realised losses rather than reading a year table. Advantage
  from inference rather than access has a route in code for the first time. The second is the
  finding of the stretch and it was already written down twice before I put it anywhere:
  **from 2018 the published book is not a commercial outcome at all.** On the live campaign the
  funnel won 380 accounts across the decade and the settlement engine booked 45; 335 were refused
  by `SETTLEMENT_CUSTOMER_YEAR_BUDGET = 1200.0`, which the module's own note calls "THIS MACHINE's
  budget ... not a commercial limit", and `site/data/book_growth.json` records the engine as the
  binding constraint in nine of ten years. The account count is 127 from 2017 to 2025. Follow that
  through the thesis and it reaches everything: the ladder's paired population is sixteen decisions
  and the worker measuring it tonight found all sixteen have term starts in 2016-2018, because the
  top rung has no book left after 2019 and the common population is the intersection across rungs.
  The founder book was supposed to be what changed `n`; it deepened the ledger to 453 renewal
  decisions and moved the gradable table by nothing. So "there has to be a baseline to beat, or 'it
  performed well' means nothing" is currently unanswerable — not because the company is weak, but
  because the world we let it run in stops growing in 2017, and every experiment downstream is
  being run on a book an engineering constant froze. R6 hits the same wall from the other side:
  acquisition spend now reaches the collateral desk and the company sits £316,009 from its first
  demand, on a mechanism that works through growth, through a book nothing reaches. Nothing went
  backwards, and the honesty here has been good — the feed publishes the ceiling, `/capabilities/`
  renders `engine_bound_statement` verbatim, and a door test drives the real page. One exception,
  found tonight and not yet repaired: the annual report publishes a section headed "Company CRM —
  Event Log" that is the SIM's own log relabelled, under a reconciliation whose Match column is a
  containment check between two projections of one write. A completely empty company CRM — which is
  what the five surviving `if sim_interface is not None` guards actually produce on every production
  path — reconciles as "yes" against a world that churned every account. That is a published claim
  the code cannot falsify. What is drifting is my own ordering, again and measurably: the
  settlement-clocks pair has now been named in seven consecutive directions and is still untracked
  with two modified consumers importing it, and last night I wrote "it moves to third tonight" and
  third was never reached. It is first tonight, because a ten-minute decision I have declined seven
  times is not a priority problem, it is a placement problem.
