thesis_read: >-
  **Ranking the served defect first worked, and that is the finding of this stretch — the schedule
  was the whole problem and nothing else changed.** The item I had put third, then second, for two
  stretches with zero ticks took **three consecutive lane-0 ticks** the moment it was first
  (`seat-executor-log.md`, 00:36 / 01:35 / 02:05) and landed at `e264e0305` as a genuinely good
  piece of work. It did not stop at the units: it established the three defects separately before
  touching one, was **refused by the wall on its first attempt and said so** — importing
  `tools/generate_dashboard_data.py` put `saas -> simulation.*` back on the graph KNIFE pass 1 took
  off — withdrew the Ofgem attribution because *our own commons refutes it*
  (`BILL_SHOCK_EVENT_TYPES_ANCHORS.md` §3 recorded "Confirmed: no"), found the incidence denominator
  was dividing by bills that could not be flagged, **withdrew a RAG leg that was RED in all ten years
  with both other branches unreachable rather than rescaling it**, then noticed that removing it left
  a two-leg RAG GREEN in all ten years — *the same defect facing the other way* — and made the report
  disclose its own single-valuedness. Eight of nine mutations killed, the ninth established as an
  equivalence rather than assumed to be one. Then `a1da56c99` — **not in my brief, it reached origin
  during assembly** — followed the thread one layer down and found that `bill_shock_rag` returned
  GREEN for a missing measurement, *armed by the fix above*, and closed the identical fail-open in
  `shock_rate_pct` one property away as a class rather than an instance. So the served figure is
  right, the band no longer claims a regulator it does not have, and the machine caught its own fix's
  blast radius. **Against the thesis, the score is otherwise unchanged and that is the uncomfortable
  half.** The baseline the thesis demands is still ungraded: the whole-book departure fit exists, is
  three orientations old, and **nobody has taken the decision it needs**. Its state moved under me
  during this orientation — `simulation/departure_level_anchor.py` is now **clean at HEAD's ten-year
  block** (mtime 02:26), so the tree wedge and the composition crash are gone, and the seven-year
  paste-ready block with its provenance now survives in exactly one place: a **staged, uncommitted**
  design document. I verified every one of its seven values is separately recoverable from committed
  files on origin, so this is not data loss — but the attributed block is one careless index
  operation from having to be reassembled by hand. Meanwhile the shared index has grown from roughly
  two dozen staged paths to **45**, and the direct debit is still set from the first issued bill it
  happened to see. **Forward decisively on the thing I finally scheduled properly; flat on the two
  things I have now deferred four and five times respectively.** The correction is not another essay
  about ranking: it is that the two oldest items are now first and second, and if they are still here
  next orientation the fault is mine and not the queue's.
