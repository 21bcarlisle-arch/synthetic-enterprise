thesis_read: 'The evidence for the thesis went backwards this stretch, and the stretch found out why. The reading
  the seat carried as proof that inference beats a flat baseline was B11''s whole-book clearance, +0.133 at 2023.
  Two-thirds of it was flat''s own defect: the gas segment was inverted, so flat ranked worse than chance at 0.409
  (4958a4945). The key itself did not get worse; its AUC rose from 0.580 to 0.592 on the dual book. But within segments
  it is +0.108 old and +0.075 new over chance, with no interval, so today nobody can say it clears flat. Item 2
  builds that term. The second finding is larger. No engine path makes a C34 or C35 decision (60c4814af). The per-household
  switch-on (f6e23a535) is correct and changes no run. Every per-customer advice and retention decision the thesis
  describes exists only inside harness tools, so no run can yet show per-customer against flat on them. Item 3 gives
  C34 a caller, off by default. C35 re-taken on the dual book reads 144 of 546 rescued, but it is costed on electricity
  alone, and the probe fix that adds the gas leg is being built in /var/tmp/se-seat-executor. World work landed
  where it blocks supplier results. The HH-EAC registration landed (6208ea6dd), which is the cause of the BLOCKING
  leaver finding. U1-U4 hold for the budget exit (a1235d427), though a chronic heads excess keeps that switch off.
  The B7 sole-occupant death exit landed (e0b301545). The split was supplier 1, world 1, both 1, other 12, and the
  one supplier commit changed no decision. The machine is the immediate block. The shared checkout has been stuck
  at ad8afadc5 since 09:24Z, 24 commits behind. The publish re-arm (ba8f179ce) is therefore inert in the worker
  that would use it, and the run now going lacks HH-EAC, so it cannot clear the leaver rows. Item 1 clears this.
  All three previous focus items were drawn and all three landed, so they leave focus. Corrected this stretch: C35''s
  per-leg rise, the switch-on that lapsed unseen, and the under-water budget.'
