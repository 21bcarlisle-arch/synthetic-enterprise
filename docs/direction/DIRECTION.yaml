  - id: the-direct-debit-has-no-estimate-behind-it-so-definition-a-cannot-be-measured
    what: >-
      **The director's own correction of 2026-09-01, now deferred five times, and every stated
      blocker has cleared. Verified untouched this orientation.**

      His words: *"There's no such thing as a half-month direct debit — an annualised plan divides
      estimated annual cost by twelve whatever the start date. The real defect is that the DD is only
      as good as the estimated annual consumption behind it: when that estimate is wrong the account
      drifts into credit or debit, and the correction arrives later as a change the customer didn't
      expect."*

      `company/billing/dd_review_runner.py:155` still reads, unchanged:

      ```
      standing_dd = seq[0][1]  # initial estimate = first issued bill
      ```

      And `grep annual_consumption_kwh` across `company/billing/` and `saas/` still returns **only**
      `exit_fee.py` and `renewal_engine.py` — **there is no estimated annual consumption anywhere in
      the direct-debit path.** So definition A's real measure — *the change in the amount COLLECTED,
      plus the balance the household is carrying* — has nothing to compute from.

      **The blockers are gone.** The channel wiring is done (`saas/bill_generator.py:183` takes
      `payment_channel`; `company/billing/monthly_bill_assembly.py:408` feeds it across the seam
      without importing `simulation.household_segments`). The two populations are published, with n,
      median, max and a 95% interval, in both `site/data/dashboard.json` and — as of `e264e0305` —
      the annual report. The shock definition now names *standard credit* as the population whose
      bill-to-bill difference IS the shock, and says explicitly that the direct-debit figure is
      **not** one. **That is precisely the gap this item fills**: we now publish that the DD
      household's shock is not their bill, and we have nothing that says what it *is*.

      **Knowledge first, and this is the £150 shape if you skip it.** Before writing any number: what
      do suppliers actually use to estimate annual consumption, and how does the SLC 27B ±5% review
      duty interact with a review cycle? `docs/domain_artefact_library/` holds the published law;
      `docs/market_research/what_bill_shock_is.md` records the population shares (~74/13/13 published
      against our world's 68.1% DD / 31.9% SC / **0% prepayment**) **and states its own gaps** — the
      fixed-vs-variable DD split and debit balances are not published, and it says so. **If nothing
      establishes a value, the code carries the gap explicitly rather than a placeholder that looks
      like an answer.**

      Then build it: an EAC behind the DD, the balance it accrues, and the correction arriving as a
      change the household did not expect. **Pre-register before the change.** Our world has **zero**
      prepayment households against a published ~13% — state that as a scope limit on the surface
      rather than folding them into standard credit.

      **Pathspec:** `company/billing/dd_review_runner.py`, `company/billing/`, `saas/`,
      `docs/market_research/`, `tests/`. **The epistemic wall applies to every line** — ask what a
      real supplier could know of each household's consumption, and route it through
      `company/interfaces/sim_interface.py`. `e264e0305` was refused by that wall on its first
      attempt; expect the same scrutiny and design for it rather than discovering it at the gate.
    why: >-
      **Second, and I am recording that I said a fifth deferral would be a decision rather than a
      queue — and then made it. This is that decision reversed.** It is his correction, it is right,
      and it is **the only item on this list that creates rather than repairs**. Against the mission —
      *saving them money, time and carbon through personalised modelling* — an estimate of a
      household's annual consumption that is better than average IS the product; against the thesis,
      an EAC the company infers well is the first thing here where **the advantage would come from
      inference rather than from a table**. It upgrades definition A from *"the amount collected
      changed"* to *"and here is why"*. It sits second only to a fidelity precondition, and behind
      nothing else. It is also **cheaper than when it was filed**: the split it needed has landed and
      is published in two artefacts, so this is building the quantity underneath an answer that
      already exists. **Done means:** the published evidence established and written to
      `docs/market_research/` **before** any constant is chosen, with what is not published named as
      a gap rather than filled; a DD set from an EAC ÷ 12 rather than from the first issued bill; a
      balance that accrues and unwinds; SLC 27B's ±5% duty reaching the review cycle; a
      pre-registration filed before the change and its predicted move graded afterwards beside the
      filed text; prepayment's absence stated as a scope limit on the surface; and one mutation-proven
      control keyed to the property, never to today's EAC. **If the evidence does not establish what
      suppliers estimate consumption from, file that as a finding and ask the director** — he is the
      third side of the knowledge loop, asking is cheap, and this exact subject has already proved
      once that a wrong frame compounds.
