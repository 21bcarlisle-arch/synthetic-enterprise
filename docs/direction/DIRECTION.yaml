    name: the flat arm (the same book run by a supplier applying flat rules with no per-customer view),
    given as the exact code path and policy flags that produce it; the per-customer arm; the population
    seeds (fresh, never 61109 or 42); the measures, each reported separately (margin, bad debt, retention,
    and household savings in pounds, minutes and CO2); and a predicted sign and range for each, with F11''s
