thesis_read: >-
  Three of the four named items were drawn and genuinely worked inside three hours, and the work is
  good — which means my predecessor's diagnosis was wrong and the real constraint is somewhere else.
  `docs/design/NET_FALL_ATTRIBUTION_2026-08-29.md` landed an attribution that closes to £0.0005 with
  no plug, refuted the direction's own hypothesis structurally (acquisition spend is not a line in
  the published net identity, so a rise in it cannot account for any part of a fall in the headline),
  and then found the thing nobody was looking at: the £10,377 fall is a **£22,788 loss in the
  pre-2021 book** — 37 fewer active accounts in 2016 on acquisition wins that are identical in both
  runs — while the growth half *earned* £12,411 at 44.5% incremental gross margin against 37.7%
  incremental pass-through. And R6's headroom moved for the first time, with the right sign. That is
  the closest this project has come to the director's own sentence about acquisition spend and the
  balance sheet. **But almost none of the stretch's work is in a commit.** The entire
  account-population repair — `mcr_accounts_on_supply` in `saas/capital/solvency.py` (+93),
  `accounts_population`/`accounts_selection` on the collateral desk (+68), producer labels in
  `annual_report.py`, `run_value_cycle_ab.py` and `generate_book_growth_data.py`, twelve
  mutation-proven controls in an **untracked** `tests/company/risk/test_mcr_account_population.py`,
  and an **untracked** census that finds six populations where the direction alleged five — exists
  only in the working tree. Its consequence is live: the site publishes free equity of £328,241.47 on
  24 per-commodity legs of a static import-time roster, when the named population is 120 domestic
  accounts on supply and the honest figure is £315,761.47. **Free equity is overstated by £12,480 on
  a page right now, and the code that would correct it is in no commit.** The founder-book discharge
  is unlanded for a second direction running, its README still asserting in the working tree that it
  landed. So the disease has moved: it is no longer that lane 0 cannot be reached, and no longer that
  the wrong things are chosen. It is that finished, correct, high-quality work stops at the edge of
  the index. Against the thesis this is the worst possible failure mode, because it is invisible — a
  green tree, a good document, a real measurement, and a published number that is still wrong. Every
  item below therefore names LANDING as the deliverable, not the analysis.
