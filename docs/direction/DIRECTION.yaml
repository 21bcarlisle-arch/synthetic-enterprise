thesis_read: >-
  **The public surface got honest this stretch and the delivery machine got no better, and for the
  eighth consecutive orientation the direction reached exactly one of its four items.** The
  bill-shock repair is real: `fc1c9a65c` passed the payment channel into the measure — a
  `payment_channel_feed` seam at `company/billing/monthly_bill_assembly.py:318` that keeps the
  epistemic wall intact, with prepayment written as an explicit `out_of_scope` branch and its
  unreachability stated in the code rather than folded silently into standard credit — and
  `8e395664e` put the bound beside the figure. **The live site's worst month moves 17,284.3% → 315.6%
  and months above 200% move 29 → 12**, every one of them now carrying `median_shock_pct`,
  `shock_count` and a 95% interval, and `avg_bill_shock_pct_population` naming in prose which
  population the mean is over. That is the whole of the improvement and it is worth having. **But
  the item's own exit condition is not met.** `monthly_ops.monthly[].avg_shock_pct` is still ONE mean
  across a mixed population: the channel now reaches the bill and labels it, and nothing downstream
  splits on the label. Each bill knows how its household pays and the published series does not.
  That is the mixed-subject shape this project has a catalogue entry for, half-repaired — and the
  half that landed is the half that makes it look repaired. **Everything else on the list got
  nothing, and the reason is now measured rather than suspected.** The SVT capture was never
  relaunched: `/tmp/svtcap/capture.log` has not been written since 11:47 UTC, still stopped at
  2020-10 of a 2016–2025 sweep, no process, no sibling, five filed predictions still unscored on a
  dead run for a second stretch. The class-debt split was not started;
  `figures_on_a_superseded_clock` grew 3 → 4 instances while nobody worked it. And
  `docs/observability/seat-executor-log.md` now records **thirty-one consecutive stand-downs**,
  unbroken from 2026-08-31 23:35 to 2026-09-01 14:05, the last six naming `bill-shock-is-two-
  populations` while the interactive seat did that work alone. **I have been reading that as
  degradation and it is severance.** Two substantive commits in three hours, all from one writer,
  all on item one; items two, three and four are not being deprioritised by anyone — there is simply
  no second worker, because the only mechanism that could be one refuses by construction on a
  condition that is never false. Against the thesis: the world is more faithful than it was
  yesterday and the published figures are the most honest they have been, but **there is still no
  whole-book anchor and therefore still no baseline to beat**, and the single command that would
  unblock it went unrun for a full stretch. The bottleneck this orientation is not judgement about
  what matters. It is that only one thing per stretch can happen at all.
