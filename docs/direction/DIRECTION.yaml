- id: skip0-is-graded-and-the-next-lever-is-chosen
  what: 'skip0 finished at 10:31Z. Its read is /var/tmp/vts-driver/read_threshold_skip.out (skip1-skip0
    GBP 0.00 on both seeds; skip1-A -4.567, CI -7.263 to -2.241; skip1-twin -5.774). Grade it in docs/design/THE_VALUE_TEST_REDESIGN.md,
    beside the s.12f pre-registration ("Pre-registered before skip0 is read", 19 Nov 01:10Z), with d0
    and d1 and their intervals. Quote the read file verbatim, and carry a Graded: value-test trailer.
    Then make the decision in the same entry. (a) Is company/policy/decision_policy.py''s save-odds weighing
    on by default anywhere a published book runs? If so, say so, and propose it default off in the value
    arm, under its own one-variable pair. (b) The armed 0.12 pair (vtc-cut012-watch, /var/tmp/box-plan/arm_cut012.sh)
    waits on a W3_3 book with no PID. Read sim-runner''s producer state, and say whether that book will
    build before 24 Nov. If it will not, edit the watcher''s precondition 2 or reverse it as the doc says,
    and record which you did and why. Do not start a second long job while one holds the box.'
  why: The weighing, not the skip and not the per-customer view, is where the arm loses its -GBP 1.35
    against the baseline. That is the thesis's live test, and the result has sat ungraded with no drawable
    owner. Done means the grade and the decision are on origin, and the 0.12 pair either has a precondition
    that can be met by 24 Nov or has been stood down with a reason.
