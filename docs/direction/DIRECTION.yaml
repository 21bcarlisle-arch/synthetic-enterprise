      publisher reads the promoted name `value_cycle_ab_s1_three_arm.json`, which is byte-identical
      to the 08-29 file. **Nobody promoted it.** Four steps. (a) Run
      `tools/run_arms_with_the_skill_funnel_20260830.sh --check` and obey it: an empty diff promotes,
      a non-empty diff is a FINDING and not a publish to force. (b) **Before promoting, check the
      provenance trap this direction created and did not see in time.** `f9866cd2a` — *"the arms'
      book was read once at the end, so two arms on two books read as one"* — committed at 05:31Z,
      one minute before this artefact was written and forty-four minutes after the run started, so
      the artefact was produced by the PRE-FIX code and its `book_identity` is the shape that fix
      exists to correct. Promoting it puts a stale-labelled `book_identity` on the live page under a
      commit whose tree contains the newer labeller. Either regenerate `book_identity` honestly or
      publish it carrying an explicit note of which code wrote it — do not let the promotion date
      speak for the code date. (c) Publish the split on the page, in the reader's words and beside
      the 0.133–0.867 interval: of fourteen dropped decisions, **zero are a join we failed to make,
      four are a gap in our own sourced tariff series, and ten are decisions the world never billed
      under the price that was chosen** — and say the consequence out loud, which is that this sample
      cannot be widened by fixing our code. (d) Fix the control that let the wrapper defect through:
      `site/test_expert_doors_mobile.py::test_tables_scroll_inside_their_own_container` counts
      `table-scroll` occurrences against `<table>` occurrences, and the door's own `<style>` rule at
