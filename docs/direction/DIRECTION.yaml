thesis_read: >-
  The stretch put the account-population repair in a commit and graded the arms pre-registration,
  and both were done well — but the thing they uncovered between them is the most serious result
  this project has produced against the director's own thesis condition, and it is not yet on the
  page. His condition is that there has to be a BASELINE to beat or "it performed well" means
  nothing. We have that baseline. `9b1ceda50` graded leg 1 and found that **the published headline
  was already inside its own error bar when it was published, and on today's book the same quantity
  has the opposite sign**: value−control was −£4,724 on the live page and is +£607 on the 14:40Z
  re-run; level−control was +£4,903 and is −£1,208. The new noise floor, which finished at 17:04Z
  after the grading was written, bounds all four at mean −£1,614 with a spread of £2,578 and
  `selection_distinguishable_from_zero: false`. So the live site says *"the per-customer choosing is
  worth less than nothing"* — a direct answer to the director's question — and that sentence's sign
  is a seed draw. The comparison cannot resolve its own question on a book of 167 settled accounts,
  and the honest publication is that we cannot tell. That is not a step backwards: the instrument
  now has an error bar big enough to catch its own headline, which is exactly what an instrument is
  for, and refusing the sign is the result. What went backwards is the route from that instrument to
  the reader. `tools/generate_value_arms_data.py:98-99` reads two UNDATED constants —
  `docs/observability/value_cycle_ab_s1_three_arm.json` (generated 2026-08-28T14:08:48Z) and
  `..._noise_floor.json` (2026-08-27T23:32:17Z) — and those two are the tracked files. The fresh
  pair from `arms-rerun-20260829.service` sits UNTRACKED at `..._20260829.json`. Three consecutive
  directions have asked for "one clock" on this page and none of them read those two path constants,
  so a re-run that costs three hours of machine cannot reach the page at all. That is the recurring
  class in mirror image — not a published figure whose producer is uncommitted, but a published
  figure whose fresh input is untracked while a stale tracked one feeds the reader — and it is this
  project's own rule about reading the enforcement rather than the paraphrase, broken by the seat
  that writes the rule down. Separately, the growth loop's picture got sharper and nobody has joined
  it up: `WORKER_FINDING_THE_CEILING_SPENT_THE_WHOLE_BUDGET_ON_ITS_MOST_EXPENSIVE_COHORT` shows a
  2016 win costs 9.83 customer-years against 0.78 for a 2025 one and the old budget was spent
  first-come, so the allocation change at `248a6368e` necessarily buys FEWER early-year accounts —
  which is a named candidate mechanism for the £22,788 pre-2021 loss and the 37 missing 2016
  accounts that `NET_FALL_ATTRIBUTION_2026-08-29.md` §2.6 has owed a run for since 12:00Z. Two of
  four previous items were drawn and worked; items three and four were not drawn at all, and item
  four is unchanged and uncommitted for a third direction running.
