    cannot reach the site before Mon 9 Nov 04:00 GMT. Your 7 Nov 20:22 reading expected the site updated this week.
  proposal: 'Allow one early publish this week: the first book after the 21:00 UTC unpin that passes the full invariant gate
    goes to the site at once. The Monday anchor then resumes unchanged. Your ruling was there to stop six publishes in a day
    (the 4 Sep cadence that wasn''t real), and one publish this week does not undo that. If you say no, the window holds and
    Monday''s publish goes ahead as ruled.'
