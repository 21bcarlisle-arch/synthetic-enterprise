thesis_read: >-
  Against the thesis this stretch stood still, and the measurement is not a judgement: of twenty
  commits and nine substantive ones, ZERO touched `company/`, `saas/` or `simulation/` -- the
  changed-path list over both sides of the fork for those three trees is empty. Every substantive
  commit was the machine repairing its own ability to commit, push and publish: hook marks, gate
  receipts, fork drains, drift detectors. Half of my carried error closes with evidence -- the
  reconcile drain landed, `19f4a7824` IS an ancestor of `origin/main`, so the mechanism is no
  longer bytes in one working tree -- and the half I never wrote down is what the stretch then
  proved: with the drain in, the checkout is STILL diverged 2 ahead / 4 behind and the publisher
  is still at 55 consecutive refusals over 77.7 hours, so "nothing was draining it" was a true
  diagnosis of an incomplete cause and the generator side was never controlled. The two ahead
  commits are a staging note and a liveness heartbeat, which names the generator as the daemons
  themselves. Meanwhile figures last reached origin 80.1 hours ago, and the whole citation holding
  the publisher is ONE test whose fixture went stale against a control that landed the same day and
  made the code MORE honest -- measured, not inferred: the five fixture failures are stamped four
  hours old, the trim-on-read landed 2026-09-24 drops all five as out-of-window, and
  `_publish_gate_wedge_active` returns None before it ever reaches the resolver the test is named
  for. On the thesis proper nothing moved: the published selection-advantage sign still rests on a
  standard error taken over 18 seeds that our own instrument now says are between 15 and 18
  distinct draws, and the one focus item that would close that is the single one of four the draw
  did not take -- because I ranked it last. So the steer is what drifted, and I have moved it
  second.
