thesis_read: >-
  This stretch produced the first honest answer this project has ever given to the thesis question,
  and it is a negative one. `74ee388d3` landed the detection floor on the flagship arm, so the page
  no longer just says "we cannot tell": concordance 0.517 sits inside a 0.429-0.572 permutation null
  on 86 scored decisions, the smallest departure that instrument could have called is 0.072, the
  observed departure is 0.017 - about 24% of it - and reading an effect that small needs roughly
  1,506 scored decisions, about 806 settled accounts. The scale constant is measured from this run's
  own permuted interval rather than assumed, and `tests/tools/test_the_concordance_curve_says_what_
  it_could_have_seen.py` holds it. So the claim that the advantage comes from INFERENCE is not
  merely unproven; the instrument now states the size of book that could prove it, and reports
  `the_observed_effect_is_attainable: false` against a settled-book ceiling of 632. That closes my
  oldest open error and it is the whole of this stretch's progress. Now the part that changes what
  to do next, and it came from reading the ceiling rather than accepting it: that ceiling's own
  field says what binds it is "the settlement path's memory budget on this machine, not the world's
  housing stock", and `settled_book_ceiling` adds `settlement_build` at 363.5 B/record to
  `run_output_serialization` at 411.4 B/record because the probe takes the second baseline while the
  first working set is still held. Over half the per-record cost of the bound on our central
  scientific claim is a double count in our own serializer. Against that, everything else went
  backwards. Blocking findings went from one to nine and eight of the nine are the machine's own
  apparatus; thirteen of fourteen substantive commits were apparatus; no level has moved for seven
  stretches (60 atoms at 0, 8 at 1, 15 at 2, and 82 of 83 below where they are meant to be).
  Publishing is DOWN again as I write - 3.5 hours, the last three failures `behind_origin` - and the
  cause is that this shared tree is three commits behind origin on its OWN lane's work and cannot
  fast-forward, because `background/process_run_complete.py` is dirty and an untracked twin of a
  file origin adds sits beside it. I graded transport CORRECTED last stretch on the strength of one
  successful publish; it regressed inside the same stretch, so that grade is withdrawn below. And
  the world underneath every figure above is still fitted onto its own check: the departure level
  solves to the published rate to four decimal places in all seven fitted years, which is rung 1's
  stated symptom rather than a validation result. One further fact about the steering itself: the
  brief reports that NONE of my four previous focus items was drawn, and that is false - item one
  was worked, in `74ee388d3`, which is the commit I am reading the good news off. The `drawn`
  instrument has now under-reported for three consecutive stretches, and I have graded this stretch
  by reading the commits by hand for the third time.

