thesis_read: >-
  This stretch bought the one thing that was worth more than a result: it found out that the repair
  it was aiming at cannot work, and said so before spending the compute. The departure level went
  from "rung 1 fails in six of seven years" to a decomposition that names where the miss can and
  cannot live. `docs/reports/departure_level_route_attribution.json` establishes that the renewal
  route — the leg we were steered to amplify — carries a relative slope of −0.08 with a 95%
  interval of [−0.45, +0.31] that excludes 1.0, while the SVT route's is +0.99 and carries 70–87%
  of the level. `docs/reports/svt_route_shortfall_decomposition.json` then splits the SVT route's
  level into reach × exposure × hazard exactly, and reports that reach and exposure at their
  ceilings — the whole book on SVT every day of the year, no renewal decision left anywhere —
  reach the band in 1 of 7 years, while hazard alone could close all 7. And
  `docs/reports/svt_composition_vs_published.json` runs the obvious next lever, moving the world's
  SVT account-day share onto the published default-tariff share, and reports
  `years_newly_closed_by_composition` empty on both bases and both accountings. Three plausible
  repairs measured and refuted in one stretch is the "prefer measuring to arguing" rule paying for
  itself. What is left is one quantity, and `docs/reports/published_route_split.json` states
  honestly that the published record cannot adjudicate it: R = s·H_svt + (1−s)·H_fixed is one
  equation in two unknowns, and phi — the external share of active fixed-term renewals — is
  `null` with a named route to closing it. That is where the BLOCKING finding now sits, and it is
  a knowledge question, not a solver question. Two of last stretch's four open errors close on
  evidence. The seat's own instrument is fixed: `cbbeb99d3` added `_upstream()` and
  `branch_divergence()` to `background/delivery_seat.py`, `commits_since` now runs
  `git log` over `["HEAD", origin/main]` so the range is the union reachable from either, this
  brief carries a divergence block on its face, and
  `tests/background/test_the_seat_graded_a_stretch_it_could_only_see_half_of.py` holds it — five
  stretches open, closed. And the H_harness staleness blocker was discharged by observation rather
  than by reading the wiring, which is the right way round; but its discharge line records a live
  standing condition that nobody has acted on, that 10 of an 11-daemon population are holding
  changed modules right now and the sim runner holds 145 of them. Against the thesis, the plain
  reading is this: the world side is now honest and precisely stuck, and the company side is
  honest and too small to tell. The value arm priced 120 of 1,953 renewals offered — 6.1% — and
  the largest single published cause of the other 93.9% is a sentence in
  `site/data/value_arms.json` that says the world has no standard-variable product. That sentence
  is false. `simulation/renewals.py:103` branches on `SVT_TARIFF_TYPE` and delegates to
  `build_svt_schedule`, `simulation/svt_product.py` is the product, and
  `tools/svt_generated_share_check` measures 42.6% to 78.5% of the world's account-days sitting on
  it. I knew that sentence was stale when I wrote the last direction — I bolted a "TWO SENTENCES
  ABOVE ARE NOW STALE" note onto the focus item rather than onto the page — and it has been
  published to a reader for a stretch since. That is why it is first below, and it is not a tidy:
  the same check reports the world's fixed-deal share OUT of the published band in all eight
  measurable years, so the arm's reach and the world's tariff composition are one investigation.
