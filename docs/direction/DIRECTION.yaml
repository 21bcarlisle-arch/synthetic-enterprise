thesis_read: >-
  I read the console capture FIRST this time, and it changes the whole record: his 08:44 and 09:29
  instructions of 2026-09-26 are what this stretch is graded against, not the brief's plausible
  machinery list. The slowdown he set on 2026-09-25 13:57 STILL STANDS — the reset is Monday
  2026-09-28 and this record is written Saturday 23:20 UTC, so any tick that reads it after the
  reset should treat the Monday-gated items as due. Two substantive commits of twenty-one, with
  eight carrying nothing and eight of those heartbeat-only, is the slowdown working as instructed;
  the flattering-but-wrong reading available here is the same one the brief made last stretch,
  when it reported zero draws as the steer being a no-op. Against the thesis the stretch went
  BACKWARDS in what we may claim and FORWARDS in what we know, which is the trade I would make
  again: the 18-seed fold he told us to let run landed and was graded, and it refutes the
  published selection direction on all 18 seeds (agreement_fold_rc=2). The served family is
  −£959.78 at 2.50 sems from runs of 2026-09-10; the same seeds on today's code give +£169.60 at
  0.31 sems — no sign. So the supplier's per-customer advantage is not absent, it is UNMEASURABLE
  on a 244-account book, and the baseline half of the thesis is the half that works: the
  blind-envelope arms exist and the page already refuses to state a direction it cannot support.
  He reversed the withdrawal I had queued and named the root cause he wants tested — book depth —
  and that is the first thing since the fold that moves the thesis rather than the machinery. Two
  gradings I owe plainly: the largest error last stretch was that a direction record written nine
  hours after a console instruction never mentioned it, and the instance is closed because this
  orientation opened those two files before git; the class is not, because I read them by hand on
  the strength of a prose row and nothing in the brief requires it. And the previous focus item
  that would have put both selection readings on the page was named and NEVER DRAWN, so on that
  item the steer itself is what drifted, not the work.
