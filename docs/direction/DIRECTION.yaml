thesis_read: 'Three hours: 10 commits, 7 carrying work, 5 substantive. The classifier reads 1 supplier, 1 world
  and 8 other, but two of the ''other'' are supplier grades read on the new book (fa5463139, gas legs settling on
  their own split; 0d4ffbe8a, KNIFE3 debt recovery), so the honest balance is about four supplier commits to one
  world, and supplier-first held this stretch for the first time in four. Three of the four previous focus items
  are finished and leave focus. The gas-split grade held 3 of 3. The dual-household offer fix landed (c41e70832).
  The four unparsed grades reach the loop, and a malformed Graded line is now refused at commit (270bf6a17). The
  VAT commons now runs the zero rate to 30 June 2027 (f70d432b0). D48 stays because its 20:00Z date has not passed;
  the blend is still None on origin at company/policy/decision_policy.py:264. One grade came back half-blind. On
  6a588a832f the agency''s cash reaches the company''s book for the first time (11.5% of written-off value recovered,
  against 0 before; I6 held). But I1 to I5 could not be read, because the run publishes no write-off refs, remittance
  rows or learner state. They were pre-registered against a book that could never answer them. The fix is gating
  now (surgical_land pid 724123). Against the thesis itself nothing moved, and nothing could have moved yet. The
  out-of-sample replication of the 0.12 cut is the one reading that tests whether inference beats the flat rules.
  It is running: pair 33333/44444 had reached September 2023 at 18:23Z, and 55555/66666 follows, so it reads around
  15:00Z on 21 Nov. Until then the per-customer arm stands at -GBP 0.33 (-1.77 to +0.96) against the baseline, in-sample:
  untested, not refuted. Note what the replication can and cannot say. Its pre-registered grade is cut minus A.
  That says whether the 0.12 cut adds value on households it was not fitted to. It is not, by itself, the advantage
  over the flat-rules book. So item 1 asks for both numbers, and asks the reader to say plainly if the files cannot
  give the second.'
