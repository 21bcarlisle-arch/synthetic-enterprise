thesis_read: >-
  The stretch did what a correctness stretch should. It turned four unexcepted reds into one real defect with a
  name, and the gate caught that defect before a household page printed it. On 8c7489e0d9 four rows were red with
  no exception. Each now has one fate. The cap-note row was fixed in company/ (082d84d27): under the EPG, a
  two-register bill is graded against the published multi-register cap, and the household E7 EPG level is named
  as a GAP. N17's electricity row and SYN-2016-206g's gas row are traced to one world cause and given dated
  exceptions (recheck 23 Nov, retired by W2_30 and the ERA5 pull). N20 cleared on fa915ac0d7, the first book
  carrying the level DD schedule, at 0.212, as filed. The N15/N16 page rows reached origin (f7f0a8ca4) and first
  read 0 and 0, so that wrong row is corrected. The scratch grader does not build their inputs, though, so the next
  book has to grade them through the publisher's own path (item 3). The advisor steer is back to its signed bytes,
  and the seat's section is now a seat record (2e8ef7e47), so that row is corrected too. The triad's "19 settlements
  over the open balance" turned out to be the count reading bill faces, not cash (12a470de7). Its fix is on origin,
  and a filed prediction says the first book carrying it reads 0. The shared tree was unpinned at 21:00Z.

  It went backwards in one place, and it matters. The level schedule fixed the share of direct debits that equal
  their bill, but it showed that the collections journey and the page's payment record still assume each DD pays
  its own bill by that bill's due date. On fa915ac0d7, 176 of 454 level-DD households are dunned bill by bill.
  That is 1,724 page steps, 852 of which print an overdue sum to a household in credit or at zero, plus 45 payment
  records reading "missed DD, no return". It is now the only thing between a book and the 9 Nov publish. A dated
  exception would publish false arrears, so it gets no exception, and it is item 1.

  Against the thesis: the per-customer-versus-flat-baseline comparison is still held by the 26 Oct ruling, and
  its exit test is now one defect away (item 1), plus a cold read that finds no new class (item 3). The commit
  split was 1 supplier, 1 world and 12 other, with 3 substantive. As last stretch, the classifier labels the grades
  "other", although they grade the supplier's books. The previous focus was drawn on 2 of 5 items. The calibration
  (due 11 Nov), the ninth cold read and the retire guard were never drawn, the second time for the first two. So
  this record keeps them by name and does not reword them. The pay-on-receipt cap fix is landing now (surgical_land
  pid 2908400) and is not on origin yet. The executor pilot's REVERT verdict stands, and executor turns stay on the
  control arm. Item 4 is new: the D48 billing-accuracy gap is the one measurement holding three world atoms
  (W2_36, W2_30, W1_14) at the coupled-triad L3 wall. It is a supplier measurement, not a feature, so the 26 Oct
  ruling does not hold it.
