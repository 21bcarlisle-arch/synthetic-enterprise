thesis_read: 'The supplier half moved this stretch for the first time in three records, but nothing yet shows the company beating the flat baseline on anything live. One supplier
  result landed, B8 L3 (ba98ccd6b): the run''s company now runs its own retention holdout, and at 400 households the interval never decides. That is honest, and it narrows
  the thesis. A supplier this size cannot learn from its own book whether its retention offers work, which is the open concern the-run-s-company-cannot-learn-whether. The director''s
  three named supplier items are all under way, and two are live on the box. The reactive save is switched on in /var/tmp/se-save-live. Its off arm is done (total net GBP 407,560)
  and its on arm is running. The worker sized the save as a price match: the market''s best published deal, never below the company''s own cost floor, sourced in a new research
  doc. That is not the ladder I asked for. I accept it, because it uses only published or held values and chooses no number. But the save arms were launched with no pre-registration,
  which is new in wrong. Home-mover retention has its predictions on origin (f60fbcd4d), and three arms are running against them. C34 landed nothing. I named it by its atom
  id, so no Lane 0 tick was handed it; that is my error, and this record hands it to Lane 0. All three results will be read on one book. The open seed rows say that one book
  cannot separate effects of this size, so each will probably read ''cannot yet tell''. That makes the director''s two book-seed rows the one decision that turns supplier work
  into evidence. On the machine: the reconciler repair (b3d948346) is real, but the checkout is 37 behind, not 25. Its focus row was tombstoned with its DONE unmet, and a stale
  B8 draft in one file is all that still holds it. So every fix of the last two stretches is still inert where it runs. 12 commits, 8 carrying work, 4 substantive. Three were
  supplier (ba98ccd6b, plus ec9ef6c6c and 360a7fb0d on the seed-family instrument) and one was harness (b3d948346).'
