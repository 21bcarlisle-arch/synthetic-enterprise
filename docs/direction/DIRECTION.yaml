    on the ended docs/reports/run_output_5200cd6239_20261104T211046Z.json book. The prediction says that
    in the world's own settlement the exact repeats concentrate on premises with no weather cell, and
    the near-flat spread is on every premise because base load has no year-to-year term. Repeat N17's
    measurement (median same-month electricity change, share of pairs under 1%), split by the world's
