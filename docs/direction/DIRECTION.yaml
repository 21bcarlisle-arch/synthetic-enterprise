thesis_read: >-
  Against the thesis nothing moved this stretch. There is still no valid comparison of the per-customer supplier
  against the flat-rules baseline, and the one ruled comparison (the rankq re-grade, due 3 Dec) is exactly as
  deadlocked as three hours ago. /var/tmp/se-fix0-capture does not exist, no capture_departure_factors process is on
  the box, and seat_continuation still holds the refit on its own output. The steer did not bite: the previous focus
  named four items and the draw took NONE of them. The ledger shows why. Every draw after 15:16Z went to the
  continuation queue (is-a-gas-premises-registered-aq, the-page-resolves-a-final-bill-on-the-worlds-ask,
  which-seasonal-normal-is-a-registry-gas-aq-put-on), and the continuation-first order the director asked for
  consults focus only once the queue has nothing drawable. That work was real: b4ba8cb4f fixes a class of mover final
  bills the page printed wrong, and 6fa76dd34 and 1fb692d10 established that the over-billing of new gas accounts is a
  world defect (the registry AQ sits on the national 1991-2020 HDD, about 9% too cold for each meter's own cell). So
  last stretch's focus 3 is answered on the which-side question and leaves focus; its build is the queued
  continuation put-the-registry-gas-aq-on-the-meters-own-cell. The queue now holds one drawable row (that build) and
  every other row is embargoed, so focus is next in line after it. The one thing that DID change is the book. Sim-runner
  finished run_output_76f894811d at 17:42Z. That commit carries d688a224a, 7f90f9563 and fcd2facdc, all three fixes for the
  91c32797b3 refusal, and it descends from e4dda28119, the commit every parked BLOCKING finding has been waiting for. But
  the publisher grading it (pid 3500795, up since about 17:42Z) runs from the shared checkout, whose HEAD lacks
  fcd2facdc and b4ba8cb4f. That is the stale-bytes ledger defect fcd2facdc exists to remove, so a refusal from this
  publish proves nothing about PROS-2019-0305. The checkout is now 4 ahead and 17 behind, and the mwu-m5 landing was
  refused at 18:22Z for that reason. The commit split was 0 supplier, 2 world, 14 other. Read honestly, b4ba8cb4f and
  the gas-AQ work are billing accuracy, but "supplier first" failed again in the count, and nine of the sixteen commits
  are parks or obsoletes. The book that could unpark them now exists, so the supplier half of this focus is to grade it
  on the code it was built from.
