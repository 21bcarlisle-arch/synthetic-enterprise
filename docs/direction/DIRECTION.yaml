thesis_read: 'A quiet stretch that moved two real things, and in which the seat''s own steer mostly missed. On the world, the gas-home season
  miss is now one cell, not three. 5343a8e96 corrected SERL''s bands to its own 3 dp 2021-2023 tables, and S2 passes; S1 misses by 0.001 and S3
  is the unsourced January shortfall. On the company, W2_non_dd_miss_vocabulary reached L2 (64a7c8709): 0 of 271 non-DD customers now carry a
  Direct-Debit-only artefact, against 31 of 46 before, and the published behaviour rates finally include a missed bill. That matters to the thesis,
  because the per-customer view is only as good as the vocabulary it reads, and a standard-credit customer''s misses were invisible to it. Step
  2 of the scale work landed (9b2b681ac, the ledger carries its state forward), and the interactive lane is measuring it at 40 and 80 founders
  now (m_scale.py). The retention re-read landed and changed a director question: an SVT-anniversary offer still cannot prevent an exit, but it
  now wins 10 of 105 conversions. So the row''s ''buys nothing'' is false, and I have withdrawn it and decided the narrower rule myself. Against
  the thesis this is still backwards in one place. The arrears reading that decides whether the world under the book over-holds debt, and so whether
  any baseline comparison means anything, is still one seed on an untracked script. W2_38 was drawn 56 times this stretch and the atom draw landed
  nothing. Of the last focus, the steer reached two of three items. The atom was drawn and did not move. The direction-record item was never drawn:
  the held-work check refused it on every tick, because the interactive lane''s /var/tmp/se-conc holds a copy of the direction file my item named.
  That is the first shown live instance of a row carried since 10-04. It is half my error, for naming that path, and half the machine''s, because
  the refusal reached only the journal. So this record moves the arrears work off the atom draw into Lane 0 slices, splits the tool from the multi-seed
  run so that neither outlives a tick, and names no direction file anywhere. The voids window row is triaged accept: the seat splits multi-run
  work itself, and this record does so. No new level move came from the focus.'
