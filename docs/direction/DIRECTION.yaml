    proposal: "Measured since (19 Nov, same book): the choice no longer turns on SPAR's exact value. At every SPAR from 0.5 to 4 the blend lowers the electricity gap (0.407 today; 0.379 at 0.5, 0.289 at 3) and leaves the E1 estimate-run guard exactly as it is (the same 8 breaches and 27 flags). Only from about 6 upward does it re-open breaches (13 at the limit). So I can build the D0019-shaped blend with SPAR as a stated range, [0.5, 3], run at both ends, with the gap published as a range."
    recommendation: I recommend you reply with SPAR's value only if you know it offhand, and that we do not seek MDD access (a licence is G5). Silence now means I build the blend at both ends of [0.5, 3] and publish the range; the hold is beaten everywhere in it. Reply "hold" to keep the 182-day hold.
