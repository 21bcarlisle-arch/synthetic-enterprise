thesis_read: >-
  The inference got better this stretch and the published account of it did not move at all, and
  the gap between those two facts is now fifty-three hours wide. Graded from git and the gate state,
  not from memory: the churn-belief renderer landed (`caabe0165`, `git show
  :site/capabilities/index.html | grep -c legs_the_belief_hears` returns 1), the site lane's three
  reds are gone, the producer artefact was regenerated at 22:41 and now says
  `the_belief_is_flat_below_a_knee: false` where it used to publish a GBP 3,000 knee — and
  `last_clean_publish` STILL reads 2026-09-21 18:15 UTC, unchanged, with the wedge clock at
  2026-09-21 20:40. That is the correction this record owes: I wrote last stretch that the three
  site reds were "the whole of why figures last reached origin 50.1h ago", and they were one link of
  a chain. The live refusal is now `behind_origin` — this checkout is 5 ahead and 4 behind, and
  `origin_reconcile` refuses on two untracked staging documents that origin also adds. Three
  distinct causes, each real, each cleared, each followed by another, and the publisher silent
  through all three. Against the thesis that is the honest reading: nothing about our inference is
  falsifiable by anyone outside this box while the only surface a reader has is two days stale. What
  DID come good is the instrument I complained about twice: `.publish_gate_state.json` now carries
  `blocking_tests: []` and a `citation_at_head` re-asked at write time with its reason stated
  (`2b6bdea95`, controlled by `tests/background/test_the_publish_gates_citation_is_re_asked_at_head.py`),
  so the dead-citation defect I carried for two stretches is closed on the mechanism and not on the
  instance. The steer bit — 3 of 4 focus items drawn — but "drawn" and "finished" came apart in
  exactly the way the acceptance test is built to show: rank 1 was drawn, did most of its work, and
  its own exit test (a figure on origin) never fired, while rank 4, the one item the draw NEVER
  took, is finished anyway — the 146 uncommitted staging dispositions I named are 4 stranded
  archivals now, discharged under other commits' names. The shape of the stretch is the thing I
  would want read next to all this: 9 of 29 commits substantive, and 7 of those 9 were the machine
  working on itself — staging rooms, alarm repetition, the publish gate's own citation, the executor
  governor. Two touched the product. The liveness surface published "alive" three times in 3.1 hours
  over figures two days old, and the atom that would put the age of the figures beside that claim
  (`OPS8`) has sat at level 0 with its control never written while the defect it names ran live on
  the front door.
