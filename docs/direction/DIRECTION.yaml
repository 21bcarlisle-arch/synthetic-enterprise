focus:
  - id: land-the-value-arm
    what: >-
      Check HEAD first; if it is already there, say so and stop, which costs one lookup. Otherwise
      land through `tools.surgical_land` by pathspec: `company/pricing/value_based_renewal.py`,
      `tests/company/pricing/test_value_based_renewal.py`, `tools/couple_value_based_pricing.py`,
      `tests/tools/test_couple_value_based_pricing.py` and
      `docs/observability/value_based_pricing_arms.json`. Stage only those hunks, never a broad add.
    why: >-
      This is the coarse-bracket-plus-refinement rebuild that turned the arm from a bound-reporter
      into a per-customer chooser, and git has never seen a line of it. The last record caught this
      exact shape on LANE 0 and the fix held; the tree has since documented a concurrent lane
      reverting uncommitted work mid-tick. Done when `git ls-files` and `git log` show the rebuild
      at HEAD and the arms record beside it, so the evidence for every claim above survives a power
      cut.
  - id: W2_3_competitor_field
    what: >-
      Make the world's switching curve say when it is being read outside its own data.
      `_savings_to_rate` in `simulation/market_switching_propensity.py` is fitted to the DESNZ
      2015-2025 series and returns a flat `_MAX_RATE = 0.22` for every savings figure above GBP
      400, and `WORLD_MAX_CHURN_PROBABILITY` caps the leave probability at 0.95. Do NOT invent a
      steeper elasticity. Make the out-of-calibration region explicit and reported at the seam --
      the world's own equivalent of the `model_support_bound` the company arm already carries -- so
      that a run in which the company prices into the flat top is visible as unsupported
      extrapolation rather than a confident answer. Then re-run the arms comparison and record what
      the arm's choices look like once the world can say "I do not know".
    why: >-
      The thesis says the advantage must come from inference and there must be a baseline to beat.
      Neither claim can be made against a world that keeps 78% of a book whatever it charges, and
      the arm has put its whole book past GBP 400 of savings available where the curve is flat. R13
      binds this: it is a baseline change, so it is made for fidelity to the data only and decided
      blind to what it does to the company's numbers -- an extrapolation flag is defensible because
      the series genuinely has no observations there, and a new number would not be. Done when a
      reader of the run can see which decisions were taken in a region the world has no evidence
      for, and the arm's verdict says so in its own words.
  - id: harness-lane-prune
    what: >-
      Execute the split designed on 2026-08-24, which is unchanged since: `H_harness` still holds
      117 of 298 atoms and only 20 carry a gap. Move closed atoms out of the drawn file behind a
      loader, honouring the named hazard that `site/moap_coherence.py` derives Live/Building/Planned
      from atom levels and will flip Live nodes to Planned unless that reader still receives all
      atoms. In the same pass, dispose of the idle atoms sitting over the discovery pass ceiling --
      promote or close, one line of reason each.
    why: >-
      The director named it twice on 24 August and made it the fourth item of his own console
      queue; it has now been carried across two direction records with the analysis done and the
      execution not, which makes it the clearest thing that is drifting. It is also the livelock:
      the draw keeps spending tokens rediscovering that these are decisions, and a decision is what
      this seat is for. Done when the drawn map is materially smaller, every atom is either live
      work or closed with a reason, and the coherence reader still shows the same Live nodes.
  - id: EP1_clv_three_horizon
    what: >-
      Fix the instrument before the estimator. `docs/observability/coupled_gap_ledger.json` still
      carries `measured_at: 2026-08-19` over 5 counted accounts out of 13 available, on a book that
      now holds 263, and its own note says the comparison is structurally impossible -- the
      accounts EP1 values are exactly the right-censored ones it refuses to grade. Re-measure, and
      either find a grading that reaches live accounts or record in that ledger that this gap
      cannot be moved by building and why.
    why: >-
      Lifetime value is the quantity every per-customer choice in the thesis is ultimately made on,
      and this figure has been quoted as current in three consecutive direction records while
      resting on five completed lives from a week ago. An estimator cannot be improved against a
      sample that cannot see the accounts it is used on, which is why the atom draws without
      moving. Done when the ledger's own timestamp and account count match the book it describes,
      or the ledger states plainly that it never can.
not_now:
  - what: Wiring the value arm to the live renewal desk.
    why: >-
      Rejected for the third record running and the reason is now stronger, not weaker. The arm is
      a genuine per-customer chooser and it still says `fit_to_run: false` about itself, because it
      would move the median bill +53% on the strength of a world curve that is flat where it is
      being read. Wiring it would push a real pricing defect behind the wall for the company to
      have to rediscover, which is the one thing the epistemic design is for.
  - what: Moving `_MAX_RATE`, `WORLD_MAX_CHURN_PROBABILITY` or the company's churn cap so the arm's answer looks sensible.
    why: >-
      This is the cheapest available fix and it is goal-seeking against a calibrated belief. R12
      says an output is a diagnostic and never something to tune toward; R13 says the baseline
      changes for fidelity reasons decided blind to company results. A number chosen to make a
      pricing rule read well is the exact inversion this project exists to avoid, and the finding
      that surfaced it says so first.
  - what: Deriving the real elasticity above GBP 400 of savings available, rather than flagging it.
    why: >-
      There is no published GB series where a household was offered that much and observed, so any
      value would be authored rather than measured -- which makes it a curriculum value and the
      director's, not mine. Flagging the extrapolation needs no such number, delivers the honesty
      the comparison actually lacks, and leaves him a clean question if he ever wants the number.
  - what: Explore's remaining stages with real data, the director's own third priority.
    why: >-
      Those stages render exactly the numbers the second focus item is currently deciding the
      credibility of. Publishing them now spends the effort twice and risks putting a figure on the
      live surface that the same night's work says is unsupported. It moves up the moment the world
      can state where it does not know.
  - what: The publish commit's hook budget -- 393 seconds of a 600 second allowance spent by the first two of fifteen test files.
    why: >-
      Publishing is live, the fifteen-hour outage traced to untracked files rather than to the
      deadline, and the receipt redesign named last night was correctly killed on analysis because
      only the second gate can see what the commit is landing. One always-run entry was already
      made twenty times cheaper this stretch. The finding stays LATENT deliberately: it is a real
      accretion, and it is not what is standing between this company and the thesis tonight.
  - what: Filing further findings against the 30 already sitting LATENT.
    why: >-
      The director named this directly as a token cost, and five class documents already cover
      these shapes. The queue needs discharging, not lengthening -- the harness prune above is the
      discharging.
  - what: Re-opening the director's first two console priorities -- 200 residential through the funnel, and the win-rate loop.
    why: >-
      Both have moved and neither needs steering from here. The priced book is 256 residential of
      263, and the win side got its build this morning when the funnel was made to read the
      company's own price position through the same elasticity the loss side uses. Steering work
      that is already running costs a draw and buys nothing.
