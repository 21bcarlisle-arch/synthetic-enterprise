thesis_read: 'The thesis has not moved, and this stretch could not move it: the churn_roll family is on its second
  of twelve draws and the 16 Nov book does not exist yet. There is still no evidence that per-customer inference
  beats the flat baseline (family mean GBP 5.24 per household-year, -3.34 to +14.35). What moved is the ground the
  next result stands on. B11''s park now names a blocker that exists today (d7b9f0d32): L3 is prereg M7 alone, six
  fresh value_arm books on seeds 61113-61118 (7036dcbd5), and it waits on churn_roll and then candidate A, which
  is the machine and not the director. C32''s fourth blind pass failed honestly. From April to September the company
  would have disconnected a household on home oxygen, and ce8179c1d makes it operate the Safety Net all year on
  the M3 health floor. That is the most important supplier fix of the stretch, but it was graded by the hand that
  wrote it, so a fifth blind pass is owed before C32 can reach 3. The learning loop''s spent STOP is fixed (4b4ff1158),
  so that wrong row closes. All three previous focus items were drawn and met, and they leave focus. 14 commits,
  10 substantive, split 2 supplier, 0 world, 12 other. Three of the ''other'' commits were A45 canon-check tidying
  and one was a G15 hedge backtest written as research, while the supplier''s two commits were both C32. The balance
  is honest only because the book is frozen until 16 Nov 04:00. The steer for the next fifteen hours is to keep
  supplier work in the queue that does not need a book: a blind pass, and a pre-registration for the next per-customer
  lever.'
