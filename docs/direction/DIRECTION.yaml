    (a) The queued continuation grade-the-companys-provision-stock-on-a-run-that-carries-it: grade P1-P6
    in the Grade section of docs/staging/SEAT_FINDING_THE_PUBLISHED_PROVISION_WAS_THE_WORLDS_INCIDENCE_AND_THE_COMPANYS_OWN_STOCK_WAS_NEVER_READ_2026-10-11.md.
    (b) The movers'' final-bill grade, which never ran: the share of movers'' final-bill value lost at
    issue, against the prediction the B7 record filed before any run (17%, band 12-24%, against about
    1% before). Record it in docs/design/simplifications/B7_customer_state_layer_moves_and_shocks.yaml
    and set it beside the provision''s closed-account bucket. Before launching, check python3 -m background.seat_work_in_hand
