- id: c34-next-best-action-the-customer-s
  raised: '2026-10-06'
  kind: canon_intent
  what: 'C34 next best action: the customer''s benefit first, then ours, is read in slice 1 as a gate (never an action the
    customer loses by) followed by supplier forward value as the objective. At realistic margins and hazards, every advice
    action that saves the customer money then LOSES supplier forward value, so the rule advises almost nobody: do no harm,
    take what pays us.'
  proposal: Keep the gate-then-CLV reading until you answer. If you agree with the mission's created-then-shared reading,
    C34 ranks on joint value (customer benefit plus supplier forward-value change) with a no-loss floor on both sides. That
    is a one-line change to the decision's ranking key; the planted, null and misled control arms carry over.
