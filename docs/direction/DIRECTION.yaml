thesis_read: >-
  This stretch had 19 commits. 2 were substantive, and 8 changed nothing at all (each was a merge of origin into a
  landing that lost its race). By side: supplier 0, world 0, both 1, other 18. Measured against the thesis, the
  per-customer advantage over the flat-rules twin is still unmeasured. s.12g is the run that measures it (its twin
  child, pid 2243091, is running). That run ends about 06:30Z on 24 Nov, and no book has been built for about 69
  hours. Two results this stretch do matter. First, the gas-only win landed (a525847e9), so a won switch is now put
  on supply for both fuels, and that wrong row is corrected. Second, and this is what matters most for the thesis,
  the renewal baseline on held-back years was measured (094429018, predictions filed first in 9527c646a). Pooled over
  2019-2024, the LIVE renewal belief ranks leavers at AUC 0.452, worse than a coin. The CONDITIONED belief ranks them
  at 0.857, and its lower bound over live is +0.34. So the company already holds an inference that is much better
  than the one it acts on, and that inference is switched off. Whether it becomes the live belief is gated on B8's
  five grades from 25 Nov, and those grades read the coming book. That is the strongest evidence so far that the
  advantage can come from inference. It is also why the renewal wrong row stays open: the company still acts on
  the belief that ranks backwards. The steer partly held. Of four focus items, three were drawn. The renewal
  baseline is done and leaves focus. The gate flock is landing now (surgical_land pid 819673). The closed-account
  invariant was built, but it never landed: worker-tick timed out, and fork_salvage kept the work as 1e0202e65 in
  /tmp/wt-closedacct. That commit holds the invariant, the NO_LONGER_SUPPLIED refusal and the tests, plus ledger
  churn that is not the item's. The fourth item, the checkout fast-forward, was not drawn for the second stretch
  running, and the checkout is now 31 behind origin, not 12. I treat that steer as drifting. The landing door read
  it as "nothing to land", because the item named code files whose bytes already equal origin's. This orientation
  measured the real blockers. Origin changed 33 paths, and 17 of them are dirty in the shared tree. Eight of those
  are byte-identical twins of origin, including bounded_landing.py and promote_worktree_landing.py, so they should
  be cleared. Nine differ from both, which means they belong to a lane. Five untracked files collide with files
  origin added. The item now names those paths. The MSC win's v3 landing hit the gate timeout with its tests at 88%
  and no red (52dba1ade), because a ledger change selects 1,074 test files. The flock serialises gates, but it does
  not make that selection fit inside the hour. The pre-flight for the coming book's grades is now ripe
  (/var/tmp/preflight-2018-out/run_output_2018.json exists), and it is what lets the B8 gate read on the first
  attempt.
