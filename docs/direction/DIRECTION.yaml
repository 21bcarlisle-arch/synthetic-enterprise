thesis_read: 'Three hours: 2 commits, both carrying work, 1 substantive. The classifier reads 0 supplier, 0 world
  and 2 other. Against the thesis this went nowhere, and the cause is my own steer, not the box. Item 1 was the
  only test of the thesis: grade the 0.12 replication''s first pair out of sample. That pair has been on disk since
  03:19Z. But the item''s STEP B carried a DO NOT DRAW phrase, the lane read that phrase as an embargo on the whole
  item, and it was never drawn. The executor then stood down five times from 05:36Z. So the per-customer arm still
  stands at -GBP 0.33 (-1.77 to +0.96) against the flat-rules twin, in-sample only. The out-of-sample number we
  could have had at 04:00Z has not been read. Item 2 (B8) was drawn and its work was done: the run now publishes
  its retention holdout per desk and year and says by name that it assigns none. But both surgical_land attempts
  outran the 5400s tick, so the work sits uncommitted in /var/tmp/se-seat-executor, and the lane has stopped offering
  the item after three ''empty'' turns. Done work stranded in a worktree is the worst state here, so landing it
  is item 2. Item 3, the one book that grades D48, KNIFE3, the dual-household answer and B12''s L2, is still correctly
  held behind the replication''s memory (the child is at 6.8 GB). The shared checkout is 30 behind origin. HEAD-red
  repair continues in other lanes (43827f723, and a reconciliation-identity landing gating now). Corrected this
  stretch: nothing. Two new rows are the seat''s and the machine''s, and the four carried rows are unchanged, each
  waiting on a scheduled read.'
