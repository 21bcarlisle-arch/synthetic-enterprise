thesis_read: >-
  The thesis test is finally running. That is the stretch's one result that matters, and it has no answer
  yet. longjob-value-test-threshold-skip launched at 13:08Z (pid 1873447, 6.2 GB). After 2h13m, skip1's
  member run had reached September 2021 of a 2016-2025 book. skip1's read should land around 00:30Z on 19 Nov,
  and skip0's control file around 12:30Z on 19 Nov (the register expects 1,400 min). c18067646 put a null row in
  next_book_requires, so no book can take the box first. That corrects the 11:04Z admission that cost about
  3.5h. Until skip1 reads, the supplier still trails its flat-rules baseline by GBP 1.35 per household-year
  (-3.03 to +0.13). The renewal belief still ranks leavers backwards (AUC 0.333). Nothing this stretch moved
  either number, and nothing could have. The commit split reads 0 supplier, 0 world and 18 other. That is
  honest: no supplier code changed. The billing work was grading. Four BLOCKING D-lane findings were graded on
  the published 6af7fd0bfd book and retired (51c9cc571). The shared-serial and volumeless-gas read came back
  clean, at 0 of 1,044 supply points and 0 of 23,799 gas bills (3727cdbb3). That closes a row carried since
  30 Oct. The channel-F census now runs when a publish stages the artefact it reads (faef41bcd). The previous
  focus drew 3 of 4. The fourth, skip1's grade, was correctly not ripe. So the steer held. What drifts now is
  the supplier side: while the box is held, two billing defects already traced to the penny sit unbuilt. The
  closing set-off nets only debt the household never pays: 23 lines, GBP 483.51, on 8a300fa561. A level
  return on a credit-bill month is dropped from the page on 3 legs. Neither needs the box to build, and both
  are billing, which comes first in the director's order. That is this record's focus 2 and 3.
