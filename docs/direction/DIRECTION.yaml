thesis_read: 'Leg one of the correctness exit is met in substance, and leg three is not. On the 3dc5a92948 book, 128149f34 retired the SVT row at 0 and 74d6c0759 graded every SVT, F/VAT and desk-cure P1
  prediction held, with revenue at 1, so the suite reads 0 unexplained breaches with 8 rows excepted. Four of those eight are owed fixes, not lawful tails (E1''s 179, storage single-rate, carbon panel 6,
  EPG print scatter 373), so ''met in substance'' is the letter of leg one and not its spirit. The fifth cold read (32d7dff8d) graded leg two met and leg three not met. The reader confirmed the cap, EPG
  and EBSS to the penny and every bill''s VAT but one penny, and found two new classes. Both are about what a meter is, not about billing arithmetic: one serial on up to 34 supply points (N10, fixed in
  code by 6ef8f1b67 the same hour), and every gas read held and billed as a kWh register with no volume and no conversion (N11, K8 page e0f8c1fbe, not built). What it means: the billing engine is now priced
  right, and the record around it is not yet a record a real supplier could issue. New classes per read fell from eight to two, but these two sat in front of all four earlier readers and every blind row.
  That tells me leg three''s instrument sees only what its reader''s trade looks for. So I keep the exit test as the director wrote it, and change the sixth reader''s trade rather than call the exit near.
  Under F11, leg two is generous: the debt slot''s household is valid by its four checks, while the reader called the desk''s conduct barely modelled. That is the open after-the-last-rung GAP. The steer
  bit fully: all three previous items were drawn, two landed, and the storage-heating build exists (e400c589d plus its test fix 91ff886c9) but is on no remote ref, held by the worker landing it now. Commit
  split: 1 supplier, 0 world, 9 other. The nine are grades, the cold read and a K8 page, all about supplier billing, so the balance is supplier work. The four Lane 0 not_done rows are the same four the
  last record found spent. The checkout is 38 commits behind origin, and the daemons run billing code 15 commits old: the accepted fast-forward class. naive-organ has been quiet for 12h53m while the other
  seven daemons speak, so this is not a frozen guest, and I did not investigate it. Against the thesis this is still the precondition. There is no flat-rule baseline run and no lever, and the live renewal
  belief still ranks leavers backwards. Those resume only when a cold read finds no new class. The pages change at the 2 Nov publish.'
