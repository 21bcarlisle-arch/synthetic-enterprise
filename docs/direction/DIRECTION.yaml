thesis_read: >-
  This stretch had 7 commits, 2 of them substantive. By side: supplier 0, world 1, other 6. On the supplier side it
  went backwards: nothing the company decides changed in three hours, and the one substantive code landing was world
  work (G15 now hedges at Ofgem's published forward, 4f9da2316), which the supplier did not ask for. Against the thesis,
  nothing has been measured. s.12g ends about 06:30Z on 24 Nov, and the book every supplier grade reads comes after it.
  That will be about 87 hours with no book. The stretch's real finding is about the company, and it came out of chasing
  a red. Origin has been red on the live Consent offer since 7527a2e36 (773e2d9ba), and that red is what refused the
  gas-only win's landing. The probe (813c99cca) shows the only Consent offer the control ever saw went to
  ACC-SYN-2016-005, a household that left in June 2016. The desk opened its debt journey after it left and asked the
  world to fit a prepayment meter at a premise the company no longer supplied. 7527 removed that instance by collecting
  the level debit on the final bill, so the test lost its one example. But the class is still live: nothing on the
  Consent path asks whether the account is still supplied. A real supplier knows its own account closed. So this is an
  absurdity in how the company uses what it knows, not missing data, and it is the first item. Of last stretch's four
  focus items, two were drawn: the MSC re-landing (v2 is gating now, pid 3030428) and the pre-flight (increment 1 is
  landing, and increment 2 waits on its own 2016-2018 run). Two were never drawn. One is the renewal belief's held-back
  baseline, the only supplier item that needs no box and has a hard deadline (the book). The other is the checkout
  fast-forward, and the checkout is now 12 commits behind origin, not 5. I treat the steer as drifting on both. I keep
  them, rewritten so a worker can tell whether the premise is ripe. The landing machinery is still where work goes to
  die. Four commit gates are running together right now (pids 3042535, 3120172, 3349469, 3357808), with the
  consent-then-gas chain queued behind them. That is exactly the shape that killed the MSC gate at 05:56Z. The
  premise-not-yet-ripe row is corrected: b1c7d76b1 and 8aa5aa350 closed it, and no new instance has appeared in 36 hours.
  The brief's two premise_not_yet_ripe rows this stretch were right, because both name 07:00 on 24 Nov.
