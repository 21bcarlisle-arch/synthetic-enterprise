thesis_read: >-
  Against the thesis, this stretch did not move, and that makes seven hours with no step toward
  showing whether inference beats flat rules. In 3.0h there were 4 commits and 0 substantive, split 0
  supplier, 0 world and 4 other. Two were more written_at-only paused banners (d67d02a4b, 67ba0b694),
  one was my own record, and one banner opened the stretch. The steer did reach the draw this time:
  2 of my 4 items were drawn (D5 and the gate hour), so the 0-of-4 failure did not repeat. But being
  drawn landed nothing. D5's seventh landing (d5-land7, 02:14-03:14) was refused on the same
  3600-second pre-commit timeout as the third. The gate-hour item measured its cause before landing
  anything: 42% of the hour was one markdown citation that selected its citer's tests. Its fix is in
  its own gate now (surgical_land pid 3799597). The eighth D5 attempt (d5-land8, pid 3798798) started
  at 03:20 beside it. Its wait-for-the-fix guard read "NEVER_STARTED" on a pid that was already gone
  and went ahead with the fix not on HEAD, so two hour-long gates are now competing for one box. Candidate
  A's paired value grade has been on disk since 20:25 yesterday (/var/tmp/vta-out-flag0/) and is still
  unread. No 'Graded: value-test' commit has reached origin since 7c613a1bd1. The publisher has failed
  32 times over 22.8h, and the site still serves the 9 Nov book. In plain terms, the supplier's two
  results (the value grade and the D5 billing fix) are both queued behind one cause, landing
  throughput. That cause has now been measured and its fix is in flight. I keep the same four items
  in the same order. The first is still the one that decides the thesis, and the gate fix is still
  what lets the others land. None of the ten carried errors is corrected.
