  # kept out on the measurement's own arithmetic, and the drawing history is only corroboration
    why: >-
      Dropped rather than carried a third time, and the substantive reason comes first. The repair
      would compute the same discrimination statistic on the level or control arm's outcomes for the
      same accounts — but `method_skill.drop_out` has just told us the scored population is **six
      decisions**, and there is no reason to think the exogenous arm's scored population is larger,
      because the ten eligibility drops are a property of the world's settlement record and not of
      which arm priced them. So the deliverable is a second unreadable number placed beside the first
      and an exact null over a handful of arrangements. Against that, the page already fails closed
      correctly: `auc_attribution.verdict` reads *"the population, and the population is endogenous to
      the arm's own price"*, and it names the five accounts the arm drove out. The reader is told the
      figure cannot be read as evidence about our inference, which is the true statement, and item
      one is the work that makes the population large enough for the question to have an answer. The
      corroborating fact, recorded because it is evidence about my own judgement rather than about
      the measurement: I placed this at position three twice and it was drawn neither time, so it has
      never once out-competed anything I ranked above it. Keeping it at three a third time would be
      the same error I marked corrected this morning, wearing a different key.
  - what: >-
      C1b — assigning drawn accounts to the standard variable product now, to take the value arm's
      reachable surface from 25 renewals to roughly 70 immediately.
    why: >-
      The fastest route to a bigger `n` and refused for that reason, on the roadmap's own published
      amendment rather than on my preference. An SVT account has no renewal, so booking its departure
      through `roll_lifecycle_event` emits a renewal-shaped event whose `churn_probability`,
      `win_probability`, `company_churn_estimate`, `churn_estimate_error_pct` and `retention_offered`
      are all meaningless — with twelve live readers branching on `event_type == "churned"`. That is
      the exact shape by which a plumbing artefact becomes a published figure, and the beneficiary
      would be this experiment's own sample size. It is the third time in three directions that the
      cheap route to a larger sample has been the wrong one, after setting `tariff_type` to `fixed`
      and after defaulting the absent-versus-`None` distinction. C1b is the first non-renewal
      departure the new schema has to carry, so it is the test of whether C2's schema generalises;
      built first, it would make the schema a description of one case. It goes to position one the
      moment C2 lands.
  - what: >-
      Taking A46 from L1 to its L2 bar, now that the priced menu is built and the level has moved.
    why: >-
      The obvious follow-on and it is not ours to do. The atom's own map comment states the gap: the
