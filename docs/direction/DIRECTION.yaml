thesis_read: >-
  Against the thesis this stretch went sideways, and the machine ate the company for the fourth
  stretch running: all six substantive commits were git plumbing, no level moved, and 28 atoms are
  ungradable with 26 of them owing a repair — so the map cannot currently say what is true about
  the company even where the company is fine. Nothing touched inference-not-access, and the
  baseline-to-beat is not being run. What went right is real and worth naming: the three-item
  discipline held (three named, three drawn, which is this record's own acceptance test from last
  stretch), and two of the three landed genuine repairs — 62abd5e49 fixed `refresh_to_head`'s `-S`
  probe to ask the preserved commit's parent, and 63356067f reclassified the CLASS_ registers as
  producer output. THE DOOR REPAIR I TOLD THE NEXT SEAT TO GRADE DID LAND, SO THAT ERROR IS
  CORRECTED — and the grading turned up a third cause instead of an outcome. `git merge-base
  --is-ancestor origin/main HEAD` is still False: this checkout is 3 ahead and 37 behind, and
  62abd5e49, f1791deca, 023cde8f7 and 95ec3faa3 are ALL on origin and in none of HEAD. The repair
  is inert in the only tree that needed it, and the daemons are executing the pre-repair doors.
  The cause of the 74-hour dark publisher is now established and it is not a broken door: the fill
  is automatic and the drain is manual. A liveness heartbeat commits into this checkout every one
  to two hours and its own push fails — `push rc=1, origin=023cde8f7, head=6a422ea0f`, read from
  the ref and not the rc — so the ahead leg regenerates faster than any hand-run door closes it.
  `background/reconcile_watch.py`, the module named for reconciliation, contains no merge, no push
  and no call to `background.origin_reconcile`; it has logged `reconcile DRIFT (9 alarm(s));
  unchanged -> log only` every five minutes for the whole stretch and could not have done anything
  else. Three consecutive directions named this work, each found a real and different cause, each
  fix landed, and the gap went 20 to 29 to 37 — because every fix was an instance fix against a
  generator. The publisher has now refused 51 consecutive times over 71.7h and the figures a reader
  meets are 74.1h old, which means that even when company work resumes there is no surface on which
  it could be shown or graded. That is why this direction is plumbing once more, and it is the last
  stretch it should have to be: two of the three items below make the next outage drain itself and
  announce itself instead of needing a brief to be noticed.
