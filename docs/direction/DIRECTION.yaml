    why: >-
      218 of the 230 are right-censored -- still supplied, so no realised lifetime exists to grade
      against -- and engineering around that would be inventing the truth the gap exists to
      measure. What changed this stretch is that the exclusion is no longer invisible: the ledger
      now publishes the selection profile, the like-for-like resi ratio of 2.96x, and a control
      that fails if the scale attribution is ever published without it. Measured and declared beats
      engineered around. The counted set grew 5 to 33 on its own; waiting remains the instrument.
  - what: Working the 37 LATENT findings as a body.
    why: >-
      Focus item one takes exactly one of them and takes it because it is a broken control on the
      only thesis measurement this project has, not because it is on the pile. The tail would cost
      a stretch and close nothing the thesis needs, at the moment three items above are all sitting
