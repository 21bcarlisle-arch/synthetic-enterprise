  - id: one-field-is-published-a-hundredfold-apart-in-two-tables-of-one-report
    what: >-
      **New this orientation, measured not suspected, and live on origin.** Read
      `saas/reporting/annual_report.py` at lines **7152, 7165, 7182, 7195, 9033, 9049, 9057** before
      changing anything — it is one field read by two renderers that disagree about its units.

      `financial.annual[].avg_bill_shock_pct` is a **fraction** (2022 = `0.575`) published under a
      `_pct` name; `2118135e5`'s own note now says so in prose. Two tables in
      `docs/reports/ANNUAL_REPORT.md` render it:

      - *Bill Shock Analysis* (9049) multiplies by 100 → **`2022 | 57.5%`**, and its flag column is
        `avg >= 0.20` → **`HIGH` in all ten years**;
      - *Customer Service Quality* (7165) formats it raw → **`2022 | 0.58%`**, against a band the
        line above attributes to Ofgem — *"bill shock <0.20% (GREEN) / <0.30% (AMBER) / ≥0.30%
        (RED)"* — giving **`RED !` in all ten years**, and line 7195 prints *"Worst bill shock: 2022
        (0.58%)"*.

      **Three separable defects and they want three different repairs, so establish which before
      you touch one.** (i) The **units**: one of those two renderings is wrong and it is not a
      formatting preference — decide what the field is, name it so the name cannot be misread, and
      fix the renderer, not the field's callers one at a time. (ii) The **comparison**: a mean shock
      *magnitude* is being compared against a band whose own wording reads as an *incidence rate* —
      the report's other table publishes an incidence in the same rows (`Shock Rate`, 16%–23%).
      **Before dividing or comparing two numbers, say out loud what each one counts.** If the two
      quantities are not the same subject, the comparison does not become right by rescaling it.
      (iii) The **band's origin**: check `docs/market_research/` and
      `docs/domain_artefact_library/` for whether Ofgem publishes anything of this shape at all
      before repairing the number. **If nothing establishes it, that is a finding to file and the
      code carries the gap explicitly** — an honest refusal with a named reason beats a plausible
      band, and this one is currently attributed to a regulator in the company's own published
      report.

      **A verdict that is RED in all ten years and HIGH in all ten years has no reachable other
      branch** — the constant-verdict shape this project has a catalogue entry for. Whatever you land,
      **key the control to the property** (*the RAG's bands are reachable in both directions on the
      real series*), never to "2022 is the worst year", which pins today's answer.

      Both `7152` and `9049` read the field as `... or 0.0`. **A missing year currently publishes a
      measured zero**; fail it closed and say so on the surface.

      **Pathspec:** `saas/reporting/annual_report.py`, `tests/saas/`, `docs/reports/ANNUAL_REPORT.md`.
      Nothing under `tools/generate_dashboard_data.py` — that is item two's file.
    why: >-
      Third, and on merit it is the sharpest thing here: it is the only item where a **wrong number
      is being served right now under Poesys's name**, in the document `site/data/proof.json`,
      `evidence.json` and `simplified.json` all point a reader at. It ranks below item two only
      because item two's repair is already written and unpublished, and below item one only because
      item one is the long pole and this one is not. It is the project's own most expensive recurring
      shape twice over in one screen: *before measuring a thing, say what it is* — a magnitude and an
      incidence given the same name and then compared; and *a control whose PASS branch is
      unreachable reports a constant verdict* — ten years of RED that no state of the company could
      change. **A supplier's own annual report telling its reader that 2022's worst bill shock was
      0.58% when the same file says 57.5% is not a rounding disagreement**, and the epistemic
      argument the whole project rests on does not survive a reader finding it. **Done means:** one
      quantity, one name, one rendering across both tables, with the mean and the incidence named
      separately where both are published; the Ofgem attribution either sourced from the commons or
      removed and replaced with a stated refusal; the RAG demonstrated reachable in both directions
      or withdrawn; the `or 0.0` defaults failed closed; and a mutation-proven control keyed to the
      property. If the tables agree because one of them was deleted, say so explicitly — that is a
      legitimate answer and a silent deletion is not.
  - id: the-catch-all-class-ranks-first-because-it-is-a-catch-all
    what: >-
      **Read `docs/design/CLASS_DEBT_AND_CLOSURE_2026-09-01.md` before anything and do not redo it.**
      `adf4bed6e` and `bfc43b427` wired cumulative cost into `background/class_debt.py`, and
      `background/staging_rooms.work_queue()` reads `class_debt.drawable()` for the within-band order.
      The live ranking, read this orientation: `publish_gate_and_wedge` **n=56**,
      `controls_that_cannot_fail` **n=27**, `uncommitted_and_orphaned_work` **n=21**,
      `measurements_that_mirror` **n=10**, `no_caller_and_never_runs` **n=10**,
      `figures_on_a_superseded_clock` **n=4**.

      **(a) Close `figures_on_a_superseded_clock` first — it is the smallest and every item above it
      on this list is a member of it.** Items two and three are both *a figure served on an older
      clock than the code that computes it*. CLAUDE.md already names the rule — *every financial
      figure carries its clock* — enforced by the basis gate in `tools/generate_dashboard_data.py`.
      Every instance got past it because **the gate is keyed to that generator's own field names**,
      and the instances are on surfaces that never pass through it. Extend the requirement **from the
      fields to the property**, and key the leg to the property, not to today's four instances.
      Mutation-prove with `python3 -B`.

      **(b) Then split `publish_gate_and_wedge`**, which stands at **56 instances against a ruling
      covering 18**, with 9 arriving in the last seven days and no recorded decision. Its patterns
      grew it by matching **mechanisms** rather than a family (`\btmpfs\b|\boom\b`, `surgical_land`),
      so it holds two families with no shared repair — and it ranks first in the draw **partly
      because it is a catch-all**, which is the ranking being fooled by the thing it was built to
      rank. Establish the boundary by **reading the instances, not by pattern**. **Do not bulk-
      reclassify 56 archived documents on an unverified boundary** — that is a larger version of the
      defect being fixed.

      **The consolidation question is answered and stays answered.** §4 of that document rules **no
      merge**: a merged class has no single closing mechanism, and *a class you cannot close is not a
      class, it is a theme*. The warranted consolidation is a **split**. Do not re-litigate it and do
      not build a register of registers.

      **Pathspec:** `background/class_debt.py`, `background/finding_classes*`,
      `docs/design/CLASS_DEBT_AND_CLOSURE_2026-09-01.md`, `tests/background/`.
    why: >-
      Fourth for a second orientation, unchanged in content, and I am keeping it fourth deliberately
      rather than promoting it on the evidence that its subject keeps recurring — **three of the four
      items on this list are instances of (a)'s class, which is an argument for fixing the instances
      first and the classifier last.** Machinery outranking the world has been my ranking error in
      six of the last nine orientations and the one exception I made last time — the executor — has
      now paid for itself and is retired from this list. It stays on the list at all because
      `figures_on_a_superseded_clock` is genuinely small and genuinely closable, and because the
      ranking's first output was the finding that its own top class is top for the wrong reason;
      fixing that is what makes the mechanism a decision rather than bureaucracy. **Done means:**
      `figures_on_a_superseded_clock` either recorded closed with a property-keyed control landed and
      mutation-proven, or recorded as **not** closable with the reason; `publish_gate_and_wedge` split
      with the boundary argued from read instances and the patterns landed, no bulk reclassification;
      and the registers re-rendered so the draw order reflects it. If it produces a new register or an
      inventory, it has gone wrong.
