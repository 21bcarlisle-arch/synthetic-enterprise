      it, and it is a `.py` file rather than JSON, so if the repair moves it but not the three
      artefacts, the repair missed. Re-run the census afterwards and state the count WITH its
      composition and with the instrument change named, so nobody reads 19 against 20, 25 or 27 as
      a trend.
    why: >-
      This class is on its thirteenth listing and this is the first record in which it is the direct
      cause of a thesis figure not reaching a reader — which is what moves it from drainage to
      obstruction and why it is ranked ahead of `say-what-the-ceiling-is-and-price-what-this-book-can-settle`
      rather than last. Last stretch
      made the refusal HONEST (it now names the conflation in its own text) without making it TRUE,
      and an honest refusal that refuses everything is still a door nobody can walk through. It is
      ranked here knowing that on the literal reading of my own condition in `wrong` this ranks a
