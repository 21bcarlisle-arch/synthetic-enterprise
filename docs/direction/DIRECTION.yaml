thesis_read: >-
  Two commits this stretch, one substantive and on the supplier side (supplier 1, world 0, other 1). The previous
  focus was drawn 2 of 3, and two of its items finished and leave focus. The first-term cap hold's deletion is
  pre-registered and built off (ee7d60bbd). Building it turned up the stretch's real supplier finding: a won first
  term is contracted on a different strike from the one it was quoted on. The campaign quotes through
  growth_desk.quote_first_term (ladder, operating-cost line, gated at the default). The run then contracts the
  account through renewals.price_fixed_term, which is spot-led at the notice date. On 151 won fixed terms the
  contracted strike in 2021 sits up to 1.54 times the cap, and only the cap hold pulls it back. In 2023-24 it sits a
  median 31% and 18% under the market's cheapest fix, where the quote sat 4.5% and 5.1% under. So the company wins
  on one number and bills another. Until that is fixed, its first-year margin cannot test whether the price
  decision was a good one, and the margin given away in 2023-24 is transfer, not inference (M2). It is now focus 1.
  MY LAST DIRECTION WAS WRONG A SECOND TIME, and the worker corrected it. My focus 1 said 9 dirty imports in the
  shared checkout deferred the book. They do not. Since b1c7d76b16 (22 Nov) sim-runner builds the book in its own
  worktree, which reads admitted. The probe I wrote read the shared root. The shared tree's real harm was that its
  stale next_book_requires.yaml lacked the MSC hold row, so the book would have built without MSC once s.12g freed
  memory. The worker wrote origin's bytes over the clean shared copy at 00:43Z and armed a follow unit for the fill
  (37a2b7283). sim-runner has logged "MSC replacement win ... has not landed" every 5 minutes since. So the hand
  order MSC-then-book is now live. Both seat rows are corrected below, and the probe lesson is recorded beside
  them. The book is still unbuilt after about 84 hours. Its order is now set and visible: s.12g ends around 06:00Z
  (arm A, pid 677395, 8h49m in, /var/tmp/vtn-out/A still empty), then land8 gates MSC (prediction: a timeout), then
  either MSC's sha fills the row or the row is deleted, and then the book starts. The hold file also expires at
  the end of 24 Nov. Against the thesis, nothing moved this stretch: whether the per-customer arm beats the
  flat-rules twin is still unanswered and waits on arm A. Its reader is queued.
