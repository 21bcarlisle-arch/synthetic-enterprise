thesis_read: >-
  THE WORLD CAN REFUSE NOW, AND THE FLAT RULE STILL BEATS THE PER-CUSTOMER VIEW. The retake's
  three-arm run at the belief commit (0cc052102, one seed) finished at 17:16Z. Level leg +£15,701,
  value arm +£11,493, selection -£4,208. The pre-registered Q1 is refuted on its face. It predicted
  the level leg would fall below £12,400 once 55 of 64 above-default fixes became refusable. It rose,
  slightly, from +£15,115. So the refusable fixes were not what carried the level leg. The advantage
  that exists is still a uniform margin, which is a flat rule and not inference. Q2 holds: the whole
  advantage is positive. Selection is worse than 1002b's -£259. It still sits inside that floor's
  range (-£7,542 to -£404), so on one seed and with no floor on this commit I cannot yet say it
  moved. The belief's own one-variable reading points the same way: diff minus no-diff was -£3,499
  on one seed, inside one stdev of a floor drawn on another commit. P1 is +0.29 at n=8, which
  cannot be told from the no-diff arm's -0.08. The belief is on origin and wall-safe, so the error
  it remedied is corrected. It is NOT shown to work. On every reading in hand, the per-customer arm
  does no better than a flat margin, and possibly worse. That is the thesis test, and so far it says
  "not yet". The floor that would bound this reading never ran. resource_headroom admitted it, then
  the floor's own inner gate refused it beside a resident depth-vs-width leg, and the unit exited 88
  rather than waiting. That is item one. The previous focus bit on all three items. Item one landed
  (0cc052102, graded 4ed1fa774). Item two produced half its pair. Item three's subject row now reads
  premise_spent (8c29e03d9), so the tou bind is done: that corrects my carried not_now row for that
  instance, but its own ledger row reads not_done, because a ledger write has no commit to bind. The
  shared checkout's ahead leg closed (0 ahead) while the behind leg grew to 43, and 3 of 12 commits
  were empty merges. Depth-vs-width is 5 of 12 legs in, roughly 6h from done.
