focus:
- id: a-credit-bill-meets-the-scheme-debit-before-the-next-bill
  lane: D_billing_metering
  side: supplier
  what: 'Build D1 exactly as the K8 page on origin says (c5f52ed3d, docs/market_research/payments_and_direct_debit_2026-10-25.md,
    and SEAT_FINDING_A_CREDIT_BILL_WAITS_FOR_THE_NEXT_BILL_IN_THE_WORLD_AND_MEETS_THE_SCHEME_DEBIT_ON_THE_PAGE_2026-11-10.md):
    on a leg that has left level DD while owing its scheme debit, a credit bill meets that debit first,
    and only the excess waits for the next bill. The world and the page must take the same path. First,
    look at what is already in flight. A worker (claude pid 3282603) and two pytest runs on occupier/EBSS
    and gas-leg tests were live at 00:21Z. The worktree /var/tmp/wt-d1-credit-scheme-debit is clean apart
    from salvage e158df903, which holds only bookkeeping files and is disposable. Before touching code,
    file the prediction in the finding: SYN-2016-549''s 22 left-level PAGE_BALANCE steps on the regenerated
    control at origin head, the count after the fix, and which other legs move. Then write a control that
    fails without the fix. Regenerate the control from 068b5e3cc8''s run output through the fixed code,
    write held or fell beside the prediction, and land by pathspec.'
  why: 'This is the last gate row on the head book: 22 steps on 1 row, every one on 549. The early publish
    the director said yes to on 8 Nov, the tenth cold read, the corrected renewal belief and the baseline
    comparison all wait on a passing book. Done means the fix and its failing-without-it control are on
    origin, and the regenerated control reads 0 unexcepted PAGE_BALANCE steps on 549. Otherwise a residual
    is named with its cause and an owner.'
  written_at: 1794356753.725
- id: the-first-book-carrying-d1-is-run-graded-and-offered-to-the-publisher
  lane: D_billing_metering
  side: supplier
  what: 'Once D1 is on origin, pre-register the next head book''s table before it starts: the 068b5e3cc8
    rows, plus D1''s filed effect, plus class L''s over-refund row if item 3 has landed. Launch it through
    launch_long_job with its grade chain, as 068b5e3cc8 was launched (/var/tmp/grade-head). First check
    `ps` and `systemctl --user list-units ''longjob-*''` so that nothing is launched twice. Grade it with
    held or fell beside every row and a Graded: trailer for the learning loop. If the gate passes, offer
    the book to the publisher at once under the director''s 8 Nov yes (early publish, then the Monday
    anchor resumes), and lift the embargo on the-tenth-cold-read-on-the-first-book-that-passes-the-gate.
    If it fails, name every remaining class with its count and owner.'
  why: Nothing the supplier infers can reach the site, or be set against the flat baseline, until a book
    passes. The early-publish commitment is already past its 10 Nov due date. Done means the book is graded
    on origin. If it passed, it has been offered to the publisher. The book does not have to pass.
  written_at: 1794356753.725
- id: class-l-over-refunds-six-legs-past-the-page-credit
  lane: D_billing_metering
  side: supplier
  what: 'Class L''s run half refunds past the credit the page prints on 6 legs: OCC-caee88f5fe53, PROS-2017-0351,
    PROS-2019-0318, PROS-2020-0012, PROS-2020-0191 and SYN-2016-369. That is GBP 833.30 into page debit
    on 068b5e3cc8 (e6c1c11b4). Do the one walk the grade names. Compare SYN-2016-369''s 2024 collections
    in the run output with its page payments around the 2024-08-20 refund (303.65 on head, 34.67 in arm
    b). Decide between (i) the run half keeps a level collection the page half does not print, because
    the two halves key on different predicates, and (ii) the run''s refund counts the kept collection
    twice. Write down which before fixing. Fix it with a control that fails without the fix, and pre-register
    what happens to the 6 legs and to the written-off-printing-owed row (29, GBP 1,374.58; PROS-2019-0318''s
    +42.53 is this refund). Fold the queued continuation a-scheme-credit-month-keeps-its-level-collection
    (PROS-2019-0318, 2 x GBP 62.48) into the same walk if it is the same predicate split. Otherwise leave
    it in the queue.'
  why: A refund to a household that is already in debt is money paid out wrongly. The gate cannot see
    it, so a passing book would publish it. Done means the cause is chosen with evidence, the fix and
    its control are on origin, and the 6 legs have a pre-registered count for the next book to grade.
  written_at: 1794356753.725
- id: a-refund-never-exceeds-the-credit-the-page-shows-written-blind
  lane: D_billing_metering
  side: supplier
  what: 'Following step 4 of the 26 Oct ruling (docs/staging/advisor/DIRECTOR_RULING_CORRECTNESS_BEFORE_THE_NEXT_FEATURE_2026-10-26.md),
    write the invariant "a refund never exceeds the credit the page shows on the day it is paid" into
    company/compliance/domain_invariants.py and the gate. The writer must work blind to company/billing''s
    refund code: from the rule and the page feed only, not from the code under test. This must be a different
    tick from item 3''s builder. Prove that it fires on 068b5e3cc8''s run output (6 legs expected), and
    that a synthetic leg refunded exactly to zero passes.'
  why: e6c1c11b4 found the class and filed it for a blind writer, not for the author of the fix. Without
    it, the gate certifies a book that refunds debtors. Done means the invariant is on origin, red on
    068b5e3cc8 for the named legs and green on the zero-refund case.
  written_at: 1794356753.725
