thesis_read: >-
  The thesis test moved one step and it was a step of knowledge, not of money. s.12f (a2c848965) graded skip1:
  k = 0 of 9, REFUTE. Skipping the 0.30 cut on save odds is not the lever. skip1 weighed 58 renewals under the
  cutoff and offered on none. The reader's exit 2 was the reader's fault, not the log's. SYN-2016-468 had already
  left in 2017, and SYN-2016-581 sat on SVT with no fixed term ending. The reader was fixed (v3) and re-run on the
  same files with rc 0, so that error is corrected. The value arm is still worse than the flat book: skip1 minus A is
  -GBP 4.57 (-7.26 to -2.24). s.12f pre-registered, before skip0 reads, that the loss is the weighing's and not the
  skip's (d0 about -4.5, d1 about 0). skip0 is still running (pid 341142), and its control file does not exist at
  03:20Z. The same section did the useful thing. It read why the per-customer arm misses leavers: A's belief is
  inverted just under the cut, with about 41% of renewals between 0.12 and 0.30 leaving against 10% above 0.30. It
  then pre-registered the next lever (a cut at 0.12, with a mechanics bar, a money bar and an M2 transfer check)
  before any build. So the supplier still trails the flat baseline, and we now know where the inference is
  wrong, which is what has to be true before it can be made right. Two machine faults cost this stretch most of
  its supplier output. First, D48's measurement was done but never landed. Its surgical_land gate ran inside the
  seat-executor's bounded unit and was SIGKILLed at the 5400 s teardown at 00:47Z, so the coupled-gap tool, the
  ledger rows and the finding sit uncommitted in the shared tree. It did not lose a race to origin. With no
  written_at banner commit in this stretch either, the landing-race row is graded corrected on its own criterion.
  Second, the executor redrew the spent skip1 item about eight times between 01:56Z and 03:16Z, landing nothing,
  because focus still named it. So the E7 crossing-bill item and KNIFE3 never reached a tick, for the second
  stretch running. That steer is drifting, and this record removes the dead head that blocked it. The commit split
  reads 0 supplier, 1 world and 6 other. That is the wrong shape, and it is why every focus item below is
  supplier-side and none needs the box before skip0 reads. D48's unlanded reading says the company's published
  gas profile puts about 1.2 points more of the year into each winter month than the world's homes use. 49c72d95e
  says the world's 70% heating fraction is below DESNZ's ~85%. So that gap is probably the world's, and it is held
  in not_now until the value-test pairs stop needing one fixed world.
