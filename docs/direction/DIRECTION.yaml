- id: the-fresh-run-carries-both-fixes-and-retires-the-exceptions
  lane: D_billing_metering
  side: supplier
  what: 'Wait until origin carries both in-flight landings: the occupier EBSS credit (surgical_land pid
    2536216) and the prepayment default tariff held at its own cap column (pid 2678688). Do not land them
    yourself. Then do four things from an origin/main worktree pinned at that sha. (a) Have an agent that
    has not read the code under test add two rows to docs/design/DOMAIN_INVARIANTS.yaml, citing their
    sources. The rows are ''one register id carries one label'' and ''a meter serial keeps its register
    count unless a recorded exchange changes it''; the 871f674a2 grade counted 39 and 66 of these with
    no row to grade them. (b) Write a pre-registration in docs/staging/records/ before launch. Predict
    INV_UNIT_RATE_SVT_ELEC and _GAS 0, both standing-charge invariants 0 under printed_pence, 11 of 22
    occupier months credited, and total_occupier_debt down by at most GBP 737. Say what c688a5e61 (Unidentified
    Gas) and b67d8c3ee (hub-shared smart mode) are predicted to move. (c) Launch one fresh default-book
    run with launch_long_job, and queue its grade continuation in the same act, naming its DONE.json.
    (d) When it finishes, grade it with /var/tmp/fresh-run-scripts/grade.sh. Leave the predictions unedited.
    Retire every exception the grade zeroes, and trace INV_PERIODS_CONTIGUOUS if it persists. If either
    landing fails, launch on what origin holds and mark that landing''s predictions void.'
  why: This is the exit test's first leg, and it is the only route to retiring the unit-rate exceptions,
    which are a real prepayment overcharge. Done means the grade is in the finding on origin with each
    prediction marked held or refuted. DOMAIN_INVARIANT_EXCEPTIONS.yaml must then carry no exception whose
    cause is unexplained, and every breach the 871f674a2 grade counted must be graded by a suite row.
