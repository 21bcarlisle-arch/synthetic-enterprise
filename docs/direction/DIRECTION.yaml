thesis_read: 'Against the thesis, the stretch moved one supplier-facing step and then stalled on the machine. The
  split is 3 world, 0 supplier, 5 other. The world commit that matters is 637c051d2: a won gas first term now bills
  the gas rate the household was quoted. Gas was the last leg on which a household was charged a price it never
  saw. Until it landed, the cap hold could not be removed without a transfer (M2), and B8 could not flip. S3''s
  losses gross-up and the failed-level-final credit fix also landed. The rest is bookkeeping. What it MEANS: the
  per-customer-against-flat comparison, the thesis''s only baseline test, is no closer than it was at 09:24. Its
  prediction was never filed, and every run it depends on is in a queue, not on a CPU. The previous focus had 4
  items: the gas quote landed and leaves focus. The fix0 refit moved (the whole-book fit emits 2021 = 22.10) and
  now waits on a capture under that anchor, so it leaves focus to its held continuation. The rankq prediction was
  not filed and stays, under a new id. Memory attribution stays. The real finding is about the machine. The admission
  gate has kept the S3 arm (3h36m), the anchor7 capture, the S2 pair and the memgrowth probe queued. It counts 18,958
  MB co-resident, while the guest reports 7,780 MB used, and 11,981 MB of that count is one head-green census. My
  09:24 record read those launcher pids as running jobs; that is my error, listed below. One downstream disagreement
  comes ahead of new work, and it is focus 1: nothing graded this week can be read until admission counts what is
  actually resident.'
