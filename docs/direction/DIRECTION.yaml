focus:
  - id: selection-leg-carries-its-live-world-floor
    what: >-
      In `tools/generate_value_arms_data.py`, read
      `docs/observability/value_cycle_ab_s1_noise_floor_20260903.json` and compare its
      `world_identity.digest` with the world the current-world run reports; if they match, publish
      that floor's `selection_gbp` centre, range and how many of its re-draws clear, beside
      `current_world.selection_gbp`, in the same withheld-verdict grammar `value_advantage_gbp`
      already uses, and if they do not match say that on the page instead. In the same change make
      the top-level `contrast_bounds` block state the world digest it was measured in, and refuse
      with the reason on the page when the artefact it came from carries none.
    why: >-
      `selection_gbp` is the only leg here that could be value creation rather than transfer, so it
      is the thesis itself. The page states it as +£2,177 while the only selection spread it carries
      is ±£3,776 from a world the same page has declared dead, and the live floor on disk centres at
      −£1,861 across −£8,634 to +£2,350. This is the identical omission repaired for the value leg
      last stretch, one leg down and unchecked. Finished when a reader can see the creation leg's
      own centre and range in the live world, and no bound on that page is unstamped.
  - id: departure-level-stops-being-fitted-to-its-own-check
    what: >-
      Discharge the tree's only BLOCKING finding,
      `docs/staging/SEAT_FINDING_THE_LEVEL_IS_CLAMPED_AND_THE_MECHANISM_UNDER_IT_IS_COMPRESSED_NOT_MISDIRECTED_2026-09-03.md`,
      by the route `DIRECTOR_CANON_WORLD_VALIDATION_LADDER_2026-08-31` rung 1 names: stop solving
      `year_level_anchor` onto the published switching rate in `fit_whole_book`, repair downward
      into the individual model's attributes and rationale, then measure the emergent level against
      the band and record which years fall outside it and by how much. Do not move the solver to a
      different point in the band and do not escalate the choice of one — that recommendation is
      recorded in the finding's own section 0 as already ruled out by canon.
    why: >-
      Achieved equals published to four decimal places in all seven fitted years by construction, so
      the band cannot fail and the world cannot press back on the surface that every arm comparison
      sits on. A world fitted to its own check cannot tell value created from value transferred,
      which is the precondition the whole enterprise rests on. Finished when the band is a check the
      world can fail and the record says plainly which years it fails.
  - id: orientation-grades-the-branch-work-lands-to
    what: >-
      Read `background/delivery_seat.py` first — as of this orientation every git call runs at
      `cwd=PROJECT_DIR` and `grep -n origin` over the module returns nothing, so confirm that before
      changing anything. Then make the stretch the brief grades include what has landed on
      `origin/main` and is not in the shared tree's HEAD, and when the two diverge make the brief
      say so rather than silently grading one of them.
    why: >-
      Open for a fourth stretch. This brief's 12 commits are right only because
      `git rev-list --left-right --count HEAD...origin/main` returned `0 0` at the moment I measured
      it, the same luck as the previous three, while
      `WORKER_FINDING_REPEATING_ALARM_PUBLISH_REFUSED_ORIGIN_AHEAD_ORIGIN_MAIN_IS_COMMIT_S_AHEAD_2026-09-03.md`
      sits in the staging root from the condition firing for real. Every judgement in this file is
      made on that instrument. Finished when a stretch measured while origin is ahead reports the
      same work as one measured while it is not.
  - id: a-prereg-states-what-it-could-have-detected
    what: >-
      Change the pre-registration format under `docs/staging/records/` so a prediction must state,
      before the run, the smallest effect its chosen statistic could distinguish at the n it will
      actually have, and so the write-up grades that clause beside the prediction. Apply it to the
      two cases already in the tree rather than to a hypothetical one — the Spearman over seven
      fitted years, and any selection-leg reading taken at three seeds.
    why: >-
      This project files predictions honestly and then measures them with instruments that could not
      have refuted them: the Spearman's exact permutation null needed |rho| at least 0.75 and
      returned +0.32, and the live selection leg is a £2,177 figure carrying a £3,420 standard error
      at n=3. Both are from this stretch and one of them is the thesis's own leg, so this is not
      hygiene. Finished when a pre-registration that cannot detect its own effect is visible as such
      before it runs rather than in its own grading.
