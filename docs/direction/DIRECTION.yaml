thesis_read: 'The stretch made the published bills checkable against outside sources, and it found that the household''s
  own mandate cancel never reaches the supplier. Against the thesis, that is a correctness gain and no inference
  gain. f5c50ec96 graded 27,197 default-tariff term periods of 4ae8da9b0f against Ofgem''s published cap: 0 above
  it, every rate at its ceiling. So the ruling''s fear that SVTs sat materially under the cap through 2021-22 is
  not borne out on the cap side; the wholesale floor is queued. 8523e6025 and 3afbc4203 make each bill agree with
  the tariff it was sold at, and a bill across a price change now prints a line per rate (K8 page 73dc17d8c). The
  mandate run, my last item 3, was launched from an origin worktree and graded (2f650ca8e). In neither arm does
  an ADDACS 1 reach the desk, because under one payment truth the rails emit the advice only when told is None,
  which is 6 of 1,046 legs. So W2_41 stays at 1, and the supplier keeps a live mandate the household has already
  cancelled. f89db6ff3''s net prediction held for the decade (-GBP 665 net against -GBP 2,051 gross) and was refuted
  by year, 3 of 10 flipping sign. The commit split is supplier 2, world 0, other 15. Most of the other was the director''s
  Explore steer and the validator legs, which is correctness work under his ruling and not drift. Of my last four
  items, two were drawn: the mandate run (graded) and B13 (mid-landing now, surgical_land pid 3994841). The crisis
  item was not drawn, and reading it this time shows it was my framing error: the two controls answer different
  questions, and both are right (wrong row). The shared-tree item was ordered behind B13 and waits on it. The director''s
  18:30 ruling now sets the order: correctness before the next feature, with an exit test of an invariant suite
  run on a fresh book with zero unexplained breaches, eight Explore slots valid or honestly empty, and one clean
  cold read. Its first step landed (049bd68db), and its cap step is measured. Its root causes (the read duty that
  let 250 of 752 households go over a year on estimates, prepayment billed as credit) and its suite are not started,
  and the draw does not read the ruling yet. This focus is those, in that order. The ruling file stays live in docs/staging/advisor/
  on origin until its exit test is reported. The shared checkout is 34 behind origin, so it does not show that file.'
