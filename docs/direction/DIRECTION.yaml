thesis_read: 'The thesis test has not moved: the supplier still trails its flat-rules baseline by GBP 1.35 per household-year
  on A''s belief. What changed is that the box is finally clearing. Pair 3 of flag 1 is on disk (control_55555_66666.json).
  The owed book on 6af7fd0bfd, the first to carry every next_book_requires fix, passed the publish gate at 09:20:49Z
  after 59 refusals over 52.7h, and process_run_complete (pid 4139513) is committing it now. vts-threshold-skip-watch
  is armed to launch the skip pair next. So within a few hours the five billing rows that all hang on the publish
  can be graded, and skip1 decides s.12e''s branch. I am not marking any of those rows corrected until the provenance
  is on origin. The stretch itself was the director''s 18 Nov steer, and its answer is narrower than it sounds.
  A harness instrument (tools/strategy_cash_hole_2021_22.py) ranks the cap-tracking survivor S5 ahead of the four
  failed strategies, with a band of about GBP 45 to 284 per customer and no inversions, under three weathers and
  three gas prices, now including a real daily SAP. But that ranking comes from setting the real price path against
  the cap index, not from the world''s own mechanics. Weather moves every strategy by about GBP 48, and daily shape
  by about GBP 16, identically across strategies, because every disclosed hedge is baseload. So the world passes
  the ranking test, but this instrument cannot tell a discriminating world from correct price arithmetic. It does
  not yet license reading the per-customer result as inference rather than artefact. I am recording that and leaving
  the world steer there, because the supplier test is now the thing the box can actually serve. The commit split
  reads 0 supplier, 1 world and 14 other. The substance was all world-steer work tagged other, plus 3 no-work merges
  and 5 publish-wedge re-asks, so this stretch went sideways for the supplier, not backwards. The previous focus
  drew 2 of 4. skip1 and W3_3 were correctly held on a named file and on the publish, so the steer did not drift.
  The steer item world-ranks-real-2021-22-supplier-strategies is done (page amended, strategies and orderings pre-registered,
  instrument built, three tests read) and leaves focus. The landing that brought the daily gas price also left a
  census test red on origin. That is the stretch''s one new machine defect, and it goes in focus because a red trunk
  taxes every lane.'
