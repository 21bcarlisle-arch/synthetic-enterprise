focus:
- id: the-value-arm-loses-money-on-the-better-belief
  what: 'Read why the value arm with A''s belief loses GBP 1.21 per household-year where the flat book
    with the same belief gains GBP 0.14. Use only the pairs already on disk: /var/tmp/vta-out-flag0/member_11111_22222.json
    and control_11111_22222.json (flag off), and /var/tmp/vta-out-flag1/member_11111_22222.json and control_11111_22222.json
    (flag on). Launch nothing. Step 6 holds the box. FIRST, before any read, add a section 12 to docs/design/THE_VALUE_TEST_REDESIGN.md
    that pre-registers a predicted share of the loss for each candidate section 10 names. (a) Retention
    offers move to households the value arm''s pricing already kept. (b) Offers it used to make by accident
    to leavers worth keeping are lost. (c) The dice. THEN, for the 101 households that moved, write each
    one''s decision difference (offer or price, by date) and its money difference. Attribute the GBP 1.21
    across (a), (b), (c) and a residual named "unexplained", and grade the prediction with a Graded value-test
    trailer.'
  why: This is the thesis question in its sharpest form, and it went undrawn last stretch behind harness
    continuations. Inference improved, and the per-customer supplier lost money with it, so either a lever
    spends good inference badly or the value arm's objective is wrong. Step 6 sizes the loss and cannot
    explain it, and the renewal retrain (B) would stack on top of it. It needs no box time. Done means
    section 12 is on origin with its prediction filed before the read, the 101-household attribution and
    the grade trailer, and one named next change (a lever, the objective, or "we cannot tell, the dice")
    that step 6's read can confirm or refute.
  lane: B_commercial
  side: supplier
  written_at: 1794907658.034
- id: the-d5-book-runs-at-step-6s-next-pair-boundary
  what: Get one D5-on book run and graded without losing step 6's work. Step 6 (longjob-value-test-step-6-flag1.service,
    driver /var/tmp/vta-driver/driver.py) runs its draws as pairs in child processes and skips any pair
    whose member and sidecar files already exist. sim-runner yields to any resident long job, so it has
    deferred every cycle since 06:11. Wait until both /var/tmp/vta-out-flag1/member_33333_44444.json and
    control_33333_44444.json exist (expected near 16:45Z). Then stop the unit at once, so the next pair
    is lost by minutes at most. Let sim-runner run its next cycle on origin (which carries 341df4965 and
    a27902df3). When the book's run_complete lands, relaunch step 6 through background/launch_long_job.py
    with the same unit, argv, VTA_FLAG=1 and commit 41734bbe71, and confirm in its log that it skipped
    11111_22222 and 33333_44444. Read the book against the publish gate. Grade rows 4 and 7 against docs/staging/SEAT_FINDING_D5_SWITCH_ON_PRE_REGISTRATION_ROWS_4_AND_7_2026-11-17.md.
    For every row still refusing (the 16 Nov refusal named 2, 5 and 1), name its cause and owner in the
    BLOCKING VAT finding or a new one. Record the pause and the relaunch in the step 6 continuation's
    notes so its grade knows the family was split.
  why: Billing accuracy is first in the director's order. Every published-book check waits on a book newer
    than 9 Nov (the cold read, the Capabilities strip on f4f825b8b, the final_month_nets grade, the catch-up
    VAT check, then W3_3). Without this the wait is about 50h. With it the cost is about two hours of
    step 6, and step 6 keeps every pair it has finished. Done means a D5-on book has run, step 6 is running
    again from its third pair, rows 4 and 7 are graded on that book, and either a verified publish carries
    it or every refusing row is named with its cause and an owner.
  lane: D_billing_metering
  side: supplier
  written_at: 1794907658.034
- id: the-paused-banner-commits-only-on-a-change
  what: background/process_run_complete.py, together with background/publish_freshness.py, commits the
    verification-paused banner in site/data/publish_provenance.json about once an hour while verification
    is paused. 6c025b3b9 this stretch, like 0ad9d831a, 3127e048b, d67d02a4b and 67ba0b694 before it, differs
    only in written_at. Make the banner commit only when a field other than written_at changes. Add a
    control showing that re-pausing in an identical state makes no commit and that a changed state still
    does, and mutate it both ways.
  why: d5-land9's C2 lost two races to origin moves before it was refused as the primary checkout one
    commit behind, and each lost race costs about 36 minutes of re-gating. A banner that carries no change
    is the one origin move we can remove for nothing. Done means the control is on origin, and the next
    stretch's commit list has no banner commit whose only change is written_at.
  lane: H_harness
  side: other
  written_at: 1794907658.034
not_now:
  - what: Letting step 6 run its full 53h and publishing the D5 book after it.
    why: >-
      That holds every published-book check for about two more days to save about two hours of a run
      that sizes an effect and cannot explain it. Step 6 skips finished pairs, so pausing at a boundary
      loses no draw.
  - what: Running the D5 book beside step 6 by overriding sim-runner's yield.
    why: >-
      There is 11.5 GB available now. Step 6's child is at 6.5 GB and declared to peak near 11.5 GB,
      and a book needs about 7 GB. An OOM mid-pair would cost up to about ten hours of step 6, which
      is more than the pause costs.
  - what: Stopping step 6 now, mid-pair, to run the book this morning.
    why: >-
      The pair in flight is 3.2h into about 10.6h, so it would throw away three hours to gain seven.
      The boundary is the cheap moment.
  - what: Launching the flag-off half of step 6, or the renewal retrain B.
    why: >-
      Each peaks near 11.5 GB. B must beat A's value-test AUC, and if the value arm turns good ranking
      into lost money, B's better ranking inherits the loss. Read the loss (focus 1) first.
  - what: Landing W3_3 (settlement books the standing charge) from origin/w3-3-network-split-held.
    why: >-
      One change per book. W3_3 stacked on D5 would leave a moved row that cannot be attributed to
      either change. W3_3 follows the first D5-fixed publish.
  - what: Raising the acceptance-rate proposal to the director.
    why: >-
      Its own pre-registered rule and a second coder agree that no kind qualifies yet. Measurement is
      15 of 16 with a bound of 0.76, and the advisor channel only stages his yeses. Answer codes at
      answer time (continuation director-answer-code-at-answer-time) make the next count
      coder-independent, and it is raised then if a kind clears.
  - what: Re-ordering the continuation queue so focus outranks it.
    why: >-
      Today's continuations are the director's own steers and their grades, which rightly come first.
      The cost was one stretch. If the next record's first item is also undrawn while continuations
      hold the executor, that is the moment to change the order, not before.
  - what: The canon-drift BLOCKING finding (WORKER_FINDING_THE_CANON_DRIFTS_FROM_THE_CODE_0A2E477ACB).
    why: It refuses no book and touches no supplier result. The ordinary draw can take it.
  - what: Reaping the at-risk October worktrees (b12-*, se-budgetpay-land, se-om2, simsuite).
    why: They block no supplier result, and reaping cannot be undone.
