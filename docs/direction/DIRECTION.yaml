thesis_read: >-
  The thesis test now has a written design that can return an answer, and that design predicts no
  advantage yet. 2 commits, 1 substantive, split 0 supplier, 0 world, 2 other, so no supplier
  capability changed this stretch. 16d90c311 brought THE_VALUE_TEST_REDESIGN.md up to the 13 Nov
  steer and opens the 16 Nov balance review with it. It computes the existing runs per household per
  year without re-running anything. The belief's AUC against who left under the flat price is 0.52
  (0.41 to 0.65), and its calibration is -0.22. The per-customer arm's advantage is +GBP 2.86 per
  household-year, 0.6 standard errors from zero. It also corrects the page's 13.7 SEMs, which were the
  re-draw spread and not the spread between households, beside the claim. Its own pre-registered P1
  and P3 predict the sized run will find no skill and an advantage whose interval includes zero. So
  the honest position is unchanged and is now stated in a form the director can read: we have no
  evidence that per-customer inference beats the flat baseline, because the belief does not yet infer
  anything. The run will measure that, but it will not fix it. That item leaves focus as done. Its
  next step is the 12-draw family (step 1, about 0.9 points and 9 machine-hours at 45122d156), which
  settles the book size for the sized run. I am putting it first now rather than on Monday, so that
  it runs on idle weekend compute. Both landings in last stretch's focus died again with nothing on
  origin. The refund clock's fourth attempt (pid 1307691) is gone, and its fifth (pid 3077815) is 23
  minutes into its gate. The Capabilities attempt (pid 1430307) is gone, and its second (pid 3058669)
  is 25 minutes in. It carries both 13 Nov advisor files to done/, and they are staged now. Five dead
  landings on two rows in two days is now the machine's main drag on supplier work. The STOP readings
  on level-dd and repayment-posting still hold every new fix in those areas until the 16 Nov book.
  One error of record is the redesign's own: it says the two questions that wait for the director are
  in a for_the_director row, and no such row existed. I raise it in this record.
