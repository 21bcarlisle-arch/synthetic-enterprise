thesis_read: >-
  The thesis is back on a test that can answer it. It has no answer yet, and that is the honest
  position. The old design is closed at the point where it stopped being informative. On unseen
  seeds 55555 and 66666 (51417dba4), L1, L3 and L4 held. Both seeds reproduced seen seeds to within
  £0.47, which is 7413b3ea2's mechanism observed directly. So the ab5 "+£1,000, CI clear of zero"
  now reads as conditional on one set of renewal rolls. L2 is withdrawn, not refuted. ab6 is
  running as longjob-ab6-single-roll at the a322166cc pin. Bridge leg B started 04:26:47Z and has
  finished one of its two seeds. At about 93 min a seed, runB6.json is due around 07:35Z and
  runP2.json around 13:45Z. The ab6 prereg's own P2 puts about 70% on "this book cannot sign D
  under its own renewal noise". That would be a result, not a failure, and the design that follows
  it should be pre-registered before the pilot answers, not after. HEAD has also moved past the
  pin under ab6: f9b04ddc7 and 46b78123f re-centre the company's engagement prior and change the
  seam, and c5e30c230 changes how a leaving household's gas leg closes. Chasing HEAD would never
  finish, so ab6 stays pinned, and its grade must say that it describes a322166cc. PB6 moved for
  the first time in three stretches, because the steer gave the worker a way to disagree instead of
  stalling. The prior is a declared gap at 1.0 (f9b04ddc7). The null arm reads 0.739 against a
  truth of 1.0 on 20 decisions, and all three predictions filed before the run held. EH-5 is
  fixed: the seam no longer books a lookup with no account as direct debit. The worker then handed
  on to PB8, which is blocked because no migration rate is published. That leaves PB6's own return
  to its Expert Hour with no drawer, so it goes first here: it is the only item that can move a
  level now while the box's memory belongs to ab6. Four open errors close with evidence.
  (1) sim-runner's journal shows DEFERRED at 05:04Z and every five minutes after, naming
  longjob-ab6-single-roll's declared 11,200 MB, so admit() has a live caller doing its job.
  (2) The PB6 re-centring landed as f9b04ddc7. (3) The lineage leg was stopped 22 s into L2.
  (4) The previous bridge item was drawn once and released with no staging file, which is the
  designed second-drawer shape working. All three previous focus items were drawn, and two landed.
  The bridge item's "CANNOT ANSWER" row is mine: the item named no tracked path. HEAD and origin
  have diverged (11/9), so the shared checkout's daemons are running behind origin. That is the
  carried reconcile class, and it cost no thesis run in this stretch. Staging drained by a net 75
  over the week.
