thesis_read: >-
  THE COMPANY HAS BEEN CHARGING ABOVE THE LAW IN ITS OWN FAVOUR, AND ITS OWN CHECK SAID IT WAS
  LAWFUL. That is what this stretch means, and it is a step backwards on the mission before it is
  a step forwards on fidelity. The DD-books work (ed41ffa1e) opened each account at the rate it was
  sold at, and 28 of 117 first terms in one world came out above the cap. 597b33942 accounts for all
  28. The company's renewal desk ceilings an ex-VAT strike at the INC-VAT cap
  (company/pricing/renewal_rate_chain.py:365, :382 and :511, reading get_cap_unit_rate_for_date).
  So about 24% of first terms pay up to 5% over the default-tariff ceiling once VAT is added. The
  value arm has also scored that 5% as lawful headroom: the 08-26 A/B had 27 of 66 renewals
  ceiling-bound. This is value transfer, not value creation, so every value-arm result that touched
  the ceiling is overstated by an unknown amount. It is also the VAT rule's defect class again,
  fixed in hedged_settlement on 08-25 and still live on the company's side. A seat lane is
  measuring the corrected ceiling on one world now (/var/tmp/se-exvat, pid 544762), and it is item
  one. PB4 moved a long way without reaching its swap. Year one is no longer blind: the quote is
  priced at the rate sold (7a119f52c), and the quote and the review share one inc-VAT basis
  (7c872f2d0). That took first-renewal shock from 4 of 36 defined to 31 of 31 defined and 17 shocked.
  The corrected basis exposed a tail, though. 7 of 31 first renewals rise by more than 100%, all in
  electrically heated homes whose registry EAC is a fraction of what they are billed for. A
  practitioner would say a settled home's EAC follows its own reads, so this is probably a world
  defect. Swapping the hazard before that is settled would teach the world an electric-heating
  gradient that does not exist, so the swap waits behind it (item two). Last stretch's second item
  was answered, and its premise was wrong (91214c720). The "65% of term ends" were mostly
  anniversaries of households already on SVT, which in law are not decision points. Fixed-end exits
  run at 13.9%, above the only published floor (6%), so no roll was added. The same reading found
  the opposite defect: the SVT anniversary route adds exits on top of C1b's all-cause band, about
  29% too many, and that errs against the company. THE STEER IS DRIFTING ON ITS ATOM ITEMS. Neither
  atom-named focus item (PB4 and H49) was drawn this stretch; only the lane-0 item was. Lanes moved
  PB4 anyway, through lane-0 claims under other names. H49 did not move at all and is still level 0.
  At 08:18 the shared tree was 11 behind and NOT_ADVANCED, refused by 6 paths, and it was logged
  and nothing more. So H49 now goes through lane 0 under a key, not as an atom bias. 23 commits, 5
  substantive by the brief's count. 5 carried no work: 3 heartbeats and 2 empty merges.
