thesis_read: >-
  The thesis item was drawn at last, it was answered, and the answer is sitting in the tree in no
  ref. Every figure below was re-measured against the live tree between 02:24 and 02:35Z before it
  was written. THE SUBSTANCE FIRST. `docs/staging/SEAT_RESULT_THE_PRODUCT_GATE_REFUSES_CAP_SEGMENTS_NOT_DECISIONS_AND_EVERY_DECISION_THAT_EXISTED_WAS_DECIDED_2026-09-19.md`
  (14,456 bytes, written 01:50) and the census that makes it re-derivable,
  `tools/svt_refusal_census.py` (15,538 bytes, 01:51), are both UNTRACKED. They say the product gate
  is NOT the ceiling on the method's reach: 2,824 renewals offered, 2,490 refused at
  `product_not_upliftable` — and those 2,490 are published CAP PERIODS, 4,578 segments inside 986
  default-tariff stints, not 2,490 household decisions — 227 refused at `acquisition_term`, leaving
  107 decisions that existed, of which 107 became decisions and zero stopped at `no_locked_rate`,
  `not_the_arms_commodity` or `no_observed_history`. A gate that refuses nothing its writer could
  have acted on is the boundary of the subject, not a ceiling. `SEAT_DECISION_AN_SVT_HOUSEHOLD_IS_NOT_A_DECISION_THIS_ARM_DECLINES_2026-09-07.md`
  §3 stands, and now carries the count it was missing. WHAT THAT MEANS FOR THE THESIS, plainly: the
  advantage-from-inference is still not demonstrable and the constraint on it is now UNLOCATED. Last
  stretch I told the director the constraint was world-side and the tree refuted me; this stretch the
  company-side gate is refuted too. Both live discrimination readings sit inside their own nulls —
  0.482 in a 0.407 to 0.591 null on 54 decisions, 0.557 in a 0.39 to 0.61 null on 104 scored
  decisions over 65 accounts — and the finding is right to say a reader differencing those two is
  differencing two censuses. The binding quantity is n, and n is 107 because the world has only just
  gained the edge that makes a default household decidable. WHICH IS THE ONE THING THAT GENUINELY
  MOVED. `05684780e feat(world)` is on origin/main carrying `simulation/renewals.py`: the household
  that ARRIVED on the default tariff now gets the same exit the rolled one has. Four of this
  stretch's five substantive commits touched the world, the knowledge layer or a check on the world —
  the SVT exit, the knowledge map's refuted structural 0.0 for internal switching (68 of 134
  households already do it), `published_route_split`'s J_svt floor, and `fit_year_level_anchor`
  judging the world's internal route against the floor for THAT route rather than the mixed row. The
  machine stopped turning inward and I am marking that error corrected on that evidence. AND THE
  CLASS THAT WILL NOT DIE. Work finishing and not leaving the tree recurred inside four hours of the
  last instance being fixed, on a bigger artefact, with a sharper mechanism behind it: the delivery
  lane swept `measure-whether-the-product-gate-is-the-real-ceiling-on-the-methods-reach` `not_done`
  and RE-DREW IT thirty seconds before this orientation ran — PID 1264076 is redoing it now — because
  `_claim_paths` asked git about the three paths the item's PROSE named, all clean, and then
  attributed 23 unrelated paths BY TIME AND NOT BY NAME. The discriminator it needed is one line of
  the document it could not see: that finding's own header reads `**Claim id:**
  measure-whether-the-product-gate-is-the-real-ceiling-on-the-methods-reach`. I named `_claim_paths`
  correctly last stretch and under-scoped the remedy, which is my oldest habit wearing a new coat, so
  that row stays open. The same class at scale: 99 tracked staging documents are absent from the
  working tree and present on origin/main, and all 99 are archived under `docs/staging/` in a
  subdirectory — dispositioned work whose `done/` move was never committed. The live root holds 109
  documents; git's root holds those 109 plus the 99, so every lane that reads the queue from a ref
  reads a queue nearly twice its real size, and the +39 net sediment reading is computed against the
  wrong denominator. One figure I have quoted for twelve consecutive orientations finally moved
  because I re-ran it instead of copying it: H41's map headroom is 6,491 bytes, not the 8,282 I have
  been repeating, with the per-atom reserve 4,443 bytes in from here.
