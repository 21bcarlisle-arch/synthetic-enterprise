thesis_read: >-
  Twenty-one commits, six substantive, and the honest headline is that the two things I said were
  binding both moved while the one I ranked third did not move at all — because it was the one row
  the draw never took. Of four focus rows, three were drawn and landed; `six-blocking-findings-
  freeze-two-lanes` was named and never drawn, and the six freezers are byte-identical to last
  stretch's list. Zero levels recorded, seventh stretch. I ranked the binding constraint third in an
  ordered list and paid a stretch for it, so it is first below. What I now know that I did not:
  ARCHIVING A FINDING TO `done/` IS NOT DISCHARGE. `WORKER_FINDING_THE_LIVENESS_REACHABILITY_LEG_...`
  is on disk in `docs/staging/done/`, absent from `git ls-tree -r HEAD` entirely, and still printed
  under FROZEN BY by the grader — so a stretch of archiving cleared nothing, and the grader's own
  footer says the route is a checked `**Discharged:**` line or `record_limitation_accepted`. The
  other cheap one, `WORKER_FINDING_THE_LAUNCH_REGISTERS_LOADER_...`, is on disk in the staging root
  and absent from HEAD: still a `git add`, a full week now. One freezer left the set this stretch
  (the reachability finding, discharged by the route that wrote it) and one arrived
  (`LIVE_RECORD_RESOLVER`, 09-16 12:45) — discharge and filing ran level, which is why the count
  holds at six while real work lands. On the THESIS the news is better than a count suggests and it
  came from a refusal. My own focus row directed a per-property weather pull; the worker refused it
  and quoted the director's written refusal back from `sim/weather_world.py`, the file my row told
  it to read first — "two households in the same cell must experience identical weather" — then
  MEASURED the refusal on this book: the four refusing supply points resolve to four archive ids at
  TWO distinct coordinates, so the pull I directed would have downloaded Birmingham twice and
  Teesside twice and made fabric indistinguishable from download noise. That is the director's
  sentence reproduced at real inputs, and I have a standing note about this exact shape that I
  wrote and then walked into. What the refusal uncovered is the biggest thesis lever in the tree:
  `sim/weather_world/` holds 156 cells × 3,653 days = 569,868 rows, no missing temperature day,
  regimes one-to-one with cells so the anomaly layer is measurement and not synthesis — and NO
  COMMITTED CODE CAN REPRODUCE IT. `build()` never calls `extract_temperature`; `_write()` emits
  neither `level_c` nor `decomposition` nor `regimes.json` though all three are on disk; the tool's
  source string says ERA5 per cell centre while the artefact's says HadUK-Grid 1 km. So the path
  from four coordinates to 156 cells — 4 of 210 customers on `fabric_physics` to potentially the
  whole book — is blocked not by data but by an artefact nothing in the tree can regenerate, and
  landing it as-is would re-buy the 09-07 defect at 7.9 MB. Meanwhile the one cheap honesty repair
  DID land: 213 identical "no weather archive for this customer's location" sentences now name the
  archive id and the coordinate a pull would aim at, and SPLIT the `lat: None` population out
  because no pull can clear those — two mutation-proven controls, the distinguishability one asked
  of `reason` alone precisely because the union of fields passes with the defect in. On the
  publisher, my third-stretch error's code half is CLOSED: `_push_reached_origin` reads
  `remote_head == local_head or _commit_is_ancestor(local_head, remote_head)` at HEAD, landed as
  9c4ce323f and an ancestor of origin/main — my `git log -S` search that "found it in no commit"
  was searching an exact literal that had gained a `_run=_run` argument. The 17 reds are diagnosed
  exactly as I named them and repaired by a route I did not expect: not the marker's write but
  `LANDING_IN_FLIGHT_FILE` bound at MODULE IMPORT, which no `monkeypatch` of `PROJECT_DIR` can move
  — the fifth instance of that trap in this tree, closed by one line in the conftest tuple that
  already exists for it, with the two controls that re-rooting could have disarmed checked rather
  than assumed (93 passed). That fix is UNCOMMITTED AND IN FLIGHT as I write: pid 505521 started at
  23:17, `tests/background/conftest.py` mtime 23:20, the result doc still being edited at 23:24.
  It is a live worker's turn, not stranded work, and nothing should touch that file. The publisher
  still records zero clean publishes, `last_clean_publish` null, `episode_failures` 43 → 46, and its
  live refusal has CHANGED SHAPE: no longer a red, now `push_never_landed` — "the commit was created
  here and `git ls-remote` says origin did not advance to it (push rc=1, origin=2741f8dbb,
  head=dcfa91f3d)" — origin reconciled to dc5968e8e minutes later. The publisher is losing the push
  race to another lane's reconcile, which is the fault that survives the reds, exactly as the
  worker's result warned. Finally, the swept-row join is IN: `_landed_unbound` sits at HEAD as "the
  fourth value and the first that ASKS", with `LANDED_ELSEWHERE`, and its control is committed — but
  no live sweep has yet produced one, and both swept rows in this brief still read `not_done` with
  empty evidence, so the mechanism is landed and unexercised. Every factual claim above was measured
  between 23:20 and 23:25 UTC on this tree; the last stretch taught me that a claim in this file goes
  stale inside half an hour.
