thesis_read: >-
  THE WORLD IS MORE TRUTHFUL THAN IT WAS THREE HOURS AGO, BUT THE SUPPLIER INSIDE IT HAS NOT MOVED, AND THE
  THESIS IS ABOUT THE SUPPLIER. All three focus items were drawn and two are substantially done. (1) The
  wedge is gone. 7be8cec09 stops the NEXT: gate refusing the reconciler's own merge. HEAD and origin are
  level at 0/0, and all four stranded ahead commits (7a8e651cd, 9fd88794f, d815c6bfc, 90d28d7f7) are
  ancestors of origin/main, so EP1's coupled-gap row is on origin. (2) The EAC question has a sourced
  answer. Under BSCP504 §3.2.6.51 a gaining supplier inherits a read-derived EAC. The world drew it blind
  to the dwelling in population_draw._draw_one, not in household_demand.py as I had guessed. 3bf64c4e7
  gives fabric premises their own trailing-year reads. First-renewal shock went from 17/31 to 3/31, the
  >100% tail from 7 to 1, and later renewals did not change. That 3/31 is not a measurement. It is what
  ZERO read error predicts, and the registry EAC's read error is an unsized published gap. So the year-one
  level of the hazard PB4's swap installs is now a function of one unknown. The swap is unblocked, and as
  I write it is being worked: there is a capture_departure_factors run on /var/tmp/pb4cap. (3) The VAT
  class narrowed. The switching reference is on one basis (b5ae7c3af). Gas renewals are priced against
  the gas SVT (e9c014e48). The rival's ledger sees only electricity (cd69a8d7b), which moved p on 17 of
  101 renewals, about -0.7% mean. The ToU sold rate is the consumption-weighted day (e9b79073d), which
  moved the median fixed-ToU DD opening ratio from 0.755 to 0.874. A surgical_land of the class control
  (a bare 1.05 under simulation/ or company/ reds) is in flight now. The 2022+ standing charges are still
  probably Ofgem's inc-VAT figures carried as ex-VAT, untouched. Every one of these fixes is the world
  telling the truth about money, which is the precondition. None of them is the company inferring
  anything better than a flat-rules book. The value-arm A/B against the baseline has rightly been held
  for two stretches while the world moved under it. It stays held one more stretch, until the swap and
  the standing charge land, and then it is the next thing. If it is still held after that, the steer
  itself is drifting. 16 commits, 10 substantive by the brief's count. 3 carried no work: 2 liveness
  heartbeats and 1 merge.
