thesis_read: 'Forward on billing accuracy, and still standing still on the supplier''s decisions. There were 14
  commits, 7 substantive, split supplier 0, world 2, both 1, other 11. Four were base-advance merges that carried
  no work. 2 of my 4 focus items were drawn, the top two, and both landed. 3a31999db found why the void-stub fix
  credited households 48 times the Treasury''s share. The daily fold summed a per-MWh rate over 48 settlement periods.
  Every per-unit field is now carried as a rate, the stub reads GBP 61.61 at real inputs, and the over-cap grader
  refuses a run whose carved and booked differ. That finding is LATENT. 6b6c1438b relaunched the crisis-overlay
  arm on the default book, queued behind section 14, so that wrong row is corrected. The world got a8ea44a12: a
  gone household''s late arrears are written off at the gone-household share and are no longer repaid at the stayer''s
  rate. The prepayment-meter recovery is landing now (b47d4e024, promote loop live). WHAT IT MEANS. The company
  still makes no per-customer decision the flat baseline cannot make. C34 advises nobody, and its price half was
  not drawn for the second stretch running. The corrected renewal belief is built and graded, but no policy carries
  it. Its clean-book re-take is on its last seed (seed 5''s flat arm, live since 13:27Z), and rearm.py hands off
  the grade. The steer drifted again for the same reason: the lane takes three continuations before it reads focus,
  and 14 are queued. Six of them are the director''s own advisor steers, which is the right order for his words.
  So this focus holds four items that nothing else carries, two of them supplier. The largest risk to the thesis
  this weekend is Monday''s 04:00Z publish. The site still shows the 19 Oct run, which charges 199 of 550 households
  above the ceiling. The shared checkout the runner executes is 14 commits behind origin and lacks 3a31999db. A
  run it makes now would publish the defect again. Focus item 1 holds that path. The director''s usage reading (27%
  Saturday) says widen to about 1.75 points an hour. The queue is deep enough for that, and parallelism is held
  by memory, not by work. Ledger note: a-tou-invoice-prints-each-registers-rate landed under 50001b0b7 and should
  be bound --landed-under. The map steer is deliberately after the publish, as he wrote.'
