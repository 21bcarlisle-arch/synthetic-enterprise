  proposal: Apply the Capital Target from 31 March 2025 (GBP 115 per dual-fuel account, GBP 0 floor), with no target before
    the July 2023 decision; between decision and binding date, treat it as a plan-ahead target the company may choose to meet.
    Measured before/after on the same seed before it is switched on. If you prefer it applied throughout as a prudence rule,
