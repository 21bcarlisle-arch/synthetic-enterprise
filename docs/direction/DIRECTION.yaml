focus:
  - id: land-the-suspended-book-and-rerun-on-residential
    what: >-
      Land the I&C suspension that is sitting uncommitted, then re-run the comparison on the book it
      creates. The suspension is finished work: `docs/design/curriculum/served_segments.json` in the
      working tree reads `served: ["resi","SME"]` with C_IC1, C_IC2, C_IC3, C_IC4 and C_IC3g moved to
      `suspended_accounts`, while `git show HEAD:` on the same path still reads
      `["resi","SME","I&C"]`. It travels with `simulation/live_population.py` and six already-modified
      test files -- `tests/company/interfaces/test_renewal_offer_seam.py`,
      `tests/simulation/test_served_segments_curriculum.py`, `test_live_population_seam.py`,
      `test_phase24a_ic_customer.py`, `test_phase40b_gas_pass_through.py` and
      `test_run_phase_settlement_population_seam.py` -- because removing C_IC3g takes the only
      pass_through gas account out of the served book. Land exactly that set by pathspec with
      `python3 -m tools.surgical_land`, and check that tool first: `tools/surgical_land.py` and
      `tests/tools/test_surgical_land.py` are themselves modified in this tree, so the landing
      instrument is mid-change. Then re-run `python3 -m tools.run_value_cycle_ab` and write the
      reading into `docs/design/THE_VALUE_CYCLE_REALISED_AB.md`, replacing the current one, which is
      on the superseded book and does not say so. SME stays served: that call is already made and
      reasoned inside the file from measured per-account deltas (C5 +1,574 and C6 +2,754 sit inside
      the residential range of +1,147 to +5,134, where the industrial accounts sit two to three
      orders of magnitude outside it), so do not re-open it without new figures.
    why: >-
      This is the director's direct instruction of 16:43 today, restating his ruling of 24 August,
      and it is the one question this project exists to answer: can a supplier deciding
      customer-by-customer beat the same book run on flat rules, on residential. Right now nobody
      knows, because both readings the machine has produced are about five industrial accounts --
      the first said the arm loses GBP 110,731 and the second says it gains GBP 2,293,743, and
      99.97% of the movement in the second is 15 accounts in a segment he had already ordered out.
      His words on how to read the outcome are the acceptance condition and must not be softened:
      "a negative result on the right population is worth more to me than a GBP 3M headline on the
      wrong one." It is first because everything else here is either measured by this comparison or
      changes the population it runs on. Finished when the suspension is in origin, the A/B has been
      re-run arm against frozen control on the resi+SME book, and the record states plainly which
      way it went -- including, if that is the answer, that per-customer pricing cannot beat flat
      rules on households, said in those words rather than hedged.
  - id: EP1_clv_three_horizon
    what: >-
      Give the tenure horizon per-account dispersion, from observables the company can actually
      know. The measured fact to work from, not to re-derive:
      `docs/observability/coupled_gap_ledger.json` `components.lifetime_level` reports
      `distinct_hazards: 1`, `hazard_histogram {"0.05": 33}`,
      `hazard_is_constant_across_graded_population: true` and a median believed tenure of 20.0 years
      for every graded account, measured at 11:46:22Z. The cause is
      `saas/churn_model.py::churn_probability` -- `min(0.05 + 0.03 * bill_shock_count, cap)`, a step
      function of one integer that is zero for 42% of the run's renewal decisions -- consumed by
      `company/analytics/clv_three_horizon.py` at H2 as `hazard = latest.churn_probability` with the
      term `1.0 / hazard`. Do NOT re-diagnose the level: `hazard_calibration` grades belief against a
      tally of realised `event_type` and the 0.05 bucket reads 0.05 believed against 0.053 realised
      over 263 decisions, so the level is about right and the dispersion is what is missing. Widen
      the propensity to use more of what a supplier observes about a household -- payment method and
      payment behaviour, tenure to date, the account's own tariff against the market it could switch
      to, consumption volatility, contact and complaint history -- and check every input against the
      wall before using it: if it needs a simulation internal it is a violation, and
      `company/interfaces/sim_interface.py` is the only door. Re-measure with
      `python3 -m tools.couple_clv` and report the ledger's next reading whichever way it moves.
      Nothing may be tuned toward a smaller gap (R12) and the 0.204 scalar is not to be applied; if
      the gap worsens that is the result and saying so is the deliverable. A level move to 3 is
      available on this evidence if the coupled rung is genuinely met -- self-certify with
      `record_level_up_self_certified`, and never `--no-verify` a `level_current` change.
    why: >-
      With I&C suspended this stops being one term among several and becomes the whole per-customer
      question. The served book is households plus two SME accounts, and if the lifetime belief is a
      single constant across them then the arm has no per-customer view at all on the only population
      left -- so item one's re-run would read "flat rules win" for a structural reason rather than a
      commercial one, and we would learn nothing from a negative result the director specifically
      asked for. The split is already visible: `belief_vs_outcome.discrimination_auc` is 0.646 on 28
      matched decisions, so the retention belief the arm prices with does carry information, while
      the CLV lifetime term carries exactly one distinct value. The thesis says the advantage must
      come from INFERENCE; on the axis the thesis is named after there is currently nothing to infer
      from. Finished when the graded population shows more than one distinct hazard, the ledger's
      next entry comes from a changed estimator rather than a changed sample, every new input is
      named with the observable it comes from and cleared against the wall, and the new gap is
      recorded whichever direction it went.
  - id: the-uncommitted-disease
    what: >-
      Clear the divergence by walking it, and make an alarm at this multiple impossible to absorb.
      `python3 -m background.tree_divergence` right now: "436 source file(s) vs HEAD, oldest 156.3h
      (7 attributed, 429 unattributed)", breaching on both count and age, with 423 of the 436
      unattributed under `docs/`. Disposition by lane rather than bulk-committing: land what is
      finished, delete what is residue, and say in the record what each group was -- a sweep that
      makes the count fall without anyone reading the files is the same defect wearing a smaller
      number. The named oldest is `tests/simulation/test_policy_cost_coverage.py`, test-first work
      whose subject was never built (1 passes, 6 fail, against GBP 391,531.72 of published 2025
      policy stack priced on silently clamped tables); decide it -- build the subject or delete the
      tests -- rather than leave it a seventh day. Then the half he named next: 47 remote refs,
      mostly worktree-agent and salvage. Say what is stranded on the salvage branches, land or
      discard it, delete the rest. Finally change how a breach of this size reaches a reader:
      `background/tree_divergence.py` is report-only by deliberate design, which is right, but
      report-only currently means it lands in a digest, and that is what let 29x over the trip line
      be absorbed for six days.
    why: >-
      His words, and he is right: "Six days is not work in flight -- that's the disease that has cost
      us most, finished work that never got committed, measured in bulk and batched into a digest
      nobody reads." Focus item one IS this disease in its most expensive form -- his own curriculum
      ruling, complete with its six test fixes, unlanded for two days while three orientations argued
      figures it would have changed, with the alarm firing correctly every day and naming it in bulk.
      That is not a reporting gap, it is a control that fires and cannot be heard, which is the same
      family as a control that cannot fire. It is third because item one lands the instance that is
      costing most and item two is the thesis itself, but it is on the list because it is the only
      item here that prevents the next occurrence. Finished when the count reflects a walked tree
      rather than a swept one and the walk is written down, the salvage branches are dispositioned
      in writing with what was stranded on each, and a breach this far over the line reaches a reader
      as itself rather than as one line among many.
  - id: dual-fuel-in-the-funnel
    what: >-
      Make the acquisition funnel win dual fuel, not electricity only. This is owed debt rather than
      a discovery -- `simulation/net_new_acquisition.py:115` already says so in its own comment:
      "grows on one fuel. The dual-fuel half of net-new growth is real remaining work." The company
      side already models the shape and is waiting for a population to apply it to:
      `company/crm/dual_fuel_account.py`, `account_hierarchy.py::is_dual_fuel` and its
      `dual_fuel_accounts` census, `company/billing/dual_fuel_bill.py`, and the gas-leg estimate in
      `company/crm/churn_desk.py`. What is missing is the world creating dual-fuel wins, in
      `simulation/acquisition_funnel.py` and `simulation/net_new_acquisition.py`, at a rate anchored
      to a published source rather than chosen -- the same module already cites a real Ofgem-era
      figure per dual-fuel-equivalent domestic customer, so the anchoring convention exists. R13: this
      is a curriculum change, which is the director's, and he authorised it at 16:43 -- so record it
      as a named, versioned world artefact citing his instruction verbatim, never as a silent
      parameter change. Then measure what it does to the three things he named for accounts carrying
      both legs.
    why: >-
      His reason is the thesis rather than fidelity: "dual fuel changes cost-to-serve, churn and
      lifetime value -- so a single-fuel-only book quietly distorts every per-customer number we've
      been arguing about." A supplier deciding customer-by-customer on lifetime value, where every
      customer has exactly one fuel and real households mostly have two, is deciding well about a
      book that does not exist. It is fourth against his own ordering of it second, and that is my
      call and my risk: it changes the served population again, and items one and two are a
      measurement and the estimator that measurement grades. Running the residential A/B, moving the
      book underneath it, then re-running would spend the comparison twice and leave the answer he
      asked for no clearer. It goes in the moment the residential reading exists, and if item one
      slips, this moves up rather than waits. Finished when the funnel produces dual-fuel wins at a
      sourced rate, the change is a named artefact quoting the instruction that authorised it, and
      the effect on cost-to-serve, churn and lifetime value is measured for dual-leg accounts rather
      than asserted.
