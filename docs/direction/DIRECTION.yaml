focus:
  - id: restore-the-six-live-reverts-before-anything-regenerates-from-them
    what: >-
      Run `tools/stale_copy_refusal.py`'s census over the live tree, list the copies it judges as
      predating the last landing to their own path, and RESTORE each one from HEAD — resolving, not
      discarding, any hunk in it that is genuinely newer than HEAD, which `tools/isolate_hunks.py`
      can separate. Two are named and are the ones that matter: `simulation/net_new_acquisition.py`
      (working copy mtime 2026-09-21 16:41, last landing 2026-09-22 02:38, diff removes 209 lines,
      which is the coin-flip withdrawal) and `tools/generate_value_arms_data.py` (working copy
      2026-09-21 21:22, last landing 23:32, diff reinstates "MEMORY IS NOT WHAT BINDS ... slack by
      4.5x" and deletes the correction that refuted it by 29.2x). Then close the half of the door
      that is missing: the refusal guards a COMMIT, and the publisher never goes through it — it
      imports the working-tree generator and writes `site/data/*.json` whose fresh mtimes exempt them
      from `clock_judge`. Make the publish path refuse to regenerate from a producer module that the
      same census judges stale, with the refusal naming the path and the landing it predates. Write
      one control over the whole partition — a producer that is stale, one that is merely dirty, and
      one that is clean — so a guard that refuses everything cannot pass it.
    why: >-
      The tree holds six copies that would delete landed corrections, and nothing before tonight could
      see them. This is the same standing defect as "finished work does not reach history" with the
      sign flipped, and it is worse, because a revert produces an internally consistent tree whose
      imports resolve and whose own tests pass. It is rank 1 because every other item in this record
      either edits or runs one of the affected files: rank 2 runs the arms generator, and running the
      copy in this tree would republish a paragraph we refuted with a measurement. Done means the
      census comes back empty on the tree, the publish path can name a stale producer and refuse, and
      a mutation that neuters the refusal reds a control rather than a sibling assertion.

  - id: the-arms-page-cannot-say-whether-the-advantage-is-choosing-or-the-price-level
    what: >-
      Settle, one variable at a time, why the two three-arm runs in world `39a192ce04c1eda8` disagree
      by eighteen times about the composition of the advantage. Pre-register the prediction before
      running anything. The published headline comes from
      `docs/observability/value_cycle_ab_s1_three_arm_20260908.json` (level share 0.9848, selection
      £270.21, 214 priced decisions over 2,035 renewals offered, and its two arms priced two
      different populations — 281 against 215); the run that fixed the population comes from
      `value_cycle_ab_s1_three_arm_20260918.json` (level share 0.0551, selection £4,327.01, 110
      against 107, `book_identity.same_book_across_arms` resolved). Book, commit and arm code all
      moved between them, so neither is attributable. Re-run the contrast at ONE commit over the book
      both arms price, with the seed family drawn against THAT arm — `NOISE_FLOOR_PATH` has pointed at
      the eighteen-seed folded family of 2026-09-17 since it was folded, while
      `CURRENT_WORLD_NOISE_FLOOR_PATH` in `tools/generate_value_arms_data.py` still resolves the
      nine-seed artefact of 2026-09-09 that the requirement is computed from, which is one page, one
      question, two sample sizes with the smaller one under the figure that gets differenced. Then
      let the page either state the selection leg's sign or say how many seeds it needs, from a point
      estimate and an error bar taken on the same book, the same arm and the same commit — and keep
      `error_bar.selection_leg.sign_withheld_because` able to fire, because fail-closed is a result.
      Launch detached with `tools/launch_long_job` or `setsid`; read
      `background.resource_headroom.sample()` first, and note `process_run_complete` and a gate pytest
      are already on the box at roughly 1.9GB between them.
    why: >-
      This is the thesis. "The advantage must come from INFERENCE, never from ACCESS" has exactly one
      measurable consequence in this repository — the selection leg against the level leg on one book
      — and the company's own page publishes two answers to it that are opposites, leads with the one
      it separately documents as contaminated by a population defect, and states no sentence at all.
      Six claims on that page stand withdrawn and the newest withdrawal is four days old; the last
      stretch to touch the arm was 2026-09-18. Every stretch since has been machine repair, and I
      ranked it that way, so this is my drift to correct and not the machine's. It is rank 2 only
      because rank 1 is a prerequisite: the generator this item runs is one of the six reverted
      copies. Done means one run, one book, one commit, one seed family, the prediction filed before
      the answer, and a page that states a sign or names the seeds — either of which is progress and
      neither of which exists today.

  - id: the-staging-archival-is-116-deletions-the-guard-itself-refuses
    what: >-
      Land the dispositions that have already happened, and fix the thing blocking them first.
      `docs/staging/` holds 116 deletions in the working tree with 227 untracked files under
      `docs/staging/done/` that are their destinations, so as far as git is concerned nothing has been
      archived in seven days. The blocker is filed and BLOCKING:
      `WORKER_FINDING_THE_STALE_COPY_GUARD_REFUSES_A_MERGE_FOR_ADOPTING_THE_OTHER_SIDES_DELETIONS_AND_ITS_REMEDY_IS_THE_MERGE_2026-09-20.md`
      — the guard reads an adopted deletion as a strict symbol subset and refuses it, and its stated
      remedy is the merge it just refused. Give the deletion branch its own judgement: a path whose
      removal is itself the landed intent is not a stale copy of it. Then commit the archival in
      batches by pathspec, each deletion in the same commit as the `done/` copy that replaces it so no
      note is ever removed without its destination landing beside it, and run
      `background/staging_rooms.py --check` after each batch.
    why: >-
      Every orientation — mine and every worker tick's — ranks the next piece of work off this census,
      and it currently reports a 59-item queue against 54 files actually present and a seven-day net of
      +12 filings when 116 of the dispositions it is missing have already been done. A number that
      chooses what gets done next is the wrong number to leave wrong. I put this item in focus last
      stretch and the one before, and it was the only item of five never drawn either time, which tells
      me the instruction was the problem: it had no named blocker and no natural batch, so it read as
      unbounded. It now has both. Done means the root census and the seven-day flow read what the
      filesystem already shows, and the BLOCKING finding is archived with the deletion branch carrying
      a control that can red.

  - id: W2_18_the_housing_joint_the_sample_and_the_ceiling
    what: >-
      Write the grading controls for the household-model family the map cannot grade at all —
      `W2_18_the_housing_joint_the_sample_and_the_ceiling`,
      `W2_19_who_lives_where_money_and_composition`,
      `W2_20_mains_gas_is_drawn_not_inferred_from_the_heating_system` and
      `W2_21_the_premise_joint_is_fitted_not_drawn_independently`. The orientation classifies all four
      as "the subject is on disk and the control that would grade it was never written", so each one's
      recorded level is a claim with nothing able to contradict it. For each, write one runnable
      control keyed to the PROPERTY the atom asserts rather than to the current output, prove it can
      fail by mutating the subject, and record whether a silent mutation was a missing leg or an
      equivalence. If a control cannot be written because the atom's claim is not falsifiable as
      stated, that is the finding — file it and say the level is not gradable, rather than writing a
      control that passes.
    why: >-
      The thesis says "there has to be a BASELINE to beat, or 'it performed well' means nothing", and
      the same logic turned on our own record says a level nothing can grade means nothing either. 28
      atoms are in that state and 26 of them owe a repair. These four are the ones that bear on the
      mission rather than on the machine: they are the household model that per-customer inference
      reads, so an ungradable level on them means we cannot tell whether the inference has anything
      real to infer from. It is rank 4 because it writes new controls rather than settling a live
      disagreement, and because the map ratchet makes it expensive to open carelessly — ask
      `python3 -m tools.maturity_map_store` for headroom before writing any row. Done means each of
      the four either carries a control that has been shown to red, or carries a filed finding saying
      why its claim is not falsifiable as written.

not_now:
  - what: >-
      Running the 88-minute, 13.9GB full settlement pass to grow the priced book, on the reasoning
      that the selection leg needs more decisions before it can carry a sign.
    why: >-
      It is the expensive thing we know how to do, and it answers the wrong question. The eighteen-fold
      disagreement between the two three-arm runs is about POPULATION and COMMIT, not about book size:
      one run's arms priced 281 against 215 and the other's 110 against 107. Running the big pass
      before the one-variable version is exactly the attribution failure I recorded a rule about, and
      it would consume the stretch and leave both answers still live. If the one-variable re-run comes
      back and the sign genuinely waits on decisions, the big pass becomes rank 1 material with an
      argument behind it.
  - what: >-
      The remaining 22 ungradable map rows outside the W2 household family, and the seven other
      BLOCKING findings — the ceiling convexity refutation, the liveness refusal living only in the
      reader, the fork at origin.
    why: >-
      All of them are real and all of them are about the machine. Three stretches running have been
      spent on the machine and the company's central claim has not been touched in four weeks; that
      ratio is the drift, and correcting it is what rank 2 is for. The W2 four are in focus precisely
      because they are the subset that bears on the mission. The rest keep.
  - what: >-
      A control over commit shape — something that flags a stretch where the liveness surface commits
      more often than work does.
    why: >-
      Five of twelve commits this stretch were heartbeat-only and three consecutive ones carried
      nothing, so the temptation is real. But the heartbeat is working exactly as designed since
      Fault#1, the orientation brief already strips those commits before reporting six substantive, and
      the thing the ratio is a proxy for is directly observable in `git status`. A control that guards
      our own controls is usually not worth having.
  - what: >-
      Declaring the standing "finished work does not reach history" defect corrected on the strength of
      three items landing this stretch.
    why: >-
      It landed three and stranded one — rank 4's result note and `prospect_cap_probe.json` are both
      untracked at 06:19 — and the class mutated into something sharper rather than closing: six live
      reverts. Grading a class closed on its best stretch is how a defect stops being listed without
      being fixed, which is the failure the `wrong` section exists to catch. It stays open and it gets
      rank 1's repair rather than a tick.
  - what: >-
      Restoring the six reverted copies by discarding the working-tree versions outright, which is the
      one-line version of rank 1.
    why: >-
      A stale copy can still carry a hunk that is genuinely newer than HEAD — the module's own
      measurement found rule 1 positively vouching for nineteen of the paths a clock-only rule would
      have condemned — so a blanket restore would strand another lane's live work and produce a
      seventh finding. Rank 1 asks for `isolate_hunks` per path and costs more, and that is the
      trade I am making deliberately.

