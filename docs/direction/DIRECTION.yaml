- id: the-switched-retention-run-on-pair-1
  what: 'Re-plan the box, then run the one-variable test of the retention-threshold switch. PRECONDITION:
    the switch commit ("The 0.30 retention cutoff is skippable where the save odds carry the belief, default
    off", retention_skips_the_belief_threshold_when_save_odds_weigh) is on origin. Check with git log
    origin/main --grep retention_skips. If its landing was refused, land it first. BOX ORDER, written
    down here so no tick re-derives it: (1) let step 6 flag 1 (pid 1051692, pair 55555/66666) finish its
    current pair, then stop it and keep every finished pair. Launch no further flag-1 pairs and no flag-0
    halves, because they measure the 0.30 gate we now know is defective. Detect the pair boundary from
    the pair''s output file appearing in /var/tmp/vta-out-flag1/, never from a marker''s mtime. (2) sim-runner''s
    book on origin HEAD goes next. Its admission is next_book_requires.yaml, and all its commits are landed.
    (3) Then run seeds 11111/22222 with candidate A (flag 1) and the switch on, through launch_long_job,
    into a new directory. The comparison is the existing /var/tmp/vta-out-flag1/member_11111_22222.json,
    so the switch is the only variable. Grade it against the prediction in THE_VALUE_TEST_REDESIGN.md
    s.12c, as corrected before any run. Read the value-arm GBP per household-year with its interval, the
    nine named flips and how many under-cutoff renewals were considered. Write the result as s.12d, with
    a "Graded: value-test" trailer. vto-offer-reread-watch waits on a flag-0 family no job will now produce.
    Retire it or re-arm it on the switched run''s output, and say which in s.12d. Supersede the continuation
    the-box-plan-orders-step-6s-flag-0-half-and-the-offer-reread by recording this order in its place.'
  why: This is the direct test of whether the per-customer supplier beats the flat baseline once its better
    inference is no longer filtered through a flat cutoff, which is the thesis itself. The flag-0 twins
    only re-confirm a cause already read on pair 1, and the remaining flag-1 pairs repeat a configuration
    already explained, so neither is worth a day of the box. Done means s.12d is on origin, grading the
    switched pair against s.12c, with its interval. If the switch refutes, the refutation is the result,
    and the next candidate is the belief-level calibration (s.11, candidate 2).
