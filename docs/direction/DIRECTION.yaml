    ones were seat calls, closed today on the seat''s own recommendation, and none of them needed you; the canon still wants
    intent questions raised. Trade-off: you may still see a few proposals to read, but none is presented as waiting. Holding
    position: the narrower rule is live. Would change it: your word that only G5 rows should ever be raised.'
