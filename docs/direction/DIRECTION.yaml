- id: a-direction-item-s-why-claimed-the
  raised: '2026-10-12'
  kind: strategy
  what: 'A direction item''s WHY claimed the capital target ''throttles for nine years the growth the thesis is
    judged on.'' Measured on seed 42 (campaign-only resolve, 403-founder book, 2016-2025): binding is prospect_ceiling
    or market in every single year, at £0, £115 and £130 alike -- capital has never been the constraint this book''s
    growth is sized against, before or after the capital-115/C14 dating fix.'
  proposal: Land the capital-115 correction and the C14 dating fix on their own merits (they are correct factual
    corrections regardless), but do not treat them as having unthrottled growth -- they haven't. If growth is meant
    to be capital-judged, the lever to look at is PROSPECTS_PER_YEAR (400) or the founder book size, both of which
    bind in every year of the shipped run.
