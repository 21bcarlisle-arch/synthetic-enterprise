  - id: the-books-ceiling-is-our-serializer-and-not-the-world
    what: >-
      In `simulation/premise_population.settled_book_ceiling`, `bytes_per_record` ADDS
      `settlement_build` (363.5 B) to `run_output_serialization` (411.4 B) - and the docstring says
      why: `tools/scale_probe_10k.py` takes the serialization baseline AFTER `run_settlement`
      returns, while the settlement working set is still held, so a single-process
      build-then-serialize pays both. Change the path so one working set is paid once - stream
      records out and free them as they are written, or split build from serialize across the
      process boundary - then RE-RUN the scale probe and let the ceiling fall out of the new
      measurement. Do not edit the number, and do not touch the 1/sqrt(n) curve or the null: the
      bound must still be derived from measured floors so it stays an upper bound.
    why: >-
      The bound on this project's central claim is currently set by our own serializer. The page
      reports `the_observed_effect_is_attainable: false` against 632 accounts, and that field's own
      `what_binds` says the binding constraint is this machine's memory budget rather than the
      world - so a reader takes a statement about our RSS accounting as a statement about whether
      per-customer inference can be detected at all. At an 8.58 GB budget and 17,520 records per
      customer-year, removing the double count moves the bound to roughly 1,190 accounts by
      arithmetic alone. THIS IS NOT GROWING A BOOK UNTIL THE ARM WINS - R12 forbids that, the feed
      says so in `it_is_a_diagnostic`, and it stays forbidden; the arm reading "cannot tell" again
      afterwards is a complete result and must be published as one. Finished when the ceiling is
      re-derived from a re-run probe and the published bound's binding constraint is the world or
      the method rather than our own output path.

