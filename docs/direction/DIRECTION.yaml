for_the_director:
- id: the-world-s-91-day-arrears-stock
  raised: '2026-11-26'
  kind: vision
  decision_kind: fidelity
  what: 'The world''s >91-day arrears stock (2019: 10.0%, 1.96x Ofgem''s 5.1%) is not concentrated in households
    that cannot absorb a shock: RR 1.42 [0.70, 2.66] for the thinnest 30% of budgets against the survey''s 3.6 [2.8,
    4.6]. The financially-vulnerable state V2 drives nothing (RR 0.57 [0.18, 1.16]). Pre-registered 25 Nov; Q2 failed.'
  proposal: 'One financial state, not two: derive V2 from the household budget (the 30% least able to absorb a shock)
    and let sustained non-payment run through that budget, so the gradient lands near 3.6 and the stock comes back
    toward 5.1%. The transient income_stress draw keeps only short, self-curing failures. K8 first: knowledge page,
    then a one-variable build graded on a fresh 2019 capture.'
  recommendation: 'I recommend you say yes to the proposal. Erring against the thesis: today''s world scatters sustained
    debt almost at random with respect to resilience, the reverse of the survey on who is behind, and a supplier
    graded on that world is tested on the wrong households. It is reversible, and the world change is decided blind
    to company results.'
  based_on: a3b2a7a0c8
  status: open
  resolution: ''
  evidence: docs/staging/SEAT_FINDING_THE_WORLDS_ARREARS_RUN_OFF_INCOME_STRESS_NOT_THE_FINANCIAL_STATE_AND_SIT_FAR_ABOVE_THE_SURVEY_2026-10-08.md
