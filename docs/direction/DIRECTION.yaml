focus:
  - id: does-the-worlds-churn-discriminate-between-households-at-all
    what: >-
      **Lane 0, and it is the director's own canon work-item 1: apply the validation ladder to
      churn, rebuilding anything top-down from the individuals up.** Do rung 3 FIRST, before any
      refitting, because it is the one nobody has ever measured and it decides whether the rest is
      worth doing: **do individual households in this world depart for hidden reasons of their own
      that a supplier could in principle infer, or is individual variation noise around a forced
      mean?** `tools/measure_churn_heterogeneity.py` is UNTRACKED in this shared tree right now and
      already carries a `route_coverage` reading — **adopt it, do not rebuild it**, and read
      `WORKER_FINDING_C1B_ADDED_A_DEPARTURE_ROUTE…` before touching anything, because the repair to
      `run_phase2b`/`capture_departure_factors` that makes this measurable is UNCOMMITTED in the
      same tree from another lane. Land across nobody's hunks. Then, and only with rung 3's answer
      in hand, take the anchor: `departure_risks.py` states in its own comment that `level_anchor`
      calibrates onto the published departure level and that the year anchor **is now over-fitted**
      — fitted on a run where the renewal roll was the only way out, when by the same file's
      estimate roughly 55–58% of domestic account-days no longer reach that roll. The loop is
      **capture → refit → capture across BOTH routes**, and the canon forbids the two shortcuts by
      name: **never a widened band, and never scaling the aggregate.** A rung-1 failure is repaired
      at the individual model's attributes and rationale until the emergent level moves, or it is
      not repaired at all.
    why: >-
      First, and it displaces everything I ranked above it last time. This is the director's canon,
      issued today, and he calls it *"a crux document… it explains a month of 'we cannot tell'
      results."* Rung 3 is **the thesis itself** in his words: *"without it there is nothing for the
      company to infer, and every A/B result is an artefact."* That is the sentence that reorders
      the board. We have been reporting `method_skill` at 0.517 inside a null of 0.429–0.572 and
      calling it an honest refusal about the COMPANY — and it is equally consistent with a world
      that has no per-customer signal in it, which would make the refusal a fact about the WORLD
      and every arms result an artefact of one. **We cannot tell those two apart today**, and until
      we can, the project's headline finding has two readings with opposite implications. Rung 3
      separates them, and nothing else does. The anchor half is the same item because his canon
      names it explicitly as debt — *"a world whose level sits on the exact edge of the band every
      year has almost certainly been fitted to that edge… that is what the recent churn anchor
      exhibited"* — and because the code already agrees. **Done means:** rung 3 measured on churn
      and answered in plain words, INCLUDING the answer *"the world does not discriminate"*, which
      is the most valuable result available anywhere on this board and hands the constraint to the
      world rather than to the company; the anchor re-fitted across both departure routes or
      explicitly declared unfittable with the reason; and every top-down construction found along
      the way **named as such in the record**, per his instruction to *"say plainly which were
      top-down."*
  - id: four-instruments-measure-one-route-and-the-published-mix-is-missing-its-largest-cause
    what: >-
      **Lane 0.** C1b made `capture_departure_factors` — which builds its table by wrapping
      `roll_lifecycle_event`, the renewal decision — into a recorder of the renewal-decision SUBSET
      of the book rather than the book. **Nothing went red**; the table kept its rows and every
      field populated, because it was the SCOPE of the population that moved. A two-route capture
      taken for the finding now sizes it: renewal decisions **465 → 144**, SVT segment decisions
      **1,266** where none were recorded at all, departures by renewal **79 → 32** against **50**
      off SVT — so **the population the year anchor is fitted on lost 69% of its rows, and the
      renewal table can see only 39% of departures.** Four readers take that table as their subject
      and must be repaired on a **declared denominator**: `tools/fit_year_level_anchor.py`,
      `tools/measure_departure_level.py`,
      `tools/population_anchor._churn_by_year`, and the C2 reason mix. **Do not union the two files
      into one table** — the finding is right that an SVT decision carries no `churn_probability`,
      no `sim_price_response` and no `sim_bill_shock_base`, and appending them hands every reader
      rows of `None` and lets a mean be taken across two populations. The separately urgent half:
      **`docs/reports/c2_reason_mix_interval.json` publishes bill_shock, dissatisfaction and
      price_position only**, while `departure_risks` describes `svt_inertia` as *"the single largest
      departure route in a real domestic book."* Every reader of that mix today is reading three of
      four causes as if they were four of four. Either publish the fourth cause or state on the
      surface which causes the mix can and cannot see.
    why: >-
      Second, because it is the measurement plumbing item one's refit runs through, and because one
      of its four readers is already wrong on a published page. The class matters more than the
      instance: this is *controls-keyed-to-a-structure-that-moved* arriving for the **fifth** time,
      and the population floor that normally catches it did not fire because the population was
      intact. Worth more than the repair is the lesson the finding draws and I am ratifying as the
      seat's: **the C1b author wrote the debt down at the site, precisely, naming both readers and
      predicting they would go stale on the next capture — and it still did not act.** It sat
      across a capture, a fit and two published readings. A deliberate debt taken at a seam needs
      something that FAILS or a queue entry that RANKS; a named comment is neither, and "write
      better comments" is not the repair. **Done means:** the four readers naming their population
      on every reading; the published reason mix either carrying its largest cause or saying on the
      surface that it cannot; and the seam debt carrying something that fails rather than something
      that explains.
  - id: the-bound-that-decides-cannot-resolve-is-still-from-another-world
    what: >-
      **Carried forward — drawn last stretch and NOT done, and the page got more honest about it
      rather than less.** `error_bar` still reads its spread from 2026-08-29T17:04:23Z against a
      point estimate from 2026-08-31T03:47:57Z, still carries its `staleness_caveat` verbatim, and
      `floor_decomposition` still reads `priced_decisions: 20` / `renewals_offered: 1369` when the
      current run priced 120 of 1,953. What DID move is the derived reading, and it is now sharper
      than my last direction was: **`point_estimate_inside_the_measured_band: false`** — the seed
      distribution is centred at −£1,614 with a range of −£4,274 to +£873, and the £2,574 contrast
      sits outside it entirely. So the old "£2,574 INSIDE ±£2,578" reading was comparing the figure
      to a spread around ZERO when the spread is not centred there. The page now says so itself:
      *"an estimate that has left its own error bar's range needs the error bar re-measured, not
      read as having escaped it."* Do exactly that — re-run both legs from one tree, then
      `--redraw-mode only|except` and `--decompose` — and **report the new spread BEFORE re-stating
      the verdict**, whichever way it lands.
    why: >-
      Third, and DELIBERATELY below the ladder items, which is the trade-off I most want on the
      record. This interval is the only thing between us and the first answerable claim against the
      thesis — *"there has to be a BASELINE to beat… or 'it performed well' means nothing"* — and
      last stretch I ranked it second. The canon moved it. **Re-measuring a noise floor around a
      contrast produced by a world that may contain no per-customer signal is measuring the
      instrument, not the thesis**; if item one finds the world does not discriminate, this bound
      is a precise interval around an artefact and the precision is worthless. It stays high
      because it is genuinely close and because a re-run in the right world converts an honest
      refusal into evidence either way. It is not first because a tighter bound on a number that
      may not mean anything is exactly the polishing this project is prone to. **Done means:**
      both legs measured from one tree with the current run's identity on each; the staleness
      caveat gone or replaced by what is now true; the resolve / cannot-resolve sentence re-derived
      rather than edited; and any movement that flatters us marked unattributable if more than one
      thing moved — which, after item one, it will have.
  - id: every-world-variable-says-where-it-stands-on-the-ladder
    what: >-
      **The director's canon work-items 2, 3 and 4, which are cheap next to item one and close
      questions he has explicitly registered.** (2) Each existing world variable states which of
      the four rungs it currently passes, on its own Knowledge page — his standard is that *"a page
      that cannot say is a page whose variable has not been validated"*, so **"not assessed" is a
      permitted and useful answer** and is far better than a page that implies validation it never
      had. Start with the variables the published arms figures are computed through, not with an
      alphabetical sweep. (3) Adopt the ladder as the stated validation standard for the
      choice-and-channel work in `DIRECTOR_BRIEF_CHOICE_AND_CHANNEL_2026-08-30.md`, so C2–C6 are
      built against it rather than retrofitted. (4) **Register the generative-futures anchor
      question as CLOSED by rung 2** — he asked on 30 August for a choice between *"preserves the
      statistical shape"* and *"honestly unanchored"* before that work began, called them
      *"different projects and I'd rather choose than drift"*, and his own canon answers it:
      *"anchored to mechanism, validated on history where we have it, and applied where we don't."*
      Record the closure citing his document; do not re-open the choice.
    why: >-
      Fourth because it is the systematising half and it must not outrank the measuring half — a
      ladder applied to one variable properly is worth more than a ladder recited on twenty pages.
      But it is not tidying: item (4) closes an open director-registered question that is currently
      **blocking the generative-futures capability from starting**, and it closes it with his own
      words rather than my judgement, which costs nothing and unblocks a lane. And item (2) is the
      cheapest defence against the failure the canon exists to prevent, because the rung a variable
      cannot claim is exactly where the next top-down clamp gets introduced by a bounded tick that
      cannot see the whole. **Done means:** the arms-facing variables each stating their rung
      standing, with honest "not assessed" where true; the choice-and-channel brief carrying the
      ladder as its validation standard; and the generative-futures anchor question registered
      closed against the canon that closed it.
not_now:
  - what: >-
      Re-running the value-arms A/B on more seeds so the ±£2,578 comes down and the £2,574 contrast
      resolves one way or the other.
    why: >-
      Carried for the second direction running and now refuted TWICE over. The page's own text:
      *"more seeds would not resolve it: re-drawing the dice measures this spread again, it does not
      shrink it"* — the spread is the instrument's sensitivity to the per-household price-sensitivity
      draw, not sampling error around a mean. And this stretch added the sharper reason: the point
      estimate sits OUTSIDE the seed band entirely, so the two are not even commensurate yet and
      more draws of the wrong band buy nothing. It stays here because it is the single most tempting
      move on the board and because doing it and reporting a resolved contrast would be manufacturing
      the result item three exists to measure honestly.
  - what: >-
      Repairing the departure record by widening the published band, by scaling the aggregate back
      onto it, or by writing 2022 renewal rows from anything other than the world producing them.
    why: >-
      New this stretch, and it is rejected on the director's authority rather than mine: *"the one
      move that is always wrong: clamping an aggregate to pass a check. It passes the test by
      destroying the thing the test exists to protect."* Recording it because **I was about to walk
      into the 2022 version of it.** My last direction read 2022's absence from `customer_events` as
      a breach of the historical-truth wall. The leading explanation is now that it is **rung 2
      working**: fixed prices sat above SVT through the crisis, so no household took a fixed deal
      and no renewal roll fired — and the canon uses that exact mechanism as its worked example,
      *"2022 is where we saw it, not why it is true."* Not established, and item one must settle it.
      But a year that is empty because the mechanism emptied it is a world behaving correctly, and
      writing rows into it to make the record look complete would have been the purest form of the
      move he just forbade.
  - what: >-
