thesis_read: >-
  Six hours, 16 commits, 13 carrying work. The split is supplier 1, world 2, both 2, other 11, and
  no level moved. Against the thesis the evidence did move, in-sample. 9e57aee83 graded the second
  0.12 replication pair: cut minus A is +GBP 1.27, the two-pair mean +GBP 1.18 (+0.33 to +2.30), and
  value minus flat book +GBP 5.23 (+0.09 to +10.33). It is still a redraw of the fitted households
  with no flat-rules twin. So the honest answer to "does the per-customer supplier beat the flat
  one" is still "not shown out of sample", and the s.12g fresh-population test with the twin
  remains the only test that can say it. Last stretch's focus did bite. The stayers fix landed
  (dd3f004de) and its control is green on origin (40cbb7432), the replication pair was graded, and
  the shared tree rejoined origin (77467e08e). The stretch's real finding is that the supplier is
  starved of evidence, not of code. sim-runner has built no book since 20 Nov 15:39. Every queued
  supplier grade waits on it (D48, KNIFE3, dual-fuel, B12, B8), and s.12g's 34-hour run is queued
  behind it. The two grades drawn this stretch (B8 holdout, KNIFE3 I1-I5) found no book and landed
  nothing. The executor's turn on the book did find, and fix (25f0ea40b), that the book would have
  dropped three of the records those grades read. sim-runner's journal from 20:45 to 21:25Z names
  why it is still not built. Landings keep overtaking it. The head-green census holds 11,981 MB.
  And since 20:45 two company/billing files carry another lane's uncommitted C32 hunks on the
  shared tree, so every cycle fails code admission. Separately, a8fe215bc built the switching GSOP,
  and 5ce811272 then found that won switches are never put on supply: on the 20 Nov run 16 were won
  and 0 billed. So acquisition value has been read off customers who never reach the book. That is
  now mid-landing in the executor. Focus is the book first, because one artefact unblocks five
  supplier grades and the thesis test.
