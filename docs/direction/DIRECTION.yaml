thesis_read: 'Level on code, and the first reading of the thesis comparison itself is a tie. 12 commits, all carrying
  work, 6 substantive; the brief splits them 1 supplier, 0 world, 11 other, but that split is by file, and most
  of the 11 are supplier grades filed as staging records. All three of last record''s items were drawn and landed:
  the D48 instrument (8e99f83cd), E6''s early-warning slice (cda47a346) and the brief''s draw-hold reasons (b0963f254).
  No level moved. WHAT IT MEANS. (1) The per-customer switches against flat rules, one seed, one book (c576f5f98):
  flat has one fewer departure and is GBP 97 ahead. Targeted retention moved about GBP 2.8k to households to keep
  about two. The renewal desk advises in 39% of decision states, but 508 of 514 advised rows carry C35''s rise,
  so advice without a rise is 0.44%. On this evidence the per-customer supplier does not yet beat the baseline,
  and nobody yet knows whether the cause is inference (the belief cannot find the leavers) or the lever (it finds
  them and the offer moves nothing). Item 1 splits those two from artefacts already on disk, before anyone builds
  the advice-sending act the grade names. EP17''s six seeds are still the blind grade and still wait on the director.
  (2) E6 as built made the provision worse where it fired: MAE 3.75 against 1.70 (0b0911dba), because it learned
  the failed month as the signal''s outcome. The one-variable fix is landing now (surgical_land pid 50155) under
  its continuation, so it is not in focus. (3) Bad debt is attributed but not solved. The budget switches raise
  the IFRS 9 crisis share from 0.14% to 0.40% (a8e06397c). The finding stays BLOCKING because 0.40% is still 2.5x
  under the 1% floor, and nobody has said whether that gap is the world''s arrears volume or the company''s provision
  rate. Item 2 decides which side it belongs to. (4) The queue: the scopex credit arm finished at 16:54Z and nocredit
  is running (the import death was fixed by 693353e7e), so the -GBP 3.91 grade is near 18:30Z. Then the retnet pair
  runs, and its off arm carries D48''s held-bill bills. Both grades are filed by their drivers. TWO CARRIED ERRORS
  LEAVE THE LIST BY TRIAGE, NOT SILENCE. The coupled-triad row is already_fixed by b0963f254: the brief now names
  each atom''s hold reason and the five walled atoms. The long-job expiry row is accepted today in wrong_triage.yaml,
  with its reopen condition, because about 40 register jobs have ended with no overrun since 12 Oct.'
