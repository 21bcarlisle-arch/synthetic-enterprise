focus:
  - id: grade-the-renewal-churn-belief-over-the-whole-book
    what: >-
      Build a HARNESS instrument that grades the company's renewal churn belief against the world's
      realised outcome over EVERY renewal in a full-window control run, not the 25 the value arm
      happened to price. For each renewal the world rolled, compute the company's own believed
      probability the way the desk does -- `saas/churn_model.build_churn_risk(settlement_records,
      customers, through_period=<the month being priced>)`, using only records observable before that
      month -- and pair it with the world's logged lifecycle event. Publish, per believed-probability
      bucket: n, mean believed, realised rate, and the count of accounts behind it. Then answer the
      one question in a sentence with the evidence attached: is the inversion at believed p_retain
      0.35-0.62 real at population scale, or is it n=4 and n=11? If it is real, name the MECHANISM --
      `build_churn_risk` is `BASE_ANNUAL_CHURN_PROBABILITY + k x CHURN_UPLIFT_PER_BILL_SHOCK`, so the
      candidate is that bill shock predicts the opposite of what the model assumes on this book, and
      that is testable directly from the same pairs. Re-state the ladder's level error (believed 33%
      against a realised 5.5%) on this population and say whether it survives. Do NOT change
      `BASE_CHURN_RATE`, `CHURN_UPLIFT_PER_BILL_SHOCK` or any cap in this item -- R12, the AUC is a
      diagnostic and never a thing to move. File the table as a finding under `docs/staging/` and bind
      the paths with `delivery_lane.record_landing` as each piece lands.
    why: >-
      This is the engine of the thesis and it is currently measured at below a coin flip on 25
      decisions. Four separately published numbers all rest on this one belief -- the A/B's 0.4653
      AUC, the ladder's 33%-vs-5.5% level error, EP1's collapsed hazard, and the arm's -0.077
      calibration error -- and every one of them was measured on a population small enough or broken
      enough to be an artefact. One instrument diagnoses all four at once, which is why it goes first
      under COMPOUNDING_WORK_FIRST. It is also the cheapest decisive thing available: it grades an
      existing company function against an outcome the world already logs, changes no company code,
      and cannot fail to produce a finding. Finished when the bucketed table exists as a named
      artefact over a population an order of magnitude larger than 25, and the document says whether
      the inversion is real and, if it is, what causes it. "The belief has no ranking power on this
      book and here is why" is a complete and valuable answer; so is "the inversion was n=4". Do not
      repair the estimator in the same act -- diagnose, then stop, and let the repair be drawn on the
      evidence.
  - id: the-third-arm-level-vs-selection
    what: >-
      Build the third arm properly, inside `renewal_margin_uplift`, exactly as
      `docs/staging/done/WORKER_FINDING_THE_LEVEL_VS_SELECTION_TEST_CANNOT_BE_BUILT_FROM_THE_FLAT_CONSTANT_2026-08-27.md`
      specifies: apply a FLAT uplift of the value arm's own realised median
      (`decision_shape.median_margin_gbp_per_mwh` = 44.50) at exactly the renewals the value arm
      prices, under the same lawful ceiling the value arm is held to. Do not override
      `TARGET_MARGIN_GBP_PER_MWH` -- that route was built, run and withdrawn in this stretch and it
      raises the base tariff of the whole book while the value arm's uplift touches 25 renewals, so it
      changes the population as well as the level, and it lets one arm price above the Ofgem cap while
      the other is clamped. Run it against the same book and seeds as
      `value_cycle_ab_resi_renewal_fixed.json` and report the three nets side by side. Then say which
      branch is true, in the artefact's own words: if flat-at-£44.50 reproduces the £7,066 the arm is
      a price rise wearing a model; if it does not, the per-customer variation is worth something even
      at AUC 0.4653 and the next question is what it is picking up. While you are in
      `decide_margin`, the FLAT branch's unguarded ceiling -- it returns before the `lawful` filter,
      so it CAN offer above the cap where the value arm cannot -- is a real latent defect and this arm
      makes it bite; fix it or state why it cannot. R15: mutation-test the new arm both ways, and the
      mutation that matters is the one that makes it a no-op.
    why: >-
      The £7,066 is the only number the value cycle has produced on the right book, and it currently
      cannot be reported as anything, because "the arm beats flat rules" and "raising prices 22x
      mostly worked on this book" are the same evidence until this runs. The construction is already
      specified and the two confounds that killed the cheap route are already written down, so this is
      the one item on the list where several hours of a previous attempt are recoverable by not
      repeating them. It is second rather than first because item one may change the belief this arm
      would be measuring, and because a level-versus-selection answer is worth less when the selection
      side is already known to carry no ranking power -- item one is what tells us whether that is
      still true. Finished when three nets sit in one table in
      `docs/design/THE_VALUE_CYCLE_REALISED_AB.md` with the book and clock named per R14, and the
      document states which branch is true. A negative answer -- "it was the level" -- finishes this
      item completely and is the more likely one.
  - id: the-ladder-headline-rests-on-the-broken-schedule
    what: >-
      `docs/design/THE_VALUE_CYCLE_REALISED_AB.md` publishes, as its answer to "is the advantage
      price rather than prediction", the section headed "the ladder: the win is NOT price". It was
      measured at 04:45Z from `value_cycle_price_ladder_2019.json`, which predates the renewal-schedule
      repair in `353fe96b8` by five hours, and its own `unmatched_diagnosis` records 18 decisions the
      world never rolled and 6 accounts it never rolled at all -- the identical defect that was proven
      eight hours later to invalidate the sibling `discrimination_auc` of 0.6944. Its two slopes rest
      on a common population of SIX decisions carved by that bug. First act, and it is cheap: annotate
      that section as provisional pending re-measurement, in the same supersession style the headline
      table already uses, so no reader takes it as settled. Second act: re-run
      `python3 -m tools.run_price_ladder` on the SAME 2019 window post-fix -- same window, not full
      window, because the point is to isolate what the schedule repair changed and the 2019 ladder is
      the nearest working analogue with a known cost (it completed in one tick at 04:45). Report the
      rolled population before and after, and whether the 1.16x slope ratio and the 33%-vs-5.5% level
      error survive. Keep rung 0: it is the null control the whole reading rests on and it reproduced
      the flat-rules control to the last decimal. If a full-window ladder is wanted afterwards, it is
      sized -- 53.3 min for `--rungs 0,0.5,1,2` at 559.8s/pass -- but 2.85 GB per pass against a 24 GB
      guest with 94 lifetime OOM kills is why it is one instrument per tick.
    why: >-
      A published claim resting on a defect the project has already proven fatal to its sibling
      statistic is the exact shape of false completion R1 and R3 exist for, and this one is worse than
      an unfinished item because it reads as an answer. The annotation costs minutes and removes the
      harm; the re-run is the measurement. It sits third because item one re-establishes the level
      error on a proper population anyway and may make half of this redundant -- but only half: the
      SLOPE reading, which is the actual "is the win price" answer, exists nowhere else. Finished when
      the section carries its provisional note AND either a post-fix ladder artefact with its rolled
      population stated, or a finding saying why the re-run could not run. The annotation alone is a
      legitimate partial close if the run does not fit the tick.
  - id: EP1_clv_three_horizon
    what: >-
      Smallest act yet, and different from the five before it: the ledger row is STALE, so re-measure
      it before reasoning about it. `353fe96b8` changed `saas/churn_model.build_churn_risk` (it now
      takes `through_period`) and `simulation/customer_events.py`, and EP1's hazard is
      `latest.churn_probability` read off that same estimator -- but
      `coupled_gap_ledger.json -> EP1_clv_three_horizon` still reads `measured_at:
      2026-08-26T11:46:22Z` at `run_git_commit: 8afa34ceb`. Run `python3 -m tools.couple_clv`, land
      the new row, and report three things against the old one: the gap (was 2.529), `distinct_hazards`
      in `components.lifetime_level` (was 1 across 33 accounts), and `median_believed_tenure_years`
      (was 20.0). Then say plainly which of two things is now true. If the collapse survives the
      re-measure, the localisation stands owed and the named candidate is unchanged --
      `clv_three_horizon.py:580` takes `hazard = latest.churn_probability` under a time model called
      `LATEST_RENEWAL_CONDITIONED`, one point out of a trajectory of up to thirteen -- and the act is
      to print, for the 33 graded accounts, every `churn_probability` in each trajectory beside the
      value at `[-1]` and the hazard the ledger recovered, which localises it to either the time model
      or the instrument's inversion. If the collapse is GONE, say so and say the schedule bug was its
      cause, because that retires five stretches of diagnosis.
    why: >-
      Every EP1 instruction for five stretches has proposed a cure without a diagnosis, and the sixth
      -- mine by inheritance -- asked for the diagnosis but was written against a ledger the code moved
      out from under within the hour. Re-measuring first is not a delay, it is the only way to know
      whether the thing being diagnosed still exists: the graded 33 all recovering exactly 0.05 across
      nine belief years was always suspicious as a MECHANISM, and a schedule bug that silently decided
      which accounts got churn decisions at all is a mechanism of exactly that kind. It sits fourth
      because it is a re-run of an existing coupler and cannot block anything above it, and because
      the gap it publishes is a diagnostic and never a thing to move (R12). Finished when the ledger
      carries a row measured at a commit at or after `353fe96b8` and a document states whether the
      hazard collapse survived. If it did survive and a changed estimator later puts more than one
      distinct hazard into the graded population with the coupled rung genuinely met, a level move is
      available on that evidence -- self-certify with `record_level_up_self_certified`, and never
      `--no-verify` a `level_current` change.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Fifth naming, and this time the act is ten minutes and its landing place is corrected. Grep for
      a non-test importer of `company/sustainability/carbon_intensity_register.py` and of
      `company/carbon/half_hourly_footprint.py`. Write the answer into
      `docs/design/EP13_CARBON_INTENSITY_DISCOVER_FRAME.md` and NOT into the maturity-map entry: that
      entry sits at 11,940 B against the 12,288 B per-atom cap, so a note written there refuses the
      commit tree-wide, which made the previous instruction's own cheap close unbuildable. If a real
      company belief about emissions exists, build `tools/couple_carbon_intensity.py`, grade it against
      the world's outturn and put the row in `coupled_gap_ledger.json` beside the others; R15,
      mutation-test it both ways. If it does not exist, write exactly that: EP13's L3 is unreachable
      until something under `company/` consumes the carbon number, and building that consumer is the
      real owed work. Keep the framing -- L2 is "mechanically real, happy path" and the coupled rung
      binds L3, so `level_current: 2` with no coupler is a supported level with no path to 3, not a
      false claim. Separately, the SIM-side re-measurement parked in
      `docs/staging/in_progress/WORKER_FINDING_THE_EP13_EMBEDDED_GENERATION_BOUND_ARTEFACT_IS_STALE...`
      (pid 807748, launched 11:26Z) unblocks when the artefact reads `cells: 144` instead of 192 --
      check it, and if the process is gone and it still reads 192, relaunch and leave the file parked.
    why: >-
      The coupled triad says no world atom completes until the company has been tested against it, and
      the director asked for this one in his own words on 2026-08-25 -- "say plainly what it does and
      does not yet include." Four namings have produced four rounds of SIM-side science, all of it
      correct and none of it the asked question, which is a pattern in the instruction rather than in
      the tick: the previous version's escape hatch pointed at a file that could not accept the words.
      It is last because the four above are on the thesis's spine, and because writing down that the
      path to 3 is blocked is a legitimate and genuinely cheap close here. Finished when EP13 has
      either a ledger row grading a real company belief against the world's outturn, or a frame
      document stating plainly that no such belief exists and naming what would create one. A fifth
      stretch of SIM-side work does not finish it, however good that work is.
not_now:
  - what: Wiring the value arm to the live renewal desk.
    why: >-
      Rejected a sixth time, and this stretch supplied the strongest evidence yet against it: the arm's
      own belief now measures `discrimination_auc` 0.4653 -- below a coin flip and INVERTED in the
      middle of its range -- while it prices at 22x the flat rule, has 24% of its decisions set by a
      bound rather than by the model, and concentrates 99.3% of its realised movement in 15 of 211
      accounts. Wiring a live desk to a belief that is confidently wrong exactly where it is making
      decisions is the one thing this evidence forbids. `renewal_margin_arm` stays "flat_rules" and
      `company/policy/decision_policy.py` keeps defaulting to it. Ask again when item one says why the
      belief is inverted and item two says whether the money was ever the model's.
  - what: Repairing the churn estimator now that the inversion is visible -- re-levelling, re-fitting, or routing CLV to `estimate_churn_probability`.
    why: >-
      The most tempting item on the list and the one most likely to be a mistake. A −0.077 calibration
      error and an AUC below 0.5 are an invitation to tune, and R12 makes the AUC a diagnostic and
      never a thing to move; the last seat already nearly routed CLV to the "richer" 192-value
      estimator and measured it at AUC 0.4841 (p=0.725) against the coarse step function's 0.6155
      (p=0.004) -- richer was worse. Item one is deliberately written to diagnose and STOP for exactly
      this reason. A repair made before the mechanism is named would also strand items two and three's
      numbers the moment they land, which is the defect the 26 August book caused once already.
  - what: The full-window price ladder, and the AB-then-ladder pair in one tick.
    why: >-
      Now sized rather than guessed -- 53.3 min for four rungs, 71.9 for six, 78.6 for the pair, all
      inside the 120-minute bound -- so it is no longer arithmetically impossible, only imprudent. It
      loses on two counts. The memory figure got worse on inspection: 2.85 GB per pass against a WSL2
      guest reading 24.0 GB with 94 lifetime OOM kills, and a seven-pass ladder holds every rung's
      decisions at once, which is how the 02:14 tick reached 15 GB. And the comparison that actually
      needs making is the 2019 window post-fix against the 2019 window pre-fix, which is item three
      and is cheaper. Full window returns once the schedule repair's effect on the ladder is known.
  - what: The publish gate's speed -- 397s median commit hook against an 840s ceiling it has touched.
    why: >-
      Inherited and rejected a second time on the same evidence, which has if anything strengthened:
      21 commits landed in three hours without a wedge, the publisher reached origin 0.3 hours ago, and
      the two gate defects found this stretch were both correctness rather than speed -- the gate
      tested the worktree while the commit took the index, and its skip path never restamped the green
      clock. A gate that is slow but not blocking loses to a belief measuring below a coin flip at the
      centre of the thesis. It returns the moment a landing is actually refused for time, and if that
      happens twice in one stretch it goes first.
  - what: Fixing the seat's own steer-effectiveness control so it can see a Lane 0 focus item.
    why: >-
      Rejected a fifth time, and this stretch shows the defect from the flattering side rather than the
      damning one: `previous_focus_drawn` reported `steered: true` crediting EP1 and EP13 -- the two
      items that did NOT finish -- while the two that DID finish, the sizing measurement and the red
      census, are Lane 0 slugs the tracker cannot represent at all, because it is keyed by maturity-map
      atom id. The signal is wrong in both directions and I reconstructed the stretch from 21 commits
      and six artefact reads faster than the repair would take. It returns to focus the moment a
      stretch stops being reconstructable from the commits alone.
  - what: Working down the ~45 open findings in the staging root, and the class files.
    why: >-
      Left queued under SELF_INTERRUPT_DISCIPLINE, which exists because the supply of harness findings
      is infinite -- 41 LATENT and 4 RECORDED, none BLOCKING, and most of them auto-filed repeating
      alarms about docs a mid-work session left uncommitted. Three of them are already answered inside
      the focus items rather than worked separately: the A/B artefact naming its book was closed this
      stretch, the size-then-run alarm is item three's subject, and the level-vs-selection alarm is
      item two. The rest are hygiene, and none of them is on the thesis.
  - what: The two R13 curriculum items -- reference-frame divergence, and book age.
    why: >-
      Recorded and deliberately not escalated, unchanged from the last two orientations. The company
      is structurally unable to see the quantity the world punishes (`rate_increase_pct` never carries
      the SVT level) and 31.3% of the ladder's decisions have the two references pointing opposite
      ways; only 74.3% of the electricity book has any renewal decision in the window and the median
      actionable account has two, which BOUNDS what any A/B on this book can show. Both are baseline
      or curriculum questions that must be decided blind to company P&L, and this seat has read that
      P&L. The director has taken book age -- "Book age is mine and I'll come back on it" -- so it is
      his and pending, not owed by me. Neither blocks anything above.
