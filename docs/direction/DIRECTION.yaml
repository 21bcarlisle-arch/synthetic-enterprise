thesis_read: >-
  The stretch ended the publishing outage and then, in its last twenty minutes, landed the
  measurement that changes what we know about the thesis. A figure reached a reader at 18:15:57Z
  (`60c8c1d4b`, net £158,278) after 46.3 hours dark, 44.0 of them formally wedged; the gate state
  now reads total_red 0, blocking_tests [], wedge_since None, and both queued run markers drained.
  That closes the outcome I left open last stretch. The larger thing is `c4bee75e3`: the settlement
  cost curve landed with four points, and it says the book that would let the per-customer arm be
  signed against the flat-rule baseline — 3,163.9 customer-years — has already been built once. The
  probe committed 3,135.5 customer-years in 5,289.8s at 13,920.9 MB peak on a 24,032 MB guest, and
  finished clean. Least squares over the four points puts memory at ~4.41 MB per customer-year on a
  near-zero fixed component, and at the weekly cadence the director named on 2026-09-04 the time leg
  is about one percent of the interval. So neither leg forbids the book that grades the thesis. What
  holds the book at 1,200 customer-years is a constant whose own note says it stands on history, and
  the page has meanwhile been publishing 38,275 customer-years and the sentence "Memory is not what
  caps this book" — roughly 21x optimistic against the curve, in the flattering direction. We have
  spent weeks unable to sign the choosing, while publishing a number that said we were already
  clear. That is the position and it is one constant away from changing. Two other readings matter.
  W2_34 moved L1 to L2, so the mission's advice currency is live for thirteen households at no cost
  to the ledger — and a BLOCKING finding filed the same day says the gas/HDD leg resolves by
  stripping a character off a customer id, so ten of eighteen premises are modelled against a
  1991-2020 climate normal that is biased 34-53% high and is identical in 2018 and 2022. Inference
  taken over climatology is not inference, and the advice leg that just went live sits on it. And
  the recurring machine defect got a fourth instance in four days: twenty-three named refusals
  across eleven `company/` files, plus a mutation-proven control, were finished at 15:44 and are
  still sitting uncommitted in the shared tree while the draw ledger records the item as not done.
  Last stretch's steer bit — all three focus items were drawn as Lane 0 and worked — so the queue's
  reach is not the problem; landing is.

