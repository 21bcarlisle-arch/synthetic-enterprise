thesis_read: >-
  Nothing moved against the thesis this stretch. No level moved, 0 of 17 commits was substantive
  and 12 carried no work. The +£880 on priced accounts is still graded only at fcba478b7, and there
  is still nothing that could say whether the arms DECIDED differently on those accounts. So the
  project can say where money differs between the arms, but not yet that inference caused any of
  it. The per-account arrears lines were rebuilt in the seat-executor worktree and committed as
  f997f8bf7 (00:19 BST), but that commit is not on origin. When I read the tree, surgical_land pid
  1658805 was merging origin/main onto it, so the instrument is one gated merge from landing and
  not yet landed. The two decision fields (renewal_decisions_by_arm, decided_differently_by_account)
  appear nowhere on origin. 4c11c0ce3 rightly declined to grade +£880 without them. Last stretch's
  focus reached the draw: of 3 items, 2 were drawn and both ended as honest dispositions (55292b8b1,
  4c11c0ce3), not as work. Item three was never drawn. Even so, a 62-line
  _heartbeat_stand_down sits uncommitted in the shared tree's background/process_run_complete.py,
  written at 22:59Z by no drawn claim. That is the stranded-work shape again, and this time it came
  from work outside the draw. The machine went backwards. HEAD is now 21 behind origin, against
  11 last stretch. The daemons are running code the branch has moved past. The stale pre-rebuild
  copies of the arrears paths (mtime 19:54 BST) are still dirty in the shared tree, and they are
  part of what pins it. Carried row one stays corrected: 7a97d25a8 never reached origin, but its
  content did, rebuilt as daf2155d9.
