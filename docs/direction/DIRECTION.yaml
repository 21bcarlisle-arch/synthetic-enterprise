  side: supplier
  written_at: 1794929203.744
- id: focus-outranks-a-continuation-chain-of-any-author
  what: In background/delivery_lane.py the continuation-before-focus swap (SELF_HANDOFF_CHAIN_LIMIT, _self_issued_chain)
    counts only continuations written by a tick that held a claim. Continuations written by a session
    with no claim never trip it, so on 17 Nov five were drawn in a row and focus 1 went undrawn for two
    stretches. Add a second leg. Once the current DIRECTION.yaml's first focus item has gone undrawn through
    SELF_HANDOFF_CHAIN_LIMIT or more consecutive continuation draws since the record's oriented_at, the
    next draw takes that item before any continuation, whoever wrote it. Continuations gated by a "DO
    NOT DRAW BEFORE" date, or held on waits_for, are unaffected. Write one control over the whole partition,
    asserting in a single statement that a continuation can still win the first draw and that focus wins
    after the limit. Mutate the new leg off and show the control goes red. Then replay the 17 Nov draw
    ledger through it and record which draw would have taken focus 1.
  why: The steer is the thing that drifts. This stretch the first item was drawn, but only because the
    queue happened to be mostly date-gated. The mechanism that starved two records is unchanged, and the
    queue refills every stretch. Done means the leg and its mutation-proven control are on origin.
