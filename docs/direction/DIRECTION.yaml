focus:
- id: n14-back-billing-reads-the-payment-method-on-the-bill-date
  lane: D_billing_metering
  side: supplier
  what: 'Close N14 (docs/staging/SEAT_FINDING_THE_SEVENTH_COLD_READ_FINDS_PAY_ON_RECEIPT_CUSTOMERS_BACK_BILLED_BEYOND_TWELVE_MONTHS_ON_A_DIRECT_DEBIT_THEY_CANCELLED_2026-11-03.md).
    First, check origin for the W2_41 mandate-cancel landing (surgical_land pid 933878 at the brief).
    It touches the same mid-tenure direct-debit cancellation, so build on it and do not race it. Measure
    first: for each of the 8 pay-on-receipt catch-ups (start with PROS-2018-0016), print what payment_channel_feed
    answered, the method on the account''s ledger payments around the bill date, and which back-billing
    basis company/billing/monthly_bill_assembly.py (BASIS_DD_AT_RECOVERY_ACTION, line 507) took. Then
    read docs/market_research/back_billing_and_liability.md and SLC 21BA in docs/domain_artefact_library/,
    and write on that page what the supplier knows about how an account pays on a given date (its own
    mandate and payment records), with any GAP labelled (K8). Fix the side the trace names, so that a
    catch-up on an account paying on receipt at the bill date is capped at 12 months. Add a test that
    reds on today''s code. Leave the side to the trace: the undated simulated_payment_channel answer is
    the suspect, not the verdict.'
  why: 'It is a real back-billing breach: a supplier charging energy SLC 21BA bars, to customers who paid
    it. It blocks the exit test as a new class. Done means the trace is printed in the commit or a record,
    the knowledge page says what is known about the dated payment method, and the fix and its red-on-today
    test are on origin, or the record shows why the 8 are lawful.'
  written_at: 1793687238.507
