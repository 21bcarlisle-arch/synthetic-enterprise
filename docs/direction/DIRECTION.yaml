focus:
- id: w2-36-d48-unbilled-gap-row-lands
  what: 'Land the W2_36 <-> D48 coupled-gap row. Its runner tools/couple_w2_36_d48.py (2026-11-08) is
    UNTRACKED in the shared tree, and docs/observability/coupled_gap_ledger.json has no W2_36 key on origin
    or in the shared tree, although the D48 finding on origin (SEAT_FINDING_D48_BILLED_EQUALS_METERED_..._2026-11-18.md)
    says it landed. First, delete the runner''s UNMEASURED_PAIRS block, so that it cannot write null W2_30
    and W1_14 rows over the ones aca12f3a5 landed. Then run it on the published book run_output_6af7fd0bfd,
    reading only and building no book. Pre-register the sign and rough size of billed-minus-used per account
    before you run it. Add a test that names its defect: a rerun must leave the W2_30 and W1_14 rows byte-equal.
    Build hunks for the W2_36 row only with tools/isolate_hunks.py, and land the runner, the test and
    the row through background/launch_long_job.py with surgical_land --content, never inside the tick.
    Correct the finding''s "landed" sentence beside the claim, with the commit.'
  why: Unbilled energy is the first item on the director's billing-accuracy list. The unmeasured W2_36-D48
    gap is the stated reason W2_36 is held at the coupled-triad L3 wall, and the measurement already exists
    on disk. The risk is that a rerun or a reap loses it. Done means the runner, the test and the W2_36
    row are on origin, the finding names the commit, and the brief's hold reason for W2_36 no longer cites
    an unmeasured gap.
  lane: D_billing_metering
  side: supplier
  written_at: 1795080484.913
- id: knife3-moves-the-next-billing-decision-out-of-simulation
  what: 'This is a Lane 0 slice of KNIFE3_wall_crossing_paydown. Take the next billing, home-move or unbilled-energy
    DECISION still computed in simulation/, as listed in docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md.
    The dual-fuel set-off (1c5351d18) and the statute-barred write-off date (5e554a00b) are done, so take
    a different one. Leave out the retention guard''s _would_offer and retention_cut_at_the_flips in simulation/run_phase2b.py,
    because the value test is measuring them. Move it into company/ the way 5e554a00b did: the company
    decides from its own ledger, and the world keeps only the event and its timing. Run tools/write_time_gate.py
    --explain and carry the REUSE block. Pre-register a pure move: the replay on run_output_8a300fa561
    must be byte-equal on every affected field, and any row that differs refutes the move and is named.
    Mark the register row as moved, with the commit.'
  why: The advantage must come from inference, never from access. A supplier decision computed on the
    world's side is access by construction, and it makes any per-customer result unattributable. The last
    slice landed in one tick, byte-equal, so the slice size is right. Done means one more register row
    is moved and byte-equal on the replay.
  lane: H_harness
  side: supplier
  written_at: 1795080484.913
