  what: 'C34''s debt decision cannot be graded: the world answers every plan offer None (no published take-up or keep rate), no payment-method change crosses the seam, and withholding the SLC 27.8 offer
    is unlawful, so a per-customer debt rule and the flat plan rule are identical by construction on any book.'
