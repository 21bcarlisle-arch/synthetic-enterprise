thesis_read: 'The world got more faithful again this stretch, and that is where the thesis stands: on
  the precondition, not yet on the claim. A home now owns only the appliances EFUS says a home its size
  owns (382545f34). The world''s half-hourly texture median moved from 0.205 to 0.161, against a real
  0.158, and three of W1_29''s four legs pass. The gas-heated home''s season is as close as sourced terms
  can take it (1.288 against SERL''s 1.36-1.47). The heater was re-anchored to CAR''s 656 kWh, lighting
  was shown not to be the gap, and what remains is unnamed. Two errors are corrected with evidence on
  origin: the electricity first-term lookback is flagged or refused (b9d1ec2f1), and both reds at clean
  origin pass (9b6b752ab). B7 slice 5 stops writing the change-of-tenancy window off twice. C34 and W2_39
  each moved 0 to 1, and W2_39''s wiring note found that waking a resi household is not structurally harmful.
  It went backwards in one way that matters more than any of that. Four changes to how homes use energy
  landed today, and neither world digest moved, so every run artefact and value-arms bound from this morning
  carries the same world stamp as tonight''s. A comparison between the company and its flat baseline across
  that line is two worlds read as one, which is exactly the failure the fidelity precondition exists to
  prevent. That is focus item one. Against the thesis itself, the per-customer-versus-flat question is
  still not separable on one book (EP17, the director''s row). The couple_fabric panel''s re-keying is
  honest: inference forgoes about GBP 9,700 against EPC''s GBP 33,000 on 15 homes, but it is not a book-level
  result. The previous focus was named and all four items were drawn. Two landed, the gas-season terms
  and the two reds. Two landed nothing: PB4''s Expert Hour (2491 -> 2583 unchanged draws, still not_attempted)
  and D48''s direct-debit line. Both were named by atom id, and both atoms are ones the draw cannot move,
  so the steer itself drifted. Both are re-issued as Lane 0 items. acff52923 in /var/tmp/se-draw-order
  is DISPOSABLE: its content is on origin as 20c9c52c9, and only a dead owner''s lock holds it.'
