- id: canon-d11-says-the-public-site-exists
  raised: '2026-11-19'
  kind: canon_intent
  decision_kind: strategy
  what: Canon D11 says the public site exists so that an intelligent stranger can understand the project
    and follow its progress. Your 19 Nov ruling puts poesys.net behind a login, so a stranger can no longer
    reach it. The repo and the github.io copy stay public. Page copy that calls the site public is unchanged
    until D11 says what the site is for now.
  proposal: 'Amend D11 by adding one sentence after its first: ''Readers reach it by invitation, behind
    a login. The repository and its github.io copy stay public, so the login keeps out search engines
    and casual visitors, not a determined reader.'' The rest of D11 (no house vocabulary, weekly Monday
    publish, the banner) stays as written, because an invited reader is still a stranger to the project.
    Once you agree, the machine updates the site pages that call it public to say ''by invitation''.'
  recommendation: I recommend you approve that one added sentence, and keep the newcomer test for invited
    readers.
