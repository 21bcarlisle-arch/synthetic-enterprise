focus:
- id: chosen-book-bad-debt-read-against-what-the-company-could-see
  lane: B_commercial
  what: 'Before running anything, write a prediction file. Then, from the filed b422 run of ARM B (chosen, 57) and
    ARM C (cull57) (recipe ~/.cache/seat_lane0_20261006b/), decompose B''s net-margin deficit against the blind
    span line by line. Account for all of it, not only bad debt: B''s deductions from gross exceed A''s by about
    16k, and bad debt explains about 6k of that. Then list the accounts B keeps and C drops, with each one''s realised
    bad debt, and with what the company''s own records held about it at the moment of selection (payment history,
    arrears, debt flags, payment method; observables only, through company/interfaces/sim_interface.py). File the
    result under docs/staging/ and append its verdict to docs/design/blind_envelope_arms_2026-09-11.json''s re_run
    note.'
  why: The thesis says the company beats flat rules only as far as it infers the truth. On the cleanest comparison
    we have, it loses on net, through bad debt. One book cannot say whether the net sign is real (EP17), but it
    can say whether the excess debt sat in accounts whose risk the company could observe (an inference gap to build
    into selection) or could not (an honest loss of a per-customer view). DONE when a filed result names which,
    with the account list and the unexplained remainder of the 16k stated, and the prediction is graded beside it.
- id: pb4-closes-the-fixed-term-end-refix-share
  lane: W2_customer_generator
  what: 'Close PB4_engagement_separated_from_elasticity''s two open Expert Hour questions from 789083280. D1: the
    world sends about 65/31/4.5% of fixed-term ends to default/re-fix/out against Ofgem''s EFTC control arm 81/14/6.
    First establish from the published trial what population and years that arm covers, and whether it is the right
    comparator. Then either re-fit the world''s re-fix share to it, as a one-variable change with the prediction
    written first, or file why it is not the comparator. D4: put the emerged pattern on the page (low-engagement
    households switch less on a given saving). If both close, record PB4''s level move through tools/level_promotion_gate.py.'
  why: A world that re-fixes twice as many households as the published record flatters every retention decision
    the company is valued on, including C29 and C34, and PB4 has sat at 2738 unchanged draws. DONE when D1 and D4
    are each closed or filed with a named reason on PB4's row and in its simplification record, and the level is
    recorded or its remaining blocker named.
