for_the_director:
  - id: the-site-login-you-ruled-on-19
    raised: "2026-11-19"
    kind: reserved
    decision_kind: g5
    what: "The site login you ruled on 19 Nov cannot start until Cloudflare Zero Trust is switched on for the account, and that sign-up screen may ask for a card, which is yours. A read-only probe (Actions run 44569003701) found Access not enabled: every Access endpoint answers 403 access.api.error.not_enabled. Everything else the ruling asked for has landed: robots disallow, noindex on every route, and the deploy check ready for a service token."
    proposal: "One step for you: in the Cloudflare dashboard (dash.cloudflare.com), open Zero Trust, pick a team name (poesys is fine) and choose the Free plan. If it asks for a card, decide whether to give one; the Free plan covers up to 50 readers at no charge. Then either reply 'go' so the console session sets up the Access application, or create an API token with 'Access: Apps and Policies Edit' and 'Access: Service Tokens Edit' and add it as an Actions secret. The machine then gates poesys.net, poesys-net.pages.dev and *.poesys-net.pages.dev with one-time email codes, your address as the only reader, proves each route refuses an unauthenticated fetch, and records how to reverse it (delete the Access application). No DNS change is expected."
    recommendation: I recommend you do the Zero Trust sign-up on the Free plan, and decline it if it insists on a card; tell me if so and I will propose a Pages-Function password gate instead, which needs no card.
    based_on: 57a89f463f
    status: open
    resolution: ""
    g5_class: real_money
