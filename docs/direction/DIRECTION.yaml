thesis_read: 'Level, not backwards, and the supplier did not move. 7 commits, 6 carrying work, 4 substantive; the
  brief splits them 1 supplier, 2 both, 4 other. Read by subject, almost all of it was the census getting cheaper
  (83eb9c697, a854b39ff, cab11a590: the forward price, the hedge lookup and two per-renewal book scans now read
  indexes instead of the whole book) and the path embargo (a5f9cd768). These are real but they are machine work.
  No level moved. Of last record''s three items, the path embargo landed and holds the per-customer grade on flat.rc.
  D48 was drawn and did not do what it was asked: the tick wrote that no run carrying 4d6d5ab91 exists, but the
  retention-netting off arm is that run and is still queued, unedited. E6 was never drawn. So both supplier items
  in last record''s focus ran to zero, and the steer is the thing that drifted. This record re-issues both as Lane
  0 items, so a tick is handed the instruction and not just the atom. WHAT IT MEANS. (1) The thesis comparison is
  two arms of three. current and all_on are finished (rc files at 09:48Z and 12:21Z); flat is 1h58m in and should
  end near 15:00Z, when its grade is drawn. That book is a diagnostic; the real flat-against-per-customer grade
  still needs the director''s six EP17 seeds. (2) Compute is still the supplier''s bottleneck. After flat come scopex
  (which decides whether the -GBP 3.91 renewal figure behind the open C34 concern is real, near 19:00Z), baddebt
  (the BLOCKING crisis bad-debt control) and retention netting, to about 01:00Z. The sim-runner defers to them,
  which is why D48 must ride the retnet off arm. (3) The coupled-triad row has been listed 27 times unchanged. The
  reason is already computed in supervisor.build_atom_hold_reasons, so item 3 is a small read, not a design. The
  publisher has said FAILING for 53h, and the publish is held to 26 Oct.'
