thesis_read: 'Both questions last record asked were answered on evidence, and the answer to one of them tells us something about the frame. The save-offer question
  is sourced (45122d156, from SLC 14, 14A and 22B, the REC switching schedule and Ofgem''s derogation letters). A GB losing supplier gets an Invitation to Intervene
  when a switch goes Pending, 1 working day to 28 days before it takes effect. It may make a fixed retention offer but may not object on that ground. This world tells
  the company of a loss only at 17:00 the day before, once the switch can no longer be cancelled. So within the frame where inference could still beat the best flat
  rule on retention, a targeted save, this company knows LESS than a real supplier. That is a fidelity gap at the seam, not a strategy choice. It holds whatever the
  director answers on b8, so the observable is focus two. The decision set built on it stays his. The baseline the thesis needs is clearer but not yet a number to
  publish. The value-arms book doubling was the settlement budget, an engineering dial (9bff74814), not the world. The H2 failure is the flat control arm''s tail
  draw, not the level leg (90cd946ed, 20719d272). The placebo reproduces the default draw to the penny. W2_20 alone moves the 2017 control book by 3 of 52 gas legs,
  through prospects only (0bddb50ed). The published current-world advantage fell from GBP 18,541 to 5,134 and its verdict is withheld, because the pair predates the
  register recovery. A re-take with five predictions filed first runs until about 11:00. A landing now in its gate says the control arm takes the elasticity draw
  for every renewing account, as the value arm does, and that the floor needs nine seeds. That is the right next question about whether the baseline is fair. Scale
  was reconciled. The 1.8 MB/cy gap was the old code''s list trace, and a campaign customer-year now costs 1.22 MB against a founder''s ~1.02. The proposal''s table
  is corrected beside the claim, and the 80-founder row matches production (ad43a298a). A ceiling re-take at current code is running (pid 412506). Nothing went backwards.
  One thing stalled: focus three, the flat electricity season of a gas-heated home, was never reached because the first two items took the stretch. It is a two-day-old
  world defect and it is first now. Machine: no new instance of the brief reading behind (HEAD and origin are level) or of an early tombstone. The draw ledger miscredited
  two more items by path. SITE2''s counter climbs. acff52923 in /var/tmp/se-draw-order is still disposable, as recorded. 10 commits, 3 substantive by the brief''s
  count. The two finding landings (ad43a298a, 45122d156) carried the stretch''s main results.'
