- id: the-commit-gate-finishes-inside-its-hour
  what: 'Measure why landings are not reaching origin, then fix the cause the measurement names. At 19:40Z
    the commit gate (tools/git-hooks/pre-commit) ran past 3600 s and refused land-se-seat-executor-1795372804
    (its log is /var/tmp/longjob-land-se-seat-executor-1795372804.log). land-reg-6c-erroneous-gains has
    been in surgical_land since 19:40Z (pid 134360, 1.7x its declared 60 minutes) while origin moved five
    times. Do not kill pid 134360 or anything under longjob-value-test-cut012-new-book. From the reg 6C
    log, the 19:40Z refusal and one gate run from before s.12g was admitted (19:32Z), print the wall time
    per gate leg and the count of re-gates after origin moved. Then say which cause it is: test-selection
    growth, memory or CPU contention with the 11.8 GB s.12g, or full re-gating after origin commits that
    touch disjoint paths. Fix that cause in the gate or in tools/surgical_land.py. Raise the 3600 s timeout
    only if the numbers show the selection is right and contention is the whole cause, and say so in the
    commit. This item covers the gate and nothing else. Re-landing the bounded-landing hand-off stays
    with its own continuation (re-land-the-bounded-landing-hand-off-if-it-did-not-reach-origin).'
  why: Every supplier result reaches origin through this gate. A finished fix was lost this stretch because
    its landing could not finish. For about 33 more hours s.12g shares the box with every landing. Done
    means the per-leg table and the named cause are in a staging finding, the fix is on origin, and one
    landing started after the fix reaches origin inside the timeout while s.12g is still running.
  lane: H_harness
  side: other
  written_at: 1795382825.045
- id: a-level-leavers-refund-is-paid-on-the-credit-it-held
  what: 'Work item seat-finding-a-level-leavers-final-bill-is-netted-on-the-page-and-collected-at-face-by-the-world
    (finding in docs/staging/done/, knowledge docs/market_research/home_moves.md s.8.8c, choice 14). It
    needs no new book: use the newest published book (6a588a832f) and its billing ledger. For each leg
    where simulation/arrears_engine.balance_settlement_from_outcomes netted a level-DD surplus against
    a mover''s final bill (195 legs and GBP 4,715.67 on 6fe7827ab2), trace who pays the closing-credit
    refund and from which figure. Then compare the refund the supplier paid with the credit the account
    held before netting. Print count and GBP by year. If the supplier under-refunds, fix it in company/billing
    so the refund is the credit held, with a control that names the defect (SLC 27.17, GSoP reg 6D). If
    the shortfall is only the world collecting the final bill at face (background/live_payment_triad.record_period),
    do not change the world in this item. Pre-register the legs'' money-in and refunds, as the finding
    asks, and file that world half with those numbers.'
  why: The director ranks billing accuracy at home moves first in the supplier order, and a household
    refunded less than it is owed is value transferred, not created. This is the one billing-accuracy
    defect on file whose size is already measured and whose trace needs no new book. Done means the work
    item is closed with the count and GBP of under-refunded legs on 6a588a832f (0, or each named with
    its writer line), and either the company fix is on origin or the world half is filed with its pre-registration.
  lane: D_billing_metering
  side: supplier
  written_at: 1795382825.045
- id: B8_discovered_price_sensitivity_holdout
  what: 'Write and land the pre-registration for switching B8''s blind holdout ON in the standing policy,
    before any book that carries it exists. It is default-off on origin (318d042e7e). In 2017 it was shown
    holding out 16 of 72 considered renewals (e2515972e). It turns on in the first book after the five
    pending grades (D48, KNIFE3 I1-I5, dual-household answers, won-switch P2-P5, ending-term belief).
    The pre-registration states: the holdout count per year with an interval, the price-sensitivity estimate
    it should let the supplier discover and its expected width at that count, and what it costs in renewal
    margin for the held-out households. It also states which of the five pending grades'' predictions
    it would disturb if it were on in the same book (expected: none, because it lands after them), and
    the rule that would turn it back off. Put the switch-on under a named flag, ready but off, and arm
    one continuation that reads it on that later book.'
  why: The thesis says advantage must come from inference, and a holdout is how the supplier learns price
    sensitivity per customer instead of being told it. The director has ruled holdouts yes. Writing the
    pre-registration now, while the box is held, means the switch-on costs no book later. Done means the
    pre-registration and the default-off switch are on origin with an earlier commit time than any run_output
    that carries the switch, and its reader is in seat_continuation.live().
  side: supplier
  written_at: 1795382825.045
