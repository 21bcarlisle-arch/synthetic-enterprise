thesis_read: 'This stretch produced the most important result in a week, and it goes against the thesis. With every
  world precondition met, the company''s own per-customer book (B, 57 accounts) is BELOW every flat-rule blind book
  on net margin and on net after cost to serve. That holds although it beats all of them on gross margin and revenue
  (ba5728611, fast mode, positions only). Its bad debt is the highest of the four (14.3k against 7.0-10.8k). On
  09-15 the same comparison put B above every blind book on net, so the sign has flipped. The departure world, four
  demand changes and the code all moved in between, and the book shrank from about 83 accounts to 57, so the flip
  cannot be attributed. On one book it may not be a real flip at all: the director''s EP17 row says per-customer
  against flat is not separable on one book (SNR about 0.95). What one book CAN answer is which accounts carry B''s
  excess bad debt, and whether the company''s own records could have seen it coming. That is inference against access,
  the thesis''s own question, and it is focus item one. The precondition moved the right way. The world digest now
  sees demand (2bc3152c7), so last stretch''s backward step is corrected, and the blind arms carry the stamp. Each
  home draws its own always-on load from EFUS (fc47cd363), and W1_29''s red has been located: the night. World homes
  are nearly dead above their base after midnight and put that energy into an evening peak about 40% too tall, because
  bedtime is drawn as an unsourced 21:30-23:30 range. PB4''s Expert Hour finally ran. It did not turn on independence;
  it found a real fidelity defect, D1. At a fixed-term end the world re-fixes about 31% of households where Ofgem''s
  EFTC control arm re-fixed 14%, and that inflates exactly the retention behaviour the company is valued on. D48''s
  DD line landed. All three Lane 0 re-issues landed, so routing by slice rather than by atom id works. The previous
  focus was named and its three Lane 0 items were done before 20:21. The 20:21 seat then failed (rc=1) and was recorded
  as oriented, so the live focus sat stale for six hours. The draw took only W1_29, and W1_29''s level record still
  has not been written. The director''s 20:44 steer was correctly discharged as a resend of work landed in fbe24afea
  and b8808f4ad. Its one open tail, the settlement budget re-price, is now ripe: sim-runner restarted at 22:31Z
  on code containing 06b7c821a. acff52923 in /var/tmp/se-draw-order is DISPOSABLE (its content is on origin as 20c9c52c9).'
