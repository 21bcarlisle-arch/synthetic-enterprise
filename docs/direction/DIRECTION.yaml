for_the_director:
- id: the-26-oct-advisor-steer-asks-that
  raised: '2026-10-26'
  kind: canon_intent
  what: 'The 26 Oct advisor steer asks that a for_the_director row must name its G5 class or not be raised.
    Read literally, that ends the operating model''s escalation of strategy, vision and canon-intent concerns,
    which are not G5 actions. The seat enacted the narrower half: a reserved row must name its class,
    and only reserved rows are shown as waiting on you.'
  proposal: 'Keep the operating model''s escalation as written: strategy, vision and canon-intent concerns
    are still raised for you to read, carry a recommendation, and never wait on you; only G5 rows are
    listed as waiting. If you meant the literal rule, the change is one refusal in background/director_concerns.py
    and a line in CLAUDE.md''s operating model.'
  recommendation: 'I recommend keeping the escalation as written. Evidence: of the 13 rows open this morning,
    the nine non-G5 ones were seat calls, closed today on the seat''s own recommendation, and none of
    them needed you; the canon still wants intent questions raised. Trade-off: you may still see a few
    proposals to read, but none is presented as waiting. Holding position: the narrower rule is live.
    Would change it: your word that only G5 rows should ever be raised.'
  status: open
  resolution: ''
