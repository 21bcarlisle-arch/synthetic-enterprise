      (boot_sha.current_head()) or against origin, with its live output for the 10 declared daemons.
      If it grades against HEAD, make it report both legs, stale against HEAD and stale against
      origin, and add a control over a diverged synthetic repo that reds when either leg is
      removed. If it already reads correctly, the finding says so with the output.
    why: >-
      Carried unverified for several stretches. A divergence exists now, so it can be settled by
      running it. DONE when the finding lands on origin and the carried `wrong` row can be graded
      on its evidence.
  - id: the-ledger-fix-reaches-origin
