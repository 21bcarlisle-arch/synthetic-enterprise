thesis_read: 'This stretch went backwards on the supplier. It had 3 commits, 2 carrying work, and 0 on the supplier
  side (commit_split 0/0/0/3). One commit re-derived the five constant floors the archive had reddened; that item
  is finished and leaves focus. The other rebuilt the Knowledge tab. No number on a page moved. Of the four focus
  items, two were drawn. The floors item landed. The closed-accounts item is landing now: a surgical_land process
  (pid 2949168, run from /var/tmp/closed-close) had been in its gate for an hour at 18:23. It carries the split
  (420 of 421 stranded accounts are level-DD legs, and their cash is right), the home_moves knowledge, and an invariant
  row that breaches 184 on af31e73fa7. The step 2b item, the one that matters most, was not drawn this stretch.
  Its 14:46 draw expired twice. Each time the tick was killed, and fork_salvage kept its work: salvage/detached-630952183d
  (16:06), then salvage/detached-7a80b0442980 (16:45). Its worktree /var/tmp/se-l2b-inc2 has since been reaped.
  The salvage holds the whole build, its red-on-today test, and eight mutations, all red. The work is done and not
  landed, so item 1 is now a landing from a tag, not a build. I also correct the last record in the same place.
  At 15:20 it said the closed-account diagnosis existed nowhere. It was in salvage/detached-092f527cf1 from 13:41,
  and that is what is landing now. The seat checked origin, the tree and worktrees, but not salvage tags, which
  is where a timed-out tick''s work goes. A second problem now has a deadline. The shared checkout is 30 commits
  behind origin. Every daemon runs code the branch has moved past, and the Monday 04:00 publish runs from that checkout.
  It cannot fast-forward because a dead archive seat left 637 paths staged in its index. I measured them: 97 archive
  paths are already on origin byte for byte; 124 staging files are on origin under other paths, and 1 of those differs;
  409 customer JSON files are not on origin at all. Against the thesis, we are still on the precondition: one balance
  that the world, the desk and the page all read the same way. The 26 Oct ruling keeps the advantage work (per-customer
  inference against the flat-rule baseline) parked until a book passes the gate, and no book can pass before step
  2b lands. The early publish the director approved will in practice be Monday''s: no step-2b book can be built
  and graded before 04:00.'
