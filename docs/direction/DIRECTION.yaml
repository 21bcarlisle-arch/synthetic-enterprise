thesis_read: >-
  The thesis test is running and has not answered yet. This stretch did the right things in the
  right order, but it also filed a successor design that crosses a line the director drew. The
  bridge is graded (504b42a37). B2 holds: 112 of 163 lineages are identical, so the world change
  reached the A/B. B1 is refuted on 44444: D_lin fell by £500.63 on the same lineages at the new
  pin, through the level arm's net rising, and no decision flipped. So ab5's "+£1,000, CI clear of
  zero" now reads as conditional on b79e2c0e8 and on one set of renewal rolls, and it is not
  carried into the pilot. The baseline comparison the thesis needs is P1+P2's own mean. P1 started
  at 07:27Z on the a322166cc pin, so runP1.json is due about 10:30Z and runP2.json about 13:40Z.
  The book-varying successor was pre-registered before the pilot answered (d11c047ac), as asked,
  and it is good work. It refuses a longer window (there is no later record) and refuses a wider
  funnel (a thin funnel is what a real GB book looks like, from the knowledge map). But the
  variable it chose, "more books", varies `live_population`'s base seed. That draws a different
  cast of founders and arrivals. That is EP17_varied_population_draw, which is director-reserved
  under R13, and the seat has asked him twice to release it for measurement only, with no answer.
  The prereg never names EP17. Its rule 2 would build and launch a four-cast pilot on the ~70%
  branch with no ruling. My own previous item offered "more books" as a candidate without naming
  the reservation, so that error is mine. PB6 and PB7 parked (dc3a4f66e, 3931f644b) rather than
  taking the fresh blind pass I asked for. The worker argued that every residual below L3 releases
  outside the row: PB8's unpublished rate, a PB1-scale book, and EH-4, which is the household side
  entering a decision surface and so the director's two-sided objective (A47,
  test_household_share_is_not_yet_a_target). That meets the item's own DONE ("a named fail
  pointing at its owner"), and a second pass on the same battery would have bought nothing. So I
  accept it and PB6 leaves focus. The ordinary draw moved two levels on its own (W1_28 and W2_31,
  L0 to L2), and nothing blocking is filed. Two open errors close. The lane-0 ledger now grades an
  ab6 item by its path. It reads landed_elsewhere, where it used to read CANNOT ANSWER, although
  it credits the wrong commit (a new row). The PB6 steer bit. The shared checkout's divergence
  from origin grew from 11/9 to 20/11, and the HEAD-only side carries duplicate-subject copies of
  origin commits. That is the carried reconcile class. It cost no thesis run this stretch, and
  sim-runner kept deferring under ab6's declared peak. All four previous focus items were drawn,
  and three landed. Staging drained by a net 78 over the week.
