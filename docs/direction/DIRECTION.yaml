- id: the-shared-checkout-rejoins-origin-so-the-book-runs
  what: 'The shared checkout /home/rich/synthetic-enterprise is 43 behind origin/main. Since 12:02Z sim-runner
    has deferred every cycle with "the code a run would import is not origin''s: company/billing/ledger_store.py"
    (journalctl --user -u sim-runner). That file''s working copy is origin''s bytes and HEAD lacks them.
    Get the checkout to fast-forward. Start from background/origin_reconcile.paths_blocking_fast_forward(),
    which at 12:25Z listed 137 paths: 79 "modified here, and origin changes it too" and 58 "untracked
    here, and origin adds its own copy". Byte-compare each with origin/main and with HEAD. A path equal
    to origin''s bytes is already landed. For each path that differs from both, name its owning lane from
    the in-flight surgical_land processes and the draw ledger, and let that landing finish. Never discard
    another lane''s bytes. Never use stash, checkout <path>, reset --hard or --no-verify. If one of these
    KINDS recurs (a landing that leaves origin''s bytes in the shared tree without advancing HEAD), file
    it once as a finding naming the producer, with the count. Then confirm sim-runner admits a book.'
  why: 'The book is the one input that every pending supplier grade waits on: KNIFE3 I1-I6, the D48 blend,
    the gas-fallback split, and the box slot the value-test replication is queued behind. Done means:
    HEAD equals origin/main; a sim-runner journal line shows a run admitted after that; and any recurring
    producer of the stall is filed as a finding.'
