focus:
  - id: a-focus-item-is-structurally-unreachable-by-the-executor
    what: >-
      **First, and it was fourth three times running — that ranking was the error, not the item.**

      **Read `background/seat_executor.py:340-361` and the comment block above the guard before
      changing a line.** The guard is
      `if _interactive_seat_is_live(now) and not _is_handed_off(item, now=now)`. Its own comment
      records that the presence check was narrowed to contention on 2026-08-31 **for continuations
      only**, deliberately leaving a focus item outside the narrowing. `_interactive_seat_is_live`
      is true whenever any session is running and one always is — including the session writing
      this file — so a focus item is not *sometimes* declined, it is **never reachable**. The log
      now shows **thirty-one identical stand-downs** unbroken from 2026-08-31 23:35 to 2026-09-01
      14:05.

      **Take the decision and record it.** The recommendation, unchanged and now with a stretch of
      evidence behind it: **write the handoff at derivation**, so `direction.unreachable_focus`
      produces a claimed handoff a later tick can take, rather than an unclaimed decision that
      always loses to a live heartbeat. Choose otherwise only with the reason written down. **Do
      not** choose *"escalate after N declines"* — that is a stall wearing an alert's clothes. If
      contention is genuinely the worry, `seat_work_in_hand.refuse_if_duplicated` three lines below
      already answers it **on paths**, which is where contention actually lives, rather than on
      presence.

      **Key the leg to the property**: *a focus item the executor re-derives is reachable by some
      tick* — never *"this item is stuck"*, which pins today's answer and goes green on the defect.
      Build the fixture with an **explicit heartbeat time, never wall-clock `now`**: a fixture built
      from `now` has a red window and self-heals before the drawn worker arrives. Mutation-prove it
      with `python3 -B` — two same-size edits inside one second match on `(mtime, size)` and the
      harness reports SURVIVED off a stale `.pyc`. **No register of stand-downs.** A reachable path
      and one control is the whole mechanism.
    why: >-
      First because the argument that kept it fourth — *"the steer reaches the trunk anyway, so this
      degrades rather than severs"* — was refuted by this stretch and I should say so plainly. It
      reaches the trunk for **item one and nothing else**, because the interactive seat is one
      writer and works top-down. Items two, three and four received zero commits, and item two's
      instruction was a single command. That is not a priority judgement anyone made; it is the
      absence of a second worker, thirty-one ticks of one standing at the door. Everything below
      this on the list is also gated by it: the brief's own mechanism says a focus item that names
      anything other than a maturity-map atom is handed to a worker tick as **LANE 0**, so while
      this guard holds, **items two, three and four are unreachable by construction no matter how I
      rank them** — which is why re-ranking them yet again would be theatre. It is also the cheapest
      thing on the list by a wide margin: one call site and one control, against a capture that
      takes hours of wall-clock and a class split that takes reading fifty-five documents. The
      standing objection — *machinery outranking the world is the ranking error I keep making* — was
      right while a four-figure percentage was live on the public surface. **That fire is out**, and
      the reason to rank the world first weakened in exactly the stretch the reason to rank this
      first got its thirty-first data point. **Done means:** the decision recorded with its
      reasoning either way; the chosen mechanism landed on origin; one mutation-proven leg keyed to
      reachability rather than to any item's name; and `seat-executor-log.md` showing a subsequent
      tick **RUNNING a focus item** rather than declining it a thirty-second time. A document
      explaining the guard is not this item. The log line is.
  - id: the-shock-series-is-still-one-mean-over-a-mixed-population
    what: >-
      **Finish the split. The wiring landed; the measurement did not, and the wiring is what makes
      it look finished.**

      Read `docs/market_research/what_bill_shock_is.md` first — **it already answers the definition
      question and must not be re-opened**, including the payment-method shares (~74% direct debit,
      ~13% standard credit, ~13% prepayment) and the SLC 27B ±5% notification duty. Then read
      `saas/bill_generator.py:78-94` and `company/billing/monthly_bill_assembly.py:318-408`, which
      are what `fc1c9a65c` landed, and confirm by reading rather than assuming: the channel reaches
      the bill and each bill carries its population label.

      **(a) Split the published series on the label that already exists.**
      `monthly_ops.monthly[].avg_shock_pct` in `site/data/dashboard.json` is one mean over
      direct-debit and full-payment households together. For a level-direct-debit household the
      quantity is a **material change in the amount collected**, with the balance beside it; for a
      full-payment household the quantity **is the bill**. Two series, named separately on the
      surface, each with the bound its own sample earns — **never averaged into one percentage**.
      The bound machinery from `8e395664e` already exists in `tools/generate_dashboard_data.py`;
      this is applying it per population, not building it again. Where a population is too thin to
      carry a mean, **publish that it is too thin** — "we cannot tell" is a result and belongs on
      the page.

      **(b) Deal with the sign, which is now a live crash and not a nicety.**
      `WORKER_FINDING_BILL_SHOCK_IS_THREE_CAUSES_AND_A_SIGN_COLLAPSED_INTO_ONE_ABS_2026-09-01.md`
      measures **42% of shocks ≥30% as bills that went DOWN**, including **315 catch-up refunds** —
      the world reads a supplier returning money as an event that reduces satisfaction, identically
      to one that takes money. Meanwhile
      `WORKER_FINDING_REPEATING_ALARM_RUN_FAILED_AFTER_S_VALUEERROR_BILL_SHOCK_PCT_MUST_BE_2026-09-01.md`
      records a run **failing three times** on `ValueError: bill_shock_pct must be finite and >= 0,
      got -1.4434469164399073`. A producer went fail-closed on a signed value while its consumers
      still assume unsigned. **Do not repair that by wrapping it in another `abs()` or an `or 0`** —
      that is the naive repair that reinstates the fail-open, and it is in this project's catalogue.
      Decide whether the quantity is signed, and if it is, fix the consumers.

      **(c) Land (a) and (b) in separate commits.** Both move published figures; two changes in one
      window is unattributable and that rule was written here after being paid for. **Pre-register
      each before the run and keep the prediction beside the result whichever way it falls.**

      **Out of scope and named so it cannot be quietly absorbed:** making the direct debit a
      modelled quantity from estimated annual consumption. It is real, it is the director's own
      correction, and it is a separate build with its own knowledge work behind it.
    why: >-
      Second because it is the only item that touches a figure a reader is looking at right now, and
      because the half that landed is the half that disguises the half that did not. The item's own
      exit condition last orientation was *"the two definitions measured separately, each landed in
      its own commit"*; what exists is the channel arriving at the measure and every downstream
      consumer still averaging across it. **A measure that knows which population each row belongs
      to and publishes one number over both is the mixed-subject failure with the evidence of its own
      correctness sitting one field away** — which is worse than the version that never knew, because
      the label reads as proof the split happened. It ranks below the executor only because the
      executor is what determines whether anything other than this gets worked at all; on merit
      against the thesis it is the sharper of the two, since *a world that treats bill shock as one
      number cannot tell a badly-run supplier from an expensive one*, and telling those apart is
      what a per-customer belief is for. The sign defect is promoted into this item rather than left
      as its own because it is the same measure and it is already crashing runs. **Done means:** two
      named series on the published surface, each carrying its own bound or its own explicit
      refusal, with no mean spanning both; the signed-value question decided and its consumers fixed
      rather than muffled; each change on origin in its own commit with its pre-registration filed
      before the run and graded after. If it produces a document and the site still serves one
      `avg_shock_pct`, it has not been done.
