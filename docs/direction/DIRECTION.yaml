  what: 'The one work system''s decision map (D7) would retire the maturity-map dials. One rule would
    pick work: the weekly review''s share per lane, then the order inside a lane. CLAUDE.md quotes the
    dials as yours (''everything else is a dial that orders work but never zeroes it''), so retiring them
