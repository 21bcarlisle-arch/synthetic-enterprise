  - what: >-
      Per-producer sample sizes and bootstrapped intervals for `background/gap_metric.py`, so the
      "worse than guessing" count can say *too close to the line to call*.
    why: >-
      Unchanged and still correct-shaped, still not urgent: the distances shipped in `e707b0cb7`, so
      a reader can already see that two of the three crossings are 3.4% and 3.9% past the line
      rather than reading "3" as three findings. Only 4 of 16 rows expose a sample size at all and
      the ledger stores summary components rather than per-case errors, so the interval cannot be
      computed at the ledger or the page even in principle — it is real work in every producer. The
      shape is recorded so the next pass does not re-derive it: per-metric, at production time, with
      a verdict that can refuse, and **never** an invented "within X% counts as too close" constant.
  - what: >-
      The unranked accretion — forty-one documents in the staging root, the undeclared worktrees, and
