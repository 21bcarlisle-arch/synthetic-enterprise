- id: considered-renewals-falling-from-53-to-3-is-explained
  what: 'Explain why the run''s considered renewals fall from 53 (2017) to 25 (2018) to 3 (2019) in both
    B8 L3 arms, while 17 below-threshold leavers left in 2019 against 2 offers (docs/staging/SEAT_FINDING_B8_L3_THE_RUNS_OWN_HOLDOUT_CANNOT_DECIDE_AT_THE_FOUNDERS_SCALE_2026-10-09.md).
    Before counting anything, write one prediction per candidate cause into that finding: the 10-10 conversion
    gate, the founders'' term structure, the churn estimate''s offer threshold, and book attrition. Then
    build tools/renewal_population_by_step.py as a new file. For each year on the single-levy run (docs/reports/run_output_latest.json,
    producing commit 7379375f6), it counts four things: accounts whose fixed term ended, accounts that
    reached the renewal decision, accounts considered, and accounts offered. That is one count per step
    of company/pricing/renewal_rate_chain.py and company/pricing/value_based_renewal.py, read from the
    run''s renewal decision log and its account state log. Do not edit those two pricing modules or the
    A/B runner in this item. Land the tool with a control that its four counts are non-increasing step
    by step and that a fixture with a term ending in each year produces a count in each year. Land the
    finding with the counts beside the predictions.'
  why: Per-customer decisions are the director's step 4, and retention is the one the company makes most
    often. If the decision stops seeing the book after year one, the per-customer-versus-flat comparison
    has nothing to compare from 2019, and no holdout size rescues it. The item was refused 128 times over
    two stretches on two week-old drafts. This wording names only the files it changes, so the next refusal
    must name real shared work. Done means the per-step counts by year are on origin beside predictions
    written first, and the step where the population falls is named, either as how a real supplier behaves
    (term structure) or as a defect filed as one.
