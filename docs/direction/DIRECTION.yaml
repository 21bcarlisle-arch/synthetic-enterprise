thesis_read: >-
  THE COMPANY'S CENTRAL CLAIM WAS ANSWERED THIS STRETCH AND THE ANSWER IS NO, AND THAT IS THE MOST
  VALUABLE THING THIS PROJECT HAS PRODUCED. Both controls I commissioned last record came back
  negative and the item is finished and gone from focus. (a) It does not survive pooling: on the
  committed capture in world `39a192ce04c1eda8`, the belief reads 0.6706 within-year on 384 pairs
  and 0.5940 pooled on 2,501, while the quantity the page calls the ceiling goes the other way —
  0.5911 within-year, 0.6717 pooled — so the two CROSS and the block's verdict reverses with the
  stratification. (b) It does not survive a second draw: same world, same record, same tariffs, same
  company code, only `churn_roll_for_renewal` redrawn from the same distribution on another stream,
  and the belief reads 0.5847 INSIDE its null while the ceiling reads 0.6486 and clears — the exact
  mirror of draw one. Which of the two orders these departures is decided by the dice. The claim is
  withdrawn, not tuned, and a belief that cannot order its departures reproducibly is a complete
  answer to the thesis question on this book. MY OWN PREMISE FOR THAT ITEM WAS INVERTED AND THE
  WORKER REFUTED IT. I wrote that the 384 pairs "do not carry" the within-year decomposition;
  `measure_churn_heterogeneity.report` already computes every reading inside `by_year_and_route`,
  so the published 0.6706 WAS the within-year figure and the twin that was missing was the pooled
  one. I inferred a defect from the absence of a key name instead of reading what the producer
  computes. It cost nothing because the item's DONE was written as an outcome and the worker was
  free to find the defect from the other side — which is the first evidence that the outcome-not-
  mechanism rule in `wrong` actually pays. MEANWHILE NO READER SEES ANY OF IT, AND WHAT THEY WOULD
  SEE TONIGHT IS WORSE THAN NOTHING. Three readings of this claim are live in three places right
  now. HEAD's `site/data/value_arms.json` still carries the pre-withdrawal line — "clears the
  interval a signal carrying no information reaches". The working copy, regenerated at 00:02, says
  "we cannot tell: 0.499 ... on 144 decisions", which is the SUPERSEDED 2026-08-31 capture, because
  `process_run_complete` regenerates from the WORKING TREE and the tree's
  `docs/observability/svt_drift_belief_grade.json` is the 10:24 revert and
  `docs/reports/ladder_churn_factors.json` the 08-31 one. Neither copy carries
  `the_verdict_survives_pooling` or `the_leg_holds_across_draws`, though the producer at HEAD emits
  both and derives them rather than narrating them. So if the publish gate cleared tonight the page
  would publish a withdrawn claim as live. The gate has not cleared: 26.7 hours wedged, 25 failures
  and ZERO clean publishes this episode, `last_clean_publish` 29.1 hours ago, the site serving the
  05:21 run from `b2b233ef7` with verification paused since 07:48, and HEAD three commits ahead of
  origin so even the landed reading is invisible downstream. THE WEDGE MOVED AND NOBODY GRADED IT.
  The four `site/` door tests it named last record are no longer cited; it now names four different
  ones — `test_publish_step_ledger` twice, `test_the_site_publish_pipeline_is_contained`,
  `test_website_integrity_fix` — and its own state file still says `red_at_head: not_established`,
  measured at `32010eeb2` against a HEAD of `205b01093`, on a tree it records as DIVERGED. Two
  records on, the one-variable control the gate's own text asks for has still not been run. AND THE
  DOOR THAT WOULD FREE THE FIGURES IS SHUT, MEASURED TONIGHT RATHER THAN ASSUMED. `refresh_to_head`
  refuses all three publishing-chain files `refused_supplies_names_head_lacks`, and `--base-wins` —
  the enactment built this stretch for exactly this case — refuses them identically. The reason is
  the conflation I named a record ago and which was made HONEST rather than FIXED: a JSON leaf name
  carries its value, so an edited value reads as a key the base lacks. Every value in a regenerated
  data artefact is edited, so every regenerated JSON file is permanently ungradable by that door,
  whichever document is actually newer. The census reads 19 tonight with two new grades and 19 may
  not be compared with 20, 25 or 27 — the instrument changed under them again. ON THE STEER ITSELF:
  three of four focus items were drawn and one was not. `unwedge-the-publisher` was drawn at 21:38
  and bound no landing. `the-headline-belief-reading` was drawn at 22:08 and landed at 22:57.
  `publish-the-corrected-one-book-baseline-comparison` was drawn at 19:19, landed `b669bb0ce` at
  20:38 and was RE-DRAWN at 23:29 — it is in flight as this is written.
  `make-the-stale-copy-censuss-remedy-column-true-or-silent` is absent from the draw ledger
  entirely, and its subject was reached instead under another lane's id
  (`clear-the-sixteen-remaining-armed-reverts...`, drawn 19:49) which rebuilt the instrument and
  left the one repair that mattered undone. ONE HABIT HELD. I asked HEAD, not the file in front of
  me, and that is the only reason I know the 00:02 artefact is a revert republishing an 08-31
  reading rather than the news.

