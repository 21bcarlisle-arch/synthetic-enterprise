  - id: a-save-offer-is-not-paid-for-by-the-stayers
    lane: B_commercial
    what: >-
      Claimed at 14:19 and in hand; finish it, do not restart it. Wire the reactive save on the
      loss notice (0f1fb3f6a) into the settled run behind a curriculum switch that is off by
      default and byte-identical when off, reading the Invitation to Intervene (4805420bd) and
      the save and win-back toggle ranges (f418eff9e). Then run the director's two fairness
      checks in the minutes tier at both ends of the save-rate range, each pre-registered before
      its run. First, the stayers' prices with and without saves, account by account. Second, a
      vulnerable customer's offer against a non-vulnerable customer's in the same position. Add a
      control for each that reds if a stayer's price moves with saves on, and if a vulnerable
      customer gets less. Report the settled run's own anniversary departure share beside the
      result, because the decision set's 40% is under question.
    why: >-
      This is the thesis's first inference-beats-flat-rule result, and the director made it
      conditional on stayers not paying for it. DONE when the switch, both checks and their
      controls are on origin, and the finding states, at both ends of the save-rate range,
      whether the reactive save still beats never offering in the settled run, with the settled
      departure share printed beside it.
