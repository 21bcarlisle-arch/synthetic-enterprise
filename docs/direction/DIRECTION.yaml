  what: Draw continuation is-a-gas-premises-registered-aq-its-first-year-of-true-use and do what it says.
    On one seed of the current world, for each domestic gas premise, divide the meter_read_log true_consumption_kwh
    summed over the 365 days after acquisition by the registry AQ the company was handed. Report the distribution
    by vintage and by whether the premise was a switch-in or a new connection. Then decide, citing docs/market_research
    and UNC/Xoserve AQ rules in docs/domain_artefact_library/, which side is wrong. If the registry AQ
    the world hands over is biased, it is a world fix. If the company's first-year estimate on a fair
    AQ overshoots, it is a fix in company/ billing, made as a class with a mutation that fires.
  why: 9256e2589 found that the gas AQ fix tipped new gas accounts from 3% under-billed to 6-11% over-billed.
