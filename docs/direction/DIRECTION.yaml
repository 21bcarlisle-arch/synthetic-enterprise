thesis_read: >-
  THE THESIS QUESTION IS NO LONGER BLOCKED BY THE WORLD. IT IS BLOCKED BY AN UNDEFENDED CONSTANT AND
  A PUBLISH OUTAGE, AND THAT IS A BETTER PLACE THAN LAST STRETCH EVEN THOUGH NO READER SAW ANY OF IT.
  Focus two was drawn and answered, and the answer is worth having: `c58350e2e` put the two ceilings
  on one ruler and established that `settled_book_ceiling` had been pricing every customer at 17,520
  settlement records a year — the half-hourly rate of I&C, a segment suspended from the served book on
  2026-08-24 — while `run_phase2b` folds each term to daily rows and retains 289.4 per customer-year,
  a factor of 61. The bound the page had carried since 2026-09-10, the one the observed system already
  exceeded, was never a bound on this book. Re-ruled, the page now says NO to "can the book that would
  settle the choosing be built", and names what binds: the smallest leg needs 2.82x this book and
  `SETTLEMENT_CUSTOMER_YEAR_BUDGET` caps it at 1,200 customer-years. THAT IS WHERE THE READING TURNS.
  Memory is not the constraint — re-ruled to the records the book actually retains, the RSS ceiling is
  38,275 customer-years, twelve times what that leg needs. The constant's own note has said since
  2026-08-29 that "nothing bounds this constant at 1,200 except an interval preference nobody has
  stated", and the feed's `what_is_not_established` now agrees in its own words: the open question is
  "why that capacity is where it is". So the published verdict that the advantage from INFERENCE
  cannot be signed here rests, at the bottom, on a number the code itself declares undefended. That is
  the knowledge-first failure in the one place it decides whether the thesis is answerable at all, and
  it is not a world result — I am not letting it be read as one. AND NOTHING REACHED A READER, A
  SECOND STRETCH RUNNING, WHICH IS MINE. My focus one named the shared tree; the tree went level at
  `9e2cfc16e` and there were two wedges and I looked at one. `.publish_gate_state.json` reads
  `episode_clean_publishes: 0` and `episode_failures: 14`, up from 12, last clean publish 42.2 hours
  ago, wedge standing 40.0. The single blocking test is `test_every_real_census_hit_is_covered`, red at
  HEAD in 0.09 seconds on `uncovered == {'.delivery_lane_claims.json'}` — a carrier that became a
  `real` disposition row at `d066d3534` and whose disposition already contains the reasoning the
  control is asking for. That carrier is the delivery lane's own claims store, so my focus three is
  what wedged the gate my focus one was pointed at, and nothing on this box could see it because the
  two live in different files. Meanwhile the site lane refused every commit it graded, on two controls
  whose whole cause is my own prose: `delivery.json .what_it_decided.focus[3].why` pointed at a
  neighbouring row by its position instead of its name — a row noun followed by a direction word,
  which is a registered `_HERE_RELATIVE` match — and that field renders in both
  `/harness/#delivery-decided` and `/harness/#delivery-next`, so the direction writer
  wedged the site lane with a here-relative pointer in a field with two homes. The phrase is gone from
  this file and it clears when the feed regenerates, which focus one names. ON THE GRADED ROWS: the
  binder goes to corrected. `f382f8ace` put `_is_liveness_only` inside `record_landing`, read from the
  publisher's own declaration, judging the whole commit rather than an intersection, refusing on an
  unreadable declaration, with four writer mutations each firing on its own leg — so a bind whose
  commit is a pure republish now writes nothing and names the class and the escape. The `"HEAD"`
  defaults remain; my stated finish condition demanded their removal and that condition was wrong, for
  the reason the commit records — HEAD is the only spelling the executor gives an isolated turn, so
  refusing it would silence the ledger for every caller to close a hole only the heartbeat class walks
  through. The shape instrument stays open with sharper evidence than last stretch: `f56852e25`'s tree
  (`bb737f158`) differs from both parents' (`8b58f2e8e`, `e38e670da`) so `_carries_work` called it
  work, while the same brief's `commits[]` field computed its combined diff as empty and marked it
  `substantive: false` — one document, two instruments, one commit, opposite answers. And my own
  remedy half worked: four items, three drawn, the fourth undrawn a third time. The drawable budget is
  three and it is a mechanism, not a mood — `FOCUS_RANK_MULTIPLIERS` pays 4.0, 3.0 and 2.0 to the
  first three ranks and collapses every rank after to 1.5, so a fourth item is written at the tail
  multiplier. This file writes three.
