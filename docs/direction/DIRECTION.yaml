focus:
- id: the-renewal-notice-is-sent-42-to-49-days-before-a-fixed-term-ends
  lane: C_customer_ops
  side: supplier
  what: 'Point 1 of docs/staging/SEAT_FINDING_THE_COMPANYS_OWN_EVENTS_SHOW_NO_RENEWAL_NOTICE_TWO_PAYMENT_RECORDS_AND_A_CREDITED_PART_MONTH_2026-10-27.md.
    K8 first: confirm SLC 22C''s end-of-fixed-term notice window and content from the regulation commons
    (docs/domain_artefact_library/), and amend the knowledge page that holds renewal. Then wire company/crm/renewal_notice_register.py
    into the run, so every fixed term gets a dated notice 42-49 days before it ends. Make the retention
    offer precede or accompany that notice. Carry the notice date in company/billing/raw_account_export.py
    as an event field. The test must be red on today''s code (INV_RENEWAL_NOTICE_42_TO_49_DAYS: 1,338
    of 1,338). Record the act only. If no household in the world reacts to a notice today, name that as
    a GAP in the finding and do not build the response here.'
  why: A supplier that never sends the licence's renewal notice breaches every fixed term, and its renewal
    decisions cannot be judged until it does. Done means the wired notice and its red-then-green test
    are on origin, and the regrade shows the row at 0 or each breach named. It also means the exception's
    1,338 ceiling is retired.
  written_at: 1793136583.542
