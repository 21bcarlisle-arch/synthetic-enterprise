thesis_read: 'THE CORE COMPARISON NOW HAS A FIRST ANSWER, AND THE ANSWER IS NO. THE SITE STILL SHOWS NONE OF IT.
  Against the thesis this was the first stretch in a day where the company''s inference was graded against the flat
  baseline. B11''s backtest (9680fbf4b) forecasts each account''s held-back value with cut year 2020, and on the
  current book (77bf72bab, 53 accounts) it does not beat one value per segment. Margin error is a tie (+GBP 1.2,
  CI -26.5..+29.0) and the flat rule wins on departures (Brier +0.011). On an older book (72 accounts) per-customer
  wins on margin by GBP 59. Two books, more than one variable apart, give opposite verdicts, so the honest reading
  is: no inference advantage shown, and the books are too small and too few to separate one. That matches the open
  EP17 concern. C29 is the one inference that holds up: the book arm survives the refitted world at half its lift
  (0.268 against a null of -0.303..0.015). The value arms re-taken on that world fell to GBP 18,541 from 20,889,
  as pre-registered. The weighted retention guard saves GBP 703 of 2,969, but mostly by declining discounts at SVT-to-fix
  conversions, where the world gives no exit. That is the director''s open retention row, not yet a skill. The world
  can now press back on billing: W2_36 (8d40cacbe) makes billed differ from used through persistent estimated reads.
  Its persistence is unsized, with a measured floor of 0.781, and it is carried as None. Steps 2 and 3 moved from
  no code to first slices, and last record''s three focus items were all drawn, with two landed. Measured by output,
  the steer worked this time. It went BACKWARDS on publishing, and my last record caused part of that. It marked
  the checkout lag corrected. The publisher has refused three times since as behind_origin. The checkout is 11 behind
  origin, 9 dirty paths collide with it, and no figures have reached origin since 2026-09-28. Done means the rendered
  value changed, and nothing of this stretch is rendered. CORRECTIONS beside the claims. (1) The brief again read
  concerns from the behind checkout. Origin shows the director ANSWERED step-1 and heating at 11:57 (8f5518e88),
  and it carries an open row the brief omits (a-household-s-electricity-carbon-is-shown). This record takes those
  rows from origin verbatim. (2) acff52923 (the draw follows the order) landed as 20c9c52c9: background/supervisor.py
  is byte-identical. So the locked worktree /var/tmp/se-draw-order holds a disposable copy, and the draw-ledger
  row about it is spent. (3) W2_36''s off-draw row is corrected: it was drawn as Lane 0 and landed, and its stray
  draft was diffed and found superseded. The other at-risk worktree (agent-a5d48d73b2a0fe719, a SALVAGE commit)
  belongs to the live 248h worker 2197437, so it is not disposable and nobody reaps it. The two DIED long jobs are
  the C29 landing''s first two attempts. A third (pid 1552468) is in the gate now, and it names DIRECTION.yaml from
  the shared copy, which predates the director''s answers. That is a new wrong row. 11 commits, 8 substantive, 2
  base-advance merges that changed nothing.'
