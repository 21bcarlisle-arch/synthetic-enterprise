  - id: census-says-unproven-when-its-subject-is-incomplete
    what: >-
      **Build leg 2 of the BLOCKING finding — the leg that makes the class un-recurrable — and
      discharge the finding.**

      `docs/staging/SEAT_FINDING_THE_CENSUS_OVERLAYS_ITS_LAUNCH_TREES_DATA_AND_MANUFACTURES_THE_REDS_IT_REPORTS_2026-09-02.md`
      is the tree's only BLOCKING finding. Leg 1 landed at `859c529f7`, mutation-proven in both
      implementations. Leg 2 is written down in that finding and explicitly **not built**: *"the
      census fails closed when its subject's overlay is incomplete, and says so on its own
      surface."*

      Build it in `tools/head_green_census.py`, and key the control to the **property** — *a census
      whose subject cannot see the machine's data has not measured HEAD* — never to today's list of
      twelve cache filenames, or it goes green the moment a thirteenth arrives. The census already
      knows how to say `UNPROVEN`: `verdict()` refuses a run that proved nothing, and the gap is
      that nothing refuses a run that measured the wrong tree. The reason must reach the `--json`
      surface, per the finding. **Mutation-prove it under `python3 -B`**: an edit that lets an
      incomplete overlay through must red a *named* test with its own stated reason. Then discharge
      the finding with a structured `**Discharged:**` line naming a test node the filesystem can
      resolve — a free-text "fixed" no longer releases anything.

      **Do not hand-edit `docs/observability/head_red_observed.json` to strike the 29.** The
      finding's own Route section is explicit: they are struck by re-measurement, not by
      disposition, and the nightly service — `WorkingDirectory=/home/rich/synthetic-enterprise`,
      all twelve cache files — fires clean at **03:34 BST on 2026-09-03** and re-renders the
      register. Editing the register by hand would be forgiving a red, which that store is built to
      refuse. **Do not run a heavy census by hand beside a live publish gate**; check first, and use
      `python3 -m tools.wait_for` rather than hand-rolling a `pgrep` that matches your own prompt.

      **Done means:** a census launched from a linked worktree returns `UNPROVEN` with a reason on
      its `--json` surface instead of a red list; one named test reds under a source mutation; the
      BLOCKING finding carries a resolvable `**Discharged:**` line and `background/finding_severity`
      reports zero BLOCKING; and tonight's clean run is read and its residual — I expect ≤ 20 —
      graded against
      `docs/staging/SEAT_PREREGISTRATION_WHETHER_THE_49_RESIDUAL_REDS_ARE_ONE_CAUSE_OR_FORTY_NINE_2026-09-02.md`
      **clause by clause, reporting the split including any clause it refutes.**
    why: >-
      The census is the instrument that certifies every other claim in this project, and it just
      manufactured 29 reds that a worker would have spent a tick failing to reproduce — the register
      routed them into the draw as work HEAD does not owe. Leg 1 fixed the instance in both places;
      without leg 2 the next caller launched from anywhere new silently invents a new red list, and
      "a fix that mechanises one leg and asserts the other in prose" is the shape this project pays
      for most often. It is also the only BLOCKING finding in the tree, which outranks everything
      below it.
  - id: bill-validation-the-curtain
    what: >-
      **Build the curtain, before anything reconstructs a bill against the export that already
      landed.**

      `company/billing/raw_account_export.py` landed at `145d48345` with a check that refuses a
      derived field **by its unit**. That is leg two of the director's brief
      (`docs/staging/DIRECTOR_BRIEF_INDEPENDENT_BILL_VALIDATION_2026-09-02.md`) and it arrived
      before leg one. **There is still no validation package and no curtain in this tree.** That
      ordering is the risk: a validator built against this export and walled afterwards has already
      inherited a shared concept, and no later control can un-inherit it.

      Build a validation package that **structurally cannot import `company/` or `saas/`**, enforced
      the way the socket wall is enforced — refused by construction, not by approval. Reuse the
      existing import-graph machinery rather than minting a new one: `background/publish_scope.py`
      already walks an import graph and `tests/architecture/` already holds layer controls. Run
      `python3 tools/write_time_gate.py --explain` before writing any new module and put what it
      returned in the REUSE block. **Mutation-prove it under `python3 -B`**: an edit that lets the
      package peek must red a *named* test. Key the control to the property — *this package may not
      reach the billing code* — never to today's list of imports.

      Then start §6, the plain statement of what this cannot catch, **as you go and not at the
      end**. Put the worked example in it by name: the first direct debit set from a half-month
      stub, measured correctly, sourced correctly, and wholly wrong in frame until a practitioner
      said so.

      **Done means:** the curtain exists, a source mutation against it reds a named test, and §6
      names the residual risk with that example. Leave the statement export and the one-account
      reconstruction for the next stretch — and if you conclude the two-export shape is wrong, say
      so and build the better one; the director explicitly invited that and it is a finding either
      way.
    why: >-
      This is the director's newest direction, delegated for sequencing and not for approval, and
      it is what makes every other figure in this file checkable: our arithmetic has never been
      tested against anything outside itself, which is the exact pattern that produced a rate
      spanning thirteen periods of money over one of volume. The export landed without its wall, so
      the wall is the thing that decays while it waits — every day it is missing is another day
      something gets built against the export with company concepts already inside it.
  - id: the-slc-27b-citation-does-not-exist-and-is-published
    what: >-
      **Correct the "SLC 27B" attribution in the sites rank one does not reach, and close the class
      rather than the instance.**

      `docs/staging/SEAT_FINDING_THE_DD_REVIEW_BAND_CITES_A_LICENCE_CONDITION_THAT_DOES_NOT_EXIST_2026-09-02.md`
      establishes from Ofgem's own material that **there is no SLC 27B**: the direct-debit
      provisions are 27.13–27.16 inside SLC 27, the nearby lettered conditions are 27A and 28A/28AD,
      and no ±5% band appears in the licence at all. I grepped the tree this orientation and it
      currently reaches **nine files**: `company/interfaces/dd_review.py`,
      `company/interfaces/dd_review_outcome.py` (both taken by rank one),
      `company/billing/dd_review.py`, `company/billing/dd_review_runner.py`,
      `saas/bill_generator.py`, `simulation/run_phase4c_on_phase2b.py`, and **three published
      pages** — `docs/market_research/what_bill_shock_is.md`,
      `docs/market_research/satisfaction_drivers_and_the_three_bill_shocks.md`, and the new research
      page's own account of the error. The finding says four sites and one page. **Correct that
      count inside the finding, beside the original claim**, not quietly.

      **The ±5% is not fabricated and must not be deleted** — it is a real and widely used supplier
      review convention and the code applying it behaves sensibly. What is wrong is a modelling
      convention wearing a regulation's clothes. Cite **SLC 27.15** for the duty, declare the ±5% as
      a convention with its own origin under `tools/domain_constant_origins.py`, and state on the
      surface that the licence names no numeric trigger. If nothing published establishes it as a
      convention either, that is the honest answer and it goes on the page as a `None` with a named
      reason.

      **Then close the class.**
      `docs/staging/WORKER_FINDING_THE_STANDING_CHARGE_IS_FOUR_DECLARATIONS_AND_A_CITATION_THAT_CANNOT_BE_CHECKED_2026-08-31.md`
      is the same shape and still staged. Two instances is a class, and the rule that should have
      caught both — *a money constant citing a source must be reached* — is prose where it needs to
      be a refusal. **A cited authority that cannot be resolved in the commons is a refusal, not a
      comment.** Key the control to that property, never to today's list of bad citations, or it
      goes green the moment someone invents a new fictional condition.

      **Done means:** no file in the tree cites SLC 27B; the ±5% carries a declared origin as a
      convention; the finding's own count is corrected in place; and a mutation-proven control
      refuses an unresolvable citation as a class.
    why: >-
      A number sourced to a condition that does not exist can never be verified and will never be
      corrected, and this one has reached nine files including two pages we serve to readers as
      research. It is the second instance of a class that already has a written rule, and the rule
      caught neither — which is the definition of a control that cannot fail. Ranked last because it
      corrects an attribution rather than a behaviour: the ±5% produces the same decisions tomorrow
      either way, whereas the three above are unlanded work plus a wedged publisher, the tree's only
      blocking finding, and the wall that makes our arithmetic checkable.
