thesis_read: >-
  The world can now press and the company cannot feel it, and that sentence is the whole state of
  the thesis this stretch. `b44c55fa1` gave the price ladder a continuous surface and the defending
  market resolved at every rung — the chase costs +0.0068 at rung 0 rising monotonically to +0.0451
  at rung 2, 34 of 68 paired observations moved and every one of them upward — while the company's
  `believed_p_leave` is bit-identical between the chase-on and chase-off worlds to one part in
  10^12. So the morning's null was the instrument, not the effect, and that is real progress; but
  what the repaired instrument reveals is that on the one dimension the world has just gained, the
  company's only competitor signal is `company/crm/market_conditions.market_conditions_multiplier`,
  a ten-entry hardcoded year lookup. The thesis says the advantage must come from INFERENCE and
  never from ACCESS. There is presently nothing to infer from: the channel is a constant, so a
  supplier that understood the market perfectly and one that understood it not at all would hold
  the identical belief. That is the gap that matters and it is company-side. Second, `0850eadcd`
  landed the sourced acquisition and retention costs — campaign spend fell £135,285 to £23,708.90
  and the invented constants are gone rather than shadowed — but the published arms artefact was
  generated at 14:08:48Z, five hours before that commit, so the £153,245 / £157,913 on
  `/capabilities/` is still denominated in constants the tree has deleted, and the pre-registered
  prediction about what the re-run will show is filed with no answer beside it. Third, and this is
  the correction the brief itself needs: it reports `drawn: []` for all five previous focus items,
  and that is false in effect. A lane-0 tick is at this moment running `git commit` with
  `tests/simulation/test_founder_book.py` in its gate selection, carrying my second focus item
  verbatim; the sourced-cost item was drawn and delivered and then re-drawn 8m39s after the commit
  that satisfied it. The steer IS biting. What is broken is that a re-issued claim can never be
  credited with work that already landed (`73759660f`), so the seat's only instrument for reading
  its own direction reports a no-op over work in flight — and a seat that believes its steer is
  dead will do the one thing that actually kills it, which is stop steering and start re-issuing.
  Nothing went backwards this stretch; but two of roughly eight ticks were spent re-doing finished
  work, which is a quarter of the delivery capacity paid to a bookkeeping defect.
