focus:
  - id: the-1002c-floor-runs-at-the-first-width-pair-boundary
    lane: B_commercial
    what: >-
      Wait with tools.wait_for --pid 1040221, the width125 61001,61002 leg of
      longjob-depth-vs-width-w125c, with a 6h deadline. When it exits, check that
      /var/tmp/se-depthwidth-out/width125_61001_61002.json is non-empty, then immediately run
      `systemctl --user stop longjob-depth-vs-width-w125c-20261002`. legs_dw.sh skips legs already on
      disk, so stopping between pairs loses only the seconds of pair two. Do NOT touch
      longjob-value-arms-1002c-floor-serialised (/var/tmp/se-retake-belief/wait_all_then_floor.sh).
      It re-asks pgrep every 60s and starts the 11111/22222/33333 floor at pin 0cc052102 by itself,
      and longjob-value-arms-1002c-floor-handoff-2 hands off the grading. Once the floor's own
      run_value_cycle_ab process is resident, and not before, relaunch depth-vs-width as a new
      setsid unit (w125d) running the same /var/tmp/se-depthwidth-out/legs_dw.sh. Its preamble waits
      on every resident leg, so it will queue behind the floor. If leg 1040221 dies instead of
      finishing, stop the unit anyway and record why. When the floor lands, grade Q1 seed-for-seed
      and Q3 in
      docs/staging/records/SEAT_RESULT_THE_VALUE_ARMS_RETAKEN_AT_THE_BELIEF_COMMIT_2026-10-02.md, and
      read the selection leg against the floor both with and without write-offs, using 792fcf31d's
      split. Then move CURRENT_WORLD_THREE_ARM_PATH and CURRENT_WORLD_NOISE_FLOOR_PATH together onto
      the 20261002c pair, with the page saying what changed. Bind with delivery_lane --landed.
    why: >-
      The floor is the only spread on the value-arm-versus-flat-rule reading, and it has missed three
      stretches. Left alone, its 12h waiter expires about 4h before w125c's third pair ends, so it
      would refuse without ever starting. Stopping at the pair boundary costs depth-vs-width a
      relaunch and no compute. DONE when the 20261002c pair is graded and the pointers have moved, or
      when it is withdrawn with a named reason. If the floor is resident at the next orientation, it
      is RUNNING: say so and do not relaunch it.
  - id: the-value-arm-prices-the-arrears-its-own-ledger-holds
    lane: B_commercial
    what: >-
      Carry out remedies 1 and 2 of
      docs/staging/SEAT_FINDING_THE_VALUE_ARM_CANNOT_SEE_ARREARS_BECAUSE_THE_PRICING_ADAPTER_NEVER_FORWARDS_IT_2026-10-02.md.
      In company/pricing/value_based_renewal.py, forward the company's own ledger-derived
      arrears_state, plus whatever of credit_risk and payment_delay_days the company actually
      holds, from renewal_rate_chain through renewal_margin_uplift into decide_margin. Add a control
      that enters at renewal_margin_uplift, NOT decide_margin, and goes red when the forward is
      dropped. Mutation-prove it by deleting the forward. For remedy 3 (how an observed arrears
      position moves the expected bad-debt cost in expected_annual_costs), research
      docs/market_research/, the knowledge map and published Ofgem debt-and-arrears data first. If a
      sourced relation exists, wire it with its origin declared. If none does, leave the bad-debt
      term on credit_risk, record the gap in docs/institutional/knowledge_map.md as an explicit None
      with its reason, and do not invent a coefficient. Run the value-arms controls. Any control that
      pinned today's priced margin is re-keyed to the property, never deleted.
    why: >-
      The thesis says the edge must come from inference over what the supplier can know. A supplier
      knows its own arrears, and our value arm throws that away before it prices. The one reading we
      have is decided by exactly that blindness, which makes this the cheapest change that moves the
      thesis rather than measuring it again. This is company-side, so it does not disturb the floor,
      which is pinned at 0cc052102. DONE when the forward and its mutation-proven control are on
      origin, and the bad-debt question is either wired from a source or recorded as an explicit gap.
  - id: life-events-are-drawn-per-household-from-sourced-rates
    lane: W2_customer_generator
    what: >-
      Close docs/staging/SEAT_FINDING_TWO_LIFE_EVENT_RATES_ARE_PER_PERSON_FIGURES_APPLIED_PER_HOUSEHOLD_2026-10-02.md
      in simulation/life_events.py. Either source per-household annual rates for a new baby and for a
      job loss (ONS births by household, or the LFS household flows), or draw each event per person
      over the household's own composition, using the existing per-person rates. Prefer the second
      if the composition is on the household, because it needs no new number. Print the household
      incidence of both events before and after, across the real book, before you write the test.
      Then add a control that fails if a per-person rate is applied per household again.
    why: >-
      With item two, credit becomes a priced input, so the world must generate the income shocks that
      make credit vary. Today it under-draws them, so a credit-aware arm would be graded against a
      world that presses back too gently. That is a fidelity defect, and it is the world's side of the
      same question. DONE when the finding is dispositioned on origin with the remedy and its control.
not_now:
  - what: Stop w125c right now, mid-pair, so the floor starts tonight.
    why: >-
      Pair one is about half done. Killing it throws away roughly 3h of compute to gain the same 3h.
      The pair boundary costs nothing, and it still lands the floor about a day sooner than leaving
      w125c to finish.
  - what: Leave w125c to finish all three pairs, then run the floor.
    why: >-
      This was my rejected choice last stretch, and it rested on a 1h-per-pair estimate that was
      about 6x wrong. It would also expire the floor's 12h waiter. Depth-vs-width is a cost-of-evidence
      question; the floor bounds the thesis reading itself.
  - what: Write a sourced-looking arrears-to-bad-debt coefficient so item two prices credit end to end.
    why: >-
      No figure is established in this tree. An invented one would be load-bearing within a week. A
      forward plus an honest None still lets the arm see arrears through the churn hazard, and it names
      the gap.
  - what: Re-run the three-arm at a commit carrying item two's forward.
    why: >-
      Not until the floor at 0cc052102 has graded the current reading. Changing the arm before its
      spread exists repeats the confound that broke Q1 (the level moved under the comparison).
  - what: >-
      Build a pre-launch check that a long job's worktrees and pinned commits exist (the exit-90
      row), or a guard against ticks resetting worktrees that hold unlanded work.
    why: >-
      Both are real, and both stay open in wrong. Neither blocks this stretch's thesis work, which
      runs on existing worktrees under hand-written waiters. They rise if another long job dies at
      launch, or if a graded diff is lost.
  - what: Give worker-seat-manager a heartbeat line.
    why: >-
      Its mute state is by construction and is on file. It costs nothing to the thesis today.
