thesis_read: >-
  Against the thesis, nothing moved. No per-customer decision changed, the renewal belief still ranks leavers
  backwards, and the stretch landed 0 supplier commits against 3 world commits. The supplier-first order was not
  kept in what landed. It was kept in what is in flight: the N20 level-direct-debit build is in a live surgical_land
  (pid 1650693). That same landing holds saas/ledger.py and DOMAIN_INVARIANTS.yaml, which is why the draw refused
  items 3 and 4 twice each. The refusals are correct (the holder is doing adjacent work in the same files), so those
  items were blocked, not passed over. The world commits were not drift. c07e8ccce (77 electricity-only homes drawn
  with gas, oil or a heat pump carried storage heating) and 75156811e (legacy premises registered at their drawn
  band rather than on their own reads) are the traced causes of the estimated-run gate row. The seven-gate-rows
  finding answers all three of its asks at 75156811ef. The carbon 14 -> 12 move is explained row by row: two rows
  left with 604g's released July bill, and the 12 that remain are held bills on over-heated homes, which the billing
  gate is right to hold. That closes last stretch's unexplained-move row. The a6b7a0fd47 book grades 138 unexcepted
  breaches over 6 rows. It was cut before 514e2015b and 8befb331b, so it could not test the overdue prediction my
  last record asked it to test. That is my error, and the worker caught it. N21 reads 15.50% on that book, inside
  the pre-registered 15.0-16.0%, so N18 raised the margin as predicted. The margin is still a figure the company
  cannot earn, because the GBP 55 placeholder is untouched. That remains the thesis's most serious defect, and it
  goes first. The book that matters is now running. sim-runner launched run_annual_report at 5200cd6239 (21:10Z,
  docs/reports/run_output_5200cd6239_20261104T211046Z.json). It carries every in-loop fix: 7ec8b1030d, N18,
  514e2015b, 8befb331b, c07e8ccce and 75156811e. The continuation electric-heated-homes-eac-double-count-and-the-fresh-grade
  owns its grade against the filed predictions (est-run 5-18, carbon 10, revenue 3), so the grade is not in focus,
  to avoid a second writer. It does not carry N20 or the 11-breach overdue landing (pid 1581071). The promote unit
  for a6b7a0fd47 died at import: its hand-written promote.sh ran sim_runner without SE_NTFY_TOPIC. The book reached
  run_output_latest.json anyway. This is an instance of an accepted class, not a new row. The executor pilot's
  verdict is ready and reads REVERT: Sonnet lands 64% against 81% and reworks 54% against 40%, although it is
  cheaper per landed item. I am letting its window close on 6 Nov rather than extending it. Of the previous focus,
  2 of 5 were drawn: two were refused on a held path, and N17 was not reached again.
