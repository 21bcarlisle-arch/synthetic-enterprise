not_now:
  - what: >-
      Removing the `-` prefix from the twelve `ExecStartPre=` lines that silence a boot-stamper
      failure by design -- the named remainder of the error I marked corrected last stretch.
    why: >-
      It loses to the publisher on a straight ordering of consequence. The grading half landed
      (`e070217f6`, `0fde08115`), so the silencing is now VISIBLE rather than invisible, which is
      the difference between a gap and a blind spot. Twelve units' boot path is also a real
      behaviour change across every daemon on the box, and doing it in the same stretch as the
      reconcile work would make any change in daemon behaviour unattributable between two causes.
      It is carried as its own open row in `wrong`, not inside a closed one.
  - what: >-
      Building the recovery-sweep detector that would catch the `git stash` class -- a completeness
      check that does not rest on `git diff --quiet HEAD -- <path>`, which is quiet for an untracked
      path whatever its content.
    why: >-
      Rejected for the fifth consecutive stretch, and visibly, because it is a control on a
      never-do that nobody is licensed to perform. The instance is closed and verified
      byte-identical with the stash entry kept as the copy of record. Building the watcher for a
      forbidden act is the "a control that only guards your own controls" shape, and it loses to
      four items that each close a BLOCKING finding or unblock a wall. Carried in `wrong` so nobody
      reaching for a recovery sweep trusts one.
  - what: >-
      Establishing and filing `log_silence` for `sanity-daemon`, the one mute daemon with no cause
      on file (20h12m silent, blocked in `hrtimer_nanosleep`).
    why: >-
      Cheap, but it is instrument reading, and four of the five causes already established came out
      as "healthy, writing somewhere the journal reader does not watch". The likeliest answer
      therefore changes nothing, and it costs a worker window the publisher needs. It stays visible
      in the brief every stretch, which is the property that matters.
  - what: >-
      Working the 28 ungradable maturity-map atoms, 26 of which owe a repair, as a class this
      stretch.
    why: >-
      Same ratchet pressure as the H41 drain, and doing both at once makes the map's byte movement
      unattributable between drain and repair -- the one-variable rule applied to a file with 5,844
      bytes of room. The drain goes first because it is the one that stops every lane going red.
  - what: >-
      Escalating whether `token-proxy` should be `held` rather than `enabled` (214h57m quiet,
      `ANTHROPIC_BASE_URL` unset for every `claude` process, `token-usage-log.jsonl` last written
