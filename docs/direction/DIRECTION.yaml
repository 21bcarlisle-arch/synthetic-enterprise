      is invisible from there. If you are in the executor worktree: **do not rebuild any of it, and
      do not discharge rc=0.** Operate on the main tree explicitly (`git -C /home/rich/synthetic-enterprise`,
      and run `python3 -m tools.surgical_land` *there*), or if the executor's own rules forbid
      touching the main tree, **say that in the log, file it as a finding, and hand the item back
      unfinished.** An item returned honestly unfinished is worth more than a success code; the last
      three discharges of this item all exited zero having delivered nothing.

      **What to land, by pathspec, never `-A`** — three other lanes have work in this index:
      `company/billing/annual_consumption_estimate.py` (new, 313 lines),
