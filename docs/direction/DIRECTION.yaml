thesis_read: >-
  A short stretch, and the main thing it did was test the world underneath the per-customer win
  rather than add to it. The save offer that beats never offering (0f1fb3f6a) is still a grading
  tool's answer. Its settled-run wiring, with the director's two fairness checks, was claimed at
  14:19 and is in hand now; nothing from it is on origin yet. Last stretch's record did not weigh
  the finding filed beside that result: on the decision set the world loses 40% of households at
  each anniversary at the default price, against about 6% external switching at fixed-term end in
  Ofgem's trial. Every save rate and every stayer cost divides by that share. Until the three
  explanations it ranks have been tested (the default price is the dear one, the set is thinner
  than the settled world, the hazard is too high), the save result's levels cannot be trusted
  even if its ranking holds. So it comes second in focus, ahead of new levers. The gas home's
  evening excess moved in the right way: dating the per-use sources to 2022 explains about 410
  kWh of the meter's excess (a107b7032), and a refit that would have anchored electronics to a
  per-site arithmetic artefact was withdrawn before it landed (0a075f658). That is
  knowledge-first working as intended. The 400-founder end-to-end check died at extraction on an
  incoming occupant (KeyError OCC-*). That exposed a defect every production run since moves went
  on would have hit, and 3d5b490c8 fixed it. The run itself has not been relaunched, so the
  founder count, budget and memory share are still unset. Three of last stretch's five focus
  items saw nothing land: the voids split, the mover observable (its discovery 9b0e3594c predates
  the record) and acquisition's P1-P4 on fresh seeds. Only the save item was drawn, and it was
  drawn three hours in. The steer is slow rather than ignored, but the voids atom is still not
  minted. The machine went further backwards. HEAD is now 30 behind origin, from 23, and seven
  daemons run without 10 commits to code they import. The draw ledger still reads
  reprice-the-settlement-budget as not_done, although 803f8666b is on origin, wrote the very path
  it asks about at 10:59Z inside its window, and is that item's work.
