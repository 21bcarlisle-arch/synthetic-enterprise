focus:
  - id: A46_book_depth_is_a_curriculum_question
    what: >-
      Close A46 honestly and land it, **without buying a third probe point.** Five things, in order.
      (a) **Correct the two documents' claims about their own evidence, beside the claims.**
      `docs/staging/SEAT_TO_DIRECTOR_A46_THE_PRICED_MENU_2026-08-30.md` says the menu rests on "a
      clean two-point slope"; `docs/design/A46_THE_PRICED_MENU_2026-08-30.md` §8 says "both points
      were measured with the producer held down". `docs/observability/settlement_ceiling_slope_20260829.json`
      says `recommendation.decidable: false`, one clean point, and
      `campaign_record_agrees: false` on the 2,000 point because another writer touched
      `book_growth_campaign.json` mid-run. Say that on the surface of both, in the words the
      artefact uses — the hold covered the producer and something else still wrote the record, which
      is a fact about this box and belongs in §8 rather than being smoothed out of it. **(b) Fill
      `<!-- MENU TABLE -->` from what actually exists**, which is enough: the 1,200 clean point
      (928.6s, 3,952 MB, 90 wins, 1,195.4 cy committed, `campaign_record_agrees: true`), the 2,000
      point carried as a **single contaminated observation explicitly barred from the slope**, and
      the funnel-supply arithmetic that needs no run at all — `recommend()`'s
      `funnel_supply_customer_years`, opening book 778.1, campaign demand 2,358.4, so a ceiling above
      3,136.5 buys nothing. Mark every row's basis so a reader can tell a measured cost from a
      projected one, and mark the marginal-cost column absent rather than interpolating a slope from
      one point. (c) **Mark the four predictions in
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_CLEAN_CEILING_SLOPE_MUST_SHOW_2026-08-29.md`,
      beside themselves, right or wrong** — the file has none and §7 says it does. From the artefact:
      (1) the 2,000 point committed 1,995.3 cy and 261 wins, so ceiling-bound not funnel-bound —
      **held, on a contaminated point, and say that**; (2) predicted 1,500–1,800s and 6,000–6,800 MB,
      measured 2,097.6s and 6,784.5 MB — **RSS in band, wall clock above it, so the contamination
      claim's falsifiable half is half refuted**; (3) memory did not bind at 6.8 GB of 24,032 —
      held, but `oom_kills_total` went 186 → 187 *during the probe*, so record that beside it;
      (4) refuted in substance by its own author in §7 already, which stands. (d) Replace
      `NOT YET KNOWN` in `tools/generate_book_growth_data.py::engine_bound_basis` with what is now
      established — that the time leg is a chosen publish interval and not an engineering limit, that
      the memory leg is slack at the measured point, and that the slope is undecidable on one clean
      point — because that string is the reader's only copy of this answer. (e) **Commit it by
      pathspec and move A46 off level 0**, on the decision and the corrected menu, not on a second
      probe point.
    why: >-
      This is first because it is the only work here that is wrong rather than merely unfinished,
      and because the reader it is wrong in front of is the director, who cannot check it. Three
      separate sentences in those two files assert evidence that their own cited artefacts refuse —
      a clean slope that is `decidable: false`, predictions "marked beside themselves" in a file
      with zero marks, and a `settlement_ceiling_probe.menu` key that does not exist — and the
      deliverable itself is an unfilled HTML comment. That is this project's most-filed defect
      class, a claim describing its own completion in the past tense, landing on the one path where
      it does the most damage. It is also, separately, the only level that can move: A46 is at 0
      against 2 with provenance `director_ruling`, and nothing has moved for two stretches. **The
      recommendation in those documents is right and I am keeping it** — leave
      `SETTLEMENT_CUSTOMER_YEAR_BUDGET` at 1,200 — precisely because it never depended on the slope:
      it rests on the gate column, which is zero at every interval, and the two results that landed
      this stretch make it stronger rather than weaker. That is exactly why a third 35-minute run on
      a box that OOM-killed during the last one buys nothing, and why the repair is to the writing
      and the table, not to the measurement. **Done means:** the cleanliness sentences corrected in
      both files in the artefact's own words, the menu table present and every row marked measured
      or projected, four predictions marked, `engine_bound_basis` carrying the established answer,
      the whole thing committed, and A46 moved. A permitted and honest outcome is a menu whose
      marginal-cost column reads *"one clean point; no slope"* — that is a result about this box,
      and it belongs in the table rather than in a footnote.
  - id: attribute-the-churn-auc-move-from-0-4653-to-0-13
    what: >-
      `site/data/value_arms.json` publishes `decisions.discrimination_auc = 0.13` with the reading
      *"below 0.50 means the company's own belief about who will leave ranks customers worse than a
      coin flip"*, and `company/pricing/value_based_renewal.py:112` and
      `tools/grade_renewal_churn_belief.py:27` both record the same quantity at **0.4653** on 25
      priced renewals, 9 of them departures. Establish which of three things 0.13 is, and do it from
      the artefact and the grader rather than by argument: **(i)** a genuine belief that is
      anti-predictive, **(ii)** a polarity or label defect — 0.13 is 0.87 inverted, and an estimator
      that is *strongly* wrong in a consistent direction is the classic signature of a comparison
      taken against the wrong side of the outcome label — or **(iii)** a small-sample artefact,
      given the priced surface is 20 decisions on 10 accounts and the 0.4653 figure was measured on
      25. `tools/grade_renewal_churn_belief.py` already carries an `oracle_ceiling` block and a
      `bill_shock_model` comparison, so run the grader against the current run rather than building
      anything: an oracle that also comes out below 0.5 on this population is an instrument defect,
      one that comes out near 1.0 leaves the belief itself as the subject. Then publish the answer
      beside the figure. **If it is polarity, the repair is in the company's own belief code and it
      is ours to make; if it is the population, the page must say which 9 departures the AUC is
      computed over, because an AUC on single-digit positives is a number with no bound on the page.**
      Do not delete the figure and do not soften the reading if it survives — a company that ranks
      churn backwards is a real finding about the method.
    why: >-
      The thesis says the company "beats average precisely to the degree it understands and predicts
      the truth behind the SIM better than average", and this is the only published number that
      measures that understanding directly rather than through a £ contrast. It currently says the
      company understands its customers *worse than nothing*, it is framed on the live page as
      corroborating the selection result — *"the selection result and the belief result corroborate
      each other rather than merely coexisting"* — and it has moved from 0.4653 to 0.13 with nobody
      attributing the move. Two numbers for one quantity in one tree is the thread this project has
      a standing rule about following. It is second rather than first because it is not yet in front
      of the director, and it is above the item below it because a corroboration argument built on
      an unattributed figure is load-bearing on the page today. It costs no long run, which matters
      while the box is still killing processes. **Done means:** 0.13 attributed to one of the three
      causes with the grader's own output as the evidence, the polarity question answered rather
      than assumed either way, the answer written where the page's reader meets the figure, and — if
      it survives as a real result — the `auc_reading` corroboration sentence either kept with its
      sample size stated or withdrawn into `WITHDRAWN_CLAIMS` like the two before it.
  - id: establish-what-drops-fourteen-of-the-twenty-priced-decisions
    what: >-
      `method_skill` scores **6 decisions across 5 accounts** — null interval 0.133–0.867, p=0.47,
      `inside_the_null: true` — while `decisions.value_arm_priced` is **20**, on the ten founder
      accounts named in `who_the_method_has_priced.priced_accounts`. Fourteen of the twenty priced
      decisions do not reach the measurement that scores the method, and no artefact says why.
      Find the filter in `tools/generate_value_arms_data.py`'s skill path and name it, then answer
      one question a reader can check: **is the drop from 20 to 6 a join that can be honestly
      widened, or an eligibility rule the concordance genuinely needs?** If it is a join — a missing
      counterfactual, an unmatched key, an account excluded because one side of the pair is absent —
      widening it narrows the null interval with no world change and no director ruling, which is
      the only lever on that interval currently available to us. If it is a real eligibility rule,
      say what each of the two counts counts, put the reason on the page beside the 0.133–0.867
      interval, and stop the site implying that 20 priced decisions are what the skill figure rests
      on. Either way, `decisions_scored` and `accounts` should carry, in the artefact, the funnel
      from 20 down to 6 broken out by the reason each decision was dropped.
    why: >-
      With the product gate established as structural and the SVT ruling now genuinely with the
      director, the sample that scores the thesis is frozen at whatever the founder book yields
      until he rules — so the only remaining honest way to sharpen it is to stop discarding
      decisions we already have. A concordance on six decisions cannot distinguish the method from a
      coin in either direction, A46's own §4 correctly calls that the row that matters, and the
      difference between six and twenty is the difference between a measurement that can say nothing
      and one that might. It is third because it may turn out to be a legitimate eligibility rule,
      in which case the deliverable is a sentence rather than a narrower interval — but the sentence
      is still owed, because two counts for one subject on one page is the pattern that has
      published something misleading here more than once. **Done means:** the filter named, the
      20 → 6 drop-out broken out by reason in the artefact, and either the join widened with the
      new interval published, or the rule stated on the page beside the interval it produces. **This
      does not license touching the eligibility rule to make n larger** — if the honest answer is
      that six is what the method has earned, that is the answer and it goes on the page.
not_now:
  - what: >-
      Buying a third settlement-ceiling probe point to get a clean 2,000 and a real slope.
    why: >-
      The obvious repair for item one, and it is the wrong one. The slope was commissioned to price
      the interval decision, and that decision is already taken and does not depend on it: the menu's
      second column — accounts the method could price — is zero at every interval for a structural
      reason no ceiling reaches, so the marginal cost of a customer-year cannot change the
      recommendation. Against that, a third point costs ~35 minutes of a box whose `oom_kills_total`
      went 186 → 187 *during the last probe*, and the 2,000 point has now been contaminated twice by
      the same shared file. Buying a precise answer to a question whose decision is already settled,
      on a box that is killing processes, to repair a document whose actual defect is that it
      overstated its evidence, is spending compute to avoid writing an honest sentence. The honest
      sentence is free. The point becomes worth buying again if and when the SVT ruling lands and
      the menu's second column stops being zero.
  - what: >-
      Launching the lifted-`SETTLEMENT_CUSTOMER_YEAR_BUDGET` arms re-run to buy the floor down.
    why: >-
      Held three stretches, and it is now refused on measurement rather than deferred on contention,
      which is the difference between a queue and a judgement. The split says 99.99% of the ±£2,578
      is the ten priced households' own dice and the rest-of-book cascade contributes £0.21 — so the
      remedy is more *priced* decisions and only that. The gate says no book size produces an
      eleventh priced account. The two results compose: a larger settled book buys **nothing at all**
      on this floor, and the artefact's own
      `where_the_priced_decisions_come_from.reading` already says so in the words a reader gets.
      Every earlier version of this deferral was about contention; this one is arithmetic, and it
      should not be re-litigated as though the box were the obstacle.
  - what: >-
      Building the standard-variable product into the drawn world so won households become
      upliftable — or, faster, defaulting the absent-versus-`None` distinction so the existing guard
      admits them.
    why: >-
      Refused again, and the second form is the more dangerous because it looks like a one-line bug
      fix. `run_phase2b.py:1170`'s dead `.get(…, "fixed")` default is *not* a defect to repair: making
      it fire would assert a 100%-fixed domestic book against a published fixed share centred near a
      third, which is a fidelity regression whose only beneficiary is this experiment's sample size.
      That was settled on 2026-08-28 in `DRAWN_BOOK_TARIFF_TYPE_FIDELITY_DETERMINATION.md`, blind to
      what it does to `n`, and internal consistency is not a fidelity argument for a world change
      that enlarges the experiment making it. The real repair — the SVT product from the published
      split — is R13 curriculum, is the director's, and **has now actually been sent** (00:4xZ,
      `PqJjeQp6wEB2`, delivery verified against `delivery_state()`), so the correct posture is
      waiting, not building. The direction check that makes it credible is stated in the escalation
      itself: it makes the arm's in-scope surface smaller as a share of the book, not bigger.
  - what: >-
      Pinning or snapshotting `book_growth_campaign.json` so a concurrent writer cannot contaminate
      a probe point again.
    why: >-
      The mechanism is real and it has now cost two measurements, so this is the moment it is most
      tempting. But the probe **already detected it** — `campaign_record_agrees: false`,
      `clean: false`, `decidable: false`, with the reason named — and refused to build a slope on it.
      The control worked exactly as designed; what failed was a human-facing document that reported
      the refusal as a success. Building isolation machinery to protect a measurement I have just
      decided not to re-take is the shape this project has a rule against: prefer doing the work to
      building the thing that watches the work. It earns its place the moment item one's exclusion
      is lifted and a third point is actually bought, and not before.
  - what: >-
      Re-opening the £22,788 pre-2021 loss adjudication, and sending the director the R6 collateral
      headroom result.
    why: >-
      The adjudication stays out of focus for a second stretch, and I am recording that as a
      standing decision rather than letting it drift back in at the bottom of a list: it sat at
      position four for three directions and was drawn zero times, and the correction that fixed
      that was dropping it, not re-wording it. It returns at position one or two when it is genuinely
      what matters most. The R6 headroom result is still a co-movement rather than an attribution,
      because the one-variable run that would separate it is the same class of long run I have just
      refused twice above, and sending the director a co-movement described as a finding is the
      defect this direction opens by naming.
