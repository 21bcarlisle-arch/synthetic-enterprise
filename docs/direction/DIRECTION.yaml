thesis_read: >-
  The thesis has a baseline, the baseline is winning, and the machine is now honest about why —
  but two things this stretch made it clear the comparison is being run on sand. First, the live
  acquisition and retention costs are invented. `saas/growth_mandate.py` spends £150 resi / £400
  SME and £112.50 a quote with no source behind any of it, while the researched model
  (`saas/opex_ledger.py`: £55 dual-fuel, £27.50 single, and a per-kWh broker trail for I&C, cited
  to CMA App. 8.3) has existed since 2026-07-10, is called by its own tests and by nothing else.
  The knowledge map records £30–60/dual-fuel at confidence H and simultaneously lists CAC-by-channel
  as a top-three gap. Every P&L both arms are graded on therefore includes a cost line with no
  provenance, and the retention model is wrong in kind — a £50 cash offer cost booked beside a 3/5/8%
  discount books the same intervention twice, against a licence condition (SLC 22B) that exists on
  exactly this point. That is a step backwards in what the published comparison MEANS, and it is
  P8 arriving on the live path rather than in a design document. Second, the constraint the director
  already ruled on is sitting built and held out of the tree: the 80-founder book is written, tested
  and in `docs/design/held/`, because applying it turns four campaign tests red and the reason is a
  question rather than a stale fixture. Depth is the bound on everything — A48's method skill is
  0.6136 concordance against a null interval of 0.283–0.717 on twelve decisions clustered on five
  accounts, the price ladder resolves nothing finer than 5.9 percentage points on seventeen binary
  rolls, and B10's chase is real but unmeasurable for the same reason. The world does now press
  a little, which is genuine progress: the one-sided chase landed at L2 and the SVT reconciliation
  is back to agreeing at 0.005pp. On the direction mechanism itself: the previous five focus items
  bound as drawn ZERO times, and one of them — the household column — was already live when it was
  named, so a lane-0 tick spent itself re-delivering finished work before releasing it. The steer is
  reaching a worker; what is broken is the binding, since `--landed` is not retroactive and work that
  lands before its claim is bound is invisible and gets swept back into the pool. Every atom-id focus
  item last stretch went undrawn while the instruction-shaped ones were worked, so this direction
  names no atom ids and gives instructions instead.
