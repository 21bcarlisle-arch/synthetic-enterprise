thesis_read: >-
  This stretch had 11 commits, 4 of them substantive. By side: supplier 1, world 0, both 1, other 9. For the first time
  in four stretches the supplier moved, and all four items in last stretch's focus were drawn and retired. B8's switch-on
  is pre-registered, and the switch is one named flag, ready and off (e23d5d3b6). It landed before any book carries it, so
  the company will learn price sensitivity from its own renewals and will not be told it. That is the thesis's
  inference-not-access shape. The supplier's move for each s.12g outcome was written down blind (e56d8b885), about 23h
  before the answer. That is the first time a value-test lever was chosen before its number, and it closes the way the
  0.12 cut was fitted on the pair it was then graded on. Reg 6C landed (cc9f08ae3), with 7527a2e36's closing=left intact.
  The gas-only win build was rebuilt from salvage eccf3dc756 and is in surgical_land now (pid 1572076, gate running since
  05:48Z). The promotion-race fix is on origin with a test (0b4d8ae59). Against the thesis itself, nothing has been
  measured. The per-customer arm still has no result that beats the flat-rules twin. s.12g's cut arm reached 2025-03 at
  06:20Z after 10h47m, the A arm has not started, and the run still ends about 05:30Z on 24 Nov. I did not read its
  treasury. No book has been built for about 63 hours, and every supplier grade waits on the one after s.12g. Three
  things are drifting. (1) Landing is again what loses finished work. The MSC replacement-win landing died at 05:56Z
  because its gate timed out at 3600 s. Three gates were running at once (reg 6C, MSC, executor), and its gate showed
  three test failures before it was killed. The gate-hour fix holds for one landing at a time, not three. Its
  continuation is held on a file that only success writes, so no one owns it: the same shape reg 6C had at 01:25Z. (2)
  The shared checkout is 5 commits behind origin. Every daemon, including the executor that launches landings, imports
  the bounded_landing.py that 0b4d8ae59 replaced, so the promotion fix is on origin but not live. Two more empty merges
  landed this stretch (779054e30, 0369aa1c5). (3) A G15 world landing (published forward for hedges) is gating now, from
  an interactive session, while the correctness stretch holds G15. The ruling lets work already landing finish, so I am
  not stopping it. But it is a fourth concurrent gate, and it is world work the supplier did not ask for. Until the book
  exists, the supplier work that can move needs no box: make the coming book's grades mechanical, and give the renewal
  switch-on a held-back baseline from the book that already exists.
