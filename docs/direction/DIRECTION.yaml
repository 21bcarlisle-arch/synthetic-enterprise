thesis_read: >-
  This was the strongest stretch this project has had against the thesis, and NOT ONE OF ITS
  RESULTS HAS REACHED A READER, because almost all of it is finished in the working tree and in
  no commit. Take the good first, because it is real. `A48_enterprise_value_is_the_method_not_the_book`
  went 0->2 and produced the first number this project has ever had for the actual claim: does the
  arm's own per-customer price rank the value JOINTLY created — what the household kept plus what
  we kept — better than chance? Concordance 0.6136, against a null whose 95% interval is 0.283 to
  0.717 (analytic sd 0.1105, cross-checked against a 200,000-draw permutation at 0.1103), p two-sided
  0.34. Twelve decisions clustered on five accounts, so the true interval is WIDER than the one
  published. The honest statement is that this run does not distinguish the method from chance in
  either direction, and the machine published exactly that sentence rather than the flattering one.
  Beside it: the arm's belief about who leaves ranks WORSE than a coin flip (churn AUC 0.465) while
  its price ranks created value better than chance — two questions, opposite sides of 0.5, and that
  is a genuine finding. The baseline the thesis demands exists and is winning: on the realised
  settled clock the per-customer engine earned GBP 4,724 LESS than flat rules, and one flat margin
  at the same price LEVEL earned GBP 9,627 more than the per-customer engine did, so the price level
  accounts for -104% of the arm's advantage and the choosing is currently worth less than nothing.
  Three published-headline defects were caught and fixed by the machine's own sweep in the same
  hours: a headline that said the arm earned MORE on a run where it earned less, a page dividing a
  renewal count by an account count, and a judgement word that could not change when its count did.
  That is the discipline the thesis needs — advantage from inference, and an instrument allowed to
  return "no". THEN THE OTHER SIDE. The publisher has been paused since 07:51:08Z — six and a half
  hours — and I fetched it rather than reading a file: `verification_state: paused`, `showing_run`
  git 28eaca4c9 generated 07:04:10Z, `episode_failures` 17. The unprocessed `run_complete_*.md`
  queue grew from eleven to TWENTY-ONE. And most of the repair is written and uncommitted:
  `python3 -m background.blocked_atom_visibility --check` now exits RC=0 with no drift output,
  `docs/design/BLOCKED_ATOM_VISIBILITY.md` in the tree no longer carries the wall-clock-stamped
  supervisor lines that made its freshness check unpassable, and the freshness test that the
  publisher names as blocking now passes against the tree. Somebody did that work this stretch and
  left it in the index. It is not finished, and the unfinished part is worth more than the finished
  one: I ran the file and a randomised full-file pass still fails
  `TestRepair::test_repair_restores_a_corrupted_rendering_and_reports_convergence`, while that same
  test alone in deterministic order passes in 33 seconds — so one of the publisher's five blocking
  tests is ORDER-DEPENDENT on shared fixture state, which is very likely why this wedge has been
  diagnosed three times with three different causes and keeps returning. The same commit-boundary
  story holds for the household side: I fetched the live `/capabilities/`
  page and it ALREADY renders a household cell per arm — the `householdCell(row)` renderer and the
  `"no household side for this arm">&mdash;` fallback are deployed — while the live `value_arms.json`
  has no `household` key at all, so every one of those cells is an em-dash. Cause, observed:
  `tools/generate_value_arms_data.py` in the working tree emits the block and
  `git show HEAD:tools/generate_value_arms_data.py` contains none of it. The index is now fourteen
  files and 1,415 insertions, up from nine and 739, and `git log --all -- simulation/settlement_clocks.py`
  STILL returns nothing for a fourth consecutive stretch. HEAD is fully pushed to origin, so nothing
  is wrong with the road out — the failure is entirely at the commit. My predecessor diagnosed that
  the focus items were the wrong SHAPE and cut them to instructions; that correction worked, because
  the work in them got DONE — the publisher fix, the household producer, B10's defence leg all
  happened this stretch. What no item said was "and land it by pathspec," and so the machine has
  spent a stretch building a reader-facing result that no reader can see. One thing I checked and
  must report: `B10_competitor_switching_response` is STILL being excluded from the BUILD draw on
  every tick — the supervisor log at 14:22 UTC, twice — for `couples_with: None`, a one-line
  registration defect that the last direction named as focus item three and nobody fixed, even
  though B10's defence leg landed and was measured in the same stretch. This direction is therefore
  almost entirely about landing what already exists. That is not tidying. Every single thing a
  reader could learn from today's work is on the wrong side of a commit boundary.
