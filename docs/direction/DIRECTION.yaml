      `background/supervisor._failure_is_in_window` -- the trim-on-read that landed 2026-09-24 --
      drops every one of them, so `_publish_gate_wedge_active` returns None at the
      `len(failures) < PUBLISH_GATE_WEDGE_MIN_FAILURES` line and never reaches the
      `shared_tree_live_record` resolver the test exists to grade. Put the failures INSIDE the
      writer's window and age the wedge from `wedge_since`/`alerted_at` alone, which is what the
      function actually composes.
    why: >-
      That one test is the entire citation in `docs/observability/.publish_gate_state.json`
      (`citation_at_head: reproduces`, re-confirmed red at HEAD on 2026-09-25), and it has held the
      publisher at 55 consecutive refusals over 77.7 hours with figures last reaching origin 80.1
      hours ago. The site is the director's only unaided view of the company and it has been stale
      for three days. DONE is: the test green, the resolver leg still PROVEN able to fail (the
      stale-copy world must red it, or the repair has deleted the control rather than fixed its
      fixture), and `episode_clean_publishes` above zero.
