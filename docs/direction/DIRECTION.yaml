thesis_read: >-
  The supplier moved a little against the thesis this stretch, by grading rather than building.
  The ending-term belief passed Q1-Q6 on f2c6979d01 (conditioned 0.882 [0.840, 0.924]; Q1 came in
  above its range, so it is graded refuted high, but its decision part held). This is the first
  per-customer belief in a while that reads the leavers better than chance on a book it was not
  built on. Its money test against the flat-rules twin, the baseline that matters, was
  pre-registered (e6be5fec8, predicted to miss its rule at 65%) and is running now on six dice seeds.
  So it is still true that NO per-customer arm has beaten the twin out of sample. A4 (EP1's dated
  rate as a value arm, 9.5 GB) ends at about 18:08Z. The director's s-12g row still holds the
  retention lever.

  On billing, the leaver final-bill disagreement was resolved, and the WORLD was wrong, not the page
  (a7778473f). No DD Instruction exists without a named payer, so 19 of the 23 bills were level cash
  presented in unnamed-occupier months (GBP 27,134.55 over 137 legs). Four bills (GBP 74.63) are
  unattributed. The value arm now refuses to read the payment score, with the knowledge written
  first and the harm sized (abcc2f090). That is a reasoned no, not a lever. d48 held at SPAR 0.5.
  Six of E1's seven estimate-against-meter breaches are summer estimates on electrically heated homes,
  made on the profile-class shape. The exception covers them as lawful. But SLC 27.15 ranks the
  account's own metered history FIRST, and SYN-2016-215 breaches in both 2021 and 2023, which means
  it held earlier summers' reads. That is a per-customer inference the supplier is leaving unused,
  so it leads the focus.

  Still no book has published since 18 Nov (6af7fd0bfd). f2c6979d01 was built and graded five times,
  but it never published. The book that carries the EPG, MSC and no-payer fixes waits on A4 by
  measured memory, not by a rule.

  The commit split was 1 supplier, 2 world, 14 other. By content, the world commit a7778473f is
  billing evidence and four of the "other" commits are supplier grades, so the balance is better than
  the label says, but supplier BUILDS were one.

  Machine: the promotion race got its fix (5c8c74888, the base is read with the lock held). The one
  later lost race (1795606115) was launched before that fix and waited on the fix's own landing, so
  it cannot test it. Three executor landings died in 4 s on the NEXT trailer, and each relaunch
  changed the message and landed. My own 09:20 record never reached origin: the push was remote-rejected
  (d500f66c1 sits in /var/tmp/se-direction-seat), so origin still carries the 06:21 record. The
  previous focus was drawn, 3 of 4. The-first-book-after-the-epg-fix-publishes was retired into a
  continuation while its DONE (a published book) is unmet, so it returns to focus under the
  continuation's id.
