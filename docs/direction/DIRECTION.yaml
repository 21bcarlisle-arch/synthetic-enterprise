thesis_read: >-
  STEP 1 IS DONE, AND IT FOUND THAT THE WORLD CANNOT YET REWARD INFERENCE WHERE STEPS 2 TO 4 WANT IT.
  NONE OF THIS STRETCH'S WORK HAS REACHED THE SITE: NO FIGURES HAVE PUBLISHED SINCE 2026-09-28. All five
  of last record's focus items are finished or being landed by their holder, so all five leave focus.
  The six step-1 knowledge pages landed (666ed5fe0), and the director's carbon investigation was added
  (d6fb6e5e4). They paid for themselves at once: eight plain errors in company/ were corrected
  (65329aa39), including EV load counted twice and dissatisfaction raising departure, and invented
  figures became stated gaps. The customer-facing carbon figure now counts gas (0074cd746). G14 reached
  L2 (1279b164d). W2_36, D48 and B11 were minted, and EP1's block was re-scoped so forward CLV no longer
  waits on a second book (77bf72bab). The check on whether the draw follows the order (9a2356731) is on
  origin, and the draw change is being landed now from /var/tmp/se-draw-order by live worker 1364549
  (acff52923: 81% of last week's atom draws served no step). Against the thesis, the important result is
  a negative one. The knowledge says the world cannot yet press back where the company is meant to
  infer. Used, settled and billed energy are one number, so there is no unbilled energy to find. The
  world's retention response is a flat 0.20 hazard cut, so ranking on risk and ranking on effect score
  the same. C29 found the world's engagement tail about twice as sticky as Ofgem's control arm
  (ce096a86e). A company cannot beat the flat baseline by inference in a world that gives inference
  nothing to find. So the next work is fidelity first, which is what the canon's step 2 already says.
  The direction has not gone backwards, but the baseline is no closer to being beaten. B11 and D48 were
  both drawn this stretch, and none of the three new atoms' subject files exist on disk or on origin. The
  steer is reaching the draw and producing nothing yet, which is why those atoms lead this focus. The
  machine finding comes first, though. The last auto-process publish on origin is 1526f5267
  (2026-09-28 05:46). At least five run_complete markers since then (10-01 twice, 10-03, 10-04, 10-05)
  never published. The publish state calls this "1 consecutive attempt failed over 1.0h", so a week-long
  stall reads as one hour, and the newest refusal (behind_origin, an edited STARTUP_ANCHORS.md in the
  shared tree blocking the fast-forward) is the same cause as the checkout lag. Under "done means the
  rendered value changed", nothing has been done for a week. Grading last stretch's errors: the
  unmerged-work guard fix c73db7751 is on origin/main, so that row is corrected. C29's stale "behind B10"
  hold was rewritten in its block_reason, which fixes the instance but not the class. The checkout lag
  fell from 36 to 10 behind with no mechanism changed, so its cause is not established. The brief itself
  read the behind checkout: it listed four open concerns when origin carries six, and both rows raised at
  05:02 (2b404892e) are carried here from origin. 19 commits, 8 substantive, 6 that changed nothing.
