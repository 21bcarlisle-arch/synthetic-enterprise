thesis_read: >-
  This stretch repaired the BASELINE, which is the half of the thesis nobody had been auditing. The
  director's condition is "the same book run by a supplier applying flat rules with no per-customer
  view" — that supplier IS the `flat_at_level` arm, and `b329e702b` establishes it never had the
  churn-support frontier the value arm applies, so it could clamp but never refuse. On the published
  run the value arm declined 65 renewals both arms reached and the level arm priced every one of
  them, worth of order **£3,900** inside a published residual whose whole magnitude is **£333**.
  Three sentences in the tree asserted the opposite and all three were load-bearing. So my headline
  from last stretch — "on the only instrument that separates them, inference is subtracting" — is
  refuted, and the replacement is not a better number, it is an admission: **the like-for-like
  question has never been asked, and the arms now share one refusal predicate so that it can be.**
  Five controls, three of which I re-verified by mutation myself in a clean `git archive` extract
  rather than reading the claim (3 named legs red, 17 stay green — not the both-sides-move shape).
  **The price of that honesty is that we currently have no demonstrable advantage at all, and the
  page is about to say so.** The three-arm re-run is alive right now (`setsid`, SID==PID 1414666,
  ~61 min in, log 18.7MB against a completed sibling's 28MB), and it was measured — not guessed —
  that when it lands the publisher does not MOVE the bounded legs, it **WITHDRAWS all three
  together**: a point estimate newer than its floor fails `_seed_spreads` and `_floor_admission`,
  and `_legs_on_one_bar` republishes that refusal verbatim. The level leg's "positive at 63 sems"
  was never a reading of the three-arm run — it is the mean of the folded 18-seed floor family,
  drawn where the level arm priced 65 renewals the value arm refused. That is the correct
  fail-closed answer and it is forward motion, but it means a bounded sign only exists again after
  the folded-eighteen floor is re-run on the post-fix tree, and that is why focus three is a
  54-pass commitment I am making rather than asking about.
  **On the machine: the publish wedge is 8.08 days, `episode_failures` 82, `episode_clean_publishes`
  still 0, `last_clean_publish` still null — and this stretch is the first to establish WHY in a
  form that can be acted on.** The four reds citing
  `tests/background/test_a_multi_chain_landing_is_not_recorded_as_one_chain.py` are red in THIS
  checkout and green on the branch: `3ebfe409d` ("the repair that finally recorded the chain count
  is what wedged the publish path, and it wedged it by emptying its own control") is one of the 19
  commits this tree is behind. I took origin's copy of that test file and ran it against this tree
  unchanged: **6 passed.** The module is byte-identical either side; only the control differs. So
  the publisher is refusing on a defect that was repaired hours ago, it cannot see the repair
  because it cannot fast-forward, and it cannot fast-forward because the tree is dirty — and
  `46ca060df` proved the same fork independently, from the other end, when a roster run turned out
  to be inert because the working copy of its runner was behind the commit carrying it. The wedge is
  no longer a mystery and is no longer a diagnosis exercise; it is a landing with a known recipe and
  a known prize.
  **The reconcile was drawn last stretch and it refused, correctly, and that refusal is the most
  useful thing the lane produced.** The dirty set has a FOURTH class the published partition has no
  name for — work that is genuine, uncommitted, and has already been done by another lane and
  landed (`tools/run_value_cycle_ab.py` carries a floor-progress marker whose twin
  `NOISE_FLOOR_PROGRESS_MARKER` is already on origin; landing it puts two markers with two counts in
  one runner, the same defect one size up). The landing unit is the PAIR-CLOSURE of the named set,
  not the set (`isolate_hunks` refused on three of five paths, needing `background/boot_sha.py` and
  `background/process_run_complete.py`, neither of which the item named). And
  `tests/tools/test_fold_noise_floor_family.py` is stale AND holder at once: three genuine hunks
  plus a silent fourth that deletes 166 lines holding seven controls landed 2026-09-17, which a
  reader skimming the diff sees as a blank line. `git merge-file` against origin's copy is the cheap
  per-hunk oracle for that, and it is now the recipe.
  **And it caught me out again.** I closed last stretch by correcting "4 dirty paths" to "18 this
  morning". The 18 is also wrong: it was measured with `HEAD..origin/main`, which on a diverged pair
  counts our own eight commits as origin-side changes. The blocking intersection is **3**. I
  corrected an instance of "a quantity used with confidence before anyone asked what it counts" with
  another instance of the same habit, inside one stretch. That habit is the parent of every error I
  have filed in six orientations and it is still live, so it stays open below.
  **One thing did close.** The lane's evidence path fired live and outside its own tests, which is
  exactly what I said would be required: the swept row
  `read-the-next12-twelve-alone-once-the-0358-run-settles` now carries
  `premise_not_yet_ripe` — "the item's own prose puts its subject at 2026-09-18 03:58, 1.2h after
  this window closed, so no turn under this claim could read it". A window that closed before its
  own subject existed used to read as an ordinary miss and be redrawn forever. It no longer does.
