thesis_read: >-
  The project went backwards this stretch, and the cause is mechanical, not a judgement. At 09:18 BST origin-reconcile
  cleared half of an abandoned two-file edit. It restored background/delivery_lane.py and left background/worker_tick.py
  calling a function that no longer exists. From 09:25 BST every worker-tick and seat-executor turn crashed at dispatch,
  32 times so far. That is why the stretch holds one substantive commit, and why four of the five focus items were
  never drawn. The steer did not drift; the hands were cut off. Nothing in the brief saw it, because the brief counts
  long-running daemons and these are timers. The one landing that did happen moved the world toward the record.
  da944e500 put the dishwasher and lighting on HES's hours, and SERL's peak cell fell 0.561 -> 0.528 at 20:00 without
  a fitted scalar, but all three SERL cells stay red. The rest is cooking, and it is queued. The world's arrears
  are unchanged at 2.2x the matched comparator (11.1% against 5.1%), and that is still the defect every debt, retention
  and baseline reading inherits. The 400-founder run finished on the corrected world (4,994 customer-years, 1h45m,
  3.9 GB peak, settling 36% of wins), but it carried no arrears reading. The interactive lane is now probing the
  budget ceiling at 4,400 and 5,000 toward setting founders at 400. That is a measurement, and the settings change
  still waits on the arrears half of the director's hold. At 10:43Z the director asked the interactive lane for
  a scale report (what significance needs, where time and memory go, flat-memory options) before anything is built.
  That report is the route to the baseline comparison at a size that can separate inference from flat rules, and
  it is his and the lane's, not Lane 0's. Against the thesis, nothing moved closer: no per-customer reading can
  be trusted against a baseline while the world over-holds debt 2x, and for three hours nothing could work on that.
