      First file a pre-registration in docs/staging/records/ that predicts the direction of the change
      in later-year engaged decisions and in whole-book departures. Then run base and change on ONE
      commit, one default world each, run them serially and never beside another memory-heavy job,
      and grade the pre-registration in the finding. Add one partition control that both the
      converted and rolled branches can reach.
    why: >-
      This is a world change that landed with no run behind it, under a commit message that said the
      opposite. It sits upstream of the retake in item two, so landing it first means the retake
      measures one world rather than going stale on arrival. DONE when the journey records a
      conversion off the SVT on origin, and the pre-registration is graded on one commit.
