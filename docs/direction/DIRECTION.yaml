focus:
  - id: the-company-ceilings-an-ex-vat-strike-at-the-ex-vat-cap
    lane: B_commercial
    what: >-
      Finish the fix that docs/staging/SEAT_FINDING_THE_28_ACCOUNTS_ABOVE_THE_CAP_ARE_EX_VAT_STRIKES_CEILINGED_AT_THE_INC_VAT_CAP_2026-10-01.md
      hands on. A seat lane is already measuring it in /var/tmp/se-exvat (measure_exvat.py, pid
      544762): do NOT launch a second world. Wait on that run, or take over its output if its lane
      has ended. Do it in this order. (1) Read whether simulation/svt_product.py writing svt_rates'
      inc-VAT cap into the ex-VAT unit_rate_gbp_per_mwh is the same defect on the world's side or a
      deliberate basis. Record that reading, and do not change the world in this item. (2) File a
      pre-registration predicting how many ceiling-bound renewals move, and by how much. (3) In
      company/pricing/renewal_rate_chain.py, de-VAT cap_ceiling at the company's own
      VAT_RATE_DOMESTIC, for both writer 4's clamp (:511) and the value arm's
      max_offered_rate_gbp_per_mwh (:382). Do not write a new VAT rule. (4) Add a control that no
      strike the desk writes exceeds the ex-VAT cap, mutation-proven by restoring the inc-VAT read.
      Fix the class, not the instance: if compliance/domain_invariants.py has no invariant that a
      sold ex-VAT rate sits at or under the cap de-VATed, add one there.
    why: >-
      24% of priced first terms in one world pay up to 5% over the legal default-tariff ceiling
      (SLC 28AD), and the company's own check passes them. The value arm has been scoring that
      excess as headroom. It is transfer, the exact thing the mission says is not value, and any
      value-arm result is untrustworthy until it is gone. DONE when the de-VATed ceiling and its
      invariant are on origin, the 28 openings re-read at or under the cap on one world, and the
      svt_product question has a recorded answer.
  - id: PB4_engagement_separated_from_elasticity
    what: >-
      Before the hazard swap, settle the year-one tail named in
      docs/staging/SEAT_FINDING_THE_YEAR_ONE_SHOCK_TAIL_IS_AN_EAC_A_FRACTION_OF_THE_HOMES_USE_2026-10-01.md.
      7 of 31 first renewals rise by more than 100%, in electrically heated homes whose registry
      EAC (1,600-2,500 kWh) is a fraction of their billed use (e.g. PROS-2016-0098). Do knowledge
      first: establish from the published record (Elexon BSCP/EAC methodology, docs/domain_artefact_library/)
      how an EAC is set for a settled home. Then find which layer of simulation/household_demand.py
      puts demand above the declared EAC. If the gap is not history-true, fix it in the world as a
      fidelity change, blind to company results and in its own run. Only then do step 3 of
      docs/staging/SEAT_CONTINUATION_SWAP_THE_WORLDS_BILL_SHOCK_BASE_ONTO_THE_EXPERIENCED_SHOCK_2026-10-01.md:
      swap _bill_shock_base in simulation/customer_events.py, re-fit the level against
      docs/market_research/svt_rates_active_passive_2016_2025.md, and add the tenure-1 control.
      Wait for item one to land first, because the ceiling fix moves the rates the year-one quote is
      priced at.
    why: >-
      The world's retention gradients are still the artefact of a count that is blind in year one,
      and every company ranking is graded against them. But swapping now would replace one artefact
      with another, an electric-heating shock gradient carried by a registry EAC the world's own
      demand ignores. DONE when the EAC/demand question has a sourced answer, any world fix for it is
      on origin, and the swap with its tenure-1 control is on origin with a finding giving the
      post-swap tenure and bill-size gradients against the published sign.
  - id: build-h49-so-the-shared-tree-fast-forwards-without-a-hand
    lane: H_harness
    what: >-
      Build atom H49_an_untracked_copy_of_an_earlier_origin_revision_is_cleared_like_a_twin in
      background/origin_reconcile.py. An untracked or modified shared-tree copy whose bytes equal ANY
      earlier origin revision of its own path is cleared like a twin, after it is preserved under
      refs/preserved/. Check with git log --format=%H -- <path> plus hash-object, not only the tip.
      In the same change, a NOT_ADVANCED or REFUSED_CONFLICT that persists past three cycles raises
      ONE supervisor alarm naming its paths, instead of only appending to
      docs/observability/reconcile-watch-log.md. Mutation-prove both legs: one fixture where the copy
      matches an earlier revision and is cleared, and one with novel bytes that must not be cleared.
      Then record the level move.
    why: >-
      As an atom bias, this was not drawn in the whole stretch. At 08:18 the shared tree sat 11
      behind, NOT_ADVANCED, refused by 6 paths, and the only record was a log line. Daemons run from
      that checkout, so they execute code the trunk has replaced. This is the fourth time in three
      days. DONE when H49 is off level 0 with both controls on origin, and the next fast-forward needs
      no hand.
