thesis_read: 'The stretch finished all four focus items, and the exit test is now one run and one read
  away, not one defect away. The customer page''s ''Paid in total'' was the page reading the wrong field
  (ex-VAT revenue), not the ledger misrecording payment: 597720378 reads the payment ledger, the margin
  column foots and says what gross, net and cost to serve count, the EBSS credit later bills drew on is
  posted, and life events are labelled the world''s. The held bill was my wrong premise: the held months
  were billed at the next actual read, and what was wrong was the record (fccc0a41c; INV_PERIODS_CONTIGUOUS
  3 to 0 on the newest run). The phase4c tests landed keyed to the property (12f5b480f). The eight cold-read
  rows produced the stretch''s most important finding: only two could be graded on the raw export (abc5dcc0f,
  9d7bd4a5c; MPAN 637 to 0, EBSS 291 to 12), and six need the company''s own dated events (renewal notices,
  due dates, collections, write-offs, tariff name) that the export does not carry. So leg one''s ''zero
  unexplained breaches'' is true only over the rows that can see, and the 12 EBSS breaches left are excepted
  to a world defect (the occupier credit is sized by the debt). The reconciliation also surfaced 33 accounts
  holding credit the engine does not, with no refund at exit modelled, and 24 owing more for causes not
  yet traced. A cold read will find those, so they come before it. Against the thesis this is still correctness,
  not inference: no baseline comparison moved, and the live renewal belief still ranks leavers backwards.
  That is the ruling''s order and it is right. The split reads supplier 2, world 1, other 7, but the classifier
  again missed the customer-page, suite and phase4c commits; read by subject, five carry supplier work
  and one is world. Of the previous focus, all four landed (three drawn on steer; the held bill landed
  under its own id). Pacing: the 29% reading asks for at most 0.55 points an hour, so this focus is four
  items worked serially, with exactly one fresh run, pre-registered, and that run must be a full run,
  because 2eeb3f0b3 exists only as a pickled arm and cannot drive the page generators. Of the not_done
  Lane 0 rows, the-mandate-run-arm-b-is-re-run-after-the-addacs-fix is premise-spent by f9688b536a, and
  b13-level-2-is-landed-from-the-shared-tree is held by the ruling.'
