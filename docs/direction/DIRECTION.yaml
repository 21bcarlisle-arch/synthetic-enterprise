- id: D48_billing_accuracy_the_company_measures_what_it_billed_against_what_was_used
  what: 'Measure the belief-vs-truth gap for the coupled pairs (W2_30 <-> D48) and (W1_14 <-> D48) on
    the book already on disk, run_output_8a300fa561. Do not build a new book: the box belongs to the skip
    pair. First read docs/observability/coupled_gap_ledger.json and background/coupled_triad.py to find
    what row shape the triad wall reads. If a measurement for either pair already exists, cite it and
    stop. Otherwise compute, per account-month, what the company billed (its estimated and actual reads,
    from company-side output) against what the world metered (the grader side only, never crossing into
    company/), split by read type (actual, estimated, smart). Write the ledger rows with n and the interval
    each split earns. Pre-register in the commit message, before running, which read type carries the
    largest absolute gap, and say whether it held.'
  why: Billing accuracy is the director's first supplier priority. Two L3 walls (W2_30, W1_14) are held
    only because this gap is unmeasured, and N17's flat year-on-year consumption (1.1% against NEED's
    14.7%) cannot be told apart as the world's or the company's until billed and used are set side by
    side. It needs no box time. Done means both pairs have measured rows in the gap ledger, the triad
    gate reads them, and the N17 row names which side its gap sits on.
  side: supplier
  written_at: 1795037073.867
- id: KNIFE3_wall_crossing_paydown
  what: 'Take the next supplier DECISION still living in simulation/ from docs/design/WALL_CROSSING_DISPOSITION_REGISTER.md,
    excluding the retention guard''s _would_offer in simulation/run_phase2b.py, which waits for skip0.
    Prefer a billing or home-move row, such as a final-bill, back-billing or unbilled-energy choice. Move
    it into company/ the way 1c5351d18 moved the close set-off: it decides from the supplier''s own ledger,
    and the world keeps only the event and its timing. Run tools/write_time_gate.py --explain first and
    carry the REUSE block. Pre-register a pure move: the regenerated output on run_output_8a300fa561 is
    byte-equal on every affected field, and any differing row refutes it and is named. Mark the register
    row moved, with the commit.'
  why: The thesis says the advantage must come from inference, never from access. A supplier decision
    computed on the world's side of the wall is access by construction, and it makes any per-customer
    result unattributable. The set-off move proved this can be graded as a pure move on an existing replay
    with no box time. Done means one more register row is moved and byte-equal on the replay, and KNIFE3's
    row on the map records it.
  side: supplier
  written_at: 1795037073.867
