thesis_read: >-
  **The stretch did the hard thing I asked for and the answer was better than I expected — and in
  doing it, it uncovered that the world the whole comparison is measured in is out of band.**
  Item 1 landed in full. `tools/dd_opening_arms.py` ran both arms over one seed's 10,906 bills,
  reproduced the pre-organ book byte-identically as its control, and the result is the first real
  instance of the shape the thesis demands. Matched on the same 96 households: mean absolute
  end-of-year-1 balance drift falls **£201.93 (95% CI −£257.57 to −£143.50)**, interval excluding
  zero; the estimate ends closer to zero for **80 of 96**; first-year review variance falls from a
  median 104.4% to 15.6%; large payment increases at window 0 go **185 of 222 → 40 of 114**; peak
  held-credit liability **−41.7%**. The flat rule was not a baseline that took some beating — it put
  five in six first-year households through a >15% payment rise as an artefact of their join month.
  And it was graded against predictions filed first, with **Q5 refuted in the record**: I predicted
  the estimate arm would carry the systematic bias, and the flat one is systematic (85% one-sided).
  That is inference beating a flat rule, measured honestly, on the one atom the thesis rests on.
  **Item 2 landed and was settled the right way round.** `BASIS_ORDER` is now two rungs, not four,
  because the measurement said 0 of 257 supply points hold prior metering of ours at acquisition and
  0 carry a declaration. The parameters were **removed from both signatures** rather than documented
  as unused — this seat has watched a signature-keyed refusal lift on an accepted-and-ignored
  parameter before, and it did not repeat it. The two absences are kept apart by kind: metered
  history is definitional at opening and never lifts; a customer declaration is a world gap that
  returns when registration carries one. That is the honest `None` with a named reason, at
  structural scale.
  **What none of it can do is tell you the company is good, and here is why.** The published
  advantage — flat rules £153,245 against per-customer £157,913, the choosing worth −£175 — is
  earned inside a world whose departure level I measured this morning and which is **outside the
  published GB switching band in 7 of 7 measurable years on the renewal route and 8 of 8 on the
  whole book, and high in every one of them**: 2017–2024 mean expected departure **22.35% against a
  published midpoint of 17.20%**, 2020 out by 15.9pp. The anchor that sets it landed 2026-09-02 to
  cure the opposite fault — the world was then 3.45× *too low* — and it overshot. Its own docstring
  names the remedy (*"re-capture and re-fit — do not widen it"*) and nobody has. Meanwhile
  `docs/institutional/knowledge_map.md:114`, the row a lane reads before touching the world, still
  says *"3.15× short"* and *"the level move is NOT yet made"* — stale by two days and wrong in
  direction. **The precondition is broken in the one place the thesis cannot tolerate it.** Fidelity
  is not the goal, it is the precondition; a world that departs 1.3× harder than GB did is not GB,
  and "it performed well" measured there means what the thesis says it means: nothing. The credit
  belongs to the machine that this is even sayable — the strict xfail on
  `test_the_whole_book_departure_level_is_inside_the_published_band` was built to hold exactly this
  verdict open and to fail the instant the world comes into band. It is doing its job. The work now
  is to make it flip.
