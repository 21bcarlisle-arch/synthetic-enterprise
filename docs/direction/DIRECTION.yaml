thesis_read: 'Sideways, not backwards. No level moved, and no supplier capability landed this stretch.
  There were 14 commits, 11 carrying work and 3 substantive. The brief puts all 14 under "other" because
  it sorts by file. Read by subject: two are the director''s front-door steer (5765c102d, 420a5b67d),
  which is his own priority, and one is D48 billing accuracy (094a70b5b). The rest are grades and pre-registrations.
  THE STEER DRIFTED. Of the four focus items, only the D48 long-runs census was drawn and landed. The
  HEAD run, the retention-guard interval and the meter-exchange prereg were never drawn. My HEAD-run item
  also tried to order the run ahead of section 14''s seed 2 by asking a worker to re-stamp a queued continuation.
  Nothing drew the item first, so the seed-1 grade (f29c54700) launched seed 2 at 07:16Z as its own text
  said. That sequencing error is mine, listed in wrong. It is corrected below, and no ordering is needed:
  the box has 16.6 GB free, and the sim-runner has been deferring even though its own arithmetic fits
  (11,880 + 7,066 <= 23,008 MB). So item 2 launches the HEAD run beside seed 2. WHAT IT MEANS. (1) Per-customer
  against flat still has no graded seed. Seed 1 is void under its own rule: P14a failed as written, because
  flat departed 353, the same as the default. The patch did reach the world (62 of 95 fix-end departures
  re-drawn), so seed 5 replaces seed 1, and P14a'' was filed before seed 2 output existed. The thesis''s
  baseline comparison is therefore no further on, and the one-seed reading is still the same: the per-customer
  money is transfer plus one coin. (2) Section 15''s holdout arms both finished (06:38Z). Its grade is
  drawable now, and it is the first evidence of whether the company can LEARN from its own data that its
  save offers are near-inert. Item 1 builds what the guard does while that rate cannot be told from zero.
  (3) Billing accuracy has three findings. (a) The read instruction sent 469 visits and got 0 reads, because
  the world''s visit-access rate is a null GAP. The lever cannot work as the world stands. (b) 26 gas
  prepayment runs are a company defect against UNC M5.9.14. A worker tick is fixing that in the shared
  tree now (read_duty_register.py, monthly_bill_assembly.py, edited 08:10Z). (c) Catch-up size follows
  the estimator, not the run''s length. All 7 catch-ups of GBP 500 or more sit among the 27 runs billed
  more than 25% off use, and the candidate cause is a three-read re-level where the company already computes
  an annualised advance (item 3). (4) The negative bad-debt belief reproduces at 1ac35d918 (c79371e8f):
  28 calls, all in the worsening cell in 2024-25, in cells of about 260 account-years. That is not thin
  data, so my thin-cell guess was wrong. The vintage reading clears every call. It flipped no offer and
  leaves the book share at 0.0022, so it is a correctness fix with no money in it. (5) The BLOCKING crisis
  bad-debt finding has now waited 8 days, on a run that could have started at any point tonight. The inference
  side is unchanged: the ending-term belief ranks leavers at 0.806 in the run, and no policy carries it,
  because no seed of section 14 is graded.'
