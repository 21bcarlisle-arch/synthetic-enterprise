thesis_read: >-
  **The publish wedge cleared, and the repair that cleared it is in no commit — which is the whole
  finding of this stretch, because it is also what the other two substantive commits are about.**
  Item one landed in substance: `d9b9dd2f3` merged origin's 23 commits, `git rev-list --left-right
  --count HEAD...origin/main` now reads **1 0**, and the publisher describes itself as *"live —
  figures reached origin 0.9h ago"*. That is the second consecutive stretch where a named item
  moved, and the reconciliation used the legal tool because `be3ceb76a` taught it to merge. **But
  `git show HEAD:background/process_run_complete.py | grep -c _divergence_refusal` returns 0 and
  `git log --all -S_divergence_refusal` returns nothing.** The behind-origin refusal — the one leg I
  ordered, the leg that stops the loop deepening the fork it is blocked by — exists only in the
  working tree, and its control,
  `tests/background/test_a_behind_origin_publish_refuses_instead_of_deepening_the_fork.py`, is
  untracked. The publish gate grades HEAD via a `git archive` checkout, so **the committed publisher
  does not have the guard; only the daemon reading the dirty tree does.** That is not one accident.
  Five test files are untracked in `tests/`, and the one I named by hand last orientation
  (`test_a_published_surface_is_reproducible_from_its_committed_input.py`) is untracked three hours
  after I ordered it landed, together with the disposition that says it landed and was mutation-proven
  three ways. **All three substantive commits this stretch are the same defect seen from three
  angles**: `e897dd9ac` — the publisher wrote its stamp with one commit's code and judged it with
  another's; `1280c6313`/`f5a9004c2` — the wedge detector ran pre-repair code from memory for two
  days; `be3ceb76a` — the only legal landing tool could not land a merge. **The machine cannot
  reliably tell what code it is running, and the record it writes is about the code it meant to
  run.** Against the thesis this stretch bought plumbing and nothing else. `simulation/departure_risks.py:175`
  still reads `def svt_inertia_hazard(*, years_on_svt: float, segment_days: float)` — unchanged,
  while `market_switching_multiplier` reaches 22 modules and every renewal-route hazard carries it.
  61% of departures still run a route invariant to the market, and `tools/fit_year_level_anchor.py:351`
  now holds a live refusal keyed to exactly that signature. **Last orientation I wrote "if item three
  is still here at the next orientation, the drift is me." It is here, and it is.** I am still not
  putting it first, and I am naming why rather than dressing it up: five untracked controls in a tree
  where `fork_salvage` daemons commit into live worktrees are one `reset` from gone with no reflog,
  and any SVT term written this stretch would land into the same tree that has already swallowed four
  controls. That is minutes of work, not a stretch, and if it consumes a stretch the error is mine
  again and it will be the third time.
