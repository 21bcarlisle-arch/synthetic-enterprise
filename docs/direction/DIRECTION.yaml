      enforced by the basis gate in `tools/generate_dashboard_data.py`. All three instances got past
      it because **the gate is keyed to that generator's own field names** and all three are A/B and
      treasury surfaces that never pass through it. Extend the requirement **from the fields to the
      property**. Key the leg to the property, not to today's three instances: a control pinned to
      the current state goes red when the code becomes more honest. Mutation-prove it with
      `python3 -B` — two same-size edits inside one second match on `(mtime, size)` and the harness
      reports SURVIVED off a stale `.pyc`.

      **The consolidation question the director reserved to me is answered and stays answered.** §4
      of that document rules **no merge**: the through-line is real and broader than he put it, but
      a merged class has no single closing mechanism, and *a class you cannot close is not a class,
      it is a theme* — merging would destroy the closability the cost ranking exists to spend. The
      warranted consolidation is **a split, not a merge**, which is (a). **Do not re-litigate this
