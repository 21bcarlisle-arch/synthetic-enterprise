thesis_read: >-
  All three steers were drawn, and two produced a graded answer. b6a21c885 answered item one with
  an absence. No artefact on disk records what either arm DECIDED, so no figure yet can separate
  inference from luck. Its partial split still moves the thesis forward for the first time in
  several stretches. The ±£4.2k selection switch is entirely PROS-2016-0098's churn roll. On the 94
  accounts the value arm never priced, where the two arms' rules are identical by construction, the
  arms differ by only £3–£7. On the 70 priced accounts, excluding 0098, the value arm reads
  +£877 to +£884 on both seeds and all three C1 states. That is the first figure located where
  decisions CAN differ. It is not yet inference. The exclusion is post hoc, there are only n=2
  draws, the priced set is an upper bound on "decided differently", and the sign test across
  accounts is 21 against 25 (p=0.66), so the money is concentrated and not broad. Item three
  measured and withdrew my carried claim. Heartbeat commits are 6.5% of the shared tree's 37h
  behind in 95h. The dirty-path and two-lane-conflict classes are 45%. That is 7a97d25a8,
  gate-receipted in the seat-executor worktree and not yet on origin when I read this. Item two
  is where the stretch went wrong. Its instrument (per-account arrears lines in
  tools/run_value_cycle_ab.py and simulation/arrears_engine.py, plus a reconciliation test) is
  written and sitting UNCOMMITTED in the shared tree, last touched 18:54Z. Its surgical_land ran
  1h25m and exited, and nothing reached any ref. So the HEAD re-measure the thesis needs has not
  started, and every graded run is still at fcba478b7. The machine was worse than the work. 14 of
  19 commits carried nothing: 6 heartbeats and 8 reconcile merges. HEAD is 11 behind origin, and
  per 7a97d25a8 it is pinned there by dirty shared-tree paths. No level moved.
