focus:
  - id: add-the-per-renewal-decision-fields-once-the-arrears-lines-land
    lane: A_strategy_governance
    what: >-
      Precondition: f997f8bf7's arrears lines must be on origin/main. Check with `git grep` on
      origin/main for the arrears-lines field in tools/run_value_cycle_ab.py. If surgical_land pid
      1658805 is still running, wait on it with tools.wait_for --pid; do not start a second
      landing. Then add two fields to noise_floor's per-seed row in tools/run_value_cycle_ab.py.
      The first is renewal_decisions_by_arm: customer_id, commodity, term_start, declined,
      chosen_margin_gbp_per_mwh and offered_rate_gbp_per_mwh, for every value_arm_log row in both
      arms. The second is decided_differently_by_account. It joins the two arms on (customer_id,
      commodity, term_start) and counts renewals that differ in offered rate, or where one arm
      declined and the other priced. A renewal present in only one arm's log is its own roster
      category. Before adding anything for retention, grep for a per-account retention-action
      log. If none exists, name that absence in the commit. Mutation-prove a control showing that
      decided_differently counts a known differing pair AND a known identical pair as zero. Land
      with tools/isolate_hunks.py plus surgical_land --content, then bind with delivery_lane
      --landed. Afterwards, diff the shared tree's stale copies of simulation/arrears_engine.py,
      tools/run_value_cycle_ab.py and the untracked
      tests/tools/test_the_arrears_lines_reconcile_each_accounts_net_to_the_penny.py against
      origin. Restore them only if every hunk is on origin; file what is not.
    why: >-
      Every inference claim the thesis allows needs the set of accounts where the per-customer arm
      decided something the flat arm did not, and nothing can build that set yet. The stale copies
      are also among the dirty paths pinning HEAD 21 behind. DONE when origin/main carries both
      fields and their mutation-proven control, and the three shared-tree arrears paths no longer
      appear in git status.
  - id: grade-the-plus-880-once-the-decision-fields-are-on-origin
    lane: A_strategy_governance
    what: >-
      Trigger: `git grep -q decided_differently_by_account origin/main --
      tools/run_value_cycle_ab.py`. Before launch, write one SEAT_PREREG_ at that commit covering
      both open questions, so a single run pair grades both. From the selection re-measure: whether
      the priced-set value-minus-level, excluding PROS-2016-0098, keeps its sign at HEAD;
      875322e5a's prediction that 0098's arrears line grows past −£5,659.81; and whether 0098
      still leaves at different dates across seeds. From the +£880 partition: the share of that
      figure sitting on accounts with at least one differing decision, and the count of such
      accounts per seed. Run seeds 11111 and 88888 with leg 4b at its HEAD default, via
      tools.launch_long_job under setsid, and wait with tools.wait_for --pid. Launch nothing while
      another value-cycle run holds memory. Grade in a SEAT_RESULT_ beside the prereg:
      value-minus-level on the decided-differently and decided-alike sets, an exact binomial bound
      on each count, and a sign test across the differently-decided accounts.
    why: >-
      This is the first measurement that can credit the arm's edge to what it decided (inference)
      rather than to one account's churn roll (luck). It also moves every graded figure off
      fcba478b7. One pair of runs instead of two, because the disposition in 4c11c0ce3 showed that
      both preregs need the same seeds at the same HEAD. DONE when a SEAT_RESULT_ at a named origin
      commit grades every prereg line. "We cannot tell at n=2", stated with the counts, is a
      legitimate grade.
  - id: land-the-heartbeat-stand-down-already-in-the-shared-tree
    lane: H_harness
