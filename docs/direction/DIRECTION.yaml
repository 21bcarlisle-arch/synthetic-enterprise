thesis_read: >-
  THE BOOK GOT MORE LAWFUL AND MORE HONEST THIS STRETCH. IN BECOMING HONEST IT SHOWED THAT THE VALUE
  ARM'S INFERENCE IS WORSE THAN THE OLD ARMS SUGGESTED, AND THE THESIS'S OWN TEST IS STILL NOT
  MEASURED ON THE WORLD HEAD RUNS. Three things are now corrected on origin. (1) The SVT anniversary
  departure roll is gone (1cd4b03dc). On one commit, 4 of 5 of its pre-registered predictions held,
  and SVT exits per SVT account-year fell from 0.193 to 0.150. (2) A chosen fixed renewal is out of
  the cap (9cfb1817f), as the commons says. A first term stays held at the cap under a named
  acquisition rule, because the world's acquisition is price-blind and booked 2021-22 first terms at
  up to x3.55 the cap. (3) The SVT conversion row is logged again (6aa3653d7). The thesis-level
  result is in 9cfb1817f. Once its renewals were uncapped, the value arm repriced 46 renewals at a
  mean of x1.38 (max x2.4). Its own churn belief called each of those prices an interior optimum. The
  world churned 7 more accounts, and value-arm net FELL by 3,587 pounds, while it rose on the flat
  arm. The cap had been shielding the arm from its own churn belief. So part of the advantage
  published until now was a legal ceiling standing in for inference the arm does not have. That is
  backwards against "advantage from inference, never access", and it is now the first-order subject.
  Last stretch's item one did NOT finish, though all four previous items were drawn.
  arms-d-head-1002 was OOM-killed at an 8G peak after 1h. Its noise floor waited an hour and was then
  refused by the headroom gate. Both had been launched at 0bac2b8be, which three world and company
  commits had overtaken within two hours. So the published world-D arms still come from 0407ce0e3
  plus a patch. Two landings are in flight now and not yet on origin. The first retires the sixth cap
  implementation (surgical_land pid 667519; the census finding is filed). The second withdraws the
  current-world headline when the arms ran older code than HEAD (pid 694735). Once the second lands,
  the 2026-10-05 publish cannot carry stale arms as current, so the retake becomes a measurement and
  stops being a safety repair. 1cd4b03dc's message claimed "journey advance unchanged". That was
  false: the roll's removal also stopped _journey.record_decision for a household converting off the
  SVT. That is a live world change with no run behind it. Of 10 commits, 4 were substantive by the
  brief's count (7 carried work). 3 were heartbeats. Every daemon is on the box.
