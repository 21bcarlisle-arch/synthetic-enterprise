thesis_read: 'This was the best correctness stretch since the ruling, and it moved inference not at all. The ruling''s own
  work landed in order: the read duty now fires on every year on estimates where 21B.4 applies (431 of 431, 85dcdc3b8), a
  prepayment leg is sent a statement rather than an estimated credit bill (113 of 137 legs fixed, 3e19e5676), the validator
  grades SVT rates from below against the wholesale floor (580937a15), and the ADDACS fix let a household''s own mandate cancel
  reach the desk, with all three pre-filed predictions holding (18 stops, gross and net to the penny, f9688b536). Most important,
  the blind invariant suite exists (529a6b05a): 33 invariants written by an agent that never read the code, run on the 67a893e749
  book. It found three real defect classes the code''s own tests had passed: prepayment accounts charged the direct-debit
  cap level, above the prepayment cap, for five years; an SVT standing charge that steps on 1 January rather than with the
  cap, 1.7x the cap in Jan-Mar 2022; and meters that change register count under one serial. The first refutes my own last
  reading that the cap side was clear, so the method the director asked for has already paid for itself. Against the thesis,
  the supplier is billing more truthfully, but the renewal belief still ranks leavers backwards and no per-customer decision
  changed, so there is no inference gain and no baseline comparison moved. The exit test is not met: the suite has open breaches,
  seven invariants it cannot read from the export, no fresh book, and no cold read. The split is supplier 4, world 2, other
  11; the other is mostly the suite, the validator and pre-registrations, which is ruling work and not drift. Four of my five
  items were drawn and landed; the fifth, the draw honouring the ruling, was not drawn in the stretch and was claimed at 00:24Z.
  B13 landed (b7b17b8bf). The suite''s own ''what would close this'' named four fixes and queued none, so this focus is those
  fixes, in the order the money moves, and the export it needs to read the rest. The checkout is 51 behind origin, and the
  ruling file stays live there.'
