thesis_read: 'A narrow, solid stretch for the correctness exit test. The overdue row was the largest block that was excepted and not explained, and every one of its 2,500 steps on the 209c3350ab book now
  has a cause. Three fixes cover them: the desk asked for the unrounded total (714b0ce3c), it never saw a mover''s part payment (714b0ce3c), and a credit bill was never taken off the next collection (156f8dfd6).
  A missed payment now has one definition, sourced, that both the page and the desk read (dae9f598d), and the debt slot fills on the 209c book. None of this is graded on a fresh run yet. No launch_long_job
  job ran this stretch, so for now ''explained'' means traced in replay and nothing more. The fresh run that grades it is now the critical path, and it should carry the fixes for the two defects this stretch
  exposed: the triad draws a non-final bill as a mover''s exit, and two engines narrate one debt at different amounts. The previous focus partly reached the draw: 3 of 4 items were drawn. The small-exceptions
  item landed nothing and is back in the queue, and the fourth cold read has no reading on origin. So I carry both, unchanged in intent. The queued continuation the-desks-untraced-cash-on-four-part-paid-final-bills
  is spent: 156f8dfd6 traced and fixed those 32 steps. It should be retired as premise-spent, not redone. Against the thesis, this is still the precondition, not the result. No baseline comparison and no
  lever work happens until the exit test is met. The live renewal belief still ranks leavers backwards. The live pages change only at the 2 Nov publish. Commit split: 1 supplier, 0 world, 1 both, 4 other.
  The four ''other'' commits are supplier billing and collections correctness, carried as traces, rows and the cast.'
