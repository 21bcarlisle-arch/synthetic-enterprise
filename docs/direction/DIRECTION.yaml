thesis_read: >-
  Against the thesis this stretch held its ground. It did not advance, and the reason is the pace, not
  the work. The slow tick mode set on 25 Nov at 12:47Z ran until 09:05Z today. That is why none of the
  four previous focus items was drawn. The steer did not fail to bite: the machine was barely ticking.
  The advisor's 39% reading lifted slow mode, so this focus is the first one that will actually be worked
  at normal pace. The work the seat did do went at the publish wall. 10bf51c37 keys the EPG unit-rate
  exception to the read-tenths class, so it is no longer a count of one book's size. All 362 breaches
  sit inside the tenths bound, and both mutations fire. fbb4ba43e shows that the 8 EBSS breaches are the
  two classes the exception already covers. That one needs the occupier and void shares in the raw export
  before it can be keyed the same way. 4df2b4f89 shows that the gas-repeat legs are a real repeat in heating
  months (PROS-2017-0192g repeats nine months to 0.1 kWh) and not the excepted class. The cb93f7760c grade
  shows billing and EPG clean on 23,777 invoices. Even so, no book has published since 18 Nov. The book
  now building (001e4f680a) carries the EPG fix and none of the others, so it will be refused again unless
  causes 2-5 land first. On the thesis's own test, a per-customer supplier against the flat baseline,
  there is still NO valid comparison. The director answered the open row at 05:47Z ("Yes. But watch out
  for weird energy crisis years"). The fidelity check by his four regimes is done (3e032230b): before
  the cap the world agrees, the crisis years and the years after 2024 fail, and the re-grade is pre-registered
  to rest on regimes 1-2, read separately. But fix 0, the FTC window from 2021-10-01, has not landed.
  Meanwhile the etarms chain that my last record ordered stopped is still running on e6be5fec8. I checked:
  the arms tool counts calls into simulation.retention_offer, and a189c2824 changes that file, so the
  chain is void by the fix's own rule. Yet s5 all_on (03:36Z) and s6 flat (08:59Z) launched anyway, and
  the s6 arm is using 3.4 GB right now. The commit split was 12 "other" commits and 0 supplier, world
  or both, with 2 substantive. The split mislabels billing invariant work as "other", but even read generously
  the supplier moved only on the publish gate. Of the Lane 0 misses, msc-b-the-world-charges-the-msc-on-a-replacement-win
  appears already spent: B landed as f70757dc9, per wrong_triage. Whoever next touches it should bind
  it with --landed-under rather than redo it.
