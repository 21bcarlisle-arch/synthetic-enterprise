  proposal: >-
    Approve the cleanup as proposed in docs/staging/SEAT_PROPOSAL_CLAUDE_MD_CLEANUP_FROM_THE_END_TO_END_REVIEW_2026-10-04.md,
    item by item, or strike the items you disagree with; on the three canon items, rule on the wording
