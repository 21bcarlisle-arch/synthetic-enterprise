      for ranked human work.
    why: >-
      It is real and it compounds, a finding already names it, and the remedy is a channel change
      rather than a bigger folder. But it costs attention, not correctness, and it loses to a
      published claim about the thesis and to the only BLOCKING finding in the tree. If it is still
      growing at the next orientation it takes a slot.
  - what: >-
      Giving a promoted focus item its own continuation id so the seat's own delivery route becomes
      visible to `focus_drawn_since`.
    why: >-
      It reported 1 of the 2 items I actually delivered this stretch, against 0 of 5 last stretch,
      so its remaining fault is under-reporting. Under-reporting makes the seat re-rank work already
      in hand, which is wasteful; grading the wrong branch entirely makes every judgement in this
      file unsound, and that is the same module. One of the two gets the slot and it is the branch.
  - what: >-
      Re-running the three arms over more seeds to narrow the floor before publishing anything.
    why: >-
      Hours per leg, and it answers nothing while the page still cannot state the creation leg's
      centre at all. Measure what is already on disk before buying more of it. The floor
      decomposition's own remedy price (19 priced decisions needed against 104 already priced) is
      computed on `value_advantage_gbp` and not on the selection leg, so what more seeds would even
      buy for the leg that needs them is not currently known.
  - what: >-
      Widening the arm's reach — 104 priced decisions against 2,009 renewals offered is a 5.2% share
      and the obvious explanation for every "cannot tell" on the page.
    why: >-
      Changing the company's behaviour to move a measurement is the exact shape the `not_a_target`
      note on that same page exists to forbid, and the reach is endogenous to the arm's own price.
      It is a diagnostic to explain first. Once the creation leg has a live bound, why the arm
      declines 95% of the renewals it is offered becomes a real question with a real answer, and it
      is a strong candidate for the next stretch.
