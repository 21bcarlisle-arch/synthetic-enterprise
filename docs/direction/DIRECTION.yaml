thesis_read: >-
  The thesis question got its first out-of-sample answer this stretch, and it is still no. 78962a574 graded s.12g:
  the per-customer retention cut against the flat-rules twin reads -GBP 0.14 (-1.39 to +1.03) per household-year.
  That is a STRADDLE with a negative point, so P1 is refuted by its own rule. The 0.12 cut stays an in-sample
  constant with no out-of-sample support for either sign. The pre-registered STRADDLE branch is being followed
  exactly. d6af317e7 corrected q to the gate's own population (0.2767, not 0.7563) and armed the rank-at-q run,
  which offers to the twin's volume by A's belief, so no fitted number is left. It is queued for room
  (longjob-value-test-s12g-rankq-queued, about 11.5 h) and its reader is held on grade_rankq.out. The supplier
  did move in one place: 5e6a8b70d builds the won first term on the strike it was quoted, switched off (144 of 144
  quoted terms bill their quote and the cap hold clamps none). The last stretch's focus 1 is finished and leaves
  focus. Focus 2 did NOT finish. land7 (MSC) was refused at 05:38Z, 8 seconds in, at the stale-copy check, never
  gated: its tests/simulation/conftest.py predates 83570bd1c (23 Nov 04:13), the landing that made the event-log
  tests share one 2016-2018 run. land8 died with it. So da44381d2's timeout prediction is still ungraded, because
  nothing ran. My 03:23 focus pre-committed the branch for this case: delete the MSC row. That is now focus 1,
  because the book every supplier grade reads is about 87 hours unbuilt, and after eight attempts MSC is not
  close enough to hold it any longer. The commit split is 1 world and 0 supplier among the substantive commits.
  Most of the rest is s.12g records, labelled "other", which are supplier work in substance. Two signed director
  steers arrived (452de5285, 05:32-05:40). The weather-to-price chain loses to a gas-only null at the month and
  the quarter in every regime (3589e04c7), and there is no deep knowledge page under it. He asked for gas first.
  That is world work, but it uses no box time while the box is the binding constraint, so it is focus 2.
