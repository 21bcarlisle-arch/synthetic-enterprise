focus:
  - id: the-books-ceiling-is-our-serializer-and-not-the-world
    what: >-
      START BY READING THE 226 UNCOMMITTED LINES ALREADY IN `tools/settlement_ceiling_probe.py`
      (`git diff HEAD -- tools/settlement_ceiling_probe.py`, last written 2026-09-03, in no commit).
      Decide whether that is finished work or an abandoned attempt, say which in the commit message,
      and land it or discard it before writing anything new - do not write a second probe beside it.
      Then the work itself, unchanged from last stretch: in
      `simulation/premise_population.settled_book_ceiling`, `bytes_per_record` ADDS
      `settlement_build` (363.5 B) to `run_output_serialization` (411.4 B), and the docstring says
      why - the serialization baseline is taken AFTER `run_settlement` returns, while the settlement
      working set is still held, so a single-process build-then-serialize pays both. Change the path
      so one working set is paid once (stream records out and free them as they are written, or
      split build from serialize across the process boundary), then RE-RUN the probe and let the
      ceiling fall out of the new measurement. Do not edit the number, and do not touch the
      1/sqrt(n) curve or the null: the bound must stay derived from measured floors so it remains an
      upper bound.
    why: >-
      The bound on this project's central claim is set by our own serializer. The page reports
      `the_observed_effect_is_attainable: false` against 632 accounts while the detection floor needs
      about 806, and the field's own `what_binds` says the constraint is this machine's memory
      budget rather than the world - so a reader takes our RSS accounting for a statement about
      whether per-customer inference is detectable at all. At an 8.58 GB budget and 17,520 records
      per customer-year, removing the double count moves the bound to roughly 1,190 accounts by
      arithmetic alone. THIS IS NOT GROWING A BOOK UNTIL THE ARM WINS - R12 forbids it, the feed
      says so in `it_is_a_diagnostic`, and it stays forbidden; the arm reading "cannot tell" again
      afterwards is a complete result and must be published as one. Finished when the ceiling is
      re-derived from a re-run probe and the published bound's binding constraint is the world or
      the method rather than our own output path.

