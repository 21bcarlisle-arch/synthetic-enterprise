      The live page already has the column and no data to put in it, and that is worse than not
      having shipped it. Observed by fetching, not by reading the file: `https://poesys.net/capabilities/`
      serves the household cell renderer (`householdCell(row)`, the copy "HOUSEHOLD CELL, and it is
      a cell rather than a section on purpose", and the fallback `"no household side for this arm">&mdash;`),
      while `https://poesys.net/data/value_arms.json` has NO `household` key, so every cell is a
      dash. The cause is a commit boundary, not a defect: `tools/generate_value_arms_data.py` in the
      working tree emits the full block and `git show HEAD:tools/generate_value_arms_data.py` emits
      none of it; the file is dirty-unstaged and its test `tests/tools/test_generate_value_arms_data.py`
      (+195) is staged. Land those two paths together in ONE commit — consumer and supplier in one
      commit, because the write-time gate reads the commit message and a split lands a test with no
      subject. Hold two things while you do it. Keep `tests/company/test_household_share_is_not_yet_a_target.py`
      green: under R12 this figure is a diagnostic and publishing it must not convert it into
      something to steer toward. And state ON THE PAGE what the household number does not cover —
      it is money only, carbon is designed and uninstrumented (`E5`), and time has never appeared in
      this project at all (`C31`) — because the mission names three currencies and this column
      answers one. R11 governs done: fetch the live page and quote the rendered household figure for
      the control arm.
    why: >-
      This is the director's own mission sentence made checkable — value is created and THEN shared,
      so every decision has two sides — and the second side is currently a row of dashes on a live
      page, which announces the claim and fails to support it. It is also the sharpest available
      answer to the profit-maximiser problem he named, and the numbers are already computed and
      unflattering: on the settled-realised clock, households on the flat-rules arm kept GBP 53,760
      LESS than they would have paid on the published default tariff at their own metered volumes,
      the per-customer arm GBP 57,439 less, and the flat-at-the-same-level arm GBP 64,572 less, over
