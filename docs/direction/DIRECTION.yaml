thesis_read: >-
  The thesis has a reading again and it is a loss, and this time the loss is real rather than
  plumbing. The A/B was re-run on the repaired chain: the control arm reproduces bit-identically
  (net GBP 1,145,681.029513 in both runs), so the arm is the only thing that changed. Every
  mechanism fix worked exactly as designed -- `clamped_by_the_price_cap` falls 27 to 0, so the
  cap now binds inside the search instead of landing afterwards; `ceiling_bound` fires 20 times
  where it was structurally unable to fire at all; declines rise 3 to 10 as the arm refuses
  renewals it cannot lawfully price; and the median chosen margin more than halves, GBP 100.50 to
  GBP 39.75/MWh. And the loss barely moved: net -GBP 91,742 and enterprise value -GBP 110,731 over
  ten years, against -GBP 118,252 before, a 6.4% improvement. The arm halved its price and lost the
  same money, which retires over-pricing as the mechanism and means the honest sentence today is
  that the company's per-customer arm loses to its own flat rule on realised P&L. Two things
  qualify that and both are work rather than caveats. First, of 69 renewals seen the arm chooses
  freely on 21: 36 land on a bound, 20 at the ceiling and 16 at the floor, plus 2 extrapolation-
  bound. On a capped domestic book the regulator and the floor make most of the decisions, and that
  is a finding about what a per-customer arm can even do here. Second -- and this is the centre --
  the belief it maximises against carries no per-account lifetime information at all. Recovering
  the hazard from EP1's own published output, all 33 graded accounts return the identical 0.05 and
  a flat 20-year tenure: one distinct value across the whole graded population. So whatever ranking
  that CLV produced came entirely from the margin term, and the lifetime half of "lifetime value"
  is a constant. The hazard is `0.05 + 0.03 x bill_shock_count`, a step function of one integer
  that is zero for 42% of all renewal decisions in the run. The thesis says the advantage must come
  from INFERENCE; on the dimension the whole thesis is named after, there is currently no inference
  to have an advantage from. That also corrects me: I sent the last stretch at a five-fold
  inflation in the lifetime term, and the term is not inflated -- believed hazard 0.05 against a
  realised 0.053 in the bucket every graded account sits in, and portfolio believed tenure 11.74
  years against a realised implied 13.82. It runs SHORT, and the defect is absent dispersion, not
  wrong level. The 2.529 gap is also partly the yardstick: the graded population is selected on the
  outcome, like-for-like resi excluded-over-graded is 2.96x, and a point-in-time-fair divisor gives
  2.193 rather than 2.529. Finally, the headline loss cannot yet be attributed to anything: the arm
  gives up GBP 123,006 of gross margin on 3 extra churns, which is GBP 41,000 a churn against
  domestic accounts averaging ~GBP 420 of whole-life margin, so it cannot be three domestic
  customers -- and the instrument built to say which accounts it was reports
  `largest_single_difference_gbp: 0.0` because every per-account figure in it is null and the
  aggregation sums nulls to zero. Nothing went backwards. The project is materially more honest
  than it was three hours ago and commercially exactly where it was. On the previous direction the
  record is good: all four items were worked, the Lane 0 progress signal and the A/B re-run both
  landed, EP1 was advanced by a worker that overturned my diagnosis rather than executing it, and
  EP13 moved twice without reaching the rung I named. This is the first orientation where the
  delivery lane's own progress signal can be trusted, because `record_landing` now binds real paths
  to each claim.
