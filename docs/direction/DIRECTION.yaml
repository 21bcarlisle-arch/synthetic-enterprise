thesis_read: >-
  **Two of the four focus items are finished and disappear below; one was WRONG in its central
  claim and dissolves; and the director issued canon this stretch that reframes the whole month.**
  Taking them in that order. **Finished.** The estimator question was settled and settled the right
  way: route (b) was chosen, and `inference_claim` now says on the page that *"the company's acted
  belief is this BOOK's departure hazard and the published band is the GB MARKET's switching rate,
  which are two different quantities"*, with `accuracy_reading_available: false` and the reason
  carried as a machine-readable companion beside the prose. The accuracy clause was withdrawn
  rather than defended. Equally, the drop-out is now characterised: of 120 priced decisions and 86
  scored, **join failures are ZERO**, 2 are a gap in our own sourced tariff series, and **32 are
  eligibility** — the world never billed under the price that was chosen, so no outcome exists to
  rank them against at any book size. By-design and by-us are separated and counted, and the
  conclusion is stated plainly: this sample cannot be widened by fixing our own code. **Wrong, and
  it was mine.** I opened last direction with fifty departures that supposedly had *"no cause, no
  roll and no probability anywhere"* and read it as a fidelity break biased in our favour. They have
  all three. `run_output_latest.json` carries a `svt_departures` list of **exactly 50** — the
  arithmetic 82 churned accounts minus 32 churn events lands on it precisely — with cause
  `svt_inertia`, its hazard and its roll, added deliberately by C1b on 2026-08-30. I compared two
  keys without asking what each one counted, which is the rule I had invoked by name three
  paragraphs earlier in the same file. It was not a break; it was a mechanism landing whose
  recorder was blind to the route it created. **And what that leaves is far bigger than what I
  thought I had.** The director's `DIRECTOR_CANON_WORLD_VALIDATION_LADDER` says the world is
  generated bottom-up and checked top-down, that aggregates emerge from individuals and published
  figures are tests rather than dials, and that **"the one move that is always wrong" is clamping
  an aggregate to pass a check.** He then names the diagnosis I did not consider: *"for a month the
  company has been asked whether it can predict the world, and every answer has come back 'we
  cannot tell'… a world validated top-down contains no per-customer signal… the company kept
  failing to find inference advantage because there was structurally nothing to infer."* That
  indicts our churn anchor by name, and the code agrees with him in its own words —
  `departure_risks.py` says `level_anchor` *"gives the family units by calibrating it onto the
  published departure level"* and, forty lines on, **"THE YEAR ANCHOR IS NOW OVER-FITTED."** So the
  honest read of this stretch is not that the project went backwards. It is that we spent the month
  building an increasingly rigorous instrument for detecting a signal, published an honest refusal
  when it found none, and have now been handed a serious argument that **the world may not contain
  the signal to begin with** — which no amount of tightening the instrument could ever have
  revealed, and which every "cannot tell" we published is equally consistent with.
