thesis_read: >-
  Three hours, 8 commits, four substantive, and the shape of the project changed underneath the
  previous direction rather than following it. First, correct the brief: it reports that NONE of the
  previous focus was drawn. That is false, and the reason it is false is already written down --
  `docs/staging/WORKER_FINDING_THE_STEER_EFFECTIVENESS_CONTROL_CANNOT_SEE_LANE_ZERO_AT_ALL_2026-08-27.md`.
  Three of four items were worked and landed: S1 landed at `bca9bb3af` and its weights were re-derived
  from published evidence at `898d78239` (Ofgem/BMG 2024, n=3,235, savings-importance 41% overall and
  35-44% across every reported subgroup); the A/B document's 2019 forward pointer landed at `bafa625d1`
  along with `--level-arm` as a committed mode with 9 mutation-proven tests, which turned the
  level-vs-selection split from an ad-hoc invocation into something a commit can reproduce; and
  `CAN_THE_COMPANY_LEARN_PRICE_SENSITIVITY.md` landed at `88f5dcc61` with the predicted answer -- the
  declared channel bands `get_churn_estimate`, which is the company's own belief and not an observation
  of behaviour, so it carries none of S1's signal. Only EP1 went unworked, for the seventh time, and I
  now think the reason is mine and not the lever's: it was ranked last every time, and Lane 0 items are
  worked in my order until the tick runs out. Second, and this is the real event of the stretch: the
  director spoke twice at 16:03Z and 16:36Z and moved the work himself. He ruled that the marginals come
  from published evidence and are to be cited; that the Ofgem subgroup range is a BETWEEN-group statistic
  and elasticity is close to orthogonal to observables, so genuine within-segment variance must be drawn;
  that whether switching keys on pounds saved or percent saved must be ESTABLISHED and the world fixed if
  it differs; and that a trait claiming discoverability with no observable must either be given a channel
  or marked hidden, without waiting for him. All four are being answered right now -- 188 uncommitted
  lines across the three simulation files turn `price_sensitivity_for_customer` into a continuous
  `price_elasticity_for_customer` (`PRICE_ELASTICITY_SEGMENT_R2 = 0.02`, chosen deliberately against our
  own thesis) and re-scale the price response to the household's own billed pounds rather than one
  market-average bill; `channel_pref` is flipped to hidden with the reason written; and a new untracked
  control, `tests/simulation/test_discoverability_claims_are_enforced.py`, makes the curriculum's own
  discoverability claim falsifiable. That is the best world-side work this project has done and it is a
  genuine raise of the ceiling the director named. **And none of it has been scored, because both
  instruments that would score it are broken right now.** The three-arm A/B on the S1 world was launched
  correctly at 15:08:25Z under `setsid` with a START/END wrapper, and it was killed without a traceback
  at 15:12:53Z, 4m28s in, still inside the first arm; there is no `END rc=` line and no artefact, and
  **2h12m passed before this orientation noticed**, with the Lane 0 file still parked in `in_progress/`
  saying the run is in flight. The alarm about it fired and is sitting untracked in the staging root,
  drawn by nobody. Meanwhile the noise-floor measurement that would tell us whether the -£1,388.80
  selection figure is signal at all is running two seeds as I write, and it patches
  `pdraw.price_sensitivity_for_customer` -- a symbol the churn decision stopped calling about nine
  minutes before those processes started. `price_elasticity_for_customer` calls `_draw_curriculum_axis`
  directly and never routes through the old name, so the patch reaches nothing, both seeds will return
  identical nets, and that identity will read as a tight instrument when it is the signature of a dead
  knob. This is the catalogued failure exactly: bit-for-bit reproduction across a world change is
  BLINDNESS, not stability. So the honest read is that nothing went backwards and the world got
  materially richer, but the project has started widening the world faster than it can measure the
  effect, and measurement debt is now the binding constraint rather than world thinness. One correction
  I owe against my own predecessors, including me: two directions have asserted that the CLV "cannot
  tell its accounts apart", citing 33 of 33 accounts recovering exactly 0.05. The ledger's own
  `hazard_calibration` block, which nobody read, shows seven distinct believed hazards across 401
  decisions -- and in the 0.05 bucket, 263 decisions with 14 churns, the belief is nearly right
  (believed over realised 0.939) while the 0.08 bucket is 7.6x too pessimistic. The collapse is a
  property of the 33-account graded slice, which is selected on the outcome and whose excluded
  counterpart is 2.96x richer, not of the estimator. That was inferred and stated as observed, which is
  the R9 line.
