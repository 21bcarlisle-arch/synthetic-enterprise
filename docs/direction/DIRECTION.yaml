      (L0->L1, block_reason, file_scope). First run ps for a rival surgical_land or worker on these paths.
      Then build HEAD-plus-these-hunks with tools/isolate_hunks.py, because other lanes have edits in the
      same files. Run both test files plus the partition control that the build was asked for: on a real
      book, both the N and N-1 branches are reachable. Land through surgical_land --content, record the
      level through the level gate, and bind the commit with delivery_lane --landed build-the-supplier-dd-stopping-rule.
      Then release the row in .seat_work_in_hand.json (seat_work_in_hand.release) as well. If the domain_constant_origins
      entry for DD_STOP_THRESHOLD_CONSECUTIVE_RETURNS or the partition control is missing, write it before
      landing.
    why: >-
      Finished work in the shared tree with a dead holder is the loss shape this project has paid for repeatedly.
      Until the rule lands, every household whose DD bounces every month stays on DD for life in every run.
      That is fidelity on the side B8 and the payment-history work both read. DONE when PB8 at L1 is on
      origin/main with its controls, both claim stores are clear, and git status no longer shows these
      paths modified. The L2 leg is NOT part of this item: arrears and get_payment_method following the
      mandate waits on the second focus item.
  - id: one-payment-method-home-in-the-world
    lane: W2_customer_generator
    what: >-
      Give a household's payment method one home in the world. Today background/live_payment_triad.LivePaymentTriad._method_for
      draws it through simulation.payment_behaviour_source.generate_payment_method. SimInterface.get_payment_method
      draws it separately through simulation.household_segments.payment_channel_for_customer. The two agree
      on 153 of 300 households. FIRST, before changing anything, establish which of the two draws the world's
      own churn response and arrears_engine.payment_method follow, and write that down in the finding
      SEAT_FINDING_THE_LEDGER_PAYS_BY_ONE_METHOD_DRAW_AND_THE_SEAM_REPORTS_ANOTHER_2026-10-03.md. Then make
      one draw canonical, keeping the four-way vocabulary (DD / standing order / card / prepayment) and
      mapping it to the seam's three. Make every reader derive from it, including the triad, the seam and
      the arrears engine. One control: over a real book, the ledger's paying method equals the seam's for
      every household, and the mutation that restores the second stream reds it. Re-grade W2_payment_channel_dd_consistency_invariant
      against that control, and record the world change as a fidelity change with its new digest. Leave
      a staging note for the console seat that names the change, so B8's per-method slopes are re-read
      on the unified method. Do not touch company/pricing/discovered_price_sensitivity.py or /var/tmp/se-b8.
    why: >-
      The console seat is building per-method churn slopes now, the oracles say churn belief is the large
      lever, and half the book's method is two different facts. A slope learned on the seam's method from
      events produced by the triad's method is keyed to noise, and it would read as an inference failure
      when it is a fidelity one. The world changes for fidelity, decided blind to results. This is also
      the prerequisite for PB8 L2: get_payment_method cannot follow a cancelled mandate while it has two
      sources. DONE when one draw serves every reader, the agreement control is green and mutation-proven,
      the atom's level is re-graded on it, and the console seat has the note.
  - id: the-company-ledger-posts-the-months-bill
    lane: W2_customer_generator
    what: >-
      Fix simulation/run_phase2b.py's Phase NH block so that _payment_triad.record_period posts each customer-month's
      bill as the sum of that customer's settlement records in the month, dated at the month's due date.
      Today it posts the first record's revenue_gbp. Build the one leg named in SEAT_FINDING_THE_COMPANY_LEDGER_BILLS_ONE_SETTLEMENT_RECORD_A_MONTH_NOT_THE_MONTHS_BILL_2026-10-03.md:
      for a run, the ledger's billed total equals the run's own billed revenue for the same accounts, to
      the pound. Check whether arrears_state_from_collections and the coupled-triad gap measures depend
      on absolute amounts, and say so in the finding. Before landing, print the renewal stock term and
      the default-belief comparison in docs/institutional/knowledge_map.md at real inputs before and after,
      and record both.
    why: >-
      A median posted bill of GBP 0.023 makes every absolute figure the company reads from its own ledger
      near zero. That includes the stock term on money already owed, which the renewal price added this
      week. A supplier that cannot see what it is owed cannot price on it. The ratio readings survived,
      which is why the defect hid. DONE when the to-the-pound control is green and mutation-proven, the
      before and after readings are recorded, and the finding is archived with what changed.
  - id: the-renewal-price-honours-the-prepayment-ruling-at-default
    lane: B_commercial
    what: >-
      Make tests/company/pricing/test_the_price_rests_only_on_observables_a_supplier_may_use.py green at
      HEAD, and make the pre-commit gate select it whenever company/pricing/value_based_renewal.py changes.
      The fix goes in tools/pre_commit_test_gate.py's selection, or as a stem alias, not by renaming the
      control. My decision on the open question in SEAT_FINDING_THE_RENEWAL_PRICE_NOW_CHARGES_A_CLEAN_PREPAYMENT_HOUSEHOLD_MORE_THAN_A_CLEAN_DIRECT_DEBIT_ONE_2026-10-03.md
      is as follows. The ruling forbids shifting cost ONTO prepayment. The stock term's per-method live
      row moves a prepayment debtor's price down, not up, so it may stay: the control declares billed_last_year_gbp,
      unpaid_bills_by_age and default_belief_rate with that argument. The control then changes to assert
      the property, that no clean account is priced higher for its payment method, at real inputs on both
      switch settings. It no longer asserts that the word does not appear. Remove the clean-account shift
      on the segment_table path now, so it cannot recur while the switch is off. Flip DecisionPolicy.renewal_default_belief
      to own_book ONLY after the console seat's B8 landing from /var/tmp/se-b8 is on origin/main. If it
      is not, leave the flip and say so in the finding.
    why: >-
      A director ruling is broken on the default path of every run, and the control that guards it has
      been red since e0370bf94 without any gate noticing. The flip waits so that B8's B0-B5 grading is
      not confounded mid-experiment. Reversible: the switch and the declaration are one commit each. DONE
      when the control is green at HEAD and asserts the property, the gate selects it for value_based_renewal.py,
      a clean prepayment household is priced the same as a clean DD one on both switch settings, and either
      the default is own_book or the finding names the B8 landing that will release the flip.
