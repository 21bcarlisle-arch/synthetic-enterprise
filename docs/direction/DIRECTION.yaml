focus:
  - id: the-worlds-departure-rate-against-the-published-year
    lane: W2_customer_generator
    what: >-
      Measure the world's own departure rate per calendar year, 2016-2025, over ALL domestic electricity
      accounts in the book. This is the DESNZ QEP table 2.7.1 denominator: accounts that changed supplier
      in the year over accounts held, not departures per renewal decision. Use a real run's lifecycle events,
      such as the run_output JSON that tools.run_annual_report is writing now, or the probe's own world.
      Put it beside the published 15.82 / 18.20 / 19.06 / 20.82 / 20.21 / 15.57 / 3.06 / 6.33 / 9.03 /
      10.40% with the binomial bound each year's account count earns. BEFORE running, write a prediction
      into a new finding, docs/staging/SEAT_FINDING_THE_WORLDS_DEPARTURE_RATE_BY_YEAR_AGAINST_DESNZ_QEP_2_7_1_2026-10-03.md.
      The prediction names which years the world will be above the record and whether that matches the
      sign of the console seat's belief-level error by year (believed minus true P(stay) -0.21 2017, -0.33
      2018, +0.24 2019, +0.64 2020, +0.29 2021, +0.44/+0.51 2024/25). Then run it and grade the prediction
      in the same file. Do not change the world, the commons artefact gb_domestic_switching_rate.json or
      any company/ belief in this item. Leave a short note in docs/staging/ for the console seat that names
      the result and says whether its level calibration is fitting truth or fitting a fidelity defect.
    why: >-
      The console seat's next build calibrates the company's churn belief to the world's P(stay). If the
      world departs at a multiple of the published rate in the years where the belief "under-predicts leaving",
      the calibration buys an advantage from a fidelity defect. The thesis forbids exactly that, and the
      book would show it as a gain. The knowledge map has said the departure level is off since 2026-09-07,
      and nothing has re-asked it since the belief became the thing being tuned. DONE when the finding
      holds the pre-registered prediction, the per-year table with bounds, and the graded verdict. The console
      seat has the note. If the world is outside the record, the finding names the coupled correction (commons
      record, re-capture, verdict blocks) as the next item with its cost priced. That cost includes the
      roughly 25 value-arm controls that a level re-fit reds.
  - id: the-renewal-price-honours-the-prepayment-ruling-at-default
    lane: B_commercial
    what: >-
      Make both red tests in tests/company/pricing/test_the_price_rests_only_on_observables_a_supplier_may_use.py
      green at HEAD, and make tools/pre_commit_test_gate.py select that file whenever company/pricing/value_based_renewal.py
      or company/pricing/discovered_price_sensitivity.py changes. Do it with a selection alias, not by renaming
      the control. My ruling on the open question stands. The ruling forbids shifting cost ONTO prepayment,
      so declare billed_last_year_gbp, unpaid_bills_by_age, default_belief_rate and payment_method in the
      control, each with its observable argument. Then replace the word-ban test with the property: no
      CLEAN account is priced higher for its payment method. Check it at real inputs on both renewal_default_belief
      settings, with B8's discovered per-method sensitivity on and off. Remove any clean-account method
      shift on the segment_table path. The flip of DecisionPolicy.renewal_default_belief to own_book had
      "B8 on origin" as its release condition. That condition is now met (4e17d1247), so re-ask it. Flip
      only once the console seat's four probe_capped_*.json files exist in /var/tmp/se-probe-out and its
      se-decline landing is on origin/main. Until then, leave the default alone and say so in SEAT_FINDING_THE_RENEWAL_PRICE_NOW_CHARGES_A_CLEAN_PREPAYMENT_HOUSEHOLD_MORE_THAN_A_CLEAN_DIRECT_DEBIT_ONE_2026-10-03.md.
    why: >-
      A director ruling has been unguarded on the default path since e0370bf94. B8 then put payment_method
      into pricing, a second route to the same cost-shift that the word-ban control can only refuse wholesale.
      The property survives per-method pricing, which the director asked for, and still refuses the shift
      he ruled out. Last stretch this was never drawn. DONE when both tests are green at HEAD and assert
      the property, the gate selects them for both pricing modules, a clean prepayment household prices
      equal to a clean DD one in all four settings, and the finding records either the flip or the named
      landing still holding it.
  - id: one-payment-method-home-in-the-world
    lane: W2_customer_generator
    what: >-
      Finish the one-payment-home change. It is landing now through surgical_land pid 121436 from the shared
      tree. Do NOT start a second landing while that pid lives; wait on it with tools/wait_for --pid. If
      it landed, confirm with git merge-base --is-ancestor against origin/main. If it refused, land the same
      hunks with tools/isolate_hunks.py and surgical_land --content. Then check three things are on origin,
      and do whichever is missing. First, the agreement control: the ledger's paying method equals the seam's
      for every household on a real book, and the mutation that restores the second draw reds it. Second,
      the re-grade of W2_payment_channel_dd_consistency_invariant against that control, through the level
      gate. Third, the world-digest note recording it as a fidelity change. Then leave a staging note for
      the console seat saying that B8's per-method readings were taken on the two-home world and need one
      re-read on the unified method.
    why: >-
      Half the book's paying method was two different facts. Every per-method reading B8 and the bad-debt
      work made was keyed to the seam's draw while the ledger paid by the triad's. The change is built,
      and the remaining risk is that it lands without its control or level re-grade. Then the atom's L2
      keeps claiming an invariant the world did not hold. DONE when the change, its mutation-proven control
      and the re-graded level are all on origin/main, and the console seat has the note.
  - id: base-advance-merges-select-by-their-combined-diff
    lane: H_harness
    what: >-
      First measure, from the gate receipts and docs/observability/, the gate wall-time spent this stretch
      on surgical_land --merge origin/main commits whose combined diff is empty (23 of 38 commits). Record
      the figure in a finding. Then change tools/pre_commit_test_gate.py so that, for a merge commit, test
      selection keys on the merge's COMBINED diff: paths whose merged content differs from every parent.
      Today it keys on everything either side touched. Every fixed structural gate still runs, so this is
      selection and not a bypass. Add one control: a merge with a non-empty combined diff still selects
      its subject's tests, and a merge with an empty combined diff selects none beyond the fixed gates.
      Mutation-prove both legs, and run it in a linked worktree and in the shared tree before landing.
    why: >-
      My own release condition fired: work-carrying commits fell to 15 of 38, under half, and five base-advancing
      surgical_land runs were live at orientation. Each empty merge re-runs a selection over code that was
      already gated on both parents, and that queue is what makes the other lanes' landings lose the race
      to origin and merge again. Hook bypass is a wall, so the cost must come out of selection. DONE when
      the measured cost is on file, the combined-diff selection is landed with its two-leg mutation-proven
      control, and the next brief's no-work share can be read against that figure.
