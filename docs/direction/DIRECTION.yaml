- id: the-published-run-fits-under-githubs-file-limit-before-monday
  what: 'Before the weekly window opens (Mon 2026-10-12 04:00 London), make the publish commit a docs/reports/run_output_latest.json
    that GitHub will accept. Follow SEAT_FINDING_THE_PUBLISHED_RUN_OUTGREW_GITHUBS_FILE_LIMIT_2026-10-10.md.
    (1) In tools/run_annual_report and in the copy step that sim_runner / background/process_run_complete.py
    takes, write the committed run as compact JSON (separators=('','','':'')): 91.5 MB on the 123.5 MB
    run, and every reader uses json.load. (2) In process_run_complete.git_commit_push, refuse to stage
    any file over GitHub''s 100 MiB push limit, with a refusal that names the file, its size and the limit,
    and put that refusal on the seat''s surface (NTFY / action_needed), not just the journal. (3) Show
    that the refusal can fire: one control that a 101 MiB fixture is refused, and one that the compacted
    real run is admitted. (4) In the finding, record compact JSON as the stopgap (8% headroom on a book
    that just grew 4.6x), and file the durable choice as a proposal: gzip with one reader helper, or a
    reduced published input carrying only what the site generators read.'
  why: Every supplier figure the director reads (DD reviews now -1.8% where they were +32.8%, and bills
    about 20% lower) reaches the site only through this push, and at 123.5 MB the first publish after
    the window opens is refused, so the site would keep quoting the double-levied 10-05 run for another
    week. Done means the run sim_runner would publish is under the limit on disk, the size refusal is
    proven able to fire, and the durable choice is filed. It is NOT done by pushing a run by hand mid-week,
    which overrides the director's weekly window.
