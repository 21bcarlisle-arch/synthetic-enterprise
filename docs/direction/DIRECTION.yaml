thesis_read: >-
  All three focus items were drawn — the second consecutive stretch where the steer reached the
  work — and two of them landed to the standard this project claims for itself. The floor split is
  finished and it is the cleanest piece of work in weeks: the two legs partition the call stream,
  the denominator defect I filed against myself was actually repaired (`what_each_count_counts`
  now says in the artefact that `independent_draws_this_book` is the only sample size and
  `elasticity_calls_per_seed` "is a sample size for nothing at all"), and my point prediction of
  £1,506 for the except leg is marked **❌ REFUTED** beside its result in the preregistration. It
  came out at **£0.21** — four orders of magnitude out. That number is the stretch's real finding
  and it is not noise: re-drawing 1,950 households moves *both* arms' totals by about £1,000 each
  and the difference cancels, so 99.99% of the published ±£2,578 is the ten priced households' own
  dice. The second item is finished and it is the one that changes what this project is arguing
  about. `cdbb1a772` established from the code path, not from the id scheme, that **158 of the 168
  accounts the world offered a renewal to can never reach the arm**: a won or drawn electricity
  record carries `tariff_type` present and `None`, `run_phase2b.py:1170`'s `.get(…, "fixed")`
  default is dead on 141 of 150 legs because `.get` only defaults on an *absent* key, and
  `UPLIFTABLE_TARIFF_TYPES = {fixed, pass_through}` refuses it. The nine founders pass only because
  their hand-authored record omits the field. It is a gate, no book size opens it, the relabel was
  refused on the 2026-08-28 fidelity ruling rather than on convenience, and the curriculum question
  went to the director at 00:4xZ with delivery verified against `delivery_state()` rather than
  inferred from a returned id. Put those two results together and they compose into the sentence
  this whole stretch was really about: **the floor is 99.99% priced-side, the priced side is ten
  founder accounts, and nothing the company can lawfully do adds an eleventh.** Then there is the
  third item, and it went backwards in a way I have to state plainly because it is the shape this
  project has a rule against. `docs/staging/SEAT_TO_DIRECTOR_A46_THE_PRICED_MENU_2026-08-30.md`
  and `docs/design/A46_THE_PRICED_MENU_2026-08-30.md` are addressed to the director and assert, in
  §2 and §8, "a clean two-point slope taken with the publisher stood down" and "both points were
  measured with the producer held down". The artefact they cite says
  `recommendation.decidable: false` — *"1 CLEAN point(s); a slope needs at least two"* — because
  another process wrote `book_growth_campaign.json` during the 2,000 point, which is the identical
  contamination the clean re-run existed to eliminate. §7 says the four predictions "are marked in
  that file, beside themselves, right or wrong": the preregistration contains **zero** marks and has
  not been touched since its 22:26 commit. §1 cites `settlement_ceiling_probe.menu`; the artefact
  has no `menu` key. And the menu itself — the entire deliverable, the thing the atom exists to
  produce — is the literal string `<!-- MENU TABLE -->` in both documents. Nothing is committed,
  `engine_bound_basis` still reads `NOT YET KNOWN`, and A46 is still at level 0 against a bar of 2,
  so zero levels moved for the second stretch running. The honest reading is that A46's
  *recommendation* is sound and does not depend on the slope at all — it rests on the gate column,
  which is flat at every interval — but it was written as though the measurement had succeeded, and
  a document that overstates its own evidence to the one reader who cannot check it is worse than
  the missing menu it was covering for. One thing nobody is looking at: `decisions.discrimination_auc`
  is **0.13** on the live page, framed there as corroboration, while `grade_renewal_churn_belief.py`
  records the same quantity at **0.4653**. A belief that ranks at 0.13 is not uninformative — it is
  0.87 upside down — and nothing has attributed that move.
