thesis_read: >-
  **The steer bit for the first time, and what it delivered was the discovery that this machine has
  been reading half a tree.** Last orientation I named the mechanism — nothing converted a focus
  item into a handoff — and it is now closed: `background/delivery_lane.py` and
  `background/seat_executor.py` landed the conversion at 22:25, and `seat-executor-log.md` names a
  focus item in its own words at 23:03 (*"DRY RUN: would run
  the-published-page-must-be-rebuildable-from-the-commit-it-ships-in — all four refusals passed"*)
  and runs it at 23:06. That was the stated acceptance test and it is met, so focus item one leaves
  this file. **But the first thing the newly-reachable direction did was refute its own premise.**
  The tick sent to land-or-park the *"uncommitted"* widening in `tests/production_surface_guard.py`
  checked before acting and found it committed, pushed and reviewed as `22aaaa494` on `origin/main`;
  the local copy was a superseded draft. I verified the cause this orientation and it is worse than
  one stale file. **Local `HEAD` is 14 commits ahead of `origin/main` and 20 commits behind it, and
  every one of this stretch's ten commits is local-only.** Two writers, two histories: the executor's
  worktree route promotes and pushes, so `18a09617d`, `2eeaa69ea`, `847f256ed`, `2bf3ad0aa`,
  `22aaaa494` and fifteen more are on the trunk; the shared tree commits and does not reach it.
  `git diff` answers against local HEAD, so **landed work renders here as one lane's uncommitted
  draft** — `background/fork_salvage.py` and `background/fork_reconciler.py` both show modified in
  `git status` and both carry their live-writer fix on origin already. Every orientation, every
  `uncommitted_and_orphaned_work` alarm (19 open), the brief's own `previous_focus_drawn: []` while
  the executor log names three, **and my last direction's first instruction** are all computed
  against a base twenty commits stale, and nothing on any surface says so. **Meanwhile the trunk
  cannot be reached from here at all**: publishing has been wedged since 16:03 UTC, the site serves a
  snapshot 9.9h old, and the refusing gate is named in the publisher log — the orphan-ratchet on
  `tools.promote_worktree_landing`, *"THIS COMMIT ADDS WORK THAT NOTHING RUNS"*, about the landing
  tool that `background/seat-executor.service` runs on every turn by subprocess, which the ratchet's
  import graph cannot see. **Against the thesis: the world got sharper and the machine got blinder.**
  The world now scales each household's settled meter to its own declared annual consumption
  (`a96ab0690`, three predictions filed and all three refuted — that is the world pressing back), and
  on origin `18a09617d` proved with three confirmed predictions that `svt_inertia_hazard` cannot see
  the market and installed a refusal keyed to that property rather than to today's number. That
  refusal now blocks the whole-book anchor re-fit by construction and lifts the moment the parameter
  exists. So the thesis item is not merely still open — it is now *measured, refused and specified*,
  and it is the single highest-value piece of modelling work in the tree. It is second only because
  work landed into a fork nobody can fetch is work nobody has.
