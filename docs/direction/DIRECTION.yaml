- id: the-book-is-built-from-origin-and-a-waiting-book-keeps-its-place
  what: Get one book built, then remove the reason none has been built for 35 hours. Its premise is met
    now; nothing in this item waits on a date. (1) The instance. No claim in docs/observability/.seat_work_in_hand.json
    owns the uncommitted C32 hunks in company/billing/collections_journey.py and company/billing/winter_moratorium.py
    (mtime 20:42Z 21 Nov). Run their tests (tests/company/billing/test_a_household_already_on_prepayment_is_not_offered_one.py,
    tests/company/billing/test_the_enforcement_table.py). If they pass, land those hunks only, with tools/isolate_hunks.py
    and surgical_land --content. If they fail, finish them and then land. Never checkout or stash. Leave
    saas/reporting/annual_report.py alone if a live claude pid's /proc/<pid>/cwd is the shared tree and
    its surgical_land names that file. (2) The cause. Code admission in background/sim_runner.py (code_admission,
    about line 389) refuses whenever any imported file on the shared tree differs from origin, and the
    shared tree is almost never clean. The landings-first deferral (background/resource_headroom.py, about
    line 963) yields to every pending commit gate, and gates run continuously. Change sim_runner so the
    book is built from a detached worktree at the origin commit it admits, by sim-runner itself and not
    by a second builder, so shared-tree edits cannot refuse it. Also stop a new landing from overtaking
    a book that is owed (none in 24h) once the book has queued. Whether the restarts re-queue it is the
    hypothesis in §2 of SEAT_FINDING_THE_BOOK_THE_FIVE_GRADES_WAIT_ON_WOULD_HAVE_DROPPED_THREE_OF_THEIR_RECORDS_AND_IS_STARVED_2026-11-21.md.
    Record it as confirmed or refuted from the journal. (3) When the book publishes, confirm that company_debt_recovery,
    retention_holdout_by_desk_year, riding_leg_answers and won_switches_not_supplied are non-None in its
    run_output, and name any that are missing. Do not grade here; the queued continuations do that.
  why: One artefact holds up six supplier grades and the thesis test. It has failed to appear for two
    stretches because each fix took one refusal and the next refusal took its place. Done means three
    things. A run_output_<sha>_<ts>.json exists under docs/reports/, its sha descends from 6f87ccb38.
    sim-runner builds from an origin worktree, so an in-place edit on the shared tree can no longer defer
    it, and a mutation that reverts this goes red. And the starved-book BLOCKING finding is closed through
    work_items --done against that commit.
