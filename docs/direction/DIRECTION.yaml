thesis_read: >-
  **The severance is repaired and it worked inside the hour, which makes this the first orientation
  in eight where the direction was not a list one writer read top-down.** `53c50a64f` writes the
  handoff at derivation — a focus item the executor declines is now PROMOTED to a continuation a
  later tick can claim — and `3fb8f960d` closed the leg's own gap after the mutation stopped one
  assertion short of the claim it documented. The evidence is not the commit, it is the log:
  `docs/observability/seat-executor-log.md` reads **RUNNING the-shock-series-is-still-one-mean-over-
  a-mixed-population** at 15:36 and **RUNNING a-focus-item-is-structurally-unreachable-by-the-
  executor** at 17:06, both FINISHED rc=0, ending thirty-one consecutive stand-downs. Two of four
  focus items got real work this stretch against one of four for the eight before it, and five
  substantive commits against two. **That is the whole of the improvement and the rest of this
  reading is worse.** The item the new second lane was pointed at is graded done by its own commit
  and is not done on the surface a reader is served: `2118135e5` closed with *"no mean spanning both
  populations is published on this surface without its two component means beside it"*, and
  `git show origin/main:site/data/dashboard.json` still has **no `bill_shock_by_population` on the
  annual series and `avg_bill_shock_pct: 0.46`** — one fraction, one mean, both populations. The
  split is sitting **staged in the index of this tree and in no commit**. The reason nothing was red
  is the sharper half: **not one control for either split reads `site/data/dashboard.json`** — every
  one of them takes `extract_financial` as its subject and feeds it synthetic fixtures, so the
  artefact can lack the split entirely and the suite is green. And a defect nobody has filed is live
  in the report on origin right now: `saas/reporting/annual_report.py` renders **the same field
  a hundredfold apart in two tables of one document** — 2022 is `57.5%` under *Bill Shock Analysis*
  at line 9049 and `0.58%` under *Customer Service Quality* at line 7195 — then compares the
  fraction against a band it attributes to Ofgem, so the RAG reads **RED in all ten years and the
  HIGH flag fires in all ten**, a verdict with no reachable other branch. Against the thesis: the
  delivery machine is materially better and the thesis is exactly where it was. **There is still no
  whole-book anchor and therefore still no baseline to beat.** `/tmp/svtcap/capture.log` has not been
  written since 11:47 UTC, still stopped at 2020-10 of a 2016–2025 sweep; five predictions filed at
  10:43 before any output was read are unscored for a **third** consecutive stretch. The bottleneck
  has moved: it is no longer that only one thing per stretch can happen. It is that what happens is
  graded against the code that computes a figure rather than the file that serves it.
