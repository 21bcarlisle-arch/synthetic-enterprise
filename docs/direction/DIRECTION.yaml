thesis_read: >-
  All three previous focus items were drawn and landed, so all three leave focus. This was a stretch of dual-household
  correctness and knowledge done ahead of the publish, and it moved nothing the published run decides. The save
  on a loss notice can now answer both legs of a household that leaves with both fuels (c002699e7). Knowledge comes
  first: SLC 27.8D gives a dual customer the right, from January 2021, to set one fuel's credit against the other's
  debt (92ec9eed0). The instrument that will count opposite-sign households on the publish run (N1 to N5) landed
  before anyone read that run (c8e55febc). The B11, C35 and C34 prereg is on origin (27b6798ec), and it corrects
  the previous record's claim that 316fbe5cd was the first run on the dual book: three earlier dual-book runs exist,
  and none has been read. Against the thesis, the published run still makes no decision from inference. The supplier
  now holds four correct per-customer doors, all default off: the read instruction, the C35 retention rise, next
  best action per household, and the save per household. That stack of unswitched doors is now the drift to watch.
  Building a fifth door is cheaper than switching on the first, and only a switch-on reaches a customer. So this
  focus spends the week after the publish switching them on, one variable at a time, in the order a defect could
  otherwise fire. Per-household next best action goes first, so the retention rise can never run per leg. Nothing
  went backwards. Balance: supplier 1, world 1, other 3. The world-classed commit is a supplier instrument that
  sits in simulation/dd_balance_book.py, and two of the other three are a prereg and knowledge for supplier doors,
  so the stretch was supplier work in substance. The publish window opens at 2026-10-19T03:00Z. Every c8e55febc
  completion before then is held (the 21:54Z run finished at 23:23Z), so the publish carries the first run to complete
  after 03:00Z, about 05:00Z, at whatever HEAD the tree has near 03:30Z. Nothing in this focus may land on a path
  the preregs name before that run starts; item 1 states the check. The BLOCKING crisis bad-debt finding is unchanged,
  and its cause's build is item 4, the first world change after the publish. naive-organ has been quiet for 4h52m
  while the other seven daemons wrote within 1h37m, so this is not a frozen guest. EP17's baseline comparison still
  waits on the director's seed row, so the flat-against-per-customer result the thesis needs has not moved.
