- id: C29_decisions_stop_being_lookup_tables
  what: 'Re-ask C29''s hold first. Its block_reason says "sequencing behind B10", but B10_competitor_switching_response
    reached its target and was refiled on 2026-08-30 (15a9703ae). Rewrite the block_reason to name only what is
    actually outstanding: PB5_pounds_or_percent_resolved at L0, and PB4 at L2. Then run C29''s DISCOVER/FRAME, which
    its own row says is drawable now. Name the company decisions in company/pricing/ and company/crm/ that are still
    a lookup by segment or band rather than per account. For each one, say which observable a real supplier holds
    that would let it vary per account across the seam. Use the joint in tools/engagement_separation.py (PB4) as
    the household trait the first such decision has to infer. File the frame as a design doc. Then move loop_stage
    idle->build, or record L0->L1 through tools/level_promotion_gate.py with its End-to-end clause. Ask `python3
    -m tools.maturity_map_store` for headroom before writing the row.'
  why: 'C29 is PB4''s coupled company twin. Until C29 reaches L2, the coupled-triad gate refuses PB4''s step to
    L3 on every draw, which is why two stretches of PB4 focus landed nothing. It is also the thesis''s company half:
    decisions made customer by customer, not by lookup table. DONE when C29''s block_reason no longer names B10,
    and its row has either a filed frame and loop_stage build, or a recorded L1.'
- id: attribute-the-stage-a-edge-to-world-or-company
  lane: B_commercial
  what: Run the one-variable check that the Stage A grading names and did not run (section "Stage A grading", paragraph
    "Attribution", in docs/staging/records/SEAT_PREREG_THE_LARGER_BOOK_TEST_OF_THE_VALUE_RULE_AGAINST_A_FLAT_PRICE_SET_IN_ADVANCE_2026-10-04.md).
    That is ONE default-path decision_probe pass, about 30 min and 5 GB, at the Stage A base's company code with
    the departure anchor reverted to its pre-refit values (before b9ede156f). Append a written prediction to the
    prereg BEFORE launching, then launch with tools.launch_long_job. Score it with tools.decision_probe.ex_ante_scores
    exactly as Stage A was scored, and append the edge per decision against 3.2 (old) and 7.7 (new) under that paragraph.
    If one variable is not enough to place it, say which second split is needed and stop there.
  why: The edge per decision more than doubled across 96 commits that moved the world's departure anchor and the
    company's offer/belief code at once. Whether the advantage came from INFERENCE or from the world getting easier
    is the thesis's own question, and the director's EP17 decision will be read through it. DONE when the prereg
    carries the pre-registered prediction, the result, and a sentence that attributes the rise to the anchor, to
    the code, or to "both, needs split X".
- id: PB5_pounds_or_percent_resolved
  what: Work PB5's BUILD step from L0. Read docs/design/simplifications/PB5_pounds_or_percent_resolved.yaml first,
    and the knowledge layer before any number. Decide, with evidence, whether households respond to a price difference
    in pounds or in percent. If the published record does not settle it, land the mechanism with the answer carried
    as a declared None and a named reason, and file the gap. Record L0->L1 through tools/level_promotion_gate.py
    when its controls are on origin.
  why: PB5 is C29's other unmet dependency, so it is the second half of what holds PB4's L3. A household response
    whose unit is undecided would make every per-account decision C29 builds silently unit-dependent. DONE when
    PB5's row reads L1, or names the single gap that holds it at L0.
