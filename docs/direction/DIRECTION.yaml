thesis_read: >-
  A good stretch for the precondition, and the thesis test still has not run. The previous focus named four items and
  all four were drawn. Three landed and leave focus. First, N28 (7d43952ff): the cast's narrated sentences are now
  derived from the bills the page prints, with an invariant behind them. Second, the level-DD map of the 71 holds
  (72c936d31). Third, the worktree-publish fix (cbd8ace4f): a publish commits the marker's own run and refuses by name
  when there is none. N29 is in flight. A seat executor claimed it at about 00:05 on 12 Nov, with pytest running over
  the closing and dual-fuel tests, so it stays first and must not be drawn twice. The CO1 embedded-thermal line the
  director approved also landed (0849f1427). It does not render yet: it waits for a publish, and the commitment
  (due 20 Nov) is met only when it renders. The most important result of the stretch is the level-DD map. 35 of the
  71 "holds" were our own reader netting each fuel separately, while the desk works the billing account as the
  25 Oct design and SLC 27.8D say it should. The real code defect count is 36 (B 10, C 10, D 14, E 2). That is a
  correction of the machine's instrument, not of the company. Three fixes in a row missed their predictions partly
  because they were graded by a reader that held two rules for one account. The map names the next step: the reader
  first (71 to 36 predicted exactly), then cause B by trace. That is item 2, and the loop's STOP is honoured because
  the map now exists. One new defect reached the live site. The published carbon page was built from an uncommitted
  grid intensity feed (f61212726), so it cannot be reproduced from the repository. It is the third publish-input
  defect in two days (with 4f68a644f and cbd8ace4f). It also blocks the CO1 line from rendering through a clean
  regeneration, so it is item 3. The commit_split reads 2 supplier, 0 world and 9 other. That is thin on supplier
  work, but honest: the "other" commits include the level-DD map and two finding retirements that grade supplier
  pages. Against the thesis itself nothing moved. The flat-baseline comparison (c65c4cb8b) remains the only test of
  "beats average by inference", and it stays held by the director's ban on model arms until 16 Nov. It is first for
  that review, on a book carrying N28 and N29. The shared checkout is 15 behind origin and every daemon lacks 2 to 4
  commits. That is left as before: three writers share the tree, and no item this stretch depends on a daemon
  running the new code.
