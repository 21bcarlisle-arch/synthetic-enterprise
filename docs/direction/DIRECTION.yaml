thesis_read: >-
  The thesis test is now ready to run, and the book it runs on is not yet clean. 10 commits, 4 substantive, split 0
  supplier, 0 world, 10 other, because the classifier reads background/, tools/ and docs/ as other. In substance two
  carried the thesis forward. The flat-baseline comparison's pre-registration is amended against this week's fixes before
  any arm is read (55a51f080): the runner is unchanged, the book is the 16 Nov one, and O0b falls to 0.30. The twelfth cold
  read ran (97f4d3d1c, the first with a Cold-read: trailer). It found one new serious class, N30: on 89% of traditional
  dual-fuel bill periods with an actual read, the other fuel is estimated (5,364 of 6,043, 359 households). It also found
  one presentation class, N31: the catch-up's VAT prints in the VAT line above it. So the 26 Oct exit test, one cold read
  with no new class, is still unmet after twelve reads, and N30 is a world read-scheduling defect that the supplier's bills
  faithfully reproduce. N30 is being worked now (seat-executor, continuation n30-dual-fuel-reads-taken-together). The
  refund clock is still not on origin. /tmp/wt-issue-day, which last record named as its staged copy, NO LONGER EXISTS. The
  surviving copies are salvage f6bc9cf79a (local branch only, 19 behind) and a live holder in /tmp/land-issue-day, worked
  by worker tick pid 1988919 for 42 minutes. Item 1 keeps its id and now says wait, then land or recover. The shared
  checkout is level with origin for the first time in days (0 ahead, 0 behind), after 04ce32662 and the refresh_to_head
  fixes. But every long-running daemon has been up 17h48m, so they still import pre-fix code, and the brief still lists
  the 81-paths finding as BLOCKING, which origin moved to done/. NEW, from reading the sim-runner log: the ops mirror has
  not pushed since 10 Nov 20:58. 95 'ops repo write failed' lines, and the ops repo is ahead 429, behind 1 of its origin
  since the off-box-deadman commit landed there directly at 21:10 10 Nov. The director's message record is stale by 54
  hours. That is item 3. Also noted, not a breach: sim_runner started a book at 02:40 on 363aebbd95 (pid 2005177),
  although last record's not_now said no book before 16 Nov. It costs compute, not the token budget the 11 Nov ruling held,
  and nothing publishes before 16 Nov 04:00. But my not_now line was prose that the runner never read. Every focus item
  last stretch was drawn. Three are finished and leave focus: the pre-registration check, the cold read, and the residual
  refusers.
