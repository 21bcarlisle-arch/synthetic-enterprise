for_the_director:
- id: k8-knowledge-before-build-covers-supplier-capabilities
  raised: '2026-11-24'
  kind: canon_intent
  decision_kind: harness
  what: K8 (knowledge before build) covers supplier capabilities only; two world models were closed at
    target with no knowledge page beneath them, the weather-to-price chain and the cold-and-still tail
    demo
  proposal: 'Extend K8 to the world: a world model reproduces a published mechanism, so the page naming
    that mechanism comes before the build and the module''s docstring cites it (or a named Knowledge:
    GAP). One-leg test over L3+ world modules, no baseline list.'
  recommendation: 'I recommend adopting the one-sentence extension: the chain loses to a gas-only null
    in every regime, and a page would have named its missing carbon and interconnector terms before the
    first arm ran.'
  based_on: bfad11e9fa
  status: open
  resolution: ''
  evidence: docs/staging/WORKER_FINDING_A_WORLD_MODEL_CLOSED_AT_TARGET_WITH_NO_KNOWLEDGE_PAGE_BENEATH_IT_2026-11-24.md
    (census of 32 world modules under 20 L3+ atoms)
- id: the-forward-world-has-bands-for-gas
  raised: '2026-11-24'
  kind: strategy
  decision_kind: curriculum
  what: The forward world has bands for gas and the renewable fleet only. The weather-to-price chain's
    shippable form also needs forward levels for transmission demand, interconnector net flow and carbon,
    and forward_years.json carries none of the three
  proposal: 'Add three bands to docs/design/curriculum/forward_years.json, each labelled on every forward
    figure. (1) Transmission demand (ND): hold it at its 2023-25 record level, about 25.4 GW, with embedded
    solar growth taken from the renewable fleet band, so demand and fleet come from one capacity path
    (electricity page s.8a). (2) Net flow: the FES 2025 ES1 annual interconnector level per case, uniform
    across cases, starting from its 2025 column (s.5a; the 2030 spread is -23.8 to +8.1 TWh). (3) Carbon:
    DESNZ''s 2025 traded carbon values, Low to High (2030: 25 / 50 / 66 GBP/t, real 2025), drawn jointly
    with the gas case, because DESNZ''s low-carbon case is its high-fossil-price case, plus CPS at 18
    GBP/t nominal to March 2028 and held nominal after that (s.2a)'
  recommendation: I recommend yes to all three. Each is the published band, or, for ND, the default the
    record supports. Until a band exists, every forward chain figure would carry a level nobody chose,
    which K2 counts as asserting a value. Nothing forward is built until you answer, and the record-years
    work carries on meanwhile.
  based_on: 069ff7a75e
  status: open
  resolution: ''
  evidence: docs/market_research/how_the_gb_electricity_price_forms_2026-11-24.md s.2a, s.5a, s.8a; docs/staging/WORKER_FINDING_THE_WEATHER_TO_PRICE_CHAIN_STEER_IS_HALF_ANSWERED_AND_ITS_REST_HAD_NO_WORK_ITEM_2026-11-24.md
    (progress, 24 Nov)
- id: s-12g-rank-at-q-run-graded
  raised: '2026-11-24'
  kind: strategy
  decision_kind: measurement
  what: 's.12g rank-at-q run graded REFUTED: rankq minus twin -2.45 GBP/hh-yr (-4.76 to -0.47), BELOW.
    But it offered 0.109 of asks against the twin''s 0.277, so ranking and volume are still confounded.
    The pre-registration names no lever after this outcome.'
  proposal: Stop the retention-gate line on book 61118. Record that no gate on A's belief (0.12 cut, 0.30,
    rank-at-q) beats the twin out of sample. Open the next item as a finding against the corrected belief's
    money grade, which is the BELOW step-1 consequence, taken as the conservative reading.
  recommendation: 'Take the conservative reading (F11: erring against our own thesis): treat the money
    as not in A''s ranking for retention, and run no further retention lever. The alternative is one more
    ~11 h run with the gate set on offered volume after the value test, so that offers match 0.277. It
    would separate worse from fewer, but it is a lever this record did not fix in advance. Recommend it
    only if you want that confound closed before the thesis result stands.'
