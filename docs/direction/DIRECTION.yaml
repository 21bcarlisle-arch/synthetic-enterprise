  ordinary publish: c0f71f95b landed it, and .publish_gate_state.json shows episode_closed_by rule
  cause_cleared ("behind_origin no longer holds: re-asked of origin/main, 0 behind 0 ahead"),
  episode_failures 0, wedge_since null. 84944706c renders the weekly hold as itself. That row
  closes and the item leaves focus. The first two focus items were drawn. The console-capture item
  and the prereg-premise item were not, in 3.0h. They sit third and fourth in order, so this is
  not yet drift, but a second unreached stretch will be. The C1 bracket is progressing: run (a)
