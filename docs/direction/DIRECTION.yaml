thesis_read: >-
  This stretch had 3 commits. 2 were substantive, and by side all 3 were other: supplier 0, world 0. That makes four
  stretches running in which the supplier gained nothing on origin, so the thesis did not advance. The machine's
  whole output is going on getting work through one gate. The per-customer advantage over the flat-rules twin is
  still unmeasured. s.12g's twin child (pid 2243091) is 11h21m in at 10.6 GB, and /var/tmp/vtn-out/A and
  /var/tmp/vtn-out/twin are both still empty. The book every supplier grade reads has now been unbuilt for about 75
  hours. The steer did take. The previous focus named 3 items and 2 were drawn. Item 2 is finished: C29's null arm
  was a control keyed to a coin, and it now asks for a weaker prior than the planted arm's (8a9e5ecea, on origin), so
  that item leaves focus. Item 1 nearly finished. A fourth unchanged relaunch was refused at 16:34Z on the same three
  reds, but the 17:18Z landing, with the controls re-keyed, passed its gate as 9423d3dc5. It lost the promotion race
  to a2d8c2888 and is re-gating now (bounded_landing pid 4104513). Item 3 is the error of this stretch: it was retired
  at 15:31Z because its fix had LANDED (b0b05661f), but what it was meant to achieve never happened. The shared
  checkout is 42 behind origin, not 39. So every daemon still runs without the one-gate flock and the in-job retry,
  and a tombstone recorded the item as done. The MSC replacement-win is now the supplier result most at risk. land5
  timed out at 3600 s, again at 88% with no red. It ran from a worktree detached at origin, so the flock WAS live
  there, which means concurrent gates are not the whole cause: the 181-file hook selection on that pathspec does not
  fit the hour on this box by itself. land6 then died in under a second because /var/tmp/se-msc-wt had been removed.
  The MSC work now exists only as /tmp/msc_land/msc6.patch and the salvage ae573846b1. And it has to reach origin
  before sim-runner starts the post-s.12g book (about 06:30Z 24 Nov), or that book is built without it. My own
  correction (the 181-file selection, not 1,074) was refused with "already at HEAD", because it ran in a tree where
  the file did not differ. The finding on origin still reads 1,074.
