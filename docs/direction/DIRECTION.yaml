thesis_read: >-
  THE BASELINE LEG PRODUCED A REAL RESULT AND IT REFUTES WHAT WE PUBLISHED. The 18-seed fold
  finished at 07:46 -- six legs in /var/tmp/se-floor18-head-20260925/shards/, `agreement_fold_rc=2`
  -- and HEAD reproduces the served selection family on none of its eighteen seeds. The published
  NEGATIVE direction of -£959.78 at 2.50 sems came from runs of 2026-09-10; on the same seeds at
  HEAD the mean is +£169.60 at 0.31 sems from zero, which is no sign at all. Worse for the unit:
  three of HEAD's four decision fingerprints each span residuals from about -£4,300 to +£1,550, so
  identical priced decisions produce outcomes £6,000 apart and a fingerprint-counted "draw" is not
  an established quantity. Against the thesis this is the half that makes "it performed well" mean
  anything, working exactly as designed and returning bad news: the advantage on the public page is
  not a property of the model that exists. The director's own reading, at 09:29 today, is that this
  is the observability working, and his instruction was to keep the figure and report the finding
  rather than withdraw it -- `5466719cb` and `401cd5784` did. NOW THE MACHINE, AND I HAVE TO CORRECT
  THE SEAT'S LAST READING OF IT RATHER THAN EXTEND IT. This stretch's shape -- 36 commits, 4
  substantive, 24 carrying nothing, 11 of them heartbeats -- is not a defect. It is THE DIRECTOR'S
  SLOWDOWN, instructed verbatim at 2026-09-25 13:57 ("raise the tick interval substantially until
  Monday, draw only product work or anything that genuinely blocks a landing ... Put the tick
  cadence back at the reset. Tell me what you set") and enacted at 14:58 in three installed units,
  none of them committed: `worker-tick.timer` OnUnitActiveSec 1800s to 14400s, `seat-executor.timer`
  OnCalendar *:05,35 to 00/4:05, `delivery-seat.timer` OnCalendar 00/3:20 to 00/12:20 -- 8x, 8x and
  4x slower, verified live against `systemctl --user show -p TimersCalendar`. THE PREVIOUS DIRECTION
  RECORD WAS WRITTEN NINE HOURS AFTER THAT INSTRUCTION, NAMED FIVE MACHINERY ITEMS, AND NEVER
  MENTIONED IT. So the brief's headline -- none of the previous focus was drawn, twice running -- is
  not a broken steering wheel; it is the slowdown refusing work the director had told us not to
  draw, and the seat asking for it anyway. The orientation reads git, the map, the staging root and
  the publisher, and it does NOT read `docs/staging/console/DIRECTOR_CONSOLE_<date>.md`, where his
  words are captured verbatim; that is the gap, and it is the whole cause. I came within one step of
  filing the timer divergence as a silent throttle -- three installed units disagreeing with the
  tree, all in the direction of less work, one timestamp, no drop-in, no explanation anywhere in the
  repo -- and found it was compliance only by following the phrase "director's slowdown until the
  reset" inside a staging finding. TWO SMALLER CORRECTIONS, BOTH MINE. First, I attributed the
  empty-commit shape to the liveness heartbeat manufacturing gate cycles; measured now,
  `reconcile-watch` (5 min) and `deploy-restart` (10 min) run at exactly their declared cadence and
  the slowdown never touched them, which is precisely what the director observed himself at 22:04
  -- slowing the draw does not stop the machine committing. The heartbeat does still fork the tree,
  and HEAD is 32 behind origin with 2 of its own and the publisher refusing on cause
  `behind_origin`; but the fork is not what the shape of this stretch was about. Second,
  `direction.FOCUS_MAX_AGE_HOURS` is 12.0 against an orientation timer now firing every 12 hours, so
  the record expires as the next one is due: `read_direction()` returns this record and
  `is_live()` returned False when I measured it at 11:26. AND HE IS OWED AN ANSWER. He asked "Tell
  me what you set" 22 hours ago; `docs/observability/ntfy-delivery-log.md` records its last
  delivery at 2026-09-23T09:16Z, so nothing replied.
