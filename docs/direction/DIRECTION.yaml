      fuel, plus payment method, consumption band, tenure and prior switching where the record
      carries them — and file that read in `docs/market_research/` before writing the trait, because
      the same read is step 1 of focus item 3 and neither item should pay for it twice. HOLD THE
      MARGINAL DISTRIBUTION OF ELASTICITY FIXED: re-plumbing where the trait comes from is a fidelity
      CORRECTION and yours to make; changing how many households are highly elastic is curriculum,
      is the director's, and is reserved by canon §4 — if the honest version leaves our position
      unchanged or worse, make it and say so afterwards. Then FILE THE PREDICTION, re-run
      `tools/r1_inference_ceiling.py` on a book drawn after the build, and publish its verdict
      whichever way it falls, beside the prediction, in the record.
    why: >-
      The director ranked this first on 2026-09-04 and the ceiling measured on the same day says why
      in a number: at full coverage neither available observable clears its own null, so the best
      possible model recovers nothing. Until households differ for reasons a supplier could in
      principle observe, every comparison returns "the level is everything" and is right — the thesis
      is not unproven, it is untestable, and R2 (decisions that use it) is bounded at the floor
      before a line of it is written. Finished when the trait's antecedents are sourced and filed,
      the build holds the marginal and says so, and the ceiling re-run's verdict is in the record
      next to a prediction that was written before the answer was known. A re-run that still reads
      "noise" is a complete result and must be published as one — R12 forbids growing the world until
      the instrument agrees.

