focus:
  - id: weather-cells-phase1-finish-and-receipt-the-daily-pull
    what: >-
      Resume the HadUK-Grid pull to completion and make the committed artefact agree with the disk.
      It is at 120 of 315 files and stopped at 12:27Z with nothing retrying:
      `/home/rich/.cache/synthetic-enterprise/haduk_grid` holds 5.3 GB (tas/mon 35, sfcWind/mon 35,
      sun/mon 35, tas/day 15, three mon-30y normals) while `docs/market_research/haduk_grid_pull_receipt.json`
      still declares `tiers: ["normals"]`, `complete: 3`, `bytes_on_disk: 124079328`. Run
      `python3 -m tools.fetch_haduk_grid --tiers monthly,daily --verify --receipt`; it is resumable
      and idempotent and the receipt merges across runs. Launch it so it SURVIVES the tick that
      starts it — a detached cgroup, not a foreground child — because a tick-bound long job dying at
      its boundary is exactly what produced the 120/315 state, and re-running it inside another
      bounded tick will produce the same result further along. §3.4 of
      `haduk_grid_weather_cells_phase1_source.md` fixes the daily tier at Oct–Mar, so state the
      heating seasons covered as a count and name any season the archive did not have as a gap row
      rather than letting a short file list read as completeness. The token premise in the ruling no
      longer holds — §4 records the mint API returning 200 and the puller re-minting itself — so do
      not escalate on token expiry; escalate only if minting fails AND the fallback is spent.
    why: >-
      This is the only product work in flight, it is the director's own phase-1 instruction, and it
      is half-done in the worst way: the expensive part is bought and the committed record understates
      it by 5.2 GB, so the next session reads the receipt, believes only normals exist, and either
      re-derives the state by hand or pulls it again. Finishing it is cheap because the puller
      resumes; leaving it is not cheap, because a stalled resumable job with no watcher is
      indistinguishable from a finished one at the only surface anybody reads. DONE when the
      committed receipt lists normals, monthly and daily with `complete == requested`, its
      `bytes_on_disk` reconciles against the cache walked independently, the daily season count is
      stated with its gaps named, and the runner that finished it is one a bounded tick cannot kill.
  - id: enospc-is-an-environment-failure-not-a-test-regression
    what: >-
      Make the publish gate refuse to record disk exhaustion as a test regression. Today's
      `.publish_gate_state.json` carries `total_red: 50` and 12 `blocking_tests`, every one an ERROR
      rather than a FAILED, concentrated in two files that re-run green at the same HEAD once `/tmp`
      has space — because `tmp_path` cannot be created under ENOSPC and every test taking that
      fixture errors in setup. Build the smallest leg that can fail: before `blocking_tests` is
      written, if the run's failures are dominated by SETUP errors and free space on the pytest tmp
      root is below a stated bound, record `kind: "environment"` carrying the free-space figure, and
      do not write those node ids as blocking work. Key it to the property — the tmp root was
      exhausted — never to today's two filenames, and prove it can fire by injecting the exhausted
      condition rather than asserting it through the operator. Second leg, and only after the first:
      `/tmp/pytest-of-rich` reached 508 run dirs and 5.8 GB with no owner; give the scratch a
      reclaimer that names what it is reclaiming and spares the live run. A TTL is not enough — this
      repo already filed why (`A_TTL_CANNOT_BOUND_SCRATCH_WHOSE_MAKER_DIED_IN_THE_FIRST_HOUR`).
    why: >-
      This is the machine manufacturing the work that crowds out the mission. The loop is written
      down and self-feeding: a wedge makes the gate re-run every 20 minutes, each run fills `/tmp`,
      the next run errors, and 12 fabricated node ids go into the state file where the following tick
      draws them and starts repairing tests that pass. A four-hour wedge becomes a day of it, and the
      commits it produces all classify as machinery. The instance was swept by hand today; the
      mechanism is untouched and refires the moment `/tmp` refills, which it will. DONE when a gate
      run under an exhausted tmp root records `environment` with its free-space figure instead of a
      test-regression list, the branch is mutation-proven reachable, and the scratch has a named
      owner that reclaims it.
  - id: weather-cells-phase1-derive-the-curve-and-the-page
    what: >-
      Compute what the pull was for. §5 of `haduk_grid_weather_cells_phase1_source.md` states
      plainly that none of it exists yet, and it names its own missing inputs: Ordnance Survey open
      terrain for the elevation correction to house height, and 2021 E&W / 2022 Scotland census
      household counts by postcode for the weights — pull both before clustering, and never weight
      by the SIM's drawn population, which §4 of the ruling forbids. Then cluster GB on the three
      phase-1 drivers, produce the two explained-variation curves the ruling asks for (level: annual
      heat load; shape: cold-and-still against mild-and-windy months), name the cell sets at 90/95/99%
      of household-weighted variation, and overlay LDZ, GSP and SAP-21 afterwards as comparators with
      a stated figure for how well each approximates the derived cells. Report cold-spell persistence
      and cross-cell synchrony per cell (§2.4 — this is why the daily tier exists). Validate against
      DESNZ sub-national gas consumption at small-area level, which is a different source from the
      one that generated the cells. Then the knowledge page, with cells as a versioned Choice-class
      claim and an expected-shape block stating the findings falsifiably. Where the data cannot
      answer — §3.1 records there is no irradiance product, only sunshine duration — carry the gap on
      the surface with its reason, not a substitute.
    why: >-
      The pull is a precondition and nothing more; this item is the product. A weather cell is a
      thing the company can INFER a household's heat load from using only what a supplier could see,
      which is the thesis stated in one artefact, and it is the first of the director's three
      segmentation phase-1s to reach a computable state. Sequenced third because it is blocked on the
      pull finishing and on two source pulls it does not yet have, not because it matters less.
      DONE when the two curves exist with their cell sets named, the comparator figures are stated,
      persistence and synchrony are reported per cell, the DESNZ validation has run against a source
      the cells did not come from, and the knowledge page publishes all of it including what is
      still not established.
  - id: C31_one_obligation_one_vulnerability_scorer
    what: >-
      Settle which vulnerability assessment the company obeys, from the published obligation rather
      than by picking. `company/crm/vulnerability_register.py` is live — `self_rationing_detector`,
      `life_event_detector`, `portal/app.py`, `warm_home_discount` all call it — and
      `company/crm/vulnerability_index.py` has no production caller at all, yet the dead one is the
      half that decides `disconnection_protected` and `is_priority_services`. They disagree on every
      overlapping term (`MEDICAL_EQUIPMENT` weight 5 against `HOME_OXYGEN` score 60 forcing CRITICAL;
      `ELDERLY` with no age threshold at all against `ELDERLY_75`) and each holds terms the other
      lacks. Read the Ofgem PSR obligation out of the regulation commons in
      `docs/domain_artefact_library/` first, make ONE scorer decide, have each surviving term and
      weight cite the clause it implements or carry an honest gap with its reason, reduce the other
      to an adapter or delete it, re-point every current caller, and leave a control that reds if a
      second independent scorer appears.
    why: >-
      This is the VAT shape CLAUDE.md names — one legal requirement, more than one implementation,
      and nothing able to notice they disagree — with the aggravation that the unreachable half is
      the one governing disconnection protection. It is also the third instance found in a single
      session, after the two CLAUDE.md build parsers and the two independent payment-method draws
      that agreed 58.8% of the time. And it is thesis work, not tidying: deciding customer-by-customer
      whether someone is protected is exactly the per-customer judgement the company is supposed to
      make, and it currently makes it twice, differently. The filed finding refused to wire the dead
      index on instruction precisely because wiring picks a winner by convenience — honour that
      refusal by answering it from the obligation. DONE when one scorer decides, its terms cite what
      they implement, no caller reaches a second one, and the control that forbids a second exists
      and has been proven able to fail.
  - id: a-finished-continuation-must-retire-itself
    what: >-
      Give `seat_continuation.live()` the retirement channel it is missing: an entry whose work has
      LANDED. It retires on expiry and on refutation and has no third case, so
      `register-low-water-three-implementations-one-mechanism` is still live at 14:24Z describing a
      re-point that landed this stretch in fc950dda6, cbfb12f1b and 029c21452. Because
      `delivery_lane.next_item()` walks `live()` first and returns the first unclaimed entry
      unconditionally, a finished continuation preempts the seat's whole ordered focus for as long as
      it survives. The tombstone channel already exists and survives `--release`:
      `delivery_lane.last_landing(focus_id)` returns the commit instant and paths of a landing bound
      to an id. Retire a continuation whose id carries a landing later than the continuation was
      written. Prove all three retirement branches are REACHABLE in one control over the partition —
      expired, refuted, landed — not a leg each, because a retirer that retires everything passes
      every per-branch test.
    why: >-
      Ranked last deliberately, and this is a correction to three stretches of my predecessors'
      reasoning including my own: the focus channel being unreachable has NOT been stopping the
      director's priorities from being delivered — the staging queue delivered the weather pull this
      stretch while `drawn` stayed empty. What it costs is narrower and still real: my ORDER is
      invisible to every autonomous tick, so what gets worked is whatever ranks first in a different
      queue, and a tick can be handed an instruction whose work is already in git. DONE when a
      continuation with a landing bound to its id is not returned by `next_item()`, the three
      retirement branches are shown reachable together, and a stretch's `drawn` can contain a Lane 0
      slug at all.
