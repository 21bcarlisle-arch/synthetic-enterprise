  - id: the-control-that-would-have-caught-last-stretchs-defect-is-in-the-index-and-in-no-commit
    what: >-
      **Two pieces of finished work are sitting ungraded, and both are minutes.**

      **(a) Land the staged control.**
      `tests/tools/test_the_published_artefact_carries_the_split_the_code_computes.py` is
