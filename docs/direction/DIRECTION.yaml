thesis_read: >-
  **Three hours that did everything the last direction asked, and the thesis went BACKWARDS
  because of it — that is the whole read and it needs saying in that order.** All four focus items
  were drawn, three are finished and disappear below. The publish wedge is gone: the `0->2` on
  `PB3_book_growth_as_earned_outcome` was backed out of the shared map with its reason recorded on
  the atom, `.publish_gate_state.json` now reads `episode_failures: 0` / `wedge_since: null`, and
  a publish reached origin at `c9d0dab6d`. The switching belief answers to the published record and
  the strict xfail came off in the same commit — the old table was outside the band 8 of 10 years
  and, worse than the level, correlated with the record at **0.40** over 2016–2025 and **−0.47**
  over 2016–2021: the company believed the market was least competitive in the year it was most
  competitive. The repair was structural rather than ten corrected numbers — the absolute rate is
  now the primary form, loaded fail-closed from the commons, with the multiplier DERIVED — and the
  census the direction asked for ran: 26 candidates, 8 registered and band-held 10/10, 18
  classified with reasons, and it found one on its first run (`market_departure_rate`, the
  fraction form `simulation/renewals.py` actually consumes, registered nowhere). C3's mechanism
  went from unexplained to established: the same world change is **+100.75pp** where the company
  undercut the market and **−53.99pp** where it priced above, so the convention has no fixed sign
  — it has OUR sign. **Now the part that matters.** Correcting the company's belief onto the record
  moved `tools/couple_value_based_pricing` from *company inside the band 2 of 10 years, 17.34pp
  max divergence, `indistinguishable: False`* to *10 of 10, 1.80pp, `indistinguishable: True`*. The
  guard is fail-closed and correct, so **the belief-versus-truth gap is no longer quotable as
  evidence of the company's inference at all.** Yesterday we had a large gap that looked like
  independence and was inaccuracy; today we have an accurate prior and no independence. Against the
  thesis — *the advantage must come from INFERENCE, never from ACCESS* — that is not a setback, it
  is the diagnosis: **the company's competitive-pressure belief is pure ACCESS.** It reads the same
  published DESNZ series the world was calibrated from, and the guard names the discharge in its
  own text: re-fit the estimator from the company's OWN observed departures, *"which is what a real
  supplier actually has and this one does not yet use."* Meanwhile the baseline the thesis
  explicitly requires is still measured in a world three changes old:
  `site/data/value_arms.json` carries `generated_at: 2026-08-31T00:56:24Z` beside
  `run_generated_at: 2026-08-30T10:37:06Z` — the page was RE-RENDERED, not re-run — and its own
  headline names the blocker as *"the lever is a PRODUCT, not a size"*, which C1a/C1b landed and
  nobody has re-measured since. The one-line read: **we got accurate enough to disqualify our own
  only claim, and the route to earning it back is the one the thesis names.**
