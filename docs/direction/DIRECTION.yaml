for_the_director:
- id: c34-now-ranks-next-best-action-on
  raised: '2026-10-12'
  kind: canon_intent
  what: C34 now ranks next best action on joint value with a no-loss floor on both sides, as ruled (C7,
    eeb38abc3), and it still advises nobody at realistic inputs. Across the C34 finding's own B11-scale
    inputs (margin GBP 5-30 a month, hazard 0.5-3% a month, 48 months, advice giving up GBP 2-3 a month
    and cutting the hazard 0.1-0.3 points), joint value is positive in all 18 cases (+GBP 13 to +107)
    and our side is negative in all 18, so our floor refuses every one. The ranking key changed and no
    decision did.
  proposal: 'Keep both floors, and let an advice action that creates value but costs us travel with a
    price that shares it: the renewal or retention price is set so that our side of that action is at
    least zero, which is M2''s created-then-shared. That is a pricing-lever change (step 5), not a C34
    change, so I would build it next week as an atom, knowledge page first, and grade it on fresh seeds.
    If you would rather loosen our floor to ''joint value exceeds what we give up'', say so; that one
    is a one-line change and I would measure it the same way. Measured since: on the world''s book the
    price can only be collected where the renewal sits under the default, so the build must read each
    account''s headroom under the cap, and it reaches 40% of cases; the other 60% need the one-off fee
    (C35) or the floor change.'
  status: open
  resolution: ''
  evidence: 'docs/market_research/next_best_action_and_cross_sell.md section 6.1; landed eeb38abc3. Measured
    2026-10-16, docs/market_research/a_retention_price_that_shares_the_value_an_action_creates.md section
    4 (18-row table): a rise on a Fixed Retention Tariff (lawful in form, depth unregulated under the
    SLC 22B derogation to 31 March 2027) brings our side to zero in 18 of 18 cases holding the hazard,
    at GBP 0.01-2.73 a month; 10 of 18 once the rise''s own effect on staying is added at the published
    slope (none of the six GBP 30-margin cases); 0 of 18 on a default tariff priced at the cap. The rescue
    is a transfer: joint value is unchanged. Re-counted 2026-10-17 on the world''s own 260 renewals (same
    page, section 4b): each renewal at its own margin, hazard and staying response, with the rise capped
    at what a stayer is billed under the default. A sharing rise rescues 314 of 780 advice cases (40%),
    95 of 192 accounts; 148 renewals (57%) under no effect, 94 of them already at or over the default.
    It is set by the default''s headroom in the renewal year (2020: 39 of 40; 2021: 4 of 29), not by the
    slope, which moves the count by 1-3. Measured 2026-10-20 on the term''s contribution (b8c665948, C34
    on arm at c61d8b608, full window): C34 advises 4 of 972 renewal rows; the median household contribution
    is -GBP 3.91 a month and 85.8% of 324 households are negative, so our side of almost every renewal
    is below zero before any advice is costed. CORRECTED 2026-10-21 by the opex-credit grade: that figure
    charged the cost the standing charge recovers and credited none of it. Credited (ec7fd9942, full window,
    one variable against its control), the median household is +GBP 2.29 a month and 16.6% of 325 are
    negative. C34 still advises 4 of 975 rows, because every stated effect gives up at least GBP 2 a month,
    so the advice count and this recommendation stand. The sentence that our side is below zero on almost
    every renewal does not.'
  recommendation: 'I recommend the sharing retention price, not loosening our floor. Evidence: our side
    is negative in 18 of 18 B11-scale cases; a sharing rise rescues 314 of 780 advice cases (40%) on the
    world''s own renewals (a_retention_price_that_shares_the_value_an_action_creates.md section 4b). Trade-off:
    it reaches only renewals with headroom under the default; loosening the floor reaches every case but
    books the advice as value we give away unshared, which M2 calls transfer. Holding position until you
    rule: both floors stay and C34 advises nobody, which loses no money. Would change it: if the build
    on fresh seeds shows the rise''s own effect on staying erases the joint value (the six GBP 30-margin
    cases already do), the floor change becomes the better lever.'
- id: a-direction-item-s-why-claimed-the
  raised: '2026-10-12'
  kind: strategy
  what: 'A direction item''s WHY claimed the capital target ''throttles for nine years the growth the
    thesis is judged on.'' Measured on seed 42 (campaign-only resolve, 403-founder book, 2016-2025): binding
    is prospect_ceiling or market in every single year, at £0, £115 and £130 alike -- capital has never
    been the constraint this book''s growth is sized against, before or after the capital-115/C14 dating
    fix.'
  proposal: Land the capital-115 correction and the C14 dating fix on their own merits (they are correct
    factual corrections regardless), but do not treat them as having unthrottled growth -- they haven't.
    If growth is meant to be capital-judged, the lever to look at is PROSPECTS_PER_YEAR (400) or the founder
    book size, both of which bind in every year of the shipped run.
  status: open
  resolution: ''
  evidence: 'docs/staging/done/SEAT_FINDING_SEVERAL_CONSUMPTION_FORECASTS_A_WALL_LEAK_IN_HEDGE_VOLUME_AND_THE_CAPITAL_TARGET_IS_115_2026-10-11.md
    §3b: _resolve_campaign(_pre_growth_book(42), 42, persist=False) run twice in one process (flat £115
    from 2016 vs C14-dated), by_year binding is prospect_ceiling (8 years) or market (2 years) in BOTH
    arms, never capital.'
  recommendation: 'I recommend landing the capital-115 and C14 dating fixes as plain corrections, and
    treating the prospect cap and the founder book, not capital, as what sizes growth. Evidence: seed
    42, campaign-only resolve, binding is prospect_ceiling (8 years) or market (2 years) at GBP 0, 115
    and 130, never capital. Trade-off: if you want growth judged against capital, the prospect cap must
    rise until capital can bind, which is your curriculum value and costs settlement budget and memory
    (see the 19 Oct 400-household measurement). Holding position: the corrections land, and nothing claims
    they unthrottled growth. Would change it: any run in which capital binds in a year.'
- id: canon-w3-leaves-open-how-far-the
  raised: '2026-10-13'
  kind: canon_intent
  what: 'Canon W3 leaves open how far the world''s price responsiveness may correlate with signals a supplier
    holds (section 15, owed item 4). Published evidence puts the large correlations on whether a household
    LOOKS at prices: 2.8x for fixed against default, 3.4x for credit against traditional prepayment, 0.54x
    for 3+ years on the default tariff. The world already carries those. Nothing published sizes a correlation
    with how far a household MOVES once it looks.'
  proposal: 'Two changes, smallest first. (1) Selection at acquisition, with no new number: a prospect
    enters the market weighted by its own active-renewal probability, so the link between acquisition
    channel and later responsiveness emerges from draws the world already has. Recommended. (2) Optionally,
    couple the price-sensitivity segment to the engagement rank, run at both ends (independent and fully
    coupled) with the strength kept as a GAP, never a midpoint. Not recommended: a past-switching term,
    which the only trial puts at x0.94. Your decision 6 already settles the adjacent pricing question.
    Both are graded on fresh seeds with predictions filed first.'
  status: open
  resolution: ''
  evidence: docs/market_research/observable_correlates_of_price_responsiveness.md section C
  recommendation: 'I recommend change (1) only: selection at acquisition weighted by each prospect''s
    own active-renewal probability, with no new number. Evidence: the published correlations are with
    whether a household looks (2.8x, 3.4x, 0.54x), and the world carries them; nothing published sizes
    a correlation with how far it moves. Trade-off: (2) would test the coupling at both ends, but every
    result would rest on a strength no source pins; (1) adds no constant. Holding position: W3 stays open
    and the world is unchanged. Would change it: a published estimate of price elasticity by acquisition
    channel or engagement.'
- id: the-clv-discount-rate-and-terminal-value
  raised: '2026-10-13'
  kind: strategy
  what: 'The CLV discount rate and terminal-value method (canon section 15, owed item 9). The code carries
    a flat 0.10, labelled a simplification. Published GB evidence: CMA 2016 retail WACC 9.3-11.5% (2007-14
    data); CEPA for Ofgem 2022, 9.28-10.88% in normal conditions and 12.23-14.94% stressed; Ofgem''s adopted
    cost of capital 12.3% from October 2023. Marketing science: a tenure-varying survival curve to a long
    horizon, since a hard cutoff and a flat rate to infinity each bias it.'
  proposal: Keep 0.10 as the normal-conditions anchor for 2016 to September 2023, since it sits inside
    the CMA and CEPA bands. From October 2023 use Ofgem's 12.3%, so the rate follows the record rather
    than one number for ten years. Report every published CLV at both ends of the band, 9.3% and 12.3%.
    Move the terminal value to the survival-curve form when CLV is next touched. It is a company parameter,
    so this changes no world value.
  status: open
  resolution: ''
  evidence: docs/market_research/clv_discount_rate_and_terminal_value_for_a_gb_supplier.md
  recommendation: 'I recommend the dated rate: 0.10 to September 2023, Ofgem''s 12.3% from October 2023,
    every published CLV at both ends (9.3% and 12.3%), and the survival-curve terminal value when CLV
    is next touched. Evidence: CMA 2016 9.3-11.5%, CEPA 2022 9.28-10.88% normal and 12.23-14.94% stressed,
    Ofgem 12.3% from October 2023. Trade-off: CLVs either side of October 2023 stop being directly comparable,
    and the published CLV figures double; a flat 0.10 is simpler but sits about two points under the post-2023
    cost of capital. Holding position: flat 0.10, labelled a simplification. Would change it: an Ofgem
    revision of the allowance, or evidence that a challenger''s own cost of capital sits outside the band.'
