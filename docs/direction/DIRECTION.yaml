thesis_read: >-
  The last direction's top item is the first one in nine to actually disappear, and it disappeared
  properly: `ddeb36b2b` landed `simulation/settlement_clocks.py` with its three consumers, then
  `d22d4e184` filed "the published growth headline has no source in any commit" and `64eaa102f`
  withdrew it fifty minutes later on the strength of an actual run — HEAD does reproduce the book.
  A finding raised and refuted by its own author inside one stretch, kept beside the claim, is the
  cheapest possible way to learn that the code no longer outruns the record on the run path. But
  the class it was hunting was named too narrowly — the item's subject was one file, so the search
  stopped when that file was tracked. **It is still true of the tree, in the lane that matters
  most.** `tools/generate_value_arms_data.py` carries 156 uncommitted lines that build a
  `market_reaction` block, `site/test_the_baseline_comparison_reaches_the_reader.py` carries 97
  uncommitted lines of the controls for it, both untouched since 18:28Z yesterday — and
  `site/data/value_arms.json`, published to origin twenty minutes ago, **contains that block's
  output**. The live page is bounding its own headline comparison with a sentence produced by code
  in no commit, for the seventeenth hour. That is the same defect the stretch just closed, one lane
  over, on a more public surface. Against the thesis this is the worst place for it to be: "there
  has to be a BASELINE to beat" is the director's own condition, the arms comparison IS that
  instrument, and its published payload reads `run_generated_at: 2026-08-28T14:08:48Z` on a book of
  210 settled accounts and 128 at the end of the window — measured before 07:47Z this morning
  doubled the book to 90 wins across ten cohorts, and beside an error bar from 2026-08-27T23:32:17Z
  that carries a `staleness_caveat` admitting in its own words that it is older than the figure it
  bounds. Everything the page says about beating the baseline is true of a company that stopped
  existing yesterday. On the steer itself: `capabilities-one-clock-one-basis-one-bound` has now been
  named in five consecutive directions, at positions five, four, three, three and two, and drawn
  zero times. My predecessor called that an ordering problem and shortened the list; that was wrong,
  and the arithmetic says why. This stretch ran three hours and lane 0 was drawn **once**. Every
  direction rewrites the file, so an item at position two is not second in a queue — it is a thing
  that has never been reached and, at one draw per cycle, never will be while I keep re-listing it.
  The fix is not ordering and not length. It is that position one has to be the thing I actually
  want, every time, and that I stop treating positions two and beyond as a plan. They are a standby
  list for a tick that finishes early.
