focus:
  - id: the-worlds-departure-rate-against-the-published-year
    lane: W2_customer_generator
    what: >-
      Finish and land docs/staging/SEAT_FINDING_THE_WORLDS_DEPARTURE_RATE_BY_YEAR_AGAINST_DESNZ_QEP_2_7_1_2026-10-03.md.
      Its pre-registration (P1-P4) is already written, untracked, in /var/tmp/se-seat-executor. If executor
      pid 1758163 is still live, wait for it and do not start a second copy; if it is gone, carry that file
      forward unchanged. Section 1 must not be rewritten. Grade P1-P4 on the single run it names (run_output_543dcff6d_20261003T185017Z.json).
      Then answer the question one book cannot. Pool electricity account-years per calendar year across
      every run_output and probe world on disk that shares the current departure digest, or run additional
      roll seeds until 2020, 2023, 2024 and 2025 each earn a bound narrower than their distance from the
      DESNZ QEP 2.7.1 figure. Report the per-year table with its bound, and say which years the world is
      outside the record. Separately, report the world's per-renewal-decision departure share for 2019-2021
      from the probe's own rows (/var/tmp/se-probe-out/probe_bel_default.json), labelled as having no published
      comparator. Do not change the world, the commons artefact or any company belief. Leave a note for
      the console seat in docs/staging/.
    why: >-
      The console seat is now teaching the company a flatter price slope from its own renewals, learned
      against a world in which 2020's renewing households keep P(stay) 0.31-0.37. If that world over-churns
      against the record, the learned slope is an advantage from a fidelity defect, which the thesis forbids
      and the book would show as a gain. The single book cannot settle it: its own pre-registration says
      so. DONE when the finding is on origin/main with P1-P4 graded and the pooled per-year table. Each
      year must either have a bound that decides it or be named as undecidable at the pool size reached.
      The console seat must have the note. If any year is outside the record, the finding names the coupled
      correction and prices it, including the roughly 25 value-arm controls a level re-fit reds.
  - id: base-advance-merges-select-by-their-combined-diff
    lane: H_harness
    what: >-
      First measure the gate wall-time spent this stretch and last on surgical_land --merge origin/main
      commits whose combined diff is empty: 15 of 31 this stretch, 23 of 38 last. Read it from the gate
      receipts and docs/observability/, and record the figure in a new docs/staging/ finding. Then change
      tools/pre_commit_test_gate.py so that, for a merge commit, test selection keys on the merge's COMBINED
      diff: paths whose merged content differs from every parent. Today it keys on everything either side
      touched. Every fixed structural gate still runs, so this is selection, not a bypass. Add one control
      with two legs. A merge with a non-empty combined diff must still select its subject's tests. A merge
      with an empty combined diff must select none beyond the fixed gates. Mutation-prove both legs, and
      run the control in a linked worktree and in the shared tree before landing.
    why: >-
      This is the third stretch running in which about half the commits carried nothing. Three base-advancing
      landings are live at this orientation, and each re-gates code already gated on both parents. That
      queue is why other lanes' landings lose the race to origin and merge again, and why HEAD is 82 behind.
      It taxes every other focus item, the ruling's included, which is why it now ranks above it. Hook bypass
      is a wall, so the saving must come out of selection. DONE when the measured cost is on file and the
      combined-diff selection is landed with its two-leg, mutation-proven control. The next brief's no-work
      share is then read against that figure.
  - id: the-renewal-price-honours-the-prepayment-ruling-at-default
    lane: B_commercial
    what: >-
      Make both red tests in tests/company/pricing/test_the_price_rests_only_on_observables_a_supplier_may_use.py
      green at HEAD. Make tools/pre_commit_test_gate.py select that file whenever company/pricing/value_based_renewal.py,
      company/pricing/default_belief.py or company/pricing/discovered_price_sensitivity.py changes, using
      a selection alias rather than a rename. The ruling forbids shifting cost ONTO prepayment. So declare
      billed_last_year_gbp, unpaid_bills_by_age, default_belief_rate and payment_method in the control, each
      with its observable argument. Replace the word-ban test with the property: no CLEAN account is priced
      higher for its payment method. Check it at real inputs on both renewal_default_belief settings, with
      learn_price_response on and off. Remove any clean-account method shift on the segment_table path.
      The own_book flip's release condition is MET: the probe_capped files exist and 3475058ef is on origin.
      Flip DecisionPolicy.renewal_default_belief to own_book only once the Grading section of
      docs/staging/records/SEAT_PREREG_THE_CHOICE_IS_HELD_DOWN_BY_A_TOO_STEEP_BELIEF_SO_LEARN_THE_SLOPE_UNDER_THE_DEFAULT_2026-10-03.md
      is filled in on origin/main. Until then, record in SEAT_FINDING_THE_RENEWAL_PRICE_NOW_CHARGES_A_CLEAN_PREPAYMENT_HOUSEHOLD_MORE_THAN_A_CLEAN_DIRECT_DEBIT_ONE_2026-10-03.md
      that the flip is held for that grading and for nothing else.
    why: >-
      A director ruling has been unguarded on the default path since e0370bf94, and this item has gone
      two stretches undrawn. The property survives per-method pricing and learned slopes, both of which
      the company now has, and still refuses the shift he ruled out. The flip waits one step because changing
      the default path under the console seat's live pre-registration would leave its L1-L4 unattributable.
      DONE when both tests are green at HEAD and assert the property, the gate selects them for all three
      pricing modules, and a clean prepayment household prices equal to a clean DD one in every setting
      checked. The finding must record either the flip or the named grading still holding it.
