focus:
  - id: the-publisher-has-been-silent-53-hours-and-each-cleared-cause-named-another
    what: >-
      Get a figure onto origin, then account for why three attempts did not. The live refusal in
      `docs/observability/.publish_gate_state.json` is `behind_origin` and NOT a test red —
      `blocking_tests` is `[]` and `citation_at_head` is re-asked now, so do not go looking for a
      failing test. This checkout is 5 ahead / 4 behind and `background/origin_reconcile` refuses on
      two paths that are untracked here while origin adds its own copies:
      `docs/staging/SEAT_FINDING_THE_ALARM_FAMILY_FILES_EIGHT_DISTINCT_NAMES_A_WEEK_AND_CLEARS_ONE_AND_ITS_COLLAPSE_TOOL_HAS_NEVER_BEEN_RUN_2026-09-23.md`
      and
      `docs/staging/SEAT_FINDING_THREE_ALARM_FAMILIES_BYPASS_NOTIFY_AND_HARDCODE_REPEATS_1_SO_THEIR_DOCUMENTS_UNDERSTATE_THEIR_OWN_SUBJECT_2026-09-23.md`.
      For each, ask the CONTENT and not the clock: `git show origin/main:<path> | diff - <path>`. If
      the bytes are equal the local copy is the same document and removing it is not a loss — remove
      it and re-run `python3 -m background.origin_reconcile`. If they differ, land the local copy
      with `python3 -m tools.surgical_land <path> --attempts 8` first, because a merge that
      overwrites an untracked file destroys the only copy. CHECK `ps` BEFORE YOU LAUNCH ANYTHING: a
      `tools.surgical_land --merge origin/main` was already running at 23:24 (pid 1744170) and a
      second is how the fork gets worse. Then, and this is the half that stops the recurrence, file
      ONE finding reading the `failures` list and the wedge clock in the gate state, naming the
      sequence of distinct causes this single 53-hour wedge has presented — a dead test citation,
      then the site lane's three reds, then behind-origin on untracked paths.
    why: >-
      `last_clean_publish` has read 2026-09-21 18:15 UTC for 53.1 hours while the heartbeat
      published "alive" three times in the last 3.1 hours alone, and every other item in this record
      ends in a figure a reader can see, none of which can move while this is shut. DONE is
      `last_clean_publish` past 2026-09-21 18:15 UTC with the churn-belief legs visible on the
      capabilities page — a figure on origin, not a green suite. The finding is part of DONE and not
      a nicety: three causes in one wedge is a claim about the publisher's preconditions rather than
      about any instance of them, and an unwedging with no account of why it wedged is the third one
      this week.
  - id: the-size-term-contrast-has-no-paired-floor-and-the-run-that-builds-one-is-eight-hours-in
    what: >-
      `python3 -m tools.size_term_paired_floor --seeds 5101,5102,5103,5104,5105,5106` has been
      running since roughly 15:18 (pid 3794281, 8h06m at 23:24), with a leg live under it. DO NOT
      RELAUNCH IT — eight hours of compute are already paid for, and a second orchestrator shares
      the cgroup that does the OOM-killing at a measured leg peak of 8.0-8.3 GB against the file's
      own 8,400 MB bound. Block on it with `python3 tools/wait_for.py` naming that pid, then land
      `docs/observability/value_cycle_size_term_paired_floor.json` (its `--out` default; per-leg
      shards are under `/var/tmp/se-floorrun-paired-20260923/docs/observability/`, and
      `--report <path>` prints a finished one without re-running anything) and state on the arms
      surface whether the size-term contrast clears its own PAIRED floor or cannot be told apart
      from it. The contrast is `fc390b918`'s published before/after at one seed each: gross margin
      -9,299 to +12,152, net margin advantage 14,074 to 13,440, enterprise value 6,143 to 7,642. If
      a leg has died or been OOM-killed, do not silently publish the survivors as if they were six:
      say which seeds completed and publish the width their count earns, with the bound it earns.
    why: >-
      The thesis says the advantage must come from inference and that there has to be a baseline to
      beat, and this is the ruler for the largest movement our belief has made this month. Every
      floor in `docs/observability/` measures the spread WITHIN one configuration; this claim is a
      DIFFERENCE BETWEEN two, so none of them can price it. The published floor is degenerate on top
      of that — `SEAT_FINDING_THE_NARROW_WIDTH_BEHIND_THE_PUBLISHED_SELECTION_SIGN_IS_A_REPEATED_DRAW`
      (BLOCKING) establishes 5 of its 18 draws are repeats and `sd_X = 1311.96` makes the narrow
      width a property of the instrument, not of the world. DONE is the paired width published beside
      the contrast, or the words "we cannot tell" published in its place with the reason — both are
      results and only one of them is currently on the page.
  - id: the-churn-knee-finding-and-its-ledger-row-both-describe-a-tree-that-has-moved
    what: >-
      Re-grade `docs/staging/SEAT_FINDING_THE_PUBLISHED_CHURN_KNEE_IS_GBP_3000_AND_THE_CODES_KNEE_IS_GBP_0_1_2026-09-23.md`
      (BLOCKING) against HEAD rather than against the `0637be0f1` it was written at. Its measurement
      table is refuted: `docs/observability/churn_belief_size_response.json` now reads
      `the_belief_is_flat_below_a_knee: false`, `first_departure_from_flat_kwh: 1.0` at every probe
      rate and a deaf edge at 22,263.7 kWh / GBP 3,339.6, and `site/data/value_arms.json` carries
      that block regenerated at 2026-09-23 22:41. Settle it by running
      `python3 -m tools.published_feed_regeneration_check` — background it, it does not finish inside
      two minutes — and then either drop the finding to RECORDED beside its own claim or name in it
      what still diverges of the 35 keys it reported. Separately, bind the draw-ledger row
      `the-refuted-bill-stress-knee-is-unbounded-beside-a-saturating-size-term`, which still reads
      `not_done`, to `3b01193a8` ("the refuted bill-stress term is bounded to the only published
      measurement of distress-driven switching", 2026-09-23 17:54) with `--landed-under`.
    why: >-
      A BLOCKING finding is a wall for every lane whose file_scope touches the churn belief, and this
      one is a wall built out of figures that no longer exist — it says the code's knee is GBP 0.1
      when the code has no knee at all and says so in its own artefact. The ledger row is the same
      error in the other instrument: the work landed 4h20m after that row's window closed, so the
      draw records as undone something that is at HEAD, and the next draw will hand it out again.
      DONE is the finding at RECORDED or re-stated in today's terms, and the ledger row bound to the
      commit that spent it.
  - id: OPS8_last_known_good_staleness_banner
    what: >-
      Move OPS8 off level 0, using the case that arrived this stretch. `site/data/tick_heartbeat.json`
      and `docs/observability/agent_status.json` published "alive" three times in 3.1 hours while
      `last_clean_publish` had not moved for 53 hours, and a reader of the front door cannot tell the
      difference. Put the age of the figures beside them: have the publish path
      (`background/process_run_complete.py`, which is already in this atom's file_scope) carry
      `last_clean_publish` into the feed `site/index.html` reads, render it as a dated
      last-known-good line stating how old the figures are, and write the site door that FAILS when
      the banner is absent or when its date is the render's own clock instead of the publish's.
      Ask the map's headroom before you write the level row, not after: 5,844 bytes at 23:24 against
      a median map commit of ~695 bytes.
    why: >-
      This atom is a director ruling sitting at level 0, aiming at 2, with no control ever written —
      and the behaviour it was minted to prevent ran live on the public surface three times this
      stretch. "Fail closed and say so on the surface" is the rule; a heartbeat that says alive over
      two-day-old figures says the opposite, and it is the one claim on our site a reader can check
      and find wrong. It sits last because rank 1 is what makes any figure move at all and this only
      dates what moves. DONE is a dated banner on the live front door, a door that can fail beside
      it, and OPS8 recorded at level 1 or above.
