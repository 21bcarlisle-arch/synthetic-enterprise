focus:
  - id: c2-a-departure-carries-a-cause
    what: >-
      **Lane 0. Build C2 to the design and the preregistration that are already committed** —
      `docs/design/C2_DEPARTURE_WITH_A_CAUSE_DESIGN.md` and
      `docs/staging/WORKER_PREREGISTRATION_WHAT_A_DEPARTURE_WITH_A_CAUSE_MUST_SHOW_2026-08-30.md`.
      Nothing here needs another design pass; the trap has already been found and written down.
      Replace the composed form in `simulation/renewals.py` — `p = p_base · Π m_k`, rolled once —
      with the competing-risks form the design specifies: each RISK carries its own hazard, survival
      is `Π (1 − p_k)`, the cause that fires names the departure, and the MODULATORS in §2 scale
      risks and never become risks (`market_switching_multiplier` is a modulator, and §2 says why:
      at 0.444 in 2022 it would otherwise be a cause that made people leave *less*). Work in the
      order §5 fixes and **do not reorder it**: (1) fit `a_k` so population-mean realised churn
      matches today within ±0.5% relative — until that holds nothing else in the preregistration is
      readable; (2) re-establish the anti-goal-seek guarantee `m(d)·m(−d) == 1` at the population
      mean, and note the design's own warning that a naive rewrite is predicted to BREAK it, so if it
      passes first time distrust the test before you trust the code; (3) only then look at P1, P3, P6
      and last of all the reason mix P2, across seeds and never off one run — there are 40 departures
      in a decade, eight per cause. Honour §3's constraint literally: **hazards are functions of each
      household's state, never constants**, because constant hazards reproduce the input weights as
      the output reason mix and would satisfy P2 while measuring nothing. Then mark every prediction
      in the preregistration beside itself, right or wrong, the way A46's four were marked this
      morning. The twelve readers branching on `event_type == "churned"` are the compatibility
      surface: the schema has to carry a reason without breaking them, and it has to generalise to a
      departure that is not a renewal, because that is what C1b will hand it next.
    why: >-
      First because it is the binding constraint on everything this project measures, and two
      independent lines of evidence landed on it this morning. The director's brief states it as the
      whole of the thesis — a supplier's central commercial question cannot be asked in a world where
      a household leaves because a number came up — and the drop-out funnel says the same thing from
      the other end: **zero of the fourteen unscored decisions are recoverable by us**, so the sample
      that grades our inference cannot grow by any amount of work on our own code. It grows when the
      world gets richer, and C2 is the step the roadmap's own amendment identifies as the one that
      has to come before the assignment (C1b) that widens the priced surface from 25 renewals to
      roughly 70. It is also the step with the highest chance of going quietly wrong, which is why it
      is worth the first slot rather than a later one: `1 − Π(1 − p_k) ≠ p_base · Π m_k`, so churn
      rates *will* move, and a move that is not predicted in advance is a move nobody can attribute.
      Everything needed to make it attributable is already filed. **Done means:** the competing-risks
      form landed in `simulation/renewals.py` with a cause named on every departure; P0 calibration
      holding within ±0.5% relative and stated; the `m(d)·m(−d) == 1` guarantee re-established with a
      test that can fail; every preregistered prediction marked beside itself including the ones that
      refute me; and the reason mix reported across seeds against the published mover-mix as a CHECK
      and never as an input. If P0 will not calibrate, that is a result — say so, keep the prediction,
      and leave the composed form standing rather than shipping a half-rewrite.
  - id: promote-the-funnel-artefact-and-publish-the-drop-out-split
    what: >-
      The run finished. `docs/observability/value_cycle_ab_s1_three_arm_20260830.json`
      (`generated_at: 2026-08-30T05:32:11Z`) carries `method_skill.drop_out` and
      `belief_vs_outcome.scored_decisions`, and `site/data/value_arms.json` — regenerated at 07:21Z,
