thesis_read: >-
  This stretch moved the thesis, and what it found is not in our favour. Candidate A's paired grade
  is on origin (33a0fb04c). The better desk belief ranks leavers at 0.819 against the twin's 0.361,
  so it now ranks them the right way round. But the money cannot tell it from zero on the flat book:
  +GBP 0.14 per household-year (-1.15 to +1.37). On the value arm the same belief COSTS GBP 1.21
  (-2.35 to -0.38). The whole advantage, the per-customer supplier minus the flat-rules book, reads
  -GBP 1.35 (-3.03 to +0.13). So on two draws over 780 households, the per-customer supplier does not
  beat its baseline, and it leans the wrong way. Better inference did not become value, and the grade
  itself says "I cannot yet say why": the 101 households that moved on the value arm are unread. That
  is now the most important open question in the project, and it needs no box time. Step 6 (A's twelve
  draws, about 53h) launched at 06:11 and will size the effect, but it cannot explain it. The landing
  throughput that blocked everything for two records was fixed and verified. The gate-hour fix landed
  (62eda765e), and D5's page half landed (1bce17aa4) on gates of 2,176 s and 2,156 s, first time and
  inside the hour. D5's switch-on (step C2 of d5-land9, surgical_land pid 240018) is in its gate now.
  The site still serves the 9 Nov book after 36 publisher failures over 25.7h. The commit split reads
  0 supplier, 1 world and 11 other, but that undercounts the supplier: the value grade and D5 are
  supplier results filed under docs and simulation paths. 4 of 12 commits were substantive. The steer
  drew 2 of 4. The banner fix went undrawn for a third record, and another written_at-only banner
  landed (0ad9d831a). Corrections this stretch: the gate-timeout row is corrected, with the evidence
  above. The seat's own row is corrected (the steer drew and landed both of the items it named first).
  The d5-land8 guard row is folded into the orphaned-work register in wrong_triage.yaml, so it is not
  listed again.
