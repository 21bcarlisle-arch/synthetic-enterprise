  - id: say-what-the-ceiling-is-and-price-what-this-book-can-settle
    what: >-
      Two halves of one job, both on `site/data/value_arms.json` via
      `tools/generate_value_arms_data.py`. FIRST, say what the quantity the page calls "the ceiling"
      IS, or stop calling it one. It is the world's logged `realized_churn_probability` — the base
      its roll starts from, before the passive cap, switching multiplier, price position, income
      stress and satisfaction that actually decide who leaves — and this stretch it did three things
      a bound cannot do: failed to clear while the belief it supposedly bounds cleared, crossed the
      belief under pooling, then cleared on the second roll while the belief did not. Give it the
      name it has earned, on the page, with the crossing stated. SECOND, state beside the withdrawal
      what book WOULD settle per-customer discrimination here. Do not publish a finite answer unless
      the gap's sign is determined: it INVERTED between two draws, and a requirement inverted from a
      spread over an undetermined centre has no upper bound, so "no finite book settles this from
      this estimate, and here is why" is the honest publication if that is what the arithmetic says.
    why: >-
      "Before measuring a thing, say what it is" is this project's most expensive recurring failure
      and the ceiling is now a live instance sitting on the headline block: we published a quantity
      as a bound and it spent the stretch failing to bound anything, and the panel already declines
      to claim it is the live world's signal without saying what it is instead. The second half is
      what the withdrawal owes its reader — told that the belief cannot be shown to order
      departures, the first question is whether that is the company's failure or the book's, and 102
      to 138 renewal decisions carrying 41 departures may be a book that cannot answer either way.
      That is a finding about the whole programme, not about one panel. DONE is: the page names the
      quantity for what it is with the crossing stated, and the withdrawal carries a settlement
      statement — a bounded book size if the sign is determined, and the explicit unbounded answer
      with its reason if it is not.

