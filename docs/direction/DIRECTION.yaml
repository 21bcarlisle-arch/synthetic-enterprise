thesis_read: >-
  Forward against the thesis for the first time in about two weeks, though only on the precondition. A book has
  passed the publisher's gate. 6fe7827ab2 carries the close-refund fix (s.8.8c, s.8.8d) and D1, and it was graded
  through grade_one.sh alone (2e401fe1f). All 15 pre-registered rows held. INV_REFUND_WITHIN_THE_PAGE_CREDIT went
  from 205 to 0 over 176 lines, closed-account breaches are 0, D1 is 0 of 6,385, and the level-DD cures read 113
  against the map's pre-registered 112 to 120 (6073fee79). So the Class L refund row is corrected. The eleventh
  cold read ran on that book (ab2700c1e). Exit leg one is met for the first time. Legs two and three are not: N28
  (narrated facts the data contradict, such as "your first electricity bill is ready" sent to a 2017 account) and a
  new serious class, N29 (a closing dual-fuel household refunded on one fuel while it owes on the other: 48
  households, GBP 3,786.62 refunded against GBP 5,662.78 owed). The published net margin and arrears count are
  corrected on the producers (601929ce0). The rate is withheld with a "We cannot tell" reason, and arrears moved
  to Ofgem's 91-day definition (705 to 50 of 1,293), with a control keyed to the property. Two things have not
  moved. First, NOTHING HAS BEEN PUBLISHED. The book was "offered" and its marker archived at 16:05, but the site's
  run figures are still 0a6391d186's from 3 Nov ("figures last moved 207.6h ago"), and the grade commit's NEXT
  handed the publish to a sweep that has not done it. The early-publish commitment is now about two days late.
  Second, the 15:20 direction record did not reach origin either (the seat journal at 15:45:52 reads "committed":
  false). That is two records in a row, and origin still shows 09:22, so the advisor is relaying a stale steer.
  Previous focus: 3 named, 2 drawn. The book item and the margin item both finished and leave focus. The
  direction-record item was never drawn (it was promoted to a continuation at 18:25), so the steer itself is
  drifting and it moves up. The commit_split (0 supplier, 1 world, 9 other) is literally true, but it misfiles
  the stretch: 601929ce0 is the supplier's published accounts, and ccdfb652d is billing correctness that lives in
  simulation/. ccdfb652d (repayments dated on their cash day) took the level-DD holds from 113 to 71, and it
  measured the queued level-dd-part-repaid-holds premise as false before building. The cross-arm question is
  answered (80f4d4ff): the 23 breaches are an older run's refund sizes read against a newer walk, and the pages at
  ccdfb652d7 over this book read 0 and 0. The 18:10 reading (44%, 0.65/h since noon) pauses W3_3 until the Mon 16
  Nov reset, and that is recorded here. Correctness keeps its claim: publish, then N29, then N28. The flat-baseline
  comparison (c65c4cb8b) finally has a passing book to run on. It stays out of focus only because the ban on model
  arms holds this week. It is the first thing the 16 Nov review should take, because that comparison is the thesis.
