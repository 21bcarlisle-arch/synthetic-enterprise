  - id: a-save-offer-is-not-paid-for-by-the-stayers
    lane: B_commercial
    what: >-
      Wire the reactive save on the loss notice (the shape 0f1fb3f6a graded as the only one that
      beats never offering) into the settled run, behind a curriculum switch that is off by
      default and byte-identical when off. It reads the Invitation to Intervene from 4805420bd
      and the save and win-back toggle ranges from f418eff9e. Then run the director's two
      fairness checks in the minutes tier at both ends of the save-rate range. First, the
      stayers' prices with and without save offers, account by account. Second, a vulnerable
      customer's offer against a non-vulnerable customer's in the same position. Pre-register
      both before the run. A save offer may vary by acquisition route or time on the default
      tariff, and a renewal price may not. Add a control for each rule that reds if a stayer's
      price moves with saves on, and if a vulnerable customer gets less. Record the SLC 22B
      reading from f418eff9e beside the result.
    why: >-
      This is the thesis's first inference-beats-flat-rule result, and the director made it
      conditional: a save must never be paid for by raising the price of customers who stay.
      Until that is shown in the settled run, the 0f1fb3f6a answer cannot be published. DONE
      when the switch, both checks and their controls are on origin, and the finding states,
      at both ends of the save-rate range, whether the reactive save still beats never offering
      in the settled run. If the answer turns on a number, the finding says which.
