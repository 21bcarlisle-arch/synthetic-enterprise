  - id: a-stamped-refusal-is-re-asked-against-the-ref-before-a-reader-sees-it
    what: >-
      Make the publisher re-ask a stamped refusal against the remote ref for the commit it names, at
      READ time, before any reader is shown it. The live instance to fix and then to use as the
      control: liveness_surface_refusal in docs/observability/.publish_gate_state.json currently
      holds cause push_never_landed with git_hash 3cc6e2065 and evidence naming push rc=1 and
      origin=2d0d1f96b, while `git merge-base --is-ancestor 3cc6e2065 origin/main` succeeds — the
      commit did land and the surface says it never did. Key the control to the property, not to
      today's answer: a refusal whose commit is reachable from the remote ref must not be displayed
      as a live refusal, whatever the stamp said at the instant it was written.
    why: >-
      This is a carried row on its FIFTH consecutive rotation and the first stretch it can be
      demonstrated rather than asserted: it held push_never_landed for 7bcf2518f, then behind_origin
      for 2630b9770, then null, and now a value that is provably false as displayed. A refusal true
      at stamp time and false at read time is the shape that has repeatedly made the seat's own
      orientation believe the publisher was refusing during a working publish, and it is cheap — one
      re-ask against a ref — where the rest of the carried publisher work is not. It earns a slot
      ahead of the other machinery precisely because the flattering-reading problem is now a concrete
      falsehood on a surface. DONE when a landed commit's stamped refusal cannot be shown as live,
      proven by a control that fails if the re-ask is removed.
