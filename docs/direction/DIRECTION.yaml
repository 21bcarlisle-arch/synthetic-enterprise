  - id: independent-bill-validation-first-slice
    what: >-
      **Start the director's bill-validation brief
      (`docs/staging/DIRECTOR_BRIEF_INDEPENDENT_BILL_VALIDATION_2026-09-02.md`), and start it at the
      raw export and the curtain — not at the comparison. One account, end to end.**

      He fixed six properties in §4 and handed the rest of the design to this seat, explicitly
      inviting us to replace the shape if we have a better one. My sequencing decision, and the
      reason: **items 1 and 2 of his own "work this creates" list are the raw export and the
      statement export, but the property that is hardest to retrofit and cheapest to establish now is
      the curtain.** A validator built first and walled second will have already inherited a shared
      concept, and no later test can un-inherit it. So build in this order:

      1. **The curtain, proved the way a wall is proved.** A validation package that structurally
         cannot import `company/` or `saas/`, enforced by the same machinery that keeps `company/`
         off a socket — refused by construction. The control must be mutation-proven: an edit that
         lets it peek has to turn a named test red. Reuse the existing import-graph machinery rather
         than minting a new one — `background/publish_scope.py` already walks an import graph and
         `tests/architecture/` already holds layer controls; run
         `python3 tools/write_time_gate.py --explain` before writing any new module and put the
         result in the REUSE block.
      2. **The raw export, with the refusal that makes it raw.** Reads with their date and type,
         tariff terms with effective dates, payments as received, adjustments with reasons, and the
         issued bills as documents. **Nothing derived** — property 1 says the check must refuse a
         derived field, so write the refusal so it *names what it refused and why*, which is how you
         find out the refusal itself was wrong. Ask the epistemic-wall question of every field:
         `company/interfaces/sim_interface.py` is the seam.
      3. **One account rebuilt from that export and the published rules in
         `docs/domain_artefact_library/`, compared against what we claim, every difference filed.**
         The validator wins by default. Where it loses, that is a finding about the rules, the
         export's completeness, or an ambiguity in a concept — file those too, they are the ones
         worth most.

      Then stop and let the next stretch take the statement export and the schedule. **And write
      §6 — the plain statement of what this cannot catch — as you go, not at the end.** The
      director already named the residual honestly: a domain assumption the validator shares with
      the biller. **We have a live, dated example to put in it** — the half-month direct debit,
      correctly measured, correctly sourced, and wholly wrong in frame until a practitioner said so.
      Name it by name in that section. A claim of independence that does not state its own hole is
      the thing this brief exists to stop.

      **Done means:** the curtain exists and a mutation against it fails a named test; the raw export
      refuses a derived field with a reason; one account is reconstructed and every difference is
      filed as a finding about the biller; and §6 names the residual risk with its worked example.
      If you conclude the two-export shape is wrong, say so and build the better one — that is
      explicitly invited, and it is a finding either way.
    why: >-
      This is the director's newest direction, delegated for sequencing rather than for approval, and
      it is the item that changes what everything else in this file is worth. The DD estimate above,
      the shock split, the anchor work — each is arithmetic checked only against arithmetic by the
      same hand, which is the exact pattern that produced a rate spanning thirteen periods of money
      over one of volume and a baseline differenced against a bill 63% of the book never received.
      It also serves the thesis directly: bill validation is a real GB service, a supplier that
      cannot produce an auditable export of an account's life is not a credible supplier, and
      independent reconstruction is the only thing that can tell value created from arithmetic that
      merely agrees with itself. Ranked third only because the two items above are short and one of
      them is holding finished work hostage; if a tick reaches this at all, this is where the stretch
      actually pays.
  - id: the-slc-27b-citation-does-not-exist-and-is-published
    what: >-
      **Correct the "SLC 27B" attribution everywhere it appears, and give the ±5% band the origin it
      actually has. This is the second instance of the class, so fix it as a class.**

      `docs/staging/SEAT_FINDING_THE_DD_REVIEW_BAND_CITES_A_LICENCE_CONDITION_THAT_DOES_NOT_EXIST_2026-09-02.md`
      establishes from Ofgem's own material that **there is no SLC 27B** — the direct-debit
      provisions are 27.13–27.16 inside SLC 27, the nearby lettered conditions are 27A (prepayment)
      and 28A/28AD, and no ±5% band appears in the licence at all. The operative provision, SLC
      27.15, is an information-quality duty with no numeric trigger; the only published numeric cut
      is Ofgem's **100%** re-review requirement from the 2022 Direct Debit Market Compliance Review,
      which is an enforcement instrument, not a licence rule.

      The finding says four sites and one page. **I grepped the tree this orientation and it is
      wider than that** — `company/billing/dd_review.py:15`, `company/billing/dd_review_runner.py:5`
      and `:48`, `company/interfaces/dd_review.py:36`,
      `company/interfaces/dd_review_outcome.py:23`, `simulation/run_phase4c_on_phase2b.py:311`,
      `saas/bill_generator.py:70` and `:74`, plus **three published pages**:
      `docs/market_research/what_bill_shock_is.md:59`,
      `docs/market_research/satisfaction_drivers_and_the_three_bill_shocks.md:151`, and the new
      research page's own account of it. Correct the finding's count in the finding, beside the
      original claim, rather than quietly.

      **The ±5% itself is not fabricated and must not be deleted** — it is a real and widely used
      supplier review convention and the code applying it behaves sensibly. What is wrong is that a
      modelling convention is wearing a regulation's clothes. So: cite **SLC 27.15** for the duty,
      declare the ±5% as a modelling convention with its own origin under
      `tools/domain_constant_origins.py`, and state on the surface that the licence names no numeric
      trigger. If the published record establishes no source for ±5% as a *convention* either, that
      is the honest answer and it goes on the page — a convention named as a convention cannot be
      misread the way a false citation can.

      **Then close the class, not the instance.**
      `docs/staging/WORKER_FINDING_THE_STANDING_CHARGE_IS_FOUR_DECLARATIONS_AND_A_CITATION_THAT_CANNOT_BE_CHECKED_2026-08-31.md`
      is the same shape and is still staged. Two instances is a class. The rule already exists —
      *a money constant citing a source must be reached* — so ask what a control keyed to **the
      property** would look like: a cited authority that cannot be resolved in the commons is a
      refusal, not a comment. Key it to the property, never to today's list of bad citations, or it
      goes green the moment someone invents a new fictional condition.
    why: >-
      A number sourced to a condition that does not exist can never be verified and will never be
      corrected, and every downstream reader inherits confidence nobody earned — this one has
      already reached eight code sites and three published pages, one of which we serve to readers as
      research. It is also the second instance of a class with a rule already written for it, and the
      rule did not catch either, which means the rule is prose where it needs to be a refusal. Ranked
      last because it corrects an attribution rather than a behaviour: the ±5% band produces the same
      decisions tomorrow either way, whereas the three items above are respectively unlanded work, an
      unmeasured claim, and the thing that tells us whether any of our arithmetic is right.
