thesis_read: The director ruled at 06:46, and his rulings change the frame more than anything built this stretch. Retention in GB is saves on the loss notice and
  keeping home movers, not blanket renewal cuts. That retires B8's uniform-cut frame, which had found no cut size that pays, and points the thesis's retention test
  at targeting a leaver, the place where inference could beat a flat rule. That test needs the Pending notice, and last stretch's focus two established honestly that
  its lead time is not published (re-searched Ofgem, DCC, Energy UK, RECCo, ElectraLink), and stopped as told. So the frame is right and its first observable waits
  on a practitioner figure. It is raised with a conservative default, and the default lets the build proceed. Home moves are on (ada37371c), with the change-of-tenancy
  debt still the occupier's at 28 moves in a small run. The founder raise to 400 is approved and waits only on pricing a ~5,000 customer-year budget (the ceiling
  probe at 2,800 and 3,400 is running). The baseline got clearer. The flat control arm takes the elasticity draw for every renewing account, as the value arm does
  (6a857a21d), so the comparison is fair by design, and the floor needs nine seeds. W2_20 on its own takes 12 gas legs and 7.7% of gross margin off h's control arm
  over the decade (75bbed5bd), and that size is queued onto the headline. The world moved forward in one place and is still short in another. The gas-heated home
  now has SERL's season (839806aff), but its evening peak is 0.32 kWh/h too high, so the published ratio is still out of band. That reading sits uncommitted in the
  shared tree, with the lead-time section beside it. Landing both comes before new work. The 48ce3a9 salvage in /tmp/wt-gaslevel holds only an owner file and is disposable.
  Nothing went backwards. Both previous focus items were drawn. One was finished to its honest stop and is unlanded. The other was half done and is still first. The
  brief counts 10 commits and 4 substantive. Two were empty base-advance merges. The draw ledger miscredited the ceiling retake by path once more.
