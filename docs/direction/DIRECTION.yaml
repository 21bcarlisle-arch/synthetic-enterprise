      The only thing the brief directly asks, and it is cheap -- which is exactly why it does not
      need a focus slot to happen. Four causes are already established and all four came out
      different, so this is one more instrument reading rather than a level move or a closed
      blocking finding, and the rule is to prefer the latter.
