      place by other lanes.
    why: >-
      4 of this stretch's 12 no-work commits were heartbeats. The fix is already written, so an
      unlanded fix is the cheapest harness win on the board, and leaving it in place makes it
      another dirty path pinning the tree. DONE when the function is on origin with its
