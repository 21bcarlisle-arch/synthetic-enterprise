thesis_read: >-
  Against the thesis the project stood still on the one test that matters. It moved on the precondition for showing
  it. There is still NO valid comparison of the per-customer supplier against the flat-rules baseline. The void
  etarms chain was stopped and recorded (a0c9d51f1, 09:36Z), which corrects last stretch's worst error. But fix
  0, moving FTC_WITHDRAWAL_WINDOW's start to 2021-10-01, has still not landed: origin/main still reads date(2022,
  1, 1). So the rankq re-grade the director ruled for at 05:47Z cannot launch, and its continuation will release
  on sight. I ordered it third, and that was my error. It goes first now. The publish wall moved substantially,
  and all of it was supplier billing work. EBSS is keyed to its classes and both exceptions are retired (5e63e640e).
  The estimate row now grades the blended quote (204b68cca). The gas repeats were five PROS legs outside every weather
  cell (9ed3dc978). And a credit bill's note is now its own leg's cash (91c32797b). A book at 91c32797b3 is building
  now (run_annual_report, started 12:24Z). It is predicted to refuse on only two rows: SYN-2016-099's page, where
  470513f81b found the desk's 1.30 is right and the page is wrong but no fix has been built, and PROS-2023-0338g's
  closing refund, which waits on the N29 set-off. So the site has now shown 18 Nov for eight days, but the remaining
  wall has two named causes, not six. S1 (contract the first term at its quoted strike) landed as a1eee4d92, behind
  its switch. The commit split was 2 supplier, 2 world and 7 other. The split mislabels 204b68cca's billing-invariant
  work as other, and two of the world commits (the weather cells, S1) serve supplier results, so the balance is
  acceptable. Two director commitments due 2 Dec, the forward bands and the K8-for-world one-leg test, have no queue
  row at all, and nothing draws them. That is drift, so they enter focus now, last.
