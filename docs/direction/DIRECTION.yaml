  - id: the-svt-route-still-cannot-see-the-market
    what: >-
      **Give `svt_inertia_hazard` a parameter the market can arrive through.** Unchanged again this
      orientation: `simulation/departure_risks.py:175` reads
      `def svt_inertia_hazard(*, years_on_svt: float, segment_days: float)` and nothing else, while
      `market_switching_multiplier` — the record's own level ratio inside 2016-2025 — is live in 22
      modules and carried by every renewal-route hazard. **Read that existing mechanism and reuse it;
      do not mint a second one.** `tools/fit_year_level_anchor.py:299-355` already holds the refusal,
      keyed to the property by inspecting the signature's parameter names, so it lifts by construction
      the moment a market parameter exists — which also means it cannot be satisfied by a term that
      does not actually reach the hazard.
      **Read `18a09617d` on `origin/main` before anything**: three predictions filed before measuring,
      all three confirmed — Spearman **-0.26** between the SVT floor and the published midpoint
      2017-2024 (near zero, wrong sign); at the bottom of both published bands 2022's floor is still
      **8.99%** against the record's **4.30%**, needing the pair scaled to 0.354x where the band
      bottom is only 0.750x, so it is a mechanism result and not a constant at the wrong end; CV ratio
      **0.336** where the record swings **5.3x**.
      **Knowledge first, and the world's own source already answers it.** `svt_rates` §3 —
      *"customers did not voluntarily churn: no competitive fixed alternatives existed"*. Establish
      from `docs/domain_artefact_library/` and `docs/market_research/` what the published record says
      suppressed switching in 2022 — whether there were acquisition tariffs to switch **to** — and
      write it down with its source **before any term is written**.
      **Pre-register the predicted MOVE per year, never an invariance** — an invariance measured on
      the old code embeds the defect being removed, and this project has paid for that class. Grade on
      `tools/departure_population.book_departure_level`, the one implementation both instruments read.
      Print all ten years at real inputs beside the prediction, not the year you aimed at, and do it
      before you write the test. Then re-run the whole-book anchor re-fit and report whether the
      refusal lifted.
      **Never a widened band, never a clamp on 2022, and it must not finish with a fitted constant.**
      Two things do **not** happen in this commit: re-pointing
      `tests/architecture/test_switching_rate_commons.py` off its renewal-only subject, and repairing
      `population_anchor._churn_by_year`'s blindness to 2022 by inserting a `sim_churn_rate` of 0.0 —
      that publishes a measured zero-churn crisis year; fail-close its five arithmetic consumers
      instead.
    why: >-
      Second, and it is first in value — the only item here that moves fidelity rather than the
      machine's own plumbing, and it has now been below the plumbing for five consecutive
      orientations. I said last time that a sixth would be my drift and it is; the one thing I will
      not do is let it slip again by ranking something ahead of it that is not measured in minutes.
      The thesis requires advantage from inference about a world that can press back, and the route
      carrying **61%** of departures runs the same numbers through the 2020 switching peak and the
      2022 collapse alike, so every belief graded on that population is graded on a mechanism the
      record contradicts most sharply in the year it makes unmistakable. It blocks real work now:
      with both routes sharing one anchored total they are zero-sum, so the SVT route's market error
      lands in the renewal anchor — 2023's floor consumes 12.43 of the 12.50 available and the fit
      returns **0.03**, near-total extinction of the one route the company can price against. And the
      anti-flattering tie-break that put the SVT floor at the top of its band **became a flattering
      choice** the moment the denominator was unioned, because a higher SVT floor hands the company
      less churn on the route it can price. **Done means:** the record's own account of 2022 written
      down with its source before any code; the predicted per-year move filed before the run; the term
      landed **and on origin**; the ten-year table printed at real inputs beside the prediction; and
      2022 either inside its band for a stated mechanical reason **or explicitly still out with the
      reason named on the surface** — *"the world departs 12.09% in a year the record says 3%, and
      here is what we have not modelled"* is an acceptable and better finish than a number that fits.
  - id: the-executor-can-never-reach-a-focus-item-because-a-seat-is-always-live
    what: >-
      **I diagnosed the wrong layer last orientation. Read `background/seat_executor.py:355` and the
      comment block above it before deciding anything.** The guard is
      `if _interactive_seat_is_live(now) and not _is_handed_off(item, now=now)`. The comment records
      that this was already narrowed on 2026-08-31 from presence to contention — **for continuations
      only**. A focus item is explicitly excluded from that narrowing and still stands down on a warm
      heartbeat alone. **`_interactive_seat_is_live` is true whenever any session is running, and one
      always is** — including the session that writes this file. So a focus item is not "sometimes
      declined"; it is **structurally unreachable by the executor**, and the six identical stand-downs
      I named last orientation are now eleven consecutive
      (`docs/observability/seat-executor-log.md`, 23:35 through 05:05, fifteen in the file), the last
      six naming my own top item. My instruction said "the guard's termination is missing". It is not
      missing a termination; it has no reachable path.
      **Take the decision and record it.** The recommendation is to make a focus item reachable the
      same way a continuation already is — by **writing the handoff at derivation**, so
      `direction.unreachable_focus` produces a claimed handoff a later tick can take rather than an
      unclaimed decision that always loses to a live heartbeat. Choose otherwise only with the reason
      written down; **do not** choose "escalate after N declines", which is a stall wearing an
      alert's clothes. If contention is genuinely the worry, `seat_work_in_hand.refuse_if_duplicated`
      three lines below is already the mechanism that answers it, on paths rather than on presence.
      **Key the leg to the property**: *a focus item the executor re-derives is reachable by some
      tick*, not *"this item is stuck"*. Build the fixture with an explicit heartbeat time, never
      wall-clock `now` — a fixture built from `now` has a red window and self-heals before the drawn
      worker arrives. Mutation-prove it: a leg that cannot go red against eleven identical stand-downs
      is not a leg. **No register of stand-downs** — a reachable path and one control is the whole
      mechanism.
    why: >-
      Third because the evidence still says work reaches the trunk by other routes — item one moved
      this stretch without the executor ever taking it — so this degrades the steer rather than
      severing it, and fidelity outranks it. But it is the fifth consecutive orientation reporting
      focus items named and `previous_focus_drawn` reading empty, and each repair has revealed the
      next gate rather than a working route: first nothing converted a focus item to a handoff, then
      the brief read the shorter history, then the conversion existed and declined to fire, and now
      the decline turns out to be unconditional rather than cautious. **The pattern itself is the
      finding**, and this is the layer where it stops being a mechanism problem and becomes a claim
      the code makes that is not true: the executor's own comment argues it stands down on *possible*
      contention, and it stands down on *certainty of a heartbeat*. **Done means:** the decision
      recorded with its reasoning either way; the chosen mechanism landed on origin; one
      mutation-proven leg keyed to reachability rather than to any item's name; and
      `seat-executor-log.md` showing a subsequent tick taking a focus item, not declining it a
      twelfth time.
