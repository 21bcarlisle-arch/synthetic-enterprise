- id: time-is-scored-in-minutes-not-converted-to-money
  raised: '2026-10-04'
  kind: vision
  what: The mission names three currencies, and time does not exist in the model. The C31 frame (70ea47ac5, docs/design/C31_TIME_AS_A_CURRENCY_DISCOVER_FRAME_2026-10-04.md,
    Q1) has to decide whether household time is scored in its own unit or converted to money at a value of time. Converting
    it would fold one of your three currencies into money. The only regulator pricing found (GSOP, GBP 30 or 15) prices failure
    events, not hours, and it is a transfer.
  proposal: 'Score time in its own unit: household minutes, per class (shopping, servicing, recovery, routine admin), never
    summed across classes and never converted to GBP. A GSOP payment stays a money transfer and is not a measure of time.
    This does not block L1, which counts events in minutes either way, so work carries on unless you rule otherwise.'
  status: answered
  resolution: 'Director, 2026-10-12, ''Agree all'' to the fourteen decisions in canon v4 section 15 (staged in e89a7728a;
    docs/staging/DIRECTOR_STEER_CANON_V4_ALIGNMENT_2026-10-12.md, step 4): approved (M3).'
