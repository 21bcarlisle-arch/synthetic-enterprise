      `9fd700366` then made `year_level_anchor` **refuse inside the published record** instead of
      borrowing 2024's value, which is the mechanism that doubled 2022 between the two captures. **Both
      landed at 19:51 and 20:44 local; both captures were taken before that.** Read the owed lists
      yourself in both preregs and in the anchor prereg — do not take this summary as the instruction.

      **(a) File a pre-registration BEFORE the run and after reading nothing of its output.** It must
      state, with directions and magnitudes: whether the SVT sibling is non-empty this time (the
      clean-tree run wrote **2 bytes**); whether 2022 fits and on how many renewal decisions; and what
      the whole-book block's 2022 anchor is against the committed `1.524110`. **This is a genuine
      one-variable step and it is the reason to run it now** — `9a03f3b44` showed the previous pair
      differed by three declared producers and could not attribute anything; those three have now
      collapsed. Predict the MOVE, not an invariance.

      **(b) Run it from a clean extract, not this tree.** `git archive HEAD` into a stem of its own;
      capture to `/tmp/` and never to `docs/reports/`, because `emit_svt_sibling` refuses to leave a
      stale sibling beside a fresh renewal table. Launch under
      `systemd-run --user --unit=<name>` so it outlives its launcher, and wait with `tools/wait_for.py`
      naming its subject and carrying a deadline — **never a hand-rolled `pgrep`**, which matches the
      agent process whose own prompt quotes the subject. It costs about eleven minutes, not hours.
      **Read the run's own `PROVENANCE.txt` line by line and cite every module that differs**, not
      only the one you went looking for.

      **(c) Fail `population_anchor`'s five 2022 consumers closed.** Owed by **both** preregs, twice
      each, never done. **Do not repair it by inserting a `sim_churn_rate` of 0.0** — that publishes a
      measured zero-churn crisis year. Fail the arithmetic consumers closed with a named reason.

      **(d) Grade `9a03f3b44`'s "exactly 2.00x".** It is 3.053619 / 1.524110 = **2.0035x**. The
      mechanism it names is unaffected; the word *exactly* is not earned and the correction belongs
      beside the claim.

      **Pathspec:** `tools/capture_departure_factors.py`, `tools/population_anchor.py`, the prereg and
      finding documents, and `/tmp/`. **Not** `simulation/departure_level_anchor.py` — see below.
    why: >-
      Third and it is the thesis item, placed third for a reason I am stating plainly rather than
      hiding: it is the only item here with **no harm accruing while it waits**, because the blocker
      that made it impossible is now discharged and the eleven-minute cost does not grow. Items one
