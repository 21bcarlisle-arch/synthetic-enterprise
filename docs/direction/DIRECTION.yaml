thesis_read: 'The thesis did not move this stretch. The one supplier commit was small but real. The dual-fuel offset
  (SLC 27.8D) is now on for every standing policy (3d518bdef). It was graded against a rule stated before the read,
  it moves about GBP 250 over a run, and none of that money passes through the back-billing bar. Neither of the
  two items that bear on the thesis was drawn. One is B11''s within-segment term, the only honest test of whether
  per-customer inference beats flat. The other is C34''s production caller. Both were in focus under atom ids, which
  only bias a draw that had already stopped taking both atoms. That was the seat''s error, and the steer itself
  drifted. Both are re-issued below as Lane 0 items. The stretch instead answered the director''s two live questions.
  On ''Is dual fuel sorted?'': of three default-off switches, one went on, one stays off for the budget''s chronic
  heads excess, and one is unwired. On 400 founder households: they fit in memory, but at budget 5,000 they leave
  the campaign no win in any year. That is raised as a reserved concern with a recommendation (019924a77). The machine
  recovered. The shared checkout reached origin at 16:13Z, the publish re-arm is live in the worker, and no NOT_ADVANCED
  has been logged since 15:03Z. The decision probe now writes a dual household''s gas leg (608c0d0fa). Its re-run
  is in flight and is graded at 20:45. The structural reading is sharper than it was at 14:22. Three per-customer
  decisions, C34 advice, C35 sharing and the save offer, are built and have no engine caller. So the only per-customer
  comparison against flat that a run can make today is B11''s ranking. That is why item 1 and item 2 lead. Both
  BLOCKING findings wait on runs. The leaver (HH-EAC) waits on the first run carrying 6208ea6dd, which sim-runner
  starts once the probe frees memory. Crisis bad debt waits on the budget floor (item 3). Two Lane 0 rows the brief
  lists as not_done are spent under other ids. The per-household switch-on landed as f6e23a535, and the dual-fuel
  prereg grade landed under grade-the-dual-fuel-preregs-once-the-19-oct-run-publishes (f00fdb040). Split: supplier
  1, world 0, other 13. Corrected this stretch: the publish re-arm is live, and the shared checkout reached origin.'
