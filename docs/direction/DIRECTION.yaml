    21B.4 duty and the register's design. The chase before the year stays a labelled GAP. Then, in company/billing/,
    add a 21B.4 register. It writes one dated row per account each time a run of estimates reaches 12
    months without an actual read, read from the company's own consecutive_estimated_count. The trigger
    is the licence's own year, not a picked number. It records only. It changes no bill and no read, and
    it needs no world change, so the 2026-10-19 publish stays a one-variable reading. Publish the count
    of accounts a year past their last read beside K2's one-month count on the capabilities page. Add
    one control that drives a run of 11 and a run of 12 estimates through the real path, and asserts that
    both branches (no row, row) are reachable in a single statement. Pre-register the count on the published
    run 2248e3baf before running it. The census says 287 runs on 245 accounts. Explain any difference
    beside the prediction. Do not commit a regenerated ledger.
