- id: b8-the-book-publishes-its-holdout-so-uplift-is-measured
  what: 'B8_discovered_price_sensitivity_holdout is held at L2 by its 21 Oct blind pass: "no holdout row
    closes, so nothing measures the uplift". The 6a588a832f book carries no key containing "holdout".
    Read company/pricing/discovered_price_sensitivity.py, company/crm/renewal_advice_desk.py and company/policy/decision_policy.py.
    Establish whether a holdout group is assigned in the standing run and how (assignment must be blind
