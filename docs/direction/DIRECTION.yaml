for_the_director:
- id: c34-now-ranks-next-best-action-on
  raised: '2026-10-12'
  kind: canon_intent
  what: C34 now ranks next best action on joint value with a no-loss floor on both sides, as ruled (C7, eeb38abc3), and it
    still advises nobody at realistic inputs. Across the C34 finding's own B11-scale inputs (margin GBP 5-30 a month, hazard
    0.5-3% a month, 48 months, advice giving up GBP 2-3 a month and cutting the hazard 0.1-0.3 points), joint value is positive
    in all 18 cases (+GBP 13 to +107) and our side is negative in all 18, so our floor refuses every one. The ranking key
    changed and no decision did.
  proposal: 'Keep both floors, and let an advice action that creates value but costs us travel with a price that shares it:
    the renewal or retention price is set so that our side of that action is at least zero, which is M2''s created-then-shared.
    That is a pricing-lever change (step 5), not a C34 change, so I would build it next week as an atom, knowledge page first,
    and grade it on fresh seeds. If you would rather loosen our floor to ''joint value exceeds what we give up'', say so;
    that one is a one-line change and I would measure it the same way. Measured since: on the world''s book the price can
    only be collected where the renewal sits under the default, so the build must read each account''s headroom under the
    cap, and it reaches 40% of cases; the other 60% need the one-off fee (C35) or the floor change.'
  status: open
  resolution: ''
  evidence: 'docs/market_research/next_best_action_and_cross_sell.md section 6.1; landed eeb38abc3. Measured 2026-10-16, docs/market_research/a_retention_price_that_shares_the_value_an_action_creates.md
    section 4 (18-row table): a rise on a Fixed Retention Tariff (lawful in form, depth unregulated under the SLC 22B derogation
    to 31 March 2027) brings our side to zero in 18 of 18 cases holding the hazard, at GBP 0.01-2.73 a month; 10 of 18 once
    the rise''s own effect on staying is added at the published slope (none of the six GBP 30-margin cases); 0 of 18 on a
    default tariff priced at the cap. The rescue is a transfer: joint value is unchanged. Re-counted 2026-10-17 on the world''s
    own 260 renewals (same page, section 4b): each renewal at its own margin, hazard and staying response, with the rise capped
    at what a stayer is billed under the default. A sharing rise rescues 314 of 780 advice cases (40%), 95 of 192 accounts;
    148 renewals (57%) under no effect, 94 of them already at or over the default. It is set by the default''s headroom in
    the renewal year (2020: 39 of 40; 2021: 4 of 29), not by the slope, which moves the count by 1-3. Measured 2026-10-20
    on the term''s contribution (b8c665948, C34 on arm at c61d8b608, full window): C34 advises 4 of 972 renewal rows; the
    median household contribution is -GBP 3.91 a month and 85.8% of 324 households are negative, so our side of almost every
    renewal is below zero before any advice is costed. CORRECTED 2026-10-21 by the opex-credit grade: that figure charged
    the cost the standing charge recovers and credited none of it. Credited (ec7fd9942, full window, one variable against
    its control), the median household is +GBP 2.29 a month and 16.6% of 325 are negative. C34 still advises 4 of 975 rows,
    because every stated effect gives up at least GBP 2 a month, so the advice count and this recommendation stand. The sentence
    that our side is below zero on almost every renewal does not.'
  recommendation: 'I recommend the sharing retention price, not loosening our floor. Evidence: our side is negative in 18
    of 18 B11-scale cases; a sharing rise rescues 314 of 780 advice cases (40%) on the world''s own renewals (a_retention_price_that_shares_the_value_an_action_creates.md
    section 4b). Trade-off: it reaches only renewals with headroom under the default; loosening the floor reaches every case
    but books the advice as value we give away unshared, which M2 calls transfer. Holding position until you rule: both floors
    stay and C34 advises nobody, which loses no money. Would change it: if the build on fresh seeds shows the rise''s own
    effect on staying erases the joint value (the six GBP 30-margin cases already do), the floor change becomes the better
    lever.'
