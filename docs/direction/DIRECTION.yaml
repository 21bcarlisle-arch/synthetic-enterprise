      cause of a stuck head than the supervisor.
  - what: Reaping or landing the 10 at-risk salvage worktrees (b12, budgetpay, om2, simsuite, value-test).
    why: >-
      A reap cannot be undone, and three value-test trees share base 870201d1e7 with the armed cut012 pair. None blocks
      a supplier result. The primary checkout's commit, the one that does block, is item 1.
