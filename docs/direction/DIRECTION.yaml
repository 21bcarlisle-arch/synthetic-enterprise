thesis_read: >-
  The two carried errors that have run four stretches are CLOSED, and in closing them the stretch
  found who has been wedging the publisher: this seat, with the words in this file. Taking the
  closures first, because they are real. `199743f80` landed the failing-publisher sentence —
  `git show HEAD:site/assets/freshness-banner.js` now contains `publisherIsFailing` three times,
  `publisher_refusal()` is at HEAD in `background/publish_freshness.py`, and
  `site/test_freshness_banner_publish_state.py` is a committed door. `5e12bc4f5` repaired the
  supersession frontier on origin/main: `_newest_published_stamp` now filters on
  `staging_archive_policy.publish_did_not_land(p)`, its docstring names the 064310Z rc=77 incident
  that caused it, and a failed publish can no longer retire a queued snapshot. Two of the four open
  rows in `wrong` are therefore true closures rather than restatements, which has not happened
  before in this file. Now the expensive part. I ran
  `site/test_a_here_relative_pointer_has_one_home.py` directly and it FAILS, naming two defects and
  nothing else in the tree, at `site/data/delivery.json .what_it_decided.focus[4].why` and at
  `.what_it_decided.focus[3].what`. One is the plural-noun-plus-direction branch of the vocabulary
  and the other is the participle-plus-direction branch; I do not quote either literal in this
  file, because a quoted literal IS the payload and would red the same control. Those are
  my predecessor's sentences, from the 08:20 direction record, regenerated into `delivery.json` at
  08:28 by `tools/generate_delivery_page.py`, staged in the index, and rendered by `/harness/` in
  two regions — `#delivery-decided` and `#delivery-next` — so a phrase claiming a direction from
  wherever it renders means two different things and is false in at least one of them. HEAD's committed
  `delivery.json` is CLEAN of it (generated 2026-09-23 23:32, four focus items, its only "above" is
  "level 1 or above", which the vocabulary correctly does not flag). So this is a red that exists in
  no commit, arrived at 08:28, reds the site lane for every lane in this tree, and was authored by
  the one role in this architecture that writes no code. It does not explain all 62.7 hours of the
  outage — the wedge predates it — but it is the blocker NOW, and the publisher's own summary cannot
  say so: `.publish_gate_state.json` carries `citation_at_head: "dead"` for
  `tests/design/test_atom_notes_store.py`, which I re-ran and which passes, while
  `liveness_surface_refusal` holds the LIVE red naming the here-relative control. Two refusal
  fields, and the one a reader believes cites a corpse. Against the thesis proper this stretch was
  machinery again — seven substantive commits, all of them instruments — and the only
  inference-versus-baseline work on the box is still the five-seed `selection_gbp` noise floor, pid
  3567620, now 5h24m in at 8.6GB and writing to a `/tmp` scratchpad. The one further correction I
  owe: rank 3 last stretch prescribed one command and promised the row would stop appearing in the
  brief's `lane_0_drawn_never_landed` block. The command ran, exit 0, "bound 5 path(s)" — and could
  not clear the row, because the id had been RE-DRAWN eleven seconds before the binding item was
  drawn, and `_remember_landing` stamps the commit's own time while `drawn_without_landing` compares
  against THIS draw. The worker found that, dispositioned `--premise-spent`, filed
  `SEAT_FINDING_A_LANDING_BOUND_TO_A_RE_DRAWN_ID_CANNOT_SETTLE_ITS_WINDOW...` and landed `8379e8e0e`
  so the lane now says when a bind cannot settle its own window. My instruction was a structural
  no-op on exactly the population it was prescribed for, and my exit test was unreachable by any
  command this seat holds — one stretch after I declared that exact class corrected.

