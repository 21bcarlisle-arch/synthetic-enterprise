  - id: a-regenerated-json-artefact-can-never-be-graded-superseded
    what: >-
      Repair the grading rule under `tools/stale_copy_refusal.py` and `tools/refresh_to_head.py` so
      it can tell A KEY THE BASE LACKS from A VALUE THAT CHANGED. Today it compares JSON leaf names
      and a leaf name carries its own value, so an edited number reads as a new key and the copy is
