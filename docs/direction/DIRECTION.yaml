thesis_read: >-
  Sideways, and the reason is a fault in the machine, not the code. The close-refund fix was never on origin. The last
  direction and the 05:30 pre-registration both said it was "being landed". It was not. The first landing was refused
  because tools/git-hooks/pre-commit timed out at 3,600 s (/var/tmp/crfix-land1.log). The second, surgical_land pid
  1920905, died and left no line in any log. Its source worktree, /var/tmp/wt-close-refund-sizing, no longer exists. So the
  armed book launcher (longjob-launcher-crbook) has logged "waiting: close-refund fix not on origin" every five minutes since
  05:40, and it gives up at about 13:40Z. The work survives in two salvage commits. Tag salvage/detached-45b982e738bd holds
  both tests, and also about 1,300 regenerated site files that must not land. /var/tmp/crfix2/mut (3364405088) holds the
  residual-12 work (home_moves.md s.8.8d). That worktree was UNLOCKED and had no declared owner, so a reap would have lost
  it. I locked it at this orientation with a reason. Its parent is e58699ec9, so it does not yet carry the close-refund
  fix's own test. The rest of the stretch was sound. The slack ceilings have one fate each (b4ddeade0). The 19 plan
  re-offers are traced and their exception is retired at 0 of 1,248 (a481c9ab9). The D1 renewal moves are attributed to
  treasury feedback, not to run noise (1b69ca127). The baseline comparison the thesis asks for is pre-registered before any
  arm runs (c65c4cb8b). That last one is the closest the project has come to the thesis, and it is still only a design.
  Against the thesis nothing moved: no book passes the gate, no per-customer decision has met the flat baseline, and the
  renewal belief is still off. The commit_split (0 supplier, 0 world, 6 other) mislabels billing-correctness records and a
  pre-registered supplier comparison as "other". Even so, the stretch landed records and no code. Of the 4 previous focus
  items, all 4 were drawn. Items 3 and 4 finished, so they leave focus. Item 1 could not start its own work because the fix
  it builds on was not on origin. Item 2 is armed and waiting. The steer bit, and the landing beneath it failed silently.
