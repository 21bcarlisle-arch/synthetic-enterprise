- id: b8-s-retention-holdout-needs-two-practitioner
  raised: '2026-11-21'
  kind: strategy
  decision_kind: outside_source
  what: 'B8''s retention holdout needs two practitioner answers nothing published gives. Do GB suppliers
    hold some renewals out of their retention offers (a no-contact twin), and does Ofgem''s Fixed Retention
    Tariff derogation from SLC 22B let a supplier withhold the proactive retention approach from a random
    few, if the tariff is still open to any existing customer who asks? Searched 21 Nov: Ofgem''s own
    trials (CMOL, 137,876 customers) and the one published retention field experiment (Ascarza et al.
    2016: 10% churn among those offered, 6% among the held out) use held-out controls, but neither gives
    a share as a rule.'
  proposal: Build the blind holdout drawn before treatment behind one default-off switch, at the share
    the company already derives from its own power calculation (competitive_pressure.save_holdout_share),
    not a share picked from practice. It withholds only the proactive approach, never the tariff. It stays
    off in every standing run until you say whether a real desk does this.
  recommendation: 'I recommend yes: build it default-off at the derived share. A retention offer with
    no held-out twin cannot sign its own effect (Ascarza 2016''s offer raised churn). The derived share
    needs no outside figure. If you have seen a GB desk run holdouts, or know the derogation forbids it,
    that settles the one open question.'
  based_on: afa983b9be
  status: open
  resolution: ''
  evidence: docs/market_research/retention_slope_per_pound_of_renewal_cut.md §3.5
