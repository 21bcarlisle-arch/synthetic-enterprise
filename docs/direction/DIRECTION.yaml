thesis_read: >-
  Two of the four things I named last time are finished and can leave this file, and one of them is
  the best artefact the project has produced. The ceiling question came back reconciled rather than
  argued: the two figures that appeared to contradict each other -- "interior optima on 255 of 263"
  against "20 of 42 at the ceiling" -- were never in conflict, because `tools/couple_value_based_
  pricing.py` passes `decide_margin` no `max_offered_rate_gbp_per_mwh` at all, so its `ceiling_bound`
  was a flag that could not fire and its near-zero count read exactly like a control that fired zero
  times. The reconciled answer is now in the artefact's own headline and it is not flattering: THE
  OPTIMUM IS INTERIOR TO WHAT THE COMPANY'S BELIEF SUPPORTS AND ABOVE WHAT THE COMPANY MAY LAWFULLY
  CHARGE. Priced with no cap the maximiser turns over inside its own support on 396 of 397 accounts;
  priced under the cap at a real term, half its answers sit on the cap. A margin pinned to a ceiling
  is a margin the arm did not choose, and the artefact says so where a reader will hit it. The
  divergence campaign also closed -- `background/tree_divergence.py` now reads 1 file at 0.87h
  against 436 six days ago, `severity()` and `ESCALATION_MULTIPLE` are landed with the mutation both
  ways, and the policy-cost tests are tracked. So the two items whose acceptance test was
  disappearance have disappeared. What did NOT happen is the one mechanical act at the top of the
  list. `python3 -m tools.run_value_cycle_ab` was never re-run. The book moved from the 131 accounts
  the A/B scored to 397 (395 resi, 2 SME, `site/data/company.json` 23:07:37Z), and the published
  answer -- net +GBP 16,773.28, EV +GBP 10,799.78 -- still describes 17:09:29Z. Worse, three
  instruments were BUILT for that reading and none of them has ever emitted a number:
  `gross_to_net_bridge` (the named decomposition of the GBP 30,924 gross-fell-while-net-rose gap,
  with `unexplained_residual_gbp` and a reconstruction error so a decomposition that does not close
  says so), `bound_attribution`, and `cross_section_reconciliation`. Grep every
  `value_cycle_ab*.json` on the tree and none of those keys exists. We spent the stretch sharpening
  the instrument and never took the reading. And the reading matters more than I thought, because
  the existing one contains something I had not looked at properly: the value arm repriced 42
  renewals at a median GBP 57.75/MWh against the control's GBP 2.00 -- roughly a 28x commodity
  margin -- and the world answered with TWO extra churn events, 32 against 34 on a 131-account book.
  If the world barely punishes a 28x rise, then "the arm earns more" is a fact about the world's
  switching response, not about anything the arm inferred, and no amount of re-running fixes that.
  On the inference axis the news is unchanged and it is mine for the third time: EP1 was named in
  focus, drawn, and `saas/churn_model.py::churn_probability` is still
  `min(BASE_ANNUAL_CHURN_PROBABILITY + bill_shock_count * CHURN_UPLIFT_PER_BILL_SHOCK,
  MAX_CHURN_PROBABILITY)`. `coupled_gap_ledger.json` still reads `distinct_hazards: 1`,
  `hazard_histogram {"0.05": 33}`, a believed tenure of 20.0 years for every graded account, and it
  was measured at 11:46:22Z -- before the book changed twice. I ordered it second twice on the
  reasoning that the cheaper item gated it; the cheaper item consumed the stretch both times and did
  not produce the reading it was supposed to gate. That is my error, not the machine's, and it is
  corrected by putting EP1 first. Against the thesis: a supplier that decides customer-by-customer
  on LIFETIME VALUE, whose lifetime term takes exactly one value across every graded account, and
  whose measured advantage may be a fact about how forgivingly the world responds to price, has not
  yet shown the thing this project exists to show. The instrument is now good enough to find that
  out. It has not been pointed at the company.
