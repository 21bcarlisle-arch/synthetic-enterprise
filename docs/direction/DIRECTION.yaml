focus:
  - id: wire-the-sourced-acquisition-and-retention-costs
    what: >-
      Make the live path spend the researched costs. Replace `COST_PER_ACQUISITION` and the
      quote cost in `saas/growth_mandate.py` (reached via `company/interfaces/growth_desk.py`)
      with `saas/opex_ledger.py`'s sourced figures, and carry the I&C trail as an ongoing per-kWh
      cost at billing time via `broker_commission_gbp()` rather than forcing it into a one-off
      shape the research explicitly says not to use. In `company/analytics/counterfactual_retention.py`
      remove `RESI_OFFER_COST_GBP = 50.0` where a `_TIER_CLASS_BY_DISCOUNT` discount is already
      being booked as foregone margin — pick one representation and say which. Leave a control that
      fails if a constant with no cited source re-enters either path.
    why: >-
      This is a BLOCKING finding and it is under everything else: both arms of the published
      baseline comparison, the campaign's £112.50-per-quote spend, and the four red tests that are
      holding the founder book are all denominated in numbers with no provenance. Done means the
      live campaign and the retention path read the sourced model, the invented constants are gone
      rather than shadowed, and a re-run states what moved in the arm figures — because if the
      published £153,245 / £157,913 change, the reader is owed that. Fix this first and the next
      item's red tests can be read on real costs instead of invented ones.
  - id: land-the-80-founder-book-the-director-already-ruled
    what: >-
      Apply `docs/design/held/founder_book_live_population.patch` plus the two held files per
      `docs/design/held/README.md` and get it committed. The four red tests in
      `tests/simulation/test_net_new_acquisition.py` are not to be re-baselined: rule on whether a
      campaign that keeps issuing paid quotes after `SETTLEMENT_CUSTOMER_YEAR_BUDGET` can no longer
      convert them is a company defect or fidelity, state the ruling in the commit, and rewrite the
      tests to assert the ruled behaviour. My reading, to act on unless the evidence says otherwise:
      it is a company defect — the growth desk should stop paying for leads it has no capacity to
      serve — but the behaviour must remain OBSERVABLE (quotes paid vs wins booked, reported) rather
      than silently prevented, because a supplier marketing past its capacity is an ordinary
      commercial failure and the world should be able to produce it.
    why: >-
      The curriculum decision is already made — "take the 80 founders, that's my answer on P9" —
      so this is executing a ruling, not taking one, and built work sitting in a held directory is
      the drift. Roughly 80 accounts at nine or ten renewals apiece is the first book any
      per-customer policy can compound on; until it lands, the method skill test, the price ladder
      and B10's coupled gap are all bounded by a population too thin to resolve them, and no
      subsequent world change is falsifiable. Done means the patch is in HEAD, the campaign
      question has a written ruling with tests asserting it, and the end-book figure published is
      the measured 127 rather than the ~180 I priced.
  - id: put-the-bound-on-the-rendered-capabilities-page
    what: >-
      The /capabilities/ baseline comparison must state, in the rendered HTML a reader actually
      receives, that it compares two internal policies in a market that could not react to either.
      Verify to R11 — fetch the live page and quote the rendered sentence, never the generator
      output — and make the control assert against the fetched surface.
    why: >-
      The director corrected this claim himself and the page still publishes the comparison
      unbounded. It is retractable by construction, so it is mine to fix rather than his to approve,
      and it is the honesty half of publishing the comparison at all — which was right to do. It has
      been named in two directions and never landed. Done means the sentence renders live and the
      control fails if it stops rendering.
  - id: give-the-price-ladder-a-continuous-surface-and-take-b10-to-l3-or-record-why-not
    what: >-
      Carry `realized_churn_probability` — already on the event emitted by
      `simulation/customer_events.py::roll_lifecycle_event` — through `tools/run_price_ladder.py`
      into `per_rung` and the slopes, so each decision contributes a continuous quantity instead of
      a binary roll. Then re-run the chase-on / chase-off pair with seed replication and either
      record B10's level move with the measured belief-vs-truth gap, or record, with the numbers,
      why the gap still cannot be measured.
    why: >-
      B10 sits at 2 with a target of 3 and the coupled triad will not let a world atom go to L3 on
      an unmeasured gap. Seventeen binary rolls cannot express anything smaller than 5.9 percentage
      points, so the one-account move seen at rung 0.5 is uninterpretable — the roll is what
      destroys the signal, not the effect size. This is the cheapest route to the thesis claim that
      advantage comes from inference: the world has to be able to press measurably before better
      inference can be shown to pay. Worth more once the founder book has landed, which is why it
      sits here and not higher. Done means a recorded level move or a written refusal carrying its
      numbers.
  - id: dispose-of-the-settlement-clocks-payload-staged-in-the-index
    what: >-
      `simulation/settlement_clocks.py` and `tests/simulation/test_settlement_clocks.py` are staged
      in the shared index alongside modifications to `saas/reporting/annual_report.py`,
      `tools/run_annual_report.py`, `tools/run_frozen_baseline.py` and
      `simulation/run_phase4c_on_phase2b.py`. Either land the whole set as one commit with supplier
      and consumers together, or unstage and delete it. Do not leave it a fourth time.
    why: >-
      A consumer landing by pathspec without its supplier module breaks every clone, and this has
      been named in three consecutive directions without moving, which means nobody has actually
      decided it. It is small, and it is a decision rather than a build. Done means the index no
      longer holds it in either direction.
not_now:
  - what: >-
      P8 proper — building the systematic knowledge to discovery to atom to epoch chain (H45), which
      the director calls the velocity multiplier.
    why: >-
      Both BLOCKING findings this stretch ARE P8 firing on the live path: sourced knowledge that
      exists and reaches no code. Repairing the two live instances first gives the chain a concrete
      pair of cases to be built against and pays back immediately in the numbers the comparison is
      denominated in; building the general mechanism first risks a well-designed chain whose first
      real use is still ahead of it. H45 was drawn this stretch anyway, so the lane is not idle.
  - what: >-
      P2 / P3 / P4 / PB4 / PB5 — household trait variation, within-household elasticity, and
      separating engagement from elasticity.
    why: >-
      These are the right problems and they are unreadable now. Twelve gradable decisions on five
      accounts, and seventeen binary rolls, cannot distinguish a heterogeneity model from noise; any
      variation built this stretch would be graded against a population too thin to reject it, which
      is the worst possible outcome — an unfalsifiable improvement. Depth first, then variation.
  - what: >-
      P7 / SPINE_1 — giving survival an actual cash mechanism so hedging, competition and debt can
      threaten liquidity.
    why: >-
      Loses to the same argument. It is substantial world work whose effect on company behaviour
      cannot be read until the book can resolve an effect, and it competes directly with the founder
      book for the same stretch. It should be first in line once depth has landed.
  - what: >-
      C31 — instrumenting time as the third currency, which the mission names and which has never
      appeared anywhere in this project.
    why: >-
      Genuinely mission-level and the most tempting thing I rejected. It loses because the money
      currency is not yet measurable above its own noise floor and the household side of it only
      became visible hours ago; adding a third unmeasured dimension before the first one can be read
      makes the value claim harder to test, not easier. It is the item I would take next after depth
      and cost provenance, ahead of more world physics.
  - what: >-
      The harness backlog — the repeating-alarm pruning, the roughly 117 harness atoms never read
      for whether they should exist, and the two tests failing at HEAD against a ten-day-old
      baseline (P10).
    why: >-
      Tidying. None of it moves a level or closes a blocking finding, and the staging redesign
      already took the queue from 49 items to 15 and stopped the alarm files multiplying, which was
      the part that was actually costing draws. The rest can wait for a stretch with no blocking
      finding open.
