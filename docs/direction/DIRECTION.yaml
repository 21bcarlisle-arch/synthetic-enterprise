focus:
  - id: grade-the-pros-2024-0082-first-bill-capture-on-seed-88888
    lane: A_strategy_governance
    what: >-
      The run pre-registered in
      docs/staging/records/SEAT_PREREG_PROS_2024_0082_FIRST_BILL_PER_ARM_ON_SEED_88888_2026-09-29.md
      is already running as /var/tmp/se-leak-88888-out/drive.py (pid 1970916), and tools.wait_for
      pid 1976031 is waiting on it. Do not launch another run. Wait on that pid with tools.wait_for
      --pid. Then grade P0 through P3 and the refutation line in a SEAT_RESULT_ beside the prereg,
      one row per prediction. If P0 fails, say the run is not a reproduction and grade nothing else.
      Name the code path that gives PROS-2024-0082 16 bills in one arm and 5 in the other: file,
      line and function, read from the source at 5f05e0068. Say which of three categories it is: an
      acquisition draw, the pre-bill hold gate, or an unlogged renewal decision. If it is
      acquisition or the hold gate, file a finding saying that the noise floor's elasticity redraw
      reaches a non-decision path, and name the call chain.
    why: >-
      A +£2,464 swing on accounts where nothing was decided is the same size as everything the
      per-customer arm's decisions carry. Until it has a named mechanism, the A/B cannot separate
      inference from noise, and the baseline is not a clean flat-rules arm. DONE when a SEAT_RESULT_
      on origin grades every prereg line and names the call chain, or states plainly that the
      capture could not name it and why.
  - id: find-what-pins-the-shared-tree-behind-origin
    lane: H_harness
    what: >-
      Trigger: this is not deferrable behind item one. It is a reading of the tree, not a run, so
      do it while item one's run holds memory. First let surgical_land pid 1983095 (the reconciler's
      merge) finish; wait on it and do not start a rival merge. Then, in the shared tree, list every
      path in git status that differs from origin/main, and put each in one of four classes: (a)
      identical to origin, so dirty only because HEAD is behind; (b) a daemon's observability
      state file; (c) another lane's in-place edit that is not on origin; (d) untracked. Count each
      class. For the reconciler's last refusals in its log, name which class and which path
      blocked each one. Write the census as a SEAT_RESULT_. If class (a) is what holds the
      fast-forward, the remedy is a reconciler step that refreshes identical-to-origin paths. Build
      it only if its refusal names its reason, and mutation-prove that it CAN refresh AND can
      refuse on a class (c) path before asserting what either branch does.
    why: >-
      HEAD went 11, 21, 30 behind origin over three stretches. Every daemon on the box is running
      code the branch has moved past, which makes every fix landed on origin inert where it runs. I
      deferred this twice with no trigger, and that deferral is on my own wrong list. DONE when the
      class census is on origin with a named blocker per refusal, and either HEAD contains
      origin/main or the result names the one class still holding it and the item that clears it.
  - id: bisect-the-never-decided-leak-between-fcba478b7-and-5f05e0068
    lane: A_strategy_governance
    what: >-
      Trigger: item one's SEAT_RESULT_ is on origin. Do not start before it. Write a SEAT_PREREG_
      first. It predicts which of 254b4c1e4 (held bills released) and e83d571c3 (the world answers
      the listing lookup) opens the +£2,464 on never-priced accounts, and uses item one's named
      mechanism to choose. Then run seed 88888 with --level-arm and the elasticity redraw at
      exactly one of those commits and at its parent, with nothing else changed, via
      tools.launch_long_job under setsid. Launch nothing while another value-cycle run holds
      memory. Grade the prereg in a SEAT_RESULT_ that names the commit that opened the leak.
    why: >-
      At fcba478b7 the never-priced accounts moved £3; at 5f05e0068 they moved £2,464 on the same
      seed. Two commits sit between, and one-variable runs are the only way to attribute it. Naming
      the commit is what lets the leak be fixed as a class and not patched per account. DONE when a
      SEAT_RESULT_ on origin names the opening commit, or says "cannot yet say" with the runs that
      failed to separate them.
