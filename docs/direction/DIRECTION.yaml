    emerges from draws the world already has. Recommended. (2) Optionally, couple the price-sensitivity segment
    to the engagement rank, run at both ends (independent and fully coupled) with the strength kept as a GAP, never
    a midpoint. Not recommended: a past-switching term, which the only trial puts at x0.94. Your decision 6 already
