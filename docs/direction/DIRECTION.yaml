focus:
  - id: rerun-the-value-cycle-ab-on-one-weather-store-with-more-seeds
    lane: B_commercial
    what: >-
      Before any output exists, write a SEAT_PREREG_ in docs/staging/records/. Per seed, predict
      three things: the sign of the decided-differently set (D), excluding PROS-2016-0098; that the
      decided-alike set (A) stays within ±£25; and the pooled sign test on D across all seeds. Then
      create a git worktree at the current origin/main, which carries c39e01693, e297d1169 and
      b9c9092e6. From it, run tools/run_value_cycle_ab.py --level-arm with --noise-floor-seeds
      11111,88888 plus three new seeds. Launch it through background/launch_long_job.py under
      setsid. Launch as soon as background.resource_headroom.sample() shows room and no other
      value-cycle run is on the box. At 08:25Z, 20 GB was free and no run was on the box, so do not
      wait for the shared tree to advance. The run needs origin, not the shared tree. Grade every
      prereg line in a SEAT_RESULT_ beside it, one row per prediction. Make the first row each arm's
      weather_store digest and the same_weather_store verdict. launch_long_job.py is used, not
      edited. What lands is the two records.
    why: >-
      This is the thesis's own question: does the per-customer arm beat the flat baseline because
      of what it decided? The last grade had two seeds (p=0.77 and p=0.90), and one of them was
      contaminated by a store swap that is now refused by construction. The item was named last
      stretch and never drawn. DONE when a SEAT_RESULT_ on origin grades every line over at least
      five seeds that share one weather-store digest, and says plainly whether D's sign is
      distinguishable from zero. "Cannot yet say, with the bound" is finished. A run that refused
      on its digests is not.
  - id: cut-the-phase4c-fixture-to-a-short-window
    lane: H_harness
    what: >-
      Work docs/staging/WORKER_MINTED_short_window_phase4c_fixture_2026-09-29.md as written, and do
      not re-time. In a checkout that has sim/cache, run one full main() and one
      main(report_end="2018-12-31") of simulation/run_phase4c_on_phase2b.py. For each, record the
      row counts of meter_read_log, contact_centre_log and credit_refund_log, and the number of
      SLC 21B churned final-read overrides. If all four are non-zero in the short run, move the
      main_result fixture in tests/simulation/test_run_phase4c_on_phase2b.py to that window. In the
      same commit, add assert-non-empty legs to test_main_produces_contact_centre_log and
      test_main_produces_credit_refund_log, and assert at least one churned final read in the
      window. Mutation-prove each new leg against an emptied log. If any count is zero, try
      2020-12-31 before concluding. Do not run this while item one's run holds memory.
    why: >-
      About 1,330 s of every landing that selects this fixture is one world run. That is what
      outgrew the reconciler's merge budget and pinned the tree. A faster selection is the cheap
      mechanism; a bigger budget only treats the symptom. Two of the fixture's three tests pass on
      an empty log today, so the cut must make them bite first. DONE when the fixture runs the
      short window on origin with the new legs mutation-proven, or when a record on origin names
      the count that went to zero in both short windows.
