  - id: the-830-red-second-observation-must-be-recordable
    what: >-
      **Make tonight's census able to write a complete row, then grade the pre-registration against
      it. The measurement arrives on its own; what is not established is that it can be recorded.**

      `systemctl --user list-timers` puts the next firing at **2026-09-03 03:34 BST**, and the
      service failed at 04:30 today with `status=1`, 58:57 wall, 5.3 GB peak. The bound is now
      generous (`SUITE_TIMEOUT_SECONDS = 7200`, unit 7500), so duration is handled. The open risk is
      the store: run 1's row carries `"passed": null`, and
      `docs/staging/SEAT_PREREGISTRATION_WHETHER_THE_TMPFS_DIAGNOSIS_EXPLAINS_THE_830_RED_2026-09-02.md`
      establishes that `_record_observation` **refuses to write an UNPROVEN run on purpose**, so
      that row cannot have come from a completed `main()` — it was truncated, killed, or seeded by
      hand. Read `verdict()` and `_record_observation` in `tools/head_green_census.py`, establish
      which of those it was, and make sure a run that finishes tonight lands a row with `passed`
      populated. If it cannot, tonight's sixty minutes are spent and the director's question waits
      another day.

      **Do not run the census by hand today unless the publish gate is idle.** A full-suite
      `process_run_complete` run was in flight this orientation on a 15 GB cgroup; a second heavy
      suite beside it can kill the live one, and that kill is recorded as the episode's next
      failure — you would manufacture the red you went looking for. Check with
      `pgrep -af process_run_complete` first.

      **When run 2 exists, grade every clause of the pre-registration separately and report the
      split, including any clause it refutes.** The prereg already binds you to one honest
      constraint: 830 is a **floor**, not the complete set, so a residual count above a run-1
      sub-count is not automatically a refutation while one below it still is. Then route the
      surviving non-environmental reds — the ~70 that tmpfs never explained — through
      `background/head_red_register` into the draw, which is what `bc57c8e30` built it for.

      **Done means:** a second row in `docs/observability/head_red_observed.json` at a post-fix head
      with `passed` non-null, the prereg graded clause by clause beside its result, and the residual
      reds named with a route into the draw.
    why: >-
      The director asked what the 830 reds were and ranked it above the level-anchor work himself.
      We answered in prose, fixed two real causes, and have shown him no number moving — and the one
      observation we do hold was not written by a run that finished, so it is a floor of unknown
      depth. A diagnosis goes stale exactly like a green does, and the head-green census is the thing
      that certifies every other claim here.
  - id: bill-validation-the-curtain
    what: >-
      **Build the curtain, before anything reconstructs a bill against the export that just landed.**

      `company/billing/raw_account_export.py` landed this stretch (`145d48345`) with a check that
      refuses a derived field by its unit. That is leg two of the director's brief
      (`docs/staging/DIRECTOR_BRIEF_INDEPENDENT_BILL_VALIDATION_2026-09-02.md`) and it arrived before
      leg one. **There is no validation package and no curtain in this tree** — I looked. That
      ordering is now the risk: a validator built against this export and walled afterwards will have
      already inherited a shared concept, and no later control can un-inherit it.

      Build a validation package that **structurally cannot import `company/` or `saas/`**, enforced
      the way the socket wall is enforced — refused by construction, not by approval. Reuse the
      existing import-graph machinery rather than minting a new one: `background/publish_scope.py`
      already walks an import graph and `tests/architecture/` already holds layer controls. Run
      `python3 tools/write_time_gate.py --explain` before writing any new module and put the result
      in the REUSE block. **Mutation-prove it**: an edit that lets it peek must turn a *named* test
      red, under `python3 -B`. Key the control to the property — *this package may not reach the
      billing code* — never to today's list of imports.

      Then start §6, the plain statement of what this cannot catch, **as you go and not at the end**.
      Put the worked example in it by name: the first direct debit set from a half-month stub, which
      was measured correctly, sourced correctly, and wholly wrong in frame until a practitioner said
      so. A claim of independence that does not state its own hole is the thing the brief exists to
      stop.

      **Done means:** the curtain exists, a mutation against it fails a named test, and §6 names the
      residual risk with that example. Leave the statement export and the one-account reconstruction
      for the next stretch — and if you conclude the two-export shape is wrong, say so and build the
      better one; the director explicitly invited that and it is a finding either way.
    why: >-
      This is the director's newest direction, delegated for sequencing and not for approval, and it
      is what makes every other figure in this file checkable: our arithmetic has never been tested
      against anything outside itself, which is the exact pattern that produced a rate spanning
      thirteen periods of money over one of volume. The export landed without its wall, so the wall
      is now the thing that decays if it waits — every day it is missing is another day something
      gets built against the export with company concepts in it.
  - id: the-slc-27b-citation-does-not-exist-and-is-published
    what: >-
      **Correct the "SLC 27B" attribution in the six sites item one does not reach, and close the
      class rather than the instance.**

      `docs/staging/SEAT_FINDING_THE_DD_REVIEW_BAND_CITES_A_LICENCE_CONDITION_THAT_DOES_NOT_EXIST_2026-09-02.md`
      establishes from Ofgem's own material that **there is no SLC 27B** — the direct-debit
      provisions are 27.13–27.16 inside SLC 27, the nearby lettered conditions are 27A and 28A/28AD,
      and no ±5% band appears in the licence at all. I grepped the tree this orientation; after item
      one takes the two interface files, what remains is `company/billing/dd_review.py:15`,
      `company/billing/dd_review_runner.py:5` and `:48`, `saas/bill_generator.py:70` and `:74`,
      `simulation/run_phase4c_on_phase2b.py:311`, and **three published pages** —
      `docs/market_research/what_bill_shock_is.md:59`,
      `docs/market_research/satisfaction_drivers_and_the_three_bill_shocks.md:151`, and the new
      research page's own account. The finding said four sites and one page; correct that count
      **inside the finding, beside the original claim**, not quietly.

      **The ±5% is not fabricated and must not be deleted** — it is a real and widely used supplier
      review convention and the code applying it behaves sensibly. What is wrong is a modelling
      convention wearing a regulation's clothes. Cite **SLC 27.15** for the duty, declare the ±5% as
      a convention with its own origin under `tools/domain_constant_origins.py`, and state on the
      surface that the licence names no numeric trigger. If nothing published establishes it as a
      convention either, that is the honest answer and it goes on the page.

      **Then close the class.**
      `docs/staging/WORKER_FINDING_THE_STANDING_CHARGE_IS_FOUR_DECLARATIONS_AND_A_CITATION_THAT_CANNOT_BE_CHECKED_2026-08-31.md`
      is the same shape and still staged. Two instances is a class, and the rule that should have
      caught both — *a money constant citing a source must be reached* — is prose where it needs to
      be a refusal. Ask what a control keyed to the property looks like: **a cited authority that
      cannot be resolved in the commons is a refusal, not a comment.** Key it to that property, never
      to today's list of bad citations, or it goes green the moment someone invents a new fictional
      condition.

      **Done means:** no file in the tree cites SLC 27B; the ±5% carries a declared origin as a
      convention; the finding's own count is corrected in place; and a mutation-proven control
      refuses an unresolvable citation as a class.
    why: >-
      A number sourced to a condition that does not exist can never be verified and will never be
      corrected, and this one has reached eight code sites and three pages, two of which we serve to
      readers as research. It is the second instance of a class that already has a written rule, and
      the rule caught neither — which is the definition of a control that cannot fail. Ranked last
      because it corrects an attribution rather than a behaviour: the ±5% produces the same decisions
      tomorrow either way, whereas the three above are unlanded work, an unmeasured claim the
      director asked for, and the wall that makes our arithmetic checkable.
