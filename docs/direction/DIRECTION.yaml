- id: knife3-post-close-recovery-is-learned-over-the-agency-lag-on-the-written-off-amount
  what: 'Work from origin (98177f319 and later) and the branch knife3-per-debt-sale (9fcd4a53fa). Read
    docs/staging/SEAT_FINDING_THE_HELD_PER_DEBT_SALE_RULE_LEARNS_A_WINDOW_THE_AGENCY_NEVER_PAYS_INTO_2026-11-20.md.
    Then change cash_forecast_provision.learn() on two points. (a) The post-close window must cover the
    company''s own agency remittance lag: read it from the company''s placement and remittance records
    (write-off, placement and remittance dates), not from simulation constants. (b) Each cell''s recovery
    share must be cash after write-off divided by the written-off amount, not by the whole closing balance.
    Before any replay, pre-register in that finding what the cells should read: aged near 0.063 and young
    near 0.122, so nothing sells at 5.4p or 7p. Replay with /var/tmp/k3land/replay_kept.py and print SELL
    and WORK by price. Run the epistemic verifier. Land the per-debt rule only if the cells separate aged
    from young and both sell and work are reached at a published price. Otherwise land nothing more, and
    record the reason in the finding.'
  why: The world now holds a per-debt difference a real supplier can observe, and the company misses it
    only because of its window and denominator. That is the thesis's claim (advantage by inference) sitting
    one fix away, on a per-customer decision. Done means the pre-registration is graded on origin, and
    either the rule has landed with its replay print and a passing verifier, or the finding records why
    it still cannot land.
