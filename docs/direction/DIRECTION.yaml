focus:
  - id: reconcile-the-fork-and-take-the-repair-that-is-already-on-the-branch
    what: >-
      Fast-forward this checkout onto origin/main and unwedge the publisher, using the recipe the
      last refusal earned rather than its path list. `python3 -m background.origin_reconcile`
      currently exits GATE_RUNNING (the publish gate holds its run lock) — wait for that lock with
      `tools/wait_for.py`, never `pgrep`, then work the blocking intersection, which is 3 paths and
      must be re-measured with `origin/main...HEAD` semantics and not `HEAD..origin/main`. Four
      classes, not three: (a) producer exhaust — clear with `git show HEAD:<path> > <path>`;
      (b) SUPERSEDED RIVAL work already on origin — `tools/run_value_cycle_ab.py` and
      `tests/tools/test_value_cycle_ab_noise_floor.py` carry a floor-progress marker whose twin
      `NOISE_FLOOR_PROGRESS_MARKER` is already on the branch, so these are `--drops`, NOT landings;
      (c) genuine uncommitted work, landed via `isolate_hunks.py --survey` and
      `surgical_land --content`, with the landing unit taken as the PAIR-CLOSURE of the set
      (`background/boot_sha.py` and `background/process_run_complete.py` are required and were not
      named); (d) stale-and-holder at once — `tests/tools/test_fold_noise_floor_family.py` surveys
      as four hunks, land 1-3 and DROP hunk 4, which is a silent deletion of 166 lines holding seven
      controls that landed 2026-09-17. Use `git merge-file` against origin's copy as the per-hunk
      stale/holder oracle. Then re-run `origin_reconcile`, confirm
      `tests/background/test_a_multi_chain_landing_is_not_recorded_as_one_chain.py` is green at the
      new HEAD, and let the publisher drain the 8 completed runs queued behind it.
    why: >-
      The four tests blocking every publish are ALREADY REPAIRED on the branch at `3ebfe409d`, and I
      verified it rather than inferred it: origin's copy of that control run against this tree
      passes 6/6 while this checkout's copy fails 4/6, with a byte-identical module either side. The
      publisher has spent 8.08 days and 82 failures refusing on a defect that no longer exists three
      commits away. Done is `episode_clean_publishes` moving off zero on a publish the gate graded
      itself — the acceptance test I have now written down eight times and never once seen met. It
      is first because everything else in this list is corrupted by running from a tree the branch
      has moved past: `46ca060df` already showed one roster run would have been inert for exactly
      that reason, and focus three commits the machine to ~18 hours of runs that must not be
      launched from a fork.
  - id: land-the-arms-rerun-and-publish-the-withdrawal-in-the-readers-words
    what: >-
      The detached three-arm run (SID==PID 1414666, out
      `/var/tmp/value_cycle_ab_s1_three_arm_support_20260918.json`, log
      `/var/tmp/longjob-three-arm-support-20260918.log`) finishes inside the hour — poll it with
      `tools/wait_for.py` naming that artefact, not a sleep. When it lands, land the artefact,
      regenerate the value-arms page, and check the outcome against
      `PREREG_GIVING_THE_LEVEL_ARM_THE_SUPPORT_BOUND_AND_WHAT_IT_MOVES_2026-09-18.md` before reading
      the numbers, quoting any prediction it refutes beside the result. Expect all three bounded
      legs to go unavailable together and the staleness caveat to fire; that is the designed answer,
      not a regression, so do not work around `_seed_spreads`, `_floor_admission` or
      `_staleness_caveat`. The deliverable is that a reader of the page can see, in plain words on
      the surface and not in a footnote, that the two arms now price one book, that the previously
      published signs came from a run where they did not, and that no bounded sign exists until the
      floor is re-run. If `49f49dd8e`'s door repair left any door still keyed to the floor admitting
      the figure, re-key it to the property.
    why: >-
      Every figure on that page today comes from a run where the two arms priced different books and
      the page does not know it, which is a false claim on a live surface under the company's name.
      The correction makes the page say LESS than it says now, and this project's rule is that
      "we cannot tell" is a result that belongs on the page. Done is the page carrying the new point
      estimates with the bounded signs withdrawn and the reason named in the reader's words, and no
      remaining sentence claiming `flat_at_level` prices exactly the renewals the value arm priced.
  - id: rerun-the-folded-eighteen-floor-on-the-reconciled-post-fix-tree
    what: >-
      After focus one has landed and only then, launch the folded-eighteen noise-floor family in
      world `39a192ce04c1eda8` on the reconciled tree, `setsid`-detached with SID==PID so it
      outlives the invocation that starts it, stamped with the boot sha of the tree it runs on, and
      writing the per-leg progress marker the branch already carries
      (`NOISE_FLOOR_PROGRESS_MARKER`) so its ETA is counted per leg and not per run. Price it from
      the completed sibling run before launching, not from an estimate: ~14 min setup per leg plus
      ~6 min of settlement loop at ~22,786 periods/s. Record the launch and the expected completion
      where the next invocation will find it, because this outlives many turns.
    why: >-
      The level leg's only confident sign is the mean of an 18-seed family drawn where the level arm
      priced 65 renewals the value arm refused, so after focus two the project can state no bounded
      advantage at all, and this run is the only route back to one. It must come AFTER the
      fast-forward: an 18-hour family spliced across a tree change is precisely the defect already
      filed as BLOCKING in
      `WORKER_RESULT_THE_EIGHTEEN_SEED_FAMILY_IS_SPLICED_ACROSS_AN_OBJECTIVE_CHANGE...`, and two
      previous attempts at long runs here died with the turn that launched them. Done is the family
      running detached with its boot sha recorded and its progress readable per leg by a turn that
      did not launch it.
  - id: the-ordinary-not-done-sweep-still-returns-an-empty-reason
    what: >-
      In `background/delivery_lane.py`, make the plain `not_done` sweep path emit evidence naming
      what it checked and found nothing, in the same shape as the `premise_not_yet_ripe` and
      `landed_unbound` paths that now do. The live store holds
      `read-next12-alone-as-the-last-family-on-the-old-instrument-and-label-it-so`, swept with
      `disposition: not_done` and `evidence: ""` — it should say which sibling commits it asked git
      about, which paths it looked at, and that none answered. Key the control to the property that
      every disposition the sweep can emit carries a non-empty reason, over the whole partition in
      one assertion, so a later branch cannot be added silently without one.
    why: >-
      The two informative branches landed and have now fired live, so the remaining hole is exactly
      the branch that fires most often, and an empty string is not a refusal that names its reason —
      it is the silence this project keeps mistaking for an answer. Done is the swept `not_done` row
      in the live store carrying a reason a reader can act on, with the control written over the
      whole partition rather than a leg per branch.
not_now:
  - what: >-
      Re-issuing `read-next12-alone-as-the-last-family-on-the-old-instrument-and-label-it-so`, which
      was drawn 1.7h ago and swept `not_done`.
    why: >-
      It loses to focus two and three because the frontier fix changed what "the old instrument"
      means. Every family measured before `b329e702b` is now a reading over a book where the two
      arms priced different populations, so labelling one of them individually buys a sentence that
      the post-fix floor re-run supersedes wholesale. The label is still owed, but it is owed as one
      line on the page in focus two, not as its own turn.
  - what: >-
      Refolding the selection-leg family larger than eighteen from what is already in the tree
      (`SEAT_PREREGISTRATION_CAN_THE_SELECTION_LEG_FAMILY_BE_REFOLDED_LARGER_THAN_EIGHTEEN...`).
    why: >-
      It is the cheap route to a tighter bound and it is the wrong one now: refolding more pre-fix
      seeds makes a more confident statement out of the same contaminated book. A bigger n on a
      broken comparator is worse than no n, because the confidence is what the reader takes away.
      Re-open it against post-fix seeds once focus three has produced them.
  - what: >-
      Draining the maturity map ratchet (H41) and repairing the 26 ungradable level rows that owe a
      control.
    why: >-
      Headroom has now read 8,282 for a sixth consecutive orientation, so the crossing I promoted
      this on has not happened and the urgency was mine, not the map's. It loses to an 8-day publish
      wedge whose repair is three commits away, and it is exactly the class of work — tidying that
      moves no level and closes no blocking finding — that this direction is supposed to rank below
      a landing.
  - what: >-
      Attacking the pre-commit hook chain's growth, measured at ~6% a day, and the fact that the
      instrument watching it goes blind exactly when the publish path wedges.
    why: >-
      It is real, it is the thing that will wedge us again after focus one clears this instance, and
      it still loses this round: fixing the rate while the instance is live leaves 8 completed runs
      queued and the site 21h stale. Fix the instance, publish, then come back with the instrument
      able to see. If focus one lands and the chain immediately re-wedges the tree, that ordering is
      refuted and this becomes first.
  - what: >-
      Writing a ninth diagnosis of the publish wedge, or a register of its classes.
    why: >-
      The diagnosis has not been the missing piece for three stretches, and the fourth class found
      this stretch was found by EXECUTING the remedy, not by reading it. A control that only guards
      our own controls is usually not worth having; the wedge clears by landing bytes.
