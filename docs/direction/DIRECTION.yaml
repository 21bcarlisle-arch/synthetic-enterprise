    under ''The replication is launched on 33333/44444 and 55555/66666''. That prediction is cut minus
    A, value arm, per pair, +GBP 0.60 (-0.60 to +1.80), refuted if the two-pair mean is below zero, with
    the flat book (control arm) moving by less than GBP 0.10. Use grade_paired_cut012.py''s method (or
    /var/tmp/vtc-rep-driver/grade_rep.py), with the pair and run directories as parameters, against /var/tmp/vta-out-flag1.
    Before grading, check that each pair''s sidecar tree_patch hashes to the pin 2b312c4d...114d. A pair
    whose sidecar records a different patch cannot be graded: say so rather than grade it. Write the per-pair
    and two-pair numbers with their intervals beside the prediction, unrevised. Separately, if the member
    files carry both arms on the same households, publish the value arm minus the flat book at each pair.
    If they do not, say so in one line and name the run that would read it. Land with `Graded: value-test
    held=<n> missed=<n>`. Only then unlock /var/tmp/value-test-cut012.'
  why: 'This is still the only reading that tests the thesis: does the per-customer arm, using what it
    inferred, beat flat rules on households its cut was not fitted to? Done means: the s.12f section carries
    the replication''s grade with intervals; the advantage over the baseline is published with its interval,
    or stated as unreadable with the run that would read it; and the next lever is named from the result.
    That lever is the multi-term retention value (B11/C35) if the cut holds, or the s.12e alternative
