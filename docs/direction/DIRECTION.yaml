thesis_read: >-
  **The steer bit — the brief says otherwise and the brief is wrong, verified in the executor log,
  and I am correcting it here rather than acting on it.** `previous_focus_drawn` reports `drawn: []`
  and warns that "the weight is not biting"; `docs/observability/seat-executor-log.md` records lane-0
  ticks **RUNNING** `union-the-departure-routes-and-declare-the-denominator` at 03:35 and 04:37 and
  promoting it at 03:06 / 04:06 / 05:07, and the finding it produced opens *"on the drawn Lane 0
  item"*. Rank one was worked, twice, and rank two through four were not — the same pattern as last
  stretch, so **rank is the whole mechanism and I have ranked accordingly.** What rank one bought is
  the most honest piece of work this machine has done in a while and it moved the thesis sideways
  rather than forward: the level-anchor collision was **answered** (`d374b1977` — 2016/2025 take the
  reference year as years the fit never claimed, 2022 takes `NO_LEVEL_CORRECTION` as a year the fit
  claimed and could not identify, capture scope stated on the entry), all three follow-ons the last
  direction called owed were **already repaired before the worker arrived**, and then the worker
  established that its own answer **cannot be checked from anything on disk**: `c2` ran under the
  live block but has **0** SVT sibling rows, `ladder` sees both routes but ran under the retired
  ten-year table, so the whole-book band leg is undischargeable and *"we cannot tell"* is the
  verdict. It also **refuted its own filed prediction** — it predicted all seven readable years below
  the band and measured **six above and one below**, up to 15.9pp *over* in 2020 — which exposes that
  the anchor module's narrative, and my own direction repeating it verbatim, primes every reader
  backwards. So: the baseline the thesis requires is now correctly *declared unjudgeable* instead of
  falsely green, which is progress in fidelity and **no progress at all in the thing the mission is
  about.** The inference side did not move this stretch: nothing touched what the company knows
  customer-by-customer, time remains the currency that does not exist, and the one item that would
  make a household's *experienced* harm measurable — the direct debit having no estimate behind it,
  the director's own correction of 2026-09-01 — is **untouched for a sixth orientation**, verified
  this morning at `company/billing/dd_review_runner.py:155`. That is the drift, it is drifting
  because I have ranked it second or lower every time, and rank two does not get worked. It is first.
