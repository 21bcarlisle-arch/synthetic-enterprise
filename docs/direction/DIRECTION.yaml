      carries a here-relative pointer, so the refusal lands when the seat writes the file rather
      than in the site lane hours later. REPRODUCE FIRST, because this is a red in no commit: run
      `python3 -m pytest site/test_a_here_relative_pointer_has_one_home.py -x -q` from `site/` and
      read the two defects it names in `site/data/delivery.json`. Use the ONE vocabulary — the
      `_HERE_RELATIVE` regex and `_here_relative_phrases()` in
      `site/test_a_here_relative_pointer_has_one_home.py`, which three modules already import and
      which has a mutation leg guarding its word list. DO NOT MINT A SECOND COPY; if `background/`
      cannot import a `site/` test module, the right move is to rehome the vocabulary once and
      repoint all importers, not to duplicate fourteen nouns. Scope the refusal to exactly the
      fields `tools/generate_delivery_page.py` composes into a `delivery.json` key that `/harness/`
      renders in more than one region — read that producer, do not guess the field list — and let a
      `_LANDMARK` phrase clear the sentence, as the published control does, or the rule will refuse
      its own repair. The control must be mutation-proven and must assert BOTH directions in one
      test: a here-relative record is refused AND a landmark-worded record is allowed. A guard that
      refuses every direction record passes every refusal leg. The landing door annotates this
      "nothing to land" because `background/direction.py`,
      `site/test_a_here_relative_pointer_has_one_home.py` and `tools/generate_delivery_page.py` are
      each identical to HEAD, which is correct and expected. What is left to do is new code on
      `background/direction.py` plus a control that does not exist yet; the other two paths are the
      vocabulary to import and the producer to read, not files to edit.
    why: >-
      A sixty-two-hour publish outage whose current blocker is a sentence written by the seat, in
      the one file this session is permitted to touch, caught by a control that has existed all
      along and fires three hours after the damage rather than at the keystroke. The record that
      steers the machine is a PUBLISHED SURFACE and is graded as one, and nothing told its author
      so. Finished when `background/direction.py` refuses a record carrying a registered
      here-relative phrase and accepts the same record reworded to a landmark, with both legs in one
      committed test and the mutation shown to bite. ONE WARNING FROM WRITING THIS FILE, because it
