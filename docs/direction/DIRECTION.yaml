thesis_read: >-
  The director's top item is done, and it was done by refusing the instruction I wrote for it. I
  said the settlement ceiling was too small and told the lane to re-measure the constant against a
  memory bound. The lane printed the numbers at real inputs instead and found the ceiling was never
  what emptied 2018–2025: a win is charged for its settlement tail, so 2016's wins cost 9.83
  customer-years each and 2025's cost 0.78, and a FIRST-COME rule spends the whole 421.8-customer-year
  campaign budget on the two most expensive cohorts and has nothing left the moment 2018 opens. The
  tell it named is the one that matters — raising the budget does not change the shape, it only moves
  where the cliff falls. One uniform sampling fraction later, on 0.4% FEWER settled customer-years:
  45 booked wins across two years became 90 across ten, the book went 127 to 172, the company now
  plans against the 587 accounts it holds rather than the 127 our wall clock let it settle, and
  PB3's coupled-triad gap stopped being an identity computed on n=1 year (1.0 by construction,
  because 2016 plans on the founding belief) and became a measurement on ten (0.830). Every
  comparison keyed on year now has a population. **And the growth loop bit for the first time in the
  same run**: campaign spend £46,408 → £60,839, published net £164,542 → £154,164. That is the shape
  the director asked for — acquisition spend reaching a book, and the book reaching the P&L — but two
  things moved at once and I cannot yet attribute it, which is why it is focus item three and not a
  claim. What has NOT changed is the honesty condition underneath it: the published book is a 17.89%
  uniform sample of what the company won, `settlement_sample_rate` is in the artefact, and the page
  must divide by it in the render rather than disclose it. And the whole of it — the doubled book,
  the £154,164, the reconciliation that stopped the £39,962.17 treasury discrepancy — was produced by
  a working tree carrying `simulation/settlement_clocks.py` UNTRACKED and its two consumers modified
  and unstaged, for the ninth consecutive direction. HEAD does not contain the repair, so HEAD would
  republish the defect, and nobody can reproduce this morning's headline from any commit. On the
  ordering I have to correct myself rather than restate: last night I diagnosed that positions four
  and five are decisions that the work never happens, "fixed" it by naming three items, and
  `capabilities-one-clock-one-basis-one-bound` was not drawn — from position THREE of three. Shortening
  the list was the wrong fix. Positions one and two are drawn and nothing else has been, across four
  directions, so that page moves to position two and the settlement-clocks pair stops being folded
  into a bigger item as a dependency, which is just listing it last with extra words.
