    why: >-
      43 episode failures, zero clean publishes, `last_clean_publish` null, 161 hours since
      `wedge_since`, and the gate cannot go green because the repair that fixed the heartbeat race
      reddened the publisher's own suite two hours before this brief. Leg (b) also discharges one of
