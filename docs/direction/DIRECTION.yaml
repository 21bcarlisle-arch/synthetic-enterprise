focus:
  - id: close-the-fork-so-a-publish-can-reach-origin-again
    what: >-
      Close the divergence between this checkout and origin/main (6 ahead, 5 behind) so HEAD is a
      descendant of origin/main, then let the publisher run a full cycle unaided. Do NOT `git merge`
      and do NOT `git stash` -- the index is shared and dirty. Fetch, `git reset --mixed
      origin/main` to put origin's bytes under the working tree, then re-land whichever of the six
      HEAD-only commits carry work origin does not already have via `tools/isolate_hunks.py` plus
      `python3 -m tools.surgical_land --content`; `8a746a18f`, `b08659dbd` and `3254f62f3` must each
      be diffed against `fd2d4c1ba`/`f0af86639` FIRST, because the weather machinery landed on both
      sides and re-landing a duplicate is worse than dropping it. `surgical_land` never pushes:
      push explicitly and read `git ls-remote`, not the push's own rc.
    why: >-
      `push_never_landed` with `origin=d3af46dbe, head=882ef8aad` means every liveness and provenance
      commit now deepens the split rather than publishing, and `159a2d4fc` -- the repair that greens
      the publish gate's five blocking files -- is on origin and not here, so this checkout's daemons
      run a tree the branch moved past. Done is `episode_clean_publishes` non-zero and
      `last_clean_publish` carrying a timestamp the publisher graded ITSELF; typing one in is not it.

  - id: SITE4_ia_register_and_nav
    what: >-
      Repair `tools/stale_copy_refusal.py` so the Kind-A/Kind-B discriminator asks whether HEAD lacks
      the WORK rather than whether HEAD lacks a NAME -- the two 2026-09-08 BLOCKING findings in
      `docs/staging/` measure the defect at line level and one of them names the second half, that
      `surgical_land` converts a Kind-B copy into a Kind-A one at the instant it succeeds, so the
      class refills from its own cure. Then discharge BOTH findings with a checked `**Discharged:**`
      line carrying a `file::node` falsifier on the line itself -- a `git mv` into `done/` does not
      discharge anything -- and run `python3 -m tools.level_zero_contradicted_by_its_own_controls`
      until `SITE4_ia_register_and_nav` is out of `contradicted_but_frozen` and carries a level.
    why: >-
      These two are the whole remaining freezer list; it was six last stretch and is two now, so the
      subject is one repair from finished. SITE4 already has a passing control (38 passed in 0.58s)
      and OPS11 refuses to record its level solely because these sit in the lane. Done is SITE4
      leaving `contradicted_but_frozen` with a graded level -- the first level move in nine stretches.

  - id: the-gas-tariff-type-read-becomes-the-c1b-roll
    what: >-
      Land repair 2 of the two the departure determination said were owed: the gas `tariff_type` read
      becomes the C1b roll, now that the eighteen gas-only accounts can leave. Start from
      `docs/staging/SEAT_RESULT_A_GAS_ONLY_ACCOUNT_CAN_NOW_LEAVE_AND_THE_BOOKS_RENEWAL_DECISION_POPULATION_NEARLY_DOUBLES_2026-09-16.md`,
      whose last section states why this ordering is load-bearing, and from
      `simulation.customer_events.departure_decision_leg` which repair 1 introduced. The lane drew
      this 20.3 hours ago and swept it back `not_done` with empty evidence -- check `git status` for
      its paths before starting, then either bind what is there or build it.
    why: >-
      This is the only item in the brief that moves per-customer decisioning rather than the harness
      around it: repair 1 nearly doubled the renewal-decision population and repair 2 is what prices
      the eighteen correctly. Ranking it below two harness items is a judgement I am making with the
      fork actively corrupting every landing, not a view that plumbing outranks the thesis. Done is
      the eighteen carrying a C1b roll in a committed run and the swept row bound to the commit.

  - id: grade-the-seven-ungradable-rows-whose-control-already-passes
    what: >-
      Take the seven rows the brief lists under "every named path is on disk and one of them is a
      runnable control, so the refusal came from the pass and not from the row" --
      `A50_the_supplier_use_case_register_is_published_with_a_status_per_item`,
      `D27_belief_window_saturates_on_this_book`, `D9_worse_than_blind_chip_is_metric_blind`,
      `H41_the_map_ratchet_has_no_ongoing_drain`,
      `H47_the_orientation_header_states_a_figure_it_computes`, `KNIFE3_wall_crossing_paydown`,
      `W2_31_people_phase1_the_physical_layer_stands_alone` -- run each named control, and record the
      level each result earns. Where the control passes and the row still cannot be recorded, name in
      the record WHICH refusal blocked it rather than leaving the row in the bucket.
    why: >-
      `ungradable_count` 30 and `ungradable_owing_repair_count` 27 have not moved for nine stretches
      and I have now briefed it twenty-one times. These seven are the tranche that is already
      gradable -- the control exists and passes -- so nothing stands between them and a recording
      except the freeze focus two removes. Done is the ungradable count below 30 at the next
      orientation, which is the only evidence any of the twenty-one briefs was worth writing.

