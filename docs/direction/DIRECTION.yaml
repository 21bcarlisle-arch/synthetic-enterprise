thesis_read: >-
  Against the thesis this stretch was flat, and against the machine it went backwards in one
  measurable way that now outranks everything else. Six substantive commits, and all six are
  harness: a control's blind spot, a liveness stub, a conftest re-rooting, and the weather store's
  plumbing. Nothing this stretch changed what the company can INFER about a customer, and no level
  moved for a ninth stretch. The backwards move is a FORK. This checkout is 6 commits ahead of
  origin/main and 5 behind, and the two sides are not the same work: `fd2d4c1ba` and `f0af86639`
  landed the weather machinery on origin while `8a746a18f` landed it again here, so the same
  subject was built twice on two sides of a split nobody declared. The publisher's own record says
  the rest: `episode_failures` 46 to 50, `episode_clean_publishes` still 0, `last_clean_publish`
  still null, and the live refusal is `push_never_landed` with `origin=d3af46dbe, head=882ef8aad` --
  every heartbeat commit it makes now deepens the fork instead of publishing. The sharpest
  consequence is that `159a2d4fc`, the one-line conftest repair that turns the publish gate's own
  five blocking files from 14-failed to 78-passed, is on origin/main and NOT at HEAD, so the daemons
  running out of this checkout are executing the red tree while the branch is green. That closes my
  sixth open error -- the fix is committed and it is real -- and it renames the residue: what is
  left is not the repair, it is the fork. Two things genuinely improved. The freezer list is no
  longer six: it is TWO, both dated 2026-09-08, both about `tools/stale_copy_refusal.py`, and they
  are the entire reason `SITE4_ia_register_and_nav` sits in `contradicted_but_frozen` with a control
  that already passes. And the one thesis-bearing thing in the record -- the departure route that
  lets a gas-only account leave and nearly doubles the book's renewal-decision population -- is
  landed as repair 1 of 2. Repair 2 was drawn 20.3 hours ago, came back `not_done` with empty
  evidence, and is the only item in this brief that moves per-customer decisioning rather than
  the scaffolding around it.

