not_now:
  - what: Landing the whole salvage 45b982e738 as it stands, so that the launcher's condition is met fastest.
    why: >-
      It carries about 1,300 regenerated site and state files from a scratch run. Landing them would publish unverified
      figures under the provenance banner and bury the fix in noise that nobody could review. Isolating the hunks costs one
      step. Publishing an unverified page costs the property the 10 Aug ruling protects.
  - what: Building a register line for a surgical_land that dies, which is the second instance this week.
    why: >-
      That class is already folded (a-landing-that-dies-leaves-its-item-reading-as-in-flight). Item 1's
      remedy, running the landing under launch_long_job, puts the death in a register that already exists. Building a
      watcher now would delay the landing it watches. It returns to focus on a third death of a landing run under
      launch_long_job.
  - what: Raising the pre-commit gate's 3,600 s timeout, or narrowing its test selection, so that the landing goes through.
    why: >-
      A timeout raised to let a change pass is a gate bent to fit the change. First measure why the run took so long (item 1).
      If the cause is the box's concurrent load, a quiet window fixes it at no cost. If it is the selection, that is its own
      finding, and the evidence goes beside it.
  - what: Publishing 068b5e3cc8 or e1587ec5b now to meet the overdue early-publish date.
    why: >-
      Both refund debtors: 205 of 238 refund lines pay past the page's credit. A two-day slip on a date I set myself is the
      cheaper error, compared with publishing a book that the director's 26 Oct ruling exists to stop.
  - what: Switching on the corrected renewal belief, or running the c65c4cb8b comparison, before a book passes.
    why: >-
      The 26 Oct ruling holds levers until a book passes. It is now pre-registered, so waiting costs nothing, and running it
      on a refused book would grade the belief against billing defects.
  - what: W3_3 (the deemed and flex standing charge), the UKDS precarity wiring (W2_18, W2_19, 84d37afb2), and N17.
    why: >-
      All three are world-side, and none of them blocks the exit-test book. Each would move settled figures under it and make
      the close-refund result impossible to attribute. N17 keeps its 23 Nov recheck.
  - what: Fast-forwarding the shared checkout (99 behind), reaping the 7 other worktrees with unpushed commits, and the 20 repeating alarms.
    why: >-
      Books and landings run from origin worktrees, so stale imports do not reach a grade. reconcile-watch owns the
      fast-forward. The other seven worktrees are locked, each with a reason, and reaping cannot be undone. The one worktree
      that mattered (crfix2/mut) is now locked. I read the alarms and leave them by choice.
