thesis_read: >-
  The thesis did not move this stretch, and the reason the value test did not move is my fault. 3 commits, 2 substantive,
  split 1 supplier, 0 world, 2 other. f0bca8e35 prints a re-rated SME catch-up as one line per VAT rate, a bill-correctness
  fix. 7ec8f651e makes the ops writer rebase onto its remote before it pushes. The ops mirror is CORRECTED: the ops repo is
  level with its origin, and the sim-runner log shows heartbeats published to it at 08:10, 08:40 and 09:20, so that item
  leaves focus. Two items are mid-landing, and neither is on origin yet. The Capabilities answer is surgical_land pid 1430307,
  13 minutes into its gate, and it carries both advisor files to done/. The refund clock is pid 1307691, 24 minutes in. That
  is its FOURTH landing: the third (pid 3584048) is gone with nothing on origin. The value-test proposal was not drawn, and
  that was built into my own steer. I named the item B11_forward_clv_backtested_on_held_back_history, an atom whose draw reason
  is "director_gate". A focus item that names an atom only biases the ordinary draw, and the ordinary draw never takes a gated
  atom. So the director's first feature for next week could not be reached by anything. It goes back in as a Lane 0 key with
  lane B_commercial. Its subject already exists: docs/design/THE_VALUE_TEST_REDESIGN.md was written and read cold on 2 Nov.
  The work is to bring its sizing, skill predictions and cost up to the 13 Nov steer before Sunday's review, not to start
  fresh. Against the thesis the honest position is unchanged. We have no current evidence that per-customer inference beats
  the flat baseline. The only three-arm run is 8 Oct, its belief scores AUC 0.52 against control outcomes, and the live
  renewal belief scores 0.333. The site still says otherwise in book totals until pid 1430307 lands. The learning loop says
  STOP on level-dd (15 code-or-reader misses) and repayment-posting (11), so no new fix is drawn in either area before the
  16 Nov book, and the not_done level-dd-final-bill item waits with them. Pace is held at the advisor's 62% Friday reading.
