thesis_read: >-
  THE COMPANY NO LONGER CHARGES ABOVE THE LAW, AND THE WORLD NO LONGER CHARGES ITS OWN SVT HOUSEHOLDS
  VAT TWICE. That is a real step back toward the thesis: value transfer that was being scored as
  value creation has gone. Last stretch's item one is done, in three moves. 18592fd03 ceilings the
  renewal strike at the de-VATed cap, and 22 of the 28 first terms above it moved to 0.9524 of the
  inc-VAT cap. bafcb9801 makes "a sold ex-VAT rate never exceeds the de-VATed cap" a domain
  invariant, so the class is fixed and not only the instance. 50bde35ab finds the other 6, plus 8
  ToU accounts, in the world's SVT segment, which wrote the inc-VAT cap into an ex-VAT field. It
  bills them ex-VAT, and the result is 0 of 120 above the ex-VAT cap, with 0 of 106 non-SVT accounts
  moved. The svt_product question is answered: it was the same defect, on the world's side. The
  same reading handed on two more members of the class, and they are not fixed. (a) The ToU sold
  rate is read off-peak, so the DD opening for a ToU home is about 21% low on the unit leg. (b) The
  world's standing charges for 2022 onward are probably Ofgem's inc-VAT figures carried as ex-VAT.
  A third, the switching reference comparing an ex-VAT offer against the inc-VAT SVT, is being
  landed right now (surgical_land pid 1176957). That is the VAT rule's sixth implementation. H49
  landed at level 2 (c42bae117). The fork page now names its paths, and it fired at 11:18. BUT THE
  SHARED TREE IS WEDGED BY A DIFFERENT CAUSE, AND IT IS WORSE THAN LAST STRETCH. Since 09:43 every
  reconcile cycle has been REFUSED_GATE by the commit-msg chain (the REUSE record and the NEXT:
  trailer) on the reconciler's OWN merge, with empty gate stdout. The tree is now 23 behind and 4
  ahead, and every daemon is running code from before the ceiling, invariant and world VAT fixes.
  Three "re-base the ex-VAT cap invariant landing" merges for one landing are the same friction,
  visible from the other side. PB4 is drifting as a steer. It was named as an atom for a second
  stretch and not drawn, and the EAC question that gates its swap has had no work at all. It goes
  through lane 0 now. EP1's coupled-gap row did move, 2.364 -> 1.081 (7a8e651cd), but that row sits
  on the 4-commit ahead leg and is not on origin. 17 commits, 6 substantive by the brief's count,
  and 6 carried no work, all of them merges.
