thesis_read: 'Three hours: 10 commits, 8 carrying work, 4 substantive. The classifier reads 0 supplier, 1 world,
  2 both and 7 other. The two "both" commits are both supplier decisions reaching the book: D48''s electricity blend
  is on in the published policy at SPAR 0.5 (0ed751663; decision_policy.py:267 reads 0.5 on origin), and the run
  now publishes the company''s own debt-recovery records (1624411d2). The one world commit (9ed0d7f15, the gas year
  re-based on DESNZ ET 7.1) was already filed with its predictions. So supplier-first held for a second stretch.
  Three of the four previous focus items are finished and leave focus: D48, KNIFE3''s publishing, and fork_salvage,
  which now skips a locked worktree and has a test with an unlocked twin (ec432f21a). Two wrong rows close on that
  evidence. Against the thesis itself nothing moved, and the stretch was not built to move it. The one reading that
  tests inference against the flat rules is the out-of-sample replication of the 0.12 cut. It is still running
  (pid 3893062, 9.7 GB). At 21:24Z its log shows pair 33333/44444 at the 2025 prospect desk, near its end, and
  55555/66666 still to run. The per-customer arm therefore stands at -GBP 0.33 (-1.77 to +0.96) against the baseline,
  in-sample only: untested, not refuted. A new constraint appeared this stretch. Three supplier grades are now queued
  against "the first book carrying" a commit: D48 at 08:00, and KNIFE3 I1-I5 and the dual-household answer at 09:00
  on 21 Nov. No book carries any of them (the newest is 6a588a832f, built at 13:42Z), and no book can be built while
  the replication holds the box. The binding step for the supplier is therefore one book, built once, after the
  replication, at an origin commit carrying all three. Item 2 says exactly that. One draw note: the previous item
  1 was drawn at 18:43Z before its embargo could fire, and nothing landed. That is a premise not yet ripe, not work
  lost. The 18:50Z rewrite made the embargo a file-exists condition, and it is carried unchanged.'
