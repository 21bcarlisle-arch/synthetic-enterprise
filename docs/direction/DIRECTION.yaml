thesis_read: >-
  Three hours, nine commits, seven substantive, and not one of the three focus items moved. That
  reads like the fifth stall in a row and it is not one, so the first job of this orientation is to
  say what actually happened: at 05:39Z the director's console reported "33 newly failing tests at
  HEAD since 03:16Z", and the machine spent the whole stretch on it. It closed 28 of 28 in
  `tests/tools`, built the responder-side secret redaction he asked for in the same message
  (`background/inbound_secret_redaction.py`, wired at nine call sites in `ntfy_responder.py` with the
  redaction made VISIBLE in the ack rather than silent), and answered his third-time-this-week
  complaint about waiters with `tools/wait_for.py` and R18 in CLAUDE.md. All three of his console
  asks landed inside three hours. The work was also good rather than merely fast: the 2022 bill-shock
  red was closed as a fidelity RESULT with three independent denominators agreeing and an explicit
  refusal to re-normalise a third time until it passed, and the gas-leg inversion was self-corrected
  within an hour of its own first finding ("it is heat pumps, not the drawn AQ", then "the inversion
  was the SPLIT, not either side of it"). A stretch that displaces the direction to answer the
  director is the direction working, not failing. What did NOT happen is the direction's own spine,
  and on EP1 I now think every instruction it has been given -- five of them, mine by inheritance --
  has been aimed at the wrong thing, including my predecessor's correction of the first four. The
  story so far was "the hazard is thin, widen its inputs", then "the hazard is borrowed from
  `saas/churn_model.build_churn_risk`, change whose it is". I verified the second chain and it holds:
  `simulation/customer_events.py:152` does import `build_churn_risk` and it does feed the world's
  realised churn through `build_home_move_win_rates`. But it is not the explanation, because the
  estimator is not thin. The ledger's own `hazard_calibration` publishes THIRTEEN distinct believed
  hazards over 622 renewal decisions -- 0.05, 0.08, 0.11 ... 0.41, exactly
  `BASE_ANNUAL_CHURN_PROBABILITY + k x CHURN_UPLIFT_PER_BILL_SHOCK` for k = 0..12 -- with a mean of
  0.183 and only 263 of the 622 decisions sitting at the base. The same run's `lifetime_level`
  recovers a hazard of 0.05 for ALL 33 graded accounts, across nine distinct belief years (11 in
  2021, spread 2016 to 2024). If the graded set were any ordinary draw from those decisions, 42% of
  them would be at the base and 100% of them would not; the probability of thirty-three independent
  draws all landing there is about one in a trillion. So `distinct_hazards: 1` is not a thin belief
  and not survivorship. It is a COLLAPSE between two readings of the same company function inside the
  same run, and nobody has ever localised it -- five instructions in a row proposed a fix without
  measuring which of the two readings is wrong. There is a named candidate sitting in plain sight:
  `clv_three_horizon.py:580` takes `hazard = latest.churn_probability` under a time model the code
  itself calls `LATEST_RENEWAL_CONDITIONED`, one point out of a trajectory of up to thirteen, and the
  most recent renewal is the one least likely to carry a trailing-twelve-month bill shock. That is a
  hypothesis and this orientation does not assert it; what it asserts is that the measurement
  distinguishing it from the alternative takes minutes and has never been run. Against the thesis the
  headline is unchanged and I will not soften it: the coupled gap is still 2.529, the ledger still
  stamped 2026-08-26T11:46:22Z, and the company's per-customer CLV still carries less information
  about realised lifetime margin than assigning every account the population mean. "Decisions
  customer-by-customer on lifetime value" and a believed tenure of 20.0 years for every graded
  account remain the same claim and its refutation. But the diagnosis has moved from "the company's
  belief is thin" to "the company holds a dispersed belief and EP1 reads one number out of it", and
  those call for opposite work. My predecessor re-armed a trip -- if EP1 does not move on the fifth
  instruction, decompose it. It did not move. I am discharging that trip rather than overturning it:
  item one IS the decomposition, cut down from "fix the hazard" to "find which of two readings is
  wrong", which is the smallest closed-loop test R4 asks for and the first EP1 instruction that can
  be finished inside one tick. Two other readings. `run_value_cycle_ab` has now gone unrun for five
  stretches while being named first twice, and after two claim-and-drops the escape hatch my
  predecessor wrote did not help either -- so the thing nobody has measured is the instruction's own
  COST. The 2019 ladder ran to completion in a single tick at 04:45; the full-window ask is the same
  tool over ten years. The nearest working analogue exists and the diff is the window, which makes
  this an R4 sizing question and not a discipline question, and I have written it that way. And the
  director's 33 does not reconcile with the machine's 28: the sweep counted `tests/tools`, his report
  was tree-wide at HEAD, and five reds are unaccounted for by arithmetic alone. That is his number,
  it is small, and nobody has closed it.
