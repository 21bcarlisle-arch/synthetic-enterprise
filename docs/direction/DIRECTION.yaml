- id: an-ev-effect-is-read-on-electricity-across-a-full-year
  lane: W2_customer_generator
  side: other
  what: 'Close the EV root cause in docs/staging/SEAT_FINDING_AN_EV_LIFE_EVENT_IS_DRAWN_WITHOUT_THE_HOUSEHOLDS_FUEL_LEGS_AND_ITS_EFFECT_IS_A_RAW_BEFORE_AFTER_AVERAGE_2026-10-26.md,
    but test the finding''s first remedy before taking it. A household that buys only gas from us still
    has an electricity supply and can still get an EV. So ''draw the EV only for a household with an electricity
    leg'' may make the world less real, not more. Write the reasoning into docs/market_research/ev_charging_and_the_saving_against_petrol_and_diesel_2026-10-25.md
    first (K8). Then fix tools/generate_customer_reaction_chain.py: an EV effect is read on our electricity
    leg only, over a full year either side of the arrival, or reported as ''not observable by us'' when
    we hold no electricity leg or no full year. Weather-normalise it or name the GAP. Correct the suite''s
    INV_EV_ADOPTION_ELECTRICITY_ONLY predicate beside it if it asserts the draw rule, as a marked correction.
    Print the 21 arrivals before and after.'
  why: It is a ruling step 3 root cause, and the one Explore slot it feeds is empty today. Whether the
    defect is in the world's draw or only in how we read the effect decides which invariant the exit test
    grades, so it has to be settled before the fresh run's grade is read. Done means the knowledge page
    states the rule, the chain's fix and test are on origin, and the finding records the 21 arrivals classed
    as in band, out of band, or not observable.
