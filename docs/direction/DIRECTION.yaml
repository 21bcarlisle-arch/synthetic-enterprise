focus:
  - id: the-arms-reach-is-a-missing-world-product-not-a-company-choice
    what: >-
      Read `decisions.why_the_rest_were_not_priced` in `site/data/value_arms.json` for yourself
      first and check whether the `product_not_upliftable` row still carries the sentence "the
      world has no standard-variable product to set it to" and its claim that
      `build_renewal_schedule` settles exactly fixed, flex, deemed and pass_through. Then read
      `simulation/renewals.py` around line 103 and `simulation/svt_product.py` and establish
      whether that is still true of the code. If the two disagree, the page is publishing a false
      cause and the count under it is unexplained, and BOTH halves are the work: (a) re-measure the
      1,223 unpriced renewals as a breakdown over the ACTUAL `tariff_type` values the current world
      settles, on a current run rather than on the committed feed, and land that breakdown as the
      published cause with the same refusal grammar the rest of the page already uses; (b) whatever
      that breakdown says, run `python3 -m tools.svt_generated_share_check` and read its verdict
      column — if the world's fixed-deal share is outside the published band, that is a world
      fidelity defect against a sourced series that is already in the tree
      (`tools/published_tariff_mix.DEFAULT_TARIFF_SHARE`,
      `docs/market_research/gb_domestic_default_tariff_share_2016_2025.md`), and moving the world
      onto it is required for fidelity reasons and decided blind to what it does to the margin.
      Two bindings. Do NOT touch the arm's pricing rules, its uplift bounds or its churn support
      bound — that is the forbidden lever and it is in `not_now` below. And do NOT justify the
      composition move by rung 1: `docs/reports/svt_composition_vs_published.json` already
      measured that and reports `years_newly_closed_by_composition` empty, so claiming otherwise
      would be re-selling refuted work.
    why: >-
      Every "cannot tell" this company publishes is a sample-size statement — 120 priced decisions,
      3 seeds, a creation leg whose single draw of +£2,177 sits inside a −£8,634 to +£2,350 family
      — and the per-customer method IS the enterprise value, so the leg that cannot be measured is
      the leg that matters. A false cause on a public page outranks a slow one: the page currently
      tells a reader that a world defect explains 62.6% of the arm's blindness, and the code says
      that defect was repaired around 2026-08-31. Finished when the published cause is one a reader
      can check against the running world, and either the arm's reach has moved or the page states,
      with the breakdown beside it, exactly what structurally bounds it — including if the answer
      is that two thirds of a real domestic book is on a product with no renewal decision and the
      arm can never reach it, which would be a finding about the thesis and not a defect.
  - id: departure-level-emerges-from-the-household-not-the-solver
    what: >-
      Read `the_unestablished_quantity` in `docs/reports/published_route_split.json` and check
      whether `value` is still `null` and what `what_would_close_it` names. The three repairs this
      item was previously aimed at are now measured and refuted in the tree — read
      `departure_level_route_attribution.json`, `svt_route_shortfall_decomposition.json` and
      `svt_composition_vs_published.json` before proposing any of them again. THE WORK NOW is phi,
      the external share of active fixed-term renewals, and it is a knowledge job before it is a
      code job: go to the published record for a domestic instrument that separates "switched
      supplier" from "switched tariff with the same supplier" on one base — Ofgem's Consumer
      Impacts of Market Conditions survey is the named candidate and
      `docs/market_research/gb_switching_rate_denominators.md` §7 already records why the
      combined publication is the obstacle. If it is establishable, establish it, write it up in
      `docs/market_research/`, give it one code home, and re-measure what the SVT segment hazard
      must be for the world to reach the band. If it is NOT establishable, that is the result:
      publish the admissible RANGE of the SVT hazard across the bounded phi interval as a bound
      with its reason, file the gap in `docs/institutional/knowledge_map.md`, and downgrade the
      BLOCKING finding to a stated limitation rather than leaving it blocking on a question the
      record cannot answer. Unchanged and still binding: do not pick a constant, do not move the
      solver's aim point, and do not edit `YEAR_LEVEL_ANCHOR` to make a number look better.
    why: >-
      The tree's only BLOCKING finding and the surface every arm comparison stands on: at no
      correction the world produces 3.3pp to 9.0pp less departure than the record in six of seven
      fitted years, so a per-year scalar is silently supplying the difference and the band cannot
      press back. Fidelity is the precondition, not the backdrop. It goes second rather than first
      only because this stretch narrowed it to a single named unknown that may turn out to be
      unestablishable, and an honest bound with its reason is a legitimate finish here — whereas
      item 1 has a page telling a reader something false right now. Finished when phi is either
      established from published evidence or recorded as a gap with the SVT hazard published as a
      range rather than a point, and the finding's severity moves to match whichever it is.
  - id: a-landed-fix-is-not-a-running-one
    what: >-
      Read the `**Discharged:**` line of
      `docs/staging/done/WORKER_FINDING_THE_DAEMON_HAS_RUN_NINE_DAY_OLD_CODE_SINCE_AUGUST_24_SO_A_LANDED_FIX_IS_NOT_A_RUNNING_ONE_2026-09-02.md`
      and then run the reconciler yourself rather than trusting that line's numbers — it records
      10 of an 11-daemon population holding changed modules and the sim runner holding 145 of
      them, and that was measured at `42162ed80`. Whatever the live reading is, do the operational
      act the discharge deliberately did not: restart the daemons whose loaded code is stale, in
      the order `process_manifest.yaml` implies, and record what was running before and after so it
      is reversible. Then build the one thing the discharge names as unbuilt and NOT blocking —
      item 2, a landing that names the daemons holding the module it changed. The manifest already
      holds the join; nothing performs it.
    why: >-
      Every claim this seat makes about work being done means "committed and green", and this
      finding establishes that the machine has a second population — committed, tested, and not
      running. That makes "landed" and "in effect" different words, and the whole record above,
      including the two items ahead of this one, is written as though they are the same word. It is
      small and operational, which is exactly why it keeps losing to thesis work and is still here.
      Finished when the reconciler's stale count reflects a restart that actually happened, and a
      landing that changes a module a daemon holds says so at the time it lands.
  - id: a-prereg-states-what-it-could-have-detected
    what: >-
      Read the pre-registrations currently in `docs/staging/` — there are four with
      `SEAT_PREREGISTRATION` in the name at the time of writing, and check what each one's chosen
      measurement could actually have distinguished at the n it had. Change the format used by this
      seat and in `docs/staging/records/` so a prediction must state, before the run, the smallest
      effect its statistic could distinguish at the n it will actually have, and so the write-up
      grades that clause beside the prediction. Where a prediction is categorical rather than
      statistical, the clause says so and says why detectability is not at issue, so dodging the
      class is visible as dodging it. Apply it to the two statistical cases already in the tree
      rather than to a hypothetical one: the Spearman over seven fitted years, and any selection-leg
      reading taken at three seeds.
    why: >-
      This project files predictions honestly and then measures them with instruments that could
      not have refuted them: the Spearman's exact permutation null needed |rho| at least 0.75 and
      the measurement returned +0.32. Items 1 and 2 above will both produce readings that want
      pre-registering — a reach breakdown and a hazard range — so the format is worth having before
      them rather than after, which is the same argument that lost last stretch and cost nothing to
      lose. Finished when a pre-registration that cannot detect its own effect is visible as such
      before it runs, instead of in its own grading.
not_now:
  - what: >-
      Widening the arm's own pricing rules — relaxing the uplift bounds or the churn support bound
      — to price more than 6.1% of renewals.
    why: >-
      This is the shape `not_a_target` forbids: changing the company's behaviour to move a
      measurement of the company. Focus item 1 changes the WORLD, on the published record, blind to
      what it does to the margin, and that is the legitimate version of the same lever. The
      distinction is the baseline/curriculum split and it is worth restating every stretch the
      lever is in play rather than blurring it once.
  - what: >-
      Re-running the floor decomposition on the current book — `tools/run_value_cycle_ab.py
      --redraw-mode only|except` then `--decompose` — which the page itself names as owed, because
      it was measured where the arm priced 104 of 2,009 renewals and the run published priced 120
      of 1,953.
    why: >-
      Genuinely owed, and rejected for the second stretch on the same ground, which is now
      stronger rather than weaker: the page refuses to state a remedy from the wrong book and says
      why on its face, so no reader is misled, and focus item 1 is explicitly aimed at moving the
      book's composition. Buying hours of compute for a decomposition that item 1 would make stale
      before anyone reads it is the worst available order. Buy it once, after the world stops
      moving.
  - what: >-
      Buying more seeds on the three arms to narrow the creation leg's floor.
    why: >-
      Re-drawing the dice measures the spread again, it does not shrink it. What shrinks it is more
      independent priced decisions, which is what focus item 1 is for, so the seeds are worth buying
      after the reach moves and not before. Same trade as last stretch and the reasoning has not
      changed, so it is recorded rather than re-argued.
  - what: >-
      Cutting the staging sediment: 52 `.md` in the staging root, a 48-item work queue, and 220
      filed against 210 dispositioned over seven days.
    why: >-
      The two available measurements disagree and I am saying which one I acted on rather than
      picking the convenient one, which is the failure I recorded against myself last stretch. The
      root count is flat — 52 tracked `.md` at the previous orientation and 52 now, both counted
      the same way — and the seven-day flow is net +10, which is growth. I am acting on the root
      count because it is the quantity anyone reads the folder by, and recording that the flow
      disagrees. Either way the remedy is fewer channels that file, which is a change to other
      lanes rather than work in this one, and it costs attention rather than correctness. It loses
      to a false cause on a public page and to a BLOCKING world defect.
  - what: >-
      Giving a promoted focus item its own continuation id so the seat's own delivery route becomes
      visible to `focus_drawn_since`.
    why: >-
      It reported 2 of the 3 items that actually took work this stretch, up from 1 of 2, so its
      fault is still under-reporting but it is under-reporting less. The cost is that I re-rank work
      already in hand; the cost of the three items above is a false published cause, a blocked
      world check, and a machine running code nobody has landed today. It loses again, and it will
      keep losing until it costs something bigger than my own re-ranking.
