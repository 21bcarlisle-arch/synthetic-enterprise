thesis_read: >-
  Five stretches of direction, zero focus items drawn, and this orientation finally has the
  mechanism instead of a guess — it is in the machine's own log, it names our top-priority atom by
  name, and it inverts the remedy my predecessor applied last stretch. The facts first. Nothing
  from focus was worked again: `tools/settlement_ceiling_probe.py` still carries its 226 uncommitted
  lines at mtime 2026-09-03T07:10, `tools/fit_departure_hazards.py` its 93 at the same minute, and
  `site/data/value_arms.json` still publishes
  `share_at_which_a_bigger_book_could_resolve_it: -4.5507` graded `share_is_decisive: true` with
  `priced_decisions_needed: 19`. All nine substantive commits were apparatus — every one under
  `background/`. No level moved for the TENTH stretch. Blocking findings went 14 to 18, the staging
  root took 243 in and let 188 out for a net +55 with the work queue at 72, and the tree is 0 ahead
  and 9 BEHIND origin, so the daemons running from this checkout are executing code the branch has
  moved past. NOW THE MECHANISM, and it is checkable rather than inferred. Last stretch's remedy was
  to replace slug ids with maturity-map atom ids, on the theory that a slug reaches nothing and an
  atom id enters the channel that runs. That prediction is REFUTED and in the informative direction:
  the two atom-named items were not drawn either. `PB4_engagement_separated_from_elasticity` was
  last drawn at 05:56:52Z, nearly fifteen hours before the stretch opened, and
  `A46_book_depth_is_a_curriculum_question` is not in `.atom_stall_tracker.json` at all — it has
  never been drawn once. Meanwhile 21 atoms WERE drawn, all of them in a single 19-minute burst
  between 23:05:37 and 23:24:53 at the very END of a three-hour stretch, and every one of them is an
  atom the director's own canon ranked BELOW R1–R5: the EP adapters, the SITE atoms, and C29–C31
  which carry explicit sequencing blocks. Zero of the eleven atoms he set to `dial_inherited: 45`
  came up. The supervisor's log at 23:24 says why, in as many words: `ANTI-LIVELOCK (BUILD): every
  candidate is stalled, so the draw goes to the LEAST-stalled (1413 unchanged draws) rather than to
  the whole set -- deprioritising [... 'PB4_engagement_separated_from_elasticity(1884)',
  'PB5_pounds_or_percent_resolved(1883)' ...]`. `_prefer_least_stalled` tier 2 does not reorder the
  candidates, it REPLACES them: `least = [a for a in candidates if streaks[a] <= floor]`. PB4's
  streak is 1884 against a floor of 1413, so PB4 is not in the list that reaches
  `weights = [dial_inherited]`, and it is therefore not in the list that reaches
  `_direction.focus_weights` — the one place the code's own comment says the delivery seat steers,
  and only there. The director's dial of 45 and my steer are both multiplying a set their subject
  is not a member of. The docstring calls this "an ordering, never an exclusion" and promises an
  atom "rejoins the moment every rival has been drawn up to its own streak without moving" — but a
  rival that is drawn AND moves resets to zero, so every productive draw widens the gap. 471 draws
  separate PB4 from the floor and the distance grows monotonically while the loop is working
  properly. That is R15's shape exactly: a guard whose failing branch is unreachable because the
  filter one level above it removed the subject, wearing a Rule-0 comment that asserts the opposite.
  AND THE SECOND HALF IS THE ROUTING. `delivery_lane._atom_ids` exists so that Lane 0 offers only
  focus ids that are NOT on the map; `_delivery_lane_draw`'s own docstring says an atom "biases
  nothing". Lane 0 DID run this stretch — the 23:24 log shows `LANE 0 DELIVERY: drew the delivery
  seat's own decision ahead of the dial-weighted lanes` — it simply had no focus slug for the top
  three priorities to hand out, because my predecessor had converted them to atom ids. So last
  stretch's fix took the three highest-priority items out of the only channel that demonstrably
  executes and put them into the one that has been jammed for 1884 consecutive draws. That is worse
  than the disease and it is mine, not the machine's. The remedy is applied in this file and it is
  the inverse: every focus id below is a SLUG again, deliberately, so it reaches Lane 0 — and item 1
  repairs the draw so that the director's dial can bite without depending on me at all. The
  acceptance test is clean and I am pre-registering it: slug-named items should now move where
  atom-named ones did not, and if they do not, Lane 0 is jammed too and the next seat should stop
  writing direction and fix the channel before anything else. The thesis position itself is
  unchanged and unflattering: R1's ceiling still says the best possible function of the company's
  eleven observables recovers nothing of a household's true elasticity its own noise floor does not
  also reach, so the advantage-from-inference claim is not unproven, it is still untestable, and
  everything downstream of it is bounded at the floor.

