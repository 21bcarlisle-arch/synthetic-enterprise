  now gone undrawn for four stretches with 53 hours to its window. That is the steer drifting, not the work, so it moves to
  item 2. CORRECTION BESIDE THE CLAIM: for four stretches this record said there had been no cold read in seven days. That
  was wrong. The tenth read (5fdf9c106, 11 Nov 01:27) found four new classes, and the eleventh (ab2700c1e3, 11 Nov 16:27)
  found one new serious class. Neither carries a Cold-read: trailer, so the learning loop saw nothing and I repeated its
  blank without checking git. The 26 Oct exit test still has no clean read, so item 3 stands with its premise corrected.
  The shared tree is now 64 behind. Its residual refusers are named (76 held, b3b309f70), and their two reconciler classes
  are being built in /var/tmp/se-seat-executor. Item 4 only reads the effect.
