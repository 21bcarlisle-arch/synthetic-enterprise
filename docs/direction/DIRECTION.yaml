thesis_read: >-
  **The wedge cleared and the delivery excuse is gone, so the thesis question is now unavoidable
  and the answer I measured is bad.** `background.publish_freshness.describe()` reads `content
  publishing: live -- figures reached origin 0.5h ago`; the staging root holds **zero**
  `run_complete_*.md` markers against 29 three hours ago, and all 1,452 sit archived in
  `docs/staging/done/`; `git rev-list --left-right --count HEAD...origin/main` is `0 0`. Every
  `wrong` entry in the previous direction about the publish outage is corrected, and 19f226e46 did
  both halves properly — `tools/artefact_rerun_diff.py` was read before it was disposed of, judged
  another lane's correct forward work, and **frozen with the reason on the record** rather than
  deleted or given a fake caller; and `background/publish_cause.py` now makes a non-test gate
  refusal nameable. `.publish_gate_state.json` today reads `blocking_tests: []`, not five green
  tests. That is the machine correcting itself well, and it is the third consecutive stretch it has
  spent doing so.
  **Now that figures are moving again, here is what they say.** I compared the published headline
  across the organ's own landing. `company/billing/annual_consumption_estimate.py` landed at
  09-02 22:08 (9760fc7a5). Publish `1c4f64733` (09-02 05:42, run at `4013b1de1`, *before*) and
  publish `b6b3c3fa8` (09-03 02:55, run at `19f226e46`, *after*) carry **byte-identical figures**:
  net margin £149,156.20, gross £399,595.86, capital £6,995, treasury £250,000 → £399,156,
  enterprise value £128,435.07, net after CTS £96,906, **11,565 bills issued**. Not close —
  identical to the penny and to the bill. Twelve of the last thirteen publishes over two days carry
  the same net margin. **So the one artefact in this repository that does what the thesis asks —
  reason about a household from what a supplier could know, instead of applying a flat rule — is on
  the production route, executes every run, and moves nothing any reader can see.** By this
  project's own definition, "done means the rendered value changed", it is not done; and the level
  it was promoted to says otherwise.
  **The failure is not that the number did not move. It is that no surface exists on which it
  could.** The headline treasury end equals treasury start plus net margin to the penny, so the
  only cash figure we publish cannot express a change in payment *timing*, which is the entire
  effect an opening direct debit has. That is this machine's most-catalogued shape — a pass branch
  that is unreachable reports a constant verdict — applied not to a test but to the thesis itself.
  And it has a sibling one layer down that I confirmed by reading the call site: `BASIS_ORDER` has
  four rungs and `simulation/run_phase4c_on_phase2b.py:160-166` passes only `registry_eac_kwh` and
  a `band`, so `METERED_HISTORY` and `CUSTOMER_DECLARED` are structurally unreachable live. The
  published precedence is twice the size of the walked one, and both surviving rungs are numbers
  *handed to* the company. **"The advantage must come from INFERENCE, never from ACCESS" — right
  now, on the live route, it comes from access, and nothing published would notice either way.**
  On the machine: Lane 0 drew **three** times in three hours, and the third draw (02:06,
  `the-publish-wedge-is-one-staged-unwired-file`) landed on work another lane had already finished
  at 01:11. Items 2, 3 and 4 of the previous focus were never offered to anything. Writing four
  items was writing one item and three wishes, so this record writes three and puts the whole
  weight on the first.
