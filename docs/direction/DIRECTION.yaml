focus:
  - id: PB4_engagement_separated_from_elasticity
    what: >-
      Finish the swap in docs/staging/SEAT_CONTINUATION_SWAP_THE_WORLDS_BILL_SHOCK_BASE_ONTO_THE_EXPERIENCED_SHOCK_2026-10-01.md,
      in order. (1) The one-world run measuring sim_experienced_bill_shock is already on the box
      (pid 4051166, watched by tools.wait_for). Do NOT launch another. Wait on it, grade it against
      P1-P6 in docs/staging/records/SEAT_PREREGISTRATION_PB4_THE_EXPERIENCED_BILL_SHOCK_ON_ONE_WORLD_2026-10-01.md,
      and publish the None count by reason. (2) If neither refutation clause fires, swap
      _bill_shock_base in simulation/customer_events.py onto one experienced-shock event per year.
      Re-fit year_level_anchor against the published SVT/fixed switching band in
      docs/market_research/svt_rates_active_passive_2016_2025.md, an external anchor and never this
      tree's output, and keep the 15% materiality cut as a named unsourced gap. Add a control that
      the hazard can fire at tenure 1. (3) On one post-swap world, re-measure the within-year tenure
      and bill-size gradients of p_retain with the analyse.py shape in /var/tmp/se-world-terms-out/,
      and grade them against the published direction (longer tenure switches less; spend within
      -0.07 to +0.05). Do not touch the passive-term-end roll in the same change.
    why: >-
      The world's retention gradients are an artefact of a count that is blind in year one, and
      every company-side ranking grade since the ab6 work has been scored against that artefact.
      Until the world is right, no retention result can tell inference from fitting a defect. DONE
      when the swap and its tenure-1 control are on origin, and a finding states the post-swap
      gradients against the published sign. If the run refutes the plan, DONE is instead the
      finding that says so and names what the cut is doing.
  - id: a-passive-fixed-term-end-is-a-decision-point-in-the-world
    lane: W2_customer_generator
    what: >-
      Only after item one's swap is on origin, and never in the same run. Knowledge first: establish
      from the published record the departure rate at a passive fixed-term end for a switched-in
      book. Start from Ofgem's 2019 End of Fixed Term trial, docs/market_research/what_a_renewal_decision_is_for_a_gb_domestic_customer.md
      and docs/domain_artefact_library/. If nothing establishes it, carry it as an explicit named
      None (FIRST_RENEWAL_DEPARTURE_PRIOR is already None for this reason), never as a placeholder.
      Then give the passive branch of rolls_active_renewal (simulation/renewals.py:211-231,
      simulation/run_phase2b.py:2323-2376) a term-end departure roll on that evidence, with a
      control asserting the passive branch CAN depart. Also record whether the anniversary re-draw
      for an SVT household duplicates the C1b cap-calendar hazard. Measure that; do not change it.
    why: >-
      The world gives about 65% of term ends no exit, against a licence that makes each one a
      decision point. The error flatters the company, and it is a reason a dice redraw moved only
      9-12 exit months in 2acb617d4, so it also blunts every noise-floor test we run. DONE when the
      roll, or the named-None gap, is on origin with its control, and a finding gives the
      before/after exit count at term ends on one world.
  - id: H49_an_untracked_copy_of_an_earlier_origin_revision_is_cleared_like_a_twin
    what: >-
      Build the H49 mechanism in background/origin_reconcile.py. An untracked shared-tree copy whose
      bytes equal ANY earlier origin revision of its own path (ask git log --format=%H -- <path> plus
      hash-object, not only the tip) is cleared like a twin, after preserving it under refs/preserved/.
      In the same change, make a REFUSED_CONFLICT or NOT_ADVANCED that persists past three cycles
      raise one supervisor alarm, naming its paths, instead of only appending to
      docs/observability/reconcile-watch-log.md. Also stop supervisor._sync_origin_staging writing a
      copy that would block a fast-forward. Mutation-prove each leg: one control with a fixture where
      the copy matches an earlier revision, and one with novel bytes that must NOT be cleared.
    why: >-
      This is the third hand-clearance of the shared checkout in two days (09-30, 388d33b76), and
      each time daemons ran code the trunk had replaced. A fourth hand-clearance is certain without
      the mechanism. DONE when H49 moves off level 0 with a mutation-proven control, and the next
      fast-forward needs no hand.
