focus:
  - id: the-write-off-rule-is-re-keyed-to-the-balance-at-close
    lane: W2_customer_generator
    what: >-
      Build the design in
      docs/staging/SEAT_DESIGN_THE_WRITE_OFF_RULE_RE_KEYED_TO_THE_BALANCE_AT_CLOSE_2026-09-27.md in
      simulation/arrears_engine.py (compute_emergent_bad_debt). A failed payment adds to a running
      per-account unpaid balance instead of opening a terminal case. Later payments reduce the balance
      while the account is live. At close, what remains after collection and the existing post-close
      recovery stages is the write-off, dated by the labelled convention in C4. Leg 4a (the six-year
      statute bar for stayers) must be reachable: assert it CAN fire before asserting what it does.
      Leg 4b (the stayer provision) is a declared None, not a zero. bad_debt_gbp says it counts
      write-offs only. C1 and C2b stay None, so there is no re-presentation yet. Before any run, file
      the design's prediction on the selection residual as a pre-registration in docs/staging/records/:
      the leaver's write-off falls, the stayer's cost is unchanged, and the sign moves toward retention.
      Then run the rule change alone against the old-rule per-account result from
      longjob-two-state-diff-rerun-20260927. Wait for that run with tools/wait_for.py. Do not launch a
      second multi-GB run while it and run_annual_report are both resident.
    why: >-
      The published selection sign is decided by this one rule. The fidelity case now rests on
      sourced evidence alone, and the director's silence past this orientation is the release the
      design named. Nothing else moves the thesis figure until the world stops writing off a stayer's
      history on a future churn. DONE when the rule is in simulation/ with the balance-at-close write-off,
      a control shows leg 4a can fire, the prediction was filed before the run, and the one-variable
      result is filed beside the SEAT_RESULT record with the prediction graded, whichever way it went.
  - id: the-two-by-eye-page-defects-get-deterministic-controls
    lane: H_harness
    what: >-
      Write the two deterministic controls the Jev trial concluded are owed, with no model. First,
      widen site/test_ia_register.py so that a published page with no route from the main nav and no
      orphan-debt entry fails. It must catch brand/exemplar.html and brand/proof.html, or record each
      one as deliberate orphan debt with a reason. Second, add a site door that compares each chart's
      rendered stamp date with its own page's data date and fails when the stamp is older. Prove each
      control can fail by mutation before trusting its green.
    why: >-
      Carried undrawn from last stretch, with its paths unchanged at HEAD. The director has found both
      defect classes by eye more than once. His trial showed a model does not close the gap, and that
      code can check both classes exactly. DONE when both controls exist, each has a demonstrated
      failing mutation, and the current site either passes or carries named debt.
  - id: the-fleet-drift-verdict-grades-against-origin-not-local-head
    lane: H_harness
    what: >-
      Change evaluate_boot_sha_drift() in background/process_reconciler.py so the fleet verdict says
      when the checkout is BEHIND origin/main, not only when a daemon's boot sha differs from local
      HEAD. Control it with a test that builds a repo one commit behind its remote ref and asserts the
      verdict is not clean. Add one partition control asserting that the level, behind and
      daemon-stale cases each give their own distinct verdict.
    why: >-
      Carried undrawn. The oracle graded 11 of 11 daemons clean against a HEAD one commit behind
      origin, so every freshness reading taken while the tree lags is suspect. DONE when a checkout
      set behind origin makes the verdict say so, and a control fails if the origin leg is removed.
  - id: the-publisher-tells-a-monday-hold-from-a-refusal-and-closes-its-episode
    lane: H_harness
    what: >-
      In background/process_run_complete.py and background/publish_freshness.py, and in whatever
      writes docs/observability/.publish_gate_state.json: (a) make a content publish held by the
      Monday window (77e9db44a) read as a hold with its next window, never as a refusal or an episode
      failure; (b) close an open episode (episode_failures, wedge_since) when a later publish succeeds;
      (c) fill citation_at_head, red_at_head and fork_state for a genuine refusal, or name why each
      cannot be established. Before changing anything, establish whether today's FAILING (1 attempt,
      wedge_since about 13:55Z) is a real refusal or the new hold, and say which in the commit.
    why: >-
      Last record said a wedge that survived this orientation would outrank the map atom, and it has.
      The weekly hold that landed this stretch adds a second, by-design reason for not publishing. The
      same field cannot report both a design and a failure, and three carried wrong rows all read this
      state. DONE when a held publish and a refused publish give distinct readings under a control
      that covers both, and an episode closes on the next clean publish.
  - id: mint-the-stash-completeness-defect-as-a-map-atom
    lane: H_harness
    what: >-
      Add one maturity-map atom at level 0 for the stash-completeness sweep defect. `git restore
      --source=stash@{0}` skips a path present only in the stash, and `git diff --quiet HEAD --
      <path>` is quiet for an untracked path, so a genuinely lost file reports safe. Its file_scope
      names the sweep's module and a control that does not exist yet. Check headroom first with
      `python3 -m tools.maturity_map_store` (4,358 bytes at orientation). Keep the row near the
      ~695-byte median and put any reasoning in docs/design/simplifications/.
    why: >-
      Carried undrawn for the thirteenth time. It will always lose a focus slot, which is why it
      belongs in the queue that holds everything, and minting it takes minutes. DONE when the atom is
      on the map and this row disappears from focus and from wrong.
