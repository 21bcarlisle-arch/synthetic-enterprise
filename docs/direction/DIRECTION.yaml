thesis_read: 'The basics moved a little and the thesis did not. The stretch''s one company change is the reg 6D
  refund fix (3e3136ee2): the 10 late closure refunds were not the company''s lateness but the world drawing the
  supplier''s own payment day (90% within 10 working days, the rest 11 to 25, unsourced). The company now pays on
  the 10th working day on its own calendar, and a late one owes the GBP 30 or 40 standard payment; replaying the
  run''s 100 final-bill dates gives 0 late. That matters more to the thesis than its size: a decision the world
  makes for the supplier can never show inference, and the same shape is still live in the debt objection, which
  simulation/debt_objection.py draws at 0.283 for the company (new wrong row, item 3). The basics gate reads 0 of
  8 atoms at target and 7 of 15 lines done, so forward runs wait. Per-customer inference has still not earned its
  cost anywhere it has been graded, and no lever is in focus because the ruling puts the basics first. The commit
  split is supplier 0, world 1 (the settlement ceiling, b60a0cd8a: 7,700 stands), both 1 (the refunds), other 8,
  and 4 of the 10 are no-work merges: supplier-first is still not met. The steer did reach the draw this time. Handing
  B13 and W2_41 to Lane 0 under plain keys got both drawn for the first time after four stretches: the seat executor
  holds B13 (pid 1671415) and a worker tick holds W2_41 (pid 1709926), so that seat error is corrected. The premise
  re-ask (item 5) was the one previous item not drawn. E6''s arrears-overlay arm has sat built and default off since
  d127468fd8 (10:37Z), its NEXT naming an arm that nothing queued or launched, which is the lost-grader shape again
  and keeps the crisis bad-debt finding BLOCKING; it is item 1. Monday''s run b2bc3d8da5 is graded clean on the
  cap, and the one-shot timer mondays-window-marker-20261026 is loaded for 04:05Z; 9f4c6c478 builds the weekly route
  for later weeks. The shared checkout is 45 commits behind origin and 17 units import code origin has moved past,
  background-worker including its own 9f4c6c478; Monday''s publish does not depend on it, because the timer is that
  route.'
