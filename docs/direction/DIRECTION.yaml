focus:
  - id: knowledge-step-one-unbilled-energy-debt-and-home-moves
    lane: D_billing_metering
    what: >-
      Director canon 2026-10-05, step 1, first wave. These are the three areas that steps 2, 3 and 5 rest
      on: (a) unbilled energy and revenue assurance, (b) debt and collections, (c) home moves. For each
      area, write one knowledge note under docs/market_research/ with a `**Knowledge:** <topic>` line.
      Split each note into what the published record ESTABLISHES (Ofgem, Elexon/BSC, RECCo, Energy UK,
      supplier annual reports, each cited) and what it does NOT, with every gap named. For (a), say how
      unbilled energy actually arises: estimated and missing reads, meter faults and exchanges, CoT/CoS
      read disputes, theft, unregistered or unbilled sites, and the gap between settled and billed volume.
      Also say what a real supplier measures to catch it. For (b), cover the journey from arrears to
      write-off and the debt-cashflow forecasting levers. For (c), cover move-in, move-out and
      occupier-account handling, and the debt that follows a move. Read what we already hold BEFORE
      searching: docs/market_research/unbilled_revenue_accrual_e3.md, company_debt_management.md,
      gb_domestic_bill_payment_failure_and_arrears_prevalence.md and life_event_stream_w2_5.md, the
      closed E3/D1/D3 simplification records, and the Bad debt row of
      docs/institutional/knowledge_map.md. Add or update one knowledge_map row per area. Knowledge goes
      in the knowledge layer and machine findings go in the registers.
    why: >-
      The director asked for this to start straight away. Step 2 (unbilled energy) cannot be minted as an
      honest atom until we know how unbilled energy arises in reality, and the debt levers rest on knowing
      what was actually billed. DONE when all three notes are on origin with their Knowledge lines, each
      has a knowledge_map row, and the named gaps are filed rather than filled with a number.
