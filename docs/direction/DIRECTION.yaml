thesis_read: 'The supplier moved this stretch, and the honest answer to the thesis question is now on the record:
  cannot tell. B11''s within-segment term (27ca9dc7a) replaced the whole-book figure, two-thirds of which was flat''s
  own inverted gas segment. Per-customer clears flat only at 2020, and only by a hair (+0.061, interval +0.002 to
  +0.120 on 8b6fea024; +0.065 on ad8afadc5). At 2022 and 2023 it cannot tell. That is not backwards: it says the
  earlier reading overclaimed. A powered answer needs the varied draws, and c52f83113 made every seed-family member
  stamp its own grade and pool it. So the binding constraint on the thesis test is now the director''s seed listing
  (ep17), not code. C34 got the first engine caller of the three per-customer decisions (18503313a), off by default
  and byte-identical off. On the short window it decides 32 households and advises 1, and our floor refuses 95 of
  96 rows. So the director''s open C34 concern is now an engine reading, not a harness one. The gas-leg probe closed
  the dual-fuel re-take (dd35d2a18): per-household C35 changes how many decisions are made, not the rescue rate.
  Both items the last record re-issued as Lane 0 were drawn and landed, which corrects the steer that had drifted
  at 14:22. The third item, the budget floor, was not drawn. The seat''s own new error: it called the HH-EAC leg
  (d) grade queued when its continuation had lapsed, so the BLOCKING leaver finding had no route. It leads focus
  now, on the run already going (59e1658d6 carries 6208ea6dd). Split: supplier 1, both 1, world 3, other 6. The
  world commits were the director''s constant-anchoring reading, which is his call. dd35d2a18 sits on HEAD and not
  on origin, which is the divergence the brief reports. Its grade is counted here as evidence, but nothing downstream
  of origin can see it until it is pushed. Corrected this stretch: the dual-fuel re-take, the B11 split, and the
  stalled atom-id steer.'
