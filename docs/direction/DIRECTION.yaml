oriented_at: "2026-10-01T05:23:38.288126+00:00"
thesis_read: >-
  THE ANTI-RANKING WAS MOSTLY THE WORLD, NOT THE COMPANY. That is the stretch's meaning, and it
  moves the thesis forward by removing a false lesson rather than adding a capability. Last stretch
  I said the value arm loses because the company's retention belief anti-ranks the world, and I
  guessed the world's tenure slope was a housing-tenure confound. The guess was wrong, and the real
  cause is worse for the world. The world's bill-shock base (saas.customer_reaction yoy count) cannot
  fire in a household's first year: k=0 on 156 of 156 tenure-1 rows, against 6.86 shocked months out
  of 12 later. That one term carries the whole tenure gradient (-0.346 to -0.009 when it is held) and
  the whole bill-size gradient (-0.272 to +0.003). Hold it, and the company belief's pooled score
  against the world goes from -0.336 to +0.197 (8dd7794bd). Published evidence points the other way
  on both: longer tenure switches less (Ofgem, CMA 2016), and spend barely correlates (BMG 2024).
  So a company taught to fit the world's retention would have learned a defect. That is advantage by
  access to an artefact, the reverse of the thesis, and it was caught before anyone built it. PB4
  now defines the experienced shock by the published definition (a0ccd009b). The hazard still reads
  the old count on purpose, and a one-world run measuring the new shock is on the box now (pid
  4051166, pre-registered in 57b505ca3). A second world gap surfaced from the licence (9d6ad4551):
  about 65% of fixed-term ends are passive and roll no departure at all, although the record makes
  every term end a decision point (Ofgem's 2019 EoFT trial: 6% external switching within six weeks).
  The error runs the company's way. EP1 now values on all-cause exit over exposure, the defined
  reading, with a life table by tenure year and an untruncated survival sum (627f05756, 7e2503507,
  127c007f0). The gap arm fell from 1.558 to 1.275. But nothing a supplier holds at first valuation
  ranks tenure within a cohort. What ranks forward margin is mostly the fuel split: legs alone
  +0.545 against the belief's rate +0.387. The fitted blend fails out of sample. "Legs, then rate"
  held every prediction on two re-drawn-dice runs (2acb617d4), but it cannot be licensed, because
  re-drawing dice cannot vary a household trait (C1 failed, 16% and 11%). Replicating it needs a
  different book, which is EP17 (R13 curriculum). That ruling is the director's, and the worker has
  already sent him an NTFY with its recommendation, so I do not repeat it. ON THE MACHINE: all three
  previous focus items were drawn and finished, and they disappear. 388d33b76 brought the shared
  checkout back to origin, from 1 ahead and 42 behind. The ahead commit, 75df9efdf, was a live
  land-twice instance: a second "EP1 pass 20", byte-identical in code to d77ff33d5, dropped and
  preserved. The ten untracked blockers were supervisor._sync_origin_staging, not staging_watcher
  as I had it. Three of them matched an EARLIER origin revision, and the reconciler cannot clear that
  case, so it recurs. That mechanism is H49 (level 0) and it is the third item. origin_reconcile
  logged REFUSED_CONFLICT every five minutes from at least 04:07 to 04:22 while nothing raised it.
  The stretch had 26 commits and 7 substantive; 5 were empty merges or heartbeats.
