thesis_read: >-
  THE NUMBER THAT REFUSES THE THESIS WAS NEVER A MEASUREMENT, AND THE ANSWER IT WAS WAITING FOR HAS
  BEEN IN THE TREE SINCE 2026-09-04. That is the stretch, and it is the best news this seat has had
  in a month. All three focus items were drawn; two landed; the third is a measurement running on
  the box right now. `SETTLEMENT_CUSTOMER_YEAR_BUDGET = 1200` is what publishes NO to "can the book
  that would settle the choosing be built", and its own note said nothing bounded it "except an
  interval preference nobody has stated". That sentence has been FALSE for seventeen days:
  `background/publish_freshness.py` carries the director verbatim from 2026-09-04 -- the site
  publishes once a week -- and declares itself the single source of truth for the cadence at
  `PUBLISH_CADENCE_SECONDS = 604800`. Nothing carried the answer back to the question. Worse, the
  probe that prices the ceiling reads a DIFFERENT cadence: `settlement_ceiling_probe
  .publisher_context()` takes it from `docs/observability/publish_gate_duration.jsonl`, whose last
  twenty rows all carry 5,400 -- stamped by `suite_duration_watch.PUBLISH_CADENCE_SECONDS`, whose
  comment still says it "is not a budget anyone chose; it is a measurement of how often runs
  actually arrive". That is the circular ruler the ceiling document removed by name in August,
  reached again by a second route nobody re-asked, and `recommend()` has a `publish_interval_s`
  parameter built for exactly this that no caller has ever passed. Two live publish cadences in one
  tree, 112x apart. One decision, three implementations, no edge between them -- the VAT shape, and
  the director is right that this seat is the only place it can be seen. AND MY OWN PREDICTION IS
  REFUTED, WHICH IS WHY IT WAS FILED. I predicted about 0.67s per marginal customer-year on a 215s
  fixed component, so roughly 2,335s to settle the smallest leg's 3,163.9 customer-years. The two
  points landed so far say 1,197.0 cy in 1,494.1s and 1,995.2 cy in 2,660.9s: a marginal rate of
  1.462 s/cy on a NEGATIVE intercept, so the curve is convex, not affine, and the smallest leg
  extrapolates to about 4,369s -- 1.87x my number. My CONCLUSION survives and my arithmetic did
  not, and it survives only because the ruler moved underneath it: 4,369s is 0.72% of a weekly
  interval and 81% of the 5,400s one. Under the ruler I was reasoning against when I filed the
  prediction, that measured slope would have made time very nearly the binding leg. I got the right
  answer for the wrong reason and I am recording that rather than banking it -- and the two
  remaining points are still running, so nothing here is established until the artefact lands. ON
  PUBLISHING, WHICH IS MINE AND IS NOW THREE STRETCHES DARK. The wedge was not a defect nobody had
  solved; it was a commit nobody had made. The whole fix for
  `test_every_real_census_hit_is_covered` sat uncommitted in the shared tree from 16:07, written by
  an earlier invocation, while the gate stayed red at HEAD -- the third instance of that class in
  three days. It landed at `12f4073ed`, mutation-proven, and I re-ran the suite myself this
  orientation: 60/60 green. And the site half of the same instruction was work that did not need
  doing: the offending field had stopped existing on 2026-09-19 when an ordinary feed regeneration
  took that array from four rows to three and rotated the prose out. I instructed a worker to
  regenerate a feed that was already correct, in a worktree holding 42 other lanes' dirty `site/`
  artefacts, and the only reason that cost nothing is that the worker checked and refused. STILL,
  NO FIGURE HAS REACHED A READER. `episode_clean_publishes` is 0, `episode_failures` 18, 45.4 hours
  since the last clean publish and 43.2 since the wedge began. The gate state was last written at
  16:59Z -- fourteen minutes BEFORE the fix landed -- so it describes a tree that no longer exists,
  and the `process_run_complete` tick on the box has been running 24 minutes against a HEAD it took
  before the landing. A nineteenth failure from THAT tick is not evidence the fix failed. And both
  commits are unpushed: HEAD is two ahead of origin, so the repair that unwedges publishing is
  itself somewhere no reader can see. The method is the enterprise value, and a method whose output
  has not reached a reader in two days is not yet demonstrated. Two instruments closed cleanly:
  `ea39d8063` made a merge carry work only where its combined diff is non-empty, measured 47 of 47
  merges in agreement with an independent census, and 35 of those 47 authored nothing -- and this
  very brief shows it working, reading 5 of 13 as changing nothing where the old rule would have
  said 0. That repair found a new defect on the way, which I am listing rather than fixing here:
  `git log --name-only` prints no filenames for a merge, so the brief's own `substantive` field is
  false for all 47 -- silence, not agreement -- and it feeds `is_material`, which decides whether
  this seat orients at all.
