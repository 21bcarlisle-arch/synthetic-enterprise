focus:
- id: the-value-arm-loses-money-on-the-better-belief
  what: 'Read why the value arm with A''s belief loses GBP 1.21 per household-year where the flat book
    with the same belief gains GBP 0.14. Use only the pairs already on disk: /var/tmp/vta-out-flag0/member_11111_22222.json
    and control_11111_22222.json (flag off), and /var/tmp/vta-out-flag1/member_11111_22222.json and control_11111_22222.json
    (flag on). Launch nothing; step 6 and the D5 book hold the box. FIRST, before any read, add a section
    12 to docs/design/THE_VALUE_TEST_REDESIGN.md that pre-registers a predicted share of the loss for
    each candidate section 10 names: (a) retention offers move to households the value arm''s pricing
    already kept, (b) offers it used to make by accident to leavers worth keeping are lost, (c) the dice.
    THEN, for the 101 households whose decisions moved, write each one''s decision difference (offer or
    price, by date) and its money difference. Attribute the GBP 1.21 across (a), (b), (c) and a residual
    named "unexplained", and grade the prediction with a Graded value-test trailer.'
  why: This is the thesis question in its sharpest form, and it has gone undrawn for two stretches behind
    harness continuations. Inference improved and the per-customer supplier lost money with it, so either
    a lever spends good inference badly or the value arm's objective is wrong. Step 6 can size the loss
    but cannot explain it, and the renewal retrain (B) would stack on top of it. Done means section 12
    is on origin with its prediction filed before the read, the 101-household attribution and the grade
    trailer, and one named next change (a lever, the objective, or "we cannot tell, the dice") that step
    6's read can confirm or refute.
  lane: B_commercial
  side: supplier
  written_at: 1794918269.127
- id: the-d5-book-is-graded-and-published-or-its-refusals-named
  what: d5book-pause-watch (/var/tmp/d5book-pause/watch.sh, log watch.log) is armed. It stops step 6 once
    /var/tmp/vta-out-flag1/member_33333_44444.json and control_33333_44444.json exist, waits for the next
    docs/staging/run_complete_*.md, and relaunches step 6. Do not re-arm it or launch a second book. When
    that book's run_complete lands, first confirm the book ran at or after 341df4965 and 317b1d56c. Confirm
    also that /var/tmp/longjob-value-test-step-6-flag1.log shows the relaunch keeping 11111_22222 and
    33333_44444. Then read the book against the publish gate and the domain invariants. Grade rows 4 and
    7 against docs/staging/SEAT_FINDING_D5_SWITCH_ON_PRE_REGISTRATION_ROWS_4_AND_7_2026-11-17.md. Grade
    INV_OVERDUE_WITHIN_PAGE_BALANCE and INV_GAS_MONTHLY_USE_DOES_NOT_REPEAT_LAST_YEAR against the 16 Nov
    refusal (7 and 5). For each row or invariant still refusing, name its cause and an owner in docs/staging/SEAT_FINDING_THE_VAT_ROWS_LAST_BREACH_IS_AN_OPEN_ESTIMATED_RUN_AND_THE_16_NOV_BOOK_IS_REFUSED_AS_PREDICTED_2026-11-16.md
    or in a new finding. If the watcher has not fired by 22:00Z, read watch.log and step 6's log, and
    record why in THE_VALUE_TEST_REDESIGN.md's pause paragraph.
  why: Billing accuracy is first in the director's order. Every published-book check waits on a book newer
    than 9 Nov (the cold read, the Capabilities strip on f4f825b8b, the final_month_nets grade, the catch-up
    VAT check, then W3_3). The mechanics were armed this stretch and the grading was not. Done means rows
    4 and 7 and both invariants are graded on a D5-on book. It also means a verified publish carries that
    book, or every refusing row has a named cause and owner. Step 6 must be running again from its third
    pair.
  lane: D_billing_metering
  side: supplier
  written_at: 1794918269.127
- id: focus-outranks-a-continuation-chain-of-any-author
  what: In background/delivery_lane.py the continuation-before-focus swap (SELF_HANDOFF_CHAIN_LIMIT, _self_issued_chain)
    counts only continuations a claim-holding tick wrote. Continuations written by a claimless session
    never trip it, so on 17 Nov five of them were drawn in a row and focus 1 got no draw for two stretches.
    Add a second leg to the swap. Once the current DIRECTION.yaml's first focus item has gone undrawn
    through SELF_HANDOFF_CHAIN_LIMIT or more consecutive continuation draws since the record's oriented_at,
    the next draw takes that focus item before any continuation, whoever wrote it. Continuations gated
    by a "DO NOT DRAW BEFORE" date are unaffected. Write one control over the whole partition. It should
    assert, in a single statement, that a continuation can still win the first draw and that focus wins
    after the limit. Mutate the new leg off and show the control goes red. Then replay today's draw ledger
    through it and record which draw would have taken focus 1.
  why: The steer is the thing drifting. Two consecutive records' first items went undrawn behind continuations
    that were each defensible, and the existing limit was built for exactly this starvation but keyed
    to authorship, so it cannot see it. Done means the leg and its mutation-proven control are on origin,
    and at the next orientation the brief's previous-focus check shows the first item drawn.
  lane: H_harness
  side: other
  written_at: 1794918269.127
- id: the-paused-banner-commits-only-on-a-change
  what: background/process_run_complete.py, together with background/publish_freshness.py, commits the
    verification-paused banner in site/data/publish_provenance.json about once an hour while verification
    is paused. da4e1b310 and 37dbb1c5e this stretch, like 6c025b3b9 before them, differ only in written_at.
    Make the banner commit only when a field other than written_at changes. Add a control showing that
    re-pausing in an identical state makes no commit and that a changed state still does, and mutate it
    both ways.
  why: Every origin move lengthens a landing's race, and the D5 landings lost several of them. A banner
    that carries no change is the one origin move we can remove for nothing. Done means the control is
    on origin, and the next stretch's commit list has no banner commit whose only change is written_at.
  lane: H_harness
  side: other
  written_at: 1794918269.127
