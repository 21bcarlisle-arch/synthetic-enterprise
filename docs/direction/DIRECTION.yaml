      This is the thesis's own question, and the only live run that answers it. A family of two
      seeds, p=0.77 and p=0.90, cannot say whether D's sign is decision or noise. DONE when a
      SEAT_RESULT_ on origin grades every prereg line over five seeds sharing one weather-store
