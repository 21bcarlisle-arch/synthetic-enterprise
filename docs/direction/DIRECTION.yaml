focus:
  - id: SPINE_1_scenario_world_state
    what: >-
      Harden the forward-run path that 18c3ecb8c added, and take SPINE_1 from L2 to L3 if it holds.
      (a) Mutation-prove both new controls.
      tests/simulation/test_a_run_past_the_record_names_the_world_it_lives_through.py must go red
      when forward_world stops patching the runner's own bindings (patch sim.cache_store instead, the
      old defect).
      tests/simulation/test_the_forward_price_feed_has_no_gap_after_the_record.py must go red when
      the synthetic series restarts at last_record_year + 1.
      (b) Add to tests/sim/test_scenario_spine.py a run-level dormancy control. A short in-record
      run through run_forward_scenario under history_replay must settle byte-identically to the
      plain runner, or the test must name the existing test that already asserts this.
      (c) Run the cold-eyes-walk skill as the Expert Hour on the forward path: forward_world, the
      analogue-weather permutation keyed on the base seed, and the 2025-06-08 seam. File each
      disqualifier as a finding.
      Record L3 through the level gate only if no disqualifier stands. Do not touch
      /var/tmp/se-depth-out or the queued legs.
    why: >-
      Depth is the one lever with a measured, compounding effect on the selection SNR (0.19, 0.33
      and 0.73 at 4, 7 and 10 years). The depth legs queued behind P/C will read 2025-2029 through
      this path. Two defects were found in it the day it was built: no forward price ever reached a
      run, and there was a seven-month hole. A third found after those legs run voids them.
      DONE when the row reads L3 on mutation-proven controls with the Expert Hour on file, or stays
      at L2 with each disqualifier filed as a row.
  - id: PB8_a_households_payment_channel_changes_over_its_tenure
    what: >-
      Build the supplier-authored route that the 226976c0f frame says needs no world rate. In
      company/billing/dd_collections_desk.py, after N consecutive returned collections (read from
      the DirectDebitBook.failed_attempts it already holds), the company stops presenting: it calls
      cancel_mandate and moves the account to pay-on-receipt credit. Wire that through the seam so
      the household's paying channel follows the mandate.
      For N, first search for published policies from suppliers beyond British Gas's "2". Then NTFY
      the director a practitioner question with a recommendation ("building at 2, per British Gas,
      unless the trade norm differs") and proceed. Declare the origin through
      tools/domain_constant_origins.py as a single-supplier source.
      Controls: an account with N returns leaves DD, and one with N-1 does not. Write a partition
      control asserting both branches are reachable on a real book. Repoint PB8's file_scope to
      the billing path and its control, delisting it where the map contract requires, and record
      the level move.
    why: >-
      Credit is the half of selection where the per-customer arm loses on every draw. Today the
      world returns DDs and the company records each return, but no production path acts on them,
      so a monthly bouncer stays on DD for life. That is a supplier no real company would be. This
      is fidelity on the side the thesis is being decided on, and it is decided blind to results.
      DONE when cancel_mandate has a production caller in the collections path, both N branches
      are controlled, the director has been asked about N, and PB8 has moved off L0. The
      household-authored route stays parked.
    lane: W2_customer_generator
  - id: list-commits-no-ref-will-keep
    lane: H_harness
    what: >-
      Build the smallest mechanism that lists finished commits at risk of loss. Across
      `git worktree list --porcelain`, find every worktree HEAD (detached or branch) whose commits
      are not ancestors of origin/main and are not on a pushed ref. Print the sha, subject,
      worktree path, lock state and .se_worktree_owner. Surface the list in the delivery-seat
      brief beside "WHAT IS ON THE BOX". Reuse the merge-base --is-ancestor logic that
      origin_reconcile or surgical_land already holds, and put the REUSE block in the commit
      message. Make it fail closed: an unreadable worktree prints as unknown, never as empty.
      Write a control that builds a scratch worktree holding one unlanded commit and asserts the
      list names it.
    why: >-
      SPINE_1 and the monthly prospects existed for hours only at /var/tmp/se-combo's detached
      HEAD. They survived because the console seat remembered them, and that is luck, not a
      mechanism. Finished work that never leaves the tree is the costliest loss this project
      makes. DONE when the brief lists unlanded worktree commits, and the control proves that a
      planted one appears.
