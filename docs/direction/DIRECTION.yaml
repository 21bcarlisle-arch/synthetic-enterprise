  kind: strategy
  what: 'Step 1''s knowledge says the priority order needs changes before step 2 starts: the world must make used,
    settled and billed energy three numbers; home moves and billing complaints belong in step 2; world debt must
    be graded against Ofgem''s series before the debt lever; step 4 should start with households that respond to
    contact, including badly.'
  proposal: Adopt the sequence in docs/staging/SEAT_PROPOSAL_WHAT_STEP_ONE_TAUGHT_ABOUT_THE_ORDER_2026-10-05.md;
    it also carries four practitioner questions only the trade can answer.
  status: answered
  resolution: 'APPROVED by the director 2026-10-05, with amendments. (1) Complaints: complaint statistics see only
    those who complain (the 9/17/23% switching figures describe complainants; Ombudsman figures the escalated few);
    treat them as a FLOOR on dissatisfaction, not a measure of it, and model the silent unhappy (probably the disengaged,
    who switch less) rather than building dissatisfaction around complaints. (2) Next best action is the per-customer
    decision spanning debt, retention, upsell and carbon advice -- the customer''s benefit first, then ours -- judged
    by CLV; debt handling for a customer in arrears is one of its decisions. (3) The practitioner questions are
    the seat''s to own: research, derive or estimate; where unpublished, an assumption toggle with a plausible range,
    tested for whether any decision changes across it; escalate only if decision-changing AND unresolvable.'
