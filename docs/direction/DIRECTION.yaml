thesis_read: >-
  The thesis moved this stretch, but only by a little, and the world had a bigger finding than the company
  did. The reactive save is on origin (bfcae065d, 517ffec2c) behind a curriculum switch that is off. It
  has the director's two fairness conditions as controls, and it is graded at both ends of the published
  save-rate range on one seed to 2024-12-31. At a save rate of 0 it ties never offering. At 0.041 it keeps
  one household and adds GBP 1,679, and 0 of 4,898 stayer account-terms change price. That is the first
  settled-run result where a per-customer decision beats the flat rule without the stayers paying for
  it. But it is one household on one seed: it shows the mechanism, not the size. The size cannot be told
  apart on one book until the director answers the EP17 concern. The departure base is now settled for
  the director's hold. Four draws withdrew 2024 (20.0%, 27/135) and found 2025 (29.3%, CI 19-42) not shown
  to exceed its ceiling (c38c97622), so the one-seed 30.4% that reopened it was the high draw. That meets
  the departure half of the hold; the arrears like-for-like half is still open, so the 400 founders still
  wait. The world's biggest finding is in 272ec3fe9. The gas home's +200 kWh excess is not an end use.
  It comes from who lives there: 3.02 occupants per gas home against Census 2.36, with 18.5% in 5+ households
  against SERL's 5.2%, because bedrooms are inverted from floor area at 14 m2 each. Every premise's electricity,
  and so every bill, direct debit and arrears figure, carries that, so the headcount fit comes ahead of
  new levers. All four items of the previous focus were drawn. The save and term-end items finished, the
  SERL 2021 item was answered by the occupancy split, and the voids split has been held since 22:57Z without
  landing yet. The machine went backwards on one axis: the shared checkout is 58 behind origin, from 50.
  The annual report running now computes from that stale world, so anything it publishes predates this
  stretch's world changes. The 20:20 record did reach origin (290fa6a29), and no long job died.
