thesis_read: 'Three hours: 13 commits, 10 carrying work, 8 substantive. The split reads 1 supplier, 1 world, 1 both
  and 10 other, and this time the classifier is roughly right: the stretch went mostly to knowledge pages and world
  mechanics (the GDELT coverage series, the 2021-22 SoLR failures, the switching GSOP, the phone queue on both sides
  of the wall). Those came off the continuation queue as director-steered items, not off the focus. Against the
  thesis the one move that matters landed: the out-of-sample test is now pre-registered (s.12g, eb41172a1) before
  pair 2 could shape it. It runs the 0.12 cut on book 61118, against A and the flat-rules twin, on households it
  was not fitted to, and it predicts the advantage below the refutation line (-GBP 0.40, -2.00 to +1.20). Its watcher
  is armed and alive. That is the first test design that can say whether inference beats flat rules rather than
  whether a tuned cut survives a redraw. It also means the honest standing answer is still ''not shown'': the only
  twin comparison on file is -GBP 0.33, in-sample. Nothing went backwards, but nothing moved a level either. Of
  last stretch''s five focus items, item 1 landed and is gone. Item 2 (the stayers control) is being worked right
  now in /var/tmp/se-seat-stayers-belief and stays in focus. Item 3 (B8''s holdout switch) has not landed and moves
  up. Items 4 and 5 are still correctly embargoed: control_55555_66666.json does not exist, and the child''s log
  is at December 2023 nine hours in, so it writes about 14:30-15:00Z. Of the three Lane 0 rows drawn with nothing
  landed, the-0-12-replication-is-read-out-of-sample is spent (300302799 graded it, eb41172a1 filed the real test),
  and the B8 and KNIFE3 grade rows were drawn before their book existed and are premise-not-ripe, not undone work.
  My own error this stretch: I put the media-coverage series in not_now as world work that blocked nothing, when
  the director''s 21 Nov bill-shock steer asked for it. The machine built it anyway, which was the right call. The
  checkout is 57 behind origin, so every daemon runs code the branch has moved past. That is left alone because
  a fast-forward under a live pinned run is not this session''s to make.'
