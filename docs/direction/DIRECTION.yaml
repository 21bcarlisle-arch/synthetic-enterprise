thesis_read: >-
  THE STEER BIT, AND THE THESIS DID NOT MOVE THIS STRETCH. No level moved, and no new evidence about
  inference against the flat rule arrived. That is the honest reading, and it is not a regression:
  the question now waits on compute, not on code. Three of the four focus items finished.
  (1) Both pre-registrations landed at 595004fc0 (05:41Z) before any P/C leg ran: /var/tmp/se-pc-out
  holds no legs_pc.log and no P_ or C_ artefact yet. So the arrears test will be graded against
  predictions dated before its answer. That corrects my bundling error, and the pre-registration
  instance of the carried row.
  (2) The selection leg is published in two parts (498c7afbb): churn pricing wins on every draw, and
  credit loses on every draw to one write-off. A reader can now see that the per-customer arm
  loses where it cannot see, not where it chooses. That is the thesis shape, stated honestly
  ahead of the 2026-10-05 publish window.
  (3) SPINE_1's build (18c3ecb8c) and the monthly prospects (af5a66f52) are now ancestors of
  origin/main, and /var/tmp/se-combo is gone. The work survived, though nothing would have listed it
  if it had not. SPINE_1 still sits at L2: the forward-run path it added is unhardened, and the
  depth legs (E2025/E2029, legs_depth.sh, queued behind P/C) will read it.
  (4) Grading the width pairs and the P/C legs was my error. The director's console instruction at
  07:51Z gives that exact grading to the console seat, so a Lane 0 worker on it is a second grader
  on one artefact. It leaves focus.
  THE BINDING CONSTRAINT IS THE BOX'S ONE SERIAL RUN SLOT. Width pair three (pid 106851, ~7.5 GB)
  has run for 1h52m. P/C, then depth, wait behind it, and both chained waiters hit wait_for's
  21600 s DEADLINE this stretch and rolled to a hand-looped round 2. The work that moves the thesis
  is therefore in flight, and this direction points Lane 0 at work that does not compete for that
  slot. That means hardening SPINE_1 before depth reads it, and building the supplier's own DD
  stopping rule. That rule is a credit-side fidelity gap, and credit is exactly where the arm loses:
  a household whose DD bounces every month stays on DD for life, because no production caller
  cancels a mandate. The machine's shape is still wrong. Nine of 19 commits were merges, and eight
  of the 19 carried no work. d2b9087c8 found 10 of 11 failed seat commits were a lost race.
