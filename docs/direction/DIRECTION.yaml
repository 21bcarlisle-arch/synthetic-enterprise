thesis_read: >-
  Against the thesis the project moved one step and then stalled at the step after it. There is still no valid
  comparison of the per-customer supplier against the flat-rules baseline. Fix 0 landed (daf6029e9, 13:39Z): the
  FTC withdrawal window now starts on 2021-10-01, the published zero-gap quarter, so last stretch's ordering error is
  corrected as an instance. But its remainder has STRANDED. The continuation fix-0-capture-and-2021-anchor-refit-on-the-moved-window
  is held on /var/tmp/se-fix0-capture/departure_factors_fix0.json. That is the file its OWN capture would write. The
  reader took the item's conditional hand-off clause ("if the capture will not finish, hand the refit on with DO NOT
  DRAW BEFORE ...") as its hold. No capture is running and /var/tmp/se-fix0-capture does not exist. So nothing will
  ever release the refit, and the rankq re-grade, which waits on the refit's signal file, will never release either.
  This is the thesis's critical path, and it is deadlocked by a parser. It goes first, and it is done by hand as Lane
  0, not by waiting on the queue. The publish wall moved, and all of it was billing work. The 91c32797b3 book refused
  on three rows, and every row now has a landed cause. d688a224a issues a leg's bills in period order, which clears
  SYN-2016-099's 8 page breaches. 7f90f9563 asks a leg that left level on supply only its final bill's face, which
  clears PROS-2023-0338g. fcd2facdc makes the publisher grade the ledger on the run's own commit, which clears
  PROS-2019-0305 (an uncommitted world edit, not the desk). 08d0603bf (15:22Z) attributed the last four netted final
  bills, so that focus item is finished and leaves focus. No book has been built on a commit carrying all three, and
  the site has shown 18 Nov for eight days. The shared checkout has DIVERGED from origin: 3 commits are on HEAD only,
  and fcd2facdc is on origin only. sim-runner, which resumes about 15:50Z, and the publisher both run from this checkout.
  So the next book would be built and graded by code that lacks the ledger fix, and it would refuse on PROS-2019-0305
  again. The commit split was 0 supplier, 2 world and 17 other. Read honestly, the two world commits (fix 0, and bills
  issued in period order) serve the baseline comparison and the bill, and fcd2facdc and 7f90f9563 are supplier-billing
  correctness labelled other, so the balance is acceptable. Seventeen record and park commits for five substantive
  ones is heavy, though, and the parks are waiting on a book nobody has launched. The director commitments due 2 Dec
  (the K8 one-leg test and the forward bands) were not drawn in 3 h and stay in focus, last. The retention commitment
  due 27 Nov was met by a189c2824 (the 25 Nov ruling's part 3, answered and archived).
