thesis_read: >-
  The steer correction worked and it should be said before anything else, because it is the only
  reason this stretch has a level move in it. I named A46 as an atom id twice and it was drawn
  neither time; I re-keyed the identical work as lane 0 and it was drawn first, worked and landed
  inside one stretch. `717472661` did the whole of it — the false "clean two-point slope" sentence
  in the file addressed to the director is now replaced with what the artefact actually says, the
  `<!-- MENU TABLE -->` placeholder is gone from both documents, all four preregistered predictions
  are marked beside themselves and two of them are marked WRONG against me, `engine_bound_basis`
  carries the established answer instead of `NOT YET KNOWN`, and `A46_book_depth_is_a_curriculum_question`
  moved 0→1 — the first level to move in four stretches. It is L1 and not L2 and the map says why in
  its own comment: what is missing is the director's ruling, not our work. **That item is finished
  and it disappears from this file.** The second thing that happened is that the funnel answered its
  question while nobody was looking. `value_cycle_ab_s1_three_arm_20260830.json` landed at 05:32Z
  carrying `method_skill.drop_out.available: true`, and the split of the fourteen dropped decisions
  is **0 join, 4 coverage, 10 eligibility** — reconciling exactly, 20 logged = 6 scored + 14 dropped.
  Read against the thesis that is a bigger result than the item that commissioned it. I asked which
  of those fourteen were *ours and recoverable today*, expecting the answer to be the lever that
  sharpens the concordance this week. The answer is **none of them**: zero are a join we failed to
  make, ten are eligibility (`the_priced_term_carried_no_settled_row` — the arm priced a term the
  world never billed under), and the four coverage cases are a gap in our sourced default-tariff
  series, which the artefact's own class definition says is *"widenable, but the work is outside this
  measurement"*. So the measurement scoring the thesis cannot be widened by tidying our own code. Six
  decisions is what this world can offer, and the reason is the world. **And that is precisely what
  the director's brief says, in his words, arrived the same morning independently**: *"the company
  can never be right or wrong about why a household moved. That is the only thing worth inferring,
  and it is the whole of the thesis."* Two lines of evidence converged on one diagnosis this stretch
  and they were produced by different lanes hours apart. Against that, the honest reading is that the
  project moved forward on design and stood still on measurement. `067a00dfd` gave the world a
  standard variable product that is a genuinely different product and not a different label — no
  locked rate, no term boundary, no renewal notice, cap-bounded off the series we already hold — and
  **no account is on it**. `population_draw.py:222` still reads `tariff_type: Optional[str] = None`,
  the 158-of-168 unreached accounts are unreached by exactly as much as they were yesterday, and the
  roadmap amended itself in public four hours after being written to say that assigning them (C1b)
  cannot come before a departure carries a reason (C2), because an SVT account has no renewal and
  every field of a renewal-shaped churn event is meaningless for it. That amendment is right and it
  is the sequencing constraint that decides this direction. So: the instrument is honest, complete
  and unusually well-controlled; what it measures is six decisions on ten founder accounts, 1.46% of
  the renewals the world offered; the one figure outside its null is still more likely to be
  measuring our extraction than our inference; and we now have a diagnosis, a design and a
  preregistration for the thing that would change that, and no code. The work is C2.
