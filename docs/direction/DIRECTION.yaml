thesis_read: >-
  Three hours: 8 commits, 6 carrying work, 5 substantive. The split reads 0 supplier, 2 world, 6 other,
  and by content no supplier code moved. Nothing went backwards. The thesis test has not answered yet:
  the 0.12 pair is in its second child, at Nov 2023 at 03:22Z, so its read is close but not in this
  stretch. The useful result is a refuted premise, and the premise was mine. Last record's item 2 asked
  for a per-debt sale rule built from the company's own contact history. The worker measured first
  (9d3e4de57): the world recovers the same share of every written-off debt, and the company's 0.122 is
  the world's 0.122. So a per-debt rule has nothing to find, and it could not fail in a run. 834610bd1
  added the published evidence (debt buyers exclude debts in sensitive circumstances; buyers collect
  about twice the price, so 11-19p per GBP, which brackets 0.122). A parallel draw had already built
  the learned rule; it is parked on branch knife3-per-debt-sale (9fcd4a53fa), which no remote holds.
  This is the thesis working as it should: inference cannot beat average where the world gives it
  nothing to infer. The world-first successor that makes recovery vary by what a supplier can see is
  in its landing gate right now (surgical_land on simulation/final_bill_outcome.py). The supplier rule
  waits on it, which is item 3. The gas item is done (22f1dfa98). Of the 433 fallback legs, the ERA5
  pull can fill 319 and never 114, and the incoming occupier's heating share is a named GAP, so no
  constant gets built. W1_14 moved ERA5 to 474 of 919 cells. The previous focus was drawn on two of
  four items, both finished. The pair and the D48 switch-on are dated, not stalled. Lane 0 not_done
  rows: poesys-net-goes-behind-a-login waits on the director's Zero Trust sign-up (his open row), and
  its advisor file stays in docs/staging/advisor/ until that step is done. skip1 landed under a2c848965b
  last record. The checkout is 15 behind origin, so daemons run the pre-b8132407e collections code.
  That matters only for in-place edits, and item 3 says to work from origin.
