      refuse. The one reading we have says the flat rule wins by £4,208, with nothing to say whether
      that is noise. The page has carried a withdrawn reading since 28eb35ec7. DONE when the 20261002c
      pair is graded and on the page, or withdrawn with a named reason. If depth-vs-width is still
      running at the next orientation, the floor is WAITING. Say so and do not relaunch.
  - id: a-timed-floor-leg-is-counted-once
    lane: H_harness
    what: >-
      Fix running_floor_legs in tools/run_value_cycle_ab.py, which floor_run_headroom_refusal uses.
      At 17:16Z it counted the `/usr/bin/time -v` wrapper (pid 347062, 1.7 MB) and its python child
      (pid 347063) as two legs, each priced at 11,200 MB, so it asked for 33,600 MB where the one leg
      needed 22,400 MB. Count a wrapper and its run_value_cycle_ab child as one leg. Land it with a
      control that builds that exact pair, and assert it counts 1 where it used to count 2. Add a
      second arm in which two genuinely separate legs still count 2, so the fix cannot pass by
      counting everything as one. Mutation-prove it.
    why: >-
      Every timed leg (the whole depth-vs-width family) is priced double, so a later floor beside
      any of them gets refused for a reason that is false. Here the refusal was right anyway
      (22,400 > 19,677), so this defect did not cost the retake. The next refusal may not be. DONE
      when the fix and its control are on origin.
  - id: bind-the-ledger-row-of-a-bind-that-was-a-ledger-write
