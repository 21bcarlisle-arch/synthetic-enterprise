focus:
  - id: the-reconciler-closes-ahead-while-the-behind-leg-grows
    what: >-
      The checkout is 14 commits behind origin/main and 1 ahead, and that 1 is a liveness heartbeat
      that carries only `docs/observability/agent_status.json`. Sixteen reconciliation merges ran in
      the last 12 hours and the behind leg grew from 5 to 14. First MEASURE, in one process: count
      the full pre-commit gate cycles `background/origin_reconcile.py` and
      `background/reconcile_watch.py` spent on commits whose tree equalled a parent's, and read
      `git rev-list --count HEAD..origin/main` before and after each. Then make two changes and land
      them with `python3 -m tools.surgical_land`: (a) the reconciler's success condition becomes the
      BEHIND leg reaching zero, never the merge process exiting 0, and it reports failure while
      behind is non-zero; (b) the liveness heartbeat (grep `chore(liveness)`, written under
      `background/process_run_complete.py`) does not create a local commit while the checkout is
      behind origin, because a heartbeat that forks the tree manufactures the very gate cycle that
      then cannot keep up. Write a control that fails when a reconciler run reports success with a
      non-zero behind count.
    why: >-
      This is upstream of almost everything else in the stretch. `docs/observability/.publish_gate_state.json`
      records the publisher's own failure cause as `behind_origin` with the evidence "origin/main is
      5 commit(s) AHEAD and 1 commit(s) here ALREADY write this publish surface without reaching
      origin", so the site is dark for this reason and no other. Every daemon on this box is
      executing code the branch has moved past. 30 of 48 commits carried no work and the machine
      spent more gate-minutes closing its own forks than landing work. Done when
      `git rev-list --count HEAD..origin/main` reads 0, the publisher's recorded cause is no longer
      `behind_origin`, and a deliberately-behind checkout makes the new control red.
  - id: value-arms-18-seed-floor-collect
    what: >-
      DO NOT RELAUNCH ANYTHING -- `tools.run_value_cycle_ab --level-arm --redraw-mode all
      --noise-floor-seeds 444444,555555,666666` is live at pid 1011796 writing
      /var/tmp/se-floor18-head-20260925/shards/leg5.json, and legs 1 to 4 are already complete there
      at roughly 4.5 hours each. Wait for leg5 with `tools/wait_for.py`, never `pgrep`. When it
      writes, collect all five shards, re-run `tools/generate_value_arms_data.py`, and place the
      re-run residual against the figure `site/data/value_arms.json` currently serves. Land the
      result with `python3 -m tools.surgical_land`, and put the outcome beside the prediction already
      written in
      docs/staging/records/SEAT_PREREG_THE_EIGHTEEN_SEED_RE_RUN_AT_HEAD_REPRODUCES_THE_SERVED_RESIDUALS_2026-09-25.md
      rather than revising it. The path check reads value_arms.json and its generator as identical
      to HEAD; that is correct -- the shards are not collected yet, and the ask is not spent.
    why: >-
      This is the baseline leg of the thesis and the only work in this record that bears on whether
      "the company beat average" means anything at all. It was named in the previous direction and
      never drawn, so the steer itself is what drifted. A blocking finding already argues the pinned
      selection residual is the control arm cancelling and the re-draw missing the priced decisions,
      which is a claim that the served figure may not survive its own re-run -- and that is a result
      either way. Done when the page either reproduces the served residual at HEAD or says on its
      face that it cannot, with the sample size the bound earns; a silently unchanged page is not
      done.
  - id: the-published-refusal-is-false-at-the-instant-a-reader-sees-it
    what: >-
      `docs/observability/.publish_gate_state.json` holds `liveness_surface_refusal` = cause
      `push_never_landed` for git_hash 7bcf2518f, and `git merge-base --is-ancestor 7bcf2518f
      origin/main` returns true: origin DOES contain that commit, so the refusal a reader is shown
      is false right now and the seat brief repeats it verbatim at the top. In
      `background/publish_cause.py` and `background/publish_freshness.py`, make a refusal that names
      a commit re-ask the remote ref for THAT commit at read time, before the field is rendered by
      `site/assets/freshness-banner.js`, and downgrade it to the existing `lost_push_race` vocabulary
      when the commit has since landed. Land with `python3 -m tools.surgical_land`. The path check
      will say "nothing to land" on these files; that is expected for unstarted work and is not a
      spent ask.
    why: >-
      I predicted last stretch that this field would go green without the defect moving, and it did,
      and it has now come back false rather than empty -- which is the only state in which it can be
      graded. A refusal pinned to the instant of its own observation is a fail-silent surface: it
      tells the director the push never landed while origin holds the commit, and it will do so again
      at every fork. Done when a commit that reaches origin after its refusal was stamped reads as
      landed to a reader, proven by a control that stamps a refusal and then advances the ref.
  - id: the-fleet-drift-oracle-is-the-local-head-not-the-branch
    what: >-
      `process_reconciler.evaluate_boot_sha_drift()` now correctly publishes population 11, graded 11,
      `stale: []`, `vacuous: false` -- and grades every daemon against `boot_sha.current_head()`,
      which is `git rev-parse HEAD` on a checkout 14 commits behind origin/main. Publish the
      checkout's own distance from the branch beside the verdict, so `stale 0` can never be read as a
      healthy fleet while the tree it was measured against is behind, and make the control assert the
      PROPERTY (a fleet graded against a behind checkout must not report clean) rather than today's
      count. Files: `background/boot_sha.py`, `background/process_reconciler.py`; land with
      `python3 -m tools.surgical_land`. The path check reads these as identical to HEAD, which is
      correct for work not yet started.
    why: >-
      The denominator repair that landed in `e1736649a` is real and I graded it true, but it fixed
      the count and left the oracle -- the same class arriving through a third door in the same week
      I recorded the lesson. Every one of those eleven daemons is in fact running code the branch has
      moved past, and the instrument built to notice exactly that says the fleet is clean. Done when
      a checkout deliberately set behind origin makes the verdict say so.
  - id: sanity-daemon-mute-cause
    what: >-
      `sanity-daemon` is the one row on the brief's actionable mute list with no cause on file: unit
      active, silent for its whole 9h16m run, wchan `hrtimer_nanosleep`. Establish which of the five
      known causes it is -- writing to a path the journal reader does not watch, wedged, mute by
      construction with no write-out path at all, restarted faster than it speaks, or genuinely
      nothing to say -- by reading `background/sanity_daemon.py` for its `print`/log calls and
      checking whether the file it writes has advanced. Write the finding to `log_silence` on that
      daemon's row in `background/process_manifest.yaml` and land with
      `python3 -m tools.surgical_land`.
    why: >-
      Carried from the previous direction, named and never drawn, and it is a fifteen-minute write
      that keeps a whole instrument honest: the five daemons established so far came out as five
      different causes, so a class verdict would have been wrong for at least one, and an unexplained
      mute row is the only shape in which a genuinely wedged daemon would be indistinguishable from a
      healthy quiet one. Done when the row carries a cause and `sanity-daemon` moves off the
      actionable list in the next brief.
not_now:
  - what: >-
      Repairing the 23 ungradable maturity-map rows that owe a repair, and the 27 ungradable rows
      overall.
    why: >-
      Last stretch was almost entirely instrument work and the map grader is now honest about its own
      denominator, which was the part that was lying. Another stretch inside the instrument buys no
      thesis, and four of those rows will change shape once the fork and publisher story in focus one
      closes. Deferred deliberately, not forgotten.
  - what: Sweeping the 15 BLOCKING findings as one batch.
    why: >-
      They are not one class. At least four of them -- the checkout that cannot advance, the
      receiptless-commit door, the ruff census red in the shared worktree, the publish recorder
      snapshot -- are downstream of the fork treadmill, and clearing them individually now would be
      fixing instances of a cause that focus one removes. The rest are genuinely separate and can
      wait a stretch.
  - what: >-
      Building the control for the `git restore --source=stash@{0}` completeness class -- a path
      present in the stash but in neither HEAD nor the index is silently skipped, and
      `git diff --quiet HEAD -- <path>` is quiet for an untracked path whatever its content, so the
      sweep would report a genuinely lost file safe.
    why: >-
      Rejected for the NINTH consecutive stretch, and I am recording the count because a rejection
      repeated without being counted stops being a judgement. Reproducing it needs a real stash
      against a tree with three live writers, and manufacturing that safely costs more than the
      class's current exposure. The mitigation in force is prose and holds: no item in this record
      grades a working copy's age by that clock. If it reaches ten, it goes in focus regardless of
      what else is due.
  - what: Holding `token-proxy` rather than leaving it enabled.
    why: >-
      It has logged nothing for 235h because nothing routes through it -- `ANTHROPIC_BASE_URL` is
      unset for every claude process on this box -- and the brief files it as a director-facing call.
      It is not one: a declared process moving between enabled and held is a dial, reversible in a
      line, and it costs 7.2MB. I am deciding to leave it enabled, because removing the token
      accounting route is harder to undo than leaving an idle listener up, and revisiting it when
      something needs the accounting.
  - what: Giving `worker-seat-manager` a heartbeat line so it stops reading as mute by construction.
    why: >-
      It is a real behaviour change to the daemon that seeds the worker seat, and it would arrive as
      a side-effect of tidying an instrument. Its cause is already established and on file, so the
      brief is not misleading anyone. It deserves its own evidence and its own window.
  - what: Restarting the 18-seed floor run to get an answer sooner.
    why: >-
      It would discard 13.5 hours of completed legs sitting in
      /var/tmp/se-floor18-head-20260925/shards/ and restart a roughly 22-hour clock. Waiting costs
      nothing that acting would not cost more of.
