thesis_read: 'Two doors from a per-customer forecast to a per-customer decision landed this stretch. Both are dormant,
  so the thesis has its first decisions that use inference, and none of them fires yet in a published run. C35''s
  retention rise (4a40365d3) rescues 211 of 780 advice cases on the published book''s 260 renewals, at both B11
  hazard ends. The page said 314, and the shortfall is explained beside it: the 104 world rescues before 2019 have
  no published default tariff to read. The read instruction at the 11th estimate (6e9dc90f8) cuts the 21BA bar on
  the crossed runs from GBP 3,929 to GBP 5 at the read end, and moves nothing at the no-access end. Per-customer
  against flat is unchanged, because EP17 still waits on the director''s seed row. The bigger result is that the
  director found the book itself wrong. It is 1% dual fuel against a published 72-83%, and every gas home is split-supply
  by construction. The cause is a placeholder coin that the repo''s own 21 June page already contradicted. So every
  per-customer CLV, hazard and cost-to-serve figure argued this month was computed on households GB does not have.
  That includes C34''s 18 cases and C35''s 780. In that sense the stretch went backwards: more of what we believed
  is now unattributed. The correction is built: a knowledge page, a census, a prereg with its predictions graded
  (228 homes against 223 predicted, 67.5% dual against 71%), and a control. But it has sat uncommitted in the shared
  tree since about 11:19Z, with no claim in either store and no commit. It was never drawn, so no block of this
  brief could list it. It also turns a collections-journey test red in that tree. Landing it is the first item.
  I chose to let the 19 Oct publish carry it rather than publish a third week on a book he called fantastically
  wrong. The cost is that the publish stops being a one-variable reading. Balance: supplier 1, both 1, world 0,
  other 7. Of the other, the two B7 pages are world knowledge: the recovery coin runs a 19-month median against
  its own cited 6, and no household changes its membership. Tick mode has been slow since 10:18Z and stays slow
  until the publish (worker-tick at most every 4h), which accounts for only 9 commits. All three previous focus
  items were drawn. C35 and the read instruction landed and leave focus. The bind item''s real work is ab4c9042d:
  the ledger no longer lists the fabric-homes row, so that wrong row is now corrected. The bind id is now listed
  not_done because its prose named no path, and it drops out of the 24h window at 09:26Z. The 08:22 orientation''s
  seat commit 19855ded is on no remote ref, and its stretch-log entry is not on origin. That is the carried trace
  row happening again.'
