- id: the-forward-world-has-bands-for-gas
  raised: '2026-11-24'
  kind: strategy
  decision_kind: curriculum
  what: The forward world has bands for gas and the renewable fleet only. The weather-to-price chain's
    shippable form also needs forward levels for transmission demand, interconnector net flow and carbon,
    and forward_years.json carries none of the three
  proposal: 'Add three bands to docs/design/curriculum/forward_years.json, each labelled on every forward
    figure. (1) Transmission demand (ND): hold it at its 2023-25 record level, about 25.4 GW, with embedded
    solar growth taken from the renewable fleet band, so demand and fleet come from one capacity path
    (electricity page s.8a). (2) Net flow: the FES 2025 ES1 annual interconnector level per case, uniform
    across cases, starting from its 2025 column (s.5a; the 2030 spread is -23.8 to +8.1 TWh). (3) Carbon:
    DESNZ''s 2025 traded carbon values, Low to High (2030: 25 / 50 / 66 GBP/t, real 2025), drawn jointly
    with the gas case, because DESNZ''s low-carbon case is its high-fossil-price case, plus CPS at 18
    GBP/t nominal to March 2028 and held nominal after that (s.2a)'
  recommendation: I recommend yes to all three. Each is the published band, or, for ND, the default the
    record supports. Until a band exists, every forward chain figure would carry a level nobody chose,
    which K2 counts as asserting a value. Nothing forward is built until you answer, and the record-years
    work carries on meanwhile.
  based_on: 069ff7a75e
  status: answered
  resolution: '"Yes." Director, chat 25 Nov 12:31 GMT, via docs/staging/advisor/done/DIRECTOR_RULING_K8_FOR_WORLD_MODELS_FORWARD_BANDS_YES_AND_STEP_BACK_ON_THE_RETENTION_RESULT_2026-11-25.md.
