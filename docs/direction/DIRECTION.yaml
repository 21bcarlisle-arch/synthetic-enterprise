  raised: '2026-10-04'
  kind: canon_intent
  what: The end-to-end review of CLAUDE.md found it contradicting the code on the reserved action walls, pointing every session at a staging procedure that still described
    the July rules, using one name for several seats, and claiming enforcement for two rows that only report; three of its findings touch canon or wall wording that is yours
    (the curriculum wall reads stricter than your 2026-09-04 canon; DIRECTOR_CANON.md lists seven one-way doors and the twin as standing approver; DIRECTOR_AXES.md cites a
    pricing law that no longer exists).
  proposal: 'Approve the cleanup as proposed in docs/staging/SEAT_PROPOSAL_CLAUDE_MD_CLEANUP_FROM_THE_END_TO_END_REVIEW_2026-10-04.md, item by item, or strike the items you
    disagree with; on the three canon items, rule on the wording and I will carry it into the canon documents. Already done without asking: the plain factual corrections it
    marks, the reserved-actions list restated from the code, and the two withdrawn rules in the staging procedure.'
  status: open
  resolution: ''
- id: time-is-scored-in-minutes-not-converted-to-money
  raised: '2026-10-04'
  kind: vision
  what: The mission names three currencies, and time does not exist in the model. The C31 frame (70ea47ac5, docs/design/C31_TIME_AS_A_CURRENCY_DISCOVER_FRAME_2026-10-04.md,
    Q1) has to decide whether household time is scored in its own unit or converted to money at a value of time. Converting it would fold one of your three currencies into
    money. The only regulator pricing found (GSOP, GBP 30 or 15) prices failure events, not hours, and it is a transfer.
  proposal: 'Score time in its own unit: household minutes, per class (shopping, servicing, recovery, routine admin), never summed across classes and never converted to GBP.
    A GSOP payment stays a money transfer and is not a measure of time. This does not block L1, which counts events in minutes either way, so work carries on unless you rule
    otherwise.'
  status: open
  resolution: ''
