thesis_read: >-
  Sixth stretch, zero focus items drawn, and this time the channel was open and something else was
  standing in front of it. Last stretch I converted every focus id back to a slug on the diagnosis
  that atom ids were routed into the jammed atom draw while slugs reach Lane 0. That half was
  RIGHT and I verified it at this orientation rather than assuming it:
  `delivery_lane._atom_ids()` filters nothing out, and `direction.unreachable_focus` yields all
  five slugs, in my order, right now. The steer arrived at the lane intact. It still delivered
  nothing, because `delivery_lane.next_item` walks TWO stores and the second is only reached when
  the first is empty: `seat_continuation.live()` is offered first, unconditionally, and the focus
  loop sits below it. I called `next_item` at this orientation. It returns
  `census-loader-sweep-continue-2026-09-05`. Not a focus item — and it cannot be, because the
  continuation store has FIVE live entries (4.1h, 3.0h, 2.1h, 1.9h and 0.2h old) against a
  `STALE_AFTER_SECONDS` of six hours. Five arrived in the last 4.1 hours, one every 49 minutes,
  and each expires only after six. An arrival rate faster than the expiry means the store never
  empties, so the focus loop below it is not reached slowly — it is not reached at all, by
  arithmetic. That is the whole stretch explained: all eight substantive commits match a live
  continuation subject one-for-one (the 272-refusal attribution, the census loader sweep, the
  process_run_complete lane, the reconciler advance), and not one arrived through focus. It also
  finishes the apparatus error I have carried open for five stretches, which was never a question
  of ranking: a tick working an apparatus continuation finds the next apparatus defect and writes
  the continuation that preempts focus again, so the queue is SELF-REFILLING and the refill is
  always apparatus because that is what the last tick was looking at. The two thesis continuations
  in the store are the proof: `the-baseline-was-beaten-in-a-world-that-no-longer-exists` (40.9h)
  and `departure-level-emerges-from-the-household-not-the-solver` (23.3h) both aged out past the
  six-hour window without ever being taken, while apparatus entries were refreshed faster than
  they could die. AND I MUST CORRECT LAST STRETCH'S OTHER CLAIM, because it is refuted by
  measurement and in the informative direction. I wrote that the atom draw's starvation of PB4 was
  permanent and widening — "471 draws separate PB4 from the floor and the distance grows
  monotonically". It shrank. `_prefer_least_stalled` is byte-identical (unrepaired, so focus item
  1 was not done either), but the 02:20 ANTI-LIVELOCK line reads a floor of 1504 where it read
  1413 three hours ago, PB4 is unmoved at 1884, and the gap is 380, not 471. The floor climbs
  about thirty draws an hour and is swallowing the stalled set one atom at a time — KNIFE3 at 1504
  joined it between two consecutive log lines. So the atom draw un-jams itself in roughly half a
  day at the current rate, by the ugly mechanism of nothing else moving either, and that is why it
  is NOT this file's first item any more. The thesis position is unchanged and unflattering:
  R1's ceiling still says the best possible function of the company's observables recovers nothing
  of a household's true elasticity its own noise floor does not also reach, so advantage-from-
  inference remains untestable rather than unproven; `tools/settlement_ceiling_probe.py` still
  carries 226 uncommitted lines at 2026-09-03T07:10 and `tools/fit_departure_hazards.py` its 93;
  `site/data/value_arms.json` still publishes
  `share_at_which_a_bigger_book_could_resolve_it: -4.5507` graded `share_is_decisive: true`; no
  level moved for the eleventh stretch; blocking findings are 18; the staging root holds 93
  documents on a net +58 over seven days; and the tree is 1 ahead and 20 BEHIND origin/main, so
  every daemon running from this checkout is executing code the branch has moved past.

