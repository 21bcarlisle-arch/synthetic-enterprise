thesis_read: 'For the first time in ten slices, inference was tested on what a real supplier holds, and the answer is "cannot
  tell". That is honest, and it is not yet a result against the thesis. B11 slice 10 (5f57b9042) gave the departure hazard
  tariff type, payment method and months on the default tariff, read only from the company''s own term record and bills. It
  cannot rank switchers above the flat rule beyond the 95% bound at any of 2020, 2022 or 2023. The finding''s addendum shows
  why this is not the end of the question. Split by cause, months on default reproduces the published switching gradient on
  switches alone (0.68 and 0.50, against CMOL''s 0.54). Moves run the other way, and the all-cause hazard washed the two together.
  So the prior was right and the hazard it multiplied was the wrong quantity. Slice 10 also found a level drift in its own
  rule (P2, wrong at every cut). Two published gradients the world is said to carry do not show up in who switches away: prepayment
  switches at about direct debit''s rate, not 0.55x, and "fixed" in this world mostly means a customer''s first term. If the
  world does not produce the departure correlates the record says real customers have, then targeting by observable is rigged
  to fail here. That is the director''s 2026-10-08 worry from the other side, and it makes a world measurement the second
  item. Billing accuracy moved too. The theft screen now reaches the monthly billing run behind a switch that defaults off
  (3161365d3). The money an estimated final bill leaves open at closure is priced at GBP 3,471 of GBP 13,467 (8cd8e9954).
  A gaining supplier''s first read could reach at most GBP 701 of the GBP 2,222 dispute seed, and only at the every-case ceiling
  (bc4c80fca). That continuation correctly refused to build a dispute path, because the dispute moves money between suppliers
  rather than creating any. Balance: supplier 1, both 1, world 1, other 12. Most of the "other" commits are a run of five
  self-issued W2_36 continuations in three hours, each narrowing the same closing money. It is billing work, but on the world''s
  side and at falling pounds. After the read-duty split now landing (surgical_land 3365466), I am not ordering any more of
  it until the publish. Both previous focus items were drawn and both landed, so both leave focus. The last stretch''s seat
  error is therefore corrected: slice 10, reissued under a Lane 0 key, was drawn and landed. Correction of a brief reading:
  the fabric-homes item the ledger lists as not_done did its work in e6cdc9af9 (on origin, 01:27Z), inside a commit credited
  to another row. The work is not missing. The C34 holdout door is landing now (surgical_land 3270648), and its own message
  says no run on this book can decide a 2-point effect. Nothing went backwards. The director''s console line "86%" is a reading,
  and it sets pace, not work.'
