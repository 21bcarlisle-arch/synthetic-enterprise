focus:
  - id: grade-ab6-bridge-and-pilots
    lane: B_commercial
    what: >-
      If /var/tmp/se-ab6-out/runP2.json does not exist (due about 13:40Z), release with no staging
      file and stop. Never stop or restart the running tools.run_value_cycle_ab. Otherwise run
      /var/tmp/se-ab6-out/grade_lineage.py runP1.json runP2.json. Compute n* from P1+P2's own mean,
      as the ab6 prereg defines it, and never from ab5's |m| = £1,009.68, which the bridge showed
      overstates the pin. Grade P1, P2 and P3 beside their predictions. Confirm that
      churn_rolls_redrawn > 0 on every pilot seed. List the commits between a322166cc and
      origin/main that touch company/ or simulation/, and state that the answer describes the pin.
      Append all of it to
      docs/staging/records/SEAT_PREREG_THE_NEXT_AB_ON_THE_SINGLE_ROLL_WORLD_WHAT_A_SEED_VARIES_2026-09-30.md
      and land by pathspec. If n* ≤ 12, launch the extension legs (61005...) through
      background.launch_long_job with --peak-mb 11200. If n* > 12, write the plain answer "cannot
      say on this book under its own renewal noise". Point at the book-varying prereg, and state
      that its pilot waits on the director's EP17 ruling. Do NOT build or launch a multi-cast run
      from this item.
    why: >-
      This is the first measurement of whether per-customer beats flat rules under the world's own
      renewal noise, which is the thesis's baseline question. DONE when origin's ab6 record carries
      P1-P3 graded, and either an extension unit is active or the plain answer is written.
  - id: put-the-ep17-line-into-the-book-varying-prereg-and-build-the-refusing-flag
    lane: B_commercial
    what: >-
      Add a section to
      docs/staging/records/SEAT_PREREG_THE_AB_THAT_VARIES_THE_BOOK_NOT_THE_SEED_2026-09-30.md
      saying that varying live_population's base_seed draws a different cast, which is
      EP17_varied_population_draw. Name its R13 block_reason in docs/design/maturity_map.yaml, and
      amend rule 2: the book pilot launches only on a director ruling. Leave every prediction
      untouched and say so beside the amendment. Then build tools/run_value_cycle_ab.py
      --book-seeds as that prereg specifies. It resolves each book in its own subprocess, sets the
      churn-roll floor seed equal to the book seed, and records run_base_seed() per member. Add
      its three refusals (a duplicate seed, a recorded seed that is not the requested one,
      redrawn = 0) and a FOURTH refusal. The fourth refuses any member whose seed is not
      _DEFAULT_BASE_SEED unless an authorisation record exists under docs/design/curriculum/ in
      the population_draw_activation.json shape. Do not write that record. The refusal must name
      EP17 and the missing file. Write the one-leg control without running the sim. It compares
      founder_book(S1) and founder_book(S2) rosters (about 1.4 s) and the patched roll streams on a
      shared id, and it asserts the authorisation refusal CAN fire and CAN pass, using a temporary
      record in a tmp dir. Run nothing memory-heavy while ab6 is on the box.
    why: >-
      The prereg's own ~70% branch would put the company through different casts of households
      without the ruling R13 reserves. The branch is only reached if P2 says n* > 12, so fixing it
      before P2 lands keeps the successor a prediction and not an improvisation. With the flag
      built behind a refusal, a yes from the director costs no turn of code. DONE when origin
      carries the amended prereg and a --book-seeds flag whose unauthorised run refuses and names
      EP17.
  - id: the-next-trailer-refuses-a-blocked-atom
    lane: H_harness
    what: >-
      In tools/next_step_gate.py, refuse a `NEXT: <atom_id>` trailer whose atom carries a
      block_reason, or sits at loop_stage idle with one, in docs/design/maturity_map.yaml read
      through tools.maturity_map_store. The refusal must quote the block_reason and offer the two
      legal shapes: a drawable successor, or `NEXT: none -- <reason>` naming the release. Add a
      control over the whole partition: one drawable id passes, one parked id (PB8's) refuses, and
      `none -- ...` passes. Mutate the new check to always-pass and to always-refuse, and record
      that both red.
    why: >-
      46b78123f handed PB6 on to a parked PB8, and PB6's own step went undrawn for a stretch. This
      stretch the workers used `none -- <reason>` correctly, but by habit, not because anything
      held them to it. DONE when origin's gate refuses a NEXT naming a parked atom, and the carried
      wrong row about it can be marked corrected.
