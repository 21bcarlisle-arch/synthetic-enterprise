    why: >-
      Any fix before the inverted term is named would be a guess at the lever. The decomposition
      is cheap and uses existing artefacts, so the build waits one item for it.
  - what: Re-sending the EP17 four-book pilot ask to the director.
    why: >-
      The belief steering the value arm still anti-ranks within direct debit. Varying the book
      under it prices the same inversion four times. It becomes worth his attention only after
      the inverted term is fixed or shown not to exist.
  - what: Re-running the full ab6 A/B at origin/main.
    why: >-
      PB6, W1_14, D27 and EP13 have all moved since the pin, so a moved result could not be
      attributed, and the interim says PB6 alone moves nothing. It follows the estimator fix.
  - what: A second PB6 run, or any new long run, to answer the decomposition.
    why: >-
      C0 proved the value-only rosters reproduce the three-arm ones to the bit. The inputs are
      recomputable from them, so a sim run would be 30 min per seed of box for a number the disk
      already holds.
  - what: Binding the lane-0 not_done rows (grade-ab6-pilots-once-runp2-exists as premise_spent; grade-the-ab6-bridge-leg as landed under 504b42a37).
    why: >-
      Bookkeeping that changes no level. The ledger no longer misattributes them, which was the
      defect. Any tick passing can bind them.
  - what: A heartbeat line for the mute worker-seat-manager.
    why: >-
      Its cause is on file and its wait channel is still hrtimer_nanosleep. A behaviour change to
