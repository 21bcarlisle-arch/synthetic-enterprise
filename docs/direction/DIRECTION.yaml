      coin-drawn decision set (seeds 42, 101, 202) with a market fix offered in place of the
      capped default. Test 2: compute the settled run's departure share at the same
      anniversaries and compare it with the decision set's 0.40. If both leave the gap, rank
      explanation 3 (the hazard is too high) against the published fixed-term-end and annual
      switching figures, and file it as a fidelity defect to be fixed blind to company results.
      Do not touch the churn draw in this item. File the verdict in the finding.
    why: >-
      Fidelity is the precondition. Every retention figure, the save offer's included, divides
      by the share that leaves, and at 17% instead of 40% the same cut implies a save rate above
      the published range. DONE when tests 1 and 2 are graded in the finding on origin and it
      names which explanation the evidence supports. If that is 3, DONE also needs the defect
      filed on the W2 lane.
