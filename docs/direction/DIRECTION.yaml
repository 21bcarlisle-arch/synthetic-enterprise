thesis_read: >-
  Three hours: 17 commits, 12 carrying work, 5 substantive. The split reads 1 supplier, 3 world and
  13 other; 5 of the 17 are merges that changed nothing. Nothing went backwards, and the thesis test
  has still not answered. The 0.12 pair is on seed 2 of 2: seed 1 finished in 20,071 s, and seed 2's
  run had reached Dec 2020 at 06:22Z. Its read is due around 08:00, so item 1 stands as it was.
  The stretch's main result is a second refuted premise, and again the premise was mine. I asked the
  per-debt sale rule to land once the world's recovery varied by age at close. f696fca4e made it vary,
  so a bill more than 12 months overdue recovers 0.52 of the share. The KNIFE3 replay (98177f319) then
  showed that the company cannot see that variation. Its learning window is 365 days, but the agency
  remits 575 days after the final bill, so 0 of 215 remittances fall inside it. Its cells also divide
  by the whole closing balance, most of which the customer paid before write-off. The cells spread
  (0.03 to 0.92), but on customer cash and not on recovery. At 5.4p the rule would sell 118 young
  debts that are worth 12.2p. The landing rule refused it, and only the sensitive-circumstances
  exclusion landed. So the advantage there is real and inferable, but the company is reading the
  wrong window over the wrong denominator. A supplier knows its own agency's remittance lag and its
  own write-off amounts, so the fix is an inference fix with no access in it, and it is item 2. The
  prepayment check is done: 7dd43e4a7 replayed 67d454905c with f0445b2dc reverted, on the same seed
  and window. Every run-output figure matched and the report was byte-equal, so that wrong row closes.
  The previous focus was drawn on two of four items, and both finished. The pair and the D48 switch
  are dated, not stalled. The director's 05:58 reading asked for the spare points to go to the
  findings triage and the work system first. The plan ranked them, but nothing the draw reads carried
  them, so neither had moved. Both now have continuations, and the triage is item 3. Counting matters
  for it: origin's staging root has 11 BLOCKING findings, while the shared tree has 1, because about
  200 dispositions sit uncommitted there. Lane 0's not_done row, poesys-net-goes-behind-a-login, waits
  on the director's Zero Trust step (his open row) and is not drawable. The checkout is 1 behind origin.
