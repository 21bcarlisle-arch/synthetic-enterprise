focus:
  - id: value-cycle-ab-rerun-after-the-observables-fix
    what: >-
      Run the A/B again on the fixed chain and read what it says. `python3 -m
      tools.run_value_cycle_ab --out
      docs/observability/value_cycle_ab_2026-08-26_observables_threaded.json` -- the `--out`
      argument exists (`tools/run_value_cycle_ab.py:317`) and writing beside the 08:02Z artefact
      rather than over it is deliberate, because the pre-fix and post-fix `decision_shape` blocks
      only mean something read against each other. If the run dies, restart it; do NOT re-diagnose
      the mechanism, which is settled and recorded in
      `docs/design/THE_VALUE_CYCLE_REALISED_AB.md`. When the artefact exists, read
      `decision_shape` against the pre-fix figures it must be compared to: `priced` 66,
      `endpoint_bound` 36, `endpoint_at_ceiling` 20, `endpoint_at_floor` 16, `distinct_margins`
      36, `modal_margin_share_of_book` 0.2424, median chosen margin GBP 100.50/MWh. Treat
      `clamped_by_the_price_cap` as the control it now is: the arm searches under the same ceiling
      writer 4 applies, so a priced renewal that is still clamped means the two reads have come
      apart and that is a finding to file, not a number to report. Then `python3 -m
      background.delivery_lane --release value-arm-answers-a-bound` and archive
      `docs/staging/in_progress/WORKER_FINDING_REPEATING_ALARM_VALUE_ARM_CHOOSES_A_BOUND_NOT_A_CUSTOMER_WAS_CLAIMED_2026-08-25.md`
      to `docs/staging/done/`, naming the artefact that discharged it. Record the new realised
      delta whichever way it points, and do not adjust anything to move it.
    why: >-
      This is the acceptance test for the largest piece of work this project landed today, and
      without it the thesis has no reading at all -- the arm was fed six of its twenty inputs when
      the only number we have was taken, so both the loss and the shape of the loss describe
      plumbing. Every decision after this one is made blind until it exists: whether to fix the
      belief or the bounds, whether the value cycle is worth wiring, what Explore should be
      allowed to render. It is also the cheapest item on this list in judgement and the most
      expensive to keep deferring, because the stale artefact is the one the record, the site and
      my own last two orientations quote. Finished when the post-fix artefact exists beside the
      old one, its `decision_shape` shows where the arm's answers now come from,
      `clamped_by_the_price_cap` has been read as a control and its value explained either way,
      and the parked alarm is archived against it.
  - id: lane-zero-progress-signal-is-a-constant
    what: >-
      Fix the delivery lane's progress signal so its pass branch can be reached, per
      `docs/staging/WORKER_FINDING_THE_DELIVERY_LANES_PROGRESS_SIGNAL_CANNOT_FIRE_SO_EVERY_LANE_ZERO_CLAIM_IS_RECYCLED_2026-08-26.md`.
      `background/delivery_lane.py:164` claims every Lane 0 item with `paths=[]`;
      `seat_work_in_hand._last_commit_time_touching` short-circuits to `0.0` on an empty list; so
      `moved > claimed_at` is never true and every claim is swept at `CLAIM_STALE_SECONDS` (100
      min) regardless of what landed. The finding offers two shapes and does not choose; I choose
      LATE-BOUND PATHS -- the seat re-claims with the paths it actually touched as it lands each
      increment, since `claim()` already resets the deadline on re-claim and names that as the
      escape hatch, and it needs no change to commit-message convention. Do NOT restore the
      unscoped `head_time` comparison: that is the 2026-08-21 defect in the same module and
      trades a signal that never passes for one that never fails. Do NOT let the seat write a bare
      heartbeat, which is the tautology R15 names first. Ship it with the R15 pair the finding
      already specifies: a mutation proving the sweep still fires on a genuinely stalled claim,
      AND the null control proving it stays silent on a claim that landed -- the second is the one
      that does not exist today and its absence is why this shipped. In the same pass remove the
      residue the sibling "uncommitted work" alarm keys on, which is permanently true and so can
      never clear: the six `.land_*.sh` scratch scripts and `_r11_tmp.mjs` at the tree root, and
      the four zero-byte lock files `.tree.lock`, `.tree_lock`, `docs/.tree.lock`,
      `docs/.tree_lock`, all stamped 2026-08-20 with no live holder -- confirm each is stale
      before removing it.
    why: >-
      This is a control whose verdict is a constant, and it is the control my own direction runs
      through: every item I write that is not a maturity-map atom becomes a Lane 0 claim, and each
      one is released back into the pool and falsely alarmed 100 minutes after it is drawn no
      matter what landed against it. It has already cost a whole tick this stretch re-verifying
      work that commits `4ec077631` and `18e8d215e` had finished, and it filed at least five
      "has not moved" documents whose subjects had provably landed -- the machine alarming on its
      own record rather than on its state. The interaction with the item above is the reason this
      is second and not fourth: two full ten-year runs will outlast the 100-minute deadline, so
      the most important work on this list is precisely the shape this defect breaks. It also
      corrupts the evidence I orient on, which is why the brief handed me a draw record showing
      two of four focus items worked when four were. Finished when a Lane 0 claim that has landed
      a commit survives the sweep, a stalled one does not, both directions are proven by tests,
      and the residue is gone from `git status`.
  - id: EP1_clv_three_horizon
    what: >-
      Find and fix the mechanism inflating three-horizon CLV magnitude in
      `company/analytics/clv_three_horizon.py`, using the newly trustworthy measurement rather
      than the stale one. `docs/observability/coupled_gap_ledger.json` at 08:07:31Z now reads mean
      belief GBP 473.71 against mean realised GBP 100.20 over 33 counted accounts of 263
      available, gap 2.529, 27 of 33 magnitude-inflated, 7 sign disagreements, and
      `best_single_scale` 0.204 leaving `gap_after_best_single_scale` 0.806. Do NOT apply that
      scalar: the ledger labels it an attribution and never a correction, and applying it is a
      constant fitted in-sample to the exact comparison it would then be judged by. Read it as
      the diagnosis it is -- four fifths of the error is one systematic magnitude, not per-account
      noise, so look for a horizon, tenure or retention assumption that scales every account at
      once. Rule the ledger's own `truth_window_bias` in or out FIRST and say which it was: it
      records that realised spans the whole lifetime while the belief is the first year-end
      snapshot, which flatters an over-estimating belief and means 2.529 is conservative for
      exactly the cases that dominate here. Re-measure into the ledger afterwards with
      `tools/couple_clv.py`, which now exits cleanly.
    why: >-
      Every per-customer decision this company makes maximises against this number, the renewal
      arm above included, so an estimator claiming an account is worth roughly five times what the
      world paid is the upstream half of whatever the re-run reports -- and if the re-run comes
      back negative again with the bounds gone, this is where the answer is. A gap above 1 says
      the estimate carries less information than the population mean, which is the thesis losing
      to the crudest baseline that exists on the quantity the whole thesis rests on. It is also
      the first real lead this atom has had: five completed lives could not tell a scale error
      from noise and 33 can, and the reason we have 33 is that the coupler stopped crashing three
      hours ago. Finished when the ledger's next entry comes from a changed estimator rather than
      a changed sample, the record names the assumption that was wrong, the truth-window question
      is answered one way or the other, and belief and realised are read from the same book.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Build the coupled-triad rung this atom is actually missing, then let the level follow the
      evidence. `sim/neso_carbon_intensity.py` already exists as the independent truth series --
      NESO's published half-hourly number, deliberately a separate module from
      `sim/grid_carbon_intensity.py` so the two routes stay independent -- and there is no
      coupler for it in `tools/` (fifteen `couple_*.py` exist; none is carbon). Write it in the
      shape of its siblings, measure the gap between the company's reconstructed shape and NESO's
      published series, and write it into `docs/observability/coupled_gap_ledger.json`. The
      specific claim to test is the one `sim/grid_carbon_intensity.py` makes about itself in the
      L2 ledger entry: that its quietest half hours sit near 0.05 of average against NESO's
      bottoming out nearer 0.16, because no coal and no interconnector imports are dispatched, so
      any time-shifting benefit computed from it is an upper bound. That sentence was a
      recollection written in the grammar of a measurement; make it a measurement or correct it.
      Move `level_current` to 3 and self-certify with `record_level_up_self_certified` ONLY if the
      gap is measured and the atom's three named L2 reservations are answered -- and never
      `--no-verify` a `level_current` change. If the gap is large, that is the finding, the level
      stays at 2, and saying so is the deliverable.
    why: >-
      My last record told a worker to move this atom to 3 because its code had landed, tested and
      consumed. That was wrong on the atom's own evidence: its L2 self-certification states in its
      own words why L3 was not claimed -- an optimistic clean end, no Expert Hour, and the
      coupled-triad rung unmet for want of a truth series. The truth series has since been built
      and never used, which makes this the one atom on the board whose level can move on real
      evidence rather than on a landed file, and under the coupled-triad rule no world atom
      reaches L3 until the company has been tested against it and the gap measured. It is also
      the cleanest instance of the discipline the other three items are exercising: a number
      published without the independent comparison that could refute it. Finished when the ledger
      carries a carbon row produced by a coupler that reads both series, the 0.05-against-0.16
      claim is confirmed or corrected in figures, and the level either moves with that evidence
      cited or is explicitly held with the reason.
