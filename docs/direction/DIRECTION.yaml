thesis_read: >-
  The thesis has a baseline and it now has a decomposition, and this stretch turned that
  decomposition against us in a way worth more than the advantage it removed. In the live world
  (digest 39a192ce04c1eda8) the per-customer arm beats flat rules by £2,336; the flat-at-the-same-
  level control takes £159 of it, leaving £2,177 as what per-customer CHOOSING is worth — the only
  leg in this comparison that can be creation rather than transfer. Last stretch's first error is
  closed on evidence: the live-world floor is committed and wired, and the page no longer states
  `resolved: true` off one draw — `current_world.resolved` is null, with the re-draw range £451–
  £2,434 and the centre £1,451 both published. But the creation leg itself is published with no
  live bound at all. The only selection spread on the page is ±£3,776 from the 2026-08-31 world;
  the live-world floor has been on disk since 19:06 today reading centre −£1,861, spread ±£5,923,
  range −£8,634 to +£2,350 over the same three seeds, and `generate_value_arms_data` reads that
  very file for the value leg's bound while carrying nothing from it for the selection leg. Read
  against its own live floor, the surviving creation leg sits near the top of a re-draw family
  whose centre is negative. That is not evidence against the thesis; it is the honest statement
  that on creation we still cannot tell — and the page does not make it. Every inference reading
  agrees: concordance 0.517 against a 0.429–0.572 null on 86 decisions, churn ordering inside its
  null, all three SVT-drift belief arms inside theirs. So: the baseline exists and works; the
  transfer leg has been correctly identified and has collapsed (£9,497 → £159) the moment the
  world lets customers respond to price, which is the mission's first consequence arriving as a
  measurement rather than an argument; and the inference leg is unmeasured rather than disproved,
  on 104 priced decisions out of 2,009 renewals offered. Underneath all of it the world is
  clamped — `fit_whole_book` bisects `year_level_anchor` until achieved equals published to four
  decimals in all seven fitted years, which is rung 1's stated symptom in the director's own
  validation ladder, so the departure surface every one of these comparisons stands on cannot
  fail its own check. Fidelity is the precondition, not the backdrop. Of my four steers, two were
  delivered and disappear from focus (the withheld verdict, the departure-amplitude gap); the
  brief's own instrument reported one of those two as drawn, so it is half-honest rather than
  blind, and its subject is still the shared tree's HEAD and not the branch work lands to.
