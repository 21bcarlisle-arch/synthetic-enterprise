- id: the-retention-offer-gate-values-a-kept-household-at-what-the-arm-earns
  what: 'Section 12a of docs/design/THE_VALUE_TEST_REDESIGN.md names the next change as the lever. The
    retention-offer gate (_would_offer, simulation/run_phase2b.py near line 4468: value protected above
    offer cost, under the desk belief) values a kept household at the flat book''s margin. It should value
    it at what the value arm will earn from that household. Do this in three steps, in order. STEP 1,
    no box time: once /var/tmp/vta-out-flag1/member_33333_44444.json and control_33333_44444.json exist,
    run section 12a''s confirm-or-refute read on that pair. Count value-arm flips at identical rolls and
    identical common-fuel margins, A against twin, and grade the count against 12a''s stated confirm and
    refute conditions with a Graded value-test trailer. STEP 2, only if it does not refute: write or amend
    the K8 knowledge page on retention offers and save rates (published practice, GAPs labelled). Then
    find where the value protected is computed, and check whether a supplier decision is sitting in simulation/
    rather than in company/. If it is, file that as a wall finding. STEP 3: change the gate behind a default-off
    switch so the value protected reads the arm''s own expected margin for the household, with a control
    that asserts both branches can be taken and that names its defect. Mutate it, and show the control
    goes red. Launch nothing. The offer re-read (vto-offer-reread-watch) and step 6 hold the order of
    the box.'
  why: This is the thesis in its sharpest form. Better inference about who leaves was spent by a lever
    that under-values exactly the households the per-customer view makes valuable, so the baseline wins.
    A lever fix behind a switch costs no box time, and it is ready for the first pair after the offer
    re-read. If pair 2 refutes the mechanism, the build stops and the refutation is the result. Done means
    the pair-2 grade is on origin and, unless it refuted, so are the knowledge page and the switched,
    mutation-proven gate change.
