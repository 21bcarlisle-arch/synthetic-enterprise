thesis_read: >-
  On the thesis's own test, this stretch went backwards, and it was measured honestly. rankq (s.12g
  rank-at-q) ended at about 20:03Z and was graded at 20:29Z (5cf54da43). It came out at -GBP 2.45 per
  household-year against the flat-rules twin (-4.76 to -0.47). That is REFUTED by its own rule and BELOW
  by the interval: for the first time, the interval is wholly below zero. It is the third retention gate
  on A's belief (0.12 cut, 0.30, rank-at-q) that fails to beat the baseline out of sample. It is also
  confounded, because it offered to 0.109 of asks against the twin's 0.277, so "ranks worse" and "asks
  fewer" cannot yet be told apart. The director's open row s-12g-rank-at-q-run-graded holds the question
  of whether to run another lever. Focus 2 separates the two readings from the run's own records with no
  new run, and it does not wait on his answer. The supplier has not yet shown an advantage that comes
  from inference.

  The previous focus all landed. Its three items were drawn and are done, so they leave focus.
  dd7808361 keeps a file-held continuation live until its file exists, which corrects that row. The
  rankq reader fired from live() exactly as designed. 32f1aa078 wrote the post-rankq box order, and
  27f086748 ordered the default-off switches.

  The box order has a hole, and it is the stretch's main finding about the machine. From at least 20:40Z,
  sim-runner has deferred the owed book every five minutes ("budget exhausted: 18000 MB already declared"
  + 7066 MB > 23010 MB). The memory is declared by two long jobs that are only WAITING. A4
  (longjob-a4-ep1-dated-rate-value-arm, 12000 MB, launched 20:14Z) waits on B11 M7's readout. land10
  (6000 MB) waits on the book. B11 M7 waits on land10's end file. So the book is blocked by its own
  readers, in a cycle, and every queued supplier grade (MSC, B11 M7, A4, the five grades due 25 Nov)
  sits behind it. The book is now about 102 hours unbuilt. Focus 1 breaks the cycle and fixes the class.

  The commit split reads 0 supplier, 0 world, 29 other. By content, about 20 of the 29 are the
  weather-to-price chain's arms and pages, which is world work on the director's own 24 Nov steer. About
  4 are supplier records (the rankq grade, the A4 pre-registration, and the switch and box orders), and
  none is supplier code. The two executor landings the register lists as DIED (18:51Z, 20:12Z) were both
  refused by next-step-gate on a NEXT trailer that named a continuation, not an atom. Each was relaunched
  with a valid trailer and finished within minutes (…288 at 18:59Z, …148 at 20:18Z). They are not new
  instances of the race-to-origin row.
