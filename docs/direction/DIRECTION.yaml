focus:
  - id: land-the-map-split
    what: >-
      Land the map split as ONE commit, then its re-filer as the immediately next commit, with
      nothing landing in between. The pathspec is the IMPORT CLOSURE, not the seven paths my last
      record named -- derive it with `grep -rl maturity_map_store --include=*.py background/ tools/
      site/ tests/`, which returns 52 files (50 modified, 2 untracked), and add
      `docs/design/maturity_map.yaml`, `docs/design/maturity_map_closed.yaml`,
      `docs/design/MAP_SPLIT_2026-08-26.md`, `docs/design/MATURITY_MAP.md` and
      `tests/tools/test_couple_value_based_pricing.py` (that last one because
      `tools/couple_value_based_pricing.py` is inside the closure and must not land without its
      own control). Before landing, assert on HEAD+pathspec -- not the worktree -- that
      `tests/tools/test_generate_proof_coupled_gaps.py`,
      `tests/background/test_derived_artefact_register.py`, `tests/design/test_atom_records_store.py`,
      `tests/design/test_maturity_map_facets.py` and `tests/test_coupled_triad_gate.py` are all
      green; the two `TestStaleness` nodes may have a second cause, so if they stay red after the
      split lands, diagnose them separately rather than holding the split. Then add
      `maturity_map_store.refile()` -- move any atom whose half disagrees with `is_closed` into the
      correct half as one two-file write, BOTH directions -- call it from `merge_atom_status.merge()`
      after the field fold, make the fold stage `MAP_PARTS_REL` rather than `MAP_REL`, and
      mutation-test it both directions plus a null control per R15. Use `python3 -m tools.surgical_land`,
      never `--no-verify`, and do not wrap it in `timeout`.
    why: >-
      This one commit is the publish wedge, the record-destruction hazard and the tree-wide wedge,
      all three. Publishing is down because the gate keeps refusing a commit that would delete 224
      atoms; the co-calibration record and the coupler are stranded behind it; 50 modules in the
      working tree import a file git has never seen, so the supervisor that reads the working tree
      is running today on a module that does not exist at HEAD. And the re-filer is not optional
      polish: `tests/tools/test_maturity_map_store.py::test_the_split_predicate_agrees_with_where_
      every_atom_actually_SITS` reds the moment any atom's level reaches its own, that test sits on
      the tree-wide selection so it refuses EVERY lane, and `EP13_adapter_carbon_intensity` -- level
      2 heading for 3, `loop_stage: build`, drawn right now -- is the atom that arms it. Landing the
      split without the re-filer trades one incident for a worse one. Done when HEAD holds all of it,
      `map_store.load_atoms()` reads 298 from HEAD, the named tests are green in the gated tree, the
      re-filer's mutation tests fire in both directions, and the next publish cycle records a
      success rather than a sixth `commit_did_not_land`.
  - id: publish-state-records-no-red
    what: >-
      Make `.publish_gate_state.json` carry what the publisher already saw. In
      `background/process_run_complete.py`, the branch at ~4195 captures the hook chain's output
      into `_tail` and logs it, then calls `record_publish_gate_failure` with a prose `reason` and
      nothing else -- so the failing node IDs are written to `sim-runner-log.md` and discarded
      everywhere a reader would look. Pass the captured tail through, parse the `FAILED <nodeid>`
      lines out of it into `blocking_tests`, and populate `suspects` from their files. Mutation-test
      both ways per R15: a refusal carrying a known red must populate `blocking_tests`, and a clean
      empty-index no-op must leave it empty -- a parser that always finds something is the fail-open
      twin of the fail-silent it replaces.
    why: >-
      Tonight the state file said `total_red: 0`, `blocking_tests: []`, `suspects: {}` through five
      consecutive refusals whose log entries name six failing tests and print "COMMIT REFUSED". That
      is R15's FAIL-SILENT shape at the record layer: the diagnostic was taken and thrown away, so
      every downstream reader -- the wedge detector, the alarms, and four of my own direction
      records -- has been reasoning about a deadline while the machine held the answer. Yesterday's
      raise of `_COMMIT_DEADLINE` from 600 to 840 was bought with that blindness; tonight's gate
      finished in 636s and was refused on tests, so the deadline lever was never the lever. Fixing
      the split unwedges publishing once; this is what stops the next wedge costing a whole
      orientation to diagnose. Done when a deliberately-red publish attempt leaves the failing node
      IDs in the state file, and the mutation test proves the clean case stays empty.
  - id: EP13_adapter_carbon_intensity
    what: >-
      Land the carbon rebuild and take the atom from level 2 to 3. `sim/grid_carbon_intensity.py`
      (+152) and `tests/sim/test_grid_carbon_intensity.py` (+142) are still uncommitted;
      `sim/elexon_fuel_outturn.py` landed at `feaa30fed` this stretch, so the atom is half in git.
      Land the remaining `file_scope` paths with their tests in the same commit, self-certify the
      level move into `gate_authorizations.jsonl` via `record_level_up_self_certified` with the
      evidence, and never `--no-verify` a `level_current` change. HARD ORDERING: this must not land
      until the re-filer from the first item is at HEAD, because raising this level is exactly what
      arms the tree-wide wedge.
    why: >-
      It is the only atom in the drawn half whose level moves this stretch on work that is already
      built and tested, and the brief is right that a level move beats a tidy. It also closes a lie
      I told: my record of 2026-08-25 reported the carbon panel correction as `corrected: true` when
      it was 152 uncommitted lines, and it is still 152 uncommitted lines. A correction that is not
      in git has not been made. Done when the atom reads level 3 in the map, the ledger holds the
      self-certification with its evidence, and the carbon figures on the site derive from the
      half-hourly read rather than the factor table.
  - id: EP1_clv_three_horizon
    what: >-
      Re-measure or retire the CLV gap, and write the decision into
      `docs/observability/coupled_gap_ledger.json` either way. It still reads
      `measured_at: 2026-08-19`, 5 counted accounts of 13 available, 8 excluded as right-censored,
      on a book that now holds 263, with a gap of 1.76 against a no-skill mean-absolute-error of
      GBP 817.89 and 3 sign disagreements out of 5. Either find a grading that reaches live accounts
      -- the ledger's own note says the exclusions are right-censored, which is the population the
      estimator actually serves -- or write into the ledger, in its own words, that this comparison
      cannot be moved by building and name the instrument that would replace it.
    why: >-
      A gap above 1 says the company's per-customer lifetime value carries LESS information than
      handing every account the population mean. That is the thesis losing to its own baseline on
      the one quantity every per-customer decision rests on, and it has now been quoted as current
      in five consecutive direction records off five completed lives from a week ago. The atom was
      drawn again this stretch and did not move, which is the signal: an estimator cannot be
      improved against a sample that excludes the accounts it is used on. Done when the ledger's
      timestamp and account count match the book it describes, or the ledger says plainly that it
      never can and what would.
not_now:
  - what: Wiring the value arm to the live renewal desk.
    why: >-
      Rejected for the fifth record and the reason is now written by the machine rather than by me.
      The arm's own record says `fit_to_run: false` and
      `belief_gap_publishable_as_evidence_of_inference: false`; it would move the median bill
      +53.1%; 5 of 263 accounts want to price below the floor because their standing charge is the
      whole relationship; and 193 of 263 were scored beyond the world's own calibration. Wiring it
      would push a known pricing defect behind the wall for the company to rediscover, which is the
      single thing the epistemic design exists to prevent.
  - what: Raising `_COMMIT_DEADLINE` again, or any gate budget, to get publishing back.
    why: >-
      My own last record framed the publish fix as needing a measured gate time to size it. That was
      wrong and the measurement refutes it: `commit_hook_duration.jsonl` shows tonight's refusals at
      640-693s against a ceiling of 840 with headroom 0.23, `outcome: "refused"` not `"timeout"`,
      and the gate log shows it completing in 636s with six named reds. The clock is not the
      binding constraint and the director already ruled that no gate budget grows here. The correct
      fix is landing the split, and it costs nothing extra.
  - what: >-
      Halving the publisher's two full suite runs per cycle, which the code's own comment names as
      "the real repair".
    why: >-
      It is probably right eventually and it is wrong tonight. The publisher's scoped gate and the
      commit hook chain do not share a subject -- one runs against a fallback checkout under
      `/var/tmp/publish-gate-head-*`, the other against HEAD+pathspec inside the hook -- so
      de-duplicating them on the grounds that they run the same files is the fail-open shape where
      a receipt from one tree gets accepted as evidence about another. It touches the commit gate,
      which is a wall, and it needs its own design and its own controls. It also stops looking
      urgent the moment publishing is landing again.
  - what: Filing new findings against the 36 already sitting LATENT.
    why: >-
      Four of tonight's staging documents are auto-filed repetition alarms for focus items --
      `land-the-map-split`, `land-the-value-arm`, `land-lane-zero`, `publish-path-lands` -- and one
      of those four describes work that landed hours ago. The queue is describing the record rather
      than reality, and lengthening it makes that worse. Landing the split clears most of them.
  - what: >-
      Building the general fix for the ownership gap -- that a large in-flight write has no route to
      being assigned to a lane.
    why: >-
      It is a genuine structural finding and it is the reason the split sat three records, but it is
      a harness design problem and the instance is on fire. This record solves the instance by
      assigning it in the first focus item, in the seat's own name, so no worker has to decide
      whether landing 52 files is sweeping. If a second write strands the same way, it earns its
      own item.
  - what: Deriving a switching elasticity above GBP 400 of savings available.
    why: >-
      Unchanged from last record and now supported by the machine: no published GB series observed a
      household offered that much, so any value would be authored rather than measured -- a
      curriculum value, and the director's under R13, not mine. The coupler already records the
      73.4% of accounts scored beyond that calibration, which is the honest move and needs no new
      number.
  - what: Explore's remaining stages with real data, the director's third console priority.
    why: >-
      It renders figures whose credibility the co-calibration record is currently deciding, and
      publishing cannot carry them to a live surface until the first item lands anyway. Building it
      tonight risks putting a number on the public site that the same night's work says is not yet
      evidence of anything. It moves up the moment publishing is landing and the coupler is at HEAD.
