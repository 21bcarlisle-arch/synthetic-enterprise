- id: the-capital-target-is-115-and-measured-before-after
  what: saas/growth_mandate.py carries mcr_per_account_gbp = 130.0. Ofgem's decision of 26 July 2023 set
    the Capital Target at GBP 115 per dual-fuel account, and GBP 130 was the April 2023 consultation figure
    (section 3 of docs/staging/SEAT_FINDING_SEVERAL_CONSUMPTION_FORECASTS_A_WALL_LEAK_IN_HEDGE_VOLUME_AND_THE_CAPITAL_TARGET_IS_115_2026-10-11.md).
    Find the production caller first, because a module default is not the production constant. Correct
    the figure the run actually uses and cite the decision. Write the prediction for the campaign's quote
    budget and the book size, then measure before and after on one seed. Change only the figure. When
    the target starts is the director's open concern the-capital-target-binds-from-2025-but, so leave
    the start date as it is.
  why: This is a plain factual correction to a constant that bounds how fast the book can grow, and a
    sourced figure replaces a wrong one without asking. Done means the run reads GBP 115 with its citation,
    a control reds on 130, and the before/after on one seed is in the finding.
  lane: E_finance_treasury
  side: supplier
  written_at: 1791707447.153
