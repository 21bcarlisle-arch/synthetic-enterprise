thesis_read: 'This stretch went forward on evidence. The double-levy re-reads ran with predictions filed first, and they say what the thesis needed them to. On single-levy bills the
  DD first review lands at -1.8% where it was +32.8%, and resi bills fall about 20% while settlement revenue holds. The arrears pool is unchanged at 1.19x MET, because the world never
  paid the double-levied amounts, and B8 L3 is unchanged and undecided. So last stretch''s backwards step is mostly recovered: the debt and retention readings stood, and the billing
  reading was the levy. What is not recovered is the published face. The single-levy run is graded but not published, and at 123.5 MB the push on Monday will be refused, so the site
  still quotes the double-levied 10-05 run. That is focus one, because it is time-bound. Against the thesis, two supplier facts have surfaced and neither is understood. First, the DD
  book never builds summer credit (GBP 5-10 an account against Ofgem''s ~GBP 200) and is GBP 20k net debit by mid-2018, a gap the levy hid. Second, the run''s renewal decision stops
  considering the book after year one (53, then 25, then 3). That second one undercuts the per-customer-versus-flat comparison more than any holdout size: a decision that sees three
  households in 2019 cannot beat a flat rule, or lose to one. Those are focus two and three, ahead of new levers. Home-mover retention landed honestly inert (09900f577): no money moves
  until the world supplies a destination. The machine got better. The checkout is level with origin, every unit runs origin''s code, and two wrong rows close. The steer bit: the previous
  three items were drawn, and the two that could land did. The third (clear 27 paths by hand) was the wrong instruction and is graded as the seat''s error. Balance: of 22 commits, 5
  substantive, with 1 supplier, 1 world and 1 both. Most of the work was findings and grading, which this stretch needed. The next stretch''s two supplier items are the correction.'
