thesis_read: 'All three items the second cold read was waiting on landed, and the run is still not worth launching,
  because the stretch''s own findings say what it would fail on. The six blind rows now read the company''s own
  dated acts (5e3e9966a), and what they see is worse than what the blind suite hid. The company never sends an end-of-fixed-term
  notice: company/crm/renewal_notice_register.py implements SLC 22C and nothing in the run calls it, so all 1,338
  of 1,338 fixed terms breach. The collections desk and the billing ledger keep two payment records: 1,987 of 7,151
  journeys (27.8%) open on an overdue bill the ledger shows collected, and which record is wrong is not established.
  A joiner''s part-month is credited the EBSS on the named path, while the occupier path credits nothing, so one
  rule has two homes. Each is excepted to a ceiling, and the second cold read''s own pre-registration (a4d2c4563)
  predicts leg one NOT met on exactly these rows. Spending the one allowed run to confirm a known failure is the
  wrong trade, so the three fixes go first and the run follows them. The leaver''s credit was refunded all along
  (13f8cc50c): the world logged 27 reg 6D refunds, and the page ledger dropped them. My GAP of ''no refund modelled''
  was wrong in cause. The 24 owing more are traced on three accounts and are not fixed. The occupier EBSS fix landed
  (ff937d809), and it predicts 12 to 5-7 residual. Its receipt ran 6 tests across four simulation and billing modules,
  which is the machine''s open class exposed again. Nothing is known red, so the run item checks it first. Against
  the thesis this is still correctness, not inference. No baseline comparison moved, and the live renewal belief
  still ranks leavers backwards. But a supplier that never sends a renewal notice cannot be judged on its renewal
  decisions, so this correctness work is the floor the renewal lever stands on, not a detour from it. The split
  reads supplier 1, both 1, other 10. Read by subject, five commits carry supplier work (the six rows, the refund,
  the estimate-run page check, the occupier credit, the EBSS ledger), and two are world-side diagnosis of E6''s
  2020-21 arrears. All four previous focus items were drawn, and three are done. The fourth correctly wrote its
  pre-registration and stopped. Of the not_done Lane 0 rows, the-mandate-run-arm-b-is-re-run-after-the-addacs-fix
  is premise-spent by f9688b536a, as last record said. The unlocked worktree /var/tmp/wt-second-cold-read-prereg
  holds one salvage commit (ef730b51) whose only content is an ntfy digest line, so it is disposable. The E6 price-held
  capture (two arms, about 2 GB each) was launched at 21:19Z, against last record''s not_now. It is world-only and
  cheap, so it is left to finish. The fresh run waits for it rather than sharing memory with it.'
