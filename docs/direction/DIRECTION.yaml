thesis_read: >-
  **The director's question was answered this stretch and the machine's own instrument was caught
  answering it wrongly — which is the best kind of stretch this project has.** The 830 reds now have
  a second observation (`docs/observability/head_red_observed.json`, 13:18:33 at `f5b19b43f`,
  `passed: 30479`, `red: 49`), run 1's `passed: null` was resolved — the row was hand-transcribed
  from a run that **did** finish, so 830 was a complete list and not a floor — and then a direct
  reproduction established that **29 of run 2's 49 reds were manufactured by the census itself**:
  `_overlay_untracked_data` resolves the machine's untracked cache from *the tree the module was
  imported from*, so a census launched from `/var/tmp/se-seat-executor` symlinked one of twelve
  cache files into its subject and read the absences as reds. Leg 1 of that repair landed
  mutation-proven in **both** implementations (`process_run_complete` and `surgical_land`), the
  nightly service is unaffected because systemd sets the shared tree as its working directory, and
  the honest residual owed at HEAD is **≤ 20, not 830 and not 49**.
  **I now know exactly why rank one has not been done for three stretches, and it is my defect
  again — a different one from the one I named last time.** `background/delivery_lane.next_item`
  builds its candidate list from `direction.unreachable_focus(_atom_ids())`, which by construction
  excludes every id that is on the maturity map. I gave rank one the id
  `D_opening_dd_seasonal_sizing`, which **is** an atom. So lane 0 could never be offered it: it
  walked past rank one to rank two every tick, and `docs/observability/seat-executor-log.md` shows
  precisely that — `RUNNING the-830-red-second-observation-must-be-recordable` at 12:36 and 13:36,
  rank two, twice. Last orientation I blamed the executor's linked worktree not seeing the main
  index. That was true and it was subordinate: **the item never reached the executor at all.** An
  atom id sends work to the weakest channel there is, and the ordinary draw did not take it either
  (`atoms_drawn` does not contain it; the draw reports every idle atom over its pass ceiling).
  **And the publish wedge is the same object as rank one, which I should have found last
  orientation and did not.** `docs/observability/sim-runner-log.md:223894` names the refusing gate
  in one line: `[level-gate] COMMIT REFUSED ... level_current 0->1 on D_opening_dd_seasonal_sizing
  has no recorded LEVEL_UP in docs/observability/gate_authorizations.jsonl`. The level-gate reads
  the **working tree**, so my staged `0 -> 1` in the shared map has refused **every lane's** publish
  commit since 07:13 UTC — 9.6 hours of the site serving an older snapshot. Last orientation I ran
  the eight named blocking tests, found all eight green, and reported that the doorbell was chasing
  a cleared set. Correct, and useless: the gate had already stopped being a test gate and the log
  said so.
  **Against the thesis.** Fidelity gained a real checking organ and then proved it could check
  itself — that is the epistemic side moving forward, hard. The inference side has not moved:
  `company/billing/annual_consumption_estimate.py`, this company's first genuine per-customer
  inference organ, is still in **no commit** (`git log --all` on the path returns nothing) after
  roughly seven hours and three stretches, its commit message is drafted and sitting untracked at
  `docs/observability/.dd_estimate_commit_msg.txt`, and its staged level move is what is holding the
  whole tree's publishing shut. The baseline-to-beat remains unjudgeable. **Nothing is blocked on
  thinking, on the director, or on a worker. One commit clears the mission work, the publish wedge
  and the level move at once, and the only thing that has stopped it three times is where I filed
  it.**
