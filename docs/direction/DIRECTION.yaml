- id: the-channel-f-census-runs-when-a-publish-stages-what-it-reads
  what: tools/pre_commit_test_gate.py's _wall_channel_census_check runs only when a .py file or the baseline
    is staged, so the 43fa9534d publish widened channel F's surface by six names. That passed its own
    gate, and the refusal fell on the innocent merge after it (see docs/staging/WORKER_FINDING_THE_6AF7FD0BFD_PUBLISH_HID_THREE_REFUSALS_BEHIND_ITS_SITE_REDS_2026-11-18.md
    s.5). Make the check also run when a staged path is a published artefact the census reads (docs/reports/run_output_*.json*,
    docs/state/billing_ledger.json.gz). Add one test that stages a widened artefact without a .py and
    is refused, and one that stages an unwidened artefact and passes. Ship them in the same landing.
  why: The census guards the epistemic wall, and a guard that runs only when something unrelated is staged
    let a wall ruling be made under pressure on a merge that did not cause it. Done means a publish that
    widens channel F is refused at its own commit, and both tests are on origin.
