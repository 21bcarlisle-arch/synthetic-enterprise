  - what: Rebuilding the CLV grading to reach the 230 excluded accounts.
    why: >-
      218 of the 230 are right-censored -- still supplied, so no realised lifetime exists to grade
      against -- and the counted set grew from 5 to 33 on its own as lives completed and the
      coupler stopped crashing. Waiting is the correct instrument and engineering around the
      censoring would be inventing the truth the gap exists to measure. Revisit when the counted
      set stops growing.
  - what: Working the 37 LATENT findings as a body.
    why: >-
      Focus item two takes exactly one of them, and takes it because it is a broken control on the
      delivery path rather than because it is on the pile. Working the tail would cost a whole
