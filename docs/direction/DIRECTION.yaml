not_now:
  - what: >-
      Continuing to hold PB4, PB5 and P2–P4 on the grounds that the gradable population cannot refute
      them — and equally, promoting them into a lane-0 slot now that it can.
    why: >-
      The hold's stated reason is dead and I am recording that rather than quietly restating it: I
      held these because the paired population was sixteen and "a heterogeneity model built against a
      population that cannot reject it is an unfalsifiable improvement". The population at a fixed
      rung is 99 and always was. The hold does not survive its reason, so it is lifted. But they do
      not take a lane-0 slot either, because the ordinary draw took PB4 and PB5 this stretch without
      being steered and lane-0 slots are the scarce resource — three per stretch, measured. The right
      place for them is the dial-weighted lane they are already in, and the second focus item is what
      makes their eventual measurement trustworthy.
  - what: >-
      Raising `SETTLEMENT_CUSTOMER_YEAR_BUDGET` to whatever number makes the book grow, or dropping
      the cross-rung intersection from the SLOPE the way it was correctly dropped from the fixed-rung
      comparison.
    why: >-
      Both are the cheap versions of focus items one and two and the second is newly tempting because
      the first version of it was right. The distinction is the whole point: a between-arm question at
      a fixed rung needs only that both arms priced and rolled the same decision at that rung, so the
      intersection was pure loss there; a slope has to run along one x-axis over one population, so
      the intersection is what makes it a slope at all. Dropping it there would compare decisions the
      rungs never both priced, which manufactures n by exactly the mechanism that just cost us two
      days. And the ceiling may move only on a memory measurement against the guest — a constant
      chosen because a number was needed is load-bearing within a week and unattributable within a
      month.
  - what: >-
      Working the calibration gap now — the company tracks 0.2% to 25.7% of the world's move and
      over-predicts churn by 0.9 to 26.3 percentage points at every rung — or building §5 component 1,
      the observation of the cheapest rival price the company does not have at all.
    why: >-
      These are the two most interesting numbers on the board and both lose on sequence rather than
      merit. B10 moved on direction and sign one hour ago; tuning the belief toward the world now
      would be fitting to a measurement whose ink is wet, and the two aggressive rungs where the
      company is nearly blind have thin early populations for a reason focus item one may change. The
      ceiling gap is a `B4_competitor_field` capability and not a B10 world-side one, and it is the
      right next capability — it goes on the board when the re-run says what book it would be built
      against. Held on evidence that is one stretch away, not on judgement.
  - what: >-
      Putting the £337k capitalisation of a small supplier (PB2, priced by R6's headroom) to the
      director as a curriculum question, and tuning anything so that R6's first collateral demand
      fires.
    why: >-
      The capitalisation question is genuinely his — which world the company lives through is named
      and versioned in a file he reads — and it is askable with a number attached, which is why it is
      tempting for the third direction running. It still cannot bind while the book is sized by our
      own engine: capitalisation only matters against a balance sheet that growth is pressing on, and
      the £316,009 headroom is many times the entire decade's campaign spend for the same reason.
      Focus item one is the legitimate route; if the mechanism binds, it binds because growth reached
      it, which is the real channel. Moving a number to make it fire would be inventing the answer to
      the question R6 exists to ask. It goes to him when the ceiling is measured and the re-run says
      what the book does.
  - what: >-
      H45 — the systematic knowledge-to-discovery-to-atom chain — and the harness backlog: ten
      repeating-alarm findings in the staging root and ~117 harness atoms never read for whether they
      should exist.
    why: >-
      H45 keeps losing to its own instances and this stretch produced two more good ones rather than
      an argument for the general form: the ceiling's stale note was found by chasing one constant to
      its rendered string, and the join defect was found by noticing one number that would not move.
      Build the chain after its instances. The harness backlog moves no level and closes no finding,
      and the staging root is a work queue by design, so those files sitting in it is the signal
      working. Both wait for a stretch with nothing on the published surface a reader could object
      to, and tonight the book-growth page still publishes a book an engineering constant sized.
