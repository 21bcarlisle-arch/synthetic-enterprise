thesis_read: >-
  Against the thesis, the per-customer supplier still has no valid comparison with the flat-rules baseline. That
  has not changed in three stretches. The rankq re-grade, the one ruled comparison with its commitment due 3 Dec,
  is still deadlocked. /var/tmp/se-fix0-capture does not exist and no capture_departure_factors process is on the
  box. The window move has landed (/var/tmp/se-fix0-window-landed.sha exists), so the refit continuation waits on
  exactly one thing: the capture file that its own first step writes. This orientation reads that plainly for the
  first time. The deadlock needs no parser fix to break. Launching one capture to that path releases the queued
  refit, and the queue then draws it on its own. What DID move is the book, and that corrects my own error about
  publishing. Origin's site/data/publish_provenance.json names 76f894811d (1,382 accounts, 54,463 bills) as
  last_verified at 22:08Z. 44bf4cd13 is on origin. d415a9787 graded the six BLOCKING billing findings on that
  book: 12 predictions held and 4 missed, and the book's own gate reads 0 unexcepted breaches. Last stretch's
  first focus item is therefore finished and leaves focus. It was the one item drawn (1 of 4). It was also the
  only focus item that existed as a continuation row, and I read that as the reason it was reachable. The next
  book, 2100f84f85, carries b4ba8cb4f, and the publisher paused on it at 23:19Z. It breaks
  INV_GAS_MONTHLY_USE_DOES_NOT_REPEAT_LAST_YEAR on 4 of 135 gas legs, against an exception that allows 1. A
  landing is in flight (pid 566297) that traces this to a heat-pump home's gas settling flat. The commit split was
  0 supplier, 1 world and 7 other. The substantive work was the gas-AQ world fix (601887d76) and two publish-wedge
  fixes (de3138e6d, 2c014cfe4). That is still plumbing, not supplier decisions. The precondition for S1's R1-R5
  grade, a verified S1 book on origin, is now met and nothing has drawn it. So the supplier results this focus
  carries are S1's grade and the final-bill ask, behind the one launch that unblocks the baseline comparison.
