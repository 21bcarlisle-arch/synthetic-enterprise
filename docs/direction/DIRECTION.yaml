thesis_read: 'Level, not backwards. The thesis comparison is finally running, but it is a day late and not yet safe.
  14 commits, 5 substantive, 2 that carried no work (the seat''s own merges). The brief splits them 2 supplier,
  0 world, 12 other. Read by subject, the work leaned supplier: four D48 billing commits and B8''s Q6. No level
  moved. What it MEANS. (1) The test of the thesis is under way, but not graded. The three per-customer arms (current,
  all on, flat) waited 3h56m behind the nightly census, and the first arm started at 07:22Z. They run one after
  another from /var/tmp/se-pcs-arms. That worktree is UNLOCKED, with no declared owner. An unlocked worktree is
  how the bad-debt arm''s worktree was pruned under it last stretch (be60ad914), so item 1 locks it before anything
  else. Their grade continuation becomes drawable at 09:20, and the all-on and flat arms will still be running then.
  The tick that draws it must find the .rc files missing and hand it on, not grade one arm. B11 says this one book
  is a diagnostic: the real grade still needs the six seeds in the director''s EP17 concern. (2) Billing, first
  in his order, moved on substance and not on its level. An estimate at the account''s own measured rate is now
  released rather than held for a read (4d6d5ab91), so no account waits more than three months for a bill (7252a0010).
  The K1 grade dates a closing-run interim correctly (ab3baa0b0). D48 Expert Hour disqualifier #5 is now traced
  to the WORLD: no meter is ever exchanged after acquisition, so the book is 29% smart in 2024 against 69% nationally
  (80b269a20). The company''s measure is honest about meters that are wrong. Last stretch''s focus asked for the
  Expert Hour re-run, and the tick drawn on it did this adjacent work instead. The re-run is still owed, and it
  stays in focus with #5 graded as world-attributed. The meter-exchange generator is the one world build that blocks
  a supplier level, so it goes in focus as a world item. (3) B8 was settled by measurement, not by a build. At the
  founders'' scale, the holdout costs GBP 9.95 a year against GBP 10.18 of perfect information, so off is right
  (975c90319). (4) The machine. All three of last stretch''s focus items were drawn. The two arms that died queued
  are relaunched in driver units with their own cgroups, and both were writing QUEUED lines at 08:22Z behind the
  per-customer arms. That item leaves focus. The census item leaves too: 398bf703a showed the census already asks
  for admission, its declared weight is corrected to 11,981 MB, and the chunking probe runs as a queued continuation.
  The cause of the queued deaths is read: a queued launcher waits in its caller''s cgroup. Only the instance has
  been worked around, so the fix goes in focus. The publisher has said FAILING for 47h, and the publish is held
  to 26 Oct.'
