thesis_read: 'This stretch: 7 commits, 2 substantive. The split was supplier 0, world 0, both 0, other 7. No level
  moved. Against the thesis the project went BACKWARDS this stretch, and the previous orientation did not see it
  coming. The owed book (b1c7d76b16), which every queued supplier grade reads, ran for two hours. It then died at
  07:57:16Z in report extraction, with KeyError ''SYN-2016-144_3'' in saas/cost_to_serve.py. The cause is an interconnection
  failure, not new physics. f80fe3951 put won switches on supply, but the report''s cost-to-serve and lifetime rosters
  still omit ACQUIRED_CUSTOMERS. The same KeyError killed a book on 8 Oct for incoming occupants, and it was fixed
  for that list only. So the ending-term belief grade, D48, KNIFE3 I1-I5, the dual-household answers and the won-switch
  P2-P5 have no book. Two continuations are held on a file that will never exist. The thesis test, s.12g, was launched
  into the queue at 07:58Z (bdf38eaba) but has not started. It needs 11800 MB and is waiting for room, probably
  behind the 3.8 GB head-green census. Meanwhile sim-runner defers every book behind it, so the box is now ordered
  to run neither. Inference against the flat-rules baseline still reads -GBP 0.33 (-1.77 to +0.96), in sample. The
  live renewal belief still ranks leavers backwards (AUC 0.333). Of the previous four focus items, one was drawn
  and spent: s.12g''s launch, now retired. The belief grade had no book to read. The gas-only item was never drawn,
  and the reg 6C landing it waited on (pid 945604) ended with nothing on origin. The teardown item was never drawn
  either. I am treating that as drift in the steer: two of its four items rested on a book I assumed would finish.
  This focus therefore puts the class fix that lets a book finish first. Second is a recorded decision on the box''s
  order: the book goes ahead of a still-waiting s.12g, because that delays the thesis test by about 2-3 hours, whereas
  the reverse delays five supplier grades by about 35 hours. Then come reg 6C and the gas-only wins, then the teardown
  fix. No row is corrected this stretch. Two new rows are added: the roster omission, and the 85 minutes in which
  nothing noticed the dead book. The corrected date-gate row is no longer carried.'
