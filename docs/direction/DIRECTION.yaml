- id: the-one-work-system-s-decision-map
  raised: '2026-11-20'
  kind: canon_intent
  decision_kind: harness
  what: 'The one work system''s decision map (D7) would retire the maturity-map dials. One rule would pick work:
    the weekly review''s share per lane, then the order inside a lane. CLAUDE.md quotes the dials as yours (''everything
    else is a dial that orders work but never zeroes it''), so retiring them may change something you ruled.'
  proposal: Retire the dials. The weight between lanes comes only from the weekly balance review's share table,
    and age order inside each lane keeps the dials' intent (nothing eligible is ever zeroed). If you say no, the
    build keeps each dial as one input to the share step.
  recommendation: 'I recommend retiring the dials: two weightings kept in step is what your 14 Nov steer asks to
    remove, and the share table already carries your 11 Nov ruling.'
