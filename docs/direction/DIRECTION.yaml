thesis_read: 'The block cleared, and what it uncovered is a step back for the thesis. Behind it was the first per-customer
  reading taken on households GB actually has. The 19 Oct dual-fuel book is on origin (2a195224b, merged f8f3d0fd5).
  It went out by hand: the publisher never retried it after its red was answered, so that wrong row''s instance
  is closed and its class is not. Both previous focus items are finished and leave focus. The B11 grade (f00fdb040)
  is the reading that matters. On the dual book, the per-customer switch key against flat at 2023 over the whole
  book is +0.075 (-0.013, +0.162) on 201 graded households. It was +0.133 and cleared on the 1%-dual book. So the
  one clearance the thesis had for inference over the whole book is gone, and only movers at 2023 still clear. P0
  held: no supplier change moved B11 between the two runs, so the book''s fuel mix did this, not our code. Whether
  the signal is weaker on dual homes or just noisier on a smaller sample is not yet known, and that is item 2. The
  other gradings came back like this. The leaver grade (b139ed649) found the C7 class''s cause in the world: half-hourly
  roster accounts register no EAC, so C7 is billed at a 3,100 kWh TDCV against 13,230 kWh true. The read duty is
  not the cause; it reaches only 22 of 275 legs. That world fix is landing now through surgical_land, with its grade
  queued. The budget-decides-payment build was graded (c43df1237) and refuted high: under-water households never
  left it. An exit was added at DWP''s published rate (78a36a84c), the switch stays off, and the on arm is being
  re-captured now. The campaign now wins split homes at 90.6% dual (30246d6f0). The split was supplier 0, world
  4, other 13. Every substantive commit was world fidelity or the grading of it. Each one blocked a named supplier
  result (the publish, the leaver, the payment draw), but supplier code did not move this stretch. One seat error
  came to light: the per-household next-best-action switch-on, which the 08:23 record said was queued, is in no
  live queue. The 23:21 orientation embargoed it nine hours out, past the six-hour expiry, so it lapsed unseen,
  and the 08:23 record never asked live(). It is item 1. The previous focus was drawn and both items landed. The
  held-estimate row closes: the published book now carries the fix. The campaign-dual row closes on 30246d6f0.'
