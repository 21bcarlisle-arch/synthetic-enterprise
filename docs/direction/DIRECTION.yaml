- id: the-dd-review-sizes-from-consumption-at-the-rates-in-force
  what: 'Under DD_seasonal_cashflow_physics L3, add to company/interfaces/dd_review_outcome.py a review
    rule that sizes the annual DD from the account''s last 12 months of consumption at the rates in force
    at the review (SLC 27.15, ''most current information''). Keep the existing last-year''s-spend rule
    selectable beside it, and leave balance recovery as the director''s existing toggle, untouched. Before
    running anything, write predictions into SEAT_FINDING_EVERY_SETTLED_BILL_CHARGED_THE_LEVIES_TWICE_2026-10-10.md
    for the review-lag leg and the 2018-06 book balance under the new rule (336b789fc estimates about
    GBP 11k of the -GBP 17.8k lag). Grade it offline first: extend tools/dd_book_legs.py to re-size each
    review on the single-levy run under either rule, with the same consumption. Land the rule with a control
    that the two rules differ when prices change and agree when they are flat. Make the new rule the run''s
    default only if the offline grade moves the lag leg the predicted way, and record the choice and how
    to reverse it.'
  why: 'Billing accuracy is the director''s step 2, and the DD amount is where a household feels it. 336b789fc
    traced -GBP 17.8k of the book''s -GBP 20.6k to this one company behaviour, which a real supplier would
