version: 1
oriented_at: "2026-10-08T11:20:43.321945+00:00"
thesis_read: >-
  The thesis's retention test now has its observable and its first answer. The losing supplier
  is sent the CSS Invitation to Intervene at the ASAP floor (4805420bd), the switching process's
  own outcomes are knowledge and set the save and win-back toggles as ranged estimates
  (f418eff9e), and the director's three shapes are graded: a reactive save on the loss notice is
  the only shape that beats never offering, at every save rate in the published range, and the
  world's price response decides who is saved (0f1fb3f6a). That is the first place in this
  project where targeting a leaver beats a flat rule. But it is a grading tool's answer and not
  yet a settled-run answer, and the director's condition is unmet. Nobody has yet shown that a
  save is not paid for by the customers who stay, or that a vulnerable customer is treated at
  least as well, so the win cannot be published. The baseline moved toward fairness too.
  Acquisition now selects on each prospect's own responsiveness (2338f13ff, approved 08:52), and
  the pre-registered 1.1-1.4x fails at the market price. That makes the switched-in book a less
  flattering opponent, which is honest, and its P1-P4 grading on fresh seeds is still owed. The
  world gained voids (5531ef8a6), and net margin fell GBP 910 on the 80-founder book. Four things
  changed at once, so the void's effect cannot yet be attributed, and the voids atom was never
  minted on the map, so last stretch's fourth item is half done. Its steer was not drawn: the
  interactive lane built it directly. The gas home's evening peak came from 0.80 to 0.69 kWh/h
  against SERL's 0.48 (92d39bf60), and no single end use carries the rest (528b7ab1c). Two
  continuations hold the next steps. W2_20's register-recovery re-take moved the value advantage
  +GBP 110, opposite to the predicted sign, and its leg 2 was superseded, so R5 has nothing to
  grade until the leg is relaunched. The 400-founder end-to-end run failed before report
  extraction (longjob-e2e-400-founders failed), so the founder count, budget and memory share
  stay unset, as the director asked. One thing went backwards in the machine. HEAD is 23 behind
  origin, and seven daemons, the seat among them, run without 8 commits to code they import. Of
  30 commits, 11 carried nothing: base-advance merges, one per landing. I am answering two of
  the director's open rows here that he ruled on at 08:52, two and a half hours ago. That is the
  same lag I corrected last stretch, recurring.
