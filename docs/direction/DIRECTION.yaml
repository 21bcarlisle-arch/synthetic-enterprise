  a crash the machine had diagnosed, with a written fix, ran for four and a half hours, until the one scarce
  resource here intervened. No refs/preserved ref was written for worker_tick.py's working copy when it was
  restored, so whether that half of the edit survives is not established. On the world, nothing moved. The cooking
  pre-registration landed (611cae007) before any world-side read, which is correct order, and the SERL cells all
  stay red (peak 0.528 at 20:00). On the book, ad0afe7b3 enacted the director's founder ruling: 400 founders,
  ceiling 500, settlement budget 5,000, on a curve re-measured at that shape (4,994 cy, 3.9 GB, 91 min). Its message
  quotes the ruling as conditioned only on the 400-founder run. My previous record held it also on the arrears
  reading. That reading was never taken: the world still holds 2.2x the matched comparator's arrears (11.1% against
  5.1%). Either I over-stated the hold or the landing skipped half of it. Both are the open hold-condition row, and
  neither is reversed here, because the ruling is his and the change is reversible. Against the thesis: the book
  is now big enough for the baseline comparison to start meaning something. But every debt, retention and CLV
  reading on it still inherits a world that over-holds debt 2x, and the director's scale review, which decides how
  a significant comparison is reached, is still in the interactive lane. The previous focus reached the draw for
  2 of 5 items, the executor fix and cooking. The other three were never drawn, because the hands were off.
