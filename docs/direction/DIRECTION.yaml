focus:
  - id: resolve-the-selection-leg-by-seeds-because-the-ranking-cut-already-names-its-sign
    what: >-
      The selection leg is unresolvable for one reason and it is not the method: `contrast_bounds`
      in `site/data/value_arms.json` carries `selection_gbp` at `n: 3` seeds, `mean_gbp: -426.96`,
      `stdev_gbp: 2291.98`, `min_gbp: -3036.25`, `max_gbp: 1260.93`. Three seeds cannot resolve a
      £427 mean against a £2,292 spread, and the page rightly refuses to state a direction from it.
      That is a RUN, not a build. FIRST write the pre-registration into `docs/staging/records/` and
      commit it before any figure is read, stating what you expect the mean and the spread to do —
      and the prediction is not free, because an INDEPENDENT cut already names the sign: the
      `method_skill.fixed_horizon` estimand reads 0.4210 below its null's 0.4458 at p=0.0045 on
      n=161, `reading: "worse_than_chance"`. So the pre-registration must say whether more seeds
      will drive `selection_gbp`'s mean further below zero and outside its own spread (the two cuts
      agreeing), or pull it toward zero (the two cuts disagreeing, which is the more interesting
      answer and would put the estimand's construction on trial). THEN re-run
      `tools/run_value_cycle_ab.py` over enough further seeds that the spread either resolves the
      sign or is shown not to at that count, changing nothing but the per-household
      price-sensitivity draw exactly as the existing 3 did. Publish the new n and spread through
      `tools/generate_value_arms_data.py` and let the page's existing refusal rule decide for
      itself whether it may now state a direction — do not hand-write the verdict.
    why: >-
      This is the thesis, and it is the one place where a run rather than an argument settles it.
      The director's frame requires a baseline to beat; we have one, it is scored in pounds, and the
      arm beat it by £17,444 — of which 98% is the price LEVEL and £319 is the choosing, inside the
      noise. Whether the choosing is worth anything is THE question, it is currently unanswered for
      want of seeds alone, and a second instrument has already told us which way to bet. Done is:
      `contrast_bounds.contrasts.selection_gbp.n` is materially above 3 on the live feed, the page
      states a direction or states plainly that it still cannot at that count, and the
      pre-registration sits in the record with a timestamp before the run's. If the result refutes
      the prediction, that refutation is the deliverable and it goes beside the claim.
  - id: attribute-the-inversion-before-it-is-quoted-as-a-fact-about-the-method
    what: >-
      The estimand's 0.4210 is published and honest, and nobody has asked what produces it. Its own
      artefact names two structural suspects and neither has been cut out. First:
      `decisions_scored_at_zero_because_the_term_settled_nothing: 37` out of 161 scored — 23% of the
      sample sits tied at one value at the bottom of the ranking, and a rank concordance with a
      quarter of its mass tied at the floor can read below chance from the tie handling alone, with
      no inversion in the arm at all. Second: `horizon_open_at_the_end_of_the_settled_book: 47`
      censored, and `no_published_counterfactual_rate_for_the_term: 6` — a named coverage gap.
      Pre-register the prediction FIRST, then re-cut the concordance in `tools/run_value_cycle_ab.py`
      with the 37 zero-settled rows excluded, and separately with them included but the tie
      correction stated explicitly, and report both against their OWN permutation nulls at their own
      n — never against the n=161 null, which belongs to a different sample. One variable at a time:
      if you also change the censoring rule in the same cut you cannot attribute the move. File the
      result whichever way it falls, and if the inversion survives removing the tie mass, say so on
      the page in the same breath as the 0.4210.
    why: >-
      A published figure that says our own method ranks backwards at p=0.0045 will be load-bearing
      within a week and unattributable within a month, and item one above will be read against it.
      If it is a tie-handling artefact we have libelled the method; if it survives, we have found a
      real defect in the per-customer decision rule and that is the most valuable thing this project
      has measured. Either answer is worth more than the number standing unexplained. Done is a
      result document that states which of the two it is, with the pre-registration timestamped
      before the cut, and the page's estimand block carrying the answer rather than only the figure.
  - id: the-world-lets-customers-leave-twice-as-readily-as-the-record-and-the-record-is-itself-disputed
    what: >-
      `departure_level` in `site/data/value_arms.json` puts the world's own switching at 23.96%
      (2017), 25.97%, 31.70%, 40.98% (2020), 26.05% and 15.75% (2023) against published bands of
      13.5–14.0%, 19.5–20.0%, 20.7–21.3%, 22.5–23.0%, 17.9–18.4% and 8.9–12.5% — `inside_band: false`
      in every year, with `share_of_the_band` up to 36.95. Meanwhile TWO BLOCKING findings filed
      2026-09-07 say the band artefact is itself wrong:
      `SEAT_FINDING_THE_SWITCHING_BANDS_OWN_PUBLISHER_DISAGREES_WITH_IT_IN_EIGHT_OF_TEN_YEARS_2026-09-07.md`
      and `SEAT_FINDING_THE_SWITCHING_RATE_ARTEFACT_IS_REFUTED_BY_ITS_OWN_PUBLISHER_IN_EIGHT_OF_TEN_YEARS_2026-09-07.md`,
      both against `gb_domestic_switching_rate`, both class `figures_on_a_superseded_clock`. Settle
      which side is wrong, in this order and no other: (1) reconcile the two findings — the second's
      own header says "TWO LANES FOUND THIS INDEPENDENTLY AND CONCURRENTLY" and names `f706dbf3d` as
      having landed first, so establish whether they are one defect and disposition the duplicate
      rather than working it twice; (2) repair `gb_domestic_switching_rate` in the commons from the
      publisher's own release, keeping the superseded values beside the corrected ones with the
      revision named; (3) ONLY THEN re-read `departure_level` against the corrected band and say
      whether the world is still outside it. If the corrected band still leaves the world at 2×,
      that is a `simulation/` fidelity finding against the baseline world and it is filed as one —
      it is not a company defect and it must not be fixed by moving a company constant.
    why: >-
      Fidelity is the precondition, and a world whose customers leave twice as readily as the real
      record cannot tell value created from value transferred — retention is worth too much in it,
      and every pounds figure in items one and two was earned inside it. This closes two BLOCKING
      findings rather than tidying, and it is exactly the thread CLAUDE.md says to follow: the
      switching band is quoted on a live page as the standard our world is judged against while two
      documents in our own staging root say the standard is refuted by its own publisher. Done is:
      the commons artefact carries the publisher's own figures with the revision named, one of the
      two findings is dispositioned as a duplicate, and the page's `departure_level` block reads
      against the corrected band with its verdict stated either way.
  - id: name-which-lane-each-blocking-finding-actually-refuses
    what: >-
      27 BLOCKING findings sit in `docs/staging/`, 140 documents in the root, and the flow is 441
      filed against 257 dispositioned in 7 days — net +184 and growing. Do NOT sweep the pile and do
      NOT build a sweeper. Measure the thing that binds: for each of the 27, run the lane gate it
      claims to block and record whether that lane is actually refused TODAY, naming the refusal
      verbatim. Two facts already in hand say the answer will be small: `SITE4_ia_register_and_nav`
      is listed as contradicted-but-frozen behind 15 of them, and the switching-rate pair in item
      three is one defect filed twice by two lanes. Close every finding whose subject is already
      discharged, whose duplicate landed first, or whose named refusal no longer reproduces —
      pointing at the evidence in each case, never on the strength of its age. Publish the resulting
      count of findings that genuinely refuse a lane today, and file that count as the finding.
    why: >-
      My own repeated error is prescribing a hand sweep for a class that regenerates, and my own
      correction is that the count is not the finding — the specific path that binds a refusal is,
      and reproducing the refusal finds it in under a minute where measuring the pile never does.
      This item is that correction applied: it is a census of what is actually blocked, not a tidy.
      It also decides whether the sediment matters at all, which is the thing I have twice promised
      a mechanism for without knowing whether one is warranted. Done is: a number for how many of
      the 27 refuse a lane today, with the refusal quoted for each survivor, and the rest
      dispositioned with their evidence. If the number is near zero, the finding is that BLOCKING
      means nothing here and the severity vocabulary is what needs changing.
