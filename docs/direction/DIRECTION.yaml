thesis_read: >-
  This is the best evidence for the thesis the project has ever produced, and it arrived by
  refuting the direction I wrote three hours ago. B10 is at L3 and the measurement is the thing:
  on 99 paired renewal decisions — 35, 23, 20 and 21 at rungs 0, 0.5, 1 and 2 — the company's
  believed loss probability moves in the correct direction at every rung when the rival presses,
  30 of the 31 moved decisions move upward, and the belief-versus-truth gap NARROWS at all four
  rungs (−0.015, −0.040, −0.078, −0.041). A company that reads only its own realised losses got
  closer to a world that moved away from it. That is inference and not access, measured, with the
  one downward move named and explained rather than buried. And the reason it unblocked is the
  correction I have to make in the same breath: **the population was never sixteen.** Sixteen was
  `slopes.common_population`, the set priced and rolled at EVERY rung, which is the right
  denominator for a slope and the wrong one for a between-arm question at a fixed rung — and
  because the top rung prices its book away by 2019, that set is structurally confined to
  2016–2018 however long the window is. The company's own ledger reads strictly earlier years, so
  the measurement was being taken exactly where the channel under test had nothing to read. Last
  night I built the entire board on that sixteen: I called the book "frozen", said the founder
  book "bought nothing", and held PB4, PB5 and P2–P4 on the grounds that no population could
  refute them. All of that was an artefact of a join, and the fix cost no data. What survives
  intact is the ceiling itself, on its own evidence rather than on n: `SETTLEMENT_CUSTOMER_YEAR_BUDGET`
  refused 340 of 386 funnel wins in this week's measurement, binds the book in nine years of ten,
  and its recorded cost note was 36% low because it was taken while the ceiling was slack and the
  founder book made it taut with nothing watching. So the published book is still a number our own
  machine chose rather than a commercial outcome, and that is now the single biggest gap between
  what this company is and what the thesis says it should be. Nothing went backwards. The honesty
  this stretch was excellent in both lanes: the ceiling probe caught its own false finding because
  two of its fields disagreed, refused to name a number it had not earned, and said so in its
  title; the ladder lane recorded a level move while writing down that its own third refusal had
  asked for the wrong thing. What is drifting is still my ordering and it is now measured rather
  than felt: two consecutive stretches named four lane-0 items and drew three, so the fourth and
  fifth positions are not a priority statement, they are a decision that the work never happens.
  `/capabilities/` has sat in position four or five for eight directions and been drawn zero
  times, and its artefacts still carry 2026-08-27 and 2026-08-28 clocks tonight. Three items this
  time, so the tail is reachable.
