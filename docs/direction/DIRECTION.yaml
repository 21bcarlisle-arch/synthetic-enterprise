thesis_read: 'Per-customer inference against the flat baseline now has a measured cause: the inference fails, not
  the lever alone. 13 commits, 10 carrying work, 2 substantive. The brief''s split is 1 supplier, 0 world, 12 other,
  but that split is by file: seven of the ''other'' are supplier grades filed as staging records. Both items in
  the last focus were drawn and landed (7dc923787, 5336ddb20), and so were all four continuations. No level moved.
  WHAT IT MEANS. (1) The flat-arm tie is split (7dc923787, 76a29bd92, 7eb9f2695). The company''s renewal churn belief
  ranks the flat arm''s 110 switch leavers at AUC 0.46 [0.40, 0.52], and from 2019 at 0.33, which is worse than
  chance. The world''s own probability ranks the same leavers at 0.90. The retention offers reached 44 would-be
  leavers and kept 4. The cause is that the belief is higher on the rolls that rarely lose anyone. The world rolls
  departure dice at the end of a fix (40 of 92 leave from 2019), not at an SVT conversion or a declined fix (6 of
  176). The company holds the tariff type and does not use it. Roll type alone ranks at 0.818, and roll type plus
  price position, fitted before 2019, at 0.742. This is a modelling gap the company can close from what it already
  knows, which is the thesis''s inference, not access. Item 1 builds it. Two cautions go with it. Inside end-of-fix
  rolls even the world''s own probability reads only 0.65, so the gain is in when to act, not whom to pick. And
  whether the world is right to put no departure risk on a default-tariff roll is a world question. Item 4 answers
  it from published evidence, blind to this grade, because a gain built on a world rule too sharp to be real would
  be the world flattering us (F11). (2) The opex credit is graded (e9e2fbe71): the median renewal is +GBP 2.29 a
  month, not -3.91. C34 still advises 4 of 975 rows, so the C34 concern''s recommendation stands, with its evidence
  corrected. (3) E6''s D1 fix (aef898e0e) makes the early warning honest and about neutral, so it stays off. (4)
  Bad debt is now traced, not just attributed (782f50df9). The live receivable matches between world and company
  to the penny. Closed-account debt is held or written off at 365 days. The crisis adds almost no new leaver debt
  (GBP 100 in 2022, 324 in 2023, against about 1k a year in 2017-18). The BLOCKING finding''s open side is therefore
  the world''s indebted-leaver flow, and item 3 is the census that says whether that is selection or a world rule.
  (5) Billing: D48''s held estimates fell to 9 on 4 accounts. Its catch-up bound cannot be read because the published
  bills drop the catchup_* fields, and one listed dwelling went 14 months without a bill before a GBP 5,067 catch-up.
  That is a back-billing question, and item 2 makes it gradable. The publisher has been FAILING for 59h and is held
  to 26 Oct. The retnet pair is running (off arm since 18:26Z). Its driver files the grade.'
