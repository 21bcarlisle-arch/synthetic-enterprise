thesis_read: >-
  **The diagnosis landed and the repair did not, and the machine is now actively making the problem
  worse on a twelve-minute cycle.** Last orientation I named one defect — two histories, every alarm
  reading the shorter one — and it was worked: `82aae13ae`, `16fe54aa4` and `64bea0ba0` are on
  `origin/main` and carry the divergence surface leg, the fork-salvage live-writer fix and the
  subprocess runner the orphan-ratchet could not see. That is the steer biting for a second stretch
  and it is real. **But the reconciliation itself never happened, and the shape has inverted.** Local
  is now **3 ahead and 23 behind** — I ordered "land the 14 onto the trunk that holds the 20" and
  nothing in that instruction stopped the *publisher* widening the fork while it waited. It has been
  rejected non-fast-forward on every cycle since: `PUSH did NOT advance origin (rc=1)`,
  `will retry next cycle`, and each retry first **manufactures another local commit** — two of the
  three local-only commits are auto-publish commits produced by the loop that cannot push them. **A
  retry that cannot succeed is not a retry, it is an engine for the thing it is retrying.** The site
  has served a snapshot for over nine hours and the gap grows by one commit every twelve minutes.
  **Second, and it is the sharper one: a disposition in the staging root says a control landed,
  mutation-proven three ways, and that file is in no commit on any ref.**
  `tests/tools/test_a_published_surface_is_reproducible_from_its_committed_input.py` exists on disk,
  untracked, in a shared tree three lanes are writing to.
  `SEAT_DISPOSITION_THE_PUBLISHED_CUSTOMER_SURFACE_AND_ITS_MISSING_INPUT_2026-09-01.md` is untracked
  too. So the finding it disposes of — `site/data/customers.json` publishing 164 households the tree
  cannot derive — is **still BLOCKING, still live on the public page**, and the record now says
  otherwise. I would have believed that disposition; I only checked because the same class is in the
  memory. That is item one's defect wearing different clothes: the record outran the code, and the
  only reason anyone knows is that somebody went and looked. **Third, and it is the honest reading of
  this whole stretch: fidelity work has been third or later for four orientations running.**
  `svt_inertia_hazard` still takes `(years_on_svt, segment_days)` and nothing else — the measurement
  that proved it blind to the market (`18a09617d`, three predictions filed and confirmed) is a day
  old and the term it demands is unwritten, while every stretch since has been spent on the machine's
  own plumbing. Against the thesis the world is where it was: 61% of departures run a route the
  record contradicts most sharply in the year the record makes unmistakable, and the company's
  advantage cannot come from inference about a world that does not press back. **The plumbing goes
  first this stretch because a publisher that widens its own wedge is not a stall, it is a
  regression — but it goes first for the last time. If item three is still here at the next
  orientation, the drift is me.**
