- id: c34-s-debt-decision-cannot-be-graded
  raised: '2026-10-10'
  kind: strategy
  what: 'C34''s debt decision cannot be graded: the world answers every plan offer None (no published take-up or keep rate),
    no payment-method change crosses the seam, and withholding the SLC 27.8 offer is unlawful, so a per-customer debt rule
    and the flat plan rule are identical by construction on any book.'
  proposal: 'Name a curriculum world carrying a stated plan take-up and instalment keep rate, marked as curriculum and set
    blind to company results; the debt decision is then wired and graded inside that named world. Until you do, C34 stays
    at level 1 and the module stays in the orphan baseline. Also: tell me if a company-initiated payment-method change is
    a debt action a GB supplier takes at the 27.5B trigger; I read it as needing the household (DD mandate) or the regulated
    involuntary-PPM route.'
  status: answered
  resolution: 'Director, 2026-10-11T04:20Z: ''Merge debt management as a next best action with a new capability, a personal
    payment plan per customer, and design them as one.'' Supplier-controlled levers for customers already on a fixed DD (amount,
    review trigger, size of change, refund of surplus credit, contact timing, debt-plan terms within the rules) are tested
    as results now. Customer-chosen levers (changing payment method, seasonal plan, opt-in buffer, moving the collection date)
    have no published take-up, ''so run only as sensitivities across a take-up range, never as findings.'' ''Label anything
    unpublished as a toggle with a range.'' Design comes to him before it is built into the run.'
  evidence: docs/staging/SEAT_FINDING_C34_DEBT_ARMS_ARE_TIED_BY_CONSTRUCTION_BECAUSE_NO_DEBT_ACTION_REACHES_A_WORLD_THAT_ANSWERS_2026-10-10.md
- id: practitioner-question-at-an-annual-direct-debit
  raised: '2026-10-10'
  kind: strategy
  what: 'Practitioner question: at an annual direct-debit review, does a GB supplier set the new amount from last year''s
    spend, from last year''s consumption at the rates in force now, and does it add recovery of the balance? Nothing published
    says. On the single-levy run, the company''s review resets to last year''s spend at last year''s prices and never recovers
    the balance. That review lag is -£17.8k of the DD book''s -£20.6k net debit at 2018-06, and it is why the book never shows
    the summer credit a real one holds.'
  proposal: 'I recommend sizing the review from last year''s consumption at the rates in force (SLC 27.15''s ''most current
    information''). CORRECTED 2026-10-10 after measuring: I wrote that this was about -£11k of the debit, and it is £3.4k
    (lag -£17.8k to -£14.4k). About half of each year''s price rise comes after the review, which no rule can see. The rule
    is built and selectable, and the run''s default is unchanged because it missed its pre-registered £4k bar. The sharper
    question: does a supplier lift the debit by price changes it has already planned, or re-review when the price moves? Balance
    recovery stays your existing toggle until you say what the practice is.'
  status: answered
  resolution: 'Director, 2026-10-11T04:20Z: ''Your DD review question was answerable. Ofgem''s August 2022 decision strengthened
    SLC 27.15: a fixed DD must be set on the best and most current information in all cases, taking account of reads and of
    customer and third-party information, and reassessed when new information would change it materially. Close the practitioner
    question with this.'' He also set the shape: the DD amount comes from the company''s own twelve-month forecast for the
    property, priced at known rates where fixed and forecast rates beyond, plus the balance to be cleared.'
  evidence: tools/dd_book_legs.py; docs/staging/SEAT_FINDING_EVERY_SETTLED_BILL_CHARGED_THE_LEVIES_TWICE_2026-10-10.md (Prediction
    2's residual, split and graded)
