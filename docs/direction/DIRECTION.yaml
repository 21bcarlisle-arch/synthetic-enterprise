thesis_read: >-
  No level moved toward the thesis this stretch, and there is still no measurement of a per-customer
  view against the flat baseline. What moved is the route to that measurement. EP17 holds the
  population draw fixed until four bugs are closed, and then B11's per-customer-against-flat
  comparison can run on varied draws. Two of the four are now closed on origin: the stayers control
  (earlier) and E6's first slice (738b3f0ab). In E6, the published provision moves in the quarter the
  run's arrears build. The learned roll-rate stock trails by three quarters, so it stays off, and the
  missing 2021-22 step-up is filed as the world's. The held-estimate catch-up is graded by a
  continuation after 18:30. B12 is the long pole. Its pre-crisis shortfall is now decomposed
  (6442d41af): 2.5 points of bad debt the strike never priced and 1.7 points of levies locked at the
  start but billed by date. A worker tick then built the strike-side fix in
  company/pricing/renewal_rate_chain.py and was killed at its timeout at 17:04Z. That work now exists
  only as SALVAGE commits on no remote ref (4dd8f4bae and 3d1277a47 in /var/tmp/b12-strike, 6f440e559
  in /var/tmp/b12-land). Both worktrees are unlocked, their owner pids are dead, and nothing holds
  the claim. That is the most valuable unlanded supplier work on the box, so it is focus one. The
  split reads 0 supplier, 0 world and 15 other. Read honestly, the supplier substance is E6 and the
  B12 decomposition, plus 66b23fe38. That commit showed that every figure on the live site comes from
  the one publish of 21 whose imported bytes were not its stamp's. So the 2026-10-19 publish must be
  drawn at a clean stamp, and it will move what the site says even if no code changes. On the
  machine, three director-facing defects closed: his steer now has a route ahead of the lanes (the
  advisor channel, 4a581cd72 and 7bc3e3d3a), NTFY is mothballed as he asked (565bd6303), and a parked
  atom is no longer drawn (47e544e24; H45 is absent from this brief's drawn atoms). The previous focus
  was steered: 2 of 4 drawn, and both met their DONE. The run-stamp item delivered the arm refusal and
  the census (66b23fe38). The E6 item delivered the control, L1, and the world gap filed. Both leave
  focus. The other two (the red statement controls, and the merge offered as a landing) were never
  drawn. They are carried, and the statement item moves up, because a third real-book control (the
  ledger against the P&L on write-offs for 48 accounts) was found red at the same publish and its fix
  is landing now. That is the steer drifting, not the work being done. It did not go backwards.
