thesis_read: 'This stretch went backwards on evidence and forwards on fidelity, and the fidelity gain is what set the evidence back. 1d3c28930 found that every settled bill charged the
  non-commodity levies twice. Resident electricity was billed about 27% above the cap, which is why the first DD review ran 24-34% short. So the money and debt readings the thesis is
  judged on were read off bills no real supplier could send. That covers the published run, the arrears pool, B8 L3, the save''s +GBP 1,582 and the mover''s step 0. None of them is a
  per-customer-versus-flat result until it is re-read on single-levy bills. That re-read is focus one and two, ahead of new supplier work. The published run has not regenerated: sim-runner
  has deferred every cycle for long jobs. On the director''s three supplier items: the save''s arms finished with one household saved and an interval of -1,521 to +4,686 (cannot yet
  tell). No prediction was filed first, so it can never be graded, and it was read on double-levied bills. Home-mover retention landed its notice across the wall (ebde11366) and a real
  fix (cfd8ae74d: a household switching at renewal was credited with winning its own home). Its decision is still being built by the interactive session. C34''s debt branch was drawn,
  which corrects my last error, and landed the honest finding that its per-customer and flat rules tie by construction (b6d6bba87). That is now the director''s question. The world gained
  gas-arrival and gas-only-churn fixes, so the authorised seed books run. The machine got worse. The checkout is 70 behind, and 27 paths refuse the fast-forward, not one. Last record''s
  focus four was handed out, refused on held paths, and landed nothing, so that steer is drifting and is re-issued over all 27. 33 commits, 20 carrying work, 14 substantive.'
