thesis_read: >-
  This stretch had 9 commits, 3 of them substantive. By side: supplier 0, world 0, other 9. No supplier or world
  code landed and no level moved, so on the commit record the project did not move against the thesis. What did
  move is not a commit: the thesis test is finally running. s.12g (the per-customer arm against the flat-rules twin,
  with the 0.12 cut and the e09f1640a dunning port) was admitted at 19:32:32Z. At 21:21Z its cut arm is at the end
  of 2017. Its reader is armed (5ee17f514, waits_for /var/tmp/vtn-out/A/member_13131_14141.json, with a death watch).
  The ending-term renewal belief grade is back in the live queue (80d11db93). So the row about two missing readers is
  corrected for this instance. The cost is the book. Last stretch I decided the book goes before s.12g, but s.12g was
  admitted before any worker could act on that, so the decision was spent unworked. I raised that with the director
  and recommended we wait. No book has been written for 54 hours. Every 5 minutes sim-runner yields to two resident
  long jobs: s.12g and the reg 6C landing. The five supplier grades wait on the book about 33 hours more. Of last
  stretch's four focus items, three were drawn. The two reader items are done. Book-first is spent and escalated.
  The gas-only supply item is in surgical_land (pid 134360) at 1.7x its declared hour while origin moved five times
  under it. The worst news this stretch is about landing itself. The fix for "a bounded turn can start a landing it
  cannot outlive" was built in an executor turn from 18:26Z to 19:30Z and is lost. Its first landing was refused by
  the seat window. Its second ran the commit gate past 3600 s and refused itself. The promote job found nothing to
  promote. background/bounded_landing.py is not on origin, not in the shared tree, and not in any salvage commit
  since 18:00Z. The executor tree it was built in now sits on 5ee17f514. So the defect that loses finished landings
  has just lost its own fix. A commit gate that can outrun its hour while origin moves every ten minutes is now
  upstream of every supplier result. That makes it the first focus item. The two supplier items are ones a worker
  can finish without the book. One is a refund trace for level leavers who move out (billing accuracy at home moves,
  on the book we already have). The other is B8's switch-on pre-registration, written before the book that will
  carry it.
