      `docs/design/M2_PAYMENTS_AUDIT_DD_RAILS.md`, `docs/status/LATEST.md`, and
      `docs/market_research/what_bill_shock_is.md`. **Correct that count inside the finding, beside
      the original claim**, not quietly. `tools/generate_dashboard_data.py` is the one to look at
      first: if the string reaches a rendered surface from there, this is published and not merely
      internal.

      **The ±5% is not fabricated and must not be deleted** — it is a real and widely used supplier
      review convention and the code applying it behaves sensibly. What is wrong is a modelling
      convention wearing a regulation's clothes. Cite **SLC 27.15** for the duty, declare the ±5% as
      a convention with its own origin under `tools/domain_constant_origins.py`, and state on the
      surface that the licence names no numeric trigger. If nothing published establishes it as a
      convention either, that is the honest answer and it goes on the page as a `None` with a named
      reason.

      **Then close the class.**
      `docs/staging/WORKER_FINDING_THE_STANDING_CHARGE_IS_FOUR_DECLARATIONS_AND_A_CITATION_THAT_CANNOT_BE_CHECKED_2026-08-31.md`
      is the same shape and still staged. Two instances is a class, and the rule that should have
      caught both — *a money constant citing a source must be reached* — is prose where it needs to
      be a refusal. **A cited authority that cannot be resolved in the commons is a refusal, not a
      comment.** Key the control to that property, never to today's list of bad citations, or it
      goes green the moment someone invents a new fictional condition.

      **Done means:** no file in the tree cites SLC 27B; the ±5% carries a declared origin as a
      convention; the finding's own count is corrected in place from four to what you measure; and a
      mutation-proven control refuses an unresolvable citation as a class.
    why: >-
      A number sourced to a condition that does not exist can never be verified and will never be
      corrected, and this one has spread from four files to twenty since the finding was written,
      including pages we serve to readers as research. It is the second instance of a class that
      already has a written rule, and the rule caught neither — the definition of a control that
      cannot fail. Ranked last because it corrects an attribution rather than a behaviour: the ±5%
      produces the same decisions tomorrow either way, whereas everything above it is a refused
      publisher, unlanded mission code, an instrument class that reports false success, and the wall
      that makes our arithmetic checkable.
