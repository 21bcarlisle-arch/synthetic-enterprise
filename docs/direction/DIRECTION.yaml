    why: >-
      An uncommitted archival is not a discharge, so every lane reading the queue from a ref sees 208
      documents where 109 exist, and the sediment reading that drives "the queue grows without bound"
      is computed over the wrong denominator — it may be measuring a filing problem that is really a
      committing problem. This is the same class as focus one at scale, and it is the cheapest 99
