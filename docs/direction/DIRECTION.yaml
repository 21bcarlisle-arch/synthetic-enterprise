    from 31 March 2025; a supplier in 2016-2022 faced no such target. The code also carries GBP 130 per
    account where the decision set GBP 115 (GBP 130 was the April 2023 consultation figure). saas/growth_mandate.py
    bounds the campaign's quote budget by capital per account, so both the figure and its start date shape
    how fast the book can grow. The figure is a factual correction the seat is landing as its own measured
    step; the start date changes which world the company lives through, so it is yours.
  proposal: Apply the Capital Target from 31 March 2025 (GBP 115 per dual-fuel account, GBP 0 floor),
