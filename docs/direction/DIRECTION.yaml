  - id: decide-whether-the-drawn-book-should-carry-a-tariff-type-on-fidelity-grounds
    what: >-
      `4be65df49` established that `SyntheticCustomer.tariff_type` defaults to None and `_draw_one`
      never sets it, so 213 of 222 electricity accounts are refused by `UPLIFTABLE_TARIFF_TYPES`
      and the A/B's decision surface is 25 wide by plumbing. The commit correctly recorded setting
      it as a baseline-world change owed under R13 rather than making it. Make the decision, and
      make it the way R13 requires: blind to what it does to company P&L or to the A/B's outcome.
      Produce a short written determination in `docs/design/` that (a) states what these drawn
      accounts ARE in the world today -- the commit describes them as terms the world settles as
      ordinary annual fixed contracts with locked rates whose product was simply never labelled;
      verify that from the settlement path rather than repeating it; (b) cites an external anchor
      for what the real distribution of domestic and SME contract types looks like over the run
      window -- Ofgem's published fixed-versus-variable split is the obvious source and the
      discovery lane exists for exactly this; (c) rules on whether leaving 96% of drawn accounts
      with an unlabelled product is a fidelity defect in the world, which is the only question that
      may decide this. If it IS a defect, set the field from the external distribution, version the
      change as a named baseline-world correction with its fidelity citation, and note that a
      larger decision surface is a CONSEQUENCE and not the reason. If it is not a defect -- if the
      world genuinely intends these as a product with no renewal decision -- write that down in
      those words and the A/B's 25 decisions become a permanent finding about how little of a real
      domestic book per-customer pricing can touch. Either answer closes it. What is not allowed is
      setting the field because it makes n bigger.
    why: >-
      Every previous stretch has run into the same wall -- a selection leg of a few hundred pounds
      against a seed spread of GBP 3,121 across 25 decisions cannot be resolved by re-running, and
      I rejected the S3 world-widening on exactly those power grounds. This is the first route past
      it that does not involve inventing anything: the decisions may already exist in the world and
      be refused by an unset field. It is third because items one and two are live published
      defects and this is a world change that deserves to be made slowly and on evidence. Finished
      when there is a written, externally-anchored determination either way, and -- if the answer
      is to set it -- a versioned baseline-world change whose stated reason is fidelity and whose
      effect on the experiment is recorded as a consequence. R13 is the wall here and it cuts
      against us: the agent controls both sides, so a world change that happens to make our own
      experiment easier is precisely the change that must be argued hardest. If the fidelity case
      is thin, the honest outcome is to leave the world alone and accept the small surface.
  - id: grade-EP1-on-a-belief-the-company-could-have-held
    what: >-
      EP1_clv_three_horizon, carried for the fifth consecutive stretch and written as a Lane 0
      instruction this time rather than as an atom id, because as an atom id it has been drawn
      twice and repaired zero times. Do the smallest landable thing and land it before doing
      anything else on the atom. `tools/couple_clv.py:606` defines `_earliest_belief` and line 714
      calls it; the earliest year-end snapshot is exactly where `churn_probability = BASE + 0 x
      UPLIFT` (`saas/churn_model.py:39`, `company/analytics/clv_three_horizon.py:580`) because no
      bill-shock history has accrued, so the hazard is 0.05 for the entire graded population by
      construction and `distinct_hazards: 1` measures the rule and not the company. The stated
      justification -- that a ceased account has no other snapshot -- is false for 14 of the 20
      graded accounts still present. Replace the selection rule with one that grades a belief the
      company actually held while the account was live, keep the existing single-snapshot fallback,
      and write the new rule AND its reason into the docstring beside the one it replaces. Land
      that commit on its own. THEN run `python3 -m tools.couple_clv` and land the refreshed
      `docs/observability/coupled_gap_ledger.json` row, which must state how many distinct hazards
      the graded population contains. R15 both ways: reverting to the earliest snapshot must red a
      test asserting `distinct_hazards` stays above one, and the new rule must not pass by reading
      a field the belief producer also writes -- trace the FIELD, since a cross-layer import is not
      automatically a tautology. The ledger already reports `belief_provenance.grades_atom_estimator:
      true` and `ep1_chain.reached_through_the_door: true`, so the wiring half is done and this is
      genuinely the last owed piece.
    why: >-
      This is the company half of the thesis -- whether the supplier's per-customer lifetime-value
      belief is worth anything -- and `tools/couple_clv.py` is the only instrument that grades it.
      It is also the only level move currently available on evidence, at `level_current: 2` against
      a filed intent of 3, with the map entry stating in terms that EP1 has not been graded once.
      It is last because the three above are live published defects or a decision that unblocks
      every future reading, and because this one has proven it can wait; it is still named because
      dropping it would make five stretches of naming it worth nothing. Finished when the ledger
      row is measured under the new rule and reports more than one distinct hazard, or reports that
      it does not and why. If the coupled rung is then met, self-certify with
      `record_level_up_self_certified` and never `--no-verify` a `level_current` change. R12: the
      gap of 2.529 is a diagnostic. A belief that turns out badly calibrated once it can vary is a
      finding worth having, not a defect in the fix.
