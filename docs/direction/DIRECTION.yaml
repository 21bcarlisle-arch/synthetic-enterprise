focus:
  - id: flat-control-credible-average-player
    what: Calibrate the £2/MWh flat-rules control arm to an externally sourced average UK supplier margin, decided blind to how it makes the value arm look.
    why: The thesis makes the baseline the entire meaning of "it performed well", and a control the company's own verdict describes as one nobody would actually run cannot carry that weight.
  - id: publish-path-lands
    what: Make a green publisher run reach origin -- the commit has been refused, timed out or lost on 12 consecutive episodes while its own scoped suite passed.
    why: R11 makes the live surface the definition of done, so with this down nothing below can be shown true, and the half-hourly carbon figure has sat 11.8h stale.
  - id: EP1_clv_three_horizon
    what: The CLV estimator and the instrument that grades it -- 1.76x worse than the population mean, graded on 5 accounts of a book that now holds 263.
    why: CLV is the quantity the thesis says every per-customer choice is made on; below an estimator carrying less information than the mean, those choices are arbitrary, and 5-of-263 could not detect an improvement anyway.
  - id: expected-cost-collections-term
    what: Collections cost is counted as zero inside the EV arithmetic, so every expected-cost figure is a declared floor and only 4 of 263 accounts differ on credit risk at all.
    why: The director named default risk, collections cost and bad debt as the three terms that must sit inside the arithmetic rather than behind a floor -- two are in, and the third is a hole the new licence register cannot close for us.
  - id: harness-lane-prune
    what: Read the 117 H_harness atoms; delete what should not exist, close what is finished, collapse what is bookkeeping rather than work.
    why: Named twice by the director on 24 August and unchanged since; it is what the draw actually sees, so an untrue map silently shapes every tick's choice of work.
not_now:
  - what: Wiring the value arm to the live renewal desk now that it prices per customer.
    why: >-
      It reports `fit_to_run: false` on itself -- 8 of 263 accounts priced at the edge of its own grid and a median implied bill move of +51.4%. That is a ceiling reporting itself as a decision, and wiring it would push a real pricing defect behind the wall for the company to have to rediscover.
  - what: Explore's remaining stages with real data, which the director named third in his own queue.
    why: Those stages render the very numbers focus items 1 and 3 are currently deciding the credibility of. A truer surface over an estimator worse than the mean publishes the error more clearly rather than fixing it; it moves up the moment the CLV instrument means something.
  - what: Pushing EP13 carbon to L3.
    why: Its Expert Hour was taken and refused, and the 3.16x spread overstatement is now caveated on the page in the same sentence as the figure. The honest level is already held; an L3 push buys presentation, not fidelity, and the thesis needs fidelity.
  - what: Filing further findings against the 30 already sitting LATENT.
    why: The director named this directly as a token cost -- don't file where a class document already covers it -- and five class documents already carry these shapes. The queue needs discharging, not lengthening.
  - what: Restructuring lanes and epochs alongside the harness prune, which he explicitly gave authority for.
    why: A lane restructure changes what every future draw sees, and five atoms are mid-flight at L2 right now. Prune the stock first; judge the structure once the map is true, so the two changes can be told apart.
