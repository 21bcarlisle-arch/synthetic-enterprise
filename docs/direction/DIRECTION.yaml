focus:
  - id: grade-the-pages-own-escape-clause-before-spending-two-hours-on-it
    what: >-
      The live arms headline names a remedy — *"What would resolve it is a larger SETTLED BOOK —
      more renewals actually priced by the arm — and not more seeds"* (`site/data/value_arms.json`,
      composed at `tools/generate_value_arms_data.py:1316-1321`). Establish whether that sentence is
      true, by arithmetic and a cheap decomposition, BEFORE anyone launches a lifted-budget re-run
      for it. **Read `docs/observability/value_cycle_ab_s1_noise_floor_20260829.json` first:** each
      of the three seeds re-draws `simulation.population_draw.price_elasticity_for_customer` for
      2,020–2,074 households, and `decisions.value_arm_priced` is 20. So the £2,577.80 stdev on
      `selection_gbp` has two possible sources and they imply opposite remedies — the 20 priced
      households' own elasticity (shrinks as ~1/sqrt(n), so a bigger book resolves it) or the other
      ~2,000 households' churn cascade landing in the same net (does not shrink with the priced
      count at all, so a bigger book buys nothing and the page is wrong). Separate them with two
      extra floor legs off `tools/run_value_cycle_ab.py`, one process, `systemd-run --user --unit=`:
      re-draw elasticity for the PRICED households only, holding the rest fixed; then the mirror,
      re-drawing everyone EXCEPT the priced. The two variances should roughly sum to the £2,578 you
      already have, and that reconciliation is the control that the split is real rather than two
      unrelated runs. Then do the arithmetic out loud: at the share of variance that is priced-side,
      how many priced decisions would put the observed £1,816 selection contrast outside its floor,
      and — using the funnel at `decisions.why_the_rest_were_not_priced` (662 product-not-upliftable,
      429 gas, 258 term-0, from 1,369 offered) — what settled book that implies. Print that table
      before you write a test. If the priced side is the small half, the headline's remedy sentence
      is wrong and must be replaced by what the decomposition actually supports, in the same
      publish, with the old sentence kept in `withdrawn_claim` exactly as the last one was.
    why: >-
      The last stretch stopped the page asserting a direction it could not carry, and then let it
      assert a REMEDY it cannot carry either — and the evidence against that remedy was already
      inside the artefact the same commit tracked. This is first because it is the only live wrong
      sentence, because it costs one process rather than the two-hour lifted-budget run that three
      directions have queued behind it, and because its answer decides whether that run is worth
      launching at all. **Done means:** two floor legs whose variances reconcile against the
      published £2,577.80; a printed table of decisions-needed against book-implied; the headline's
      remedy clause either confirmed with its price stated or withdrawn onto the record beside its
      replacement; and ONE mutation-proven control keyed to the property — feed the composer a
      decomposition where the priced side dominates and the "larger settled book" clause must
      appear, feed it one where it does not and the clause must be absent. A control pinning today's
      wording is the failure this project keeps repeating. **A permitted result is "the arm
      comparison cannot resolve at any book this world can legitimately produce"** — that is a
      finding about the instrument and it goes on the surface, not in a footnote.
  - id: the-settlement-ceilings-basis-stops-being-circular
    what: >-
      The director's own top item, in his words at 2026-08-29T05:55:53Z, unnamed by three directions
      since: *"from 2018 the settlement engine books zero of every year's wins… Fix the settlement
      ceiling so the campaign's wins actually reach the book"*, with *"it needs a non-circular basis,
      not a bigger number."* Read `docs/design/SETTLEMENT_CEILING_REMEASURED_2026-08-29.md` §6 — it
      specifies the run and says plainly that a slope needs two clean points and only one was clean,
      the second contaminated by a defect in the probe itself. Get the second clean point.
      `tools/settlement_ceiling_probe.py` is the instrument; run it via `systemd-run --user --unit=`
      because `worker-tick.service` is `KillMode=control-group` and `setsid` has failed three times;
      do not overlap it with another long run — 1,200 customer-years already costs 17.0 min and
      4,193 MB peak on a box that OOMs, and read
      `background.resource_headroom.sample()["total_mb"]` rather than quoting a memory figure. Read
      `WORKER_FINDING_THE_CEILING_PROBE_READ_THE_PRODUCERS_BOOK_BACK_AS_ITS_OWN_RESULT_2026-08-29`
      before you grade anything: the probe path mirrored the live producer's book back as its own
      result, so this must write its own artefact and must not be graded off
      `settlement_ceiling_probe.json`. **The deliverable is the basis, not the number.** With a cost
      curve in hand, state what `SETTLEMENT_CUSTOMER_YEAR_BUDGET` is a budget OF, in one sentence a
      reader can check — it is this machine's wall clock and memory against what the publish cadence
      actually requires, and the circularity is that the cadence is currently measured as how often
      runs arrive. Break that by fixing the requirement independently of the arrival rate, or, if it
      cannot be broken, say so and say why in the constant's own note. Then say on the published
      book-growth page, on the surface, that the book is bounded by a compute budget and not by
      commerce, and that 340 of 386 funnel wins are refused by it. **This is explicitly NOT
      `PROSPECTS_PER_YEAR`**, which is a property of the world, is R13-reserved, and stays where it
      is until he moves it.
    why: >-
      He asked for this fifteen hours ago and named it his top item; nothing since has named it back,
      which makes it the clearest thing drifting in the tree, and a steer that goes three directions
      without appearing in focus is a failure of this seat rather than of the draw. It is also the
      root under item one: the arm prices 20 of 1,369 renewals because the book is 167 accounts
      because a wall-clock budget refuses 88% of the wins the funnel produced, so "the advantage must
      come from INFERENCE" is being tested on a book a harness limit chose. It is second only because
      item one is an hour and tells us how much of this item's payoff reaches the arms. **Done
      means:** two clean probe points and a stated cost curve; the constant's note saying what it is
      a budget of, with the circularity either broken or named as unbroken and why; the refusal
      count on the published page rather than in an artefact; and the ceiling moved or held with the
      reason written down — *"the probe says 1,200 is right and the ceiling is real"* is a complete
      and useful answer, and a number picked to make the book bigger is not.
  - id: land-the-founder-book-controls-that-are-in-no-commit
    what: >-
      Fourth direction, unchanged, still uncommitted — and hoisted above the long runs this time
      because putting it fourth is why it has never been drawn, not evidence about the tree.
      `docs/design/held/README.md` in the working tree asserts "DISCHARGED 2026-08-28 — Landed in
      HEAD" while the three `.held` artefacts it describes are deleted-but-uncommitted
      (`FOUNDER_BOOK.yaml.held`, `founder_book_live_population.patch`, `test_founder_book.py.held`),
      `docs/design/FOUNDER_BOOK.yaml` is modified, and `tests/simulation/test_founder_book.py`,
      `tests/simulation/test_live_population_seam.py` and `tests/simulation/test_customer_events.py`
      are all uncommitted while `simulation/live_population.py` IS in HEAD at `3d83edffb`. Verify
      each of the three test files green against the tree the commit WOULD create — through
      `python3 -m tools.surgical_land`, never against this shared tree, which measures three other
      lanes — then land the set as one commit by pathspec including the three deletions. If a file
      does not belong to the landed code, name which and hold exactly that file rather than the set.
      Thirty minutes; the natural thing for a tick to do while a detached run from another item is
      in flight.
    why: >-
      Landed code whose controls are in no commit has no control at all from any other checkout, and
      a working-tree file asserting the work is committed is self-refuting. **The trip-wire, re-keyed
      because the last one was keyed to the wrong thing:** it now fires on the property, not the
      calendar — if this item is DRAWN and the landing fails, that is evidence about the tree and it
      becomes a finding with a gate against the class "code is in HEAD and its controls are not". If
      it is simply not drawn again from position three, that is evidence about my ordering and the
      correction is mine, not the tree's.
  - id: adjudicate-the-22788-pre-2021-loss-against-a-baseline-that-cannot-move
    what: >-
      Carried a third time, and re-specified because the last specification had a defect. Run the
      one-variable comparison that `docs/design/NET_FALL_ATTRIBUTION_2026-08-29.md` §2.6 owes and
      §3.3 depends on — but run it as `248a6368e^` against `248a6368e`, both historical, NOT against
      HEAD. Focus item two may move the settlement ceiling, and a comparison anchored on HEAD would
      then be confounded by two changes at once with no way to attribute the result. Launch with
      `systemd-run --user --unit=`, after any other long run has exited (`tools/wait_for.py --pid`),
      and write the prediction down first — there is now a named mechanism to predict against:
      `WORKER_FINDING_THE_CEILING_SPENT_THE_WHOLE_BUDGET_ON_ITS_MOST_EXPENSIVE_COHORT_2026-08-29`
      establishes a 2016 win costs 9.83 customer-years against 0.78 for a 2025 one and that the old
      first-come spend bought 2016's accounts first, so a uniform-share allocation buys fewer
      early-year accounts BY CONSTRUCTION and the 37 missing 2016 accounts would be a designed
      consequence rather than a regression. Predict it, then let the run refute it. Two questions,
      one measurement: is the pre-2021 loss a fidelity repair or a regression; and does the R6
      co-movement — headroom −£34,385 against realised acquisition spend +£14,396, a fall 2.4× the
      spend rise — survive as an attributed mechanism, or is it the book changing and the balance
      sheet following?
    why: >-
      A £22,788 loss in years the campaign cannot touch sits under every published net figure and
      nobody has said whether it is the world getting more honest or the company getting quietly
      worse — that is exactly the difference between value created and value transferred, which is
      the mission's first sentence. It is fourth because items one and two both bear on live
      published sentences and this one does not, and because the re-specification above means it no
      longer decays if item two lands first. **Done means:** the word "repair" or the word
      "regression", with the run printed beside the prediction that preceded it, and either an
      attributed R6 mechanism or an explicit statement that these two channels cannot be separated
      by this run plus what would separate them. A refusal that names what could not be isolated is
      a permitted result; a plug is not, and nothing may be tuned to make the collateral mechanism
      fire.
