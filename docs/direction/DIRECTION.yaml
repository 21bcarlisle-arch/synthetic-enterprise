focus:
- id: a-closed-account-is-never-offered-a-prepayment-meter
  lane: C_customer_ops
  side: supplier
  what: Make "no recovery step against an account the company no longer supplies" a class invariant, per
    docs/staging/SEAT_FINDING_THE_DESK_OFFERS_A_PREPAYMENT_METER_TO_A_HOUSEHOLD_THAT_HAS_LEFT_2026-11-23.md.
    In company/billing/collections_journey.py, _offer_prepayment and every other premise-side step (a
    field visit, a warrant, a meter fit) must refuse, with a named reason, for an account on churned_billing_accounts
    or closed before the step's date. A closed account's debt goes to the final-account route the desk
    already has. Add the rule to company/compliance/domain_invariants.py. Write a test that rebuilds the
    ACC-SYN-2016-005 shape (journey opened after leaving, Consent offer on 2016-10-26) with 7527's closing
    forced off, and asserts the step is refused. Add one control showing a SUPPLIED account in the same
    state still gets the Consent offer (the branch can be taken). FIRST run pgrep -af surgical_land and
    read /tmp/seat_exec_e/chain/chain.log. If the consent-controls-then-gas-only-win chain is editing
    collections_journey.py, build in a worktree off origin/main and land with surgical_land --content
    only after /var/tmp/se-consent-gas-chain-ended-20261123.txt exists.
  why: A real supplier knows it closed the account; asking the world to fit a meter at a premise it no
    longer supplies is the company misusing what it can see, and 7527 only hid the one example the control
    had. Done means the invariant and both tests are on origin, and the finding is closed with work_items
    --done naming the commit.
  written_at: 1795425917.131
