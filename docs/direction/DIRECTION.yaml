thesis_read: 'THE THESIS HELD ITS GROUND, AND ITS EVIDENCE IS BETTER STAMPED THAN IT WAS, BUT IT DID NOT MOVE A
  LEVEL. Stage A''s grading landed (1ba33d5ed). On the refitted world the value rule beats a flat price set in advance
  on three dice paths of four, with a pooled SNR of 2.38. Without 2018 the pooled SNR is 1.56. The four paths still
  share 28 of 42 households, so the claim is "beats on this book", not "beats on books like this". The grading also
  says plainly, "Attribution: I cannot yet say". The edge per decision rose from 3.2 to 7.7 GBP across 96 commits
  that changed the world''s departure anchor and the company''s offer and belief code together. Until the one-variable
  run is done, I cannot say whether that edge came from inference in the company or from the world getting easier
  to beat, and that is exactly the question the thesis turns on. So it is focus item two. The HEAD re-take of the
  value arms finished and published (d7169c720): every figure is unchanged at HEAD''s code, and the selection leg
  now carries a direction for the first time (3 of 3 re-draws positive, no size claimed). Two carried machine errors
  are now CORRECTED with evidence. 77a872e01 puts every SE_ switch the run reads, and the code commit it ran from,
  into the arms'' world stamp. Two artefacts one switch apart now refuse to pair, and three mutations were seen
  red. That closes the digest-blind-to-switches row and the stamp-not-tied-to-HEAD row, and it is the precondition
  for Stage B being trustworthy if he grants EP17. bb250f8ea stops a Lane 0 item that is already finished on origin
  from being handed out again. Measured on the live ledger, it refuses 21 ids, including the QEP redraw, and that
  closes F5. THE PB4 STEER WAS WRONG, AND IT WAS MINE. PB4 was first in focus for two stretches and landed nothing
  either time. The cause is not drift. The COUPLED_TRIAD gate (background/coupled_triad.py, binding rule 1) excludes
  PB4 from every BUILD draw, because a world atom cannot step into L3 until a company twin at L2 or above has been
  tested against it. The supervisor log said so on every tick. PB4''s twin is C29_decisions_stop_being_lookup_tables,
  which names PB4 in its depends_on, and C29 is at L0, idle, with a block_reason that says it is sequenced behind
  B10. B10 reached its target and was refiled on 2026-08-30 (15a9703ae), five weeks ago, and nothing re-asked the
  hold: the carried hold-condition error, recurring. The right steer is the company side that PB4 is waiting on,
  and that is also the thesis''s own phrase, decisions made customer by customer. 8 commits, 7 carrying work, 1
  no-work merge. Every worktree HEAD is on a remote ref. The shared HEAD is 8 behind origin with a surgical_land
  in flight (EP13 s34), so daemons from this checkout are running code that origin has moved past.'
