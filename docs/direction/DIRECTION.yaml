  resolution: ''
  evidence: docs/staging/advisor/done/ADVISOR_TRIAL_WOULD_A_READING_REVIEWER_HAVE_CAUGHT_OUR_KNOWN_BAD_COMMITS_2026-10-17.md
  recommendation: 'I recommend the trial as proposed: two blind non-blocking Opus readers on commits that add a
    module or re-implement a rule, findings filed only when both agree, scored for two weeks and stopped below half
    confirmed. Evidence: two agreeing readers flagged 4 of 5 bad commits and 0 of 5 clean ones, and caught every
