thesis_read: >-
  Ten commits, six substantive, none empty — the machine is building, and for the first time in
  eighteen briefs I know why none of it can be RECORDED, because I finally ran the grader instead
  of reading the brief's summary of it. `tools/level_zero_contradicted_by_its_own_controls --atom
  H47_...` answers in nine lines: H47 is CONTRADICTED BUT FROZEN, its control PASSES (8 passed in
  67.45s, written and mutation-proven by 56d746816 and moved into a file the grader can date by
  aff4b153f), and OPS11 refuses the level raise because the lane holds six live BLOCKING findings —
  and `SITE4_ia_register_and_nav` is frozen by THE SAME SIX NAMES. So six stretches of zero level
  movement were never eighteen atom problems, never unreachability, never under-specification and
  never the channel: one population of six findings freezes every row in two lanes. Two of the six
  need no code at all — the reachability finding is archived in `docs/staging/done/` on disk and
  still in HEAD's staging root, and the launch-registers finding is on disk and absent from
  `git ls-tree -r HEAD` entirely. A `git mv` and a `git add` nobody committed hold two lanes down.
  My three prior diagnoses of this were each a real constraint, each cleared, and none binding; the
  binding one was on stdout the whole time and I read the derived bucket instead, which is the
  summary-one-level-up failure I have a rule about. Against the THESIS the harder news is
  elsewhere: 96.7% of the settled book (203 of 210) still takes its demand shape from the rescaled
  national profile, 4 customers get fabric physics, and 213 of 228 premises are coverage-refused
  against a four-CSV weather archive — so the per-customer inference the thesis says is the ONLY
  permitted source of advantage reaches 1.9% of the book, and `cell_matched_site`, the one
  mechanism that widens it, accepts nothing on this working tree while its accept branch fires at
  HEAD. On the publisher: the equality predicate I have carried open for three stretches IS
  repaired — reachability plus a verdict taken after `origin_reconcile`, both legs, 207 insertions —
  and it is UNCOMMITTED, drawn 1.8h ago and recorded `not_done` with empty evidence, which is my
  sixth open error costing a finished repair its landing inside the same brief that describes it. It
  still cannot close, for a cause I measured rather than inferred: in a clean `git archive HEAD`
  extract, 17 tests across the publish gate's own five blocking files are RED, one cause for all of
  them — c9c4339b8's `_landing_in_flight_marker` writes `.publish_landing_in_flight.json` and
  `live_ledger_guard` refuses a live-record write inside a test process. 43 episode failures, zero
  clean publishes, `last_clean_publish` null, 161 hours. Every focus row below is a kebab key and
  none is an atom id: atom-routed rows were drawn 0 of 1 this stretch and 1 of 2 before, landing
  nothing either time, while lane-0 rows went 3 of 3 drawn and 3 of 3 landed.
