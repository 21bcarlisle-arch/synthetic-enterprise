thesis_read: >-
  Three hours, eleven commits, nine substantive, and the top of the last record was answered
  properly: the value arm no longer reports a ceiling as a decision. A coarse grid that could only
  ever return one of its own sixteen numbers now brackets, and a refinement decides -- 107 accounts
  sitting on exactly GBP 130 became a concentration of 1.9%, with interior optima on 257 of 263 and
  only one account still at the top of its grid. That is the difference between a per-customer
  decision and a rule wearing one, and it is the single most thesis-relevant thing this project has
  built. LANE 0 landed too, so this record is reachable by a draw, and publishing is live again --
  the cause was never the deadline but two files git had never seen, and the receipt redesign the
  last record ordered was correctly REJECTED on analysis rather than built, because only the second
  gate can see what the commit is landing. Both of those items therefore leave focus. What the
  improved arm bought is a much sharper problem, and it is the world's, not the company's. Freed to
  choose, the arm chose a median of GBP 115/MWh and a +53% median bill -- roughly GBP 900 a year on
  a typical account -- and it is right to, because `simulation/market_switching_propensity.py:55`
  caps the world's annual switching rate at 22% once savings available pass GBP 400, and both sides
  cap the leave probability at 0.95. So the world models one in five leaving whether a rival is GBP
  400 or GBP 2,000 cheaper, and one in twenty staying whatever they are charged. The arm has priced
  its entire book into the flat top of that curve, which is beyond anything the DESNZ series it was
  fitted to ever observed. This is the coupled-triad rule biting exactly where it was meant to: no
  company capability is complete until it has faced a world that can defeat it, and this world
  cannot defeat a supplier that gouges. It also weakens the headline comparison -- a +2.0pp
  belief-versus-truth gap between an estimator and a truth fitted from the same published series,
  read where neither has data, is co-calibration and not demonstrated inference. So the honest
  position is that the per-customer machinery is now real and the instrument that would judge it is
  not. On the previous focus: the brief again reports none of it drawn, and again the brief is
  wrong -- it counts maturity-map atom draws only, and three of the five items were non-atom
  instructions, two of which landed. The steer is working and unmeasured; that is now the third
  record in a row where this seat's own instrument would have told the next seat to give up on
  steers that were succeeding. The genuine drift is different and it repeated within this stretch:
  the arm rebuild -- 207 lines, and the best work here -- is sitting UNCOMMITTED in a shared tree
  with 462 untracked paths, which is the exact defect the last record caught on LANE 0 and fixed.
