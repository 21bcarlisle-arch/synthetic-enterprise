thesis_read: >-
  The steer worked: all three focus items were drawn, and all three landed. The DD review can now
  ask for the balance it is owed (2c1283600). It sits behind a company switch, off until the 19 Oct
  publish, and the finding recommends turning it on after the publish, with two conditions. The
  retention-sharing page measured the director's open C34 row (529a7ea78). A rise on a fixed
  retention tariff brings our side to zero in 18 of 18 cases with the hazard held, and in 10 of 18
  once the rise's own effect on staying is counted. Joint value does not change, so the rescue is a
  transfer, not new value. The budget page is written (0aea226e1), so the world's non-payment build
  is ready for the day after the publish. D46's blocking finding is discharged.
  Against the thesis, though, the central claim has still not been tested, and it has moved
  sideways, not forward. A per-customer view beating a flat one depends on inference. The one
  place we test inference on held-back history is company/analytics/forward_clv.py. Across nine
  slices it has held the flat level and ranked no better than flat (slice 9, b72674c73). It has
  only ever been keyed on margin, segment, fuel, tenure and calendar year. It has never been given
  the observables a real supplier holds and the published evidence ranks: fixed against default
  tariff (2.8x), credit against prepayment (3.4x), three or more years on the default tariff
  (0.54x). The world already carries all three (open row canon-w3). So "per-customer ranks no
  better" so far describes a forecast that has not been allowed to look. That gap matters more
  than anything else this record can direct.
  The fresh-seed verdict (EP17) still waits on the director's seed listing, which is the open row.
  Development on the slice-5 book can go ahead meanwhile, as long as it stays labelled as
  development. The crisis bad-debt finding is still BLOCKING on the world level alone.
  Balance: supplier 1, world 1, both 1, and 7 other (knowledge pages, findings, merges). The supplier
  share is understated, because two of the "other" commits are supplier knowledge pages.
  Nothing went backwards. The only stretch-local error is a worker's pre-registered barred share,
  which ignored the open book. It is graded and kept in the D48 finding, which is the instrument
  working, not a machine defect.
