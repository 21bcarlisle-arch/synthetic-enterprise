thesis_read: 'Three hours: 14 commits, 12 carrying work, 6 substantive. The classifier reads 0 supplier, 0 world,
  1 both and 13 other, and that undercounts the supplier side: the replication grade and B8 are both supplier work.
  The steer bit this time. Both of last stretch''s live items landed. Pair 33333/44444 was graded at 06:27 (300302799).
  Cut minus A on the value arm reads +GBP 1.10 (+0.37 to +2.14) against a prediction of +0.60 (-0.60 to +1.80),
  so it HELD. The flat book moved -GBP 0.008, also HELD. Value arm minus flat book with the cut reads +GBP 7.27
  (+0.95 to +13.33). B8''s holdout publishing landed as 775a3c46c through launch_long_job, so the seat''s embargo
  row and the machine''s stranded-landing row are both corrected. But the grade also showed that the thesis test
  is not yet designed, and this is the thing this stretch means. The replication re-draws churn on the SAME households.
  Five of its ten up-movers are among the nine the 0.12 cut was fitted to reach, and they carry GBP 5,701 of the
  GBP 12,407. There is no flat-rules twin at these seeds either. So even a clean second pair can say only that
  the cut is not redraw noise. It cannot say the per-customer arm beats flat rules on households it was not tuned
  on. The open -GBP 0.33 row therefore stays open, and the work that can close it is a fresh-population test (SE_POPULATION_SEED,
  EP17) with the twin, pre-registered now while pair 2 is still unread. That is item 1. A blocking supplier control
  surfaced too: the director''s "a save is not paid for by the stayers" condition is red on equal arms. Three households
  carry a +0.35% raise in July 2018. Pair 55555/66666 is slower than the 15:00Z estimate (its log is in mid-2019),
  so the book that grades D48, KNIFE3, the dual answer and B12 still waits behind it. The checkout is 44 behind origin.
  The executor is taking the customer-voice theme map now.'
