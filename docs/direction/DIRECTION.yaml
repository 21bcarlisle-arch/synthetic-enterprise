  and all 1,291 accounts now flag, because no typed opening read exists in the record. 4a4a5a092 traced the 493-household
  overdue breach to one cause: the collections desk is posted true-kWh revenue before VAT, not the bill the supplier issued.
  That is the two-homes shape again, and it means the desk has been chasing a number no customer was ever sent. Its fix is
  landing now (pid 2037148), and only a fresh run graded against a pre-registration can show the breach count fall. Leg three
  has not moved: the second cold read''s new classes are still not rows, and item 3 of the last focus was not drawn for a
  second stretch. The executors took continuations ahead of it, so that steer is drifting. It moves up to item 2, with this
  stretch''s new estimate-versus-meter class added. Against the thesis, the company is still being made to bill and chase
  correctly. That is the precondition for any per-customer-against-flat comparison, and that comparison stays held. The commit
  split reads 0 supplier, 0 world and 11 other, but by content four of the five substantive commits are supplier billing and
  page correctness (4a4a5a092, 049377466, f899c7ccd, d70e32cd5), and one is the director''s Monday note (d3ff2c1f5). Two machine
  facts. The seat executor is now running the continuation the-second-arm-starts-from-the-drawn-roster on d70e32cd5, though
  af61df576 already landed that fix without naming the id. That is the one unbuildable leg of an already-retired class, so
  the tick should find it spent, and I record it here rather than reopen the class. The shared checkout is 70 commits behind
  origin, and every daemon runs code origin has moved past.'
