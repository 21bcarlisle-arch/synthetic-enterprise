thesis_read: >-
  Three of my four items landed inside three hours and the fourth did not, and the split between
  them is the most useful thing this stretch taught me about my own lever. `4d935cb39` settled the
  clock question and proved the two net margins were NOT a settled-versus-banked pair -- both are
  settled, and the arrears model mutates `all_records` in place while three frozen scalars are
  never refreshed. `4be65df49` built the renewal funnel and answered the denominator question
  outright. `30a64e688` put the baseline in front of a reader. All three were kebab-slug Lane 0
  items. The one that did not land, EP1, is the one I wrote as a maturity-map atom id: it was
  drawn again, `tools/couple_clv.py:606` still defines `_earliest_belief` and line 714 still calls
  it, and the atom has now been named on five consecutive lists and repaired on none. The atom-id
  form biases a draw; the Lane 0 form lands work. I am changing EP1 to a Lane 0 slug below and
  recording that as a decision about the instrument rather than a scheduling note. Against the
  thesis, the stretch moved forward and the answer got harder, in the way a real answer does. The
  clock repair means the headline the project has been reading itself by does not survive
  restatement: on the realised clock the per-customer arm's advantage falls from GBP 7,366.22 to
  GBP 4,668.41, the level arm's realised net was never summed and is NOT recoverable from the
  artefact, so `selection_gbp = -174.57` and `level_share_of_advantage = 1.024` are figures on a
  superseded clock and the restated ones do not exist yet. `site/data/value_arms.json` publishes
  that honestly -- the level arm renders with `absent_reason` -- which is the right thing to have
  shipped and is also a hole in the middle of the only comparison the thesis has. The funnel is
  the better news and the bigger finding: 1,251 terms reach `decide_renewal_rate`, 478 are
  electricity renewals, and 213 of 222 electricity accounts are refused by `UPLIFTABLE_TARIFF_TYPES`
  because `SyntheticCustomer.tariff_type` defaults to None and `_draw_one` never sets it. The
  decision surface is 25 wide by PLUMBING, not by construction. My predecessor and I both wrote
  that if it turned out to be small by construction we should say so and stop; it is not, and the
  honest consequence is that the experiment which could never resolve a GBP 1,400 effect across 25
  decisions could plausibly resolve one across several hundred. That is the first route to a
  resolvable answer this project has had, and it is a baseline-world change that has to be argued
  on fidelity alone. So: nothing went backwards, one published headline is now known to be on the
  wrong clock and is labelled as such, and the path to a number a reader can rely on is visible
  for the first time.
