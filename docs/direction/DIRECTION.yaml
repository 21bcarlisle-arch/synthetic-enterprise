thesis_read: >-
  This stretch moved the thesis question in substance, though not yet in money. The per-customer
  supplier still loses GBP 1.35 per household-year against its flat-rules baseline on A's better
  belief. But for the first time we know why, with a reason the evidence supports and a test that can
  refute it. Section 12 of docs/design/THE_VALUE_TEST_REDESIGN.md was pre-registered before the read
  (da4cb352e) and read after it (9dd2b365a). The loss is not the value arm's pricing: price moved an
  outcome for one household in 101. Ten of the 101 flipped at an identical roll and an identical
  common-fuel price, and the sign test across all three arms runs 20 to 1 against A (p about 2e-5),
  so it is not the dice. The best-supported mechanism is the retention offer. The twin's backwards
  belief (AUC 0.36) made offers by accident to households that were leaving and worth keeping. A's
  better ranking calls those households safe and withdraws the offers, and on the value arm those
  households are the most valuable ones (GBP 570 to 3,900 each). That is still an inference, because
  the sidecars did not log the offer. f318f1e48 now logs it, and 1ce0f6549 pre-registers and arms a
  re-read of the same pair. For the thesis this is the useful kind of setback. Better inference was
  spent by a lever, the offer gate, that values a kept household at the flat book's margin, not at
  what the value arm earns from it. The fix is a lever change, and the objective does not need to
  move. It also means the advantage cannot show until the levers are in merit order, which is the
  director's own priority order. The commit split reads 0 supplier and 22 other. That is the
  classifier's reading: the four value-test commits are supplier work on tools/ and docs/, and the
  stretch was more supplier-heavy than any this week. 7 of 22 commits were substantive and 6 were
  merges carrying nothing. The steer bit: last record's first item was drawn and finished, so it
  leaves focus. Its other three items went undrawn in 3h. Two are harness items, and the D5 book item
  is waiting on the box anyway. The D5 book has still not run. d5book-pause-watch last logged at
  11:00Z, waiting for pair 33333_44444, which step 6 is in now (seed 44444, run 2 of 3). 95ed31f26
  corrected its expected time from 18:30Z to about 20:00Z. The publisher stands at 48 failures over
  34.7h on the 16 Nov book. 623b28e72 stops the regrade unless an input changed, and the background
  worker restarted at 15:14Z and is re-processing that marker now, so the first post-fix cycle is the
  one to read. Corrections this stretch: e0e8a32df took C2 from L2 to L1, because the caller and
  consumer its level rested on were archived on 8 Nov. 95ed31f26 corrected the D5 book time. Section
  12a corrected its own bucket label beside the claim. All three are listed below as corrected. None
  of the eleven carried rows is corrected. The value-arm row now has a cause, but no fix. The director
  sent one advisor steer (contact cause, failure demand, quiet fails). His words are "log as an idea
  or backlog", so it is focus 1: a short logging task, not a build.
