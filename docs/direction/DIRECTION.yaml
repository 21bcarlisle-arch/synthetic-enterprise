thesis_read: >-
  The thesis has not moved this stretch, and the director has just told us the page cannot tell him whether it has. 9 commits,
  4 substantive, split 0 supplier, 1 world, 8 other. The classifier reads site/ and docs/ as other, but in substance the work
  was bill correctness: N30 (the world reads a dual-fuel home's two meters on one occasion, b3ff041f0, with its pre-registration
  24f440748), N31 (a catch-up bill's VAT line is now the VAT on the lines above it, 1296868e4), and the SME catch-up's VAT
  printed per part and then per rate (c158fe03c, e62ab3aaa). N31 is finished and leaves focus. The refund clock has a third
  landing in flight (surgical_land pid 3584048, 40 minutes into its gate), and the per-rate VAT lines have a fourth
  (pid 3668853). Neither is on origin yet. The ops-mirror item was the one previous focus item NOT drawn: the ops repo is now
  ahead 438, behind 1 of its origin, so the mirror has been off-box-dead for about 57 hours. The steer itself is drifting there,
  so it keeps its place. The real news is the director's 06:11 and 06:13 messages. He read the live Capabilities page and could
  not tell whether bespoke value optimisation works. He is right on all three counts, and they are failures of ours. (1) The
  headline answers the thesis question from the 8 Oct run, on code five weeks old, with a verdict withheld. (2) It quotes book
  totals ("+GBP 4,722 to +GBP 7,846") that are about GBP 5 per household per year on about 120 households. (3) It says
  "Fixed in the 7 days to 11 Nov: Nothing recorded" after the week fixed dozens of money classes. I read the cause of (3): the
  strip is built by tools/generate_capabilities_door.fixed_this_week from docs/design/capabilities_fixed_this_week.json, a
  hand-kept record last written 24 Oct, so the reader is right and its source is one nothing writes to. Against the thesis
  this is the honest position. We have no current evidence either way that per-customer decisions beat the flat baseline.
  The only three-arm run is 8 Oct. Its belief's AUC against control outcomes is 0.52, no better than chance. The live renewal
  belief still ranks leavers backwards (0.333). A margin gain from a belief that cannot tell who leaves is not evidence for
  INFERENCE. So the page must say "we cannot tell yet, and why", and the redesigned value test he approved on 2 Nov is the
  first feature next week. Its proposal, with the predictions filed before any arm runs, is owed to Sunday's balance review.
  Usage is 62% at Friday 06:00 with about 3-4 points spare at 0.50 an hour, so I hold the pace and accelerate nothing
  (advisor reading). Both advisor files are actioned by focus items 1 and 2, and each moves its file to done/.
