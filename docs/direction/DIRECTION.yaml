focus:
  - id: land-the-account-population-repair-so-the-published-solvency-figure-is-on-a-named-basis
    what: >-
      Land the finished account-population work as ONE commit by pathspec, then republish. The set is
      `saas/capital/solvency.py`, `company/risk/counterparty_collateral_desk.py`,
      `saas/reporting/annual_report.py`, `tools/run_value_cycle_ab.py`,
      `tools/generate_book_growth_data.py`, the untracked
      `tests/company/risk/test_mcr_account_population.py` and the untracked
      `docs/design/ACCOUNT_POPULATION_CENSUS_2026-08-29.md`, plus the §4a correction already written
      into `docs/staging/WORKER_FINDING_R6_JOINS_ACQUISITION_SPEND_TO_COLLATERAL_...2026-08-28.md`.
      **Diff every hunk before you add its path** — this tree carries 242 changed paths and several
      lanes; anything in those files that is not the census work is held back and named in the
      message, not swept in. The new test module needs a REUSE block from
      `tools/write_time_gate.py --explain`. Verify against the tree the commit would create, through
      `python3 -m tools.surgical_land`, never against the shared working tree. **Then republish**, so
      the site's free equity reads on the 120-account domestic-on-supply basis with its population
      named beside it, and `docs/design/NET_FALL_ATTRIBUTION_2026-08-29.md` §3.4 — which correctly
      refuses to quote £315,761.47 while its selector is uncommitted — can be updated to say the
      selector landed. **One ordering constraint that is not optional:** the arms re-run is executing
      the working-tree copy of `tools/run_value_cycle_ab.py` right now, so its artefact will carry
      `book.what_each_count_selects` from a file HEAD does not contain. Land before that artefact is
      published, or this is the third time in a week that a published figure is generated by code in
      no commit.
    why: >-
      It is a published solvency number that is wrong by £12,480 and the repair is already written,
      already controlled and already argued — the only thing between the live page and a correct
      figure is a commit. It is first over everything else because it is the one item where the
      analysis is finished and the value is entirely in the landing, which is exactly the failure
      this stretch exposed. The census also settles the question the last direction asked: six
      populations, each with a named selection, and the wall question answered out loud — a real
      supplier's finance function can count its own domestic accounts on supply off its own
      settlement record, and it consults nothing the world knows. **Done means:** the selector, the
      twelve controls and the census document are in one commit or the exclusions are named with
      reasons; the published free-equity figure and `accounts_held` are on the named basis with the
      population beside them; and the reconciliation control — published `free_equity_gbp` against
      published `accounts_held` satisfying the identity that produced them — is in that commit,
      because that is the one control keyed to the property rather than to today's answer, and it is
      what makes this repair survive the next restatement of either side.
