thesis_read: >-
  Three hours, six commits, two substantive, and both of the substantive ones are measurements that
  came back NO -- which is the best thing that happened, and it still leaves the thesis further away
  than the headline says. The important one is item two, which landed in full and can leave this
  file: the realised A/B comparison CANNOT separate "the company inferred well" from "the world does
  not punish price". Effective n is 4, not 42 -- 18 of the 42 priced renewals are unpunishable at any
  multiplier because the world rolled no decision for them, and the roster diff is 3 in, 1 out. It
  also found WHY the two sides disagree without either lying: the company keys churn on a DELTA
  against its own prior rate, the world keys on a LEVEL against SVT, so cheap-to-average reads as a
  big rise and lands at parity while dear-and-flat reads as flat and lands +30% vs SVT. That is the
  observed inversion on both tails, and it means the +GBP 16,773 headline is neither refuted nor
  confirmed -- the instrument that was supposed to attribute it is under-powered by construction, and
  no number of re-runs fixes that. EP13 also produced real science and also came back negative:
  pinning biomass to its metered outturn -- perfect knowledge, deliberately unpublishable, structurally
  proven unable to reach the feed -- moves correlation the WRONG way in four years of six, mean
  -0.0050, so the outage model is retired as the next gap and the reason generalises (70-86% of that
  fleet's variance is between days, and within-day is the axis holding the level). But it is not what
  I asked EP13 for. There is still no `tools/couple_carbon_intensity.py` among the fifteen
  `couple_*.py`, still no EP13 row among the sixteen in `coupled_gap_ledger.json`, the map still
  records level 2 on nothing measured, and the atom's raw block now measures 11,953 B against the
  12,288 B per-atom cap -- 335 B of headroom, and the commit that landed it says plainly that the
  next pass on it wedges every lane. Of the other two items: EP1 was named FIRST, with the diagnosis
  settled and told not to re-derive it, was drawn, and
  `saas/churn_model.py::churn_probability` is byte-identical -- still
  `min(BASE_ANNUAL_CHURN_PROBABILITY + bill_shock_count * CHURN_UPLIFT_PER_BILL_SHOCK,
  MAX_CHURN_PROBABILITY)`, the ledger still stamped 2026-08-26T11:46:22Z with `distinct_hazards: 1`,
  `hazard_histogram {"0.05": 33}` and a believed tenure of 20.0 years for all 33 graded accounts.
  Third naming, second stretch drawn-and-unchanged. And `python3 -m tools.run_value_cycle_ab` was not
  run for the third stretch running: the newest artefact is still 17:09:29Z, and none of the four
  `value_cycle_ab*.json` on the tree contains `gross_to_net_bridge`, `bound_attribution` or
  `cross_section_reconciliation`. I have to add one thing about my own instrument, because it changes
  how much of this brief I trusted. The brief handed me `steered: true` and "the previous direction
  named work the draw then took". That signal is a constant. `direction.focus_was_drawn` reads
  `.atom_stall_tracker.json`, which is keyed by maturity-map atom id, so a Lane 0 slug can never
  appear in it -- and the two ids carrying the PASS were EP1, which did not move, and EP13, which
  moved sideways, while the one item that landed completely was a Lane 0 slug the control cannot
  represent at all. My own feedback loop credited the two failures and was blind to the success. I
  read the commits instead and will keep doing that. Against the thesis: the advantage is still
  unattributed, and this stretch's honest contribution is proving that the measurement everyone was
  waiting on cannot attribute it at this sample. That is not backwards. It is the most useful
  negative result the project has produced, and it names its own successor -- a price ladder --
  which is why that is now second on this list and why the arm stays off the renewal desk.
