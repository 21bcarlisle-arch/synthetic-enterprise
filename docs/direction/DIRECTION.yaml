focus:
  - id: publish-gate-wedge-is-the-wedge-alarm-itself
    what: >-
      Repair `supervisor._publish_gate_wedge_active` and its adapter
      `background.stall_class_register.detect_publish_gate_wedge` so that
      `tests/background/test_stall_class_register.py::test_wedge_adapter_fires_past_the_directors_one_hour_bar`
      is green AND the live `docs/observability/.publish_gate_state.json` -- 57 episode failures,
      `wedge_since` 80.7h old, ONE failure inside the hour -- returns a rung-1 message instead of
      None. The screen is what is wrong, not the fixture: decide the predicate on whether the gate
      has PASSED, which is the independence cross-check already in that function, rather than on
      how recently it last failed. Then let the publisher drain the three queued runs.
    why: >-
      Publishing has been dark 80.7 hours and this single red is the whole citation
      (`citation_at_head: reproduces`, `total_red: 1`). It is priority zero by the director's own
      UNWEDGE_PUBLISH_PRIORITY_ZERO ruling, and it is worse than an ordinary wedge because the
      detector that would have drawn the unwedge work is the very thing broken -- an alarm reading
      healthy for 80 hours about an outage it is pointed at. Finished when the publisher records a
      clean publish, `episode_failures` resets, and a state file shaped like today's live one
      produces an event.
  - id: value-arms-18-seed-result
    what: >-
      Take the in-flight `longjob-floor18-head-rosters-20260925` run
      (`/var/tmp/se-floor18-head-20260925/shards/`, six legs of three seeds), fold it against the
      served family, and write the result beside EACH of the five predictions in
      `docs/staging/records/SEAT_PREREG_THE_EIGHTEEN_SEED_RE_RUN_AT_HEAD_REPRODUCES_THE_SERVED_RESIDUALS_2026-09-25.md`,
      including any the run refutes. If `shards/agreement_fold_rc.txt` is 0, replace the served
      noise-floor family so `draws_the_spread_is_entitled_to` is an exact count on `/capabilities/`
      rather than a bound, which changes `site/data/value_arms.json` and
      `tools/generate_value_arms_data.py`. The prereg reads identical to HEAD because the RESULT has
      not been written yet -- this ask is un-started, not spent.
    why: >-
      This is the thesis's own evidence and not decoration: a baseline to beat is worth reading
      only if the spread carries the bound its sample size earns. A fold REFUSAL is not a nuisance
      to route around -- it would mean code between 2026-09-10 and HEAD moved a published figure,
      and that is a larger finding than the count it was chasing. Finished when the result note
      sits beside the prereg whatever it says, and the page carries either the exact count or a
      named reason it cannot.
  - id: bill-stress-hazard-from-the-arrears-ledger
    what: >-
      Retire `company/crm/churn_model.BILL_STRESS_THRESHOLD_GBP = 3000.0` against a per-household
      hazard read from `company/billing/arrears_engine.py` -- the ageing/arrears STATE the
      knowledge map records as the one positively established association -- and do not re-pick
      the number for another one. `company/crm/churn_model.py` reads identical to HEAD because
      nobody has started this, not because it is spent; the change set is that module, its tests,
      and `tools/churn_belief_size_response.py`, which reads both constants.
    why: >-
      The refutation is already on file and nothing has acted on it: Ofgem/BMG (n=3,235) puts the
      correlation between a household's spend and its switching propensity at -0.07 to +0.05, so a
      bill-level knee asserts the strongest available form of a dependence that is approximately
      absent, and DESNZ QEP 2.7.1 runs the other way (15.57% to 3.06% while every bill rose). The
      knowledge map names the replacement -- a company observable, per customer, inside the
      epistemic wall -- and that sentence IS the thesis: advantage from inference on what we can
      actually see. Finished when no production caller reaches the refuted level and the stress
      term varies per household with the arrears state. The EVENT amplitude stays a declared gap
      and must not be closed by picking a number to lift the refusal.
  - id: H41_the_map_ratchet_has_no_ongoing_drain
    what: >-
      Build the ongoing drain for `docs/design/maturity_map.yaml`: rehome growing per-row fields to
      `docs/design/simplifications/<atom_id>.yaml`, pool the shared reasoning behind a family of
      rows into `MATURITY_MAP.md` section 8a once, and key whatever control you add to the PROPERTY
      -- bytes reclaimed per stretch against bytes added -- never to today's byte count, which is
      the failure this project keeps repeating.
    why: >-
      `python3 -m tools.maturity_map_store` prints 5,844 bytes of headroom, 3,796 to the per-atom
      reserve, and the map's own history says the median commit touching it adds ~695 -- about five
      level moves from a line that reds `tests/design/` in EVERY lane and names a file the author
      never touched. I named this last stretch, ranked it third, and the draw never reached it, so
      the steer itself is now the drifting thing. Finished when the headroom line has moved UP
      across a stretch with the ceiling untouched.
