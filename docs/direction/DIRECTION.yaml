focus:
  - id: put-the-arms-baseline-on-one-clock-and-refuse-a-headline-inside-its-own-floor
    what: >-
      Both legs of `arms-rerun-20260829.service` are FINISHED and on disk:
      `docs/observability/value_cycle_ab_s1_three_arm_20260829.json` (`generated_at`
      2026-08-29T14:40:24Z) and `docs/observability/value_cycle_ab_s1_noise_floor_20260829.json`
      (2026-08-29T17:04:23Z, three seeds, `selection_gbp` mean −£1,614.30, stdev £2,577.80). Both
      were produced by ONE process from ONE snapshot of the tree, and
      `git diff HEAD -- tools/run_value_cycle_ab.py` is empty, so the producer is in a commit —
      confirm both of those yourself before you publish anything. **Read
      `tools/generate_value_arms_data.py:98-99` before you plan the work:** `THREE_ARM_PATH` and
      `NOISE_FLOOR_PATH` are undated constants pointing at the TRACKED 2026-08-27/28 pair, which is
      why a dated re-run artefact reaches no reader. Promote the new pair onto those two paths (or
      make the paths an argument and pass them — your call, but say which you did and why), so the
      page's two inputs are the same book on the same day. Then regenerate `site/data/value_arms.json`
      and land the artefacts, the generator change and the regenerated feed in ONE commit by
      pathspec, verified through `python3 -m tools.surgical_land`, never against this shared tree.
      **The substantive change, and it is not the regeneration:** the headline composer currently
      asserts a direction unconditionally. It must not. When a contrast's magnitude is inside the
      floor's own spread, the composed headline may state the size and the bound and must state that
      the comparison cannot resolve its sign on a book this size, and must name what would resolve it
      (a larger settled book — focus item three). All four current contrasts are inside it, so the
      page will say "we cannot tell", and that sentence goes on the surface, not in a footnote.
      Write the old headline's exact words into the record beside the new one, not over them —
      *"the per-customer choosing is worth less than nothing"* is the sentence being withdrawn and it
      should be readable next to why. `staleness_caveat` and `clock_caveat` are emptied by the run,
      not by the generator: if either is still non-empty after regeneration, that is a finding about
      the caveat's own derivation, not a licence to blank it.
    why: >-
      This is the director's own condition — "there has to be a BASELINE to beat, or 'it performed
      well' means nothing" — and the live page currently answers it with a sign that flips with a
      seed draw. It is first because it is the only item where a wrong claim is in front of a reader
      right now, both measurements it needs already exist, and the fix is under two hours. **Done
      means:** the fetched live page states the contrast with its bound and makes no directional
      claim about per-customer choosing; the arms feed's two inputs carry the same date; the two new
      artefacts are tracked; and there is ONE mutation-proven control keyed to the property, not to
      today's answer — feed the composer a contrast INSIDE the spread and the directional sentence
      must be absent, feed it one OUTSIDE and the directional sentence must come back. A control
      that merely pins today's "we cannot tell" string goes red when the book grows enough to earn a
      sign, which is exactly backwards and is the failure this project keeps repeating.
  - id: adjudicate-the-22788-pre-2021-loss-and-separate-it-from-r6s-first-signal
    what: >-
      Carried from the last direction, where it was named and never drawn. Run the one-variable run
      at `248a6368e^` that `docs/design/NET_FALL_ATTRIBUTION_2026-08-29.md` §2.6 owes and §3.3
      depends on. Launch it with `systemd-run --user --unit=<name>` — a ~2h job, and
      `worker-tick.service` is `KillMode=control-group`, so `setsid` cannot save it and has already
      failed three times; the 2026-08-29 arms re-run proves the `systemd-run` form survives. Do NOT
      start it while another long run is in flight — the ceiling probe peaked at 7,323 MB and this
      box OOMs; wait on the other process with `tools/wait_for.py --pid`. Write the prediction down
      before the run, and **there is now a named candidate mechanism to predict against, which there
      was not last time**: `WORKER_FINDING_THE_CEILING_SPENT_THE_WHOLE_BUDGET_ON_ITS_MOST_EXPENSIVE_COHORT_2026-08-29`
      establishes that a 2016 win costs 9.83 customer-years and a 2025 win 0.78, and that the old
      first-come spend bought 2016's accounts before anything else. A uniform-share allocation
      therefore buys fewer early-year accounts BY CONSTRUCTION, which would make the 37 missing 2016
      accounts and the £22,788 a designed consequence rather than a regression. Predict it, then let
      the run refute it. Two questions, one measurement: is the pre-2021 loss a fidelity repair or a
      regression; and does the R6 co-movement — headroom −£34,385 against realised acquisition spend
      +£14,396, a fall 2.4× the spend rise — survive as an attributed mechanism, or is it the book
      changing and the balance sheet following? Also read
      `WORKER_FINDING_THE_CEILING_PROBE_READ_THE_PRODUCERS_BOOK_BACK_AS_ITS_OWN_RESULT_2026-08-29`
      first: the probe path mirrored the live producer's book back as its own result, so this run
      must write its own artefact and must not be graded off `settlement_ceiling_probe.json`.
    why: >-
      A £22,788 loss in years the campaign cannot touch has been sitting under every published net
      figure since 07:26Z and nobody has said whether it is the world getting more honest or the
      company getting quietly worse — that is the difference between value created and value lost,
      which is the mission's first sentence. And until this runs, the project's only evidence that
      growth has a balance-sheet cost is a co-movement with the right sign wearing a mechanism's
      clothes. It is second rather than first only because item one has a wrong sentence in front of
      a reader and this one does not. **Done means:** the word "repair" or the word "regression",
      with the run at `248a6368e^` printed beside the prediction that preceded it, and either an
      attributed R6 mechanism or an explicit statement that these two channels cannot be separated by
      this run plus what would separate them. A refusal that names what could not be isolated is a
      permitted result; a plug is not, and nothing may be tuned to make the collateral mechanism
      fire.
  - id: rerun-the-arms-on-a-complete-win-population-so-the-comparison-can-resolve-its-own-question
    what: >-
      The one-variable run that the last section of
      `docs/staging/WORKER_PREREGISTRATION_WHAT_THE_SOURCED_COST_RERUN_MUST_SHOW_2026-08-28.md`
      files as the work it owes: the three-arm pass plus its noise floor, in one process, with
      `SETTLEMENT_CUSTOMER_YEAR_BUDGET` in `simulation/net_new_acquisition.py` lifted far enough that
      the win population is COMPLETE — everything else held, same seeds, same world. Launch via
      `systemd-run --user --unit=`, after item two's run has exited, and write the prediction first.
      **This is an experiment on the measuring instrument, not a change to the published ceiling.**
      The lift lives in the run's own configuration and does not land as a new constant: the
      director's standing note is that the ceiling's time argument is circular — the publish cadence
      is defined as a measurement of how often runs arrive — and that it needs a non-circular basis
      rather than a bigger number. Nothing here supplies that basis and nothing here may be read as
      supplying it. What this run answers is narrower and is the question item one's page will be
      pointing at: does the value−control contrast come out of the noise floor when the arms score
      the whole win population instead of a uniform 17.89% sample of it, or is it inside the spread
      at any book this machine can produce?
    why: >-
      Item one will publish "we cannot tell" and name a bigger book as what would resolve it; this is
      the run that tests whether that is true, and if it is not, the honest reading is that the arm
      comparison is not the right instrument for the director's question and we need a different one.
      It also touches his own named top item — the settlement engine booking zero of every year's
      wins — from the measurement side rather than the constant side, which is the side that is
      allowed to move without a fidelity argument. It is third because it is gated on item two's
      process exiting and because item one's page is honest either way. **Done means:** an artefact
      whose `book` block shows the complete win population, a prediction graded beside it rather than
      over it, and a plain statement of whether the contrast is resolvable at that book size — with
      the published page updated if and only if the answer changes what the page can honestly say.
  - id: land-the-founder-book-discharge-that-says-it-already-landed
    what: >-
      Third direction, unchanged, still uncommitted, still not drawn. `docs/design/held/README.md` in
      the working tree asserts "DISCHARGED 2026-08-28 — Landed in HEAD" while the three `.held`
      artefacts it describes are deleted-but-uncommitted (`FOUNDER_BOOK.yaml.held`,
      `founder_book_live_population.patch`, `test_founder_book.py.held`); `docs/design/FOUNDER_BOOK.yaml`
      is modified; and `tests/simulation/test_founder_book.py`, `tests/simulation/test_live_population_seam.py`
      and `tests/simulation/test_customer_events.py` are all uncommitted while
      `simulation/live_population.py` IS in HEAD at `3d83edffb`. Verify each of the three test files
      green against the tree the commit WOULD create — not against this shared tree, which measures
      three other lanes — land the set as one commit by pathspec including the three deletions, and
      if any file does not belong to the landed code say which and hold exactly that file rather than
      the set.
    why: >-
      Landed code whose controls are in no commit has no control at all from any other checkout, and
      a working-tree file asserting the work is committed is self-refuting. Thirty minutes,
      mechanical, and the item a tick picks up when something above it finishes early. **The
      trip-wire, because listing the same instruction a third time and expecting a different draw is
      itself a defect:** if this is still here at the next orientation it stops being a focus item and
      becomes a finding about uncommitted controls for code that is in HEAD, filed as a class with a
      gate against the property, because at that point three directions of correct prose have failed
      and the prose is not the thing that is broken.
