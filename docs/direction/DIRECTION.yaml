  what: 'Your 12 Oct ruling (build the world''s response to a bill shock, DD4b, before grading the payment-plan
    engine) cannot be met as it stands: DD4b needs how much a large direct debit increase raises the odds a household
    shops, and no published source gives that figure (searched 29 Sep; docs/market_research/does_a_bill_shock_event_raise_the_odds_a_household_shops.md).
    So the engine''s shock-avoidance has been ungraded for five weeks and nothing schedules it.'
  proposal: 'Build DD4b with that amplitude as a stated range, not a single number: from zero (a bill shock changes
    nothing) up to a stated ceiling. Then grade the plan''s shock-avoidance at each end of the range, the same way
    your ruling 2 already treats customer take-up. Publish the result as the range, beside a GAP note saying the
    amplitude is unsourced.'
  recommendation: I recommend building DD4b on a stated range that starts at zero and grading at both ends. K2 says
    leaving the response out asserts zero, which is the one value we know is wrong. A range that starts at zero
    errs against our own thesis (F11), and your take-up ruling already set the pattern. Waiting for a sourced figure
    leaves the engine grade parked behind PB4 with no date.
