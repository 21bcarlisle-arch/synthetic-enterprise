  the standing-charge credit is in the code (ec7fd9942), and the honest within-segment test still reads ''cannot
  tell'' in two of three years. The previous focus named 3 items and 1 was drawn. The other two (the book-size question
  and the three-arm run) were not drawn. That is not yet drift, because the stretch lasted 2.9h and the one executor
  slot was spent on item 1 and D48. They stay as items 1 and 2, with the cheap read-only measurement first, because
