      caveat strings empty on the fetched live page.
  - id: adjudicate-the-22788-pre-2021-loss-and-separate-it-from-r6s-first-signal
    what: >-
      Run the one-variable run at `248a6368e^` that `NET_FALL_ATTRIBUTION_2026-08-29.md` §2.6
      explicitly owes and §3.3 depends on. Launch it with
      `systemd-run --user --unit=<name>` — it is a ~2-hour job and `worker-tick.service` is
      `KillMode=control-group`, so `setsid` will not save it and has already failed three times.
      Write the prediction down before the run. Two questions, one measurement: is the pre-2021 book
      losing £22,788 of net and 37 active 2016 accounts, on acquisition wins that are **identical**
      in both runs, a fidelity repair or a regression in the budget-allocation change? And does the
      R6 co-movement — distance to the first collateral demand −£34,385 against realised acquisition
      spend +£14,396, a fall 2.4× the spend rise — survive as an attributed mechanism, or is it the
      book changing and the balance sheet following? A refusal that names what could not be isolated
      is a permitted result; a plug is not, and nothing may be tuned to make the collateral mechanism
      fire.
    why: >-
      The static-closure argument already did the cheap half and did it well — `248a6368e` is the
      only commit in the range that touches run-reached code — but reachability is not attribution,
      and the document says so itself. Until this runs, the project's first evidence that growth has
      a balance-sheet cost is a co-movement with the right sign wearing a mechanism's clothes, and
      the director's sentence was about spend weakening the balance sheet through a book that
      reaches. Equally, a £22,788 loss in years the campaign cannot touch is sitting under every net
      figure published since 07:26Z and nobody has said whether it is the world getting more honest
      or the company getting quietly worse. **Done means:** the word "repair" or the word
      "regression", with the run at `248a6368e^` printed beside it, and either an attributed R6
      mechanism or an explicit statement that the two channels cannot be separated by this run and
      what would separate them.
  - id: land-the-founder-book-discharge-that-says-it-already-landed
    what: >-
      Unchanged from the last direction, named there, drawn there, and still entirely uncommitted two
      days on. `docs/design/held/README.md` in the working tree says "DISCHARGED 2026-08-28 — Landed
      in HEAD" while the three `.held` artefacts it describes are deleted and none of it is committed;
      `docs/design/FOUNDER_BOOK.yaml` is modified and `tests/simulation/test_founder_book.py`,
      `tests/simulation/test_live_population_seam.py` and `tests/simulation/test_customer_events.py`
      are all uncommitted, while `simulation/live_population.py` IS in HEAD at `3d83edffb`. Verify
      each of the three test files green against the tree the commit would create, land the set as
      one commit by pathspec, and if any file does not belong to the landed code say which and hold
      exactly that file rather than the set.
    why: >-
      Landed code whose controls are in no commit has no control at all from any other checkout, and
      a working-tree file asserting that the work is committed is self-refuting. It is fourth because
      it is thirty minutes and mechanical — the item a tick picks up when something above it lands
      early — but the fact that it is here for a second direction running is itself the measurement
      this orientation is about. **Done means it disappears from this file**, and if it is still here
      next time the thing to fix is not the item.
