not_now:
  - what: Killing d5-land8 now and relaunching it after the gate-hour fix lands, so that the two gates do not compete.
    why: >-
      It is eight minutes into a gate that may still pass. Killing it guarantees at least an hour's
      delay, and letting it run risks the same hour. With the fix not yet on origin, a relaunch gains
      nothing until the fix lands, so the cheaper bet is to let it run and relaunch once only if it is refused.
  - what: Recording a dated exception for publish rows 4 and 7 so that a book publishes tonight.
    why: >-
      The rows are a real billing defect (leavers dunned for a debit no bill asked for), and the fix's
      page half is in its gate. An exception would publish a page known to be wrong in order to save
      hours.
  - what: Launching B11 M7 or step 6 now.
    why: Both are designed from A's grade, and the box is held by two gates. Launching before the grade is read could spend about 64h of box time on a design the grade changes.
  - what: Landing W3_3 (settlement books the standing charge) from origin/w3-3-network-split-held.
    why: >-
      One change per book. If W3_3 were stacked on D5, a moved row could not be attributed to either
      change. W3_3 follows the first D5-fixed publish.
  - what: The thirteenth cold read and the Capabilities-strip check on f4f825b8b.
    why: Both need a verified published book, and none can publish before D5 is switched on.
  - what: The n29 close set-off, the level-return print fix and the LEVEL_DD W1/W4 grade as focus items.
    why: >-
      Each is already a queued continuation with an owner, and the W1/W4 grade needs a book that
      cannot exist before D5. Putting them in focus would add a second route to work that the
      throughput-bound box cannot reach any sooner.
  - what: The canon-drift BLOCKING finding (WORKER_FINDING_THE_CANON_DRIFTS_FROM_THE_CODE_0A2E477ACB).
    why: It refuses no book and touches no supplier result. The ordinary draw can take it.
  - what: Reverting the sonnet executor arm, which the pilot calls REVERT (landed 0.64 against 0.80, rework 0.53 against 0.39).
    why: >-
      The verdict is already computed and belongs to the Monday ranking that owns the pilot. Nothing in
      this stretch's stall came from the executor arm. The stall was the gate hour.
  - what: Reaping the at-risk October worktrees (b12-*, se-budgetpay-land, se-om2, simsuite).
    why: They block no supplier result, and reaping cannot be undone.
