      send it to him on NTFY as one message. Do NOT decide it: book age moves the P&L, which makes
      it curriculum and his. If item 3 has already re-run the probe, take the slope from that rather
      than from the stale artefact, and say which you used.
    why: >-
      He asked for exactly this and it is the only one of the canon's five work-items still open —
      the re-rank, the R1/R2 sequencing, the EP7–EP14 unblock and the ceiling-before-programme
