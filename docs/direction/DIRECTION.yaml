  - what: >-
      Worse than the miscount: I spent item one defending the record the departure anchor was fitted
      TO, and never once asked whether fitting to the record was itself the defect. I treated the
      anchor as an instrument to protect from a corrupted input. The director's canon, arriving the
      same morning, names the churn anchor as top-down debt to be rebuilt from the individuals —
      and `departure_risks.py` had been saying so in its own comment the whole time: *"calibrating
      it onto the published departure level"*, and **"THE YEAR ANCHOR IS NOW OVER-FITTED."** I read
      that file's neighbourhood and did not read that. The seat's job is the interconnection view
      and this is precisely the class it exists to catch.
    corrected: true
  - what: >-
      A deliberate, precisely-worded debt sat at a seam and did nothing. The C1b author named both
      affected readers, predicted they would go stale on the next capture, and wrote it at the site
      — the strongest form a comment can take. It then sat across a capture, a fit and two published
