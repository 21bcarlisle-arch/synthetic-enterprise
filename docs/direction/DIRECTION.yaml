thesis_read: >-
  **The first whole-book fit in this repository's history emitted this stretch, and it is not
  reproducible.** That is the whole reading and both halves are load-bearing. The native SVT capture
  — named in focus for three consecutive orientations and relaunched zero times — ran to completion
  at 17:42 UTC (`EXIT_RC=0`, 156 renewal rows, 1,373 SVT segment decisions), all five predictions in
  its pre-registration were graded as filed with two SPLIT and one clause REFUTED kept rather than
  revised, and **P4 confirmed the whole-book fit**. Against the thesis — *"there has to be a BASELINE
  to beat, or 'it performed well' means nothing"* — that is the first movement on the binding
  blocker in weeks. Then the clean-tree re-run at `7cb667126` **refuted four of its own five
  predictions** and wrote a **2-byte, empty** SVT sibling, so the fit that emitted has no producer in
  git; and `9a03f3b44` established that the two runs' own `PROVENANCE.txt` files declare **three
  differing modules**, not one, with **2022's level anchor doubled between them** (3.053619 against
  1.524110) because the working tree's uncommitted block was missing 2022 and the fallback silently
  supplied the reference year's. So the honest position is: the anchor moved from *cannot be fitted
  at all* to *fitted once, unreproducibly, on an input now known to be wrong at the one year the
  expensive prediction was about.* **Forward, genuinely, and not as far as the commit subjects
  read.** Two things were then repaired and both matter: `8bf416115` wired `rolls_active_renewal`
  into `build_renewal_schedule` (the assignment both pre-registrations called their binding owed
  item), and `9fd700366` made the fallback refuse inside the published record instead of borrowing
  2024's value. **Both landed after both captures were taken, so neither capture has been run against
  the repaired world — the re-run is now cheap, unblocked and unowned.** The sharper half of this
  reading is what nothing was watching: `tests/architecture/test_switching_rate_commons.py` holds
  `YEAR_LEVEL_ANCHOR` *"indirectly, through its EFFECT"*, and **that band check is red at clean HEAD**
  with the assertion *"only 7 years had their margins checked — a control over an emptied subject
  reports a constant PASS"*. The single indirection the register relies on to hold this quantity
  accountable has not been holding it, which is how a silent 1.98x on 2022 survived a capture, a fit
  and two pre-registrations. **On reachability, the brief is wrong and I am correcting it rather than
  acting on it:** it reports the previous focus as never drawn. `docs/observability/seat-executor-log.md`
  records the first item **RUNNING and FINISHED rc=0 three times** — 17:36, 18:36 and 19:35 UTC. The
  steer bit. What it did not do is reach past item one: the lane delivers **exactly one focus item
  per stretch**, and items two, three and four got nothing from it. That is the fact that should
  order this list, so it does. And what is still live on origin under Poesys's name, untouched for a
  full stretch after I ranked it third: **the annual report publishes one field a hundredfold apart
  in two of its own tables.**
