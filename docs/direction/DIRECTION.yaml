focus:
- id: B11_forward_clv_backtested_on_held_back_history
  lane: B_commercial
  side: supplier
  what: 'B11 slice 10, with predictions filed first in docs/staging/records/. Give the per-customer departure
    hazard in company/analytics/forward_clv.py the observables a supplier holds at the cut: tariff type
    (fixed or default), payment method (direct debit, on receipt of bill, or prepayment), and months on
    the default tariff. Read them only from the company''s own per-account ledger in the run report, never
    from world state. If book_from_run_output cannot see them, surfacing them from the company side is
    step one. Take each multiplier from docs/market_research/observable_correlates_of_price_responsiveness.md
    as a stated prior with its range, then shrink it toward the fitted segment rate by the existing n/(n+k)
    credibility weight. Grade it on the slice-5 book at cuts 2020, 2022 and 2023, paired against flat,
    using the existing 95% bound, for each held-back outcome (stayers, switchers, movers). Label every
    result DEVELOPMENT. EP17''s fresh-seed verdict stays reserved.'
  why: 'Per-customer value from inference is the thesis, and nine slices have tested a forecast that sees
    nothing a real supplier uses to tell its customers apart. DONE: the slice is on origin with its mutation-proven
    control, the prediction is graded beside the result (wrong ones kept), and the finding says plainly
    one of three things: per-customer ranks better, cannot tell, or ranks worse. It also says whether
    the key goes into the EP17 arm before the seeds are listed.'
  written_at: 1792193183.439
- id: the-company-theft-screen-reads-a-window-not-a-ratio
  lane: D_billing_metering
  side: supplier
  what: 'Knowledge first (K8). Amend docs/market_research/unbilled_energy_and_revenue_assurance.md with
    published GB revenue-protection practice for screening low or zero consumption: the TRAS/RPS service
    and the SLC 12 theft duties. Cover what window a supplier screens over and what counts as an occupied
    account. Label anything unpublished GAP. Then, in company/billing/theft_indicator.py, add two structural
    flags that need no typed cut: an empty billing period (zero advance between two actual reads) on an
    account with a named occupier, and an annual window whose cut stays None unless the page sources one.
    Grade the company''s flags with tools/theft_void_screen_probe.py against the world''s thefts, voids
    and occupied homes, as an instrument only, and print the table.'
  why: 'Unbilled energy is billing accuracy, first in the director''s order. The W2_36 probe showed that
    the company''s screen is unscreened today (both thresholds None). It showed that an empty month is
    a theft about nine times in ten and an occupied home never empties a period, while a loose monthly
    ratio flags occupied homes most. DONE: the page is on the site, the flags and their control are on
    origin, the table is in the W2_36 finding beside the probe''s own, and no ratio threshold was invented
    to get there.'
  written_at: 1792193183.439
