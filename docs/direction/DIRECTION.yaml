not_now:
  - what: A Pages-Function password gate for the site, so the login ruling finishes without the director's Zero Trust
      sign-up.
    why: >-
      It would mint a live credential and change the security posture of a real service, which G5 reserves. The open
      row already offers it as the fallback if the sign-up asks for a card. Building it unasked would decide his row
      for him.
  - what: Picking a SPAR value from the predicted table (gap 0.289 at SPAR 3) and building the electricity fix now.
    why: >-
      SPAR is an established GAP. Choosing the value that scores best on the very book it is graded on is the invented,
      load-bearing constant the knowledge-first rule forbids. Focus item 2 searches first and builds only on a source.
  - what: Loosening the 0.12 pair's W3_3-book precondition so it can run on the 6af7fd0bfd book before 24 Nov.
    why: >-
      9a361e356 kept the precondition with evidence. What stops the book is a fork commit that item 1 removes, not
      producer capacity, so loosening it now would trade the test's validity for hours. If no book has launched by
      22 Nov, the watcher stands down and the pair is re-armed rather than loosened.
  - what: Pressing W2_36 to L3, the W1_14 ERA5 pull (401 of 596 cells owed) and W2_30's shape work (world).
    why: >-
      The supplier number W2_36 held is in hand and being worked (items 2 and 4). The ERA5 re-runner now runs as its
      own unit and lands through its continuation. Neither blocks a supplier result this stretch.
  - what: The prepayment build's next step (supply events for stock prepayment homes), and the repeating alarm that
      the supervisor is granting turns for the same work head.
    why: >-
      Prepayment is a world change that would move the books the 0.12 pair is armed against; it returns after the pair
