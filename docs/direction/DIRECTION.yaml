- id: a-year-unread-is-registered-as-the-companys-21b4-breach
  lane: D_billing_metering
  side: supplier
  what: Build the smallest company mechanism proposed in section 4 of docs/staging/WORKER_FINDING_C7_AND_286_OTHER_RUNS_OVER_TWELVE_MONTHS_NONE_BILLED_PAST_THE_BAR_AND_NOTHING_ASKS_FOR_A_READ_2026-10-16.md.
