  - id: a-swept-row-must-ask-git-whether-the-work-landed-under-another-name
    what: >-
      Wire the git-side join into `background/delivery_lane._disposition` (~line 669) using `_git`
      (~line 237), which already runs `rev-list`, `merge-base` and `diff --name-only` in the same
      file, so a swept window returns `LANDED_ELSEWHERE` with the commit named, and the
      work-sitting-uncommitted case reads as work in hand rather than `not_done` with empty
