    why: >-
      Real, and it will have to be answered by closing channels that file rather than by working
      harder at the queue. But it is filing machinery, the product share is 2.99% over 100, and the
      director has just named product work with a three-day fuse. A queue growing by twelve a day
      can absorb one more stretch; a token that expires cannot.
  - what: >-
      Retiring the five live continuations one at a time — the reconciler-race alarm, the promote-seam
      binding, the standing-red decomposition, and the two duplicate low-water items.
    why: >-
      This is what the last direction asked for and it treats the symptom. Retiring five entries from
      a store that refills every turn buys one tick of reachability. Item 4 changes the precedence
      instead, which is the difference between doing the work and building the thing that watches
      the work. The one exception is the duplicate pair, which is a genuine defect and is folded into
