thesis_read: 'Forward, and the supplier''s half of the comparison is now built end to end, but the thesis still
  reads ''cannot tell''. 17 commits, 8 substantive (4 carried no work, all merges). The brief splits them 1 supplier,
  3 world, 3 both, 10 other. Read by subject the stretch was mostly supplier: of the three ''world'' commits, 066fd2300
  served D48, and 768f41ed1 (the budget decides payment by default) and 8927e9345 (400 founder households and a
  settlement budget of 7,700) carried out the director''s rulings. No level moved. What it MEANS. (1) Every per-customer
  decision now has a production caller: C34 (18503313a), the save offer (46387b883) and C35 (466fb691e, merged 14df12a5f).
  All sit behind switches that default off, so the standing company is still a flat-rules player. They have never
  run switched on together against the flat supplier on one book. That run is focus item 3. (2) The baseline''s
  retention control can now fail. abe7ce533 keys it to the cut over 2017, and a flat arm that offers reds all three
  flat legs. The control was not made blind by c61d8b608, as my last record said. 2016 held 3 renewals, all below
  the churn threshold, so it had always read 0 against 0. (3) The median renewal''s -GBP 3.91 a month was OURS,
  not the world''s. The term contribution charged the operating cost the standing charge recovers and credited none
  of it (f04bd6102). ec7fd9942 credits it, and its grade is queued for 02:00. So the C34 concern''s premise (''our
  side negative in almost every renewal'') was partly an allocation of ours. I will re-read that concern''s evidence
  once the grade lands. (4) Billing, first in his order: the company now computes its unbilled accrual and no longer
  counts a bill its pre-bill gate held as billed (75aff1401, d4af471a1). The council tax lookup now asks about the
  dwelling (066fd2300). What is left of the accrual is held bills that nothing ever works, and two continuations
  carry it. Against the thesis itself: B11''s within-segment term (27ca9dc7a, last stretch) is the honest test of
  inference against the flat rule. It clears only in 2020, by a hair (+0.061, interval +0.002 to +0.120). 2022 and
  2023 cannot tell. Nobody has asked whether this book is big enough to tell at all. Focus item 2 asks it, because
  it decides whether the director''s six fresh seeds (EP17) can answer. The SLC 21B.4 read instruction, a licence
  duty, has had its switch-on predictions filed since 18 Oct and has never been run. It is focus item 1. The previous
  focus named 3 items, all 3 were drawn and all 3 landed (f04bd6102 and ec7fd9942, abe7ce533, 75aff1401 and d4af471a1),
  so all three leave focus. Two of this stretch''s ticks were handed work another lane had already spent (711359a8c,
  732b2e116).'
