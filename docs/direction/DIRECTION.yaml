thesis_read: >-
  The thesis moved this stretch and the machine that carries it went backwards, and the two facts
  are not independent. On the thesis: the arrears state now reaches both the renewal and the price
  from the company's own ledger (`ae101f936`, `17a88051c`) and `17a88051c` is an ancestor of
  origin/main, which closes my worst error of last stretch on exactly the test I set for it -- 236
  lines of sourced per-customer inference that had been sitting in no commit are now production
  code, and the distress term a household is priced on is something a real supplier reads off its
  own books rather than something the sim was asked. `6dcdd0339` made the world press back harder:
  a drawn founder had been given a gas contract on an electrically heated home and the book settled
  9.5 MWh a year its physics never burned. That is fidelity as precondition working as designed.
  The baseline leg -- the half of the thesis that makes "it performed well" mean anything -- did not
  move, and it did not move for an instrument reason rather than an intellectual one: the 18-seed
  floor re-run is genuinely in flight (legs 1 to 4 complete in
  /var/tmp/se-floor18-head-20260925/shards/, leg 5 running since 22:48), but its focus item was
  named and never drawn, and neither was the sanity-daemon one, so 2 of 5 steers were unreachable
  in a 12-hour window. Now the machine, and this is the reading that outranks the rest. 30 of 48
  commits carried nothing at all; 14 of those were the liveness heartbeat and 16 were reconciliation
  merges that authored nothing of their own. Those two populations are one mechanism: each heartbeat
  commits the liveness surface locally, which forks this checkout from origin, and the reconciler
  then pays a full pre-commit gate cycle -- measured at seven to eleven minutes in the live process
  list -- to close a fork that carried no work, while origin moves again underneath it. The behind
  leg grew from 5 to 14 across the stretch and the publisher's own recorded cause is `behind_origin`.
  So the surface that exists to prove the machine is alive is what is holding it shut, and the
  publisher row I closed last stretch on a clean reading is refusing again fourteen hours later --
  which is the trap I twice said I had learned to avoid, grading a defect by the state of a named
  mechanism on a good day. Two corrections landed properly and both deserve their evidence beside
  them: `e1736649a` made the fleet drift verdict publish its denominator, and it now reads 11 of 11
  graded with `vacuous: false` where it read 0 out of 1 dressed as 0 out of 11; and the `-` on the
  twelve `ExecStartPre=` lines, which I carried as owed for five stretches, was REFUTED rather than
  done -- `f5f740cf6` measured that systemd records the failing exit under ignore-errors, so the
  strip buys no detection, and the stamper itself now probes `works`. I was wrong for five stretches
  about a remedy, never once asking whether the thing I wanted stripped was the cause. And the same
  lesson has already arrived through a third door: that drift verdict is now honest about its
  denominator and grades all eleven daemons against `boot_sha.current_head()`, the LOCAL HEAD, which
  is the 14-behind checkout -- so `stale: []` is true, published with its population, and still
  blind to a whole fleet running code the branch moved past. Fixing a census's denominator does not
  fix its oracle.
