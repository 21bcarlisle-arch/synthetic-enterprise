thesis_read: >-
  Billing accuracy moved forward again, and one finished build is at risk of being lost. The thesis test still has not
  run, and cannot before 16 Nov. All three focus items were drawn. Two are done and leave focus. The repayment-dating
  area is mapped as one (b2f8e23fc, LEVEL_DD map s.9). It says which of two writer lines explains each of the 7
  cause-B holds and each of the 193 late settlements, with none unexplained. Then the map's fixes were built one at a
  time, as it ordered. Fix 1 (f5d120302) took off-day rows 146 -> 0 and own-late settlements 193 -> 84. Fix 1b
  (18148e6b6) took rows dated before their own return 58 -> 0, with no balance moved. Fix 2 is landing now
  (surgical_land pid 953430). So the STOP on both areas did its job: we mapped first, then fixed. The in-credit notice
  is the other item that is done. 0d2576c48 takes the 6fe7827ab2 replay from 47 in-credit notices to 0. Its BLOCKING
  finding closes when the 16 Nov book reads 0. The third item, the N29 set-off, has gone wrong, and that is the most
  important fact of this stretch. The netted design is built and mutation-proven (10 tests, 7 mutations, all fire). On
  6fe7827ab2 it reads 31 of 124 on the blind row, with 0 closed balances breached. But it exists only as the
  SALVAGE commit 696aa94034 on branch n29-walk-0254 in /var/tmp/se-n29-walk. That worktree is unlocked and no process
  holds it. The item was retired at 04:37 with nothing on origin. The exception still reads 60, and the finding is
  still open. This is the third time a finished build has been retired without its landing, and it is the open fix
  a-continuation-retires-without-its-work-on-origin. Landing it before the 16 Nov 04:00 publish is item 1. Its paths
  overlap fix 2's (generate_billing_ledger.py, arrears_engine.py), so it must land after fix 2 and on top of it. The
  cure reader is on origin (3159a16f2), so its wrong row is corrected. The commit_split reads 0 supplier and 12 other.
  That is the classifier reading tools/ and docs/ paths: six of the nine working commits change supplier billing.
  Measured against the thesis itself, nothing moved. The flat-baseline comparison (c65c4cb8b) is the only test of
  "beats average by inference". It stays held by the ban on model arms until 16 Nov, and it is first for that review.
  The checkout is 36 behind origin. Every daemon lacks 2 to 10 commits, and the brief still counts the retired
  205-of-238 finding as BLOCKING. I am leaving that alone while two landings are in flight in the shared tree.
