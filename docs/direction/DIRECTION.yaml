  - what: >-
      The harness backlog — ten repeating-alarm findings sitting in the staging root, the ~117
      harness atoms never read for whether they should exist, and the reuse convention that
      manufactures false callers.
    why: >-
      Tidying that moves no level and closes no finding, and the staging root is a work queue rather
      than a filing cabinet, so their sitting there is itself the signal. They wait for a stretch
      with nothing on the published surface in a state the reader would object to — which this is
      not, since `/capabilities/` is currently publishing a comparison on a deleted cost basis.
  - what: >-
      B10's §5 ceiling gap — giving the company an observation of the cheapest rival price rather
      than only of its own losses.
    why: >-
      A real design question and the honest remaining half of B10, but it cannot be reasoned about
      until the loss-based channel is live in HEAD and measured on a population that can grade it.
      Deciding what a second competitor observable should be, while the first one returns its prior
      at every call, is designing against a channel nobody has seen work.
