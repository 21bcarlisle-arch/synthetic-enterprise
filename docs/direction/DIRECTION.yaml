- id: canon-w3-leaves-open-how-far-the
  raised: '2026-10-13'
  kind: canon_intent
  what: 'Canon W3 leaves open how far the world''s price responsiveness may correlate with signals a supplier holds (section
    15, owed item 4). Published evidence puts the large correlations on whether a household LOOKS at prices: 2.8x for fixed
    against default, 3.4x for credit against traditional prepayment, 0.54x for 3+ years on the default tariff. The world already
    carries those. Nothing published sizes a correlation with how far a household MOVES once it looks.'
  proposal: 'Two changes, smallest first. (1) Selection at acquisition, with no new number: a prospect enters the market weighted
    by its own active-renewal probability, so the link between acquisition channel and later responsiveness emerges from draws
    the world already has. Recommended. (2) Optionally, couple the price-sensitivity segment to the engagement rank, run at
    both ends (independent and fully coupled) with the strength kept as a GAP, never a midpoint. Not recommended: a past-switching
    term, which the only trial puts at x0.94. Your decision 6 already settles the adjacent pricing question. Both are graded
    on fresh seeds with predictions filed first.'
