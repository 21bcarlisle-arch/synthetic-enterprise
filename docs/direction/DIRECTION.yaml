thesis_read: >-
  The thesis was tested this stretch and it is losing, and that is the best thing that has happened
  here in weeks — because for the first time the machine could tell. Two numbers carry it. First,
  the split: of the £17,738.64 the per-customer arm earned over flat rules in the published world,
  £17,468.44 is the price LEVEL and £270.21 is the CHOOSING, and
  `docs/design/THE_LEVEL_LEG_IS_AVAILABLE_TO_THE_FLAT_RULE_SUPPLIER_2026-09-08.md` takes the
  position — with the counter-argument set out in full and answered — that the level leg is a leg
  the flat-rule baseline supplier could also have taken, because its whole policy is one scalar
  discoverable by search from a supplier's own observables. So 98.5% of what the page called our
  advantage is not the thesis's claim at all; the thesis's share is 1.5%, and on the newer 09-08b
  run 1.9%. Second, the concordance. Last stretch established that the decisions it cannot score
  are exactly the renewals where the household left — 40 of 40 on the newest run, zero
  counterexamples in either direction across nine artefacts. The 09-08b run now carries the estimand
  that owes: score every priced decision over a fixed 365-day horizon from its own term start,
  counting a departure as the zero it actually produced instead of deleting it. It reads **0.4209
  over all 161 priced decisions against 0.5338 over the 168 survivors**, and the bridge moves one
  thing at a time — closing the horizon −0.0345, ratio to pounds +0.0137, admitting the departures
  −0.0921. The population term is the largest and it points down. The arm ranks the households it
  kept better than the ones it lost, which is precisely the bias the mission sentence about transfer
  versus creation exists to catch, and survivor-conditioning was hiding it. None of this has reached
  a reader. The publisher is 32.0 hours since figures last reached origin, `wedge_since`
  2026-09-07T17:15:29Z, `episode_failures: 31`, `last_clean_publish: null`. I put its diagnosis in
  `wrong` last stretch as corrected-in-diagnosis-not-in-fault; the diagnosis is wrong again, in the
  same shape for the third consecutive time. The newest failure, 23:00:23Z, names `behind_origin`
  with "origin/main is 3 commit(s) AHEAD of HEAD"; a read-only `git ls-remote` twenty-two minutes
  later has HEAD, the cached ref and the real remote all at `60bcdec35`. Each cause I have named —
  the publish commit's route, then the two contested `stale_copy_refusal` paths, now this — was a
  true observation of a race that had already expired by the time I read it. The two paths I named
  are both tracked at HEAD and byte-identical to the working tree tonight, and the publisher is
  still dark. `f1ab95bed` fixed the one structural thing underneath it — `origin_reconcile` was
  reconciling the worktree it was RUN FROM rather than the shared one, so its "LEVEL: nothing to
  reconcile" was true about a tree nobody publishes from — and that fix is forty minutes old and has
  never been observed to produce a publish. Meanwhile the flagship page publishes two different
  answers for one quantity: `realised/split/selection_gbp` £2,574.37 from the 08-31 run, and
  `current_world/selection_gbp` £270.21 from the 09-08 one, an 8x gap in the flattering direction
  depending on which block a reader stops at. Previous focus: item one was drawn and its named
  instance cleared without clearing the fault; item two's substance was executed under a different
  id (the 09-08b run is committed and carries both withheld estimands) and so reads as never drawn,
  which is the draw-ledger blindness I have listed as my own error nine times, demonstrating itself
  on my own direction; items three and four were never drawn in the three hours the direction lived.
  One thing I claimed last stretch is refuted: the draw ledger is at 59 of 191 null rows against 61
  of 190, the first fall in both count and rate, so "nothing is being reconciled" was too strong.
