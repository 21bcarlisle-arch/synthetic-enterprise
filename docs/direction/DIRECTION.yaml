focus:
  - id: the-reconcilers-own-merge-is-refused-by-the-commit-msg-chain
    lane: H_harness
    what: >-
      Unwedge the shared tree. Since 09:43 UTC, docs/observability/reconcile-watch-log.md has
      recorded every cycle as "fork with origin -> REFUSED_GATE (rc=1) ... the commit-msg chain",
      with the gate's stdout empty. The tree is now 23 behind and 4 ahead (7a8e651cd, 9fd88794f,
      d815c6bfc, 90d28d7f7). (1) Reproduce the refusal: run the commit-msg chain by hand on the exact
      message background/origin_reconcile.py builds for its merge. Name which gate refuses (the
      REUSE record, NEXT:, or another), and say why it passed at 08:30, 08:56 and 09:06 and fails now.
      For example, find which commit on either leg first added a new module or an open-atom mention.
      (2) Fix it in origin_reconcile, so that its merge message satisfies the chain by construction.
      Never by bypass, which is a wall. Or, if the refusal is right, fix the commit that caused it.
      (3) Add a control that builds the reconciler's merge message for a fork whose legs add a new
      module and runs it through the real commit-msg chain. Mutation-prove it by restoring today's
      message. (4) Make the refusal surface say WHICH gate refused and its text, never "<the gate
      produced no output>". (5) Confirm that the 4 ahead commits reach origin, or are proven already
      there, with no second landing of any of them.
    why: >-
      Every daemon is running code from before today's ceiling, invariant and world VAT fixes, and
      that gets more true every five minutes. EP1's ledger row is stranded on the ahead leg. The page
      fired at 11:18, but its remedy text tells the reader to "fix the message" of a commit nobody
      wrote by hand. DONE when the shared tree contains origin/main again with no hand, and the
      control is on origin. Also when the next merge with a new-module leg passes the chain, or is
      refused with a named gate and named text.
  - id: settle-the-eac-against-demand-gap-before-pb4s-swap
    lane: W2_customer_generator
    what: >-
      Do PB4_engagement_separated_from_elasticity's blocking step, which as an atom bias has not been
      drawn for two stretches. Read docs/staging/SEAT_FINDING_THE_YEAR_ONE_SHOCK_TAIL_IS_AN_EAC_A_FRACTION_OF_THE_HOMES_USE_2026-10-01.md
      first. 7 of 31 first renewals rise by more than 100%, in electrically heated homes whose
      registry EAC (1,600-2,500 kWh) is a fraction of their billed use (e.g. PROS-2016-0098). Do
      knowledge first: establish from the published record (Elexon BSCP504/BSCP505 EAC/AA,
      docs/domain_artefact_library/) how a settled home's EAC is set and how fast it follows the
      reads. Then find which layer of simulation/household_demand.py, or the heating/asset layer on
      top of it, puts demand above the declared EAC. If the gap is not history-true, fix it in the
      world as a fidelity change, in its own pre-registered one-world run, blind to company results.
      Then hand back to step 3 of
      docs/staging/SEAT_CONTINUATION_SWAP_THE_WORLDS_BILL_SHOCK_BASE_ONTO_THE_EXPERIENCED_SHOCK_2026-10-01.md
      (the swap), and do it in the same claim if time allows. Run this only after item one has put
      the shared tree on origin, because the switching-reference VAT fix landing now moves churn.
    why: >-
      The world's retention gradients are still the artefact of a count that is blind in year one,
      and every company ranking is graded against them. The SVT exit-route repair is embargoed
      behind this swap, so two world defects wait on one unasked question. DONE when the EAC/demand
      question has a sourced answer in a finding, any world fix is on origin with its one-variable
      run, and the swap is either on origin with its tenure-1 control or re-issued with the exact
      reason it cannot go yet.
  - id: close-the-vat-basis-class-in-the-world
    lane: W2_customer_generator
    what: >-
      Finish the two VAT-basis defects 50bde35ab handed on, and fix the class. First confirm that the
      switching-reference fix (surgical_land pid 1176957, "compare every switching offer with the
      published SVT on one VAT basis", price_cap_enforcement.household_price_inc_vat) reached origin.
      Do not redo it. (1) Standing charge, knowledge first: establish from Ofgem's published cap
      breakdowns whether simulation/policy_costs._ELEC_SC_PENCE_PER_DAY_BY_YEAR (46p/53p/61p for
      2022 onward) and its gas twin are inc-VAT. Find a source for the pre-2022 "typical market
      averages", or carry them as an explicit gap. If they are inc-VAT, store them ex-VAT. That is a
      fidelity change in its own run. (2) ToU sold rate: experienced_bill_shock.sold_unit_rate reads
      the daily off-peak unit_rate_gbp_per_mwh. Read the consumption-weighted rate from the daily
      revenue_gbp over consumption instead, and measure the DD-opening ratio for ToU homes before and
      after. (3) The class: add one architecture control that no module under simulation/ or
      company/ grosses up or de-VATs a price except through the named helpers
      (price_cap_enforcement's and tariff_comparison.VAT_RATE_DOMESTIC's). Mutation-prove it with a
      bare "* 1.05".
    why: >-
      The VAT rule now has at least six implementations, and each one found so far either overstated
      company value or understated the household's bill. That is the same transfer-read-as-creation
      the mission forbids, and the next one will not announce itself. DONE when both defects are on
      origin with their one-variable runs, and the class control is on origin and reds on a stray
      gross-up.
