      `--landed name-the-35-remaining-bare-keyerror-refusals-on-raise-on-missing-registers --commit
      <sha>`.
    why: >-
      This is the fourth instance in four days of complete, mutation-proven work dying in the shared
      tree, and it is the worst failure mode the queue has: the ledger says not done, so the item
