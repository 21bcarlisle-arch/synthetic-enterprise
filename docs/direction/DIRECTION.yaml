thesis_read: >-
  Three hours: 12 commits, 9 carrying work, 8 substantive. The classifier reads 1 supplier, 0 world and
  11 other. Almost all of it was machinery: four HEAD-red-register repairs, the census plugin that killed
  its own census (89f5e98d3), the hook timer, and a post-publish reader disposition. The one supplier commit
  (122c7bd89) registers an E7 import on the seam allowlist. The INV_UNIT_RATE_FIXED gas floor (a1f87a716) is
  the one change with supplier meaning: 736 gas fixed terms are now floored, and 35 flag mid-2023 fixes at 0.59x
  their window's floor. That is a diagnostic, not a decision. Against the thesis, the stretch went sideways, not
  backwards: no supplier result moved. Nor was the steer drawn. The brief says none of the three previous focus
  items was drawn, and the seat-executor log confirms it: every tick from 23:36Z to 00:16Z STOOD DOWN with "no
  continuation and no unclaimed focus item". Items 1 and 2 were rightly embargoed on files that do not yet exist.
  Item 3 (B12) named a bare atom, and the executor does not take atoms; the anti-livelock draw has not taken B12
  in 325 draws. So the previous direction left the Lane 0 executor nothing it could work for three hours. The
  steer is the thing that drifted, and that is this record's own error (new wrong row). The fix is structural
  to this record. B12 is re-filed as a Lane 0 slice with a non-atom id. A second supplier item that needs neither
  the box nor a book is added: B8's holdout, which is held at L2 because no published book carries a holdout row,
  so nothing measures whether a per-customer treatment beat no treatment. The thesis question still rests on
  the 0.12 replication. On the log at 00:22Z, seed 33333 finished in 5.7 h and seed 44444 is at November 2023,
  so pair 33333/44444 writes at about 02:30Z and 55555/66666 at about 14:00Z. Until then, the per-customer arm
  stands at -GBP 0.33 (-1.77 to +0.96) against the flat-rules twin, in-sample only: untested, not refuted. No
  previous wrong row closed this stretch. Nothing graded any of them, and their dated rechecks (the replication,
  N17 on 23 Nov) have not yet come due.
