  - id: one-page-answers-would-a-bigger-book-help-in-both-directions
    what: >-
      Re-read the live feed before changing anything, then fix the producer.
      `site/data/value_arms.json` publishes
      `floor_decomposition.share_at_which_a_bigger_book_could_resolve_it` as -4.5507, grades it
      `share_is_decisive: true`, and reports `larger_settled_book_would_resolve_it: true` with
