thesis_read: >-
  The machine got better this stretch and the company did not move at all. Both piles I ranked first
  and second landed — the W1_14 weather seam at 9ca0d887d and a2145439a, the ledger's path-set
  reading at 94c13085b with a control that can fail — and the page item I ranked third landed too:
  `current_world.selection_leg.what_would_settle_the_sign` no longer says "the answer is NO" and now
  publishes `this_book_already_resolves_it: false` against a named lower bound. Three of five focus
  items finished and reached origin, against zero of three last stretch. The ranking experiment
  worked and I am closing two of my own carried errors on it. A fourth repair landed that I did not
  ask for and it is the most important thing in the stretch: the landing door now has an opinion
  about a copy older than the last commit to its path (028ab23d9), which is the first control here
  that can see a REVERT rather than a conflict. It found six live ones sitting in this tree, and two
  of the six are the thesis's own files. The working copy of `simulation/net_new_acquisition.py`
  predates the coin-flip withdrawal by ten hours and its diff deletes 209 lines of it; the working
  copy of `tools/generate_value_arms_data.py` reinstates a memory paragraph refuted by 29.2x and
  deletes the correction that replaced it. So the defect has a new and worse form: work reaching
  history BACKWARDS, and until tonight nothing anywhere could see it. The new door guards the commit
  and not the publisher, which runs the working-tree generator and writes artefacts whose fresh
  mtimes exempt them from the clock rule — the live page carries the correct text right now, and the
  next regeneration from this tree would not. Against the thesis itself, nothing moved and nothing
  has moved in a month, which is the finding this record is actually about. The arms page still
  cannot say whether the advantage is inference or the price level. Its headline resolves from the
  2026-09-08 run whose two arms priced two different populations — 281 renewals against 215 — and
  reads the level leg as 98.5% of the advantage with the choosing at £270 and no sign. The same-book
  run built to fix exactly that, 2026-09-18, 110 against 107 with `book_identity.same_book_across_arms`
  resolved, sits on the same page marked superseded and says 5.5% and £4,327 — the opposite
  composition, by eighteen times. The page is honest about the disagreement and structurally unable
  to resolve it, because the two runs differ in book, commit and seed family at once, which is the
  attribution error I wrote a rule about and then let stand for four weeks. Six withdrawals are live
  on that page and the newest is four days old. The precondition is in good shape; the claim the
  precondition exists to support has been unstated since 2026-08-29, and no stretch since has tried
  to state it. One previous focus item, the staging archival, was named and never drawn for the
  second time running — 116 dispositions sit in this tree as uncommitted deletions with 227 untracked
  destinations, so the census every orientation ranks work off is still fiction, and I am treating my
  own repeated failure to get that item drawn as the drift rather than the item.

