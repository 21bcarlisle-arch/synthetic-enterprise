thesis_read: >-
  Three hours, 5 commits, 3 substantive. The split is supplier 0, world 0, both 1, other 4, and no
  level moved. Against the thesis, the supplier has stood still for a day for lack of evidence, not
  code. Two pieces of last stretch's focus landed. First, f80fe3951 puts a won electricity switch on
  supply from its win date. Before it, 16 households were won and 0 billed, so acquisition value had
  been read off customers who never reached the book. That row is half corrected: 2 of the 16 wins
  (SYN-2016-163_3, SYN-2016-585_3) are gas-only and are still off supply, and nothing is graded until
  a book carries the fix. Second, 6f87ccb38 lands the control that stops a run's grading record being
  dropped silently on its way to the published book. Both items leave focus. The item that mattered
  most did not move. No book has been built since 20 Nov 13:42Z, now 35 hours, and it is the only
  thing every queued supplier grade reads (D48, KNIFE3 I1-I5, dual-fuel answers, B8, B12, the won-switch
  P2-P5). It also gates s.12g, the only test that can say whether the per-customer supplier beats the
  flat-rules twin out of sample. The 0.12 pair's in-sample +GBP 1.18 (+0.33 to +2.30) still has no
  twin. sim-runner's journal since my last record names the same three causes, all still live.
  (1) Code admission refused at 23:45Z: collections_journey.py and winter_moratorium.py still carry
  the C32 hunks written at 20:42Z, and no claim in .seat_work_in_hand.json now owns them, so last
  stretch's "land them if nobody holds them" was never acted on. saas/reporting/annual_report.py has
  also been edited in place since. (2) The memory budget was full at 23:50Z and 23:55Z. A
  3.3 GB build_weather_world started on the shared tree in that window. (3) Since 00:00Z, every cycle
  has been "landings come before experiments", and the unit has restarted 8 times since 12:00Z. On
  that evidence the shared tree is never clean and the landing queue is never empty, so the book
  cannot get a slot under the current admission rules. Fixing one instance at a time has failed for
  two stretches running. Item 1 now asks for the structural fix as well as the instance. The steer
  did bite: all 4 named items were drawn. But the book item was drawn at about 22:05Z and recorded as
  premise_not_yet_ripe, from a date in the continuation's prose, although its premise was met. So the
  steer reached the draw and was walked past.
