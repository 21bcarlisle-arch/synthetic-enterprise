thesis_read: >-
  THE THESIS NOW HAS AN HONEST NEGATIVE, AND THAT IS PROGRESS. The console seat graded the learned-slope
  pre-registration (853b3d8bd). L1-L3 were refuted on 4 of 4 paths. Against the best flat price in hindsight,
  choosing per decision is at parity on all four paths (SNR 0.2-1.4) once one household is set aside.
  That household is PROS-2016-0098, a 2017 debtor. So the company does NOT yet beat the flat baseline.
  The one place it lost sat on a fidelity gap, not an inference gap. The world let an indebted credit
  customer switch freely, where SLC 14 lets a real supplier object. That gap is now closed in the world
  by bf0d37c2f: about 28% of indebted switches are blocked, from Ofgem's 2016 counts (bcd886d59). This is
  the order the thesis asks for. Find where the world cannot press back, fix the world, then re-ask the
  baseline question. Nobody claimed a win that would have been transfer. A SECOND FIDELITY DEFECT IS NOW
  MEASURED. On the anchor's expected level, the world departs at 0.77-1.18x DESNZ QEP 2.7.1 over 2017-21
  and 1.80x in 2024 (d2e5c755f). That instrument decides 2024, which the 45-account book never could,
  so my framing error from last stretch is corrected by a better instrument than the pooling I asked for.
  The coupled QEP re-fit is under way: captures E and F are on origin (24ece7adb), G is on disk, and the
  value-arms retake is queued. ALL THREE PREVIOUS FOCUS ITEMS LANDED AND LEAVE FOCUS. The departure finding
  is d2e5c755f. Combined-diff merge selection is 3c5702901: 101 of 115 base advances in 48h authored nothing,
  and this stretch only 5 of 23 commits carried no work, against 15 of 31 last. The prepayment ruling
  is ba320e2d2: a clean account prices the same however it pays, on both belief settings, and own_book
  is now the default. THE INTERCONNECTION FAILURE IS THE NEXT ITEM. ba320e2d2 changes the default renewal
  price, and its own message says the objection re-run must take its baseline at or after it. But both
  objection probes (pids 2873381 and 2878648) run in /var/tmp/se-objrun at bf0d37c2f, before it. The queued
  QEP value-arms retake (/var/tmp/se-qep-arms, wait-then pids 3008005 and 3021528) also sits on a base
  without it, and its declared owner pid 3002863 is dead. Graded as they stand, both would measure a company
  that no longer exists at HEAD. Origin was also red twice this stretch for the stem-selection reason
  (d9a2f26cc: 14 legs since c3939e7b1; b660d3a46: settlement evidence). The instance in focus last time
  is fixed. The class is not. HEAD is 105 behind origin and the last two direction records are still
  on no remote ref.
