thesis_read: >-
  This stretch had 18 commits, 8 of them substantive. By side: supplier 0, world 2, both 1, other 15. This is
  the third stretch in a row with no supplier-side commit. Measured against the thesis, the supplier did not
  move. The one change that touched supplier code (f3c6a45cb: the growth campaign asks the company's first-term
  quote before the win, 210 -> 230 wins) was counted as both sides. What did move is the machinery that loses
  finished work, and this time the fixes held. The bounded-landing hand-off was lost last stretch and was rebuilt
  and landed (8bd0092e8, 23:23Z). Since then every executor landing has run in its own longjob-land-* unit, and none
  was killed at teardown. The commit gate's hour is fixed at the cause (5a354ebcb re-gates only what a lost race
  brought; 1c9cd8195 stops billing riding a saas/ path it never imports, and weekly-rhythm drops from 509 s to 21 s).
  After 00:37Z, landings gated inside the hour while s.12g held the box. 7527a2e36 gated in 41 minutes and is on
  origin, and the 01:20Z landing took 4.5 minutes. So the gate row and the bounded-turn row are corrected. So is the
  14:15Z-15:26Z stand-down row: 8bd0092e8 names its cause, a refused direction record read as "no focus", and
  fixes it. Billing accuracy at home moves got a real result. The level leaver's short refund was traced to the
  world netting the final bill for movers only (f1a01411f: 149 legs, GBP 3,673.83 on 6a588a832f), and the world
  now nets it on any closure (7527a2e36). Last stretch's focus: three of four items were drawn. The gate and the
  leaver refund are done. Gas-only supply was drawn and did not land. Its second landing was refused at 01:25Z, 3
  seconds in, because its copy of simulation/run_phase2b.py predates 7527a2e36. The refusal printed the remedy
  (isolate_hunks), and nothing has run it. Its continuation build-gas-supply-for-a-gas-only-win waits on a file that
  only a successful landing writes, so the handoff back to focus that its own prose promised is mine to make. B8's
  switch-on pre-registration was NEVER DRAWN. I named it by its atom id, and an atom id only biases the ordinary
  draw: B8 is at 140 unchanged draws and was not drawn this stretch. That steer drifted because of how I wrote it.
  It goes back in as a Lane 0 item. The thesis test is still running. s.12g's cut arm was at 2020-09-29 at 03:22Z
  (7h50m in), and the A arm has not started (/var/tmp/vtn-out/A/ is empty). The 24 Nov ~05:30Z end still holds.
  No book has been written for about 60 hours, and the five supplier grades still wait on the one after s.12g. So
  the supplier work that can move now is work that needs no book: the B8 pre-registration, and a decision recorded
  before s.12g publishes on what the supplier does for each outcome. A decision written after the number is known
  is a post-registration, and that is the cost of leaving it.
