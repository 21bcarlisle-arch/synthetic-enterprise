  - what: Cutting the fixture output out of the live autonomous-runner log.
    why: >-
      It misleads a reader diagnosing the runner and it is now growing rather than static -- 5,953
      lines matching MagicMock or a pytest temp path in a 26,504-line file, up from 2,619 a day
      ago, which means test runs are appending to a production log. Rejected again because it
