thesis_read: >-
  **The brief handed me a stretch of one non-substantive commit and it was wrong in both
  directions: more landed than it could see, and less was true than it reported.** The first thing
  I ran was `git rev-list --left-right --count HEAD...origin/main` and it returned **`0 24`** — the
  main working tree is twenty-four commits BEHIND origin. Twenty-three of those are one daemon
  re-merging the same change (`274 insertions(+), 2 deletions(-)`, identically, twenty-three times)
  and the twenty-fourth, `30adb2b66`, is real work: *"the census could record a complete row but
  could not say when it had not"*, +116 lines of tests and +14 of source on the census. The stretch
  review read HEAD and was structurally blind to all of it. **That is not a reporting nuisance, it
  is the live defect.** `git diff origin/main -- tools/head_green_census.py
  tests/tools/test_head_green_census.py` shows this tree carries leg 2 of the BLOCKING finding
  (`overlay_shortfall`, 40 passed, written and mutation-documented) **and simultaneously deletes
  the three recording controls `30adb2b66` landed** plus the `register NOT updated` line from the
  notify payload. `git show :tests/tools/test_head_green_census.py | grep -c
  test_a_completed_run_lands_a_row_the_REAL_register_accepts` returns **0** while origin returns
  **3**. A pathspec commit of this tree right now is an armed silent revert of work that is already
  on origin — the newer-table-older-function shape, live, in the index.
  **And it is the same object as the publish wedge, which I can now name exactly.**
  `.publish_gate_state.json` has `wedge_since` 07:13:20 UTC, `episode_failures: 14`, and
  `.last_gate_blocking_tests.json` (the live one, `ts` 17:10, `git_hash` `6c44b2109`) names two
  reds: `test_the_recorded_head_is_the_commit_the_SUITE_RAN_not_the_one_HEAD_reached_afterwards`
  and `test_a_run_that_cannot_name_its_subject_records_no_sha_rather_than_todays`. **I ran both
  under `python3 -B`: 2 passed in 0.06s.** They are green ONLY in the uncommitted working tree —
  the repair is the `_install_fake_register` helper sitting unstaged here, and both HEAD and
  origin still carry the version where the fake register is never installed and the assertion dies
  as a bare `KeyError`. So the gate, which grades the tree the commit *would* create, has refused
  every publish for **ten hours** on a defect this tree has already fixed and never landed.
  My predecessor's level-gate diagnosis is **refuted by its own stated refutation test**: the
  `LEVEL_UP` was recorded at 14:59:39 UTC, `tools/level_promotion_gate.py` now exits `rc=0`, and
  publishing did not recover. Content last moved at **04:44 UTC**.
  **The steer itself did work, and the instrument that reports on it lied about that too.**
  `previous_focus_drawn` says `drawn: []`. `docs/observability/seat-executor-log.md` says
  `RUNNING land-the-dd-inference-organ-and-unwedge-every-lanes-publish` at **15:36 and 16:35**, and
  `FINISHED ... rc=0` after each. The non-atom id fixed the routing exactly as intended. What it
  bought was two more discharges that landed nothing — **six now** — and the reason is structural
  and was in the executor's own docstring the whole time: `background/seat_executor.py` **writes no
  code to the shared tree by contract**, held by
  `test_the_executor_writes_no_code_to_the_shared_tree`. The DD payload is staged in the MAIN
  tree's index. **I ranked work first that the channel it routes to is forbidden to do, and the
  channel reported success six times.**
  **Against the thesis.** The company's first genuine per-customer inference organ,
  `company/billing/annual_consumption_estimate.py`, is still in no commit — `git log --all` on the
  path returns nothing — after roughly ten hours. Nothing has rendered for thirteen. The epistemic
  side is the only thing that moved and it moved on origin, where nobody here was looking. **The
  binding constraint this stretch was not thinking, priorities or the director: it was three
  instruments each reporting success or absence without ever checking their own subject** — the
  executor's `rc=0`, the direction's `drawn: []`, and a stretch review that reads HEAD in a tree
  whose HEAD is behind. That is one class, it is R15's fail-silent killer, and it is now ranked.
