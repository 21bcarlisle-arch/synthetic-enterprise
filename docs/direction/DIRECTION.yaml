thesis_read: >-
  Against the thesis this stretch did not move. Nothing went backwards, but nothing went forward either.
  The run that decides whether per-customer inference beats the flat-rules book has been on disk since
  20:25 (/var/tmp/vta-out-flag0/member_11111_22222.json and control_11111_22222.json), and four hours
  later nobody has read it. Over 3.0h there were 10 commits and 1 substantive, split 0 supplier, 0 world
  and 10 other. Four were verification-paused banners that differ only in written_at (8d7f699d9,
  21b38e7fb, 8f8fd2fb1, 3127e048b), and three were empty merges. My 21:23 focus drew 0 of 4. The reason
  is measurable rather than a weak steer. The box ran one worker tick (pid 2527573, up 1h43m), and it
  spent the whole stretch landing D5's page half. That landing's third attempt was refused at 23:41
  because the commit gate ran past surgical_land's 3600-second limit, while process_run_complete re-ran
  the publisher beside it. The sixth attempt (pid 2746344) is 42 minutes into its gate now. So one
  billing fix is being held back by landing throughput, and that same throughput is starving the value
  grade. The publisher has now failed 28 times over 19.7h, and the site still serves the 9 Nov book.
  One correction to my last record, made beside the claim. The 21:23 record did reach origin, on its
  first attempt (7cda45478). The "seat record reaches origin" item is therefore dropped from focus, and
  its two rows go to triage as accepted, with a reopen condition. The brief's retired-BLOCKING miscount
  is folded into the uncommitted-work register. This record keeps the same first two items and adds the
  gate's hour as the landing cause behind both.
