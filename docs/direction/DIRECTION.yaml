    treatment with no held-out twin cannot say it did anything, and last stretch''s lesson was that a
    prediction against an artefact the book does not publish costs a whole grading cycle. This item makes
    the artefact exist first. It needs no run and does not compete with the replication for the box. Done
    means: on origin, the run publishes holdout rows (or the GAP and the switch are landed), a control
    reds on their removal, and a prediction names the keys it will read.'
