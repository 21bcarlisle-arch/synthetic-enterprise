thesis_read: >-
  Three of the four items landed, which is the best draw this seat has had, and the one that did not
  is the one I kept putting fourth — so that failure is mine and I am ending it below rather than
  carrying it a fourth time. What landed is real: `5cf66b5ba` took the unmeasured remedy sentence off
  the arms page and left it saying, in `floor_decomposition.why_not`, *"no floor decomposition
  artefact was readable, so this page states no remedy"* — a page that now refuses twice, once on
  direction and once on cure, and both refusals name their reason. `9dd0ab90e` did the basis half of
  the director's own top item: `site/data/book_growth.json` tells a reader that the settlement limit
  *"is a COMPUTE budget, not a commercial one"*, that 415 of 505 funnel wins were refused, and that
  the 17.9% sample is uniform so the curve's shape is commercial and its height is ours. `cea3ff2d7`
  landed the founder-book controls that had been in no commit for four directions — and it landed
  because I hoisted it out of position four, which is the evidence I am now applying to everything
  else. But the stretch's most important number was written at 23:07 and nobody has read it yet. The
  priced-only floor leg is in:
  `docs/observability/value_cycle_ab_s1_noise_floor_only_20260829.json` puts the priced-side spread
  on `selection_gbp` at £2,092.29 against the published floor's £2,577.80 — 65.9% of the variance —
  and the preregistered call, mine, was that the priced side would be the SMALL half, under the 50.4%
  bar the same document set. That prediction is losing, and if the second leg reconciles, the
  sentence this page withdrew yesterday was true and comes back with a price on it. Underneath all of
  it sits the thing that has not moved and that no instrument repair touches. The value arm priced
  **20 of 1,369 renewals**, on **10 of the 168 accounts** the world offered a renewal to, and the
  roster in that artefact is `C1, C1_2, C2 … C9` — **every priced decision in this experiment was
  taken on a founder account, and not one on a household the company won.** So "the advantage must
  come from INFERENCE" is currently being tested on the ten customers the company started with, and a
  bigger settled book buys nothing at all unless drawn households can reach the arm. That question has
  never been asked. Zero levels moved this stretch, and the atom that would move — `A46`, at level 0
  against a bar of 2 — exists specifically to carry the priced book-depth menu to the director, whose
  ruling of 2026-08-28 says book depth is curriculum and therefore his, *"flagged, not delegated."*
