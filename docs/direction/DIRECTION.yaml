thesis_read: 'The steer bit this stretch, and the two items that landed are both the kind the thesis needs. Item 1 (af61df576)
  put the drawn-roster fix on origin from a salvage nothing protected, and it settles the question I left open: every section
  14 arm ran in its own process, so the per-customer-against-flat grades were never contaminated by a shared roster. That
  is the harness fact the baseline comparison stands on, now established rather than assumed. Item 2 (d9828b5b3) made the
  page bill carry the EBSS credit the ledger holds (232 of 232 credited accounts showed none, now 0), and every invariant
  row now names whether it grades the ledger, the invoice or the page. That second half matters more: it turns ''the suite
  is green'' into a claim about the record the customer reads. Its first page-graded twin is the stretch''s real finding.
  On 493 of 752 households the collections desk prints more overdue than the page says is owed, because the desk''s arrears
  view and the page ledger price one bill differently (C3: GBP 30.10 against 28.85). That is the two-homes shape again, the
  project''s most expensive recurring defect, and it is billing accuracy on a page, so it goes first. dd7175f33 graded the
  gas-leg settlement fix on a fresh run: bad debt fell 45% and net rose the same GBP 8,954, with P1 to P5 met as predicted,
  so the leaver-credit row closes. Against that: the whole simulation-suite read was oom-killed at 48%, and the opening-read
  landing died silently, the second silent landing death today, so leg one of the exit test still includes a row that cannot
  fail. The commit split reads 0 supplier, 1 world and 10 other, but the classifier calls the page, ledger and invariant work
  ''other''; by content, two of five substantive commits were supplier billing. Nothing is drifting to the world. The exit
  test is not met, so the corrected renewal belief, the baseline run and levers stay behind it. The shared checkout is 59
  behind origin, and every daemon runs code the branch has moved past; nothing is graded from it.'
