- id: acquisition-selects-on-each-prospects-own-responsiveness
  raised: '2026-10-08'
  kind: strategy
  what: 'You asked whether the world hides real correlations between price responsiveness and what a supplier
    can observe. The evidence says the large correlates are of SHOPPING, and the world already carries
    them on its engagement axis; price weight on its own is near-homogeneous (Ofgem 2024: 1.26x spread),
    as your 27 Aug ruling has it, and past switching does not carry over (31% vs 33%, Ofgem''s 2018 trial).
    What the world gets wrong is acquisition: every prospect is priced off one population response, so
    a book won by switching in is an average draw, when in reality switching in selects the shoppers.'
  proposal: Let the acquisition funnel's price stage read each prospect's own sensitivity, as renewals
    already do, with prospects entering the market weighted by their own chance of shopping. No new number
    is introduced and the latent value never crosses the seam. Optionally also run the sensitivity level
    drawn by rank on engagement, reporting fully independent and fully linked arms side by side. No past-switching
    carry-over term. Nothing changes in the world until you rule.
  status: answered
  resolution: 'Director, 2026-10-08T08:52Z: "Acquisition selects on each prospect''s own responsiveness:
    approved, as your option 1, with option 2 run both ways and reported, using the pre-registered test
    you set out. No past-switching carry-over term." Built in 2338f13ff. P1-P4 grading on fresh seeds
    is focus four.'
  evidence: docs/staging/SEAT_PROPOSAL_ACQUISITION_SELECTS_ON_EACH_PROSPECTS_OWN_RESPONSIVENESS_2026-10-08.md;
    docs/market_research/observable_correlates_of_price_responsiveness.md
