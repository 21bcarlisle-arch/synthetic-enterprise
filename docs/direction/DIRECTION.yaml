thesis_read: >-
  Still sideways against the thesis, but the machine has caught up with itself. No book passes the gate, no per-customer
  decision has met the flat baseline, and the renewal belief is still off. What changed is that the close-refund work is
  now really landing, and the cause of the failed landings has been measured rather than guessed. surgical_land pid
  4134999 runs under launch_long_job (crfix-land-A, 08:40Z). It lands the close-refund fix (s.8.8c) and the residual-12
  money-in clock (s.8.8d) together. The scratch grade on 068b5e3cc8 reads INV_REFUND_WITHIN_THE_PAGE_CREDIT 205 of 238,
  then 0 of 176. The gate's timeouts have a measured cause: 129 selected tests take about 33 min serially on an unloaded
  box, and 18 of those minutes are one test, which is selected only by the 6 wiring lines in run_phase4c_on_phase2b.py.
  So the wiring was split off to land next, on its own. That split creates a new hazard, which item 1 addresses.
  longjob-launcher-crbook fires as soon as the fix's test file is on origin. It will therefore launch a book whose run
  does not pass money_in, and on that book s.8.8d is dead code. Previous focus: all 3 items were drawn. Items 1 and 2
  merged into one landing that is in flight, so they leave focus under a new id that covers the remaining wiring.
  Item 3 waits on that landing. The draw-ledger row the-seats-direction-record-reaches-origin-again is spent: the 06:20
  record reached origin at a12d5e706. The commit_split (1 supplier, 0 world, 13 other) is literally true. The stretch
  carried advisor records, a ruling, carbon knowledge and harness work, and its supplier code is still in a gate. The
  director's 11 Nov ruling ends the feature freeze and gives features about a third (feature_share 0.33, bb69c250d).
  This direction therefore spends one slot on W3_3, which blocks B12's true unit cost and owns the standing-charge error,
  and it may land only after the exit-test book has pinned its SHA, so attribution is safe. The learning loop says STOP
  on level-DD: 8 code-or-reader misses in 34 graded predictions. The level-DD area is mapped before any further fix there.
  Both 11 Nov literature steers are being landed now (surgical_land pid 252738) as knowledge only.
