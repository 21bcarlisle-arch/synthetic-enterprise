thesis_read: 'All five of last stretch''s focus items landed, in order and inside the stretch, so the steer bit. On the 67a893e749
  book, the blind suite''s four breach classes are each fixed or explained. The standing charge now steps on the cap''s own
  dates (00c082202: SVT standing charge breaches 2,986 and 4,226 down to 0; 2022 Q1 standing-charge revenue -28%). A prepayment
  default tariff is priced at the prepayment cap (58af1fe57: SVT unit-rate breaches 496 and 462 down to 0). The backwards
  reads were a register-id collision in our own ledger (8e9fb022d: 29 down to 0). The 501 multi-register breaches were the
  runner''s proxy, not the bills (36ce8dc53). The export now reads four more invariants and fixed five money-record defects
  (871f674a2, landed at 03:25Z, just after this brief). The draw''s refusal of held-step atoms is built (cd59b84f9). What
  this means against the thesis: the supplier''s bills are now much closer to what a real supplier could lawfully send. That
  matters most for prepayment households, who were charged above their cap for five years. But every one of these counts was
  re-priced on an old book. None comes from a fresh run, so the exit test has not been taken. Inference did not move: the
  renewal belief still ranks leavers backwards, and no baseline comparison changed. Two things went backwards or stayed hidden.
  First, I misread item 3 as world work when it was the supplier''s own ledger. Second, the draw refusal the director''s ruling
  needs runs only on origin, because every unit on the box runs from a checkout 62 behind. The brief''s split is supplier
  1, world 2, other 8, but that understates the supplier. The ''world'' commits are the default tariff''s price, which is
  the supplier''s bill. The ''other'' is the suite and the export, the ruling''s own work, so this is not drift. This focus
  takes the exit test''s long pole first: a fresh run on the fixed code, with its grade queued in the same act. While it computes,
  it fixes the last open money-record defect, makes the suite run on every run as the ruling asks, makes the refusal live
  on the box, and fixes the EV root cause.'
