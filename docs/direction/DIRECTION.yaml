version: 1
oriented_at: "2026-09-30T23:20:58.042440+00:00"
thesis_read: >-
  THE LEVER HAS MOVED AGAIN, AND ONE STEP CLOSER TO THE THESIS. Last stretch named the cause: the
  per-customer arm loses only through a retention belief with no ranking power (pin AUC 0.486,
  belief-vs-world correlation -0.255). This stretch asked whether PB6's re-centring of the
  engagement factor fixes that. The interim answer is that it barely touches it. C0 reproduces
  runP1's 61001 to the bit, so the single-arm instrument is valid. On that seed PB6 changes 79 of
  110 paired beliefs, but by at most 0.0089: AUC 0.578 against 0.579, corr -0.253 against -0.252.
  The pre-run split shows why. Within direct debit, 80% of first renewals, the belief anti-ranks
  the world at -0.383, and PB6 moves the direct-debit factor by ~0.02. So the engagement factor is
  not what orders the belief on this book. The other terms of
  max(rate_estimate, payment_estimate) x market multiplier do, and one of them points the wrong way.
  That is progress against the thesis. The advantage must come from inference, and the
  question is now which input of one estimator is inverted, not whether per-customer pricing can
  work. Accounts whose tenure the offer did not change still earn +£800 per seed. The next
  step is a decomposition on artefacts that already exist, not another long run. The six-seed PB6
  leg (pid 2244605) is still running and expected ~00:20Z; it is not to be relaunched. On the
  machine: all three previous focus items were drawn. The ledger/path-check fix is built and gated
  (ebc9af681, five mutations red), but it is on HEAD ONLY. HEAD is 1 ahead and 14 behind origin,
  and a reconcile surgical_land --merge is running now. A receipted land that origin does not
  carry is exactly the shape the land-twice and divergence rows describe, so that row stays open
  until origin holds the commit. The boot-sha item was drawn at 23:17Z and is in hand. 9 commits,
  4 substantive by the brief's count; 3 are empty reconcile merges, the ordinary empty. The launch
  register now reads hgc-suite-timing as finished, success, so the register and the box agree
  again. The class behind that row, a /var/tmp driver launched against an unchecked API, is not
  fixed. The PB6 worker's prereg records its own hook-bypass. It made a throwaway --no-verify
  commit in a scratch worktree and reset it within the minute, before anything ran. It said so on
  the record, which is right; it is listed below as a wall crossing all the same.
