focus:
  - id: the-refresh-door-probes-against-the-judgement-base-not-the-parent
    what: >-
      In `tools/refresh_to_head.py`, make the `-S` probe passed to `verify_recoverable` at line 792
      come from `_discarded_lines(_blob_bytes(root, "HEAD", path).decode(), work_text)` rather than
      from `verdict.discarded`, so the searched line is one the preserved commit genuinely
      introduces against its own parent; keep the `-S` leg exactly as it is, and prove the repair
      with a control whose probe line IS present at HEAD — red before, green after — then re-run
      `--base origin/main --base-wins` in survey mode over the five residue paths and append the
      result to `docs/staging/SEAT_FINDING_THE_CHECKOUT_CANNOT_ADVANCE_BECAUSE_A_PRODUCERS_OUTPUT_IN_AN_AUTHORED_TREE_IS_INVISIBLE_TO_THE_GENERATED_ORACLE_2026-09-24.md`.
    why: >-
      This is the one door three of the five blocking residue paths have, and it is broken on the
      trunk — `verify_recoverable` and `_probe` are byte-identical on origin/main and on disk, so
      advancing the checkout would not fix it and a session that reads "stale copy" and stops will
      leave it broken for everyone. The publisher has refused 50 times over 68.7h with cause
      `behind_origin` and the gap grew from 20 to 29 commits during the last stretch alone, so
      every hour this stays broken is an hour the company's evidence reaches nobody. Do NOT
      "repair" it by dropping the `-S` leg: that leg is the only thing between this tool and
      `git checkout <path>` with a nicer name. DONE when the refusal no longer fires on a sound
      preservation, a mutation proves the new leg can fail, and the survey over the five prints a
      state other than PRESERVATION FAILED.
  - id: the-class-register-family-is-producer-output-classified-as-authored
    what: >-
      Add the entry `("background/finding_classes.py", "docs/staging/reference", "CLASS_")` to
      `GENERATED_STEMS` in `tools/file_scope_generated_paths.py`, extend
      `tests/tools/test_a_producer_that_composes_its_filename_is_still_a_producer.py` so it holds
      BOTH directions for the new stem against the live tree — the stem classifies while
      `finding_classes.py` still spells `CLASS_DOC_PREFIX`, and goes quiet if that literal is
      renamed or the producer deleted — and confirm
      `docs/staging/reference/CLASS_CONTROLS_THAT_CANNOT_FAIL_2026-08-12.md` leaves the residue set.
    why: >-
      `background/finding_classes.py:1439` (`_write_class_documents` → `doc.write_text(...)`)
      rewrites every one of those eight documents and `--check` re-derives their membership from
      the filesystem, so they are producer output being treated as authored work — the identical
      shape that the landed `WORKER_FINDING_REPEATING_ALARM_` stem already fixed for the alarm
      family, from the same module family. It clears one of the five residue paths on its own,
      independently of any other repair, which is why it is worth its own item rather than being
      folded into the advance. DONE when `stem_written_artefacts()` returns those paths and the
      residue set is four rather than five.
  - id: advance-the-checkout-and-let-the-publisher-publish
    what: >-
      With the refresh door repaired, work the remaining residue to zero and get origin merged:
      re-run `--base origin/main --base-wins` with `--write --slug` over the paths it now admits,
      take `tools/refresh_to_head.py` and `tests/background/test_publish_gate_wedge_draw.py`
      through `isolate_hunks --survey` then `surgical_land --content` AND THEN a refresh (content
      does not write the working tree), chain `surgical_land --merge origin/main` to
      `promote_worktree_landing` in ONE retry loop, and record the closing state on
      `docs/staging/SEAT_FINDING_THE_CHECKOUT_CANNOT_ADVANCE_BECAUSE_A_PRODUCERS_OUTPUT_IN_AN_AUTHORED_TREE_IS_INVISIBLE_TO_THE_GENERATED_ORACLE_2026-09-24.md`.
    why: >-
      The advance is all-or-nothing over the residue, so the two repairs ahead of this buy nothing
      until someone runs the sequence to the end — and the finding's own pre-registered prediction
      is that clearing two of five is NOT enough, written before the answer was known so it can
      refute whoever runs it. Grade this by the machine and never by my having ranked it: DONE when
      `deploy_restart.checkout_drift()` returns `contains_origin: True` and the next publish
      attempt records a cause other than `behind_origin`. If it advances and the publisher still
      refuses, the `GATE_RUNNING` starvation of the reconciler becomes the next subject and the
      finding should say so rather than closing.
not_now:
  - what: A fourth focus item at all — specifically `the-sanity-daemons-silence-has-no-cause-on-file`.
    why: >-
      It is real, it is carried, and it is cheap: sanity-daemon is the last declared daemon with no
      `log_silence` on its row in `background/process_manifest.yaml`, and the five causes
      established so far came out as five DIFFERENT causes, so nothing can be borrowed from a
      sibling. It loses because the fourth slot has now gone undrawn two stretches running, and
      naming it fourth a second time would be filing the same error twice and calling it a
      priority. It is recorded so the next seat picks it up the moment the publisher is live, and
      it should be first in a stretch where the fork is closed.
  - what: Restart the twelve stamping daemons so the boot stamps refresh and the stale-code verdicts clear.
    why: >-
      The evidence now says this delivers nothing and destroys the instrument: the stamping
      population and the restarting population are disjoint, `deploy_restart.restart_plan`
      correctly HOLDs on `stamp-predates-process` rather than restarting, and a restart before the
      checkout advances stamps the OLD sha and blinds the detector to the gap. The finding's own
      prediction — the next natural start of one of those units writes its stamp — costs one
      `stat` to check and is free of that risk, so the cheap honest check is already on file and
      forcing the restart is not.
  - what: >-
      Build the recovery-sweep control for the stash class: a completeness check that can see a
      path present in a stash but in neither HEAD nor the index.
    why: >-
      Genuinely sharp and genuinely unfixed — `git diff --quiet HEAD -- <path>` is quiet for an
      untracked path whatever its content, so the sweep would report a lost file safe. It loses for
      the same reason as last stretch and the reason has not weakened: it guards a manoeuvre that
      is already a wall violation, it is a control over a control, and the front door is dark. The
      class stays written down so nobody reaching for a recovery sweep trusts one.
  - what: Thesis-side work on the capabilities page now that the baseline arm states its entitled draws.
    why: >-
      This is the work that matters most to the thesis and it is exactly why it waits: a page
      written into a checkout 29 commits behind a publisher that has refused 50 times is written
      into a drawer. The honesty gain from `f9c1bf956` and `2ed53bcaf` is already banked in the
      tree and will publish itself the moment the fork closes, so the highest-value move for the
      thesis this stretch is plumbing, not prose.
  - what: Drain the 26 ungradable maturity-map rows that owe a repair.
    why: >-
      Unchanged from last stretch and rejected for the same trade: real debt, nothing downstream
      deciding on it this week, and it costs map bytes against a ratchet that reds every lane. It
      loses to a dark publisher every time, and it will keep losing until it stops being true that
      the front door cannot publish.
