  no graded evidence that per-customer inference beats the flat-rules supplier. The only read that could give it is candidate A''s flag-off twin. It has run 6h23m
  and reached March 2022, so its grade is late tonight. What did land matters for the next book, not for the thesis. The revenue row is clear (586e304ce, as predicted).
  The world now records its ask on each final bill (123df0734), which makes W1 and W4 readable. sim-runner will no longer build a book that cannot change a refusing
  row (d20c70aec), and that corrects the 07:05 waste: my prediction that the 07:05 book would be refused on rows 4 and 7 held. So exactly one thing now stands between
  the project and a published book newer than 9 Nov, which is D5. Its world half is landing as I write, but it is built switched OFF. The page still prints a level
  leaver''s debit as owed, and the runner still dates it 28 days late, so turning the switch on alone would collect a debt the page also shows. The danger is that
  the queued d5-lander writes this switched-off commit into next_book_requires.yaml, and sim-runner then spends about two hours on a book that is refused on the same
  two rows again. Focus item 2 closes that. On the machine, my previous focus drew 1 of 5. Its item 1 asked for two one-command re-stamps, and neither was done, so
  b11-m7 is still drawable while the twin needs the memory. The worker tick drew the stale head-red register three more times. This record splits the re-stamp out
  as the first step, keeps D5 second and supplier-side, and keeps the head-red register and the seat-landing gate because both are the machine failing to carry direction
  into work.'
