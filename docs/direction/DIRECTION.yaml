thesis_read: 'The baseline comparison went from ''below, cause unknown'' to ''inside the noise'', and that is progress, because
  it is the honest answer. Re-run per weighted win against a count-matched cull52 on the run''s own campaign, the company''s
  per-customer book (B) is inside the flat-rule blind span on revenue, net and net after cost to serve. Against cull52 it
  is +14.6 per win on net. Its 174-per-win deficit against cull57 was that cull''s own sampling error: the two uniform culls
  differ from each other by 189 per win. Its bad debt is 37.7% below the span (0.8 SE). The gross gap decomposes exactly into
  tenure, volume and margin rate, and weight-fit error is ruled out. That result is gated but still mid-landing, not on origin.
  So on this book per-customer is neither beaten by flat nor shown to beat it, and only independent books separate them (the
  director''s EP17 row). The thesis''s real question moved somewhere sharper. The company''s payment score DOES reach a decision,
  but the wrong way round. It lifts a debtor''s churn belief past the offer threshold, and the retention guard then prices
  the debtor as if they pay, so retention money flowed to the worst payers. That is inference that transfers value instead
  of creating it. The netting lands behind a flag, and its on/off arms are running now. The world moved too. W1_29 reached
  level 1 at last (f3f599ec6). The bedtime is shown to be contradicted by GB diaries, with no replacement published. The awake
  window now crosses midnight (00:00 from 0.11 to 0.39 of the active mean, against LCL''s 0.62), and appliance runs are ruled
  out as the remaining gap. PB4 R6 gives a woken default-tariff household its own elasticity (f71fcc176), but nothing in the
  world sends that contact yet, so engagement is separated from elasticity in code and still not in behaviour. Of the previous
  focus, three of four were drawn and all three did their work. The PB4 reconciliation was not drawn, and the 29%-against-13%
  disagreement still stands in front of grading R6. My 02:21 record never reached origin: the seat''s own landing was refused
  when origin moved twice under its gate, and nobody was told. 10 commits, 9 substantive, 1 an empty base-advance merge. Disposable:
  acff52923 (/var/tmp/se-draw-order) and bab878923 (/var/tmp/se-direction-seat), both locked to dead owners, both superseded.'
