thesis_read: >-
  Two of last stretch's four open errors are corrected, and I can show it. The publisher is LIVE:
  `.publish_gate_state.json` now reads `wedge_since: null`, `total_red: 0`, `episode_failures: 0`,
  `failures: []`, and figures reached origin 1.7 hours ago — against 36.1 hours dark and 34
  consecutive failures at the last orientation. W2_28's level claim is no longer resting on evidence
  outside the tree: `git cat-file -e HEAD:` confirms both
  `tests/architecture/test_a_coverage_claim_declares_what_it_reduces_over.py` and the cited
  `SEAT_FINDING_TWO_LANES_BUILT_W1_14S_ARTEFACT_CUT_TWICE...2026-09-07.md` are IN HEAD, and
  `level_current: 1` stands at HEAD with them. All four focus items were drawn and all four landed —
  the steer worked, which is the first stretch I can say that of. And the worse-than-chance cut
  reached the reader: `site/data/value_arms.json`'s `method_skill.fixed_horizon` now carries the
  estimand at 0.4210 against its own null of [0.4458, 0.5540] on n=161, p=0.0045,
  `inside_the_null: false`, with the sentence "the ranking is real and INVERTED", and
  `site/test_the_baseline_comparison_reaches_the_reader.py` gained
  `test_the_page_tells_WORSE_THAN_CHANCE_apart_from_WE_CANNOT_TELL`. So the machinery finally does
  what it was built for. What it says is the finding. Read the two arms of the same claim together,
  which nothing yet does: the pounds cut reports `selection_gbp` at a MEAN of -£426.96 across 3 seeds
  with a spread of ±£2,291.98, so the page correctly says it "CANNOT RESOLVE whether the per-customer
  choosing is worth anything at all, in either direction", and states that the price LEVEL accounts
  for 98% of the arm's £17,444 advantage over flat rules. The ranking cut, measured on the same
  claim by an independent route, reports the sign and reports it NEGATIVE at p=0.0045. Two cuts,
  different instruments, same direction — one lacking the power to say so and one having it. The
  honest thesis read tonight is therefore worse than "we cannot tell": on the only cut with the
  power to resolve it, the per-customer choosing is anti-correlated with the outcome, and the pounds
  cut agrees in sign while being unable to prove it on three seeds. That is a refutation of the
  advantage claim, not of the method for finding it, and the difference matters — the baseline
  exists, the null exists, the estimand is pre-registered and the world was able to defeat us, which
  is the machine working. Behind it sits a fidelity fact that contaminates every pounds figure above
  and that nothing has followed up: `departure_level` shows the world's own switching at 23.96% to
  40.98% against published bands of 13.5%–23.0%, OUTSIDE the band in every single year, by up to 37×
  the band's own width — while two BLOCKING findings filed two days ago say the band artefact is
  itself refuted by its own publisher in 8 of its 10 years. Nobody has asked which side is wrong,
  and until someone does, every pound on that page was earned in a world whose customers leave twice
  as readily as the record says they did.
