focus:
  - id: the-ahead-leg-is-filled-automatically-and-drained-by-hand
    what: >-
      Close the instance, then close the class. INSTANCE: run `python3 -m
      background.origin_reconcile` from a copy of the repo checked out AT origin/main — never from
      this checkout — until `git merge-base --is-ancestor origin/main HEAD` is true; the door that
      unblocks the daemon liveness commit on the local side (f1791deca, "a receiptless commit is a
      hook-GATED commit") exists only on origin, so the checkout's own code cannot promote its own
      ahead leg and three stretches have now proved it. CLASS: `background/reconcile_watch.py`
      contains no merge, no push and no reference to `origin_reconcile` — wire its existing
      five-minute tick to call `background.origin_reconcile`'s isolated-worktree merge leg when the
      tree is diverged, log the rc, and add the control to `tests/background/test_reconcile_watch.py`
      that reds when the diverged branch reports without acting. Do not mint a new timer — that
      file's own comments say why — and do not bypass a gate. THE PATH DOOR WILL SAY "nothing to
      land" ON THIS ITEM AND IT IS RIGHT AND IRRELEVANT: `reconcile_watch.py` is identical to HEAD
      because the merge leg has never been written. A clean file is this item's premise, not
      evidence its ask is spent.
    why: >-
      The publisher has refused 51 times over 71.7h and a reader's figures are 74.1h old, and the
      reason is not a broken door but a missing drain: the heartbeat's push fails rc=1 every one to
      two hours while nothing on the box is trying to merge. Finished when `contains_origin` is true
      and STAYS true across the heartbeat commits that follow it, with no hand-run door in between.
      A one-off close is a refutation of nothing; the generator is the subject.
  - id: the-page-does-not-say-it-is-behind
    what: >-
      Build what OPS8_last_known_good_staleness_banner names — a dated last-known-good banner on
      `site/index.html` — and write the control that would grade it, which is why that atom is
      ungradable at level 0 rather than merely unbuilt. The data is already in the feed and
      unrendered: `site/data/tick_heartbeat.json` carries `content_publish.published_age_seconds`,
      `as_at_utc` and `publisher.state: failing`. Render the publish age and the failing state on the
      page, and re-derive `stale_after_seconds` from the publish cadence rather than leaving it at
      eight days. Control goes in `site/`, keyed to the property — a feed whose publish age exceeds
      its own cadence must produce a visible banner — and prove it can fail by feeding it a fresh
      age and a stale one.
    why: >-
      `stale_after_seconds` is 691200 — eight days — while the publisher has been failing for 71.7h,
      so the live page reads perfectly normal through a three-day outage and will keep doing so for
      four more. That is a fail-open on the surface, against this project's own rule that "we cannot
      tell" belongs on the page and not in a footnote, and it is why a 74-hour dark publisher can
      only be discovered by a seat reading a brief. Finished when the deployed page states its own
      publish age and the control reds on a stale feed.
  - id: nothing-can-tell-a-working-boot-stamper-from-a-dead-one
    what: >-
      Close the open half of
      `docs/staging/SEAT_FINDING_THE_DECLARED_BOOT_STAMPER_HAS_STAMPED_NOTHING_SINCE_2026_09_04_SO_NO_DAEMONS_CODE_VERSION_IS_KNOWN_2026-09-24.md`.
      Check its second pre-registered prediction first — one `stat` on the stamp files against the
      next unit start, which either confirms or refutes arm 2 before anything is built. Then make a
      dead stamper distinguishable from a working one: `ExecStartPre=-/usr/bin/python3 -m
      background.boot_sha <session>` in `background/*.service` silences every failure by design (the
      `-` prefix is asserted at `tests/background/test_boot_sha_deployment.py:222`), and the stamping
      and restarting populations are disjoint so the signal goes dark by construction. Decide
      whether the `-` goes or the absence is reported somewhere something reads, and prove it by
      breaking the stamper deliberately and showing the refusal surfaces. The path door reads this
      item as "nothing to land" because the only path its prose names is the finding itself; the
      work lands in `background/*.service` and `background/boot_sha.py`, and the prediction check
      lands nowhere at all because a `stat` is a reading.
    why: >-
      This is the instrument for the exact class that item 1 is an instance of. R2 — committed is
      not running — is what just cost 74 hours of publishing, and the boot stamp is the only thing
      that would say which code each of the eleven daemons is actually executing while this checkout
      sits 37 commits behind. It has been carried open for two stretches because its write-up reads
      finished; the half that matters is untouched. Finished when a deliberately broken stamper
      produces a refusal in a place that is read, demonstrated rather than argued.
not_now:
  - what: >-
      The `sanity-daemon` mute with no cause on file — the one thing the brief's daemon section
      actually asks for.
    why: >-
      It is an instrument about an instrument, and the four causes already established prove a class
      verdict would be wrong, so establishing a fifth costs a whole turn and moves no level and
      closes no blocking finding. It loses to a publisher that has been dark 74 hours. Deliberately
      rejected rather than silently dropped; if it is still mute next stretch with the fork closed,
      it ranks.
  - what: >-
      The `git restore --source=stash` class — a recovery sweep that reports a genuinely lost file
      safe, because `git diff --quiet HEAD -- <path>` is quiet for an untracked path whatever its
      content.
    why: >-
      Rejected for the third stretch, and for the same reason: it guards a manoeuvre that is already
      a never-do, so its expected value is a second-order safety net on a forbidden path. It loses
      to the drain and to the banner. It stays in `wrong` as uncorrected so that nobody reaching for
      a recovery sweep trusts one.
  - what: >-
      Collapsing the alarm family — 14 of the 37 files in the staging root are
      `WORKER_FINDING_REPEATING_ALARM_*`, and a filed finding says the family mints eight distinct
      names a week, clears one, and its collapse tool has never been run.
    why: >-
      Compelling and still tidying: it makes the queue readable without making anything true, and
      most of those fourteen alarms are downstream of the fork this direction is closing — expect
      several to clear themselves when `contains_origin` turns true. Collapsing them first would
      destroy the evidence that item 1 worked.
  - what: >-
      Resuming company work directly — the baseline-to-beat book run, per-customer LTV decisions,
      or draining any of the 26 ungradable atoms owing a repair.
    why: >-
      This is the thing I most want to choose and it is the one I can least afford to: with the
      publisher refusing and 28 atoms ungradable, any company result produced this stretch reaches
      no reader and can be graded against no map, which is how "it performed well" comes to mean
      nothing. Items 1 and 2 buy exactly that back, and the next direction should be company work
      or it is a failure of this seat.
