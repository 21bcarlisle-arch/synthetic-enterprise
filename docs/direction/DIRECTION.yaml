thesis_read: 'Forward on the supplier side, but it cannot yet show it beats the flat baseline, and one control on
  that baseline was found to prove nothing. 15 commits, 6 substantive. The brief splits them 0 supplier, 1 world,
  2 both, 12 other. That undercounts the supplier: most of the ''other'' commits were supplier grades and records.
  Four supplier results moved. (1) B12 recorded L1 (455adef1a): writer one''s renewal floor is built on the unit
  rate, with all three clauses reached from the run and each control mutation-proven. That is the stretch''s only
  level move. (2) B8 Q8 (ee995aadc): the run''s retention holdout now decides on expected value under a published-trial
  prior, as canon C8 rules (''build what you offered''). It is the first decision in the run that infers from published
  evidence rather than from a flat rule. At the founders'' scale the company''s own rows carry at most 0.002 of
  the weight, so the prior decides alone, and only 3-4 of 92 offers pay. (3) D48 (8902ff50b, 59ee65caf): the annual
  DD review now seeks the balance it finds by default, and it never seeks a balance its own rule already adds. (4)
  C35 graded R1-R4 CONFIRMED in its prereg: it rises 109 of 144 refused 2019 renewals, every rise inside the default''s
  headroom, and the book is unmoved. Its engine caller is in surgical_land now (pid 847333). When that lands, every
  per-customer save, advice and retention decision has a production caller, behind switches that default off. What
  that means is the thesis''s hard part. The machinery exists, and it decides almost nothing: C34 advises 4 of 972
  renewals, the retention guard offers 9 times where it used to offer 92, and the median renewal still reads -GBP
  3.91 a month for a reason nobody has measured. The previous item 2 was refused 49 times, because C35''s own worktree
  holds the file that item only reads. Worse for the comparison the thesis needs, the flat supplier''s reachability
  control has been unfalsifiable on origin since c61d8b608: both arms make 0 offers in 2016, so a flat arm leaking
  offers would look identical. A baseline whose control cannot fail is not yet a baseline to beat. Two corrections
  landed. The -GBP 100k net-margin move my last record carried as unattributed was two clocks differenced, provisioned
  against realised bad debt, and like for like the book moved +GBP 148 (cd1f976c7). And the Lane 0 re-issue of C35
  and B12 worked: both were drawn, which corrects the seat''s atom-id steer. The budget''s second seed holds every
  band (b8045dd4e). Its default flip is under test, and the BLOCKING crisis bad-debt finding now waits on the first
  published run with the switches on. The previous focus reached the draw for 2 of 3 items. B12 is done and drops
  out. C35 is mid-landing, so it leaves focus as in hand. The -GBP 3.91 measurement comes back first.'
