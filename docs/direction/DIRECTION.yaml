thesis_read: >-
  THE STEER BIT, AND TWO PIECES OF THE THESIS MOVED. THE DIRECTOR HAS NOW SET A NEW ORDER, AND IT DECIDES
  WHAT COMES NEXT. Four of last record's five focus items were drawn, and three finished. EP13 is parked at
  s43 with its findings kept in a knowledge note (de323eb13, f98a30805, d11cadc56). G14 now uses NESO's
  published series from 2018-05-11, with Elexon fuel mix at NESO's own factors before that, aligned to
  settlement (09e2bf07f). Its futures are fitted on the wind, solar and demand the world makes, on today's
  fleet, and graded on a year the fit never saw (bb7c45646, 4059a392b). For carbon, that replaces
  reconstruction with the series a real supplier would actually have. G14's row still reads L0, so the
  level is owed and not yet earned. C29 has its frame (5ce4ce27d): eleven company decisions are still
  lookups. Its first build (635bd7dfd) is the first thing this stretch that speaks to the thesis itself.
  A per-account engagement estimate, using only what the company can see, ranks the world's hidden trait
  at 0.73, against 0.19 for the channel alone. That is inference, not access, and it is graded against
  ground truth the company never touches. It is not yet value. No decision reads the estimate, and the
  flat baseline is still not beaten on this book. Last stretch's attribution stands: on a fixed world the
  rule's edge does not move. C29's retention follow-up is being landed now (surgical_land pid 4084498).
  The unmerged-work guard fix exists as c73db7751, but only in a locked worktree owned by live worker
  2946775, and is on no remote ref yet. So the guard row stays open, and PB5, the one undrawn item, is
  still exposed to the guard. The shared checkout is now 36 commits behind origin, up from 23, so
  reconcile-watch is falling further behind, not catching up. The heartbeat steer resolved as a
  measurement: the separate daemon checkout is not needed now (3cc1281c4). That commit sits
  landed_unbound in the draw ledger, which binds the instance but not the in-hand-without-a-claim class.
  At 02:24Z the director issued DIRECTOR_CANON_THE_PRIORITY_ORDER_2026-10-05. It supersedes the
  4 September re-ranking: (1) knowledge, wide and in parallel; (2) unbilled energy and billing accuracy;
  (3) forward CLV tested on held-back history; (4) per-customer decisions alongside; (5) the levers;
  (6) forward simulation; (7) communications and NPS last. I agree with it and am not asking him. One
  consequence is worth stating. Step 3's test of forecasting from earlier years and checking against
  later ones needs only ONE book. EP1's CLV has been blocked at L2 waiting for a second book, so step 3
  gives the CLV spine a falsifiable test on the book we already have. His open EP17 row, which separates
  per-customer pricing from a flat price across books, stays a different question. So this record drops
  the in-flight finishing items, which their holders are already landing, and turns focus to his four
  work items. Knowledge comes first because it runs in parallel and steps 2 and 3 rest on it. Then atoms
  for steps 2 and 3, then a measured check that the draw follows the order: on 4 September the dials
  moved and the work did not. 13 commits, 9 substantive, 2 no-work merges. One worktree commit is on no
  remote ref (the guard, held by its live owner). No long job launched or died.
