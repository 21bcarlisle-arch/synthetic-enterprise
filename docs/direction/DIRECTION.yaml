focus:
  - id: land-the-stranded-arrears-lines-with-the-decision-fields
    lane: A_strategy_governance
    what: >-
      Three paths hold item two's built, unlanded instrument in the shared tree:
      simulation/arrears_engine.py, tools/run_value_cycle_ab.py and
      tests/tools/test_the_arrears_lines_reconcile_each_accounts_net_to_the_penny.py. Its
      surgical_land (pid 837396) exited at about 20:20Z with no commit on any ref. First check
      that no process holds those paths. Then read why the land failed. Do not rebuild the lines.
      Next, add the two fields b6a21c885 names to noise_floor's per-seed row:
      renewal_decisions_by_arm (customer_id, commodity, term_start, declined,
      chosen_margin_gbp_per_mwh and offered_rate_gbp_per_mwh, for every value_arm_log row in both
      arms) and decided_differently_by_account. The second field joins the two arms on
      (customer_id, commodity, term_start). It counts renewals whose offered rate differs, or
      where one arm declined and the other priced. It counts renewals present in only one log as
      their own roster category. Grep for a per-account retention-action log before adding
      anything for retention. If none exists, name that absence in the commit. Mutation-prove the
      penny reconciliation control and a control that decided_differently counts a known
      differing pair. Land with tools/isolate_hunks.py plus surgical_land --content, because other
      lanes edit this tree. Then bind the commit with delivery_lane --landed.
    why: >-
      The thesis question now has an instrument design and no instrument. Built work that never
      leaves the tree is worse than work not started, because the ledger reads it as drawn. The
      decision fields are what turn "+£880 on priced accounts" into either "on accounts the arms
      decided differently" or "not". DONE when one commit on origin/main carries the arrears lines,
      both decision fields and their mutation-proven controls, and the three shared-tree paths are
      clean.
  - id: grade-the-plus-880-at-head-on-accounts-the-arms-decided-differently
    lane: A_strategy_governance
    what: >-
      Once item one is on origin, write a SEAT_PREREG_ at that commit before launch. It must
      predict four things. First, the share of the priced-set value-minus-level (excluding
      PROS-2016-0098) that sits on accounts with at least one differing offered rate. Second, the
      count of such accounts per seed. Third, 875322e5a's prediction that 0098's arrears line
      grows past −£5,659.81. Fourth, whether 0098 still leaves at different dates in the two
      seeds. Then run seeds 11111 and 88888 with leg 4b at its HEAD default. Launch with
      tools.launch_long_job under setsid, and wait with tools.wait_for --pid. Launch nothing while
      another value-cycle run holds memory. Grade in a SEAT_RESULT_ beside the prereg. Report
      value-minus-level on the decided-differently set and on the decided-alike set. Give an exact
      binomial bound on each count. Give a sign test across the differently-decided accounts.
    why: >-
      This is the first measurement that can say whether the per-customer arm's edge comes from
      what it decided, which is the only thing the thesis credits. It also moves every graded
      figure off fcba478b7, which predates the held-bill and credit-netting rules that make up the
      one account the sign hung on. DONE when a SEAT_RESULT_ at a named origin commit grades every
      prereg line. "We cannot tell at n=2" counts as a legitimate grade if it is stated with the
      counts.
  - id: the-heartbeat-publisher-stops-committing-what-deploys-nothing
    lane: H_harness
    what: >-
      Change the heartbeat publisher in background/process_run_complete.py
      (_refresh_published_liveness_on_skip) in two ways, per 7a97d25a8's handed-on section. First,
      it must not commit when its change set touches no site/ path. 54 of 136 heartbeats over 7
      days changed only docs/observability/agent_status.json, and no reader of that file reads git.
      Second, it must not commit onto a tree its own log already reads as behind origin. 40 of 136
      needed a reconcile merge. Each refusal must name its reason in the publisher's log. Write one
      partition control asserting that the publisher CAN still commit, and can skip for each of the
      two reasons, before asserting what each branch does. Mutation-prove it.
    why: >-
      Heartbeat commits are not the cause of reconciler lag, as 7a97d25a8 showed. They are still
      most of the no-work commits the brief flags every stretch, and each one pays a full hook
      chain. The freshness banner is the only reader that needs a commit, and it needs one only when
      site/ changes. DONE when heartbeat-only commits that touch no site/ path stop appearing on
      origin, and the public freshness banner still advances.
