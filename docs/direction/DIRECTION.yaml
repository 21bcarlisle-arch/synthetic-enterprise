thesis_read: 'The thesis''s comparison has now been run across the whole range of uniform cuts, and in this world the honest answer is a tie. 4320ae6a5 graded the
  learned retention decision over cuts of GBP 2.5-30/MWh at both margin ends. No cut pays. The learned rule cuts for nobody and matches cut-for-none, the best flat
  rule, to the penny. 187b6c43c then sourced the real slope: the world''s 0.0006 of staying per GBP/yr is inside the published range, and nothing published reaches
  break-even for a uniform cut. So the world is not too stingy. A uniform renewal cut is simply a transfer to people who would have stayed anyway. Inference finds
  the best flat rule, and there is no room for it to beat that rule within this frame. Any room is in targeting, a save offer made to a household seen leaving. That
  is the director''s open b8 row. Its factual half (does a GB supplier see the leaving signal in time, and may it act on it) is knowledge we can source without him,
  so it is focus two. The world pressed back twice, and both corrections were honest. 212c6396a reads post-write-off recovery from the register (12.2p per GBP). Net
  bad debt rose 5.7%, as pre-registered. The price-cache audit (78fdb9538, 81fb2975f) found two origin results settled on a short Elexon price set. The 61003 debt-objection
  prediction that had held was an artefact of the missing prices, and it is refuted on correct prices, with the correction beside the claim. The director''s run review
  was done in his order. 27 runs over an hour last week, and none would have passed. That rule is now enforced at launch. Fabric traces are forked (15-40% faster
  on a small run), weather is shared per cell, and every run logs its cost per leg-year. The 3,400-line run function is named as structural debt. Two things went
  backwards or stalled. First, the settled-book finding from last stretch''s focus one was written at 01:04 and never landed. Its claim was swept. It says the book
  tops out at about 280 accounts because the funnel runs dry, not because of compute, and that the live path costs 2.7-3.1 MB per customer-year. But the founder-ceiling
  proposal that reached origin at 01:54 sizes memory on the founders-only 1.11 MB per customer-year. Two documents disagree about a number the director is being asked
  to act on, so that is focus one. Second, W2_20''s value-arms pair failed its own coherence test (H2). The leg-1 value advantage of GBP 5,134 sits outside its own
  floor band of 7,970-12,965. The placebo meant to diagnose that died in five minutes on its own design: it asked for a noise floor from one seed, which noise_floor
  refuses. So the baseline the thesis needs is not yet a number to publish. Its continuations are queued and a worker is on the value-arms tests now. Machine: last
  record''s 23:58 direction reached origin (1caaec35a), which corrects the carried 17:22 row. The brief again read the director''s concerns from a checkout 15 behind,
  and it omitted b8-no-uniform-renewal-cut-from-2, which origin holds. It is carried here. The b8 curve focus row was tombstoned at 00:20, 32 minutes before its work
  landed. The checkout is 0 ahead and 15 behind, and nineteen units run code lacking 78fdb9538. acff52923 in /var/tmp/se-draw-order is still disposable, as recorded.
  16 commits, 8 substantive.'
