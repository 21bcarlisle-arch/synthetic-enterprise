  lane: D_billing_metering
  side: supplier
  what: 'Build choices C1 to C3 of docs/market_research/a_gas_read_is_a_volume_and_the_bill_converts_it.md,
    citing that page. C1: the world''s gas meter registers volume (V = kWh x 3.6 / (CV x 1.02264)), with
    an imperial path, and only the volume crosses company/interfaces/sim_interface.py. The seam change
    goes through the interface-steward role. C2: the supplier converts it as billed kWh = V x 1.02264
    x CV_period / 3.6, truncated per R5, and marks its CV as a fixed stand-in on the record until G1 lands.
    C3: the gas bill and page print the volume, its unit, the CV and the correction factor beside the
    kWh. Grade INV_GAS_READ_IS_A_VOLUME_CONVERTED_AT_CV_AND_CF red-then-green on the 3dc5a92948 ledger.
    Write the page''s prediction as a pre-registration for item 3''s run: gas energy down about 0.13%
    on average, and never more than 0.26% on any bill. Land the code; do not launch a run.'
  why: N11 is one of the two new classes that keep leg three open. A supplier converts a volume, and a
