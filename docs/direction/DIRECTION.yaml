thesis_read: >-
  This stretch had 26 commits. 6 were substantive (supplier 2, world 1, other 23), and 6 were merges that changed
  nothing, three of them in a row. No level moved. Against the thesis the project stood still, and its one live test
  is no nearer. s.12g asks whether per-customer inference beats the flat-rules twin out of sample. It died at 12:20Z
  on the EP4 dunning class: a reminder sent to an account in credit. Since then nothing has been written to fix that
  class (no commit has touched company/billing/collections_journey.py since 15 Nov), so the advantage still reads
  -GBP 0.33 (-1.77 to +0.96), in sample. Two things were corrected, with the evidence on origin. 0efa633c1 landed
  the key-register control that had been stranded on salvage 6f87ccb38. 59cd5ebda made one supplied-roster union in
  saas.customers, read by every reader in the annual report, with a control on ACQUIRED_CUSTOMERS, which closes the
  class that killed b1c7d76b16 and, on 8 Oct, the OCC-* book. The book started from 35316f9395 before that fix died
  the same way (KeyError 'SYN-2016-144_3'), as predicted. The machine's own throughput is still the binding
  constraint, and this stretch it was mine. My 12:23Z record was refused because one focus item pointed at another by position, so origin
  kept the 09:55Z steer for six hours, and the EP4 fix it named was never handed to a worker. From 14:15Z the
  executor stood down every tick with "no unclaimed focus item", although two of origin's focus items
  (supply-a-win-from-a-gas-only-household-as-gas and a-bounded-turn-cannot-start-a-landing-it-cannot-outlive) had
  landed nothing. Why it read them as claimed is not established. No book has been built for 48 hours. The roster fix
  has been on origin since 13:03Z, but sim-runner has deferred every cycle since 14:45Z to profile-book-run-cprofile,
  a cProfile of the book run itself. That job declared 11,200 MB, is using 3.5 GB, and is in April 2020, so it should
  end around 17:00Z. One continuation, d48-grade-the-first-book-built-with-the-blend-at-0-5, is held on
  run_output_35316f9395_20261122T122055Z.json, a book that died, so it waits on a file that can never exist: the same
  defect as b1c7d76b16 on 22 Nov morning. The focus, in order: the EP4 class fix and the s.12g re-launch as the
  thesis test; the B8 blind holdout the director ruled yes at 07:48 GMT; re-arming what waits on dead books; reg 6C
  and gas-only supply (world, with the result it unblocks named); then the teardown hand-off. Three items are
  supplier or feed a supplier grade, one is world, and one is harness. No relative wording is used, so the record
  reads the same on both /harness/ anchors.
