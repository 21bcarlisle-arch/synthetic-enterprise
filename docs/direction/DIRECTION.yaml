      that are in no commit. Read them, say whether they are finished or abandoned, land or discard
      before adding to them. Then work steps 1 and 2 of
      `docs/staging/SEAT_FINDING_THE_LEVEL_IS_CLAMPED_AND_THE_MECHANISM_UNDER_IT_IS_COMPRESSED_NOT_
      MISDIRECTED_2026-09-03.md`. Step 1 is knowledge, not code: establish what published evidence
      gives for the HOUSEHOLD-level amplitude of switching response, at the two sources that finding
      already names - Ofgem Retail Market Indicators read FROM THE DATA TABLES, PER FUEL, and the
      Ofgem Consumer Survey's switching-by-engagement-segment breakdown - and file the result in
      `docs/market_research/` whether or not it settles, because "a segment-level dispersion is not
      a household-level one" IS the finding if that is what the tables give. Do not re-run the
      generic search: the gap is already declared twice, in `docs/institutional/knowledge_map.md`
      and in `docs/market_research/continuous_behavioural_engagement_w2_14.md` §3a. If the published
      record does not settle it, send ONE NTFY question to the director as the practitioner side,
      carrying a recommended default - never invent the constant. Step 2 is then repairing the
      compression in `market_switching_multiplier` / `market_opportunity` against whatever was
      established, measured by re-running the one-constant sweep in §3 of that finding. Step 3,
      retiring the per-year anchor table, is explicitly OUT of scope.
    why: >-
      This is the only one of twelve BLOCKING findings that is about the world rather than the
      machine, it has been open since 2026-09-03, and nothing has touched it in two stretches. The
      world's departure level equals the published rate to four decimal places in all seven fitted
