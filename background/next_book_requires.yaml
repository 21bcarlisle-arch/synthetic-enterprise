# until skip0/skip1 read). Graded against
# docs/staging/records/SEAT_PREREG_W3_3_WHAT_THE_SPLIT_MOVES_PER_DOMESTIC_ELECTRICITY_ACCOUNT_DAY_2026-11-18.md.
- commit: c71d2521d
  what: W3_3 network split per kWh and per supply point per day (years/<y>/network_cost_gbp falls 1-9% 2017-2025)
  owner: W3_3_the_network_charge_splits_per_unit_and_per_day
