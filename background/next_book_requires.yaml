# 18 Nov: a deleted tree, then a book admitted 34 min before the row that would have held it. This row
# holds EVERY book until both control files exist; the step that grades skip1 deletes it, so the W3_3
# book above builds next, alone.
# REVERSE: delete this row (and its comment); books then admit on the rows above alone.
- commit: null
  what: skip pair read (/var/tmp/vts-out-skip1/control_11111_22222.json and /var/tmp/vts-out-skip0/control_11111_22222.json)
