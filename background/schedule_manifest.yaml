# Schedule / service manifest — the committed declaration of OS-LEVEL scheduling and services.
# OPS1 sub-step 3 (G-L2 applied to scheduling), docs/design/OPERATIONAL_LAYER_DESIGN.md §5.
#
# The mandate's canonical violation was "tonight's invisible cron that resurrected a broken
# stack" — an OS crontab entry nobody reading the repo could see. This manifest makes OS-level
# scheduling/services DECLARED in git, and background/schedule_reconciler.py reconciles the
# machine's ACTUAL crontab + systemd units against it: ANY undeclared crontab line or SE systemd
# unit is flagged as drift. The invisible-cron class is now structurally detectable, forever.
#
# EVERY non-trivial entry carries its `reason` (reason-with-state rule; IaC).
version: 1

# Declared user-crontab entries. EMPTY BY DESIGN — nothing is scheduled via hand-run `crontab -e`.
# The stack is started explicitly (start_worker.sh); periodic behaviour lives IN the daemons
# (committed code), not in cron. Any crontab line not listed here is UNDECLARED drift — the
# exact invisible-cron the blackout came from.
cron: []

# Declared systemd (--user) units owned by synthetic-enterprise. install_schedule.sh installs
# each from its committed unit_file (reconstruct-from-repo), so the machine's service config is
# reproducible from the repo alone.
systemd_units:
  - name: file-api.service
    unit_file: background/file-api.service
    enabled: true            # boot-start
    active: true             # must be running
    health: "http://localhost:8765/health"
    reason: >-
      file-api is DIRECTOR-ACCESS INFRASTRUCTURE, not an autonomous-company daemon: it serves
      the director independent of whether the stack is up, held, or torn down (2026-07-17: stack
      fully down, file-api still his phone-only bridge). It must be the most resilient thing on
      the box — boot-start + Restart=on-failure — because its death strands him exactly when
      he is phone-only. The split model (systemd for this, tmux for the stack) is principled,
      not messy. Owning it here is why it is NOT in process_manifest.yaml.

  - name: boot-announce.service
    unit_file: background/boot-announce.service
    enabled: true            # boot-start: fire once on every boot
    active: false            # Type=oneshot — runs, reports, EXITS; inactive(dead) is correct, not UNIT_DOWN
    reason: >-
      OPS1 sub-step 4, G-R3 (reconcile before act). A oneshot that on every boot reconciles the
      declared set (process_manifest + this manifest) against actual and sends ONE boot NTFY
      BEFORE any autonomous work advances — so a boot state is a stated single transition, never
      the silent "cron resurrects whatever was there" mask the blackout came from. Report-only:
      it starts/stops/reaps nothing (G-R4). enabled (boot-start) but active:false because a
      oneshot exits after running — flagging it UNIT_DOWN would be wrong.

  - name: reconcile-watch.service
    unit_file: background/reconcile-watch.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — runs one reconcile pass and EXITS
    reason: >-
      OPS1 sub-step 4: the drift CONTROL made LIVE. The oneshot the timer fires — reconciles
      declared-vs-actual and pages ONLY on a drift transition (R5), report-only (G-R3). Not
      enabled/active itself (the .timer drives it); flagging it down would be wrong.

  - name: reconcile-watch.timer
    unit_file: background/reconcile-watch.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — a drift control that isn't scheduled is fail-silent (R15)
    reason: >-
      OPS1 sub-step 4: the SCHEDULE that makes the reconcile a real control instead of theatre.
      boot_announce runs the reconcile once at boot; between boots drift was UNWATCHED — the exact
      gap that let a live worker-seat declared `held` produce no HELD_VIOLATED (2026-07-17). This
      timer fires the reconcile every 5 min so drift is loud within minutes, not at the next boot.
      active:true because an un-armed timer is a control that never runs.

  - name: deploy-restart.service
    unit_file: background/deploy-restart.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — performs one deployment pass and EXITS
    reason: >-
      G-D2, the ACT half of deployment, unbuilt from the operational layer's design until
      2026-09-04. G-D1/G-D3 (boot-SHA stamping, import-closure drift, the reconcile-watch report)
      were built and correct, and reported for days that ten of eleven daemons held changed
      modules — sim-runner 145 of them — with nothing acting on it. Deliberately NOT folded into
      reconcile-watch, which is report-only by design and pinned there by
      test_the_drift_check_never_restarts_anything: reporting and acting are different guarantees.
      Restarts only daemons that host no interactive session; session hosts are DEFERRED to an
      observed turn boundary, never restarted mid-work.

  - name: deploy-restart.timer
    unit_file: background/deploy-restart.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # an un-armed deployment step is the gap it exists to close
    reason: >-
      The schedule that makes G-D2 real rather than a thing a seat remembers to run. 10 min rather
      than the reconcile's 5: this one ACTS, and a wider gap keeps a landing and its restart from
      racing a gate mid-run. Standing authority, director 2026-09-04 — "restart any daemon that
      does not host the interactive session whenever its loaded code is behind disk ... and build
      that as a mechanism rather than remembering it."

  # ── Scheduled bounded invocations — the continuity transport (SCHEDULED_BOUNDED_INVOCATIONS_DESIGN.md)
  # DARK until the director-run cutover (background/cutover_to_scheduled.sh --apply). Declared here so
  # reconcile SEES them; enabled/active:false = installed-not-armed, which matches reality pre-cutover.
  # At cutover these flip to enabled/active (committed as the IaC record) and worker-seat-manager is
  # retired. This replaces the persistent stop-hook-rearm seat, which failed three ways in ~30h
  # (input-blocking / death-on-API-error / token-burn at rest).
  - name: worker-tick.service
    unit_file: background/worker-tick.service
    enabled: false           # Type=oneshot fired by the timer/path — never boot-enabled itself
    active: false            # oneshot: inactive(dead) between ticks is correct, not UNIT_DOWN
    reason: >-
      The bounded-invocation check: cheap Python (origin-sync + find_work) that spawns ONE
      `claude -p` worker ONLY when there is work, and exits at ~0 tokens at rest. DARK until cutover
      (enabled/active:false = installed, not armed). Not enabled/active itself — the .timer and .path
      drive it; flagging a oneshot down would be wrong.

  - name: worker-tick.timer
    unit_file: background/worker-tick.timer
    enabled: true            # LIVE (cutover 2026-07-20): boot-start, WantedBy=timers.target
    active: true             # LIVE: armed — an un-armed continuity timer is fail-silent (R15)
    reason: >-
      The wake backstop + origin-staged-doc path, at 30 min since 2026-08-24 (was 60s to 08-22,
      4h over the weekend stand-down; the timer file carries the full reasoning and the test that
      decides whether it goes back to 60s). LIVE since the 2026-07-20 cutover. This is the
      continuity heartbeat's replacement: level-triggered (did the timer fire?) instead of the
      edge-triggered stop-hook re-arm that could not stay alive (3 failures in ~30h: input-block,
      death-on-API-error, token-burn). Independent of worker-tick.path (R15: either trigger alone
      still wakes).

  - name: worker-tick.path
    unit_file: background/worker-tick.path
    enabled: false           # STAYS DOWN 2026-08-24 — the wake it provides is the publisher's own
    active: false            # marker, not a staged doc. See the reason block.
    reason: >-
      The fast local-staged-doc wake (~seconds vs the timer). LIVE from the 2026-07-20 cutover until
      2026-08-22, STOOD DOWN for the weekend at 94% weekly allowance (director: "conserving is now
      the priority over shipping"). WHY THIS AND NOT THE TIMER ALONE: this unit is PathModified on
      docs/staging, and sim_runner.py drops a run_complete_*.md marker there every publish cycle
      (~25 min), so leaving it armed would have re-triggered the tick on the publisher's own
      heartbeat and the timer's 60s -> 4h change would have bought nothing. Slowing the timer only
      works if this is down too; that coupling is the whole reason both moved together.
      The R15 redundancy argument is UNCHANGED and is what makes this safe to stand down rather
      than delete: the two triggers were always independent, so the timer alone still wakes the
      tick, now every 4h instead of within 60s. That longer worst-case staged-doc latency is the
      accepted cost, and it is a latency cost only — nothing is dropped, because the timer tick
      runs _sync_origin_staging and re-globs the whole staging dir, so a doc staged at minute 1 is
      picked up by the tick at minute 240 rather than missed.
      Publishing is NOT affected either way: process_run_complete.py is driven by sim_runner.py,
      which spawns no model and does not route through the tick.
      NOT REVERTED ON 2026-08-24, and the weekend's own reason block above is why. This unit is
      PathModified on docs/staging; the only thing that modifies docs/staging on a cadence is
      sim_runner.py dropping a run_complete_*.md marker every ~25 min. So what this unit actually
      delivers is not "a fast wake on a staged doc" — it is the PUBLISHER RINGING THE WORKER'S OWN
      DOORBELL every 25 minutes, forever, whether or not any work exists. That was written down as
      a coupling to be managed on 2026-08-22; read again on 2026-08-24 against the fortnight's
      measurement (zero level moves on two full-cadence days) it is better named as one of the
      structures generating work nobody needed, and the director handed the machinery over that
      morning to change exactly this.
      WHAT IS LOST, stated rather than waved past: a genuine director-staged doc now waits for the
      timer instead of waking in seconds. That is a LATENCY cost only and it is bounded by the
      timer's 30 min — nothing is dropped, because the timer tick runs _sync_origin_staging and
      re-globs the whole staging directory. The ntfy responder writes staged docs to the same
      directory and is unaffected.
      REVERT, if the latency turns out to matter more than the treadmill:
      `systemctl --user enable --now worker-tick.path` and set both fields back to true. The
      honest fix, if it is ever wanted, is a path unit that ignores run_complete_*.md rather than
      one that treats the publisher's heartbeat as a doorbell.

  - name: daily-self-note.service
    unit_file: background/daily-self-note.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — runs one note and EXITS; inactive(dead) is correct
    reason: >-
      SM1 (SELF_MEASUREMENT_UNIFIED_DESIGN.md §1). The oneshot the .timer fires: computes the
      morning self-note from reused organs (git + gate_authorizations.jsonl) — verified autonomous
      work with the auto-process treadmill EXCLUDED, longest stall, and the R17 THE-TICK-NEVER-RESTS
      status (the director's standing morning ask) — and publishes it (note log + one NTFY). §2 HARD
      LAW: reader/publisher ONLY, NO path into the draw. Not enabled/active itself (the .timer drives
      it); flagging it down would be wrong.

  - name: daily-self-note.timer
    unit_file: background/daily-self-note.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — an unscheduled morning note is fail-silent (R15)
    reason: >-
      Fires SM1 once each morning (07:00 local) so the status arrives UNPROMPTED — the last open
      thread of the self-measurement steer. Idempotent per day + Persistent, so a catch-up replay
      after downtime still yields exactly one note.
  - name: delivery-seat.service
    unit_file: background/delivery-seat.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — runs one orientation and EXITS; inactive(dead) is correct
    reason: >-
      THE DELIVERY SEAT (docs/design/THE_DELIVERY_SEAT.md; director console 2026-08-25: "what you
      don't have is anything that ORIENTS"). The oneshot the .timer fires: reads the last stretch,
      judges it against the thesis, and writes ONE direction record. It is the third role on this
      machine — the tick EXECUTES, the seat works when a human GRANTS a turn, and this ORIENTS —
      and the job it replaces was being done by hand in a chat window.
      IT WRITES DIRECTION, NEVER CODE: `git add` takes background/direction.py::WRITE_SCOPE and
      nothing else, so anything its session touched outside those three paths is simply not in its
      commit. Its output MULTIPLIES the supervisor's dial weights and can never zero one, so a
      wrong or stale direction slows the machine and can never stop it (Rule 0). Not enabled/active
      itself (the .timer drives it); flagging it down would be wrong.

  - name: delivery-seat.timer
    unit_file: background/delivery-seat.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — an orienting seat nobody schedules is the chat window it replaces (R15 fail-silent)
    reason: >-
      Every three hours, twenty past. Not the tick's thirty minutes: orientation is not execution
      and a stretch has to be long enough to have a shape. The service's own skip rule (no
      substantive commit, no level move, no director input, no blocking finding, live direction
      still inside its window) means a quiet three hours costs one cheap read and NO model turn,
      so the real cadence is bounded by material change rather than by this clock — which is R5's
      rule and, separately, what the token budget requires.

  - name: seat-executor.service
    unit_file: background/seat-executor.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — runs one bounded turn and EXITS; inactive(dead) is correct
    reason: >-
      THE FIRST UNATTENDED WRITER IN THIS PROJECT'S HISTORY, armed 2026-08-31 on the director's
      instruction ("arm the executor and let the first tick run"). Where delivery-seat ORIENTS and
      writes direction but never code, this one WRITES CODE — bounded, one piece, in an isolated
      git worktree at /var/tmp/se-seat-executor.
      IT IS NOT A SECOND WRITER ON THE SHARED TREE, and that claim is held as a list rather than a
      sentence: `seat_executor.SHARED_TREE_WRITES` is exactly its own log and its own pid file,
      both under docs/observability/, asserted by
      tests/background/test_the_seat_executor_stands_down.py. Every code edit is in the worktree,
      lands through `tools.surgical_land` there, and reaches origin only through
      `tools.promote_worktree_landing`, which refuses anything carrying no verifying receipt — so
      "only gated commits reach main" is a property of the route rather than of this daemon's
      discipline.
      FOUR STAND-DOWNS, and running is what happens when it has run out of reasons not to: another
      executor already running; nothing handed off and no unclaimed focus item; work that
      duplicates a live claim (keyed on PATHS, because the duplication that actually happened was
      two writers choosing the same work under two different labels); and a live interactive seat
      holding a RE-DERIVED focus item — a handed-off continuation runs anyway, because a
      continuation is the seat deliberately giving that piece away and the seat that wrote it is
      nearly always still alive.

  - name: seat-executor.timer
    unit_file: background/seat-executor.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — a handoff mechanism nobody schedules is the drag it was built to remove
    reason: >-
      Every thirty minutes at :05 and :35 — off the worker tick's :00/:30 and off delivery-seat's
      :20, because three writers arriving in the same second is how a claim store gets read
      half-written. With nothing handed off it stands down on a cheap read and spawns no model
      turn at all, so the cost is bounded by how often the interactive seat actually hands work
      over, which is a deliberate act.
      WHY THE TIMER IS THE POINT: the handoff store existed for a day and was never once drawn
      from. Measured 2026-08-31 across the whole supervisor log, LANE 0 claimed 68 items and
      delivered ZERO — the escalation watchdog claimed each one and threw the doorbell away. That
      is fixed at the lane (delivery_lane.draw(claim=False)); this timer is the second consumer,
      and the one that can act on a continuation without waiting for a turn boundary.

  - name: head-green-census.service
    unit_file: background/head-green-census.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — runs one unscoped pass and EXITS
    reason: >-
      Answers the question no routine control was shaped to ask: is HEAD as a whole green? The
      per-commit gate selects tests by NAME STEM from the changed paths, and the operational
      check runs the complementary marker set, so on 2026-08-12 eight tests were failing at HEAD
      with every control green. Runs the publish gate's OWN marker expression and ignores, with
      NO -x — fail-fast is right for a commit gate and wrong for a health measurement, and that
      day it turned six findings into one. Report-only: pages on a DELTA against the committed
      baseline and changes nothing (G-R4). Not enabled/active itself (the .timer drives it).

  - name: head-green-census.timer
    unit_file: background/head-green-census.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — an unscheduled health census is fail-silent (R15)
    reason: >-
      Nightly at 03:30, Persistent so a box that was off overnight still measures once when it
      returns. Deliberately NOT per-commit: a 25-minute gate gets bypassed and hook-bypass is a
      wall, so the scoped commit gate stays exactly as it is and this covers its blind spot on a
      cadence instead.

  - name: edge-traffic-capture.service
    unit_file: background/edge-traffic-capture.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — one GraphQL POST and EXITS; inactive(dead) is correct
    reason: >-
      Snapshots Cloudflare's edge analytics into docs/observability/edge_traffic.jsonl. The zone
      is on the Free plan, whose GraphQL API REFUSES any query wider than one day — so the shape
      of what the edge has been serving exists for 24 hours and then stops existing. Its first
      use was disproving the claim that created it: a "29% 504 rate" turned out to be a phantom
      row Cloudflare logs for every HTTP/2 request, which is exactly the kind of thing you can
      only settle against rows recorded at the time. Not enabled/active itself (the .timer drives
      it); flagging a oneshot down would be wrong.

  - name: edge-traffic-capture.timer
    unit_file: background/edge-traffic-capture.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — an unscheduled capture of a 24h window is fail-silent (R15)
    reason: >-
      Hourly, and the cadence is set by the RETENTION rather than by taste: anything slower loses
      resolution inside the window the source can still see, and a gap over a day loses the window
      entirely. Persistent, so a box that was asleep still captures once when it wakes. Declared
      here 2026-08-20 after being found installed and armed but UNDECLARED — the reconciler was
      right to call it drift, and this manifest is the reason it could.

  - name: bill-validation.service
    unit_file: background/bill-validation.service
    enabled: false           # timer-triggered, not boot-enabled itself (static)
    active: false            # Type=oneshot — compares the whole book and EXITS; inactive is correct
    reason: >-
      Work item 5 of the independent-bill-validation brief (2026-09-02): "one account first, then
      every account on every run, scheduled ... and needs nobody present". Runs
      `tools.bill_validation_comparison` over every account in the billing ledger — 251 accounts,
      11,549 bills, under two seconds — comparing the curtained validator's reconstruction against
      the statement export and filing every difference. There is no sampling mode on its normal
      path on purpose: a validator with a coverage dial is one whose coverage becomes a decision
      somebody makes under time pressure. Report-only (G-R4): it writes one artefact under
      docs/reports/ and never touches the ledger it reads. Not enabled/active itself (the .timer
      drives it); flagging a oneshot down would be wrong.

  - name: bill-validation.timer
    unit_file: background/bill-validation.timer
    enabled: true            # boot-start (WantedBy=timers.target)
    active: true             # must be ARMED — an unscheduled validator is item 5 not done (R15)
    reason: >-
      Hourly, Persistent. The cadence is set by what moves: the billing ledger changes when a
      simulation run completes, which is several times a day and not on a fixed clock, so an hour
      bounds how stale the verdict can be. Declared here in the same commit that creates the unit,
      because the reconciler is what makes "item 5 is done" checkable rather than claimed — a
      validator that runs once is a demonstration and one that runs every cycle is a control, and
      the difference between them is entirely whether this timer is armed.
