# Declared process set — the SINGLE authoritative manifest of what SHOULD be running.
# OPS1 sub-step 2 (G-L2), docs/design/OPERATIONAL_LAYER_DESIGN.md §2.1.
#
# This is the sole source of truth for the intended process set. Everything else DERIVES
# from it — there is no second list to drift:
#   - health_check.EXPECTED_PANES  = process_reconciler.health_checked_map()  (state==enabled)
#   - start_worker.sh's launch set = process_reconciler.startlist()           (owner==start_worker.sh, state in enabled|dark)
# The prior scattered declarations (start_worker's hardcoded _start_session block and
# health_check's hand-maintained EXPECTED_PANES) are DELETED — they had silently drifted
# (naive-organ was missing from the health check entirely).
#
# state (the disease-curing field — distinguishes intended-down from failed):
#   enabled  — MUST run. Absent => MISSING (fault). Health-checked.
#   held     — intentionally down now. Absent => HELD (silent). Running => HELD_VIOLATED (fault).
#   dark     — present but a no-op unless its flag; exits when dark. Absent => OK. Running => DARK_ACTIVE (report).
#   retired  — must never run. Running => RETIRED_RUNNING (fault).
# EVERY non-enabled entry MUST carry `reason` and `flip` (loader-enforced) — a state without
# its reason is archaeology in three weeks; the reason is behaviour-determining (IaC).
#
# Runtime state (which processes are actually up) is NOT in git. The DECLARATION is;
# process_reconciler.py reconciles the two and REPORTS drift. It has no kill path by
# construction (reaping-by-inference killed the director's console in the blackout).
#
# Fields: session · command (full launch) · match (ps token) · owner · state [· reason · flip · purpose]
version: 2

# `launched_by` (owner==systemd entries): which mechanism ACTUALLY launches the daemon NOW,
# during the staged one-at-a-time tmux→systemd migration (director-ruled 2026-07-17). Absent =>
# 'tmux' (start_worker.sh still launches it; the pre-migration default). 'systemd' => MIGRATED
# (its unit is installed+started; it has LEFT start_worker's tmux launch set — never two
# launchers). Each daemon's cutover flips this field + its state in ONE atomic change, so the
# manifest never lies about what is running or how. When the last flips to systemd, start_worker's
# tmux-launch is empty and retired.
processes:
  # ── MIGRATED (OPS1 sub-step 4 release, worker-seat first — director-gated 2026-07-17): live
  #    under systemd, verified seeding-by-id + idle + console-untouched before this flip ──
  - session: worker-seat-manager
    command: python3 background/worker_seat.py
    match: worker_seat.py
    owner: systemd
    launched_by: systemd   # MIGRATED 2026-07-17 → out of start_worker's tmux set (never two launchers)
    state: enabled
    log_silence: >-
      MUTE BY CONSTRUCTION, established 2026-09-22 against live pid 2359727 (up 106h, not one
      journal line of its own). `background/worker_seat.py` contains ZERO `print()` calls and
      opens no log file — it has no write-out path at all, so there is no cadence at which it
      could ever speak. This is a FOURTH cause beside the three the lane-0 item named
      (wrong-path / wedged / nothing-to-say): a daemon with nothing to write WITH. It is not
      wedged — `/proc/2359727/wchan` reads `hrtimer_nanosleep`, its ordinary CHECK_INTERVAL sleep.
      REMEDY, deliberately not taken in the same turn as the reading: a heartbeat line is a real
      behaviour change to the daemon that seeds the worker seat, and it deserves its own evidence
      rather than arriving as a side-effect of fixing an instrument.
    purpose: "Thin worker-seat manager: seed-by-id + keep-alive + report status ONLY (no reap, no auto-advance) — the one bespoke process, itself a systemd unit. Migrated live 2026-07-17: verified seeding by dedicated --session-id (not a console latch), worker idle/holding, reaper retired, console untouched."

  - session: claude   # the worker seat's tmux session name is `claude`
    command: "claude --dangerously-skip-permissions --model claude-opus-4-8 (dedicated session 22080be5)"
    match: __worker_seat__   # sentinel: detect via the `claude` tmux session only (NOT a systemd unit)
    owner: worker-seat-manager
    state: enabled
    purpose: "The interactive worker seat, seeded by worker-seat-manager against the dedicated WORKER_SESSION_ID (never `claude -c`). Live 2026-07-17; seat liveness is worker-seat-manager's keep-alive job."

  - session: supervisor
    command: python3 background/supervisor.py
    match: supervisor.py
    owner: systemd
    launched_by: systemd   # MIGRATED 2026-07-17 (serial-autonomy go-live) → out of start_worker's tmux set
    state: enabled
    log_silence: >-
      WRONG PATH, AND THE STDOUT HALF IS DISCARDED UNFLUSHED — cause established 2026-09-22 and
      shared with `deadmans-switch`, `staging-watcher` and `naive-organ` below, which is why each
      names it rather than one of them carrying a class verdict. Its real log is
      `docs/observability/supervisor-log.md`, 380,766 lines and written 2 minutes before this
      reading. `supervisor.log()` appends the file and then `print()`s; `background/supervisor.py`
      passes `flush=True` nowhere, and under systemd stdout is a socket, so Python block-buffers
      at 8 KiB. THE SECOND HALF IS WHAT MAKES IT PERMANENT: `background/deploy_restart.py`
      restarts this unit on every landing that touches its module — measured here at a ~10-minute
      cycle ("Consumed 1min 23s CPU over 10min 25s wall") — and the SIGTERM that ends a run does
      NOT flush the buffer. Controlled directly, not inferred: an unflushed `print()` in a
      systemd-run unit produced no journal line while alive and none after `systemctl stop`; the
      same file with `sys.stdout.reconfigure(line_buffering=True)` reached the journal in under a
      second. So a few lines per 10-minute run can never reach 8 KiB and are lost at every
      restart. Not wedged, and not a fresh start either: A FRESH START IS WHAT THIS LOOKS LIKE
      FOREVER, because the restart clock resets the age faster than any cadence could fill it.
    purpose: "Escalation watchdog over the pull-loop transport (G-L4-as-mapped: find_work is the sole DRAW authority; the Stop hook delivers; this daemon polls every 2min and escalates stuck/map-exhausted, ZERO pane writes / ZERO turn delivery). Migrated live 2026-07-17 as step 3 of the serial-autonomy go-live."

  - session: deadmans-switch
    command: python3 background/deadmans_switch.py
    match: deadmans_switch.py
    owner: systemd
    launched_by: systemd   # MIGRATED 2026-07-17 (serial-autonomy go-live, LAST gate) → out of start_worker's tmux set
    state: enabled
    log_silence: >-
      WRONG PATH + UNFLUSHED STDOUT, the same mechanism established on `supervisor` above and
      controlled there; the per-daemon evidence is what differs. Its real log is
      `docs/observability/deadmans-switch-log.md`, 41,389 lines, written 3 minutes before this
      reading on 2026-09-22 — so the daemon that exists to notice a stall is itself working and
      merely inaudible to the journal. `deadmans_switch.py:199` is its single unflushed `print()`;
      one line per 10-minute run against an 8 KiB buffer that SIGTERM discards. ITS OWN FAILURE
      MODE IS THE REASON THIS ROW MATTERS MOST: a stall alarm that cannot speak on the channel the
      brief reads is the one daemon whose muteness would be indistinguishable from the thing it
      watches for, and `mute` is now the only reading here that could tell them apart.
    purpose: "Independent stall alarm — liveness = the MEANINGFUL git commit clock ALONE (never max'd with observability mtimes; the fail-silent fix). BLOCKED at 45min of no meaningful commit + queued work, STALL at 90min, transition-only + hourly re-escalate. Migrated live 2026-07-17 against a fresh commit clock, completing the autonomy layer's tmux→systemd migration (all three: worker-seat + supervisor + deadmans)."

  # ── DARK: present as a daemon but a no-op unless its flag; director-gated ──
  - session: executor-daemon
    command: python3 background/executor_daemon.py
    match: executor_daemon.py
    owner: systemd
    state: dark
    reason: "director gate — headless build loop; a bare launch is a safe no-op (exits) unless docs/observability/.build_executor_enabled is present"
    flip: "un-dark ONLY by explicit director instruction, never inferred and never automatic — the director's alone"
    purpose: "Self-continuing headless build loop (dark)"

  # ── RETIRED: must never run ──
  - session: autonomous-runner
    command: python3 background/autonomous_runner.py
    match: autonomous_runner.py
    owner: (none — launcher commented out in start_worker.sh)
    state: retired
    reason: "superseded by the Stop-hook pull-loop + executor stack; its _start_session line is commented out in start_worker.sh"
    flip: "does not flip — retired; reviving would require a fresh director decision, not a restart"
    purpose: "RETIRED legacy autonomous loop"

  # ── ENABLED: base infrastructure, must always run ──
  - session: background-worker
    command: python3 background/background_worker.py
    match: background_worker.py
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED (unit installed+enabled+ACTIVE); flip made 2026-08-09 by the
                           # publish-wedge investigation. Same half-done cutover as staging-watcher /
                           # ntfy-responder above, which were closed at the INSTANCE on 2026-07-29 and
                           # left this row un-flipped: two launchers declared, AND excluded from
                           # _systemd_owned_sessions() so boot-SHA drift could never see it stale.
    log_silence: >-
      INTERMITTENTLY AUDIBLE, and it is the only row here observed in BOTH states — which is why
      it gets its own cause instead of joining the four above. Same mechanism (its `log()` appends
      `docs/observability/background-worker-log.md` then `print()`s unflushed, against the ~10-min
      `deploy_restart` cycle), but unlike its siblings this daemon is sometimes VERBOSE enough to
      push past Python's 8 KiB stdout buffer before the SIGTERM, and then its own lines do land.
      Directly observed on 2026-09-22 seven minutes apart, one restart between: at 17:40 it read
      NOT mute, its own MainPID 1767967 having written two `[process_run] Publish ...` lines; at
      17:47, after a restart, it read MUTE with nothing but systemd's line. SO ITS `mute` READING
      IS TRUE BUT NOT STABLE, and that is the useful thing to know about it: a run of this daemon
      appearing in the actionable list is evidence about THAT RUN'S verbosity, never about the
      daemon's health, and it should not be chased the way a permanently-mute row should.
    purpose: "Qwen task queue + leftover run_complete-marker sweep; off-peak"

  - session: staging-watcher
    command: python3 background/staging_watcher.py
    match: staging_watcher.py
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED 2026-07-29 → out of start_worker's tmux set. The unit
                           # was installed+enabled+ACTIVE while this flip was never made, so BOTH
                           # launchers ran it (tmux 419018 + systemd 3081438) and one staged-file
                           # doorbell fired twice. Sibling half of the ntfy-responder defect below.
    purpose: "NTFY on new docs/staging/ files"

  - session: ntfy-responder
    command: python3 background/ntfy_responder.py
    match: ntfy_responder.py
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED 2026-07-29 → out of start_worker's tmux set. Half-done
                           # cutover (unit installed+enabled+ACTIVE, this flip never made) left TWO
                           # launchers -- systemd PID 266098 + tmux PID 419021 -- so ONE director NTFY
                           # became TWO queued instructions (DIRECTOR_RULING_FIX_DOUBLE_MESSAGING).
    log_silence: >-
      NOT MUTE AND NEVER WAS — it writes to a path the journal reader does not watch.
      Established 2026-09-22 against live pid 2358733: its real log is
      `docs/observability/ntfy-responder-log.md`, which took ~1,300 lines over the same 106h in
      which its own stdout produced EXACTLY ZERO journal lines (counted by `_SYSTEMD_USER_UNIT`
      over the whole unit journal). `log()` writes the file and then `print()`s; only the file
      write arrives. WHY THE STDOUT HALF NEVER LANDS IS NOT ESTABLISHED — block-buffering is the
      obvious candidate and the volume argues against it, so it is left named and open rather
      than asserted. The daemon is healthy: watermark `background/.ntfy_responder_since.json`
      advances every poll, and a live round-trip probe on 2026-09-22 (published id V2usjzrPOqir,
      polled straight back down) proves the inbound NTFY path reaches this machine.
      The director's silence since 2026-09-05 is therefore SILENCE, not a dropped channel.
    purpose: "Acks inbound NTFY, writes to staging/"

  - session: dispatcher
    command: python3 background/dispatcher.py
    match: dispatcher.py
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED (unit installed+enabled+ACTIVE); flip made 2026-08-09 by the
                           # publish-wedge investigation. Same half-done cutover as staging-watcher /
                           # ntfy-responder above, which were closed at the INSTANCE on 2026-07-29 and
                           # left this row un-flipped: two launchers declared, AND excluded from
                           # _systemd_owned_sessions() so boot-SHA drift could never see it stale.
    log_silence: >-
      GENUINELY NOTHING TO LOG, and the same wrong-path half as `ntfy-responder` underneath it.
      Established 2026-09-22 against live pid 2358571: `dispatcher.log()` writes
      `docs/observability/dispatcher-log.md`, whose newest line is its own "Dispatcher started"
      at 2026-09-17 09:27 UTC. It logs ONLY when it classifies a `from_rich_*.md`, and no such
      file has been staged since 2026-09-05 — `ls docs/staging/from_rich_*.md` is empty — so
      there has been nothing to classify. Not wedged: `/proc/2358571/wchan` reads
      `hrtimer_nanosleep`, its POLL_INTERVAL sleep. This row is the one a class verdict would
      have been most wrong about: identical journal symptom to `ntfy-responder`, opposite cause.
    purpose: "Classifies from_rich_*.md URGENT/NORMAL/FYI"

  - session: discovery-daemon
    command: python3 background/discovery_agent.py --daemon
    match: discovery_agent.py
    owner: (none — systemd unit stopped + disabled 2026-08-10)
    state: retired
    reason: >-
      RETIRED by director instruction 2026-08-13 ("decide the discovery daemon — restart or
      formally retire it, no third state"). It had been in exactly that third state since
      2026-08-10: this row said `enabled` while the unit was stopped and disabled, so the
      reconciler reported MISSING every cycle against a daemon nobody intended to run.
      TWO independent reasons, either sufficient.
      (1) IT COULD NOT FIRE. `_assess_assumption()` initialises `verdict = "ok"` and only
      overrides it if Qwen returns a parseable answer, so an absent model, a timeout, a
      JSON error or ANY exception scores the assumption OK — R15's FAIL-OPEN killer
      pattern exactly. 106 cycles from 2026-06-19 to 2026-08-10 returned "0 warnings, 0
      critical" without a single exception, on 10 of 176 assumptions. Those verdicts are
      not evidence the assumptions are sound; they are consistent with a control that
      cannot report anything else. It also still uses the `/no_think` suffix that
      PROJECT_OVERVIEW.md §Phase-6 records as unreliable on this server (the fix, the
      explicit `think: false` parameter, was applied to internal_audit.py and never here).
      (2) ITS MODEL IS DELIBERATELY GONE. Its only path is `_call_qwen`; the director's
      2026-08-10 MEMORY_CLEANSE evicted qwen3:14b to reclaim 5.1GB on a 16GB box that was
      already 3.8GB into swap. Restarting means reloading a 5.5GB model 6-hourly to run a
      check that cannot fail.
      RESIDUAL GAP, NAMED NOT PAPERED OVER: nothing now re-validates ASSUMPTIONS.md on a
      schedule. That gap is not new — it has been open since 2026-06-19, because a
      fail-open checker never closed it. Recorded as a finding rather than left implied:
      docs/staging/WORKER_FINDING_THE_DISCOVERY_DAEMONS_VERDICT_COULD_ONLY_EVER_BE_OK_2026-08-13.md
    flip: >-
      Reviving needs BOTH repairs first, not a restart: make the verdict FAIL-CLOSED on an
      unavailable model (an unavailable check is a FAILED check, R15), and adopt the
      explicit `think: false` parameter. Until then a restart would re-arm a control that
      reports OK when it has learned nothing.
    purpose: "RETIRED — 6-hourly Qwen assumption validator; verdict path was fail-open"

  - session: sim-runner
    command: python3 background/sim_runner.py
    match: sim_runner.py
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED (unit installed+enabled+ACTIVE); flip made 2026-08-09 by the
                           # publish-wedge investigation. Same half-done cutover as staging-watcher /
