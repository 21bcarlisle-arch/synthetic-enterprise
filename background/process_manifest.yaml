  # ── RETIRED: page-comment authority path decommissioned (director ruling 2026-07-24) ──
  - session: director-comments
    command: python3 background/director_comments.py
    match: director_comments.py
    owner: (none — daemon retired; no systemd unit generated, launcher removed)
    state: retired
    reason: "DIRECTOR RULING (DIRECTOR_RULING_RETIRE_PAGE_COMMENT_CHANNEL_2026-07-24.md): the PIN-authenticated page-comment channel is decommissioned as a director-authority path, permanently — a web form staging content as the director's voice was the weakest link and ran unnoticed for a week (DIRECTOR_SECURITY_COMMENT_CHANNEL_INCIDENT_2026-07-24.md). The intake/poll/staging code is deleted (director_comments.py is now a safe-no-op tombstone); the widget is removed from every served page. Retirement is the EXPECTED state — so the reconciler must never report this MISSING, and a `retired`+running observation alarms RETIRED_RUNNING (a self-healing reconciler can never resurrect a retired authority path)."
    flip: "does not flip — retired permanently. Reviving the authority path is a fresh director decision, never a restart. If page comments ever return, they return in a clearly non-authority namespace as unauthenticated suggestions (ruling point 4) — a different module, never this one."
    purpose: "RETIRED page-comment authority channel (safe no-op)"

  - session: naive-organ
    command: python3 -m background.naive_organ daemon
    match: background.naive_organ   # the argv TOKEN, not the module's stem: `_runs_daemon` asks
                                    # for basename-equality against some argument, and this daemon
                                    # is launched `-m background.naive_organ`, so the bare stem
                                    # `naive_organ` could never match anything. It read as harmless
                                    # while the only consumer counted daemons to SUBTRACT them; it
                                    # stops being harmless the moment absence is reported, because
                                    # a permanently-absent healthy daemon is a control crying wolf.
                                    # Sibling row `token-proxy` already carries the `-m` form.
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED (unit installed+enabled+ACTIVE); flip made 2026-08-09 by the
                           # publish-wedge investigation. Same half-done cutover as staging-watcher /
                           # ntfy-responder above, which were closed at the INSTANCE on 2026-07-29 and
                           # left this row un-flipped: two launchers declared, AND excluded from
                           # _systemd_owned_sessions() so boot-SHA drift could never see it stale.
    log_silence: >-
      WRONG PATH + UNFLUSHED STDOUT, the mechanism established and controlled on `supervisor`
      above. Its real log is `docs/observability/naive_organ_log.jsonl` — 20,511 lines, written 8
      minutes before this reading on 2026-09-22 — and it is the one of the four that writes JSONL
      rather than markdown, so nothing that tails the `-log.md` family sees it either. Eight
      unflushed `print()` calls in `background/naive_organ.py`, none with `flush=True`, against
      the same ~10-minute restart cycle. NOT A CANDIDATE FOR THE `staging-watcher` REPAIR without
      thinking first: this daemon is the outside-view skeptic, its output is judgement rather than
      trace, and routing that to the journal would put a second copy of its verdicts somewhere
      with no retention policy. The file is the right home; the fix here is that this row now
      TELLS the brief so, which is all the brief needed.
    purpose: "Independent outside-view skeptic on its own timer (was MISSING from the old EXPECTED_PANES)"

  - session: token-proxy
    command: python3 -m background.token_proxy
    match: background.token_proxy
    owner: systemd
    state: enabled
    launched_by: systemd   # CUTOVER COMPLETED (unit installed+enabled+ACTIVE); flip made 2026-08-09 by the
                           # publish-wedge investigation. Same half-done cutover as staging-watcher /
                           # ntfy-responder above, which were closed at the INSTANCE on 2026-07-29 and
                           # left this row un-flipped: two launchers declared, AND excluded from
                           # _systemd_owned_sessions() so boot-SHA drift could never see it stale.
    log_silence: >-
      QUIET, NOT MUTE — and quiet because nothing uses it. Established 2026-09-22 against live
      pid 1192: it DID speak, at +0.2s into its run, and it is the only daemon here whose own
      line reached the journal at all, because lines 311-312 of `background/token_proxy.py` are
      the only `print()`s in the four that pass `flush=True`. Nothing since, for 151h, because it
      logs per PROXIED API CALL and nothing routes through it: `ANTHROPIC_BASE_URL` is unset for
      every `claude` process on this box, and `docs/observability/token-usage-log.jsonl` was last
      written 2026-06-25. Not wedged — `/proc/1192/wchan` reads `do_sys_poll`, a listening socket
      waiting for a connection that never comes.
      OPEN QUESTION, filed not answered: a proxy nothing is configured to use is a daemon earning
      nothing, and whether it should be `held` rather than `enabled` is a director-facing call
      about a declared process, not a tidy-up to make inside a reading.
    purpose: "Local token-usage proxy"

  # NOTE: file-api is NOT here — it is a systemd-owned service (director-access
  # infrastructure, must survive reboot independent of the stack), declared in
