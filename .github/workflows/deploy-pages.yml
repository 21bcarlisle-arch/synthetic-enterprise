name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/PROJECT_STATE.md
  # A fix to the deploy itself touches no site/** path, so without this the site stays on the
  # failed push's predecessor until the next publish (b1c3e4832). A dispatch has no
  # `event.before`, so the served-bytes check asserts only HEAD's own site/ diff -- verify by hand.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Full history: the post-deploy assertion diffs this push against its base to work
      # out which files a reader should now be getting. A shallow clone has no base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy site/ to Cloudflare Pages
        # Staged without any file over Pages' 25 MiB limit, which refuses the WHOLE upload
        # (run 38474007478: one 57.7 MiB ledger held every page on a week-old snapshot).
        # Each file left out is printed as a ::warning:: -- see PAGES_MAX_FILE_BYTES.
        run: |
          python3 tools/assert_deployed_bytes_are_served.py --stage _pages_deploy
          npx wrangler pages deploy _pages_deploy --project-name=poesys-net --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Assert the deployed commit is what a reader gets
        # REPLACES the zone cache purge, deleted 2026-08-20. Three measured reasons, in
        # order of weight:
        #
        # 1. IT HAD NEVER WORKED, NOT ONCE. `secrets.CLOUDFLARE_ZONE_ID` is empty, so the
        #    URL was `/zones//purge_cache` and Cloudflare answered code 7003 on every
        #    deploy since the step was written. It printed `Purge FAILED` and exited 0 --
        #    the FAIL-OPEN shape R15 names -- so the whole publish path reported success
        #    while purging nothing. Nothing depended on it, because it never did anything.
        # 2. IT CANNOT FIX THE ONE THING IT WAS AIMED AT. Run by hand with working
        #    credentials on 2026-08-20, `purge_everything` returned `success: true` twice
        #    and the eight ghost pages kept serving, `age` climbing straight through both
        #    purges. Those objects are held by Pages' own asset cache for the custom
        #    domain; a ZONE purge does not reach it, and eight deployments did not evict
        #    it either.
        # 3. ITS ORIGINAL JOB IS DONE BY `site/_headers` NOW. The 2026-07-11 stale
        #    `/data/dashboard.json` incident is covered by `no-cache, must-revalidate` on
        #    `/data/*.json`, `/state/*`, `/shadow/*`, `/`, `/*.html` and `/*/`.
        #
        # What replaces it is a control that CAN fail for the right reason: fetch the
        # front door as a reader and assert the commit just deployed is the one being
        # served. `?cb=` is mandatory -- without it this check can be answered by a
        # cached copy, and a freshness check that a stale copy can satisfy is theatre.
        # The assertion is "the NEW content is present", which is the only direction that
        # survives a cache: a copy stored in the past cannot contain this commit's sha.
        run: python3 tools/assert_deployed_bytes_are_served.py
        env:
          DEPLOY_BASE_REF: ${{ github.event.before }}
