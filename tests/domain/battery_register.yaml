# `text` fields; they are parsed from the scope briefs so the register
# cannot drift from the purchased judgement. Author dispositions in the
# builder, then re-run it.
briefs:
  - ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
  - ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
  - ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
  - ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
  - ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
  - ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
  - ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
  - ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
entries:
  - id: CARB-1
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "1"
    text: "A single annual emissions factor rather than half-hourly intensity."
    disposition: pending_capability
    reason: "No carbon-intensity series is consumed anywhere in the tree; the NESO half-hourly intensity feed is not ingested. Blocker: a carbon-intensity adapter behind the wall."
  - id: CARB-2
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "2"
    text: "Applying a further loss correction to a series already loss-corrected."
    disposition: pending_capability
    reason: "Depends on CARB-1: with no intensity series there is no loss-correction step to double-apply."
  - id: CARB-3
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "3"
    text: "Regional intensity presented as measured rather than modelled."
    disposition: pending_capability
    reason: "Depends on CARB-1; additionally needs a regional (14 DNO) intensity surface, which does not exist."
  - id: CARB-4
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "4"
    text: "Forecast and outturn used interchangeably."
    disposition: pending_capability
    reason: "Depends on CARB-1. The forecast/outturn distinction is exactly the kind of clock discipline R14 already enforces for money, so this becomes checkable the moment an intensity feed lands."
  - id: CARB-5
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "5"
    text: "Time-shifting credited with reducing consumption, or the two summed without distinction."
    disposition: pending_capability
    reason: "No time-shifting/flex-benefit accounting surface exists to confuse with consumption reduction."
  - id: CARB-6
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "6"
    text: "Abatement claimed at holdout-grade confidence without a holdout."
    disposition: pending_capability
    reason: "No abatement claim is produced, so there is nothing to demand a holdout of."
  - id: CARB-7
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "7"
    text: "No rebound effect."
    disposition: pending_capability
    reason: "No efficiency-measure model, therefore no rebound to omit."
  - id: CARB-8
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "8"
    text: "Discounting counted as abatement."
    disposition: pending_capability
    reason: "Depends on CARB-6: no abatement accounting exists."
  - id: CARB-9
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "9"
    text: "£/tonne without a comparator, or used as a target."
    disposition: not_mechanisable
    reason: "Half of this line is R12 policy, not an invariant: 'used as a target' is a statement about intent behind a number, which no assertion can read. The other half (a published GBP/tonne figure must carry a comparator) is a live obligation on any future carbon surface and is recorded in the delta report so it cannot be lost."
  - id: CARB-10
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "10"
    text: "Gas modelled as time-varying carbon."
    disposition: pending_capability
    reason: "Gas carbon content is not modelled at all, so it cannot yet be wrongly modelled as time-varying. Becomes a one-line invariant once a gas emissions factor exists."
  - id: CARB-11
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "11"
    text: "Any carbon figure published without basis, sample size and counterfactual."
    disposition: pending_capability
    reason: "Generalises R14 (no financial figure without its clock) to carbon figures. No carbon figure is published today; the basis-labels gate in generate_dashboard_data.py is the natural host when one is."
  - id: CARB-12
    brief: ADVISOR_SCOPE_BRIEF_CARBON_2026-08-04.md
    label: "12"
    text: "Embodied carbon in measures ignored while operational savings are counted."
    disposition: pending_capability
    reason: "Depends on CARB-6/CARB-7: no measures model, so no embodied/operational asymmetry to catch."
  - id: CFD-1
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "1"
    text: "One price series, so the day-ahead floor and migrated negatives cannot both exist."
    disposition: pending_capability
    reason: "Requires a day-ahead series distinct from the settlement series. See ELEC-2 -- one price series is the shared blocker."
  - id: CFD-2
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "2"
    text: "CfD treated as a flat per-kWh levy that cannot go negative."
    disposition: pending_capability
    reason: "get_cfd_levy_per_mwh returns a non-negative per-MWh rate by construction. Making it capable of going negative is a model change, not a test; the check lands with that change."
  - id: CFD-3
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "3"
    text: "No distinction between round 1–3 and round 4+ negative-price rules."
    disposition: pending_capability
    reason: "No allocation-round dimension exists on any CfD object, so rounds 1-3 and 4+ cannot be distinguished."
  - id: CFD-4
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "4"
    text: "Intermittent and baseload reference prices treated identically."
    disposition: pending_capability
    reason: "Only one CfD reference price exists; the intermittent/baseload split is unmodelled."
  - id: CFD-5
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "5"
    text: "Contracted plant always generating regardless of contract economics."
    disposition: pending_capability
    reason: "No contracted-plant dispatch model. Depends on the asset-level build."
  - id: CFD-6
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "6"
    text: "Wind as national average rather than assets at locations."
    disposition: pending_capability
    reason: "Wind is national in the current generation stack. Duplicate of ELEC-6 from the CfD side -- both close together or neither does."
  - id: CFD-7
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "7"
    text: "No spatial correlation between wind sites."
    disposition: pending_capability
    reason: "Depends on CFD-6: no per-site wind, so no inter-site correlation structure to assert."
  - id: CFD-8
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "8"
    text: "Consumer price assumed to track wholesale as the contracted share grows."
    disposition: pending_capability
    reason: "Requires a contracted-share time series to test the pass-through relationship against."
  - id: CFD-9
    brief: ADVISOR_SCOPE_BRIEF_CFD_AND_ASSETS_2026-08-04.md
    label: "9"
    text: "Thermal modelled per unit — over-modelling, the mirror error."
    disposition: not_mechanisable
    reason: "An anti-over-modelling line. 'Too detailed' has no failing state a test can name -- any threshold would be invented, and a control whose criterion is invented is worse than none (R15). Kept as a design-review lens in the delta report."
  - id: COT-B1
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B1"
    text: "No contractless energy: every settled kWh at every MPAN maps to a liable counterparty (named occupier, deemed occupier, or void/landlord) for every day — an orphan-supply day disqualifies."
    disposition: pending_capability
    reason: "No void/deemed-occupier ledger exists, so an orphan-supply day cannot yet be detected or excluded. Strongest candidate in this brief -- it is a population invariant over data the settlement layer already holds."
  - id: COT-B2
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B2"
    text: "Debt stays with the person: engineer a CoT over an indebted account — the incoming account opens clean; any balance transfer to the new occupier disqualifies (legacy-PPM meter debt excepted only if explicitly modelled or registered as a simplification)."
    disposition: pending_capability
    reason: "CoT does not open a distinct incoming account, so there is no balance-transfer boundary to assert across."
  - id: COT-B3
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B3"
    text: "The boundary read is shared: outgoing closing read == incoming opening read, always; a discrepancy between the two sides of the same moment disqualifies."
    disposition: pending_capability
    reason: "Depends on COT-B2: with one account there is no outgoing/incoming read pair."
  - id: COT-B4
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B4"
    text: "Closed credit resolves: a closed account's credit refunds, traces, or carries a dated reason within the anniversary invariant — closed-account credit sitting silently past it disqualifies."
    disposition: pending_capability
    reason: "The anniversary invariant on credit balances exists for live accounts; the closed-account arm is not wired. Nearest working analogue: company/compliance credit-balance controls (R4)."
  - id: COT-B5
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B5"
    text: "Voids bill the right class: void-period standing charge accrues to the void/landlord ledger; booking it to the departed customer, the future customer, or nowhere all disqualify."
    disposition: pending_capability
    reason: "Depends on COT-B1: no void ledger to bill the standing charge to."
  - id: COT-B6
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B6"
    text: "Dates resolve by evidence: a disputed move-in date resolves through the evidence hierarchy and re-anchors the back-billing window per person; assertion-wins disqualifies."
    disposition: pending_capability
    reason: "Back-billing windows exist and are tested; the move-in evidence hierarchy that would re-anchor them per person does not."
  - id: COT-B7
    brief: ADVISOR_SCOPE_BRIEF_CHANGE_OF_TENANCY_2026-08-07.md
    label: "B7"
    text: "The stream is alive: across a decade replay, CoT events occur at census-plausible rates with seasonality, and discovery latency is a distribution, not zero."
    disposition: pending_capability
    reason: "A population/rate check over a decade replay. Depends on COT events existing as a stream at all."
  - id: ELEC-1
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "1"
    text: "No product ladder: shapes, horizons and liquidity absent."
    disposition: pending_capability
    reason: "Products exist as prices, not as a ladder of tradeable instruments with horizons and sizes. Depends on the wholesale value-chain build."
  - id: ELEC-2
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "2"
    text: "Prices treated as a single series with no distinction between forward, day-ahead, within-day and imbalance."
    disposition: pending_capability
    reason: "The tree carries settlement and forward series but no distinct day-ahead or within-day series. This single gap blocks CFD-1 and ELEC-11 too -- the highest-leverage line in this brief."
  - id: ELEC-3
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "3"
    text: "Renewables modelled as lowering the price directly rather than by displacing the marginal unit."
    disposition: pending_capability
    reason: "The merit-order reconstruction (sim/merit_order_reconstruction.py, W1_6b) is the mechanism that would make this checkable -- assert that raising wind changes WHICH unit is marginal rather than subtracting from price. Wiring that assertion is a real next atom, not a missing capability."
  - id: ELEC-4
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "4"
    text: "No negative prices."
    disposition: mechanised
    check: "tests.domain.test_battery_checks::test_elec_4_negative_prices_are_reachable"
  - id: ELEC-5
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "5"
    text: "Scarcity treated as a large draw from the ordinary distribution rather than a different regime."
    disposition: pending_capability
    reason: "Scarcity is not a separate regime in the price generator; bimodal_generator models two regimes but neither is a scarcity tail."
  - id: ELEC-6
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "6"
    text: "Wind modelled as national average rather than weighted to turbine locations."
    disposition: pending_capability
    reason: "Wind is a national figure. Capacity-weighting to turbine locations is an unbuilt world capability (see W1_7)."
  - id: ELEC-7
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "7"
    text: "Interconnectors and French nuclear absent."
    disposition: pending_capability
    reason: "No interconnector or French nuclear availability input exists in the price formation path."
  - id: ELEC-8
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "8"
    text: "Carbon missing from marginal cost."
    disposition: pending_capability
    reason: "Carbon is present as a levy on bills but not as a term in marginal cost. Depends on the merit-order path (ELEC-3)."
  - id: ELEC-9
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "9"
    text: "No account of liquidity — everything tradeable at any horizon, no spread cost."
    disposition: pending_capability
    reason: "No liquidity or bid-offer spread model; every product is implicitly tradeable in any size. Depends on ELEC-1."
  - id: ELEC-10
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "10"
    text: "One regime for the whole decade."
    disposition: pending_capability
    reason: "Regime structure exists in the scenario substrate (SPINE_1) but is not asserted against the decade. Candidate for a population check once regimes are labelled on the replay."
  - id: ELEC-11
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "11"
    text: "Imbalance price treated as knowable before delivery."
    disposition: pending_capability
    reason: "The Point-in-Time Blindfold already forbids reading future data generally, and that IS enforced. What is not enforced is the specific claim that the imbalance price for period P is unavailable until after P closes, because no distinct imbalance series exists (ELEC-2)."
  - id: ELEC-12
    brief: ADVISOR_SCOPE_BRIEF_ELECTRICITY_2026-08-04.md
    label: "12"
    text: "Gas treated as a correlated series rather than the thing that sets the marginal cost."
    disposition: pending_capability
    reason: "Same line as GAS-1 from the electricity side. The merit-order reconstruction makes gas causal rather than correlated; asserting it is the ELEC-3 wiring job."
  - id: GAS-1
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "1"
    text: "Gas treated as a correlated series alongside power rather than the thing setting power's marginal cost."
    disposition: pending_capability
    reason: "Duplicate of ELEC-12. Closes with the merit-order assertion (ELEC-3)."
  - id: GAS-2
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "2"
    text: "No storage, or storage as a fixed schedule rather than an economic decision."
    disposition: pending_capability
    reason: "No gas storage model of any kind."
  - id: GAS-3
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "3"
    text: "The summer–winter spread as an input rather than an emergent result — and incapable of inverting."
    disposition: pending_capability
    reason: "The summer-winter spread is not produced as an emergent quantity, so its capacity to invert cannot be tested. Depends on GAS-2."
  - id: GAS-4
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "4"
    text: "No linepack, so no within-day flexibility."
    disposition: pending_capability
    reason: "No linepack model, so no within-day gas flexibility."
  - id: GAS-5
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "5"
    text: "LNG absent, or present without global competition for cargoes."
    disposition: pending_capability
    reason: "No LNG cargo model exists, so there is neither LNG supply nor the global cargo competition that sets its availability to GB."
  - id: GAS-6
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "6"
    text: "Cash-out modelled as a penalty rather than at marginal system prices."
    disposition: pending_capability
    reason: "Gas cash-out is not modelled; company/market/gas_nominations.py prices imbalance off a spot reference rather than marginal system prices."
  - id: GAS-7
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "7"
    text: "The gas day starting at midnight."
    disposition: pending_capability
    reason: "No gas-day start hour exists anywhere in the tree -- company/market/gas_nomination_register.py carries a bare `gas_day: date` with no 05:00 boundary. The check is trivial ONCE the constant exists; asserting it now would assert nothing, which is the fail-open shape this register refuses."
  - id: GAS-8
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "8"
    text: "Therms and kilowatt-hours confused, or the conversion assumed."
    disposition: mechanised
    check: "tests.domain.test_battery_checks::test_gas_8_therm_conversion_is_single_and_published"
  - id: GAS-9
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "9"
    text: "Only one direction of gas–power coupling."
    disposition: pending_capability
    reason: "Only gas-to-power coupling is modelled; the power-to-gas direction (gas burn responding to power demand) is absent."
  - id: GAS-10
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "10"
    text: "No interconnector reversal — flows fixed in one direction."
    disposition: pending_capability
    reason: "No gas interconnector flow model, so reversal cannot be represented."
  - id: GAS-11
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "11"
    text: "One regime across the decade."
    disposition: pending_capability
    reason: "Duplicate of ELEC-10 for gas."
  - id: GAS-12
    brief: ADVISOR_SCOPE_BRIEF_GAS_2026-08-04.md
    label: "12"
    text: "Domestic production static across ten years."
    disposition: pending_capability
    reason: "UKCS domestic production is not a modelled series."
  - id: IND-1
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "1"
    text: "Any adapter that cannot fail, delay or return an error."
    disposition: pending_capability
    reason: "Typed adapters exist (W4_1) and some model failure, but there is no register of adapters against which 'every adapter can fail, delay or error' could be asserted as a CLASS. A per-adapter spot check would be an instance fix and R10 forbids closing a class that way. The adapter register is the real prerequisite."
  - id: IND-2
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "2"
    text: "The company reading anything not delivered through an adapter."
    disposition: pending_capability
    reason: "This is the Point-in-Time Blindfold itself, which IS enforced by the epistemic verifier and the .claude/rules path hooks. Recorded as pending rather than mechanised because the existing enforcement is a review-time and import-time guard, not a battery check, and claiming it here would double-count an existing control as new coverage."
  - id: IND-3
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "3"
    text: "Settlement modelled as a single figure rather than successive runs that move."
    disposition: pending_capability
    reason: "Settlement runs exist as a timetable (W3_2) but the company does not hold successive restating figures per period. Closely related to NCS-B6."
  - id: IND-4
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "4"
    text: "Switching without objections, refusals or erroneous transfers."
    disposition: pending_capability
    reason: "Switching has no objection/refusal/erroneous-transfer paths."
  - id: IND-5
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "5"
    text: "Meter data that always arrives for every customer."
    disposition: pending_capability
    reason: "Meter data gaps exist in the world model; what is missing is the standing assertion that a non-zero fraction of customers are missing reads in any period."
  - id: IND-6
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "6"
    text: "Payments treated as certain at the point of billing."
    disposition: pending_capability
    reason: "Payment uncertainty is modelled (the D lane) but not asserted at the billing boundary."
  - id: IND-7
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "7"
    text: "Network and policy costs absent or modelled as a flat national number."
    disposition: pending_capability
    reason: "Network and policy costs are present and time-varying (simulation/policy_costs.py), and are NOT flat-national for DUoS. The line is half-satisfied; the assertion that would prove it is NCS-B2, so it closes there rather than being claimed twice."
  - id: IND-8
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "8"
    text: "No pre-switch enquiry limit — the company knowing things about prospects it could not know."
    disposition: pending_capability
    reason: "No pre-switch enquiry limit is modelled, so the company's knowledge of prospects is unbounded by industry process."
  - id: IND-9
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "9"
    text: "Obligations and scheme costs missing."
    disposition: pending_capability
    reason: "Obligations and scheme costs are present (obligations_register, policy_costs). Same double-count reasoning as IND-7: the coverage assertion belongs to NCS-B1."
  - id: IND-10
    brief: ADVISOR_SCOPE_BRIEF_INDUSTRY_BOUNDARY_2026-08-04.md
    label: "10"
    text: "Adapters coupled to simulation internals rather than to a typed contract."
    disposition: pending_capability
    reason: "The typed-adapter seam is the design (W4_1) and the epistemic verifier polices it at review time. A structural guard that no adapter imports a sim internal is a genuine next atom -- the child_stderr_guard/segment_case_guard source-scan idiom applies directly."
  - id: NCS-B1
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B1"
    text: "Build-up reconciles: for any MPAN/period, the non-commodity build-up sums to the cap-annex allowance for that period within materiality, or every divergence carries a named driver."
    disposition: pending_capability
    reason: "The build-up exists but is never reconciled to a cap-annex allowance; the annex figures are not held as data. Blocker: the cap annex as a machine-readable anchor."
  - id: NCS-B2
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B2"
    text: "Wrong-decade signals: if shifting a customer's evening peak changes their TNUoS or BSUoS cost, DISQUALIFIED (~post-reform both are shape-invariant for domestic)."
    disposition: pending_capability
    reason: "Domestic TNUoS/BSUoS shape-invariance is the right post-reform behaviour and is probably true of the code, but there is no per-customer peak-shifting lever to perturb, so the test cannot be written as a real perturbation. Writing it as an assertion over constants would be a tautology (R15)."
  - id: NCS-B3
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B3"
    text: "Fuel purity: a gas bill carrying RO, CfD, CM, or AAHEDC is disqualified; an electricity bill carrying GGL likewise."
    disposition: mechanised
    check: "tests.domain.test_battery_checks::test_ncs_b3_fuel_purity_of_the_levy_stack"
  - id: NCS-B4
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B4"
    text: "Losses as volume: settled kWh = metered × LLF × TLM; losses appearing as a p/kWh price line instead is disqualified."
    disposition: pending_capability
    reason: "LLF/TLM do not appear in the tree; settled volume is not built as metered x LLF x TLM."
  - id: NCS-B5
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B5"
    text: "Provenance: every constant traces to a published artefact (CDCM sheet version, ILR notice, cap annex cell) — an untraceable constant is invented physics."
    disposition: pending_capability
    reason: "Many constants carry provenance comments (policy_costs.py is good about this) but there is no machine-readable provenance field, so 'every constant traces' cannot be asserted -- only spot-checked. A provenance schema on the constant tables is the prerequisite."
  - id: NCS-B6
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B6"
    text: "Three clocks: a settlement rerun that restates volumes must restate DUoS/CfD/CM charges through the billed/settled/banked discipline — a stack that never true-ups is disqualified."
    disposition: pending_capability
    reason: "R14's billed/settled/banked discipline is live for money; extending it to a settlement rerun restating DUoS/CfD/CM needs the successive-runs capability from IND-3."
  - id: NCS-B7
    brief: ADVISOR_SCOPE_BRIEF_NONCOMMODITY_COST_STACK_2026-08-07.md
    label: "B7"
    text: "Mutualisation: the model can book an RO mutualisation surcharge in a supplier-failure year replay; if the mechanism cannot exist, the 2021–22 cost physics cannot be reproduced."
    disposition: pending_capability
    reason: "get_mutualization_levy_per_mwh exists, so the mechanism is not absent. What is missing is the supplier-failure-year replay that would exercise it, so the battery's actual claim (the 2021-22 cost physics reproduce) cannot be checked."
  - id: PPM-B1
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B1"
    text: "Self-disconnection is observable: the company can count and date self-disconnections per account from its own data; a book where nobody ever self-disconnects, or where it happens invisibly, is disqualified."
    disposition: pending_capability
    reason: "Prepayment appears in tariff and cap logic but there is no self-disconnection event in the model, so it can be neither counted nor dated."
  - id: PPM-B2
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B2"
    text: "The calendar holds: engineer a zero balance at Friday 18:00 — supply continuing through the protected window, cutting only at its close, or the window physics is fake."
    disposition: pending_capability
    reason: "Depends on PPM-B1; additionally needs the protected-window calendar (working_days.py is the nearest working analogue and already handles calendar rules)."
  - id: PPM-B3
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B3"
    text: "Debt grows in the dark: a self-disconnected month still accrues standing charge into debt; a model where disconnection freezes the account is disqualified."
    disposition: pending_capability
    reason: "Depends on PPM-B1: with no self-disconnection event there is no dark period during which standing charge could accrue into debt."
  - id: PPM-B4
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B4"
    text: "Recovery is capped: meter debt recovery never exceeds the weekly cap regardless of balance; emergency credit repays first per the priority order."
    disposition: pending_capability
    reason: "No meter debt recovery model or weekly cap; emergency credit is unmodelled."
  - id: PPM-B5
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B5"
    text: "Vend idempotency: replaying a vend file changes nothing; a duplicated UTRN crediting twice is disqualified."
    disposition: pending_capability
    reason: "No vend file or UTRN exists. Note this is an idempotency line and C-S2 already makes idempotency a standing design constraint -- when vends land they inherit that discipline."
  - id: PPM-B6
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B6"
    text: "The gate blocks: a PSR-flagged vulnerable account rejects an involuntary mode-switch and LOGS the rejection; silent success or silent failure both disqualify."
    disposition: pending_capability
    reason: "PSR flags exist on customers; involuntary mode-switch does not, so there is no act for the gate to block or log."
  - id: PPM-B7
    brief: ADVISOR_SCOPE_BRIEF_PREPAYMENT_ESTATE_2026-08-07.md
    label: "B7"
    text: "Era-true books: cap variant, levelisation date, and estate technology mix all match the simulated year; a 2021 PPM customer on levelised rates is disqualified."
    disposition: pending_capability
    reason: "Cap variant by payment method exists in the cap tables; the estate technology mix and levelisation date do not, so era-truth cannot be asserted as a whole."
