<text x="326" y="68" font-size="14" font-weight="700" fill="#16181D">Typed interfaces</text>
<text x="326" y="86" font-size="12" fill="#40444C">Each flow crosses through one typed</text>
<text x="326" y="102" font-size="12" fill="#40444C">interface; nothing else reaches in.</text>
