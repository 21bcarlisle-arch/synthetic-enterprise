<text x="54" y="336" font-size="14" font-weight="700" fill="#16181D">Complaints and settlement</text>
<text x="54" y="354" font-size="12" fill="#40444C">Replies and complaints as homes send</text>
<text x="54" y="370" font-size="12" fill="#40444C">them; settlement, months late.</text>
<rect x="54" y="376" width="46" height="18" fill="#D6F2E0"/>
