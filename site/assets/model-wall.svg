<text x="54" y="194" font-size="14" font-weight="700" fill="#16181D">Meter reads and payments</text>
<text x="54" y="212" font-size="12" fill="#40444C">What a supplier observes of a home:</text>
<text x="54" y="228" font-size="12" fill="#40444C">its reads, and whether it paid.</text>
