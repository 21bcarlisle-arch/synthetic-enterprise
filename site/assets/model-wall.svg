<text x="326" y="336" font-size="14" font-weight="700" fill="#16181D">Discovery through behaviour</text>
<text x="326" y="354" font-size="12" fill="#40444C">What a home is must be inferred from</text>
<text x="326" y="370" font-size="12" fill="#40444C">what it does, never read off it.</text>
<rect x="326" y="376" width="46" height="18" fill="#D6F2E0"/>
<text x="334" y="389" font-size="10" font-weight="700" letter-spacing="0.6" fill="#16181D">LIVE</text>
<rect x="40" y="438" width="800" height="90" rx="8" fill="#FFFFFF" stroke="#C9C9C3"/>
<text x="54" y="462" font-size="14" font-weight="700" fill="#16181D">No route to the real world</text>
<text x="54" y="480" font-size="12" fill="#40444C">The company’s code may not open a network connection, directly or through anything it calls. Data fetched</text>
<text x="54" y="496" font-size="12" fill="#40444C">from outside becomes documentation and knowledge, never something the company reads at run time.</text>
<rect x="54" y="502" width="46" height="18" fill="#D6F2E0"/>
<text x="62" y="515" font-size="10" font-weight="700" letter-spacing="0.6" fill="#16181D">LIVE</text>
