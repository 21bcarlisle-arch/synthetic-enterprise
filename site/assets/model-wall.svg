<text x="598" y="194" font-size="14" font-weight="700" fill="#16181D">Offers and messages</text>
<text x="598" y="212" font-size="12" fill="#40444C">Renewals, prices and contact: the</text>
<text x="598" y="228" font-size="12" fill="#40444C">only way it touches a home.</text>
