<text x="281" y="605" font-size="11.5" text-anchor="middle" fill="#FAFAF8">discovery through behaviour</text>
<text x="64" y="632" font-size="12" font-style="italic" fill="#B9BCC2">Forecast error is the wall on the future; discovery through behaviour is the wall on the customer.</text>
