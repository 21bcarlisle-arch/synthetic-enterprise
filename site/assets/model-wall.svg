<text x="326" y="194" font-size="14" font-weight="700" fill="#16181D">Ground truth stays behind</text>
<text x="326" y="212" font-size="12" fill="#40444C">The world’s own state never crosses;</text>
<text x="326" y="228" font-size="12" fill="#40444C">a verifier refuses company code</text>
