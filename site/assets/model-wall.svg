<text x="598" y="68" font-size="14" font-weight="700" fill="#16181D">Bills</text>
<text x="598" y="86" font-size="12" fill="#40444C">What it charges each home, on</text>
<text x="598" y="102" font-size="12" fill="#40444C">three clocks: billed, settled, banked.</text>
