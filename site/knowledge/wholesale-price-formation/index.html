<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poesys -- How GB wholesale electricity prices are formed</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../brand/brand.css">
<style>
/* Brand palette consumed from ../../brand/brand.css (BRAG tokens, no raw hex). */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
.site-nav { background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; height: 48px; gap: 8px; flex-wrap: wrap; }
.nav-logo { font-weight: 700; color: var(--teal); text-decoration: none; margin-right: 16px; font-size: 15px; }
.nav-link { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
.nav-link:hover, .nav-link.active { color: var(--text); background: var(--surface2); }
.wrap { max-width: 1060px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: 1fr 260px; gap: 32px; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.hero-h { font-size: 27px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 8px; }
.hero-sub { font-size: 14px; color: var(--muted); max-width: 720px; margin-bottom: 16px; }
.oneline { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--teal);
  border-radius: 10px; padding: 16px 18px; font-size: 15px; line-height: 1.65; margin-bottom: 10px; }
.stale { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); margin-bottom: 12px; margin-top: 40px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 14px; }
.card p { margin-bottom: 12px; }
.card p:last-child { margin-bottom: 0; }
.muted { color: var(--muted); font-size: 12px; }
.evlink { color: var(--blue); text-decoration: none; border-bottom: 1px dashed var(--border); font-size: 13px; }
.evlink:hover { border-bottom-color: var(--blue); }
.figrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.figrow:last-child { border-bottom: none; }
.figlab { font-size: 13px; }
.figval { font-family: ui-monospace, monospace; font-weight: 700; font-size: 14px; }
.figcite { font-size: 11px; color: var(--muted); }
.badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .03em; border-radius: 4px; padding: 2px 6px; vertical-align: middle; }
.badge.Fact { color: var(--green); border: 1px solid var(--green); }
.badge.Choice { color: var(--amber); border: 1px solid var(--amber); }
.badge.Wiring { color: var(--blue); border: 1px solid var(--blue); }
.badge.stamp { color: var(--muted); border: 1px solid var(--border); }
.rev-old { text-decoration: line-through; color: var(--muted); }
.rev-new { color: var(--text); font-weight: 600; }
.clocks { font-size: 12px; color: var(--muted); margin-top: 8px; }
.side .card { padding: 14px 16px; }
.side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
.topiclink { display: block; padding: 8px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
.topiclink:last-child { border-bottom: none; }
.topiclink .t { font-size: 13px; font-weight: 600; }
.topiclink .e { font-size: 11px; color: var(--muted); }
.edgetype { font-size: 10px; color: var(--teal); font-family: ui-monospace, monospace; }
.fic { font-size: 11px; color: var(--muted); margin-top: 28px; border-top: 1px solid var(--border); padding-top: 12px; }
.deriv { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chartwrap { margin: 8px 0 14px; }
.chart-cap { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.pchart { display: block; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
.chart-src { font-size: 10px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-logo" href="../../">Poesys</a>
  <a class="nav-link" href="../../company/">Company</a>
  <a class="nav-link" href="../../world/">World</a>
  <a class="nav-link active" href="./">Knowledge</a>
  <a class="nav-link" href="../../proof/">Proof</a>
  <a class="nav-link" href="../../glossary/">Glossary</a>
</nav>
<div class="wrap">
  <main>
    <div id="hero-h" class="hero-h">&nbsp;</div>
    <div id="hero-sub" class="hero-sub"></div>
    <div id="stale" class="stale"></div>
    <div id="hero-one" class="oneline"></div>

    <div class="sec" id="s-plain-h">In plain terms</div>
    <div id="r-plain" class="card"></div>

    <div class="sec" id="s-theory-h">How it works</div>
    <div id="r-theory" class="card"></div>

    <div class="sec" id="s-expected-h">What the data should look like</div>
    <div id="r-expected" class="card"></div>

    <div class="sec" id="s-live-h">Live evidence</div>
    <div id="r-live" class="card"></div>

    <div class="sec" id="s-residuals-h">Where our picture is still weak</div>
    <div id="r-residuals" class="card"></div>

    <div class="sec" id="s-rev-h">A claim we changed our mind about</div>
    <div id="revision" class="card"></div>

    <div id="wall-note" class="fic"></div>
  </main>
  <aside class="side">
    <div class="card">
      <h3>Related topics</h3>
      <div id="sidebar"></div>
    </div>
    <div class="card">
      <h3>This page</h3>
      <div id="derivation" class="deriv"></div>
    </div>
  </aside>
</div>
<script>
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function set(id,html){ var e=document.getElementById(id); if(e) e.innerHTML=html; }
function badge(cls){ return '<span class="badge '+esc(cls)+'">'+esc(cls)+'</span>'; }

function renderHead(d){
  var m=d.meta;
  set("hero-h", esc(m.title));
  set("hero-sub", esc(m.subtitle));
  set("hero-one", esc(m.one_line));
  var df=m.data_freshness, cf=m.claim_freshness;
  set("stale",
    '<span class="badge stamp">Data: '+esc(df.as_of)+' ('+esc(df.cadence)+')</span>'+
    '<span class="badge stamp">Claims verified: '+esc(cf.last_verified)+'</span>'+
    '<span class="badge stamp">Change class: '+esc(m.rate_of_change_class)+'</span>');
  set("wall-note", esc(m.wall_placement)+' &nbsp;&middot;&nbsp; A simulated GB energy supplier, shown working against real market history.');
  set("derivation", '<b>'+esc(String(m.derivation.assembled_pct))+'%</b> assembled or derived from existing material. '+esc(m.derivation.note));
}

function renderPlain(d){
  var r=d.rungs.plain;
  document.getElementById("s-plain-h").textContent=r.heading;
  set("r-plain", r.body.map(function(p){return "<p>"+esc(p)+"</p>";}).join(""));
}

function renderTheory(d){
  var r=d.rungs.theory;
  document.getElementById("s-theory-h").textContent=r.heading;
  var figs=r.figures.map(function(f){
    return '<div class="figrow"><span class="figlab">'+esc(f.label)+' '+badge(f.class)+
      '<br><span class="figcite">'+esc(f.citation)+'</span></span>'+
      '<span class="figval">'+esc(f.value)+'<br><span class="figcite">'+esc(f.unit)+'</span></span></div>';
  }).join("");
  set("r-theory", "<p>"+esc(r.intro)+"</p>"+figs+"<p class='muted' style='margin-top:12px'>"+esc(r.worked)+"</p>");
}

function renderExpected(d){
  var r=d.rungs.expected_shape;
  document.getElementById("s-expected-h").textContent=r.heading;
  var bands=r.bands.map(function(b){
    return '<div class="figrow"><span class="figlab">'+esc(b.label)+' '+badge(b.class)+'</span>'+
      '<span class="figcite" style="max-width:60%;text-align:right">'+esc(b.shape)+'</span></div>';
  }).join("");
  set("r-expected", "<p>"+esc(r.intro)+"</p>"+bands);
}

// Inline price-series chart, rendered from the pipeline data (never a static image).
// SVG polyline over the real Elexon SSP monthly series; y-axis in GBP/MWh.
function priceSeriesSvg(ps){
  var pts=ps.points, n=pts.length;
  if(!n) return "";
  var W=680, H=200, PADL=40, PADR=12, PADT=12, PADB=24;
  var lo=Math.min.apply(null, pts.map(function(p){return p.v;}));
  var hi=Math.max.apply(null, pts.map(function(p){return p.v;}));
  var yhi=Math.ceil(hi/50)*50, ylo=0;
  function x(i){ return PADL + (W-PADL-PADR) * (n<=1?0:(i/(n-1))); }
  function y(v){ return PADT + (H-PADT-PADB) * (1 - (v-ylo)/(yhi-ylo)); }
  var line=pts.map(function(p,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1); }).join(" ");
  // y gridlines/labels at 0, mid, top
  var ticks=[ylo, yhi/2, yhi], grid="";
  ticks.forEach(function(t){
    var yy=y(t).toFixed(1);
    grid+='<line x1="'+PADL+'" y1="'+yy+'" x2="'+(W-PADR)+'" y2="'+yy+'" stroke="var(--border)" stroke-width="1"/>'+
      '<text x="'+(PADL-6)+'" y="'+(y(t)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--muted)">'+Math.round(t)+'</text>';
  });
  // x labels: first, peak, last
  var peakI=0; pts.forEach(function(p,i){ if(p.v===hi) peakI=i; });
  var xl="";
  [[0,pts[0].t],[peakI,pts[peakI].t],[n-1,pts[n-1].t]].forEach(function(a){
    xl+='<text x="'+x(a[0]).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+esc(a[1])+'</text>';
  });
  return '<svg class="pchart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" '+
    'aria-label="Monthly-mean GB wholesale price, GBP per MWh, '+esc(ps.span)+'">'+
    grid+
    '<circle cx="'+x(peakI).toFixed(1)+'" cy="'+y(hi).toFixed(1)+'" r="3" fill="var(--amber)"/>'+
    '<text x="'+x(peakI).toFixed(1)+'" y="'+(y(hi)-6).toFixed(1)+'" text-anchor="middle" font-size="9" fill="var(--amber)">'+Math.round(hi)+'</text>'+
    '<path d="'+line+'" fill="none" stroke="var(--teal)" stroke-width="1.5"/>'+
    xl+
    '</svg>';
}

function renderLive(d){
  var r=d.rungs.live_evidence;
  document.getElementById("s-live-h").textContent=r.heading;
  var ps=r.price_series;
  var chart="";
  if(ps && ps.points && ps.points.length){
    chart='<div class="chartwrap"><div class="chart-cap">'+esc(ps.caption)+'</div>'+
      priceSeriesSvg(ps)+
      '<div class="chart-src">'+esc(ps.unit)+' &middot; source: '+esc(ps.source)+' &middot; as of '+esc(ps.as_of)+'</div></div>';
  }
  set("r-live", "<p>"+esc(r.intro)+"</p>"+chart+
    '<p><a class="evlink" href="'+esc(r.chart_link.href)+'">'+esc(r.chart_link.label)+'</a></p>'+
    '<p class="muted">'+esc(r.note)+"</p>");
}

function renderResiduals(d){
  var r=d.rungs.residuals;
  document.getElementById("s-residuals-h").textContent=r.heading;
  var items=r.items.map(function(it){
    return "<p>"+badge(it.class)+" "+esc(it.text)+"</p>";
  }).join("");
  set("r-residuals", "<p>"+esc(r.intro)+"</p>"+items);
}

function renderRevision(d){
  var r=d.revision;
  document.getElementById("s-rev-h").textContent=r.heading;
  set("revision", "<p>"+esc(r.intro)+"</p>"+
    '<p><span class="rev-old">'+esc(r.old_claim)+'</span><br>'+
    '<span class="rev-new">'+esc(r.new_claim)+'</span></p>'+
    '<p class="muted">'+esc(r.reason)+' <a class="evlink" href="'+esc(r.evidence_href)+'">evidence &rarr;</a></p>'+
    '<div class="clocks">Valid time: '+esc(r.valid_time)+' &nbsp;&middot;&nbsp; Recorded: '+esc(r.transaction_time)+'</div>');
}

// Sidebar is GENERATED from the typed edges, never hand-authored.
function neighboursFromEdges(d){
  var topic=d.meta.topic_id;
  var byId={}; d.topics.forEach(function(t){ byId[t.id]=t; });
  var seen={}, out=[];
  d.edges.forEach(function(e){
    var other=null, rel=null;
    if(e.from===topic){ other=e.to; rel=e.type; }
    else if(e.to===topic){ other=e.from; rel=e.type; }
    if(other && !seen[other]){ seen[other]=1; out.push({id:other, rel:rel, topic:byId[other]}); }
  });
  return out;
}
function renderSidebar(d){
  var ns=neighboursFromEdges(d);
  set("sidebar", ns.map(function(n){
    var t=n.topic||{title:n.id, blurb:""};
    return '<a class="topiclink" href="../'+esc(n.id)+'/"><span class="edgetype">'+esc(n.rel)+
      '</span><span class="t">'+esc(t.title)+'</span><span class="e">'+esc(t.blurb||"")+'</span></a>';
  }).join(""));
}

function renderKnowledge(d){
  renderHead(d); renderPlain(d); renderTheory(d); renderExpected(d);
  renderLive(d); renderResiduals(d); renderRevision(d); renderSidebar(d);
}

if (typeof window !== "undefined" && window.document && document.getElementById("hero-h")) {
  fetch("../../data/knowledge_wholesale.json?t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ renderKnowledge(d); })
    .catch(function(e){ set("hero-h", "Wholesale price formation"); });
}
</script>
</body>
</html>
