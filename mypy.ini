# mypy.ini — deliberately PERMISSIVE type-check floor for Synthetic Enterprise.
#
# PURPOSE
# -------
# This config exists to establish a *floor*, not to run a purity crusade. Before
# it there was no type checker at all in the repo. The static-quality ratchet in
# tests/architecture/test_static_quality_ratchet.py freezes a dated,
# shrink-only baseline of the mypy errors that exist today (per module) and
# fails only on NEW type errors or a module regressing past its frozen count.
# A permissive config keeps that floor achievable without first rewriting the
# codebase's annotations.
#
# Intentionally NO strict flags. `ignore_missing_imports = True` so a missing
# third-party stub is never counted as a type error (the point is the code's own
# type health, not the ecosystem's stub coverage). Upgrading mypy invalidates
# the frozen baseline — re-freeze in the same PR as the version bump (see the
# ratchet test's determinism note).
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
# The scope dirs are a mix of packages (company/ has __init__.py) and namespace
# dirs (saas/, sim/, ... do not). Without these two flags mypy discovers a file
# like saas/churn_model.py under TWO module names ("churn_model" and
# "saas.churn_model") and aborts with "Source file found twice". Anchoring the
# package base at the repo root (the cwd the ratchet runs mypy from) gives every
# file a single canonical dotted name.
namespace_packages = True
explicit_package_bases = True
# import-untyped fires when a third-party library is importable but ships no
# type stubs. That is ecosystem stub coverage, not this code's own type health,
# and which types-* packages happen to be installed would otherwise leak into
# the baseline counts. Silence it so the baseline is a function of the code and
# the pinned mypy version alone (ignore_missing_imports covers import-not-found;
# this covers the found-but-unstubbed case).
disable_error_code = import-untyped
# Keep output stable and parseable for the ratchet: absolute error codes on,
# no pretty/colour, no error summary line folded into the per-error stream.
show_error_codes = True
show_column_numbers = False
color_output = False
error_summary = False
warn_unused_configs = False
# company/trading/emir_reporting_register.py contains a Python-3.12-only f-string
# (quote reuse) that is a hard SYNTAX error under python_version = 3.11. mypy
# treats a blocking syntax error as fatal and aborts the ENTIRE run after the
# first one, which would make a per-module baseline impossible to build. The
# ruff ratchet already tracks this exact defect as its single `invalid-syntax`
# entry, so excluding the file here removes nothing from coverage that the other
# ratchet isn't already holding. Remove this exclusion once the f-string is fixed.
exclude = (?x)(^company/trading/emir_reporting_register\.py$)
# No strict flags on purpose — this is a floor. Do not add disallow_untyped_*,
# strict_optional overrides, or --strict here without re-freezing the baseline.
#
# REPRODUCIBILITY NOTE (read with the ratchet test's determinism docstring):
# mypy's per-module error count depends on whether a third-party library is
# installed WITH type information (numpy/pandas ship py.typed): an installed,
# typed library makes mypy type-check every expression and annotation that
# touches it, surfacing errors that vanish when the library is absent. So the
# baseline must not be a function of the ambient dependency set. The ratchet
# (tests/architecture/test_static_quality_ratchet.py) runs mypy with
# `--no-site-packages`, mypy's purpose-built flag: it stops mypy discovering
# installed PEP 561 packages, so EVERY third-party import resolves as missing
# -> `Any` (via ignore_missing_imports) whatever the ambient env has installed,
# while typeshed's stdlib stubs (bundled inside mypy) and first-party source are
# unaffected. The baseline is therefore a function of (our code + the pinned
# mypy version + this config) ALONE, and holds identically with or without
# numpy/pandas installed. Reproduce the exact baseline by hand with:
#
#   mypy --config-file mypy.ini --no-site-packages \
#       company saas sim simulation background tools
