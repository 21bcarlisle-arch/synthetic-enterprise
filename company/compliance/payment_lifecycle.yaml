# The supplier-side payment lifecycle of one domestic account on fixed direct debit, declared as data.
#
# Drawn 16 Nov 2026 from the rules and published practice ONLY (the payments-and-direct-debit knowledge
# page, section "The payment lifecycle, stage by stage"), BEFORE any past DD finding was opened for the
# replay the director's 16 Nov ruling asks for. Closed world: a move not listed here is illegal, and a
# condition the account can be in that no state names is undefined. Nothing reads this file yet; whether
# anything should is the replay's question
# (docs/staging/records/SEAT_PREREG_WOULD_A_DECLARED_PAYMENT_LIFECYCLE_HAVE_EXPOSED_THE_PAST_DD_DEFECTS_2026-11-16.md).
#
# obligation: true means a rule REQUIRES the move (or its timing); false means it is permitted practice.
# source keys resolve in `sources` at the foot.

states:
  contracted: "signed, supply not yet started; Direct Debit Instruction (DDI) lodged via AUDDIS"
  mandate_rejected: "AUDDIS returned the DDI (codes 5, B, F, G, L); no DD exists"
  on_supply_dd: "supplying; mandate live; one fixed regular monthly amount on a notified date"
  collection_due: "a collection is submitted to Bacs for the notified amount on the notified date"
  collection_returned: "ARUDD returned the collection on or about its processing day; the instalment is missed"
  dd_review: "the supplier re-sizes the fixed amount from the best and most current information"
  off_dd: "supplying, no live mandate (payer cancelled via ADDACS, or the supplier stopped it); pays on receipt"
  in_arrears: "supplying; a debit is owed and past due"
  repayment_arrangement: "supplying; an affordable arrangement for the arrears is in place"
  loss_pending: "the household has agreed supply elsewhere; transfer in the objection window"
  supply_ended: "supply has ended (switch away or move out); no further regular collection"
  final_billed: "the final bill to the last day supplied has been issued"
  closed_settled: "final balance zero: credit refunded or debit collected"
  closed_in_debt: "final balance owed and not collected; a debt, not a DD"

# Invariants every state must hold. A run that breaks one is outside the diagram.
invariants:
  - id: one_regular_amount
    text: "while a mandate is live, the regular collection is ONE fixed monthly amount; no stub, pro-rated or half-period instalment exists"
    source: [slc_27_15, bacs_cycle]
  - id: no_collection_without_supply_or_balance
    text: "no collection is taken before supply starts, and after supply ends only a one-off residual covering a balance the account's credit does not cover"
    source: [practice_final_dd, gap_first_collection_date]
  - id: amount_and_date_as_notified
    text: "every collection is for the amount and on the date notified in advance; a change needs fresh advance notice"
    source: [dd_guarantee, bacs_advance_notice]
  - id: collection_has_two_outcomes
    text: "a collection is taken on its processing day or returned through ARUDD; a DD is never paid late"
    source: [bacs_cycle, arudd]
  - id: one_balance
    text: "the account has one balance, stated on every bill as what is owed to or by the household; a credit exists only net of what is owed"
    source: [slc_31h_12, slc_27_16]
  - id: collections_on_processing_days
    text: "collections fall on Bacs processing days (not weekends or bank holidays)"
    source: [bacs_cycle]

moves:
  - {id: lodge_mandate,      from: contracted,     to: contracted,       trigger: "sign-up with DD chosen", obligation: false, source: [auddis]}
  - {id: mandate_refused,    from: contracted,     to: mandate_rejected, trigger: "AUDDIS rejection code", obligation: false, source: [auddis]}
  - {id: first_dd_set,       from: contracted,     to: on_supply_dd,     trigger: "supply start date reached with mandate accepted; amount from the consumption the supplier reasonably estimates; first date at least the advance-notice period after notice, and not before supply start", obligation: true, source: [slc_27_15, bacs_advance_notice, gap_first_collection_date]}
  - {id: rejected_to_receipt, from: mandate_rejected, to: off_dd,        trigger: "supply starts with no mandate", obligation: false, source: [auddis]}
  - {id: collect,            from: on_supply_dd,   to: collection_due,   trigger: "notified collection date", obligation: false, source: [bacs_cycle]}
  - {id: collected,          from: collection_due, to: on_supply_dd,     trigger: "no ARUDD by the end of the return window", obligation: false, source: [bacs_cycle]}
  - {id: returned,           from: collection_due, to: collection_returned, trigger: "ARUDD code", obligation: false, source: [arudd]}
  - {id: re_present,         from: collection_returned, to: collection_due, trigger: "ARUDD 0 re-presented within one month of the original processing day", obligation: false, source: [arudd]}
  - {id: return_to_arrears,  from: collection_returned, to: in_arrears,  trigger: "missed instalment not made good and the balance is a debit past due", obligation: false, source: [arudd, slc_27_8]}
  - {id: return_absorbed,    from: collection_returned, to: on_supply_dd, trigger: "missed instalment made good, or balance still in credit", obligation: false, source: [slc_31h_12]}
  - {id: supplier_stops_dd,  from: collection_returned, to: off_dd,      trigger: "supplier's own stop rule after repeated returns (e.g. second consecutive failure)", obligation: false, source: [practice_stop_dd]}
  - {id: payer_cancels,      from: on_supply_dd,   to: off_dd,           trigger: "ADDACS 0/1/2/3/B/C", obligation: false, source: [addacs]}
  - {id: bill,               from: on_supply_dd,   to: on_supply_dd,     trigger: "billing period end; bill states the one balance; back-billing bar on charges older than 12 months the supplier caused", obligation: true, source: [slc_31h_12, slc_21ba]}
  - {id: review_due,         from: on_supply_dd,   to: dd_review,        trigger: "new information (actual read, price change, annual review, customer request, a credit balance, a rise beyond tolerance)", obligation: true, source: [slc_27_15, ofgem_dd_review_2023]}
  - {id: review_set,         from: dd_review,      to: on_supply_dd,     trigger: "new fixed amount from best and most current information, sized from the supplier's own bills and reads, notified in advance; a credit balance lowers it or is refunded", obligation: true, source: [slc_27_15, ofgem_dd_review_2023, dd_guarantee, practice_review_from_own_bills]}
  - {id: refund_on_request,  from: on_supply_dd,   to: on_supply_dd,     trigger: "customer asks for the credit back; timely, unless fair and reasonable not to, with reasons", obligation: true, source: [slc_27_16]}
  - {id: indemnity_claim,    from: on_supply_dd,   to: on_supply_dd,     trigger: "payer's bank refunds a collection under the Guarantee (DDICA); the amount is re-owed", obligation: true, source: [dd_guarantee]}
  - {id: arrears_arrangement, from: in_arrears,    to: repayment_arrangement, trigger: "arrangement offered and accepted, based on ability to pay, before escalation", obligation: true, source: [slc_27_8]}
  - {id: arrears_cleared,    from: in_arrears,     to: on_supply_dd,     trigger: "arrears paid with mandate live", obligation: false, source: [slc_31h_12]}
  - {id: arrears_off_dd,     from: in_arrears,     to: off_dd,           trigger: "mandate ended while in arrears", obligation: false, source: [practice_stop_dd]}
  - {id: arrangement_kept,   from: repayment_arrangement, to: on_supply_dd, trigger: "arrears repaid", obligation: false, source: [slc_27_8]}
  - {id: arrangement_broken, from: repayment_arrangement, to: in_arrears, trigger: "instalment not received within 10 working days of its date", obligation: false, source: [sor_failed_instalment]}
  - {id: re_mandate,         from: off_dd,         to: on_supply_dd,     trigger: "new DDI accepted; new amount and advance notice", obligation: false, source: [auddis, slc_27_15, bacs_advance_notice]}
  - {id: off_dd_arrears,     from: off_dd,         to: in_arrears,       trigger: "a pay-on-receipt bill unpaid past due", obligation: false, source: [slc_27_8]}
  - {id: loss_notified,      from: [on_supply_dd, off_dd, in_arrears, repayment_arrangement], to: loss_pending, trigger: "gaining supplier's transfer request", obligation: false, source: [slc_14_4]}
  - {id: debt_objection,     from: loss_pending,   to: in_arrears,       trigger: "supplier objects on the debt ground; only while a debit is owed past due", obligation: false, source: [slc_14_4]}
  - {id: transfer_completes, from: loss_pending,   to: supply_ended,     trigger: "transfer date; regular collections stop; no DD review", obligation: false, source: [practice_final_dd]}
  - {id: move_out,           from: [on_supply_dd, off_dd, in_arrears, repayment_arrangement], to: supply_ended, trigger: "household moves out with a final read", obligation: false, source: [practice_final_dd]}
  - {id: final_bill,         from: supply_ended,   to: final_billed,     trigger: "bill to the last day supplied; take all reasonable steps to send within 6 weeks", obligation: true, source: [slc_27_17]}
  - {id: final_refund,       from: final_billed,   to: closed_settled,   trigger: "credit refunded within 10 working days of the final bill", obligation: true, source: [gsop_final_refund]}
  - {id: final_residual_dd,  from: final_billed,   to: closed_settled,   trigger: "one-off collection of a residual debit the credit does not cover, mandate still live", obligation: false, source: [practice_final_dd]}
  - {id: final_debt,         from: final_billed,   to: closed_in_debt,   trigger: "final debit not paid", obligation: false, source: [practice_final_dd]}

sources:
  slc_27_15: "SLC 27.15 (consolidated to 1 Aug 2025; absolute since 21 Oct 2022) — fixed DD amount from best and most current information"
  slc_27_16: "SLC 27.16 — Credit defined net of what is owed; refund on request 'in a timely manner'; no day count (GAP)"
  slc_27_17: "SLC 27.17 — 'all reasonable steps' to send a final bill within 6 weeks"
  slc_27_8: "SLC 27.8 — repayment by ability to pay, offered before escalating"
  slc_31h_12: "SLC 31H.12(a),(c) — the bill states what is owed to or by the household"
  slc_21ba: "SLC 21BA — back-billing limit (docs/domain_artefact_library/regulatory/slc_21b_21ba_reads_and_back_billing.md)"
  slc_14_4: "SLC 14.4 — the losing supplier's objection grounds, including debt"
  ofgem_dd_review_2023: "Ofgem, DD market compliance review progress update (2 Feb 2023) — reviews after a rise beyond tolerance; credit lowers the DD"
  dd_guarantee: "the Direct Debit Guarantee — advance notice of amount and date; immediate refund for an error; DDICA recovery"
  bacs_advance_notice: "Bacs default 10 working days' advance notice, reducible by agreement"
  bacs_cycle: "Bacs three-day cycle; collections on processing days; returns by about day 4"
  auddis: "AUDDIS response codes, ~3 working days after the DDI"
  addacs: "ADDACS amendment and cancellation codes"
  arudd: "ARUDD return codes; ARUDD 0 may be re-presented within one month"
  sor_failed_instalment: "Ofgem Social Obligations Reporting — an instalment not received within 10 working days of its date has failed"
  gsop_final_refund: "Guaranteed Standards of Performance, from 2019, via Which? (secondary; Ofgem's page refused with 403) — final-bill credit refunded within 10 working days"
  practice_stop_dd: "supplier practice (British Gas help page, read 3 Oct 2026) — DD cancelled after a second failure"
  practice_final_dd: "supplier practice and strong logic — no DD review at a final bill; a last collection only for a residual (a_supplier_does_not_review_the_direct_debit_at_an_accounts_final_bill_2026-10-13.md)"
  practice_review_from_own_bills: "a supplier sizes the annual review from its own issued bills and reads, not true consumption (a_suppliers_annual_dd_review_is_sized_from_its_own_issued_bills_not_true_consumption_2026-10-13.md)"
  gap_first_collection_date: "GAP — no published rule found that a first collection may not precede supply start; carried as practice (a DD pays for energy supplied) and a stated belief"
